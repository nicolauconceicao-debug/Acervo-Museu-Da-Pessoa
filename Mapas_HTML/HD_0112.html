 Janeiro e São Paulo durante a sua infância e adolescência. Em experiências profundas com o cinema se formou na área e logo começou a atuar, sua vida deu uma grande reviravolta quando encontrou com a espiritualidade que transformou a sua forma de enxergar a vida e a atuar sobre ela que culminou no filme \"Espaço Além- Marina Abramovich\" uma intersecção entre espiritualidade e cinema\nSinopse:\nEm uma entrevista que integrou o processo da realização do filme \" Pessoas-Contar Para Viver\" Marco Del Fiol um dos diretores do filme revela através da sua vida como a realidade e a ficção podem fazer uma fusão. Em um ambiente de classe média e estruturado, Marco é arrebatado pelas imagens desde a infância até encontrar no Vale do Amanhecer um Sol onde preto velhos, constelações familiares trazem revelações profundas e surpreendentes sobre a sua existência, o seu amor, trazendo cenas tão profundas que poderiam até estar em um dos seus filmes.\nEdição de texto: A vida em uma imagem\nUma vez eu ía sair com o meu pai e saí com os sapatos trocados, quando eu voltei e minha mãe parou pra ver ela reparou que meu pé e"}, "folder_size_gb": 0.0}, "Audiovisual": {"Áudio": {"PCSH_HV674_pt3.mp3": {"size_mb": 23.7919, "modified": "2020-07-09 07:48:30", "extension": "MP3", "full_path": "D:\\FILME PESSOAS\\PCSH_HV674_Marco Aurélio Pinho Del Fiol\\Audiovisual\\Áudio\\PCSH_HV674_pt3.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 623664.0, "duration": 623.66}, "PCSH_HV674_pt4.mp3": {"size_mb": 66.9022, "modified": "2020-07-09 07:49:12", "extension": "MP3", "full_path": "D:\\FILME PESSOAS\\PCSH_HV674_Marco Aurélio Pinho Del Fiol\\Audiovisual\\Áudio\\PCSH_HV674_pt4.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 1753776.0, "duration": 1753.78}, "PCSH_HV674_pt1.mp3": {"size_mb": 426.6687, "modified": "2020-07-09 07:36:54", "extension": "MP3", "full_path": "D:\\FILME PESSOAS\\PCSH_HV674_Marco path": "D:\\FILME PESSOAS\\PCSH_HV584_Pedro Cezar Duarte Guimarães\\Audiovisual\\Vídeo\\B003C001_180416_K739.MOV", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3387885.0, "duration": 3387.89}, "folder_size_gb": 563.847}, "folder_size_gb": 564.198}, "Textual": {"PCSH_HV584_Pedro Cezar Duarte Guimarães_ed.odt": {"size_mb": 0.0105, "modified": "2020-07-02 17:55:00", "extension": "ODT", "full_path": "D:\\FILME PESSOAS\\PCSH_HV584_Pedro Cezar Duarte Guimarães\\Textual\\PCSH_HV584_Pedro Cezar Duarte Guimarães_ed.odt", "category": "Textual"}, "PCSH_HV584_Pedro Cezar Duarte Guimarães_rev.docx": {"size_mb": 0.0994, "modified": "2020-06-29 17:03:08", "extension": "DOCX", "full_path": "D:\\FILME PESSOAS\\PCSH_HV584_Pedro Cezar Duarte Guimarães\\Textual\\PCSH_HV584_Pedro Cezar Duarte Guimarães_rev.docx", "category": "Textual", "content_preview": "Pessoas\nDepoimento de Pedro Cezar Duarte Guimarães \nEntrevistado por Karen Worcman e Rosana Miziara\nSão Paulo, 16/04/2018\nRealização Museu da Pessoa.\nPCSH_HV584_Pedro Cezar Duarte Guimarães\nTranscrito por Mariana Wolff\nMW Transcrições\nÁudio 01\nP/1 – Então, eu queria começar fazendo as mesmas perguntas que eu te fiz no inicio, seu nome inteiro, data e o lugar que você nasceu.\nR – Meu nome é Pedro Cezar Duarte Guimarães, nasci no Rio de Janeiro, em seis de abril de 1966.\nP/1 – E o nome da sua mãe?\nR – Eu sou filho de Rosa Maria Duarte Guimarães e Ronaldo Duarte Guimarães.\nP/1 – E os seus avós?\nR – Meus avós paternos, José Cardoso da Cunha, Najicina Cardoso da Cunha. Meus avós… desculpe, meus avós maternos, José Cardoso da Cunha, Najicina Cardoso da Cunha. Meus avós paternos, João Duarte Guimarães e Ana Duarte Guimarães.\nP/1 – E me conta assim, um pouco, o que você sabe da história da sua família. A gente pode começar pela família da sua mãe, assim, o quê que os seus avós faziam, como era… que história coce conhece dessa…\nR – Da minha mãe. Eu cresci… eu fui criado pelos meus avós, com sete meses, quando eu nasci, a minha mãe era muito jovem e com sete meses, o meu avô materno veio aqu"}, "folder_size_gb": 0.0}, "folder_size_gb": 564.198}, "PCSH_HV585_Viviane Ferreira da Cruz": {"Textual": {"PCSH_HV585_Viviane Ferreira da Cruz_rev.docx": {"size_mb": 0.1481, "modified": "2020-07-09 07:52:54", "extension": "DOCX", "full_path": "D:\\FILME PESSOAS\\PCSH_HV585_Viviane Ferreira da Cruz\\Textual\\PCSH_HV585_Viviane Ferreira da Cruz_rev.docx", "category": "Textual", "content_preview": "Projeto Pessoas\nDepoimento de Viviane Ferreira da Cruz\nEntrevistada por Karen Worcman e Rosana Miziara\nSão Paulo, 16/04/2018\nRealização Museu da Pessoa\nPCSH_HV585_Viviane Ferreira da Cruz\nTranscrito por Mariana Wolff\nMW Transcrições\nVIVIANE_T01\nP/1 – Eu vou fazer uma ficha, vamos lá. Viviane…\nR – Ferreira da Cruz.\nP/1 – Acho que CPF e telefone depois eu pego. Data de nascimento.\nR – Aí já começa as histórias.\nP/1 – Não, só me diz a data. Agora é só uma fichinha.\nR – Mas precisa ser a que tá no documento?\nP/1 – A que tá no documento.\nR – 15 de março de 1985.\nP/1 – Nossa! Cidade que você nasceu?\nR – Lauro de Freitas.\nP/1 – Bahia?\nR – Bahia.\nP/1 – Onde que você mora agora?\nR – Brasília.\nP/1 – Me diz aí o endereço. Rua…\nR – SQN 410 Bloco N apto 210 – Asa Norte, não me pergunte o CEP.\nP/1 – Isso é Brasília, né?\nR – Brasília.\nP/1 – Religião?\nR – Candomblé. \nP/1 – Raça?\nR – Preta segundo o IBGE.\nP/1 – Formação? Você fez universidade, mestrado, é isso?\nR – Eu tô no mestrado em Comunicação, graduação em Direito e Cinema Digital.\nP/1 – Profissão, como que você…\nR – Cineasta. Advogada nas horas vagas.\nP/1 – Então, isso aqui é só uma ficha de cadastro. Então, eu vou começar pedindo pra gente f"}, "PCSH_HV585_Viviane Ferreira da Cruz_ed.docx": {"size_mb": 0.0173, "modified": "2023-08-04 17:36:56", "extension": "DOCX", "full_path": "D:\\FILME PESSOAS\\PCSH_HV585_Viviane Ferreira da Cruz\\Textual\\PCSH_HV585_Viviane Ferreira da Cruz_ed.docx", "category": "Textual", "content_preview": "Viviane Ferreira da Cruz\nMinibio:\nViviane Ferreira nasceu em 1985 na periferia de Salvador, aos 19 anos se mudou para São Paulo e após cursos preparatórios do vestibular passou a estudar cinema no instituto Stanislavisky e Direito na UNIP. Se transformou em uma produtora, roteirista e diretora. Seu curta metragem \"O Dia de Jerusa\" passou no festival de Cannes e lhe possibilitou que filmasse o longa metragem \"Um dia com Jerusa\", com isso Viviane passou a ser a segunda mulher negra no Brasil a realizar um longa metragem. Em 2008, ano do seu primeiro curta-metragem, fundou a \"Odun Filmes\" uma produtora aduiovisual identitária negra. Presidiu o Comitê de Seleção do Oscar em 2021e também e foi nomeada diretora presidente da SP Cine.\nSinopse:\nViviane através da sua história nos mostra o mundo do Candomblé onde sua vó era Mãe de Santo, conta da infância vivida na Bahia, de quando acompanhou sua mãe como manicure, seus primeiros envolvimentos com audiovisual, conta das manobras pra conseguir bolsa no cursinho e uma transferência para São Paulo. Em São Paulo mostra uma vida onde encaixou um estudo de cinema, direito e trabalho, tudo ao mesmo tempo além de revelar tramas amorosas e nessa his"}, "folder_size_gb": 0.0}, "Audiovisual": {"Áudio": {"PCSH_HV585_pt3.mp3": {"size_mb": 70.6442, "modified": "2020-07-09 07:54:12", "extension": "MP3", "full_path": "D:\\FILME PESSOAS\\PCSH_HV585_Viviane Ferreira da Cruz\\Audiovisual\\Áudio\\PCSH_HV585_pt3.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 3086160.0, "duration": 3086.16}, "PCSH_HV585_pt4.mp3": {"size_mb": 15.6351, "modified": "2020-07-09 07:54:14", "extension": "MP3", "full_path": "D:\\FILME PESSOAS\\PCSH_HV585_Viviane Ferreira da Cruz\\Audiovisual\\Áudio\\PCSH_HV585_pt4.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_co AS\\PCSH_HV585_Viviane Ferreira da Cruz\\Audiovisual\\Vídeo\\B005C001_180416_K739.MOV", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3766763.0, "duration": 3766.76}, "folder_size_gb": 456.606}, "folder_size_gb": 456.891}, "folder_size_gb": 456.891}, "PCSH_HV671_Karen Worcman": {"Textual": {"PCSH_HV671_Karen Worcman_rev.docx": {"size_mb": 0.2002, "modified": "2020-07-09 07:12:44", "extension": "DOCX", "full_path": "D:\\FILME PESSOAS\\PCSH_HV671_Karen Worcman\\Textual\\PCSH_HV671_Karen Worcman_rev.docx", "category": "Textual", "content_preview": "Pessoas\nDepoimento de Karen Worcman\nEntrevistada por Marco Del Fiol e Rosana Miziara\nSão Paulo, 09/05/2018\nTranscrito por Mariana Wolff\nMW Transcrições\nP/1 – Karen, você começa as entrevistas sempre fazendo um exercício, ali meio que de esvaziamento, de busca de imagem. Você falou que você também faz isso enquanto você tá conduzindo, você tá buscando, pinçando as suas imagens também, o quê que você viu?\nR – De mim?\nP/1 – É. Você vê dos outros também?\nR – Vejo.\nP/1 – Como que é isso?\nR – Não sei, quando eu faço, a minha procura, em geral, não é a busca em mim, é… eu não faço esse exercício há muito tempo, na verdade. Isso é uma coisa nova. Eu tinha uma outra visão, quer dizer, não sei, eu começava a entrevista de um outro jeito, era: “Onde você nasceu? Seu nome?”, e eu tinha uma teoria sobre isso que são perguntas localizadoras, muito simples, todo mundo sabe seu nome, o lugar e a data quem nasceu e então, era um jeito de você ir se aproximando da pessoa sem ela ficar com a cabeça muito… eu até explicava isso pras pessoas, quando você faz uma pergunta complexa e vai para o Google, o cérebro fica xixixixixi, vasculhando. Então, nome, local e data de nascimento é um jeito que você sab"}, "folder_size_gb": 0.0}, "Audiovisual": {"Áudio": {"PCSH_HV862_pt2.mp3": {"size_mb": 98.3286, "  Machado_rev.docx", "category": "Textual", "content_preview": "Projeto Pessoas \nDepoimento de Marcelo Ramalho Machado\nEntrevistado por Karen Worcman e Rosana Miziara\nSão Paulo, 08/05/2018\nRealização Museu da Pessoa\nPCSH_HV672_Marcelo Ramalho Machado\nTranscrito por Mariana Wolff\nMW Transcrições\nMARCELO-T01\nP/1 – Pra gente começar, Marcelo, eu queria pedir pra gente fazer um exercício, que é fechar o olho, eu vou fechar também, então não vai ficar todo mundo te olhando, mas fechar o olho e começar a se aproximar e ver assim, qual é a primeira imagem que te vem, a primeira imagem que você lembra da sua vida. E aí, você lembra de respirar. Então, pode passear um pouco com a sua lembrança, como se ela tivesse passeando e vai buscando lá, assim, essa imagem, pode ser uma imagem, uma sensação, um lugar, pode ser só um som, pode ser só um cheiro. Inspira e sente o ar entrando e passeando, entrando pelo nariz, descendo pelo seu corpo e voltando e saindo. E respira de novo, sente esse ar entrando, passando pela cabeça, descendo e a próxima vez que você respirar, quando descer o ar, você vai recuperando aos poucos o seu acordar de hoje: o quê que você fez, levantou, cada passo do que você fez, abriu o olho, levantou, falou com alguém. E cada um dos passo"}, "PCSH_HV672_Marcelo Ramalho Machado_ed.docx": {"size_mb": 0.0192, "modified": "2023-08-04 17:41:56", "extension": "DOCX", "full_path": "D:\\FILME PESSOAS\\PCSH_HV672_Marcelo Ramalho Machado\\Textual\\PCSH_HV672_Marcelo Ramalho Machado_ed.docx", "category": "Textual", "content_preview": "Marcelo Ramalho Machado\nMinibio:\nMarcelo Machado nasceu na cidade de Araraquara em 8 de Junho de 1950.\nFez a graduação em arquitetura na FAU e em 1981 montou foi um dos montadores da produtora \"Olhar Eletrônico\", ele foi diretor da TV Gazeta também nos anos 80. Em 1991 foi uma das pessoas que assumiu a responsabilidade de criar a MTV Brasil. Entre outros trabalhos de comunicação como no departamento de comunicação da DPZ, Marcelo Machado também se destacou com seus documentários, entre eles \"Ginga: A alma do futebol brasileiro\" \"Oscar Niemeyer, o arquiteto da invenção\" e \"Tropicália\".\nSinopse:\nNa entrevista de Marcelo Machado ele conta da sua infância em Araraquara, dos estudos de arquitetura na FAU com muitos causos, como do dia que participou da captura e restauração da escultura de Garcia Lorca, ou de quando pegou a estrada e viajou pelas Américas pegando carona e arrumando bicos no caminho, até quando montou sua produtora/casa e participou de uma reinvenção da comunicação e da televisão brasileira até fazer documentários premiados no mundo.\nEdição de texto: Quando a história da televisão brasileira e de uma pessoa se misturam\nEu lembro lá de Araraquara onde nasci, lembro da min"}, "folder_size_gb": 0.0}, "Audiovisual": {"Áudio": {"PCSH_HV672_pt2.mp3": {"size_mb": 331.984, "modified": "2020-07-09 07:27:54", "extension": "MP3", "full_path": "D:\\FILME PESSOAS\\PCSH_HV672_Marcelo Ramalho Machado\\Audiovisual\\Áudio\\PCSH_HV672_pt2.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 8702736.0, "duration": 8702.74}, "PCSH_HV672_pt3.mp3": {"size_mb": 75.4944, "modified": "2020-07-09 07:26:48", "extension": "MP3", "full_path": "D:\\FILME PESSOAS\\PCSH_HV672_Marcelo Ramalho Machado\\Audiovisual\\Áudio\\PCSH_HV672_pt3.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 1979016.0, "duration": 1979.02}, "PCSH_HV672_pt1.mp3": {"size_mb": 426.6687, "modified": "2020-07-09 07:20:14", "extension": "MP3", "full_path": "D:\\FILME PESSOAS\\PCSH_HV672_Marcelo Ramalho Machado\\Audiovisual\\Áudio\\PCSH_HV672_pt1.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 11184840.0, "duration": 11184.84}, "folder_size_gb": 0.815}, "Vídeo": {"A006C004_180508_L71B.MOV": {"size_mb": 115436.3046, "modified": "2018-05-08 10:39:19", "extension": "MOV", "full_path": "D:\\ Depoimento de Tatiana Toffoli Soares\nEntrevistada por Karen Worcman e Rosana Miziara\nSão Paulo, 08/05/2018\nRealização Museu da Pessoa\nPCSH_HV673_Tatiana Toffoli Soares\nTranscrito por Mariana Wolff\nMW Transcrições\nR – Estava bem na época certa, a época de escalar. Tudo ele escalava, aí você ia cozinhar, quando via, o moleque estava em cima de não sei o que, atrás do armário, subia escada, você tinha que tirar a escada…\nP/2 – Essa foto tá ótima, você tá com um sorriso ótimo!\nR – Frederico e Lara. A Lara agora tá… isso faz tempo, isso aqui foi quando…\nP/1 – Eles estão com quantos anos, agora?\nR – Agora, a Lara vai fazer 15 amanhã e o Frederico tem 11. Esse aqui foi no Prêmio… o Baré ganhou um prêmio no Telas, festival de telas, revelação e…\nP/2 – Que ano, isso?\nR – Isso foi 2016.\nP/2 – Agora, mais recente.\nR – Recente, é…\nP/1 – Onde foi?\nR – Foi no Ibirapuera, é um festival chamado Telas que é um festival de audiovisual. Aqui é no Telas também. E aqui com as duas ceras, com as personagens do filme, quando elas vieram para São Paulo. Isso aqui quando eu fiz um curso de piloto.\nP/2 – Esse aqui é quando você fez o curso de piloto?\nR – É, exatamente. meu ex-marido era um p"}, "PCSH_HV673_Tatiana Toffoli Soares_ed.docx": {"size_mb": 0.0181, "modified": "2023-08-04 17:46:48", "extension": "DOCX", "full_path": "D:\\FILME PESSOAS\\PCSH_HV673_Tatiana Tofolli Soares\\Textual\\PCSH_HV673_Tatiana Toffoli Soares_ed.docx", "category": "Textual", "content_preview": "Marcelo Ramalho Machado\nMinibio:\nTatiana Toffoli Soares nasceu no Rio Grande do Sul aonde se formou em jornalismo pela PUC, mudou-se para o Rio de Janeiro onde teve uma curta carreira como atriz atuando em novelas como \" A história de Ana Raio e Zé Trovão\" Em São Paulo trabalhou na MTV onde dirigiu a série \"O Mochilão\"  e tem uma carreira como montadora e tornou-se documentarista onde exibiu \"Chapa\" no festival  \"É Tudo Verdade\" e destacou-se pelo seu olhar para causa indígena com os filmes \"Louceiras\" e \"Baré- O Povo do Rio\".\nSinopse:\nNo projeto \"Pessoas- Contar para Viver\" Tatiana Toffoli uma das realizadoras do filme conta as origens da sua família, detalha e expande a percepção do que é ser uma atriz e estar nesse mundo, abre a intimidade da sua vida amorosa e materna e através da sua preciosa trajetória como documentarista mostra um pouco do que é a vida de uma mulher no audiovisual brasileiro\nEdição de texto: Registrando Histórias Tradicionais\nEu lembro do dia que eu entrei nesse cinema da família, tinha um telão que me fez ficar super emocionada, eu devia ter uns seis anos, sete anos e tal, a família tinha vindo pra cá e se fixou em Viamão e aí, tinha a história do cinema, q"}, "folder_size_gb": 0.0}, "Audiovisual": {"Áudio": {"PCSH_HV673_pt2.mp3": {"size_mb": 373.0326, "modified": "2020-07-03 09:19:34", "extension": "MP3", "full_path": "D:\\FILME PESSOAS\\PCSH_HV673_Tatiana Tofolli Soares\\Audiovisual\\Áudio\\PCSH_HV673_pt2.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 9778800.0, "duration": 9778.8}, "PCSH_HV673_pt3.mp3": {"size_mb": 227.7768, "modified": "2020-07-03 09:18:38", "extension": "MP3", "full_path": "D:\\FILME PESSOAS\\PCSH_HV673_Tatiana Tofolli Soares\\Audiovisual\\Áudio\\PCSH_HV673_pt3.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 5971008.0, "duration": 5971.01}, "PCSH_HV673_pt1.mp3": {"size_mb": 426.6687, "modified": "2020-07-03 09:19:42", "extension": "MP3", "full_path": "D:\\FILME PESSOAS\\PCSH_HV673_Tatiana Tofolli Soares\\Audiovisual\\Áudio\\PCSH_HV673_pt1.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 11184840.0, "duration": 11184.84}, "folder_size_gb": 1.003}, "Vídeo": {"A008C002_180508_L71B.MOV": {"size_mb": 15187.0097, "modified": "2018-05-08 15:27:45", "extension": "MOV", "full_path": "D:\\FILME PESSOAS\\PCSH_HV673_Tatiana Tofolli Soares\\Audiovisual\\Vídeo\\ const EXTENSIONS = {
    "Video": ['mp4', 'mov', 'mkv', 'avi', 'm4v', 'mts', 'm2ts', 'wmv', 'flv', 'webm', 'vob', 'ogv', '3gp', 'mxf'],
    "Audio": ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'aiff', 'pcm', 'aif'],
    "Image": ['jpg', 'jpeg', 'tif', 'tiff', 'png', 'gif', 'bmp', 'webp', 'cr2', 'nef', 'arw', 'dng'],
    "Textual": ['doc', 'docx', 'pdf', 'txt', 'rtf', 'odt', 'xls', 'xlsx', 'ppt', 'pptx']
};

const ICONS = { "Video": "🎞️", "Audio": "🎧", "Image": "🖼️", "Textual": "📝", "Other": "📄" };

function formatSmartSize(mbValue) {
    if (!mbValue || mbValue === 0) return "0 B";
    let bytes = mbValue * 1024 * 1024; 
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(2) + " " + units[i];
}

function getIcon(name, isFolder) {
    if (isFolder) return "📁";
    const ext = name.split('.').pop().toLowerCase();
    for (const [category, list] of Object.entries(EXTENSIONS)) {
        if (list.includes(ext)) return ICONS[category];
    }
    return ICONS["Other"];
}

function formatTime(ms) {
    if (!ms || ms === 0) return "N/A";
    let totalSeconds = Math.floor(ms / 1000);
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;
    return [hours, minutes, seconds].map(v => v < 10 ? "0" + v : v).join(":");
}

function tryLoadImage(imgElement, thumbnailPath, originalName) {
    if (!thumbnailPath && !originalName) return;
    let path = thumbnailPath || `thumbnails/thumb_${originalName.split('.').slice(0, -1).join('.')}.jpg`;
    imgElement.onerror = function() {
        this.onerror = null;
        this.src = 'https://via.placeholder.com/150?text=Sem+Preview';
    };
    imgElement.src = path;
}

function copyPreviewText() {
    const box = document.getElementById('preview-text');
    if (box) {
        navigator.clipboard.writeText(box.textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy Content"; }, 2000);
    }
}

function calculateFolderStats(node) {
    let stats = { Video: { count: 0, size: 0 }, Audio: { count: 0, size: 0 }, Image: { count: 0, size: 0 }, Textual: { count: 0, size: 0 }, Other: { count: 0, size: 0 }, totalSize: 0 };
    function traverse(curr) {
        for (let key in curr) {
            if (key === "folder_size_gb") continue;
            let item = curr[key];
            if (item.folder_size_gb !== undefined) traverse(item);
            else {
                let cat = item.category || "Other";
                if (!stats[cat]) cat = "Other";
                stats[cat].count++;
                stats[cat].size += item.size_mb || 0;
                stats.totalSize += item.size_mb || 0;
            }
        }
    }
    traverse(node);
    return stats;
}

function showMetadata(name, data, path) {
    const panel = document.getElementById("metadata-panel");
    const content = document.getElementById("meta-content");
    panel.style.display = "block";

    const isFolder = data.folder_size_gb !== undefined;
    let html = `
        <span class="meta-label">Nome</span><span class="meta-value">${name}</span>
        <span class="meta-label">Caminho</span><span class="meta-value">${data.full_path || path.join("/")}</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(data.full_path || "").replace(/\\/g, "\\\\")}')">Copy Path</button>
        <span class="meta-label">Tamanho</span><span class="meta-value" style="color:var(--accent); font-weight:bold;">${formatSmartSize(isFolder ? data.folder_size_gb * 1024 : data.size_mb)}</span>
    `;

    if (isFolder) {
        const stats = calculateFolderStats(data);
        const getPct = (size) => stats.totalSize > 0 ? ((size / stats.totalSize) * 100).toFixed(1) : 0;
        html += `
            <div class="stats-container">
                <span class="meta-label">Conteúdo</span>
                <div class="stats-bar">
                    <div class="bar-segment" style="width:${getPct(stats.Video.size)}%; background:var(--video)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Audio.size)}%; background:var(--audio)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Image.size)}%; background:var(--image)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Textual.size + stats.Other.size)}%; background:var(--other)"></div>
                </div>
                <div class="stat-row"><span>🎞️ Video</span><b>${stats.Video.count}</b></div>
                <div class="stat-row"><span>🎧 Audio</span><b>${stats.Audio.count}</b></div>
                <div class="stat-row"><span>🖼️ Images</span><b>${stats.Image.count}</b></div>
                <div class="stat-row"><span>📄 Docs / Other</span><b>${stats.Textual.count + stats.Other.count}</b></div>
            </div>`;
    } else {
        if (data.category === "Image" || data.thumbnail) {
            html += `<h3>Preview</h3>
                     <div class="img-preview-container">
                        <img id="preview-img" src="" alt="Carregando...">
                     </div>`;
            setTimeout(() => {
                const img = document.getElementById('preview-img');
                tryLoadImage(img, data.thumbnail, name);
            }, 50);
        }

        html += `<span class="meta-label">Modificado</span><span class="meta-value">${data.modified || "N/A"}</span>`;
        
        if (data.category === "Video") {
            // Garante que displayRes exista ou usa a dimensão original
            const displayRes = data.dimension || "N/A"; 
            
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Resolução</span><span class="meta-value">${displayRes}</span>
                <span class="meta-label">Duração / Áudio</span><span class="meta-value">${formatTime(data.duration_ms)} / ${data.audio_channels || "N/A"}</span>
                <span class="meta-label">Aspecto / FPS</span><span class="meta-value">${data.aspect_ratio || "N/A"} / ${data.frame_rate || "N/A"}</span>`;
        } else if (data.category === "Audio") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Duração</span><span class="meta-value">${formatTime(data.duration_ms)}</span>
                <span class="meta-label">Canais</span><span class="meta-value">${data.audio_channels || "N/A"}</span>`;
        } else if (data.category === "Image") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Dimensões</span><span class="meta-value">${data.dimension || "N/A"}</span>
                <span class="meta-label">DPI</span><span class="meta-value">${data.dpi || "N/A"}</span>`;
        }

        // NOVIDADE: Verifica explicitamente por content_preview ou categoria textual
        if (data.content_preview) {
            html += `<h3>Conteúdo do Documento</h3>
                     <div class="preview-box" id="preview-text">Loading content...</div>
                     <button class="copy-btn" onclick="copyPreviewText()">Copiar Conteúdo</button>`;
        }
    }
    
    content.innerHTML = html;

    // Sincronização garantida: espera o DOM atualizar para injetar o texto
    if (data.content_preview) {
        setTimeout(() => {
            const box = document.getElementById('preview-text');
            if (box) box.textContent = data.content_preview;
        }, 10);
    }
}

function renderColumn(node, level, path = []) {
    const explorer = document.getElementById("explorer");
    while (explorer.children.length > level) explorer.removeChild(explorer.lastChild);
    const col = document.createElement("div"); col.className = "column";
    const keys = Object.keys(node).filter(k => k !== "folder_size_gb").sort((a, b) => {
        const aIsF = node[a].folder_size_gb !== undefined;
        const bIsF = node[b].folder_size_gb !== undefined;
        return (aIsF !== bIsF) ? bIsF - aIsF : a.localeCompare(b);
    });
    keys.forEach(name => {
        const val = node[name];
        const isFolder = val.folder_size_gb !== undefined;
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `<span class="icon">${getIcon(name, isFolder)}</span> <span class="item-text">${name}</span>`;
        item.onclick = () => {
            Array.from(col.children).forEach(c => c.classList.remove('active'));
            item.classList.add('active');
            showMetadata(name, val, path.concat(name));
            if (isFolder) renderColumn(val, level + 1, path.concat(name));
            else while (explorer.children.length > level + 1) explorer.removeChild(explorer.lastChild);
        };
        col.appendChild(item);
    });
    explorer.appendChild(col);
}

            const item = node[key];
            const isFolder = item.folder_size_gb !== undefined;
            const match = key.toLowerCase().includes(term) || (item.content_preview && item.content_preview.toLowerCase().includes(term));
            
            if (match) results.push({ name: key, data: item, path: currentPath.concat(key), isFolder });
            if (isFolder) searchNode(item, currentPath.concat(key));
        }
    }
    
    searchNode(TREE, ["Root"]); // Certifique-se que o nome base aqui condiz com seu JSON
    explorer.innerHTML = "";
    const col = document.createElement("div"); col.className = "column"; col.style.minWidth = "100%";
    
    results.slice(0, 100).forEach(res => {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<span class="icon">${getIcon(res.name, res.isFolder)}</span> 
                         <div><b>${res.name}</b><br><small style="color:#888">${res.path.join(" › ")}</small></div>`;
        
        // AQUI ESTÁ A MUDANÇA: Chama a navegação em vez de apenas mostrar metadados
        div.onclick = () => navigateToPath(res.path);
        
        col.appendChild(div);
    });
    explorer.appendChild(col);
}

document.addEventListener("DOMContentLoaded", () => renderColumn(TREE, 0));
</script>
</body>
</html>
