\\MVI_9819.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 53178.0, "duration": 53.18}, "folder_size_gb": 16.672}, "folder_size_gb": 24.064}, "Acesso": {"CN_CB036_Ariana Nutt.mp4": {"size_mb": 22.9527, "modified": "2017-10-10 09:07:12", "extension": "MP4", "full_path": "D:\\COLGATE_CABINE\\CABINE 001-081\\CN_CB036_Ariana Nutt\\Audiovisual\\Acesso\\CN_CB036_Ariana Nutt.mp4", "category": "Video", "dimension": "1280x720", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 138388.0, "duration": 138.39}, "folder_size_gb": 0.022}, "Audio": {"CN_CB036_Ariana Nutt.wav": {"size_mb": 514.3961, "modified": "2017-07-10 17:51:34", "extension": "WAV", "full_path": "D:\\COLGATE_CABINE\\CABINE 001-081\\CN_CB036_Ariana Nutt\\Audiovisual\\Audio\\CN_CB036_Ariana Nutt.wav", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3057724.0, "duration": 3057.72}, "folder_size_gb": 0.502}, "folder_size_gb": 24.589}, "Textual": {"CN_CB036_Arianna Nutt (transc).docx": {"size_mb": 0.0413, "modified": "2017-10-09 13:59:30", "extension": "DOCX", "full_path": "D:\\COLGATE_CABINE\\CABINE 001-081\\CN_CB036_Ariana Nutt\\Textual\\CN_CB036_Arianna Nutt (transc).docx", "category": "Textual", "content_preview": "Conte Sua História – Celebração do Sorriso\nDepoimento de Arianna Nutt\nEntrevistado por Lila Schnaider \nSão Paulo, 09/07/2017\nRealização Museu da Pessoa\nCN_CB036_Arianna Nutt\nTranscrito por Mariana Wolff\nMW Transcrições\nP/1 – Você podia começar falando o teu nome, local de nascimento e data, por favor?\nR – Tá. Data de nascimento? Ixi, isso daí é ruim! (risos) Eu sou Arianna Nutt e eu nasci em Maceió, no dia primeiro de junho de 79. Às vezes, eu minto a minha idade, eu falo que… né? Porque não parece… parece que eu tenho isso tudo? Trinta e oito? parece não, né? Eu acho que não, também (risos). vai passando o tempo, a gente vai ficando doida, né, a vai achando que tá mais nova, mesmo. Na verdade, eu nem nasci Arianna Nutt, eu sou Arianna Cavalcante Gomes. Mas eu queria muito ter um nome bonito, assim, sabe? Não que eu ache feio o meu nome, mas é que eu queria que fosse mais sonoro. E daí, eu fiz Nutrição, curso de nutrição e aí, o meu e-mail era ariannanutt por conta da Nutrição e aí, o pessoal… eu falava: “Nossa, mas eu queria ter um sobrenome bom” “Mas Nutt é ótimo” “Mas Nutt não é o meu sobrenome”, porque eu tinha um e-mail para Nutrição e outro para publicidade, que eu cursava os"}, "folder_size_gb": 0.0}, "Fotos": {"Baixa": {"ARIANA NUTT.jpg": {"size_mb": 0.0767, "modified": "2017-10-09 14:04:18", "extension": "JPG", "full_path": "D:\\COLGATE_CABINE\\CABINE 001-081\\CN_CB036_Ariana Nutt\\Fotos\\Baixa\\ARIANA NUTT.jpg", "category": "Image", "dimension": "429x1050", "resolution": "429x1050", "color_mode": "RGB", "dpi": "120 DPI", "thumbnail": "thumbnails/HD_0092/thumb_ARIANA NUTT.jpg"}, "ARIANA NUTT.png": {"size_mb": 0.3981, "modified": "2017-08-23 18:19:14", "extension": "PNG", "full_path": "D:\\COLGATE_CABINE\\CABINE 001-081\\CN_CB036_Ariana Nutt\\Fotos\\Baixa\\ARIANA NUTT.png", "category": "Image", "dimension": "429x1050", "resolution": "429x1050", "color_mode": "RGBA", "dpi": "381 DPI", "thumbnail": "thumbnails/HD_0092/thumb_ARIANA NUTT.jpg"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "folder_size_gb": 24.59}, "CN_CB037_Tatyana Soares(15anos)": {"Audiovisual": {"Preservação": {"Lateral": {"MVI_9805.MOV": {"size_mb": 556.8921, "modified": "2017-07-10 18:55:52", "extension": "MOV", "full_path": "D:\\COLGATE_CABINE\\CABINE 001-081\\CN_CB037_Tatyana Soares(15anos)\\Audiovisual\\Preservação\\Lateral\\MVI_9805.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "d rdo. Eu só nasci lá e eu morei sempre em São Paulo. Aí, bem mais velho, eu mudei para o Rio de Janeiro, fiquei lá um tempo e voltei. Mas eu nasci em São Bernardo.\nP/1 – Victor, então você veio pra cá tão pequeno, então você não lembra nada de São Bernardo?\nR – Eu acho que eu nem fiquei, nem cheguei a morar em São Bernardo, eu acho que os meus pais já… eu nasci só lá, porque acho que era o hospital da época, não sei como que funcionava, mas logo cedo, eu já vim para São Paulo, não lembro da primeira casa que eu morei que era um apartamento em São João Clímaco. Lembro da segunda que era no Jardim Patente que foi onde eu passei a minha infância toda, aí com uns 12 anos, eu mudei mais para dentro de São Paulo, pra divisa de São Paulo e São Bernardo, ali,"}, "folder_size_gb": 0.0}, "folder_size_gb": 37.012}, "CN_CB045_Paulo Fonseca Redondo": {"Preservação": {"Lateral": {"MVI_9841.MOV": {"size_mb": 383.9188, "modified": "2017-07-11 18:23:50", "extension": "MOV", "full_path": "D:\\COLGATE_CABINE\\CABINE 001-081\\CN_CB045_Paulo Fonseca Redondo\\Preservação\\Lateral\\MVI_9841.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 68769.0, "duration": 68.77}, "MVI_9842.MOV": {"size_mb": 1254.6939, "modified": "2017-07-11 18:27:38", "extension": "MOV", "full_path": "D:\\COLGATE_CABINE\\CABINE 001-081\\CN_CB045_Paulo Fonseca Redondo\\Preservação\\Lateral\\MVI_9842.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 221354.0, "duration": 221.35}, "MVI_9843.MOV": {"size_mb": 2168.7719, "modified": "2017-07-11 18:43:00", "extension": "MOV", "full_path": "D:\\COLGATE_CABINE\\CABINE 001-081\\CN_CB045_Paulo Fonseca Redondo\\Preservação\\Lateral\\MVI_9843.MOV", "category": "Video", "dimension": "1920x1080", "aspe cimento?\nR – Meu nome é Victor Ahmar, nasci em Uberaba, Minas Gerais, Triângulo Mineiro, 29 de janeiro de 1996.\nP/1 – E qual foi a coisa que você sabe, assim, sobre a história do seu nascimento?\nR – Eu sei sobre a história do meu nascimento? Eu sei que eu não ia ser Victor, eu sei que de última hora mudaram o meu nome, eu ia me chamar Guilherme, mudaram pra Victor de última hora. meu pai conversou com a minha mãe, eles mudaram, de última hora e sei também que era à noite e que eu chorava e incomodava o hospital inteiro, eu gritava como se não houvesse amanhã, assim. E muito vermelho, muito vermelho também, eu nasci.\nP/1 – Por quê que eles mudaram o seu nome?\nR – Meu pai, ele sempre gostou de História, meu pai é formado em História e Victor é o nome de um dos reis que ele gostava muito e ele colocou como nome composto Victor Alexandre, porque o meu avô"}, "folder_size_gb": 0.0}, "folder_size_gb": 35.186}, "CN_CB055_Bianca Souza": {"Preservação": {"Lateral": {"MVI_9867.MOV": {"size_mb": 2549.3949, "modified": "2017-07-12 19:31:04", "extension": "MOV", "full_path": "D:\\COLGATE_CABINE\\CABINE 001-081\\CN_CB055_Bianca Souza\\Preservação\\Lateral\\MVI_9867.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 453453.0, "duration": 453.45}, "MVI_9868.MOV": {"size_mb": 4082.4562, "modified": "2017-07-12 19:43:42", "extension": "MOV", "full_path": "D:\\COLGATE_CABINE\\CABINE 001-081\\CN_CB055_Bianca Souza\\Preservação\\Lateral\\MVI_9868.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 724791.0, "duration": 724.79}, "MVI_9869.MOV": {"size_mb": 2614.7868, "modified": "2017-07-12 19:51:30", "extension": "MOV", "full_path": "D:\\COLGATE_CABINE\\CABINE 001-081\\CN_CB055_Bianca Souza\\Preservação\\Lat onas Worcman \nSão Paulo, 13/07/2017\nRealização Museu da Pessoa\nCN_CB062_Diego Baro\nTranscrito por Mariana Wolff\nMW Transcrições\nP/1 – Diego, fala antes da gente começar a entrevista o seu nome completo, onde você nasceu e a data que você nasceu, tudo de uma vez.\nR – Certo. meu nome e Diego Baro, eu nasci em Arujá, São Paulo, eu tenho 22 anos, não… ih, errei a idade cara, tenho 26 anos, eu nasci em 22 de setembro de 1990. É isso.\nP/1 – Qual o nome dos seus pais?\nR – Waldomiro Assis de oliveira que é o meu pai, nome de homem, logo seria o meu pai e José Rodrigues Barros é a minha mãe.\nP/1 – Fala um pouco deles assim, de onde eles são…\nR – O meu pai é do Recife, ele veio de Olinda, Pernambuco, que não é Recife, é Pernambuco, o cara que erra tudo (risos). E minha mãe é de Nova Olinda, no Ceará e aí, eles vieram para São Paulo tentar a vida melhor, essas coisas e aí, se encontraram aqui e tiveram eu e minha irmã e o meu irmão, todos mais velhos, eu sou o mais novo. \nP/1 – E você chegou a conhecer o lufar que eles nasceram, aquela cidade da família?\nR – Sim, a do meu pai não, do meu pai"}, "folder_size_gb": 0.0}, "Audiovisual": {"Acesso": {"CN_CB062_Diego Baro.mp4": {"size_mb": 14.999, "modified": "2017-09-20 21:22:26", "extension": "MP4", "full_path": "D:\\COLGATE_CABINE\\CABINE 001-081\\CN_CB062_Diego Baro\\Audiovisual\\Acesso\\CN_CB062_Diego Baro.mp4", "category": "Video", "dimension": "1280x720", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 99975.0, "duration": 99.97}, "folder_size_gb": 0.015}, "Preservação": {"Lateral": {"MVI_9888.MOV": {"size_mb": 4083.6548, "modified": "2017-07-13 17:35:22", "extension": "MOV", "full_path": "D:\\COLGATE_CABINE\\CABINE 001-081\\CN_CB062_Diego Baro\\Audiovisual\\Preservação\\Lateral\\MVI_9888.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channe  de Júnior, de Hallorino?\nR – Hallorino. Quero que o Brasil conheça esse nome.\nP/1 – Tá bom. Hallorino, qual o seu... Só pra deixar registrado, qual o seu nome inteiro, onde você nasceu e que dia?\nR – Que dia eu nasci?\nP/1 – É.\nR – Onze de maio de 1987. Meu nome é Hallorino Machado Júnior, e eu sou de Tibagi, interior do Paraná.\nP/1 – Tibagi. Onde fica?\nR – Campos Gerais. Região dos Campos Gerais. É centro do Paraná, ali pertinho de Curitiba, 200 km de Curitiba, 18 mil habitantes, pequeníssima a cidade. Quando eu nasci, tinha 17 mil e tava transitando para o 18 mil. E eu descobri que foi pra 18 quando eu trabalhei no IBGE, há quatro anos.\nP/1 – Ah, é? Qual o nome do teu pai e da tua mãe?\nR – Hallorino, meu pai Hallorino, por isso ele se vingou, falou: “Ah, vou colocar Hallorino também”. E eu tenho um tataravô também que se chama Hallorino. E a minha mãe se chama Ilda. Não tem nada a ve"}, "folder_size_gb": 0.0}, "folder_size_gb": 22.426}, "CN_CB023_Felipe Fernandes Pontes": {"Audiovisual": {"Preservação": {"Lateral": {"MVI_9776.MOV": {"size_mb": 4084.5414, "modified": "2017-07-09 16:26:48", "extension": "MOV", "full_path": "D:\\COLGATE_CABINE\\CABINE 001-081\\CN_CB023_Felipe Fernandes Pontes\\Audiovisual\\Preservação\\Lateral\\MVI_9776.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 726793.0, "duration": 726.79}, "MVI_9777.MOV": {"size_mb": 2537.5051, "modified": "2017-07-09 16:34:58", "extension": "MOV", "full_path": "D:\\COLGATE_CABINE\\CABINE 001-081\\CN_CB023_Felipe Fernandes Pontes\\Audiovisual\\Preservação\\Lateral\\MVI_9777.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 453420.0, "duration": 453.42}, "MVI_9778.MOV": {"size_mb": 4084.4624, "modified": "2017-07-09 17:06: – Meus avós, eles…\nP/1 – Paterno e materno.\nR – Tá. Os meus avós eram italianos, né, vieram de navio para o Brasil, talvez naquele período de guerras e vieram para o Brasil e aí, a minha avó conheceu o meu avô que também era um imigrante, trabalhava na fazenda e eles transaram no c"}, "folder_size_gb": 0.0}, "folder_size_gb": 33.341}, "CN_CB028_André Esteves Martins Pinto": {"Audiovisual": {"Acesso": {"CN_CB028_André Esteves Martins Pinto.mp4": {"size_mb": 1232.4956, "modified": "2017-12-28 20:03:09", "extension": "MP4", "full_path": "D:\\COLGATE_CABINE\\CABINE 001-081\\CN_CB028_André Esteves Martins Pinto\\Audiovisual\\Acesso\\CN_CB028_André Esteves Martins Pinto.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1014347.0, "duration": 1014.35}, "folder_size_gb": 1.204}, "Preservação": {"Lateral": {"MVI_9780.MOV": {"size_mb": 4086.1283, "modified": "2017-07-09 17:44:38", "extension": "MOV", "full_path": "D:\\COLGATE_CABINE\\CABINE 001-081\\CN_CB028_André Esteves Martins Pinto\\Audiovisual\\Preservação\\Lateral\\MVI_9780.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 728795.0, "duration": 728.79}, "folder_size_gb": 3.99}, "Frente": {"MVI_9796.MOV": {"size_mb": 4082.6982, "modified": "2017-07-09 18:18:48", "extension": "MOV", "full_path": "D:\\COLGATE_CABINE\\CABINE 001-081\\CN_CB028_André Esteves Martins Pinto\\Audiovisual\\Preservação\\Frente\\MVI_9796.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 737779.0, "duration": 737.78}, "MVI_9797.MOV": {"size_mb": 1374.4629, "modified": "2017-07-09 18:23:02", "extension": "MOV", "full_path": "D:\\COLG const EXTENSIONS = {
    "Video": ['mp4', 'mov', 'mkv', 'avi', 'm4v', 'mts', 'm2ts', 'wmv', 'flv', 'webm', 'vob', 'ogv', '3gp', 'mxf'],
    "Audio": ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'aiff', 'pcm', 'aif'],
    "Image": ['jpg', 'jpeg', 'tif', 'tiff', 'png', 'gif', 'bmp', 'webp', 'cr2', 'nef', 'arw', 'dng'],
    "Textual": ['doc', 'docx', 'pdf', 'txt', 'rtf', 'odt', 'xls', 'xlsx', 'ppt', 'pptx']
};

const ICONS = { "Video": "🎞️", "Audio": "🎧", "Image": "🖼️", "Textual": "📝", "Other": "📄" };

function formatSmartSize(mbValue) {
    if (!mbValue || mbValue === 0) return "0 B";
    let bytes = mbValue * 1024 * 1024; 
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(2) + " " + units[i];
}

function getIcon(name, isFolder) {
    if (isFolder) return "📁";
    const ext = name.split('.').pop().toLowerCase();
    for (const [category, list] of Object.entries(EXTENSIONS)) {
        if (list.includes(ext)) return ICONS[category];
    }
    return ICONS["Other"];
}

function formatTime(ms) {
    if (!ms || ms === 0) return "N/A";
    let totalSeconds = Math.floor(ms / 1000);
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;
    return [hours, minutes, seconds].map(v => v < 10 ? "0" + v : v).join(":");
}

function tryLoadImage(imgElement, thumbnailPath, originalName) {
    if (!thumbnailPath && !originalName) return;
    let path = thumbnailPath || `thumbnails/thumb_${originalName.split('.').slice(0, -1).join('.')}.jpg`;
    imgElement.onerror = function() {
        this.onerror = null;
        this.src = 'https://via.placeholder.com/150?text=Sem+Preview';
    };
    imgElement.src = path;
}

function copyPreviewText() {
    const box = document.getElementById('preview-text');
    if (box) {
        navigator.clipboard.writeText(box.textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy Content"; }, 2000);
    }
}

function calculateFolderStats(node) {
    let stats = { Video: { count: 0, size: 0 }, Audio: { count: 0, size: 0 }, Image: { count: 0, size: 0 }, Textual: { count: 0, size: 0 }, Other: { count: 0, size: 0 }, totalSize: 0 };
    function traverse(curr) {
        for (let key in curr) {
            if (key === "folder_size_gb") continue;
            let item = curr[key];
            if (item.folder_size_gb !== undefined) traverse(item);
            else {
                let cat = item.category || "Other";
                if (!stats[cat]) cat = "Other";
                stats[cat].count++;
                stats[cat].size += item.size_mb || 0;
                stats.totalSize += item.size_mb || 0;
            }
        }
    }
    traverse(node);
    return stats;
}

function showMetadata(name, data, path) {
    const panel = document.getElementById("metadata-panel");
    const content = document.getElementById("meta-content");
    panel.style.display = "block";

    const isFolder = data.folder_size_gb !== undefined;
    let html = `
        <span class="meta-label">Nome</span><span class="meta-value">${name}</span>
        <span class="meta-label">Caminho</span><span class="meta-value">${data.full_path || path.join("/")}</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(data.full_path || "").replace(/\\/g, "\\\\")}')">Copy Path</button>
        <span class="meta-label">Tamanho</span><span class="meta-value" style="color:var(--accent); font-weight:bold;">${formatSmartSize(isFolder ? data.folder_size_gb * 1024 : data.size_mb)}</span>
    `;

    if (isFolder) {
        const stats = calculateFolderStats(data);
        const getPct = (size) => stats.totalSize > 0 ? ((size / stats.totalSize) * 100).toFixed(1) : 0;
        html += `
            <div class="stats-container">
                <span class="meta-label">Conteúdo</span>
                <div class="stats-bar">
                    <div class="bar-segment" style="width:${getPct(stats.Video.size)}%; background:var(--video)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Audio.size)}%; background:var(--audio)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Image.size)}%; background:var(--image)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Textual.size + stats.Other.size)}%; background:var(--other)"></div>
                </div>
                <div class="stat-row"><span>🎞️ Video</span><b>${stats.Video.count}</b></div>
                <div class="stat-row"><span>🎧 Audio</span><b>${stats.Audio.count}</b></div>
                <div class="stat-row"><span>🖼️ Images</span><b>${stats.Image.count}</b></div>
                <div class="stat-row"><span>📄 Docs / Other</span><b>${stats.Textual.count + stats.Other.count}</b></div>
            </div>`;
    } else {
        if (data.category === "Image" || data.thumbnail) {
            html += `<h3>Preview</h3>
                     <div class="img-preview-container">
                        <img id="preview-img" src="" alt="Carregando...">
                     </div>`;
            setTimeout(() => {
                const img = document.getElementById('preview-img');
                tryLoadImage(img, data.thumbnail, name);
            }, 50);
        }

        html += `<span class="meta-label">Modificado</span><span class="meta-value">${data.modified || "N/A"}</span>`;
        
        if (data.category === "Video") {
            // Garante que displayRes exista ou usa a dimensão original
            const displayRes = data.dimension || "N/A"; 
            
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Resolução</span><span class="meta-value">${displayRes}</span>
                <span class="meta-label">Duração / Áudio</span><span class="meta-value">${formatTime(data.duration_ms)} / ${data.audio_channels || "N/A"}</span>
                <span class="meta-label">Aspecto / FPS</span><span class="meta-value">${data.aspect_ratio || "N/A"} / ${data.frame_rate || "N/A"}</span>`;
        } else if (data.category === "Audio") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Duração</span><span class="meta-value">${formatTime(data.duration_ms)}</span>
                <span class="meta-label">Canais</span><span class="meta-value">${data.audio_channels || "N/A"}</span>`;
        } else if (data.category === "Image") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Dimensões</span><span class="meta-value">${data.dimension || "N/A"}</span>
                <span class="meta-label">DPI</span><span class="meta-value">${data.dpi || "N/A"}</span>`;
        }

        // NOVIDADE: Verifica explicitamente por content_preview ou categoria textual
        if (data.content_preview) {
            html += `<h3>Conteúdo do Documento</h3>
                     <div class="preview-box" id="preview-text">Loading content...</div>
                     <button class="copy-btn" onclick="copyPreviewText()">Copiar Conteúdo</button>`;
        }
    }
    
    content.innerHTML = html;

    // Sincronização garantida: espera o DOM atualizar para injetar o texto
    if (data.content_preview) {
        setTimeout(() => {
            const box = document.getElementById('preview-text');
            if (box) box.textContent = data.content_preview;
        }, 10);
    }
}

function renderColumn(node, level, path = []) {
    const explorer = document.getElementById("explorer");
    while (explorer.children.length > level) explorer.removeChild(explorer.lastChild);
    const col = document.createElement("div"); col.className = "column";
    const keys = Object.keys(node).filter(k => k !== "folder_size_gb").sort((a, b) => {
        const aIsF = node[a].folder_size_gb !== undefined;
        const bIsF = node[b].folder_size_gb !== undefined;
        return (aIsF !== bIsF) ? bIsF - aIsF : a.localeCompare(b);
    });
    keys.forEach(name => {
        const val = node[name];
        const isFolder = val.folder_size_gb !== undefined;
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `<span class="icon">${getIcon(name, isFolder)}</span> <span class="item-text">${name}</span>`;
        item.onclick = () => {
            Array.from(col.children).forEach(c => c.classList.remove('active'));
            item.classList.add('active');
            showMetadata(name, val, path.concat(name));
            if (isFolder) renderColumn(val, level + 1, path.concat(name));
            else while (explorer.children.length > level + 1) explorer.removeChild(explorer.lastChild);
        };
        col.appendChild(item);
    });
    explorer.appendChild(col);
}

function performSearch() {
    const term = document.getElementById("search").value.toLowerCase();
    const explorer = document.getElementById("explorer");
    if (!term) { renderColumn(TREE, 0); return; }
    const results = [];
    function searchNode(node, currentPath) {
        for (const key in node) {
            if (key === "folder_size_gb") continue;
            const item = node[key];
            const isFolder = item.folder_size_gb !== undefined;
            const match = key.toLowerCase().includes(term) || (item.content_preview && item.content_preview.toLowerCase().includes(term));
            if (match) results.push({ name: key, data: item, path: currentPath.concat(key), isFolder });
            if (isFolder) searchNode(item, currentPath.concat(key));
        }
    }
    searchNode(TREE, ["Root"]);
    explorer.innerHTML = "";
    const col = document.createElement("div"); col.className = "column"; col.style.minWidth = "100%";
    results.slice(0, 100).forEach(res => {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<span class="icon">${getIcon(res.name, res.isFolder)}</span> <div><b>${res.name}</b><br><small>${res.path.join("/")}</small></div>`;
        div.onclick = () => showMetadata(res.name, res.data, res.path);
        col.appendChild(div);
    });
    explorer.appendChild(col);
}

document.addEventListener("DOMContentLoaded", () => renderColumn(TREE, 0));
</script>
</body>
