 meu pai tinha uma indústria, meu pai tinha um curtume em São Vicente, por isso que eu nasc"}, "BMG_HV009_fichahistória.docx": {"size_mb": 0.0258, "modified": "2025-04-16 14:19:44", "extension": "DOCX", "full_path": "D:\\BMG 94 anos\\BMG_HV009_Felix Cardamone\\Textual\\BMG_HV009_fichahistória.docx", "category": "Textual", "content_preview": "Informações Básicas\nSobre a História de Vida\n  Observações:"}, "BMG_HV009_fichaminutagem.docx": {"size_mb": 0.0124, "modified": "2025-04-16 14:19:46", "extension": "DOCX", "full_path": "D:\\BMG 94 anos\\BMG_HV009_Felix Cardamone\\Textual\\BMG_HV009_fichaminutagem.docx", "category": "Textual", "content_preview": ""}, "BMG_HV009_fichapersonagem.docx": {"size_mb": 0.026, "modified": "2025-04-16 14:19:48", "extension": "DOCX", "full_path": "D:\\BMG 94 anos\\BMG_HV009_Felix Cardamone\\Textual\\BMG_HV009_fichapersonagem.docx", "category": "Textual", "content_preview": ""}, "folder_size_gb": 0.0}, "Audiovisual": {"Áudio": {"BMG_HV009_Felix Cardamone_áudio.mp3": {"size_mb": 64.7831, "modified": "2025-04-16 14:19:40", "extension": "MP3", "full_path": "D:\\BMG 94 anos\\BMG_HV009_Felix Cardamone\\Audiovisual\\Áudio\\BMG_HV009_Felix Cardamone_áudio.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 2111082.0, "duration": 2111.08}, "folder_size_gb": 0.063}, "Vídeo": {"Íntegra": {"BMG_HV009_Felix Cardamone_íntegra.mp4": {"size_mb": 1192.5328, "modified": "2025-04-14 15:05:36", "extension": "MP4", "full_path": "D:\\BMG 94 anos\\BMG_HV009_Felix Cardamone\\Audiovisual\\Vídeo\\Íntegra\\BMG_HV009_Felix Cardamone_íntegra.mp4", "category": "Video", "dimension": "854x450", "aspect_ratio": "1.9:1", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 2107772.0, "duration": 2107.77}, "folder_size_gb": 1.165}, "Bruto": {"FELIX CARDAMONE CAM A": {"LSR57538.MP4": {"size_mb": 3786.7826, "modified": "2024-08-28 18:01:51", "extension": "MP4", "full_path" bservações:"}, "BMG_HV005_fichapersonagem.docx": {"size_mb": 0.026, "modified": "2025-04-16 14:02:34", "extension": "DOCX", "full_path": "D:\\BMG 94 anos\\BMG_HV005_Angela Annes Guimarães\\Textual\\BMG_HV005_fichapersonagem.docx", "category": "Textual", "content_preview": ""}, "BMG_HV005_transcrição_parte 2.docx": {"size_mb": 0.0126, "modified": "2025-04-16 14:02:40", "extension": "DOCX", "full_path": "D:\\BMG 94 anos\\BMG_HV005_Angela Annes Guimarães\\Textual\\BMG_HV005_transcrição_parte 2.docx", "category": "Textual", "content_preview": "0:03\nP1 -  Vamos lá! Angela, como é que surgiu a criação, a ideia de criar o Instituto?\nR - Então, tudo começou com o nosso bisavô, que ele era uma pessoa muito doadora, gostava de ajudar a todos, e ele foi um dos fundadores do Hospital da Baleia. Depois nossos pais, eles também continuaram fazendo filantropia, querendo melhorar a sociedade. E o Instituto nasceu com esta missão, de dar continuidade às doações, a melhoria da sociedade, as oportunidades de gerar oportunidades, gerar impactos positivos. Então, foi isso!\n0:51\nP1 - Tá bom! Perfeito! E quais as iniciativas principais do Instituto hoje? \nR - O Instituto, ele ajuda qualquer pessoa que tenha alguma vulnerabilidade social. Ele tem vários projetos, pra todas as idades. Ele ajuda crianças e adolescentes com projetos de leitura, esporte, coral. Ajuda também jovens apoiando-os para conseguir achar o seu primeiro emprego. Também ajuda a alfabetização de adultos. E por aí vai. Tem muitos outros projetos também.\n1:43\nP1 - Perfeito! E assim, tem várias iniciativas, né! Como você falou. E o que motivou a escolha dessas iniciativas, especificamente? O que está por trás disso?\nR - É o jeito que os nossos pais gostavam de ajudar. Minha"}, "BMG_HV005_transcrição.docx": {"size_mb": 0.0237, "modified": "2025-04-16 14:02:42", "extension": "DOCX", "full_path": "D:\\BMG 94 anos\\BMG_HV005_Angela Annes Guimarães\\Textual\\BMG_HV005_transcrição.docx", "category": "Textual", "content_preview": "BMG HV005 Ângela Annes Guimarães áudio\nEntrevista de Ângela Annes Guimarães \nEntrevistada por Lucas Tarigoe, Rosana Aguiar e Bruna Oliveira\nBelo Horizonte, 21 de agosto de 2024\nProjeto Memória BMG\nEntrevista BMG_HV005\n(00:19) Ângela, obrigado pela sua presença. A primeira pergunta é muito complicada: o seu nome completo, o local de nascimento e a data, por gentileza.\nR1 - Meu nome completo: Ângela Annes Guimarães. Eu nasci aqui em Belo Horizonte, no dia 20 de junho de 1952.\n(00:46) P1 - Me fala um pouquinho de como que era a sua infância. Talvez você consiga ‘puxar’ umas primeiras memórias que você tem.\nR1 - Minha infância foi o seguinte: meus pais, quando casaram, foram morar na casa da minha avó, do meu avô. Era uma casa grande, com um quintal enorme e com os primos todos morando em frente ou do lado. Então, foi uma coisa muito boa. Eu lembro do contato com meus avós. No jantar todo mundo se reunia na mesa de jantar, para convivência. Meu avô gostava muito de ensinar coisas para a gente, que depois passou isso para o meu pai e ele também teve essa mesma preocupação de ensinar. Então, foi uma coisa que a gente aproveitou demais a infância. Viajávamos todos, todo verão, para Guarap"}, "folder_size_gb": 0.0}, "Audiovisual": {"Áudio": {"BMG_HV005_Angela Annes Guimarães_áudio.mp3": {"size_mb": 82.6514, "modified": "2025-04-16 14:02:30", "extension": "MP3", "full_path": "D:\\BMG 94 anos\\BMG_HV005_Angela Annes Guimarães\\Audiovisual\\Áudio\\BMG_HV005_Angela Annes Guimarães_áudio.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 2695289.0, "duration": 2695.29}, "BMG_HV005_Angela Annes Guimarães_áudio_2.mp3": {"size_mb": 18.4659, "modified": "2025-04-16 14:02:20", "extension": "MP3", "full_path": "D:\\BMG 94 anos\\BMG_HV005_Angela Annes Guimarães\\Audiovisual\\Áudio\\BMG_HV005_Angela Annes Guimarães_áudio_2.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms  Alves Amaral\\Textual\\BMG_TM004_fichahistória.docx", "category": "Textual", "content_preview": "Informações Básicas\nSobre a História de Vida\n  Observações:"}, "BMG_TM004_transcrição.docx": {"size_mb": 0.0128, "modified": "2025-04-16 15:41:48", "extension": "DOCX", "full_path": "D:\\BMG 94 anos\\BMG_TM004_Diego Alves Amaral\\Textual\\BMG_TM004_transcrição.docx", "category": "Textual", "content_preview": "Entrevista de Diego Alves Amaral\nEntrevistado por Bruna Oliveira\nBelo Horizonte, 21 de agosto de 2024\nProjeto Memória BMG\nEntrevista BMG_ TM004 \n0:17 - Diego pra começar eu queria que você dissesse o seu nome completo, o local e a data do seu nascimento?\nR - Diego Alves Amaral, 16/11/1983.\nOnde você nasceu?\nR - Eu nasci em Belo Horizonte\n0:30 - E me conta como que começa a sua história com o Coimbra?\nR - Com o Coimbra? O Coimbra começou em 2008, através de um projeto que o banco começou a desenvolver fundos de investimento com atletas. E aí, em 2009 veio a oportunidade de adquirir o Coimbra, o Coimbra era um clube de Nova Lima. E aí, depois de algumas negociações o clube acabou vindo para a parte do BMG. Então, em 2009 a gente começou a desenvolver um fundo de investimento focado especificamente para atletas de futebol. Então, nessa época a gente poderia comprar partes, percentuais de direitos econômicos dos atletas, e esse fundo foi desenvolvendo durante muitos anos. Até que em 2015 a FIFA editou uma norma, e aí todo esse modelo de negócio que foi estruturado pelo banco, ele acabou tendo que ser alterado, porque houve uma proibição dessa participação que a gente chama de direitos"}, "folder_size_gb": 0.0}, "Audiovisual": {"Áudio": {"BMG_TM004_Diego Alves Amaral_áudio.mp3": {"size_mb": 23.4696, "modified": "2025-04-16 15:41:46", "extension": "MP3", "full_path": "D:\\BMG 94 anos\\BMG_TM004_Diego Alves Amaral\\Audiovisual\\Áudio\\BMG_TM004_Diego Alves Amaral_áudio.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duratio w": "Memória BMG\nEntrevista de Tânia de Cássia Linhares de Souza\nEntrevistada por Lucas Torigoe\nBelo Horizonte, 26/08/2024 \nEntrevista n.º: BMG_TM014\nRealizada por Museu da Pessoa\nRevisada por Bruna Oliveira\nP/1 – Tânia, então as primeiras perguntas são coisas que eu já perguntei pra você agora há pouco, mas só de praxe: qual é seu nome completo, cidade de nascimento e data, por gentileza. \nR –  Meu nome completo é Tânia de Cássia Linhares de Souza, eu nasci em Sabará, Minas Gerais, em 08 de agosto de 1964. \nP/1 – Como é que você conheceu o BMG? Foi o banco, foi o grupo? Você consegue lembrar? \nR - Sim. Inicialmente, eu fui indicada por uma pessoa que trabalhou comigo, que é um ex [funcionário da] Arthur Andersen, é um auditor, que trabalhou comigo quando eu trabalhava na Coca-Cola. Ele foi uma pessoa que fez uma auditoria lá e quando eu saí de lá, ele me indicou para fazer um teste aqui no BMG, me indicou para uma pessoa que já trabalhava aqui no BMG, que também era um ex [funcionário da] Arthur Andersen, um ex-auditor, eles eram conhecidos e essa pessoa que trabalhava aqui havia pedido a ele uma pessoa que ele entendia que precisava, que era o meu perfil. Eu vim aqui falar com essa pe"}, "folder_size_gb": 0.0}, "Iconográfico": {"Acervo": {"BMG_TANIA.docx": {"size_mb": 0.0138, "modified": "1980-01-01 00:00:00", "extension": "DOCX", "full_path": "D:\\BMG 94 anos\\BMG_HV014_Flávia Guimarães\\Iconográfico\\Acervo\\BMG_TANIA.docx", "category": "Textual", "content_preview": "BMG_TANIA\nBMG_FT001\nTania e seus colegas do Grupo BMG.\nBMG_FT002\nTania e seus colegas de trabalho durante uma confraternização de fim de ano do Grupo BMG em 1999. \nBMG_FT003\nTania e seus colegas de trabalho.\nBMG_FT004\nTania e seu colega de trabalho, Wagner, durante uma festa de confraternização de final de ano do Grupo BMG em 2011.\nBMG_FT005\nTania e seus colegas durante a viagem para a Brasfrigo, na antiga fábrica de Luziânia, em 2002.\nBMG_FT006\nTania e seus colegas durante a viagem para a Brasfrigo, na antiga fábrica de Luziânia, em 2002.\nBMG_FT007\nTania e seus colegas durante a viagem para a Brasfrigo, na antiga fábrica de Luziânia, em 1999.\nBMG_FT008\nTania e seus colegas durante a viagem para a Brasfrigo, na antiga fábrica de Luziânia, em 2002.\nBMG_FT009\nTania e seus colegas durante a viagem para a Brasfrigo, na antiga fábrica de Luziânia, em 1999.\nBMG_FT010\nTania e seus colegas durante a viagem para a Brasfrigo, na antiga fábrica de Luziânia, em 2002.\nBMG_FT011\nTania e seus colegas durante a viagem para a Brasfrigo, na antiga fábrica de Luziânia, em 1999.\nBMG_FT012\nTania e seus colegas durante a viagem para a Brasfrigo, na antiga fábrica de Luziânia, em 1999. Ronaldo parece est"}, "ALTA": {"BMG_TM014_FT004.tif": {"size_mb": 14.1095, "modified": "1980-01-01 00:00:00", "extension": "TIF", "full_path": "D:\\BMG 94 anos\\BMG_HV014_Flávia Guimarães\\Iconográfico\\Acervo\\ALTA\\BMG_TM014_FT004.tif", "category": "Image", "dimension": "3304x2192", "resolution": "3304x2192", "color_mode": "RGB", "dpi": "600 DPI", "thumbnail": "thumbnails/HD_0120/thumb_BMG_TM014_FT004.jpg"}, "BMG_TM014_FT008.tif": {"size_mb": 10.5886, "modified": "1980-01-01 00:00:00", "extension": "TIF", "full_path": "D:\\BMG 94 anos\\BMG_HV014_Flávia Guimarães\\Iconográfico\\Acervo\\ALTA\\BMG_TM014_FT008.tif", "category": "Image", "dimension": "3248x2216", "resolution": "3248x2216", "color_mode": "RGB", "dpi": "600 DPI", "thumbnail": "thumbnails/HD_0120/thumb_BMG_TM014_FT008.jpg"}, "BMG_TM014_FT007.tif": {"size_mb": 16.7386, "modified": "1980-01-01 00:00:00", "extension": "TIF", "full_path": "D:\\BMG 94 anos\\BMG_HV014_Flávia Guimarães\\Iconográfico\\Acervo\\ALTA\\BMG_TM014_FT007.tif", "category": "Image", "dimension": "3256x2376", "resolution": "3256x2376", "color_mode": "RGB", "dpi": "600 DPI", "thumbnail": "thumbnails/HD_0120/thumb_BMG_TM014_FT007.jpg"}, "BMG_TM014_FT003.tif": {"size_mb": 14.9956, "modified": "1980-01-01 00:00:00", "extension": "TIF", "full_pat 0, "duration": 3316.52}, "folder_size_gb": 1.972}, "folder_size_gb": 1.972}, "folder_size_gb": 2.039}, "folder_size_gb": 2.765}, "BMG_HV001_Rosana Aguiar": {"Textual": {"BMG_HV001_revisão.docx": {"size_mb": 0.0388, "modified": "2025-04-16 11:53:06", "extension": "DOCX", "full_path": "D:\\BMG 94 anos\\BMG_HV001_Rosana Aguiar\\Textual\\BMG_HV001_revisão.docx", "category": "Textual", "content_preview": "Memória BMG\nEntrevista de Rosana Aguiar\nEntrevistada por Lucas Torigoe e Bruna Oliveira\nBelo Horizonte, 19/08/2024\nEntrevista n.º: BMG_HV001\nRealizada por Museu da Pessoa\nP/1 – A gente sempre começa, então, com uma pergunta muito complexa, que é: qual é o seu nome completo, em que cidade você nasceu e que dia que foi, por favor?  \nR - Meu nome completo é Rosana Aparecida Silva Aguiar, eu nasci no dia 16 de fevereiro, em Delfim Moreira, em Minas Gerais.\nP/1 - E te falaram como foi quando você nasceu, o dia, a gestação?\nR - Minha mãe conta que eu nasci num domingo de Carnaval, tipo três horas da manhã, então deve ser por isso que eu sou meio animada, assim (risos). Acho que basicamente isso. Conta um pouco do berçário, dessas coisas. Mas acho que na cabeça dela ficou principalmente isso: que depois que ela voltou para o quarto ela estava vendo acho que desfile das escolas de samba, alguma coisa assim, na televisão.\nP/1 – Entendi. E você tem irmãos, irmãs?\nR - Tenho sete irmãos, irmãs. É uma família grande, a gente é do interior de Minas. Nasci numa fazenda e depois, com cinco anos, a gente se mudou de lá. Meu pai... eu sou caçula, então as minhas irmãs são mais velhas e aí meus pais"}, "BMG_HV001_fichapersonagem.docx": {"size_mb": 0.0264, "modified": "2025-04-16 11:53:02", "extension": "DOCX", "full_path": "D:\\BMG 94 anos\\BMG_HV001_Rosana Aguiar\\Textual\\BMG_HV001_fichapersonagem.docx", "category": "Textual", "content_preview": ""}, "BMG_HV001_fichahistória.docx": {"size_mb": 0.0265, "modified": "2025-04-16 11:53:02", "extension": "DOCX", "full_path": "D:\\B dio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7089750.0, "duration": 7089.75}, "folder_size_gb": 5.855}, "folder_size_gb": 148.631}, "Áudio": {"BMG_HV002_João Dino Scaglioni_áudio.mp3": {"size_mb": 216.7067, "modified": "2025-04-16 12:04:28", "extension": "MP3", "full_path": "D:\\BMG 94 anos\\BMG_HV002_João Dino Scaglioni\\Audiovisual\\Áudio\\BMG_HV002_João Dino Scaglioni_áudio.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 7089840.0, "duration": 7089.84}, "folder_size_gb": 0.212}, "folder_size_gb": 148.842}, "folder_size_gb": 149.41}, "BMG_HV003_Regina Annes Guimarães": {"Textual": {"BMG_HV003_revisão.docx": {"size_mb": 0.0262, "modified": "2025-04-16 12:10:52", "extension": "DOCX", "full_path": "D:\\BMG 94 anos\\BMG_HV003_Regina Annes Guimarães\\Textual\\BMG_HV003_revisão.docx", "category": "Textual", "content_preview": "Memória BMG\nEntrevista de Regina Annes Guimarães \nEntrevista por Lucas Torigoe e Bruna Oliveira \nBelo Horizonte, 19/08/2024\nEntrevista n.º: BMG_HV003\nRealizada por Museu da Pessoa\nP/1 – Regina, a primeira pergunta é a de praxe: qual o seu nome completo, que cidade você nasceu e que dia que foi, por favor? \nR - Regina Annes Guimarães, eu nasci em Belo Horizonte, no dia 27 de maio de 1953. Tenho 71 anos. \nP/1 - Te contaram como é que foi esse dia que você nasceu?\nR - Sabe que não? Nunca, acho que não lembro de ter tido essa conversa, não, com meus pais. \nP/1 – Agora, você nasceu em que hospital?\nR - Hospital Vera Cruz, em Belo Horizonte. \nP/1 - E quais são as primeiras lembranças que você tem, de pequena? \nR - Eu tenho lembranças, uma lembrança até que não é muito boa, não, de quando eu tinha minha irmã e eu sou a segunda filha e quando eu tinha três anos minha mãe ficou grávida de novo. Nossa, mas eu fiquei com muito ciúme. Eu lembro (risos) que ninguém podia nem falar a respeito disso. Nossa! E eu era muito birrenta, muito emburrada, emburrava com tudo, ficava de cara feia. Mas aí, quando falava o assunto da criança que ia nascer, eu começava a espernear. (risos) E eu fazia birra,"}, "BMG_HV003_fichapersonagem.docx": {"size_mb": 0.026, "modified": "2025-04-16 12:10:16", "extension": "DOCX", "full_path": "D:\\BMG 94 anos\\BMG_HV003_Regina Annes Guimarães\\Textual\\BMG_HV003_fichapersonagem.docx", "category": "Textual", "content_preview": ""}, "BMG_HV003_fichahistória.docx": {"size_mb": 0.0261, "modified": "2025-04-16 12:10:14", "extension": "DOCX", "full_path": "D:\\BMG 94 anos\\BMG_HV003_Regina Annes Guimarães\\Textual\\BMG_HV003_fichahistória.docx", "category": "Textual", "content_preview": "Informações Básicas\nSobre a História de Vida\n  Observações:"}, "folder_size_gb": 0.0}, "Iconográfico": {"Acervo": {"BMG_HV003_FT017.jpeg": {"size_mb": 0.1124, "modified": "1980-01-01 00:00:00", "extension": "JPEG", "full_path": "D:\\BMG 94 anos\\BMG_HV003_Regina Annes Guimarães\\Iconográfico\\Acervo\\BMG_HV003_FT017.jpeg", "category": "Image", "dimension": "1280x756", "resolution": "1280x756", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0120/thumb_BMG_HV003_FT017.jpg"}, "BMG_HV003_FT018.jpeg": {"size_mb": 0.2246, "modified": "1980-01-01 00:00:00", "extension": "JPEG", "full_path": "D:\\BMG 94 anos\\BMG_HV003_Regina Annes Guimarães\\Iconográfico\\Acervo\\BMG_HV003_FT018.jpeg", "category": "Image", "dimension": "1222x798", "resolution": "1222x798", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0120/thumb_BMG_HV003_FT018.jpg"}, "BMG_HV003_FT019.jpeg": {"size_mb": 0.181, "modified": "1980-01-01 00:00:00", "extension": "JPEG", "full_path": "D:\\BMG 94 anos\\BMG_HV003_Regina Annes Guimarães\\Iconográfico\\Acervo\\BMG_HV003_FT019.jpeg", "category": "Image", "dimension": "969x1527", "resolution": "969x1527", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0120/thumb_BMG_HV003_FT019.jpg"}, "BMG_HV003_FT020.jpeg": {"size_mb": 0.1857, "modified": "1980-01-01 00:00:00", "extension": "JPEG", color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0120/thumb_BMG_HV003_FT030.jpg"}, "BMG_HV003_FT031.jpeg": {"size_mb": 0.1512, "modified": "1980-01-01 00:00:00", "extension": "JPEG", "full_path": "D:\\BMG 94 anos\\BMG_HV003_Regina Annes Guimarães\\Iconográfico\\Acervo\\BMG_HV003_FT031.jpeg", "category": "Image", "dimension": "923x556", "resolution": "923x556", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0120/thumb_BMG_HV003_FT031.jpg"}, "BMG_HV003_FT032.jpeg": {"size_mb": 0.1201, "modified": "1980-01-01 00:00:00", "extension": "JPEG", "full_path": "D:\\BMG 94 anos\\BMG_HV003_Regina Annes Guimarães\\Iconográfico\\Acervo\\BMG_HV003_FT032.jpeg", "category": "Image", "dimension": "768x1024", "resolution": "768x1024", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0120/thumb_BMG_HV003_FT032.jpg"}, "Legendas.docx": {"size_mb": 0.016, "modified": "1980-01-01 00:00:00", "extension": "DOCX", "full_path": "D:\\BMG 94 anos\\BMG_HV003_Regina Annes Guimarães\\Iconográfico\\Acervo\\Legendas.docx", "category": "Textual", "content_preview": "BMG_HV003_FT001\nCapa do Livro “Coronel Benjamin Ferreira Guimarães: tecendo histórias” feito pela Dossiê – Agência de Investigação Histórica em 1997, em Belo Horizonte (MG).\nBMG_HV003_FT002\nDesenho em crayon do Coronel Benjamin Ferreira Guimarães\nhttps://muspam.parademinas.mg.gov.br/index.php?option=com_content&view=article&id=157:coronel-benjamim-ferreira-guimaraes&catid=36:textos&Itemid=89\nhttps://hospitaldabaleia.org.br/voce-conhece-a-historia-de-benjamin-ferreira-guimaraes/\nBenjamin Guimarães foi um homem muito à frente do seu tempo, aliando o dinamismo e a força empreendedora à sensibilidade e solidariedade às populações mais carentes daquela época.\nSuas benfeitorias começaram em 1925, quando construiu sua primeira obra assistencial: um orfanato para meninas na cidade de Bom Sucesso, em Minas Gerais. Ele viabilizou também creches, escolas, asilos e hospitais. Seu maior legado foi a criação da Fundação Benjamin Guimarães, mantenedora do Hospital da Baleia.\nA princípio, a entidade, criada em julho de 1944, seria parte da cruzada mineira contra a tuberculose. Para colocar o projeto em prática, ele doou 20 milhões de cruzeiros para a construção de um sanatório e de um preventório."}, "BMG_HV003_FT001.jpg": {"size_mb": 6.079, "modified": "1980-01-01 00:00:00", "extension": "JPG", "full_path": "D:\\BMG 94 anos\\BMG_HV003_Regina Annes Guimarães\\Iconográfico\\Acervo\\BMG_HV003_FT001.jpg", "category": "Image", "dimension": "4944x6992", "resolution": "4944x6992", "color_mode": "RGB", "dpi": "600 DPI", "thumbnail": "thumbnails/HD_0120/thumb_BMG_HV003_FT001.jpg"}, "BMG_HV003_FT002.tif": {"size_mb": 79.1939, "modified": "1980-01-01 00:00:00", "extension": "TIF", "full_path": "D:\\BMG 94 anos\\BMG_HV003_Regina Annes Guimarães\\Iconográfico\\Acervo\\BMG_HV003_FT002.tif", "category": "Image", "dimension": "4141x5422", "resolution": "4141x5422", "color_mode": "RGBA", "dpi": "600 DPI", "thumbnail": "thumbnails/HD_0120/thumb_BMG_HV003_FT002.jpg"}, "BMG_HV003_FT003.tif": {"size_mb": 19.8742, "modified": "1980-01-01 00:00:00", "extension": "TIF", "full_path": "D:\\BMG 94 anos\\BMG_HV003_Regina Annes Guimarães\\Iconográfico\\Acervo\\BMG_HV003_FT003.tif", "category": "Image", "dimension": "2853x1925", "resolution": "2853x1925", "color_mode": "RGBA", "dpi": "600 DPI", "thumbnail": "thumbnails/HD_0120/thumb_BMG_HV003_FT003.jpg"}, "BMG_HV003_FT004.tif": {"size_mb": 6.3569, "modified": "1980-01-01 00:00:00", "extension": "TIF", "full_path": "D:\\BMG 94 anos\\BMG_HV003_Regina Annes Guimarães\\Iconográfico\\Acervo\\BMG_HV003_FT004.tif", "category": "Image", "dimension": "1144x1608", "resolution": "1144x1608", "color_mode": "RGB", "dpi": "600 DPI", "thumbnail": "thumbnails/HD_0120/thumb_BMG_HV003_FT004.jpg"}, "folder_size_gb": 0.111}, "folder_size_gb": 0.111}, "Audiovisual": {"Áudio": {"BMG_HV003_Regina Annes Guimarães_áudio2.mp3": {"size_mb": 128.9398, "modified": r, mas eu lembro Praia da Areia Preta, Praia da Areia Branca, em frente ao Rádio Hotel, a casa lá é vizinha da casa do meu tio-avô também, como era aqui em Belo Horizonte, nós também aqui em Belo Horizonte morávamos na casa que foi do meu av"}, "folder_size_gb": 0.0}, "Audiovisual": {"Áudio": {"BMG_HV004_Ricardo Annes Guimarães_áudio.mp3": {"size_mb": 179.6471, "modified": "2025-04-16 13:32:34", "extension": "MP3", "full_path": "D:\\BMG 94 anos\\BMG_HV004_Ricardo Annes Guimarães\\Audiovisual\\Áudio\\BMG_HV004_Ricardo Annes Guimarães_áudio.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 5872588.0, "duration": 5872.59}, "folder_size_gb": 0.175}, "Vídeo": {"Bruto": {"RICARDO ANNES GUIMARÃES CAM A": {"LSR57429.MP4": {"size_mb": 16624.0066, "modified": "2024-08-20 12:15:16", "extension": "MP4", "full_path": "D:\\BMG 94 anos\\BMG_HV004_Ricardo Annes Guimarães\\Audiovisual\\Vídeo\\Bruto\\RICARDO ANNES GUIMARÃES CAM A\\LSR57429.MP4", "category": "Video", "dimension": "4096x2160", "aspect_ratio": "1.9:1", "frame_rate": "23.976 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1633090.0, "duration": 1633.09}, "LSR57428.MP4": {"size_mb": 18317.8236, "modified": "2024-08-20 11:47:54", "extension": "MP4", "full_path": "D:\\BMG 94 anos\\BMG_HV004_Ricardo Annes Guimarães\\Audiovisual\\Vídeo\\Bruto\\RICARDO ANNES GUIMARÃES CAM A\\LSR57428.MP4", "category": "Video", "dimension": "4096x2160", "aspect_ratio": "1.9:1", "frame_rate": "23.976 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1799214.0, "duration": 1799.21}, "LSR57431.MP4": {"size_mb": 7360.7627, "modified": "2024-08-20 12:57:19", "extension": "MP4", "full_path": "D:\\BMG 94 anos\\BMG_HV004_Ricardo Annes Guimarães\\Audiovisual\\Vídeo\\Bruto\\RICARDO ANNES GUIMARÃES CAM A\\LSR57431.MP4", "category": "Video", "dimension": "4096x2160", "aspect_ratio": "1.9:1", "frame_rate": "23.976 fps", "codec": "HE anda do BMG, com o esquilinho cantando, na Rua Carijós. O Doutor Flávio, a família, os gerentes, né? Então, a poupança do BMG, o esquilinho, sempre foi assim: a garotada tinha as balas, o sorvete, a brincadeira, sempre com o nome BMG, porque sempre foi gostoso ouvir esse nome, a cor e por aí vai, só que a gente vai começar a trabalhar, 14 anos... hoje fala mensageiro, né? Era office boy, na época, o nome era esse, tão comum. Eu tomei conhecimento"}, "folder_size_gb": 0.0}, "Audiovisual": {"Áudio": {"BMG_TM001_Ivanir Severino_áudio.mp3": {"size_mb": 73.9041, "modified": "2025-04-16 15:06:46", "extension": "MP3", "full_path": "D:\\BMG 94 anos\\BMG_TM001_Ivanir Severino da Silva\\Audiovisual\\Áudio\\BMG_TM001_Ivanir Severino_áudio.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 2417577.0, "duration": 2417.58}, "folder_size_gb": 0.072}, "Vídeo": {"Bruto": {"IVANIR SEVERINO CAM B": {"161A6820.MP4": {"size_mb": 24543.5709, "modified": "2024-08-20 15:31:06", "extension": "MP4", "full_path": "D:\\BMG 94 anos\\BMG_TM001_Ivanir Severino da Silva\\Audiovisual\\Vídeo\\Bruto\\IVANIR SEVERINO CAM B\\161A6820.MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 2410450.0, "duration": 2410.45}, "folder_size_gb": 23.968}, "IVANIR SEVERINO DA SILVA CAM A": {"LSR57434.MP4": {"size_mb": 193.1663, "modified": "2024-08-20 15:39:58", "extension": "MP4", "full_path": "D:\\BMG 94 anos\\BMG_TM001_Ivanir Severino da Silva\\Audiovisual\\Vídeo\\Bruto\\IVANIR SEVERINO DA SILVA CAM A\\LSR57434.MP4", "category": "Video", "dimension": "4096x2160", "aspect_ratio": "1.9:1", "frame_rate": "23.976 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 18810.0, "duration": 18.81}, "LSR57435.MP4": {"size_mb": 67.2688, "modified": "2024-08-20 15:40:07", "extension": "MP4", "full_path": começar queria saber o seu nome completo, a data e o local do seu nascimento?\nR - Vanilse dos Santos Oliveira, 1/10/1980, Belo Horizonte, Minas Gerais.\n0:31 - Vanilce, qual é a sua profissão?\nR - Sou contadora.\nE como que se deu essa escolha?\nR - Eu sempre quis trabalhar em escritório, desde quando eu era… Eu comecei a trabalhar com 15 anos, trabalhava numa padaria, e eu sempre pensei em trabalhar numa empresa que fosse bonita. Esse era o meu sonho. E trabalhar de segunda a sexta, porque eu trabalhava de final de semana na padaria. Aí, eu fui estudar as possibilidades. E contabilidade eu me identifiquei, porque era uma profissão onde ia aprender algo que eu poderia usar no meu dia a dia. Aí, fui fazer ciências contábeis. Comecei Ciências Contábeis na Newton Paiva, no ano de 2000, e comecei a procurar estágio na minha área. Aí, eu comecei a trabalhar num escritório de contabilidade, fiquei um ano lá. Eu estudei na Newton Paiva, e lá tinha uns programas de estágio, onde você se inscrever. E apareceu uma entrevista aqui. E"}, "folder_size_gb": 0.0}, "Audiovisual": {"Áudio": {"BMG_TM005_Vanilce dos Santos Oliveira_áudio.mp3": {"size_mb": 31.8947, "modified": "2025-04-16 15:52:00", "extension": "MP3", "full_path": "D:\\BMG 94 anos\\BMG_TM005_Vanilce dos Santos Oliveira\\Audiovisual\\Áudio\\BMG_TM005_Vanilce dos Santos Oliveira_áudio.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 1034632.0, "duration": 1034.63}, "folder_size_gb": 0.031}, "Vídeo": {"Íntegra": {"BMG_TM005_Vanilce dos Santos Oliveira_íntegra.mp4": {"size_mb": 875.3521, "modified": "2025-04-14 15:59:30", "extension": "MP4", "full_path": "D:\\BMG 94 anos\\BMG_TM005_Vanilce dos Santos Oliveira\\Audiovisual\\Vídeo\\Íntegra\\BMG_TM005_Vanilce dos Santos Oliveira_íntegra.mp4", "category": "Video", "dimension": "960x540", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1 .docx", "category": "Textual", "content_preview": "Memória BMG\nEntrevista de Hissa Moisés Elias \nEntrevistado por Bruna Oliveira\nBelo Horizonte, 21/08/2024\nEntrevista n.:BMG_TM006 \nRealizada por Museu da Pessoa\nP/1- Hissa, para começar eu queria que você me dissesse o seu nome completo, a data e o local do seu nascimento?\nR - Tá! Meu nome é Hissa Moisés Elias_____. E a data de nascimento é 24/06/1953. E eu sou nascido em Belo Horizonte.\n0:35 - E me conta, você já conhecia o BMG antes de começar a trabalhar aqui?\nR - Sim! Eu conheci o BMG através do Doutor Ricardo, onde eu te vi oportunidade de ingressar em 1999 no Atlético, e lá permaneci até 2007. Então, eu conhecia não só o Doutor Ricardo, mas como a instituição.\n1:00 - E você trabalhou no Atlético em que lugar?\nR - Olha, eu praticamente fiz um pouco de tudo no Atlético, o Atlético vivia uma fase muito difícil, e aí eu entrei, eu mexia com a parte administrativa, ajudava na parte financeira. Depois em 2004, quando o Ricardo assume a presidência do Atlético pela primeira vez, eu fui ser diretor da base, que é o meu grande sonho_______. E permaneci por um tempo, em 2006 eu passei a ser assessor da presidência, e assim eu fiquei do outro presidente também, o Ziza Valadares, até a sa"}, "folder_size_gb": 0.0}, "Audiovisual": {"Áudio": {"BMG_TM006_Hissa Moyses Elias_áudio.mp3": {"size_mb": 33.0462, "modified": "2025-04-16 15:56:16", "extension": "MP3", "full_path": "D:\\BMG 94 anos\\BMG_TM006_Hissa Elias Moysés\\Audiovisual\\Áudio\\BMG_TM006_Hissa Moyses Elias_áudio.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 1076949.0, "duration": 1076.95}, "folder_size_gb": 0.032}, "Vídeo": {"Bruto": {"HISSA MOISÉS CAM A": {"LSR57449.MP4": {"size_mb": 7648.6727, "modified": "2024-08-21 17:50:13", "extension": "MP4", "full_path": "D:\\BMG 94 anos\\BMG_TM006_Hissa Elias Moysés\\Audiovisual\\Vídeo\\Bruto\\HISSA MOISÉS CAM A\\LSR57449.MP4", "category": "Video", "dimension" const EXTENSIONS = {
    "Video": ['mp4', 'mov', 'mkv', 'avi', 'm4v', 'mts', 'm2ts', 'wmv', 'flv', 'webm', 'vob', 'ogv', '3gp', 'mxf'],
    "Audio": ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'aiff', 'pcm', 'aif'],
    "Image": ['jpg', 'jpeg', 'tif', 'tiff', 'png', 'gif', 'bmp', 'webp', 'cr2', 'nef', 'arw', 'dng'],
    "Textual": ['doc', 'docx', 'pdf', 'txt', 'rtf', 'odt', 'xls', 'xlsx', 'ppt', 'pptx']
};

const ICONS = { "Video": "🎞️", "Audio": "🎧", "Image": "🖼️", "Textual": "📝", "Other": "📄" };

function formatSmartSize(mbValue) {
    if (!mbValue || mbValue === 0) return "0 B";
    let bytes = mbValue * 1024 * 1024; 
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(2) + " " + units[i];
}

function getIcon(name, isFolder) {
    if (isFolder) return "📁";
    const ext = name.split('.').pop().toLowerCase();
    for (const [category, list] of Object.entries(EXTENSIONS)) {
        if (list.includes(ext)) return ICONS[category];
    }
    return ICONS["Other"];
}

function formatTime(ms) {
    if (!ms || ms === 0) return "N/A";
    let totalSeconds = Math.floor(ms / 1000);
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;
    return [hours, minutes, seconds].map(v => v < 10 ? "0" + v : v).join(":");
}

function tryLoadImage(imgElement, thumbnailPath, originalName) {
    if (!thumbnailPath && !originalName) return;
    let path = thumbnailPath || `thumbnails/thumb_${originalName.split('.').slice(0, -1).join('.')}.jpg`;
    imgElement.onerror = function() {
        this.onerror = null;
        this.src = 'https://via.placeholder.com/150?text=Sem+Preview';
    };
    imgElement.src = path;
}

function copyPreviewText() {
    const box = document.getElementById('preview-text');
    if (box) {
        navigator.clipboard.writeText(box.textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy Content"; }, 2000);
    }
}

function calculateFolderStats(node) {
    let stats = { Video: { count: 0, size: 0 }, Audio: { count: 0, size: 0 }, Image: { count: 0, size: 0 }, Textual: { count: 0, size: 0 }, Other: { count: 0, size: 0 }, totalSize: 0 };
    function traverse(curr) {
        for (let key in curr) {
            if (key === "folder_size_gb") continue;
            let item = curr[key];
            if (item.folder_size_gb !== undefined) traverse(item);
            else {
                let cat = item.category || "Other";
                if (!stats[cat]) cat = "Other";
                stats[cat].count++;
                stats[cat].size += item.size_mb || 0;
                stats.totalSize += item.size_mb || 0;
            }
        }
    }
    traverse(node);
    return stats;
}

function showMetadata(name, data, path) {
    const panel = document.getElementById("metadata-panel");
    const content = document.getElementById("meta-content");
    panel.style.display = "block";

    const isFolder = data.folder_size_gb !== undefined;
    let html = `
        <span class="meta-label">Nome</span><span class="meta-value">${name}</span>
        <span class="meta-label">Caminho</span><span class="meta-value">${data.full_path || path.join("/")}</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(data.full_path || "").replace(/\\/g, "\\\\")}')">Copy Path</button>
        <span class="meta-label">Tamanho</span><span class="meta-value" style="color:var(--accent); font-weight:bold;">${formatSmartSize(isFolder ? data.folder_size_gb * 1024 : data.size_mb)}</span>
    `;

    if (isFolder) {
        const stats = calculateFolderStats(data);
        const getPct = (size) => stats.totalSize > 0 ? ((size / stats.totalSize) * 100).toFixed(1) : 0;
        html += `
            <div class="stats-container">
                <span class="meta-label">Conteúdo</span>
                <div class="stats-bar">
                    <div class="bar-segment" style="width:${getPct(stats.Video.size)}%; background:var(--video)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Audio.size)}%; background:var(--audio)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Image.size)}%; background:var(--image)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Textual.size + stats.Other.size)}%; background:var(--other)"></div>
                </div>
                <div class="stat-row"><span>🎞️ Video</span><b>${stats.Video.count}</b></div>
                <div class="stat-row"><span>🎧 Audio</span><b>${stats.Audio.count}</b></div>
                <div class="stat-row"><span>🖼️ Images</span><b>${stats.Image.count}</b></div>
                <div class="stat-row"><span>📄 Docs / Other</span><b>${stats.Textual.count + stats.Other.count}</b></div>
            </div>`;
    } else {
        if (data.category === "Image" || data.thumbnail) {
            html += `<h3>Preview</h3>
                     <div class="img-preview-container">
                        <img id="preview-img" src="" alt="Carregando...">
                     </div>`;
            setTimeout(() => {
                const img = document.getElementById('preview-img');
                tryLoadImage(img, data.thumbnail, name);
            }, 50);
        }

        html += `<span class="meta-label">Modificado</span><span class="meta-value">${data.modified || "N/A"}</span>`;
        
        if (data.category === "Video") {
            // Garante que displayRes exista ou usa a dimensão original
            const displayRes = data.dimension || "N/A"; 
            
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Resolução</span><span class="meta-value">${displayRes}</span>
                <span class="meta-label">Duração / Áudio</span><span class="meta-value">${formatTime(data.duration_ms)} / ${data.audio_channels || "N/A"}</span>
                <span class="meta-label">Aspecto / FPS</span><span class="meta-value">${data.aspect_ratio || "N/A"} / ${data.frame_rate || "N/A"}</span>`;
        } else if (data.category === "Audio") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Duração</span><span class="meta-value">${formatTime(data.duration_ms)}</span>
                <span class="meta-label">Canais</span><span class="meta-value">${data.audio_channels || "N/A"}</span>`;
        } else if (data.category === "Image") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Dimensões</span><span class="meta-value">${data.dimension || "N/A"}</span>
                <span class="meta-label">DPI</span><span class="meta-value">${data.dpi || "N/A"}</span>`;
        }

        // NOVIDADE: Verifica explicitamente por content_preview ou categoria textual
        if (data.content_preview) {
            html += `<h3>Conteúdo do Documento</h3>
                     <div class="preview-box" id="preview-text">Loading content...</div>
                     <button class="copy-btn" onclick="copyPreviewText()">Copiar Conteúdo</button>`;
        }
    }
    
    content.innerHTML = html;

    // Sincronização garantida: espera o DOM atualizar para injetar o texto
    if (data.content_preview) {
        setTimeout(() => {
            const box = document.getElementById('preview-text');
            if (box) box.textContent = data.content_preview;
        }, 10);
    }
}

function renderColumn(node, level, path = []) {
    const explorer = document.getElementById("explorer");
    while (explorer.children.length > level) explorer.removeChild(explorer.lastChild);
    const col = document.createElement("div"); col.className = "column";
    const keys = Object.keys(node).filter(k => k !== "folder_size_gb").sort((a, b) => {
        const aIsF = node[a].folder_size_gb !== undefined;
        const bIsF = node[b].folder_size_gb !== undefined;
        return (aIsF !== bIsF) ? bIsF - aIsF : a.localeCompare(b);
    });
    keys.forEach(name => {
        const val = node[name];
        const isFolder = val.folder_size_gb !== undefined;
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `<span class="icon">${getIcon(name, isFolder)}</span> <span class="item-text">${name}</span>`;
        item.onclick = () => {
            Array.from(col.children).forEach(c => c.classList.remove('active'));
            item.classList.add('active');
            showMetadata(name, val, path.concat(name));
            if (isFolder) renderColumn(val, level + 1, path.concat(name));
            else while (explorer.children.length > level + 1) explorer.removeChild(explorer.lastChild);
        };
        col.appendChild(item);
    });
    explorer.appendChild(col);
}

function performSearch() {
    const term = document.getElementById("search").value.toLowerCase();
    const explorer = document.getElementById("explorer");
    if (!term) { renderColumn(TREE, 0); return; }
    const results = [];
    function searchNode(node, currentPath) {
        for (const key in node) {
            if (key === "folder_size_gb") continue;
            const item = node[key];
            const isFolder = item.folder_size_gb !== undefined;
            const match = key.toLowerCase().includes(term) || (item.content_preview && item.content_preview.toLowerCase().includes(term));
            if (match) results.push({ name: key, data: item, path: currentPath.concat(key), isFolder });
            if (isFolder) searchNode(item, currentPath.concat(key));
        }
    }
    searchNode(TREE, ["Root"]);
    explorer.innerHTML = "";
    const col = document.createElement("div"); col.className = "column"; col.style.minWidth = "100%";
    results.slice(0, 100).forEach(res => {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<span class="icon">${getIcon(res.name, res.isFolder)}</span> <div><b>${res.name}</b><br><small>${res.path.join("/")}</small></div>`;
        div.onclick = () => showMetadata(res.name, res.data, res.path);
        col.appendChild(div);
    });
    explorer.appendChild(col);
}

document.addEventListener("DOMContentLoaded", () => renderColumn(TREE, 0));
</script>
