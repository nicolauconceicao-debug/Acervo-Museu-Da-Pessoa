tro foi na casa da entrevistada em Porto Alegre. Estavam presentes:\n - Professora Raquel Alvarenga Sena Venera;\n - Mestranda Roberta Buriti;\n - Bolsista Gustavo Nart;\n- Bolsista Pedro Brunken;\n- Jaime Fernando dos Santos Junior \n- Francisco\nEdições:\n1. A transcrição foi realizada por Arthur Granero; Bianca Beatriz Lourenço Melatto, Larissa Graper e Rafael Goedert;\n2. E1 – Raquel A. L. S. Venera;\n    E2 – Roberta Buriti;\n    R – Resposta.\n3. (?) – Incerteza sobre a grafia.\nIntrodução \nNo início do áudio, há uma conversa entre a equipe de gravação.\nDesenvolvimento da entrevista:\nE1: Bruna a gente pode começar fazendo um pequeno cabeçalho, você diz seu nome completo, data e local de nascimento.\nR: Meu nome é Bruna Rocha Silveira, eu nasci na cidade de Carazinho no Rio Grande Sul, no dia dezoito de junho de mil novecentos e oitenta e seis.\nE1: E como você gostaria de ser chamada na entrevista?\nR: Bruna.\nE1: Algum apelido?\nR: Não, Bruna... o nome já é curto né? (Risos).\nE1- Poderia nos conta"}, "BRN.t.v. 02.docx": {"size_mb": 0.1052, "modified": "2018-11-12 14:40:32", "extension": "DOCX", "full_path": "D:\\Memórias Multiplas\\Bruna Rocha Silveira\\TRANSCRIÇÃO\\BRN.t.v. 02.docx", "category": "Textual", "content_preview": "ENTREVISTA EXTRAÍDA DO PROJETO DE PESQUISA\nHISTORIAS DE VIDA E PATRIMÔNIO CULTURAL EM REDE: O DESAFIO DA MEMÓRIA DIANTE DA AMEAÇA DA PERDA 2\nEntrevista com Bruna Rocha Silveira em 03/08/2018. O encontro foi na casa da entrevistada em Porto Alegre. Estavam presentes: \n - Professora Raquel Alvarenga Sena Venera;\n - Mestranda Roberta Buriti;\n - Bolsista Gustavo Nart;\n- Bolsista Pedro Brunken;\n- Jaime Fernando dos Santos Junior;\n- Francisco\nEdições:\nA transcrição foi realizada por Arthur Granero; Bianca Beatriz Lourenço Melatto, Larissa Graper e Rafael Goedert;\nFormatação final do texto feito por Bruna de Souza Medina e professora Raquel ALS Venera. O entrevistado leu a transcrição e concordou com os ajustes. Nesse momento fo ": "2018-07-24 13:24:54", "extension": "DOCX", "full_path": "D:\\Memórias Multiplas\\Gustavo San Martin\\TRANSCRIÇÃO\\GUS.t.v. 02.docx", "category": "Textual", "content_preview": "ENTREVISTA EXTRAÍDA DO PROJETO DE PESQUISA\nHISTÓRIAS DE VIDA E PATRIMÔNIO CULTURAL EM REDE: O DESAFIO DA MEMÓRIA DIANTE DA AMEAÇA DA PERDA 2\nEntrevista com Gustavo San Martin em 01/03/2018. O encontro foi no Estúdio de Áudio Visual do Museu da Pessoa em São Paulo. Estavam presentes: \n - Professora Raquel Alvarenga Sena Venera;\n - Mestrando Wesley Batista de Albuquerque;\n - Câmera do Museu da Pessoa Carolina Rocha Braz.\nEdições:\nA transcrição foi realizada por Gustavo Nart, Larissa Graper, Elisa Vieira e Rafael Goedert.\nFormatação final do texto feito por Marina Passos, Bruna de Souza Medina e professora Raquel ALS Venera. O entrevistado leu a transcrição e concordou com os ajustes. Nesse momento foi feito uma limpeza dos cacoetes da fala, um acréscimo de palavras entre parênteses que ajudam no entendimento do contexto e a formatação do texto. Foi feita algumas pequenas correções, especialmente nas palavras como: tá-está; pra-para a, pro-para o, né-não é? Em alguns casos os cacoetes foram mantidos como o ‘ah, tá!’, ai, daí, então, com o objetivo de preservar o gênero oral do documento. Foram mantidas também as construções das frases e o estilo da oralidade. Em itálico estão pequenas"}, "folder_size_gb": 0.0}, "folder_size_gb": 10.113}, "Jaime Fernando dos Santos": {"VÍDEO EDITADO (POR PEDRO)": {"JME.v.f.mp4": {"size_mb": 9506.8277, "modified": "2018-08-31 23:04:02", "extension": "MP4", "full_path": "D:\\Memórias Multiplas\\Jaime Fernando dos Santos\\VÍDEO EDITADO (POR PEDRO)\\JME.v.f.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7728053.0, "duration": 7728.05}, "folder_size_gb": 9.284}, "FICHAS IMAGENS": {"FICHA IMAGEM JME. 01.docx": {"size iplas\\Jaime Fernando dos Santos\\IMAGENS CEDIDAS\\JME.c.31.jpg", "category": "Image", "dimension": "4032x3024", "resolution": "4032x3024", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0093/thumb_JME.c.31.jpg"}, "folder_size_gb": 0.027}, "TRANSCRIÇÃO": {"JME.t.v. 01.docx": {"size_mb": 0.0623, "modified": "2018-11-12 14:41:30", "extension": "DOCX", "full_path": "D:\\Memórias Multiplas\\Jaime Fernando dos Santos\\TRANSCRIÇÃO\\JME.t.v. 01.docx", "category": "Textual", "content_preview": "ENTREVISTA EXTRAÍDA DO PROJETO DE PESQUISA\nHISTORIAS DE VIDA E PATRIMÔNIO CULTURAL EM REDE: O DESAFIO DA MEMÓRIA DIANTE DA AMEAÇA DA PERDA 2\nJaime Fernando Santos Junior, em 02/08/2018. O encontro foi na casa do entrevistado em Porto Alegre. Estavam presentes:\nEstavam presentes: \n- Professora Raquel Alvarenga Sena Venera;\n - Mestranda Roberta Buriti;\n - Bolsista Gustavo Nart;\n- Bolsista Pedro Brunken;\n- Jaime Fernando dos Santos Junior \n- Francisco\nEdição\n1. A transcrição foi realizada por Brena Corrêa da Silva; Carlos Gabriel de Freitas e Bruna de Souza Medina.\n2. E1 – Raquel A. L. S. Venera;\n    E2 – Roberta Buriti;\n    R – Resposta.\n3. (?) – Incerteza sobre a grafia.\nIntrodução\nOs entrevistadores, equipe e entrevistados conversam sobre como será feita as filmagens e fazem os últimos ajustes antes de iniciar a entrevista.\nE1: Então, Jaime... É acho que a gente começa fazendo um pequeno cabeçalho no áudio, você pode começar falar seu nome completo, a data e local de nascimento.\nR: Jaime Fernando Santos Junior de Petrópolis, Rio de Janeiro, quinze do seis de oitenta e três é meu nascimento.  \nE1: ... É como que você gostaria de ser chamado nessa entrevista? Ser conhecido como Jota,"}, "JME.t.v. 02.docx": {"size_mb": 0.0483, "modified": "2018-12-14 16:12:22", "extension": "DOCX", "full_path": "D:\\Memórias Multiplas\\Jaime Fernando dos Santos\\TRANSCRIÇÃO\\JME.t.v. 02.docx", "category": "Textual", "content_preview": "ENTREVISTA EXTRAÍDA DO PROJETO DE PESQUISA\nHISTÓRIAS DE VIDA E PATRIMÔNIO CULTURAL EM REDE: O DESAFIO DA MEMÓRIA DIANTE DA AMEAÇA DA PERDA 2\nJaime Fernando Santos Junior, em 02/08/2018. O encontro foi na casa do entrevistado em Porto Alegre.\nEstavam presentes: \n- Professora Raquel Alvarenga Sena Venera;\n - Mestranda Roberta Buriti;\n - Bolsista Gustavo Nart;\n- Bolsista Pedro Brunken;\n- Jaime Fernando dos Santos Junior;\n- Francisco.\nEdições:\n1. A transcrição foi realizada por Brena Corrêa da Silva; Carlos, Bruna de Souza Medina.\n2. Formatação final do texto feito por Rafael Goedert. Nesse momento foi feito uma limpeza dos cacoetes da fala, um acréscimo de palavras entre parênteses que ajudam no entendimento do contexto e a formatação do texto. Foi feita algumas pequenas correções, especialmente nas palavras como: tá-está; pra-para a, pro-para o, né-não é? Em alguns casos os cacoetes foram mantidos como o ‘ah, tá!’, ai, daí, então, com o objetivo de preservar o gênero oral do documento. Foram mantidas também as construções das frases e o estilo da oralidade. Em itálico estão pequenas sínteses ou conversas de acontecimentos no entorno da entrevista, assim como o contexto externo da ent"}, "folder_size_gb": 0.0}, "folder_size_gb": 9.321}, "Maria Eduarda Abdala Jose": {"FICHAS IMAGENS": {"FICHA IMAGEM MRE. 01.docx": {"size_mb": 0.2498, "modified": "2018-05-08 23:51:22", "extension": "DOCX", "full_path": "D:\\Memórias Multiplas\\Maria Eduarda Abdala Jose\\FICHAS IMAGENS\\FICHA IMAGEM MRE. 01.docx", "category": "Textual", "content_preview": "FUNDAÇÃO EDUCACIONAL DA REGIÃO DE JOINVILLE - FURJ  \nUNIVERSIDADE DA REGIÃO DE JOINVILLE - UNIVILLE\n      MESTRADO EM EDUCAÇÃO\nMESTRADO EM PATRIMÔNIO CULTURAL E SOCIEDADE\nGRUPO DE PESQUISA SUBJETIVIDADES E (AUTO)BIOGRAFIAS"}, "FICHA IMAGEM MRE. 02.docx": {"size_mb": 0.2033, "modified": "2018-05-08 23:54:08", "extension": "DOCX", "full_path": "D:\\Memórias Multiplas\\Maria Eduarda Abdala Jose\\FICHAS IMAGENS\\FICHA IMAGEM MRE. 02.docx", "category": "Tex nEntrevista com Natasha Kaminski em 11/11/2016. O encontro foi no Laboratório Audivisual da Univille. Estavam presentes:\n - Professora Raquel Alvarenga Sena Venera;\n - Mestrando Wesley Batista de Albuquerque;\n- Mestranda Maurren Bartz Szymczak;\n- Bolsista Gabriela Lennert;\nEdições:\nA transcrição foi realizada por Gabriela Lennert, Gustavo Nart e Bianca Beatriz Lourenço Melatto;\nE1: Raquel Alvarenga Sena Venera;\n           E2: Wesley Batista Albuquerque;\n           R: Resposta.\n[?] – Incerteza na grafia\t\nIntrodução\nEquipe ajusta os equipamentos, câmeras de vídeo, Raquel pergunta a Natasha se já pode começar a entrevista e ela afirma que sim.\nDesenvolvimento da Entrevista\nE1ꟷ Então pra começar, Natasha, você pode falar pra gente o seu nome completo, data de nascimento, cidade que você nasceu.\nRꟷ Meu nome é Natasha, tenho vinte e seis anos e sou natural de Curitiba, Paraná.\nE1ꟷ E qual que é o nome dos seus pais?\nRꟷ O nome do meu pai é João Carlos Kaminski e da minha mãe é Marili Aparecida da Costa Vieira Kaminski.\nE1ꟷ Como você chamava eles quando"}, "NAT.t.v. 02.docx": {"size_mb": 0.1001, "modified": "2018-11-12 14:31:10", "extension": "DOCX", "full_path": "D:\\Memórias Multiplas\\Natasha Kaminski\\TRANSCRIÇÃO\\NAT.t.v. 02.docx", "category": "Textual", "content_preview": "ENTREVISTA EXTRAÍDA DO PARA PROJETO DE PESQUISA\nHISTÓRIAS DE VIDA E PATRIMÔNIO CULTURAL EM REDE: O DESAFIO DA MEMÓRIA DIANTE DA AMEAÇA DA PERDA 2\nEntrevista com Natasha Kaminski em 11/11/2016. O encontro foi no Laboratório Audivisual da Univille. Estavam presentes:\n- Professora Raquel Alvarenga Sena Venera;\n- Mestrando Wesley Batista de Albuquerque;\n- Mestranda Maurren Bartz Szymczak;\n- Bolsista Gabriela Lennert;\nEdições:\nA transcrição foi realizada por Gabriela Lennert, Gustavo Nart e Bianca Beatriz Lourenço Melatto;\nE1: Raquel Alvarenga Sena Venera;\n  \tE2: Wesley Batista Albuquerque;\nR: Resposta.\nFormatação final do texto feito por Bianca Beatriz Lourenço Melatto, Bruna de Souza Medina e professora Raquel ALS Venera. A entrevistada leu a transcrição e concordou com os ajustes. Nesse momento foi feito uma limpeza dos cacoetes da fala, um acréscimo de palavras entre parênteses que ajudam no entendimento do contexto e a formatação do texto. Foi feita algumas pequenas correções, especialmente nas palavras como: tá-está; pra-para a, pro-para o, né-não é? Em alguns casos os cacoetes foram mantidos como o ‘ah, tá!’, ai, daí, então, com o objetivo de preservar o gênero oral do documento."}, "folder_size_gb": 0.0}, "folder_size_gb": 19.997}, "Paula Padro Kfouri": {"VÍDEOS EDITADOS (POR PEDRO)": {"PLA.v.f.mp4": {"size_mb": 5129.9573, "modified": "2018-06-13 15:58:30", "extension": "MP4", "full_path": "D:\\Memórias Multiplas\\Paula Padro Kfouri\\VÍDEOS EDITADOS (POR PEDRO)\\PLA.v.f.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4169499.0, "duration": 4169.5}, "folder_size_gb": 5.01}, "FICHAS IMAGENS": {"FICHA IMAGEM PLA. 01.docx": {"size_mb": 0.2184, "modified": "2018-05-08 16:54:56", "extension": "DOCX", "full_path": "D:\\Memórias Multiplas\\Paula Padro Kfouri\\FICHAS IMAGENS\\FICHA IMAGEM PLA. 01.docx", "category": "Textual", "content_preview": "FUNDAÇÃO EDUCACIONAL DA REGIÃO DE JOINVILLE - FURJ  \nUNIVERSIDADE DA REGIÃO DE JOINVILLE - UNIVILLE\n      MESTRADO EM EDUCAÇÃO\nMESTRADO EM PATRIMÔNIO CULTURAL E SOCIEDADE\nGRUPO DE PESQUISA SUBJETIVIDADES E (AUTO)BIOGRAFIAS"}, "FICHA IMAGEM PLA. 02.docx": {"size_mb": 0.2094, "modified": "2018-05-08 23:29:50", "extension": "DOCX", "full_path": "D:\\Memórias Multiplas\\Paula Padro Kfouri\\FICHAS IMAGENS\\FICHA IMAGEM PLA. 02.docx", "category": "Textual", "content_preview": "FUNDAÇÃO EDUCACIONAL DA REGIÃO DE JOINVILLE - FURJ  \nUNIVERSIDADE DA REGIÃO DE JOINVILLE - UNIVILLE\n      MESTRADO EM EDUCAÇÃO\nMESTRADO EM PATRIMÔNIO CULTURAL E SOCIEDADE\nGRUPO D  10:56:42", "extension": "DOCX", "full_path": "D:\\Memórias Multiplas\\Marlene Oliveira Raitz\\TRANSCRIÇÃO REVISADA E AUTORIZADA\\MLN. t.f.docx", "category": "Textual", "content_preview": "ENTREVISTA EXTRAÍDA DO PROJETO DE PESQUISA\nHISTORIAS DE VIDA E PATRIMÔNIO CULTURAL EM REDE: O DESAFIO DA MEMÓRIA DIANTE DA AMEAÇA DA PERDA\n1ª entrevista com Marlene Oliveira Raitz em 25/09/2015. O encontro foi na casa de Eliane Böhr a pedido da entrevistada com a equipe da pesquisa e seu esposo, Sr. Protásio Raitz: \n- Mestranda Eliane Böhr; \n- Voluntária Maureen Bartz;\n- Mestrando Augusto Luciano; \n- Bolsista Eloyse Davet\nNesse encontro a professora Raquel Alvarenga Sena Venera não estava presente. \nEdições:\nA transcrição foi realizada per Camila Hass e Eloyse Davet;\nA leitura coletiva foi desenvolvida pela Eliane Böhr e Marlene Oliveira Raitz. Nesse momento alguns detalhes foram alterados a pedido da entrevistada.\nFormatação final do texto por Raquel ALS Venera e Eliane Böhr. Nesse momento foi feito uma limpeza dos cacoetes da fala, um acréscimo de palavras entre parênteses que ajudam no entendimento do contexto e a formatação do texto. Optamos por algumas pequenas correções, especialmente nas palavras como: tá-está; pra-para a, pro-para o, né-não é? Em alguns casos os cacoetes foram mantidos como o ‘ah, tá!’, ai ou daí. Foram mantidas também as construções das frases e o estilo d"}, "MLN.t.c.pdf": {"size_mb": 0.6038, "modified": "2016-10-13 18:18:46", "extension": "PDF", "full_path": "D:\\Memórias Multiplas\\Marlene Oliveira Raitz\\TRANSCRIÇÃO REVISADA E AUTORIZADA\\MLN.t.c.pdf", "category": "Textual", "content_preview": "Marlene – início 25/09 \n\nEliane começa a entrevista explicando como funciona a pesquisa, qual a finalidade, \ncomo ela conduz as  entrevistas, das atividades manuais como as mandalas, sobre \nas  histórias  de  vida  de  cada  entrevistado  (o  som  do  violão  inicia  neste  momento \nsuavemente). Comenta que a mandala é usada como um trabalho terapêutico, com \ncores,  fios,  e  fala  sobre  Jung  e  sobre  seu  estudo.  Eliane  pergunta  se  Marlene  tem \nexperiência com trabalhos manuais e Marlene responde que sim que faz crochê. E \nMarlene  comenta  que  está fazendo uma  blusa.  E Eliane  comenta  que  irá  aprender \ncom ela por conta da sua experiência.  \n\nEliane  pede  para  Marlene  escolher  as  cores  e  logo  Marlene  escolhe  e  fala  que \nchamou sua atenção pois lembra da sua infância, do seu pai. Marlene conta que seu \npai  fazia  artesanato  de  cipó,  com  palitinhos  que  eram  flexíveis,  e  vendia  como \ncestinhas. (som de trovoada e chuva fina caindo). Seu Pedro José Oliveira. Comenta \ntambém que fazia vassouras com este tipo de material.  \n\nEliane: o que é um “pãe”? \n\nMarlene: é um pai amigo, que alimenta os filhos, um pai que ajuda a tomar banho, \num  pai  que  t"}, "folder_size_gb": 0.001}, "folder_size_gb": 11.018}, "Michael Schaffner": {"MCH.v.f. 02-12-2015. 02.wmv": {"size_mb": 3023.0554, "modified": "2017-06-07 00:41:02", "extension": "WMV", "full_path": "D:\\Memórias Multiplas\\Michael Schaffner\\MCH.v.f. 02-12-2015. 02.wmv", "category": "Video", "dimension": "1280x720", "aspect_ratio": "16:9 (HD)", "frame_rate": "25.000 fps", "codec": "VC-1", "audio_channels": "Stereo", "audio_codec": "WMA", "duration_ms": 5900260.0, "duration": 5900.26}, "MCH.v.f. 03-12-2015. 03.wmv": {"size_mb": 3659.0053, "modified": "2017-08-08 11:54:56", "extension": "WMV", "full_path": "D:\\Memórias Multiplas\\Michael Schaffner\\MCH.v.f. 03-12-2015. 03.wmv", "category": "Video", "dimension": "1280x720", "aspect_ratio": "16:9 (HD)", "frame_rate": "25.000 fps", "codec": "VC-1", "audio_channels": "Stereo", "audio_codec": "WMA", "duration_ms": 7747980.0, "duration": 7747.98}, "MCH.v.f. 25-11-2015. 01.wmv": {"size_mb": 3835.3959, "modified": "2017-06-04 05:54:28", "extension": "WMV", "full_path": "D:\\Memórias Multiplas\\Michael Schaffner\\MCH.v.f. 25-11-2015. 01.wmv", "category": "Video", "dimensi pecialmente nas palavras como: tá-está; pra-para a, pro-para o, né-não é? Em alguns casos os cacoetes foram mantidos como o ‘ah, tá!’, ai ou daí. Foram mantidas também as construções das frases e o estilo da oralidade. Em especial deixamos marcas da oralidade estrangeira, como conjugação verbal ou de gênero. Em i"}, "folder_size_gb": 0.0}, "folder_size_gb": 7.491}, "folder_size_gb": 132.187}, "HQR": {"HQR_HV001": {"Audiovisual": {"Acesso": {"HQR_HV001.mp4": {"size_mb": 2088.9759, "modified": "2016-10-19 09:42:06", "extension": "MP4", "full_path": "D:\\HQR\\HQR_HV001\\Audiovisual\\Acesso\\HQR_HV001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1621120.0, "duration": 1621.12}, "folder_size_gb": 2.04}, "Preservação": {"00011.MTS": {"size_mb": 1849.4531, "modified": "2015-10-21 17:41:44", "extension": "MTS", "full_path": "D:\\HQR\\HQR_HV001\\Audiovisual\\Preservação\\00011.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 728152.883557, "duration": 728.15}, "00008.MTS": {"size_mb": 4090.1484, "modified": "2015-10-21 16:36:22", "extension": "MTS", "full_path": "D:\\HQR\\HQR_HV001\\Audiovisual\\Preservação\\00008.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 1614156.673323, "duration": 1614.16}, "00009.MTS": {"size_mb": 4090.2598, "modified": "2015-10-21 17:03:08", "extension": "MTS", "full_path": "D:\\HQR\\HQR_HV001\\Audiovisual\\Preservação\\00009.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 1605623.1  mesma origem, todas as minhas famílias, não há muita miscigenação. O Rio Grande do Sul é um estado intensamente colonizado na primeira metade do século XIX pelos alemães e na segunda metade pelos italianos. O Rio Grande do Sul, portanto, é um estado que têm praticamente três grandes zonas geográficas étnicas e culturais que são a zona da campanha, que é luso-espanhola toda ela, ela é ime"}, "folder_size_gb": 0.0}, "folder_size_gb": 15.93}, "HQR_HV002": {"Audiovisual": {"Preservação": {"00005.MTS": {"size_mb": 1727.2148, "modified": "2015-10-22 15:17:54", "extension": "MTS", "full_path": "D:\\HQR\\HQR_HV002\\Audiovisual\\Preservação\\00005.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 680609.092429, "duration": 680.61}, "00000.MTS": {"size_mb": 43.7109, "modified": "2015-10-22 14:01:04", "extension": "MTS", "full_path": "D:\\HQR\\HQR_HV002\\Audiovisual\\Preservação\\00000.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 17430.30158, "duration": 17.43}, "00001.MTS": {"size_mb": 545.7305, "modified": "2015-10-22 14:04:48", "extension": "MTS", "full_path": "D:\\HQR\\HQR_HV002\\Audiovisual\\Preservação\\00001.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 214632.864533, "duration": 214.63}, "00002.MTS": {"size_mb": 4089.8672, "modified": "2015-10-22 14:33:32", "extension": "MTS", "full_path": "D:\\HQR\\HQR_HV002\\Audiovisual\\Preservação\\00002.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 1608666.719 \Textual\\HQR_HV002.docx", "category": "Textual", "content_preview": "Histórias Que Reciclam\nDepoimento de Ana Maria da Silva de Oliveira\nEntrevistada por Lucas Torigoe\nSão Paulo, 22 de outubro de 2015\nRealização Museu da Pessoa \nHQR_HV02_Ana Maria da Silva de Oliveira\nTranscrito por Karina Medici Barrella\nMW Transcrições\nP/1 – Qual é o seu nome inteiro, local e data de nascimento?\nR – É Ana Maria da Silva de Oliveira.\nP/1 – Você nasceu em que dia?\nR – Dia nove de dezembro de 1961.\nP/1 – Em que cidade que você nasceu?\nR – Acopiara, Ceará.\nP/1 – Faz o mesmo para o seu pai. Qual é o nome inteiro dele?\nR – Raimundo Nonato Vieira.\nP/1 – Que ano que ele nasceu?\nR – Ele é do dia 12 de dezembro de 1913.\nP/1 – Ele nasceu em que cidade?\nR – Ele nasceu na cidade de Várzea Alegre.\nP/1 – É Ceará também?\nR – Ceará.\nP/1 – E o que ele fazia e o que a família dele fazia?\nR – É agricultor.\nP/1 – Eles plantavam o quê?\nR – Milho, feijão, algodão, isso aí (risos).\nP/1 – E a sua mãe, qual é o nome dela?\nR – Minha mãe era Ana Alves Vieira.\nP/1 – Ela nasceu em que dia?\nR – Ela era do dia 18 de abril de 1919.\nP/1 – Nasceu no Ceará também?\nR – É, Várzea Alegre também.\nP/1 – O que a família dela fazia, você sabe?\nR – Era agricultor também.\nP/1 – Todo mundo agricultor.\nR – Era"}, "folder_size_gb": 0.0}, "folder_size_gb": 16.9}, "HQR_HV003": {"Audiovisual": {"Audio": {"HQR_HV003.mp3": {"size_mb": 169.6682, "modified": "2015-10-27 17:33:58", "extension": "MP3", "full_path": "D:\\HQR\\HQR_HV003\\Audiovisual\\Audio\\HQR_HV003.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 11118168.0, "duration": 11118.17}, "folder_size_gb": 0.166}, "Preservação": {"00004.MTS": {"size_mb": 1808.0098, "modified": "2015-10-23 11:45:16", "extension": "MTS", "full_path": "D:\\HQR\\HQR_HV003\\Audiovisual\\Preservação\\00004.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", " do por Lucas Torigoe\nSão Paulo, 23 de outubro de 2015 \nRealização Museu da Pessoa \nHQR_HV03_Mateus Calligioni de Mendonça\nTranscrito por Karina Medici Barrella\nMW Transcrições\nP/1 – Mateus, fala para mim o seu nome inteiro, local e data de nascimento?\nR – Mateus Calligioni de Mendonça. Nasci em Ribeirão Preto em dez de janeiro de 1981.\nP/1 – E o seu pai, qual é o nome dele?\nR – Meu pai é Pedro Batista de Mendonça.\nP/1 – Ele nasceu quando e onde?\nR – Nasceu em 1942, no dia cinco de dezembro, em Sacramento, Minas Gerais, Ponte Alta.\nP/1 – E qual é a origem da família dele? É de lá mesmo?\nR – A origem da família do meu pai é mineira, alguns portugueses, mas todo mundo vivia em Minas mesmo, meu avô e minha avó eram mineiros.\nP/1 – E o que seus avós fazem, o seu pai fazia lá?\nR – Os meus avós eram da zona rural, trabalhavam em fazenda, tal. O meu pai era vendedor de livros e depois que ele migrou. Na verdade ele vendia ovos de galinha, vendia algumas coisas que eram do sítio, em cima do cavalo lá em Minas, depois quando ele fica jovem ele migra pra Ribeirão Preto, onde ele conhece a minha mãe.\nP/1 – Ainda na família do seu"}, "folder_size_gb": 0.0}, "folder_size_gb": 19.729}, "HQR_HV004": {"Audiovisual": {"Acesso": {"HQR_HV004.mp4": {"size_mb": 4169.8232, "modified": "2016-11-09 15:28:06", "extension": "MP4", "full_path": "D:\\HQR\\HQR_HV004\\Audiovisual\\Acesso\\HQR_HV004.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3365863.0, "duration": 3365.86}, "folder_size_gb": 4.072}, "Preservação": {"00001.MTS": {"size_mb": 4090.6289, "modified": "2015-10-28 09:36:38", "extension": "MTS", "full_path": "D:\\HQR\\HQR_HV004\\Audiovisual\\Preservação\\00001.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": " clam\nDepoimento de Jair do Amaral\nEntrevistado por Lucas Torigoe \nSão Paulo, 28 de outubro de 2015\nHQR_HV004_Jair do Amaral\nRealização Museu da Pessoa\nTranscrito por Claudia Lucena\nMW Transcrições\nP/1 – Jair, fala o seu nome completo pra gente, local e data de nascimento.\nR – Jair do Amaral, nasci em São Paulo, em 18 de abril 1971.\nP/1 – O seu pai, qual que é o nome inteiro dele e aonde nasceu?\nR – Meu pai é Nelson do Amaral, ele nasceu também aqui em São Paulo, em 1931.\nP/1 – Qual que é a história da família dele? Como é que ele veio parar em São Paulo?\nR – Então, as referências são poucas, né, porque eu tive pouco contato com os meus avós paternos, né, e maternos também, eu não fui aquela criança que tinha, que ia pra casa do vô, da vó, né? E meu pai, ele casou tarde, né, com 37, 35, 37 anos, e as minhas lembranças são bem vagas em relação ao meu avô paterno, principalmente, e ao meu avô materno, então as referências são poucas. Mas eu sei que são, assim, que foram pessoas pobres, né, no caso do meu pai, são de São Paulo e, no caso da minha mãe, parece que do interior de Minas Gerais.\nP/1 – Já que você falou, qual que é o nome da sua mãe?\nR – Da minha mã"}, "folder_size_gb": 0.0}, "folder_size_gb": 12.57}, "HQR_HV005": {"Audiovisual": {"Preservação": {"HQR_HV05_PT02": {"00000.MTS": {"size_mb": 4090.1133, "modified": "2015-11-04 12:59:34", "extension": "MTS", "full_path": "D:\\HQR\\HQR_HV005\\Audiovisual\\Preservação\\HQR_HV05_PT02\\00000.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 1613133.483693, "duration": 1613.13}, "00001.MTS": {"size_mb": 681.8906, "modified": "2015-11-04 13:04:02", "extension": "MTS", "full_path": "D:\\HQR\\HQR_HV005\\Audiovisual\\Preservação\\HQR_HV05_PT02\\00001.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": " ti.\nP/1 – Em que cidade do Haiti?\nR – Porto Príncipe.\nP/1 – Porto Príncipe. E como que era em Porto Príncipe?\nR – É bom. Lá a coisa é bom. Pra mim é bom, não sei pra você porque você nunca foi pra lá, não?\nP/1 – Não.\nR – É bom. Porque mio país, lo gusto como é.\nP/1 – E quando você veio pro Brasil? Em que ano?\nR – Em fevereiro passado. Esse ano mesmo.\nP/1 – E por que você veio pro Brasil?\nR – Não, porque eu tá lá em Venezuela, passa sete anos em Venezuela porque la coisa dela não tá muito bom, tá ruim, então seria melhor venha a viver aqui, mais tranquila. Porque a la não tem muita seguridad, seguridad tá ruim e também a coisa lá não tá muito bom.\nP/1 – E você fazia o que na Venezuela?\nR – Vendendo e trabalhando em um mercado que se chama Mercado Bolivariano. Antes.\nP/1 – Antes. E lá você aprendeu castelhano, foi isso?\nR – É, ala."}, "folder_size_gb": 0.0}, "folder_size_gb": 2.272}, "HQR_HV008": {"Audiovisual": {"Audio": {"HQR_HV008.mp3": {"size_mb": 75.662, "modified": "2015-12-17 13:06:28", "extension": "MP3", "full_path": "D:\\HQR\\HQR_HV008\\Audiovisual\\Audio\\HQR_HV008.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 4957512.0, "duration": 4957.51}, "folder_size_gb": 0.074}, "Preservação": {"00011.MTS": {"size_mb": 2529.4629, "modified": "2015-12-01 13:01:06", "extension": "MTS", "full_path": "D:\\HQR\\HQR_HV008\\Audiovisual\\Preservação\\00011.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 977422.100875, "duration": 977.42}, "00007.MTS": {"size_mb": 1498.9453, "modified": "2015-12-01 11:46:58", "extension": "MTS", "full_path": "D:\\HQR\\HQR_HV008\\Audiovisual\\Preservação\\00007.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "d cimento?\nR – Meu nome é Maria Tereza Montenegro, nascida em São Paulo no dia 25 do um de 66.\nP/1 – E o seu pai, qual o nome inteiro dele?\nR – Meu pai eu não sei quem é, até hoje não tive conhecimento. A minha mãe nunca falou e também passou em branco, no meu registro não tem o nome do meu pai.\nP/1 – Sua mãe é Eunice, certo?\nR – Minha mãe é Elenice.\nP/1 – Qual é o nome inteiro dela?\nR – Elenice Montenegro.\nP/1 – E ela nasceu quando?\nR – Ela nasceu na Bahia, no dia 22 do sete, agora já não sei o ano direitinho.\nP/1 – E por que ela veio pra São Paulo, como é que foi a história dela?\nR – Ela não fala muito dela, sabe? Minha mãe é uma pessoa muito reservada. No entanto na família eu só conheço... Eu não tenho tio, nem tia, nem nada, só é eu e minha mãe, ela nunca apresentou ninguém, nem avós, nem ninguém. E ela me deu para uma família quan"}, "folder_size_gb": 0.0}, "folder_size_gb": 12.016}, "HQR_TM003": {"Audiovisual": {"Preservação": {"00013.MTS": {"size_mb": 3909.7266, "modified": "2015-12-01 14:30:42", "extension": "MTS", "full_path": "D:\\HQR\\HQR_TM003\\Audiovisual\\Preservação\\00013.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 1542513.750508, "duration": 1542.51}, "folder_size_gb": 3.818}, "Audio": {"HQR_TM003.mp3": {"size_mb": 23.5477, "modified": "2015-12-17 13:27:26", "extension": "MP3", "full_path": "D:\\HQR\\HQR_TM003\\Audiovisual\\Audio\\HQR_TM003.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 1542600.0, "duration": 1542.6}, "folder_size_gb": 0.023}, "folder_size_gb": 3.841}, "Textual": {"HQR_TM003.docx": {"size_mb": 0.0415, "modified": "2016-04-18 10:36:58", "extension": "DOCX", "full_path": "D:\\HQR\\HQR_TM003\\Textual\\HQR_TM003.docx", "category": "Textual", "content_preview": "Histórias Que Reciclam \nDepoimento de Vanessa Meneses dos Santos\nEntrevistado por Lucas Torigoe\nSão Paulo, data \nRealização Museu da Pessoa \nTM03_Vanessa Meneses dos Santos\nTranscrito por Karina Medici Barrella\nMW Transcrições\nP/1 – Boa tarde, obrigada de novo. Você pode falar pra mim o seu nome completo.\nR – Vanessa Meneses dos Santos.\nP/1 – Onde você nasceu e quando?\nR – Eu nasci na Bahia, em Itajubá, em 1992, dia 13 de agosto.\nP/1 – E o seu pai, qual é o nome completo dele?\nR – Meu pai? É Valdeci Pereira dos Santos.\nP/1 – Ele nasceu onde?\nR – Ele nasceu em Itajubá.\nP/1 – E você sabe qual é a origem da família dele, de onde eles vieram?\nR – Não.\nP/1 – E a sua mãe, qual é o nome completo dela?\nR – É Miralva Maria Vieira de Meneses.\nP/1 – Ela nasceu onde?\nR – Eu acho que foi na Bahia também.\nP/1 – Na Bahia também. E você sabe como é que seus pais se conheceram?\nR – Não.\nP/1 – E como era a vida em Itajubá, você se lembra mais ou menos?\nR – Ah, era uma vida meio complicadinha.\nP/1 – Ah é? Por quê?\nR – Porque não tinha muito trabalho, aí nós tinha que capinar, às vezes não tinha o que comer. Difícil.\nP/1 – E como é que era a cidade de Itajubá, Vanessa?\nR – Era bom. Tirando nossas part"}, "folder_size_gb": 0.0}, "folder_size_gb": 3.841}, "HQR_TM001": {"Audiovisual": {"Preservação": {"00005.MTS": {"size_mb": 41.5781, "modified": "2015-10-21 12:14:26", "extension": "MTS", "full_path": "D:\\HQR\\HQR_TM001\\Audiovisual\\Preservação\\00005.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 18446.211873, "duration": 18.45}, "00006.MTS": {"size_mb": 3409.8633, "modified": "2015-10-21 12:41:48", "extension": "MTS", "full_path": "D:\\HQR\\HQR_TM001\\Audiovisual\\Preservação\\00006.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 1602579.607 tamente diferente. Não entrei direto na Odontologia então eu fiz um ano de cursinho e nesse período eu vi que eu não gostava de estudar nada relacionado a Biomédicas.\nP/1 – Fez cursinho aonde?\nR – Eu fiz cursinho no Anglo, em Santo André. Aí eu acabei indo pra Engenharia. E minha ideia era fazer Engenharia Mecânica, mas durante a faculdade você tem dois anos de Engenharia que são matérias básicas e aí eu vi que eu também não gostava de estudar aquilo, eu estava procurando alguma coisa diferente. E na minha faculdade tinha uma especialização que era de Engenharia Têxtil e me pareceu muito interessante porque ali você não tinha professores formados pra dar aula e sim eram profissionais que davam aula nos seus períodos à noite, no período livre, que eles reservavam pra faculdade. Então era"}, "folder_size_gb": 0.0}, "folder_size_gb": 10.423}, "folder_size_gb": 175.935}, "HQI": {"HQI_HV001": {"Audiovisual": {"Preservação": {"00000.MTS": {"size_mb": 2068.0, "modified": "2015-11-05 07:25:32", "extension": "MTS", "full_path": "D:\\HQI\\HQI_HV001\\Audiovisual\\Preservação\\00000.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 814147.994651, "duration": 814.15}, "00001.MTS": {"size_mb": 61.6699, "modified": "2015-11-05 15:51:58", "extension": "MTS", "full_path": "D:\\HQI\\HQI_HV001\\Audiovisual\\Preservação\\00001.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 24959.297322, "duration": 24.96}, "00002.MTS": {"size_mb": 4089.9844, "modified": "2015-11-05 16:18:30", "extension": "MTS", "full_path": "D:\\HQI\\HQI_HV001\\Audiovisual\\Preservação\\00002.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": de imigrantes. Do lado do meu pai, imigrantes italianos, que vieram pra cá para o Brasil e como todo imigrante, acabou se estabelecendo em ocupações no interior do Estado de São Paulo e lá em Rio Claro, na região, cidades ao redor de Rio Claro,. então, meus avós paternos haviam se estabelecido e se encontraram, formaram uma família. Meu pai então, nasceu na cidade de Rio Claro. \nP/1 – E o senhor sabe da onde que a sua fam"}, "folder_size_gb": 0.0}, "folder_size_gb": 27.907}, "HQI_HV003": {"Fotos": {"HQI_HV003_MO001.jpg": {"size_mb": 0.3515, "modified": "2016-07-01 14:37:48", "extension": "JPG", "full_path": "D:\\HQI\\HQI_HV003\\Fotos\\HQI_HV003_MO001.jpg", "category": "Image", "dimension": "1920x1080", "resolution": "1920x1080", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0093/thumb_HQI_HV003_MO001.jpg"}, "folder_size_gb": 0.0}, "Textual": {"HQI_HV003.doc": {"size_mb": 0.105, "modified": "2016-02-29 16:06:16", "extension": "DOC", "full_path": "D:\\HQI\\HQI_HV003\\Textual\\HQI_HV003.doc", "category": "Textual"}, "HQI_HV003.docx": {"size_mb": 0.0351, "modified": "2026-03-09 14:09:44", "extension": "DOCX", "full_path": "D:\\HQI\\HQI_HV003\\Textual\\HQI_HV003.docx", "category": "Textual", "content_preview": "Histórias Que Iluminam \nDepoimento de André Ghizzi Guazzelli\nEntrevistado por Lucas Torigoe\nLocal, data \nRealização Museu da Pessoa \nHQI_HV003_André Ghizzi Guazzelli\nTranscrito por Karina Medici Barrella\nMW Transcrições\nP/1 – Obrigado pela usa presença, André. A gente agradece bastante o seu tempo e a sua disposição por estar aqui.\nR – De nada.\nP/1 – Você pode dizer o seu nome inteiro, local e data de nascimento pra gente?\nR – É André Ghizzi Guazzelli. Eu nasci em São Paulo em 18 de setembro de 85. Então eu tenho 30 anos.\nP/1 – E a sua mãe, você pode fazer o mesmo?\nR – Minha mãe nasceu em Tietê, que é no interior de São Paulo. Ela nasceu em 58, dia 12 de agosto.\nP/1 – Qual é o nome inteiro dela?\nR – Eliana Ghizzi Guazzelli.\nP/1 74}, "Textual": {"HQI_HV005.doc": {"size_mb": 0.1509, "modified": "2016-03-08 12:17:38", "extension": "DOC", "full_path": "D:\\HQI\\HQI_HV005\\Textual\\HQI_HV005.doc", "category": "Textual"}, "HQI_HV005.docx": {"size_mb": 0.0475, "modified": "2026-03-09 14:09:48", "extension": "DOCX", "full_path": "D:\\HQI\\HQI_HV005\\Textual\\HQI_HV005.docx", "category": "Textual", "content_preview": "Histórias que Iluminam\nDepoimento de Antônio Carlos Tanjioni\nEntrevistada por Lucas Torigoe\nSão Paulo, \nRealização Museu da Pessoa\nHQI_HV05 Antônio Carlos Tanjioni\nTranscrito por Mariana Wolff\nMW Transcrições\nP/1 – Então, Antônio, você pode falar primeiro o seu nome completo…\nR – Bom, meu nome é Antônio Carlos Tanjioni, estou atualmente com… vou fazer 67 anos de idade e contando a minha vida, é muito legal, queria agradecer essa oportunidade que o Museu da Pessoa tá me dando e é uma longa história que emociona às vezes, de você lembrar de certas coisas que você viveu, né? E eu nasci na Penha, onde eu moro até hoje, o lugar onde eu nasci, exatamente, na Rua Maria Teresa Assunção e ali, eu vivi até os meus 11 anos de idade, onde eu sempre morei ali naquele lugar e sou de uma família, meu pai, minha mãe e o meu irmão, meu único irmão, onde a minha vida sempre foi ganhar no Natal, uma bola, então, a minha infância… eu fui muito feliz na minha infância, apesar de não ter nada materialmente, meu pai era um operário, minha mãe era uma empregada domestica e nós fomos criados com muita humildade, mas graças a Deus, nunca faltou nada para nós, né? E todo ano… e o meu sonho era ser jogador de"}, "folder_size_gb": 0.0}, "folder_size_gb": 22.902}, "HQI_HV004": {"Fotos": {"HQI_HV004_MO001.jpg": {"size_mb": 0.2186, "modified": "2016-07-01 14:45:30", "extension": "JPG", "full_path": "D:\\HQI\\HQI_HV004\\Fotos\\HQI_HV004_MO001.jpg", "category": "Image", "dimension": "1920x1080", "resolution": "1920x1080", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0093/thumb_HQI_HV004_M D:\\HQI\\HQI_HV004\\Textual\\HQI_HV004.docx", "category": "Textual", "content_preview": "Histórias Que Iluminam\nDepoimento de Regis Gund\nEntrevistada por Lucas Torigoe\nSão Paulo, \nRealização Museu da Pessoa\nHQI_HV04_Regis Gund\nTranscrito por Mariana Wolff\nMW Transcrições\nP/1 – Primeiro, bom dia, obrigado Regis pela sua presença, seu tempo. Você pode falar pra mim o seu nome completo, local e data de nascimento, Regis?\nR – Meu nome é Regis Gund, eu nasci em 30 de janeiro de 73 em Porto Alegre, Rio Grande do Sul.\nP/1 – Tá. E qual que é o nome do seu pai?\nR – Meu pai chama Helmet Gund.\nP/1 – Ele nasceu onde?\nR – Ele nasceu em Porto Alegre também, ele é filho de imigrantes alemães, primeira geração aqui no Brasil, nasceu em 1957, no Hospital Lazzarotto em Porto Alegre.\nP/1 – E sabe qual que é a… a sua família é da Alemanha, mas por quê que eles vieram para cá? Quando?\nR – Na verdade, meus avós vieram fugidos da Guerra, eles moravam numa região limite com a Polônia, que estava em guerra muito antes da guerra que ia estourar no continente e eles decidiram vir porque já tinham pessoas no Brasil há alguns anos. Então, meu vô Guilherme e minha vó Natalia saíram da Alemanha, pegaram um navio até a Argentina e depois, vieram em caravana com outros imigrantes da Argentina para o B"}, "folder_size_gb": 0.0}, "Audiovisual": {"Audio": {"HQI_HV004.mp3": {"size_mb": 137.3371, "modified": "2016-03-01 17:29:02", "extension": "MP3", "full_path": "D:\\HQI\\HQI_HV004\\Audiovisual\\Audio\\HQI_HV004.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 8999520.0, "duration": 8999.52}, "folder_size_gb": 0.134}, "Preservação": {"00002.MTS": {"size_mb": 4089.9902, "modified": "2015-12-03 09:15:48", "extension": "MTS", "full_path": "D:\\HQI\\HQI_HV004\\Audiovisual\\Preservação\\00002.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo",  em Leme, no Estado de São Paulo, no dia 17 de novembro de 1962.\nP/1 – Tá e o seu pai?\nR – Meu pai Paris Piedade, ele nasceu acho que em Barretos, não tenho certeza, no dia oito de julho de 1920, é falecido já há muitos anos e minha mãe, Mirian Fregan Bonfante, nasceu em Leme, dois de dezembro de 23, também já falecida.\nP/1 – O seu pai, você sabe, qual que é a origem da família dele, os seus avós, o quê que eles faziam?\nR – Olha, a origem que eu saiba, é portuguesa, né, e eles são de uma outra cidade do interior, eles vieram de Itapeva, uma cidade, enfim, próxima de Itapetininga, enfim, e não sei dizer, é curioso, eu sei muito mais da história da minha mãe do que da história da família do meu pai, dos Piedades, né? Eu sei que são de Itapeva, pelo menos, esse núcleo, é isso.\nP/1 – Eles trabalhavam, assim, você não sabe, mais ou menos o que aconteceu?\nR – Não sei, não sei. Eu t"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"00003.MTS": {"size_mb": 3283.166, "modified": "2016-04-29 17:51:16", "extension": "MTS", "full_path": "D:\\HQI\\HQI_HV007\\Audiovisual\\Preservação\\00003.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 1290740.383772, "duration": 1290.74}, "00004.MTS": {"size_mb": 1503.4688, "modified": "2016-04-29 18:07:54", "extension": "MTS", "full_path": "D:\\HQI\\HQI_HV007\\Audiovisual\\Preservação\\00004.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 592512.09517, "duration": 592.51}, "00005.MTS": {"size_mb": 4089.9551, "modified": "2016-04-29 18:42:10", "extension": "MTS", "full_path": "D:\\HQI\\HQI_HV007\\Audiovisual\\Preservação\\00005.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": 05-05 14:02:50", "extension": "MTS", "full_path": "D:\\HQI\\HQI_HV008\\Audiovisual\\Preservação\\00019.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 24960.272458, "duration": 24.96}, "folder_size_gb": 17.466}, "folder_size_gb": 17.466}, "Textual": {"HQI_HV008.doc": {"size_mb": 0.1318, "modified": "2016-05-25 15:18:42", "extension": "DOC", "full_path": "D:\\HQI\\HQI_HV008\\Textual\\HQI_HV008.doc", "category": "Textual"}, "HQI_HV008.docx": {"size_mb": 0.0458, "modified": "2026-03-09 14:09:54", "extension": "DOCX", "full_path": "D:\\HQI\\HQI_HV008\\Textual\\HQI_HV008.docx", "category": "Textual", "content_preview": "Histórias Que Iluminam \nDepoimento de Valdir Folgueral Rodrigues\nEntrevistado por Felipe Rocha e Tatiana Rommel\n05 de maio de 2016 \nRealização Museu da Pessoa \nHQI_HV_08_Valdir Folgueral Rodrigues\nTranscrito por Karina Medici Barrella\nMW Transcrições\nP/1 – Valdir, queria primeiramente agradecer pelo tempo, pela disposição, obrigadão por topar essa proposta. A gente vai começar com a pergunta básica, pedir para você falar o seu nome, o local e a data de nascimento.\nR – Valdir Folgueral Rodrigues. São Paulo, capital, no bairro do Mandaqui.\nP/1 – Novamente queria agradecer pela disposição e pelo tempo aí. Começar com a perguntinha qual é o seu nome, o local e a data de nascimento.\nR – Meu nome é Valdir Fogueral Rodrigues, nasci em 17 de novembro de 1963 na cidade de São Paulo, capital.\nP/1 – Bairro?\nR – Mandaqui.\nP/1 – Qual é o nome dos seus pais?\nR – Meu pai é Manuel Folgueral Rodrigues, minha mãe Terezinha do Menino Jesus Folgueral.\nP/1 – O que eles faziam?\nR – Meu pai é encanador, minha mãe era do lar. Foi doméstica e depois que casou só do lar, só cuida da gente.\nP/1 – Sua família tem alguma origem, ascendência?\nR – Sim, espanhola.\nP/1 – Tem alguma história de família que você sai"}, "folder_size_gb": 0.0}, "folder_size_gb": 17.51}, "HQI_HV009": {"Fotos": {"HQI_HV009_MO001.jpg": {"size_mb": 0.4502, "modified": "2016-06-06 15:15:38", "extension": "JPG", "full_path": "D:\\HQI\\HQI_HV009\\Fotos\\HQI_HV009_MO001.jpg", "category": "Image", "dimension": "1920x1080", "resolution": "1920x1080", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0093/thumb_HQI_HV009_MO001.jpg"}, "HQI_HV009_FT010.png": {"size_mb": 6.6171, "modified": "2016-06-06 16:04:00", "extension": "PNG", "full_path": "D:\\HQI\\HQI_HV009\\Fotos\\HQI_HV009_FT010.png", "category": "Image", "dimension": "2158x1576", "resolution": "2158x1576", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0093/thumb_HQI_HV009_FT010.jpg"}, "HQI_HV009_FT009.png": {"size_mb": 11.3719, "modified": "2016-06-06 16:22:56", "extension": "PNG", "full_path": "D:\\HQI\\HQI_HV009\\Fotos\\HQI_HV009_FT009.png", "category": "Image", "dimension": "2434x3003", "resolution": "2434x3003", "color_mode": "RGB", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0093/thumb_HQI_HV009_FT009.jpg"}, "HQI_HV009_FT008.png": {"size_mb": 2.6508, "modified": "2016-06-06 16:24:20", "extension": "PNG", "full_path": "D:\\HQI\\HQI_HV009\\Fotos\\HQI_HV009_FT008.png", "category": "Image", "dimension": "1506x1077", "resolution": "1506x1077", "color_mode": "RGB", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0093/thumb_HQI_HV009_FT008.jpg"}, "HQI_HV009_FT007.png": {"size_mb": 3.8671, "modified": "2016-06-06 16:27:14", "extension": "PNG", "full_path": "D:\\HQI\\HQI_HV009\\Fotos\\HQI_HV009_FT007.png", "category": "Image", "dimension": "1216x1826", "resolution": "1216x1826", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0093/thumb_HQI_HV009_FT007.jpg"}, "HQI_HV009_FT006.png": {"size_mb": 3.3333, "modified": "2016-06-06 16:29:14", "extension": "PNG", "full_path": "D:\\HQI\\HQI_HV009\\Fotos\\HQI_HV009_FT006.png", "category": "Image", "dimension": "1819x1263", "resolution": "1819x1263", "color_mode": "RGB stórias Que Iluminam \nDepoimento de Gabriela Sayuri Yamaguchi\nEntrevistada por Felipe Rocha\nSão Paulo, 12/05/2016 \nRealização Museu da Pessoa \nHQI_HV_09_Gabriela Sayuri Yamaguchi\nTranscrito por Karina Medici Barrella\nMW Transcrições\nP/1 – Primeiramente, Gabriela, quero agradecer pelo tempo, pela disposição e boa vontade. Queria começar perguntando o seu nome completo, local e a data de nascimento.\nR – Meu nome é Gabriela Sayuri Yamaguchi. Eu nasci em São Paulo no dia 26 de março de 1973.\nP/1 – E qual é o nome dos seus pais?\nR – O nome da minha mãe é Tokiko Yamaguchi, Tokiko Kato de solteira. E o meu pai é Keiji Yamaguchi.\nP/1 – Quem são seus pais, o que eles faziam, fala um pouco pra gente sobre eles.\nR – O meu pai nasceu no Japão e veio para o Brasil quando ele já era grandinho, já tinha 23 anos. Então ele é bem aquele japonês que cresceu no pós-guerra com o máximo de falta de tudo o que a gente possa imaginar na vida dele. Tem poucas histórias que ele contou pra gente, mas todas as histórias que ele contou são histórias bem trágicas de não ter desde comida nem condições de comprar material nenhum pra escola. Mas em nenhum momento ele deixou de estudar, ele se formou como técnic"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"00004.MTS": {"size_mb": 4090.752, "modified": "2016-05-12 17:03:06", "extension": "MTS", "full_path": "D:\\HQI\\HQI_HV009\\Audiovisual\\Preservação\\00004.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 1619169.815238, "duration": 1619.17}, "00005.MTS": {"size_mb": 4090.3066, "modified": "2016-05-12 17:30:02", "extension": "MTS", "full_path": "D:\\HQI\\HQI_HV009\\Audiovisual\\Preservação\\00005.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration const EXTENSIONS = {
    "Video": ['mp4', 'mov', 'mkv', 'avi', 'm4v', 'mts', 'm2ts', 'wmv', 'flv', 'webm', 'vob', 'ogv', '3gp', 'mxf'],
    "Audio": ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'aiff', 'pcm', 'aif'],
    "Image": ['jpg', 'jpeg', 'tif', 'tiff', 'png', 'gif', 'bmp', 'webp', 'cr2', 'nef', 'arw', 'dng'],
    "Textual": ['doc', 'docx', 'pdf', 'txt', 'rtf', 'odt', 'xls', 'xlsx', 'ppt', 'pptx']
};

const ICONS = { "Video": "🎞️", "Audio": "🎧", "Image": "🖼️", "Textual": "📝", "Other": "📄" };

function formatSmartSize(mbValue) {
    if (!mbValue || mbValue === 0) return "0 B";
    let bytes = mbValue * 1024 * 1024; 
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(2) + " " + units[i];
}

function getIcon(name, isFolder) {
    if (isFolder) return "📁";
    const ext = name.split('.').pop().toLowerCase();
    for (const [category, list] of Object.entries(EXTENSIONS)) {
        if (list.includes(ext)) return ICONS[category];
    }
    return ICONS["Other"];
}

function formatTime(ms) {
    if (!ms || ms === 0) return "N/A";
    let totalSeconds = Math.floor(ms / 1000);
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;
    return [hours, minutes, seconds].map(v => v < 10 ? "0" + v : v).join(":");
}

function tryLoadImage(imgElement, thumbnailPath, originalName) {
    if (!thumbnailPath && !originalName) return;
    let path = thumbnailPath || `thumbnails/thumb_${originalName.split('.').slice(0, -1).join('.')}.jpg`;
    imgElement.onerror = function() {
        this.onerror = null;
        this.src = 'https://via.placeholder.com/150?text=Sem+Preview';
    };
    imgElement.src = path;
}

function copyPreviewText() {
    const box = document.getElementById('preview-text');
    if (box) {
        navigator.clipboard.writeText(box.textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy Content"; }, 2000);
    }
}

function calculateFolderStats(node) {
    let stats = { Video: { count: 0, size: 0 }, Audio: { count: 0, size: 0 }, Image: { count: 0, size: 0 }, Textual: { count: 0, size: 0 }, Other: { count: 0, size: 0 }, totalSize: 0 };
    function traverse(curr) {
        for (let key in curr) {
            if (key === "folder_size_gb") continue;
            let item = curr[key];
            if (item.folder_size_gb !== undefined) traverse(item);
            else {
                let cat = item.category || "Other";
                if (!stats[cat]) cat = "Other";
                stats[cat].count++;
                stats[cat].size += item.size_mb || 0;
                stats.totalSize += item.size_mb || 0;
            }
        }
    }
    traverse(node);
    return stats;
}

function showMetadata(name, data, path) {
    const panel = document.getElementById("metadata-panel");
    const content = document.getElementById("meta-content");
    panel.style.display = "block";

    const isFolder = data.folder_size_gb !== undefined;
    let html = `
        <span class="meta-label">Nome</span><span class="meta-value">${name}</span>
        <span class="meta-label">Caminho</span><span class="meta-value">${data.full_path || path.join("/")}</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(data.full_path || "").replace(/\\/g, "\\\\")}')">Copy Path</button>
        <span class="meta-label">Tamanho</span><span class="meta-value" style="color:var(--accent); font-weight:bold;">${formatSmartSize(isFolder ? data.folder_size_gb * 1024 : data.size_mb)}</span>
    `;

    if (isFolder) {
        const stats = calculateFolderStats(data);
        const getPct = (size) => stats.totalSize > 0 ? ((size / stats.totalSize) * 100).toFixed(1) : 0;
        html += `
            <div class="stats-container">
                <span class="meta-label">Conteúdo</span>
                <div class="stats-bar">
                    <div class="bar-segment" style="width:${getPct(stats.Video.size)}%; background:var(--video)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Audio.size)}%; background:var(--audio)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Image.size)}%; background:var(--image)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Textual.size + stats.Other.size)}%; background:var(--other)"></div>
                </div>
                <div class="stat-row"><span>🎞️ Video</span><b>${stats.Video.count}</b></div>
                <div class="stat-row"><span>🎧 Audio</span><b>${stats.Audio.count}</b></div>
                <div class="stat-row"><span>🖼️ Images</span><b>${stats.Image.count}</b></div>
                <div class="stat-row"><span>📄 Docs / Other</span><b>${stats.Textual.count + stats.Other.count}</b></div>
            </div>`;
    } else {
        if (data.category === "Image" || data.thumbnail) {
            html += `<h3>Preview</h3>
                     <div class="img-preview-container">
                        <img id="preview-img" src="" alt="Carregando...">
                     </div>`;
            setTimeout(() => {
                const img = document.getElementById('preview-img');
                tryLoadImage(img, data.thumbnail, name);
            }, 50);
        }

        html += `<span class="meta-label">Modificado</span><span class="meta-value">${data.modified || "N/A"}</span>`;
        
        if (data.category === "Video") {
            // Garante que displayRes exista ou usa a dimensão original
            const displayRes = data.dimension || "N/A"; 
            
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Resolução</span><span class="meta-value">${displayRes}</span>
                <span class="meta-label">Duração / Áudio</span><span class="meta-value">${formatTime(data.duration_ms)} / ${data.audio_channels || "N/A"}</span>
                <span class="meta-label">Aspecto / FPS</span><span class="meta-value">${data.aspect_ratio || "N/A"} / ${data.frame_rate || "N/A"}</span>`;
        } else if (data.category === "Audio") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Duração</span><span class="meta-value">${formatTime(data.duration_ms)}</span>
                <span class="meta-label">Canais</span><span class="meta-value">${data.audio_channels || "N/A"}</span>`;
        } else if (data.category === "Image") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Dimensões</span><span class="meta-value">${data.dimension || "N/A"}</span>
                <span class="meta-label">DPI</span><span class="meta-value">${data.dpi || "N/A"}</span>`;
        }

        // NOVIDADE: Verifica explicitamente por content_preview ou categoria textual
        if (data.content_preview) {
            html += `<h3>Conteúdo do Documento</h3>
                     <div class="preview-box" id="preview-text">Loading content...</div>
                     <button class="copy-btn" onclick="copyPreviewText()">Copiar Conteúdo</button>`;
        }
    }
    
    content.innerHTML = html;

    // Sincronização garantida: espera o DOM atualizar para injetar o texto
    if (data.content_preview) {
        setTimeout(() => {
            const box = document.getElementById('preview-text');
            if (box) box.textContent = data.content_preview;
        }, 10);
    }
}

function navigateToPath(path) {
    // Limpa a busca e renderiza a visualização normal
    document.getElementById("search").value = "";
    renderColumn(TREE, 0);

    let currentNode = TREE;
    // O primeiro item do path costuma ser "Root" ou o nome do HD, pulamos ele se necessário
    const pathParts = path.slice(1); 

    pathParts.forEach((part, index) => {
        setTimeout(() => {
            const columns = document.querySelectorAll('.column');
            const currentColumn = columns[index];
            if (!currentColumn) return;

            const items = currentColumn.querySelectorAll('.item');
            for (let item of items) {
                if (item.querySelector('.item-text').textContent === part) {
                    item.click(); // Simula o clique no item para abrir a próxima coluna ou metadados
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    break;
                }
            }
        }, (index + 1) * 100); // Pequeno delay para a coluna anterior renderizar
    });
}

function renderColumn(node, level, path = []) {
    const explorer = document.getElementById("explorer");
    while (explorer.children.length > level) explorer.removeChild(explorer.lastChild);
    const col = document.createElement("div"); col.className = "column";
    const keys = Object.keys(node).filter(k => k !== "folder_size_gb").sort((a, b) => {
        const aIsF = node[a].folder_size_gb !== undefined;
        const bIsF = node[b].folder_size_gb !== undefined;
        return (aIsF !== bIsF) ? bIsF - aIsF : a.localeCompare(b);
    });
    keys.forEach(name => {
        const val = node[name];
        const isFolder = val.folder_size_gb !== undefined;
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `<span class="icon">${getIcon(name, isFolder)}</span> <span class="item-text">${name}</span>`;
        item.onclick = () => {
            Array.from(col.children).forEach(c => c.classList.remove('active'));
            item.classList.add('active');
            showMetadata(name, val, path.concat(name));
            if (isFolder) renderColumn(val, level + 1, path.concat(name));
            else while (explorer.children.length > level + 1) explorer.removeChild(explorer.lastChild);
        };
        col.appendChild(item);
    });
    explorer.appendChild(col);
}

function performSearch() {
    const term = document.getElementById("search").value.toLowerCase();
    const explorer = document.getElementById("explorer");
    if (!term) { renderColumn(TREE, 0); return; }
    
    const results = [];
    function searchNode(node, currentPath) {
        for (const key in node) {
            if (key === "folder_size_gb") continue;
            const item = node[key];
            const isFolder = item.folder_size_gb !== undefined;
            const match = key.toLowerCase().includes(term) || (item.content_preview && item.content_preview.toLowerCase().includes(term));
            
            if (match) results.push({ name: key, data: item, path: currentPath.concat(key), isFolder });
            if (isFolder) searchNode(item, currentPath.concat(key));
        }
    }
    
    searchNode(TREE, ["Root"]); // Certifique-se que o nome base aqui condiz com seu JSON
    explorer.innerHTML = "";
    const col = document.createElement("div"); col.className = "column"; col.style.minWidth = "100%";
    
    results.slice(0, 100).forEach(res => {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<span class="icon">${getIcon(res.name, res.isFolder)}</span> 
                         <div><b>${res.name}</b><br><small style="color:#888">${res.path.join(" › ")}</small></div>`;
        
        // AQUI ESTÁ A MUDANÇA: Chama a navegação em vez de apenas mostrar metadados
        div.onclick = () => navigateToPath(res.path);
        
        col.appendChild(div);
    });
    explorer.appendChild(col);
}

document.addEventListener("DOMContentLoaded", () => renderColumn(TREE, 0));
</script>
</body>
</html>
