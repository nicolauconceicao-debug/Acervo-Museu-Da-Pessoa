o de Orlando Júnior_trechos_selecionados.doc": {"size_mb": 0.1284, "modified": "2014-07-29 10:30:15", "extension": "DOC", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV_001_ Elson Pedro de Orlando Júnior_trechos_selecionados.doc", "category": "Textual"}, "HECE_HV_002_Eunice de Souza_trechos_selecionados.doc": {"size_mb": 0.0674, "modified": "2014-07-29 10:29:21", "extension": "DOC", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV_002_Eunice de Souza_trechos_selecionados.doc", "category": "Textual"}, "HECE_HV_003_Beatriz Calderario de Miranda_trechos_selecionados.doc": {"size_mb": 0.1851, "modified": "2014-08-18 08:09:56", "extension": "DOC", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV_003_Beatriz Calderario de Miranda_trechos_selecionados.doc", "category": "Textual"}, "HECE_HV_006_Debora Cristina Shomer_trechos.doc": {"size_mb": 0.0693, "modified": "2014-09-15 12:18:42", "extension": "DOC", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV_006_Debora Cristina Shomer_trechos.doc", "category": "Textual"}, "HECE_HV_007_Ajussimeire Benfica Santana_trechos.doc": {"size_mb": 0.1191, "modified": "2014-09-15 12:18:42", "extension": "DOC", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV_007_Ajussimeire Benfica Santana_trechos.doc", "category": "Textual"}, "HECE_HV_008_ Antônio Carlos Lemos de Oliveira_trechos.doc": {"size_mb": 0.0996, "modified": "2014-09-15 12:18:42", "extension": "DOC", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV_008_ Antônio Carlos Lemos de Oliveira_trechos.doc", "category": "Textual"}, "HECE_HV0012 Paulo Guilherme Martins da Rocha_trechos.docx": {"size_mb": 0.0437, "modified": "2026-02-24 16:04:24", "extension": "DOCX", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV0012 Paulo Guilherme Martins da Rocha_trechos.docx", "category": "Textual", "content_preview": "Programa Conte Sua História\nHistórias de Esperança – 29 Anos do Projeto Criança Esperança\nDepoimento de Paulo Guilherme Martins da Rocha\nEntrevistado por Rosana Miziara e Sonia Teller\nSão Paulo, 27/08/2014\nHECE_HV012_Paulo Guilherme Martins da Rocha\nRealização Museu da Pessoa\nTranscrito por Karina Medici Barrella\nMW Transcrições\nP/1 – Oi Paulo, você pode começar falando o seu nome completo, local e data de nascimento?\nR – Meu nome é Paulo Guilherme Martins da Rocha, eu nasci em São Paulo, no dia 7 de agosto de 60.\nP/1 – Paulo, seus pais são de São Paulo?\nR – Minha mãe era do interior de São Paulo e o meu pai era de Pernambuco.\nP/1 – Vamos começar falando um pouquinho da família do seu pai. Seus avós paternos são de Pernambuco?\nR – Sim. \nP/1 – Você os conheceu?\nR – Conheci minha avó porque o meu avô morreu quando meu pai tinha dez anos. Eu cheguei a conhecer a minha avó que viveu até os...\nP/1 – Você sabe um pouco o que o seu avô chegou a trabalhar, o que ele fazia? O pai do seu pai.\nR – Ele trabalhava com comércio, com agricultura e quando ele morreu foi um momento muito complicado pro meu pai porque a minha avó se casando novamente, tanto o meu pai como a minha tia foram deixados"}, "HECE_HV009_Elaine Cristina da Silva Leite_trechos (1) (1).docx": {"size_mb": 0.0236, "modified": "2026-02-24 16:04:26", "extension": "DOCX", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV009_Elaine Cristina da Silva Leite_trechos (1) (1).docx", "category": "Textual", "content_preview": "Projeto Conte sua História\nHistórias de Esperança, 29 anos do Projeto Criança Esperança\nDepoimento de Elaine Cristina da Silva Leite\nEntrevistada por Rosana Miziara\nSão Paulo, 06/08/2014\nHECE_HV009_Elaine Cristina da Silva Leite\nRealização Museu da Pessoa\nTranscrito por Bruna Kocsis Dorés\nMW Transcrições\nP/1 – Elaine, você pode falar seu nome completo, local e data de nascimento?\nR – Elaine Cristina da Silva Leite. Nasci em São Paulo, em 1967. \nP/1 – Que data?\nR – Dia 27 de julho. \nP/1 – Os seus pais são de São Paulo?\nR – São baianos. \nP/1 – Seu pai e sua mãe?\nR – Isso.\nP/1 – Que lugar da Bahia?\nR – Salvador... Não sei (risos). Exatamente eu não sei.\nP/1 – Mas os dois são de lá?\nR – São, são da Bahia. \nP/1 – Você conheceu ou sabe a história do seu avô e sua avó por parte de mãe?\nR – Alguma coisa sim.\nP/1 – O que você sabe? O que eles faziam?\nR – Olha, eu sei que a minha bisavó foi capturada na época de índio, essas coisas. Foi caçada lá. Mas aí vieram pra São Paulo, constituíram família, essas coisas. \nP/1 – A sua bisavó foi caçada? Como assim?\nR – É. Não tinha aquele negócio de índio, essas coisas? Meu pai pelo menos conta isso, que tinha essa história de que vinham pessoas de for"}, "HECE_HV010_Paulo Henrique Caires Pinheiro_trechos-2.docx": {"size_mb": 0.0374, "modified": "2026-02-24 16:04:30", "extension": "DOCX", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV010_Paulo Henrique Caires Pinheiro_trechos-2.docx", "category": "Textual", "content_preview": "Programa Conte Sua História\nHistórias de Esperança – 29 Anos do Projeto Criança Esperança\nDepoimento de Paulo Henrique Caires Pinheiro\nEntrevistado por Teresa Ruiz\nSão Paulo, 20/08/2014\nHECE_HV010_Paulo Henrique Caires Pinheiro\nRealização Museu da Pessoa\nTranscrito por Karina Barrella\n\tMW Transcrições\nP/1 – Então, primeiro Paulo, vou pedir para você falar para a gente o seu nome completo, data e local de nascimento.\nR – Paulo Henrique Caires Pinheiro. Tenho 30 anos, dia 23 de fevereiro de 1984, São Paulo, capital, zona Sul.\nP/1 – Agora, o nome completo do seu pai e da sua mãe, e também, data e local de nascimento, se você souber.\nR – Nossa, a data do nascimento eu não vou saber, não. Nicevaldo Caires Pinheiro e Maria Glória Caires Pinheiro. Nicevaldo nasceu em Bahia, Teixeira de Freitas e Maria Glória Caires Pinheiro em Cachoeira do Mato, Bahia. São primos.\nP/1 – O que os seus pais faziam ou fazem profissionalmente?\nR – Minha mãe, doméstica e dona do lar e o meu pai é um zelador da comunidade, assim. A gente mora perto de uma praça, ele que cuida do jardim, das plantas, da bica d’água, né? Eu apelidei ele de zelador e de vez em quando ele faz bico em construção civil. E também é um"}, "HECE_HV011_Luciene Silva Souza_trechos-1.docx": {"size_mb": 0.0372, "modified": "2026-02-24 16:04:32", "extension": "DOCX", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV011_Luciene Silva Souza_trechos-1.docx", "category": "Textual", "content_preview": "Programa Conte Sua História\nHistórias de Esperança – 29 Anos do Projeto Criança Esperança\nDepoimento de Luciene Silva Souza\nEntrevistada por Vanuza Ramos\nSão Paulo, 27/08/2014\nHECE_HV011_Luciene Silva Souza\nRealização Museu da Pessoa\nTranscrito por Karina Medici Barrella\nMW Transcrições\nP/1 – Obrigada por ter vindo dar seu depoimento. Pra começar, eu queria que você falasse o seu nome completo, o local e a data do seu nascimento.\nR – Meu nome é Luciene Silva Souza. Eu nasci na cidade de São Paulo, no dia 13 de março de 1973.\nP/1 – E qual o nome dos seus pais, Luciene?\nR – Meu pai chama Vicente Emídio de Souza e a minha mãe, Maria José da Silva.\nP/1 – Quantos anos eles têm?\nR – Ih, boa pergunta! Porque a minha história familiar é muito complicada, eu não tenho muito contato com eles, então, eu não consigo definir. Eu sei que a minha mãe nasceu em 53, mas o meu pai eu não tenho a menor ideia.\nP/1 – E você sabe a profissão deles?\nR – O meu pai hoje mora no interior do Pernambuco, trabalha na terra, não tem uma profissão, ele é dono de um pedaço de terra e vive disso. A minha mãe mora aqui no Jardim Ângela, com ela eu tenho um pouco mais de contato; ela é autônoma, ela trabalha em part"}, "HECE_HV013 Joseleine da Cruz e Silva_trechos (1).docx": {"size_mb": 0.0365, "modified": "2026-02-24 16:04:34", "extension": "DOCX", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV013 Joseleine da Cruz e Silva_trechos (1).docx", "category": "Textual", "content_preview": "Museu da Pessoa – Conte sua história\nHistórias de Esperança – 29 anos do Projeto Criança Esperança\nDepoimento de Joseleine da Cruz e Silva\nEntrevistado por Tereza Ruiz \t\nSão Paulo 03/09/2014\nRealização Museu da Pessoa\nEntrevista HECE_HV_013\nTranscrito por Ana Carolina Ruiz\nP/1 – Primeiro, Joseleine, vou pedir pra você falar o seu nome completo, data e local de nascimento.\nR – Joseleine da Cruz e Silva. Nasci em São Paulo em 19 de março de 1961.\nP/1 – Agora o nome completo dos seus pais, seu pai e sua mãe, e se você lembrar data e local de nascimento também. Se lembrar.\nR – Dos dois?\nP/1 – Isso.\nR – José da Cruz. Ele nasceu em 31 de janeiro de 1919 em São Paulo. E Domingas Bertini da Cruz, nasceu em São Paulo em 16 de julho de 1917.\nP/1 – O que os seus pais faziam profissionalmente?\nR – Então, meu pai era militar. Ele entrou na aeronáutica e também se aposentou na aeronáutica. Quando ele se aposentou ele começou a trabalhar com um tio meu numa loja de materiais de construção, mas se aposentou na aeronáutica. \nP/1 – E sua mãe?\nR – A minha mãe sempre costurou vestidos de noiva. Então aí depois que ela casou ela parou um pouquinho, que ela tinha o que seria um ateliê que seria hoje, só"}, "HECE_HV014_Daniel Zampieri_trechos.docx": {"size_mb": 0.0264, "modified": "2026-02-24 16:04:38", "extension": "DOCX", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV014_Daniel Zampieri_trechos.docx", "category": "Textual", "content_preview": "Museu da Pessoa – Conte sua história\nHistórias de Esperança – 29 anos do Projeto Criança Esperança\nDepoimento de Daniel Zampieri\nEntrevistado por Tereza Ruiz \t\nSão Paulo 12/09/2014\nRealização Museu da Pessoa\nEntrevista HECE_HV_014\nTranscrito por Ana Carolina Ruiz\nP/1 – Então, Daniel, fala pra gente o seu nome completo, data e o local de nascimento.\nR – O meu nome é Daniel Zampieri. Nasci em 1979, aqui na cidade de São Paulo. Hoje eu tenho 34 anos, mas sou natural mesmo daqui de São Paulo.\nP/1 – Agora o nome completo do seu pai e da sua mãe e data e local de nascimento se você souber.\nR – Então, meu pai chama Henrique Zampieri Filho e minha mãe Vilma Aparecida Zampieri. \nP/1 – Onde eles nasceram, você sabe?\nR – Aqui em São Paulo mesmo.\nP/1 – Fala um pouquinho o que os seus pais faziam ou fazem profissionalmente.\nR – Minha mãe é do lar, e o meu pai trabalha na parte financeira numa agência.\nP/1 – E como pessoas assim, de temperamento, personalidade, descreve um pouco eles pra gente.\nR – Minha mãe é um pouco meio severa, muitas das vezes. Meu pai já é mais calmo. Então sempre tem a intermediação, né? Eu puxei a parte da minha mãe de ser bem ativo, comunicativo e parte tranquila do meu"}, "HECE_HV015_Wanderley Aparecido da Silva_trechos.docx": {"size_mb": 0.0252, "modified": "2026-02-24 16:04:40", "extension": "DOCX", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV015_Wanderley Aparecido da Silva_trechos.docx", "category": "Textual", "content_preview": "Museu da Pessoa – Conte sua história\nHistórias de Esperança – 29 anos do Projeto Criança Esperança\nDepoimento de Wanderley Aparecido da Silva\nEntrevistado por Tereza Ruiz \t\nSão Paulo 17/09/2014\nRealização Museu da Pessoa\nEntrevista HECE_HV_015\nTranscrito por Ana Carolina Ruiz\nP/1 – Primeiro então, Wanderley, fala pra gente o seu nome completo, a data e local de nascimento.\nR – Meu nome é Wanderley Aparecido da Silva. Eu nasci no Paraná, na cidade de Cianorte em 16 de junho de 1966.\nP/1 – Agora o nome completo dos seus pais, a mãe e o pai, e a data e o local de nascimento se você souber.\nR – Meu pai se chamava Arlindo Jerônimo da Silva. Ele nasceu em Palmital, São Paulo no ano de 1927, no mês de agosto, 17 de agosto. Minha mãe se chama Maria Zaragoza da Silva. Ela nasceu em São João do Caiuá no interior de São Paulo em 30 de junho de 1933.\nP/1 – O que os seus pais faziam profissionalmente?\nR – Minha mãe sempre foi do lar. Meu pai trabalhou muitos anos na lavoura, também foi comerciante, foi administrador de fazenda lá no Paraná.\nP/1 – Ele trabalhava com lavoura de que? O que ele cultivava?\nR – Cultivou café. Foi um dos primeiros agricultores com soja aqui no Brasil. Trigo, arroz, fe"}, "HECE_HV016_Josué de Sousa Lopes Cara_trechos.docx": {"size_mb": 0.0254, "modified": "2026-02-24 16:04:42", "extension": "DOCX", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV016_Josué de Sousa Lopes Cara_trechos.docx", "category": "Textual", "content_preview": "Museu da Pessoa – Conte sua história\nHistórias de Esperança – 29 anos do Projeto Criança Esperança\nDepoimento de Josué de Sousa Lopes Cara\nEntrevistado por Tereza Ruiz \t\nSão Paulo 19/09/2014\nRealização Museu da Pessoa\nEntrevista HECE_HV_016\nTranscrito por Ana Carolina Ruiz\nP/1 – Primeiro, Josué, eu vou pedir pra você falar pra gente o seu nome completo, data e o local de nascimento.\nR – Certo. O meu nome é Josué de Sousa Lopes Cara. Nasci em Diadema.\nP/1 – E a data?\nR – Dia 5 de agosto de 1993.\nP/1 – Agora o nome completo da sua mãe e do seu pai e também data e local de nascimento se você souber.\nR – O nome do meu pai é Júlio César Cara. O nome da minha mãe é Valdecir Dias Lopes Cara.\nP/1 – O local onde eles nasceram você sabe?\nR – Eu não sei. Creio eu que é em São Paulo.\nP/1 – Você tem irmãos?\nR – Tenho um. Tiago de Sousa Lopes Cara. Nasceu no dia 15 de maio de 1999.\nP/1 – Mais novo então.\nR – É.\nP/1 – Descreve um pouquinho pra gente como é que os seus pais são como pessoas. Pra quem não conhece como é que você descreveria seu pai e sua mãe?\nR – A minha mãe é mais estourada. Por qualquer coisinha, ela já começa a gritar, é estressada. Ela é tranquila, mas quando, digamos, eu ou o"}, "HECE_HV017_Karin Poljana do Vale Ludwig_trechos.docx": {"size_mb": 0.0381, "modified": "2026-02-24 16:04:46", "extension": "DOCX", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV017_Karin Poljana do Vale Ludwig_trechos.docx", "category": "Textual", "content_preview": "Museu da Pessoa – Conte sua história\nHistórias de Esperança – 29 anos do Projeto Criança Esperança\nDepoimento de Karin Poljana do Vale Ludwig\nEntrevistada por Tereza Ruiz \t\nSão Paulo 24/09/2014\nRealização Museu da Pessoa\nEntrevista HECE_HV_17\nTranscrito por Ana Carolina Ruiz\nP/1 – Primeiro, Karin, eu vou pedir pra você falar pra gente o seu nome completo, data e o local de nascimento.\nR – Tá. É Karin Poljana do Vale Ludwig, 29 de janeiro de1971 e nasci em São Paulo.\nP/1 – Agora o nome completo, data e o local de nascimento do seu pai e da sua mãe.\nR – Putz. Espera aí. Do meu pai é na Iugoslávia, minha mãe é Marieta do Vale Santos, nasceu em 1941 em Ilhabela. Meu pai é Salvino Ludwig... eu sou ruim de conta.\nP/1 – Não tem problema se não souber a data. Só o local de nascimento.\nR – Ele nasceu na Iugoslávia.\nP/1 – Você sabe por que ele veio pro Brasil?\nR – Olha, ele veio com a minha avó e com o meu avô, a história que eles contam é porque eles estavam fugindo da Segunda Guerra, estava meio tumultuado, meu avô tinha sido recrutado pra lutar por Hitler e não queria. Meu avô é austríaco. Basicamente tentando fugir da guerra, fugindo daquela situação de guerra.\nP/1 – E teu pai tinha qual"}, "HECE_HV017_Karin Poljana do Vale Ludwig_trechosNOVOCORTE.docx": {"size_mb": 0.0381, "modified": "2026-02-24 16:04:48", "extension": "DOCX", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV017_Karin Poljana do Vale Ludwig_trechosNOVOCORTE.docx", "category": "Textual", "content_preview": "Museu da Pessoa – Conte sua história\nHistórias de Esperança – 29 anos do Projeto Criança Esperança\nDepoimento de Karin Poljana do Vale Ludwig\nEntrevistada por Tereza Ruiz \t\nSão Paulo 24/09/2014\nRealização Museu da Pessoa\nEntrevista HECE_HV_17\nTranscrito por Ana Carolina Ruiz\nP/1 – Primeiro, Karin, eu vou pedir pra você falar pra gente o seu nome completo, data e o local de nascimento.\nR – Tá. É Karin Poljana do Vale Ludwig, 29 de janeiro de1971 e nasci em São Paulo.\nP/1 – Agora o nome completo, data e o local de nascimento do seu pai e da sua mãe.\nR – Putz. Espera aí. Do meu pai é na Iugoslávia, minha mãe é Marieta do Vale Santos, nasceu em 1941 em Ilhabela. Meu pai é Salvino Ludwig... eu sou ruim de conta.\nP/1 – Não tem problema se não souber a data. Só o local de nascimento.\nR – Ele nasceu na Iugoslávia.\nP/1 – Você sabe por que ele veio pro Brasil?\nR – Olha, ele veio com a minha avó e com o meu avô, a história que eles contam é porque eles estavam fugindo da Segunda Guerra, estava meio tumultuado, meu avô tinha sido recrutado pra lutar por Hitler e não queria. Meu avô é austríaco. Basicamente tentando fugir da guerra, fugindo daquela situação de guerra.\nP/1 – E teu pai tinha qual"}, "HECE_HV018_Taís Cristina Bispo de Lima_trechos.docx": {"size_mb": 0.0225, "modified": "2026-02-24 16:04:50", "extension": "DOCX", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV018_Taís Cristina Bispo de Lima_trechos.docx", "category": "Textual", "content_preview": "Museu da Pessoa – Conte sua história\nHistórias de Esperança – 29 anos do Projeto Criança Esperança\nDepoimento de Taís Cristina Bispo de Lima\nEntrevistada por Tereza Ruiz\nSão Paulo 24/09/2014\nRealização Museu da Pessoa\nEntrevista HECE_HV_18\nTranscrito por Liliane Custódio\nP/1 – Primeiro, Taís, fala pra gente seu nome completo, data e local de nascimento.\nR – Bom, meu nome completo é Taís Cristina Bispo de Lima, eu nasci no dia 1º de setembro de 1993, em São Paulo.\nP/1 – Agora o nome completo do seu pai e da sua mãe, e data e local de nascimento deles se você lembrar.\nR – O nome do meu pai completo é Antomar de Lima, o nome da minha mãe é Edilene Aparecida Bispo, os dois nasceram em São Paulo. Minha mãe nasceu no dia 23 de setembro de 1973, e meu pai nasceu no dia 16 de maio.\nP/1 – O que seus pais fazem profissionalmente, Taís?\nR – Bom, o meu pai tem uma empresa e, assim, o que você precisar ele vende, vende tudo um pouco. E ele também faz raio X. Ele técnico de raio X também. A minha mãe é cabeleireira, ela faz alongamento.\nP/1 – Você falou que seu pai vende um pouco de tudo, mas tem alguma coisa específica, um tipo de produto específico?\nR – Assim, computador, máquina fotográfica,"}, "HECE_HV019_Tony Marlon Teixeira Santos_trechos.docx": {"size_mb": 0.054, "modified": "2026-02-24 16:04:54", "extension": "DOCX", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV019_Tony Marlon Teixeira Santos_trechos.docx", "category": "Textual", "content_preview": "Museu da Pessoa – Conte sua história\nHistórias de Esperança – 29 anos do Projeto Criança Esperança\nDepoimento de Tony Marlon Teixeira Santos\nEntrevistado por Tereza Ruiz \t\nSão Paulo 01/10/2014\nRealização Museu da Pessoa\nEntrevista HECE_HV_19\nTranscrito por Ana Carolina Ruiz\nP/1 – Primeiro, Tony, eu vou pedir pra você dizer pra gente o seu nome completo, data e o local de nascimento.\nR – O meu nome completo é Tony Marlon Teixeira Santos. Data de nascimento é 4 de outubro de 1984 e a cidade que eu fui registrado se chama Salinas, no norte de Minas Gerais.\nP/1 – Agora o nome completo da sua mãe e do seu pai e se você lembrar também data e local de nascimento.\nR – Tá. Bom, local é essa mesma cidade. Da minha mãe é Marileide Teixeira da Silva e o do meu pai é José Barbosa dos Santos. O nascimento da minha mãe é hoje, dia 1º de outubro, e o do meu pai é dia 20 de setembro.\nP/1 – O que os seus pais fazem profissionalmente, Tony?\nR – Agora profissionalmente eles estão sendo felizes. Eles depois de 20 anos, 20 e poucos anos fora da minha cidade eles voltaram pra lá agora no começo de 2014. E lá a minha mãe está sem um trabalho fixo, porque é uma cidade muito pequena e o meu pai pegou um din"}, "HECE_HV_001_ Elson Pedro de Orlando Júnior_trechos_selecionados.docx": {"size_mb": 0.0387, "modified": "2026-02-24 16:04:56", "extension": "DOCX", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV_001_ Elson Pedro de Orlando Júnior_trechos_selecionados.docx", "category": "Textual", "content_preview": "Conte a sua história\nHistórias de Esperança – Projeto Criança Esperança\nDepoimento de Elson Pedro de Orlando Júnior\nEntrevistado por Rosana Miziara\nSão Paulo, 22 de julho de 2014\nHECE_HV001_Elson Pedro de Orlando Júnior\nRealização Museu da Pessoa\nTranscrito por Claudia Lucena\nMW Transcrições\nP/1 – Elson, você pode começar falando o seu nome completo, local e data de nascimento?\nR – Sim, meu nome é Elson Pedro de Orlando Júnior, nasci em Guaxupé, sul de Minas Gerais e no dia 29 de outubro de 77.\nP/1 – Elson, e seus pais, são de Guaxupé?\nR – Os meus pais são de Guaxupé.\nP/1 – Pai e mãe?\nR – Quer dizer, o meu pai é de Passos, né, e depois, nasceu em Passos, morou em Itaú de Minas, depois foi pra Guaxupé, onde conheceu minha mãe e se casou com ela, que ela é nascida em Guaxupé.\nP/1 – Seus avós paternos são da onde?\nR – Os meus avós paternos, o meu avô paterno é de Passos, a minha avó, ela é de, eu não lembro se ela é de Passos ou se ela é de Itaú, porque eu não cheguei a conhecê-la, né, eu nasci, ela já tinha falecido. O meu avô também não conheci, mas o meu pai falava muito dele, era mais próximo assim, que a minha avó faleceu, meu pai era muito novinho, então ele foi criado mais pelo"}, "HECE_HV_002_Eunice de Souza_trechos_selecionados.docx": {"size_mb": 0.0203, "modified": "2026-02-24 16:04:58", "extension": "DOCX", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV_002_Eunice de Souza_trechos_selecionados.docx", "category": "Textual", "content_preview": "Conte a sua história\nHistórias de Esperança – 29 anos do Projeto Criança Esperança\nDepoimento de Eunice de Souza\nEntrevistada por Rosana Miziara\nSão Paulo, 22 de julho de 2014\nHECE_HV002_Eunice de Souza\nRealização Museu da Pessoa\nTranscrito por Claudia Lucena\nMW Transcrições\nP/1 – Eunice, você pode falar o seu nome completo, local e data de nascimento?\nR – Eunice de Souza, 14 de outubro de 1956, eu nasci em Ibiporã, Paraná.\nP/1 – Seus pais são de Ibiporã?\nR – Não, os meus pais são paulistas.\nP/1 – O seu pai e a sua mãe?\nR – O meu pai e minha mãe, meu pai nasceu em Franca, interior de São Paulo, e a minha mãe nasceu em Artenópolis, no interior de São Paulo também.\nP/1 – E os seus avós maternos e paternos?\nR – Meus avós, a mãe da minha mãe nasceu também em interior de São Paulo, os pais dela nasceram na Itália, eles vieram da Itália com 16 anos de idade.\nP/1 – Por que eles vieram da Itália, os seus bisavós?\nR – Ah, vieram, como chama aquele pessoal que vem?\nP/1 – Imigrante.\nR – Imigrantes, assim, eles vieram, eu acho que vieram pra procurar coisa melhor aqui no Brasil, não tenho a mínima ideia, porque eu não os conheci, né?\nP/1 – E os pais dela, o que faziam, o pai e a mãe?\nR – O pai"}, "HECE_HV_003_Beatriz Calderario de Miranda_trechos_selecionados.docx": {"size_mb": 0.0501, "modified": "2026-02-24 16:05:02", "extension": "DOCX", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV_003_Beatriz Calderario de Miranda_trechos_selecionados.docx", "category": "Textual", "content_preview": "Museu da Pessoa – Conte sua História\nHistórias de Esperança: 29 anos do Projeto Criança Esperança\nDepoimento de Beatriz Calderario Miranda\nEntrevistada por Rosana Miziara\nSão Paulo, 23/07/2014\nEntrevista nº HECE HV_003\nRealização Museu da Pessoa\nTranscrito por Ana Corazza\nP/1 – Bia, você pode falar seu nome completo, local e data de nascimento?\nR – É Beatriz Calderario de Miranda. Nasci em Curitiba, Paraná, no dia 26 de outubro de 1964.\nP/1 – Seus pais são de Curitiba?\nR – Minha mãe, a família é de Curitiba, meu pai é uma família que veio do Nordeste, foi descendo desde Pernambuco até o Paraná e foi tendo filhos em todos os lugares, meu pai nasceu no Rio de Janeiro.\nP/1 – Mas seu avô e sua avó são da onde? Do Nordeste.\nR – Meu avô é de Pernambuco. Avô paterno é de Pernambuco. E a avó é de Minas Gerais, de Montes Claros.\nP/1 – E como é que eles se encontraram, você sabe? Seu avô e sua avó paternos.\nR – Não sei como se encontraram. Não sei como se encontraram, não sei se foi na descida dele de Pernambuco pra cá que eles se encontraram. Não sei. Mas o fato é que depois era... ainda em lombo de burro e descendo. \nP/1 – É mesmo?\nR – E naquela época, são nove filhos, foram parindo filhos"}, "HECE_HV_006_Debora Cristina Shomer_trechos.docx": {"size_mb": 0.0184, "modified": "2026-02-24 16:05:04", "extension": "DOCX", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV_006_Debora Cristina Shomer_trechos.docx", "category": "Textual", "content_preview": "Museu da Pessoa Conte Sua História, Histórias de Esperança\n29 anos do Criança Esperança\nDepoimento de Debora Cristina Shomer\nEntrevistada por Rosana Miziara\nSão Paulo, 30/07/2014\nRealização Museu da Pessoa\nHECE_HV006_Debora Cristina Shomer\nTranscrição Paula Junqueira \nMW Transcrições\nP/1 – Débora, você pode falar seu nome completo, local e data de nascimento?\nR – Debora Cristina Shomer, Vila Brasilândia, 30 de outubro de 1991.\nP/1 – São Paulo?\nR – São Paulo.\nP/1 – Seus pais são de São Paulo?\nR – Só minha mãe, o meu pai é da Alemanha.\nP/1 – Sua mãe nasceu aonde?\nR – Minha mãe nasceu na Vila Brasilândia mesmo.\nP/1 – E seu pai?\nR – Eu não sei o nome da cidade onde ele nasceu.\nP/1 – E seus avós paternos? Os pais dele?\nR – Não os conheço.\nP/1 – E os pais da sua mãe?\nR – Eles faleceram já tem um tempo, mas também nasceram na Brasilândia.\nP/1 – Todo mundo é de São Paulo? Vila Brasilândia?\nR – Todo mundo. Todos.\nP/1 – E você sabe como o seu pai e a sua mãe, se conheceram?\nR – Minha mãe foi rainha de Escola de Samba, aí o meu pai nessas vindas dos gringos nas Escolas de Samba, se conheceram aí.\nP/1 – Ela foi rainha de qual Escola de Samba?\nR – Rosas de Ouro.\nP/1 – Que ano que ela foi?\nR – E"}, "HECE_HV_007_Ajussimeire Benfica Santana_trechos.docx": {"size_mb": 0.0327, "modified": "2026-02-24 16:05:06", "extension": "DOCX", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV_007_Ajussimeire Benfica Santana_trechos.docx", "category": "Textual", "content_preview": "Museu da Pessoa Conte Sua História, Histórias de Esperança, \n29 anos do Projeto Criança Esperança\nDepoimento de Ajussimeire Benfica Santana\nEntrevistada por Rosana Miziara\nSão Paulo 30/07/2014\nRealização Museu da Pessoa\nHECE_HV007_Ajussimeire Benfica Santana\nTranscrição Paula Junqueira \nMW Transcrições\nP/1 – Ju, você pode falar seu nome completo, local e data de nascimento?\nR – Ajussimeire Benfica Santana, nasci em Osasco, no dia 15 de dezembro de 1973.\nP/1 – Ju, seus pais são de Osasco?\nR – Não, a minha mãe é do interior de São Paulo e meu pai era da Bahia.\nP/1 – Qual lugar do interior de São Paulo?\nR – Se eu não me engano é Sorocaba.\nP/1 – E os pais dela?\nR – Os pais da minha mãe, a minha avó e meu avô são mineiros, de uma cidade próxima de Varginha.\nP/1 – E por que eles vieram pra São Paulo? Ou quando vieram foi sua mãe que veio?\nR – Não, eles vieram. Eles vieram pra São Paulo pra tentar a vida, como acho que maioria das pessoas que moram em cidades afastadas. Naquela época as pessoas mudavam muito de casa. Minha mãe conta que meu ele avô era tipo cigano, eles viviam mudando, aí eles vieram morar uma vez, acho que em Sorocaba, não veio pra Osasco, de Sorocaba a minha mãe conhece"}, "HECE_HV_008_ Antônio Carlos Lemos de Oliveira_trechos.docx": {"size_mb": 0.0254, "modified": "2026-02-24 16:05:10", "extension": "DOCX", "full_path": "H:\\EDICAO\\TRECHOS SELECIONADOS\\HECE_HV_008_ Antônio Carlos Lemos de Oliveira_trechos.docx", "category": "Textual", "content_preview": "Museu da Pessoa – Conte sua história\nHistórias de Esperança – 29 anos do Projeto Criança Esperança\nDepoimento de Antônio Carlos Lemos de Oliveira\nEntrevistado por Rosana Miziara \t\nSão Paulo, 06/08/2014\nRealização Museu da Pessoa\nHECE_HV008_ Antônio Carlos Lemos de Oliveira\nTranscrito por Liliane Custódio\nMW Transcrições\nP/1 – Oi, Antônio Carlos. Você pode falar seu nome completo, local e data de nascimento?\nR – Sim. Antônio Carlos Lemos de Oliveira, a data é 5 de julho de 1991, eu sou daqui de São Paulo mesmo.\nR – Antônio Carlos, e seus pais, seu pai e sua mãe, são de São Paulo?\nR – Sim. Meu pai já é falecido, ele era natural de Minas Gerais, e minha mãe, que vive comigo, é baiana, é da Bahia.\nP/1 – Qual o nome da sua mãe?\nR – Cidinai Ferraz Lemos.\nP/1 – E a Cidinai nasceu na Bahia, que lugar?\nR – Feira de Santana, se eu não me engano.\nP/1 – E seus avôs, pais dela, são de Feira de Santana?\nR – Sim. Também.\nP/1 – E você sabe o que seus avôs maternos faziam?\nR – Na verdade, não, porque eu nem os conheci. Não sei.\nP/1 – E seu pai, que lugar de Minas Gerais?\nR – Meu pai era de Januária.\nP/1 – E seus avôs são de Januária?\nR – Sim. \nP/1 – E você sabe a história dos seus avós por parte de"}, "folder_size_gb": 0.003}, "PROJETO CAIO": {"EDICAO CRIACA ESP_12-23-14_1603": {"size_mb": 5.9354, "modified": "2014-12-23 23:58:22", "extension": "", "full_path": "H:\\EDICAO\\PROJETO CAIO\\EDICAO CRIACA ESP_12-23-14_1603", "category": "Other"}, "EDICAO CRIACA ESP_12-23-14_16032.fcp": {"size_mb": 7.3402, "modified": "2015-01-21 11:17:13", "extension": "FCP", "full_path": "H:\\EDICAO\\PROJETO CAIO\\EDICAO CRIACA ESP_12-23-14_16032.fcp", "category": "Other"}, "EDICAO CRIACA ESPERANCA.fcp": {"size_mb": 5.3117, "modified": "2014-12-19 07:52:01", "extension": "FCP", "full_path": "H:\\EDICAO\\PROJETO CAIO\\EDICAO CRIACA ESPERANCA.fcp", "category": "Other"}, "folder_size_gb": 0.018}, "folder_size_gb": 0.024}};

const EXTENSIONS = {
    "Video": ['mp4', 'mov', 'mkv', 'avi', 'm4v', 'mts', 'm2ts', 'wmv', 'flv', 'webm', 'vob', 'ogv', '3gp', 'mxf'],
    "Audio": ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'aiff', 'pcm', 'aif'],
    "Image": ['jpg', 'jpeg', 'tif', 'tiff', 'png', 'gif', 'bmp', 'webp', 'cr2', 'nef', 'arw', 'dng'],
    "Textual": ['doc', 'docx', 'pdf', 'txt', 'rtf', 'odt', 'xls', 'xlsx', 'ppt', 'pptx']
};

const ICONS = { "Video": "🎞️", "Audio": "🎧", "Image": "🖼️", "Textual": "📝", "Other": "📄" };

function formatSmartSize(mbValue) {
    if (!mbValue || mbValue === 0) return "0 B";
    let bytes = mbValue * 1024 * 1024; 
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(2) + " " + units[i];
}

function getIcon(name, isFolder) {
    if (isFolder) return "📁";
    const ext = name.split('.').pop().toLowerCase();
    for (const [category, list] of Object.entries(EXTENSIONS)) {
        if (list.includes(ext)) return ICONS[category];
    }
    return ICONS["Other"];
}

function formatTime(ms) {
    if (!ms || ms === 0) return "N/A";
    let totalSeconds = Math.floor(ms / 1000);
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;
    return [hours, minutes, seconds].map(v => v < 10 ? "0" + v : v).join(":");
}

function tryLoadImage(imgElement, thumbnailPath, originalName) {
    if (!thumbnailPath && !originalName) return;
    let path = thumbnailPath || `thumbnails/thumb_${originalName.split('.').slice(0, -1).join('.')}.jpg`;
    imgElement.onerror = function() {
        this.onerror = null;
        this.src = 'https://via.placeholder.com/150?text=Sem+Preview';
    };
    imgElement.src = path;
}

function copyPreviewText() {
    const box = document.getElementById('preview-text');
    if (box) {
        navigator.clipboard.writeText(box.textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy Content"; }, 2000);
    }
}

function calculateFolderStats(node) {
    let stats = { Video: { count: 0, size: 0 }, Audio: { count: 0, size: 0 }, Image: { count: 0, size: 0 }, Textual: { count: 0, size: 0 }, Other: { count: 0, size: 0 }, totalSize: 0 };
    function traverse(curr) {
        for (let key in curr) {
            if (key === "folder_size_gb") continue;
            let item = curr[key];
            if (item.folder_size_gb !== undefined) traverse(item);
            else {
                let cat = item.category || "Other";
                if (!stats[cat]) cat = "Other";
                stats[cat].count++;
                stats[cat].size += item.size_mb || 0;
                stats.totalSize += item.size_mb || 0;
            }
        }
    }
    traverse(node);
    return stats;
}

function showMetadata(name, data, path) {
    const panel = document.getElementById("metadata-panel");
    const content = document.getElementById("meta-content");
    panel.style.display = "block";

    const isFolder = data.folder_size_gb !== undefined;
    let html = `
        <span class="meta-label">Nome</span><span class="meta-value">${name}</span>
        <span class="meta-label">Caminho</span><span class="meta-value">${data.full_path || path.join("/")}</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(data.full_path || "").replace(/\\/g, "\\\\")}')">Copy Path</button>
        <span class="meta-label">Tamanho</span><span class="meta-value" style="color:var(--accent); font-weight:bold;">${formatSmartSize(isFolder ? data.folder_size_gb * 1024 : data.size_mb)}</span>
    `;

    if (isFolder) {
        const stats = calculateFolderStats(data);
        const getPct = (size) => stats.totalSize > 0 ? ((size / stats.totalSize) * 100).toFixed(1) : 0;
        html += `
            <div class="stats-container">
                <span class="meta-label">Conteúdo</span>
                <div class="stats-bar">
                    <div class="bar-segment" style="width:${getPct(stats.Video.size)}%; background:var(--video)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Audio.size)}%; background:var(--audio)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Image.size)}%; background:var(--image)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Textual.size + stats.Other.size)}%; background:var(--other)"></div>
                </div>
                <div class="stat-row"><span>🎞️ Video</span><b>${stats.Video.count}</b></div>
                <div class="stat-row"><span>🎧 Audio</span><b>${stats.Audio.count}</b></div>
                <div class="stat-row"><span>🖼️ Images</span><b>${stats.Image.count}</b></div>
                <div class="stat-row"><span>📄 Docs / Other</span><b>${stats.Textual.count + stats.Other.count}</b></div>
            </div>`;
    } else {
        if (data.category === "Image" || data.thumbnail) {
            html += `<h3>Preview</h3>
                     <div class="img-preview-container">
                        <img id="preview-img" src="" alt="Carregando...">
                     </div>`;
            setTimeout(() => {
                const img = document.getElementById('preview-img');
                tryLoadImage(img, data.thumbnail, name);
            }, 50);
        }

        html += `<span class="meta-label">Modificado</span><span class="meta-value">${data.modified || "N/A"}</span>`;
        
        if (data.category === "Video") {
            // Garante que displayRes exista ou usa a dimensão original
            const displayRes = data.dimension || "N/A"; 
            
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Resolução</span><span class="meta-value">${displayRes}</span>
                <span class="meta-label">Duração / Áudio</span><span class="meta-value">${formatTime(data.duration_ms)} / ${data.audio_channels || "N/A"}</span>
                <span class="meta-label">Aspecto / FPS</span><span class="meta-value">${data.aspect_ratio || "N/A"} / ${data.frame_rate || "N/A"}</span>`;
        } else if (data.category === "Audio") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Duração</span><span class="meta-value">${formatTime(data.duration_ms)}</span>
                <span class="meta-label">Canais</span><span class="meta-value">${data.audio_channels || "N/A"}</span>`;
        } else if (data.category === "Image") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Dimensões</span><span class="meta-value">${data.dimension || "N/A"}</span>
                <span class="meta-label">DPI</span><span class="meta-value">${data.dpi || "N/A"}</span>`;
        }

        // NOVIDADE: Verifica explicitamente por content_preview ou categoria textual
        if (data.content_preview) {
            html += `<h3>Conteúdo do Documento</h3>
                     <div class="preview-box" id="preview-text">Loading content...</div>
                     <button class="copy-btn" onclick="copyPreviewText()">Copiar Conteúdo</button>`;
        }
    }
    
    content.innerHTML = html;

    // Sincronização garantida: espera o DOM atualizar para injetar o texto
    if (data.content_preview) {
        setTimeout(() => {
            const box = document.getElementById('preview-text');
            if (box) box.textContent = data.content_preview;
        }, 10);
    }
}

function renderColumn(node, level, path = []) {
    const explorer = document.getElementById("explorer");
    while (explorer.children.length > level) explorer.removeChild(explorer.lastChild);
    const col = document.createElement("div"); col.className = "column";
    const keys = Object.keys(node).filter(k => k !== "folder_size_gb").sort((a, b) => {
        const aIsF = node[a].folder_size_gb !== undefined;
        const bIsF = node[b].folder_size_gb !== undefined;
        return (aIsF !== bIsF) ? bIsF - aIsF : a.localeCompare(b);
    });
    keys.forEach(name => {
        const val = node[name];
        const isFolder = val.folder_size_gb !== undefined;
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `<span class="icon">${getIcon(name, isFolder)}</span> <span class="item-text">${name}</span>`;
        item.onclick = () => {
            Array.from(col.children).forEach(c => c.classList.remove('active'));
            item.classList.add('active');
            showMetadata(name, val, path.concat(name));
            if (isFolder) renderColumn(val, level + 1, path.concat(name));
            else while (explorer.children.length > level + 1) explorer.removeChild(explorer.lastChild);
        };
        col.appendChild(item);
    });
    explorer.appendChild(col);
}

function performSearch() {
    const term = document.getElementById("search").value.toLowerCase();
    const explorer = document.getElementById("explorer");
    if (!term) { renderColumn(TREE, 0); return; }
    const results = [];
    function searchNode(node, currentPath) {
        for (const key in node) {
            if (key === "folder_size_gb") continue;
            const item = node[key];
            const isFolder = item.folder_size_gb !== undefined;
            const match = key.toLowerCase().includes(term) || (item.content_preview && item.content_preview.toLowerCase().includes(term));
            if (match) results.push({ name: key, data: item, path: currentPath.concat(key), isFolder });
            if (isFolder) searchNode(item, currentPath.concat(key));
        }
    }
    searchNode(TREE, ["Root"]);
    explorer.innerHTML = "";
    const col = document.createElement("div"); col.className = "column"; col.style.minWidth = "100%";
    results.slice(0, 100).forEach(res => {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<span class="icon">${getIcon(res.name, res.isFolder)}</span> <div><b>${res.name}</b><br><small>${res.path.join("/")}</small></div>`;
        div.onclick = () => showMetadata(res.name, res.data, res.path);
        col.appendChild(div);
    });
    explorer.appendChild(col);
}

document.addEventListener("DOMContentLoaded", () => renderColumn(TREE, 0));
</script>
