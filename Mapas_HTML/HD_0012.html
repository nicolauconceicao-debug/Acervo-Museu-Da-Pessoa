udanças de cidade, a rotina, as cris"}, "folder_size_gb": 0.0}, "folder_size_gb": 33.928}, "BB200_HV004_Edbert Pereira Leite Filho": {"Audiovisual": {"Acesso": {"BB200_HV004_Edbert Pereira Leite Filho.mp4": {"size_mb": 5746.2909, "modified": "2023-04-24 17:49:44", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV004_Edbert Pereira Leite Filho\\Audiovisual\\Acesso\\BB200_HV004_Edbert Pereira Leite Filho.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3692355.0, "duration": 3692.36, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 5.612}, "Preservação": {"MDV_5101.avi": {"size_mb": 8250.6556, "modified": "2019-03-18 10:31:16", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV004_Edbert Pereira Leite Filho\\Audiovisual\\Preservação\\MDV_5101.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2283280.0, "duration": 2283.28, "resolution": "720x480", "fps": 29.97}, "MDV_5102.avi": {"size_mb": 5349.0826, "modified": "2019-03-18 11:00:26", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV004_Edbert Pereira Leite Filho\\Audiovisual\\Preservação\\MDV_5102.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1480279.0, "duration": 1480.28, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 13.281}, "folder_size_gb": 18.893}, "Textual": {"BB200_HV004_Edbert Pereira Leite Filho_dec.docx": {"size_mb": 0.0194, "modified": "2019-03-21 06:22:18", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV004_Edbert Pereira Leite Filho\\Textual\\BB200_HV004_Edbert Pereira Leite Filho_dec.docx", "category": "Textual", "content_preview": ""}, "BB200_HV004_Edbert Pereira Leite Filho_rev.docx": {"size_mb": 0.0311, "modified": "2022-03-28 13:24:42", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV004_Edbert Pereira Leite Filho\\Textual\\BB200_HV004_Edbert Pereira Leite Filho_rev.docx", "category": "Textual", "content_preview": "Projeto Banco do Brasil 200 anos \nRealização Museu da Pessoa\nDepoimento de Edbert Pereira Leite Filho\nEntrevistado por Luiz Egito e Marta de Lelis\nBrasília, 11 de setembro de 2008\nCódigo: BB200_HV004 \nTranscrito por Regina Paula de Souza\nRevisado por Vinícius Abrahão de Oliveira\nTítulo: Agência de banco em barraco de madeira\nSinopse: Edbert cresceu junto a uma Brasília também em crescimento, quando ainda se tinham muitos canteiros de obras, escavações, frutas no pé e terra vermelha. Ia de bicicleta para todo canto na companhia dos amigos. Estimulado pelo pai, primeiro funcionário do Banco do Brasil em Brasília, também entrou para a instituição e fala dela com orgulho, principalmente quando começou a trabalhar na área de marketing, organizando ações como o circuito cultural.\n\nMinibiografia: Edbert Pereira Leite Filho nasceu em 15 de maio de 1961 em Nova Friburgo, Rio de Janeiro. Poucos meses após o nascimento, foi levado pela mãe para Brasília. Cresceu e deu seus primeiros passos em meio a uma Brasília também recém nascida. Formado em Publicidade e Propaganda, é funcionário do Banco do Brasil na área de marketing.\nTags: Nova Friburgo, embaixada da Alemanha, núcleo bandeirante, marke"}, "folder_size_gb": 0.0}, "folder_size_gb": 18.893}, "BB200_HV005_Levi Cerqueira": {"Audiovisual": {"Acesso": {"BB200_HV005_Levi Cerqueira.mp4": {"size_mb": 7683.5675, "modified": "2023-04-24 18:00:26", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV005_Levi Cerqueira\\Audiovisual\\Acesso\\BB200_HV005_Levi Cerqueira.mp4", "categ e Janeiro.\nMINIBIO\n\tReinaldo Benjamin Ferreira nasceu em Campo Grande, Mato Grosso do Sul, em 20 de junho de 1935. Trabalhando em uma empresa de aviação aérea, mudou-se para Belo Horizonte. Após a aprovação no concurso do Banco do Brasil foi enviado para a agência de Governador Valadares. O emprego no Banco ainda o mandaria de volta à sua cidade-natal, à Brasília e, finalmente, ao Rio de Janeiro, onde permaneceu até sua aposentadoria, atuando com"}, "folder_size_gb": 0.0}, "folder_size_gb": 44.611}, "BB200_HV010_Luiz Roberto Paixão Passos": {"Audiovisual": {"Acesso": {"BB200_HV010_Luiz Roberto Paixão Passos.mp4": {"size_mb": 7464.4754, "modified": "2023-04-24 19:05:52", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV010_Luiz Roberto Paixão Passos\\Audiovisual\\Acesso\\BB200_HV010_Luiz Roberto Paixão Passos.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4909838.0, "duration": 4909.84, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 7.29}, "Preservação": {"MDV_5119.avi": {"size_mb": 8394.3613, "modified": "2019-03-20 09:02:34", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV010_Luiz Roberto Paixão Passos\\Audiovisual\\Preservação\\MDV_5119.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2323054.0, "duration": 2323.05, "resolution": "720x480", "fps": 29.97}, "MDV_5120.avi": {"size_mb": 7960.6536, "modified": "2019-03-20 10:01:46", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV010_Luiz Roberto Paixão Passos\\Audiovisual\\Preservação\\MDV_5120.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": " iz nos conta sua trajetória, desde a sua infância, passando por obstáculos durante a juventude e os desafios ocorridos no Banco do Brasil\nSinopse:\nEm seu relato, Luiz Roberto Paixão Passos apresenta um rico depoimento com detalhes de sua infância, quando ainda criança em Petrópolis, sua terra natal. Passando por algumas dificuldades na juventude, o próprio diz que a grande 'virada' na sua vida, foi quando passou para o concurso do Banco do Brasil. Depois disso, foram vários os desafios vividos na empresa, passando por países da Améri"}, "folder_size_gb": 0.0}, "folder_size_gb": 25.028}, "BB200_HV011_Sonielson Juvino Silva": {"Audiovisual": {"Acesso": {"BB200_HV011_Sonielson Juvino Silva.mp4": {"size_mb": 10717.0194, "modified": "2023-04-24 19:20:54", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV011_Sonielson Juvino Silva\\Audiovisual\\Acesso\\BB200_HV011_Sonielson Juvino Silva.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7566893.0, "duration": 7566.89, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 10.466}, "Preservação": {"MDV_5122.avi": {"size_mb": 8930.8768, "modified": "2019-03-21 12:17:00", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV011_Sonielson Juvino Silva\\Audiovisual\\Preservação\\MDV_5122.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2471536.0, "duration": 2471.54, "resolution": "720x480", "fps": 29.97}, "MDV_5123.avi": {"size_mb": 8747.3869, "modified": "2019-03-21 11:32:32", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV011_Sonielson Juvino Silva\\Audiovisual\\Preservação\\MDV_5123.avi", "category": "Video", "dimension": "720x480", "height": 4 es\nMonteiro, 08 de outubro de 2008\nRealização Museu da Pessoa\nCódigo: BB200_ HV011 \nTranscrito por Regina Paula de Souza\nRevisado por Caroline Aparecida de Lima\nTítulo\nO banco proporciona.\nBiografia\nSonielsom Jovio da Silva nasceu em 01 de julho de 1961 em Monteiro logo foi para cidade vizinha de Sumé. Foi para Campina Grande estudar, fazer universidade. Conheceu sua esposa na universidade, os dois fizeram um concurso para vagas na agência do Banco do Brasil em Monteiro. Passaram, casaram e construíram carreira no banco. Viajou o Brasil todo a trabalho representando diferentes cargos no Banco do Brasil.\nSinopse\n“Cursou Química mas fez carreira no Banco do Brasil, começou guardando pastas. Cresceu dentro do banco como gerente, propondo soluções para problemas da comunidade. Casou com a namorada da universidade, teve duas filhas. Escritor de literatura de cordel nas horas vagas. Escreveu cordéis em homenagem aos 200 anos do Banco do Brasil e a mercearia de seu pai. ”\nPalavras-chaves\nBanco do Brasil\nFundação Banco do Brasil\nCaatinga\nAgencia"}, "folder_size_gb": 0.0}, "folder_size_gb": 37.347}, "BB200_HV012_Alfredo de Queiroz Viana": {"Audiovisual": {"Acesso": {"BB200_HV012_Alfredo de Queiroz Viana.mp4": {"size_mb": 3952.6389, "modified": "2023-04-24 19:26:16", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV012_Alfredo de Queiroz Viana\\Audiovisual\\Acesso\\BB200_HV012_Alfredo de Queiroz Viana.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 2746677.0, "duration": 2746.68, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 3.86}, "Preservação": {"MDV_5126.avi": {"size_mb": 8692.0506, "modified": "2019-03-21 09:42:42", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV012_Alfredo de Queiroz Viana\\Audiovisual\\Preservação\\MDV_5126.avi", "cat Viu e atuou no desenvolvimento social e econômico de sua comunidade na Paraíba e no Nordeste.\nSINOPSE \nEntrevista de Alfredo de Queiroz Viana\nNordestino, trabalha na produção rural desde a infância. Dificuldade e superação financeira. Desenvolvimento no cooperativismo. Área rural e agricultura familiar, financiada, mas independente. \nPALAVRAS-CHAVE:\ninterior, rural, produção rural, família, tradição, dificuldade, superação, fazenda, gado, Caatinga, comunidade, associação, financiamento, Estado, produção, leite, empreendedorismo, Banco, produção rural, pecuária familiar, cabra, felicidade, união. \nP/1 – Seu Alfredo, muito obrigado por t"}, "folder_size_gb": 0.0}, "folder_size_gb": 13.627}, "BB200_HV013_Arlete Silva Andrade": {"Audiovisual": {"Acesso": {"BB200_HV013_Arlete Silva Andrade.mp4": {"size_mb": 6171.0754, "modified": "2023-04-24 17:26:26", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV013_Arlete Silva Andrade\\Audiovisual\\Acesso\\BB200_HV013_Arlete Silva Andrade.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3708738.0, "duration": 3708.74, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 6.026}, "Preservação": {"MDV_5128.avi": {"size_mb": 8254.8751, "modified": "2023-04-20 17:13:30", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV013_Arlete Silva Andrade\\Audiovisual\\Preservação\\MDV_5128.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2284448.0, "duration": 2284.45, "resolution": "720x480", "fps": 29.97}, "MDV_5129.avi": {"size_mb": 5390.312, "modified": "2023-04-20 16:56:42", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV013_Arlete Silva Andrade\\Audiovisual\\Preservação\\MDV_5129.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1491690.0, "duration": 1491.69, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 13.325}, "folder_size_gb": 19.352}, "Textual": {"BB200_HV013 Arlete Silva Andrade_rev.docx": {"size_mb": 0.0298, "modified": "2022-03-24 17:33:54", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV013_Arlete Silva Andrade\\Textual\\BB200_HV013 Arlete Silva Andrade_rev.docx", "category": "Textual", "content_preview": "Projeto Banco do Brasil - 200 anos de Brasil\nRealização Instituto Museu da Pessoa\nEntrevista de Arlete Silva Andrade\nEntrevistada por Luis Egito e Nádia Lopes\nCaicó, 09 de outubro de 2008\nCódigo: BB200_HV013\nTranscrito por Ana Caroline de Aguiar\nRevisado por João Vitor Muricy\nTítulo: A arte de bordar é uma terapia\nBiografia:\nArlete Silva Andrade nasceu em abril de 1951, em Caicó (RN). Filha de um artesão e de uma lavadeira de roupas, ela ajudava seus pais na infância. Tornou-se professora, casou-se e teve dois filhos, perdeu o marido em um acidente de carro e teve que cuidar dos filhos sozinha. Começou a bordar depois de formada e acredita que sua inspiração para bordar é um dom divino.\nSinopse:\nArlete passou sua infância em Caicó. Ajudava seus pais. Seu pai faleceu devido a uma asma e passou a morar com outra família. Se tornou professora de Ciências. Descobriu a arte de bordar depois de formada. Ajudou a revitalizar a associação de bordadeiras e começou a viajar pelo Brasil e o mundo afora para divulgar seus trabalhos.\nPalavras-chave: \nartesão\nlembranças\nCaicó\nsítio\nartesanato\ntrabalhos sociais\nfome\nmovimentos sociais\ncaatinga\nGrupo Escolar Senador Guerra\nbordado\nmilitante\ncoorde"}, "folder_size_gb": 0.0}, "folder_size_gb": 19.352}, "BB200_HV014_Maria Cândido Silva (Aurilene)": {"Audio , "BB200_HV014_Maria Cândido Silva (Aurilene)_rev.doc": {"size_mb": 0.1523, "modified": "2008-10-21 14:08:56", "extension": "DOC", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV014_Maria Cândido Silva (Aurilene)\\Textual\\BB200_HV014_Maria Cândido Silva (Aurilene)_rev.doc", "category": "Textual"}, "BB200_HV014_Maria Cândido Silva (Aurilene)_rev.docx": {"size_mb": 0.0273, "modified": "2026-02-11 16:33:56", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV014_Maria Cândido Silva (Aurilene)\\Textual\\BB200_HV014_Maria Cândido Silva (Aurilene)_rev.docx", "category": "Textual", "content_preview": "Banco do Brasil 200 anos \nDepoimento de Maria Cândido da Silva (Aurilene)\nEntrevistada por Luiz Egito e Nadia Lopes\nOrós, 10 de outubro de 2008\nRealização Museu da Pessoa\nEntrevista HV_014 \nTranscrito por Regina Paula de Souza\nP/1/1 – Bom dia, Aurilene! Obrigado por ter nos recebido aqui na casa da sua avó para essa entrevista. Eu queria que você disesse, por favor, o seu nome completo, o local e a data do seu nascimento.\nR – É, meu nome é Maria Cândida da Silva, Sítio Jurema, Orós, é, 20 de junho de 1979.\nP/1 – Qual é o nome dos seus pais?\nR – Francisco Cândido da Silva e Marineide Venâncio da Silva.\nP/1 – O que o seu pai fazia?\nR – Agricultor. \nP/1 – O que ele plantava?\nR – É, milho, feijão, arroz, na época que dava, mas, basicamente, milho e feijão. Algodão há alguns anos atrás! E só.\nP/1 – E a sua mãe?\nR – A minha mãe, ela fabricava, é, telão, rede de pesca, certo? Aqui na região ela. Não fabricar, ela só consertava mais, né, que as pessoas compravam pronto e ela só consertava. \nP/1 – Já havia o açude nessa época?\nR – Já, sim! \nP/1 – Você conheceu os seus avós?\nR – Todos os meus avós, sim!\nP/1 – Você podia dizer o nome deles?\nR – José Constantino, já faleceu. Gerônima, que é es"}, "folder_size_gb": 0.0}, "folder_size_gb": 19.452}, "BB200_HV015_Ananias Mendes de Farias (Manuel do Antão)": {"Audiovisual": {"Acesso": {" (Manuel do Antão)_dec.docx", "category": "Textual", "content_preview": ""}, "BB200_HV015_Ananias Mendes de Farias (Manuel do Antão)_rev.docx": {"size_mb": 0.0328, "modified": "2022-03-17 18:29:54", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV015_Ananias Mendes de Farias (Manuel do Antão)\\Textual\\BB200_HV015_Ananias Mendes de Farias (Manuel do Antão)_rev.docx", "category": "Textual", "content_preview": "BB 200 anos de Brasil\nRealização Instituto Museu da Pessoa\nEntrevista de Ananias Mendes de Farias, “Manuel do Antão” \nEntrevistado por Luis Egito e Nádia Lopes\nQuixadá, 10 de outubro de 2008\nCódigo: BB200_HV015\nTranscrito por Karina Medici Barrella\nRevisado por Silvia C S Coelho\nTítulo: “Eu só deixo o meu Ceará no último pau-de-arara”\nBiografia: Ananias Mendes de Farias nasceu em 1955, em Fortaleza, mas muito de sua história de vida se passa em Quixadá, no interior do Ceará.  Seu pai era pecuarista e sua mãe agricultora. Trabalha na produção de ovinocaprinocultura.  \nÉ casado com Dona Amélia, os dois têm quatro filhos. \nSinopse: Ainda pequeno, a cidade cresceu muito e sua família teve que se mudar para o sertão. A criação de gado e a plantação de algodão foram atividades exercidas pela família, até aparecer uma praga (Bicudo) que destruiu toda a cadeia produtiva da cidade. Mostra as mudanças de perspectiva da comunidade, no início dos anos 2000, com ações entre Governo Federal e Banco do Brasil, que fomentaram a economia e produção local. \nPalavras-chave: algodão, governo Lula, Nordeste, Quixadá, Banco do Brasil, Fortaleza, vacaria, Fortaleza, sertão, Universidade do Edson Queiroz,"}, "folder_size_gb": 0.0}, "folder_size_gb": 21.974}, "BB200_HV016_Rita Maria de Oliveira": {"Audiovisual": {"Acesso": {"BB200_HV016_Rita Maria de Oliveira.mp4": {"size_mb": 7016.6971, "modified": "2023-04-24 19:54:56", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV016_Rita Maria de Oliveira\\Audiovisual\\Acesso\\BB2 nco do Brasil também e minha mãe é diretora de escola aposentada.\nP/1 – Seu pai trabalhou sempre no Banco do Brasil?\nR – Sempre, ele chegou a trabalhar logo depois de formado em alguns empreendimentos de colonização lá na Margem de São Francisco lá no Rasgo da Catarina, mas logo entrou no Banco do Brasil e ficou lá até se aposentar, trabalhou trinta e poucos anos no banco.\nP/1 – Você sabe quando ele entrou no Banco?\nR - Foi em 1954 se não me engano, não sei a data exata.\nP/1 – Você conheceu seus"}, "folder_size_gb": 0.0}, "folder_size_gb": 31.266}, "BB200_HV018_Yamandu Costa": {"Audiovisual": {"Acesso": {"BB200_HV018_Yamandu Costa.mp4": {"size_mb": 4967.5362, "modified": "2023-04-24 20:15:58", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV018_Yamandu Costa\\Audiovisual\\Acesso\\BB200_HV018_Yamandu Costa.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3099430.0, "duration": 3099.43, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 4.851}, "Preservação": {"MDV_5140.avi": {"size_mb": 8997.184, "modified": "2019-03-21 09:10:10", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV018_Yamandu Costa\\Audiovisual\\Preservação\\MDV_5140.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2489887.0, "duration": 2489.89, "resolution": "720x480", "fps": 29.97}, "MDV_5141.avi": {"size_mb": 2372.4862, "modified": "2019-03-21 09:48:20", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV018_Yamandu Costa\\Audiovisual\\Preservação\\MDV_5141.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "St os moravam junto com nós, os maternos ficaram morando na Picada Feliz. Quem tinha mais contato eram os paternos. Quando era pequeno eles sempre contavam a"}, "folder_size_gb": 0.0}, "folder_size_gb": 31.313}, "BB200_HV020_Iolanda Geri Ritter": {"Audiovisual": {"Acesso": {"BB200_HV020_Iolanda Geri Ritter.mp4": {"size_mb": 6000.5276, "modified": "2023-04-24 20:37:56", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV020_Iolanda Geri Ritter\\Audiovisual\\Acesso\\BB200_HV020_Iolanda Geri Ritter.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3728258.0, "duration": 3728.26, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 5.86}, "Preservação": {"MDV_5145.avi": {"size_mb": 8741.2384, "modified": "2019-03-22 08:56:28", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV020_Iolanda Geri Ritter\\Audiovisual\\Preservação\\MDV_5145.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2419050.0, "duration": 2419.05, "resolution": "720x480", "fps": 29.97}, "MDV_5146.avi": {"size_mb": 4968.0867, "modified": "2019-03-22 09:23:18", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV020_Iolanda Geri Ritter\\Audiovisual\\Preservação\\MDV_5146.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1374840.0, "duration": 1374.84, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 13.388}, "folder_size_gb": 19.248}, "Textual": {"BB200_HV020_Iolanda Geri Ritter_dec.docx": {"size_mb": 0.0128, "modified": "2019-03-26 07:22:06", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV020_Iolanda Geri Ritter\\Textual\\BB200_HV020_Iolanda Geri Ritter_dec.docx", "category": "Textual", "content_preview": ""}, "BB200_HV020_Iolanda Geri Ritter_rev.docx": {"size_mb": 0.0298, "modified": "2022-03-28 17:53:22", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV020_Iolanda Geri Ritter\\Textual\\BB200_HV020_Iolanda Geri Ritter_rev.docx", "category": "Textual", "content_preview": "Projeto Fundação Banco do Brasil\nRealização Instituto Museu da Pessoa \nEntrevista de Iolanda Gere Ritter\nEntrevistada por Luiz Egypto e Ricardo Petrônio \nSão Lourenço do Sul, 22 de outubro de 2008\nCódigo: BB200_HV020\nTranscrito por Rosângela Maria Nunes Henriques\nRevisado por Vanessa Carla Santos\nTítulo\nDe volta às raízes pomeranas\nMinibio\nIolanda Gere Ritter, nascida na cidade e São Lourenço do Sul no dia 22 de outubro de 1974. É a caçulinha do nove filhos de dona Leny Gere. Passou a infância na roça e se emociona com as lembranças daquele tempo. A origem familiar é meio Italiano e meio Alemão Pomerano. Desde pequena despertou para a culinária e é através dela que resgata suas raízes.\nSinopse\nEntrevista de Iolanda Gere Ritter\nNascida na cidade de São Lourenço do Sul. Infância vivida na roça. Culinária. Resgate cultural da imigração alemã pomerana. Sopa de galinha caipira. Spickbrust - ganso defumado. Biscoitos caseiros e pães. Informalidade. Empreendedorismo. Banco do Brasil. Crescimento. \nTags\nAlemanha, pomerana, infância, roça, irmãos, mãe, culinária, biscoitos, forno de rua, pai, Igreja Luterana, currículo, sopa, galinha caipira, ganso defumado, spickbrust, casamento, tradição,"}, "folder_size_gb": 0.0}, "folder_size_gb": 19.248}, "BB200_HV021_Nilmar da Silva Conceição": {"Audiovisual": {"Acesso": {"BB200_HV021_Nilmar Silva.mp4": {"size_mb": 10629.613, "modified": "2023-04-24 20:52:58", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV021_Nilmar da Silva Conceição\\Aud on": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV021_Nilmar da Silva Conceição\\Textual\\BB200_HV021_Nilmar Silva da Conceição_dec.docx", "category": "Textual", "content_preview": ""}, "BB200_HV021_Nilmar Silva da Conceição_rev.docx": {"size_mb": 0.0572, "modified": "2022-03-24 17:44:50", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV021_Nilmar da Silva Conceição\\Textual\\BB200_HV021_Nilmar Silva da Conceição_rev.docx", "category": "Textual", "content_preview": "Projeto BB 200 Anos de Brasil\nEntrevistado por Luis Egito e Ricardo Pedroni\nDepoimento de Nilmar Silva da Conceição\nPelotas, 23 de outubro de 2008\nRealização Museu da Pessoa\nDepoimento BB200_HV021\nTranscrito por Denise Yonamine\nRevisado por Thais Montanari\nA pesca e a construção de uma comunidade\nMiniBio\nSinopse\nLembrança da primeira vez que saiu para o mar. O que aprendeu com as primeiras viagens de pesca. Métodos e técnicas de pesca. As dificuldades de se viver da pesca. Gestão no sindicato e suas conquistas para a comunidade. A importância do Banco do Brasil no estímulo das atividades produtivas da pesca na comunidade. Os fatos mais marcantes do crescimento da comunidade Z3.\nTags\nFlorianópolis; Santa Catarina; Pelotas; Pesca; Pescadores; Comunidade; Colônia Z3, Pesca predatória, Tainha, Camarão, Linguado, Corvina, Bagrinho, Ibama, Embarcações, Barco, traineira, fiscalização, sindicato, filetamento, cooperativa, Banco do Brasil, Pronaf, Atravessador, Emater.\nP/1 – Bom Dia Nilmar, obrigado por você ter aceitado nos dar esse depoimento. Pra começar eu queria que, por favor, você dissesse o seu nome completo, local e a data do seu nascimento.\nR – Eu me chamo Nilmar Silva da Conceiçã"}, "folder_size_gb": 0.0}, "folder_size_gb": 34.419}, "BB200_HV022_Luiz Carlos Amaral": {"Audiovisual": {"Acesso": {"BB200_HV022_Luiz Carlos Amaral.mp4": {"size_mb": 9370.9134, "modified": "2023-04-24 21:06:00", "extension": "MP4", "full_path": "D:\\Banco do Brasil ( -28 05:59:18", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV022_Luiz Carlos Amaral\\Textual\\BB200_HV022_Luiz Carlos Amaral_dec.docx", "category": "Textual", "content_preview": ""}, "BB200_HV022_Luiz Carlos Amaral_rev.docx": {"size_mb": 0.0405, "modified": "2022-03-28 17:53:38", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV022_Luiz Carlos Amaral\\Textual\\BB200_HV022_Luiz Carlos Amaral_rev.docx", "category": "Textual", "content_preview": "Projeto: BB 200 anos de Brasil\nRealização: Instituto Museu da Pessoa\nEntrevista de: Luiz Carlos Amaral \nEntrevistado por: Luiz Egypto (P/1) e Ricardo Pedroni (P/2)\nLocal: Bagé, Rio Grande do Sul.\nData: 24 de outubro de 2008\nCódigo: BB200_HV022\nTranscrito por: Michelle de Oliveira Alencar\nRevisado por: Bianca Araújo\nTítulo: De geração em geração, produção rural impulsionada com o acesso ao crédito\nMinibio:\nLuiz Carlos Amaral, nascido em 1951, natural de Santa Vitória do Palmar, no Rio Grande do Sul, viveu em meio ao setor rural: da família com origens vindas de fazendas, da graduação em veterinária na Universidade Federal de Pelotas até a vida profissional, trabalhando para setores governamentais e auxiliando famílias a gerirem melhor seus negócios agropecuários.\nSinopse:\nLuiz Carlos Amaral nasceu em Santa Vitória do Palmar (RS). Graduou-se em veterinária na Universidade Federal de Pelotas. Trabalhou em Santa Catarina, na Acaresc, e depois foi para a Emater, em Bagé. Trabalha no suporte a famílias do setor rural, com capacitações, conselhos e em parceria com o Banco do Brasil, apoiando o acesso ao crédito para que possam administrar melhor os negócios.\nTags: \nSanta Vitória de Palmar"}, "folder_size_gb": 0.0}, "folder_size_gb": 29.503}, "BB200_HV023_Antônio Aguiar Gouveia": {"Audiovisual": {"Acesso": {"BB200_HV023_Antônio Aguiar Gouveia.mp4": {"size_mb": 9471.9085, "modified": "2023-04-24 21:19:08", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB20  "modified": "2019-03-29 06:54:02", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV023_Antônio Aguiar Gouveia\\Textual\\BB200_HV023_Antônio Aguiar Gouveia_dec.docx", "category": "Textual", "content_preview": ""}, "BB200_HV023_Antônio Aguiar Gouveia_rev.docx": {"size_mb": 0.0389, "modified": "2022-03-24 17:29:54", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV023_Antônio Aguiar Gouveia\\Textual\\BB200_HV023_Antônio Aguiar Gouveia_rev.docx", "category": "Textual", "content_preview": "Projeto: Banco do Brasil 200 anos \nEntrevistado por: Nadia Lopes\nDepoimento de: Antônio Carlos A. Gouveia [Carlão]\nLocal: São Paulo\nData: 23 de outubro de 2008\nRealização: Instituto Museu da Pessoa\nCódigo: BB200_HV023 \nTranscrito por: Regina Paula de Souza\nRevisado por: Bruna Melo dos Santos Duque Estrada\nDo Acre aos Aces: as conquistas do Capitão da Seleção \nMinibiografia: \nAntônio Carlos Aguiar Gouveia, personagem importante da história do voleibol brasileiro, mais conhecido como Carlão, nasceu no dia 20 de abril de 1965, no Acre. Dentre suas inúmeras conquistas no esporte, a vitória nos jogos olímpicos de 1992, em Barcelona, tem espaço de destaque em sua biografia. Sobre as vitórias da vida, a família, a esposa e os filhos são motivos de orgulho. O campeão atribui parte do sucesso às origens, que é fruto da Amazônia Brasileira.\nSinopse:\nInfância em Rio Branco, no Acre. Peraltices de crianças em meio a Amazônia. Trajetória de vida ligada ao esporte. Viajou o mundo jogando vôlei. Campeão olímpico. Capitão da seleção brasileira de voleibol. Família, esposa e filhos. Incentivador do esporte que tem o potencial de mudar vidas. \nTags:\nInfância\nBrincadeira\nFamília\nAmigos\nFilhos\nEsposa"}, "folder_size_gb": 0.0}, "folder_size_gb": 29.815}, "BB200_HV024_Déa Santos Melo": {"Audiovisual": {"Acesso": {"BB200_HV024_Déa Santos Melo.mp4": {"size_mb": 12120.8784, "modified": "2023-04-24 21:35:54", "extension": "MP4", "full_p  "2019-04-01 08:02:22", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV024_Déa Santos Melo\\Textual\\BB200_HV024_Déa Santos Melo_dec.docx", "category": "Textual", "content_preview": ""}, "BB200_HV024_Déa Santos Melo_rev.docx": {"size_mb": 0.0417, "modified": "2022-03-28 17:05:22", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV024_Déa Santos Melo\\Textual\\BB200_HV024_Déa Santos Melo_rev.docx", "category": "Textual", "content_preview": "Projeto Banco do Brasil - 200 anos de Brasil\nRealização Instituto Museu da Pessoa\nEntrevista de Dea Santos Melo\nEntrevistada por Nádia Lopes e Marta Delelis\nBelém, 03 de dezembro de 2008\nCódigo: BB200_HV024\nTranscrito por Vanuza Ramos\nRevisado por Adriane Pena da Silva\nTítulo: Cantar a minha aldeia, dançar as minhas raízes\nBio: Dea Santos Melo nasceu em Belém, no dia 26 de dezembro de 1964. Filha de maranhenses, foi criada na região da Amazônia. Dea estudou na escola Gentil Bittencourt e formou-se em Jornalismo. Trabalhou na TV cultura. Foi para São Paulo especializar-se em comunicação criativa. Trabalhou com consultoria de administração cultural, participa do Fórum de Belém e fundou uma organização voltada para danças circulares oriunda dos povos antigos, o Mana-Maní.\nSinopse:\nInfância marcante. Perda. Busca pelo fortalecimento e individualidade a partir de suas raízes. Identidade. Saias. Danças circulares e suas representações. Trajetória profissional. Televisão e arte. A busca do simbólico como propósito de mudança de visão de mundo. Relação humano/ natureza. Comunicação criativa. Vida. Brasilidades amazonenses e do restante do país.\nPalavras-chave: Belém, São Paulo, comunicação"}, "folder_size_gb": 0.0}, "folder_size_gb": 37.947}, "BB200_HV025_Ricardo Teixeira de Sousa": {"Audiovisual": {"Acesso": {"BB200_HV025_Ricardo Teixeira de Sousa.mp4": {"size_mb": 11668.3503, "modified": "2023-04-24 21:51:04", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200) ia pela Universidade Federal do Amazonas, casou-se e teve dois filhos. Dedicou muitos anos de sua vida à carreira acadêmica.\nSinopse: Infância na região do rio Maria Paula, Amazonas. Formação em Engenharia. Interesse pela Física. Pós-graduação em São Paulo e nos Estados Unidos. Dedicação à vida acadêmica. Coordenação da Universidade Federal do Amazonas. Reitoria. Reflexão sobre a vida.\nPalavras-chaves: infância; família; brincadeiras; Amazonas; Manaus; São Paulo; vegetação; rio; viagens; cultura; sonho; carreira; ensino; pesquisa; universidade; física.\nP/1 – Boa"}, "folder_size_gb": 0.0}, "folder_size_gb": 28.719}, "BB200_HV030_Luiz Almeida dos Reis": {"Audiovisual": {"Acesso": {"BB200_HV030_Luiz Almeida dos Reis.mp4": {"size_mb": 7612.4765, "modified": "2023-04-24 22:55:08", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV030_Luiz Almeida dos Reis\\Audiovisual\\Acesso\\BB200_HV030_Luiz Almeida dos Reis.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4939534.0, "duration": 4939.53, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 7.434}, "Preservação": {"MDV_5174.avi": {"size_mb": 10071.5419, "modified": "2019-03-21 11:02:30", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV030_Luiz Almeida dos Reis\\Audiovisual\\Preservação\\MDV_5174.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2787221.0, "duration": 2787.22, "resolution": "720x480", "fps": 29.97}, "MDV_5175.avi": {"size_mb": 8923.2816, "modified": "2019-03-21 11:51:42", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV030_Luiz Almeida dos Reis\\Audiovisual\\Preservação\\MDV_5175.avi", "category": "Video", "dimension": ricultura buscando recursos para a criação de uma cooperativa voltada principalmente à bananicultura no norte do país.  \nSinopse: A história da vida de um trabalhador rural, filho de agricultores, Luiz Almeida dos Reis conta a respeito das dificuldades encontradas ao longo de sua trajetória, bem como os benefícios da persistência e importância da união das pessoas em busca de um  objetivo comum.\nPalavras Chave: agricultores, agricultura, trabalho, trabalhadores, escola, rural, barco, viagem, rio, banana, bananas, bananal, bananicultura, plantação, pratona, cooperativa, Rondônia, Man"}, "folder_size_gb": 0.0}, "folder_size_gb": 26.304}, "BB200_HV031_José Nicodemus de Góes (Dédinho)": {"Audiovisual": {"Acesso": {"BB200_HV031_José Nicodemus de Goes Dedinho.mp4": {"size_mb": 8189.0545, "modified": "2023-04-24 23:05:54", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV031_José Nicodemus de Góes (Dédinho)\\Audiovisual\\Acesso\\BB200_HV031_José Nicodemus de Goes Dedinho.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5066595.0, "duration": 5066.6, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 7.997}, "Preservação": {"MDV_5177.avi": {"size_mb": 8873.491, "modified": "2019-03-21 12:46:18", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV031_José Nicodemus de Góes (Dédinho)\\Audiovisual\\Preservação\\MDV_5177.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2455653.0, "duration": 2455.65, "resolution": "720x480", "fps": 29.97}, "MDV_5178.avi": {"size_mb": 8705.312, "modified": "2019-03-22 08:41:18", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV031_José Nicodemus de Góes (Dédinho)\\Audiovisual\\Preservação\\MDV_5178.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2409106.0, "duration": 2409.11, "resolution": "720x480", "fps": 29.97}, "MDV_5179.avi": {"size_mb": 1093.5452, "modified": "2019-03-22 08:47:42", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV031_José Nicodemus de Góes (Dédinho)\\Audiovisual\\Preservação\\MDV_5179.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 302569.0, "duration": 302.57, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 18.235}, "folder_size_gb": 26.232}, "Textual": {"BB200_HV031_José Nicodemus de Góes (Dédinho)_dec.docx": {"size_mb": 0.0137, "modified": "2019-04-17 05:43:50", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV031_José Nicodemus de Góes (Dédinho)\\Textual\\BB200_HV031_José Nicodemus de Góes (Dédinho)_dec.docx", "category": "Textual", "content_preview": ""}, "BB200_HV031_José Nicodemus de Góes (Dédinho)_rev.doc": {"size_mb": 0.1548, "modified": "2008-12-02 14:40:40", "extension": "DOC", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV031_José Nicodemus de Góes (Dédinho)\\Textual\\BB200_HV031_José Nicodemus de Góes (Dédinho)_rev.doc", "category": "Textual"}, "BB200_HV031_José Nicodemus de Góes (Dédinho)_rev.docx": {"size_mb": 0.0375, "modified": "2026-02-11 16:34:06", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV031_José Nicodemus de Góes (Dédinho)\\Textual\\BB200_HV031_José Nicodemus de Góes (Dédinho)_rev.docx", "category": "Textual", "content_preview": "Projeto Banco do Brasil 200 anos de Brasil\nDepoimento de José Nicodemos de Góis, o Dédinho. \nEntrevistada por Nádia Lopes (P/1) e Lenita Verônica Pires (P/2)\nBoa Vista, Roraima, 08 de novembro de 2008\nRealização Instituto Museu da Pessoa.Net\nEntrevista n° BB200_HV_031\nTranscrito por Michelle de Oliveira Alencar\nP/1 – Bom dia, senhor Dedinho.\nR – Bom dia.\nP/1 – Pra começar eu gostaria que o senhor dissesse o seu nome completo, local e data de nascimento.\nR – Meu nome é José Nicodemos de Góis, nasci no dia 27 do 11 de 47, em Caraúba, Rio Grande do Norte.\nP/1 – E por que apareceu Dédinho? Da onde vem esse apelido?\nR – Não, esse apelido Dédinho é que meu pai todo filho ele botava um apelido, tanto fazia ser homem como mulher. Agora ele botou esse apelido em mim, nem eu sei porque, todo mundo pergunta, né, eu não sei porque esse apelido. E é pouco Dédinho que tem no Brasil, pelo menos eu só conheci um lá no Rio Grande do Norte, e até o cara dizia assim: “Ei Dédinho, quando a coisa”, Dédinho sapateiro, que tinha um Dédinho sapateiro e tinha eu que era o Dédinho. E aqui em Boa Vista não tem nenhum com esse nome. Tem Dédim Gouveia, mas é Dédim, o meu é Dédinho. Dédim Gouveia a senhora sabe"}, "folder_size_gb": 0.0}, "folder_size_gb": 26.232}, "BB200_HV032_Antonio Sevegnando Damasceno Rosa": {"Audiovisual": {"Acesso": {"BB200_HV032_Antonio Sevegnando Damaseno Rosa.mp4": {"size_mb": 6479.7522, "modified": "2023-04-24 23:14:32", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV032_Antonio Sevegnando Damasceno Rosa\\Audiovisual\\Acesso\\BB200_HV032_Antonio Sevegnando Damaseno Rosa.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4134998.0, "duration": 4135.0, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 6.328}, "Preservação": {"MDV_5180.avi": {"size_mb": 8497.5593, "modified": "2019-03-22 09:32:10", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV032_Antonio Sevegnando Damasceno Rosa\\Audiovis nia Wapichana, nasceu em Boa Vista, Roraima, e passou parte da infância também na Venezuela, retornando ao Brasil em meados da década de 1970. Começou a trabalhar no Banco do Brasil, aos 14 anos de idade, como menor aprendiz, chegou ao cargo de gerente de contas e presidiu a Associação Atlética Banco do Brasil em Boa Vista.\nSinopse: Natural de Roraima, chegou a morar na Venezuela. Ao retornar ao Brasil, inicia sua carreira no Banco do Brasil como menor aprendiz, tornando-se uma espécie de referência para sua família. Torna-se muito engajado na Associação Atlética banco do Brasil, honrando sua paixão por esportes que praticava em sua infância e juventude.\nTags: Wapichana; indígenas; Roraima; regionalismo; mudança; infância; Banco do Br"}, "folder_size_gb": 0.0}, "folder_size_gb": 21.146}, "BB200_HV033_Francisco Roberto do Nascimento (Chico Roberto)": {"Audiovisual": {"Acesso": {"BB200_HV033_Francisco Roberto do Nascimento.mp4": {"size_mb": 5597.0092, "modified": "2023-04-24 23:21:34", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV033_Francisco Roberto do Nascimento (Chico Roberto)\\Audiovisual\\Acesso\\BB200_HV033_Francisco Roberto do Nascimento.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3364461.0, "duration": 3364.46, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 5.466}, "Preservação": {"MDV_5182.avi": {"size_mb": 8918.5784, "modified": "2019-03-22 11:01:28", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV033_Francisco Roberto do Nascimento (Chico Roberto)\\Audiovisual\\Preservação\\MDV_5182.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2468132.0, "duration": 2468.13, "resolution": "720x480", "fps": 29.97}, "MDV_5183.avi": {"size_mb": 3441.5734, "modified": "2019-03-22 11:24:54", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV033_Francisco Roberto do Nascimento (Chico Roberto)\\Audiovisual\\Preservação\\MDV_5183.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 952385.0, "duration": 952.38, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 12.07}, "folder_size_gb": 17.536}, "Textual": {"BB200_HV033_Francisco Roberto do Nascimento (Chico Roberto)_dec.docx": {"size_mb": 0.0139, "modified": "2019-04-05 07:14:06", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV033_Francisco Roberto do Nascimento (Chico Roberto)\\Textual\\BB200_HV033_Francisco Roberto do Nascimento (Chico Roberto)_dec.docx", "category": "Textual", "content_preview": ""}, "BB200_HV033_Francisco Roberto do Nascimento (Chico Roberto)_rev.docx": {"size_mb": 0.0308, "modified": "2022-03-28 17:00:44", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV033_Francisco Roberto do Nascimento (Chico Roberto)\\Textual\\BB200_HV033_Francisco Roberto do Nascimento (Chico Roberto)_rev.docx", "category": "Textual", "content_preview": "Projeto Banco do Brasil - 200 anos de Brasil\nRealização Instituto Museu da Pessoa\nEntrevista de Francisco Roberto do Nascimento, “Chico Roberto”\nEntrevistado por Nádia Lopes e Marta Delellis\nPacaraima, 09 de novembro de 2008 \nCódigo: BB200_HV033\nTranscrito por Karina Medici Barrella\nRevisado por Thaís Salomão Gomes\nTítulo: \nOportunidade para todos: Um projeto de vida\nBiografia:\nFrancisco Roberto do Nascimento nasceu em Boa Vista, Roraima, em 1955. Conhecido como “Chico Roberto”, passou sua infância em Surumu. Estudou em Boa Vista e virou jogador do Baré por 20 anos. Também foi professor de Educação Física e sargento da Polícia Militar. Funcionário aposentado do Banco do Brasil, participou do crescimento da instituição na Região. Também foi prefeito por duas vezes de Pacaraima, atuando junto às comunidades indígenas.\nSinopse:\nComunidade Indígena em Roraima. Estudou em internato. Mudança para capital do Estado. Jogador de futebol. Esporte como abertura de caminhos. Concurso no Banco do Brasil. Atuação na Instituição em toda a Região. Comunidades Indígenas. Pecuária. Agricultura. Política. Participação na história de Pacaraima. Solidariedade. Valor da amizade. Reflexão sobre a vida.\nP"}, "folder_size_gb": 0.0}, "folder_size_gb": 17.536}, "BB200_HV034_Luciano Peres Bonifácio": {"Audiovisual": {"Acesso": {"BB200_HV034_Luciano Peres Bonifácio.mp4": {"size_mb": 6650.5507, "modified": "2023-04-24 23:30:22", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV034_Luciano Peres Bonifácio\\Audiovisual\\Acesso\\BB200_HV034_Luciano Peres Bonifácio.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4030560.0, "duration": 4030.56, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 6.495}, "Preservação": {"MDV_5184.avi": {"size_mb": 8865.6547, "modified": "2019-03-25 09:09:22", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV034_Luciano Peres Bonifácio\\Audiovisual\\Preservação\\MDV_5184.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2453484.0, "duration": 2453.48, "resolution": "720x480", "fps": 29.97}, "MDV_5185.avi": {"size_mb": 5910.7948, "modified": "2019-03-25 09:43:52", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV034_Luciano Peres Bonifácio\\Audiovisual\\Preservação\\MDV_5185.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1635734.0, "duration": 1635.73, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 14.43}, "folder_size_gb": 20.925}, "Textual": {"BB200_HV034_Luciano Peres Bonifacio_rev.doc": {"size_mb": 0.1226, "modified": "2008-11-18 08:10:30", "extension": "DOC", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV034_Luciano Peres Bonifácio\\Textual\\BB200_HV034_Luciano Peres Bonifacio_rev.doc", "category": "Textual"}, "BB200_HV034_Luciano Peres Bonifacio_rev.docx": {"size_mb": 0.0278, "modified": "2026-02-11 16:34:09", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV034_Luciano Peres Bonifácio\\Textual\\BB200_HV034_Luciano Peres Bonifacio_rev.docx", "category": "Textual", "content_preview": "BB 200 anos de Brasil\nDepoimento de Luciano Perez Bonifacio\nEntrevistado por Nádia Lopes e Lenita Verônica\nPacaraima, 09/11/2008\nRealização Museu da Pessoa\nEntrevista BB200_HV_034\nTranscrito por Karina Medici Barrella\nP/1 – Boa tarde, Luciano. Pra começar, eu gostaria que você dissesse o seu nome completo, local e data de nascimento.\nR – Meu nome é Luciano Perez Bonifacio, nascido a cinco de janeiro de 1952, aqui na comunidade Barra, Surumu, município de Pacaraima.\nP/1 – E tem essa coisa do registro indígena?\nR – Tenho.\nP/1 – Como que é?\nR – Tenho o civil e o indígena.\nP/1 – O registro foi tirado quando nasceu, mesmo? Ou foi depois? Como é que é?\nR – Logo que a Funai começou a assentar o posto aqui na região, eu solicitei o registro indígena. Isso foi em 1998.\nP/1 – Qual o nome dos seus pais?\nR – Hilário Bonifacio, pai. Mãe, América Perez.\nP/1 – E eles são daqui mesmo?\nR – São nascidos aqui, Makuxis mesmo, nativos daqui.\nP/1 – O povo é Makuxi?\nR – Aqui, a predominância é Makuxi. Alguns Wapixanas, mas é minoria. Aqui na região do Surumu prevalece o Makuxi.\nP/1 – E a língua é a Makuxi?\nR – É Makuxi.\nP/1 – Qual a diferença entre um povo e outro? Tem muita diferença?\nR – O mais próximo"}, "BB200_HV034_Luciano Peres Bonifácio_dec.docx": {"size_mb": 0.0147, "modified": "2019-04-10 07:43:42", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV034_Luciano Peres Bonifácio\\Textual\\BB200_HV034_Luciano Peres Bonifácio_dec.docx", "category": "Textual", "content_preview": ""}, "folder_size_gb": 0.0}, "folder_size_gb": 20.925}, "BB200_HV035_Jean Fernandes dos Santos Júnior": {"Audiovisual": {"Acesso": {"BB200_HV035_Jean Fernandes dos Santos Júnior.mp4": {"size_mb": 16457.5112, "modified": "2023-04-24 15:49:36", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV035_Jean Fernandes dos Santos Júnior\\Audiovisual\\Acesso\\BB200_HV035_Jean Fernandes dos Santos Júnior.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 9885176.0, "duration": 9885.18, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 16.072}, "Preservação": {"MDV_5186.avi": {"size_mb": 8289.1123, "modified": "2019-03-25 15:02:36", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV035_Jean Fernandes dos Santos Júnior\\Audiovisual\\Preservação\\MDV_5186.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2293925.0, "duration": 2293.93, "resolution": "720x480", "fps": 29.97}, "MDV_5187.avi": {"size_mb": 8362.4133, "modified": "2019-03-25 15:42:26", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV035_Jean Fernandes dos Santos Júnior\\Audiovisual\\Preservação\\MDV_5187.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.9 35_Jean Fernandes Junior_rev.docx": {"size_mb": 0.0487, "modified": "2026-02-11 16:34:11", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV035_Jean Fernandes dos Santos Júnior\\Textual\\BB200_HV035_Jean Fernandes Junior_rev.docx", "category": "Textual", "content_preview": "BB 200 anos de Brasil\nDepoimento de Jean Fernandes dos Santos Junior\nEntrevistado por Nádia Lopes e Lenita Verônica Pires\nCampo Grande, 11/11/2008\nRealização Museu da Pessoa\nEntrevista BB200_HV_035\nTranscrito por Karina Medici Barrella\nP/1 – Boa tarde, Jean.\nR – Boa tarde.\nP/1 – Pra começar, eu gostaria que você dissesse o seu nome completo, local e data de nascimento.\nR – Meu nome é Jean Fernandes dos Santos Junior, nasci em Goiânia, no dia oito de abril de 1978. Tenho orgulho de ter nascido naquela cidade, que trouxe várias coisas boas pra mim, onde aprendi muito com o povo local, com as pessoas acolhedoras. Tudo de bom que eu trouxe pra esse Estado aqui, é a região de Goiás e de Goiânia.\nP/1 – O nome dos seus pais?\nR – Jean Fernandes dos Santos e Celi Alves Fernandes.\nP/1 – Seus pais eram de Goiânia também?\nR – Meu pai nasceu em Goiânia, minha mãe nasceu em Minas. Eles se encontraram em Goiânia, onde formaram uma família maravilhosa. Toda a minha família é de Goiânia, não tenho nenhum parente em Campo Grande, a gente deixou muitos laços bons naquela região.\nP/1 – Você lembra dos seus avós?\nR – Da parte de mãe não. Da parte do meu pai tenho meu avô que é meu xodó de tudo, ele mor"}, "folder_size_gb": 0.0}, "folder_size_gb": 51.672}, "BB200_HV036_Eurides Fátima Macena de Barros (Maria dos Jacarés)": {"Audiovisual": {"Acesso": {"BB200_HV036_Eurides Fátima Macena de Barros (Maria dos Jacarés).mp4": {"size_mb": 5285.4227, "modified": "2023-04-24 23:37:42", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV036_Eurides Fátima Macena de Barros (Maria dos Jacarés)\\Audiovisual\\Acesso\\BB200_HV036_Eurides Fátima Macena de Barros (Maria ria dos Jacarés)\\Textual\\BB200_HV036_Eurides Fátima Macena de Barros_rev.doc", "category": "Textual"}, "BB200_HV036_Eurides Fátima Macena de Barros_rev.docx": {"size_mb": 0.0205, "modified": "2026-02-11 16:34:14", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV036_Eurides Fátima Macena de Barros (Maria dos Jacarés)\\Textual\\BB200_HV036_Eurides Fátima Macena de Barros_rev.docx", "category": "Textual", "content_preview": "BB 200 anos de Brasil \nDepoimento de Eurides Fátima Macena de Barros, a Dona Maria\nEntrevistada por Lenita Verônica Pires e Nádia Lopes\nMiranda, 12 de novembro de 2008.\nRealização Museu da Pessoa \nEntrevista nº BB HV36\nTranscrito por Rosângela Maria Nunes Henriques.\nP/1 – Bom dia dona Maria?\nR – Bom dia.\nP/1 – Eu queria que a senhora começasse dizendo seu nome completo? \nR – O meu apelido é Dona Maria, mas meu nome completo de documento, da identidade, CIC, CPF e tudo é Eurides Fátima Macena de Barros.\nP/1 – E que dia, mês e ano a senhora nasceu e onde?\nR – Eu nasci em Miranda, eu sou de 1952 no dia 11 de março.\nP/1 – E esse apelido dona Maria de onde apareceu?\nR – Apareceu, porque quando eu tocava pousada no saloba me chamavam de Dona Maria, porque achavam meu nome difícil, então ficou... Todos os caminhoneiros que passam aqui, aqui é ponto de caminhoneiro e o nome de Maria ficou, mas meu nome não é esse não.\nP/1 – E o nome dos seus pais?\nR – O meu pai é Anacleto Rodrigues de Barros e da mamãe é Antônia Macena de Barros.\nP/1 – E o papai e a mamãe trabalhavam onde? O que eles faziam?\nR – O meu pai, ele tinha uma fazendinha, uma chácara no (Forraipi?) no Município de Miranda, lá que"}, "folder_size_gb": 0.0}, "folder_size_gb": 16.702}, "BB200_HV037_Ronaldo da Silva": {"Audiovisual": {"Acesso": {"BB200_HV037_Ronaldo da Silva.mp4": {"size_mb": 10656.2164, "modified": "2023-04-24 23:52:46", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV037_Ronaldo da Silva\\Audiovisual\\Acesso BB200)\\HV\\BB200_HV037_Ronaldo da Silva\\Textual\\BB200_HV037_Ronaldo da Silva_dec.docx", "category": "Textual", "content_preview": ""}, "BB200_HV037_Ronaldo da Silva_rev.doc": {"size_mb": 0.1743, "modified": "2008-11-28 10:12:20", "extension": "DOC", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV037_Ronaldo da Silva\\Textual\\BB200_HV037_Ronaldo da Silva_rev.doc", "category": "Textual"}, "BB200_HV037_Ronaldo da Silva_rev.docx": {"size_mb": 0.0452, "modified": "2026-02-11 16:34:17", "extension": "DOCX", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV037_Ronaldo da Silva\\Textual\\BB200_HV037_Ronaldo da Silva_rev.docx", "category": "Textual", "content_preview": "BB 200 Anos de Brasil\nDepoimento de Ronaldo da Silva\nEntrevistado por Nadja Lopes e Lenita Verônica Pires\nMiranda, 12 de novembro de 2008\nRealização Museu da Pessoa\nEntrevista BB200_HV037\nTranscrito por Vanuza Ramos\nP/1 – Ronaldo, Boa tarde. \n\nR – Boa tarde. \n\nP/1 – Obrigada por ter aceitado dar entrevista pra gente. Eu vou pedir pra você falar pra gente, aqui, o seu nome completo, local e data de nascimento. \n\nR – Ronaldo da Silva. Natural de Três Lagoas, Mato Grosso do Sul, do dia 24 de setembro de 1971.  \n\nP/1 – Qual é o nome dos seus pais? \n\nR – Benedicto da Silva e Francisca Isabela da Silva. \n\nP/1 – Você lembra dos seus avós? \n\nR – Paterno ou materno? \n\nP/1 – Os dois. \n\nR – Paterno é Joaquim Teodoro e dona Ana Glória. E do materno, meu avô chama José e minha avó, (Bela?), (apelido dela?), né? \n\nP/1 – Você lembra o que é que eles faziam? Eles eram da onde, seus avós? \n\nR – Os meus avós, do interior de São Paulo. O paterno, meu avô, ele saiu do Rio de Janeiro, aí no período do café ele veio pra São Paulo. Aí no período do ciclo tal, do café também aqui em Mato Grosso, na época, também ele veio pra Mato Grosso. E minha avó também acompanhou ele, desde o Rio de Janeiro até... E p"}, "folder_size_gb": 0.0}, "folder_size_gb": 35.336}, "BB200_HV038_Marcello Goring so do Sul. Tornou-se guia turístico no Pantanal. Casado, tem dois filhos de união anterior.\nSinopse:\nMarcelo não se adaptou à educação formal e fugia de todas as escolas em Corumbá. Pulava o muro e ia tomar banho de rio. Viveu o preconceito na família adotiva e superou dificuldades. Trabalhou como intérprete por saber inglês. Aprendeu diversos outros idiomas observando turistas e se redescobriu como guia no Pantanal, onde conheceu sua esposa, Miriam, franco-suíça. Mobiliza-se para ajudar indígenas da região.\nTags\nPantanal; índio; indígena; aldeia; etnias; kadiwéus; terenas; bororos; vanduzi; invasão; ecot"}, "folder_size_gb": 0.0}, "folder_size_gb": 39.225}, "BB200_HV039_Elton Pinheiro Karru": {"Audiovisual": {"Acesso": {"BB200_HV039_Elton Pinheiro Karru.mp4": {"size_mb": 9072.0885, "modified": "2023-04-25 00:23:26", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV039_Elton Pinheiro Karru\\Audiovisual\\Acesso\\BB200_HV039_Elton Pinheiro Karru.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5498660.0, "duration": 5498.66, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 8.859}, "Preservação": {"MDV_5200.avi": {"size_mb": 8985.6104, "modified": "2019-03-25 15:45:40", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV039_Elton Pinheiro Karru\\Audiovisual\\Preservação\\MDV_5200.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2486684.0, "duration": 2486.68, "resolution": "720x480", "fps": 29.97}, "MDV_5201.avi": {"size_mb": 8704.4681, "modified": "2019-03-25 16:29:50", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV039_Elton Pinheiro Karru\\Audiovisual\\Preservação\\MDV_5201.a Pinheiro Carru. Eu nasci em Panambi, município de Dourados em 31 de Março de 1963.\nP1 – E o nome dos seus pais, Elton?\nR – Meu pai se chama Nince Carru e a mãe Maria Soares Pinheiro Carru.\nP1 – Lembra dos avós também?\nR – Lembro, João Henrique Carru e Iolanda Pereira Carru. Eu não lembro dos avós maternos porque, ah, eles sumiram da história não sei como. Minha mãe... eles abandonaram minha mãe pequenininha.\nP1 – Você ta falando aí o sobrenome Carru, me explica um pouco a origem.\nR – O meu bisavô era alemão e ele veio para o Brasil e se casou, veio para o Rio de Janeiro, né, e se casou com uma mulata. E aí eu peguei o lado que escureceu da família e o Carru veio dele. Na verdade acho que não se escrevia Carru como é a grafia hoje, mas se escrevia Cara (?), a pronúncia é que era Carru. Depois acabou ficando Carru.\nP1 – Qual que era a atividade dos seus avós?\nR – O meu avô era um pequeno"}, "folder_size_gb": 0.0}, "folder_size_gb": 28.543}, "BB200_HV040_Vanderlei Doniseti Acassio dos Reis": {"Audiovisual": {"Acesso": {"BB200_HV040_Vanderlei Doniseti Acassio dos Reis.mp4": {"size_mb": 5164.0179, "modified": "2023-04-25 00:30:38", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV040_Vanderlei Doniseti Acassio dos Reis\\Audiovisual\\Acesso\\BB200_HV040_Vanderlei Doniseti Acassio dos Reis.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3105803.0, "duration": 3105.8, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 5.043}, "Preservação": {"MDV_5203.avi": {"size_mb": 8483.5739, "modified": "2019-03-25 17:28:56", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV040_Vanderlei Doniseti Acassio dos Reis\\Audiovisual\\Preservação\\MDV_5203.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", se seu nome completo, local e data de nascimento.\nR – Hum, hum... Meu nome é Vanderley Donizete Acácio dos Reis, eu nasci em Espírito Santo do Pinhal, no dia 29 de maio de 1971. Mas mudei... A minha família toda é de Andradas, Minas Gerais, e eu só não nasci lá, mas eu cresci e meus vínculos de amizades estão todos lá.\nP/1 – O nome dos seus pais?\nR – O nome do meu pai é Benedito Silvério dos Reis e da minha mãe é Vera Lúcia de Oliveira.\nP/1 – A atividade profissional dos seus pais?\nR – Meu pai é um comerciante e minha mãe, ela trabalha numa indústria cerâmica.\nP/1 – Comércio de que?\nR – É gerais. Compra, venda de móveis, animais, gado, né? É isso mesmo, várias coisas.\n\nP/1 – Você tem irmãos?\nR – Tenho. Tenho uma irmã e o nome dela é Valéria Regina dos Reis.\n\nP/1 – Apenas uma irmã?\nR – Somente uma irmã.\nP/1 – Quantos anos?\n\nR – Eu tenho 37 e ela 34.\nP/1 – E o que que ela faz?\nR – Ela é bibliotecária.\nP/1 – Beleza. Vand"}, "folder_size_gb": 0.0}, "folder_size_gb": 16.218}, "BB200_HV041_Geraldo Soares Pereira": {"Audiovisual": {"Acesso": {"BB200_HV041_Geraldo Soares Pereira.mp4": {"size_mb": 11798.142, "modified": "2023-04-25 00:45:56", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV041_Geraldo Soares Pereira\\Audiovisual\\Acesso\\BB200_HV041_Geraldo Soares Pereira.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7105432.0, "duration": 7105.43, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 11.522}, "Preservação": {"MDV_5205.avi": {"size_mb": 8923.5201, "modified": "2019-03-22 10:27:40", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV041_Geraldo Soares Pereira\\Audiovisual\\Preservação\\MDV_5205.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "au reira_rev.docx", "category": "Textual", "content_preview": "Projeto BB 200 Anos de Brasil\nDepoimento de Geraldo Soares Pereira\nEntrevistado por Lenita Verônica Pires e Nadja Lopes\nCorumbá, Mato Grosso do Sul, 15 de novembro de 2008\nRealização Museu da Pessoa\nEntrevista n° BB_HV041\nTranscrito por Vanuza Ramos\nP/1 – Senhor Geraldo, pra começar eu queria que o senhor falasse o nome completo do senhor.  \n\nR – Geraldo Soares Pereira. \n\nP/1 – E quando que o senhor nasceu? O dia, o mês e ano. \n\nR – Nasci em 1932, dia 05 de março de 1932. \n\nP/1 – E onde que o senhor nasceu? \n\nR – Em Montes Claros. \n\nP/1 – Em Minas Gerais? \n\nR – É. Mas, não foi bem na cidade, foi um município de Santa Rosa de Lima. Foi um município de onde nós morávamos. Fica pertinho de Montes Claros, mas lá nem cartório não tinha, a gente tinha que registrar lá em Montes Claros. Agora o nascimento foi lá, mas depois levou o registro pra registrar lá. Que quando foi pra mim vir pra São Paulo, foi obrigado a tirar o registro. Eu já tirei o registro com 14 anos. É, porque naquele tempo a coisa era tudo mudado, era muito parado demais. A senhora vê como meu pai pagava pra mó de eu estudar. E eu agradeço a ele porque eu aprendi escrever meu nome, que eu era distraído. Porque ele pagava"}, "folder_size_gb": 0.0}, "folder_size_gb": 36.796}, "BB200_HV042_Antonio Francisco de Lima Neto": {"Audiovisual": {"Acesso": {"BB200_HV042_Antonio Francisco de Lima Neto.mp4": {"size_mb": 4636.4121, "modified": "2023-04-25 00:52:06", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\HV\\BB200_HV042_Antonio Francisco de Lima Neto\\Audiovisual\\Acesso\\BB200_HV042_Antonio Francisco de Lima Neto.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3156687.0, "duration": 3156.69, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 4.528}, "Pr aleza.\nP/1 – E você podia falar o nome dos seus pais e a atividade deles?\nR - Minha mãe é Maria das dores Lima da Silva, é uma professora de escola pública em Fortaleza e meu pai, já falecido, Luís Antônio da Silva era representante comercial.\nP/1 – E o senhor tem irmãos?\nR – Tenho, tenho três irmãs a Ana Cleide Lima da Silva, a Ana Neuma Lima da Silva e Ana Neide Lima da Silva. São três irmãs.\nP/1 – E o senhor passa a infância em que bairro de Fortaleza?\nR – Em Fortaleza na Maraponga e Parangaba, eram dois bairros muito próximos, minha mãe tinha, tinha não ainda tem uma casa na Maraponga e a minha infância foi nesse bairro, né? Um bairro que na época da minha infância até 12 anos de idade era um bairro completamente diferente do que é h"}, "folder_size_gb": 0.0}, "folder_size_gb": 15.679}, "folder_size_gb": 1174.631}, "TM": {"BB200_TM001_Manoel Gimenes Ruy": {"Audiovisual": {"Acesso": {"BB200_TM001_Manoel Gimenes Ruy.mp4": {"size_mb": 6228.081, "modified": "2023-04-25 01:00:24", "extension": "MP4", "full_path": "D:\\Banco do Brasil (BB200)\\TM\\BB200_TM001_Manoel Gimenes Ruy\\Audiovisual\\Acesso\\BB200_TM001_Manoel Gimenes Ruy.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3844107.0, "duration": 3844.11, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 6.082}, "Preservação": {"MDV_5209.avi": {"size_mb": 9045.5262, "modified": "2019-03-25 11:19:46", "extension": "AVI", "full_path": "D:\\Banco do Brasil (BB200)\\TM\\BB200_TM001_Manoel Gimenes Ruy\\Audiovisual\\Preservação\\MDV_5209.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2503258.0, "duration": 2503.26, "resolution": "720x480", "fps": 29.97}, "MDV_5210.avi": {"size_mb": 5128.4286, "modified" \nCódigo BB200_TM003\nTranscrito por Patrícia Fonseca\nRevisado/editado por Paulo Rodrigues Ferreira\nTítulo : Uma mulher de garra \nBiografia\nSuzy Andrea nasceu em Manaus, em 1976. Mudou-se para Roraima, onde constituiu família e tornou-se mãe. Aprovada em concurso para o Banco do Brasil, assumiu no interior e, algum tempo depois, retornou a Manaus, atuando em agências da periferia e do Distrito Industrial. Recebeu convite para ir para Pacaraima, Roraima, onde encontrou, segundo afirma, qualidade de vida e crescimento profissional. Espera concluir o curso de Administração em breve.\nSinopse\nAmazonense de nascimento, revelou-se apaixonada por Roraima e foi lá que casou, teve filhos e ingressou no Banco do Brasil. A primeira lotação foi no interior do estado; com o tempo, voltou a Manaus. Identificou-se com a área de negócios do banco e chegou a Pacaraima para atuar em um posto de atendimento. Enfrenta os desafios de uma região fronteiriça e sonha com a transformação do posto em agência.\nPalavras-c"}, "folder_size_gb": 0.0}, "folder_size_gb": 8.745}, "folder_size_gb": 40.286}, "folder_size_gb": 1238.652}, "Fundação Banco do Brasil (FBB)": {"FBB_CB023_Antonio.docx": {"size_mb": 0.0126, "modified": "2019-07-17 09:27:10", "extension": "DOCX", "full_path": "D:\\Fundação Banco do Brasil (FBB)\\FBB_CB023_Antonio.docx", "category": "Textual", "content_preview": ""}, "FBB_HV039_Camilo.docx": {"size_mb": 0.014, "modified": "2019-07-23 09:35:28", "extension": "DOCX", "full_path": "D:\\Fundação Banco do Brasil (FBB)\\FBB_HV039_Camilo.docx", "category": "Textual", "content_preview": ""}, "MDV_2714.avi": {"size_mb": 13663.3656, "modified": "2023-08-30 19:05:46", "extension": "AVI", "full_path": "D:\\Fundação Banco do Brasil (FBB)\\MDV_2714.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3781207.0, "duration": 3781.21, "resolutio const EXTENSIONS = {
    "Video": ['mp4', 'mov', 'mkv', 'avi', 'm4v', 'mts', 'm2ts', 'wmv', 'flv', 'webm', 'vob', 'ogv', '3gp', 'mxf'],
    "Audio": ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'aiff', 'pcm', 'aif'],
    "Image": ['jpg', 'jpeg', 'tif', 'tiff', 'png', 'gif', 'bmp', 'webp', 'cr2', 'nef', 'arw', 'dng'],
    "Textual": ['doc', 'docx', 'pdf', 'txt', 'rtf', 'odt', 'xls', 'xlsx', 'ppt', 'pptx']
};

const ICONS = { "Video": "🎞️", "Audio": "🎧", "Image": "🖼️", "Textual": "📝", "Other": "📄" };

function formatSmartSize(mbValue) {
    if (!mbValue || mbValue === 0) return "0 B";
    let bytes = mbValue * 1024 * 1024; 
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(2) + " " + units[i];
}

function getIcon(name, isFolder) {
    if (isFolder) return "📁";
    const ext = name.split('.').pop().toLowerCase();
    for (const [category, list] of Object.entries(EXTENSIONS)) {
        if (list.includes(ext)) return ICONS[category];
    }
    return ICONS["Other"];
}

function formatTime(ms) {
    if (!ms || ms === 0) return "N/A";
    let totalSeconds = Math.floor(ms / 1000);
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;
    return [hours, minutes, seconds].map(v => v < 10 ? "0" + v : v).join(":");
}

function tryLoadImage(imgElement, thumbnailPath, originalName) {
    if (!thumbnailPath && !originalName) return;
    let path = thumbnailPath || `thumbnails/thumb_${originalName.split('.').slice(0, -1).join('.')}.jpg`;
    imgElement.onerror = function() {
        this.onerror = null;
        this.src = 'https://via.placeholder.com/150?text=Sem+Preview';
    };
    imgElement.src = path;
}

function copyPreviewText() {
    const box = document.getElementById('preview-text');
    if (box) {
        navigator.clipboard.writeText(box.textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy Content"; }, 2000);
    }
}

function calculateFolderStats(node) {
    let stats = { Video: { count: 0, size: 0 }, Audio: { count: 0, size: 0 }, Image: { count: 0, size: 0 }, Textual: { count: 0, size: 0 }, Other: { count: 0, size: 0 }, totalSize: 0 };
    function traverse(curr) {
        for (let key in curr) {
            if (key === "folder_size_gb") continue;
            let item = curr[key];
            if (item.folder_size_gb !== undefined) traverse(item);
            else {
                let cat = item.category || "Other";
                if (!stats[cat]) cat = "Other";
                stats[cat].count++;
                stats[cat].size += item.size_mb || 0;
                stats.totalSize += item.size_mb || 0;
            }
        }
    }
    traverse(node);
    return stats;
}

function showMetadata(name, data, path) {
    const panel = document.getElementById("metadata-panel");
    const content = document.getElementById("meta-content");
    panel.style.display = "block";

    const isFolder = data.folder_size_gb !== undefined;
    let html = `
        <span class="meta-label">Nome</span><span class="meta-value">${name}</span>
        <span class="meta-label">Caminho</span><span class="meta-value">${data.full_path || path.join("/")}</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(data.full_path || "").replace(/\\/g, "\\\\")}')">Copy Path</button>
        <span class="meta-label">Tamanho</span><span class="meta-value" style="color:var(--accent); font-weight:bold;">${formatSmartSize(isFolder ? data.folder_size_gb * 1024 : data.size_mb)}</span>
    `;

    if (isFolder) {
        const stats = calculateFolderStats(data);
        const getPct = (size) => stats.totalSize > 0 ? ((size / stats.totalSize) * 100).toFixed(1) : 0;
        html += `
            <div class="stats-container">
                <span class="meta-label">Conteúdo</span>
                <div class="stats-bar">
                    <div class="bar-segment" style="width:${getPct(stats.Video.size)}%; background:var(--video)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Audio.size)}%; background:var(--audio)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Image.size)}%; background:var(--image)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Textual.size + stats.Other.size)}%; background:var(--other)"></div>
                </div>
                <div class="stat-row"><span>🎞️ Video</span><b>${stats.Video.count}</b></div>
                <div class="stat-row"><span>🎧 Audio</span><b>${stats.Audio.count}</b></div>
                <div class="stat-row"><span>🖼️ Images</span><b>${stats.Image.count}</b></div>
                <div class="stat-row"><span>📄 Docs / Other</span><b>${stats.Textual.count + stats.Other.count}</b></div>
            </div>`;
    } else {
        if (data.category === "Image" || data.thumbnail) {
            html += `<h3>Preview</h3>
                     <div class="img-preview-container">
                        <img id="preview-img" src="" alt="Carregando...">
                     </div>`;
            setTimeout(() => {
                const img = document.getElementById('preview-img');
                tryLoadImage(img, data.thumbnail, name);
            }, 50);
        }

        html += `<span class="meta-label">Modificado</span><span class="meta-value">${data.modified || "N/A"}</span>`;
        
        if (data.category === "Video") {
            // Garante que displayRes exista ou usa a dimensão original
            const displayRes = data.dimension || "N/A"; 
            
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Resolução</span><span class="meta-value">${displayRes}</span>
                <span class="meta-label">Duração / Áudio</span><span class="meta-value">${formatTime(data.duration_ms)} / ${data.audio_channels || "N/A"}</span>
                <span class="meta-label">Aspecto / FPS</span><span class="meta-value">${data.aspect_ratio || "N/A"} / ${data.frame_rate || "N/A"}</span>`;
        } else if (data.category === "Audio") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Duração</span><span class="meta-value">${formatTime(data.duration_ms)}</span>
                <span class="meta-label">Canais</span><span class="meta-value">${data.audio_channels || "N/A"}</span>`;
        } else if (data.category === "Image") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Dimensões</span><span class="meta-value">${data.dimension || "N/A"}</span>
                <span class="meta-label">DPI</span><span class="meta-value">${data.dpi || "N/A"}</span>`;
        }

        // NOVIDADE: Verifica explicitamente por content_preview ou categoria textual
        if (data.content_preview) {
            html += `<h3>Conteúdo do Documento</h3>
                     <div class="preview-box" id="preview-text">Loading content...</div>
                     <button class="copy-btn" onclick="copyPreviewText()">Copiar Conteúdo</button>`;
        }
    }
    
    content.innerHTML = html;

    // Sincronização garantida: espera o DOM atualizar para injetar o texto
    if (data.content_preview) {
        setTimeout(() => {
            const box = document.getElementById('preview-text');
            if (box) box.textContent = data.content_preview;
        }, 10);
    }
}

function navigateToPath(path) {
    // Limpa a busca e renderiza a visualização normal
    document.getElementById("search").value = "";
    renderColumn(TREE, 0);

    let currentNode = TREE;
    // O primeiro item do path costuma ser "Root" ou o nome do HD, pulamos ele se necessário
    const pathParts = path.slice(1); 

    pathParts.forEach((part, index) => {
        setTimeout(() => {
            const columns = document.querySelectorAll('.column');
            const currentColumn = columns[index];
            if (!currentColumn) return;

            const items = currentColumn.querySelectorAll('.item');
            for (let item of items) {
                if (item.querySelector('.item-text').textContent === part) {
                    item.click(); // Simula o clique no item para abrir a próxima coluna ou metadados
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    break;
                }
            }
        }, (index + 1) * 100); // Pequeno delay para a coluna anterior renderizar
    });
}

function renderColumn(node, level, path = []) {
    const explorer = document.getElementById("explorer");
    while (explorer.children.length > level) explorer.removeChild(explorer.lastChild);
    const col = document.createElement("div"); col.className = "column";
    const keys = Object.keys(node).filter(k => k !== "folder_size_gb").sort((a, b) => {
        const aIsF = node[a].folder_size_gb !== undefined;
        const bIsF = node[b].folder_size_gb !== undefined;
        return (aIsF !== bIsF) ? bIsF - aIsF : a.localeCompare(b);
    });
    keys.forEach(name => {
        const val = node[name];
        const isFolder = val.folder_size_gb !== undefined;
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `<span class="icon">${getIcon(name, isFolder)}</span> <span class="item-text">${name}</span>`;
        item.onclick = () => {
            Array.from(col.children).forEach(c => c.classList.remove('active'));
            item.classList.add('active');
            showMetadata(name, val, path.concat(name));
            if (isFolder) renderColumn(val, level + 1, path.concat(name));
            else while (explorer.children.length > level + 1) explorer.removeChild(explorer.lastChild);
        };
        col.appendChild(item);
    });
    explorer.appendChild(col);
}

    function searchNode(node, currentPath) {
        for (const key in node) {
            if (key === "folder_size_gb") continue;
            const item = node[key];
            const isFolder = item.folder_size_gb !== undefined;
            const match = key.toLowerCase().includes(term) || (item.content_preview && item.content_preview.toLowerCase().includes(term));
            
            if (match) results.push({ name: key, data: item, path: currentPath.concat(key), isFolder });
            if (isFolder) searchNode(item, currentPath.concat(key));
        }
    }
    
    searchNode(TREE, ["Root"]); // Certifique-se que o nome base aqui condiz com seu JSON
    explorer.innerHTML = "";
    const col = document.createElement("div"); col.className = "column"; col.style.minWidth = "100%";
    
    results.slice(0, 100).forEach(res => {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<span class="icon">${getIcon(res.name, res.isFolder)}</span> 
                         <div><b>${res.name}</b><br><small style="color:#888">${res.path.join(" › ")}</small></div>`;
        
        // AQUI ESTÁ A MUDANÇA: Chama a navegação em vez de apenas mostrar metadados
        div.onclick = () => navigateToPath(res.path);
        
        col.appendChild(div);
    });
    explorer.appendChild(col);
}

document.addEventListener("DOMContentLoaded", () => renderColumn(TREE, 0));
</script>
</body>
</html>
