3:14", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV001\\Textual\\LIQ_HV001.docx", "category": "Textual", "content_preview": "Projeto Liquigás\nDepoimento de Cláudio Rossiter da Costa \nEntrevistado por Thiago Majolo e Denyse Emerich \nSão Paulo 08/08/2013\nLHV001_Cláudio Rossiter da Costa\nRealização Museu da Pessoa \nTranscrito por Cristiane Costa\nMW Transcrições\nP/1 – Então, pra começar, a gente pergunta o nome inteiro completo, local e a data de nascimento.\n\nR – Bom, meu nome é Cláudio Rossiter da Costa. Eu, apesar de morar no Rio Grande do Sul há quase 23 anos, sou natural aqui de São Paulo, da capital, né, e residi durante os meus 22 primeiros anos de vida aqui, na Zona Sul de São Paulo, no Brooklin Novo. \nP/1 – E seus pais? Conta só um pouco deles, nome, de onde eles vieram, o que fazem?\n\nR – Todo paulista acho que tem um pouquinho, nunca é genuinamente paulista, né? Meu pai é nordestino, minha mãe é mineira, só que vieram pra cá na infância; meu pai veio acho que 16, 17 anos de idade e minha mãe veio de Minas com aproximadamente a mesma idade. Eu e a minha irmã, somos um casal, nascemos aqui em São Paulo, capital.\nP/1 – E qual a atividade deles, dos seus pais?\n\nR – A minha mãe é falecida mas era do lar, pelo menos antigamente se dizia do lar, cuidava da família e da casa. O meu pai trabalhou na construç"}, "folder_size_gb": 0.0}, "folder_size_gb": 72.232}, "LIQ_HV002": {"Fotos": {"LIQ_HV002_MO001.jpg": {"size_mb": 9.9923, "modified": "2013-08-29 11:21:28", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV002\\Fotos\\LIQ_HV002_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV002_MO002.jpg": {"size_mb": 9.3335, "modified": "2013-08-29 11:18:08", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV002\\Fotos\\LIQ_HV002_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV002_MO003.jpg": {"size_mb": 9.02, "modified": "2013-08-29 11:19:14", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV002\\Fotos\\LIQ_HV002_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "folder_size_gb": 0.028}, "Textual": {"LIQ_HV002.doc": {"size_mb": 0.1191, "modified": "2013-10-31 14:37:04", "extension": "DOC", "full_path": "H:\\LIQ\\LIQ_HV002\\Textual\\LIQ_HV002.doc", "category": "Textual"}, "LIQ_HV002.docx": {"size_mb": 0.0371, "modified": "2026-02-24 16:29:20", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV002\\Textual\\LIQ_HV002.docx", "category": "Textual", "content_preview": "Projeto Liquigás\nDepoimento de Elvídio Elvino Eckert\nEntrevistado por Thiago Majolo e Denyse Emerich\nSão Paulo 08/08/2013\t\nRealização Museu da Pessoa\nLHV002_Elvídio Elvino Eckert\nTranscrito por Liliane Custódio\t\nMW Transcrições\nMINIBIOGRAFIA\nElvídio nasceu na grande Lajeado, município do Estado do Rio Grande do Sul. Tem no sangue o gaúcho típico, que incorporou dos seus antepassados, desde os costumes ao sotaque e, é claro, as boas e bem contadas histórias. É conhecedor também de toda a cultura da colônia alemã que se instalou naquelas terras, e se reconhece como um colono, com alma de que gosta de desbravar novas terras e não costuma ter medo de trabalho. Já quis ser padre, mas desistiu. No entanto, tem o seminário como a grande escola da sua vida, onde aprendeu a disciplina do trabalho. Começou vendendo lenha e acabou no gás. Ou seja, acompanhou todo o processo de transição. Saía com seu caminhão para buscar e vender lenha, levava à reboque outros produtos, e desbravou o interior todo do Estado quando já trabalhava para a Liquigás. Aos poucos, e muito sob sua orientação, as revendas da companhia foram se espalhando pela região sul e dominando o mercado de envasados.\nSINOPSE\nA ent"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV002.mov": {"size_mb": 94353.6572, "modified": "2013-12-13 15:49:14", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV002\\Audiovisual\\Preservação\\LIQ_HV002.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 5527294.0, "duration": 5527.29, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 92.142}, "folder_size_gb": 92.142}, "folder_size_gb": 92.17}, "LIQ_HV003": {"Fotos": {"LIQ_HV003_MO001.jpg": {"size_mb": 8.1379, "modified": "2013-09-02 08:29:36", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV003\\Fotos\\LIQ_HV003_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV003_MO002.jpg": {"size_mb": 8.261, "modified": "2013-09-02 08:22:34", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV003\\Fotos\\LIQ_HV003_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV003_MO003.jpg": {"size_mb": 8.4945, "modified": "2013-09-02 08:27:36", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV003\\Fotos\\LIQ_HV003_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "folder_size_gb": 0.024}, "Textual": {"LIQ_HV003.doc": {"size_mb": 0.1792, "modified": "2013-10-31 14:37:32", "extension": "DOC", "full_path": "H:\\LIQ\\LIQ_HV003\\Textual\\LIQ_HV003.doc", "category": "Textual"}, "LIQ_HV003.docx": {"size_mb": 0.054, "modified": "2026-02-24 16:29:22", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV003\\Textual\\LIQ_HV003.docx", "category": "Textual", "content_preview": "Projeto Conhecimento – Liquigás 60 Anos de Memória\nDepoimento de Luciene Pandolfo\nEntrevistada por Gustavo Ribeiro Sanchez e Denyse Emerich\nSão Paulo, 09/08/2013\t\nRealização Museu da Pessoa\nLHV03_Luciene Pandolfo\nTranscrito por Liliane Custódio\t\nMW Transcrições\nMinibiografia\nLuciene nasceu em Cássia, interior de Minas Gerais, onde viveu até quando foi para Ribeirão Preto cursar Direito, lidar com a palavra, onde junto com outras amigas foi morar num apartamento que batizaram de \"virginete\". Na primeira oportunidade que teve de trabalhar no mundo corporativo, Luciene encontrou seu interesse profissional, foi para o Rio de Janeiro onde trabalhou pela primeira vez com uma empresa da área do Petróleo, tendo contato inclusive com o período do marco regulatório. Em 1999 ela veio para São Paulo procurando viver mais próxima de seu marido e constituir uma família, foi nesse período que ela ingressou na Liquigás onde permaneceu até o ano de 2013, quando saiu em busca de novos desafios profissionais, mas preserva com carinho as lembranças do período na empresa.\nSinopse\nComo advogada Luciene viveu muitas transições de cultura na Liquigás, teve a chance de apoiar a reestruturação da área juríd"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV003.mov": {"size_mb": 147463.4547, "modified": "2013-12-18 11:04:35", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV003\\Audiovisual\\Preservação\\LIQ_HV003.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 8961895.0, "duration": 8961.9, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 144.007}, "folder_size_gb": 144.007}, "folder_size_gb": 144.032}, "LIQ_HV004": {"Fotos": {"LIQ_HV004_MO001.jpg": {"size_mb": 7.7653, "modified": "2013-08-29 11:31:46", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV004\\Fotos\\LIQ_HV004_MO001.jpg", "cate zação Museu da Pessoa\nLHV005_Vera Regina Benedetti Barreiros\nTranscrito por Francisco Guilherme Ribeiro Ruiz\nMW Transcrições\nMinibiografia\nVera cresceu no interior de Santa Catarina, na cidade de Tubarão, ela vivia junto com sua família em uma grande casa com varanda onde celebravam festas e faziam os encontros com os amigos. Seus pais viviam do comércio e na cidade ela tinha contato com todos os moradores e lembra com carinho da sua infância. Vera, veio para São Paulo acompanhada de seu grande amor, seu marido com quem trocou muitas cartas até o casamento.  \nO primeiro choque com a cidade foi marcado por uma sucessiva paixão, antes de chegar à Liquigás, Vera trabalhou como psicóloga em um consultório e teve uma experiência de vida marcante trabalhando na FEBEM como assistente social. \nSinopse\nNa Liquigás desde 1991, Vera sempre trabalhou com pessoas, ela começou como assistente social, e foi nos centros operacionais que ela conheceu as pessoas valiosas que formam a empresa. Foi nesse começo de carreira"}, "folder_size_gb": 0.0}, "folder_size_gb": 112.897}, "LIQ_HV006": {"Fotos": {"Acervo": {"LIQ_HV006_FT002.jpg": {"size_mb": 9.8031, "modified": "2013-08-29 11:52:32", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV006\\Fotos\\Acervo\\LIQ_HV006_FT002.jpg", "category": "Image", "duration_ms": 0, "dimension": "4924x3292", "height": 3292, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "4924x3292"}, "LIQ_HV006_FT001.jpg": {"size_mb": 5.9373, "modified": "2013-08-29 11:49:56", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV006\\Fotos\\Acervo\\LIQ_HV006_FT001.jpg", "category": "Image", "duration_ms": 0, "dimension": "3294x3774", "height": 3774, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3294x3774"}, "folder_size_gb": 0.015}, "Making Off": {"LIQ_HV006_MO004.jpg": {"size_mb": 7.5363, "modified": "2013-08-29 11:58:04", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV006\\Fotos\\Making Off\\LIQ_HV006_MO004.jpg", "category  "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV006\\Textual\\LIQ_HV006.docx", "category": "Textual", "content_preview": "Projeto Conhecimento Liquigás – 60 Anos de Memória\nDepoimento de Wagner Alves da Silva\nEntrevistado por Thiago Majolo\nSão Paulo 12/08/2013 \nRealização Museu da Pessoa\nLHV006_Wagner Alves da Silva\nTranscrito por Francisco Guilherme Ribeiro Ruiz\nMW Transcrições\nMINIBIOGRAFIA\nNascido e criado na cidade de São Paulo, mais especificamente na região da Bela Vista, Wagner tem nas suas lembranças de infância o cenário de uma metrópole ainda mais humana, na qual convivia com um pai que era bem mais velho do que o normal da média, que havia participado da Segunda Guerra dirigindo o caminhão da Cruz Vermelha e no Brasil se estabelecera como padeiro. Wagner lembra de ir à padaria de madrugada, junto ao pai, para fazer a fornada, e então dormir em cima dos sacos de farinha. Logo após a morte do seu pai, Wagner foi trabalhar de office boy aos catorze anos. Em seguida entra na Liquigás, ainda nessa mesma função, e passa por muitas outras operacionais, como responsável pelo xerox e almoxarifado, até que decide fazer curso de Contabilidade e, mais para frente, faculdade de Ciências Contábeis. Aos poucos, passa a assumir parte da área contábil da empresa. É também muito ligado ao sindicato, de modo"}, "folder_size_gb": 0.0}, "folder_size_gb": 93.401}, "LIQ_HV007": {"Fotos": {"LIQ_HV007_MO001.jpg": {"size_mb": 7.8003, "modified": "2013-08-29 11:45:58", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV007\\Fotos\\LIQ_HV007_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "4824x3312", "height": 3312, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "4824x3312"}, "LIQ_HV007_MO002.jpg": {"size_mb": 9.3109, "modified": "2013-09-02 15:44:34", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV007\\Fotos\\LIQ_HV007_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV007_MO003.jpg": {"size_mb": 9.3135, "modified": "2013-08-29 11:41:56", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV007\\Fotos\\LIQ_HV007_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV007_MO004.jpg": {"size_mb": 9.2977, "modified": "2013-08-29 11:43:56", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV007\\Fotos\\LIQ_HV007_MO004.jpg", "category": "Image", "duration_ms": 0, "dimension": "4664x3120", "height": 3120, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "4664x3120"}, "folder_size_gb": 0.035}, "Audiovisual": {"Preservação": {"LIQ_HV007.mov": {"size_mb": 91540.1146, "modified": "2013-12-17 18:57:46", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV007\\Audiovisual\\Preservação\\LIQ_HV007.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 5479112.0, "duration": 5479.11, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 89.395}, "folder_size_gb": 89.395}, "Textual": {"LIQ_HV007.doc": {"size_mb": 0.1328, "modified": "2013-10-31 14:40:12", "extension": "DOC", "full_path": "H:\\LIQ\\LIQ_HV007\\Textual\\LIQ_HV007.doc", "category": "Textual"}, "LIQ_HV007.docx": {"size_mb": 0.0397, "modified": "2026-02-24 16:29:30", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV007\\Textual\\LIQ_HV007.docx", "category": "Textual", "content_preview": "Projeto Conhecimento Liquigás – 60 Anos de Memória\nDepoimento de Alfredo César Raimundo\nEntrevistado por Thiago Majolo\nSão Paulo 12/08/2013\t\nRealização Museu da Pessoa\nLHV007_Alfredo César Raimundo\nTranscrito por Liliane Custódio\t\nMW Transcrições\nMINIBIOGRAFIA\nAlém da sua carreira na Liquigás, Alfredo é também skatista, formado em Psicologia e Administração de Empresas. Entrou na Liquigás à procura de um convênio médico para a mulher, que na época estava grávida, e acabou ficando na empresa, descobrindo-se lá dentro, e já está há dezessete anos. Começou como auditor, mas foi como gerente na área de vendas que fez sua maior contribuição à empresa, gerindo com sua equipe uma grande parte das campanhas de vendas, assim como estímulo à padronização da marca da empresa. Trabalha muito próximo aos revendedores e, por isso, também dos clientes, de modo que quando se pensa em promoções, capacitações e toda a cadeia que envolve do revendedor ao cliente, pensa-se em Alfredo.\nSINOPSE\nAlfredo é um bom contador de histórias, e fica claro na sua entrevista que ainda há muita coisa para se contar na vida desse psicólogo, administrador de empresas, skatista e gerente da Liquigás. Conta como se int"}, "folder_size_gb": 0.0}, "folder_size_gb": 89.43}, "LIQ_HV008": {"Fotos": {"LIQ_HV008_MO001.jpg": {"size_mb": 12.0451, "modified": "2013-08-30 10:04:50", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV008\\Fotos\\LIQ_HV008_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV008_MO002.jpg": {"size_mb": 12.191, "modified": "2013-08-30 10:05:36", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV008\\Fotos\\LIQ_HV008_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV008_MO003.jpg": {"size_mb": 16.1104, "modified": "2013-08-30 10:06:16", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV008\\Fotos\\LIQ_HV008_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV008_MO004.jpg": {"size_mb": 10.0685, "modified": "2013-08-30 10:06:44", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV008\\Fotos\\LIQ_HV008_MO004.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "folder_size_gb": 0.049}, "Textual": {"LIQ_HV008.doc": {"size_mb": 0.0747, "modified": "2013-10-31 14:40:32", "extension": "DOC", "full_path": "H:\\LIQ\\LIQ_HV008\\Textual\\LIQ_HV008.doc", "category": "Textual"}, "LIQ_HV008.docx": {"size_mb": 0.0226, "modified": "2026-02-24 16:29:32", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV008\\Textual\\LIQ_HV008.docx", "category": "Textual", "content_preview": "Projeto Conhecimento Liquigás – 60 Anos de Memória\nDepoimento de Thomaz Lucchini Coutinho\nEntrevistado por Thiago Majolo\nSão Paulo 12/08/2013 \nRealização Museu da Pessoa\nLHV008_Thomaz Lucchini Coutinho\nTranscrito por Francisco Guilherme Ribeiro Ruiz\nMW Transcrições\nMINIBIOGRAFIA\nHoje, Thomaz é diretor de GLP a granel, e preza muito pela filosofia de trabalho e de ética da empresa, além, é claro, de todo o processo desse crescente mercado a granel, que atinge desde condomínios a grandes indústrias. Nas cidades que se verticalizam, o GLP a granel pode ser uma das soluções possíveis para os prédios, principalmente com sua capacidade de medição individualizada. Thomaz se entusiasma ao falar dessas possibilidades, assim como é um entusiasta do flexgás e purogás, outros dois produtos da Liquigás no setor granel que carregam uma aposta da empresa. Mas, antes de tudo isso, Thomaz teve uma formação familiar importante, de um pai que sempre o incentivou a procurar trabalho onde quer que o trabalho estivesse, e por isso na sua infância a família de Thomaz andou muito, com o pai passando por muitas empresas e sendo uma delas inclusive a Petrobras. \nSINOPSE\nThomaz começa contando sua história d"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV008.mov": {"size_mb": 51924.1587, "modified": "2013-12-17 19:24:33", "extension": "M alização Museu da Pessoa\nLHV009_Nestor Sérgio de Oliveira Santos\nTranscrito por Liliane Custódio\t\nMW Transcrições\nP/1 – Então pra começar, senhor Nestor, eu vou pedir pra você falar seu nome completo, a data e o local do seu nascimento. \nR – Meu nome é Nestor Sérgio de Oliveira Santos, nasci em três de janeiro de 1963, em Salinas.\nP/1 – Bacana.\nR – Onde resido até hoje, graças a Deus.\nP/1 – Senhor Nestor, você se lembra da casa da tua infância? Você consegue descrevê-la pra gente?\nR – Olha, a casa dos meus pais sempre foi uma casa simples. Meu pai teve 11 filhos, todos os 11 estão vivos. E não tinha... Pai era praticamente semianalfabeto. Minha mãe era professora, mas como... Por ser tão difícil, acabou largando a profissão pra dedicar ao lar. E a batalha na cidade era muito grande pra sustentar esses filhos e dar educação, isso, aquilo outro, sabe? Então era uma casa simples. Muitos quartos, porque muita gente, repartia com beliche, isso e aquilo outro, banheiro único, brigava na hora de banhar, ou mesmo na hora de alimentar, qu"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV009.mov": {"size_mb": 57090.057, "modified": "2013-12-18 12:22:31", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV009\\Audiovisual\\Preservação\\LIQ_HV009.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3359259.0, "duration": 3359.26, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 55.752}, "folder_size_gb": 55.752}, "folder_size_gb": 55.781}, "LIQ_HV010": {"Fotos": {"LIQ_HV010_MO001.jpg": {"size_mb": 9.6113, "modified": "2013-08-29 15:22:02", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV010\\Fotos\\LIQ_HV010_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV01  seu nome completo, o local e a data de nascimento.\nR – Certo. Me chamo Manuel Pinheiro Prata, sou natural de Fortaleza, Ceará, nasci em 1979, em 16 de Janeiro.\nP/1 – Fala um pouco dos seus pais, da profissão deles, um pouco desse… nome, enfim.\nR – Certo. Sou filho de Valmor Prata… precisa falar o nome completo?\nP/1 – Como você quiser.\nR – De Valmor Prata e Maria Cândida Romário Pinheiro Prata, todos os dois são naturais de Fortaleza, somos um casal, eu e a irmã, sou o mais velho, minha irmã mais nova. O meu pai é empresário, minha mãe era dona de casa, já tinha tido algumas experiências profissionais mais sem muito, digamos, sucesso, era mais pra encher o tempo. Mas quando surgiu a oportunidade da revenda, eu iniciei, acreditei no negócio, apostei, pedi ajuda a eles e assim aconteceu que nós, realmente, começamos a nos envolver na revenda, eu juntamente com ela e ele t"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV011.mov": {"size_mb": 67283.0078, "modified": "2013-12-18 16:27:10", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV011\\Audiovisual\\Preservação\\LIQ_HV011.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3981648.0, "duration": 3981.65, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 65.706}, "folder_size_gb": 65.706}, "folder_size_gb": 65.805}, "LIQ_HV012": {"Textual": {"LIQ_HV012.doc": {"size_mb": 0.1016, "modified": "2013-09-05 16:35:54", "extension": "DOC", "full_path": "H:\\LIQ\\LIQ_HV012\\Textual\\LIQ_HV012.doc", "category": "Textual"}, "LIQ_HV012.docx": {"size_mb": 0.03, "modified": "2026-02-24 16:29:36", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV012\\Textual\\LIQ_HV012.docx", "category": "Textual", "content_preview": "Projeto Conhecimento Liquigás – 60 Anos de Memória\nDepoimento de Lázaro Ciro Silva\nEntrevistada por Thiago Majolo\nSão Paulo, 14/08/2013 \nRealização Museu da Pessoa\nLHV012_Lázaro Ciro Silva\nTranscrito por Francisco Guilherme Ribeiro Ruiz\nMW Transcrições\nP/1 – Então Lázaro, eu queria começar perguntando o nome completo, o local e a data de nascimento.\nR – Pois não. Lázaro Ciro Silva.\nP/1 – Data de nascimento e local?\nR – Ibiúna.\nP/1 – Em São Paulo?\nR – São Paulo.\nP/1 – E a data?\nR – Onze de fevereiro de 1929.\nP/1 – E o senhor, conta um pouco dos seus pais. Onde que eles nasceram, o que é que eles faziam?\nR – Isso meu, Ibiúna.\nP/1 – Também?\nR – Ibiúna é com bisavô, bisavó, avôs, avós, pai e mãe, todos do Campo Verde.\nP/1 – Campo Verde?\nR – É um bairro, tem seis quilômetros de Ibiúna.\nP/1 – Tá. Qual a atividade dos seus pais?\nR – Meu pai foi assim vendedor, comprador de criações e depois montou o armazém para eu não viesse estudar em São Paulo.\nP/1 – Ah.\nR – O que é que era aquele tempo não? Então, naquele tempo era difícil de deixar os filhos saírem, não deixava mesmo não e aí a gente ficou até hoje no comércio, sem ter uma licença assim e graças a Deus a gente foi sempre, é sempre fi"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV012.mov": {"size_mb": 86612.7024, "modified": "2013-12-18 16:56:30", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV012\\Audiovisual\\Preservação\\LIQ_HV012.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 5222456.0, "duration": 5222.46, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 84.583}, "folder_size_gb": 84.583}, "Fotos": {"Acervo": {"LIQ_HV012_FT001.JPG": {"size_mb": 0.1629, "modified": "2013-08-14 12:18:08", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV012\\Fotos\\Acervo\\LIQ_HV012_FT001.JPG", "category": "Image", "duration_ms": 0, "dimension": "1804x1044", "height": 1044, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": n": 0.0, "resolution": "5184x3456"}, "LIQ_HV012_MO003.jpg": {"size_mb": 11.8795, "modified": "2013-08-29 16:09:36", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV012\\Fotos\\Making Of\\LIQ_HV012_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "folder_size_gb": 0.029}, "folder_size_gb": 0.033}, "folder_size_gb": 84.616}, "LIQ_HV013": {"Textual": {"LIQ_HV013.doc": {"size_mb": 0.0737, "modified": "2013-09-05 16:35:54", "extension": "DOC", "full_path": "H:\\LIQ\\LIQ_HV013\\Textual\\LIQ_HV013.doc", "category": "Textual"}, "LIQ_HV013.docx": {"size_mb": 0.0209, "modified": "2026-02-24 16:29:38", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV013\\Textual\\LIQ_HV013.docx", "category": "Textual", "content_preview": "Projeto Conhecimento Liquigás – 60 Anos de Memória\nDepoimento de Carlos Martins da Costa\nEntrevistado por Thiago Majolo\nSão Paulo 14/08/2013 \nRealização Museu da Pessoa\nLHV013_Carlos Martins da Costa\nTranscrito por Francisco Guilherme Ribeiro Ruiz\nMW Transcrições\nP/1 – Então Carlos, a primeira pergunta, eu queria você se identificasse. Então falasse o nome completo, o local e a data de nascimento.\nR – Meu nome é Carlos Martins da Costa, eu nasci em 11 de outubro de 1956, em Belo Horizonte.\nP/1 – Podia falar um pouco dos pais? Profissão deles? Um pouco de onde vieram?\nR – Meus pais vieram do interior, foram morar em Belo Horizonte, a época meu pai, ele trabalhava no Estado. Ele trabalhou na Imprensa Oficial, ele era encadernador, a minha mãe do lar, mas trabalhava com a fabricação de salgados, eles tinham lá uma produção de salgado para poder, não uma fábrica, uma coisa mais caseira, mas era onde ela tinha o trabalho dela. O meu pai já é falecido, a minha mãe é viva.\nP/1 – E você é o único filho ou não? Tem mais?\nR – Não. Eu tenho, nós somos em dez irmãos, um é falecido, nós somos cinco homens, éramos, né, que somos quatro agora, cinco homens e cinco mulheres.\nP/1 – Em que lugar que"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV013.mov": {"size_mb": 46170.8028, "modified": "2013-12-18 17:28:28", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV013\\Audiovisual\\Preservação\\LIQ_HV013.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2717818.0, "duration": 2717.82, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 45.089}, "folder_size_gb": 45.089}, "Fotos": {"LIQ_HV013_MO001.jpg": {"size_mb": 9.5504, "modified": "2013-08-29 16:44:28", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV013\\Fotos\\LIQ_HV013_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV013_MO002.jpg": {"size_mb": 9.9954, "modified": "2013-08-29 16:41:22", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV013\\Fotos\\LIQ_HV013_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV013_MO003.jpg": {"size_mb": 6.6666, "modified": "2013-08-29 16:42:36", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV013\\Fotos\\LIQ_HV013_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "4096x2868", "height": 2868, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "4096x2868"}, "folder_size_gb": 0.026}, "folder_size_gb": 45.114}, "LIQ_HV014": {"Textual": {"LIQ_HV014.doc": {"size_mb": 0.1675, "modified": "2013-09-11 14:31:26", "extension": "DOC", "full_path": "H:\\LIQ\\LIQ_HV014\\Textual\\LIQ_HV014.doc", "category": "Textual"}, "LIQ_HV014.docx": {"size_mb": 0.0472, "modified": "2026-02-24 16:29:40", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV014\\Textual\\LIQ_HV014.docx", "category": "Textual", "content_preview": "Projeto Liquigás\nDepoimento de José Paiva Taveira\nEntrevistado por Gustavo Ribeiro Sanchez\nSão Paulo, 14/08/2013\t\nRealização Museu da Pessoa\nLHV014_José Paiva Taveira\nTranscrito por Liliane Custódio\t\nMW Transcrições\nOBS: Essa transcrição possui um trecho que apresento destacado em amarelo, que o entrevistado pediu para que seja retirado da entrevista e não divulgado.\nP/1 – Então vamos lá. Só pra começar, eu vou pedir para o senhor falar seu nome completo, a data e o local do seu nascimento.\nR – Meu nome é José de Paiva Taveira, eu nasci em Porto Alegre, Rio Grande do Sul, no dia 29 agosto de 1935.\nP/1 – Bacana.\nR – Porém eu só fiquei seis meses lá.\nP/1 – Só seis meses.\nR – Eu nasci lá, aí meu pai foi transferido pra São Paulo, porque minha mãe era paulista, então voltei pra São Paulo e fui morar lá no Brás.\nP/1 – E desse período do Brás, o senhor se lembra da casa de infância? Como era?\nR – Lembro. O meu avô tinha uma vila de casas, e minha mãe tinha uma casa, minhas tias também cada uma tinha sua casa. E eu fiquei no Brás, na Rua Doutor João Alves de Lima, mais ou menos até eu ter 15 anos. Certo? Então, que dizer, o primário e uma parte do ginásio eu morava no Brás.\nP/1 – E como e"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV014.mov": {"size_mb": 82020.629, "modified": "2013-12-20 13:30:27", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV014\\Audiovisual\\Preservação\\LIQ_HV014.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 6940841.0, "duration": 6940.84, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 80.098}, "folder_size_gb": 80.098}, "Fotos": {"LIQ_HV014_MO001.jpg": {"size_mb": 11.3323, "modified": "2013-08-29 17:04:16", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV014\\Fotos\\LIQ_HV014_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV014_MO002.jpg": {"size_mb": 10.8022, "modified": "2013-08-29 17:01:52", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV014\\Fotos\\LIQ_HV014_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV014_MO003.jpg": {"size_mb": 9.369, "modified": "2013-08-29 17:03:04", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV014\\Fotos\\LIQ_HV014_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "4824x3200", "height": 3200, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "4824x3200"}, "folder_size_gb": 0.031}, "folder_size_gb": 80.129}, "LIQ_HV015": {"Textual": {"LIQ_HV015.docx": {"size_mb": 0.0499, "modified": "2013-09-09 10:05:00", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV015\\Textual\\LIQ_HV015.docx", "category": "Textual", "content_preview": "Projeto Liquigás\nDepoimento de Antônio Luiz Levantino\nEntrevistado por Thiago Majolo\nSão Paulo, 15/08/2013\nLHV015_Antônio Luiz Levantino\nRealização Museu da Pessoa \nTranscrito por Cristiane Costa\nMW Transcrições\nP/1 – Antônio, queria começar perguntando o nome completo, local e data de nascimento.\n\nR – Bom, meu nome é Antônio Luiz Levantino, minha data de nascimento é primeiro de novembro de 1956 e eu nasci no Rio de Janeiro.\nP/1 – Agora, falar um pouco dos seus pais, qual era a profissão deles?\nR – Meus pais vieram da Itália muito jovens, um com quatro, outro com cinco anos, né? Vieram como imigrantes e, lógico, com seus pais e nessa fase a Itália vivia um momento muito complicado, então, eles vieram com muita coragem, eu acho que eu não teria essa coragem toda de chegar aqui com filhos, no Brasil e não saber nem onde morar. Eles começaram assim, no Brasil, meu pai foi trabalhar, assim, como bico mesmo, depois de algum tempo, né, que já estavam crescidos, minha mãe foi trabalhar como costureira. Eles não têm praticamente grau de instrução nenhum, foram até a quarta série do Ensino Fundamental mas na escola italiana Roma, que tinha no Rio de Janeiro. Então, eles sabiam o italiano e"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV015.mov": {"size_mb": 48749.1829, "modified": "2013-12-20 13:42:57", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV015\\Audiovisual\\Preservação\\LIQ_HV015.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4134134.0, "duration": 4134.13, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 47.607}, "folder_size_gb": 47.607}, "Fotos": {"Acervo": {"LIQ_HV015_DOC001.JPG": {"size_mb": 0.6352, "modified": "2013-08-15 10:16:40", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV015\\Fotos\\Acervo\\LIQ_HV015_DOC001.JPG", "category": "Image", "duration_ms": 0, "dimension": "2528x3508", "height": 3508, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2528x3508"}, "LIQ_HV015_DOC002.JPG": {"size_mb": 2.1244, "modified": "2013-08-15 10:19:44", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV015\\Fotos\\Acervo\\LIQ_HV015_DOC002.JPG", "category": "Image", "duration_ms": 0, "dimension": "3492x2536", "height": 2536, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3492x2536"}, "LIQ_HV015_DOC003.JPG": {"size_mb": 1.0085, "modified": "2013-08-15 10:16:50", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV015\\Fotos\\Acervo\\LIQ_HV015_DOC003.JPG", "category": "Image", "duration_ms": 0, "dimension": "2552x3508", "height": 3508, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2552x3508"}, "folder_size_gb": 0.004}, "folder_size_gb": 0.004}, "folder_size_gb": 47.61}, "LIQ_HV016": {"Textual": {"LIQ_HV016.docx": {"size_mb": 0.0441, "modified": "2013-10-21 09:54:44", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV016\\Textual\\LIQ_HV016.docx", "category": "Textual", "content_preview": "Projeto Liquigás\nEntrevistado por Thiago Majolo\nDepoimento de Mônica Nemer \nSão Paulo, 15/08/2013\nRealização Museu da Pessoa\nLHV016_Mônica Nemer \nRealização Museu da Pessoa\nTranscrito por Cristiane Costa\nMW Transcrições\nP/1 – Então, Mônica, a primeira pergunta é nome completo, o local e a data de nascimento.\nR – Meu nome é Mônica de Souza Derani Nemer, nasci em Santos no dia 27 de Agosto de 1965.\nP/1 – Queria que você falasse um pouco dos seus pais, a profissão deles, de onde eles são.\nR – Meus pais são cariocas, meu pai é engenheiro químico, trabalhou a vida inteira na Petrobras. A minha mãe é do lar mas sempre foi uma pessoa muito ativa, sempre trabalhou com entidades assistenciais que hoje a gente chama de ONGs, né? Então, desde pequena eu vejo a minha mãe trabalhando, lendo pra cegos, alfabetizando crianças carentes. Então, ela não tinha, na realidade, uma profissão mas ela sempre foi uma pessoa bastante ativa, com mil compromissos e tal. Basicamente é isso, a vida toda do meu pai foi dentro da Petrobras, então, a nossa história como família é bastante influenciada pela carreira dele, eu nasci em Santos porque ele tava trabalhando na Refinaria de Cubatão e eles moravam em Santo"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV016.mov": {"size_mb": 39489.7383, "modified": "2013-12-18 08:39:39", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV016\\Audiovisual\\Preservação\\LIQ_HV016.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3363764.0, "duration": 3363.76, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 38.564}, "folder_size_gb": 38.564}, "Fotos": {"Acervo": {"LIQ_HV016_FT001.JPG" ro, você lembra da casa que o senhor cresceu, passou a infância?\nR – Sim, lembro.\nP/1 – Você consegue descrever ela para mim? Contar um pouco como é que ela era?\nR – Bom, uma casa, nós morávamos quando eu nasci, na época a gente morava em outra vila, em outro bairro e, uma casa, uma casa simples, era nos fundos de outra casa e ali vivi até cinco anos mais ou menos. Depois nós mudamos para outra residência, outra casa e era já uma casa assobradada e uma rua de terra, naquela época, aliás, pouco asfalto, não existia na época. E uma casa que havia, nós morávamos na parte superior do sobrado, embaixo havia outra família e, minha vida era ali, c"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV017.mov": {"size_mb": 50999.9053, "modified": "2013-12-18 14:04:27", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV017\\Audiovisual\\Preservação\\LIQ_HV017.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4226393.0, "duration": 4226.39, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 49.805}, "folder_size_gb": 49.805}, "Fotos": {"LIQ_HV017_MO001.jpg": {"size_mb": 9.2103, "modified": "2013-08-30 08:54:22", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV017\\Fotos\\LIQ_HV017_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV017_MO002.jpg": {"size_mb": 11.79, "modified": "2013-08-30 08:51:08", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV017\\Fotos\\LIQ_HV017_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV017_MO003.jpg": {"size_mb": 11.1549, "modified": "2013-08-30 08:51:44", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV017\ . Que meu pai veio do interior, trabalhava na Zona Sul e era muito difícil, nós estamos falando aí da década de 70, era muito difícil, era atravessar a cidade inteira. Então acabei, a gente acabou mudando para a Zona Sul e eu fui criado na Zona Sul e fiquei na Zona Sul até casar. Casei, minha esposa é do bairro do Tatuapé, acabei voltando para a Mooca, a querida Mooca, que não é Zona Leste, é centro expandido.\nP"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV020.mov": {"size_mb": 51468.6857, "modified": "2013-12-19 11:15:03", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV020\\Audiovisual\\Preservação\\LIQ_HV020.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4221255.0, "duration": 4221.26, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 50.262}, "folder_size_gb": 50.262}, "Fotos": {"LIQ_HV020_MO001.jpg": {"size_mb": 10.7541, "modified": "2013-08-30 09:31:52", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV020\\Fotos\\LIQ_HV020_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV020_MO002.jpg": {"size_mb": 9.6007, "modified": "2013-08-30 09:24:40", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV020\\Fotos\\LIQ_HV020_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "4840x3052", "height": 3052, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "4840x3052"}, "LIQ_HV020_MO003.jpg": {"size_mb": 7.6272, "modified": "2013-08-30 09:30:00", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV020\\Fotos\\LIQ_HV020_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "4692x3164", "height": 3164, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "4692x3164"}, "LIQ_HV020_MO004.jpg": {"size_mb": 9.0385,  "DOCX", "full_path": "H:\\LIQ\\LIQ_HV022\\Textual\\LIQ_HV022.docx", "category": "Textual", "content_preview": "Projeto Conhecimento Liquigás – 60 Anos de Memória\nDepoimento de Paolo Ditta\nEntrevistado por Tiago Majolo e Maria das Graças\nSão Paulo, 19/08/2013 \nRealização Museu da Pessoa\nLHV022_Paolo Ditta\nTranscrito por Francisco Guilherme Ribeiro Ruiz\nMW Transcrições\nP/1 – Então Paolo, primeira pergunta é identificação, nome completo, local e data de nascimento.\nR – Bom, meu nome é Paolo Ditta, eu nasci em São Paulo em 14 de agosto de 1961. Mas eu sou paulista de nascimento, mineiro de criação porque com seis meses de idade eu fui morar em Belo Horizonte e fiquei lá a formação inteira, então me entendo por mineiro, está certo, nascido em São Paulo, mas porém mineiro.\nP/1 – Tá. Fala um pouco dos seus pais, qual é a profissão deles e porque é que eles mudaram para Minas.\nR – É, eu sou filho de italianos, eu sou de uma família que é toda italiana, só eu que nasci no Brasil, eu tenho uma irmã italiana, meus pais, meu pai era italiano porque já faleceu, minha mãe ainda está viva, está com 88 anos e bem vivinha, bem ativa por sinal. Mas eles são italianos, minha mãe é professora, bancária, trabalhou algum tempo de professora, bancária na Itália, meu pai veio para o Brasil para trabalhar na Liquig"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV022.mov": {"size_mb": 68312.612, "modified": "2013-12-20 14:16:58", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV022\\Audiovisual\\Preservação\\LIQ_HV022.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 5838438.0, "duration": 5838.44, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 66.712}, "folder_size_gb": 66.712}, "Fotos": {"LIQ_HV022_MO001.jpg": {"size_mb": 11.9884, "modified": "2013-08-30 10:14:24", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV022\\Fotos\\LIQ_HV022_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV022_MO002.jpg": {"size_mb": 9.0026, "modified": "2013-08-30 10:15:06", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV022\\Fotos\\LIQ_HV022_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV022_MO003.jpg": {"size_mb": 11.4845, "modified": "2013-08-30 10:15:54", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV022\\Fotos\\LIQ_HV022_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV022_MO004.jpg": {"size_mb": 9.0771, "modified": "2013-08-30 17:03:52", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV022\\Fotos\\LIQ_HV022_MO004.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "folder_size_gb": 0.041}, "folder_size_gb": 66.752}, "LIQ_HV024": {"Textual": {"LIQ_HV024.docx": {"size_mb": 0.0526, "modified": "2013-09-25 11:32:46", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV024\\Textual\\LIQ_HV024.docx", "category": "Textual", "content_preview": "Projeto Liquigás\nDepoimento de Ângelo Santin\nEntrevistado por Thiago Majolo e Maria da Graça\nSão Paulo, 19/08/2013\nLHV024_Ângelo Santin\nRealização Museu da Pessoa\nTranscrito por Claudia Lucena\n\tMW Transcrições\nP/1 – Ângelo, eu queria começar perguntando o seu nome completo, o local e a data de nascimento.\nR – Eu nasci em Jesolo, província de Veneza, Itália, em 8 de agosto de 1931.\nP/1 – O nome completo é Ângelo...?\nR – Ângelo Santin.\nP/1 – Pode falar um pouco dos seus pais, o que eles faziam na Itália?\nR – Meu pai era um construtor civil, já de tradição de muitos anos, o pai dele era também, como tradição mesmo, importante no meio, era de, eu segui as normas, digamos assim, do meu pai, eu sou um geômetro, formado pelo Istituto Riccati de Treviso por geômetro, aí começou com, naquela época, 1952, tinha muitos empreiteiros brasileiros que estavam requisitando diplomados, que não é um engenheiro. Eu não sei se vocês sabem o que é geômetro, mas ele vem abaixo do engenheiro, é aquele opera, aquele que realmente comanda as obras, o engenheiro é aquele que fica projetando nos escritórios, o geômetro é aquele que também faz isso, mas tem limites, por exemplo, tantos metros de comprimento,"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV024.mov": {"size_mb": 66684.1623, "modified": "2013-12-20 14:55:31", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV024\\Audiovisual\\Preservação\\LIQ_HV024.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 5366667.0, "duration": 5366.67, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 65.121}, "folder_size_gb": 65.121}, "Fotos": {"Acervo": {"LIQ_HV024_DOC001.JPG": {"size_mb": 0.0719, "modified": "2013-08-19 18:49:58", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV024\\Fotos\\Acervo\\LIQ_HV024_DOC001.JPG", "category": "Image", "duration_ms": 0, "dimension": "1103x723", "height": 723, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1103x723"}, "LIQ_HV024_DOC002.JPG": {"size_mb": 1.4111, "modified": "2013-08-19 18:50:06", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV024\\Fotos\\Acervo\\LIQ_HV024_DOC002.JPG", "category": "Image", "duration_ms": 0, "dimension": "2504x3288", "height": 3288, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2504x3288"}, "LIQ_HV024_FT001.JPG": {"size_mb": 1.1265, "modified": "2018-11-07 13:57:02", " tavo Sanchez e Graça Marques\nSão Paulo, 20/08/2013.\nRealização Museu da Pessoa. \nLHV025_ Josete Muniz de Almeida\nTranscrito por Iara Gobbo.\n\tMW Transcrições\nP/1 – Pra começar vou pedir pra você falar o seu nome completo, a data e o local do seu nascimento.\nR – É Josete Muniz de Almeida, dez de fevereiro de 65, nasci em São Paulo.\nP/1 – Josete, você lembra da casa da sua infância? A casa em que você passou mais tempo, que você cresceu. Você consegue descrever ela pra gente?\nR – Olha, eu me recordo só de uma casa só que eu morava assim quando eu era cerca de uns quatro ou cinco anos. Eu não tenho muita memória assim da minha infância não. Mais da adolescência, tal, quando eu comecei a trabalhar, mas de recordação de infância eu tenho poucas memórias assim.\nP/1 – Agora as brincadeiras que vocês faziam de criança, você lembra?\nR – Ah, fantástico. Eu sempre fui muito agitada, muito espevitada. Acho que eu fui uma das que mais deu trabalho pra minha mãe fui eu. Sempre fui agitada, brincar. Sempre gostei de tá em grupo, de brincar com as crianças. Então isso realmente minha mãe, ela teve muito trabalho comigo. Embo"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV025.mov": {"size_mb": 72009.8499, "modified": "2013-12-18 08:20:29", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV025\\Audiovisual\\Preservação\\LIQ_HV025.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4413947.0, "duration": 4413.95, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 70.322}, "folder_size_gb": 70.322}, "Fotos": {"LIQ_HV025_MO001.jpg": {"size_mb": 9.0309, "modified": "2013-09-02 10:05:00", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV025\\Fotos\\LIQ_HV025_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV025_MO002.jpg": {"size_mb": 6.7527, "modified": "2013-09-02 10:00:16", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV025\\Fotos\\LIQ_HV025_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "4264x3012", "height": 3012, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "4264x3012"}, "LIQ_HV025_MO003.jpg": {"size_mb": 8.8023, "modified": "2013-09-02 10:02:40", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV025\\Fotos\\LIQ_HV025_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "folder_size_gb": 0.024}, "folder_size_gb": 70.346}, "LIQ_HV026": {"Textual": {"LIQ_HV026.doc": {"size_mb": 0.1475, "modified": "2013-09-24 10:17:44", "extension": "DOC", "full_path": "H:\\LIQ\\LIQ_HV026\\Textual\\LIQ_HV026.doc", "category": "Textual"}, "LIQ_HV026.docx": {"size_mb": 0.0445, "modified": "2026-02-24 16:29:52", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV026\\Textual\\LIQ_HV026.docx", "category": "Textual", "content_preview": "Projeto Conhecimento Liquigás – 60 Anos de Memória\nDepoimento de Rodrigo Solha Pazzini de Freitas\nEntrevistado por Gustavo Ribeiro Sanches e Graça Marques\nSão Paulo, 20/08/2013 \nRealização Museu da Pessoa\nLHV026_Rodrigo Solha Pazzini de Freitas\nTranscrito por Francisco Guilherme Ribeiro Ruiz\n\tMW Transcrições\nP/1 – Então Rodrigo, para começar eu vou pedir para você falar seu nome completo, a data e o local do seu nascimento.\nR – Tá. Meu nome é Rodrigo Solha Pazzini de Freitas, nasci em Belo Horizonte no dia 18 de abril de 1968.\nP/1 – Bacana. E Rodrigo, você passou a infância em Belo Horizonte?\nR – Foi.\nP/1 – E você lembra da casa que você cresceu? Você consegue descrever ela para gente?\nR – Sim. Era uma casa em um bairro tradicional de Belo Horizonte, eu sou o terceiro em uma família de quatro filhos, então e, é um tempo completamente diferente do o 20/08/2013 \nRealização Museu da Pessoa\nLHV028_Ataliba José Silva\nTranscrito por Francisco Guilherme Ribeiro Ruiz\nMW Transcrições\nP/1 – Nascimento, por favor?\nR – É Ataliba José Silva, 17 de novembro de 1952, eu nasci em Rio Paranaíba, Minas Gerais.\nP/1 – Minas Gerais?\nR – Isso. Bem encostadinho em Patos de Minas, também naquela região do Alto do Paranaíba.\nP/1 – E qual o nome dos seus pais?\nR – Meu pai é o mesmo nome meu, Ataliba José, aliás, Ataliba Silvério Silva, ele colocou Ataliba José Silva, tem um diferencinha. A minha mãe é Anita Albina Silva.\nP/1 – E você tem irmãos?\nR – Tenho, nós somos sete irmãos, um já faleceu, tanto quanto meu pai também já faleceu, mas hoje tem vivo seis e minha mãe ainda, ela mora na mesma região, na mesma cidade que eu nasci, Rio Paranaíba. Está lá tranquilinha com 90 anos, ela está fazendo, aliás, ela vai fazer 90 agora no próximo ano.\nP/1 – E o que é que seus pais faziam?\nR – No início era, meu pai era lavrador, com o tempo ele foi mudando um pouquinho o estilo de vida e o aperto foi aumentando, ele começou a mexer com carp"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV028.mov": {"size_mb": 73270.6856, "modified": "2013-12-18 08:54:30", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV028\\Audiovisual\\Preservação\\LIQ_HV028.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4307674.0, "duration": 4307.67, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 71.553}, "folder_size_gb": 71.553}, "Fotos": {"LIQ_HV028_MO001.jpg": {"size_mb": 9.1299, "modified": "2013-09-02 11:03:08", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV028\\Fotos\\LIQ_HV028_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV028_MO002.jpg": {"size_mb": 13.2279, "modified": "2013-09-02 11:08:04", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV028\\Fotos\\LIQ_HV028_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV028_MO003.jpg": {"size_mb": 9.5219, "modified": "2013-09-02 11:10:36", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV028\\Fotos\\LIQ_HV028_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "4740x3148", "height": 3148, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "4740x3148"}, "folder_size_gb": 0.031}, "folder_size_gb": 71.585}, "LIQ_HV029": {"Textual": {"LIQ_HV029.doc": {"size_mb": 0.0952, "modified": "2013-09-27 14:59:12", "extension": "DOC", "full_path": "H:\\LIQ\\LIQ_HV029\\Textual\\LIQ_HV029.doc", "category": "Textual"}, "LIQ_HV029.docx": {"size_mb": 0.0274, "modified": "2026-02-24 16:29:58", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV029\\Textual\\LIQ_HV029.docx", "category": "Textual", "content_preview": "Projeto Liquigás\nDepoimento de Paulo César Chaves Furlatetto\nEntrevistado por Thiago Majolo e Graça Marques\nSão Paulo, 21/08/2013\t\nRealização Museu da Pessoa\nLHV029_Paulo César Chaves Furlatetto\nTranscrito por Liliane Custódio\t\n\tMW Transcrições\nP/1 – Paulo, a primeira coisa que eu queria perguntar é o nome completo, o local e data de nascimento.\nR – Meu nome é Paulo César Chaves Furlanetto, nasci em quatro de setembro de 1947, no Rio de Janeiro.\nP/1 – Fala um pouco dos seus pais, a profissão deles, com eles eram.\nR – Olha, meu pai era industrial, e minha mãe não tinha... Como se dizia na época, do lar, não tinha nenhuma atividade profissional. Meu pai tinha uma serraria de mármores, uma extração de mármores e uma serraria. Fazia aquelas lâminas que iam para os chamados marmoristas. Era um negócio iniciado pelo meu avô. Meu avô é italiano, veio para o Brasil depois da Primeira Guerra Mundial, e tal. E acabou, com outros italianos, montando esse negócio. E o meu pai então foi trabalhar com eles e levou essa atividade aí até o final. Existia até uma expectativa de que eu fosse trabalhar com o meu pai, mas meu pai trabalhava demais, e a minha mãe era absolutamente contrária que eu foss"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV029.mov": {"size_mb": 90265.1366, "modified": "2013-12-18 10:32:57", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV029\\Audiovisual\\Preservação\\LIQ_HV029.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 5266867.0, "duration": 5266.87, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 88.15}, "folder_size_gb": 88.15}, "Fotos": {"LIQ_HV029_MO001.jpg": {"size_mb": 9.9037, "modified": "2013-09-02 09:15:04", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV029\\Fotos\\LIQ_HV029_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV029_MO002.jpg": {"size_mb": 12.026, "modified": "2013-09-02 09:16:08", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV029\\Fotos\\LIQ_HV029_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV029_MO003.jpg": {"size_mb": 9.4862, "modified": "2013-09-02 09:17:54", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV029\\Fotos\\LIQ_HV029_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "folder_size_gb": 0.031}, "folder_size_gb": 88.18}, "LIQ_HV030": {"Textual": {"LIQ_HV030.docx": {"size_mb": 0.053, "modified": "2013-09-27 14:59:10", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV030\\Textual\\LIQ_HV030.docx", "category": "Textual", "content_preview": "Projeto Liquigás\nDepoimento de Plínio Osvaldo Bressan\nEntrevistado por Thiago Majolo e Graça Marques\nSão Paulo, 21/08/2013\nRealização Museu da Pessoa\nLHV030_Plínio Osvaldo Bressan\nTranscrito por Cristiane Costa\n\tMW Transcrições\nP/1 – Plínio, a primeira pergunta é seu nome completo de novo, o local e a data de nascimento.\nR – Eu sou Plínio, Plínio Osvaldo Bressan, nasci numa pequena cidadezinha no interior de São Paulo, é uma estância turística chamada Barra Bonita, em três de julho de 1954.\nP/1 – Fala um pouco dos seus pais, a profissão deles? Eles foram parar como em Barra Bonita?\nR – Minha família é de imigrantes italianos. Então, eles vieram pro Brasil em busca do ouro negro, que é o café. Chegaram aqui, se perderam, então, os meus pais, os meus avós foram parar na lavoura do estado de São Paulo. Meus pais cresceram na lavoura e depois vieram pra cidade. Minha mãe sempre foi de prendas domésticas e o meu pai foi mecânico e uma grande parte da vida motorista de caminhão. Ele era caminhoneiro de caminhão grande, enfim.\nP/1 – Seus pais eram italianos ou eles nasceram aqui, no Brasil?\nR – Os meus avós e meus bisavós, italianos. E os meus pais já nasceram no Brasil, são brasileiros e"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV030.mov": {"size_mb": 79817.4179, "modified": "2013-12-18 09:29:43", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV030\\Audiovisual\\Preservação\\LIQ_HV030.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4775342.0, "duration": 4775.34, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 77.947}, "folder_size_gb": 77.947}, "Fotos": {"Acervo": {"Alta": {"LIQ_HV030_FT004.tif": {"size_mb": 0.8449, "modified": "2002-05-22 19:37:52", "exte ssoa\nLHV031_Silvio Rogerio Monteiro\nTranscrito por Francisco Guilherme Ribeiro Ruiz\n\tMW Transcrições\nP/1 – Então Silvio, primeiro me fala seu nome completo, data de nascimento, cidade?\nR – Tá. Meu nome é Silvio Rogerio Monteiro, nasci em 13 de agosto de 1961, sou natural aqui de Osasco, aqui da Grande São Paulo.\nP/1 – E qual o nome dos seus pais?\nR – Meu pai chama Roberto Monteiro e minha mãe Balduína Marcelino Monteiro.\nP/1 – E o que é que eles faziam, os seus pais?\nR – Minha mãe sempre foi do lar e meu pai era mecânico de manutenção de máquinas pesadas. Então ele trabalhou na construção de várias estradas aí, Castelo Branco, Belém-Brasília, então tiveram um pouco uma vida itinerante antes de eu nascer.\nP/1 – E você sabe, você lembra da sua casa da infância, como é que ela era? Você saberia descrever?\nR – Eu tenho na verdade três lembranças, a residência onde eu nasci em Osasco, morava no Centro lá de Osasco, detalhes assim da casa não me lembro muito bem não. Aí depois eu fui para uma segunda casa ainda em Osasco, mui"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV031.mov": {"size_mb": 48596.7906, "modified": "2013-12-18 11:22:32", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV031\\Audiovisual\\Preservação\\LIQ_HV031.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2851919.0, "duration": 2851.92, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 47.458}, "folder_size_gb": 47.458}, "Fotos": {"LIQ_HV031_FT001.jpg": {"size_mb": 8.8335, "modified": "2013-09-02 08:39:16", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV031\\Fotos\\LIQ_HV031_FT001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV031_FT002.jpg": {"size_mb": 9.4938, "modified": "2  obrigado por ter aceitado o convite para estar aqui com a gente fazendo a entrevista. Então começar pedindo para você repetir o seu nome completo, o local e a data de nascimento.\nR – Meu nome é Sérgio Bandeira de Melo, eu nasci no Rio de Janeiro, em 10 de maio de 1962.\nP/1 – E Sérgio, o nome dos seus pais? O que é que eles faziam?\nR – O meu pai ele era funcionário público, trabalhava no Departamento de Estradas de Rodagem do Rio de Janeiro e, era também empreendedor, tinha uns negócios dele, lojas de acessórios de carro, frota de táxi e outras coisas. E a minha mãe, professora primária, mas depois ela ficou só cuidando mesmo da família.\nP/1 – E Sérgio, assim, você tinha irmãos? Como é que era o cotidiano da casa, assim, da sua infância?\nR – Eu tenho uma irmã mais velha que eu, cerca de dois anos e meio, três anos mais velha que eu, que hoje mora em São Paulo, uma figura especi"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV032.mov": {"size_mb": 112924.4913, "modified": "2013-12-18 12:57:02", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV032\\Audiovisual\\Preservação\\LIQ_HV032.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 6927794.0, "duration": 6927.79, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 110.278}, "folder_size_gb": 110.278}, "Fotos": {"LIQ_HV032_MO001.jpg": {"size_mb": 7.7266, "modified": "2013-09-02 08:53:50", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV032\\Fotos\\LIQ_HV032_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "4676x3000", "height": 3000, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "4676x3000"}, "LIQ_HV032_MO002.jpg": {"size_mb": 9.5692, "modified": "2013-09-02 08:54:50", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV032\\Fotos\\LIQ_HV032_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV032_MO003.jpg": {"size_mb": 9.8707, "modified": "2013-09-02 08:56:54", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV032\\Fotos\\LIQ_HV032_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "folder_size_gb": 0.027}, "folder_size_gb": 110.305}, "LIQ_HV033": {"Textual": {"LIQ_HV033.docx": {"size_mb": 0.1111, "modified": "2013-12-03 15:27:02", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV033\\Textual\\LIQ_HV033.docx", "category": "Textual", "content_preview": "Projeto Liquigás\nDepoimento de Antonio Rubens Silva Silvino\nEntrevistado por Márcia Ruiz e Thiago Majolo \nSão Paulo, 22 de agosto de 2013 \nRealização Museu da Pessoa e Instituto Camargo Corrêa\nLHV033_Antonio Rubens Silva Silvino\nTranscrito por Karina Medici Barrella\nMW Transcrições\nP/1 – Rubens, bom dia\nR – Bom dia senhoras e senhores\nP/1 – Eu gostaria de agradecer a sua presença\nR – Maior prazer\nP/1 – E pra darmos início, eu gostaria que você falasse o seu nome completo, local e data de nascimento\nR – Antonio Rubens Silva Silvino, nasci em Santos, São Paulo, em 1953, 31 de março. Tenho 60 anos. Idade da Liquigás. E da Petrobrás\nP/1 – Qual o nome dos seus pais, por favor?\nR – Minha mãe Nice Silva Silvino e pai, Rubens Silvino\nP/1 – E qual era a atividade deles?\nR – Meu pai trabalhava na ferrovia em Santos, meu avô trabalhou na ferrovia também, trabalhava no escritório, chefe de escritório da Baixada Santista e se aposentou como ferroviário. Minha mãe era dona de casa, mas era costureira, de alta costura, durante algum tempo foi doceira, depois ficou só com a costura. Foi professora de corte e costura e fazia vestidos longos pra festa, vestidos de casamento, hoje está aposentada. Me"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV0 4\\Textual\\LIQ_HV034.doc", "category": "Textual"}, "LIQ_HV034.docx": {"size_mb": 0.0286, "modified": "2026-02-24 16:30:04", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV034\\Textual\\LIQ_HV034.docx", "category": "Textual", "content_preview": "Projeto Conhecimento Liquigás – 60 Anos de Memória\nDepoimento de Ricardo Mendes de Paula\nEntrevistado por Tiago Majolo e Graça Marques\nSão Paulo 22/08/2013 \nRealização Museu da Pessoa\nLHV034_Ricardo Mendes de Paula\nTranscrito por Francisco Guilherme Ribeiro Ruiz\n\tMW Transcrições\nP/1 – Então Ricardo para começar eu queria perguntar o nome completo, o local e a data de nascimento?\nR – Ricardo Mendes de Paula, 27 de novembro de 1947, São Paulo.\nP/1 – Qual era o bairro do senhor de São Paulo, aqui?\nR – É, eu nasci na Vila Nova Conceição, há 65 anos.\nP/1 – E como é que era o bairro, um pouco?\nR – É, naquela época o Vila Nova Conceição não é o que é hoje, a Avenida Santo Amaro ali era uma estrada de terra, era praticamente o deserto e era na época inclusive que você brincava só na rua, jogava futebol, empinava papagaio. Então você brincava muito na rua, realmente a tua infância era diferente da infância que as crianças têm hoje, um pouco mais presa. E eu vivi lá até mais ou menos meus 14, 15 anos, aí depois nós mudamos, mudamos para um bairro próximo de Santo Amaro. Aí morei nesse bairro próximo de Santo Amaro até praticamente quando eu casei, que aí saí e fui morar já no, casado, ali no"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV034.mov": {"size_mb": 75482.5432, "modified": "2013-12-18 15:45:32", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV034\\Audiovisual\\Preservação\\LIQ_HV034.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4397431.0, "duration": 4397.43, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 73.713}, "folder_size_gb": 73.713}, "Fotos": {"LIQ_HV034_MO001.jpg": {"size_mb": 11.2673, "modified": "2013-09-02 09:33:14", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV034\\Fotos\\LIQ_HV034_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV034_MO002.jpg": {"size_mb": 11.1302, "modified": "2013-09-02 09:34:24", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV034\\Fotos\\LIQ_HV034_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV034_MO003.jpg": {"size_mb": 11.5229, "modified": "2013-09-02 09:37:38", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV034\\Fotos\\LIQ_HV034_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "folder_size_gb": 0.033}, "folder_size_gb": 73.747}, "LIQ_HV035": {"Textual": {"LIQ_HV035.docx": {"size_mb": 0.0769, "modified": "2013-10-08 10:09:18", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV035\\Textual\\LIQ_HV035.docx", "category": "Textual", "content_preview": "Projeto Liquigás\nDepoimento de Gerson Martins Santos\nEntrevistado por Graça Marques \nSão Paulo, 22/08/2013 \nRealização Museu da Pessoa \nLHV035_Gerson Martins Santos\nTranscrito por Karina Medici Barrella\nMW Transcrições\nR – Gerson Martins Santos, nasci no dia 28 de outubro de 1955, na cidade chamada Rancharia, Estado de São Paulo\nP/1 – Qual era o nome dos seus pais?\nR – Meu pai chamava-se Gideon Ferreira Santos, e minha mãe Maria de Lourdes dos Reis Santos, ambos baianos\nP/1 – E o que eles faziam?\nR – Meu pai sempre trabalhou na roça e minha mãe doméstica, sempre cuidou de casa, dos filhos, né?\nP/1 – E eles se casaram na Bahia?\nR – Se casaram na Bahia\nP/1 – E vieram pra São Paulo?\nR – Vieram pra São Paulo\nP/1 – Eles já tinham filhos quando vieram pra cá?\nR – Não, não, eu sou o primeiro filho. Aí moraram naquela região ali, Rancharia, Palmital, Assis, Marília, Osvaldo Cruz, então sempre perambulando por ali. Eu sou daquela região ali, junto com os japoneses (risos)\nP/1 – E eles vieram pra trabalhar, é isso?\nR – É, vieram pra trabalhar. Então saindo da Bahia, procurando melhores condições de vida, vieram pra cá. E depois de um tempo, por volta de 1968, nós viemos pra São Paulo, eu era"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV035.mov": {"size_mb": 51621.3982, "modified": "2013-12-18 16:12:22", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV035\\Audiovisual\\Preservação\\LIQ_HV035.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3163197.0, "duration": 3163.2, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 50.412}, "folder_size_gb": 50.412}, "Fotos": {"LIQ_HV035_MO001.jpg": {"size_mb": 9.8019, "modified": "2013-09-02 09:12:58", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV035\\Fotos\\LIQ_HV035_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV035_MO002.jpg": {"size_mb": 8.0571, "modified": "2013-09-02 09:11:30", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV035\\Fotos\\LIQ_HV035_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "4812x3048", "height": 3048, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "4812x3048"}, "LIQ_HV035_MO003.jpg": {"size_mb": 9.9291, "modified": "2013-09-02 09:10:14", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV035\\Fotos\\LIQ_HV035_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "dur
