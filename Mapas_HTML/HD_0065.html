eipnik Kotouc, nasci no Rio de Janeiro, 24 de outubro de 1960.\nP/1 – E o nome dos seus pais?\nR – Hanus Kotouc e Camila Leipnik Kotouc.\nP/1 – O que eles faziam ou fazem?\nR – Meu pai ainda trabalha, tá com... Tem que fazer as contas. Acho que 89 anos. Agora reduziu um pouquinho o ritmo de trabalho, mas vai todo dia para o escritório ainda, trabalha com vendas, é representante industrial. Minha mãe trabalhava também com venda, já falecida já, faleceu quando eu tinha 18 anos, mas também trabalhava... Comercial, né? Com vendas. É basicamente representação de material de construção, vende para as lojas. Representa as fábricas e vende para as lojas.\nP/1 – E qual a origem do seu nome, Fred?\nR – Meu é tcheco, família tcheca. Até onde se sabe, tcheco mesmo, enfim. Minha mãe filha de... Ouvi dizer que era húngaro com iugoslavo"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV039.mov": {"size_mb": 72120.0992, "modified": "2013-12-19 10:37:08", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV039\\Audiovisual\\Preservação\\LIQ_HV039.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4284418.0, "duration": 4284.42, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 70.43}, "folder_size_gb": 70.43}, "Fotos": {"LIQ_HV039_MO001.jpg": {"size_mb": 9.4987, "modified": "2013-09-02 09:48:16", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV039\\Fotos\\LIQ_HV039_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV039_MO002.jpg": {"size_mb": 12.5552, "modified": "2013-09-02 09:50:08", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV039\\Fotos\\LIQ_HV039_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV039_MO003.jpg": {"size_mb": 12.4324, "modified": "2013-09-02 09:51:08", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV039\\Fotos\\LIQ_HV039_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "folder_size_gb": 0.034}, "folder_size_gb": 70.464}, "LIQ_HV040": {"Textual": {"LIQ_HV040.docx": {"size_mb": 0.0526, "modified": "2013-10-11 11:23:32", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV040\\Textual\\LIQ_HV040.docx", "category": "Textual", "content_preview": "Projeto Conhecimento Liquigás – 60 anos de memórias\nDepoimento de Maria Inês Frota\nEntrevistada por Stela Tredice e Graça Marques\nSão Paulo, 27 de agosto de 2013\nRealização Museu da Pessoa\nLHV040_Maria Inês Frota\nTranscrito por Claudia Lucena\nMW Transcrições\nP/1 – Então eu queria, por favor, que você começasse falando o seu nome completo, o local e a data do seu nascimento.\nR – Tá, dia, mês e ano?\nP/1 – Isso.\nR – Tá, eu nasci em Mantenópolis, um município do Espírito Santo, né, eu, a minha idade é, eu nasci em 3 de dezembro de 1952.\nP/1 – E o seu nome completo?\nR – Maria Inês Frota.\nP/1 – E o nome dos seus pais?\nR – Nestor da Silva Pereira e Dona Lina Joana de Souza.\nP/1 – O que os seus pais faziam ou fazem?\nR – Tá, meus pais hoje são falecidos, né, o meu pai, ele era um empreendedor na cidade onde ele morava, ele comprava café no pé, né, ia nas fazendas, comprava café e ele beneficiava o café e vendia em Vitória, né, junto com isso ele tinha padaria, ele tinha açougue, então ele era uma pessoa comerciante, né. E a minha mãe sempre trabalhando junto com ele, né, minha mãe gostava muito de cozinhar, então ela tomava conta da padaria, né, e aí isso foram muitos anos. Nós estudamos, i"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV040.mov": {"size_mb": 85401.4607, "modified": "2013-12-19 15:34:01", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV040\\Audiovisual\\Preservação\\LIQ_HV040.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 5000601.0, "duration": 5000.6, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 83.4}, "folder_size_gb": 83.4}, "Fotos": {"LIQ_HV040_MO001.jpg": {"size_mb": 9.4206, "modified": "2013-09-02 14:00:32", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV040\\Fotos\\LIQ_HV040_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV040_MO002.jpg": {"size_mb": 8.7229, "modified": "2013-09-02 14:01:24", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV040\\Fotos\\LIQ_HV040_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV040_MO003.jpg": {"size_mb": 7.7457, "modified": "2013-09-02 14:04:38", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV040\\Fotos\\LIQ_HV040_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV040_MO004.jpg": {"size_mb": 9.4912, "modified": "2013-09-02 14:03:04", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV040\\Fotos\\LIQ_HV040_MO004.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "folder_size_gb": 0.035}, "folder_size_gb": 83.434}, "LIQ_HV041": {"Textual": {"LIQ_HV041.docx": {"size_mb": 0.0537, "modified": "2013-10-14 09:35:38", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV041\\Textual\\LIQ_HV041.docx", "category": "Textual", "content_preview": "Projeto Liquigás\nDepoimento de José de Mello\nEntrevistado por Márcia Ruiz e Isla Nakano\nRio de Janeiro, 27/08/2013\nRealização Museu da Pessoa\nLHV041_José de Mello\nTranscrito por Cristiane Costa\n\tMW Transcrições\nP/1 – Bom dia, seu Zé Mello. Eu gostaria de agradecer a sua presença em nome do Museu da Pessoa e da própria Liquigás e, pra começar, eu queria que o senhor me dissesse nome, local e data de nascimento.  \nR – José de Mello, Batalha, Estado do Piauí.\nP/1 – Que data e que ano que o senhor nasceu?\nR – 07/11/1943.\nP/1 – E qual o nome dos seus pais, seu José?\nR – Raimundo Nonato de Mello e Luísa Elisa Neto.\nP/1 – E o quê que o pai do senhor fazia? O quê que os seus pais faziam?\nR – Minh mãe fazia era doméstica, né, trabalhava em casa e meu pai era agricultor.\nP/1 – E ele plantava o quê? \nR – Ah, plantava tudo o que você possa imaginar, mandioca, feijão, arroz e, principalmente cana, cana de açúcar, né?\nP/1 – E era uma extensão de terra muito grande? Como é que era esse pedaço de terra que o seu pai plantava?\nR – Não, era médio, assim, algo em torno de 150 hectares, por aí, assim.\nP/1 – E me fala uma coisa, como era o nome dos seus avós, por parte de pai e por parte de mãe? \nR – A"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV041.mov": {"size_mb": 85220.2235, "modified": "2014-01-13 14:11:12", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV041\\Audiovisual\\Preservação\\LIQ_HV041.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4235969.0, "duration": 4235.97, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 83.223}, "folder_size_gb": 83.223}, "folder_size_gb": 83.223}, "LIQ_HV042": {"Textual": {"LIQ_HV042.docx": {"size_mb": 0.0639, "modified": "2013-10-11 11:23:26", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV042\\Textual\\LIQ_HV042.docx", "category": "Textual", "content_preview": "Projeto Conhecimento Liquigás 60 Anos de Memórias\nDepoimento de Paulo Cesar Wendelin Filho\nEntrevistada por Stela Tredice e Graça Marques\nSão Paulo, 27 de Agosto de 2013.\nRealização Museu da Pessoa. \nLHV042_Paulo Cesar Wendelin Filho\nTranscrito por Iara Gobbo.\nMW Transcrições\nP/1 – Queria que você começasse falando seu nome completo, o local e a data do seu nascimento.\nR – Eu me chamo Paulo Cesar Wendelin Filho. Sou de três de março de 44. O que mais?\nP/1 – Onde você nasceu?\nR – Em Buenópolis, Minas Gerais.\nP/1 – E esse nome Wendelin, qual é a origem desse nome?\nR – Alemã. É descendência alemã, né?\nP/1 – E o nome dos seus pais?\nR – É Paulo Cesar Wendelin e Yuka Ferreira Wendelin.\nP/1 – E o que seus pais faziam ou fazem?\nR – O meu pai era viajante, minha mãe era, é um título que eu não gosto, mas antigamente era. Doméstica, cuidava do lar. Então nós éramos 12 irmãos e praticamente criados só pela mãe, porque o velho vivia viajando. Não é essa facilidade de hoje, né? Ficava um mês, um mês e meio fora. E criou 12 filhos.\nP/1 – Você cresceu aonde, Paulo?\nR – Eu cresci em Belo Horizonte. Como disse, eu nasci em Buenópolis. É uma questão de passagem, mas eu falo que sou belo-horizontino."}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV042.mov": {"size_mb": 38848.8277, "modified": "2013-12-20 15:04:52", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV042\\Audiovisual\\Preservação\\LIQ_HV042.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3313347.0, "duration": 3313.35, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 37.938}, "folder_size_gb": 37.938}, "Fotos": {"LIQ_HV042_MO001.jpg": {"size_mb": 8.7096, "modified": "2013-09-02 14:12:04", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV042\\Fotos\\LIQ_HV042_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV042_MO002.jpg": {"size_mb": 9.7863, "modified": "2013-09-02 14:07:50", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV042\\Fotos\\LIQ_HV042_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV042_MO003.jpg": {"size_mb": 10.6777, "modified": "2013-09-02 14:10:46", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV042\\Fotos\\LIQ_HV042_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "4928x3280", "height": 3280, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "4928x3280"}, "folder_size_gb": 0.028}, "folder_size_gb": 37.967}, "LIQ_HV043": {"Textual": {"LIQ_HV043.doc": {"size_mb": 0.1113, "modified": "2013-10-16 16:22:26", "extension": "DOC", "full_path": "H:\\LIQ\\LIQ_HV043\\Textual\\LIQ_HV043.doc", "category": "Textual"}, "LIQ_HV043.docx": {"size_mb": 0.0342, "modified": "2026-02-24 16:30:10", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV043\\Textual\\LIQ_HV043.docx", "category": "Textual", "content_preview": "Projeto Conhecimento Liquigás – 60 Anos de Memória\nDepoimento de Darlan Pedretti Cozendey\nEntrevistada por Tiago Majolo e Graça Marques\nSão Paulo 28/08/2013 \nRealização Museu da Pessoa\nLHV043_Darlan Pedretti Cozendey\nTranscrito por Francisco Guilherme Ribeiro Ruiz\n\tMW Transcrições\nP/1 – Darlan, queria começar perguntando o seu nome completo, o local e a data de nascimento?\nR – Meu nome é Darlan Pedretti Cozendey, tenho 44 anos, nasci em 31 de março de 1969, em Itaocara, Rio de Janeiro. Itaocara significa aldeia da pedra, é um lugar bacana, o interiorzinho do Rio, bem próximo onde residem meus pais hoje.\nP/1 – Conta um pouco dos seus pais, qual a profissão deles? Como se conheceram?\nR – Então, minha mãe professora, diretora, deu aula muito tempo e geriu uma escola no interior, na Zona Rural, eu até tive oportunidade de participar bastante dessa fase aí, acabei fazendo minha quarta série lá também, porque saí da cidade e fui para lá. Vivia muito lá, era um lugar que não tinha nem energia elétrica, a água para a escola era bombeada, ali era um negócio bem curioso, eu aprendi muita coisa ali, com aquele povo ali do interior, a cultura deles ali, apesar de ser próximo da cidade, assim e"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV043.mov": {"size_mb": 86315.5051, "modified": "2013-12-19 16:05:26", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV043\\Audiovisual\\Preservação\\LIQ_HV043.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 5039873.0, "duration": 5039.87, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 84.292}, "folder_size_gb": 84.292}, "Fotos": {"LIQ_HV043_MO001.jpg": {"size_mb": 9.9598, "modified": "2013-09-02 15:16:18", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV043\\Fotos\\LIQ_HV043_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV043_MO002.jpg": {"size_mb": 9.8161, "modified": "2013-09-02 15:23:40", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV043\\Fotos\\LIQ_HV043_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV043_MO003.jpg": {"size_mb": 10.6931, "modified": "2013-09-02 15:20:20", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV043\\Fotos\\LIQ_HV043_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "folder_size_gb": 0.03}, "folder_size_gb": 84.322}, "LIQ_HV044": {"Textual": {"LIQ_HV044.docx": {"size_mb": 0.0789, "modified": "2013-10-11 11:23:26", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV044\\Textual\\LIQ_HV044.docx", "category": "Textual", "content_preview": "Projeto Conhecimento Liquigás - 60 anos de Memórias\nDepoimento de Alexandre Appel da Silva\nEntrevistado por Stela Tredice e Graça Marques \nSão Paulo, 28 de agosto de 2013 \nRealização Museu da Pessoa \nLHV044_Alexandre Appel da Silva\nTranscrito por Karina Medici Barrella\nMW Transcrições\nP/1 – Por favor, começa com o seu nome completo, o local e a data de nascimento\nR – Eu sou Alexandre Appel da Silva, sou nascido em 27 de fevereiro de 1954, em Porto Alegre, capital do Rio Grande do Sul\nP/1 – E qual o nome dos seus pais?\nR – Meu falecido pai é Carlos Borba da Silva, minha mãe mora aqui no Estado de São Paulo, no interior, com meu irmão mais velho, em Ibiúna, uma chácara linda. Chama Izolina Dorothéa Appel da Silva\nP/1 – E o que seu pai fazia, o que sua mãe faz?\nR – Meu pai foi funcionário público municipal na Prefeitura Municipal de Porto Alegre a vida inteira. Chegou a um cargo bem elevado, Tesoureiro Geral da Prefeitura, graças a seu esforço e sua conduta moral e ética. Nós fomos criados num lar com muita moral, muita ética, um lar cristão. E minha mãe sempre no lar, cuidando dos filhos, eu e mais três irmãos. Minha mãe era uma mãe extremamente dedicada aos filhos, uma excelente mãe"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV044.mov": {"size_mb": 55382.8348, "modified": "2013-12-19 17:02:38", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV044\\Audiovisual\\Preservação\\LIQ_HV044.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3251752.0, "duration": 3251.75, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 54.085}, "folder_size_gb": 54.085}, "Fotos": {"LIQ_HV044_MO001.jpg": {"size_mb": 9.5058, "modified": "2013-09-02 15:26:22", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV044\\Fotos\\LIQ_HV044_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "4368x3124", "height": 3124, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "4368x3124"}, "LIQ_HV044_MO002.jpg": {"size_mb": 11.8166, "modified": "2013-09-02 15:28:20", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV044\\Fotos\\LIQ_HV044_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV044_MO003.jpg": {"size_mb": 8.879, "modified": "2013-09-02 15:29:26", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV044\\Fotos\\LIQ_HV044_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "folder_size_gb": 0.029}, "folder_size_gb": 54.114}, "LIQ_HV045": {"Textual": {"LIQ_HV045.doc": {"size_mb": 0.0977, "modified": "2013-10-14 09:35:38", "extension": "DOC", "full_path": "H:\\LIQ\\LIQ_HV045\\Textual\\LIQ_HV045.doc", "category": "Textual"}, "LIQ_HV045.docx": {"size_mb": 0.0269, "modified": "2026-02-24 16:30:14", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV045\\Textual\\LIQ_HV045.docx", "category": "Textual", "content_preview": "Projeto Liquigás\nDepoimento de Maria das Graças Silva Foster\nEntrevistada por Márcia Ruiz e Isla Nakano\nRio de Janeiro 30/08/2013\t\nRealização Museu da Pessoa\nLHV045_Maria das Graças Silva Foster\nTranscrito por Liliane Custódio\t\n\tMW Transcrições\nP/1 – Graça, boa tarde. Eu gostaria de agradecer em nome do Museu da Pessoa e da Liquigás a sua presença. E pra começar, para o início, eu gostaria que você falasse seu nome completo, local e data de nascimento.\nR – Meu nome é Maria das Graças Silva Foster. Eu sou mineira, nasci em Caratinga e nasci no dia 26 de agosto de 1953.\nP/1 – Meus parabéns. Recentemente fez aniversário.\nR – É. Segunda-feira. \nP/1 – Qual o nome dos seus pais, Graça?\nR – Meu pai, Dairel Silva; e a minha mãe, Terezinha Vieira (Pena?) Silva.\nP/1 – E qual era a atividade deles?\nR – Minha mãe, doméstica, e meu pai era vendedor.\nP/1 – Ele vendia o quê, Graça?\nR – Ah, vendia um monte de coisa. Eu lembro vendendo máquina, aquelas máquinas de escrever antigas, depois me lembro dele vendendo material de escritório. Lembro bem disso.\nP/1 – E, Graça, você chegou a conhecer seus avôs por parte de pai, por parte de mãe? Qual era o nome deles?\nR – Meu avô, Agenor Silva, pai do meu p"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV045.mov": {"size_mb": 84281.3635, "modified": "2014-01-15 13:41:32", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV045\\Audiovisual\\Preservação\\LIQ_HV045.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3969236.0, "duration": 3969.24, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 82.306}, "folder_size_gb": 82.306}, "folder_size_gb": 82.306}, "LIQ_HV046": {"Textual": {"LIQ_HV046.docx": {"size_mb": 0.0973, "modified": "2013-11-04 10:28:12", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV046\\Textual\\LIQ_HV046.docx", "category": "Textual", "content_preview": "Projeto Conhecimento Liquigás – 60 anos de memórias\nDepoimento de Luiz Rodolfo Landim Machado\nEntrevistado por Márcia Ruiz e Isla Nakano \nRio de Janeiro, 28 de agosto de 2013 \nRealização Museu da Pessoa\nLHV046_Luiz Rodolfo Landim Machado\nTranscrito por Karina Medici Barrella\nMW Transcrições\nP/1 – Landim, bom dia. Em nome do Museu da Pessoa e da Liquigás eu gostaria de agradecer a sua presença. E pra deixar registrado, eu vou fazer algumas perguntas que você já nos respondeu. Qual o nome, local e data de nascimento?\nR – Meu nome é Luiz Rodolfo Landim Machado, apesar de ser conhecido mais aqui dentro do grupo como Rodolfo Landim, os dois nomes do meio. E a data de nascimento é 24 de março de 1957. Eu sou natural do Rio de Janeiro, carioca\nP/1 – E o nome dos seus pais?\nR – Bom, meu pai tem um nome engraçado, meu pai chamava-se Jaderico Pires Ferreira Machado, tem toda uma história nordestina por detrás disso mas, só isso aí ia começar uns cinco minutos pra contar. E minha mãe chama Maria Augusta Landim Machado\nP/1 – Agora eu fiquei curiosa, queria que você falasse um pouquinho dessa história do nome do seu pai (risos)\nR – É coisa de nordestino, né? Meu bisavô era Senador da República,"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV046.mov": {"size_mb": 122613.0903, "modified": "2014-01-10 21:29:46", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV046\\Audiovisual\\Preservação\\LIQ_HV046.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 6689223.0, "duration": 6689.22, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 119.739}, "folder_size_gb": 119.739}, "folder_size_gb": 119.739}, "LIQ_HV047": {"Textual": {"LIQ_HV047.docx": {"size_mb": 0.0522, "modified": "2013-10-18 16:40:24", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV047\\Textual\\LIQ_HV047.docx", "category": "Textual", "content_preview": "Projeto Conhecimento Liquigás 60 Anos de Memórias\nDepoimento de Achille Marmiroli\nEntrevistado por Stela Tredice\nSão Paulo, 30 de Agosto de 2013.\nRealização Museu da Pessoa. \nLHV_047_Achille Marmiroli\nTranscrito por Iara Gobbo.\nMW Transcrições\nP/1 – Vamos lá. Só pra entender um pouquinho, se o senhor puder só falar pra mim quando que o senhor veio pro Brasil novamente, como o senhor falou, né? Agora a gente tá gravando. O senhor veio pro Brasil quando?\nR – Eu vou conta a minha história.\nP/1 – Por favor.\nR – A minha história é a seguinte. Trabalhamos na Liquigás na Itália, eu sou de Milão, quando na Itália, no setor de gás, surgiu a noticia que no Brasil tinha sido inaugurada uma refinaria de petróleo na localidade de Madre de Deus, na Bahia, e que esta refinaria não tinha a torre catalítica de refino para extrair o gás liquefeito de petróleo, mas que essa torre seria feita e seria inaugurada ainda Novembro ou no começo de 1955. Então eu vim aqui pra fazer as sondagens , as verificações, tomar contato com as autoridades que na época estavam no Rio de Janeiro e que era o Conselho Nacional do Petróleo. Não existia ainda a Petrobrás. Aí com base nestas indagações que eu fiz, foi fundad"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV047.aif": {"size_mb": 427.2523, "modified": "2013-12-20 16:50:34", "extension": "AIF", "full_path": "H:\\LIQ\\LIQ_HV047\\Audiovisual\\Preservação\\LIQ_HV047.aif", "category": "Other"}, "folder_size_gb": 0.417}, "folder_size_gb": 0.417}, "Fotos": {"LIQ_HV047_MO001.jpg": {"size_mb": 12.9949, "modified": "2013-09-02 15:38:06", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV047\\Fotos\\LIQ_HV047_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV047_MO002.jpg": {"size_mb": 15.3248, "modified": "2013-09-02 15:41:08", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV047\\Fotos\\LIQ_HV047_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "4984x3144", "height": 3144, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "4984x3144"}, "LIQ_HV047_MO003.jpg": {"size_mb": 13.1258, "modified": "2013-09-02 15:40:00", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV047\\Fotos\\LIQ_HV047_MO003.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "LIQ_HV047_MO004.jpg": {"size_mb": 10.0019, "modified": "2013-09-02 15:42:14", "extension": "JPG", "full_path": "H:\\LIQ\\LIQ_HV047\\Fotos\\LIQ_HV047_MO004.jpg", "category": "Image", "duration_ms": 0, "dimension": "4908x3216", "height": 3216, "dpi": 240.0, "color_mode": "RGB", "duration": 0.0, "resolution": "4908x3216"}, "folder_size_gb": 0.05}, "folder_size_gb": 0.468}, "LIQ_HV048": {"Textual": {"LIQ_HV048.doc": {"size_mb": 0.062, "modified": "2013-10-18 16:30:08", "extension": "DOC", "full_path": "H:\\LIQ\\LIQ_HV048\\Textual\\LIQ_HV048.doc", "category": "Textual"}, "LIQ_HV048.docx": {"size_mb": 0.018, "modified": "2026-02-24 16:30:16", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV048\\Textual\\LIQ_HV048.docx", "category": "Textual", "content_preview": "Projeto Conhecimento Liquigás – 60 Anos de Memória\nDepoimento de José Carlos Cosenza\nEntrevistado por Julia Vagner Pereira\nRio de Janeiro 02/09/2013 \nRealização Museu da Pessoa\nLHV048_José Carlos Cosenza\nTranscrito por Francisco Guilherme Ribeiro Ruiz\n\tMW Transcrições\nP/1 – Bom, para começar a gente gostaria que você dissesse o seu nome completo, seu local de nascimento e data?\nR – Bem, meu nome é José Carlos Cosenza, eu nasci em Porto Alegre, Rio Grande do Sul, 23 de abril de 1951.\nP/1 – E o nome dos seus pais e avós?\nR – Meu pai Francisco Cosenza e minha mãe Ângela Marroni Cosenza.\nP/1 – Avós?\nR – Não me lembro.\nP/1 – Não lembra?\nR – Não os conheci porque eles nasceram na Itália, coisa e tal. Vocês vão cortar isso aí, você vai ajustar, não é?\nP/1 – Você tem irmãos?\nR – Tinha, tinha um irmão que faleceu, que veio da Itália com minha mãe e meu pai e ele faleceu em 1997.\nP/1 – E seus pais vieram da Itália?\nR – Sim, meus pais vieram da Itália depois da Segunda Guerra Mundial e se estabeleceram em Porto Alegre, Rio Grande do Sul. Vieram com o meu irmão, que na época que ele veio já tinha 20 anos de idade e eu nasci um ano depois que eles vieram para cá. Eu nasci em 1951, eles chegaram"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV048.mov": {"size_mb": 46166.3429, "modified": "2014-01-15 14:52:04", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV048\\Audiovisual\\Preservação\\LIQ_HV048.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2126260.0, "duration": 2126.26, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 45.084}, "folder_size_gb": 45.084}, "folder_size_gb": 45.084}, "LIQ_HV049": {"Textual": {"LIQ_HV049.doc": {"size_mb": 0.0894, "modified": "2013-10-16 16:22:26", "extension": "DOC", "full_path": "H:\\LIQ\\LIQ_HV049\\Textual\\LIQ_HV049.doc", "category": "Textual"}, "LIQ_HV049.docx": {"size_mb": 0.0247, "modified": "2026-02-24 16:30:18", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV049\\Textual\\LIQ_HV049.docx", "category": "Textual", "content_preview": "Projeto Conhecimento Liquigás – 60 anos de memórias\nDepoimento de José Lima de Andrade Neto\nEntrevistado por Júlia Wagner Pereira\nRio de Janeiro, 02/09/2013\t\nRealização Museu da Pessoa\nLHV049_José Lima de Andrade Neto\nTranscrito por Liliane Custódio\t\nMW Transcrições\nP/1 – Bom, pra gente começar nosso depoimento, eu gostaria que você dissesse o seu nome, o local e a data do seu nascimento.\nR – Meu nome é José Lima de Andrade Neto, nasci no 23 de março de 1954, na cidade de Aracaju, em Sergipe.\nP/1 – O nome dos seus pais e avôs.\nR – Os meus pais são Edson Gomes Andrade e Iraci Lima Andrade. Meus avôs são Maria Gomes Andrade e José Lima de Andrade, do qual eu herdei o nome. Aliás, essa é uma história engraçada, porque meu pai queria outro nome, meu avô não deixou, botou o nome dele. E são os avôs com quem eu tive mais contato, aliás, parte inicial da minha infância eu morei com eles. Aconteceu uma coisa curiosa quando eu nasci, eu mamava muito, os médicos disseram quando a minha irmã nasceu: “Olha, se esse menino ficar aqui, a irmã não vai mamar, tem que sair daqui”. Eu fui morar com os meus avôs. Então com um ano de idade eu fui morar com os meus avôs. Então José Lima Andrade e Maria"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV049.mov": {"size_mb": 4375.6632, "modified": "2014-01-15 17:02:50", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV049\\Audiovisual\\Preservação\\LIQ_HV049.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3177644.0, "duration": 3177.64, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 4.273}, "folder_size_gb": 4.273}, "folder_size_gb": 4.273}, "LIQ_HV050": {"Textual": {"LIQ_HV050.doc": {"size_mb": 0.0684, "modified": "2013-10-18 16:30:08", "extension": "DOC", "full_path": "H:\\LIQ\\LIQ_HV050\\Textual\\LIQ_HV050.doc", "category": "Textual"}, "LIQ_HV050.docx": {"size_mb": 0.0208, "modified": "2026-02-24 16:30:20", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV050\\Textual\\LIQ_HV050.docx", "category": "Textual", "content_preview": "Projeto Conhecimento Liquigás – 60 Anos de Memória\nDepoimento de José Eduardo de Barros Dutra\nEntrevistado por Isla Nakano\nRio de Janeiro, 03/09/2013 \nRealização Museu da Pessoa\nLHV_050_José Eduardo de Barros Dutra\nTranscrito por Francisco Guilherme Ribeiro Ruiz\n\tMW Transcrições\nP/1 – Bom senhor Dutra, primeiro eu queria agradecer o senhor ter tirado um pouquinho do seu tempo e dar essa entrevista para a gente, para a gente conseguir resgatar a história da Liquigás.\nR – Ok, obrigado a você.\nP/1 – E para começar e deixar registrado eu queria que o senhor falasse o seu nome completo, onde o senhor nasceu e quando o senhor nasceu?\nR – José Eduardo de Barros Dutra, nasci no Rio de Janeiro no dia 11 de abril de 1957.\nP/1 – E senhor Dutra, qual é que é o nome dos seus pais?\nR – Meu pai José Araújo Dutra, já falecido e minha mãe, ainda viva, Clóris de Barros Dutra.\nP/1 – E dos avós, o senhor sabe?\nR – Vamos lá, (risos). Avós paternos, José Muniz Dutra e Inês Araújo Dutra. Avós maternos, Belarmino Gomes de Barros e Olindina Dutra de Barros.\nP/1 – E o senhor sabe um pouquinho da história dessa família, origem?\nR – Ah, bom a família Dutra segundo o meu pai, que pesquisava a origem diz que er"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"LIQ_HV050.mov": {"size_mb": 3967.7774, "modified": "2014-01-15 18:30:56", "extension": "MOV", "full_path": "H:\\LIQ\\LIQ_HV050\\Audiovisual\\Preservação\\LIQ_HV050.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2883650.0, "duration": 2883.65, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 3.875}, "folder_size_gb": 3.875}, "folder_size_gb": 3.875}, "LIQ_HV051": {"Textual": {"LIQ_HV051.doc": {"size_mb": 0.1279, "modified": "2013-10-18 16:30:18", "extension": "DOC", "full_path": "H:\\LIQ\\LIQ_HV051\\Textual\\LIQ_HV051.doc", "category": "Textual"}, "LIQ_HV051.docx": {"size_mb": 0.035, "modified": "2026-02-24 16:30:22", "extension": "DOCX", "full_path": "H:\\LIQ\\LIQ_HV051\\Textual\\LIQ_HV051.docx", "category": "Textual", "content_preview": "Projeto Conhecimento Liquigás – 60 anos de memória\nDepoimento de Fábia Moretto\nEntrevistada por Cláudia Leonor e Igor Trompini\nSão Paulo, 04/09/2013\t\nRealização Museu da Pessoa\nLHV051_Fábia Moretto\nTranscrito por Liliane Custódio\t\nMW Transcrições\nP/1 – Então, Fábia, boa tarde.\nR – Boa tarde.\nP/1 – Obrigada por você ter vindo até aqui ao Museu pra fazer essa entrevista. Começar perguntando de novo o seu nome completo, o local e a data de nascimento.\nR – É Fábia Cristina Paro Anderson Moretto, eu nasci em Ibitiúva, no interior de São Paulo, numa cidadezinha minúscula, em 12 de abril const EXTENSIONS = {
    "Video": ['mp4', 'mov', 'mkv', 'avi', 'm4v', 'mts', 'm2ts', 'wmv', 'flv', 'webm', 'vob', 'ogv', '3gp', 'mxf'],
    "Audio": ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'aiff', 'pcm', 'aif'],
    "Image": ['jpg', 'jpeg', 'tif', 'tiff', 'png', 'gif', 'bmp', 'webp', 'cr2', 'nef', 'arw', 'dng'],
    "Textual": ['doc', 'docx', 'pdf', 'txt', 'rtf', 'odt', 'xls', 'xlsx', 'ppt', 'pptx']
};

const ICONS = { "Video": "🎞️", "Audio": "🎧", "Image": "🖼️", "Textual": "📝", "Other": "📄" };

function formatSmartSize(mbValue) {
    if (!mbValue || mbValue === 0) return "0 B";
    let bytes = mbValue * 1024 * 1024; 
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(2) + " " + units[i];
}

function getIcon(name, isFolder) {
    if (isFolder) return "📁";
    const ext = name.split('.').pop().toLowerCase();
    for (const [category, list] of Object.entries(EXTENSIONS)) {
        if (list.includes(ext)) return ICONS[category];
    }
    return ICONS["Other"];
}

function formatTime(ms) {
    if (!ms || ms === 0) return "N/A";
    let totalSeconds = Math.floor(ms / 1000);
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;
    return [hours, minutes, seconds].map(v => v < 10 ? "0" + v : v).join(":");
}

function tryLoadImage(imgElement, thumbnailPath, originalName) {
    if (!thumbnailPath && !originalName) return;
    let path = thumbnailPath || `thumbnails/thumb_${originalName.split('.').slice(0, -1).join('.')}.jpg`;
    imgElement.onerror = function() {
        this.onerror = null;
        this.src = 'https://via.placeholder.com/150?text=Sem+Preview';
    };
    imgElement.src = path;
}

function copyPreviewText() {
    const box = document.getElementById('preview-text');
    if (box) {
        navigator.clipboard.writeText(box.textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy Content"; }, 2000);
    }
}

function calculateFolderStats(node) {
    let stats = { Video: { count: 0, size: 0 }, Audio: { count: 0, size: 0 }, Image: { count: 0, size: 0 }, Textual: { count: 0, size: 0 }, Other: { count: 0, size: 0 }, totalSize: 0 };
    function traverse(curr) {
        for (let key in curr) {
            if (key === "folder_size_gb") continue;
            let item = curr[key];
            if (item.folder_size_gb !== undefined) traverse(item);
            else {
                let cat = item.category || "Other";
                if (!stats[cat]) cat = "Other";
                stats[cat].count++;
                stats[cat].size += item.size_mb || 0;
                stats.totalSize += item.size_mb || 0;
            }
        }
    }
    traverse(node);
    return stats;
}

function showMetadata(name, data, path) {
    const panel = document.getElementById("metadata-panel");
    const content = document.getElementById("meta-content");
    panel.style.display = "block";

    const isFolder = data.folder_size_gb !== undefined;
    let html = `
        <span class="meta-label">Nome</span><span class="meta-value">${name}</span>
        <span class="meta-label">Caminho</span><span class="meta-value">${data.full_path || path.join("/")}</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(data.full_path || "").replace(/\\/g, "\\\\")}')">Copy Path</button>
        <span class="meta-label">Tamanho</span><span class="meta-value" style="color:var(--accent); font-weight:bold;">${formatSmartSize(isFolder ? data.folder_size_gb * 1024 : data.size_mb)}</span>
    `;

    if (isFolder) {
        const stats = calculateFolderStats(data);
        const getPct = (size) => stats.totalSize > 0 ? ((size / stats.totalSize) * 100).toFixed(1) : 0;
        html += `
            <div class="stats-container">
                <span class="meta-label">Conteúdo</span>
                <div class="stats-bar">
                    <div class="bar-segment" style="width:${getPct(stats.Video.size)}%; background:var(--video)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Audio.size)}%; background:var(--audio)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Image.size)}%; background:var(--image)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Textual.size + stats.Other.size)}%; background:var(--other)"></div>
                </div>
                <div class="stat-row"><span>🎞️ Video</span><b>${stats.Video.count}</b></div>
                <div class="stat-row"><span>🎧 Audio</span><b>${stats.Audio.count}</b></div>
                <div class="stat-row"><span>🖼️ Images</span><b>${stats.Image.count}</b></div>
                <div class="stat-row"><span>📄 Docs / Other</span><b>${stats.Textual.count + stats.Other.count}</b></div>
            </div>`;
    } else {
        if (data.category === "Image" || data.thumbnail) {
            html += `<h3>Preview</h3>
                     <div class="img-preview-container">
                        <img id="preview-img" src="" alt="Carregando...">
                     </div>`;
            setTimeout(() => {
                const img = document.getElementById('preview-img');
                tryLoadImage(img, data.thumbnail, name);
            }, 50);
        }

        html += `<span class="meta-label">Modificado</span><span class="meta-value">${data.modified || "N/A"}</span>`;
        
        if (data.category === "Video") {
            // Garante que displayRes exista ou usa a dimensão original
            const displayRes = data.dimension || "N/A"; 
            
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Resolução</span><span class="meta-value">${displayRes}</span>
                <span class="meta-label">Duração / Áudio</span><span class="meta-value">${formatTime(data.duration_ms)} / ${data.audio_channels || "N/A"}</span>
                <span class="meta-label">Aspecto / FPS</span><span class="meta-value">${data.aspect_ratio || "N/A"} / ${data.frame_rate || "N/A"}</span>`;
        } else if (data.category === "Audio") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Duração</span><span class="meta-value">${formatTime(data.duration_ms)}</span>
                <span class="meta-label">Canais</span><span class="meta-value">${data.audio_channels || "N/A"}</span>`;
        } else if (data.category === "Image") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Dimensões</span><span class="meta-value">${data.dimension || "N/A"}</span>
                <span class="meta-label">DPI</span><span class="meta-value">${data.dpi || "N/A"}</span>`;
        }

        // NOVIDADE: Verifica explicitamente por content_preview ou categoria textual
        if (data.content_preview) {
            html += `<h3>Conteúdo do Documento</h3>
                     <div class="preview-box" id="preview-text">Loading content...</div>
                     <button class="copy-btn" onclick="copyPreviewText()">Copiar Conteúdo</button>`;
        }
    }
    
    content.innerHTML = html;

    // Sincronização garantida: espera o DOM atualizar para injetar o texto
    if (data.content_preview) {
        setTimeout(() => {
            const box = document.getElementById('preview-text');
            if (box) box.textContent = data.content_preview;
        }, 10);
    }
}

function renderColumn(node, level, path = []) {
    const explorer = document.getElementById("explorer");
    while (explorer.children.length > level) explorer.removeChild(explorer.lastChild);
    const col = document.createElement("div"); col.className = "column";
    const keys = Object.keys(node).filter(k => k !== "folder_size_gb").sort((a, b) => {
        const aIsF = node[a].folder_size_gb !== undefined;
        const bIsF = node[b].folder_size_gb !== undefined;
        return (aIsF !== bIsF) ? bIsF - aIsF : a.localeCompare(b);
    });
    keys.forEach(name => {
        const val = node[name];
        const isFolder = val.folder_size_gb !== undefined;
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `<span class="icon">${getIcon(name, isFolder)}</span> <span class="item-text">${name}</span>`;
        item.onclick = () => {
            Array.from(col.children).forEach(c => c.classList.remove('active'));
            item.classList.add('active');
            showMetadata(name, val, path.concat(name));
            if (isFolder) renderColumn(val, level + 1, path.concat(name));
            else while (explorer.children.length > level + 1) explorer.removeChild(explorer.lastChild);
        };
        col.appendChild(item);
    });
    explorer.appendChild(col);
}

function performSearch() {
    const term = document.getElementById("search").value.toLowerCase();
    const explorer = document.getElementById("explorer");
    if (!term) { renderColumn(TREE, 0); return; }
    const results = [];
    function searchNode(node, currentPath) {
        for (const key in node) {
            if (key === "folder_size_gb") continue;
            const item = node[key];
            const isFolder = item.folder_size_gb !== undefined;
            const match = key.toLowerCase().includes(term) || (item.content_preview && item.content_preview.toLowerCase().includes(term));
            if (match) results.push({ name: key, data: item, path: currentPath.concat(key), isFolder });
            if (isFolder) searchNode(item, currentPath.concat(key));
        }
    }
    searchNode(TREE, ["Root"]);
    explorer.innerHTML = "";
    const col = document.createElement("div"); col.className = "column"; col.style.minWidth = "100%";
    results.slice(0, 100).forEach(res => {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<span class="icon">${getIcon(res.name, res.isFolder)}</span> <div><b>${res.name}</b><br><small>${res.path.join("/")}</small></div>`;
        div.onclick = () => showMetadata(res.name, res.data, res.path);
        col.appendChild(div);
    });
    explorer.appendChild(col);
}

document.addEventListener("DOMContentLoaded", () => renderColumn(TREE, 0));
</script>
