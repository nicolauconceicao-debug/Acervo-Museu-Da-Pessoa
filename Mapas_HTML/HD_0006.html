ocx": {"size_mb": 0.026, "modified": "2026-02-10 16:18:08", "extension": "DOCX", "full_path": "D:\\Grupo de Estudos de Recursos Humanos (GERH)\\GERH_HV001_João Augusto Reverendo de Miranda\\Textual\\GERH_001_João Augusto Reverendo de Miranda.docx", "category": "Textual", "content_preview": "Projeto: GERH\nDepoimento: João Augusto R. de Miranda\nEntrevistado por: Márcia Ruiz e Stela Tredice\nLocal: 30/09/2005\nRealização: Museu da Pessoa.Net\nEntrevista: GERH 001\nTranscrito por: Maria da Conceição Amaral da Silva\nP1 – Bom dia João Augusto. \nR – Oi, bom dia Márcia, bom dia, Estela. \nP2 – Bom dia. \nP1 – Eu gostaria que você desse o seu nome completo, local e data de nascimento. \nR – Eu me chamo João Augusto Reverendo de Miranda. Eu imagino sempre que alguém na família queria um padre na família, que era muito comum em Portugal, onde eu nasci. Então botaram Reverendo aí no meio. Esse Reverendo, no tempo do primário era um negócio complicado, porque os meus colegas me gozavam demais por causa desse Reverendo. No fim eu acabei aprendendo e tirava vantagem disso. Eu nasci em 14 de outubro de 1943. Eu nasci em lugar muito bonito chamado São Jacinto. É uma pequena ilhazinha, mas muito pequena mesmo. Na verdade acabou se transformando numa base militar portuguesa perto de uma cidade grande chamada Aveiro. Eu sou português, eu vim para o Brasil com onze anos. Vim para o Brasil em 1955. Meu pai veio uns quatro anos antes. Minha  família estava muito bem em Portugal, mas, tinha um prim"}, "folder_size_gb": 0.0}, "folder_size_gb": 18.896}, "GERH_HV002_João Marcos dos Santos Varella": {"Audiovisual": {"Preservação": {"Localização do Bruto.txt": {"size_mb": 0.0001, "modified": "2025-04-07 11:41:10", "extension": "TXT", "full_path": "D:\\Grupo de Estudos de Recursos Humanos (GERH)\\GERH_HV002_João Marcos dos Santos Varella\\Audiovisual\\Preservação\\Localização do Bruto.txt", "category": "Textual", "content_preview": "Mídia original: DVC_0913\n\nLocalização: Pasta \"GERH_HV001_João Augusto Reverendo de Miranda\""}, "folder_size_gb": 0.0}, "Acesso": {"GERH_HV002_João Marcos dos Santos Varella.mp4": {"size_mb": 3650.3314, "modified": "2025-03-11 14:22:44", "extension": "MP4", "full_path": "D:\\Grupo de Estudos de Recursos Humanos (GERH)\\GERH_HV002_João Marcos dos Santos Varella\\Audiovisual\\Acesso\\GERH_HV002_João Marcos dos Santos Varella.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "30.000 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 2887167.0, "duration": 2887.17, "resolution": "1280x720", "fps": 30.0}, "folder_size_gb": 3.565}, "folder_size_gb": 3.565}, "Textual": {"GERH_002_João Marcos dos Santos Varela.doc": {"size_mb": 0.0728, "modified": "2005-11-28 12:46:18", "extension": "DOC", "full_path": "D:\\Grupo de Estudos de Recursos Humanos (GERH)\\GERH_HV002_João Marcos dos Santos Varella\\Textual\\GERH_002_João Marcos dos Santos Varela.doc", "category": "Textual"}, "GERH_002_João Marcos dos Santos Varela.docx": {"size_mb": 0.0157, "modified": "2026-02-10 16:18:10", "extension": "DOCX", "full_path": "D:\\Grupo de Estudos de Recursos Humanos (GERH)\\GERH_HV002_João Marcos dos Santos Varella\\Textual\\GERH_002_João Marcos dos Santos Varela.docx", "category": "Textual", "content_preview": "Memória do Grupo de Estudos GERH.\nDepoimento de João Marcos dos Santos Varela.\nEntrevistada por Stella Tredice e Vanessa Higa.\nItu, 30/9/2005.\nRealização Instituto Museu da Pessoa.\nCódigo da entrevista: GERH 002\nTranscrito por Luisa Fioravanti.\nP1 – João Marcos, eu queria que você começasse dizendo seu nome completo, local e data de nascimento.\nR – Eu nasci em São Paulo, meu nome completo é João Marcos dos Santos Varela, eu nasci no dia 29 de dezembro de 1942. Eu cresci em São Paulo, estudei em colégio estadual, depois estudei no Mackenzie, depois eu queria fazer Arquitetura, aí eu desisti e entrei Engenharia. Cursei um ano de Engenharia Mauá, desisti da Engenharia, não era o que eu queria, prestei vestibular para Psicologia, nesse período de faculdade eu tive uma participação política no meio universitário, isso antes de 1964, e que faz parte da minha formação humanística e que acaba se estendendo por todo o resto da minha vida pessoal e profissional.\nP1 – Bom, vamos voltar um pouquinho ainda no comecinho porque eu queria saber o nome dos seus pais, pai e mãe.\nR – Meu pai, Armando e minha mãe, Helena. Os dois nasceram em São Paulo, mas eu sou neto de português e espanhol. É que me"}, "folder_size_gb": 0.0}, "folder_size_gb": 3.565}, "GERH_HV003_Clóvis da Silva Bojikian": {"Audiovisual": {"Preservação": {"DVC_0914.mp4": {"size_mb": 9892.7742, "modified": "2025-04-03 12:18:44", "extension": "MP4", "full_path": "D:\\Grupo de Estudos de Recursos Humanos (GERH)\\GERH_HV003_Clóvis da Silva Bojikian\\Audiovisual\\Preservação\\DVC_0914.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "30.000 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7809033.0, "duration": 7809.03, "resolution": "1280x720", "fps": 30.0}, "Localização do Bruto.txt": {"size_mb": 0.0001, "modified": "2025-04-07 11:42:00", "extension": "TXT", "full_path": "D:\\Grupo de Estudos de Recursos Humanos (GERH)\\GERH_HV003_Clóvis da Silva Bojikian\\Audiovisual\\Preservação\\Localização do Bruto.txt", "category": "Textual", "content_preview": "PARTE 1\n\nMídia original: DVC_0913\n\nLocalização: Pasta \"GERH_HV001_João Augusto Reverendo de Miranda\""}, "folder_size_gb": 9.661}, "Acesso": {"GERH_HV003_Clóvis da Silva Bojikian.mp4": {"size_mb": 5787.6156, "modified": "2025-03-11 15:07:52", "extension": "MP4", "full_path": "D:\\Grupo de Estudos de Recursos Humanos (GERH)\\GERH_HV003_Clóvis da Silva Bojikian\\Audiovisual\\Acesso\\GERH_HV003_Clóvis da Silva Bojikian.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (  virou um comerciante, mas um comerciante pequeno. A vida toda"}, "folder_size_gb": 0.0}, "folder_size_gb": 15.313}, "GERH_HV005_Arnaldo Nunes Giannini": {"Audiovisual": {"Preservação": {"Localização do Bruto.txt": {"size_mb": 0.0001, "modified": "2025-04-07 11:42:52", "extension": "TXT", "full_path": "D:\\Grupo de Estudos de Recursos Humanos (GERH)\\GERH_HV005_Arnaldo Nunes Giannini\\Audiovisual\\Preservação\\Localização do Bruto.txt", "category": "Textual", "content_preview": "Mídia original: DVC_0914\n\nLocalização: Pasta \"GERH_HV003_Clóvis da Silva Bojikian\""}, "folder_size_gb": 0.0}, "Acesso": {"GERH_HV005_Arnaldo Nunes Giannini.mp4": {"size_mb": 3690.1591, "modified": "2025-03-11 15:36:44", "extension": "MP4", "full_path": "D:\\Grupo de Estudos de Recursos Humanos (GERH)\\GERH_HV005_Arnaldo Nunes Giannini\\Audiovisual\\Acesso\\GERH_HV005_Arnaldo Nunes Giannini.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "30.000 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 2917833.0, "duration": 2917.83, "resolution": "1280x720", "fps": 30.0}, "folder_size_gb": 3.604}, "folder_size_gb": 3.604}, "Textual": {"GERH_005_Arnaldo Nunes Giannini.doc": {"size_mb": 0.0864, "modified": "2005-11-28 12:21:02", "extension": "DOC", "full_path": "D:\\Grupo de Estudos de Recursos Humanos (GERH)\\GERH_HV005_Arnaldo Nunes Giannini\\Textual\\GERH_005_Arnaldo Nunes Giannini.doc", "category": "Textual"}, "GERH_005_Arnaldo Nunes Giannini.docx": {"size_mb": 0.0188, "modified": "2026-02-10 16:18:14", "extension": "DOCX", "full_path": "D:\\Grupo de Estudos de Recursos Humanos (GERH)\\GERH_HV005_Arnaldo Nunes Giannini\\Textual\\GERH_005_Arnaldo Nunes Giannini.docx", "category": "Textual", "content_preview": "Projeto Memória do GERH\nDepoimento de Arnaldo Nunes Giannini\nEntrevistado por Stela Tredice e Vanessa Higa\nItu, 30 de setembro de 2005\nRealização Museu da Pessoa\nCódigo do depoimento: GERH 005\nTranscrito por: Susy Ramos\nP2 – Oi, Arnaldo!\nR – Oi, Vanessa!\nP2 – Vou pedir para você repetir o seu nome de novo e o seu local e data de nascimento.\nR – Meu nome é Arnaldo Nunes Giannini. Eu nasci em Santo André, em 26 de dezembro de 1945. \nP2 – O nome dos seus pais?\nR – Meu pai, Santi Gino Giannini, minha mãe, Albertina Nunes Giannini.\nP2 – Seus avós?\nR – Meus avós paternos, avós paternos: Olímpio Giannini e Zelinda Giannini; maternos: João Nunes e Isolina Nunes.\nP2 – Você pode falar um pouco da origem do seu sobrenome, da sua família?\nR – Claro, com muito prazer, nossa, com muito prazer! Meu pai é natural de uma cidadezinha chamada Foiano della Chiana, que fica na região da Toscana, na Itália. É uma cidade medieval, data de 1470 e alguma coisa – não me lembro exatamente – eu vi a placa lá no muro da cidadela, mas não me lembro mais. Estive lá agora há pouco tempo, pela terceira vez já, é um doce de lugar, uma gracinha. E a primeira vez que eu estive lá, faz aproximadamente uns 20 anos, eu,"}, "folder_size_gb": 0.0}, "folder_size_gb": 3.604}, "GERH_HV006_Ênio José Resende": {"Audiovisual": {"Preservação": {"Localização do Bruto.txt": {"size_mb": 0.0001, "modified": "2025-04-07 11:42:52", "extension": "TXT", "full_path": "D:\\Grupo de Estudos de Recursos Humanos (GERH)\\GERH_HV006_Ênio José Resende\\Audiovisual\\Preservação\\Localização do Bruto.txt", "category": "Textual", "content_preview": "Mídia original: DVC_0914\n\nLocalização: Pasta \"GERH_HV003_Clóvis da Silva Bojikian\""}, "folder_size_gb": 0.0}, "Acesso": {"GERH_HV006_Ênio José Resende.mp4": {"size_mb": 1648.5089, "modified": "2025-03-11 15:48:46", "extension": "MP4", "full_path": "D:\\Grupo de Estudos de Recursos Humanos (GERH)\\GERH_HV006_Ênio José Resende\\Audiovisual\\Acesso\\GERH_HV006_Ênio José Resende.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "30.000 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec" arci Garçon": {"Audiovisual": {"Preservação": {"Localização do Bruto.txt": {"size_mb": 0.0001, "modified": "2025-04-07 11:42:52", "extension": "TXT", "full_path": "D:\\Grupo de Estudos de Recursos Humanos (GERH)\\GERH_HV007_Darci Garçon\\Audiovisual\\Preservação\\Localização do Bruto.txt", "category": "Textual", "content_preview": "Mídia original: DVC_0914\n\nLocalização: Pasta \"GERH_HV003_Clóvis da Silva Bojikian\""}, "folder_size_gb": 0.0}, "Acesso": {"GERH_HV007_Darci Garçon.mp4": {"size_mb": 3569.7859, "modified": "2025-03-11 16:18:52", "extension": "MP4", "full_path": "D:\\Grupo de Estudos de Recursos Humanos (GERH)\\GERH_HV007_Darci Garçon\\Audiovisual\\Acesso\\GERH_HV007_Darci Garçon.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "30.000 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 2817967.0, "duration": 2817.97, "resolution": "1280x720", "fps": 30.0}, "folder_size_gb": 3.486}, "folder_size_gb": 3.486}, "Textual": {"GERH_007_Darci Garçon.doc": {"size_mb": 0.0938, "modified": "2005-11-28 12:39:20", "extension": "DOC", "full_path": "D:\\Grupo de Estudos de Recursos Humanos (GERH)\\GERH_HV007_Darci Garçon\\Textual\\GERH_007_Darci Garçon.doc", "category": "Textual"}, "GERH_007_Darci Garçon.docx": {"size_mb": 0.0172, "modified": "2026-02-10 16:18:20", "extension": "DOCX", "full_path": "D:\\Grupo de Estudos de Recursos Humanos (GERH)\\GERH_HV007_Darci Garçon\\Textual\\GERH_007_Darci Garçon.docx", "category": "Textual", "content_preview": "Memória do GERH.\nDepoimento de Darci Garçon.\nEntrevistado por Márcia Ruiz e Stela Tredice .\nItú, 30/9/2005.\nRealização Instituto Museu da Pessoa.\nCódigo da entrevista: GERH 007\nTranscrito por Luisa Fioravanti.\nP/1 – Boa tarde, Darci!\nR – Boa tarde!\nP2 – Eu queria que você desse seu nome completo, data e local de nascimento.\nR – Meu nome é Darci Garçon. Eu nasci numa pequena cidade no interior de São Paulo que se chama Poloni. Isto fica próximo a São José do Rio Preto e eu nasci no dia 24 de julho de 1938. Devo acrescentar que eu sou a única pessoa importante que nasceu nesta cidade.\nP1 – Qual o nome do seu pai e de sua mãe?\nR – Meu pai se chamava Luiz Garçon Martins e minha mãe Madalena Carrasco Guerrero Rodrigues.\nP1 – Você sabe a origem do nome da sua família?\nR – De que?\nP1 – Da origem do nome da sua família. Você sabe?\nR – A informação que eu tenho eu acho que, eu já estive na Espanha várias vezes procurando documentos, inclusive para pegar passaportes e não consegui. Originariamente o Garçon que vocês estão vendo aí era com z e aqui no Brasil ele se transformou em ç, mas a origem efetivamente eu não sei, só sei que é um nome espanhol.\nP1 – E seus pais imigraram para o Brasil q"}, "folder_size_gb": 0.0}, "folder_size_gb": 3.486}, "folder_size_gb": 46.474}};

const EXTENSIONS = {
    "Video": ['mp4', 'mov', 'mkv', 'avi', 'm4v', 'mts', 'm2ts', 'wmv', 'flv', 'webm', 'vob', 'ogv', '3gp', 'mxf'],
    "Audio": ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'aiff', 'pcm', 'aif'],
    "Image": ['jpg', 'jpeg', 'tif', 'tiff', 'png', 'gif', 'bmp', 'webp', 'cr2', 'nef', 'arw', 'dng'],
    "Textual": ['doc', 'docx', 'pdf', 'txt', 'rtf', 'odt', 'xls', 'xlsx', 'ppt', 'pptx']
};

const ICONS = { "Video": "🎞️", "Audio": "🎧", "Image": "🖼️", "Textual": "📝", "Other": "📄" };

function formatSmartSize(mbValue) {
    if (!mbValue || mbValue === 0) return "0 B";
    let bytes = mbValue * 1024 * 1024; 
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(2) + " " + units[i];
}

function getIcon(name, isFolder) {
    if (isFolder) return "📁";
    const ext = name.split('.').pop().toLowerCase();
    for (const [category, list] of Object.entries(EXTENSIONS)) {
        if (list.includes(ext)) return ICONS[category];
    }
    return ICONS["Other"];
}

function formatTime(ms) {
    if (!ms || ms === 0) return "N/A";
    let totalSeconds = Math.floor(ms / 1000);
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;
    return [hours, minutes, seconds].map(v => v < 10 ? "0" + v : v).join(":");
}

function tryLoadImage(imgElement, thumbnailPath, originalName) {
    if (!thumbnailPath && !originalName) return;
    let path = thumbnailPath || `thumbnails/thumb_${originalName.split('.').slice(0, -1).join('.')}.jpg`;
    imgElement.onerror = function() {
        this.onerror = null;
        this.src = 'https://via.placeholder.com/150?text=Sem+Preview';
    };
    imgElement.src = path;
}

function copyPreviewText() {
    const box = document.getElementById('preview-text');
    if (box) {
        navigator.clipboard.writeText(box.textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy Content"; }, 2000);
    }
}

function calculateFolderStats(node) {
    let stats = { Video: { count: 0, size: 0 }, Audio: { count: 0, size: 0 }, Image: { count: 0, size: 0 }, Textual: { count: 0, size: 0 }, Other: { count: 0, size: 0 }, totalSize: 0 };
    function traverse(curr) {
        for (let key in curr) {
            if (key === "folder_size_gb") continue;
            let item = curr[key];
            if (item.folder_size_gb !== undefined) traverse(item);
            else {
                let cat = item.category || "Other";
                if (!stats[cat]) cat = "Other";
                stats[cat].count++;
                stats[cat].size += item.size_mb || 0;
                stats.totalSize += item.size_mb || 0;
            }
        }
    }
    traverse(node);
    return stats;
}

function showMetadata(name, data, path) {
    const panel = document.getElementById("metadata-panel");
    const content = document.getElementById("meta-content");
    panel.style.display = "block";

    const isFolder = data.folder_size_gb !== undefined;
    let html = `
        <span class="meta-label">Nome</span><span class="meta-value">${name}</span>
        <span class="meta-label">Caminho</span><span class="meta-value">${data.full_path || path.join("/")}</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(data.full_path || "").replace(/\\/g, "\\\\")}')">Copy Path</button>
        <span class="meta-label">Tamanho</span><span class="meta-value" style="color:var(--accent); font-weight:bold;">${formatSmartSize(isFolder ? data.folder_size_gb * 1024 : data.size_mb)}</span>
    `;

    if (isFolder) {
        const stats = calculateFolderStats(data);
        const getPct = (size) => stats.totalSize > 0 ? ((size / stats.totalSize) * 100).toFixed(1) : 0;
        html += `
            <div class="stats-container">
                <span class="meta-label">Conteúdo</span>
                <div class="stats-bar">
                    <div class="bar-segment" style="width:${getPct(stats.Video.size)}%; background:var(--video)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Audio.size)}%; background:var(--audio)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Image.size)}%; background:var(--image)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Textual.size + stats.Other.size)}%; background:var(--other)"></div>
                </div>
                <div class="stat-row"><span>🎞️ Video</span><b>${stats.Video.count}</b></div>
                <div class="stat-row"><span>🎧 Audio</span><b>${stats.Audio.count}</b></div>
                <div class="stat-row"><span>🖼️ Images</span><b>${stats.Image.count}</b></div>
                <div class="stat-row"><span>📄 Docs / Other</span><b>${stats.Textual.count + stats.Other.count}</b></div>
            </div>`;
    } else {
        if (data.category === "Image" || data.thumbnail) {
            html += `<h3>Preview</h3>
                     <div class="img-preview-container">
                        <img id="preview-img" src="" alt="Carregando...">
                     </div>`;
            setTimeout(() => {
                const img = document.getElementById('preview-img');
                tryLoadImage(img, data.thumbnail, name);
            }, 50);
        }

        html += `<span class="meta-label">Modificado</span><span class="meta-value">${data.modified || "N/A"}</span>`;
        
        if (data.category === "Video") {
            // Garante que displayRes exista ou usa a dimensão original
            const displayRes = data.dimension || "N/A"; 
            
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Resolução</span><span class="meta-value">${displayRes}</span>
                <span class="meta-label">Duração / Áudio</span><span class="meta-value">${formatTime(data.duration_ms)} / ${data.audio_channels || "N/A"}</span>
                <span class="meta-label">Aspecto / FPS</span><span class="meta-value">${data.aspect_ratio || "N/A"} / ${data.frame_rate || "N/A"}</span>`;
        } else if (data.category === "Audio") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Duração</span><span class="meta-value">${formatTime(data.duration_ms)}</span>
                <span class="meta-label">Canais</span><span class="meta-value">${data.audio_channels || "N/A"}</span>`;
        } else if (data.category === "Image") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Dimensões</span><span class="meta-value">${data.dimension || "N/A"}</span>
                <span class="meta-label">DPI</span><span class="meta-value">${data.dpi || "N/A"}</span>`;
        }

        // NOVIDADE: Verifica explicitamente por content_preview ou categoria textual
        if (data.content_preview) {
            html += `<h3>Conteúdo do Documento</h3>
                     <div class="preview-box" id="preview-text">Loading content...</div>
                     <button class="copy-btn" onclick="copyPreviewText()">Copiar Conteúdo</button>`;
        }
    }
    
    content.innerHTML = html;

    // Sincronização garantida: espera o DOM atualizar para injetar o texto
    if (data.content_preview) {
        setTimeout(() => {
            const box = document.getElementById('preview-text');
            if (box) box.textContent = data.content_preview;
        }, 10);
    }
}

function renderColumn(node, level, path = []) {
    const explorer = document.getElementById("explorer");
    while (explorer.children.length > level) explorer.removeChild(explorer.lastChild);
    const col = document.createElement("div"); col.className = "column";
    const keys = Object.keys(node).filter(k => k !== "folder_size_gb").sort((a, b) => {
        const aIsF = node[a].folder_size_gb !== undefined;
        const bIsF = node[b].folder_size_gb !== undefined;
        return (aIsF !== bIsF) ? bIsF - aIsF : a.localeCompare(b);
    });
    keys.forEach(name => {
        const val = node[name];
        const isFolder = val.folder_size_gb !== undefined;
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `<span class="icon">${getIcon(name, isFolder)}</span> <span class="item-text">${name}</span>`;
        item.onclick = () => {
            Array.from(col.children).forEach(c => c.classList.remove('active'));
            item.classList.add('active');
            showMetadata(name, val, path.concat(name));
            if (isFolder) renderColumn(val, level + 1, path.concat(name));
            else while (explorer.children.length > level + 1) explorer.removeChild(explorer.lastChild);
        };
        col.appendChild(item);
    });
    explorer.appendChild(col);
}

function performSearch() {
    const term = document.getElementById("search").value.toLowerCase();
    const explorer = document.getElementById("explorer");
    if (!term) { renderColumn(TREE, 0); return; }
    const results = [];
    function searchNode(node, currentPath) {
        for (const key in node) {
            if (key === "folder_size_gb") continue;
            const item = node[key];
            const isFolder = item.folder_size_gb !== undefined;
            const match = key.toLowerCase().includes(term) || (item.content_preview && item.content_preview.toLowerCase().includes(term));
            if (match) results.push({ name: key, data: item, path: currentPath.concat(key), isFolder });
            if (isFolder) searchNode(item, currentPath.concat(key));
        }
    }
    searchNode(TREE, ["Root"]);
    explorer.innerHTML = "";
    const col = document.createElement("div"); col.className = "column"; col.style.minWidth = "100%";
    results.slice(0, 100).forEach(res => {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<span class="icon">${getIcon(res.name, res.isFolder)}</span> <div><b>${res.name}</b><br><small>${res.path.join("/")}</small></div>`;
        div.onclick = () => showMetadata(res.name, res.data, res.path);
        col.appendChild(div);
    });
    explorer.appendChild(col);
}

document.addEventListener("DOMContentLoaded", () => renderColumn(TREE, 0));
</script>
</body>
</html>
