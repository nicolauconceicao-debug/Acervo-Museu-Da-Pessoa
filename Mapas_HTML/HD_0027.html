D)\\ATD\\HV\\ATD_HV005_Neide Cavallari Zuppo\\IMAGENS\\Baixa\\ATD_HV005_FT015.jpg", "category": "Image", "duration_ms": 0, "dimension": "2013x2277", "height": 2277, "dpi": 96.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2013x2277"}, "ATD_HV005_FT016.jpg": {"size_mb": 3.1439, "modified": "2018-08-14 13:15:02", "extension": "JPG", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV005_Neide Cavallari Zuppo\\IMAGENS\\Baixa\\ATD_HV005_FT016.jpg", "category": "Image", "duration_ms": 0, "dimension": "2937x2348", "height": 2348, "dpi": 96.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2937x2348"}, "ATD_HV005_FT017.jpg": {"size_mb": 2.4791, "modified": "2018-08-14 13:15:04", "extension": "JPG", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV005_Neide Cavallari Zuppo\\IMAGENS\\Baixa\\ATD_HV005_FT017.jpg", "category": "Image", "duration_ms": 0, "dimension": "2296x2768", "height": 2768, "dpi": 96.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2296x2768"}, "folder_size_gb": 0.015}, "folder_size_gb": 0.13}, "TEXTUAL": {"ATD_HV005_Neide-Cavallari-Zuppo_REV.docx": {"size_mb": 0.044, "modified": "2018-08-21 10:17:48", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV005_Neide Cavallari Zuppo\\TEXTUAL\\ATD_HV005_Neide-Cavallari-Zuppo_REV.docx", "category": "Textual", "content_preview": "Abifarma 50 anos\nDepoimento de Neide Cavallari Zuppo\nEntrevistado por Karen Worcman e Ricardo Guanabara \n27/05/1997\nRealização: Museu da Pessoa\nEntrevista nº ATD_HV005\nRevisado por Luiza Gallo Favareto \nP/1- Vamos começar a entrevista, queria que você dissesse seu nome completo, local e data do seu nascimento e aí depois já o nome do seu pai e da sua mãe.\nR- O meu nome é Neide Cavallari Zuppo, eu nasci em 27 de novembro de 1929. Meu pai chamava Affonso Cavallari e minha mãe Ida Dal Cendio Cavallari, tudo italiano.\nP/1- Tudo italiano?\nR- Tudo.\nP/1- O seu pai, ele nasceu na Itália?\nR- Não, meu pai foi o único que nasceu no Brasil, minha mãe também nasceu, mas minha avó materna teve outros filhos brasileiros. Minha avó paterna só teve meu pai brasileiro, os outros filhos eram italianos, quer dizer ela teve vários filhos, mas morreram tudo de sarampo.\nP/1- Ah é?\nR- É.\nP/1- Essa sua avó...?\nR- Paterna.\nP/1- A senhora conheceu?\nR- Conheci, ela chamava Catarina.\nP/1- Catarina, como era o sobrenome dela?\nR- Olha eu não sei o sobrenome, era Cavallari, eu sei da materna.\nP/1- Que era?\nR- A materna era Maria, Marieta né, que chamava em italiano, Gopi Dal Cendio, porque Dal Cendio era meu avô."}, "folder_size_gb": 0.0}, "folder_size_gb": 0.57}, "ATD_HV006_Wanda Ribeiro": {"Áudio": {"MD_0825.wav": {"size_mb": 237.2813, "modified": "2011-07-19 00:10:34", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV006_Wanda Ribeiro\\Áudio\\MD_0825.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 2820946.0, "duration": 2820.95}, "folder_size_gb": 0.232}, "TEXTUAL": {"ATD_HV006_Wanda Ribeiro_rev.doc": {"size_mb": 0.0806, "modified": "2018-08-20 06:26:58", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV006_Wanda Ribeiro\\TEXTUAL\\ATD_HV006_Wanda Ribeiro_rev.doc", "category": "Textual"}, "ATD_HV006_Wanda Ribeiro_rev.docx": {"size_mb": 0.0226, "modified": "2026-02-20 10:50:08", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV006_Wanda Ribeiro\\TEXTUAL\\ATD_HV006_Wanda Ribeiro_rev.docx", "category": "Textual", "content_preview": "Projeto Abifarma - 50 anos                              \nDepoimento de Wanda Ribeiro\nEntrevistada por Cláudia Leonor e Sarah Mendonça\nSão Paulo, 28/05/1997\nRealização: Museu da Pessoa\nEntrevista número: ATD_HV006\nTranscrito por Luciana Tosetti\nRevisado por Natália Ártico Tozo\nP/1 – Bom, eu queria começar a entrevista pedindo para você falar o nome dos seus pais e o que eles faziam.\nR – Ah, certo. É Abílio Barbosa Ribeiro, ele era contador e trabalhava no Banco do Brasil.\nP/1 – E a sua mãe?\nR – Albertina Ferreira Ribeiro, ela não trabalhava.\nP/1 – Por que ela não trabalhava?\nR – (risos) Ela teve muitos filhos, ela tinha que cuidar dos filhos, não é? Ela casou muito jovem, com dezesseis anos e teve vários filhos, treze.\nP/1 – Treze. Você é qual número?\nR – Depois de mim tem o Hugo... Tem treze, eu sou a no finzinho já.\nP/1 – (risos) E que dia você nasceu?\nR – 25 de setembro de 1929.\nP/1 – Aqui em São Paulo?\nR – Sim.\nP/1 – Você tinha falado Alto de Santana, o bairro?\nR – É.\nP/1 – Fica perto de onde?\nR – Hum... Nem sei porque, agora, depois, eu moro, ah... Meu pai comprou uma casa no Sumaré em 1940, quer dizer, eu nem sei onde era, porque só nascemos praticamente...\nP/1 – Como é que er"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.232}, "ATD_HV007_William Ermete Primo Callia": {"Áudio": {"MD_0826.wav": {"size_mb": 308.8301, "modified": "2011-07-29 14:05:44", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV007_William Ermete Primo Callia\\Áudio\\MD_0826.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3671562.0, "duration": 3671.56}, "folder_size_gb": 0.302}, "TEXTUAL": {"ATD_HV007_William Ermete Primo Callia_rev.doc": {"size_mb": 0.0884, "modified": "2018-08-23 10:12:26", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV007_William Ermete Primo Callia\\TEXTUAL\\ATD_HV007_William Ermete Primo Callia_rev.doc", "category": "Textual"}, "ATD_HV007_William Ermete Primo Callia_rev.docx": {"size_mb": 0.0292, "modified": "2026-02-20 10:50:10", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV007_William Ermete Primo Callia\\TEXTUAL\\ATD_HV007_William Ermete Primo Callia_rev.docx", "category": "Textual", "content_preview": "Projeto Abifarma 50 anos\nDepoimento de William Ermete Primo Callia\nEntrevistado por Ricardo Guanabara Leal e Cláudia Leonor \nLocal: Estúdio Eco Service\nSão Paulo, 28/05/97 \nEntrevista ATD_HV007\nTranscrito por Rosália Maria Nunes Henriques\nRevisado por Gustavo Kazuo\nP/1 - Bom, eu queria começar a entrevista nossa pedindo por senhor repetir pra mim o nome completo do senhor, o local e a data de nascimento.\nR - Meu nome é William Ermete Primo Callia. Nasci em São Paulo, na Rua Dr. Freire na Mooca. Uma rua muito especial porque só tinha imigrantes italianos. Sou nascido no dia 13 de junho de 1926. Formado pela Faculdade de Medicina da Universidade de São Paulo.\nP/1 - Qual que é o nome dos pais do senhor?\nR - Salvador Callia, um grande maestro, compositor e professor de piano. Minha mãe, Isabela Bovino Callia. Éramos quatro irmãos, sendo um deles falecido há dois anos, o primeiro deles formou na Universidade de São Paulo também na Faculdade de Medicina, o segundo formado em engenharia pela Politécnica, o terceiro formado pela Politécnica, engenheiro, eu, formado em 1951 na Universidade de São Paulo, Faculdade de Medicina.\nP/1 - Dr. William, eu queria que o senhor contasse pra gente como"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.302}, "ATD_HV008_Itamara Itagiba Neves": {"Áudio": {"MD_0827.wav": {"size_mb": 148.2032, "modified": "2011-07-19 01:18:42", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV008_Itamara Itagiba Neves\\Áudio\\MD_0827.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 1761930.0, "duration": 1761.93}, "MD_0911.mp3": {"size_mb": 55.8996, "modified": "2015-01-22 17:17:46", "extension": "MP3", "full_path": "D:\\Abifa ai para a história. O que mais você pediu?\nP/1 – O local.\nR – Em São Paulo.\nP/1 – São Paulo mesmo. O nome dos seus pais?\nR – Paulo Itagiba e Tereza de Souza Itagiba.\nP/1 – Eu queria que contasse essa história dos seus pais mais detalhada...\nR – Documentalmente o meu pai é Paulo Itagiba, mas biologicamente o meu pai é João Batista Itagiba, irmão do Paulo Itagiba. Aí já rola uma história de amor vivida pela minha mãe, que a minha mãe se casou com Paulo Itagiba, a minha mãe era amiga da irmã dele, conheceu... Ela foi à casa dele para conhecer o irmão solteiro dessa amiga, nisso entra o meu pai mesmo e ela cutuca a"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.225}, "ATD_HV009_Lupércio Oliveira do Valle": {"Áudio": {"MD_0828.wav": {"size_mb": 302.2911, "modified": "2011-07-28 17:12:00", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV009_Lupércio Oliveira do Valle\\Áudio\\MD_0828.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3593822.0, "duration": 3593.82}, "MD_0829.wav": {"size_mb": 124.9278, "modified": "2011-07-28 15:34:12", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV009_Lupércio Oliveira do Valle\\Áudio\\MD_0829.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 1485218.0, "duration": 1485.22}, "folder_size_gb": 0.417}, "IMAGENS": {"ATD_HV009.xlsx": {"size_mb": 0.0122, "modified": "2018-08-13 11:50:18", "extension": "XLSX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV009_Lupércio Oliveira do Valle\\IMAGENS\\ATD_HV009.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nATD_HV009_FT001 | Lupércio Oliveira do Valle | Competição esportiva | 1965 | São Paulo - SP | Lupércio "size_mb": 0.0339, "modified": "2018-08-16 10:37:24", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV009_Lupércio Oliveira do Valle\\TEXTUAL\\ATD_HV009_Lupércio-Oliveira-do-Valle_REV.docx", "category": "Textual", "content_preview": "Abifarma 50 anos\nDepoimento de Lupércio Oliveira do Valle\nEntrevistada por Cláudia Leonor e Ricardo Guanabara\nSão Paulo, 30/05/97 \nEntrevista n.º ATD_HV009\nTranscrito por Rosália Maria Nunes Henriques\nRevisado por Genivaldo Cavalcanti Filho\nP/1 - Dr. Lupércio, o senhor podia começar falando o seu nome completo.\nR - Lupércio Oliveira do Valle.\nP/1 - E o nome dos seus pais?\nR - Heriberto Simões do Valle e Corina Oliveira do Valle.\nP/1 - Qual é o local e data de nascimento do senhor?\nR - Eu nasci em São Paulo, capital, em 26 do quatro de 1947.\nP/1 - E o nome dos seus avós?\nR - Os meus avós paternos eram Francisco Pereira do Valle e Maria Laudelina Pereira do Valle. Os meus avós maternos, Elvina Feijó de Oliveira e José Marques de Oliveira.\nP/1 - De onde são seus pais e seus avós?\nR - O meu pai nasceu no estado de São Paulo, em São Carlos, e os pais dele são também daqui de São Paulo, do estado. A minha mãe é nascida em Fortaleza e os meus avós maternos são também do estado do Ceará.\nP/1 - O senhor tem irmãos?\nR - Eu tenho irmãos do primeiro casamento do meu pai; já têm mais idade do que eu e são nascidos em Santos.\nP/1 - O senhor conviveu com os seus irmãos, foi criado junto com eles?"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.504}, "ATD_HV010_Sara Kanter": {"Áudio": {"MD_0830.wav": {"size_mb": 305.75, "modified": "2011-07-28 16:11:28", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV010_Sara Kanter\\Áudio\\MD_0830.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3634945.0, "duration": 3634.95}, "MD_0831.wav": {"size_mb": 224.2813, "modified": "2011-07-28 16:17:56", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV010_Sara Kanter\\Áudio\\MD_0831.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 2666394.0, "duration": 2666.39}, "folder_size_gb": 0.518}, "IMAGENS": {"APD_HV010.xlsx": {"size_mb": 0.0152, "modified": "2018-08-08 07:20:42", "extension": "XLSX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV010_Sara Kanter\\IMAGENS\\APD_HV010.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nATD_HV010_FT001 | Sara Kanter | s/t | s/d | s/l | s/d | Foto não encontra/ sem ficha\nATD_HV010_FT002 | Sara Kanter | s/t | s/d | s/l | s/d | Foto não encontra/ sem ficha\nATD_HV010_FT003 | Sara Kanter | s/t | s/d | s/l | s/d | Foto não encontra/ sem ficha\nATD_HV010_FT004 | Sara Kanter | 'II Jornada de Farmácia e Bioquímica' | 1972.0 | Porto Alegre | II Jornada de Farmácia e Bioquímica, Porto Alegre, 1972 | mulher, fala, lousa, giz, explicação, palestra, saúde, bioquímica, farmácia | Sem ficha"}, "Baixa": {"ATD_HV010_FT004.jpg": {"size_mb": 1.3943, "modified": "2018-08-08 06:56:22", "extension": "JPG", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV010_Sara Kanter\\IMAGENS\\Baixa\\ATD_HV010_FT004.jpg", "category": "Image", "duration_ms": 0, "dimension": "1513x934", "height": 934, "dpi": 300.0, "color_mode": "CMYK", "duration": 0.0, "resolution": "1513x934"}, "folder_size_gb": 0.001}, "folder_size_gb": 0.001}, "TEXTUAL": {"ATD_HV010_Sara-Kanter_REV.docx": {"size_mb": 0.051, "modified": "2018-08-23 11:45:48", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV010_Sara Kanter\\TEXTUAL\\ATD_HV010_Sara-Kanter_REV.docx", "category": "Textual", "content_preview": "Abifarma 50 Anos\nDepoimento de Sara Kanter\nEntrevistada por Luís André e Sara Mendonça\nSão Paulo, 30/05/1997 \nEntrevista nº ATD_HV010\nTranscrito por Raúl Daniel Tegli\nRevisado por Genivaldo Cavalcanti Filho\nP/1 - Vamos começar com sua identificação. Seu nome completo, local e data de nascimento. \nR - Meu nome é Sara Mariany Kanter. Nasci no dia 8 de agosto de 1947. Esse é um ano fantástico porque vou fazer cinquenta anos. Acho um marco fantástico. [Nasci] em Porto Alegre, no Rio Grande do Sul. \nP/1 - Vamos começar, para ficar mais fácil, pelas origens pelo lado do pai. Que você conhece das histórias dos avós e bisavós?\nR - Meu pai era romeno, judeu da Bessarábia, como nos chamamos, e nasceu numa cidade que era um dia russa, outro dia romena. As famílias dessas regiões tinham uma característica muito interessante: dependendo da data em que nasceu seu filho e da bandeira na prefeitura, eram russos ou romenos. Minha avó paterna era da mesma localidade. Eles vieram para o Brasil com os pais deles, de meu pai, em 1916… 1918, mais ou menos. O nome dele era Israel Kanter. O nome da minha mãe, Sara, e meu avô se chamava Emmanuel. Minha mãe, Lair, era filha de imigrantes italianos, de mãe b"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.519}, "ATD_HV011_Fernando Fiúza de Mello": {"Áudio": {"MD_0832.wav": {"size_mb": 308.3682, "modified": "2011-07-29 12:31:48", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV011_Fernando Fiúza de Mello\\Áudio\\MD_0832.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3666071.0, "duration": 3666.07}, "MD_0833.wav": {"size_mb": 290.709, "modified": "2011-07-27 00:38:22", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV011_Fernando Fiúza de Mello\\Áudio\\MD_0833.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec" ": 0.0828, "modified": "2018-08-21 11:38:08", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV011_Fernando Fiúza de Mello\\TEXTUAL\\ATD_HV011_Fernando Fiuza de Mello_rev.docx", "category": "Textual", "content_preview": "Projeto Abifarma 50 Anos\nDepoimento de Fernando Augusto Fiuza de Mello\nEntrevistado por Luis André e Ricardo Guanabara\nGravado no Estudio Elo Service\nSão Paulo, 30 de maio de 1997\nRealização Museu da Pessoa\nEntrevista nº ATD_HV011 \nTranscrito por Priscila Di Mase e Patricia de Oliveira Gutierrez Bispo\nRevisado por Fernanda Regina \nP/1: Bom, então vamos começar com a sua identificação, seu nome completo, data e local onde você nasceu.\nR: Fernando Augusto Fiuza de Mello, eu nasci no dia 24 de abril de 1945, em Belém do Pará.\nP/1: Fernando, voltando então às suas origens, pegando pelo lado de pai. O que você conhece da ascendência dos pais...\nR: O meu pai era filho de um português que veio para o Brasil. Meu pai era guarda-livros, depois foi funcionário público. E, foi um português que veio para o Brasil e adentrou-se pelo Rio Amazonas acima, fez uma fazenda de borracha na Bolívia. Era um dos fazendeiros de borracha, e quando houve então o problema com a Bolívia, que o Rio Branco interferiu, ele fazia parte dos que brigaram pra que aquilo se tornasse Brasil. O Acre na verdade é uma parte da Bolívia, que foi comprada num acordo com o Rio Branco. Eu me lembro de um livro que tinha fotog"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.67}, "ATD_HV012_Roberto Boturão": {"Áudio": {"MD_0834.wav": {"size_mb": 313.625, "modified": "2011-07-29 13:32:02", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV012_Roberto Boturão\\Áudio\\MD_0834.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3728567.0, "duration": 3728.57}, "MD_0835.wav": {"size_mb": 135.086, "modified": "2011-07 ATD_HV012_Roberto Boturão\nRealização: Museu da Pessoa\nRevisado por Jader Chahine\nP/1 – Vamos começar a entrevista. Vou pedir para o senhor repetir o seu nome completo, local e data de nascimento.\nR – O nome completo é Roberto Boturão. A data de nascimento é dez de dezembro de 1928, nascido em Santos, no estado de São Paulo.\nP/1 – E o nome dos pais do Senhor?\nR – Eduardo Boturão e Maria Aparecida Tormin Boturão.\nP/1 – Roberto, eu queria que o contasse para nós a história de como o seu pai veio de Portugal.\nR – O que aconteceu foi que o meu avô veio de Portugal com o pai. Ele perdeu o pai na febre amarela.\nP/2 – Em que ano?\n\nR – Isso nos idos... Vovô tinha doze anos naquela época, e ele era de 1800... Não lembro bem, mas sei que vovô tinha doze anos e perdeu o pai, ficou órfão. Ele conseguiu, graças às qualidades pessoais que tinha, vencer os obstáculos, vencer na vida... Ele constituiu família, o primeiro filho foi o papai, que foi um dos fundadores da Drogasil, a maior rede de farmácias e drogarias, naquela época, da América"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.643}, "ATD_HV014_Roberto Pelegrini": {"Áudio": {"MD_0838.wav": {"size_mb": 305.75, "modified": "2011-07-28 17:14:30", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV014_Roberto Pelegrini\\Áudio\\MD_0838.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3634945.0, "duration": 3634.95}, "MD_0839.wav": {"size_mb": 146.625, "modified": "2011-07-29 12:20:12", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV014_Roberto Pelegrini\\Áudio\\MD_0839.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 1743168.0, "duration": 1743.17}, "folder_size_gb": 0.442}, "IMAGENS": {"ATD_HV014.xlsx": {"size_mb": 0.0159, "modified": "2018-08-13 05:26:18", "extension": "XLSX", "full_path": "D:\\Abif on_ms": 0, "dimension": "2452x1481", "height": 1481, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2452x1481"}, "ATD_HV015_FT009.jpg": {"size_mb": 2.0744, "modified": "2018-08-16 07:15:34", "extension": "JPG", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV015_Oswaldo Luiz Ramos\\IMAGENS\\Baixa\\ATD_HV015_FT009.jpg", "category": "Image", "duration_ms": 0, "dimension": "1571x2459", "height": 2459, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1571x2459"}, "folder_size_gb": 0.016}, "folder_size_gb": 0.099}, "TEXTUAL": {"ATD_HV015_Oswaldo Luiz Ramos_rev.doc": {"size_mb": 0.1055, "modified": "2018-08-13 07:35:54", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV015_Oswaldo Luiz Ramos\\TEXTUAL\\ATD_HV015_Oswaldo Luiz Ramos_rev.doc", "category": "Textual"}, "ATD_HV015_Oswaldo Luiz Ramos_rev.docx": {"size_mb": 0.0304, "modified": "2026-02-20 10:50:16", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV015_Oswaldo Luiz Ramos\\TEXTUAL\\ATD_HV015_Oswaldo Luiz Ramos_rev.docx", "category": "Textual", "content_preview": "Projeto Abifarma - 50 anos\nDepoimento de Oswaldo Luiz Ramos\nEntrevistado por Luis André do Prado e Ricardo Guanabara\nSão Paulo, 03/06/1997\nRealização: Museu da Pessoa\nEntrevista número: ATD_HV015\nTranscrito por Priscila Del Bianco Di Mase\nRevisado por Natália Ártico Tozo\nP/1 – Vamos começar a gravação do depoimento com a sua identificação: nome completo, a data e o local que o senhor nasceu.\nR – Oswaldo Luiz Ramos, 17 de maio de 1928, São Paulo, São Paulo.\nP/1 – Bom, Doutor Oswaldo, então vamos falar um pouco sobre suas origens, o que o senhor conhece das origens da sua família por parte de pai, seus avós, bisavós...\nR – De certo, eu acho que até onde eu sei os meus bisavós do lado paterno são todos brasileiros sim, dos dois lados, quer dizer, não tem nenhum... O meu bisavô militar era um cafeicultor do Estado do Rio. Depois o que teve filhos, o meu avô, também foi um cafeicultor do Estado do Rio, depois aqui em Avaré. Era uma família que chegou a ser muito rica; meu bisavô era daqueles chamados “Barão do Café” e naturalmente eles cuidaram de perder todo este dinheiro, de modo que quando o meu avô morreu ele era um modesto bancário. Eles viveram aquele círculo do café no Estado do"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.536}, "ATD_HV016_Maria Bernardete Mendonça": {"Áudio": {"MD_0842.wav": {"size_mb": 308.3008, "modified": "2011-07-13 23:22:22", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV016_Maria Bernardete Mendonça\\Áudio\\MD_0842.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3665270.0, "duration": 3665.27}, "MD_0843.wav": {"size_mb": 234.0308, "modified": "2011-07-14 02:23:56", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV016_Maria Bernardete Mendonça\\Áudio\\MD_0843.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 2782302.0, "duration": 2782.3}, "folder_size_gb": 0.53}, "IMAGENS": {"ATD_HV016.xlsx": {"size_mb": 0.016, "modified": "2018-08-15 05:01:22", "extension": "XLSX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV016_Maria Bernardete Mendonça\\IMAGENS\\ATD_HV016.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nATD_HV016_FT001 | Maria Bernadete Mendonça | Pescando | 1948.0 | Avaré- SP | Pescaria no Rio Novo com os primos | primos, crianças, pescaria, Avaré\nATD_HV016_FT002 | Maria Bernadete Mendonça | 1º Ano do Filho | 1962-06-09 00:00:00 | São Paulo- SP | 1º Aniversário do 03", "height": 1103, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1598x1103"}, "ATD_HV016_FT014.jpg": {"size_mb": 1.7218, "modified": "2018-08-09 08:03:40", "extension": "JPG", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV016_Maria Bernardete Mendonça\\IMAGENS\\Baixa\\ATD_HV016_FT014.jpg", "category": "Image", "duration_ms": 0, "dimension": "1924x2621", "height": 2621, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1924x2621"}, "folder_size_gb": 0.011}, "folder_size_gb": 0.086}, "TEXTUAL": {"ATD_HV016_Maria-Bernadete-Mendonça_REV.doc": {"size_mb": 0.1538, "modified": "2020-02-13 19:58:40", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV016_Maria Bernardete Mendonça\\TEXTUAL\\ATD_HV016_Maria-Bernadete-Mendonça_REV.doc", "category": "Textual"}, "ATD_HV016_Maria-Bernadete-Mendonça_REV.docx": {"size_mb": 0.0427, "modified": "2026-02-20 10:50:18", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV016_Maria Bernardete Mendonça\\TEXTUAL\\ATD_HV016_Maria-Bernadete-Mendonça_REV.docx", "category": "Textual", "content_preview": "Abifarma − 50 anos\nDepoimento de Maria Bernadete Mendonça \nEntrevistada por Cláudia Leonor e Ricardo Guanabara\nRealização Museu da Pessoa\nEntrevista ATD_HV016 \nSão Paulo, 03/05/1997\nTranscritor: Alexandre Sampaio de Carvalho e Lilian Aparecida Matias\nRevisado por Ligia Furlan\nP/1 - Bom, a gente queria começar a entrevista com a senhora pedindo para a senhora falar o nome completo, o local e a data de nascimento.\nR - Maria Bernadete Mendonça, seis de janeiro de 1935. Tenho 62 anos, graças a Deus.\nP/1 - E onde a senhora nasceu?\nR - Em Barracas, perto de Paraguaçu Paulista, Assis.\nP/2 - E o que é isso, uma vila?\nR - Não, era uma fazenda. Hoje uma cidade, mas naquela época era uma fazenda, e era o meu pai que tomava conta, que era dono.\nP/2 - A senhora ficou lá até quando?\nR – Ah, até, eu acho, cinco anos. Depois vim morar em Avaré, que era a terra dos meus pais, e sempre fiquei lá em Avaré, adoro Avaré.\nP/1 - O nome dos avós da senhora?\nR - Meus avós, pra eu lembrar é dureza, a cabeça... Basiliza e José.\nP/2 - Isso aí é tudo parte do pai?\nR - Da mãe era Basiliza e José, e por parte do pai eu não sei, não lembro. Não que eu não saiba, não lembro. Dela eu lembro que tem primas com o nom"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.616}, "ATD_HV017_Northon Sayeg": {"Áudio": {"MD_0844.wav": {"size_mb": 308.4219, "modified": "2011-07-11 17:49:58", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV017_Northon Sayeg\\Áudio\\MD_0844.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3666709.0, "duration": 3666.71}, "folder_size_gb": 0.301}, "IMAGENS": {"ATD_HV017.xlsx": {"size_mb": 0.0151, "modified": "2018-08-15 08:32:08", "extension": "XLSX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV017_Northon Sayeg\\IMAGENS\\ATD_HV017.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nATD_HV017_FT001 | Norton Sayeg | Médico Latinoamericano | 1994.0 | Santiago-Chile | 2º Congresso de Gerontologia y Geriatría del Cono Sur | pose, médico, Gerontologia, Geriatria, Santiago, Chile, "}, "Alta": {"ATD_HV017_FT001.tif": {"size_mb": 8.6998, "modified": "2018-08-15 07:51:04", "extension": "TIF", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV017_Northon Sayeg\\IMAGENS\\Alta\\ATD_HV017_FT001.tif", "category": "Image", "duration_ms": 0, "dimension": "1481x2035", "height": 2035, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1481x2035"}, "folder_size_gb": 0.008}, "Baixa": {"ATD_HV017_FT001.jpg": {"size_mb": 1.6222, "modified": "2018-08-15 08:27:26", "extension": "JPG", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV017_Northon Sayeg\\IMAGENS\\Baixa\\ATD_HV017_FT001.jpg", "category": "Image", "duration_ms": 0, "dimension": "1481x2035", "height": 2035, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1481x2035"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.01}, "TEXTUAL": {"ATD_HV017_Norton-Sayeg_REV.docx": {"size_mb": 0.0422, "modified": "2018-08-15 13:34:54", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV017_Northon Sayeg\\TEXTUAL\\ATD_HV017_Norton-Sayeg_REV.docx", "category": "Textual", "content_preview": "Abifarma 50 Anos \nDepoimento de Norton Sayeg\nEntrevistado por Ricardo Guanabara e Claudia Leonor \n03/05/1997\nEntrevista n° ATD_HV17\nRealização: Museu da Pessoa\nTranscrito por Rául Daniel Tegli\nRevisado por Luiza Gallo Favareto\nP/1 - Podemos começar com o senhor dizendo seu nome completo, local e data de nascimento.\nR - Meu nome é Norton Sayeg. Nasci em São Paulo, na cidade de São Paulo em 9 de março de 1950.\nP/1 - Doutor Sayeg, o senhor lembra da origem de sua família?\nR - Minha família é libanesa. Basicamente, meus avôs que vieram de ________, no Líbano, chegaram como imigrantes, sem nenhum recurso, absolutamente pobres, e como dizia, trazendo no coração muita esperança e nada corpo. Sem falar a língua do país. A rigor, como várias trajetórias semelhantes. Nós temos trajetórias muito semelhantes na história dos imigrantes, mas meu avô foi um desses que vieram sem nada e criou quatro filhos. Minha mãe era a casula dessa família, e a duras penas ele conseguiu lhe dar sobrevivência. Para dar uma idéia, ele se casou com minha avó que não falava uma palavra em libanês e ele não falava uma palavra em português. E casou com minha avó de dezesseis anos de idade. Logo que chegou foi a prim"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.311}, "ATD_HV019_Bernardo Lichewitz": {"Áudio": {"MD_0435.wav": {"size_mb": 56.4903, "modified": "2011-07-12 17:17:36", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV019_Bernardo Lichewitz\\Áudio\\MD_0435.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 671591.0, "duration": 671.59}, "MD_0845.wav": {"size_mb": 308.6289, "modified": "2011-07-12 00:44:06", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV019_Bernardo Lichewitz\\Áudio\\MD_0845.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3669171.0, "duration": 3669.17}, "folder_size_gb": 0.357}, "IMAGENS": {"ATD_HV019.xlsx": {"size_mb": 0.0158, "modified": "2018-08-13 07:21:08", "extension": "XLSX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV019_Bernardo Lichewitz\\IMAGENS\\ATD_HV019.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nATD_HV019_FT001 | Bernardo Lichewitz | Turma de 1963 | 1963.0 | São Paulo | Dr. Bernardo Lichewitz na sala em que trabalhava na época de estudante e que continuou ocupando como professor assistente do Departamento de Anatomias Patológicas | médico, medicina, professor, doutor, professor assistente, Anatomias Patológicas | Foto se divide em 2 partes\nATD_HV019_FT002 | Bernardo Lichewitz | Noivado da Irmã | 1957.0 | São Paulo | Festa de noivado da imã de Bernardo, Geni | jantar, família, noivado, irmã, primos\nATD_HV019_FT003 | Bernardo Lichewitz | Bat Mitzvá de Bernardo | 1949.0 | São Paulo | Festa da maioridade judaica para Bernardo Lichewitz e seu irmão Vitor Lichewitz, que se realizou com a família na casa dos pais | Bat Mitzv mento, e quando tinha problemas mais complicados... Sempre existiu uma grande rivalidade entre o Departamento de Anatomia Patológica e o Hospital das Clínicas. Então, lá do Hospital das Clínicas por quê? Porque os patologistas mostravam os erros, por exemplo, cirúrgicos, os erros clínicos.\nP/1 – Que tipo de erro?\nR – Erro clínico era, por exemplo: eu vejo um doente e examino, se eu for um bom médico eu vou ter uns 70% de acerto; e a gente via os 30% que eram erros. Erro de diagnóstico. O cara achava que era uma coisa, ia lá pra autópsia e era outra. Complicações cirúrgicas. Às vezes, o doente, hoje não, mas na época a gente achava complicações cirúrgicas, pontos que abriram, alguma falha. Então, existia uma grande rivalidade entre os dois lados. Existia uma grande rivalidade. E, quando"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.418}, "ATD_HV020_Eduardo Luis Barbosa": {"Áudio": {"MD_1451.wav": {"size_mb": 307.8838, "modified": "2011-07-14 01:34:36", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV020_Eduardo Luis Barbosa\\Áudio\\MD_1451.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3660312.0, "duration": 3660.31}, "MD_1452.mp3": {"size_mb": 51.0709, "modified": "2016-10-13 10:46:44", "extension": "MP3", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV020_Eduardo Luis Barbosa\\Áudio\\MD_1452.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 2020363.0, "duration": 2020.36}, "folder_size_gb": 0.351}, "IMAGENS": {"ATD_HV020.xlsx": {"size_mb": 0.012, "modified": "2018-08-20 09:42:04", "extension": "XLSX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV020_Eduardo Luis Barbosa\\IMAGENS\\ATD_HV020.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | 984"}, "ATD_HV020_FT006.jpg": {"size_mb": 0.469, "modified": "2018-08-17 10:03:44", "extension": "JPG", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV020_Eduardo Luis Barbosa\\IMAGENS\\Baixa\\ATD_HV020_FT006.jpg", "category": "Image", "duration_ms": 0, "dimension": "1405x1055", "height": 1055, "dpi": 96.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1405x1055"}, "ATD_HV020_FT007.jpg": {"size_mb": 1.0919, "modified": "2018-08-17 10:03:48", "extension": "JPG", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV020_Eduardo Luis Barbosa\\IMAGENS\\Baixa\\ATD_HV020_FT007.jpg", "category": "Image", "duration_ms": 0, "dimension": "2340x1508", "height": 1508, "dpi": 96.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2340x1508"}, "folder_size_gb": 0.004}, "folder_size_gb": 0.038}, "TEXTUAL": {"ATD_HV020_Eduardo Luís Barbosa_rev.doc": {"size_mb": 0.1245, "modified": "2018-08-29 05:20:08", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV020_Eduardo Luis Barbosa\\TEXTUAL\\ATD_HV020_Eduardo Luís Barbosa_rev.doc", "category": "Textual"}, "ATD_HV020_Eduardo Luís Barbosa_rev.docx": {"size_mb": 0.039, "modified": "2026-02-20 10:50:24", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV020_Eduardo Luis Barbosa\\TEXTUAL\\ATD_HV020_Eduardo Luís Barbosa_rev.docx", "category": "Textual", "content_preview": "Nome do Projeto: Abifarma 50 Anos\nDepoimento de: Eduardo Luís Barbosa\nEntrevistado por: Luiz André do Prado e Ricardo Guanabara\nLocal de Gravação: São Paulo\nSão Paulo, 04/05/1997\nRealização Museu da Pessoa\nCódigo do depoente: ATD_HV020\nTranscrito por: Marcos Marsulo\nRevisado por: Gustavo Kazuo\nP/1: Bom, então bem descontraído, tranquilo, queria que você começasse fazendo assim uma identificação, seu nome completo, data e local de nascimento.\nR: Nome: Eduardo Luís Barbosa, local de nascimento: Chavantes, interior do Estado de São Paulo, a data: dia 2 de março de 1961.\nP/1: 61?\nR: Isso.\nP/1: Ok! Eduardo. Então naquela perspectiva de voltar um pouco nos antepassados, vamos pegar aí pelo lado de pai o quê que você conhece da origem dos seus avós, bisavós, origem das famílias, as atividades que eles desenvolviam e depois a gente faz a mesma coisa pelo lado da mãe.\nR: Primeiro pelo lado paterno?\n\nP/1: Paterno, pra ficar mais fácil.\nR: A relação familiar ela sempre foi muito intrincada, então tanto os meus avós paternos como maternos eles sempre estiveram muito próximos.\nP/1: Muito próximos?\nR: Até por conta de ser cidade do interior, então existia uma interligação. Dos meus avós paternos"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.389}, "ATD_HV018_Marcos Pacheco de Toledo": {"IMAGENS": {"ATD_HV018.xlsx": {"size_mb": 0.0114, "modified": "2018-08-20 12:04:54", "extension": "XLSX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV018_Marcos Pacheco de Toledo\\IMAGENS\\ATD_HV018.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nATD_HV018_FT001 | Marcos Pacheco de Toledo Ferraz | Simpósio sobre a saúde | 1984 | Brasília - DF | Marcos Ferraz (ao centro) participa do 5º Simpósio sobre Política Nacional de Saúde. | congresso; política; saúde; simpósio | Imagem encontrada apenas em xérox.\nATD_HV018_FT002 | Marcos Pacheco de Toledo Ferraz | Congresso de Psiquiatria | 1994 | Rio Quente - GO | Marco Ferraz participa do 13º Congresso Brasileiro de Psiquiatria. | congresso; debate; microfone; Psiquiatria | Imagem encontrada apenas em xérox.\nATD_HV018_FT003 | Marcos Pacheco de Toledo Ferraz | Retrato do doutor | s. d. | s. l. | Retrato do doutor Marcos Pacheco de Toledo Ferraz. | psiquiatra; retrato | Imagem encontrada apenas em pg", "category": "Image", "duration_ms": 0, "dimension": "1499x2071", "height": 2071, "dpi": 96.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1499x2071"}, "folder_size_gb": 0.006}, "folder_size_gb": 0.05}, "TEXTUAL": {"ATD_HV018_Marcos-Pacheco-de-Toledo-Ferraz_REV.doc": {"size_mb": 0.1094, "modified": "2020-02-13 19:58:40", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV018_Marcos Pacheco de Toledo\\TEXTUAL\\ATD_HV018_Marcos-Pacheco-de-Toledo-Ferraz_REV.doc", "category": "Textual"}, "ATD_HV018_Marcos-Pacheco-de-Toledo-Ferraz_REV.docx": {"size_mb": 0.031, "modified": "2026-02-20 10:50:26", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV018_Marcos Pacheco de Toledo\\TEXTUAL\\ATD_HV018_Marcos-Pacheco-de-Toledo-Ferraz_REV.docx", "category": "Textual", "content_preview": "Abifarma − 50 anos\nDepoimento de Marcos Pacheco de Toledo Ferraz\nEntrevistado por Luis André e Sara Mendonça\nSão Paulo, 04/06/1997 \nRealização Museu da Pessoa\nCódigo: ATD_HV018\nTranscrito por Lilian\nRevisado por Ligia Furlan\nR - Meu nome é Marcos Pacheco Toledo Ferraz, tenho 59 anos, nasci em 1939, em 2 de fevereiro, aqui em São Paulo.\nP/1 - Marcos, falando um pouco do lado familiar, eu queria conhecer as origens do lado paterno e materno. O senhor conhece as origens, os nomes dos seus avós, de onde eles vieram, que tipo de atividade desenvolviam...\nR - Meus avós eram fazendeiros − tanto por parte de pai quanto por parte de mãe −, que perderam suas respectivas terras nas épocas de crise. Então meu pai estudou medicina no Rio de Janeiro na década de 30, ele morreu já em 1973, foi psiquiatra do antigo hospital Pinel, que era naquela época um hospital privado lá em Pirituba. Hoje é um hospital público e até podemos falar futuramente dele. Naquele tempo o médico psiquiatra era médico internista, ele vivia dentro do hospital psiquiátrico. Na casa em que eu passei os cinco primeiros anos da minha vida era dentro do hospital psiquiátrico. A minha convivência com o hospital era uma coisa a"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.05}, "ATD_HV021_João Paulo Salomão": {"TEXTUAL": {"ATD_HV021_João-Paulo-Salomão_REV.doc": {"size_mb": 0.1304, "modified": "2020-02-13 19:58:40", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV021_João Paulo Salomão\\TEXTUAL\\ATD_HV021_João-Paulo-Salomão_REV.doc", "category": "Textual"}, "ATD_HV021_João-Paulo-Salomão_REV.docx": {"size_mb": 0.0343, "modified": "2026-02-20 10:50:30", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV021_João Paulo Salomão\\TEXTUAL\\ATD_HV021_João-Paulo-Salomão_REV.docx", "category": "Textual", "content_preview": "Projeto Abifarma − 50 anos\nDepoimento de João Paulo Salomão\nEntrevistado por Cláudia Leonor e Ricardo Guanabara\nSão Paulo, 03/07/1997\nRealização Museu da Pessoa\nCódigo ATD_HV021\nTranscrito por Marina D’Andréa\nRevisado por Ligia Furlan \nP/1 - Para começar a entrevista, diga seu nome completo, local e data de nascimento.\nR - João Paulo Salomão, nasci em São Paulo, em 1944.\nP/1 - O nome dos seus pais?\nR - Rinaldo Salomão e Maria de Lurdes Salomão. \nP/1 - Pode me dizer por que Salomão?\nR - Você pegou justo aí, né? (risos) Então veja, eu te falei que eu era meio italiano, com o nome “Salomão”, fica meio complicado. Mas na realidade o nome original é Salamon, e segundo um primo meu − que inclusive foi tirar passaporte italiano, tal −, o nome é de cristão novo. Ou seja, judeu-espanhol que na época da Inquisição fugiu para a Itália e se converteu ao cristianismo por força da Inquisição. Era na região de Treviso, na Itália, especificamente de um lugarejo chamado Castelnuovo, antigamente chamado _________( risos)\nP/2 - Sabe de onde eram, na Espanha?\nR - Não, da Espanha não sei. Eu já perdi a...\nP/2 -Era seu avô por parte de mãe ou de pai?\nR - De pai. É o Salamon, o nome original.  Na traduçã"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "ATD_HV022_Elisaldo Carlini": {"IMAGENS": {"ATD_HV022.xlsx": {"size_mb": 0.0113, "modified": "2018-08-20 10:00:02", "extension": "XLSX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV022_Elisaldo Carlini\\IMAGENS\\ATD_HV022.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nATD_HV022_FT001 | Elisaldo Carlini | Estágio em Yale | 1963 | New Haven, Estados Unidos | Elisaldo Carlini (em pé, à direita) em estágio na Universidade Yale, sob orientação de Jack Peter Green (sentado, à direita). Elisaldo Carlini (em pé, à direita. Jack Peter Green (sentado, à direita). | Estados Unidos; estágio; jaleco; professor; universidade | Imagem encontrada apenas em xérox. Rasgado.\nATD_HV022_FT002 | Elisaldo Carlini | Professor de influência | s. d. | s. l. | Retrato do professor José Ribeiro do Valle, farmacologista que Elisaldo Carlini começou sua carreira ao lado. | escrita; jaleco; professor; retrato  | Imagem encontrada apenas em xérox. \nATD_HV022_FT003 | Elisaldo Carlini | Trabalho como orientador | 1983 | São Paulo - SP | Na Escola Paulista de Medicina, Elisaldo Carlini orienta Ricardo Santos, hoje professor titular da UERJ (Universidade do Estado do Ri"}, "Alta": {"ATD_HV022_FT001.tif": {"size_mb": 6.4035, "modified": "2018-08-17 10:03:08", "extension": "TIF", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV022_Elisaldo Carlini\\IMAGENS\\Alta\\ATD_HV022_FT001.tif", "category": "Image", "duration_ms": 0, "dimension": "2058x1703", "height": 1703, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2058x1703"}, "ATD_HV022_FT002.tif": {"size_mb": 5.6957, "modified": "2018-08-17 10:03:12", "extension": "TI 022_Elisaldo-Carlini_REV.docx", "category": "Textual", "content_preview": "Abifarma 50 anos\nDepoimento de Elisaldo Carlini\nEntrevistado por Luiz André Prado e Cláudia Leonor\nSão Paulo, 05/06/1997\nEntrevista nº ATD_HV022\nRealização: Museu da Pessoa\nTranscrito por Teresa Melo\nRevisado por Genivaldo Cavalcanti Filho\nP/1 - Começando, eu gostaria que o senhor fizesse uma identificação com seu nome completo, data e local de nascimento.\nR - O meu nome completo é Elisaldo Luiz de Araújo Carlini, eu nasci na cidade de Ribeirão Preto, [no] dia 9 de junho de 1930. \nP/1 - Isso, Dr. Carlini, então...\nR - Vou continuando ou...\nP/1 - Fique à vontade. É uma conversa descontraída, não tem nenhuma formalidade. Eu queria, só pra gente pegar uma trajetória, traçar uma cronologia... As origens, pegando inicialmente pelo lado do seu pai. O que o senhor conhece? As origens da sua família, de onde vêm, se são imigrantes?\nR - Voltando pra Ribeirão Preto, meu nome Elisaldo vem do meu avô, que era Elisaldo Ferreira Goio, que foi um dos primeiros… Acho que foi o primeiro médico que chegou na cidade de Ribeirão Preto. Ele foi uma pessoa muito marcante na família. Ele morreu em 1937, relativamente jovem, mas eu me lembro muito bem; eu tinha 7 anos. Eu me lembro até da cena do enterro"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.042}, "ATD_HV023_José Filgueira": {"TEXTUAL": {"ATD_HV023_José-Maria-Filgueiras_REV.docx": {"size_mb": 0.0313, "modified": "2018-08-21 11:39:58", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV023_José Filgueira\\TEXTUAL\\ATD_HV023_José-Maria-Filgueiras_REV.docx", "category": "Textual", "content_preview": "Abifarma 50 Anos\nDepoimento de José Maria Filgueiras\nEntrevistado por Cláudia Leonor\nRio de Janeiro, 23/05/1997 \nRealização: Museu da Pessoa\nEntrevista nº ATD_HV023\nTranscrito por Lêda Maria de Souza Lima Alves Vianna\nRevisado por Genivaldo Cavalcanti Filho\nP/1 - O senhor nasceu onde?\nR - Eu nasci no Rio de Janeiro, mas fui criado no interior do estado de São Paulo, numa cidadezinha, São José do Barreiro. É uma das cinco cidades perdidas do Monteiro Lobato; na época em que eu era criança lá, o Monteiro Lobato era provedor público, uma espécie de juiz. Nessa cidadezinha fiz o curso primário numa escolinha da roça, uma escolinha do interior; era muito precária, hoje já foi demolida. Eu me lembro ainda da canção que a gente cantava, por exemplo, assim: “Escolinha modesta da roça, de paredes branquinhas de cal, eis um dia se ufana na Pátria, palpitante da vida rural. Batida de sol ardente, hás de saber que o panal que nos para à frente, bendita escola rural.” (cantando) \nEu devia ter de cinco para seis anos quando comecei a frequentar essa escola. Era muito interessante porque nós íamos à cavalo ou de charrete. E o que mais me marca nessa época é que, naquela época, aquela região ainda"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "ATD_HV024_Augusto d'Escragnole Taunay": {"TEXTUAL": {"ATD_HV024_Augusto de Escragnole Taunay_rev.docx": {"size_mb": 0.0616, "modified": "2020-02-13 16:22:24", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV024_Augusto d'Escragnole Taunay\\TEXTUAL\\ATD_HV024_Augusto de Escragnole Taunay_rev.docx", "category": "Textual", "content_preview": "Projeto: Abifarma 50 anos\nDepoimento do Dr. Augusto Taunay\nEntrevistado por Ricardo Guanabara Leal\nSão Paulo, 25 de março de 1997\nRealização: Museu da Pessoa\nATD_HV024_ Augusto Taunay\nTranscrito por Patrícia Lelis Nogueira\nP/1- Entrevista com Dr. Augusto Taunay dia 25 de março de 1997\nP/1- Bom professor, vamos recomeçar nosso papo. O senhor começou a trabalhar no Instituto Adolfo Lutz aproximadamente quando?\nR- Foi em 1937 quando saí da faculdade, me formei. Foi o primeiro lugar que trabalhei, a vida inteira fiquei lá.\nP/1- O senhor poderia me dizer o seu nome, sua filiação, sua data de nascimento...\nR- Meu nome é Augusto d'Escragnolle Taunay, minha filiação é Afonso d'Escragnolle Taunay e minha mãe é Sarah José Queiroz de Taunay. \nP/1- Qual a sua data de nascimento?\nR- Julho de 1912, 19 de julho de 1912, vou fazer 85 anos este ano.\nP/1- Qual é a sua formação?\nR- Minha formação foi médica, fui aluno da USP. A Faculdade de Medicina de São Paulo não existia na época, era um Instituto independente e me formei lá. Ao sair da faculdade procurei serviços que me agradavam, não gostava muito de lidar com doentes, então achei que num Instituto bacteriológico que existia ali perto, nosso viz"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "ATD_HV013_Fábio Doria do Amaral": {"IMAGENS": {"ATD_HV013.xlsx": {"size_mb": 0.0156, "modified": "2018-08-09 08:46:28", "extension": "XLSX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV013_Fábio Doria do Amaral\\IMAGENS\\ATD_HV013.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nATD_HV013_FT001 | Fábio Dória do Amaral | Retrato de Fábio | 1937.0 | s/l | Retrato de Fábio Dória do Amaral | retrato, olhar, homem, jovem, gala, termo\nATD_HV013_FT002 | Fábio Dória do Amaral | Caminhada | s/d | s/l | Fábio Dória  caminhando com outras pessoas | caminhada, sorriso, andar\nATD_HV013_FT003 | Fábio Dória do Amaral | Reunião Jantar | s/d | s/l | Fábio reunido com pessoas para um jantar | jantar, homens, gala, terno\nATD_HV013_FT004 | Fábio Dória do Amaral | Carinho de Pediatra | s/d | s/l | Fábio cuidando de um paciente | bebê, criança, dormindo, sono, descanso, colo, carinho, olhar\nATD_HV013_FT005 | Fábio Dória do Amaral | Visitando a Fábrica | s/d | s/l | Visitando a Fábrica da Nestlê em Araraquara | homens, visita, Fábria Nestlê. Araraquara, fábrica\nATD_HV013_FT006 | Fábio Dória do Amaral | Colegas | s/d | s/l | Foto coletiva  | pose para foto, pose, fila,"}, "Alta": {"ATD_HV013_FT001.TIF": {"size_mb": 7.748, "modified": "2018-08-08 06:56:50", "extension": "TIF", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV013_Fábio Doria do Amaral\\IMAGENS\\Alta\\ATD_HV013_FT001.TIF", "category": "Image", "duration_ms": 0, "dimension": "1483x1826", "height": 1826, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1483x1826"}, "ATD_HV013_FT002.tif": {"size_mb": 17.7984, "modified": "2018-08-09 07:47:58", "extension": "TIF", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV013_Fábio Doria do Amaral\\IMAGENS\\Alta\\ATD_HV013_FT002.tif", "category": "Image", "duration_ms": 0, "dimension": "3040x2308", "height": 2308, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3040x2308"}, "ATD_HV013_FT003.tif": {"size_mb": 10.7839, "modified": "2018-08-09 07:48:04", "extension": "TIF", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV013_Fábio Doria do Amaral\\IMAGENS\\Alta\\ATD_HV013_FT003.tif", "category": "Image", "duration_ms": 0, "dimension": "2821x2083", "height": 2083, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2821x2083"}, "ATD_HV013_FT004.tif": {"size_mb": 4.8658, "modified": "2018-08-09 07:48:10", "extension": "TIF", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV013_Fábio Doria do Amaral\\IMAGENS\\Alta\\ATD_HV013_FT004.tif", "category": "Image", "duration_ms": 0, "dimension": "1525x1059", "height": 1059, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1525x1059"}, "ATD_HV013_FT005.tif": {"size_mb": 23.6622, "modified": "2018-08-09 07:48:20", "extension": "TIF", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV013_Fábio Doria do Amaral\\IMAGENS\\Alta\\ATD_HV013_FT005.tif", "category": "Image", "duration_ms": 0, "d o Amaral. Nasci em Araçatuba, [em] 19 de maio de 1921.\nP/1 - E o nome dos seus pais?\nR - Meu pai se chamava Antônio Gomes do Amaral Filho e minha mãe, Odete Dória do Amaral.\nP/1 - Começando pelos seus avós paternos, como se chamava seu avô e sua avó paterna?\nR - Meu avô era Antônio Gomes do Amaral e minha avó, Faustina Gomes do Amaral.\nP/1 - O senhor estava contando que o seu avô era fazendeiro. Como foi a história dele?\nR - A família dele era de Araçatuba, e o avô também. Logo depois de se casar, ele resolveu montar uma fazenda por conta própria, então se mudou para Monte Alto e montou uma fazenda de café, que era o habitual naquela ocasião. Ainda não tinha cana, não tinha outras culturas que hoje dominam o interior de São Paulo. Então meu pai nasceu lá em Monte Alto. \nP/1 - Por conta dessa ida dele...\nR - Pra Monte A"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.127}, "folder_size_gb": 9.284}, "folder_size_gb": 9.284}, "folder_size_gb": 17.347}, "Agentes da História (AGH)": {"HV": {"AGH_HV001_Elizette Cordeiro Vieira Gonçalves": {"Áudio": {"MD_0579.wav": {"size_mb": 615.0528, "modified": "2011-08-02 22:04:18", "extension": "WAV", "full_path": "D:\\Agentes da História (AGH)\\HV\\AGH_HV001_Elizette Cordeiro Vieira Gonçalves\\Áudio\\MD_0579.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 7312126.0, "duration": 7312.13}, "folder_size_gb": 0.601}, "folder_size_gb": 0.601}, "AGH_HV002_Valter Cardoso": {"Áudio": {"MD_0598.wav": {"size_mb": 520.0811, "modified": "2011-04-17 19:10:36", "extension": "WAV", "full_path": "D:\\Agentes da História (AGH)\\HV\\AGH_HV002_Valter Cardoso\\Áudio\\MD_0598.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 6183044.0, "duration": 6183.04}, "folder_size_gb": 0.508}, "folder_size_gb": 0.508}, "AGH_HV003_Nilza Cunha": {"Áudio": {"MD_0573.wav": {"size_mb": 393.8477, "modified": "2011-08-03 04:39:56", "extension": "WAV", "full_path": "D:\\Agentes da His noel Camargo Teixeira\\Textual\\INC_HV002_José_Manoel_Camargo_Teixeira_rev.docx", "category": "Textual", "content_preview": "Projeto: Memorial do Incor – 25 anos\nDepoimento de José Manoel Camargo Teixeira\nEntrevistado por Rosana Miziara e José Carlos Vilardaga\nSão Paulo, 26/08/1999\nRealização: Museu da Pessoa\nDepoimento ISP_HV002\nTranscrito por Stella Maris Scatena Franco\nRevisado por Fernanda Regina\nP/1 - Bom, doutor José Manoel, para começar o senhor poderia se identificar, o nome completo?\nR - José Manoel de Camargo Teixeira.\nP/1 - E falar um pouco assim, do seu nascimento, o local de nascimento, a data...\nR - Eu nasci em São Carlos, estado de São Paulo, 14 de Dezembro de 1947.\nP/1 - Os seus pais são de lá também?\nR - Os meus pais são também de São Carlos, os dois, meu pai e minha mãe nascidos em São Carlos.\nP/1 - Seus avós, sua família tem alguma descendência estrangeira?\nR - Tem, diversas!\nP/1 - Quais?\nR - Português, italiano... Além do ramo brasileiro, depois tem um pouco de belga, austríaco e um pouco de espanhol.\nP/1 - Uma boa mistura! (risos)\nR - É, é bem misturado.\nP/1 - E o que os seus pais faziam lá?\nR - O meu pai era cirurgião dentista e minha mãe era professora de piano, mas ficava mais da casa, não é? Dava aula em casa, de piano e cuidava da... Segundo trabalho da mulher, jornada complemen"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.846}, "INC_HV003_Sérgio Almeida de Oliveira": {"Áudio": {"MD_0854.wav": {"size_mb": 378.5088, "modified": "2011-07-30 13:31:44", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV003_Sérgio Almeida de Oliveira\\Áudio\\MD_0854.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4499946.0, "duration": 4499.95}, "MD_0856.wav": {"size_mb": 23.9121, "modified": "2011-07-31 20:57:10", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicolo ite. | 63\nINC_HV003_FT003 | Sérgio Almeida de Oliveira | Apresentação de Sérgio | s. d. | s. l. | Retrato pessoal de Sérgio. | apresentação; bandeira; beca; cadeira; formalidade; mesa | Ficha não encontrada. Informações obtidas do antigo site. | 62"}, "Baixa": {"INC_HV003_FT001.jpg": {"size_mb": 0.0178, "modified": "2018-07-25 14:33:48", "extension": "JPG", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV003_Sérgio Almeida de Oliveira\\Imagens\\Baixa\\INC_HV003_FT001.jpg", "category": "Image", "duration_ms": 0, "dimension": "400x224", "height": 224, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "400x224"}, "INC_HV003_FT002.jpg": {"size_mb": 0.015, "modified": "2018-07-25 14:34:32", "extension": "JPG", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV003_Sérgio Almeida de Oliveira\\Imagens\\Baixa\\INC_HV003_FT002.jpg", "category": "Image", "duration_ms": 0, "dimension": "400x263", "height": 263, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "400x263"}, "INC_HV003_FT003.jpg": {"size_mb": 0.0202, "modified": "2018-07-25 14:34:36", "extension": "JPG", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV003_Sérgio Almeida de Oliveira\\Imagens\\Baixa\\INC_HV003_FT003.jpg", "category": "Image", "duration_ms": 0, "dimension": "400x259", "height": 259, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "400x259"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "Textual": {"INC_HV003_Sérgio Almeida de Oliveira_parte 1_ REV.doc": {"size_mb": 0.1011, "modified": "2018-07-27 07:35:52", "extension": "DOC", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV003_Sérgio Almeida de Oliveira\\Textual\\INC_HV003_Sérgio Almeida de Oliveira_parte 1_ REV.doc", "category": "Textual"}, "INC_HV003_Sérgio Almeida de Oliveria_ parte 2_REV.docx": {"size_mb": 0.0528, "modified": "2018-07-27 07:04:06", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV003_Sérgio Almeida de Oliveira\\Textual\\INC_HV003_Sérgio Almeida de Oliveria_ parte 2_REV.docx", "category": "Textual", "content_preview": "Projeto Memória do Incor\nDepoimento de Sérgio Almeida de Oliveira\nEntrevistado por José Carlos Vilardaga e Ricardo Guanabara\nSão Paulo, 23 de outubro de 2000. \nCódigo da entrevista: INC003_Sérgio Almedia de Oliveira_Parte 2\nTranscrito por \nRevisado por Erick Vinicius de Araujo Borges\nP/1 - Acho que da nossa última conversa ficou um pouco a discutir, o senhor contar um pouquinho, esse começo do Incor, quer dizer, essa história um pouco do cotidiano, de como que vocês foram aumentando essa estrutura do hospital e organizando o hospital.\nR - Bom, o Incor começou efetivamente, lhe disse, aqui no dia... Eu tinha até guardado o papel da (PAUSA)... Ele começou efetivamente em 1978. Com muita dificuldade, porque era um anexo do Hospital das Clínicas funcionando aqui. Nós tínhamos uma sala de operação, que era a sala C e aqui tínhamos sete salas de cirurgia, mas não tínhamos meios financeiros para tocar a instituição, para manter o ritmo que se desejava. Aqui continuou funcionando o primeiro ano, uma cirurgia de manhã, uma cirurgia à tarde, às vezes uma cirurgia por dia. Quer dizer, num ritmo muito pequeno, porque essa era a realidade e foi nessa época que o professor Zerbini, um pouco dese"}, "INC_HV003_Sérgio Almeida de Oliveira_parte 1_ REV.docx": {"size_mb": 0.0308, "modified": "2026-02-20 10:50:32", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV003_Sérgio Almeida de Oliveira\\Textual\\INC_HV003_Sérgio Almeida de Oliveira_parte 1_ REV.docx", "category": "Textual", "content_preview": "Projeto Memória do Incor\nDepoimento de Sérgio Almeida de Oliveira\nEntrevistado por José Carlos Vilardaga e Ricardo Guanabara\nSão Paulo, 13 de outubro de 2000. \nCódigo da entrevista: INC003_Sérgio Almedia de Oliveira\nTranscrito por Cristina Eira Velha\nRevisado por Erick Vinicius de Araujo Borges\nP/1 - A primeira pergunta que vou fazer é pedir para o senhor \n(PROBLEMA COM A GRAVAÇÃO)\nR -... Precisa contestar, investigar mais, ir a fundo. Esse rigor, essa investigação, com as limitações da época, nós não tínhamos uma propedêutica como se tem hoje. Hoje você faz um ultrassom de abdômen, uma tomografia, mil exames que são muito precisos para definir as coisas internas, do tórax ou do abdômen. Naquela época se dava grande importância ao que a gente tinha na semiótica, que é a escuta, a história, o fato, como ele aconteceu, como veio, para se correlacionar as coisas, de onde vem o paciente, quais são os entornos do problema. Também o exame físico. Você tem que examinar o cidadão inteiro, da unha ao cabelo. A textura do cabelo é importante para você suspeitar alguma coisa. Esse convívio com esse pessoal acho que foi muito útil, mesmo sendo cirurgião, quer dizer, hoje sou um cirurgião, acho"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.929}, "INC_HV004_Adib Jatene": {"Áudio": {"MD_0861.wav": {"size_mb": 378.752, "modified": "2011-07-30 11:03:20", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV004_Adib Jatene\\Áudio\\MD_0861.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4502837.0, "duration": 4502.84}, "MD_0862.wav": {"size_mb": 18.2774, "modified": "2011-07-31 21:01:22", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV004_Adib Jatene\\Áudio\\MD_0862.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 217292.0, "duration": 217.29}, "MD_0863.wav": {"size_mb": 380.0254, "modified": "2011-08-03 00:14:46", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV004_Adib Jatene\\Áudio\\MD_0863.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4517976.0, "duration": 4517.98}, "folder_size_gb": 0.759}, "Textual": {"INC_HV004_Adib Jatene_rev.doc": {"size_mb": 0.1431, "modified": "2018-07-27 11:37:58", "extension": "DOC", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV004_Adib Jatene\\Textual\\INC_HV004_Adib Jatene_rev.doc", "category": "Textual"}, "INC_HV004_Adib Jatene_rev.docx": {"size_mb": 0.0404, "modified": "2026-02-20 10:50:34", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV004_Adib Jatene\\Textual\\INC_HV004_Adib Jatene_rev.docx", "category": "Textual", "content_preview": "Projeto Memorial InCor - 25 anos \nDepoimento do Professor Doutor Adib Domingos Jatene\nEntrevistado por Ignez Barretto e Ricardo Guanabara \nSão Paulo, 17/10/2000\nEntrevista número: INC_HV004\nRealização: Museu da Pessoa\nTranscrito por Beatriz Blay\nRevisado por Natália Ártico Tozo\nP/1 – Bom, gostaríamos então que o senhor se identificasse: seu nome completo, lugar de nascimento, data de nascimento.\nR – Meu nome é Adib Domingos Jatene, eu nasci no Xapuri, no Acre, em 4 de junho de 1929.\nP/1 – E o nome de seus pais?\nR – Meu pai Domingos Antonio Jatene já falecido, quando eu tinha dois anos, já falecido, ele faleceu quando eu tinha dois anos em 1931 e minha mãe Anice Dib Jatene faleceu com 84 anos em 1987.\nP/1 – E o senhor se recorda dessa infância no Acre?\nR – Nós vivemos no Acre até 1939. Minha mãe, depois que meu pai faleceu, montou uma pequena lojinha, onde ela trabalhava e fazia essas costuras pra abastecer a loja de roupas simples pra vender pra senhoritas. Depois, em 1939, nós éramos quatro filhos, ela queria educar os filhos e queria, portanto, sair do Acre; o projeto dela era vir pra Belém, mas ela tinha um tio em Ituiutaba, tio, irmão do pai dela, e ele insistiu muito por carta"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.759}, "INC_HV005_Jorgina Mizael": {"Áudio": {"MD_0864.wav": {"size_mb": 235.961, "modified": "2011-07-31 20:39:10", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV005_Jorgina Mizael\\Áudio\\MD_0864.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 2805249.0, "duration": 2805.25}, "folder_size_gb": 0.23}, "folder_size_gb": 0.23}, "INC_HV006_Nelson Daruj": {"Áudio": {"MD_0865.wav": {"size_mb": 247.0274, "modified": "2011-07-29 14:33:54", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV006_Nelson Daruj\\Áudio\\MD_0865.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 2936813.0, "duration": 2936.81}, "folder_size_gb": 0.241}, "Textual": {"INC_HV006_Nelson Daruj_rev.docx": {"size_mb": 0.3828, "modified": "2018-07-25 09:57:38", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV006_Nelson Daruj\\Textual\\INC_HV006_Nelson Daruj_rev.docx", "category": "Textual", "content_preview": "Nome do projeto: Projeto Incor 25 anos - Memorial\nDepoimento de: Nelson Daruj\nEntrevistado por: Ricardo Guanabara e Inês Barreto\nLocal de gravação: São Paulo\nSão Paulo, 18 de outubro de 2000.\nRealização Museu da Pessoa\nCódigo do depoente: INC_004\nTranscrito por: Elaine de Souza Zanolo\nRevisado por Fernanda Regina\nP/1 – Bom, primeiro eu gostaria que o Senhor se identificasse, nome completo, data e local de nascimento.\nR – Nelson Daruj, 70 anos, Bauru, estado de São Paulo.\nP/1 – E qual é a data de nascimento?\nR – 19 de outubro de 1929, 71.\nP/1 – Certo. E o nome do seu pai?\nR – Meu pai, Miguel Daruj, minha mãe, Julieta Daruj.\nP/1 – E qual era a atividade deles?\nR – Meu pai era advogado, a minha mãe era o que se chamava de prendas domésticas.\nP/1 – E o Senhor se lembra da origem do seu pai?\nR – Meu pai era brasileiro descendente de árabe.\nP/1 – Nascido no Brasil?\nR – Não era palestino, nem (riso) judeu.\nP/2 – Mas ele nasceu aonde?\nR – Nasceu aqui no Brasil.\nP/1 – Em que cidade? Bauru mesmo?\nR – Olha, naquela ocasião não havia muita informação, mesmo porque não havia um diálogo muito aberto com os pais, quer dizer, vocês não sei se conseguem imaginar isso, isso foi terceira ou quarta ge"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.242}, "INC_HV007_Dr. Rui Gomide": {"Áudio": {"MD_0867.wav": {"size_mb": 325.6563, "modified": "2011-07-17 15:16:22", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV007_Dr. Rui Gomide\\Áudio\\MD_0867.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3871602.0, "duration": 3871.6}, "MD_0868.wav": {"size_mb": 379.0567, "modified": "2011-07-05 14:32:04", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV007_Dr. Rui Gomide\\Áudio\\MD_0868.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4506459.0, "duration": 4506.46}, "folder_size_gb": 0.688}, "Imagens": {"INC_HV007.xlsx": {"size_mb": 0.0109, "modified": "2018-07-25 do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV008_Dra. Clarice Ferrarini\\Áudio\\MD_0872.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 1335681.0, "duration": 1335.68}, "folder_size_gb": 0.482}, "Textual": {"INC_HV008_Clarice Ferrarini_rev.docx": {"size_mb": 0.0572, "modified": "2018-07-25 10:17:16", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV008_Dra. Clarice Ferrarini\\Textual\\INC_HV008_Clarice Ferrarini_rev.docx", "category": "Textual", "content_preview": "Projeto Memorial InCor - 25 anos\nDepoimento de Clarice Della Torre Ferrarini\nEntrevistada por Ricardo Guanabara\nSão Paulo, 20/10/2000\nEntrevista número: INC_HV008\nRealização: Museu da Pessoa\nTranscrito por Liamara Guimarães de Paiva\nRevisado por Natália Ártico Tozo\nP/1 – Dona Clarice, a senhora poderia começar falando, por favor, seu nome completo, local e data de nascimento?\nR – Eu me chamo Clarice Della Torre Ferrarini, nascida em São José do Rio Pardo, em 20 de novembro de 1921, São Paulo.\nP/1 – Qual o nome dos seus pais?\nR – José Ferrarini e Carolina Della Torre Ferrarini.\nP/1 – Qual era a atividade deles?\nR – Eles eram agricultores, trabalhavam na administração de fazendas, na área mais de agricultura mesmo.\nP/1 – Aqui no estado de São Paulo?\nR – No estado de São Paulo mesmo.\nP/1 – E seus avós?\nR – Meus avós? Meus avós vieram da Itália, né Marieta? Meus avós vieram da Itália e moraram em São José, acompanharam a nossa juventude também, porque eles moraram algum tempo conosco, até que eles faleceram.\nP/1 – Eles eram de que região da Itália?\nR – De Mantova. E eu também tenho, numa hora qualquer dessas, que eu viajo bastante, eu fui parar em Mantova para conhecer os familiares da"}, "folder_size_gb": 0.0}, "Imagens": {"XXXI ornada Paulista de Administração- Verso.tif": {"size_mb": 3.1276, "modified": "2025-07-03 11:07:38", "ex , "modified": "2011-07-14 23:56:10", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV009_Eugênio Grigonovitch\\Áudio\\MD_0873.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4500050.0, "duration": 4500.05}, "MD_0874.wav": {"size_mb": 195.1348, "modified": "2011-07-15 00:43:26", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV009_Eugênio Grigonovitch\\Áudio\\MD_0874.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 2319882.0, "duration": 2319.88}, "folder_size_gb": 0.56}, "Textual": {"INC_HV009_Eugenio-Gregorowitschs_REV.docx": {"size_mb": 0.0511, "modified": "2018-07-26 10:30:52", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV009_Eugênio Grigonovitch\\Textual\\INC_HV009_Eugenio-Gregorowitschs_REV.docx", "category": "Textual", "content_preview": "Projeto: Memorial do Incor - 25 anos\nDepoimento de Eugenio Gregorowitschs\nEntrevistada por Ignez Barretto e Ricardo Guanabara\nSão Paulo, 23/10/2000\nRealização: Museu da Pessoa\nDepoimento INC_HV009_Eugenio Gregorowitschs\nTranscrito por Beatriz Blay\nRevisado por Luiza Gallo Favareto\nP/1 – Seu nome completo, local de nascimento e data de nascimento.\nR – Eugenio Gregorowitschs, nascido no dia 8/5/33 na Maternidade São Paulo. \nP/1 – E o nome de seu pai, da sua mãe?\nR – Karlis Gregorowitschs e Ana Gregorowitschs.\nP/1 – A origem da sua família?\nR – Bem, meus pais foram imigrantes que fugiram da Primeira Guerra Mundial. Um grupo grande de letões, um grupo de 1500 pessoas, talvez, saíram dos países bálticos em busca de um país que não corresse risco de ser ocupado por um governo totalitário, fato que acabou acontecendo.\nP/1 – E eles vieram como pra cá?\nR – Vieram como imigrantes, colonos, tal como colonos de outras origens, [por exemplo as] italianas. Foram localizados pelo governo do estado de São Paulo, no interior de São Paulo numa região que naquela época era inóspita, chamada Varpa, no município de Tupã e formaram lá uma colônia literalmente de socialistas, num conceito que na época nã"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.56}, "INC_HV011_Jerônimo Machado": {"Áudio": {"MD_0877.wav": {"size_mb": 367.7286, "modified": "2011-07-16 16:39:00", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV011_Jerônimo Machado\\Áudio\\MD_0877.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4371783.0, "duration": 4371.78}, "folder_size_gb": 0.359}, "Textual": {"INC_HV011_Jeronimo Machado_rev.doc": {"size_mb": 0.1011, "modified": "2018-07-27 10:45:58", "extension": "DOC", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV011_Jerônimo Machado\\Textual\\INC_HV011_Jeronimo Machado_rev.doc", "category": "Textual"}, "INC_HV011_Jeronimo Machado_rev.docx": {"size_mb": 0.0265, "modified": "2026-02-20 10:50:38", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV011_Jerônimo Machado\\Textual\\INC_HV011_Jeronimo Machado_rev.docx", "category": "Textual", "content_preview": "Projeto: Incor 25 anos \nDepoimento de Jeronimo Machado\nEntrevistado por Ricardo Guanabara e Inês Barreto\nSão Paulo, 25/10/2000\nRealização Museu da Pessoa\nCódigo : INC_HV011\nTranscrito por Elaine de Souza Zanolo\nRevisado por Ligia Furlan\nP/1 – Seu Jeronimo Machado, o senhor poderia começar falando o seu nome completo, data de nascimento e local?\nR – Eu sou Jeronimo Machado, nasci no dia 26 de março de 1930, em Ribeirão Claro, hoje Guapiaçu.\nP/1 – Qual que é o nome do seu pai e sua mãe?\nR – Meu pai Jeronimo Machado, minha mãe Onófria Alves da Conceição.\nP/1 – De onde eles são?\nR – São do Estado de São Paulo.\nP/1 – Qual era a profissão deles?\nR – Lavrador rural.\nP/1 – Lavrador?\nR – É.\nP/1 – E sua mãe?\nR – Do lar, né?\nP/1 – Do lar. Quantos irmãos o senhor teve, Seu Jeronimo?\nR – Cinco irmãos.\nP/1 - Cinco irmãos?\nR - Cinco irmãos.\nP/1 – O senhor passou a sua infância toda em Guapiaçu?\nR – Não, eu passei toda a minha infância não na cidade, e sim na roça, até os oito anos.\nP/1 – Até oito, e depois?\nR – Depois mudamos para Barretos, ficamos lá um ano, mais ou menos, e mudamos para Nova Granada. Lá é que eu comecei a estudar, tudo isso aí.\nP/1 – E o senhor chegou a trabalhar na roça também"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.359}, "INC_HV012_Eunice Zerbini": {"Áudio": {"MD_0417.mp3": {"size_mb": 61.7993, "modified": "2014-09-16 18:41:20", "extension": "MP3", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV012_Eunice Zerbini\\Áudio\\MD_0417.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 4050050.0, "duration": 4050.05}, "MD_0883.wav": {"size_mb": 384.5782, "modified": "2011-07-31 13:49:44", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV012_Eunice Zerbini\\Áudio\\MD_0883.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4572102.0, "duration": 4572.1}, "folder_size_gb": 0.436}, "Imagens": {"INC_HV012.xlsx": {"size_mb": 0.0116, "modified": "2018-07-25 12:33:26", "extension": "XLSX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV012_Eunice Zerbini\\Imagens\\INC_HV01
