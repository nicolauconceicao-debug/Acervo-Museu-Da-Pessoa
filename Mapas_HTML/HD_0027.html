97, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "400x597"}, "INC_HV012_FT013.jpg": {"size_mb": 0.026, "modified": "2018-07-25 11:36:02", "extension": "JPG", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV012_Eunice Zerbini\\Imagens\\Baixa\\INC_HV012_FT013.jpg", "category": "Image", "duration_ms": 0, "dimension": "400x457", "height": 457, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "400x457"}, "INC_HV012_FT014.jpg": {"size_mb": 0.0344, "modified": "2018-07-25 11:44:14", "extension": "JPG", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV012_Eunice Zerbini\\Imagens\\Baixa\\INC_HV012_FT014.jpg", "category": "Image", "duration_ms": 0, "dimension": "400x411", "height": 411, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "400x411"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.132}, "Textual": {"INC_HV012_Eunice-de-Jesus-Zerbini_REV (com cortes).docx": {"size_mb": 0.0471, "modified": "2018-10-22 09:52:44", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV012_Eunice Zerbini\\Textual\\INC_HV012_Eunice-de-Jesus-Zerbini_REV (com cortes).docx", "category": "Textual", "content_preview": "Projeto de Memória do Incor - 25 anos\nDepoimento de Eunice Viariz Zerbini\nEntrevistado por Inês Barreto e José Carlos\nEntrevista nº INC_HV012\nRealização: Museu da Pessoa \nTranscrito por Marília Eira Velha\nRevisado por Genivaldo Cavalcanti Filho\nP/2 - Deixa eu perguntar..\nR - Como?  \nP/2 - Seu nome completo, local e data de nascimento.\nR - Eunice de Jesus Zerbini Viariz. Viariz é do meu marido.\nP/2 - E data e local de nascimento.\nR - Eu nasci aqui em São Paulo, no dia 2 de maio de 1905.\nP/1 - O nome dos pais da senhora?\nR - Papai era Eugênio Zerbini. Minha mãe era Ernestina Teani Zerbini. Nós somos descendentes de italianos mesmo. De mãe e de pai. O meu avô... É para falar do avô?\nP/2 - Sim.\nR - O meu avô era do exército da Itália. Na guerra da Áustria com a Itália, tinha um grupo que ele comandava. E perderam a guerra. Ele era graduado, ele tinha... Sei lá, era o comandante desse grupo, então o governo pegou todos os maiores, juntou tudo e... Porque estavam prendendo os componentes da guerrilha italiana, que estava perdendo. Perdeu a guerra. Para não serem presos, o governo pegou todos eles mais destacados e tratou um navio para trazer no porão, porque no porão a polícia austríaca"}, "INC_HV012_Eunice-de-Jesus-Zerbini_REV.docx": {"size_mb": 0.0562, "modified": "2018-10-22 09:39:44", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV012_Eunice Zerbini\\Textual\\INC_HV012_Eunice-de-Jesus-Zerbini_REV.docx", "category": "Textual", "content_preview": "Projeto de Memória do Incor - 25 anos\nDepoimento de Eunice Viariz Zerbini\nEntrevistado por Inês Barreto e José Carlos\nEntrevista nº INC_HV012\nRealização: Museu da Pessoa \nTranscrito por Marília Eira Velha\nRevisado por Genivaldo Cavalcanti Filho\nP/1 - Eunice Viáriz Zerbini?\nR - Eu sou surda...\nP/1 - Viariz?\nR - Viariz. Eu sou senhora de Armando Pereira Viariz, que era um dos diretores do Café e Açúcar União. Faleceu em 1984, por causa de cigarro. Eu odeio cigarro e tenho conversado... Esses meninos que me levam de táxi, os taxistas, são seis mocinhos. Tem o telefone, chama, ele já vem na mesma hora, às 9. Eles todos fumavam. Eu sempre falava: “Vocês vão se encrencar com isso.” Como o senhor vai? Tem filho?\nP/1 - Tenho.\nR - Tem?\nP/1 - Tenho.\nR - Então desliga, porque eu vou falar do seu filho. O senhor vai matar seu filho por causa do cigarro porque, se ele é pequeno, ele vai estranhar a falta do pai, entristece e morre. Tem acontecido muitas vezes isso, por isso que a gente está tirando o fumo. Eu faço... Quer ver? Olha aí o meu crachá. Está vendo aqui?\nP/1 - O adesivo de “Não fume”?\nR - Eu sou da comissão...\nP/2 - Campanha contra o fumo.\nR - Contra o fumo. Esses meninos me levavam,"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.568}, "INC_HV013_Radi Macruz": {"Áudio": {"MD_0885.wav": {"size_mb": 105.1182, "modified": "2011-07-16 21:07:34", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV013_Radi Macruz\\Áudio\\MD_0885.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 1249710.0, "duration": 1249.71}, "MD_0886.wav": {"size_mb": 363.4688, "modified": "2011-07-29 15:32:28", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV013_Radi Macruz\\Áudio\\MD_0886.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4321141.0, "duration": 4321.14}, "folder_size_gb": 0.458}, "Imagens": {"INC_HV013.xlsx": {"size_mb": 0.0115, "modified": "2020-02-27 11:55:32", "extension": "XLSX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV013_Radi Macruz\\Imagens\\INC_HV013.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nINC_HV013_FT001 | Radi Macruz | c. 1964 | s. l. | Atrás: Radi Macruz, Fúlvio Pileggi, Giovanni Bellotti, Wilson Cossermelli, Luís Gastão Serro Azul (de avental), João Tranchesi, Paulo Moffa, Ermelindo del Nero. Frente: Ruy Laurenti, não identificado, Seigo Tsuzuki, Luiz Décourt, não identificado. | Imagem não encontrada.\nINC_HV013_FT002 | Radi Macruz | c. 1964 | s. l. | Esq.-dir. (de trás para frente): Radi Macruz, Paulo Moff nsion": "3226x2526", "height": 2526, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3226x2526"}, "folder_size_gb": 0.054}, "folder_size_gb": 0.095}, "Textual": {"INC_HV013_Radi-Macruz_REV.docx": {"size_mb": 0.0365, "modified": "2018-07-30 13:58:30", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV013_Radi Macruz\\Textual\\INC_HV013_Radi-Macruz_REV.docx", "category": "Textual", "content_preview": "Incor\nDepoimento de Radi Macruz\nEntrevistado por Ignez Barreto e Cláudio Hiro \nSão Paulo, 28/10/2000\nEntrevista nº INC_HV013\nRealização: Museu da Pessoa\nTranscrito por Liamara Guimarães de Paiva\nRevisado por Genivaldo Cavalcanti Filho\nP/1 – Doutor Macruz, eu vou pedir primeiro que o senhor fale seu nome completo, data de nascimento e local de nascimento.\nR – Radi Macruz, 05 de julho de 1925, São Paulo.\nP/1 – São Paulo, capital. O nome dos seus pais?\nR – Kalil Macruz e Nini Macruz.\nP/1 – O senhor sabe a origem deles?\nR – Libaneses.\nP/1 – Vieram do Líbano?\nR – Do Líbano.\nP/1 – Eles vieram por conta da guerra? O senhor sabe?\nR – Não, pós-guerra. \nP/1 – O que os trouxe para o Brasil?\nR – Pós-guerra não, não digo que foi pós-guerra, foi um pouco antes da guerra de 14. Eles aportaram aqui mais ou menos em 1913.\nP/1 – E já eram casados?\nR – Não, se casaram aqui. Conheciam-se porque eram da mesma cidade.\nP/1 – Qual cidade?\nR - _____ ____. Uma cidade que fica na fronteira com Israel atualmente.\nP/1 – O senhor morou a vida inteira em São Paulo?\nR – Não.\nP/1 – Não?\nR – Não.\nP/1 – O senhor nasceu aqui?\nR – Eu nasci aqui, acho que com uns cinco anos fui para o interior.\nP/1 – Para que lugar?\nR"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.552}, "INC_HV014_Seigo Tsuzuki": {"Áudio": {"MD_0888.wav": {"size_mb": 378.7754, "modified": "2011-07-31 20:29:50", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psico n_ms": 0, "dimension": "1462x1054", "height": 1054, "dpi": 95.987, "color_mode": "RGBA", "duration": 0.0, "resolution": "1462x1054"}, "Dr Seigo Tsuzuki 008.tif": {"size_mb": 3.2988, "modified": "2025-07-03 10:20:56", "extension": "TIF", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV014_Seigo Tsuzuki\\Imagens\\Baixa\\Dr Seigo Tsuzuki 008.tif", "category": "Image", "duration_ms": 0, "dimension": "1406x1066", "height": 1066, "dpi": 95.987, "color_mode": "RGBA", "duration": 0.0, "resolution": "1406x1066"}, "folder_size_gb": 0.027}, "folder_size_gb": 0.048}, "Textual": {"INC_HV014_Seigo-Tsuzuki_REV.docx": {"size_mb": 0.1201, "modified": "2018-08-06 12:19:24", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV014_Seigo Tsuzuki\\Textual\\INC_HV014_Seigo-Tsuzuki_REV.docx", "category": "Textual", "content_preview": "Projeto Incor 25 anos\nDepoimento de Seigo Tsuzuki\nEntrevistado por Inês Barreto e José Carlos\nSão Paulo, 06/10/2000\nRealização Museu da Pessoa \nCódigo: INC_HV014\nTranscrito por Ronaldo Ventura Souza\nRevisado por Ligia Furlan\nP/1 - Instituto do Coração 25 anos, depoimento do doutor Seigo Tsuzuki, entrevistado por Inês Barreto e José Carlos Viladarga, São Paulo, cinco de novembro de 2000, realização Museu da Pessoa, entrevista INC 014.\nP/2 - Bom, doutor Seigo, eu queira que o senhor primeiro se identificasse, falasse o seu nome, local e data de nascimento.\nR - Bem, meu nome, como o Zé Carlos já disse, é Seigo Tsuzuki. Eu sou descendente de japoneses, imigrantes japoneses, nasci numa pequena cidade do Estado de São Paulo, chamada Promissão, no Noroeste do Brasil, lá é muito quente, e em 22 de setembro de 1932.\nP/2 – Trinta e dois.\nP/1 - O nome dos seus pais?\nR - Os meus pais: o meu pai chamava-se Sueyo Tsuzuki, ele foi imigrante que veio do Japão numa das primeiras levas de imigrante japonês naquela saga que todos vocês conhecem, e ainda veio jovem, criança ainda, com dois irmãos mais velhos, e a minha mãe, Hisako Tsuzuki, também que veio do Japão, né, como imigrante, se estabeleceram"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.794}, "INC_HV001_Luiz Venere Décourt": {"Acesso": {"INC_HV001_Luiz Venere Décourt.mp4": {"size_mb": 17301.4453, "modified": "2024-11-04 17:33:28", "extension": "MP4", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV001_Luiz Venere Décourt\\Acesso\\INC_HV001_Luiz Venere Décourt.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 9681906.0, "duration": 9681.91, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 16.896}, "Preservação": {"DVC_0291.avi": {"size_mb": 26142.572, "modified": "2019-08-06 10:17:30", "extension": "AVI", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV001_Luiz Venere Décourt\\Preservação\\DVC_0291.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 7422915.0, "duration": 7422.91, "resolution": "720x480", "fps": 29.97}, "DVC_0292.avi": {"size_mb": 675.611, "modified": "2019-08-06 10:54:06", "extension": "AVI", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV001_Luiz Venere Décourt\\Preservação\\DVC_0292.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 186904.0, "duration":  25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV001_Luiz Venere Décourt\\Textual\\INC_HV001_Luiz Venere Décourt_parte1_rev.docx", "category": "Textual", "content_preview": "Museu da Pessoa\nProjeto: Memorial do Incor – 25 anos\nDepoimento de Luiz Venere Décourt \nEntrevistado por Ricardo Guanabara e José Carlos Vilardaga\nSão Paulo, 29/09/2000\nRealização: Museu da Pessoa\nINC_HV001_Luiz Venere Décourt\nTranscrito por Beatriz Blay\nRevisado por Jader Chahine\nP/1 – Doutor Décourt, vou pedir para o senhor se apresentar diante das câmeras: nome completo, data de nascimento e o local de nascimento.\nR – O que você quer...\nP/1 – O nome completo, data de nascimento e local de nascimento.\nR – Luiz Venere Décourt, nascido em Campinas em sete de dezembro de 1911. \nP/1 – O nome dos pais do senhor? \nR – Pai, Paulo Luiz Décourt. Mãe, Alzira Venere Décourt.\nP/1 – O senhor conhece a origem da sua família? De onde ela vem?\nR – Sob o ponto de vista paterno, a minha família é de origem francesa, de Bordeaux. Meu avô era joalheiro e veio para o Brasil como um convidado de um técnico em joalheria. Do ponto de vista materno – Venere –, meus antepassados são italianos de Turim, no norte da Itália. Meus pais nasceram no Brasil, de maneira que eu me considero inteiramente brasileiro.\nP/1 – A atividade do pai do senhor? \nR – Fale um pouquinho mais alto.\nP/1 – A atividade do pai do se"}, "INC_HV001_Luiz Venere Décourt_parte2_rev.docx": {"size_mb": 0.0321, "modified": "2026-02-20 10:50:42", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV001_Luiz Venere Décourt\\Textual\\INC_HV001_Luiz Venere Décourt_parte2_rev.docx", "category": "Textual", "content_preview": "Museu da Pessoa\nProjeto: Memorial do Incor – 25 anos\nDepoimento de Luiz Venere Décourt (cont.)\nEntrevistado por Ricardo Guanabara e José Carlos Vilardaga\nSão Paulo, 03/10/2000\nRealização: Museu da Pessoa\nINC_HV001_Luiz Venere Décourt\nTranscrito por Beatriz Blay\nRevisado por Jader Chahine\nR – Tendo exposto de uma forma sintética alguns aspectos históricos e científicos da minha formação, eu passo agora a descrever, pelo menos rapidamente, algumas condições familiares e afetuosas, incluído também alguns colegas de turma e como que participaram da minha família. Em primeiro lugar, a minha família, minha senhora Guiomar Corrêa de Sampaio Décourt que, durante sessenta anos, me deu um lar de profunda harmonia, de grande compreensão e de apoio integral na minha vida profissional, ao ponto de ter atravessado períodos de grande sacrifício nos meus diferentes concursos. Onde como que, diante da necessidade do estudo... Como que nós afastávamos um pouco da própria família e Guiomar nunca me faltou com o seu auxílio, sempre com a máxima boa vontade, com grande amor, com grande confiança no meu futuro, sendo um grande apoio na minha família, no meu lar e na minha profissão. A minha filha Maria"}, "folder_size_gb": 0.0}, "Imagens": {"Album .tif": {"size_mb": 4.9507, "modified": "2025-06-26 12:43:08", "extension": "TIF", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV001_Luiz Venere Décourt\\Imagens\\Album .tif", "category": "Image", "duration_ms": 0, "dimension": "1161x1753", "height": 1753, "dpi": 95.987, "color_mode": "RGBA", "duration": 0.0, "resolution": "1161x1753"}, "contracapa album.png": {"size_mb": 4.8576, "modified": "2025-06-26 12:56:50", "extension": "PNG", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\INC\\HV\\INC_HV001_Luiz Venere Décourt\\Imagens\\contracapa album.png", "category": "Image", "duration_ms": 0, "dimension": "1205x1727", "height": 1727, "dpi": 95.96119999999999, "color_mode": "RGBA", "duration": 0.0, "resolution": "1205x1727"}, "Convite troféu guerreiro da educação Capa.tif": {"size_mb": 6.3077, "mod s da Luz": {"Áudio": {"MD_0850.wav": {"size_mb": 523.8926, "modified": "2011-07-27 11:41:46", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV001_Protásio Lemos da Luz\\Áudio\\MD_0850.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 6228358.0, "duration": 6228.36}, "folder_size_gb": 0.512}, "Textual": {"ISP_HV001_Protasio Lemos da Luz_rev.docx": {"size_mb": 0.0438, "modified": "2018-07-23 13:36:00", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV001_Protásio Lemos da Luz\\Textual\\ISP_HV001_Protasio Lemos da Luz_rev.docx", "category": "Textual", "content_preview": "Museu da Pessoa\nProjeto: Incor - ISP\nDepoimento de Protásio Lemos da Luz\nEntrevistado por José Carlos Vilardaga e Fernanda Serrano\nSão Paulo, 26/08/1999\nDepoimento ISP_HV001\nTranscrito por Stella Maris Scatena Franco\nRevisado por Fernanda Regina\nP/1 - Então, doutor Protásio, a primeira pergunta que a gente faz é pedir para o senhor se apresentar, o nome completo, data de nascimento e local de nascimento.\nR - Eu sou Protásio Lemos da Luz, eu nasci em 24 de Fevereiro de 1940, em Vacaria, no Rio Grande do Sul.\nP/1 - Vacaria?\nR - É.\nP/1 - E o nome dos pais do senhor?\nR - Meu pai chamava-se Salvador Neri da Luz e a minha mãe se chama Sueli Lemos da Luz.\nP/1 - Sueli Lemos?\nP/1 - E a atividade deles?\nR - Meus pais eram pequenos pecuaristas no interior do Rio Grande do Sul, de modo que nós lidávamos com um sítio relativamente pequeno e com atividade agrícola também pequena. Quando eu digo agrícola pequena, estou me referindo a atividades agrícolas referentes às necessidades da própria família, ou seja, nós não tínhamos produção agrícola. Nós tínhamos uma área de campo e a gente lidava em agricultura no que era necessário para a manutenção...\nR - Sueli Lemos da Luz.\nP/1 - Da família?\nR - É."}, "folder_size_gb": 0.0}, "folder_size_gb": 0.512}, "ISP_HV002_José Manoel Camargo Teixeira": {"Áudio": {"MD_0852.wav": {"size_mb": 353.7549, "modified": "2011-07-27 10:59:20", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV002_José Manoel Camargo Teixeira\\Áudio\\MD_0852.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4205656.0, "duration": 4205.66}, "MD_0853.wav": {"size_mb": 512.8086, "modified": "2011-07-29 15:16:12", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV002_José Manoel Camargo Teixeira\\Áudio\\MD_0853.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 6096585.0, "duration": 6096.59}, "folder_size_gb": 0.846}, "folder_size_gb": 0.846}, "ISP_HV003_Shoko Kimura": {"Áudio": {"MD_0866.wav": {"size_mb": 295.7364, "modified": "2011-08-01 04:19:40", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV003_Shoko Kimura\\Áudio\\MD_0866.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3515896.0, "duration": 3515.9}, "folder_size_gb": 0.289}, "Textual": {"ISP_HV003_Shoko-Kimura_REV.docx": {"size_mb": 0.0385, "modified": "2018-07-27 11:42:18", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV003_Shoko Kimura\\Textual\\ISP_HV003_Shoko-Kimura_REV.docx", "category": "Textual", "content_preview": "Projeto: InCor - ISP\nDepoimento de Shoko Kimura\nEntrevistado por José Carlos Vilardaga, Rosana Miziara e Sandra (InCor)\nSão Paulo, 27/08/1999\nDepoimento ISP_HV003_Shoko Kimura\nRealização: Museu da Pessoa\nTranscrito por Stella Maris Scatena Franco\nRevisado por Luiza Gallo Favareto\nP/1 - Dona Shoko, a gente começa perguntando para a senhora o seu nome, data de nascimento e local de nascimento.\nR - Está bom. Vou repetir tudo isso? (risos)\nP/2 - Esse é o problema do cadastro antes.\nR - Bom, eu me chamo Shoko Kimura, nasci no dia 28 de Fevereiro... O que mais mesmo?\nP/2 - A cidade de nascimento.\nR - Ah, em Lins, no interior do Estado de São Paulo, noroeste do Estado.\nP/1 - A data de nascimento?\nR - 28 de Fevereiro de 1942. Tem uma história interessante a respeito da data do meu nascimento. Isso contado pela minha mãe, o meu nome é Shoko, que significa filha de Cingapura tomada pelos japoneses durante a guerra.\nP/2 - Nossa!\nR - É, um nome, para a história, muito interessante! Eu trabalho muito isso com os meus alunos. Os japoneses aqui no Brasil eram considerados inimigos. Os que estavam na roça, nas fazendas, nos cafezais, perderam contato... Sempre tinha algum também puxando enxada o t"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.289}, "ISP_HV004_Iris Fenner Bertani": {"Áudio": {"MD_0858.wav": {"size_mb": 342.5442, "modified": "2011-07-30 13:26:16", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV004_Iris Fenner Bertani\\Áudio\\MD_0858.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4072377.0, "duration": 4072.38}, "folder_size_gb": 0.335}, "Textual": {"ISP_HV004_Íris-Fenner-Bertani_REV.docx": {"size_mb": 0.0261, "modified": "2018-07-23 12:51:44", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV004_Iris Fenner Bertani\\Textual\\ISP_HV004_Íris-Fenner-Bertani_REV.docx", "category": "Textual", "content_preview": "Projeto: Memorial do Incor - 25 anos\nDepoimento de Íris Fenner Bertani\nEntrevistada por Rosana, Sandro, José Carlos e Sandra do Incor\nSão Paulo, 30/08/1999\nRealização: Museu da Pessoa\nDepoimento ISP_HV004_Íris Fenner Bertani\nTranscrito por Marina D’Andréa\nRevisado por Luiza Gallo Favareto\nP/1 – Seu nome completo, data e local de nascimento. \nR – Iris Fenner Bertani. 13 de novembro de 44, em Curitiba, Paraná.\nP/1- Como foi a escolha da profissão, foi a sua primeira opção?\nR – É, uma das múltiplas primeiras opções (risos). Na época, não precisava escolher  tanto como hoje em dia. Você podia fazer vestibular em uma porção de lugares, desde que você não casasse o mesmo dia, mesmo horário. Quer dizer, não tinha Fuvest assim. Eu achava que era legal, foi em 63 que eu comecei a faculdade, então a minha idéia do Serviço Social era assim... Eu estar em cima de um banquinho, com os operários… Aquela coisa de conscientização, cidadania, aquelas coisas que acabou todo o mundo na cadeia (risos), mas era a idéia que a gente tinha de que o Serviço Social faria um trabalho com populações, tal, e a gente inclusive trabalhava em trabalhos comunitários, com alfabetização, na época era o método Paulo"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.335}, "ISP_HV005_André Isnard Leonardi": {"Áudio": {"MD_0890.wav": {"size_mb": 363.1465, "modified": "2011-08-02 21:51:36", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV005_André Isnard Leonardi\\Áudio\\MD_0890.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4317309.0, "duration": 4317.31}, "folder_size_gb": 0.355}, "Textual": {"ISP_HV005_André Isnard Leonardi_rev.doc": {"size_mb": 0.0957, "modified": "2018-07-25 10:26:50", "extension": "DOC", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV005_André Isnard Leonardi\\Textual\\ISP_HV005_André Isnard Leonardi_rev.doc", "category": "Textual"}, "ISP_HV005_André Isnard Leonardi_rev.docx": {"size_mb": 0.0259, "modified": "2026-02-20 10:50:46", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV005_André Isnard Leonardi\\Textual\\ISP_HV005_André Isnard Leonardi_rev.docx", "category": "Textual", "content_preview": "Museu da Pessoa\nProjeto: Memorial do Incor – 25 anos\nDepoimento de André Isnard Leonardi\nEntrevistado por Rosana Miziara e José Carlos\nLocal de gravação: Anfiteatro do Incor\nSão Paulo, 01/09/1999\nRealização: Museu da Pessoa\nISP_HV005_André Isnard Leonardi\nTranscrito por Rosana A. Gonçalves\nRevisado por Jader Chahine\nP/1 – André, para começar, vamos pedir para você repetir o seu nome.\nR – Meu nome é André Isnard Leonardi.\nP/1 – E a sua data de nascimento?\nR – 28 de agosto de 1970.\nP/1 – Você nasceu aonde?\nR – Eu nasci aqui em São Paulo, capital.\nP/1 – E seus pais?\nR – Meus pais também nasceram aqui.\nP/1 – Em São Paulo.\nR – Em São Paulo.\nP/1 – Qual é a origem da sua família, sua descendência?\nR – O meu pai é filho de italianos. A minha avó, mãe do meu pai, nasceu aqui, mas por acaso, porque a família trabalhava com comércio e ela foi criada na Itália até os dezesseis anos. Então ela tinha sotaque, era bem italiana. O meu avô era italiano mesmo, nasceu na Itália, viveu lá até a idade adulta e veio trabalhar aqui em São Paulo também. Da parte de pai, os dois com essa origem... Da parte de mãe, o meu avô é filho de franceses, de pai e mãe – Isnard –, e a minha avó eram mais misturados:"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.355}, "ISP_HV006_Bellkiss Wilma Romano": {"Áudio": {"MD_0880.wav": {"size_mb": 20.2891, "modified": "2011-07-16 13:52:44", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV006_Bellkiss Wilma Romano\\Áudio\\MD_0880.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 241209.0, "duration": 241.21}, "MD_0881.wav": {"size_mb": 139.6172, "modified": "2011-07-16 14:36:16", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV006_Bellkiss Wilma Romano\\Áudio\\MD_0881.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 1659855.0, "duration": 1659.86}, "MD_0882.wav": {"size_mb": 762.0, "modified": "2011-07-15 08:51:56", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV006_Bellkiss Wilma Romano\\Áudio\\MD_0882.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 9059126.0, "duration": 9059.13}, "folder_size_gb": 0.9}, "Textual": {"ISP_HV006_Bellkiss-Wilma-Romano_rev.doc": {"size_mb": 0.2119, "modified": "2018-07-27 10:42:40", "extension": "DOC", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV006_Bellkiss Wilma Romano\\Textual\\ISP_HV006_Bellkiss-Wilma-Romano_rev.doc", "category": "Textual"}, "ISP_HV006_Bellkiss-Wilma-Romano_rev.docx": {"size_mb": 0.066, "modified": "2026-02-20 10:50:48", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV006_Bellkiss Wilma Romano\\Textual\\ISP_HV006_Bellkiss-Wilma-Romano_rev.docx", "category": "Textual", "content_preview": "Projeto: Incor 25 anos\nDepoimento de Bellkiss Wilma Romano\nEntrevistado por Rosana Miziara e José Carlos Vilardaga\nSão Paulo, 01/09/1999\nRealização Museu da Pessoa\nCódigo: ISP_HV006\nTranscrito por Stella Maris Scatena Franco\nRevisado por Ligia Furlan\nP/2 - Projeto Serviço de Psicologia Incor 25 Anos, depoimento da doutora Bellkiss Wilma Romano, entrevistada por Rosana e José Carlos, Sandra, Fernanda e Cristiane.\nR - Assistida por... (risos)\nP/2 - Assistida por... (risos) São Paulo, 1º de Setembro de 1999, no anfiteatro do Incor, entrevista ISP 006.\nP/1 - É do entrevistador. Elas trouxeram uma lista aí que eu levei. (risos)\nR - Ah é?\nP/1 - É. (risos)\nR - Bom, eu me reservo o direito de não responder, certo? Perguntar pode sempre. (risos) Então pronto, eu estou calma.\nP/1 - Bom, doutora Bellkiss, para começar eu vou pedir para a senhora se identificar, aquilo era só uma claquete. (risos)\nR - Ah tá. Bom, eu costumo ser chamada de Bellkiss. Diretora do Serviço de Psicologia do Incor. É isso? O que mais você quer?\nP/1 - O ano do seu nascimento, a cidade...\nR - Meu Deus, que coisa horrorosa! (risos)\nP/1 - Ah, Bellkiss!\nR - Todo mundo fala, assim, fácil? A idade, tudo?\nP/1 - Nossa! Adora!"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.901}, "ISP_HV007_Ana Cristina de Oliveira Lino": {"Áudio": {"MD_0884.wav": {"size_mb": 243.2705, "modified": "2011-07-31 14:36:10", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV007_Ana Cristina de Oliveira Lino\\Áudio\\MD_0884.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 2892150.0, "duration": 2892.15}, "folder_size_gb": 0.238}, "Textual": {"ISP_HV007_Ana Cristina de Oliveira Lino_rev.doc": {"size_mb": 0.0762, "modified": "2018-07-24 06:57:52", "extension": "DOC", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV007_Ana Cristina de Oliveira Lino\\Textual\\ISP_HV007_Ana Cristina de Oliveira Lino_rev.doc", "category": "Textual"}, "ISP_HV007_Ana Cristina de Oliveira Lino_rev.docx": {"size_mb": 0.0247, "modified": "2026-02-20 10:50:50", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV007_Ana Cristina de Oliveira Lino\\Textual\\ISP_HV007_Ana Cristina de Oliveira Lino_rev.docx", "category": "Textual", "content_preview": "Projeto Serviço de Psicologia InCor- 25 anos \nDepoimento de Ana Cristina de Oliveira Lino\nEntrevistadores: José Carlos, Cristiane e Sandro \nSão Paulo, 02/09/1999\nSala 01 do InCor, 2o andar\nRealização Museu da Pessoa\nEntrevista ISP_HV007\nTranscrição: Marina D ‘Andréa\nRevisão: Gustavo Kazuo\nP/1 – Por favor, seu nome completo, data de nascimento e local de nascimento.\nR – Meu nome é Ana Cristina de Oliveira Lino, tenho 24 anos, nasci em 24 de dezembro de 1974, em Brasília.\nP/1 – Local de nascimento, onde você nasceu?\nR – Nasci em Brasília.\nP/1 - Brasília. Brasília mesmo?\nR - É Gama, Gama, DF, que é um município de Brasília.\nP/1 - E seus pais o que eles faziam? Fazem? O nome deles?\nR – O nome da minha mãe é Maria José de Oliveira Lima, minha mãe é do lar, sempre ficou em casa. Meu pai mexe em obras. Sempre mexeu com obras. Tanto em Brasília como pra Minas. \nP/1 – Você sabe a origem da sua família, de onde ela veio, seus avós, como é que surgiu assim? Da parte materna, parte paterna...?\nR – Olha, minha mãe, o que ela fala é que ela teve uma avó que veio da época dos escravos ainda, que no caso era minha bisavó, que ela lembra de ela falar pra ela também. O que eu sei dela é só isso, ass"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.238}, "ISP_HV008_Carmen Silva de Quadros": {"Áudio": {"MD_0887.mp3": {"size_mb": 106.2436, "modified": "2014-12-16 16:27:24", "extension": "MP3", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV008_Carmen Silva de Quadros\\Áudio\\MD_0887.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 6962755.0, "duration": 6962.76}, "folder_size_gb": 0.104}, "Textual": {"ISP_HV008_Carmem Silvia Quadros_rev.docx": {"size_mb": 0.0479, "modified": "2018-08-06 13:36:00", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV008_Carmen Silva de Quadros\\Textual\\ISP_HV008_Carmem Silvia Quadros_rev.docx", "category": "Textual", "content_preview": "Projeto: Memorial do Incor – 25 anos\nDepoimento Carmem Silvia de Oliveira Quadros\nEntrevistado por José Carlos, Cristiane Palotti e Sandro Cajé\nSão Paulo, 02/09/1999\nRealização: Museu da Pessoa\nDepoimento ISP_HV008\nRevisado por Fernanda Regina\nP/1 – Carmem, a primeira pergunta é seu nome completo. (risos) Data de nascimento e local de nascimento.\nR - É Carmem Silvia de Oliveira Quadros. Nasci em oito de janeiro de 1957, em São Paulo.\nP/1 - E o nome dos seus pais? A atividade deles?\nR - Meu pai se chamava Eli Quadros. Ele era juiz. Ele fez a carreira na magistratura. Nasceu em Cajubi, interior de São Paulo. E o nome da minha mãe era Carmem, como eu, ela nasceu em Florianópolis. O trabalho dela era em casa, com os filhos. Do lar, como falam.\nP/1 - Do lar. E você sabe a origem da sua família? Quer dizer, de onde que vem mesmo avós, bisavós?\nR - Sei. Da minha mãe, eles eram lá de Florianópolis. E era imigração alemã. Meu bisavô veio de Hamburgo, na Alemanha. E aí foi trabalhar como despachante aduaneiro. Então ela contava sempre essa história. Eles foram para Florianópolis, depois vieram para Santos e, no fim, para São Paulo. A família do meu pai, o pai dele era de Minas. Eles tinham u"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.104}, "ISP_HV009_Liris Therezinha Caracciolo": {"Áudio": {"MD_0878.wav": {"size_mb": 128.0502, "modified": "2011-07-16 15:15:14", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV009_Liris Therezinha Caracciolo\\Áudio\\MD_0878.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 1522339.0, "duration": 1522.34}, "MD_0879.wav": {"size_mb": 378.42, "modified": "2011-07-16 15:17:48", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV009_Liris Therezinha Caracciolo\\Áudio\\MD_0879.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4498889.0, "duration": 4498.89}, "folder_size_gb": 0.495}, "Textual": {"ISP_HV009_Líris Terezinha Caracciolo_REV.docx": {"size_mb": 0.0311, "modified": "2018-07-27 09:51:46", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV009_Liris Therezinha Caracciolo\\Textual\\ISP_HV009_Líris Terezinha Caracciolo_REV.docx", "category": "Textual", "content_preview": "Projeto: Memorial do Incor - 25 anos\nDepoimento de Líris Terezinha Caracciolo\nEntrevistada por José Carlos Vilardaga\nSão Paulo, 03/09/1999\nRealização: Museu da Pessoa\nDepoimento ISP_HV009_Líris Terezinha Caracciolo\nTranscritora: Marina D’ Andréa\nRevisado por Luiza Gallo Favareto\nP/1 – Dona Líris, por favor, repita o nome completo, data e local de nascimento.\nR – Ai! Vamos lá. Meu nome é Líris Terezinha Caracciolo. Nasci aqui em São Paulo, na Avenida Celso Garcia, no dia 2 de maio de 1936.\nP/1 – E seus pais?\nR – Papai era Francisco Caracciolo e minha mamãe era Leonor Biguelini Caracciolo.\nP/1 – O que seus pais faziam?\nR – O papai era do comércio. Depois de um certo tempo eles abriram uma oficina de confecção de lençóis... Bordavam, passavam, eles tinham treze funcionários. Isso tudo ficava dentro de minha casa mesmo. E com esse dinheiro puderam dar estudo para mim e para o meu irmão. Eu tenho um irmão só: Jair Pedro Caracciolo. Ele é advogado, mas hoje é bancário.\nP/1 – Sabe a origem da sua família? De onde ela veio?\nR – É de Villimpenta, Itália. Os meus avós são de lá. O papai veio da Itália e a mãe da mamãe, que era Catarina Mulatti, veio para o Brasil já trazendo um filho e aqui"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.495}, "ISP_HV010_Rogério dos Santos Ângelo": {"Áudio": {"MD_0894.wav": {"size_mb": 369.2969, "modified": "2011-07-30 17:38:16", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV010_Rogério dos Santos Ângelo\\Áudio\\MD_0894.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4390429.0, "duration": 4390.43}, "folder_size_gb": 0.361}, "Textual": {"ISP_HV010_Rogério dos Santos Ângelo_rev.doc": {"size_mb": 0.0859, "modified": "2018-07-25 08:42:16", "extension": "DOC", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV010_Rogério dos Santos Ângelo\\Textual\\ISP_HV010_Rogério dos Santos Ângelo_rev.doc", "category": "Textual"}, "ISP_HV010_Rogério dos Santos Ângelo_rev.docx": {"size_mb": 0.0283, "modified": "2026-02-20 10:50:52", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV010_Rogério dos Santos Ângelo\\Textual\\ISP_HV010_Rogério dos Santos Ângelo_rev.docx", "category": "Textual", "content_preview": "Serviço de Psicologia - InCor - 25 anos\nDepoimento de Rogério dos Santos Ângelo\nEntrevistado por: Rosana Miziara\nLocal de gravação: Sala de Reunião do InCor – São Paulo\nSão Paulo, 03/09/1999\nRealização Museu da Pessoa\nEntrevista ISP_HV010\nTranscrito por: Ester Galesi Gryga\nRevisado por: Gustavo Kazuo\nP/1 – Rogério, para começar você poderia falar seu nome completo.\nR – Rogério dos Santos Ângelo.\nP/1 – Local e a data do nascimento.\nR – São Paulo, 26/06/1960.\nP/1 – Seus pais são de São Paulo também?\nR – Meus pais são de São Paulo.\nP/1 – Seu pai e sua mãe?\nR – Meu pai e minha mãe.\nP/1 – E avós?\nR – A minha avó era portuguesa e a outra minha avó era italiana.\nP/1 – Portuguesa por parte de pai ou de mãe?\nR – Portuguesa por parte de pai e italiana por parte de mãe. Os avós, um eu não conheci, mas era brasileiro, e o outro era brasileiro.\nP/1 – Qual a atividade da sua família? Seu pai faz o quê?\nR – Meu pai hoje é aposentado, mas ele era funcionário da prefeitura e trabalhava na área de fiscalização.\nP/1 – E sua mãe?\nR – Minha mãe, quando casou, ela só ficou tomando conta da casa. Ela é do lar.\nP/1 – Você tem irmãos, irmãs?\nR – Tenho dois irmãos. Uma irmã e um irmão.\nP/1 – Quem é o mais v"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.361}, "ISP_HV011_Massahi Kimura": {"Áudio": {"MD_0895.wav": {"size_mb": 273.8438, "modified": "2011-07-31 15:57:16", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV011_Massahi Kimura\\Áudio\\MD_0895.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3255623.0, "duration": 3255.62}, "folder_size_gb": 0.267}, "Textual": {"ISP_HV011_Massaki Kimura_rev.doc": {"size_mb": 0.0649, "modified": "2018-07-25 08:42:14", "extension": "DOC", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV011_Massahi Kimura\\Textual\\ISP_HV011_Massaki Kimura_rev.doc", "category": "Textual"}, "ISP_HV011_Massaki Kimura_rev.docx": {"size_mb": 0.0225, "modified": "2026-02-20 10:50:56", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV011_Massahi Kimura\\Textual\\ISP_HV011_Massaki Kimura_rev.docx", "category": "Textual", "content_preview": "Nome do Projeto: Serviço de Psicologia - INCOR - 25 anos\nDepoimento de Massaki Kimura\nEntrevistado por: Rosana Miziara\nLocal de gravação: Sala 2 do Instituto do Coração – São Paulo\nSão Paulo, 03/09/1999\nRealização Museu da Pessoa\nEntrevista ISP_HV011\nTranscrito por: Ester Galesi Gryga\nRevisado por: Gustavo Kazuo\nP/1 – Sr. Massaki, o senhor prefere que chame de Massaki ou Kimura?\nR – Pode ser qualquer um.\nP/1 – Sr. Kimura. (risos)\nR – É, está bom.\nP/1 – O senhor poderia começar se identificando, seu nome completo.\nR – É Massaki Kimura\nP/1 – Onde você nasceu?\nR – Nasci em Lins, São Paulo, 6 de junho de 1940.\nP/1 – E como é o nome de seus pais?\nR – Meu pai, Satoshi Kimura e minha mãe, Kimie Kimura.\nP/1 – Eles nasceram em Lins também?\nR – Não. São naturais do Japão.\nP/1 – Eles são do Japão? \nR – São.\nP/1 – Seu pai é de que cidade?\nR – Meu pai é de Kumamoto e minha mãe é de Tóquio.\nP/1 – E eles se conheceram lá? Casaram-se lá?\nR – Não. Casaram-se aqui.\nP/1 – E por que o seu pai veio para cá? O senhor sabe?\nR – É, veio como imigrante. Atraído, naturalmente, pela onda de imigração japonesa no Brasil.\nP/1 – Que ano que ele veio?\nR – 1920 e qualquer coisa... Aí eu já...(risos) vou ficar dev"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.268}, "ISP_HV012_Morgana Masetti": {"Áudio": {"MD_0896.wav": {"size_mb": 439.3125, "modified": "2011-07-17 02:06:26", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV012_Morgana Masetti\\Áudio\\MD_0896.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 5222818.0, "duration": 5222.82}, "folder_size_gb": 0.429}, "Textual": {"ISP_HV012_Morgana Masetti_rev.rtf": {"size_mb": 0.1704, "modified": "2018-07-30 04:34:08", "extension": "RTF", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV012_Morgana Masetti\\Textual\\ISP_HV012_Morgana Masetti_rev.rtf", "category": "Textual"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.429}, "ISP_HV013_Gloria Heloise Perez": {"Áud nome é Glória Heloise Perez, o local de nascimento é São Paulo e a data é 13 de junho de 1959.\nP/1 - E o nome dos seus pais, o que eles faziam ou fazem?\nR - Bom, os dois são vivos. Meu pai é Antonio Perez Alcaide e Hermínia Perez. Meu pai mexe com comércio e minha mãe é dona de casa.\nP/1 - Você conhece a origem da sua família, de onde eles vieram?\nR - Meus pais são descendentes de espanhóis, todos os meus avós são espanhóis, eles vieram para o Brasil e começaram a trabalhar no comércio de sacaria para cereais, aí o meu avô paterno abriu uma empresa e os meus tios, todos os filhos homens, fizeram uma sociedade e sempre trabalharam nesse ramo e até hoje meu pai trabalha nessa área. Os meus tios não trabalham mais nessa área, mas ele continuou e, depois d"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.655}, "ISP_HV014_José Antonio Franchini Ramires": {"Áudio": {"MD_0875.wav": {"size_mb": 747.8614, "modified": "2011-07-15 08:52:22", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV014_José Antonio Franchini Ramires\\Áudio\\MD_0875.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 8891037.0, "duration": 8891.04}, "MD_0876.wav": {"size_mb": 531.3418, "modified": "2011-07-16 17:50:08", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV014_José Antonio Franchini Ramires\\Áudio\\MD_0876.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 6316919.0, "duration": 6316.92}, "folder_size_gb": 1.249}, "folder_size_gb": 1.249}, "ISP_HV015_Lino de Macedo": {"Áudio": {"MD_0891.wav": {"size_mb": 258.0, "modified": "2011-07-30 05:10:32", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV015_Lino de Macedo\\Áudio\\MD_0891.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3067263.0, "duration": 3067.26}, "MD_0892.wav": {"size_mb": 23.5508, "modified": "2011-07-16 21:46:40", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV015_Lino de Macedo\\Áudio\\MD_0892.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 279986.0, "duration": 279.99}, "MD_0893.wav": {"size_mb": 166.9942, "modified": "2011-07-16 22:23:08", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV015_Lino de Macedo\\Áudio\\MD_0893.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 1985329.0, "duration": 1985.33}, "folder_size_gb": 0.438}, "Textual": {"ISP_HV015_Lino-de-Macedo_REV.docx": {"size_mb": 0.0346, "modified": "2018-08-06 13:08:08", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV015_Lino de Macedo\\Textual\\ISP_HV015_Lino-de-Macedo_REV.docx", "category": "Textual", "content_preview": "Incor - Serviço de Psicologia 25 anos\nDepoimento de Lino de Macedo\nEntrevistado por Rosana Miziara Lopes e José Carlos Vilardaga\nSão Paulo, 13/09/1999\nRealização: Museu da Pessoa\nEntrevista nº ISP_HV015\nTranscrito por: Rosana A. Gonçalves\nRevisado por Genivaldo Cavalcanti Filho\nP/1 - Professor Lino, para começar, o senhor poderia repetir o seu nome completo?\nR -  Eu me chamo Lino de Macedo. \nP/1 - Qual é a sua data de nascimento?\nR -  Eu nasci no dia 12 de novembro de 1944. Em Frutal, Minas Gerais. \nP/1 - Seus pais são de Frutal?\nR - São. Meus pais são de Frutal. Tem uma característica interessante, eu acho, da minha vida porque meu pai era dono de uma escola e todos os meus irmãos são professores. Eu nasci dentro da escola em que ele era professor e dono, numa escola particular em Frutal. Ele dava aula para crianças, era escola fundamental, e minha mãe cuidava das crianças, fazia comida. \nNaquela época, na década de 40, os filhos de fazendeiros deixavam os filhos... Minha mãe cuidava dos filhos e meu pai ensinava as crianças, então eu sou de uma família de professores, na verdade. \nMinha mãe tem uma curiosidade interessante: ela fez até o terceiro ano primário só. E é uma coisa be"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.438}, "ISP_HV016_Maria Elenita Correa de Sampaio Favarato": {"Áudio": {"MD_0859.wav": {"size_mb": 305.1895, "modified": "2011-07-26 18:31:58", "extension": "WAV", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV016_Maria Elenita Correa de Sampaio Favarato\\Áudio\\MD_0859.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3628280.0, "duration": 3628.28}, "folder_size_gb": 0.298}, "Textual": {"ISP_HV016_Maria Elenita Favarato_rev.doc": {"size_mb": 0.0903, "modified": "2018-07-31 05:57:00", "extension": "DOC", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV016_Maria Elenita Correa de Sampaio Favarato\\Textual\\ISP_HV016_Maria Elenita Favarato_rev.doc", "category": "Textual"}, "ISP_HV016_Maria Elenita Favarato_rev.docx": {"size_mb": 0.0263, "modified": "2026-02-20 10:51:00", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV016_Maria Elenita Correa de Sampaio Favarato\\Textual\\ISP_HV016_Maria Elenita Favarato_rev.docx", "category": "Textual", "content_preview": "Projeto Serviço de Psicologia/InCor - 25 anos\nDepoimento de Maria Elenita Corrêa de Sampaio Favarato\nEntrevistada por José Carlos\nSão Paulo, 14/09/1999\nEntrevista número: ISP_HV016\nRealização: Museu da Pessoa\nTranscrito por Jeane C. Gonçalves\nRevisado por Natália Ártico Tozo\nP/1 – A primeira pergunta é seu nome completo, data e local de nascimento?\nR – Meu nome é Maria Elenita Corrêa de Sampaio Favarato. Nasci em 19 de maio de 1955 em São Paulo.\nP/1 – Seus pais, o nome deles? De onde eles são?\nR – Meu pai João Batista Corrêa de Sampaio nasceu em Itú, São Paulo. Minha mãe Odete Medalha Sampaio, também nascida em São Paulo.\nP/1 – Você sabe a origem da sua família? De onde que ela vem, sabe descendência, mais alguma coisa?\nR – Sei, conheço. Acho que assim, eu tive uma coisa boa. Famílias de origens diferentes eu acho que começa a dar pra gente uma de visão de mundo mais ampla desde o começo, cada um com a sua história de vida, com seus valores, então eu acho que isso vai enriquecendo as primeiras relações que a gente faz com o mundo, você vai ficando mais... Conhecendo realidades bem diferentes. A família do meu pai é de São Paulo há muitos anos, então é de origem brasileira há muitos"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.298}, "ISP_HV017_Mayla Cosmo": {"Textual": {"ISP_HV017_Mayla Cosmo_rev.doc": {"size_mb": 0.0791, "modified": "2020-02-27 12:23:52", "extension": "DOC", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV017_Mayla Cosmo\\Textual\\ISP_HV017_Mayla Cosmo_rev.doc", "category": "Textual"}, "ISP_HV017_Mayla Cosmo_rev.docx": {"size_mb": 0.023, "modified": "2026-02-20 10:51:02", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV017_Mayla Cosmo\\Textual\\ISP_HV017_Mayla Cosmo_rev.docx", "category": "Textual", "content_preview": "Museu da Pessoa\nProjeto: Memorial do Incor – 25 anos\nDepoimento de Mayla Cosmo\nEntrevistada por José Carlos\nSão Paulo, 18/08/1999\nRealização: Museu da Pessoa\nISP_HV017_Mayla Cosmo\nRevisado por Jader Chahine\nP/1 – A primeira pergunta é o seu nome completo, data e local de nascimento.\nR – Mayla Cosmo. Nasci em 27 de novembro de 1974, aqui em São Paulo.\nP/1 – E os seus pais? O nome deles, fazem o quê?\nR – O meu pai é José Roberto Cosmo, sociólogo, e minha mãe é Ercília Helena Daiane Cosmo, também socióloga.\nP/1 – Você passou a infância em São Paulo?\nR – Eu morei no interior de São Paulo, em São Carlos, depois passei um tempo aqui e estou no Rio há dezenove anos.\nP/1 – Essas mudanças têm a ver com a profissão dos pais?\nR – Profissão do pai. Meu pai recebeu uma proposta para ir trabalhar no Rio de Janeiro e a família mudou-se.\nP/1 – Você foi para o Rio com que idade?\nR – Cinco para seis anos.\nP/1 – Toda a sua formação educacional foi lá?\nR – Sim. Primário, ginásio, segundo grau.\nP/1 – Você estudou em quais escolas? O que você fez no primeiro e segundo grau?\nR – O primário foi no Colégio Jacobina e o segundo grau foi no Colégio Bahiense.\nP/1 – Que lembranças você tem e como foi estudar n"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "ISP_HV019_Michele Peixoto": {"Textual": {"ISP_HV019_Michele Peixoto_REV.doc": {"size_mb": 0.2675, "modified": "2020-02-27 12:24:18", "extension": "DOC", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV019_Michele Peixoto\\Textual\\ISP_HV019_Michele Peixoto_REV.doc", "category": "Textual"}, "ISP_HV019_Michele Peixoto_REV.docx": {"size_mb": 0.0299, "modified": "2026-02-20 10:51:06", "extension": "DOCX", "full_path": "D:\\Memorial Incor 25 Anos - Serviço de Psicologia do Instituto do Coração 25 Anos de História (INC-ISP)\\ISP\\HV\\ISP_HV019_Michele Peixoto\\Textual\\ISP_HV019_Michele Peixoto_REV.docx", "category": "Textual", "content_preview": "Nome do Projeto: Serviço de Psicologia INCOR 25 anos\nDepoimento de Michele Peixoto – Psicóloga do Cotoxó\nEntrevistado por: Rosana Miziara\nLocal de gravação: Hospital Auxiliar de Cotoxó – São Paulo\nSão Paulo, 2 de Setembro de 1999\nRealização Museu da Pessoa\nCódigo do depoente: ISP_HV019\nTranscrito por: Ester Galesi Gryga\nRevisado por Erick Vinicius de Araujo Borges\nP/1 – Michele, para começar eu gostaria que você se identificasse, falasse seu nome completo.\nR - Meu nome é Michele Peixoto Quevedo\nP/1 – Que ano você nasceu? Qual a data do seu nascimento?\nR - 09/07/1970. Tenho vinte e nove anos.\nP/1 – Você nasceu aonde?\nR - Fortaleza\nP/1 – Seus pais são de lá?\nR – São, todos moram lá. Eu moro aqui em São Paulo desde 1997.\nP/1 – E qual é atividade de seus pais lá? O que eles fazem?\nR - Meu pai é administrador de empresa, mas atualmente trabalha em serviço público, na Secretaria da Fazenda e minha mãe também trabalha em serviço público, no Tribunal de Contas dos Municípios.\nP/1 – Eles sempre foram funcionários públicos?\nR - Sempre foram. Meu pai é que tirou licença para interesse particular e trabalhou muito tempo em indústria de tecidos, indústria têxtil. Minha mãe sempre trabalhou em s"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "folder_size_gb": 7.771}, "folder_size_gb": 7.771}, "folder_size_gb": 66.539}, "Omilton Visconde (OVC)": {"HV": {"OVC_HV001_Wilson Visconde": {"Áudio": {"MD_0364.wav": {"size_mb": 574.0, "modified": "2011-07-30 23:32:36", "extension": "WAV", "full_path": "D:\\Omilton Visconde (OVC)\\HV\\OVC_HV001_Wilson Visconde\\Áudio\\MD_0364.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 6824066.0, "duration": 6824.07}, "folder_size_gb": 0.561}, "folder_size_gb": 0.561}, "OVC_HV002_Concheta Marano Canuti": {"Áudio": {"MD_0365.wav": {"size_mb": 34.5557, "modified": "2011-07-31 03:26:20", "extension": "WAV", "full_path": "D:\\Omilton Visconde (OVC)\\HV\\OVC_HV002_Concheta Marano Canuti\\Áudio\\MD_0365.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 410819.0, "duration": 410.82}, "folder_size_ const EXTENSIONS = {
    "Video": ['mp4', 'mov', 'mkv', 'avi', 'm4v', 'mts', 'm2ts', 'wmv', 'flv', 'webm', 'vob', 'ogv', '3gp', 'mxf'],
    "Audio": ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'aiff', 'pcm', 'aif'],
    "Image": ['jpg', 'jpeg', 'tif', 'tiff', 'png', 'gif', 'bmp', 'webp', 'cr2', 'nef', 'arw', 'dng'],
    "Textual": ['doc', 'docx', 'pdf', 'txt', 'rtf', 'odt', 'xls', 'xlsx', 'ppt', 'pptx']
};

const ICONS = { "Video": "🎞️", "Audio": "🎧", "Image": "🖼️", "Textual": "📝", "Other": "📄" };

function formatSmartSize(mbValue) {
    if (!mbValue || mbValue === 0) return "0 B";
    let bytes = mbValue * 1024 * 1024; 
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(2) + " " + units[i];
}

function getIcon(name, isFolder) {
    if (isFolder) return "📁";
    const ext = name.split('.').pop().toLowerCase();
    for (const [category, list] of Object.entries(EXTENSIONS)) {
        if (list.includes(ext)) return ICONS[category];
    }
    return ICONS["Other"];
}

function formatTime(ms) {
    if (!ms || ms === 0) return "N/A";
    let totalSeconds = Math.floor(ms / 1000);
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;
    return [hours, minutes, seconds].map(v => v < 10 ? "0" + v : v).join(":");
}

function tryLoadImage(imgElement, thumbnailPath, originalName) {
    if (!thumbnailPath && !originalName) return;
    let path = thumbnailPath || `thumbnails/thumb_${originalName.split('.').slice(0, -1).join('.')}.jpg`;
    imgElement.onerror = function() {
        this.onerror = null;
        this.src = 'https://via.placeholder.com/150?text=Sem+Preview';
    };
    imgElement.src = path;
}

function copyPreviewText() {
    const box = document.getElementById('preview-text');
    if (box) {
        navigator.clipboard.writeText(box.textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy Content"; }, 2000);
    }
}

function calculateFolderStats(node) {
    let stats = { Video: { count: 0, size: 0 }, Audio: { count: 0, size: 0 }, Image: { count: 0, size: 0 }, Textual: { count: 0, size: 0 }, Other: { count: 0, size: 0 }, totalSize: 0 };
    function traverse(curr) {
        for (let key in curr) {
            if (key === "folder_size_gb") continue;
            let item = curr[key];
            if (item.folder_size_gb !== undefined) traverse(item);
            else {
                let cat = item.category || "Other";
                if (!stats[cat]) cat = "Other";
                stats[cat].count++;
                stats[cat].size += item.size_mb || 0;
                stats.totalSize += item.size_mb || 0;
            }
        }
    }
    traverse(node);
    return stats;
}

function showMetadata(name, data, path) {
    const panel = document.getElementById("metadata-panel");
    const content = document.getElementById("meta-content");
    panel.style.display = "block";

    const isFolder = data.folder_size_gb !== undefined;
    let html = `
        <span class="meta-label">Nome</span><span class="meta-value">${name}</span>
        <span class="meta-label">Caminho</span><span class="meta-value">${data.full_path || path.join("/")}</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(data.full_path || "").replace(/\\/g, "\\\\")}')">Copy Path</button>
        <span class="meta-label">Tamanho</span><span class="meta-value" style="color:var(--accent); font-weight:bold;">${formatSmartSize(isFolder ? data.folder_size_gb * 1024 : data.size_mb)}</span>
    `;

    if (isFolder) {
        const stats = calculateFolderStats(data);
        const getPct = (size) => stats.totalSize > 0 ? ((size / stats.totalSize) * 100).toFixed(1) : 0;
        html += `
            <div class="stats-container">
                <span class="meta-label">Conteúdo</span>
                <div class="stats-bar">
                    <div class="bar-segment" style="width:${getPct(stats.Video.size)}%; background:var(--video)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Audio.size)}%; background:var(--audio)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Image.size)}%; background:var(--image)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Textual.size + stats.Other.size)}%; background:var(--other)"></div>
                </div>
                <div class="stat-row"><span>🎞️ Video</span><b>${stats.Video.count}</b></div>
                <div class="stat-row"><span>🎧 Audio</span><b>${stats.Audio.count}</b></div>
                <div class="stat-row"><span>🖼️ Images</span><b>${stats.Image.count}</b></div>
                <div class="stat-row"><span>📄 Docs / Other</span><b>${stats.Textual.count + stats.Other.count}</b></div>
            </div>`;
    } else {
        if (data.category === "Image" || data.thumbnail) {
            html += `<h3>Preview</h3>
                     <div class="img-preview-container">
                        <img id="preview-img" src="" alt="Carregando...">
                     </div>`;
            setTimeout(() => {
                const img = document.getElementById('preview-img');
                tryLoadImage(img, data.thumbnail, name);
            }, 50);
        }

        html += `<span class="meta-label">Modificado</span><span class="meta-value">${data.modified || "N/A"}</span>`;
        
        if (data.category === "Video") {
            // Garante que displayRes exista ou usa a dimensão original
            const displayRes = data.dimension || "N/A"; 
            
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Resolução</span><span class="meta-value">${displayRes}</span>
                <span class="meta-label">Duração / Áudio</span><span class="meta-value">${formatTime(data.duration_ms)} / ${data.audio_channels || "N/A"}</span>
                <span class="meta-label">Aspecto / FPS</span><span class="meta-value">${data.aspect_ratio || "N/A"} / ${data.frame_rate || "N/A"}</span>`;
        } else if (data.category === "Audio") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Duração</span><span class="meta-value">${formatTime(data.duration_ms)}</span>
                <span class="meta-label">Canais</span><span class="meta-value">${data.audio_channels || "N/A"}</span>`;
        } else if (data.category === "Image") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Dimensões</span><span class="meta-value">${data.dimension || "N/A"}</span>
                <span class="meta-label">DPI</span><span class="meta-value">${data.dpi || "N/A"}</span>`;
        }

        // NOVIDADE: Verifica explicitamente por content_preview ou categoria textual
        if (data.content_preview) {
            html += `<h3>Conteúdo do Documento</h3>
                     <div class="preview-box" id="preview-text">Loading content...</div>
                     <button class="copy-btn" onclick="copyPreviewText()">Copiar Conteúdo</button>`;
        }
    }
    
    content.innerHTML = html;

    // Sincronização garantida: espera o DOM atualizar para injetar o texto
    if (data.content_preview) {
        setTimeout(() => {
            const box = document.getElementById('preview-text');
            if (box) box.textContent = data.content_preview;
        }, 10);
    }
}

function renderColumn(node, level, path = []) {
    const explorer = document.getElementById("explorer");
    while (explorer.children.length > level) explorer.removeChild(explorer.lastChild);
    const col = document.createElement("div"); col.className = "column";
    const keys = Object.keys(node).filter(k => k !== "folder_size_gb").sort((a, b) => {
        const aIsF = node[a].folder_size_gb !== undefined;
        const bIsF = node[b].folder_size_gb !== undefined;
        return (aIsF !== bIsF) ? bIsF - aIsF : a.localeCompare(b);
    });
    keys.forEach(name => {
        const val = node[name];
        const isFolder = val.folder_size_gb !== undefined;
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `<span class="icon">${getIcon(name, isFolder)}</span> <span class="item-text">${name}</span>`;
        item.onclick = () => {
            Array.from(col.children).forEach(c => c.classList.remove('active'));
            item.classList.add('active');
            showMetadata(name, val, path.concat(name));
            if (isFolder) renderColumn(val, level + 1, path.concat(name));
            else while (explorer.children.length > level + 1) explorer.removeChild(explorer.lastChild);
        };
        col.appendChild(item);
    });
    explorer.appendChild(col);
}

function performSearch() {
    const term = document.getElementById("search").value.toLowerCase();
    const explorer = document.getElementById("explorer");
    if (!term) { renderColumn(TREE, 0); return; }
    const results = [];
    function searchNode(node, currentPath) {
        for (const key in node) {
            if (key === "folder_size_gb") continue;
            const item = node[key];
            const isFolder = item.folder_size_gb !== undefined;
            const match = key.toLowerCase().includes(term) || (item.content_preview && item.content_preview.toLowerCase().includes(term));
            if (match) results.push({ name: key, data: item, path: currentPath.concat(key), isFolder });
            if (isFolder) searchNode(item, currentPath.concat(key));
        }
    }
    searchNode(TREE, ["Root"]);
    explorer.innerHTML = "";
    const col = document.createElement("div"); col.className = "column"; col.style.minWidth = "100%";
    results.slice(0, 100).forEach(res => {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<span class="icon">${getIcon(res.name, res.isFolder)}</span> <div><b>${res.name}</b><br><small>${res.path.join("/")}</small></div>`;
        div.onclick = () => showMetadata(res.name, res.data, res.path);
        col.appendChild(div);
    });
    explorer.appendChild(col);
}

document.addEventListener("DOMContentLoaded", () => renderColumn(TREE, 0));
