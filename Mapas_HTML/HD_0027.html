_José Inácio Lermen\\Áudio\\MD_1244.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3679504.0, "duration": 3679.5}, "folder_size_gb": 0.814}, "Textual": {"APD_HV001_José-Inácio-Lermen_REV.docx": {"size_mb": 0.031, "modified": "2018-10-22 10:01:16", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV001_José Inácio Lermen\\Textual\\APD_HV001_José-Inácio-Lermen_REV.docx", "category": "Textual", "content_preview": "ABIFARMA 50 ANOS\nDepoimento de José Inácio Lermen\nEntrevistado por ____________\nPorto Alegre, 23/04/1997 \nRealização: Museu da Pessoa\nEntrevista nº APD_HV001\nTranscrito por Teresa Melo\nRevisado por Genivaldo Cavalcanti Filho\nP/1 - Começando o depoimento, eu gostaria que você se identificasse com o seu nome, local e data de nascimento.\nR - José Inácio Lermen. Nascimento: [em] Lajeado, Rio Grande do Sul, [em] cinco de janeiro de 52. \nP/1 - 52. Seus pais, o nome deles...\nR - Guido Arnold Lermen, advogado e Terezinha Schmidt Lermen, professora. \nP/1 - Certo. E o que você sabe da origem dos seu pais?\nR - A origem do meu pai… Ele tem a sua história, né? Ele é de uma família numerosa; na verdade, ela ficou numerosa por... Naquele tempo elas eram numerosas, em primeiro lugar. A mãe dele se casou com treze anos; ele é o filho mais velho, como eu. Com quatorze anos, ele já... Depois, não sei exatamente quanto tempo era, mas ela já estava com cinco ou seis filhos, meu pai tinha oito ou nove anos, e faleceu o pai dele. Aí a mãe dele se casou com um outro, que tinha cinco ou seis filhos, uma coisa assim. No final, eles tiveram “os meus, os teus, os nossos”, ficaram com dezesseis. Tanto que as f"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.814}, "APD_HV002_Afra Suassuna Fernandes": {"Áudio": {"MD_0817.wav": {"size_mb": 523.8049, "modified": "2011-07-11 17:19:10", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV002_Afra Suassuna Fernandes\\Áudio\\MD_0817.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 6227315.0, "duration": 6227.31}, "MD_0818.wav": {"size_mb": 304.6016, "modified": "2011-07-28 14:25:26", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV002_Afra Suassuna Fernandes\\Áudio\\MD_0818.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3621291.0, "duration": 3621.29}, "folder_size_gb": 0.809}, "Textual": {"APD_HV002_Afra-Suassuna-Fernandes_REV.docx": {"size_mb": 0.0267, "modified": "2018-08-06 12:24:50", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV002_Afra Suassuna Fernandes\\Textual\\APD_HV002_Afra-Suassuna-Fernandes_REV.docx", "category": "Textual", "content_preview": "Abifarma 50 anos\nDepoimento de Afra Suassuna Fernandes\nEntrevistado por Luís André do Prado \nRecife, 23/04/97\nEntrevista n° APD_HV002\nRealização: Museu da Pessoa\nTranscrito por Alexandre Sampaio de Carvalho\nRevisado por Luiza Gallo Favareto\nP/1 - Seu nascimento?\nR - Meu nome é Afra Suassuna Fernandes, eu nasci em Recife na maternidade do derby em 8 de outubro 1960.\nP/1 - Bom, eu queria saber também o nome dos seus pais e o que você sabe da origem deles?\nR - Tá. Meu pai se chama Alcides Fernandes da Costa e minha mãe chama-se Beta Seles Suassuna Fernandes. Ambos são paraibanos. Meu pai é de uma cidade chamada Itabaiana e minha mãe de uma cidade chamada Taperoá. Meu pai é do brejo da paraíba, seria mais ou menos uma área que não é tão seca, e minha mãe é do sertão. A família do meu pai é de origem muito humilde. Minha vó paterna inclusive chamava-se Francisca, era analfabeta, né, e meu avô paterno era comerciante.\nP/1 - Comerciante?\nR - Comerciante.\nP/1 - O nome dele?\nR - Era filho de Manoel, e no sertão da Paraíba tem o hábito de colocar um apelido. Então era Zé Maneco.\nP/1 - Zé Maneco?\nR - Zé Maneco.\nP/1 - Suassuna?\nR - Não, Fernandes da Costa.\nP/1 - Fernandes da Costa. Suassuna é"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.809}, "APD_HV003_Maria Enóia Dantas da Costa e Silva": {"Áudio": {"MD_0420.wav": {"size_mb": 370.4473, "modified": "2011-07-13 16:34:32", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV003_Maria Enóia Dantas da Costa e Silva\\Áudio\\MD_0420.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4404105.0, "duration": 4404.1}, "folder_size_gb": 0.362}, "Textual": {"APD_HV003_Maria-Enoia-Dantas-Costa-e-Silva_REV.docx": {"size_mb": 0.039, "modified": "2018-08-06 10:43:44", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV003_Maria Enóia Dantas da Costa e Silva\\Textual\\APD_HV003_Maria-Enoia-Dantas-Costa-e-Silva_REV.docx", "category": "Textual", "content_preview": "ABIFARMA 50 ANOS\nDepoimento de Maria Enoia Dantas Costa e Silva\nEntrevistado por _____________\nTeresina,  24/04/1997\nRealização: Museu da Pessoa\nEntrevista nº APD_HV003\nTranscrito por Patrícia Lelis Nogueira\nRevisado por Genivaldo Cavalcanti Filho\nP/1 - Vamos começar. Primeiramente, eu gostaria que você me dissesse o seu nome completo e data de nascimento.\nR - Meu nome é Maria Enoia Dantas Costa e Silva. Nasci em três de agosto de 51.\nP/1 - O nome dos seus pais, Enoia, e um pouco da origem da sua família, o que você sabe a respeito disso.\nR - Meu pai se chamava Waldemir Inácio Dantas, descendente de uma família portuguesa, e que tem toda uma história de burguesia. Como é que eu digo? [Ele] Fazia parte de uma família tradicional da minha cidade. Minha mãe é Olinda Rosa dos Santos Dantas, picoense, filha de um município do Piauí chamado Picos, que tinha origem… Meu avô era baiano.\nP/1 - Pelo lado da sua mãe então, seu avô era baiano. Qual era a atividade da família de seus avós maternos?\nR -  Eu não conheço bem a história do meu avô, conheço mais a história da família do meu pai porque....\nP/1 - Você não conheceu seus avós maternos?\nR -  Só a avó; minha avó era costureira. Eu sei ass"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.362}, "APD_HV008_Carmo Patrocínio Pinto": {"Áudio": {"MD_0436.wav": {"size_mb": 311.2891, "modified": "2011-07-13 15:08:08", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV008_Carmo Patrocínio Pinto\\Áudio\\MD_0436.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3700796.0, "duration": 3700.8}, "MD_0437.wav": {"size_mb": 308.0518, "modified": "2011-07-13 19:58:56", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV008_Carmo Patrocínio Pinto\\Áudio\\MD_0437.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3662309.0, "duration": 3662.31}, "folder_size_gb": 0.605}, "Textual": {"APD_HV008_Carmo Patrocínio Pinto_rev.doc": {"size_mb": 0.1045, "modified": "2018-08-10 07:58:06", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV008_Carmo Patrocínio Pinto\\Textual\\APD_HV008_Carmo Patrocínio Pinto_rev.doc", "category": "Textual"}, "APD_HV008_Carmo Patrocínio Pinto_rev.docx": {"size_mb": 0.0367, "modified": "2026-02-20 10:49:32", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV008_Carmo Patrocínio Pinto\\Textual\\APD_HV008_Carmo Patrocínio Pinto_rev.docx", "category": "Textual", "content_preview": "Projeto Abifarma 50 anos\nDepoimento de Carmo Patrocínio Pinto\nEntrevistado por Cláudia Leonor Oliveira\nPadre Bernardo, DF, 24/10/1997\nRealização Museu da Pessoa\nEntrevista APD_HV008\nTranscrito por Teresa Melo\nRevisado por Gustavo Kazuo\nP - Nós estamos em Padre Bernardo, município do entorno do Distrito Federal, hoje é 24 de abril de 1997, eu estou entrevistando o Sr. Carmo Patrocínio Pinto. Cláudia Leonor Oliveira. Queria começar a nossa entrevista, pedindo para o senhor repetir o nome  e o local, e a data de nascimento do senhor.\nR - Nome: Carmo Patrocínio Pinto; data de nascimento, 28 de julho de 1941; o local, Fazenda do Barreiro, município de Monte Alegre, Minas Gerais.\nP - Qual o nome dos pais do senhor?\nR - Juvenal Francisco Pinto e Maria Paulina de Jesus. \nP - Você sabe em que dia eles nasceram?\nR - É difícil. (riso)\nP - Não tem problema. (riso)\nR - O dia eu sei, né? O meu pai, dia 15 de setembro e minha mãe, 1o. de março. \nP - E o que é que eles faziam, ‘seu’ Carmo?\nR - Agricultura. Trabalhavam na agricultura.\nP - Fazendo o quê, exatamente?\nR - Olha, ele trabalhou muito tempo em roças de arroz, feijão, e depois, nos últimos 30 anos de vida dele, ele trabalhou cultivando exc"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.605}, "APD_HV009_Valderina Xavier de Sousa": {"Áudio": {"MD_0437.wav": {"size_mb": 308.0518, "modified": "2011-07-13 19:58:56", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV009_Valderina Xavier de Sousa\\Áudio\\MD_0437.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3662309.0, "duration": 3662.31}, "MD_0848.wav": {"size_mb": 356.3782, "modified": "2011-07-13 22:16:20", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV009_Valderina Xavier de Sousa\\Áudio\\MD_0848.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4236844.0, "duration": 4236.84}, "folder_size_gb": 0.649}, "Textual": {"APD_HV009_Valderina Xavier de Souza_rev.rtf": {"size_mb": 0.249, "modified": "2018-08-03 05:58:20", "extension": "RTF", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV009_Valderina Xavier de Sousa\\Textual\\APD_HV009_Valderina Xavier de Souza_rev.rtf", "category": "Textual"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.649}, "APD_HV011_Maria Inês Vasconcelos do Amaral": {"Áudio": {"MD_0848.wav": {"size_mb": 356.3782, "modified": "2011-07-13 22:16:20", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV011_Maria Inês Vasconcelos do Amaral\\Áudio\\MD_0848.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4236844.0, "duration": 4236.84}, "MD_1244.wav": {"size_mb": 309.4981, "modified": "2011-07-12 23:43:26", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV011_Maria Inês Vasconcelos do Amaral\\Áudio\\MD_1244.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3679504.0, "duration": 3679.5}, "folder_size_gb": 0.65}, "Textual": {"APD_HV011_Maria Inês Amaral_rev.docx": {"size_mb": 0.1459, "modified": "2018-08-07 13:51:36", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV011_Maria Inês Vasconcelos do Amaral\\Textual\\APD_HV011_Maria Inês Amaral_rev.docx", "category": "Textual", "content_preview": "Projeto Abifarma 50 anos\nDepoimento de Maria Inês Amaral\nEntrevistado por: Luis André \nLocal de gravação: Brasília \nRealização Museu da Pessoa\nCódigo do depoente: APD_HV11\nTranscrito por: Will/ Marta\nRevisado por Fernanda Regina\nP/ - Bom, então eu gostaria que você se identificasse com seu nome e data de nascimento...\nR - Bom, eu sou Inês, Inês Amaral, assim que todo mundo me conhece, é o nome do meu marido, não é o meu nome, mas ficou assim. Eu nasci no dia de 3 de Março de 1958.\nP/1 - E seu sobrenome?\nR - Maria Inês Vasconcelos do Amaral.\nP/1-Certo. E seus pais, o nome deles.\nR - Maria Teresinha Carvalho Vasconcelos e Francisco Daltra Vasconcelos.\nP/1 - E o que você sabe da origem dos seus pais? Ou dos seus avós também, dos dois lados?\nR - Ah, eu sei tudo, sei tudo. Adoro saber, (risos) Bom, o meu pai é natural de uma cidade do Norte do Ceará. O pai dele trabalhava na ferroviária, era alguém que cuidava daquela coisa da passagem de trens. Pessoas extremamente simples, a mãe dele morreu quando ele tinha mais ou menos 18 anos. Eles tinham uma vida comum, de pessoas que moram no interior, em uma cidade bastante pequena, com muitos filhos e meu pai era o mais novo da família. Quando"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.65}, "APD_HV022_Carlos Alberio de Alexandria Leite": {"Áudio": {"MD_0409.wav": {"size_mb": 378.0059, "modified": "2011-07-12 14:21:16", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV022_Carlos Alberio de Alexandria Leite\\Áudio\\MD_0409.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4493967.0, "duration": 4493.97}, "MD_0442.wav": {"size_mb": 383.4844, "modified": "2011-07-12 16:22:06", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV022_Carlos Alberio de Alexandria Leite\\Áudio\\MD_0442.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4559099.0, "duration": 4559.1}, "folder_size_gb": 0.744}, "folder_size_gb": 0.744}, "APD_HV023_Niedja Gorett Gomes da Silva": {"Áudio": {"MD_0442.wav": {"size_mb": 383.4844, "modified": "2011-07-12 16:22:06", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV023_Niedja Gorett Gomes da Silva\\Áudio\\MD_0442.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4559099.0, "duration": 4559.1}, "folder_size_gb": 0.374}, "folder_size_gb": 0.374}, "APD_HV025_Paulo Roberto de Santana": {"Áudio": {"MD_0846.wav": {"size_mb": 308.3965, "modified": "2011-07-12 01:46:42", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV025_Paulo Roberto de Santana\\Áudio\\MD_0846.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3666408.0, "duration": 3666.41}, "MD_0847.wav": {"size_mb": 309.4961, "modified": "2011-07-12 13:03:14", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV025_Paulo Roberto de Santana\\Áudio\\MD_0847.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3679480.0, "duration": 3679.48}, "folder_size_gb": 0.603}, "TEXTUAL": {"APD_HV025_Paulo Roberto de Santana_rev.docx": {"size_mb": 0.0882, "modified": "2018-08-23 12:01:40", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV025_Paulo Roberto de Santana\\TEXTUAL\\APD_HV025_Paulo Roberto de Santana_rev.docx", "category": "Textual", "content_preview": "Projeto Abifarma 50 anos\nDepoimento de: Paulo Roberto de Santana \nEntrevistado por:\nLocal de gravação: Camaragibe (Pernambuco)\nSão Paulo, 14 de maio de 1997\nRealização Museu da Pessoa\nCódigo do depoente: APD_HV025\nTranscrito por: Marcos Marsulo\nRevisado por Fernanda Regina Ferreira\nR:... Eu começo com a minha história de vida, o que quê ela tem a ver com o meu momento hoje, enquanto Prefeito.\nP/1: Isso! Bom, eu vou pedir pra o Senhor repetir pra mim o nome completo do Senhor, o local e a data de nascimento.\nR: Paulo Roberto de Santana, nasci no dia 18 de novembro de 1955, em Iputinga bairro de Recife.\nP/1: Bairro de Recife?\nR: Isso.\nP/1: Certo. Como seus pais se chamam?\nR: Manuel Venâncio de Santana, Luci de Santana e Maria Alice Alexandre de Santana.\nP/1: O que eles faziam?\nR: Acho que quando você pergunta um pouco dessa questão, o meu pai era enfermeiro prático. Ele veio do interior pra Recife em 30, veio a pé, uma parte da família ficou aqui em Camaragibe porque não pode entrar em Recife por conta da Revolução de 30. Ele voltou, depois ele entra em Recife vai trabalhar em algumas casas de família como jardineiro, depois ele vai trabalhar no hospital da Tamarineira e com as freir"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.603}, "APD_HV026_Vera Regina Paula Baroni": {"Áudio": {"MD_0415.wav": {"size_mb": 300.8379, "modified": "2011-07-13 21:03:18", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV026_Vera Regina Paula Baroni\\Áudio\\MD_0415.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3576546.0, "duration": 3576.55}, "MD_0451.mp3": {"size_mb": 55.0187, "modified": "2014-10-30 11:45:30", "extension": "MP3", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV026_Vera Regina Paula Baroni\\Áudio\\MD_0451.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 3605681.0, "duration": 3605.68}, "folder_size_gb": 0.348}, "TEXTUAL": {"APD_HV026_Vera Regina Paula Baroni_rev.doc": {"size_mb": 0.0767, "modified": "2018-08-23 13:37:12", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV026_Vera Regina Paula Baroni\\TEXTUAL\\APD_HV026_Vera Regina Paula Baroni_rev.doc", "category": "Textual"}, "APD_HV026_Vera Regina Paula Baroni_rev.docx": {"size_mb": 0.0247, "modified": "2026-02-20 10:49:34", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV026_Vera Regina Paula Baroni\\TEXTUAL\\APD_HV026_Vera Regina Paula Baroni_rev.docx", "category": "Textual", "content_preview": "Projeto Abifarma 50 anos\nDepoimento de Vera Regina Paula Baroni \nEntrevistado por Cláudia Leonor \nCamaragibe \nDia 14/05/97 \nEntrevista nº: APD_HV026\nTranscrito por Rosália Maria Nunes Henriques\nP/1 - Vera, eu vou pedir para você me repetir o seu nome completo, o local e data de nascimento.\nR - O meu nome completo é Vera Regina Paula Baroni, eu nasci em 16 de maio de 1945 no Rio de Janeiro.\nP/1 - Na cidade do Rio de Janeiro?\nR - Na cidade do Rio de Janeiro no bairro de Laranjeiras.\nP/1 - E qual é o nome dos seus pais?\nR - Geraldo Roberto dos Santos e Salustiana Paula dos Santos.\nP/1 - E que eles faziam, Vera?\nR - A minha mãe era empregada doméstica, originalmente, e depois ficou sendo mãe de família e o meu pai ele era motorista de táxi e policial. Mas a atividade dele principal era de policial.\nP/1 - Eles faziam as duas coisas ao mesmo tempo?\nR - É, ele fazia as duas coisas para complementar salário.\nP/1 - Ele era policial e motorista de táxi. Como ele coordenava os horários dele, você recorda?\nR - Porque o policial, ele não trabalhava todos os dias na polícia, ele trabalhava em plantões. Aí o momento que ele não estava trabalhando nos plantões ele trabalhava como motorista de táxi"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.348}, "APD_HV027_Maria José Francisco de Oliveira": {"Áudio": {"MD_0424.wav": {"size_mb": 295.9029, "modified": "2011-07-13 18:56:06", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV027_Maria José Francisco de Oliveira\\Áudio\\MD_0424.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3517875.0, "duration": 3517.88}, "folder_size_gb": 0.289}, "folder_size_gb": 0.289}, "APD_HV028_Rejane Maria dos Santos": {"Áudio": {"MD_0409.wav": {"size_mb": 378.0059, "modified": "2011-07-12 14:21:16", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV028_Rejane Maria dos Santos\\Áudio\\MD_0409.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4493967.0, "duration": 4493.97}, "folder_size_gb": 0.369}, "TEXTUAL": {"APD_HV028_Rejane Maria dos Santos_rev.docx": {"size_mb": 0.0555, "modified": "2018-08-27 06:01:50", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV028_Rejane Maria dos Santos\\TEXTUAL\\APD_HV028_Rejane Maria dos Santos_rev.docx", "category": "Textual", "content_preview": "Projeto Abifarma – 50 anos\nDepoimento de Rejane Maria dos Santos\nEntrevistada por Cláudia\nRecife, Pernambuco, 15/05/1997\nRealização: Museu da Pessoa\nEntrevista número: APD_HV028\nTranscrito por Teresa Melo\nRevisado por Natália Ártico Tozo\nP/1 – Recife, 15 de maio de 1997, estamos no bairro Vietnã conversando com a usuária do PACS [Programa de Agentes Comunitários de Saúde], Rejane Maria dos Santos. Rejane, eu vou pedir para você repetir o seu nome completo, em que cidade você nasceu e em que dia que você nasceu.\nR – Tá certo.\nP/1 – Então, fala.\nR – Meu nome é Rejane Maria dos Santos, eu nasci no dia 8 de fevereiro, tenho a idade, por se dizer...\nP/1 – Quantos anos você tem?\nR – Tenho 24 anos, tenho três filhas e moro no bairro do Vietnã.\nP/1 – E me fala uma coisa: você nasceu em que cidade?\nR – Eu nasci aqui mesmo, no Recife.\nP/1 – Em que bairro você nasceu?\nR – Nasci no bairro (Lucena?), o nome do lugar eu não sei.\nP/1 – E qual é o nome de seus pais?\nR – O nome do meu pai é José (Silveira?) dos Santos, Judite Maria dos Santos é o nome de minha mãe. Precisa o do meu esposo?\nP/1 – Mais tarde. E me fala uma coisa: o que é que seu pai faz?\nR – Meu pai era pedreiro. Pedreiro, trabalha e"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.369}, "APD_HV029_Suzane Brust": {"Áudio": {"MD_0416.wav": {"size_mb": 374.7637, "modified": "2011-07-13 17:55:38", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV029_Suzane Brust\\Áudio\\MD_0416.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4455422.0, "duration": 4455.42}, "MD_0442.wav": {"size_mb": 383.4844, "modified": "2011-07-12 16:22:06", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV029_Suzane Brust\\Áudio\\MD_0442.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4559099.0, "duration": 4559.1}, "folder_size_gb": 0.74}, "folder_size_gb": 0.74}, "APD_HV030_Walkiria de Barros Magalhães": {"Áudio": {"MD_0849.wav": {"size_mb": 356.0, "modified": "2011-07-14 10:35:20", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV030_Walkiria de Barros Magalhães\\Áudio\\MD_0849.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4232348.0, "duration": 4232.35}, "folder_size_gb": 0.348}, "TEXTUAL": {"APD_HV030_Walkiria de Barros Magalhães_rev.doc": {"size_mb": 0.1147, "modified": "2018-08-10 07:46:38", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV030_Walkiria de Barros Magalhães\\TEXTUAL\\APD_HV030_Walkiria de Barros Magalhães_rev.doc", "category": "Textual"}, "APD_HV030_Walkiria de Barros Magalhães_rev.docx": {"size_mb": 0.0352, "modified": "2026-02-20 10:49:36", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV030_Walkiria de Barros Magalhães\\TEXTUAL\\APD_HV030_Walkiria de Barros Magalhães_rev.docx", "category": "Textual", "content_preview": "Nome do projeto: Abifarma 50 anos\nDepoimento de: Walkiria de Barros Magalhães\nEntrevistada por: Cláudia Leonor\nLocal de gravação: Olinda, PE\nOlinda, 16/05/97\nRealização Museu da Pessoa\nCódigo do depoente: APD_HV030 \nTranscrito por: M. Cecilia Vianna Loeb\nRevisado por: Gustavo Kazuo\nP/1 – Olinda, 16 de maio de 1997. Unidade de Saúde da Família de Ilha de Santana entrevista com Walkiria de Barros Magalhães, agente comunitária de saúde. Walkiria, vou pedir pra você repetir pra mim seu nome completo, o local e a data de nascimento.\nR - Walkiria de Barros Magalhães, o local agora? O endereço?\nP/1 - Onde você nasceu?\nR - Casa Amarela, Recife.\nP/1 - Que dia que você nasceu?\nR - 22/11/56.\nP/1 - E qual que é o nome dos seus pais?\nR - José da Saúde Pereira Magalhães e Vanise Barros Magalhães.\nP/1 - Certo. Walkiria, você me falou que vocês eram em cinco irmãos, né? Como é que era tua casa lá em Casa Amarela? Descreve pra gente.\nR - Bem, eu não me lembro porque quando eu saí de Casa Amarela eu tinha dois anos de idade, então eu fui morar na Imbiribeira. Morei na Imbiribeira. Quando que eu cheguei na Imbiribeira eu tinha dois anos. \nP/1 - Emílio Ribeira?\nR - Na Imbiribeira. \nP/1 – Imbiribeira?"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.348}, "APD_HVXXX_Edja da Silva Lima": {"Áudio": {"MD_0451.mp3": {"size_mb": 55.0187, "modified": "2014-10-30 11:45:30", "extension": "MP3", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HVXXX_Edja da Silva Lima\\Áudio\\MD_0451.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 3605681.0, "duration": 3605.68}, "MD_0847.wav": {"size_mb": 309.4961, "modified": "2011-07-12 13:03:14", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HVXXX_Edja da Silva Lima\\Áudio\\MD_0847.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3679480.0, "duration": 3679.48}, "folder_size_gb": 0.356}, "folder_size_gb": 0.356}, "APD_HV048_Maria José de Nazareth": {"TEXTUAL": {"APD_HV048_Maria_José_de_Nazareth_rev.rtf": {"size_mb": 0.1266, "modified": "2018-08-21 13:36:42", "extension": "RTF", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV048_Maria José de Nazareth\\TEXTUAL\\APD_HV048_Maria_José_de_Nazareth_rev.rtf", "category": "Textual"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV004_Leda Faustino Costa": {"Textual": {"APD_HV004_Leda-Faustino-Costa_REV.docx": {"size_mb": 0.0364, "modified": "2018-08-08 13:58:32", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV004_Leda Faustino Costa\\Textual\\APD_HV004_Leda-Faustino-Costa_REV.docx", "category": "Textual", "content_preview": "Abifarma 50 anos\nDepoimento de Leda Faustino Costa\nEntrevistado por Luís André Prado\nBrasília, 24/04/1997\nEntrevista n° APD_HV004\nRealização: Museu da Pessoa\nRevisado por Luiza Gallo Favareto\nP/1 - Para começar eu queria que você se identificasse, porque isso é um depoimento, então quero que você diga o seu nome e data de nascimento.\nR - Está ok, pode começar?\nP/1 - Pode falar.\nR - Meu nome é Leda Faustino Costa, nasci em 03 de agosto de 1969, em Governador Valadares, Minas Gerais, tá?\nP/1 - Está certo, como é o nome dos seus pais?\nR - É, eu sou registrada em nome dos meus avós, mas a minha mãe chama (Nice Faustino da Costa?), meu pai Antônio Carlos Schettino.\nP/1 - Schettino?\nR - Schettino, italiano.\nP/1 - Schettino?\nR - É.\nP/1 - É, com S mudo?\nR - É, Sche.\nP/1 - Sche, está certo.\nR - De Governador Valadares lembro muito pouco e de Minas também, muito pouco, porque eu morei mais aqui em Brasília (____?).\nP/1 - O que você sabe dos seus pais, ou dos seus avós?\nR - Dos meus avós, eu conheci só minha avó.\nP/1 - Você conheceu só sua avó?\nR - Só minha avó materna, é porque o meu avô, eles se separaram e nem lembrança eu não tenho, eu conheço só a minha avó, ainda cheguei a conhecer.\nP/1"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV005_Lúcia Ribeiro Alves": {"Textual": {"APD_HV005_Lúcia Ribeiro Alves_rev.doc": {"size_mb": 0.0913, "modified": "2018-08-06 06:05:36", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV005_Lúcia Ribeiro Alves\\Textual\\APD_HV005_Lúcia Ribeiro Alves_rev.doc", "category": "Textual"}, "APD_HV005_Lúcia Ribeiro Alves_rev.docx": {"size_mb": 0.0271, "modified": "2026-02-20 10:49:40", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV005_Lúcia Ribeiro Alves\\Textual\\APD_HV005_Lúcia Ribeiro Alves_rev.docx", "category": "Textual", "content_preview": "Projeto Abifarma 50 anos \nDepoimento de Lúcia Ribeiro Alves\nEntrevistado por Luís André Prado\nDia da entrevista (?)\nRealização: Museu da Pessoa\t\nAPD_HV005_Lúcia Ribeiro Alves\nTranscrito por\nRevisado por Erick Vinicius de Araujo Borges\nP/1 - Então, gostaria que a senhora começasse dizendo seu nome completo e a data de nascimento.\nR - Meu nome é Lúcia Ribeiro Alves, nasci em 2 de junho de 1946.\nP/1 - Certo, a senhora nasceu onde?\nR - Nasci em Belo Horizonte, Minas Gerais.\nP/1 - Os seus pais, como é que eles se chamam?\nR - José Ribeiro de Souza e Francisca Teixeira de Souza, são falecidos já.\nP/1 - O que é que faziam os seus pais? A senhora sabe alguma coisa das origens deles também?\nR - Meu pai foi criado no interior, com muita dificuldade. Minha mãe não, quando tinha dois meses de idade, foi doada para a madrinha, porque a mãe faleceu e o pai não criou, foi criada com a madrinha com muita dificuldade, sofreu muito, mas muito mesmo, ela contava, trabalhou muito também. Meu pai também, sofreu muito para ser criado, coitado, trabalhou demais, passou muita dificuldade na vida sabe, muito mal orientado também mas, viveu, com dificuldades, mas foi, devagar foi.\nP/1 - O seu pai, você sabe"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV006_Tereza Cristina Alves Bezerra": {"Textual": {"APD_HV006_Tereza Cristina Alves Bezerra_rev.doc": {"size_mb": 0.0981, "modified": "2018-08-17 07:41:16", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV006_Tereza Cristina Alves Bezerra\\Textual\\APD_HV006_Tereza Cristina Alves Bezerra_rev.doc", "category": "Textual"}, "APD_HV006_Tereza Cristina Alves Bezerra_rev.docx": {"size_mb": 0.0293, "modified": "2026-02-20 10:49:42", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV006_Tereza Cristina Alves Bezerra\\Textual\\APD_HV006_Tereza Cristina Alves Bezerra_rev.docx", "category": "Textual", "content_preview": "Abifarma 50 anos\nDepoimento de Tereza Cristina Alves Bezerra\nEntrevistado por Claudia Leonor\nCidade, 23 de Abril de 1997\nRealização: Museu da Pessoa\nAPD_HV006_Tereza Cristina Alves Bezerra\nTranscrito por Lilian\nRevisado por Erick Vinicius de Araujo Borges\nP/1 - Tereza, vou pedir para você repetir o seu nome completo, o local e a data de nascimento.\nR - Tereza Cristina Alves Bezerra. Nasci num município do interior do Ceará chamado Acopiara e nasci em 29 de novembro de 1956. Fui a segunda filha de uma família de sete filhos.\nP/1 - Qual o nome dos seus pais?\nR - Meu pai chama-se Euclides Bezerra de Oliveira e minha mãe Francisca Albertina Alves Bezerra.\nP/1 - O que eles faziam?\nR - Minha mãe era dona de casa e meu pai vendia tecidos o tempo todo. Era um viajante e se acostumava muito naquela época. As grandes empresas, grandes fábricas de tecidos tinham revendedores e meu pai era um deles. Viajava pelo interior do Ceará e Paraíba e Rio Grande do Norte, vendendo tecidos até se aposentar. Hoje é aposentado e mora em Campina Grande.\nP/1 - E você lembra-se dos seus avós? O nome deles?\nR - Minha família, acho que como todo nordestino, é muito, não sei se seria reunida, mas muito junta. Mi"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV010_Maria Cristina Moreira Lima Carvalho": {"Textual": {"APD_HV010_Maria Cristina Moreira Lima Carvalho_rev.docx": {"size_mb": 0.0318, "modified": "2018-08-06 13:51:30", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV010_Maria Cristina Moreira Lima Carvalho\\Textual\\APD_HV010_Maria Cristina Moreira Lima Carvalho_rev.docx", "category": "Textual", "content_preview": "Nome do projeto: Abifarma 50 anos\nDepoimento de: Maria Cristina Moreira Lima Carvalho\nEntrevistado por: Ricardo Guanabara e Inês Barreto\nLocal de gravação: São Paulo\nSão Paulo, 24 de abril de 1997.\nRealização Museu da Pessoa\nCódigo do depoente: APD_HV10\nTranscrito por: Lilian\nRevisado por Fernanda Regina\nP/1- Queria pedir para você repetir seu nome completo, local e a data de nascimento.\nR- Meu nome é Maria Cristina Moreira Lima Carvalho. E nasci no dia 22 de dezembro de 1954, em São Luís do Maranhão.\nP/1- E o nome dos seus pais, Cristina?\nR- Meu pai se chama Claudomir Barbosa Moreira Lima e minha mãe Maria (Nazalete?) Borges Moreira Lima.\nP/1- O que eles faziam?\nR- Meu pai hoje é aposentado do Banco do Brasil e minha mãe é prendas, prendas domésticas (risos).\nP/1- Em quantos irmãos vocês eram, Cristina?\nR- Nós somos. Eu tenho quatro irmãos: três homens e uma mulher.\nP/1- E o seus avôs como que eles chamam?\nR- Maternos ou paternos?\nP/1- Os dois.\nR - Meu Avô paterno era José da Silva Borges e Maria Joaquina Hesketh de Oliveira Borges e meus avós maternos eram Bento Moreira Lima e Heloísa Barbosa Moreira Lima.\nP/1- O que eles faziam? Você lembra?\nR- Meu avô paterno era desembargador"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV013_Maria Augusta Ardenghi Balsan": {"Textual": {"APD_HV013_Maria Augusta Ardenghi Balsan_rev.rtf": {"size_mb": 0.3351, "modified": "2018-08-08 04:50:06", "extension": "RTF", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV013_Maria Augusta Ardenghi Balsan\\Textual\\APD_HV013_Maria Augusta Ardenghi Balsan_rev.rtf", "category": "Textual"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV014_Ivânia Maria Sotta": {"Textual": {"APD_HV014_Ivânia-Maria-Sotta_REV.docx": {"size_mb": 0.0302, "modified": "2018-08-13 08:35:02", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV014_Ivânia Maria Sotta\\Textual\\APD_HV014_Ivânia-Maria-Sotta_REV.docx", "category": "Textual", "content_preview": "Abifarma - 50 anos\nDepoimento de Ivânia Maria Sotta\nEntrevistado por Luiz André do Prado \nRodeio Bonito, 08/05/1997\nRealização: Museu da Pessoa\nEntrevista nº APD_HV014\nTranscrito por Luciana Tosetti e Paulo Tosetti\nRevisado por Genivaldo Cavalcanti Filho\nP/1 - Ivânia, vamos começar assim: você me fala o seu nome completo, a data de nascimento e o local em que você nasceu.\nR - Ivânia Maria Sotta. Nasci em Saltinho, Rodeio Bonito, em 19/6/67.\nP/1 - Ivânia, eu queria que você começasse falando um pouco sobre suas origens. O que você sabe sobre seus avós do lado de pai e do lado de mãe? Vamos começar pelo lado de pai.\nR - Os meus avós vieram de Erechim; são os dois italianos, de origem italiana. Vieram de Erechim morar em São José Planalto, onde residem até hoje.\nP/1 - Eles ainda são vivos?\nR - Ah, não. O meu avô já é morto; a minha avó está viva.\nP/1 - E o que eles faziam na vida?\nR - Eles trabalhavam na agricultura, na roça também. Eram agricultores.\nP/1 - Eles tinham terra?\nR - Tinham.\nP/1 - E o que plantavam?\nR - Plantavam milho, feijão, mandioca, soja. Viviam da agricultura. Criavam vaca de leite, vendiam leite, faziam queijo. \nP/1 - E você sabe se foi seu avô que veio da Itália o"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV015_Amauri Luiz Pissinin": {"Textual": {"APD_HV015_Amauri-Luiz-Pissinin_REV.docx": {"size_mb": 0.0322, "modified": "2018-08-13 07:13:22", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV015_Amauri Luiz Pissinin\\Textual\\APD_HV015_Amauri-Luiz-Pissinin_REV.docx", "category": "Textual", "content_preview": "Abifarma - 50 anos\nDepoimento de Amauri Luiz Pissinin\nEntrevistado por Luiz André e ________\nRedentora, 08/04/1997\nRealização: Museu da Pessoa\nEntrevista nº APD_HV015\nTranscrito por Paulo Tosetti e Luciana Tossetti\nRevisado por Genivaldo Cavalcanti Filho\nP/1 - Vamos começar então com a sua apresentação: nome completo, local de nascimento e data.\nR - Eu me chamo Amauri Luiz Pissinin, nasci em um distrito de Júlio de Castilhos - hoje é conhecido como Ivorá - em 3 de outubro de 1945.\nP/1 - Amauri, me fale um pouco sobre a origem de seus avós, do lado paterno e do lado materno, começando pelo lado paterno.\nR - Os meus avós…. A [minha] origem [é] descendência de italianos. Meu avô veio da Itália pequeno, se casou com minha avó, também da Itália, e marcaram residência neste distrito de Ivorá, Júlio de Castilhos. E ali criaram os filhos. Ele conseguiu viver até o período onde eu tive o prazer de conhecê-lo. Era uma pessoa típica de origem italiana, dinâmica, afetiva, enérgica. \nAssim começou a minha vida naquela cidade, Ivorá. Logo no começo, nos primeiros anos de vida, eu vim pra Seberi com meu pai e mais duas irmãs mais velhas que eu, onde nos radicamos em 1946, precisamente, e onde mor"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV016_Sandra Denise de Moura Sperotto": {"TEXTUAL": {"APD_HV016_Sandra-Denise-de-Moura-Sperotto_REV.doc": {"size_mb": 0.1646, "modified": "2020-02-13 19:58:40", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV016_Sandra Denise de Moura Sperotto\\TEXTUAL\\APD_HV016_Sandra-Denise-de-Moura-Sperotto_REV.doc", "category": "Textual"}, "APD_HV016_Sandra-Denise-de-Moura-Sperotto_REV.docx": {"size_mb": 0.0332, "modified": "2026-02-20 10:49:44", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV016_Sandra Denise de Moura Sperotto\\TEXTUAL\\APD_HV016_Sandra-Denise-de-Moura-Sperotto_REV.docx", "category": "Textual", "content_preview": "Nome do projeto: Abifarma − 50 anos\nDepoimento de Sandra Denise de Moura Sperotto \nEntrevistada por: Luiz André\nSanto Augusto, 09/05/1997\nRealização Museu da Pessoa\nCódigo do depoente: APD_HV016\nTranscrito por Luciana Tosetti e Paulo Tosetti\nRevisado por Ligia Furlan\nP/1− Bom, Sandra, eu vou começar assim: você fazendo a sua identificação com nome completo, data e local de nascimento.\nR− Bem, eu Sandra Denise de Moura Sperotto, nasci em 23 de janeiro de 1963, na cidade de Santo Augusto. E o que mais que era? (riso)\nP/1− (riso) É isso. Bom, vamos começar a nossa conversa com você me falando um pouco sobre as suas origens. Vamos pegar pelos seus avós pelo lado de pai e depois pelo lado de mãe. O que você conhece da história dos seus avós?\nR− Bem, meus avós paternos moravam em fazenda. O meu avô era de origem brasileira, e minha avó de origem alemã. Enfim, não se cultivou muito a história porque eles passaram por todo o período de perseguição na época da grande guerra, onde não se podia falar em alemão, então a gente perdeu isso dentro da trajetória da família, não se considerou isso por uma questão de perseguição na época das guerras. Até minha avó é viva. A própria história da famíl"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV017_Sandra Lorenzi Marques": {"TEXTUAL": {"APD_HV017_Sandra-Lorenzi-Marques_REV.docx": {"size_mb": 0.0356, "modified": "2018-08-06 12:25:00", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV017_Sandra Lorenzi Marques\\TEXTUAL\\APD_HV017_Sandra-Lorenzi-Marques_REV.docx", "category": "Textual", "content_preview": "Abifarma 50 anos\nDepoimento de Sandra Lorenzi Marques - Agente comunitária \nEntrevistado por Luís André Prado\nSanto Augusto, 09/05/1997 - Rio Grande do Sul \nEntrevista n° APD_HV017\nRealização: Museu da Pessoa \nTranscrito por Márcia\nRevisado por Luiza Gallo Favareto\nP/1 - Sandra, vamos começar, você faz uma identificação do seu nome completo, local e data de nascimento.\nR - Bom, meu nome é Sandra Lorenzi Marques, tenho 31 anos, trabalho no bairro São João, atendo 100, 314 famílias, que dá uma população de 1.080 habitantes, e...\nP/1 - Onde você nasceu?\nR - Nasci no município de Erechim.\nP/1 - Sei, quando?\nR - Dia 18 de Julho \nP/1 - De 1900 e...\nR - De 1965.\nP/1 - Você pode me falar um pouco sobre a sua família, do lado do seu pai, o que você sabe sobre a história dos seus avós, por exemplo, os pais do seu pai?\nR - Bom, os meus avós são imigrantes italianos, tanto do lado do pai, como da mãe.\nP/1 – Lorenzi...\nR - São Lorenzi tutti buona gente? (riso)\nP/1 - Buona gente, macarrone?\nR - Isso, isso, eles imigraram, vieram se conhecer no Brasil, daí...\nP/1 - Ah, os seu avós são imigrantes?\nR - Isso, eles são imigrantes italianos.\nP/1 - Você os conheceu, são vivos?\nR - São, quer dizer, agor"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV018_Jair Pereira": {"TEXTUAL": {"APD_HV018_Jair Pereira_rev.doc": {"size_mb": 0.0898, "modified": "2018-08-17 07:10:34", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV018_Jair Pereira\\TEXTUAL\\APD_HV018_Jair Pereira_rev.doc", "category": "Textual"}, "APD_HV018_Jair Pereira_rev.docx": {"size_mb": 0.0274, "modified": "2026-02-20 10:49:46", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV018_Jair Pereira\\TEXTUAL\\APD_HV018_Jair Pereira_rev.docx", "category": "Textual", "content_preview": "Projeto Abifarma 50 anos\nDepoimento de Jair Pereira\nEntrevistado por Luís André Prado\nLocal da Entrevista: PACS - Santo Augusto\nSanto Augusto, RS, 09/05/1997.\nRealização Museu da Pessoa\nCódigo do depoente: APD_HV018\nRevisado por Gustavo Kazuo\nP/1 - Queria começar, então, com você se apresentando, queria que você falasse o seu nome completo, a data de nascimento e o local, onde você nasceu?\nR - Bom, eu sou agente comunitário de saúde, Jair Pereira, eu sou nascido aos 17 de junho, 1971 e a minha residência, é a Pastelagem.\nP/1 - Você nasceu onde?\nR - Três de Maio.\nP/1 – Três de Maio fica aonde?\nR - (Pausa). É, é vizinho de Santa Rosa, né?\nP/1 - Santa Rosa.\nR - Para o lado de, Santa Rosa.\nP/1 - Mas aqui para oeste?\nR - Oeste?\nP/1 - Para oeste.\nR – Oeste.\nP/1 - No Rio Grande do Sul?\nR - Rio Grande do Sul.\nP/1 - E fala um pouquinho Jair, da história que você conhece dos seus avós, fala por parte de pai, o que é que você sabe, qual o nome dos seus avós, de onde é que eles vieram, o que é que eles faziam?\nR - É, os meus avós, até são falecidos, é o Reinaldo Pereira e Rosa, é até Reinaldo Estevão Pereira e a finada nona também, é Rosa Pereira.\nP/1 - Rosa Pereira?\nR - É, porque a gente, sab"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV031_Neilton Araujo de Oliveira": {"TEXTUAL": {"APD_HV031_Neílton-Araújo-de-Oliveira_REV.doc": {"size_mb": 0.1436, "modified": "2020-02-13 19:58:40", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV031_Neilton Araujo de Oliveira\\TEXTUAL\\APD_HV031_Neílton-Araújo-de-Oliveira_REV.doc", "category": "Textual"}, "APD_HV031_Neílton-Araújo-de-Oliveira_REV.docx": {"size_mb": 0.0393, "modified": "2026-02-20 10:49:50", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV031_Neilton Araujo de Oliveira\\TEXTUAL\\APD_HV031_Neílton-Araújo-de-Oliveira_REV.docx", "category": "Textual", "content_preview": "Projeto Abifarma − 50 anos\nEntrevista de Neílton Araújo de Oliveira\nEntrevistado por: Karen Worcman\nRealização Museu da Pessoa\nPalmas, 15/05/1997 \nCódigo do depoente: APD_HV031\nTranscrito por Rosália Maria Nunes Henriques\nRevisado por Ligia Furlan\nP/1 - Vou começar tudo de novo, perguntando o seu nome e o nome dos seus pais.\nR - Eu me chamo Neílton Araújo de Oliveira, a minha mãe se chama (Dosolina?) Girotto. Eu sou neto − por parte materna − de italianos, a minha mãe já nasceu aqui no Brasil, mas os meus avós vieram jovens ainda, da Itália. E o meu pai, que é baiano, chama-se Alcebíades Araújo de Oliveira. Eu nasci em Nova Veneza, uma colônia de italianos perto de Goiânia, capital do estado de Goiás. Morei lá até os três meses de idade, depois disso os meus pais se mudaram para o sertão. Morei na roça até os 10, 11 anos de idade, quando a gente foi para uma cidade menor, Itaporanga. Moramos um ano lá e depois fomos para Goiânia, onde eu fiz toda a minha formação escolar, primeiro e segundo grau. Quer dizer, os primeiros anos eu estudei na escola rural, mas a faculdade, inclusive, foi em Goiânia, a Faculdade de Medicina da Universidade Federal de Goiás, me formei em 75.\nP/1 – Exist"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV032_Teodoro Pasiku": {"TEXTUAL": {"APD_HV032_Teodoro-Pasiku_REV.docx": {"size_mb": 0.0399, "modified": "2018-09-18 11:38:52", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV032_Teodoro Pasiku\\TEXTUAL\\APD_HV032_Teodoro-Pasiku_REV.docx", "category": "Textual", "content_preview": "Abifarma 50 anos\nDepoimento de Teodoro Pasiku\nEntrevistado por Karen Worcman\nAldeia Rio do Sono,Tocantins, 15/05/1997.\nRealização: Museu da Pessoa\nEntrevista n° APD_HV032\nTranscrito por Luciana Tosetti e Paulo Tosetti\nRevisado por Luiza Gallo Favareto\nP/1 - Me diga onde você nasceu, Teodoro?\nR - Eu nasci na Aldeia Baixa Funda, onde vocês passaram.\nP/1 - Foi uma das primeiras que a gente passou?\nR - Foi na segunda. Na primeira vocês passaram no Brejo Comprido, a segunda é a Baixa Funda. É lá que eu nasci.\nP/1 - De lá pra cá quantos a gente passa?\nR - Da Baixa Funda pra cá?\nP/1 - Não. Lá de Tocantins, quando a gente entra, quantas aldeias tem no caminho?\nR - Tem muito, mas é só uma, duas, três, quatro. Só quatro que uma pessoa encontra, mas tem muitas aldeias que entra. Se uma pessoa quiser conhecer tem que entrar pra conhecer as aldeia. Mas no caminho, mesmo que uma pessoa saia de Tocantins, chegando pra cá só conhece a do Brejo Comprido, Baixa Funda, e Rio Preto, onde vocês passaram, é bem ali, e aqui, essa aldeia aqui.\nP/1 - Então você nasceu naquela. Quem morava lá? Seu pai, sua mãe?\nR - É, meu pai e minha mãe também. Lá era uma aldeia, uma aldeia grande. Aí os povos se espalhara"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV033_Antonia Carvalho Freitas": {"TEXTUAL": {"APD_HV033_Antônia Carvalho Freitas_rev.docx": {"size_mb": 0.063, "modified": "2018-08-21 08:34:40", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV033_Antonia Carvalho Freitas\\TEXTUAL\\APD_HV033_Antônia Carvalho Freitas_rev.docx", "category": "Textual", "content_preview": "Projeto 50 anos Abifarma\nDepoimento de Antônia Carvalho Freitas\nEntrevistada por Karen Worcmam\nS/l, 15/05/1997\nRealização: Museu de Pessoa\nAPD_HV033_Antônia Carvalho Freitas\nTranscrição \nRevisado por Erick Vinicius de Araujo Borges\nP - Qual é o seu nome todo?\nR - Meu nome é Antônia Carvalho de Freitas, sou agente comunitário de saúde há um ano e seis meses em Aliança do Tocantins. A minha é a área 2, faço Jardim Aliança e Parque União.\nP - Eu vou te perguntar umas coisas antes que é da sua vida. Onde você nasceu, Toinha?\nR - Pode chamar de Toinha. Eu nasci em Gurupi.\nP - Você nasceu quando?\nR - Em 16 de março.\nP - Como é o nome do seu pai?\nR - O meu pai se chama Juvenal Ramos de Freitas.\nP - E sua mãe?\nR - Carolina Isabel Carvalho.\nP - O que seu pai fazia.\nR - Meu pai (inaudível).\nP - Lá em Gurupi?\nR - Não eles estão morando aqui agora, no início em Gurupi, naquele tempo, agora é aqui.\nP - Ele já nasceu em Gurupi também?\nR - Não, meu pai é cearense e minha mãe é piauiense.\nP - E como que é foi? Eles se casaram aonde?\nR - Em Gurupi.\nP - Seu pai veio do Ceará para Gurupi? Você sabe essa história, você lembra?\nR - O meu pai primeiro foi para Trindade perto de Goiás. Lá ele foi criado"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV034_Manoel Batista da S. Vieira": {"TEXTUAL": {"APD_HV034_Manoel-Batista-da-Silva-Vieira_REV.doc": {"size_mb": 0.1001, "modified": "2020-02-13 19:58:40", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV034_Manoel Batista da S. Vieira\\TEXTUAL\\APD_HV034_Manoel-Batista-da-Silva-Vieira_REV.doc", "category": "Textual"}, "APD_HV034_Manoel-Batista-da-Silva-Vieira_REV.docx": {"size_mb": 0.027, "modified": "2026-02-20 10:49:52", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV034_Manoel Batista da S. Vieira\\TEXTUAL\\APD_HV034_Manoel-Batista-da-Silva-Vieira_REV.docx", "category": "Textual", "content_preview": "Projeto: Abifarma - 50 anos\nDepoimento de Manoel Batista da Silva Vieira\nEntrevistado por Karen\nTocantínia, 15/05/1997\nRealização Museu da Pessoa\nCódigo do Depoente: APD_HV034\nTranscrito por Luciana Tosetti e Paulo Tosetti\nRevisado por Ligia Furlan\nP/1- Bom, Manoel, antes de você me contar tudo isso que você ia me contar da Abifarma, eu queria te perguntar: onde você nasceu?\nR- Eu nasci em Maranhão, no município de Alto Parnaíba.\nP/1- E seu pai era de lá?\nR- Meu pai era de Alto Parnaíba.\nP/1- Quando você nasceu?\nR- Dia 3 de outubro de 1963.\nP/1- Como era o nome do seu pai e da sua mãe?\nR- Meu pai chama Joaquim Vieira de Souza, minha mãe (inaudível) da Silva Vieira.\nP/1- E o que é que eles faziam lá no Maranhão?\nR- Trabalhavam na roça junto com a gente, né, terra, a gente morava numa fazenda. O pessoal... Era muita gente que morava lá, a gente saía pra trabalhar na roça.\nP/1- Mas era roça de vocês ou era roça da fazenda?\nR- Não, era roça nossa, só que a gente pagava...\nP/1- O meio?\nR- Era arrendado. Assim, tinha 30% pra gente trabalhar com a roça. Por exemplo, se a gente colhesse 100 sacos de arroz, 30 sacos eram para o dono da terra.\nP/1- E isso você tinha quantos irmãos?\nR- Tinha"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV036_Francisco de Assis Alves de Oliveira": {"TEXTUAL": {"APD_HV036_Francisco de Assis Alves de Oliveira_rev.doc": {"size_mb": 0.1021, "modified": "2018-08-22 08:17:50", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV036_Francisco de Assis Alves de Oliveira\\TEXTUAL\\APD_HV036_Francisco de Assis Alves de Oliveira_rev.doc", "category": "Textual"}, "APD_HV036_Francisco de Assis Alves de Oliveira_rev.docx": {"size_mb": 0.0322, "modified": "2026-02-20 10:49:54", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV036_Francisco de Assis Alves de Oliveira\\TEXTUAL\\APD_HV036_Francisco de Assis Alves de Oliveira_rev.docx", "category": "Textual", "content_preview": "Projeto: Abifarma - 50 anos\nDepoimento de Francisco de Assis Alves de Oliveira\nEntrevistado por Karen Worcman\nLocal de gravação: Palmas, TO.\nPalmas, 13/05/1997\nRealização Museu da Pessoa\nCódigo do depoente: APD_HV036\nTranscrito por Luciana Tosetti e Paulo Tosetti\nRevisado por Gustavo Kazuo\nP/1: Francisco, eu queria começar perguntando qual é o seu nome, onde você nasceu e quando?\nR: Meu nome é Francisco de Assis Alves de Oliveira. Eu nasci em Gurupi, no Tocantins, antes era Goiás, né? No ano de 1971, dia 7 do mês 12.\nP/1: 1971?\nR: 71.\nP/1: Então você tem quantos anos hoje?\nR: 25.\nP/1: 25. E qual era o nome dos seus pais, Francisco?\nR: Crispim Alves de Oliveira, o nome do meu pai, e o da minha mãe Maria da Conceição Souza.\nP/1: E o quê que ele fazia, o seu pai? Ele também era dessa cidade? Qual era o nome da sua cidade mesmo?\nR: Gurupi. O nome da minha cidade é Gurupi. Não, o meu pai ele era maranhense, né? A cidade, eu não sei de que cidade ele era. Ele era construtor, trabalhava na área de construção civil, né?\nP/1: Hum, hum.\nR: E a minha mãe ela é do Piauí, mas foi criada na região do norte de Goiás, que passou a ser Tocantins agora.\nP/1: Hum, hum. E a sua mãe, ela trabalhava?\nR:"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV040_Rita de Cássia Nunes Almeida": {"TEXTUAL": {"APD_HV040_Rita de Cássia Nunes Almeida_rev.docx": {"size_mb": 0.0639, "modified": "2018-08-22 08:24:04", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV040_Rita de Cássia Nunes Almeida\\TEXTUAL\\APD_HV040_Rita de Cássia Nunes Almeida_rev.docx", "category": "Textual", "content_preview": "Projeto Abifarma - 50 anos\nDepoimento de Rita de Cássia Nunes Almeida\nAnanindeua, Pará, 24/05/1997\nRealização: Museu da Pessoa\nEntrevista número: APD_HV040\nRevisado por Natália Ártico Tozo\nP/1 – Bom, Rita, primeiro eu queria que você se apresentasse, falasse seu nome completo, a data e o local de nascimento.\nR – Meu nome é Rita de Cássia Nunes de Almeida. A data de nascimento é 30 de novembro de 1967.\nP/1 – Local?\nR – Maracanã, o local onde eu nasci. O bairro é São Miguel.\nP/1 – Vamos falar um pouquinho sobre a sua história. O que você sabe da origem dos seus avós? Vamos pegar pelo lado do pai pra ficar mais fácil.\nR – Bom, o que eu sei da história dos meus avós é mais sobre rigidez – a minha mãe fala que ele era muito rígido, que quando eles faziam qualquer coisa errada ele batia muito. Também tinha o sofrimento da minha avó, batia muito na minha avó.\nP/1 – O seu avô?\nR – O meu avô.\nP/1 – O seu avô era o quê?\nR – Era lavrador.\nP/1 – Lavrador?\nR – Isso.\nP/1 – E o nome dele?\nR – Raimundo da Costa Nunes.\nP/1 – Onde é que o seu Raimundo da Costa Nunes morava? De onde ele veio? Quais as origens dele?\nR – Ele morava em São Miguel do Itaquere, que é um município de Maracanã. A origem del"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV041_Amezilda Calandrini Santos": {"TEXTUAL": {"APD_HV041_Amezilda_Calandrini_Santos_rev.docx": {"size_mb": 0.0307, "modified": "2018-08-14 13:04:32", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV041_Amezilda Calandrini Santos\\TEXTUAL\\APD_HV041_Amezilda_Calandrini_Santos_rev.docx", "category": "Textual", "content_preview": "ABIFARMA 50 ANOS\nDepoimento de Amezilda Calandrini Santos\nPará, 24 de maio de 1997\nRealização Museu da Pessoa\nEntrevista nº APD_HV041\nRevisado por Fernanda Regina \nP/1 - Amezilda, eu queria começar com você fazendo a sua identificação. Queria que você falasse o seu nome completo, a data e o lugar que você nasceu.\nR - O meu nome é Amezilda Calandrini Santos.\nP/1 - A data do seu nascimento?\nR - Nasci no dia 29 de maio de 1948.\nP/1 - Onde?\nR - Em Belém do Pará.\nP/1 - Bom, então como eu tinha te dito, vamos fazer um pouquinho assim de história de vida. Quem são e o que você sabe da história dos seus avós por parte de pai pra começar?\nR - Meus avós, por parte de pai eu conheci só a minha avó, mas minha avó era uma senhora batalhadora.\nP/1 - Como ele chamava?\nR - Chamava-se Maria Calandrini. Então, ela lutava de tudo. Eu conheci a minha avó, mas o meu pai dizia que ela criou ele trabalhando.\nP/1 - Ela é o que, lavradora?\nR - Ela trabalhava com doces.\nP/1 - Doces? Fazia doces?\nR - É, tipo assim uma confeitaria. Ela fazia os docinhos dela e vendia os docinhos.\nP/1 - Ela fazia em casa mesmo?\nR - Fazia em casa os docinhos dela.\nP/1 - Aqui em Belém?\nR - Isto já aqui em Belém.\nP/1 - Ela nasceu"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV042_Luiz Claudio Pinheiro Chaves": {"TEXTUAL": {"APD_HV042_Luiz Cláudio Pinheiro Chaves_rev.doc": {"size_mb": 0.0981, "modified": "2018-08-15 07:39:52", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV042_Luiz Claudio Pinheiro Chaves\\TEXTUAL\\APD_HV042_Luiz Cláudio Pinheiro Chaves_rev.doc", "category": "Textual"}, "APD_HV042_Luiz Cláudio Pinheiro Chaves_rev.docx": {"size_mb": 0.0285, "modified": "2026-02-20 10:49:58", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV042_Luiz Claudio Pinheiro Chaves\\TEXTUAL\\APD_HV042_Luiz Cláudio Pinheiro Chaves_rev.docx", "category": "Textual", "content_preview": "Projeto Abifarma - 50 anos\nDepoimento de Luiz Cláudio Pinheiro Chaves\nMarapanim, Pará, 23/05/1997\nRealização: Museu da Pessoa\nEntrevista número: APD_HV042\nRevisado por Natália Ártico Tozo\nP/1 – Bom, então vamos começar com você me falando o seu nome completo, o local e a data de nascimento?\nR – Eu chamo Luiz Cláudio Pinheiro Chaves, sou de 24 de novembro de 1973, nasci em Belém, retornei ao Marapanim com cinco anos de idade e até agora estou aqui crescendo justamente com a minha comunidade desenvolvendo o trabalho de agente de saúde.\nP/1 – Foi bom isso, a gente relaxou mais um pouco...\nR – Pois é.\nP/1 – Agora, vamos começar lá dos seus avós. Você estava falando da origem dos seus avós, vamos pegar pelo lado do seu pai. Fala de novo o nome dos seus avós e aí a gente retoma aquela história da sua adoção.\nR – Bem, no meu caso, os meus avós faleceram também, chamam Alcides Pinheiro e Angélica Pinheiro. E tem por outro lado o meu pai adotivo, que se chamam Osmarina Gonçalves e Américo Chaves, meus avós.\nP/1 – Então pelo lado dos adotivos?\nR – Isso, eu coloquei praticamente os dois, que no caso Osmarina Gonçalves é adotivo e Américo Chaves também.\nP/1 – Então o seu registro de Chaves é p"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV043_Antônio Carlos Ferreira dos Santos": {"TEXTUAL": {"APD_HV043_Antônio Carlos Ferreira dos Santos_rev.rtf": {"size_mb": 0.2073, "modified": "2018-08-16 07:08:24", "extension": "RTF", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV043_Antônio Carlos Ferreira dos Santos\\TEXTUAL\\APD_HV043_Antônio Carlos Ferreira dos Santos_rev.rtf", "category": "Textual"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV044_Dovanildo Barbosa Rodrigues": {"TEXTUAL": {"APD_HV044_Dovanildo-Barbosa-Rodrigues_REV.doc": {"size_mb": 0.0947, "modified": "2020-02-13 19:58:40", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV044_Dovanildo Barbosa Rodrigues\\TEXTUAL\\APD_HV044_Dovanildo-Barbosa-Rodrigues_REV.doc", "category": "Textual"}, "APD_HV044_Dovanildo-Barbosa-Rodrigues_REV.docx": {"size_mb": 0.0249, "modified": "2026-02-20 10:50:00", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV044_Dovanildo Barbosa Rodrigues\\TEXTUAL\\APD_HV044_Dovanildo-Barbosa-Rodrigues_REV.docx", "category": "Textual", "content_preview": "Abifarma − 50 anos\nDepoimento de Dovanildo Barbosa Rodrigues\nEntrevistado por \nPonta de Pedras, 21/05/1997\nRealização Museu da Pessoa\nCódigo do depoente: ADP_HV044\nTranscrito por Lilian\nRevisado por Ligia Furlan\nP/1 - Senhor Dovanildo, vamos começar com você dando o seu nome completo, dizendo onde você nasceu e a data de nascimento.\nR - Dovanildo Barbosa Rodrigues, eu nasci em Mangabeira, município de Ponta de Pedras, no dia 20 de outubro de 1977.\nP/1 - Setenta não, 57.\nR – Cinquenta e sete.\nP/1 - Vamos falar um pouco da história dos seus antepassados. Tudo bem conversar sobre isso?\nR - Pode sim.\nP/1 - O que é que você sabia da história dos seus avôs, pelo lado do seu pai?\nR - Pelo lado do meu pai eu acho que os meus avós tinham uma vida... Para mim, acho que era boa, porque quando eu vi meus avós, eles viviam bem, só que ele tinha um problema. Por exemplo, o meu avô por parte do meu pai... Porque ele bebia né, e quando ele bebia, tinha problema com a velha, queria bater. Mas quando passava aquilo, ele era outra pessoa. Outra coisa também, ele tinha um negócio de ser assim, macumbeiro, sabe? Ele entendia essas coisas assim também, e com isso ele fazia alguma coisa pelo pessoal que"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV045_Hirades Ribeiro Rebello": {"TEXTUAL": {"APD_HV045_Hirades-Ribeiro-Rebelo_REV.docx": {"size_mb": 0.0411, "modified": "2018-08-15 12:45:54", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV045_Hirades Ribeiro Rebello\\TEXTUAL\\APD_HV045_Hirades-Ribeiro-Rebelo_REV.docx", "category": "Textual", "content_preview": "Abifarma 50 anos\nDepoimento de Hirades Ribeiro Rebêlo\nPonta de Pedras, Pará, 21/05/1997\nRealização: Museu da Pessoa\nEntrevista n° APD_HV45\nTranscrito por Lilian\nRevisado por Luiza Gallo Favareto\nP/1 - Bom, Hirades, eu queria que você começasse dizendo seu nome completo, a data e o local onde você nasceu.\nR - Meu nome é Hirades Ribeiro Rebelo. Eu nasci em 23 de julho de 52, na localidade de Rio Paricatuba.\nP/1 - Em Ponta de Pedras?\nR - Em Ponta de Pedra e atualmente eu estou trabalhando na comunidade de Rio Cunha, Paraná.\nP/1 - Certo. Você quer ficar mais à vontade? Aqui o microfone pega bem distante, você pode ficar tranquila, pode ficar relaxada com o microfone. Eu queria que você me contasse primeiro, Hirades, sobre a origem da sua família. O que você conhece da história dos seus avós por parte de pai?\nR - Olha, os meus avós, eles eram pessoas que vieram das ilhas, os pais do meu pai, né? Eles vieram... Os cearenses vieram pra trabalhar, como...\nP/1 - Trabalhar nas ilhas? Fazendo o quê?\nR - Eles cortavam seringa, faziam roças, sabe? Era a maior parte do trabalho deles. Aí vieram e chegaram pra cá, tiveram já os filhos e meu pai era descendente de cearense, né?\nP/1 - De que lugar"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV046_Aroldo Vieira Ferreira": {"TEXTUAL": {"APD_HV046_Aroldo_Vieira_Ferreira_rev.docx": {"size_mb": 0.0303, "modified": "2018-08-14 13:02:56", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV046_Aroldo Vieira Ferreira\\TEXTUAL\\APD_HV046_Aroldo_Vieira_Ferreira_rev.docx", "category": "Textual", "content_preview": "ABIFARMA 50 ANOS\nDepoimento de Aroldo Vieira Ferreira\nPará, Ponta de Pedra, 22 maio de 1997\nRealização Museu de Pessoa\nCódigo do depoente: APD_HV046\nTranscrito por Lilian\nRevisado por Fernanda Regina\nP/1 - Vamos fazer o seguinte, me diz o seu nome completo, sua data de nascimento, e o local que você nasceu, aí depois a gente vai perguntar outras coisas.\nR - Meu nome é Aroldo Vieira Ferreira. A minha data de nascimento é 02 de setembro de 67. A localidade que eu nasci é Tartarugueiro.\nP/1 - Aroldo, o que é que você sabe sobre a história dos seus avós, do lado de pai?\nR - Olha, lá nós somos uma comunidade de escravos, nossos primeiros antepassados, nossos bisavós, foram para lá como escravos, uma comunidade pequena. Então eles chegaram lá mandados por alguém pra tomar conta das terras. Era uma família só, né? E depois chegou outra família, e dessas duas famílias lá foi se levantando o povoado.\nP/1 - Quem é que mandou, quem é... Os seus avós foram pra lá como escravos pra tomar conta, era uma fazenda de alguém?\nR - Não, só terras mesmo.\nP/1 - Só terras, pra povoar.\nR - Aí, eles foram para lá. Lá também foi onde funcionou um dos primeiros matadouros de Belém.\nP/1 - Matadouros de bovino"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "APD_HV047_Deusenir Pereira da Silva": {"TEXTUAL": {"APD_HV047_Deusenir-Pereira-da-Silva_REV.doc": {"size_mb": 0.061, "modified": "2020-02-13 19:58:40", "extension": "DOC", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV047_Deusenir Pereira da Silva\\TEXTUAL\\APD_HV047_Deusenir-Pereira-da-Silva_REV.doc", "category": "Textual"}, "APD_HV047_Deusenir-Pereira-da-Silva_REV.docx": {"size_mb": 0.0157, "modified": "2026-02-20 10:50:02", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\APD\\HV\\APD_HV047_Deusenir Pereira da Silva\\TEXTUAL\\APD_HV047_Deusenir-Pereira-da-Silva_REV.docx", "category": "Textual", "content_preview": "Projeto Abifarma − 50 anos\nDepoimento de Deusenir Pereira da Silva\nEntrevistado por Karen Worcman\nAliança, 15/05/1997\nRealização Museu da Pessoa\nCódigo APD_HV047\nTranscrito por Marina D’Andréa\nRevisado por Ligia Furlan\nP/1 - Fala aí como é o seu nome inteiro. \nR - Deusenir Pereira da Silva Borges, me chamam de Morena.\nP/1 - Por quê?\nR - Bom, eu ganhei vários apelidos. Quando eu nasci, meu tio disse que eu era Preta, e foi o primeiro apelido que ganhei, no dia que eu nasci.\nP/1 - Morena, quando você nasceu, o que aconteceu? \nR - Meu tio descobriu que eu era mais morena do que os outros, e me colocou o primeiro apelido que eu ganhei, que foi de Preta. Depois, quando eu cresci − eu não uso mais o meu apelido − eles começaram a me chamar de Morena, porque acharam que o meu nome era muito difícil, “Deusenir”. \nP/1 - E o seu nome é por causa de que? \nR - A minha mãe, acho que ela começou. Ela colocou o nome do meu irmão mais velho, Daniel, e ela quis seguir o “D”, aí a segunda, Deuselina, a terceira Deusenir, e se não morresse um que nasceu, ela tinha prosseguido com o D.\nP/1 - E como era no nome da sua mãe?\nR - O nome da minha mãe − ela ainda é viva − é Joselina Alves da Silva. O meu pa"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "folder_size_gb": 8.063}, "folder_size_gb": 8.063}, "ATD": {"HV": {"ATD_HV001_Paulo Queiroz Marques": {"Áudio": {"MD_0819.wav": {"size_mb": 372.834, "modified": "2011-07-28 15:05:12", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV001_Paulo Queiroz Marques\\Áudio\\MD_0819.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4432480.0, "duration": 4432.48}, "MD_0820.wav": {"size_mb": 226.9395, "m os Marsulo\nRevisado por Gustavo Kazuo\nP/1: Então Dr. Paulo vamos começar com a sua identificação, queria que o senhor me dissesse o seu nome completo, data e local de nascimento.\nR: Meu nome é Paulo Queiroz Marques, eu nasci em Itaberá, estado de São Paulo em 1921 e tenho, portanto, 76 anos.\nP/1: Dr. Paulo, dentro daquela perspectiva que a gente estava conversando queria pegar um pouco das suas origens familiares. O que o Senhor poderia nos contar da origem dos seus avós? Vamos pegar por parte de pai, pra gente ter um começo.\nR: É... por coincidência eu tenho uma árvore genealógica do lado materno, do lado paterno eu sei, por exemplo, que o nome do meu avô era Francisco Marques e da minha avó eu não tenho muita certeza me parece que era (PAUSA). Era ... eu tenho lapso de memória com relação a minha avó, um problema; mas do lado paterno eu já tenho algumas informações que a família lá no interior da cidade onde morava, que era Faxina que atualmente chama-se Itapeva"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.752}, "ATD_HV002_Almiro dos Reis Junior": {"Áudio": {"MD_0821.wav": {"size_mb": 315.3545, "modified": "2011-07-28 15:31:52", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV002_Almiro dos Reis Junior\\Áudio\\MD_0821.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3749129.0, "duration": 3749.13}, "MD_0822.wav": {"size_mb": 207.2998, "modified": "2011-07-17 17:57:34", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV002_Almiro dos Reis Junior\\Áudio\\MD_0822.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 2464508.0, "duration": 2464.51}, "folder_size_gb": 0.51}, "IMAGENS": {"ATD_HV002.xlsx": {"size_mb": 0.0129, "modified": "2018-08-09 08:24:58", "extension": "XLSX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV002_Almiro dos Reis Junior\\IMAGENS\\ATD_HV002.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nATD_HV002_FT001 | Almiro dos Reis Júnior | Futuro anestesista | 1955 | São Paulo - SP | Retrato de Almiro em sua formatura pela Escola Paulista de Medicina.  | beca; Escola Paulista de Medicina; formando; formatura; graduação; medicina; óculos; retrato; Universidade Federal de São Paulo | Almiro desmontou o álbum de formatura. Recorda: 'Alguns colegas eu nunca mais vi.'\nATD_HV002_FT002 | Almiro dos Reis Júnior | Congresso em família | 1975 | Salvador - BA | Fotografia de Almiro e familiares no XXII Congresso Brasileiro de Anestesiologia. Brígida, sua esposa, conhecia muitas pessoas e sempre o acompanhava  nos congressos. Almiro conta que sua esposa sempre agitava as reuniões: 'Um colega meu disse que ouviu falar da minha mulher antes de mim.' Esq.-dir.: Márcia Negrão dos Reis Carvalho, Gladys Negrão dos Reis, Almiro dos Reis Júnior, Brígida Casteluci Negrão dos Reis. | A"}, "Alta": {"ATD_HV002_FT001.TIF": {"size_mb": 3.5518, "modified": "2018-08-08 11:54:20", "extension": "TIF", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV002_Almiro dos Reis Junior\\IMAGENS\\Alta\\ATD_HV002_FT001.TIF", "category": "Image", "duration_ms": 0, "dimension": "1010x1229", "height": 1229, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1010x1229"}, "ATD_HV002_FT002.tif": {"size_mb": 13.8097, "modified": "2018-08-09 08:09:20", "extension": "TIF", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV002_Almiro dos Reis Junior\\IMAGENS\\Alta\\ATD_HV002_FT002.tif", "category": "Image", "duration_ms": 0, "dimension": "2833x1771", "height": 1771, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2833x1771"}, "ATD_HV002_FT005.t l", "content_preview": "Nome do Projeto: Abifarma - 50 anos\nDepoimento de Almiro dos Reis Júnior\nEntrevistado por Cláudia Eleonor e Sara Mendonça\nLocal da Gravação: Estúdio Eco Service\nSão Paulo, 26 de maio de 1997\nRealização Museu da Pessoa\nCódigo do Depoente: ATD_HV02\nTranscrito por Luciana Tosetti e Paulo Tosetti\nRevisado por Fernanda Regina\nP/1: Bom doutor Almiro, a gente vai começar a entrevista, vou pedir pro senhor repetir pra gente: nome completo do senhor, o local e a data de nascimento.\nR: Almiro dos Reis Júnior, nascido em Tatuí, São Paulo, em 1931.\nP/1: E o nome dos pais do senhor?\nR: Meu pai Almiro dos Reis, médico pediatra, minha mãe Gladis Dulce Minhoto dos Reis, farmacêutica.\nP/1: Certo, eu queria que o senhor falasse um pouco da origem da família do senhor, o senhor estava falando que a...\nR: É, minha família do lado paterno é de origem portuguesa, veio pro Brasil há muitos anos, são todos de origem portuguesa. Do lado materno parte de origem portuguesa também, né, meu avô Minhoto materno era do Minho, em Portugal, e a outra metade era de origem inglesa, minha avó, nascida em Odean, subúrbio de Manchester, na Inglaterra. Veio ao Brasil em finzinhos do século passado.\nP/1: E como é que foi"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.587}, "ATD_HV003_Julio Perazza": {"Áudio": {"MD_0823.wav": {"size_mb": 316.0, "modified": "2011-07-30 05:15:00", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV003_Julio Perazza\\Áudio\\MD_0823.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3756803.0, "duration": 3756.8}, "MD_0824.wav": {"size_mb": 141.6524, "modified": "2011-07-19 00:47:02", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV003_Julio Perazza\\Áudio\\MD_0824.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 1684050.0, " o prado\nSão Paulo, 26/05/1997\nRealização: Museu da Pessoa\nEntrevista n° ATD_HV003\nTranscrito por Marcos Marsulo\nRevisado por Luiza Gallo Favareto\nP/1 - Começando o depoimento eu gostaria que o senhor me dissesse o seu nome completo, a data e o local de nascimento.\nR - Meu nome é Júlio Perazza, nasci em Birigui, interior de São Paulo, num bairro que era sítio na ocasião, chamado Taquari, dia dezessete de julho de 1923.\nP/1 - Certo. O que o senhor conhece da origem da sua família por parte de pai, vamos pegar assim pra ficar mais fácil da gente raciocinar.\nR - Eu lembro dos meus avós, bisavós não lembro. Lembro da minha avó, meu avô que era austríaco da parte da minha mãe e avós do meu pai. Os avós por parte do meu pai eram italianos.\nP/1 - Italianos?\nR -   Nascido e vindo de Pádua na Itália.\nP/1 - O senhor sabe o motivo da migração deles?\nR - É, foi no tempo do Mussolini, o tempo da guerra lá que... Eles vieram pequenos. Meu pai inclusive veio com cinco anos.\nP/1 - Veio com cinco anos?\nR - Veio meninão.\nP/1 - E porque é que foram se fixar lá em Birigui?\nR -  Bom, aí eu não sei, porque exist"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.693}, "ATD_HV004_Zuleika Picarelli": {"Áudio": {"MD_0414.wav": {"size_mb": 494.0, "modified": "2011-07-13 13:17:02", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV004_Zuleika Picarelli\\Áudio\\MD_0414.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 5872977.0, "duration": 5872.98}, "folder_size_gb": 0.482}, "IMAGENS": {"ATD_HV004.xlsx": {"size_mb": 0.0129, "modified": "2018-08-13 09:15:42", "extension": "XLSX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV004_Zuleika Picarelli\\IMAGENS\\ATD_HV004.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nATD_HV004_FT001 | Zuleika Picarelli Ribeiro do Vale | Chá de Farmacologia | 1956 | Edimburgo, Escócia | Colegas tomando chá no departamento de Farmacologia da Univesidade de Edimburgo, na sala 13, que era do doutor Barbosa. Esq.-dir.: Dr. Krivoy, Mr. Conden, Mrs. Drumond, Dra. Holzbauer, Miss Woods, Dr. Barbosa, Mrs. Barbosa, Miss Duncan. | chá; colegas; Edimburgo; Escócia; Farmacologia; jaleco; laboratório; sala de aula\nATD_HV004_FT002 | Zuleika Picarelli Ribeiro do Vale | A turma de Farmacologia | 1954 | São Paulo - SP | Fotografia de grupo no Laboratório de Farmacologia e Bioquímica da Escola Paulista de Medicina. Da esquerda para a direita, Zuleika é a terceira pessoa da segunda fila e José Ribeiro do Valle (seu marido) é a terceira pessoa da primeira fila.   | Escola Paulista de Medicina; Farmacologia; grupo; jaleco; turma | Imagem encontrada apenas em xérox. Pesqui"}, "Alta": {"ATD_HV004_FT002.tif": {"size_mb": 4.652, "modified": "2018-08-10 12:35:52", "extension": "TIF", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV004_Zuleika Picarelli\\IMAGENS\\Alta\\ATD_HV004_FT002.tif", "category": "Image", "duration_ms": 0, "dimension": "1714x1311", "height": 1311, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1714x1311"}, "ATD_HV004_FT003.TIF": {"size_mb": 3.5574, "modified": "2018-08-08 11:55:26", "extension": "TIF", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV004_Zuleika Picarelli\\IMAGENS\\Alta\\ATD_HV004_FT003.TIF", "category": "Image", "duration_ms": 0, "dimension": "963x1291", "height": 1291, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "963x1291"}, "ATD_HV004_FT005.tif": {"size_mb": 11.7274, "modified": "2018-08-10 12:36:00", "extension": "TIF", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV004_Zuleika Picarelli\\IMAGENS\\Alta\\ATD_HV004_FT005.tif", "categor xa\\ATD_HV004_FT015.jpg", "category": "Image", "duration_ms": 0, "dimension": "2978x2358", "height": 2358, "dpi": 96.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2978x2358"}, "folder_size_gb": 0.026}, "folder_size_gb": 0.13}, "TEXTUAL": {"ATD_HV004_Zuleika-Picarelli_REV.docx": {"size_mb": 0.043, "modified": "2018-08-17 12:32:06", "extension": "DOCX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV004_Zuleika Picarelli\\TEXTUAL\\ATD_HV004_Zuleika-Picarelli_REV.docx", "category": "Textual", "content_preview": "Abifarma 50 anos \nDepoimento de Zuleika Picarelli Ribeiro do Vale\nEntrevistado por Luiz André Prado e Sarah Mendonça\nSão Paulo, 27/05/1997\nRealização: Museu da Pessoa\nEntrevista n° ATD_HV004\nTranscrito por Teresa Melo\nRevisado por Luiza Gallo Favareto\nP/1 - Eu vou pedir pra senhora dizer o seu nome completo, data e local de nascimento.\nR - Eu me chamo Zuleika Picarelli Ribeiro do Vale, nasci em São Paulo, na Aclimação, no dia 2 de maio de 1926.\nP/1 - Bom, como eu havia lhe explicado, vamos pegar um pouco das suas origens. Eu gostaria de saber, por parte de pai - pra começar - o que a senhora conhece da história dos seus avós, ou bisavós. De onde eles vêm, o que faziam?\nR - Meus avós vieram, pequenos, da Itália. Tanto os maternos quanto os paternos, com exceção de uma avó paterna, que era índia. Meu avô paterno era comerciante, meu avô materno também. Minhas avós eram donas-de-casa, como deveria ser naquela época. Tanto os avós paternos quanto os avós maternos tiveram vários filhos. Sete filhos, doze filhos e, desses filhos, todos estudaram até o que era equivalente ao curso secundário. Então, inclusive meu pai fez até o curso secundário completo e continuou como comerciante. Agora,"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.613}, "ATD_HV005_Neide Cavallari Zuppo": {"Áudio": {"MD_0433.wav": {"size_mb": 285.7422, "modified": "2011-07-14 00:29:34", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV005_Neide Cavallari Zuppo\\Áudio\\MD_0433.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 3397079.0, "duration": 3397.08}, "MD_0434.wav": {"size_mb": 165.25, "modified": "2011-07-12 17:01:22", "extension": "WAV", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV005_Neide Cavallari Zuppo\\Áudio\\MD_0434.wav", "category": "Audio", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 1964594.0, "duration": 1964.59}, "folder_size_gb": 0.44}, "IMAGENS": {"ATD_HV005.xlsx": {"size_mb": 0.013, "modified": "2018-08-16 11:46:52", "extension": "XLSX", "full_path": "D:\\Abifarma 50 Anos - Indústria Farmacêutica e Cidadania (ATD-APD)\\ATD\\HV\\ATD_HV005_Neide Cavallari Zuppo\\IMAGENS\\ATD_HV005.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nATD_HV005_FT001A | Neide Zuppo | Noivos à espera | 1985 | São Paulo - SP | Casamento de Anita Lilian Zuppo (filha de Neide), aos 26 anos, e Munir Abed, brasileiro de origem árabe, aos 39. Ocorreu na Catedral Metropolitana Ortodoxa, localizada no bairro Paraíso. Há um ritual na cerimônia onde os noivos dão três voltas segurando a aliança o sacerdote segue atrás cantando e segurando a coroa de cada um. | casamento; cerimônia; noivos | Imagem encontrada apenas em xérox. Cartão postal entregue pela filha, contém duas fotos (FT001A e FT001B) em uma mesma ficha.\nATD_HV005_FT001B | Neide Zuppo | Retrato com a noiva | 1985 | São Paulo - SP | Casamento de Anita Lilian Zuppo (filha de Neide), aos 26 anos, e Munir Abed, brasileiro de origem árabe, aos 39. Ocorreu na Catedral Metropolitana Ortodoxa, localizada no bairro Paraíso. Há um ritual na cerimônia onde os noivos dão três volt"}, "Alta": {"ATD_HV005_FT001A.tif": {"size_mb": 1.6203, "modified": "2018-08-1
