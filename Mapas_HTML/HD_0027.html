CX", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV001_Flávia Rosane Camillo Timbolla\\Textual\\CD_HV001_Flávia Rosane Camillo Timbolla_rev.docx", "category": "Textual", "content_preview": "Programa Concórdia Digital Formando Cidadãos\nDepoimento de Flávia Rosane Camillo Tibolla\nEntrevistada por Gustavo Ribeiro Sanchez\nConcórdia, 22/04/2013\nCDHV_001_Flávia Rosane Camillo Tibolla\nRealização Museu da Pessoa\nTranscrito por Liliane Custódio\t\n\tMW Transcrições\nP/1 – Então, Flávia, pra começar eu vou pedir pra você falar seu nome, a data e o local do seu nascimento.\nR – Certo. Então, meu nome é Flávia Rosane Camillo Tibolla, eu nasci em Concórdia no dia 11 de abril de 1977.\nP/1 – Legal. E você lembra um pouco dessa casa onde você morou na infância, como era essa casa?\nR – Lembro. Eu lembro bastante. Eu tive uma infância privilegiada. Eu sou filho de agricultores, então a minha infância foi no meio da natureza, no meio dos rios. Eu brincava de construir casinha com as coisas da natureza. A gente ia para o meio do mato, recolhia as plantinhas, as pedrinhas, montava a casinha. Nos fundos da minha casa tinha um riacho, nós tomávamos banho nesse rio e meu pai era parceiro nessa aventura. Então minha infância foi assim, repleta de aventuras. E tinha também bastantes pés de frutas na minha casa, então eu vivia subindo nas árvores pra colher a ameixinha mais madura, ou a laranja tamb"}, "folder_size_gb": 0.0}, "folder_size_gb": 81.676}, "CD_HV003_Andressa Maria Hoeckler": {"Audiovisual": {"Acesso": {"CD_HV003_Andressa Maria Hoeckler.mp4": {"size_mb": 3810.0149, "modified": "2024-08-16 14:39:06", "extension": "MP4", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV003_Andressa Maria Hoeckler\\Audiovisual\\Acesso\\CD_HV003_Andressa Maria Hoeckler.mp4", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1510042.0, "du  comunidade, onde pretende permanecer, não abrindo mão do lugar. Sempre preferiu o futebol à boneca, ajuda os pais, que são agricultores em Concórdia e criam mais de mil porcos. Desde os nove anos ela cozinha, porque g"}, "folder_size_gb": 0.0}, "folder_size_gb": 28.569}, "CD_HV004_Alex Gustavo Bach Vargas da Rosa": {"Audiovisual": {"Acesso": {"CD_HV004_Alex Gustavo Bach Vargas da Rosa.mp4": {"size_mb": 2519.0946, "modified": "2024-08-16 14:52:26", "extension": "MP4", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV004_Alex Gustavo Bach Vargas da Rosa\\Audiovisual\\Acesso\\CD_HV004_Alex Gustavo Bach Vargas da Rosa.mp4", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1004437.0, "duration": 1004.44, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 2.46}, "Preservação": {"CDHV004_AlexGustavoBachVargasdaRosa.mov": {"size_mb": 16922.7874, "modified": "2013-12-27 19:15:00", "extension": "MOV", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV004_Alex Gustavo Bach Vargas da Rosa\\Audiovisual\\Preservação\\CDHV004_AlexGustavoBachVargasdaRosa.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 995529.0, "duration": 995.53, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 16.526}, "folder_size_gb": 18.986}, "Textual": {"CD_HV004_Alex Gustavo Bach Vargas da Rosa_rev.docx": {"size_mb": 0.0214, "modified": "2022-03-28 16:23:26", "extension": "DOCX", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV004_Alex Gustavo Bach Vargas da Rosa\\Textual\\CD_HV004_Alex Gustavo Bach Vargas da Rosa_rev.docx", "category": "Textual", "content_preview": "Programa Concórdia Digital Formando Cidadãos\nDepoimento de Alex Gustavo Bach Vargas da Rosa\nEntrevistada por Gustavo Ribeiro Sanches\nCidade: Concórdia\nData: 23/04/2013\nCódigo: CDHV_004\nRealização Museu da Pessoa\nTranscrito por Priscilla Proetti\nRevisado por Izadora Telles\n\tMW Transcrições\nTítulo: “Daí, eu vou pra NASA”\nMinibio: Alex é aluno da quinta série e tem 10 anos de idade. Mora com sua mãe e sua avó. Seu pai mora em outra casa. Gosta de História do Brasil, de andar de bicicleta, de usar o computador, e de brincar de pega-pega e esconde-esconde. Gosta mais ainda de jogar futebol, na zaga ou no gol. Acredita que as pessoas serão melhores no futuro se aprenderem coisas na escola.\nSinopse: Apesar do breve, mas não menos importante, tempo de vida, Alex conta sobre sua família, inclusive seu pai, que é bombeiro, e sua mãe, que trabalha em uma loja. Não lembra da cor olhos da mãe, mas afirma que ela é boa e gentil. Superou seu certo medo de ser entrevistado e contou como foi entrar na escola, como foi ter contato com a sala de computadores e com a lousa tecnológica, além de ter aprendido a tabuada: ficou bem emocionado. Gostou de aprender também sobre História do Brasil. Seu maior"}, "folder_size_gb": 0.0}, "folder_size_gb": 18.986}, "CD_HV005_Santo Hermínio De Luca": {"Audiovisual": {"Acesso": {"CD_HV005_Santo Hermínio De Luca.mp4": {"size_mb": 18054.5391, "modified": "2024-08-16 16:37:46", "extension": "MP4", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV005_Santo Hermínio De Luca\\Audiovisual\\Acesso\\CD_HV005_Santo Hermínio De Luca.mp4", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7138398.0, "duration": 7138.4, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 17.631}, "Preservação": {"CDHV005_SantoHermíniodDeLuca.mov": {"size_mb": 119073.8526, "modified": "2013-12-27 19:47:52", "extension": "MOV", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV005_Santo Hermínio De Luca\\Audiovisual\\Preservação\\CDHV005_SantoHermíniodDeLuca.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 7126293.0, "duration": 7126.29, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 116.283}, "folder_size_gb": 133.914}, "Textual": {"CD_HV005_Santo Hermínio De Luca_rev.docx": {"size_mb": 0.0544, "modified": "2022-03-22 17:46:18", "extension": "DOCX", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV005_Santo Hermínio De Luca\\Textual\\CD_HV005_Santo Hermínio De Luca_rev.docx", "category": "Textual", "content_preview": "Programa Concórdia Digital Formando Cidadãos\nDepoimento de Santo Hermínio de Luca\nEntrevistado por Gustavo Ribeiro Sanches\nConcórdia, 24/04/2013\nCDHV_005_Santo Hermínio de Luca\nRealização Museu da Pessoa\nCódigo: CD_HV005\nRevisado por: Anna Christina Madrid\nCD_HV005_ Santo Hermínio de Luca – Título da história: O  caminho  traçado por Santo, mesmo à  luz de lampião, nos mostra apesar de todas as dificuldades, como foi iluminado pela luz da Educação.\nMini bio:\nSanto Hermínio de Luca, nasceu em 02 de novembro de 1960 no município de Campos Novos, no estado de Santa Catarina. Cresceu e viveu no campo, em uma grande família, localizado na comunidade do Alto Bela Vista, sendo um dos mais novos dos 13 filhos. Viveram em uma casa de madeira, construída pelo próprio pai, onde não havia luz elétrica e o único banheiro ficava fora da casa. Morou ali até seus 23 anos de idade e, desde menino, assim como seus irmãos, ajudava seus pais com o trabalho na agricultura e nos serviços da roça. Em 1976, começa a participar da Comunidade local através de atividades religiosas e esportivas e, depois passa a dar palestras para o grupo de jovens. Depois que terminou o ensino Fundamental, aos 16 anos, deci"}, "folder_size_gb": 0.0}, "folder_size_gb": 133.914}, "CD_HV006_Neidi Mara Janke": {"Audiovisual": {"Acesso": {"CD_HV006_Neidi Mara Janke.mp4": {"size_mb": 8321.6432, "modified": "2024-08-16 17:21:06", "extension": "MP4", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV006_Neidi Mara Janke\\Audiovisual\\Acesso\\CD_HV006_Neidi Mara Janke.mp4", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3293390.0, "duration": 3293.39, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 8.127}, "Preservação": {"CDHV006_NeidiMaraJanke.mov": {"size_mb": 57039.3283, "modified": "2013-12-27 20:02:44", "extension": "MOV", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV006_Neidi Mara Janke\\Audiovisual\\Preservação\\CDHV006_NeidiMaraJanke.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3281281.0, "duration": 3281.28, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 55.702}, "folder_size_gb": 63.829}, "Textual": {"CD_HV006_Neidi Mara Janke_rev.docx": {"size_mb": 0.0302, "modified": "2022-03-22 12:51:44", "extension": "DOCX", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV006_Neidi Mara Janke\\Textual\\CD_HV006_Neidi Mara Janke_rev.docx", "category": "Textual", "content_preview": "Projeto Concórdia Digital Formando Cidadãos\nRealização Instituto Museu da Pessoa\nEntrevista de Neidi Mara Janke\nEntrevistada por Gustavo Ribeiro Sanchez\nConcórdia, 24 de Abril de 2013\nCódigo: CD_HV06\nTranscrito por Karina Medici Barrella\nEditado por Renata Pereira Rotunno\nTítulo\nTecnologia,a nova língua universal\nBiografia\nNeidi Mara Janke, nasceu em 13 de junho de 1976, na cidade de Peritiba, Santa Catarina. De origem alemã, aprendeu língua portuguesa aos sete anos de idade. Na adolescência, mudou-se para Concórdia, onde terminou o ensino secundário. Em seguida, realizou magistério e tornou-se professora municipal concursada de Língua Espanhola. Ingressou na faculdade de Letras. Casou. Possui dois filhos. É coordenadora do projeto Professores em Rede, de Concórdia.  \nSinopse\nNasceu em Peritiba. Família de alemães. Aprendeu português aos sete anos. Ensinou língua portuguesa a todos os membros da família. Ajudou os pais a educar os irmãos mais novos. Apaixonou-se por esportes. Tornou-se professora de línguas, atendendo o desejo do avô materno. Cursou letras. Virou professora concursada. É coordenadora do projeto Professores em Rede, que trata da educação continuada de professores no"}, "folder_size_gb": 0.0}, "folder_size_gb": 63.829}, "CD_HV007_Eliane Franchini": {"Audiovisual": {"Acesso": {"CD_HV007_Eliane Franchini.mp4": {"size_mb": 12027.1819, "modified": "2024-08-16 18:26:12", "extension": "MP4", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV007_Eliane Franchini\\Audiovisual\\Acesso\\CD_HV007_Eliane Franchini.mp4", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4748477.0, "duration": 4748.48, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 11.745}, "Preservação": {"CDHV007_ElianeFranchini.mov": {"size_mb": 82398.3561, "modified": "2013-12-27 20:24:28", "extension": "MOV", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV007_Eliane Franchini\\Audiovisual\\Preservação\\CDHV007_ElianeFranchini.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4736370.0, "duration": 4736.37, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 80.467}, "folder_size_gb": 92.212}, "Textual": {"CD_HV007_Eliane Franchini_rev.docx": {"size_mb": 0.1544, "modified": "2013-06-25 13:04:00", "extension": "DOCX", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV007_Eliane Franchini\\Textual\\CD_HV007_Eliane Franchini_rev.docx", "category": "Textual", "content_preview": "Programa Concórdia Digital Formando Cidadãos\nDepoimento de Eliane Franchini\nEntrevistada por Gustavo Ribeiro Sanchez\nConcórdia, 25/04/2013\nCDHV_007_Eliane Franchini\nRealização Museu da Pessoa\n\tMW Transcrições\nP/1 – Então vamos lá, pra começar, eu queria que você falasse pra mim seu nome completo, a data e o local do seu nascimento. \nR – Meu nome é Eliane Franchini. Eu nasci em Concórdia, dia primeiro de julho de 1973.\nP/1 – Legal. E tentando lembrar um pouco da tua infância, eu queria que você me contasse a cada na qual você nasceu. O quê que você lembra dessa casa? Você pode descrever ela pra gente?\nR –  Eu nessa casa que… eu tenho uma foto só. Eu tinha seis meses nessa casa onde eu nasci. E eu lembro assim… eu lembro, não, eu vejo nessa foto, o chão… a casa era uma casa já antiga. Era lá em Linha Pinhal.\nP/1 – Entendi. Agora, a casa que você passou a sua infância, mesmo, que você cresceu, como é que era?\nR – Ela era na Granja Sadia, de Barra Bonita. Hoje, é a BRF, que nós chamamos. Nossa, era uma casa assim… era a casa que moravam duas famílias e a gente tinha o contato com os vizinhos, assim, era muita criança, assim, nós tínhamos uma turma muito grande. A escola que eu estudei"}, "folder_size_gb": 0.0}, "folder_size_gb": 92.213}, "CD_HV008_Márcia Regina Rover Castanho": {"Audiovisual": {"Acesso": {"CD_HV008_Márcia Regina Rover Castanho.mp4": {"size_mb": 9935.5214, "modified": "2024-08-16 19:20:16", "extension": "MP4", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV008_Márcia Regina Rover Castanho\\Audiovisual\\Acesso\\CD_HV008_Márcia Regina Rover Castanho.mp4", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3933997.0, "duration": 3934.0, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 9.703}, "Preservação": {"CDHV008_MarciaReginaRover.mov": {"size_mb": 45719.2622, "modified": "2014-01-02 12:13:16", "extension": "MOV", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV008_Márcia Regina Rover Castanho\\Audiovisual\\Preservação\\CDHV008_MarciaReginaRover.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3921889.0, "duration": 3921.89, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 44.648}, "folder_size_gb": 54.35}, "Textual": {"CD_HV008_Márcia Regina Rover Castanho_rev.docx": {"size_mb": 0.0291, "modified": "2022-03-28 16:22:58", "extension": "DOCX", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV008_Márcia Regina Rover Castanho\\Textual\\CD_HV008_Márcia Regina Rover Castanho_rev.docx", "category": "Textual", "content_preview": "Projeto: Programa Concórdia Digital Formando Cidadãos\nEntrevistada por: Gustavo Ribeiro Sanchez \nDepoimento de: Márcia Regina Rover Castanho\nLocal: Concórdia, SC \nData: 26/04/2013 \nRealização: Instituto Museu da Pessoa\nCódigo: CD_HV008\nTranscrito por: Karina Medici Barrella\nRevisado por: Leonardo Dias de Paula\nMW Transcrições\nTítulo: Uma professora por vocação\nSinopse: Em seu depoimento, Márcia Regina Rover Castanho rememora seu apreço pela educação desde a sua infância, no interior de Santa Catarina. No decorrer da juventude, após muito observar sua mãe preparar aulas e materiais didáticos, encontrou no ato de lecionar uma vocação, em que perseverou através de sua carreira. Após estabelecer-se como professora de uma escola estadual em Concórdia, deparou-se com um novo desafio: aprender a usar recursos da informática para ampliar seus horizontes dentro da sala de aula.\nMini-bio: Márcia Regina Rover Castanho nasceu na zona rural da cidade de Concórdia (SC) em outubro de 1968. Durante a infância, junto de sua irmã, observou sua mãe a preparar lições e materiais para seus alunos em várias noites. Na juventude, formou-se no Magistério e na graduação em Pedagogia. Assumiu a vocação de s"}, "folder_size_gb": 0.0}, "folder_size_gb": 54.35}, "CD_HV009_Liane Vizzotto": {"Audiovisual": {"Acesso": {"CD_HV009_Liane Vizzotto.mp4": {"size_mb": 10972.2709, "modified": "2024-08-16 20:30:38", "extension": "MP4", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV009_Liane Vizzotto\\Audiovisual\\Acesso\\CD_HV009_Liane Vizzotto.mp4", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4340503.0, "duration": 4340.5, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 10.715}, "Preservação": {"CDHV009_LianeVizzotto.mov": {"size_mb": 73048.9963, "modified": "2013-12-30 20:39:00", "extension": "MOV", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV009_Liane Vizzotto\\Audiovisual\\Preservação\\CDHV009_LianeVizzotto.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4328395.0, "duration": 4328.4, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 71.337}, "folder_size_gb": 82.052}, "Textual": {"CD_HV009_Liane Vizzotto_rev.docx": {"size_mb": 0.0357, "modified": "2022-03-28 16:41:22", "extension": "DOCX", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV009_Liane Vizzotto\\Textual\\CD_HV009_Liane Vizzotto_rev.docx", "category": "Textual", "content_preview": "Projeto: Concórdia Digital Formando Cidadãos\nRealização: Instituto Museu da Pessoa\nEntrevistada por: Gustavo Ribeiro Sanchez \nDepoimento de: Liane Vizzotto\nConcórdia, 27 de abril de 2013 \nCódigo: CD_HV009\nTranscrito por: Karina Medici Barrella\nRevisado por: Amanda Souza Xavier de Lira\nTítulo: A educação não escolhe idade\nBiografia \nLiane Vizzotto nasceu na cidade de Concórdia, em Santa Catarina, em 20 de outubro de 1977. Formada pelo Magistério, graduou-se em Pedagogia e trabalhou como professora. Em 2002, assumiu cargo de gestão na Secretaria de Educação de Concórdia, onde atuou até 2011. Foi uma das responsáveis pela implementação do projeto Professores em Rede, que oferece educação tecnológica a alunos de escolas públicas de Ensino Fundamental em Concórdia.\nSinopse \nLiane fala sobre memórias de infância, brincadeiras, família e vida no campo. Conta sobre o Magistério e sobre a mudança de Administração para Pedagogia. Fala sobre a experiência com alunos em situação de vulnerabilidade e com deficiências. Conta sobre o trabalho na Secretaria de Educação de Concórdia. Fala sobre o ensino de tecnologia nas escolas, parcerias público-privadas e capacitação de professores.\nPalavras-cha"}, "folder_size_gb": 0.0}, "folder_size_gb": 82.052}, "CD_HV010_Elvira Costa de Oliveira Nadai": {"Audiovisual": {"Acesso": {"CD_HV010_Elvira Costa de Oliveira Nadai.mp4": {"size_mb": 16152.7218, "modified": "2024-08-16 22:00:04", "extension": "MP4", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV010_Elvira Costa de Oliveira Nadai\\Audiovisual\\Acesso\\CD_HV010_Elvira Costa de Oliveira Nadai.mp4", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6390016.0, "duration": 6390.02, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 15.774}, "Preservação": {"CDHV010_ElviraCosta.mov": {"size_mb": 113026.7991, "modified": "2013-12-23 12:31:38", "extension": "MOV", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV010_Elvira Costa de Oliveira Nadai\\Audiovisual\\Preservação\\CDHV010_ElviraCosta.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 6380380.0, "duration": 6380.38, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 110.378}, "folder_size_gb": 126.152}, "Textual": {"CD_HV010_Elvira Costa de Oliveira Nadai (pt I)_rev.doc": {"size_mb": 0.1016, "modified": "2013-06-26 08:36:00", "extension": "DOC", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV010_Elvira Costa de Oliveira Nadai\\Textual\\CD_HV010_Elvira Costa de Oliveira Nadai (pt I)_rev.doc", "category": "Textual"}, "CD_HV010_Elvira Costa de Oliveira Nadai (pt II)_rev.doc": {"size_mb": 0.1099, "modified": "2013-06-26 08:36:00", "extension": "DOC", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV010_Elvira Costa de Oliveira Nadai\\Textual\\CD_HV010_Elvira Costa de Oliveira Nadai (pt II)_rev.doc", "category": "Textual"}, "CD_HV010_Elvira Costa de Oliveira Nadai (pt I)_rev.docx": {"size_mb": 0.03, "modified": "2026-02-20 10:49:24", "extension": "DOCX", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV010_Elvira Costa de Oliveira Nadai\\Textual\\CD_HV010_Elvira Costa de Oliveira Nadai (pt I)_rev.docx", "category": "Textual", "content_preview": "Programa Concórdia Digital Formando Cidadãos\nDepoimento de Elvira Costa de Oliveira Nadai\nEntrevistada por Fernanda P. Prado e Taís Motta\nSão Paulo, 07/06/2013\t\nRealização Museu da Pessoa\nCDHV_10_Elvira Costa de Oliveira Nadai\nTranscrito por Liliane Custódio\t\n\tMW Transcrições\nP/1 – Elvira, boa tarde.\nR – Boa tarde.\nP/1 – Primeiro eu gostaria de agradecer de você ter vindo aqui até ao Museu pra dar essa entrevista. E queria começar pedindo pra você falar pra gente o seu nome completo, o local e a data do seu nascimento.\nR – Tá certo. Meu nome completo é Elvira Costa de Oliveira Nadai. Meu nome profissional é Elvira Nadai. Desde que eu virei jornalista de educação, eu assino assim: Elvira Nadai. Eu nasci em Andradina, em 29 de junho de 1954. Andradina é uma cidade do interior de São Paulo, próximo de Mato Grosso do Sul.\nP/1 – E fala pra gente, Elvira, qual é o nome dos seus pais?\nR – Meus pais. Meu pai se chamava... Ambos são mortos já. Não tenho pais mais. Eurípedes Costa de Oliveira, e minha mãe, Ana Marcelino de Oliveira.\nP/1 – E conta pra gente, o que eles faziam, os seus pais?\nR – Olha, eu tenho uma precocidade que é assim, sou filha de adolescentes, coisa que na minha geração n"}, "CD_HV010_Elvira Costa de Oliveira Nadai (pt II)_rev.docx": {"size_mb": 0.0325, "modified": "2026-02-20 10:49:28", "extension": "DOCX", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV010_Elvira Costa de Oliveira Nadai\\Textual\\CD_HV010_Elvira Costa de Oliveira Nadai (pt II)_rev.docx", "category": "Textual", "content_preview": "Programa Concórdia Digital Formando Cidadãos\nDepoimento de Elvira Costa de Oliveira Nadai\nEntrevistada por Fernanda P. Prado e Taís Motta\nSão Paulo 18/06/2013\t\nRealização Museu da Pessoa\nCDHV_010_Parte02_Elvira Costa de Oliveira Nadai\nTranscrito por Liliane Custódio\t\n\tMW Transcrições\nP/1 – Elvira, então a gente vai aqui continuar, queria de novo agradecer a sua presença aqui. E agora chegou a hora de a gente falar mesmo da parte metodológica e da chegada do projeto.\nR – Tá certo. Que bom.\nP/1 – Então eu queria começar retomando e pedindo pra você contar a experiência de como foi criar o Nossa Língua Digital, como ele funcionou, como ele começou a ser implantado, aonde, só pra gente ter essa primeira ideia de onde começou a vir a semente do projeto, que depois virou o Concórdia.\nR – Ok. Tá certo. O Nossa Língua Digital começou a ser pensado em meados de 2001 na Klick Net, na verdade, que era a empresa em que eu trabalhava na época e que fazia muitos, desenvolvia muitos projetos na área de educação digital já. Quer dizer, a gente tava começando, todo mundo tava começando nessa área. Em 2000 foi o grande boom dos sites, dos portais no Brasil, no Brasil, isso eu tenho que dizer. Chegou"}, "folder_size_gb": 0.0}, "fold -27 19:04:44", "extension": "MOV", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV002_Marlei Franciscon Camillo\\Audiovisual\\Preservação\\CDHV002_MarleiCamillo.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3178779.0, "duration": 3178.78, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 52.214}, "folder_size_gb": 60.084}, "Textual": {"CD_HV002_Marlei Franciscon Camillo_rev.docx": {"size_mb": 0.0327, "modified": "2022-03-28 16:22:50", "extension": "DOCX", "full_path": "D:\\Concordia Digital (CD)\\HV\\CD_HV002_Marlei Franciscon Camillo\\Textual\\CD_HV002_Marlei Franciscon Camillo_rev.docx", "category": "Textual", "content_preview": "Programa Concórdia Digital Formando Cidadãos\nDepoimento de Marlei Franciscon Camillo\nEntrevistada por Gustavo Ribeiro Sanches\nConcórdia, 22/04/2013\nCódigo: CDHV_002\nRealização Museu da Pessoa\n\tMW Transcrições\nCódigo: CD_HV002\nNome do revisor: Lara Eloiza Dan Della Mura.\nTítulo: Mulher Moderna.\nMinibio: Marlei Franciscon Camillo passou sua infância junto de seus irmãos e avós, em Concórdia, onde nasceu em 1972. Grande parte da sua infância e adolescência foi no interior. Ainda jovem, participou do time de atletismo de Concórdia. Logo depois que começou a trabalhar,  fez um curso de Processamento de Dados. Além disso, se formou em Administração e fez uma especialização na área de marketing empresarial na Universidade de Contestado. Em 1995, entrou na Sadia e se juntou à secretaria do chefe de departamento. Atualmente trabalha na área de Gestão, fazendo parte do Comitê de Investimento Social, onde desenvolve projetos, como o Nossa Língua Digital, os quais ajudam a construir uma comunidade melhor. \nSinopse: Hoje em dia Marlei tem a difícil missão da mulher moderna e tem que conciliar: trabalho, marido e filhos. Mas não é só isso, além de trabalhar na área solution": "1920x1080", "fps": 29.97}, "folder_size_gb": 26.821}, "folder_size_gb": 30.901}, "Textual": {"CD_TM001_Denise Kusler_rev.docx": {"size_mb": 0.0217, "modified": "2022-03-28 16:23:46", "extension": "DOCX", "full_path": "D:\\Concordia Digital (CD)\\TM\\CD_TM001_Denise Kusler\\Textual\\CD_TM001_Denise Kusler_rev.docx", "category": "Textual", "content_preview": "Programa Concórdia Digital Formando Cidadãos\nDepoimento de Denise Kussler\nEntrevistada por Gustavo Ribeiro Sanchez\nConcórdia, 22/04/2013\nCódigo: CDTM_001\nRealização Museu da Pessoa\nRevisado por: Gioanna Zou\n\n\tMW Transcrições\nTítulo: Profissionais que inspiram\nMinibio: Denise Kussler engravidou aos 13 anos, casou-se e afastou-se dos seus estudos escolares. Aos 16 anos, trabalhou como assessora de produção, e sustentava seus dois filhos. Após separar do marido, voltou à escola, permanecendo com seu sonho de ser professora, ingressou na faculdade e fez o curso de magistério. Durante sua faculdade, trabalhava como camareira à noite e dava aulas de dia. Fez um curso de formação continuada no programa “Professores em Rede” e atualmente trabalha na área da educação infantil.\nSinopse: Em seu depoimento, Denise conta seu sonho em ser professora, o que a motivou e sua dificuldade ao ingressar na faculdade. Fala sobre a contraditoriedade do seu medo de mexer em computador no início da graduação e, hoje em dia, não conseguir se desconectar da internet. Aborda seu nervosismo ao entrar pela primeira vez em sala de aula para lecionar, como conquistou seus alunos, e o que a levou a seguir na educa"}, "folder_size_gb": 0.0}, "folder_size_gb": 30.901}, "CD_TM002_Samira Abu El Haje Furlan": {"Audiovisual": {"Acesso": {"CD_TM002_Samira Abu El Haje Furlan.mp4": {"size_mb": 8333.6983, "modified": "2024-08-17 00:39:10", "extension": "MP4", "full_path": "D:\\Concordia Digital (CD)\\TM\\CD_TM002_Samira Abu El Haje Furlan\\Audiovisual\\Acesso\\CD_TM002_Samira Abu El Haje Furlan.mp4", "category": "Video", "dimension gia Institucional e Educação Especial Inclusiva.\nSinopse:\nSamira inicia a entrevista relembrando sua infância com a dificuldade de convivência com os vizinhos, lembra também de sua brincadeiras de meninos, junto a seus irmãos e das vezes que seu pai ia para São Paulo por conta de seu ofício e trazia motocas consigo. Relata a permissão de seus pais para se adaptar a cultura ocidental - sempre com mui"}, "folder_size_gb": 0.0}, "folder_size_gb": 64.338}, "CD_TM003_Ageni Terezinha Turmena": {"Audiovisual": {"Acesso": {"CD_TM003_Ageni Terezinha Turmena.mp4": {"size_mb": 3139.4581, "modified": "2024-08-17 00:56:38", "extension": "MP4", "full_path": "D:\\Concordia Digital (CD)\\TM\\CD_TM003_Ageni Terezinha Turmena\\Audiovisual\\Acesso\\CD_TM003_Ageni Terezinha Turmena.mp4", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1245244.0, "duration": 1245.24, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 3.066}, "Preservação": {"CDTM003_AgeniTerezinhaTurmena.mov": {"size_mb": 21320.0117, "modified": "2013-12-27 20:30:20", "extension": "MOV", "full_path": "D:\\Concordia Digital (CD)\\TM\\CD_TM003_Ageni Terezinha Turmena\\Audiovisual\\Preservação\\CDTM003_AgeniTerezinhaTurmena.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1235736.0, "duration": 1235.74, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 20.82}, "folder_size_gb": 23.886}, "Textual": {"CD_TM003_Ageni Terezinha Turmena_rev.docx": {"size_mb": 0.0151, "modified": "2022-03-17 17:34:30", "extension": "DOCX", "full_path": "D:\\Concordia Digital (CD)\\TM\\CD_TM003_Ageni Terezinha Turmena\\Textual\\CD_TM003_Ageni Terezinha Turmena_rev.docx", "category": "Textual", "content_preview": "Programa Concórdia Digital Formando Cidadãos\nDepoimento de Ageni Terezinha Turmena\nEntrevistada por Gustavo Ribeiro Sanchez\nConcórdia, 25/04/2013\nCódigo: CD_TM003\nRealização Museu da Pessoa\nRevisado por: Ivone Islas Silva\n                                                                                                    \tMW Transcrições\nTítulo: Tecnologia na escola\n Minibiografia\nAgeni Terezinha Turmena nasceu na zona rural de Irani, em Santa Catarina, no dia 25 de outubro de 1966. Viveu e estudou até os 12 anos de idade nesta região. Aprendeu muita teoria na escola multiseriada e adquiriu conhecimento prático participando das atividades escolares, com duas professoras apenas. Estudou depois da adolescência na cidade e cursou Faculdade de Matemática, onde se formou professora.  Fez cursos de complementação pedagógica, como o “Professores em Rede”. Está se preparando para o mestrado.\nSinopse:\nEm sua entrevista, Ageni Terezinha Turmena conta que viveu até seus 12 anos na região rural de Irani, em Santa Catarina. Morava em casa de madeira com seus pais agricultores. Teve uma infância comum brincando com as crianças da vizinhança de pega-pega, esconde-esconde, passa-anel, boneca… Estud"}, "folder_size_gb": 0.0}, "folder_size_gb": 23.886}, "CD_TM004_Adriana Meine Antunes da Silva": {"Audiovisual": {"Acesso": {"CD_TM004_Adriana Meine Antunes da Silva.mp4": {"size_mb": 3120.9399, "modified": "2024-08-17 01:31:00", "extension": "MP4", "full_path": "D:\\Concordia Digital (CD)\\TM\\CD_TM004_Adriana Meine Antunes da Silva\\Audiovisual\\Acesso\\CD_TM004_Adriana Meine Antunes da Silva.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 2054419.0, "duration": 2054.42, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 3.048}, "Preservação": {"CDTM004_AdrianaMeineAntunesdaSilva.mov": {"size_mb": 7390.4143, "modifi o, Alejandro Ariel Almiron conta sua vivência como um argentino a morar no Brasil, após mudar-se de país durante a infância. Após formar-se em Engenharia Química, Alejandro trabalhou em indústrias do setor alimentício, sobretudo em empresas que produzem bebidas e alimentos processados. Em sua vida, buscou amalgamar a excelência profissional, a experiência como pai de três crianças e a vontade de ajudar o próximo, dedicando-se a projetos sociais nas cidades em que morou.\nMini-bio: Alejandro Ariel Almiron nasceu na cidade de Maipú, na Argentina. Ainda na infância acompanhou sua família em uma mudança para o Brasil, instalando-se na cidade de São Paulo, onde estudou. Após formar-se em Engenharia Química iniciou sua vida profissional em indústrias de alimentação. Pai de três filhos, fiou-se por aliar o profissionalismo à vontade de fazer o"}, "folder_size_gb": 0.0}, "folder_size_gb": 12.192}, "CD_TM006_Aleomar Luís Piola": {"Audiovisual": {"Acesso": {"CD_TM006_Aleomar Luís Piola.mp4": {"size_mb": 3875.3837, "modified": "2024-08-17 02:30:52", "extension": "MP4", "full_path": "D:\\Concordia Digital (CD)\\TM\\CD_TM006_Aleomar Luís Piola\\Audiovisual\\Acesso\\CD_TM006_Aleomar Luís Piola.mp4", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1530829.0, "duration": 1530.83, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 3.785}, "Preservação": {"CDTM006_CleomarLuisPiola.mov": {"size_mb": 26391.7721, "modified": "2013-12-30 21:17:48", "extension": "MOV", "full_path": "D:\\Concordia Digital (CD)\\TM\\CD_TM006_Aleomar Luís Piola\\Audiovisual\\Preservação\\CDTM006_CleomarLuisPiola.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1523056.0, "duration": 1523.06, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 25.773}, "folder_size_gb": 29.558}, "Textual": {"CD_TM006_Aleomar Luís Piola_rev.docx": {"size_mb": 0.0213, "modified": "2022-03-28 16:24:00", "extension": "DOCX", "full_path": "D:\\Concordia Digital (CD)\\TM\\CD_TM006_Aleomar Luís Piola\\Textual\\CD_TM006_Aleomar Luís Piola_rev.docx", "category": "Textual", "content_preview": "Programa Concórdia Digital Formando Cidadãos\nDepoimento de Cleomar Luís Piola\nEntrevistado por Gustavo Ribeiro Sanchez\nCidade: Concórdia\nData: 27/04/2013\nCódigo: CD_TM006.\nRealização Museu da Pessoa\nRevisado por: Lara Eloiza\n\tMW Transcrições\nTítulo: Esforço e trabalho duro.\nMinibio: Cleomar Luís Piola nasceu no interior de Concórdia, no dia 8 de julho de 1965. Sua carreira foi toda baseada na empresa BRF, agora Sadia. Entrou como estagiário, logo foi efetivado e começou a trabalhar com a assistência ao projeto Homem do Campo. Foi en\ttão promovido a gerente da unidade. Depois de muito se esforçar, conseguiu ingressar em uma universidade. Participou do projeto social “Professores em Rede” e atualmente trabalha na diretoria regional do RGS.\nSinopse: Para Luís Piola a coisa mais importante na vida é a família. Mas seu trabalho na empresa Sadia, não fica para trás. A empresa ajudou muito no seu crescimento pessoal. Ele crê que ela investe e acredita nas pessoas; não só nos seus funcionários, mas também nos cidadãos de Concórdia. Assim, nosso entrevistado relata sua experiência na empresa Sadia. E como ela, a partir de sua união com o Instituto Jaborandi e a prefeitura, conseguiram elabo"}, "folder_size_gb": 0.0}, "folder_size_gb": 29.558}, "CD_TM007_Clarice Maria Vogt Cenci": {"Audiovisual": {"Acesso": {"CD_TM007_Clarice Maria Vogt Cenci.mp4": {"size_mb": 4282.5867, "modified": "2024-08-17 02:53:44", "extension": "MP4", "full_path": "D:\\Concordia Digital (CD)\\TM\\CD_TM007_Clarice Maria Vogt Cenci\\Audiovisual\\Acesso\\CD_TM007_Clarice Maria Vogt Cenci.mp4", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1697830.0, "duration": 1697.83, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 4.182}, "Preservação": {"CDTM007_ClariceMariaVogiCenci.mov": {"size_mb": 28725.0762, "modified": "2013-12-30 21:27:58", "extension": "MOV", "full_path": "D:\\Concordia Digital (CD)\\TM\\CD_TM007_Clarice Maria Vogt Cenci\\Audiovisual\\Preservação\\CDTM007_ClariceMariaVogiCenci.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1685719.0, "duration": 1685.72, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 28.052}, "folder_size_gb": 32.234}, "Textual": {"CD_TM007_Clarice Maria Vogt Cenci_rev.docx": {"size_mb": 0.0322, "modified": "2022-03-18 15:48:44", "extension": "DOCX", "full_path": "D:\\Concordia Digital (CD)\\TM\\CD_TM007_Clarice Maria Vogt Cenci\\Textual\\CD_TM007_Clarice Maria Vogt Cenci_rev.docx", "category": "Textual", "content_preview": "Programa Concórdia Digital Formando Cidadãos\nDepoimento de Clarice Maria Vogt Cenci\nEntrevistado por Gustavo Ribeiro Sanchez\nConcórdia, 27/04/2013\nCDTM_07_Clarice Maria Vogt Cenci\nRealização Museu da Pessoa\n\tMW Transcrições\nP/1 – Então, Clarice, pra começar, eu vou pedir pra você falar o seu nome completo, a data e o local do seu nascimento.\nR – Tá, meu nome é Clarice Maria Vogt Cenci, sou nascida em Ipumirim, Santa Catarina, nascida em 8 de julho de 73.\nP/1 – Bacana. E Clarice, eu queria que você falasse um pouco da casa da sua infância, da sua cidade, como é que era esse começo de vida?\nR – Então, a minha infância tenho assim, lembranças muito boas, eu tive uma infância muito boa, muito tranquila, uma família muito unida, né, brinquei muito, aproveitei bastante, o lugar também onde eu morava, assim, um lugar tranquilo, que proporcionava isso. Meus pais sempre me deram muito amor, muita atenção, muito carinho. Então, é essa a lembrança que eu tenho.\nP/1 – E o que os seus pais faziam?\nR – Eles faziam atividade de agricultura, né, eles e os meus irmãos mais velhos também, eu sou a irmã caçula, então…\nP/1 – Tá certo. E como é que era o dia a dia em casa, as atividades, como é que voc"}, "folder_size_gb": 0.0}, "folder_size_gb": 32.234}, "folder_size_gb": 203.374}, "folder_size_gb": 1021.359}, "Dante Alighieri (DA)": {"HV": {"DA_HV001_Lino Pretto": {"Audiovisual": {"Acesso": {"DA_HV001_Lino Pretto.mp4": {"size_mb": 5103.6445, "modified": "2024-09-03 21:30:12", "extension": "MP4", "full_path": "D:\\Dante Alighieri (DA)\\HV\\DA_HV001_Lino Pretto\\Audiovisual\\Acesso\\DA_HV001_Lino Pretto.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3080511.0, "duration": 3080.51, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 4.984}, "Preservação": {"DVC_0463.avi": {"size_mb": 25755.6062, "modified": "2020-01-06 15:57:50", "extension": "AVI", "full_path": "D:\\Dante Alighieri (DA)\\HV\\DA_HV001_Lino Pretto\\Audiovisual\\Preservação\\DVC_0463.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 7313038.0, "duration": 7313.04, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 25.152}, "folder_size_gb": 30.136}, "folder_size_gb": 30.136}, "DA_HV002_Lina Walkiria de Assumpção Giangrande": {"Audiovisual": {"Acesso": {"DA_HV002_Lina Walkiria de Assumpção Giangrande.mp4": {"size_mb": 9523.9323, "modified": "2024-09-03 20:46:50", "extension": "MP4", "full_path": "D:\\Dante Alighieri (DA)\\HV\\DA_HV002_Lina Walkiria de Assumpção Giangrande\\Aud ": 906.51, "resolution": "854x480", "fps": 29.97}, "DVC_0465_02.avi": {"size_mb": 4135.8099, "modified": "2020-01-09 14:30:10", "extension": "AVI", "full_path": "D:\\Dante Alighieri (DA)\\IC\\DVC_0465_02.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1144510.0, "duration": 1144.51, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 4.697}, "folder_size_gb": 128.357}, "CRC - Conselho Regional de Contabilidade (CRC)": {"HV": {"CRC_HV001_Luiz Bertasi Filho": {"Audiovisual": {"Acesso": {"CRC_HV001_Luiz Bertasi Filho.mp4": {"size_mb": 3205.4705, "modified": "2024-08-31 12:21:50", "extension": "MP4", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV001_Luiz Bertasi Filho\\Audiovisual\\Acesso\\CRC_HV001_Luiz Bertasi Filho.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1937702.0, "duration": 1937.7, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 3.13}, "Preservação": {"DVC_0255.avi": {"size_mb": 21157.8491, "modified": "2024-08-26 17:33:32", "extension": "AVI", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV001_Luiz Bertasi Filho\\Audiovisual\\Preservação\\DVC_0255.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 6007534.0, "duration": 6007.53, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 20.662}, "folder_size_gb": 23.792}, "Textual": {"CRC_HV001_Luiz Bertasi Filho_rev.docx": {"size_mb": 0.0316, "modified": "2020-08-30 19:17:02", "extension": "DOCX", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV001_Luiz Bertasi Filho\\Textual\\CRC_HV001_Luiz Bertasi Filho_rev.docx", "category": "Textual", "content_preview": "Centro de Memória do Conselho Regional de Contabilidade de São Paulo\nDepoimento de Luiz Bertasi Filho\nEntrevistado por Neuza Guerreiro de Carvalho e Ignez Barretto\nSão Paulo, 22 de março de 2001\nRealização Museu da Pessoa\nCódigo CRC - 001\nTranscrito por Neuza Guerreiro de Carvalho\nP/1 – Dr. Luiz, o senhor vai nos dizer o seu nome completo, local e data de nascimento.\nR – Meu nome é Luiz Bertasi Filho. Eu nasci em São Paulo no dia 3 de janeiro de 1933.\nP/1 – Seus pais, o nome deles?\nR – Luiz Bertasi e Filomena Bertasi.\nP/1 – Eles são de São Paulo também?\nR – Meu pai era de Juiz de Fora e minha mãe de São Paulo.\nP/1 – A origem deles?\nR – Italianos.\nP/1 – De que região da Itália?\nR – Meu pai do norte da Itália e minha mãe do sul da Itália.\nP/1 – E seus irmãos? Quantos o senhor tem?\nR – Eu tenho uma irmã só por parte de pai, porque meu pai, quando casou com a minha mãe, era viúvo.\nP/1 – O nome dela?\nR –Leonor.\nP/1 – O senhor pode nos dizer quando ela nasceu, que idade ela tem, para uma referência?\nR – Ela é viva ainda. Nasceu em 22 de agosto de 1919, em São Paulo.\nP/1 – O senhor sempre morou em São Paulo?\nR – Sempre morei em São Paulo.\nP/1 – Em que bairro de São Paulo?\nR – Sempre na zo"}, "folder_size_gb": 0.0}, "folder_size_gb": 23.792}, "CRC_HV002_Anníbal de Freitas": {"Audiovisual": {"Acesso": {"CRC_HV002_Anníbal de Freitas.mp4": {"size_mb": 2709.2296, "modified": "2024-08-30 17:53:26", "extension": "MP4", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV002_Anníbal de Freitas\\Audiovisual\\Acesso\\CRC_HV002_Anníbal de Freitas.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1640472.0, "duration": 1640.47, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 2.646}, "Preservação": {"Localização do Bruto.txt": {"size_mb": 0.0001, "modified": "2024-09-09 15:40:16", "extension": "TXT", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV002_Anníbal de Freitas\\Audiovisual\\Preservação\\Localização do Bruto.txt", "category": "Textual", "content_preview": "Mídia original: DVC_0253\n\nLocalização: Pasta \"CRC_HV007_Sérgio de Iudícibus\""}, "folder_size_gb": 0.0}, "folder_size_gb": 2.646}, "Textual": {"CRC_HV002_Anníbal de Freitas_rev.docx": {"size_mb": 0.0311, "modified": "2020-08-30 19:16:42", "extension": "DOCX", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV002_Anníbal de Freitas\\Textual\\CRC_HV002_Anníbal de Freitas_rev.docx", "category": "Textual", "content_preview": "Centro de Memória do Conselho Regional de Contabilidade de São Paulo\nDepoimento de Anníbal de Freitas\nEntrevistado por Ignez Barretto e Jurema de Carvalho\nSão Paulo, 22 de março de 2001\nRealização Museu da Pessoa \nCódigo CRC – 002\nTranscrito por Ronaldo Ventura Souza\nP/2 - Boa Tarde!\nR - Boa Tarde!\nP/2 - A gente queria começar com o senhor falando o seu nome completo, o local e data de nascimento.\nR - Eu, meu nome é Anníbal de Freitas, eu nasci em São Paulo, no dia 15 de janeiro de 1927. Evidentemente me dediquei à Contabilidade muito cedo, passei a ser empresário da Contabilidade em 1946, exatamente no ano em que eu me formei.\nP/2 - E a sua família? Fala um pouquinho do seu pai, o nome dele, o nome da sua mãe, se possível a origem deles.\nR - Pois é, meus pais ambos têm origem portuguesa, mas se conheceram aqui no Brasil, se casaram evidentemente, tiveram filhos, dos quais eu sou um deles. Meu pai era do Minho e minha mãe da Beira Alta. Ambos tiveram uma vida trabalhosa, eles hoje já não existem, mas eu tenho muito boa recordação de ambos, porque na realidade trataram todos os filhos com muito carinho e, assim, acima de tudo, deram a eles o que se podia dizer transparência, honesti"}, "folder_size_gb": 0.0}, "folder_size_gb": 2.646}, "CRC_HV003_Ernesto Marra": {"Audiovisual": {"Acesso": {"CRC_HV003_Ernesto Marra.mp4": {"size_mb": 2223.654, "modified": "2024-09-04 17:00:06", "extension": "MP4", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV003_Ernesto Marra\\Audiovisual\\Acesso\\CRC_HV003_Ernesto Marra.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4764827.0, "duration": 4764.83, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 2.172}, "Preservação": {"DVC_0254.avi": {"size_mb": 22748.8215, "modified": "2024-08-26 15:44:26", "extension": "AVI", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV003_Ernesto Marra\\Audiovisual\\Preservação\\DVC_0254.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 6459286.0, "duration": 6459.29, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 22.216}, "folder_size_gb": 24.387}, "folder_size_gb": 24.387}, "CRC_HV004_Roberto Dreyfuss": {"Audiovisual": {"Acesso": {"CRC_HV004_Roberto Dreyfuss.mp4": {"size_mb": 2765.1786, "modified": "2024-09-04 17:27:38", "extension": "MP4", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV004_Roberto Dreyfuss\\Audiovisual\\Acesso\\CRC_HV004_Roberto Dreyfuss.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4883746.0, "duration": 4883.75, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 2.7}, "Preservação": {"DVC_0259.avi": {"size_mb": 25212.1173, "modified": "2024-08-26 13:25:22", "extension": "AVI", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV004_Roberto Dreyfuss\\Audiovisual\\Preservação\\DVC_0259.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 7158718.0, "duration": 7158.72, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 24.621}, "folder_size_gb": 27.322}, "folder_size_gb": 27.322}, "CRC_HV005_Antonio Luiz Sarno": {"Audiovisual": {"Acesso": {"CRC_HV005_Antonio Luiz Sarno.mp4": {"size_mb": 9187.817, "modified": "2024-08-30 19:26:00", "extension": "MP4", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV005_Antonio Luiz Sarno\\Audiovisual\\Acesso\\CRC_HV005_Antonio Luiz Sarno.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5536498.0, "duration": 5536.5, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 8.972}, "Preservação": {"Localização do Bruto.txt": {"size_mb": 0.0001, "modified": "2024-09-09 15:45:22", "extension": "TXT", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV005_Antonio Luiz Sarno\\Audiovisual\\Preservação\\Localização do Bruto.txt", "category": "Textual", "content_preview": "Mídia original: DVC_0259\n\nLocalização: Pasta \"CRC_HV004_Roberto Dreyfuss\""}, "folder_size_gb": 0.0}, "folder_size_gb": 8.972}, "Textual": {"CRC_HV005_Antonio Luiz Sarno_rev.docx": {"size_mb": 0.0423, "modified": "2020-04-17 07:28:32", "extension": "DOCX", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV005_Antonio Luiz Sarno\\Textual\\CRC_HV005_Antonio Luiz Sarno_rev.docx", "category": "Textual", "content_preview": "Centro de Memória do Conselho Regional de Contabilidade de São Paulo\nDepoimento de Antônio Luiz Sarno\nEntrevistado por Stella Franco e Ignez Barretto\nSão Paulo, 2 de abril de 2001\nRealização Museu da Pessoa \nCódigo CRC_HV005\nTranscrito por Jeane Gonçalves\nRevisado por Teresa de Carvalho Magalhães\nP/1 – Senhor Antônio, para a gente começar, eu gostaria que o senhor falasse seu nome completo, local e data de nascimento.\nR –Meu nome é Antônio Luiz Sarno, nasci em São Paulo, capital, cinco de janeiro de 1939.\nP/1 – E o nome dos seus pais?\nR – Meu pai, Gennaro Sarno, minha mãe, Raqueli Antonia Colicigno Sarno.\nP/1 – Eles são de onde?\nR – Ambos da Itália, são da Itália, ambos são nascidos lá.\nP/1 – Eles eram da mesma...?\nR – Não. Conheceram-se aqui no Brasil.\nP/1 – O senhor sabe um pouco a história deles, dos seus avós?\nR – Meu pai, em 1913, 1914, não precisamente exatamente o ano, veio com o pai dele, porque ele era o primogênito, para a Argentina. O plano da família era que paulatinamente viessem os outros dois irmãos e a mãe. Em 1914, quando deu a Primeira Guerra, em 1915, a Itália entrou também na Guerra. E meu pai retornou como voluntário. Foi ferido no braço esquerdo, hospitalizado"}, "folder_size_gb": 0.0}, "folder_size_gb": 8.973}, "CRC_HV006_Luiz Fernando Mussolini": {"Audiovisual": {"Acesso": {"CRC_HV006_Luiz Fernando Mussolini.mp4": {"size_mb": 8497.7622, "modified": "2024-08-30 21:00:54", "extension": "MP4", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV006_Luiz Fernando Mussolini\\Audiovisual\\Acesso\\CRC_HV006_Luiz Fernando Mussolini.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5121650.0, "duration": 5121.65, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 8.299}, "Preservação": {"Localização do Bruto.txt": {"size_mb": 0.0001, "modified": "2024-09-09 15:40:44", "extension": "TXT", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV006_Luiz Fernando Mussolini\\Audiovisual\\Preservação\\Localização do Bruto.txt", "category": "Textual", "content_preview": "Mídia original: DVC_0254\n\nLocalização: Pasta \"CRC_HV003_Ernesto Marra\""}, "folder_size_gb": 0.0}, "folder_size_gb": 8.299}, "Textual": {"CRC_HV006_Luiz Fernando Mussolini_rev.docx": {"size_mb": 0.044, "modified": "2020-04-28 15:04:28", "extension": "DOCX", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV006_Luiz Fernando Mussolini\\Textual\\CRC_HV006_Luiz Fernando Mussolini_rev.docx", "category": "Textual", "content_preview": "Projeto: Centro de Memória do Conselho Regional de Contabilidade de São Paulo\nDepoimento de Luiz Fernando Mussolini\nEntrevistado por Stella Franco e Ignez Barretto\nLocal: São Paulo - SP\nData: 2 de abril de 2001\nRealização: Museu da Pessoa  \nCódigo da entrevista: CRC_HV006\nTranscrito por Jeane Gonçalves\nRevisado por Grazielle Pellicel\nP/1 - Stella Franco\nP/2 - Ignez Barretto\nR - Luiz Fernando Mussolini\nP/1 – Professor, por favor, para a gente começar eu gostaria que o senhor falasse o seu nome completo, local de data de nascimento.\nR – É Luiz Fernando Mussolini, graças a Deus nascido em Santa Rita do Passa Quatro (SP), que é a capital intelectual da região, região que inclui Mococa e outras cidadezinhas adjacentes.\nP/1 – E a data do seu nascimento?\nR – É 5 de janeiro de 1919, embora não pareça. (risos)\nP/1 – E qual o nome dos seus pais?\nR – Luiz Mussolini e Marieta Mussolini, ou Ana Maria Mussolini, mais conhecida como Marieta. Ela é daquela cidade famosa, onde tem aquele queijo famoso, Gorgonzola, no norte da Itália.\nP/1 – Qual é o nome da cidade?\nR – Gorgonzola mesmo, é um subúrbio de Milano [Milão].\nP/1 – E o senhor sabe a história, quer dizer, o seu pai também veio da Itália, nã"}, "folder_size_gb": 0.0}, "folder_size_gb": 8.299}, "CRC_HV007_Sérgio de Iudícibus": {"Audiovisual": {"Acesso": {"CRC_HV007_Sérgio de Iudícibus.mp4": {"size_mb": 7673.5497, "modified": "2024-08-30 22:26:10", "extension": "MP4", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV007_Sérgio de Iudícibus\\Audiovisual\\Acesso\\CRC_HV007_Sérgio de Iudícibus.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4625321.0, "duration": 4625.32, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 7.494}, "Preservação": {"DVC_0253.avi": {"size_mb": 22028.2291, "modified": "2024-08-26 13:38:44", "extension": "AVI", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV007_Sérgio de Iudícibus\\Audiovisual\\Preservação\\DVC_0253.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 6254682.0, "duration": 6254.68, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 21.512}, "folder_size_gb": 29.006}, "Textual": {"CRC_HV007_Sérgio de Iudícibus_rev.docx": {"size_mb": 0.0401, "modified": "2020-04-28 15:04:36", "extension": "DOCX", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV007_Sérgio de Iudícibus\\Textual\\CRC_HV007_Sérgio de Iudícibus_rev.docx", "category": "Textual", "content_preview": "Projeto: Centro de Memória do Conselho Regional de Contabilidade de São Paulo\nDepoimento de Sérgio de Iudícibus\nEntrevistado por Stella Franco e Ignez Barretto\nLocal: São Paulo - SP\nData: 02 de abril de 2001\nRealização: Museu da Pessoa\nCódigo da entrevista: CRC_HV007\nTranscrito por Jeane Gonçalves\nRevisado por Grazielle Pellicel\nP/1 - Stella Franco\nP/2 - Ignez Barretto\nR - Sérgio de Iudícibus\nP/1 - Professor, por favor, para a gente começar, eu gostaria que o senhor dissesse o seu nome completo, local e data de nascimento.\nR - Bom, meu nome completo é Sérgio de Iudícibus. Eu nasci na Cidade de Bari, na Itália, em 25 de setembro de 1935.\nP/1 - E o nome dos seus pais, por favor?\nR - Meu pai é Paolo Francesco de Iudícibus e minha mãe Lucia Orlando de Iudícibus.\nP/1 - Eles nasceram onde, seus pais?\nR - Meus pais nasceram na Itália.\nP/1 - Na mesma cidade que o senhor?\nR - Meu pai nasceu numa província da cidade de Bari, chamada Martina Franca. E minha mãe nasceu em Bari, mesma cidade que eu nasci. Mas eu sou cidadão brasileiro, é importante lembrar isso.\nP/1 - Quando o senhor se mudou para o Brasil, o senhor tinha quantos anos?\nR - Acho que eu tinha uns 12 ou 13 anos, 13 anos.\nP/1 - Foi"}, "folder_size_gb": 0.0}, "folder_size_gb": 29.006}, "CRC_HV008_Ippo Watanabe": {"Audiovisual": {"Acesso": {"CRC_HV008_Ippo Watanabe.mp4": {"size_mb": 6692.3974, "modified": "2024-08-31 00:13:02", "extension": "MP4", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV008_Ippo Watanabe\\Audiovisual\\Acesso\\CRC_HV008_Ippo Watanabe.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4035932.0, "duration": 4035.93, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 6.536}, "Preservação": {"Localização do Bruto.txt": {"size_mb": 0.0001, "modified": "2024-09-09 15:43:38", "extension": "TXT", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV008_Ippo Watanabe\\Audiovisual\\Preservação\\Localização do Bruto.txt", "category": "Textual", "content_preview": "Mídia original: DVC_0255\n\nLocalização: Pasta \"CRC_HV001_Luiz Bertasi Filho\""}, "folder_size_gb": 0.0}, "folder_size_gb": 6.536}, "Textual": {"CRC_HV008_Ippo Watanabe_rev.docx": {"size_mb": 0.0368, "modified": "2020-04-28 15:04:44", "extension": "DOCX", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV008_Ippo Watanabe\\Textual\\CRC_HV008_Ippo Watanabe_rev.docx", "category": "Textual", "content_preview": "Projeto: Centro de Memória do Conselho Regional de Contabilidade de São Paulo\nDepoimento de Ippo Watanabe\nEntrevistado por Ignez Barretto e Andréa Afonso\nLocal: São Paulo - SP\nData: 3 de maio de 2001\nRealização: Museu da Pessoa\nCódigo da entrevista: CRC_HV008\nTranscrito por Marcília Ursini\nRevisado por Grazielle Pellicel\nP/1 - Ignez Barretto\nP/2 - Andréa Afonso\nR - Ippo Watanabe\nP/1 - Bom, eu vou começar fazendo algumas perguntas básicas do roteiro geral, só para situar, e depois eu vou passar para a parte mais temática, tá?\nR - Muito bem.\nP/1 - Então, eu gostaria que o senhor falasse o seu nome, local e data de nascimento.\nR - O meu nome é Ippo Watanabe, nasci na cidade de Presidente Prudente no dia 8 de junho de 1931. Daqui a alguns dias eu faço 70 anos.\nP/1 - O nome do seu pai e da sua mãe?\nR - O meu pai chama Shigueru Watanabe, a minha mãe Tsunei Watanabe.\nP/1 - A origem da sua família?\nR - Os meus ancestrais eram agricultores no Japão.\nP/1 - E vieram para o Brasil?\nR - Vieram para o Brasil com a imigração, mais ou menos em 1925, 1927, por aí.\nP/1 - Certo. E o senhor, então, nasceu em Presidente Prudente...\nR - Nasci em Presidente Prudente. O meu pai começou a trabalhar no Vale"}, "folder_size_gb": 0.0}, "folder_size_gb": 6.536}, "CRC_HV009_Zoilo de Souza Assis": {"Audiovisual": {"Acesso": {"CRC_HV009_Zoilo de Souza Assis.mp4": {"size_mb": 8285.3903, "modified": "2024-08-31 01:33:00", "extension": "MP4", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV009_Zoilo de Souza Assis\\Audiovisual\\Acesso\\CRC_HV009_Zoilo de Souza Assis.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4993689.0, "duration": 4993.69, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 8.091}, "Preservação": {"DVC_0263.avi": {"size_mb": 17649.9743, "modified": "2024-08-27 13:37:00", "extension": "AVI", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV009_Zoilo de Souza Assis\\Audiovisual\\Preservação\\DVC_0263.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 5011506.0, "duration": 5011.51, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 17.236}, "folder_size_gb": 25.328}, "Textual": {"CRC_HV009_Zoilo de Souza Assis_rev.docx": {"size_mb": 0.0436, "modified": "2020-04-29 11:27:02", "extension": "DOCX", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV009_Zoilo de Souza Assis\\Textual\\CRC_HV009_Zoilo de Souza Assis_rev.docx", "category": "Textual", "content_preview": "Centro de Memória do Conselho Regional de Contabilidade de São Paulo \nDepoimento de Zoilo de Souza Assis\nEntrevistado por Ignez Barretto e Andréa Afonso\nSão Paulo, 4 de maio de 2001\nRealização Museu da Pessoa\nCódigo CRC_HV009\nTranscrito por Marcília Ursini\nRevisado por Wini Calaça\nP/1 - Bom, gostaria que o senhor falasse seu nome, local e data de nascimento.\nR - Meu nome é Zoilo de Souza Assis, nascido na Vila de Macaia, em Bom Sucesso, que é a cidade, em 4 de março de 1927.\nP/1 - O nome do seu pai e da sua mãe?\nR - João Batista de Assis e Maria Luiza de Assis.\nP/1 - A origem dos dois?\nR - Ambos mineiros.\nP/1 - O senhor nasceu nessa cidade. E a sua infância, o senhor passou em Bom Sucesso?\nR - É, na Vila de Macaia.\nP/1 - Vila de Macaia.\nR - Vila de Macaia, que é um lugarejo lá com duzentas ou trezentas casas, onde eu nasci. A cidade fica um pouco mais adiante, mas pertence à cidade.\nP/1 - Pertence à cidade. Certo.\nR - Vivi aí durante alguns seis anos, depois aí mudei para a fazenda e vivi na fazenda até os quatorze anos.\nP/1 - A sua primeira escola, qual foi?\nR - Foi em Macaia. A minha primeira professora chamava dona Quietinha, era o apelido dela.\nP/1 - E com quantos anos o senhor"}, "folder_size_gb": 0.0}, "folder_size_gb": 25.328}, "CRC_HV010_Sérgio Approbato Machado": {"Audiovisual": {"Acesso": {"CRC_HV010_Sérgio Approbato Machado.mp4": {"size_mb": 7851.9166, "modified": "2024-08-31 02:57:46", "extension": "MP4", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV010_Sérgio Approbato Machado\\Audiovisual\\Acesso\\CRC_HV010_Sérgio Approbato Machado.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4733228.0, "duration": 4733.23, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 7.668}, "Preservação": {"DVC_0260.avi": {"size_mb": 16674.4023, "modified": "2024-08-26 15:19:06", "extension": "AVI", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV010_Sérgio Approbato Machado\\Audiovisual\\Preservação\\DVC_0260.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4734496.0, "duration": 4734.5, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 16.284}, "folder_size_gb": 23.951}, "folder_size_gb": 23.951}, "CRC_HV011_Ynel Alves de Camargo": {"Audiovisual": {"Acesso": {"CRC_HV011_Ynel Alves de Camargo.mp4": {"size_mb": 7403.4763, "modified": "2024-08-31 04:42:02", "extension": "MP4", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV011_Ynel Alves de Camargo\\Audiovisual\\Acesso\\CRC_HV011_Ynel Alves de Camargo.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4463326.0, "duration": 4463.33, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 7.23}, "Preservação": {"DVC_0262.avi": { HV012_Victor Domingos Galloro\\Textual\\CRC_HV012_Victor Domingos Galloro_rev.docx", "category": "Textual", "content_preview": "Centro de Memória do Conselho Regional de Contabilidade de São Paulo\nDepoimento de Victor Domingos Garollo\nEntrevistado por Ignez Barreto e Andréa Afonso\nSão Paulo, 18/06/2001\nRealização: Museu da Pessoa\nEntrevista número: CRC_HV012\nTranscrito por Neuza Guerreiro de Carvalho\nRevisado por Luiza Gallo Favareto\nP/1 – Para início de conversa, eu gostaria que o senhor falasse o seu nome completo, local e data de nascimento.\nR – Eu me chamo Victor Domingos Garollo, nascido em São Paulo, bairro de Casa Verde, em vinte de abril de 1942.\nP/1– O nome de seu pai, de sua mãe?\nR – O meu pai se chamava Vicente Garollo e a minha mãe Maria Filomena Petraroli Garollo. \nP/1– E o senhor sabe a origem da sua família?\nR – Sei, como não! Ambos são italianos, meu pai veio na década de trinta aqui para o Brasil, conheceu minha mãe aqui, e se casou, casaram-se. Meu pai foi comerciante a vida toda e, no final da vida dele, se formou em Direito na PUC, abandonou o comércio e passou a ser um advogado. Conseguiu sucesso.\nP/1 – E o senhor sabe porque ele veio para o Brasil?\nR – Pelas dificuldades que na época tinha lá onde ele nasceu. Ele era do sul da Itália e na época tinha muito pouco trabalho, principalment"}, "folder_size_gb": 0.0}, "folder_size_gb": 20.544}, "CRC_HV013_Luiz Carlos Vaini": {"Audiovisual": {"Acesso": {"CRC_HV013_Luiz Carlos Vaini.mp4": {"size_mb": 10968.7047, "modified": "2024-08-31 08:17:12", "extension": "MP4", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV013_Luiz Carlos Vaini\\Audiovisual\\Acesso\\CRC_HV013_Luiz Carlos Vaini.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6607601.0, "duration": 6607.6, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 10.712}, "Preservação": {"DVC_0258.avi": {"size_mb": 23342.6036, "modified": "2024-08-28 12:01:38", "extension": "AVI", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV013_Luiz Carlos Vaini\\Audiovisual\\Preservação\\DVC_0258.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 6627888.0, "duration": 6627.89, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 22.796}, "folder_size_gb": 33.507}, "Textual": {"CRC_HV013_Luiz Carlos Vaini_rev.docx": {"size_mb": 0.0445, "modified": "2020-04-22 13:20:30", "extension": "DOCX", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV013_Luiz Carlos Vaini\\Textual\\CRC_HV013_Luiz Carlos Vaini_rev.docx", "category": "Textual", "content_preview": "Centro de Memória do Conselho Regional de Contabilidade de São Paulo\nDepoimento de Luiz Carlos Vaini\nEntrevistado por Ignez Barreto e Andréa Afonso\nSão Paulo, 28/06/2001\nRealização: Museu da Pessoa\nEntrevista número: CRC_HV013\nTranscrito por Marcília Ursini\nRevisado por Luiza Gallo Favareto\nP/1 - Bom, eu gostaria que o senhor iniciasse falando o seu nome, local e data de nascimento.\nR - Pois não. O meu nome é Luiz Carlos Vaini, eu nasci em Duartina, Estado de São Paulo, é uma cidade muito próspera, perto de Bauru. O próspera é por minha conta, mas ela é muito próspera, sim. E isso aconteceu no dia 28 de dezembro de 1944.\nP/1 - O nome do seu pai e da sua mãe?\nR - Meu pai, Cândido Luiz Vaini, e minha mãe, Amabile Crivellari Vaini.\nP/1 - E eles são de Duartina?\nR - Não, o meu pai foi nascido em Sertãozinho, na região de Ribeirão Preto, e a minha mãe em São Carlos.\nP/1 - Certo. E eles foram para Duartina depois de casados? Como foi essa história?\nR - Sim, depois de casados. O meu pai conheceu a minha mãe em São Carlos, é uma história até interessante, porque eles se conheceram criança. O meu avô por parte do meu pai era administrador de fazenda, e administrava uma fazenda próxima da fa"}, "folder_size_gb": 0.0}, "folder_size_gb": 33.507}, "CRC_HV014_José Serafim Abrantes": {"Audiovisual": {"Acesso": {"CRC_HV014_José Serafim Abrantes.mp4": {"size_mb": 7689.2959, "modified": "2024-08-31 10:06:04", "extension": "MP4", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV014_José Serafim Abrantes\\Audiovisual\\Acesso\\CRC_HV014_José Serafim Abrantes.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4635331.0, "duration": 4635.33, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 7.509}, "Preservação": {"DVC_0257.avi": {"size_mb": 16370.472, "modified": "2024-08-28 17:47:38", "extension": "AVI", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV014_José Serafim Abrantes\\Audiovisual\\Preservação\\DVC_0257.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 4648210.0, "duration": 4648.21, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 15.987}, "folder_size_gb": 23.496}, "Textual": {"CRC_HV014_José Serafim Abrantes_rev.docx": {"size_mb": 0.0338, "modified": "2020-06-02 04:50:04", "extension": "DOCX", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV014_José Serafim Abrantes\\Textual\\CRC_HV014_José Serafim Abrantes_rev.docx", "category": "Textual", "content_preview": "Centro de Memória do Conselho Regional de Contabilidade de São Paulo\nDepoimento de José Serafim Abrantes\nEntrevistado por: Ignez Barretto e Andréa Afonso\nSão Paulo, 28 de junho de 2001\nRealização Museu da Pessoa\nCódigo: CRC_HV014\nTranscrito por: Andréa Afonso\nRevisado por: Nataniel Torres\nP/1 – Bom, senhor Serafim, vou começar pedindo que o senhor fale o seu nome completo, local e data de nascimento.\nR – Eu, embora sendo brasileiro, nasci em Portugal, na aldeia do Minhocal, no Conselho de Frederico da Beira, Distrito da Guarda. Mas sou brasileiro naturalizado. Chamo-me José Serafim Abrantes e minha atividade principal há alguns anos é empresário da Contabilidade. Nasci em 26 de novembro de 1942.\nP/1 – Gostaria que o senhor dissesse o nome do seu pai, da sua mãe...\nR – Papai chamava-se Celestino Serafim Abrantes, nasceu em 1912, também no Minhocal, em Portugal. E minha mãe chamava-se Maria do Céu Abrantes, nascida em 1909, nascida em Lamego, na Província de Viseu.\nP/1 – O senhor conheceu os seus avós?\nR – Não conheci nenhum dos meus avós.\nP/1 – E eles eram portugueses?\nR – Eram portugueses.\nP/1 – E seu pai fazia o que em Portugal?\nR – O meu pai, em Portugal naturalmente, ajudava nos"}, "folder_size_gb": 0.0}, "folder_size_gb": 23.496}, "CRC_HV015_José Antonio de Godoy": {"Audiovisual": {"Acesso": {"CRC_HV015_José Antonio de Godoy.mp4": {"size_mb": 9310.3231, "modified": "2024-08-31 11:39:20", "extension": "MP4", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV015_José Antonio de Godoy\\Audiovisual\\Acesso\\CRC_HV015_José Antonio de Godoy.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5610338.0, "duration": 5610.34, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 9.092}, "Preservação": {"DVC_0256.avi": {"size_mb": 19814.1912, "modified": "2024-08-30 14:34:40", "extension": "AVI", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV015_José Antonio de Godoy\\Audiovisual\\Preservação\\DVC_0256.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Mono", "audio_codec": "PCM", "duration_ms": 5626020.0, "duration": 5626.02, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 19.35}, "folder_size_gb": 28.442}, "Textual": {"CRC_HV015_José Antonio de Godoy_rev.docx": {"size_mb": 0.0381, "modified": "2020-06-01 07:38:32", "extension": "DOCX", "full_path": "D:\\CRC - Conselho Regional de Contabilidade (CRC)\\HV\\CRC_HV015_José Antonio de Godoy\\Textual\\CRC_HV015_José Antonio de Godoy_rev.docx", "category": "Textual", "content_preview": "Centro de Memória Conselho Regional de Contabilidade São Paulo\nDepoimento de José Antonio de Godoy\nEntrevistado por: Ignez Barreto e Andréa Afonso\nSão Paulo, 26 de junho de 2001.  \nRealização Museu da Pessoa\nCódigo CRC_HV015\nTranscrito por: Daniele Coutinho\nRevisado por: Nataniel Torres\nP/1 - Bom, vou pedir para o senhor, em primeiro lugar, falar o seu nome, local e data de nascimento.\nR - Meu nome é José Antonio de Godoy, nasci em Piracicaba em São Paulo, em 15 de novembro de 1947.\nP/1 - O nome dos seus pais, pai e mãe?\nR - Meu pai, José de Godoy, minha mãe Alayde Gosser de Godoy.\nP/1 - E eles são de onde?\nR - Os dois são naturais de Piracicaba.\nP/1 - Os avós?\nR - Meus avós maternos são: o João ______, minha avó materna, deu branco, é a Rosa ________. Meus avós paternos são: Sebastião de Godoy, e minha avó, Maria de Godoy.\nP/1 - O senhor conhece a origem dos seus avós?\nR - Olha, a minha avó paterna é brasileira da gema, e o meu avô tem origem, a família dele veio do norte da Espanha, em fronteira com a Áustria, essa região. Os meus avós maternos, a minha avó também é brasileira, o meu avô, a origem da família dele é espanhola.\nP/1 - Também espanhola?\nR - Também espanhola.\nP/1 - E"}, "folder_size_gb": 0.0}, "folder_size_gb": 28.442}, "folder_size_gb": 309.149}, "IC": {"Master CRC": {"DVC_0264.avi": {"size_mb": 7704.9715, "modified": "2024-08-28 12:09:10", "extension": "AVI", "full_path": "D:\\CRC - Conselho Regional de Cont
