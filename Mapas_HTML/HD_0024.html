ário do laboratório onde trabalhava que havia falido. Com a proposta de ajudar a empresa a deslanchar, Augusto aceitou o desafio e está há 23 na EMS cuidando sempre da área de Produção e, agora, compondo o Conselho.\nSINOPSE\nNatural de Portugal, Augusto Viseu Fernandes conta como foi a infância pelos campos de seu país natal, onde o pai era açougueiro. Com a gana de trabalhar e d"}, "folder_size_gb": 0.0}, "folder_size_gb": 23.78}, "EMS_HV005": {"Fotos": {"Alta": {"EMS_HV005_FT003.jpg": {"size_mb": 6.1757, "modified": "2013-12-08 22:05:04", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV005\\Fotos\\Alta\\EMS_HV005_FT003.jpg", "category": "Image", "dimension": "3347x3293", "resolution": "3347x3293", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV005_FT003.jpg"}, "folder_size_gb": 0.006}, "Baixa": {"EMS_HV005_FT002.jpg": {"size_mb": 0.3485, "modified": "2013-12-08 22:02:28", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV005\\Fotos\\Baixa\\EMS_HV005_FT002.jpg", "category": "Image", "dimension": "5028x3456", "resolution": "5028x3456", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV005_FT002.jpg"}, "EMS_HV005_FT001.jpg": {"size_mb": 0.5892, "modified": "2013-12-08 22:02:08", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV005\\Fotos\\Baixa\\EMS_HV005_FT001.jpg", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV005_FT001.jpg"}, "EMS_HV005_FT003.jpg": {"size_mb": 0.2625, "modified": "2013-12-08 22:03:02", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV005\\Fotos\\Baixa\\EMS_HV005_FT003.jpg", "category": "Image", "dimension": "3347x3293", "resolution": "3347x3293", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV005_FT003.jpg"}, "EMS_HV005_FT004.jpg": {"size_mb": 0.49, "modified": "2013-12-08 22:03:36", "extension": "JPG", "full_path": "D:\\EMS\\EMS_ undiaí?\nR – Não, de Rio Claro.\nP/1 – Você sabe um pouquinho da história da sua família, como os seus pais se conheceram?\nR – Meus pais se conheceram numa rua central de Rio Claro, minha mãe morava num curtume em Rio Claro, meu pai morava na roça. O meu avô tinha um sítio, ele morava lá e todo o final de semana eles iam dessa rua central e os homens ficavam na calçada e as mulher"}, "folder_size_gb": 0.0}, "Audiovisual": {"Acesso": {"EMS_HV005.mov": {"size_mb": 60341.1211, "modified": "2013-12-07 13:49:22", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV005\\Audiovisual\\Acesso\\EMS_HV005.mov", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3627194.0, "duration": 3627.19}, "folder_size_gb": 58.927}, "Preservação": {"private": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0469, "modified": "2013-11-22 13:52:54", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV005\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-11-22 13:52:54", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV005\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"index.bdm": {"size_mb": 0.0006, "modified": "2013-11-22 13:58:06", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV005\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\index.bdm", "category": "Other"}, "MOVIEOBJ.BDM": {"size_mb": 0.0001, "modified": "2013-11-22 12:55:42", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV005\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\MOVIEOBJ.BDM", "category": "Other"}, "CLIPINF": {"00000.CPI": {"size_mb": 0.0007, "modified": "2013-11-22 13:17:30", "extension": "CPI", "full_path": "D:\\EMS\\EMS_HV005\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\CLIPINF\\00000.CPI", "category": "Other"}, "00001.CPI oa. \nEMS_HV004_Rubens Alves de Souza\nTranscrito por Iara Gobbo.\nRevisado por Fernanda P. Prado\n\tMW Transcrições\nMINIBIOGRAFIA\nRubens Alves de Souzanasceu em Palmeira D’Oeste(SP), no dia 24 de janeiro de 1961. Mais novo de cinco irmãos, cresceu entre sua cidade natal e Pereira Barreto. Com o falecimento do pai, mudou-se com a família para a região de Campinas (SP) onde, aos 18 anos começou a trabalhar. Trabalhou em diversas empresas e quando foi demitido por conta da crise econômica passou a ser autônomo mas sempre com a vontade de voltar a ter estabilidade e um emprego fixo. Foi assim que conseguiu ingressar na EMS, então Nature’s Plus. Começou trabalhando na área de segurança mas dava apoio às atividades do Departamento Pessoal, quando precisavam. Rubens Alves segue na EMS, zelando pela segurança patrimonial e atualmente é o responsável por todos os sites da empresa. Rubens, depois de separado, formou outra família que tem duas enteadas e um casal de filhos com a primeira esposa.\nSINOPSE\nNatural do interior de São Paulo, Rubens narra como foi"}, "folder_size_gb": 0.0}, "folder_size_gb": 52.62}, "EMS_HV002": {"Audiovisual": {"Acesso": {"EMS_HV002.MOV": {"size_mb": 61361.0574, "modified": "2013-11-20 15:26:36", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV002\\Audiovisual\\Acesso\\EMS_HV002.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3650551.0, "duration": 3650.55}, "folder_size_gb": 59.923}, "Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0625, "modified": "2013-11-19 10:22:24", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV002\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-11-19 10:22:24", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV002\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\A Luiz Carlos Borgonovi\nTranscrito por Liliane Custódio\t\nRevisado por Fernanda P. Prado\n\tMW Transcrições\nMINIBIOGRAFIA\nLuiz Carlos Borgonovi nasceu em Fernando Prestes (SP), no dia 11 de julho de 1950. Com a vontade de crescer na vida, veio para São Paulo. Ao visitar a dia, foi levado ao pequeno laboratório da EMS, ainda em Santo André, quando conheceu o senhor Emiliano Sanchez que o perguntou se ele gostaria de trabalhar. Sua resposta imediata foi: sim. A partir da manhã seguinte, começaram suas atividades na EMS. Luiz Carlos Borngonovi não poupou esforços, trabalhou até altas horas da noite, durante finais de semana mas foi reconhecido e  é o atual presidente do, agora, multinacional e maior laboratório brasileiro, EMS.\nSINOPSE\nNatural de Fernando Prestes, no interior de São Paulo, Luiz Carlos Borgonovi conta como foi a infância na cidade, com muitas brincadeiras de rua e os primeiros estudos no grupo escolar onde o pai era o servente. Ainda criança foi com a irmã mais velha continuar as aulas e quando pode, voltou a cidade nat"}, "folder_size_gb": 0.0}, "Fotos": {"Baixa": {"EMS_HV002_FT001.jpg": {"size_mb": 0.3128, "modified": "2013-11-29 10:38:52", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV002\\Fotos\\Baixa\\EMS_HV002_FT001.jpg", "category": "Image", "dimension": "4681x3023", "resolution": "4681x3023", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV002_FT001.jpg"}, "EMS_HV002_FT002.jpg": {"size_mb": 0.2671, "modified": "2013-11-29 10:40:24", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV002\\Fotos\\Baixa\\EMS_HV002_FT002.jpg", "category": "Image", "dimension": "2695x3315", "resolution": "2695x3315", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV002_FT002.jpg"}, "EMS_HV002_FT003.jpg": {"size_mb": 0.6198, "modified": "2013-11-29 10:45:50", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV002\\Fotos\\Baixa\\EMS_HV002_FT003.jpg", "category": "Image", "dimension": "3456x5184", 0 15:33:20", "extension": "DOC", "full_path": "D:\\EMS\\EMS_HV007\\Textual\\EMS_HV007.doc", "category": "Textual"}, "EMS_HV007.docx": {"size_mb": 0.0273, "modified": "2026-03-02 11:29:44", "extension": "DOCX", "full_path": "D:\\EMS\\EMS_HV007\\Textual\\EMS_HV007.docx", "category": "Textual", "content_preview": "EMS – 50 anos de memória\t\nDepoimento de Pedro Scudellari Filho\nEntrevistado por Fernanda Prado\nHortolândia 26 de novembro de 2013\nRealização Museu da Pessoa\nEMS_HV007_Pedro Scudellari Filho\nTranscrito por Liliane Custódio\t\nRevisado por Fernanda P. Prado\n\tMW Transcrições\nMINIBIOGRAFIA\nPedro Scudellari Filho nasceu em Mongaguá (SP), no dia 22 de maio de 1976. Órfão de mãe aos sete anos e de pai aos 13, mudou-se para São Paulo com sua nova família. Lá terminou  os estudos e decidiu-se pela formação em Direito. Começou a trabalhar oficialmente aos 17 anos numa empresa gráfica mas durante a faculdade resolveu trocar de emprego, dá área administrativa para a prática jurídica. Trabalhou num escritório de advocacia durante nove anos e foi convidado a um novo desafio, trocar de lado e ir trabalhar como advogado na EMS, onde é desafiado cotidianamente até hoje.\nSINOPSE\nNatural de Mongaguá, litoral sul de São Paulo, Pedro Scudellari Filho conta como foi a infância na cidade, com muito surfe. Pedro narra como foi a passagem da infância para a adolescência com uma série de acontecimentos marcantes. Já sendo órfão de mãe, que havia falecido quando ele tinha sete anos, perdeu o pai com 13. Pedro"}, "folder_size_gb": 0.0}, "folder_size_gb": 86.194}, "EMS_HV006": {"Fotos": {"Baixa": {"EMS_HV006_FT001.jpg": {"size_mb": 0.3222, "modified": "2013-12-08 22:07:32", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV006\\Fotos\\Baixa\\EMS_HV006_FT001.jpg", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV006_FT001.jpg"}, "EMS_HV006_FT003.jpg": {"size_mb": 0.4988 size_gb": 8.449}, "folder_size_gb": 84.717}, "Textual": {"EMS_HV006.docx": {"size_mb": 0.0424, "modified": "2014-01-20 09:33:58", "extension": "DOCX", "full_path": "D:\\EMS\\EMS_HV006\\Textual\\EMS_HV006.docx", "category": "Textual", "content_preview": "EMS 50 Anos de Memória\nDepoimento de Silvia Rezende Valin\nEntrevistada por Fernanda P. Prado\nHortolândia, 25 de novembro de 2013\nRealização Museu da Pessoa\nEMS_HV006_Silvia Rezende Valin\nTranscrito por Ana Carolina Ruiz\t\nRevisado por Fernanda P. Prado\n\tMW Transcrições\nMINIBIOGRAFIA\nSilvia Rezende Valin nasceu em São Bernardo do Campo (SP), no dia 16 de junho de 1966. Com mais duas irmãs, Silvia cresceu, brincou e estudou com o apoio da família mas a separação dos pais quando ela tinha 13 anos marcou. Foi uma ruptura de uma estrutura de vida e uma fase de amadurecimento. O pai foi morar em Lins (SP) e todas as meninas ficaram com a mãe e tiveram que assumir algumas responsabilidades. Silvia, então, começou a trabalhar, sua primeira atividade foi num escritório de contabilidade. De lá, não parou mais. Fez o curso técnico de secretariado, o superior de administração. Trabalhou por nove anos no Uemura, depois na empresa do tio e em outra empresa por um breve período. 1996 também foi um ano marcante para Silvia, que era casada e tinha uma filha. Um assalto a tornou viúva. Na sequencia conseguiu voltar a trabalhar e ingressou na área administrativa da EMS, onde acompanhou as transformaçõ"}, "folder_size_gb": 0.0}, "folder_size_gb": 84.726}, "EMS_HV003": {"Audiovisual": {"Acesso": {"EMS_HV003.MOV": {"size_mb": 54753.1824, "modified": "2013-11-20 16:08:32", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV003\\Audiovisual\\Acesso\\EMS_HV003.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3349816.0, "duration": 3349.82}, "folder_size_gb": 53.47}, "Preservação": {"private nda P. Prado\n\tMW Transcrições\nMINIBIOGRAFIA\nAdriana Aparecida de Souza Violin nasceu em Campinas (SP), no dia cinco de junho de 1975. Com apenas dois anos de idade perdeu a mãe biológica e foi criada por uma mãe adotiva. Depois de morar em várias cidades entre a baixada santista e o interior de São Paulo, acabou mudando para perto de sua irmã mais velha que vivia em Hortolândia. Cansada dos trabalhos atrás de um balcão de um restaurante, mandou currículo para a Nature’s Plus e começou a trabalhar na produção de bastonetes. A partir daí, passou para o controle de qualidade e, com o fim da Nature’s Plus, passou para a EMS. Seu engajamento no trabalho a levou a conquistar o sonho de estudar e graduou-se em Farcácia e continua trabalhando na EMS, no setor de Pesquisa e Desenvolvimento. Adriana é casada e tem um filho.\nSINOPSE\nNatural de Campinas, Adriana narra como foi a vida com a mãe adotiva, uma amiga de uma mãe biológica que a deu ca"}, "folder_size_gb": 0.0}, "folder_size_gb": 59.875}, "EMS_HV008": {"Fotos": {"Baixa": {"EMS_HV008_FT001.jpg": {"size_mb": 0.3193, "modified": "2013-12-08 22:29:30", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV008\\Fotos\\Baixa\\EMS_HV008_FT001.jpg", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV008_FT001.jpg"}, "EMS_HV008_FT002.jpg": {"size_mb": 0.8089, "modified": "2013-12-08 22:29:52", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV008\\Fotos\\Baixa\\EMS_HV008_FT002.jpg", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV008_FT002.jpg"}, "EMS_HV008_FT003.jpg": {"size_mb": 0.7482, "modified": "2013-12-08 22:30:10", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV008\\Fotos\\Baixa\\EMS_HV008_FT003.jpg", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "3 EMS_HV008\\Textual\\EMS_HV008.docx", "category": "Textual", "content_preview": "EMS – 50 anos de Memórias\nDepoimento de Rosana Fernandes Melo\nEntrevistada por Fernanda Prado\nHortolândia, 26 de novembro de 2013 \nRealização Museu da Pessoa \nEMS_HV008_Rosana Fernandes Melo\nTranscrito por Karina Barrella\nRevisado por Fernanda P. Prado\nMW Transcrições\nMINIBIOGRAFIA\nRosana Fernandes Melo nasceu em São Paulo (SP), no dia 19 de novembro de 1958. Filha de imigrantes, desde pequena morou em São Bernardo do Campo e foi lá que começou a ter o sonho de ser secretária quando crescesse. Rosana estudou e começou a trabalhar na General Motors e se tornou secretária de lá. Depois que seu pai faleceu, deciciu passar mais tempo com seus três filhos. Voltou a trabalhar depois de alguns anos e foi então que teve seu primeiro contato com a EMS. Num primeiro momento, trabalhou lá durante alguns meses mas foi chamada para trabalhar em outra multinacional, Rosana aproveitou a volta e foi cursar sua segunda faculdade, a primeira tinha sido Letras e a segunda Propaganda e marketing. Passado mais algum tempo veio a oferta irrecusável de voltar à EMS como secretária do então presidente e filho do fundador, Carlos Sanches. Cargo em que é desafiada cotidianamente até hoje.\nSINOPSE\nNatural de"}, "folder_size_gb": 0.0}, "Audiovisual": {"Acesso": {"EMS_HV008.mov": {"size_mb": 88656.6076, "modified": "2013-12-07 21:10:36", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV008\\Audiovisual\\Acesso\\EMS_HV008.mov", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 5289022.0, "duration": 5289.02}, "folder_size_gb": 86.579}, "Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0469, "modified": "2013-11-26 12:54:04", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV008\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TDT", "ca e Memória\nDepoimento de Jorge Kalil\nEntrevistado por Fernanda P. Prado\nSão Paulo, 29 de Novembro de 2013.\nRealização Museu da Pessoa. \nEMS_HV012_Jorge Kalil\nTranscrito por Iara Gobbo.\nRevisado por Fernanda P. Prado\n\tMW Transcrições\nMINIBIOGRAFIA\nJorge Kalil nasceu em Porto Alegre (RS), no dia primeiro de dezembro de 1953. Primogênito de quatro filhos, Jorge Kalil é Professor de Medicina, Chefe de Imunologia Clínica e Alergia, diretor do Laboratório de Imunologia do Instituto do Coração da Faculdade de Medicina da Universidade de São Paulo , diretor do Instituto Butantan e presidente da Fundação Butantan. Ele também é presidente do conselho da Fundação Zerbini. Kalil é dedicado ao estudo e à pesquisa científica e criou e dirige o Comitê Científico da EMS.\nSINOPSE\nNascido em Porto Alegre, Jorge Kalil, primogênito de quatro filhos, de ascendência árabe, conta como foi a infância e os estudos numa escola jesuíta de sua cidade natal. Ele narra também seus primeiros passos na carreira médica e como ingressou na sua especialidade que é a imunologia. Dedicado aos estudos e à pesquisa, por ser um cientista nato, Kalil conta a importância da criação do Comitê Científico criado e"}, "folder_size_gb": 0.0}, "folder_size_gb": 38.187}, "EMS_HV011": {"Audiovisual": {"Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0312, "modified": "2013-11-28 14:02:46", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV011\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-11-28 14:02:46", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV011\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"INDEX.BDM": {"size_mb": 0.0006, "modified": "2013-11-28 14:14:24", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV011\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\INDEX.BDM", "category": "Other"}, "MOVIEOBJ.BDM" e Munique onde formou-se em Medicina pelo apreço que tinha pelo esporte e pela lembrança de seus anos como jogador de futebol. Nordmann ao final do curso de especialização rumou para a área da indústria farmacêutica de onde não saiu mais. Port conta de seu trabalho foi convidado a imigrar ao Brasil onde atualmente exerce o cargo de presidente da Legrand uma das empresas do grupo EMS, desde o desmembramento da EMS Marcas.\nSINOPSE\nNatural de Colônia, na Alemanhã, Nordmann ainda pequeno mudou-se com a família para Munique onde cresceu, estudou e se formou. Sempre gostou de esportes e chegou a jogar futebol durante sua adolescência. Por isso, quis estudar medicina, para ajudar os atletas mas na metade de sua formação como ortopedista, foi convidado a trabalhar na indústria farmacêutica e desde então esse tem sido seu foco de trabalho."}, "folder_size_gb": 0.0}, "folder_size_gb": 76.442}, "EMS_HV013": {"Audiovisual": {"Acesso": {"EMS_HV013.mov": {"size_mb": 85109.4291, "modified": "2013-12-08 09:16:42", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV013\\Audiovisual\\Acesso\\EMS_HV013.mov", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4798899.0, "duration": 4798.9}, "folder_size_gb": 83.115}, "Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0625, "modified": "2013-12-02 15:03:52", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV013\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-12-02 15:03:52", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV013\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"index.bdm": {"size_mb": 0.0006, "modified": "2013-12-02 15:03:54", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV013\\Audiovisual\\Preservação\\P  um apelido que carrega até hoje, “Zé do Bar”. Ainda pequeno ajudou os pais no bar e estudou até o final do atual Ensino Fundamental na cidade e o Médio, antes conhecido como “Ensino Normal” na cidade vizinha Santa Adélia. Zé do Bar conta como foi sua vinda a São Paulo para morar com o irmão mais velho, sem sucesso, foi para Catanduva, o que também não deu certo até que em Fernando Prestes mesmo foi co"}, "folder_size_gb": 0.0}, "folder_size_gb": 71.09}, "EMS_HV016": {"Audiovisual": {"Acesso": {"EMS_HV016.mov": {"size_mb": 76116.0192, "modified": "2013-12-08 08:08:46", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV016\\Audiovisual\\Acesso\\EMS_HV016.mov", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4528695.0, "duration": 4528.69}, "folder_size_gb": 74.332}, "Preservação": {"private": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0938, "modified": "2013-12-06 08:58:02", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV016\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-12-06 08:58:02", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV016\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"INDEX.BDM": {"size_mb": 0.0006, "modified": "2013-12-06 09:34:24", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV016\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\INDEX.BDM", "category": "Other"}, "MOVIEOBJ.BDM": {"size_mb": 0.0001, "modified": "2013-12-06 08:15:50", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV016\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\MOVIEOBJ.BDM", "category": "Other"}, "CLIPINF": {"00000.CPI": {"size_mb": 0.0007, "modified": "2013-12-05 08:56:32", "extension": "CPI", "full_path": "D:\\EMS\\EMS_HV016\\Audiovisual\\Preservação\\private\\AVCHD ém um ano nos Estados Unidos. Formou-se em Comunicação e entrou na EMS como estagiária. Atualmente trabalha como gerente de Marketing do Legrand um dos laboratórios do Grupo.\nSINOPSE\nNascida em Santo André, Vanessa conta que quase não se lembra de sua cidade natal porque ainda criança mudou-se com seus pais e irmão mais velho para Hortolândia. Vanessa conta quais eram suas brincadeiras preferidas e suas atividades na escola e na igreja. Junto com os amigos, quando terminou o Ensino Fundamental, foi estudar num internato no interior do Paraná. Depois de um ano, voltou à casa dos pais"}, "folder_size_gb": 0.0}, "folder_size_gb": 93.964}, "EMS_HV018": {"Audiovisual": {"Acesso": {"EMS_HV018.mov": {"size_mb": 54831.83, "modified": "2013-12-08 04:21:40", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV018\\Audiovisual\\Acesso\\EMS_HV018.mov", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3300667.0, "duration": 3300.67}, "folder_size_gb": 53.547}, "Preservação": {"private": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0312, "modified": "2013-12-05 14:56:48", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV018\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-12-05 14:56:48", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV018\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"index.bdm": {"size_mb": 0.0006, "modified": "2013-12-05 15:16:18", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV018\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\index.bdm", "category": "Other"}, "MOVIEOBJ.BDM": {"size_mb": 0.0001, "modified": "2013-12-05 14:21:12", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV018\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\MOVIEOBJ.BDM", "category": \nR – Meu nome é Ana Silvia da Costa, nasci em São Paulo. E a data de nascimento? No dia sete de novembro de 1963.\nP/1 – Tá certo, Ana. E fala pra gente o nome dos seus pais.\nR – Meu pai se chama João José da Costa. Minha mãe Geni Raposo da Costa.\nP/1 – Tá. Fala pra gente um pouquinho o que você sabe da origem da família, da onde que são seus ascendentes.\nR – Os meus pais são descendentes de portugueses, os meus avós nasceram lá. Pro lado da minha mãe eram famílias mais humildes, né? Famílias de comerciantes. O meu pai começou como office boy até prosseguir numa carreira executiva.\nP/1 – E onde que o seu pai trabalhou?\nR – Meu pai trabalhou em empresas multinacionais. Ele foi fundador da HP no Brasil na área de Recursos Humanos, que é a área que eu at"}, "folder_size_gb": 0.0}, "folder_size_gb": 59.817}, "EMS_HV017": {"Fotos": {"Baixa": {"EMS_HV017_FT001.jpg": {"size_mb": 0.5248, "modified": "2013-12-08 23:51:22", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV017\\Fotos\\Baixa\\EMS_HV017_FT001.jpg", "category": "Image", "dimension": "3326x5075", "resolution": "3326x5075", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV017_FT001.jpg"}, "EMS_HV017_FT002.jpg": {"size_mb": 0.5409, "modified": "2013-12-08 23:51:44", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV017\\Fotos\\Baixa\\EMS_HV017_FT002.jpg", "category": "Image", "dimension": "3326x4967", "resolution": "3326x4967", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV017_FT002.jpg"}, "EMS_HV017_FT003.jpg": {"size_mb": 0.4074, "modified": "2013-12-08 23:52:22", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV017\\Fotos\\Baixa\\EMS_HV017_FT003.jpg", "category": "Image", "dimension": "4976x3456", "resolution": "4976x3456", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV017_FT003.jpg"}, "EMS_HV017_FT004.jpg": {"size_mb": 0.7359, "modified": "2013-12-08 23:52:50", "extension": "JPG", "full_path": "D:\ \nP/1 – Então pra começar, eu gostaria de agradecer de você ter aceitado o nosso convite, ter vindo aqui pra essa entrevista. E pra gente começar, eu queria que você falasse o seu nome completo, o local e data do seu nascimento.\nR – José Cosme Siqueira dos Santos, nasci no Rio de Janeiro.\nP/1 – E em que dia?\nR – Dez de outubro de 1955.\nP/1 – Tá certo, Cosme. Fala pra gente também o nome dos seus pais.\nR – José Alves Leite e Beatriz Siqueira dos Santos.\nP/1 – Tá. Fala um pouquinho do que você sabe da origem da sua família, se você conheceu seus avôs.\nR – Conheci. Eu fui criado pela minha bisavó Rita, ela que me deu os primeiros dez anos da minha vida, e foram muito importantes pra mim.\nP/1 – E essa bisavó é avó da sua mãe?\nR – É avó da mãe da minha mãe... Minha bisavó é mãe da mãe da minha mãe.\nP/1 – Tá. E ela também é do Rio de Janeiro?\nR – Ela é portuguesa.\nP/1 – Portuguesa?\nR – Isso.\nP/1 – Tá certo. E como era o convívio com ela? Você tinha outros irmãos?\nR – Na realidade, mi"}, "folder_size_gb": 0.0}, "folder_size_gb": 133.006}, "EMS_HV021": {"Audiovisual": {"Acesso": {"EMS_HV021.mov": {"size_mb": 104143.4479, "modified": "2013-12-18 08:57:02", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV021\\Audiovisual\\Acesso\\EMS_HV021.mov", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 5915282.0, "duration": 5915.28}, "folder_size_gb": 101.703}, "Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0469, "modified": "2013-12-09 15:35:52", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV021\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-12-09 15:35:52", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV021\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb l quando tinha 22 anos de idade. Até o 30, ficou em casa ajudando a mãe a fazendo crochê nessa idade começou a trabalhar na EMS como auxiliar de embalagens. Dedicou-se 27 anos à empresa, desde a inauguração da fábrica em São Bernardo do Campo, até a passagem da administração do Carlos Sanchez, até as primeiras mudanças para Hortolândia. \nSINOPSE\nNatural de Portugal, Maria Lídia nos conta o quão arteira foi na infância, sempre muito paparicada pelos pais. Ao final dos estudos, passou a aprender crochê, tricô e outras habilidades manuais. Aos 22 anos, imigrou com a família para o Brasil. Maria conta como foi difícil a adaptação aqui. Mas sempre que precisava de algum remédio para melhorar a saúde corria à Farmácia San"}, "folder_size_gb": 0.0}, "folder_size_gb": 73.967}, "EMS_HV022": {"Audiovisual": {"Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0469, "modified": "2013-12-10 10:02:02", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV022\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-12-10 10:02:02", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV022\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"INDEX.BDM": {"size_mb": 0.0006, "modified": "2013-12-10 10:23:10", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV022\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\INDEX.BDM", "category": "Other"}, "MOVIEOBJ.BDM": {"size_mb": 0.0001, "modified": "2013-12-10 09:20:32", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV022\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\MOVIEOBJ.BDM", "category": "Other"}, "CLIPINF": {"00000.CPI": {"size_mb": 0.0007, "modified": "2013-12-10 09:26:54", "extension": "CPI", "full_path": "D:\\EMS\\EMS_HV022\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\CLIPINF\\00000.CPI", "category": "Other"}, "00001.CPI": {"size_mb": 0.0023, "modified": "2013-1 ndo trabalhou com vendas de eletrodomésticos e fogões a gás. Resolveu tentar a vida em São Paulo quando já era casado e tinha sua filha mais velha. Trabalhou em diversas empresas sempre na área de administração e controladoria e foi chamado para entrar na EMS em 1987 onde está até hoje como conselheiro e Vice Presidente Estatutário da EMS Participações\nSINOPSE\nNascido em Cristais Paulista, passou a infância no sítio, depois com a família mudaram para a cidade e, em seguida, para Goiás, onde o pai trabalhava com criação – compra e venda – de gado. Lá foi onde nasceram seus outros irmãos. Orlando é o terceiro, de nove filhos. De Goiás, a família mudou para Franca visando uma melhor educação"}, "folder_size_gb": 0.0}, "folder_size_gb": 66.005}, "EMS_HV024": {"Audiovisual": {"Acesso": {"EMS_HV024.mov": {"size_mb": 96897.4423, "modified": "2013-12-18 10:48:44", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV024\\Audiovisual\\Acesso\\EMS_HV024.mov", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 5863797.0, "duration": 5863.8}, "folder_size_gb": 94.626}, "Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0781, "modified": "2013-12-12 13:50:44", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV024\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-12-12 13:50:44", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV024\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"index.bdm": {"size_mb": 0.0006, "modified": "2013-12-12 13:50:44", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV024\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\index.bdm", "category": "Other"}, "MOVIEOBJ.BDM": {"size_mb": 0.0001, "modified": "2013-12-12 13:22:40", "extension": "BDM", .\nSINOPSE\nNatural de Araponga, Tereza conta o quão arteira foi na infância enquanto vivia numa casa humilde, de madeira, de chão de terra batida. Tereza conta como a vinda da família para Santo André, onde, por muitas vezes, foi cuidada pelo Senhor Emiliano na Farmácia"}, "folder_size_gb": 0.0}, "folder_size_gb": 105.829}, "EMS_HV020": {"Audiovisual": {"Acesso": {"EMS_HV020.mov": {"size_mb": 68585.3292, "modified": "2013-12-08 03:26:44", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV020\\Audiovisual\\Acesso\\EMS_HV020.mov", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4048649.0, "duration": 4048.65}, "folder_size_gb": 66.978}, "Preservação": {"private": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.1094, "modified": "2013-12-06 13:21:46", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV020\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-12-06 13:21:46", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV020\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"INDEX.BDM": {"size_mb": 0.0006, "modified": "2013-12-06 13:24:54", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV020\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\INDEX.BDM", "category": "Other"}, "MOVIEOBJ.BDM": {"size_mb": 0.0001, "modified": "2013-12-06 12:16:56", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV020\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\MOVIEOBJ.BDM", "category": "Other"}, "CLIPINF": {"00000.CPI": {"size_mb": 0.0007, "modified": "2013-12-05 12:54:20", "extension": "CPI", "full_path": "D:\\EMS\\EMS_HV020\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\CLIPINF\\00000.CPI", "category": "Other"}, "00001.CPI": {"size_mb": 0.0189, "modified": "2013-12-05 12:54:20", "extension": 998, "modified": "2014-01-14 09:42:48", "extension": "DOCX", "full_path": "D:\\EMS\\EMS_HV025\\Textual\\EMS_HV025.docx", "category": "Textual", "content_preview": "EMS – 50 anos de Memória\nDepoimento de Kleber Fabiano Ruiz\nEntrevistado por Fernanda P. Prado\nSão Bernardo do Campo, 13/12/2013. \nRealização Museu da Pessoa \nEMS_HV025_Kleber Fabiano Ruiz\nTranscrito por Karina Medici Barrella\nMW Transcrições\nP/1 – Kleber, bom dia.\nR – Bom dia.\nP/1 – Primeiro eu gostaria de agradecer de você ter aceitado o convite para essa entrevista. E pra gente começar eu queria que você falasse o seu nome completo, o lugar onde você nasceu e a data do seu nascimento.\nR – Obrigado pelo convite, pra mim é um privilégio participar desse evento. Meu nome é Kleber Fabiano Ruiz, eu nasci em São Bernardo do Campo em 12 do três de 75.\nP/1 – Fala pra gente o nome dos seus pais.\nR – Meu pai é Valmir Ruiz e minha mãe é Benedita Gonzaga Ruiz.\nP/1 – E o que você sabe da origem da família?\nR – O meu pai é descendente de italiano com espanhol, meu avô era italiano e minha avó era espanhola. Minha mãe é mineira, filha de mineiro. O meu pai veio pra cá bem novinho, meu pai era gêmeos, o irmão dele faleceu e eles são em 14 irmãos, quatro deles morreram. Minha mãe também, ela é a décima segunda, eles são em 13. Naquela época tinha bastante filhos, né? Eles se conheceram em Promiss"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"private": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0625, "modified": "2013-12-13 09:23:36", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV025\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-12-13 09:23:36", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV025\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"index.bdm": {"size_mb": 0.0006, "modified": "2013-12-13 09:56:52", "extension": n": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 15000.858129, "duration": 15.0}, "folder_size_gb": 8.643}, "folder_size_gb": 8.643}, "folder_size_gb": 8.643}, "folder_size_gb": 8.643}, "folder_size_gb": 8.643}, "folder_size_gb": 82.545}, "Textual": {"EMS_HV030.docx": {"size_mb": 0.1385, "modified": "2014-02-12 11:05:10", "extension": "DOCX", "full_path": "D:\\EMS\\EMS_HV030\\Textual\\EMS_HV030.docx", "category": "Textual", "content_preview": "EMS 50 Anos de Memória\nDepoimento de Francisco Carlos Ricci\nEntrevistado por Fernanda Prado\nSão Bernardo do Campo, 28/01/2014\nEMS_HV030_Francisco Carlos Ricci\nRealização Museu da Pessoa\nTranscrito por Mariana Wolff\n\tMW Transcrições\nP/1 – Seu Francisco, boa tarde.\nR – Boa tarde.\nP/1 – Primeiro, eu gostaria de agradecer de o senhor ter aceitado o convite para essa entrevista e pra gente começar, eu queria que o senhor falasse pra gente, o seu nome completo, o local e a data do seu nascimento.\nR – Meu nome é Francisco Carlos Ricci, sou nascido e vivi toda a minha vida em Santo André, nasci em três de agosto de 1953.\nP/1 – Tá certo. Fala pra gente o nome dos seus pais, Francisco.\nR – Meu pai é José Francisco Ricci, 84 anos, a mamãe já é falecida, chamava-se Irma Ricci.\nP/1 – Tá, fala pra gente o que o senhor sabe da ascendência da família, né, da onde que são…\nR – Sim, são os dois lados vieram da região do Veneto, né, da Itália, né, eles chegaram por volta de 1887, os dois lados da família, né, vieram a parte da mamãe veio de Treviso e os meus avós paternos vieram de Rovigo e Solighetto, Soligo, né, área de Soligo.\nP/1 – E qual que era a atividade dos seus pais aqui em Santo André?\nR –"}, "folder_size_gb": 0.0}, "Fotos": {"Alta": {"EMS_HV030_FT001.jpg": {"size_mb": 7.941, "modified": "2014-02-18 20:07:26", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV030\\Fotos\\Alta\\EMS_HV030_FT001.jpg", "category": "I r?\nR – Em Rio Grande, Rio Grande do Sul.\nP/1 – Fala pra gente o nome dos seus pais também.\nR – Oscar Rodrigues dos Santos e Beatriz Barbosa dos Santos.\nP/1 – Conta pra gente o que você sabe da origem da sua família, né, da onde que vieram os seus avós, né, como é que…\nR – Meus pais são todos do Rio Grande do Sul, do interior do Rio Grande do Sul, fui criado lá até os 18 anos, né, e depois, vim pra Campinas, interior de São Paulo.\nP/1 – E você conheceu os seus avós?\nR – Meus avós eu n"}, "folder_size_gb": 0.0}, "Fotos": {"Alta": {"EMS_HV028_FT001.jpg": {"size_mb": 9.2378, "modified": "2014-02-18 19:37:00", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV028\\Fotos\\Alta\\EMS_HV028_FT001.jpg", "category": "Image", "dimension": "3217x4380", "resolution": "3217x4380", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV028_FT001.jpg"}, "EMS_HV028_FT004.jpg": {"size_mb": 7.6801, "modified": "2014-02-18 19:40:00", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV028\\Fotos\\Alta\\EMS_HV028_FT004.jpg", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV028_FT004.jpg"}, "folder_size_gb": 0.017}, "Baixa": {"EMS_HV028_FT001.jpg": {"size_mb": 0.434, "modified": "2014-02-18 19:32:08", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV028\\Fotos\\Baixa\\EMS_HV028_FT001.jpg", "category": "Image", "dimension": "3217x4380", "resolution": "3217x4380", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV028_FT001.jpg"}, "EMS_HV028_FT002.jpg": {"size_mb": 0.3775, "modified": "2014-02-18 19:37:46", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV028\\Fotos\\Baixa\\EMS_HV028_FT002.jpg", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV028_FT002.jpg"}, "EMS_HV028_FT003.jpg": {"size_mb": 0.5856, "modified" petisse pra gente o seu nome completo, o lugar onde você nasceu e a data do seu nascimento.\nR – Meu nome é Marineide Maria Ferreira, eu nasci em Bonito de Santa Fé, na Paraíba, dia 25 de janeiro de 1969.\nP/1 – Tá certo. Fala o nome dos seus pais, Marineide.\nR – Minha mãe é Amélia Maria Ferreira, meu pai é Eliseu Ferreira Neto.\nP/1 – Conta pra gente da atividade deles. O que seus pais faziam?\nR – Meus pais eram agricultores lá na Paraíba. Eles vieram pra cá, trabalharam de operário. Ele trabalhou na Rhodia, minha mãe trabalhou no Senai, hoje eles são aposentados.\nP/1 – Tá. E a sua família toda é de lá?\nR – Da Paraíba?\nP/1 – Da Paraíba.\nR – Isso. \nP/1 – De Bonito de Santa Fé?\nR – De Bonito de Santa Fé.\nP/1 – E você nasceu lá?\nR – Nasci lá em Bonito de Santa Fé.\nP/1"}, "folder_size_gb": 0.0}, "folder_size_gb": 83.895}, "EMS_HV027": {"Audiovisual": {"Acesso": {"EMS_HV027.mov": {"size_mb": 72546.9451, "modified": "2013-12-18 14:27:32", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV027\\Audiovisual\\Acesso\\EMS_HV027.mov", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4363797.0, "duration": 4363.8}, "folder_size_gb": 70.847}, "Fotos": {"Alta": {"EMS_HV027_FT001.jpg": {"size_mb": 8.9342, "modified": "2014-01-26 20:16:20", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV027\\Audiovisual\\Fotos\\Alta\\EMS_HV027_FT001.jpg", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV027_FT001.jpg"}, "EMS_HV027_FT002.jpg": {"size_mb": 9.1392, "modified": "2014-01-26 20:16:40", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV027\\Audiovisual\\Fotos\\Alta\\EMS_HV027_FT002.jpg", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thu RIVATE\\AVCHD\\BDMV\\STREAM\\00002.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 1456164.837324, "duration": 1456.16}, "00003.MTS": {"size_mb": 1416.9199, "modified": "2013-12-16 09:36:50", "extension": "MTS", "full_path": "D:\\EMS\\EMS_HV027\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\STREAM\\00003.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 755244.451693, "duration": 755.24}, "folder_size_gb": 8.168}, "folder_size_gb": 8.168}, "folder_size_gb": 8.168}, "folder_size_gb": 8.168}, "folder_size_gb": 8.168}, "folder_size_gb": 79.051}, "Textual": {"EMS_HV027.doc": {"size_mb": 0.0825, "modified": "2014-02-14 09:01:42", "extension": "DOC", "full_path": "D:\\EMS\\EMS_HV027\\Textual\\EMS_HV027.doc", "category": "Textual"}, "EMS_HV027.docx": {"size_mb": 0.0376, "modified": "2026-03-02 11:29:54", "extension": "DOCX", "full_path": "D:\\EMS\\EMS_HV027\\Textual\\EMS_HV027.docx", "category": "Textual", "content_preview": "EMS 50 Anos de Memória\nDepoimento de Luiz Fernando Dias\nEntrevistado por Fernanda Prado\nHortolândia, 16 de Dezembro de 2013.\nRealização Museu da Pessoa. \nEMS_HV027_Luiz Fernando Dias\nTranscrito por Iara Gobbo.\nMW Transcrições\nP/1 – Bom dia primeiro. \nR – Bom dia Fernanda.\nP/1 – Pra gente começar eu queria que você falasse pra gente o seu nome completo, o local e a data do seu nascimento.\nR – Meu nome é Luiz Fernando Dias, e eu nasci em São Paulo em 19 de Dezembro de 1955. Completo essa semana 58 anos.\nP/1 – E fala pra gente o nome dos seus pais.\nR – Meu pai se chama João Batista Dias e minha mãe Gildaci Noronha Gonçalves Dias. Minha mãe é cearense e meu pai é mineiro.\nP/1 – E conta pra gente então um pouquinho dessa origem então tão brasileira.\nR – São brasileiros e graças a Deus, vivos. O meu pai veio pra São Paulo trabalhar, quando garoto ainda e a família da minha mãe, como a maioria dos nordestinos vieram também pra São Paulo e eles se conheceram. E minha mãe veio, evidentemente criança ainda, muito pequenininha, então ela não tem muito da cultura do nordestino. E se conheceram, se casaram, foram morar em Minas. Eu morei um tempo em Minas também.\nP/1 – Em que lugar em Minas?\nR"}, "folder_size_gb": 0.0}, "folder_size_gb": 79.051}, "EMS_HV031": {"Fotos": {"Alta": {"EMS_HV031_FT001.jpg": {"size_mb": 8.8807, "modified": "2014-02-18 20:30:26", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV031\\Fotos\\Alta\\EMS_HV031_FT001.jpg", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV031_FT001.jpg"}, "EMS_HV031_FT005.jpg": {"size_mb": 8.4674, "modified": "2014-02-18 20:32:40", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV031\\Fotos\\Alta\\EMS_HV031_FT005.jpg", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV031_FT005.jpg"}, "folder_size_gb": 0.017}, "Baixa": {"EMS_HV031_FT001.jpg": {"size_mb": 0.3069, "modified": "2014-02-18 20:13:16", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV031\\Fotos\\Baixa\\EMS_HV031_FT001.jpg", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV031_FT001.jpg"}, "EMS_HV031_FT002.jpg": {"size_mb": 0.4988, "modified": "2014-02-18 20:13:46", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV031\\Fotos\\Baixa\\EMS_HV031_FT002.jpg", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV031_FT002.jpg"}, "EMS_HV031_FT003.jpg": {"size_mb": 0.4256, "modified": "2014-02-18 20 m dia.\nP/1 – Primeiro gostaria de agradecer de o senhor ter aceitado o convite, ter vindo aqui pra cá pra essa entrevista, e pra gente começar eu queria que o senhor falasse pra gente o seu nome completo, o lugar e a data em que o senhor nasceu. \nR – O meu nome é João Tamanaha, eu sou natural de Garça, estado de São Paulo, nasci no dia quatro de Junho de 43.\nP/1 – Fala pra gente, seu João, o nome dos seus pais.\nR – Meu pai chama Josei Tamanaha, a minha mãe Toma Tamanaha.\nP/1 – Fala pra gente então um pouquinho do que o senhor sabe da origem da família, como é que foi o processo de imigração.\nR – Você diz o que? Da minha família ou da família Sanchez?\nP/1 – Da sua família. Como é que o senhor, a sua família chegou em Garça, em São Paulo?\nR – É que na realidade os imigrantes foram o meu avô e o meu pai, que a minha mãe já é nascida no Brasil. Pelo que me consta, não o meu avô, né, mais o meu pai, eles foram trabalhar na agricultura como"}, "folder_size_gb": 0.0}, "Audiovisual": {"Acesso": {"EMS_HV031.MOV": {"size_mb": 51196.5791, "modified": "2014-02-18 20:22:42", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV031\\Audiovisual\\Acesso\\EMS_HV031.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3099066.0, "duration": 3099.07}, "folder_size_gb": 49.997}, "Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0625, "modified": "2014-01-29 12:58:30", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV031\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2014-01-29 12:58:30", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV031\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"index.bdm": {"size_mb": 0.0006, "modified": "2014-01-29 13:13:26", "extensio P/1 – Primeiro, eu gostaria de agradecer de o senhor ter aceitado o convite de  ter vindo aqui para essa entrevista.\nR – Muito bem.\nP/1 – E pra começar, eu queria que o senhor falasse pra gente o seu nome completo,  o lugar e a data do seu nascimento.\nR – Meu nome é Francisco Deusmar de Queiros, e eu escapei de uma boa, porque o meu pai queria colocar Ranulfo, já pensou Ranulfo? Ai, a minha mãe disse: “Não, não, não, coloca outro nome”, e ai, colocaram Francisco Deusmar, normalmente tem Deusimar, com “I” no meio, mas  o meu é só Deusmar de Queiros, Queiros com “S” e depois eu tive pesquisando, eu encontrava muito Queiroz com “Z”, e de repente, o com “S” é uma descendência do Eça de Queiros, que tem “Primo Basílio”, “O Crime do Padre Amaro”, então, eu não sou poeta e nem escritor, mas gosto muito da descendência.\nP/1 – Tá certo. Fala pra gente o nome dos seus pais.\nR – Antônio Lisboa de Queiros, mais conhecido como Antônio Donato, comerciante d"}, "folder_size_gb": 0.0}, "Fotos": {"Baixa": {"EMS_HV029_FT001.jpg": {"size_mb": 0.5669, "modified": "2014-02-18 19:44:00", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV029\\Fotos\\Baixa\\EMS_HV029_FT001.jpg", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV029_FT001.jpg"}, "EMS_HV029_FT002.jpg": {"size_mb": 0.5003, "modified": "2014-02-18 19:44:46", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV029\\Fotos\\Baixa\\EMS_HV029_FT002.jpg", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV029_FT002.jpg"}, "EMS_HV029_FT003.jpg": {"size_mb": 0.4676, "modified": "2014-02-18 19:45:40", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV029\\Fotos\\Baixa\\EMS_HV029_FT003.jpg", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnail ado\nHortolândia, 29 de janeiro de 2014 \nRealização Museu da Pessoa \nEMS_HV032_Maria Aparecida Figueira\nTranscrito por Karina Medici Barrella\nMW Transcrições\nP/1 – Dona Maria Aparecida, bom dia.\nR – Bom dia.\nP/1 – Primeiro eu gostaria de agradecer de a senhora ter aceitado o convite pra vir a essa entrevista. E pra gente começar eu gostaria que a senhora falasse pra gente o seu nome completo, a cidade e a data do seu nascimento.\nR – Maria Aparecida Figueira. Eu nasci na cidade de Matão, no dia oito do nove de 48, portanto eu tenho 65 anos.\nP/1 – E conta pra gente o nome dos seus pais.\nR – Manoel Sanchez, Helena Borgonovi Sanchez.\nP/1 – Fala pra gente um pouquinho, dona Maria Aparecida, o que a senhora sabe da origem da família.\nR – Bom, o seu Emiliano Sanchez era meu irmão, então a origem da família vem aí, ele era meu irmão.\nP/1 – Mas dos seus pais. Como é que seus pais foram parar lá em Matão? Da onde que eles eram?\nR – Na realidade meu pai nasceu em Dobrada e a minha mãe, acho que Fernando Prestes, é tudo na região de Matão. Eles se conheceram ali, se casaram e os filhos nasceram ali,"}, "folder_size_gb": 0.0}, "folder_size_gb": 64.818}, "EMS_HV033": {"Audiovisual": {"Acesso": {"EMS_HV033.MOV": {"size_mb": 51058.8425, "modified": "2014-02-18 20:41:10", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV033\\Audiovisual\\Acesso\\EMS_HV033.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3098498.0, "duration": 3098.5}, "folder_size_gb": 49.862}, "Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0625, "modified": "2014-01-29 12:58:30", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV033\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2014-01-29 12:58:30", "extension": "TID", "full_path": "D:\\EMS\\EMS_ ory": "Image", "dimension": "3195x4728", "resolution": "3195x4728", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV034_FT004.jpg"}, "EMS_HV034_FT005.jpg": {"size_mb": 0.6814, "modified": "2014-02-18 21:07:44", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV034\\Fotos\\Baixa\\EMS_HV034_FT005.jpg", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV034_FT005.jpg"}, "EMS_HV034_FT006.jpg": {"size_mb": 0.5585, "modified": "2014-02-18 20:54:14", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV034\\Fotos\\Baixa\\EMS_HV034_FT006.jpg", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0024/thumb_EMS_HV034_FT006.jpg"}, "folder_size_gb": 0.003}, "folder_size_gb": 0.01}, "Textual": {"EMS_HV034.docx": {"size_mb": 0.0977, "modified": "2014-02-14 08:14:16", "extension": "DOCX", "full_path": "D:\\EMS\\EMS_HV034\\Textual\\EMS_HV034.docx", "category": "Textual", "content_preview": "EMS – 50 anos de Memória\nDepoimento de Valdir Barbosa\nEntrevistado por Fernanda P. Prado\nHortolândia, 29 de janeiro de 2014 \nRealização Museu da Pessoa \nEMS_HV034_Valdir Barbosa\nTranscrito por Karina Medici Barrella\nMW Transcrições\nP/1 – Valdir, boa tarde.\nR – Olá! Boa tarde.\nP/1 – Primeiro eu gostaria de agradecer de você ter aceitado o convite para essa entrevista. E pra gente começar eu gostaria que você falasse pra gente o seu nome completo, o local e a data do seu nascimento.\nR – O meu nome é Valdir Barbosa, nasci em Cornélio Procópio, no Paraná, no dia 16 de fevereiro de 1964.\nP/1 – Fala pra gente o nome dos seus pais.\nR – Meu pai chama Nelson Barbosa e a minha mãe Jandira Talman Barbosa.\nP/1 – Qual é a atividade deles?\nR – Hoje? Os dois são aposentados.\nP/1 – E antes, qual era? O que eles faziam?\nR – No início era atividade agrícola. Todos nasceram ?\nR – Eu fui a caçula do primeiro esposo dela. Quando meu pai faleceu eu tinha oito meses de nascida, eu não o conheci, só pela foto. Depois minha mãe casou de novo porque ela ficou viúva muito jovem, ela tinha 25 anos. A gente teve um outro pai maravilhoso, criou a gente, bem"}, "folder_size_gb": 0.0}, "folder_size_gb": 76.855}, "EMS_HV039": {"Audiovisual": {"Preservação": {"private": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0625, "modified": "2014-02-06 14:01:12", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV039\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2014-02-06 14:01:12", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV039\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"index.bdm": {"size_mb": 0.0006, "modified": "2014-02-06 14:21:32", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV039\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\index.bdm", "category": "Other"}, "MOVIEOBJ.BDM": {"size_mb": 0.0001, "modified": "2014-02-06 13:05:42", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV039\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\MOVIEOBJ.BDM", "category": "Other"}, "CLIPINF": {"00000.CPI": {"size_mb": 0.0007, "modified": "2014-02-06 13:06:44", "extension": "CPI", "full_path": "D:\\EMS\\EMS_HV039\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\CLIPINF\\00000.CPI", "category": "Other"}, "00001.CPI": {"size_mb": 0.0006, "modified": "2014-02-06 13:26:30", "extension": "CPI", "full_path": "D:\\EMS\\EMS_HV039\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\CLIPINF\\00001.CPI", "category": "Other"}, "00002.CPI": {"size_mb": 0.011, "modified": "2014-02-06 14:01:12", "extension": "CPI", "full_path": "D:\\EMS\\EMS_HV039\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\CLIPINF\\00002.CPI", "category": "Other"}, "00003.CPI": {"size_mb": 0.0188, "modified": "2014-02-06 14:01:12", "extensi começar, a gente queria que você falasse seu nome completo, cidade, ano e data do seu nascimento. \nR - Eu começo a falar o meu nome? Bom, meu nome é Adriano da Silva. Sou nascido aqui mesmo na grande metrópole, capital de São Paulo. Nasci a exatos... bom, em primeiro lugar eu quero agradecer ao convite do Museu da Pessoa, e toda a equipe técnica. Eu me chamo Adriano - como eu já falei - e nasci na grande São Paulo, de manhã, às 8:40, no Hospital Santa Terezinha, não mais existente, certo? Dia 3 de julho de 1972. Sou filho primogênito da família, sou o mais velho. Tem o outro, o Jânio, dois anos mais novo que eu, a gente quase não se fala. Meu pai, Manoel Almeida, paranaense, descendente de brasileiros, falecido recentemente. E a minha mãe baiana, é descendente de brasileiros também. Em termos dos pais do meu pai, eu pr"}, "folder_size_gb": 0.0}, "folder_size_gb": 36.273}, "PCSH_HV353_Sidney Bernardo": {"Audiovisual": {"Acesso": {"PCSH_HV353_Sidney Bernardo.mp4": {"size_mb": 13169.1216, "modified": "2024-08-21 19:52:04", "extension": "MP4", "full_path": "D:\\Programa Conte sua História (2012)\\Livre\\PCSH_HV353_Sidney Bernardo\\Audiovisual\\Acesso\\PCSH_HV353_Sidney Bernardo.mp4", "category": "Video", "dimension": "1280x720", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 8296722.0, "duration": 8296.72}, "folder_size_gb": 12.86}, "Preservação": {"MDV_7684.avi": {"size_mb": 8873.7322, "modified": "2024-07-24 14:46:18", "extension": "AVI", "full_path": "D:\\Programa Conte sua História (2012)\\Livre\\PCSH_HV353_Sidney Bernardo\\Audiovisual\\Preservação\\MDV_7684.avi", "category": "Video", "dimension": "720x480", "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2455720.0, "duration": 2455.72}, "MDV_7685.avi": {"size_mb": 8964.7531, "modified": "2024-07-24 17:56:40", "extension": "AVI", "full_path": gb": 0.0}, "folder_size_gb": 0.038}, "folder_size_gb": 0.038}, "Textual": {"PCSH_HV359_Mariana Varela Camara_dec.docx": {"size_mb": 0.007, "modified": "1980-01-01 21:00:00", "extension": "DOCX", "full_path": "D:\\Programa Conte sua História (2012)\\Livre\\PCSH_HV359_Mariana Varela Camara\\Textual\\PCSH_HV359_Mariana Varela Camara_dec.docx", "category": "Textual", "content_preview": "Mariana Varela Camara - 10 de agosto de 2012.\nEntrevistada por Rozana Miziara.\nNascida em 2 de setembro de 1991.\n00:30 - Apresentação. Meu avô é português, minha avó é de Santos. Meu pai trabalhava com informática. Desde a separação com a minha mãe ele está meio desnorteado.\n04:20 - Eu fui criada como filha única, nunca convivi com meus irmãos. Fui para Portugal com 2 anos e fiquei lá até os 8.\n07:00 - Eu fui uma criança muito sozinha. Não tenho muitas lembranças de brincadeiras com outras crianças.\n10:55 - A gente mudou para Santos. Eu estudei numa escola por alguns anos. Foi difícil, muito difícil ser quem eu era. Eu era uma menina que gostava de brincar de coisas de menino, eu era muito geniosa.\n14:40 - Minha mãe recebeu uma proposta de emprego em Portugal. Eu queria me mudar para lá. Mas nessa época eu conheci pessoas que me acolheram. Só que mudamos mesmo assim.\n17:45 - A gente ficou só 6 meses em portugal porquê eu fiquei com uma depressão profunda.\n22:40 - Eu tive vários primeiros beijos. Tive 2 namorados em Portugal. Em Santos, dei meu primeiro beijo com uma mulher.\n25:40 - Eu cheguei a namorar 4 meninas em portugal com a ajuda da internet.\n28:25 - Quando eu tava com 15, eu"}, "folder_size_gb": 0.0}, "folder_size_gb": 20.557}, "PCSH_HV363_Denise Naline": {"Audiovisual": {"Acesso": {"PCSH_HV363_Denise Naline.mp4": {"size_mb": 9307.0108, "modified": "2024-07-12 14:55:54", "extension": "MP4", "full_path": "D:\\Programa Conte sua História (2012)\\Livre\\PCSH_HV363_Denise Naline\\Audiovisual\\Acesso\\PCSH_HV363_Denise Naline.mp4", "category": "Video", "dimension": "1280x720 ual": {"PCSH_HV363_Denise Nalini_rev.docx": {"size_mb": 0.044, "modified": "1980-01-01 21:00:00", "extension": "DOCX", "full_path": "D:\\Programa Conte sua História (2012)\\Livre\\PCSH_HV363_Denise Naline\\Textual\\PCSH_HV363_Denise Nalini_rev.docx", "category": "Textual", "content_preview": "Projeto Conte Sua História, 20 Anos Museu da Pessoa no Brasil\nDepoimento de Denise Nalini\nEntrevistada por Olga Guerra\nSão Paulo, 13/08/2012 \nRealização: Museu da Pessoa\nPCSH_HV363\nTranscrito por Julia de Carvalho Catão Dias\nRevisado por Teresa de Carvalho Magalhães\nP/1 – Você começa dizendo seu nome completo, seu local e data de nascimento.\nR – Denise Nalini, São Paulo, cinco de dezembro de 1962.\nP/1 – Nome de seus pais.\nR – Laura Andalaft Nalini e Wilton Nalini.\nP/1 – O que seus pais faziam?\nR – Minha mãe era dona de casa e fazia uns bicos para fora, e meu pai era mestre de obras.  Fazia trabalho de pedreiro, de construção de casas.\nP/1 – Como você descreve seu pai e sua mãe? Como eles eram?\nR – Então, imigrantes. Meu pai de origem italiana. Era um italiano muito bonito. Olhos claros, alto, forte. A minha mãe também era muito bonita, libanesa. Libanesa não, turca, da Síria. Eles diziam que eram turcos, libaneses, da Síria. Acho que na época eles nem tinham dimensão de que há uma divisão entre estes países. Bem, a minha mãe também era operária, trabalhava na fábrica de linhas correntes. Meu pai também trabalhava nessa fábrica, foi lá que eles se conheceram, casaram e viveram feliz"}, "folder_size_gb": 0.0}, "folder_size_gb": 31.234}, "PCSH_HV364_Jefferson de Mello": {"Audiovisual": {"Acesso": {"PCSH_HV364_Jefferson de Mello.mp4": {"size_mb": 13455.411, "modified": "2024-07-12 15:13:20", "extension": "MP4", "full_path": "D:\\Programa Conte sua História (2012)\\Livre\\PCSH_HV364_Jefferson de Mello\\Audiovisual\\Acesso\\PCSH_HV364_Jefferson de Mello.mp4", "category": "Video", "dimension": "1280x720", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": ": {"size_mb": 0.0105, "modified": "2019-01-11 09:32:40", "extension": "DOCX", "full_path": "D:\\Programa Conte sua História (2012)\\Livre\\PCSH_HV364_Jefferson de Mello\\Textual\\PCSH_HV364_Jefferson de Mello.docx", "category": "Textual", "content_preview": "Código: PCSH_HV364\nNome: Jefferson de Mello\nEntrevistadores: Olga Guerra e Silvia Espindola\nData: 30/08/2012\n00:01:00 – Meu nome é Jefferson de Mello, nasci em julho de 1964 na cidade de São Paulo.\n00:01:21 - Eu era de uma família pobre. Com onze anos eu já trabalhava em dois lugares, de segunda a segunda.\n00:03:53 - A minha mãe vivia internada e meu pai trabalhava muito, então ou eu ficava sozinho em casa ou ficava com os meus avós.\n00:07:12 - O meu pai teve três homens, meu irmão mais velho teve três homens, casou de novo e teve dois homens, o meu outro irmão teve um filho. Eu havia me casado e tive dois meninos. Ia parar, mas depois de muito custo, veio a menina. \n00:11:35 - Quando eu morava no Tatuapé foi a fase que mais me diverti da minha infância.\n00:14:48 - A gente ficou mais de um ano morando no Tatuapé e estudando na Vila Formosa, que naquela época era bem sofrido. Eu estudei em um externato que ajudou muito na minha formação, muito forte a nível de religião e patriotismo.\n00:20:42 - Na rua em que eu morava todas as crianças trabalhavam nessa fábrica de doces ou em uma fábrica de chinelos. Foi engraçado porque fui trabalhar e nem perguntei quanto eu ia ganhar.\n00:26:58 -"}, "folder_size_gb": 0.0}, "folder_size_gb": 43.028}, "PCSH_HV360_Sergio Perazzo": {"Audiovisual": {"Acesso": {"PCSH_HV360_Sergio Perazzo.mp4": {"size_mb": 10751.9938, "modified": "2024-07-11 17:09:12", "extension": "MP4", "full_path": "D:\\Programa Conte sua História (2012)\\Livre\\PCSH_HV360_Sergio Perazzo\\Audiovisual\\Acesso\\PCSH_HV360_Sergio Perazzo.mp4", "category": "Video", "dimension": "1280x720", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AA eceram.\n05:40 - A primeira casa que eu morei era numa vila super segura. A gente jogava futebol na rua, passava carro só de vez em quando. Todo mundo jantava cedo e depois do jantar era hora de brincar junto com as meninas.\n09:50 - Eu entrei na escola no jardim da infância com 6 anos. Eu ia a pé para a escola.\n13:30 - Quando eu tinha 4 anos, minha avó ia passar algumas temporadas lá em casa. Ela morreu na minha casa de infarto. Eu fiquei impressionado. Comecei a ter medo de cemitério. Um dia o padre disse que eu teria que representar o colégio em um enterro. Eu não senti mais medo.\n19:30 - Quase todo domingo tinha regatas na lagoa rodrigo de freitas. A água da lagoa era tão boa que eu ia pescar com meu avô pescar tainha.\n25:40 - Na época do vestibular eu estudava à noite. Meu pai estava com alzheimer e ele levantava de noite e queria sair. \n30:50 - Minha faculdade, a Nacional de Medicina, na época tinha um jardim interno. No intervalo, íamos ness"}, "folder_size_gb": 0.0}, "folder_size_gb": 33.641}, "PCSH_HV361_Gilberto Franco": {"Audiovisual": {"Acesso": {"PCSH_HV361_Gilberto Franco.mp4": {"size_mb": 13578.1851, "modified": "2024-07-12 14:22:54", "extension": "MP4", "full_path": "D:\\Programa Conte sua História (2012)\\Livre\\PCSH_HV361_Gilberto Franco\\Audiovisual\\Acesso\\PCSH_HV361_Gilberto Franco.mp4", "category": "Video", "dimension": "1280x720", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 8155548.0, "duration": 8155.55}, "folder_size_gb": 13.26}, "Preservação": {"MDV_7709.avi": {"size_mb": 8732.9241, "modified": "2018-10-10 09:54:32", "extension": "AVI", "full_path": "D:\\Programa Conte sua História (2012)\\Livre\\PCSH_HV361_Gilberto Franco\\Audiovisual\\Preservação\\MDV_7709.avi", "category": "Video", "dimension": "720x480", "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2416747.0, "duration": 2416.75}, "MDV_7710.avi": {"size_mb": 8482.4895, "modified": "2018-10-10 10:34:54", "extension": "AVI", "full_path": "D:\\Programa Conte sua História (2012)\\Livre\\PCSH_HV361_Gilberto Franco\\Audiovisual\\Preservação\\MDV_7710.avi", "category": "Video", "dimension": "720x480", "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2347445.0, "duration": 2347.45}, "MDV_7711.avi": {"size_mb": 8154.7506, "modified": "2018-10-10 11:18:58", "extension": "AVI", "full_path": "D:\\Programa Conte sua História (2012)\\Livre\\PCSH_HV361_Gilberto Franco\\Audiovisual\\Preservação\\MDV_7711.avi", "category": "Video", "dimension": "720x480", "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2256754.0, "duration": 2256.75}, "MDV_7712.avi": {"size_mb": 4567.8028, "modified": "2018-10-10 11:46:54", "extension": "AVI", "full_path": "D:\\Programa Conte sua História (2012)\\Livre\\PCSH_HV361_Gilberto Franco\\Audiovisual\\Preservação\\MDV_7712.avi", "category": "Video", "dimension": "720x480", "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1264063.0, "duration": 1264.06}, "folder_size_gb": 29.236}, "folder_size_gb": 42.496}, "Textual": {"PCSH_HV361_Gilberto Franco_dec.docx": {"size_mb": 0.008, "modified": "1980-01-01 21:00:00", "extension": "DOCX", "full_path": "D:\\Programa Conte sua História (2012)\\Livre\\PCSH_HV361_Gilberto Franco\\Textual\\PCSH_HV361_Gilberto Franco_dec.docx", "category": "Textual", "content_preview": "Gilberto Franco - 16 de agosto de 2012\nRosana Miziara e Julia Bergman\nNascido em São Paulo, 15 de novembro de 1957\n00:35 - Apresentação. Meus pais são italianos. Os dois eram judeus e conseguiram fugir das leis raciais italianas antes da inclusão da guerra.\n04:10 - Existia uma pequena comunidade de judeus italianos no Brasil. Era um núcleo muito pequeno, chamado de colônia Mussolini.\n09:40 - Minha primeira casa foi no Grajaú. Meu pai construiu uma segunda casa em arquitetura moderna que é a casa que ele mora até hoje.\n12:10 - Brincava de carrinho de rolimã quando era pequeno. Sempre detestei jogar futebol.\n21:10 - Naquela época, São Paulo era um lugar que você podia morar na Sumaré e estudar na Vila Mariana.\n31:00 - Minha avó morreu de anemia. Foi muito rápido e muito traumático.\n38:13 - Teve um período que eu estudei no vacacional. Foi um período negro na minha vida. Não tinha muitos amigos. Só na oitava série que eu conheci algumas pessoas legais.\n42:30 - De fato, o período do colegial deu um período de uma vida, valeu pelas experiências, pelos conhecimentos. O cine Maraxá íamos muito. Fui ver muito concerto no MASP.\n47:00 - Alguns professores marcantes foram o Mauricio de biolog"}, "folder_size_gb": 0.0}, "folder_size_gb": 42.496}, "PCSH_HV366_Paulo Catunda": {"Audiovisual": {"Acesso": {"PCSH_HV366_Paulo Catunda.mp4": {"size_mb": 5571.9843, "modified": "2024-07-15 14:42:42", "extension": "MP4", "full_path": "D:\\Programa Conte sua História (2012)\\Livre\\PCSH_HV366_Paulo Catunda\\Audiovisual\\Acesso\\PCSH_HV366_Paulo Catunda.mp4", "category": "Video", "dimension": "1280x720", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3354818.0, "duration": 3354.82}, "folder_size_gb": 5.441}, "Preservação": {"MDV_7731.avi": {"size_mb": 103.701, "modified": "2018-10-17 09:01:46", "extension": "AVI", "full_path": "D:\\Programa Conte sua História (2012)\\Livre\\PCSH_HV366_Paulo Catunda\\Audiovisual\\Preservação\\MDV_7731.avi", "category": "Video", "dimension": "720x480", "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 28659.0, "duration": 28.66}, "MDV_7731_01.avi": {"size_mb": 2744.3035, "modifie  não gostava de São Paulo, para mim era um ambiente fechado.\n07:50 - Eu fui professor no instituto de previdência porque ficava mais perto de casa.\n13:20 - Eu fui para o Rio de janeiro porque ela conhecia um camarada que fazia testes biocinéticos. \n18:43 - Imagina uma sala que era uma rede de plâncton. Eu entrava lá e colocava uma máquina para fazer os desenhos do plâncton. Tinha uns caixotes de cimento que as pessoas colocavam o material. Quando abriram o caixote, estava cheio de baratas.\n23:50 - Eu me lembro que eu gostava muito de fazer cursos.\n32:12 - Eu descobri recentemente que não se deve dar bronca em criança. A criança aprende mais por imitação do que por bronca.\n39:10 - Eu me lembro de Fortaleza. Tinha um mercado, urubus no chão. Na cidade, para lá tinha um hotel grande e as pessoas mais"}, "folder_size_gb": 0.0}, "folder_size_gb": 18.479}, "PCSH_HV362_Augusto Carlos Cassaniga": {"Audiovisual": {"Acesso": {"PCSH_HV362_Augusto Carlos Cassaniga.mp4": {"size_mb": 14925.322, "modified": "2024-07-12 14:43:34", "extension": "MP4", "full_path": "D:\\Programa Conte sua História (2012)\\Livre\\PCSH_HV362_Augusto Carlos Cassaniga\\Audiovisual\\Acesso\\PCSH_HV362_Augusto Carlos Cassaniga.mp4", "category": "Video", "dimension": "1280x720", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 8965757.0, "duration": 8965.76}, "folder_size_gb": 14.576}, "Preservação": {"MDV_7713.avi": {"size_mb": 8293.9361, "modified": "2018-10-11 09:52:00", "extension": "AVI", "full_path": "D:\\Programa Conte sua História (2012)\\Livre\\PCSH_HV362_Augusto Carlos Cassaniga\\Audiovisual\\Preservação\\MDV_7713.avi", "category": "Video", "dimension": "720x480", "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2295260.0, "duration": 2295.26}, "MDV_7714.avi": {"size_mb": 8393.8789, "modified": "2018-10-11 10:31:26", "ext
