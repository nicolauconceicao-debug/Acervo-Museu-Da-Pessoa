: "2019-11-04 11:21:34", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV02\\Iconográfico\\Acervo\\Baixa\\MET_HV02_FT006.jpg", "category": "Image", "dimension": "800x534", "resolution": "800x534", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV02_FT006.jpg"}, "MET_HV02_FT007.jpg": {"size_mb": 0.3683, "modified": "2019-11-04 11:21:44", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV02\\Iconográfico\\Acervo\\Baixa\\MET_HV02_FT007.jpg", "category": "Image", "dimension": "800x600", "resolution": "800x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV02_FT007.jpg"}, "MET_HV02_FT008.jpg": {"size_mb": 0.1742, "modified": "2019-11-04 11:21:54", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV02\\Iconográfico\\Acervo\\Baixa\\MET_HV02_FT008.jpg", "category": "Image", "dimension": "450x600", "resolution": "450x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV02_FT008.jpg"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.002}, "folder_size_gb": 0.002}, "Textual": {"MET_HV02_Maria Helena Curatolo Coelho_rev.docx": {"size_mb": 0.0473, "modified": "2019-02-21 05:33:48", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV02\\Textual\\MET_HV02_Maria Helena Curatolo Coelho_rev.docx", "category": "Textual", "content_preview": "Depoimento de Maria Helena Curatolo Coelho\nEntrevistada por Demétrio dos Anjos Souza e Marilisa Pinto Franca Battiato\nSão Paulo, 22 de maio de 2018\nEntrevista número MET_HV02\nP/1 - Então vamos começar, eu espero que seja um bate papo agradável para a gente, mas para a gente dar início eu queria, por favor, que você dissesse o seu nome completo, o local e a data do seu nascimento, para daí a gente começar a nossa entrevista.\nR - Meu nome é Maria Helena Curatolo Coelho, eu nasci em 15 de agosto de 1953 em São Paulo.\nP/1 - Muito bem, e qual o nome dos seus pais?\nR - Meu pai chamava-se Domenico Curatolo, e minha mãe De Luca Assunta Curatolo.\nP/1 - Chegou, tinha irmãos, era uma família grande?\nR - Tenho, eu tenho seis irmãos, o Gaetano Curatolo, depois vem eu, depois vem Vitória Hilda Curatolo, Antônio Carlos Curatolo, Vera Lúcia Curatolo, Cláudio Curatolo, e Eliana Curatolo.\nP/1 - Você é a mais, dentro dessa sequência, eu acho que você é a mais velha, do meio...\nR - Eu sou a filha mulher mais velha, meu irmão mais velho é o Gaetano Curatolo.\nP/1 - Entendi, e fala um pouquinho, já que você comentou da família, você pode contar um pouquinho para a gente, aí essas origens, de repente seus"}, "MET_HV02_Maria Helena Curatolo Coelho_edi.docx": {"size_mb": 0.0159, "modified": "2019-05-23 18:28:44", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV02\\Textual\\MET_HV02_Maria Helena Curatolo Coelho_edi.docx", "category": "Textual", "content_preview": "Nome da história\nCaminhada de garra, dedicação e alegria: muito prazer, Maria Helena\nMinibio\nMaria Helena Curatolo Coelho, paulistana, nascida em 15 de Agosto 1953, pais imigrantes Italianos da região da Calábria demonstra claramente os traços herdados. Atuou como secretária no Metrô boa parte de sua carreira e hoje, aos 64 anos, mãe de duas filhas e em um segundo casamento, terá novos desafios após sua saída do metrô.\nSinopse\nEssa é a historia envolvente de uma mulher batalhadora, mãe zelosa e profissional leal, que trilhou um caminho de sucesso no Metrô. Chega ao final de sua carreira com sensação de vitória por conseguir superar todos os obstáculos e desafios, nos oferecendo um relato intenso e com muita emoção justamente em seu último dia de trabalho no metrô após mais de 41 anos de dedicação.\nTAGs\nsegunda guerra mundia\ndiretoria\nimigração\nemoção\nimigração italiana\nsolidariedade\nfestas\njurídico\npinheiros\nsecretária \nrealização\ncoração\nfeliz\nengenharia\norgulho\nitaliano\nnascimento\ncasamento\nsaúde\ndoação de sangue\nlealdade\n50 anos metrô de sp\nmetrô\nsaúde\nbairro saúde\nfestas juninas\ndisponibilidade\nempenho\naltruísmo\ngreve de 88\nbolão\naplauso\nprestígio\nfamília\nética\noperadora de tre"}, "folder_size_gb": 0.0}, "folder_size_gb": 9.142}, "MET_HV03": {"Audiovisual": {"Vídeo": {"Edição": {"MET_HV03_ED001.mp4": {"size_mb": 198.175, "modified": "2018-07-15 22:45:36", "extension": "MP4", "full_path": "D:\\Metrô 50 anos\\MET_HV03\\Audiovisual\\Vídeo\\Edição\\MET_HV03_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 163296.0, "duration": 163.3}, "folder_size_gb": 0.194}, "Íntegra": {"MET_HV03.mp4": {"size_mb": 10453.4482, "modified": "2018-05-25 17:33:50", "extension": "MP4", "full_path": "D:\\Metrô 50 anos\\MET_HV03\\Audiovisual\\Vídeo\\Íntegra\\MET_HV03.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 8495653.0, "duration": 8495.65}, "folder_size_gb": 10.208}, "folder_size_gb": 10.402}, "Áudio": {"MET_HV03.mp3": {"size_mb": 129.6507, "modified": "2018-05-28 05:30:02", "extension": "MP3", "full_path": "D:\\Metrô 50 anos\\MET_HV03\\Audiovisual\\Áudio\\MET_HV03.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 8495712.0, "duration": 8495.71}, "folder_size_gb": 0.127}, "folder_size_gb": 10.529}, "Iconográfico": {"Acervo": {"Baixa": {"MET_HV003_FT001.jpg": {"size_mb": 0.2422, "modified": "2019-11-04 11:28:04", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV03\\Iconográfico\\Acervo\\Baixa\\MET_HV003_FT001.jpg", "category": "Image", "dimension": "800x534", "resolution": "800x534", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV003_FT001.jpg"}, "MET_HV003_FT002.jpg": {"size_mb": 0.2666, "modified": "2019-11-04 11:28:14", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV03\\Iconográfico\\Acervo\\Baixa\\MET_HV003_FT002.jpg", "category": "Image", "dimension": "800x534", "resolution": "800x534", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV003_FT002.jpg"}, "MET_HV003_FT003.jpg": {"size_mb": 0.1513, "modified": "2019-11-04 11:28:24", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV03\\Iconográfico\\Acervo\\Baixa\\MET_HV003_FT003.jpg", "category": "Image", "dimension": "399x600", "resolution": "399x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV003_FT003.jpg"}, "MET_HV003_FT004.jpg": {"size_mb": 0.2514, "modified": "2019-11-04 11:28:32", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV03\\Iconográfico\\Acervo\\Baixa\\MET_HV003_FT004.jpg", "category": "Image", "dimension": "454x600", "resolution": "454x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV003_FT004.jpg"}, "folder_size_gb": 0.001}, "folder_size_gb": 0.001}, "folder_size_gb": 0.001}, "Textual": {"MET_HV03_Plínio Oswaldo Assmann_rev.docx": {"size_mb": 0.0435, "modified": "2019-02-21 05:40:24", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV03\\Textual\\MET_HV03_Plínio Oswaldo Assmann_rev.docx", "category": "Textual", "content_preview": "Depoimento de Plínio Oswaldo Assmann\nEntrevistado por Cristina Castro, Dilce Carvalho e Juliana Venâncio\nSão Paulo, 25 de maio de 2018\nEntrevista número MET_HV03\nRealização: Museu da Pessoa\nP/1 - Doutor Plínio, o senhor pode começar nos dizendo a data de nascimento e o local de nascimento? \nR - Eu nasci em Santa Catarina, em 30 de outubro de 1933 e, muito jovem, ainda com os meus pais, vim para São Paulo. Aqui me formei e essa cidade me fez o que eu sou hoje. \nP/1 - E a origem da sua família: tem alguma história que o senhor possa nos contar? \nR - O meu bisavô veio da Alemanha em 1853. Na época do Império aqui no país, havia muita imigração desta região europeia. Ele veio com a família e se alojaram no Rio Grande do Sul e lá fundaram uma cidade, que se chama Santa Cruz do Sul, capital do fumo. Lá, se estabeleceram. O meu bisavô veio com 11 anos de idade, lá da Alemanha. A família já teve a nacionalidade brasileira antes de embarcar, na Alemanha. A partir daí, aconteceu o que normalmente acontece com as famílias que vieram da Alemanha na época: o mais velho fica com o terreno e cuida da família e os outros saem para se virar na vida. Isso acontece até hoje no Brasil. É assim que nós"}, "MET_HV03_Plínio Oswaldo Assmann_edi.docx": {"size_mb": 0.0188, "modified": "2019-05-23 18:35:26", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV03\\Textual\\MET_HV03_Plínio Oswaldo Assmann_edi.docx", "category": "Textual", "content_preview": "Nome da história\nUma aula sobre o Metrô de São Paulo\nMinibio\nPlínio Assmann, nasceu em 30 de outubro de 1933, filho de imigrantes alemães, em Piratuba (antiga Rio do Peixe), Santa Catarina. Migrou com a família para São Paulo aos 7 anos. Estudou em colégio público, fez ginásio no Mackenzie e cursou engenharia Elétrica na Escola Politécnica na USP. Participou da construção e instalação de grandes obras e empresas no Brasil, usina Paulo Afonso - BA, COSIPA – Cubatão, Companhia do Metropolitano de São Paulo – Metrô. Desta última foi o terceiro presidente, quem deu início às obras das linhas Norte-Sul e Leste-Oeste e inaugurou o primeiro trecho. Foi presidente da COSIPA e do IPT – Instituto de Pesquisas Tecnológicas. Em 2018 continua casado, há quase 70 anos, e atua em um grupo da prefeitura da cidade de São Paulo e da Universidade de São Paulo cujo objetivo é viabilizar a formação de startups na região de Itaquera, zona leste da cidade.\nSinopse\nPlínio Assmann narra a história de sua vida até o final do seu mandato de presidente da Companhia do Metropolitano de São Paulo - Metrô. Filho de imigrantes alemães, nascido em uma pequena cidade do interior de Santa Catarina, migrou com a famí"}, "folder_size_gb": 0.0}, "folder_size_gb": 10.53}, "MET_HV04": {"Audiovisual": {"Vídeo": {"Edição": {"MET_HV04_ED001.mp4": {"size_mb": 173.0267, "modified": "2018-07-15 22:53:32", "extension": "MP4", "full_path": "D:\\Metrô 50 anos\\MET_HV04\\Audiovisual\\Vídeo\\Edição\\MET_HV04_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 143010.0, "duration": 143.01}, "folder_size_gb": 0.169}, "Íntegra": {"MET_HV04.mp4": {"size_mb": 6865.5075, "modified": "2018-05-30 09:48:20", "extension": "MP4", "full_path": "D:\\Metrô 50 anos\\MET_HV04\\Audiovisual\\Vídeo\\Íntegra\\MET_HV04.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5579340.0, "duration": 5579.34}, "folder_size_gb": 6.705}, "folder_size_gb": 6.874}, "Áudio": {"MET_HV04.mp3": {"size_mb": 85.1465, "modified": "2018-05-30 10:05:30", "extension": "MP3", "full_path": "D:\\Metrô 50 anos\\MET_HV04\\Audiovisual\\Áudio\\MET_HV04.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 5579400.0, "duration": 5579.4}, "folder_size_gb": 0.083}, "folder_size_gb": 6.957}, "Iconográfico": {"Acervo": {"Baixa": {"MET_HV04_FT001.jpg": {"size_mb": 0.3106, "modified": "2019-11-04 11:30:40", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV04\\Iconográfico\\Acervo\\Baixa\\MET_HV04_FT001.jpg", "category": "Image", "dimension": "600x600", "resolution": "600x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV04_FT001.jpg"}, "MET_HV04_FT002.jpg": {"size_mb": 0.2601, "modified": "2019-11-04 11:30:50", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV04\\Iconográfico\\Acervo\\Baixa\\MET_HV04_FT002.jpg", "category": "Image", "dimension": "600x600", "resolution": "600x600", "color_mode": "RGB", "dpi": \\Acervo\\Baixa\\MET_HV04_FT008.jpg", "category": "Image", "dimension": "800x534", "resolution": "800x534", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV04_FT008.jpg"}, "MET_HV04_FT009.jpg": {"size_mb": 0.2792, "modified": "2019-11-04 11:32:56", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV04\\Iconográfico\\Acervo\\Baixa\\MET_HV04_FT009.jpg", "category": "Image", "dimension": "800x534", "resolution": "800x534", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV04_FT009.jpg"}, "MET_HV04_FT0010.jpg": {"size_mb": 0.2995, "modified": "2019-11-04 11:33:08", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV04\\Iconográfico\\Acervo\\Baixa\\MET_HV04_FT0010.jpg", "category": "Image", "dimension": "600x600", "resolution": "600x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV04_FT0010.jpg"}, "folder_size_gb": 0.003}, "folder_size_gb": 0.003}, "folder_size_gb": 0.003}, "Textual": {"MET_HV04_Leandro Kojima_rev.docx": {"size_mb": 0.0304, "modified": "2019-02-21 05:46:06", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV04\\Textual\\MET_HV04_Leandro Kojima_rev.docx", "category": "Textual", "content_preview": "Depoimento de Leandro Kojima\nEntrevistado por Cláudia Bordo, Rosana Preto, Adrian Parra\nSão Paulo, 29 de maio de 2018\nEntrevista número MET_HV04\nRealização: Museu da Pessoa\nP/1 - Bom, Leandro, para iniciar, a gente vai precisar que você se identifique. Preciso que você me diga seu nome completo, data e local de nascimento. \nR - Meu nome é Leandro Kojima, eu nasci dia 4 de junho de 1979, em São Paulo. \nP/1 - Leandro, fala um pouco para a gente da sua família, da sua origem, seus avós, dos seus pais. \nR - Eu sou descendente de japoneses, meu pai é nissei, então ele é filho de japoneses, meus avós são imigrantes, tanto meu avô quanto minha vó da parte paterna, e a minha mãe, meu pai é brasileiro, nissei, e minha mãe também é brasileira. A minha vó se chama Dolores, e é descendente de espanhóis. Da parte paterna, sou descendente de japoneses, e da materna, espanhóis. \nP/1 - E como que eles se conheceram? Conte um pouco sobre essa união. \nR - Meus pais moravam próximos, morávamos no bairro do Tucuruvi. Eles se conheceram em 1976, e de lá para cá, se casaram em 78, e eles se conheceram no bairro, e assim, é interessante a história, porque pela minha família ser por parte de pai, descende"}, "MET_HV04_Leandro Kojima_edi.docx": {"size_mb": 0.0185, "modified": "2019-05-23 18:38:36", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV04\\Textual\\MET_HV04_Leandro Kojima_edi.docx", "category": "Textual", "content_preview": "Nome da história\nMetrô muito mais do que um transporte\nMinibio\nMeu nome é Leandro Kojima, nasci em 4 de junho de 1979, em São Paulo. Sou descendente de japoneses, pela parte paterna, e da materna, espanhóis. Estudei na Escola Paulista, desde a primeira série até a oitava série. Fiz colégio técnico em eletrônica, no Liceu de Artes e Ofícios. Na Poli, fiz engenharia elétrica com ênfase em eletrônica e eletrotécnica, e mestrado em sistemas eletrônicos. Fiz MBA em Gestão de projetos, gestão estratégica e econômica de projetos na FGV e sou certificado em gerenciamento de projetos, PMP. Entre 1999 e 2002, eu atuei na CPTM como técnico de manutenção. Em 2002 ingressei no Metrô, como técnico de manutenção, onde atuei até 2006 no laboratório de eletrônica. Atuei como engenheiro de 2006 até 2011 quando eu me tornei coordenador. Também sou Conselheiro deliberativo do Metrus.\nSinopse\nLeandro conta como sua história de vida sempre teve a presença do Metrô, desde os Tapumes da estação Tucuruvi que estava sendo construída em sua infância, até sua carreira no Metrô, cheia de acontecimentos importantes que aconteciam ao mesmo tempo na vida pessoal e profissional.\nTAGs\nmetrô\nTucuruvi\nrh\npdv\nmba\nenge"}, "folder_size_gb": 0.0}, "folder_size_gb": 6.96}, "MET_HV05": {"Audiovisual": ension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV05\\Textual\\MET_HV05_Gustavo Kenji Hyochimoto_rev.docx", "category": "Textual", "content_preview": "Depoimento de Gustavo Kenji A. Yoshimoto\nEntrevistado por Rafael Eduardo R. da Silva; Edson Alves Feitosa\nSão Paulo, 29 de maio de 2018\nEntrevista número MET_HV05\nRealização: Museu da Pessoa\nP/2 - Gustavo, para começar eu gostaria que você dissesse seu nome completo, data e local de nascimento.\nR - Meu nome completo é Gustavo Kenji Alves Yoshimoto, eu nasci no dia seis de novembro de 1995, no bairro paulistano do Campo Belo, São Paulo capital. \nP/2 - Então, antes de entrar propriamente na sua história, o que você sabe sobre a origem da sua família? Por exemplo, fale um pouco de seus avós maternos e paternos.\nR - Eu sei que eu tenho origens... o meu sobrenome, Alves, tem provável origem portuguesa, já que Alves é um nome que, a princípio, é português e eu tenho ascendência japonesa pelo meu sobrenome, Yoshimoto, que é de origem japonesa. Acredito que meus avós vieram do Japão no começo do século passado para o Brasil e se instalaram no interior de São Paulo, na região de Araraquara. E a família da minha mãe é de Minas Gerais, do sul do estado. \nP/2 - E qual é o nome do seu pai e da sua mãe? Você sabe como eles se conheceram?\nR - O nome dos meus pais são Jorge e Marlene. Eles se conh"}, "MET_HV05_Gustavo Kenji Hyochimoto_edi.docx": {"size_mb": 0.0241, "modified": "2019-05-23 18:42:36", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV05\\Textual\\MET_HV05_Gustavo Kenji Hyochimoto_edi.docx", "category": "Textual", "content_preview": "Nome da história\nTransporte sobre trilhos Amor a primeira vista\nMinibio\nSinopse\nGustavo Yoshimoto nos conta, primeiramente, a respeito de suas origens portuguesas e japonesas e a imigração de seus avós para o Brasil. Em seguida, fala sobre sua infância e educação no Campo Belo. Adiante, fala sobre sua primeira viagem de Metrô e sua recepção e o ambiente de trabalho na companhia. Então, Gustavo nos fala sobre sua paixão por trens desde a infância e conta sobre suas visitas a inaugurações de linhas e demonstra conhecimento sobre as diferentes frotas e funcionamento da operação metroviária. Depois, Gustavo fala sobre sua participação em eventos comemorativos do Metrô e seu dia-a-dia na empresa. Concluindo a entrevista, Gustavo fala sobre a despedida da composição A35, a inauguração da Linha 13-Jade da CPTM e projeta um Metrô moderno para o futuro.\nTAGs\nJapão\nCampo Belo\ntrem\ntransporte público\nmetrô sp\ntrem a35\n50 anos metrô de sp\nbec - bolsa eletrônica de compras\nmetrô 50 anos\nfrota\nmonotrilho\ntrem bala\nEdição\nMeu nome é Gustavo Kenji Alves Yoshimoto, sou filho único, nasci no dia 06 de novembro de 1995, no bairro paulistano do Campo Belo, São Paulo capital. O meu sobrenome, Alves, te"}, "folder_size_gb": 0.0}, "folder_size_gb": 5.851}, "MET_HV06": {"Audiovisual": {"Vídeo": {"Edição": {"MET_HV06_ED001.mp4": {"size_mb": 198.3709, "modified": "2018-07-15 23:19:06", "extension": "MP4", "full_path": "D:\\Metrô 50 anos\\MET_HV06\\Audiovisual\\Vídeo\\Edição\\MET_HV06_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 163497.0, "duration": 163.5}, "folder_size_gb": 0.194}, "Íntegra": {"MET_HV06.mp4": {"size_mb": 10729.0386, "modified": "2018-06-05 13:56:18", "extension": "MP4", "full_path": "D:\\Metrô 50 anos\\MET_HV06\\Audiovisual\\Vídeo\\Íntegra\\MET_HV06.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 8719311.0, "duration": 8719.31}, "folder_size_gb": 10.478}, "folder_size_gb": 10.671}, "Áudio": {"MET_HV06.mp3": {"size_mb": 133.0606, "modified": "2018-06-08 05:16:48", "extension": "MP3", "full_path": "D:\\Metrô 50 anos\\MET_HV06\\ pg", "category": "Image", "dimension": "800x451", "resolution": "800x451", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV06_FT0011.jpg"}, "MET_HV06_FT0012.jpg": {"size_mb": 0.257, "modified": "2019-11-04 11:42:46", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV06\\Iconográfico\\Acervo\\Baixa\\MET_HV06_FT0012.jpg", "category": "Image", "dimension": "800x600", "resolution": "800x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV06_FT0012.jpg"}, "MET_HV06_FT0013.jpg": {"size_mb": 0.3648, "modified": "2019-11-04 11:42:58", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV06\\Iconográfico\\Acervo\\Baixa\\MET_HV06_FT0013.jpg", "category": "Image", "dimension": "800x600", "resolution": "800x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV06_FT0013.jpg"}, "MET_HV06_FT0014.jpg": {"size_mb": 0.3215, "modified": "2019-11-04 11:43:08", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV06\\Iconográfico\\Acervo\\Baixa\\MET_HV06_FT0014.jpg", "category": "Image", "dimension": "800x600", "resolution": "800x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV06_FT0014.jpg"}, "MET_HV06_FT0015.png": {"size_mb": 0.411, "modified": "2019-11-04 11:43:18", "extension": "PNG", "full_path": "D:\\Metrô 50 anos\\MET_HV06\\Iconográfico\\Acervo\\Baixa\\MET_HV06_FT0015.png", "category": "Image", "dimension": "639x600", "resolution": "639x600", "color_mode": "RGBA", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV06_FT0015.jpg"}, "MET_HV06_FT0016.jpg": {"size_mb": 0.3053, "modified": "2019-11-04 11:43:30", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV06\\Iconográfico\\Acervo\\Baixa\\MET_HV06_FT0016.jpg", "category": "Image", "dimension": "800x600", "resolution": "800x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV06_FT0016.jpg"}, "MET_HV06_FT0017.jpg": {"size_mb": 0.2417, "modified": "2019-11-04 11:43:42", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV06\\Iconográfico\\Acervo\\Baixa\\MET_HV06_FT0017.jpg", "category": "Image", "dimension": "800x553", "resolution": "800x553", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV06_FT0017.jpg"}, "MET_HV06_FT0018.jpg": {"size_mb": 0.1293, "modified": "2019-11-04 11:43:50", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV06\\Iconográfico\\Acervo\\Baixa\\MET_HV06_FT0018.jpg", "category": "Image", "dimension": "339x600", "resolution": "339x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV06_FT0018.jpg"}, "folder_size_gb": 0.005}, "folder_size_gb": 0.005}, "folder_size_gb": 0.005}, "Textual": {"MET_HV06_Peter Ludwig Alouche_edi.docx": {"size_mb": 0.0173, "modified": "2019-05-24 10:32:58", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV06\\Textual\\MET_HV06_Peter Ludwig Alouche_edi.docx", "category": "Textual", "content_preview": "Nome da história\nCidadão do mundo no Metrô\nMinibio\nPeter Ludwig Alouche nasceu no Cairo, Egito. Teve sete irmãos, sendo um seu gêmeo. É católico bizantino, devoto de Santa Teresinha. Foi admitido no Metrô para trabalhar com sistemas elétricos e testes necessários antes da operação comercial ser iniciada. Defendeu teses e apresentou trabalhos sobre o Metrô em vários lugares do mundo. Também participou da equipe pioneira chamada de “Projeto Básico”, atuando na concepção das linhas.\nSinopse\nEm seu depoimento, Peter Alouche conta como foi sua infância no Cairo, Egito, e sua vinda para o Brasil em função de conflitos no seu país natal. Detalha sua carreira no Metrô nas áreas de sistema elétrico, testes e concepção das linhas. Também conta sobre as suas viagens pelo mundo a serviço da companhia e de sua vontade de continuar contribuindo para a defesa dos interesses do Metrô por meio dos seus artigos.\nTAGs\nmetrô\nEgito\ninauguração\ntestes\n50 anos metrô de sp\ngêmeo\negípcio\nsistema elétrico\nprojeto básico\nlinha de metrô\nmetrô 50 anos\nEdição\nEu me chamo Peter Ludwig Alouche, nasci na cidade do Cairo. Meu pai era o que a gente chamaria de cidadão do mundo. Ele foi diretor presidente de um banco"}, "MET_HV06_Peter Ludwig Alouche_rev.docx": {"size_mb": 0.042, "modified": "2019-02-21 05:57:42", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV06\\Textual\\MET_HV06_Peter Ludwig Alouche_rev.docx", "category": "Textual", "content_preview": "Projeto Metrô\nDepoimento de Peter Ludwig Alouche\nEntrevistado por Ana Grieco, Camila Bonfim e Ana Coelho\nSão Paulo, 05/06/de 2018 \nRealização Museu da Pessoa \nMET_HV06_Peter Ludwig Alouche\nTranscrito por Karina Medici Barrella\nRevisado e editado por\nP/1 – Peter, por favor, você pode falar pra gente o seu nome completo, a data de nascimento, se você quiser é claro, e aonde você nasceu?\nR – Me chamo Peter Ludwig Alouche. Minha data de nascimento é 24 de outubro depois da guerra. Eu não posso falar porque tenho irmão. Se eu revelar minha data eu revelo a idade dele e ele não me deu essa licença, então não posso falar. Eu nasci na cidade do Cairo, num bairro chamado Heliópolis. Cairo é a capital do Egito e Heliópolis é a parte da cidade que foi construída pelo Barão Empain, um belga. Ah, muitas saudades da minha infância! Enfim, é no Egito que eu nasci. De família de origem sírio libanesa, cristã, católica bizantina. Eu sou bizantino, grego católico, melquita. Se você quiser visitar uma igreja melquita, aquela que meu tio construiu, o irmão do meu pai, na Rua Paraíso, tem a igreja Nossa Senhora do Paraíso que meu tio, irmão do meu pai construiu. Foi ele que na realidade nos chamou, mas"}, "folder_size_gb": 0.0}, "folder_size_gb": 10.806}, "MET_HV07": {"Audiovisual": {"Vídeo": {"Edição": {"MET_HV07_ED001.mp4": {"size_mb": 166.0829, "modified": "2018-07-15 23:25:56", "extension": "MP4", "full_path": "D:\\Metrô 50 anos\\MET_HV07\\Audiovisual\\Vídeo\\Edição\\MET_HV07_ED0  "modified": "2019-11-04 11:48:26", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV07\\Iconográfico\\Acervo\\Baixa\\MET_HV07_FT009.jpg", "category": "Image", "dimension": "800x575", "resolution": "800x575", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV07_FT009.jpg"}, "MET_HV07_FT010.jpg": {"size_mb": 0.2787, "modified": "2019-11-04 11:48:38", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV07\\Iconográfico\\Acervo\\Baixa\\MET_HV07_FT010.jpg", "category": "Image", "dimension": "800x600", "resolution": "800x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV07_FT010.jpg"}, "MET_HV07_FT011.jpg": {"size_mb": 0.1317, "modified": "2019-11-04 11:48:46", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV07\\Iconográfico\\Acervo\\Baixa\\MET_HV07_FT011.jpg", "category": "Image", "dimension": "450x600", "resolution": "450x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV07_FT011.jpg"}, "folder_size_gb": 0.003}, "folder_size_gb": 0.003}, "folder_size_gb": 0.003}, "Textual": {"MET_HV07_José Kenshiti Tuguimoto_rev.docx": {"size_mb": 0.0435, "modified": "2019-02-21 06:05:56", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV07\\Textual\\MET_HV07_José Kenshiti Tuguimoto_rev.docx", "category": "Textual", "content_preview": "Projeto Metrô\nDepoimento de José Kenshiti Tuguimoto\nEntrevistado por Macedo Junior e Marcelo Cunha\nSão Paulo, 05/06/2018\nRealização Museu da Pessoa\nMET_HV07_José Kenshiti Tuguimoto\nTranscrito por Mariana Wolff\nP/1 – Boa tarde, Kenshiti. \nR – Boa tarde!\nP/1 – É um prazer, estamos aqui para realizar essa entrevista para o Museu da Pessoa, para o Metrô de São Paulo. Eu, Marcelo Cunha e o Macedo Junior aqui vamos conduzir a entrevista. Muito obrigado pela sua presença, então vamos começar, Kenshiti. Vamos começar a falar um pouco de você, fala o seu nome, falar sobre você, o nome completo, idade, profissão, local de nascimento, pode falar.\nR – Bem, boa tarde, é um prazer enorme estar aqui para poder contar um pouquinho, então, da minha história. meu nome é José Kenshiti Tuguimoto, 63 anos, sou de nove de novembro de 1954, a profissão, né, quer dizer, formado em curso técnico de Eletrônica, Engenharia Elétrica incompleto e a última formação em Psicologia. Me formei em 2006.\nP/1 – Você nasceu em que cidade?\nR – Presidente Prudente, 560 quilômetros daqui de São Paulo.\nP/1 – Então, Kenshiti, pode falar um pouquinho quando você chegou… na verdade, assim, você tem alguma história de imigraçã"}, "MET_HV07_José Kenshiti Tuguimoto_edi.docx": {"size_mb": 0.0153, "modified": "2019-05-24 10:35:42", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV07\\Textual\\MET_HV07_José Kenshiti Tuguimoto_edi.docx", "category": "Textual", "content_preview": "Nome da história\nCompetência e bondade no Metrô de São Paulo\nMinibio\nJosé Kenshiti Tuguimoto nasceu em 1954, na cidade de Presidente Prudente, interior de São Paulo. Teve uma infância sofrida, uma vida no campo, com a família endividada. Aos 14 anos foi estudar na cidade de São José dos Campos, e por lá ficou até se formar como Técnico Eletrônico. Kenshiti lembra que na época, com 19 anos, funcionários do Metrô foram até o município oferecer empregos para os recém-formados. Ele aceitou o desafio e foi contratado em 1974, onde permanece até hoje.\nSinopse\nKenshiti nasceu em Presidente Prudente, interior de São Paulo, em 1954. De família humilde, passou sua infância no campo com muitas dificuldades. Na época seu pai investiu, sem sucesso, na plantação de batatas. Aos 15 anos foi estudar em São José dos Campos e por lá ficou até se formar como Técnico em Eletrônica.  Conta que funcionários de Recursos Humanos do Metrô foram até São José dos Campos oferecer emprego para os recém-formados. Ele aceitou o desafio. Em fevereiro de 1974 foi contratado e começou a fazer testes de aceitação nos trens. De lá para cá muitas coisas aconteceram, José Kenshiti Tuguimoto trabalha no Metrô de São Pau"}, "folder_size_gb": 0.0}, "folder_size_gb": 8.841}, "MET_HV08": {"Audiovisual": {"Vídeo": {"Edição": {"MET_HV08_ED001.mp4": {"size_mb": 196.3578, "modified": "2018-07-15 23:37:36", "extension": "MP4", "full_path": "D:\\Metrô 50 anos\\MET_HV08\\Audiovisual\\Vídeo\\Edição\\MET_HV08_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 161962.0, "duration": 161.96}, "folder_size_gb": 0.192}, "Íntegra": {"MET_HV08.mp4": {"size_mb": 9156.6209, "modified": "2018-06-08 12:55:44", "extension": "MP4", "full_path": "D:\\Metrô 50 anos\\MET_HV08\\Audiovisual\\Vídeo\\Íntegra\\MET_HV08.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7442068.0, "duration": 7442.07}, "folder_size_gb": 8.942}, "folder_size_gb": 9.134}, "Áudio": {"MET_HV08.mp3": {"size_mb": 113.5736, "modified": "2018-06-11 07:15:38", "extension": "MP3", "full_path": "D:\\Metrô 50 anos\\MET_HV08\\Audiovisual\\Áudio\\MET_HV08.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 7442160.0, "duration": 7442.16}, "folder_size_gb": 0.111}, "folder_size_gb": 9.245}, "Iconográfico": {"Making Of": {"MET_HV08_MO01.jpg": {"size_mb": 0.1923, "modified": "2019-11-04 11:54:10", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV08\\Iconográfico\\Making Of\\MET_HV08_MO01.jpg", "category": "Image", "dimension": "759x600", "resolution": "759x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV08_MO01.jpg"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "Textual": {"MET_HV08_Conrado Grava de Souza_rev.docx": {"size_mb": 0.0446, "modified": "2019-02-21 06:09:40", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV08\\Textual\\MET_HV08_Conrado Grava de Souza_rev.docx", "category": "Textual", "content_preview": "Projeto Metrô\nDepoimento de Conrado Grava de Souza\nEntrevistado por Mônica Pereira da Silva e Adelaide Porfirio\nSão Paulo, 08/06/2018\nRealização Museu da Pessoa\nMET_HV08\nTranscrito por Mariana Wolff\nP/1 – Então, você poderia dizer o seu nome completo, a data e o local do nascimento?\nR – Conrado Grava de Souza, nasci no dia três de junho de 1949, numa casa pequenininha, muito pequenininha ao lado, cujo o quintal era a estrada de ferro Cantareira, do trenzinho da Cantareira, o trem das onze. Nasci em casa, com parteira.\nP/1 – Então, você podia falar um pouco da sua história, da origem da sua família, falar um pouco dos seus avós maternos e paternos…\nR – Eu sou de uma família muito pobre. Meu pai, Benedito de Souza nasceu em Lindóia, uma cidade muito pequenininha que é quase divisa com Minas Gerais, veio muito jovem pra São Paulo, não teve instrução formal nenhuma e os seus primeiros empregos foram em padaria, ele era padeiro. Minha mãe também veio muito jovem pra São Paulo, minha mãe nasceu em Jau, filha de agricultores, também com instrução nenhuma, veio pra São Paulo. E os seus primeiros empregos foram de auxiliar de restaurante. Depois, ela foi ser empregada domestica em várias ca"}, "MET_HV08_Conrado Grava de Souza_edi.docx": {"size_mb": 0.0152, "modified": "2019-05-24 10:39:36", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV08\\Textual\\MET_HV08_Conrado Grava de Souza_edi.docx", "category": "Textual", "content_preview": "Nome da história\nDo apito do trem da Cantareira, para o CCO do Metrô de São Paulo\nMinibio\nConrado Grava de Souza nasceu em 1949, São Paulo. Conta que a casa de sua infância tinha por quintal a estrada de ferro da Cantareira, e o apito do trem foi seu hino. Ingressou no Metrô de maneira inusitada, e lá percebeu que viveria a engenharia à fundo. Trabalhou no Metrô de São Paulo por 34 anos. Sua história de vida se interlaça com a história da Companhia.\nSinopse\nConrado Grava de Souza trabalhou por 34 anos no Metrô de São Paulo, 12 deles à frente do CCO (Centro de Controle Operacional do Metrô). Nesta entrevista, ele conta sobre a abnegação e dedicação da equipe que atua nos bastidores dessa empresa, que é a corrente sanguínea de toda uma cidade. Ele também relembra todos os anos de comemorações de Natal e Ano Novo, em que ele sempre fez questão de passar junto aos seus colegas de trabalho e salienta a complexidade de engenharia e quantidade de pessoas envolvidas para que cada trem possa circular pelos trilhos do Metrô, levando milhares de pessoas todos os dias de um lado a outro da cidade.\nTAGs\nSerra da Cantareira\nmetrô\nengenharia\nSão Paulo\nmetrô sp 50 anos\nmetrô de sp\nmetrô 50 anos\nCC"}, "folder_size_gb": 0.0}, "folder_size_gb": 9.245}, "MET_HV09": {"Audiovisual": {"Vídeo": {"Edição": {"MET_HV09_ED001.mp4": {"size_mb": 133.1115, "modified": "2018-07-15 23:42:34", "extension": "MP4", "full_path": "D:\\Metrô 50 anos\\MET_HV09\\Audiovisual\\Vídeo\\Edição\\MET_HV09_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 110611.0, "duration": 110.61}, "folder_size_gb": 0.13}, "Íntegra": {"MET_HV09.mp4": {"size_mb": 5994.6723, "modified": "2018-06-09 00:43:56", "extension": "MP4", "full_path": "D:\\Metrô 50 anos\\MET_HV09\\Audiovisual\\Vídeo\\Íntegra\\MET_HV09.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4871467.0, "duration": 4871.47}, "folder_size_gb": 5.854}, "folder_size_gb": 5.984}, "Áudio": {"MET_HV09.mp3": {"size_mb": 74.3492, "modified": "2018-06-11 07:16:04", "extension": "MP3", "full_path": "D:\\Metrô 50 anos\\MET_HV09\\Audiovisual\\Áudio\\MET_HV09.mp3", "category": "Au "4128x2322", "resolution": "4128x2322", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV09_FT11.jpg"}, "folder_size_gb": 0.011}, "folder_size_gb": 0.011}, "folder_size_gb": 0.011}, "Textual": {"MET_HV09_Rejane Rosenberg_rev.docx": {"size_mb": 0.0287, "modified": "2019-02-21 06:24:24", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV09\\Textual\\MET_HV09_Rejane Rosenberg_rev.docx", "category": "Textual", "content_preview": "Projeto Metrô\nDepoimento de Rejane Rosenberg\nEntrevistado por Karina Nakao e Valquíria Hein\nSão Paulo, 08/06/2018 \nRealização Museu da Pessoa \nMET_HV09_Rejane Rosenberg\nTranscrito por Karina Medici Barrella\nP/1 – Pra começar, nós gostaríamos que você falasse o seu nome completo, a data e o local do seu nascimento, por favor.\nR – Meu nome é Rejane Rosenberg. Nasci em São Paulo, em 30 de agosto de 1954.\nP/1 – Você poderia contar um pouquinho a história, a origem dos seus pais?\nR – Meus pais são de São Paulo mesmo, não da capital, mas do interior de São Paulo. Os meus avós, eu já tenho uma ascendência de avós italiana, espanhol, por parte do meu pai foi italiano e espanhol, mas praticamente já aqui em São Paulo há muito tempo. \nP/1 – Os seus pais por parte da sua mãe?\nR – São do interior de São Paulo.\nP/1 – De qual cidade?\nR – Barretos e Rio Claro.\nP/1 – E um pouquinho da sua infância, você pode falar? Por exemplo, descreve um pouquinho o bairro que você viveu, a rua que você cresceu, o que mais te marcou na sua infância? \nR – A minha infância, eu costumo dizer assim, ela não foi uma infância como a maioria das crianças, de subir em árvore, porque a minha infância, até uns dez, 11 ano"}, "MET_HV09_Rejane Rosenberg_edi.docx": {"size_mb": 0.0134, "modified": "2019-05-24 10:45:00", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV09\\Textual\\MET_HV09_Rejane Rosenberg_edi.docx", "category": "Textual", "content_preview": "Nome da história\nUma experiência em recursos humanos\nMinibio\nRejane é paulistana, seus pais são paulistas e seus avós têm ascendência italiana e espanhola. Gosta de artes, em especial, cerâmica, seu atual projeto de vida. Ao longo de sua vida profissional atuou em Recursos Humanos, onde exerceu papéis de liderança.\nSinopse\nRejane conta sua história na Cia. do Metrô de São Paulo, sua trajetória e conquistas profissionais na área de Recursos Humanos.\nTAGs\ntreinamento\nrecursos\nhumanos\nPDV\nMetrô SP 50 anos\nMetrô de SP\nMetrô 50 anos\navaliação de desempenho\nprojeto ser\nEdição\nRejane trabalhou no Metrô durante 42 anos e, já adolescente, o Metrô iniciou a construção da Linha Norte-Sul, Azul. Naquela época, seu avô que morava na zona central da cidade, acompanhou a construção da linha de metrô e lhe dizia: \"Rejane, essa empresa aqui vai mudar São Paulo. É uma ótima empresa pra você fazer carreira.\" Logo iniciou a faculdade de psicologia, foi adimitida no Metrô como estagiária do curso, efetivada como Analista e fez uma bela carreira, sempre em Recursos Humanos. Foi coordenadora e chefe de departamento, onde teve a oportunidade de desenvolver muitos projetos. O projeto SER, destinado ao aten"}, "folder_size_gb": 0.0}, "folder_size_gb": 6.068}, "MET_HV10": {"Audiovisual": {"Vídeo": {"Edição": {"MET_HV10_ED001.mp4": {"size_mb": 160.9136, "modified": "2018-07-15 23:48:28", "extension": "MP4", "full_path": "D:\\Metrô 50 anos\\MET_HV10\\Audiovisual\\Vídeo\\Edição\\MET_HV10_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 133133.0, "duration": 133.13}, "folder_size_gb": 0.157}, "Íntegra": {"MET_HV10.mp4": {"size_mb": 9583.6232, "modified": "2018-06-15 23:49:50", "extension": "MP4", "full_path": "D:\\Metrô 50 anos\\MET_HV10\\Audiovisual\\Vídeo\\Íntegra\\MET_HV10.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec" {"size_mb": 0.234, "modified": "2019-11-04 13:22:52", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV10\\Iconográfico\\Acervo\\Baixa\\MET_HV10_FT005.jpg", "category": "Image", "dimension": "485x600", "resolution": "485x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV10_FT005.jpg"}, "MET_HV10_FT006.jpg": {"size_mb": 0.1592, "modified": "2019-11-04 13:23:02", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV10\\Iconográfico\\Acervo\\Baixa\\MET_HV10_FT006.jpg", "category": "Image", "dimension": "392x600", "resolution": "392x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV10_FT006.jpg"}, "MET_HV10_FT007.jpg": {"size_mb": 0.2187, "modified": "2019-11-04 13:23:14", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV10\\Iconográfico\\Acervo\\Baixa\\MET_HV10_FT007.jpg", "category": "Image", "dimension": "800x450", "resolution": "800x450", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV10_FT007.jpg"}, "MET_HV10_FT008.jpeg": {"size_mb": 0.2274, "modified": "2019-11-04 13:23:28", "extension": "JPEG", "full_path": "D:\\Metrô 50 anos\\MET_HV10\\Iconográfico\\Acervo\\Baixa\\MET_HV10_FT008.jpeg", "category": "Image", "dimension": "800x450", "resolution": "800x450", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV10_FT008.jpg"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.002}, "Making of": {"MET_HV010_MO001.jpg": {"size_mb": 0.0765, "modified": "2023-03-07 16:43:04", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV10\\Iconográfico\\Making of\\MET_HV010_MO001.jpg", "category": "Image", "dimension": "660x440", "resolution": "660x440", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV010_MO001.jpg"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.002}, "Textual": {"MET_HV10_Maria Elizabeth Torres de Oliveira_rev.docx": {"size_mb": 0.0471, "modified": "2019-02-21 06:35:18", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV10\\Textual\\MET_HV10_Maria Elizabeth Torres de Oliveira_rev.docx", "category": "Textual", "content_preview": "Depoimento de Maria Elizabeth Torres de Oliveira\nEntrevistada por Ana Maria Alves Coelho, Juliana Venâncio\nSão Paulo, 15 de junho de 2018\nEntrevista número MET_HV010\nRealização: Museu da Pessoa\nP/1 - Fala para a gente o seu nome, a data e o local do seu nascimento.\nR - Meu nome é Maria Elizabeth Torres de Oliveira, nasci em 12 de julho de 1956, em Piratininga, no interior de São Paulo.\nP/1 - Conte para a gente um pouquinho da sua família, é de Piratininga que você é?\nR - É. Quando eu vim de Piratininga para São Paulo eu tinha oito anos, e nós viemos, a família. Eu vim para morar em Tucuruvi, eu morei lá. Nessa época ficamos alguns anos em Tucuruvi e depois fui para a Vila Gustavo. Quando eu tinha dez anos meu pai comprou um terreno em Guarulhos e moramos lá até eu casar, e minha mãe mora no mesmo lugar, ainda está lá. Foi assim.\nP/1 - Seu pai e sua mãe, eles se conheceram em Piratininga? E só aí vieram para cá?\nR - Sim, os dois eram de lá, nasceram lá.\nP/1 - Sabe como eles se conheceram? Qual é a história deles? Tem alguma coisa... \nR - Cidade do interior tem uma rua principal, um jardim, um coreto e é assim minha cidade. Então, a noite ficava andando de um lado as mulheres e de ou"}, "MET_HV10_Maria Elizabeth Torres de Oliveira_edi.docx": {"size_mb": 0.0174, "modified": "2019-05-24 10:47:52", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV10\\Textual\\MET_HV10_Maria Elizabeth Torres de Oliveira_edi.docx", "category": "Textual", "content_preview": "Nome da história\nOperação feminina\nMinibio\nMaria Elizabete Torres de Oliveira nasceu na cidade de Piratininga, interior de São Paulo, no dia 12 de julho de 1956, primogênita de cinco irmãos. Casou-se aos 18 anos com Paulo com quem teve 2 filhos, a primeira aos 18 e o segundo nove anos depois. Por conta do comportamento opressor do pai, começou a trabalhar desde cedo e assegurar o lugar de sua independência financeira. Começou a trabalhar com 12 anos como babá, foi soldadora de radiador na Ibrape e vendedora na Jumbo Eletro. Em 1984 ingressou na Companhia do Metropolitano de São Paulo como funcionária de estação. Um ano e meio mais tarde, aplicou para a primeira seleção ao cargo de operadora de trem da empresa, função que exerce até 2018.\nSinopse\nMaria Elizabete Torres de Oliveira nasceu na cidade de Piratininga, interior de São Paulo, no dia 12 de julho de 1956. Primogênita de cinco irmãos. Casou-se aos 18 anos com Paulo com quem teve 2 filhos, a primeira aos 18 e o segundo nove anos depois. Por conta do comportamento opressor do pai, começou a trabalhar desde cedo e assegurar o lugar de sua independência financeira. Começou a trabalhar com 12 anos como babá, foi soldadora de radia"}, "folder_size_gb": 0.0}, "folder_size_gb": 9.634}, "MET_HV11": {"Audiovisual": {"Vídeo": {"Edição": {"MET_HV11_ED001.mp4": {"size_mb": 224.6471, "modified": "2018-07-15 23:54:44", "extension": "MP4", "full_path": "D:\\Metrô 50 anos\\MET_HV11\\Audiovisual\\Vídeo\\Edição\\MET_HV11_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 184851.0, "duration": 184.85}, "folder_size_gb": 0.219}, "Íntegra": {"MET_HV11.mp4": {"size_mb": 8888.9926, "modified": "2018-06-16 00:22:50", "extension": "MP4", "full_path": "D:\\Metrô 50 anos\\MET_HV11\\Audiovisual\\Vídeo\\Íntegra\\MET_HV11.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7224284.0, "duration": 7224.28}, "folder_size_gb": 8.681}, "folder_size_gb": 8.9}, "Áudio": {"MET_HV11.mp3": {"size_mb": 110.2483, "modified": "2018-06-19 05:44:32", "extension": "MP3", "full_path": "D:\\Metrô 50 anos\\MET_HV11\\Audiovisual\\Áudio\\MET_HV11.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 7224336.0, "duration": 7224.34}, "folder_size_gb": 0.108}, "folder_size_gb": 9.008}, "Iconográfico": {"Making Of": {"MET_HV11_MO001.jpg": {"size_mb": 0.1856, "modified": "2019-11-04 13:26:16", "extension": "JPG", "full_path": "D:\\Metrô 50 anos\\MET_HV11\\Iconográfico\\Making Of\\MET_HV11_MO001.jpg", "category": "Image", "dimension": "800x510", "resolution": "800x510", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_MET_HV11_MO001.jpg"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "Textual": {"MET_HV011_Ailton Brasiliense Pires_rev.docx": {"size_mb": 0.0494, "modified": "2019-02-21 06:44:26", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV11\\Textual\\MET_HV011_Ailton Brasiliense Pires_rev.docx", "category": "Textual", "content_preview": "Depoimento de Ailton Brasiliense Pires\nEntrevistado por Lúcia Pedrosa e Mônica Braga\nSão Paulo 15 de junho de 2018\nEntrevista nº MET_HV011\nRealização: Museu da Pessoa\nP/1 - Bom, boa tarde, é um prazer estar aqui entrevistando o senhor. Nós vamos começar falando um pouquinho da identificação e alguns fatos relacionados à sua história de vida, família, infância, juventude. Então, a primeira coisa, eu gostaria que o senhor me dissesse o seu nome completo, data e local de nascimento. \nR - Ailton Brasiliense Pinto, eu nasci em São Paulo, no dia 02 de agosto de 1946, na maternidade do Brás. \nP/1 - Na maternidade do Brás. Muito bem. Eu gostaria de saber um pouco da origem da sua família, já me chamou atenção o nome, Brasiliense, já fiquei tentando saber que história tem por trás desse nome. Então, gostaria que o senhor falasse um pouco dos seus avós maternos, paternos, o nome do seu pai, da sua mãe, se o senhor sabe como eles se conheceram, então, contasse um pouquinho da origem da sua família. \nR - Os meus quatro avós eram portugueses, minha mãe era portuguesa e meu pai era paulistano. Meu avô veio para o Brasil, o paterno, em 1900, meu avô materno em 1902. Meu pai nasceu em 1906, também"}, "MET_HV011_Ailton Brasiliense Pires_edi.docx": {"size_mb": 0.0164, "modified": "2019-05-24 10:52:58", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV11\\Textual\\MET_HV011_Ailton Brasiliense Pires_edi.docx", "category": "Textual", "content_preview": "Nome da história\nConstruindo a história do Metrô e dos transportes públicos em São Paulo\nMinibio\nAílton Brasiliense nasceu em São Paulo, no dia 02 de agosto de 1946, na maternidade do Brás. Sua mãe e seus avós paternos e maternos eram portugueses e seu pai paulistano. Formado em matemática em 1971 e em engenharia eletrotécnica em 1972 na faculdade de Mauá. Em 1974 fez mestrado na Poli. Iniciou suas atividades profissionais como professor de matemática e física num cursinho que ele próprio montou. Trabalhou na Light (1972) como engenheiro eletricista antes de entrar no Metrô. No Metrô, trabalhou em diversas áreas tendo iniciado na área de planejamento e em 1994 tornou-se Superintendente de Planejamento na CPTM onde ficou até 1995 quando ingressou na Secretaria dos Transportes. De 1997 até 2001 exerceu suas atividades na STM – Secretaria de Transportes Metropolitanos. No seu extenso curriculum, também acumulou funções na CET – Companhia de Engenharia de Tráfego, DENATRAN – Departamento Nacional de Trânsito e ANTP – Associação Nacional dos Transportes Públicos onde exerce até hoje a Presidência.\nSinopse\nAilton conta sua trajetória, que converge em termos de história de avô, de pai, do"}, "folder_size_gb": 0.0}, "folder_size_gb": 9.008}, "folder_size_gb": 96.095}, "Sanofi 100 anos": {"SAN_TM005": {"Audiovisual": {"Áudio": {"SAN_TM05.mp3": {"size_mb": 12.5152, "modified": "2018-11-09 00:11:34", "extension": "MP3", "full_path": "D:\\Sanofi 100 anos\\SAN_TM005\\Audiovisual\\Áudio\\SAN_TM05.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "M io_codec": "PCM", "duration_ms": 170170.0, "duration": 170.17}, "folder_size_gb": 61.444}, "folder_size_gb": 63.607}, "folder_size_gb": 63.607}, "folder_size_gb": 63.689}, "Iconográfico": {"Making Of": {"SAN_HV01_MO001.JPG": {"size_mb": 8.997, "modified": "2019-02-26 06:57:34", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV01_Massao Julio Otubo\\Iconográfico\\Making Of\\SAN_HV01_MO001.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV01_MO001.jpg"}, "SAN_HV01_MO002.JPG": {"size_mb": 7.5832, "modified": "2019-02-26 06:58:16", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV01_Massao Julio Otubo\\Iconográfico\\Making Of\\SAN_HV01_MO002.JPG", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV01_MO002.jpg"}, "folder_size_gb": 0.016}, "folder_size_gb": 0.016}, "Textual": {"SAN_HV_01_Massao Julio Otubo_ed.docx": {"size_mb": 0.0189, "modified": "2019-08-19 10:52:24", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV01_Massao Julio Otubo\\Textual\\SAN_HV_01_Massao Julio Otubo_ed.docx", "category": "Textual", "content_preview": "Nome da história\nUma vida atrelada à indústria\nMinibio\nDe ascendência japonesa, Massao Julio Otubo nasceu no Rio de Janeiro, mas mudou-se com os familiares, ainda pequeno, para o interior de São Paulo. Em Suzano, trabalhou na chácara da família, ajudando a cultivar e a vender frutas e verduras, em uma bombonnière e em um armazém, antes de dar início a uma longa trajetória na indústria farmacêutica Hoechst, hoje Sanofi. Desde 1978, ele atua na empresa: acompanhou todas as suas mudanças e se especializou no manuseio das máquinas de produção de medicamentos. Sua vida está tão atrelada à fábrica que foi lá que conheceu sua esposa; com ela, teve uma filha que acabou seguindo seus passos e trabalhando também em uma indústria farmacêutica.\nSinopse\nNascido em uma família de dez irmãos, Massao Julio Otubo se recorda das dificuldades que, como filho de japonesa, enfrentou na escola. Acostumado a falar e a ouvir apenas o idioma de sua mãe, teve de aprender como pronunciar os “erres” e os “eles” da língua portuguesa. Aos poucos, foi se acostumando com o idioma e com a temperada comida brasileira, bem diferente do arroz sem sal que comia em casa. De sua vida profissional, Massao se lembra do tr"}, "SAN_HV_01_Massao Julio Otubo_rev.docx": {"size_mb": 0.0586, "modified": "2019-08-19 10:52:52", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV01_Massao Julio Otubo\\Textual\\SAN_HV_01_Massao Julio Otubo_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de Massao Julio Otubo\nEntrevistado por Mauricio Rodrigues \nSão Paulo, 06/09/2018 \nRealização Museu da Pessoa \nSAN_HV01_Massao Julio Otubo\nTranscrito por Karina Medici Barrella\nRevisado e editado por Viviane Aguiar\nP/1 – Seu Massao, boa tarde.\nR – Boa tarde.\nP/1 – Em nome do Museu da Pessoa e da Sanofi, queria agradecer aqui a sua presença e a participação no Projeto 100 Anos da Sanofi. E, pra gente começar, eu queria que o senhor se apresentasse falando o seu nome, a data e o local do seu nascimento.\nR – Eu me chamo Massao Julio Otubo, trabalho na Sanofi desde 1978, 21 de março de 1978.\nP/1 – E qual é a sua data e local de nascimento?\nR – 4 de outubro de 1958.\nP/1 – E o senhor pode falar onde o senhor nasceu, a cidade?\nR – Nasci no estado do Rio de Janeiro, município de Marquês de Valência.\nP/1 – E o senhor pode falar o nome dos seus pais?\nR – Antonio Otubo e Yoshika Otubo.\nP/1 – E o senhor sabe um pouco a história de como eles se conheceram?\nR – Não. Eu não conheci meu pai porque ele já tinha falecido. E minha mãe, ela teve os dez filhos, sete irmãos e três mulheres, aí foi carregando até onde a gente, que eu saiba... Não casou mais e foi prosseg"} D_0110/thumb_SAN_HV02_FT05.jpg"}, "SAN_HV02_FT06.jpg": {"size_mb": 1.3738, "modified": "2018-10-03 06:36:42", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV02_Nelson de Jesus Catelan\\Iconográfico\\Acervo\\Baixa\\SAN_HV02_FT06.jpg", "category": "Image", "dimension": "4661x3189", "resolution": "4661x3189", "color_mode": "RGB", "dpi": "400 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV02_FT06.jpg"}, "SAN_HV02_FT07.jpg": {"size_mb": 0.2432, "modified": "2018-10-03 06:36:44", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV02_Nelson de Jesus Catelan\\Iconográfico\\Acervo\\Baixa\\SAN_HV02_FT07.jpg", "category": "Image", "dimension": "2330x1536", "resolution": "2330x1536", "color_mode": "RGB", "dpi": "400 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV02_FT07.jpg"}, "SAN_HV02_FT08.jpg": {"size_mb": 0.3045, "modified": "2018-10-03 06:36:44", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV02_Nelson de Jesus Catelan\\Iconográfico\\Acervo\\Baixa\\SAN_HV02_FT08.jpg", "category": "Image", "dimension": "2437x1696", "resolution": "2437x1696", "color_mode": "RGB", "dpi": "400 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV02_FT08.jpg"}, "SAN_HV02_FT09.jpg": {"size_mb": 2.4595, "modified": "2018-10-03 06:36:56", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV02_Nelson de Jesus Catelan\\Iconográfico\\Acervo\\Baixa\\SAN_HV02_FT09.jpg", "category": "Image", "dimension": "3194x4016", "resolution": "3194x4016", "color_mode": "RGB", "dpi": "400 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV02_FT09.jpg"}, "SAN_HV02_FT10.jpg": {"size_mb": 0.2136, "modified": "2018-10-03 06:36:44", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV02_Nelson de Jesus Catelan\\Iconográfico\\Acervo\\Baixa\\SAN_HV02_FT10.jpg", "category": "Image", "dimension": "2218x1392", "resolution": "2218x1392", "color_mode": "RGB", "dpi": "400 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV02_FT10.jpg"}, "SAN_HV02_FT11.jpg": {"size_mb": 0.6763, "modified": "2018-10-03 06:36:54", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV02_Nelson de Jesus Catelan\\Iconográfico\\Acervo\\Baixa\\SAN_HV02_FT11.jpg", "category": "Image", "dimension": "2309x1536", "resolution": "2309x1536", "color_mode": "RGB", "dpi": "400 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV02_FT11.jpg"}, "folder_size_gb": 0.007}, "folder_size_gb": 0.007}, "folder_size_gb": 0.027}, "Textual": {"SAN_HV02_Nelson de Jesus Catelan_ed.docx": {"size_mb": 0.0234, "modified": "2019-08-19 10:53:04", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV02_Nelson de Jesus Catelan\\Textual\\SAN_HV02_Nelson de Jesus Catelan_ed.docx", "category": "Textual", "content_preview": "Título da história\nEu sou um vencedor\nMinibio\nNelson de Jesus Catelan nasceu na cidade de São Paulo, em 1963, e desfrutou de uma infância tranquila no bairro da Saúde, em uma época em que era possível brincar de bicicleta nas ruas sem nenhuma preocupação. Já um pouco mais velho, formou-se em Administração e sempre nutriu o sonho de trabalhar em uma grande empresa – algo que conseguiu logo em seu primeiro estágio, em uma multinacional onde também conheceu sua futura esposa. Foi na indústria farmacêutica Rhodia, no entanto, que ele fez sua carreira, impulsionada pelas fusões como a que levou à sua incorporação pela gigantesca Sanofi. Ali, pôde, enfim, se descobrir um vencedor: de uma família de poucos recursos, galgou cargos importantes sempre com a intenção de ajudar e fazer o bem.   \nSinopse\nMuitas das histórias de que Nelson de Jesus Catelan se lembra têm a ver com o lugar em que trabalha há mais de duas décadas, a indústria farmacêutica Sanofi. Foi lá que ele enfrentou o maior desafio de sua vida – atuar no setor de importação e ter de falar inglês – e que se sentiu orgulhoso por participar, com sucesso, de cada fusão, de cada mudança da empresa, incluindo aquela que o levou a se"}, "SAN_HV02_Nelson de Jesus Catelan_rev.docx": {"size_mb": 0.0738, "modified": "2019-08-19 10:53:08", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV02_Nelson de Jesus Catelan\\Textual\\SAN_HV02_Nelson de Jesus Catelan_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de Nelson de Jesus Catelan\nEntrevistado por ???\nSão Paulo, __ de setembro de 2018 \nRealização Museu da Pessoa \nSAN_HV02_Nelson de Jesus Catelan\nTranscrito por Karina Medici Barrella\nRevisado e editado por Viviane Aguiar\nP/1 – Nelson, bom dia.\nR – Bom dia. É um prazer imenso eu poder participar desse projeto da Sanofi. Agradeço demais a contribuição de vocês, que vocês dão uma orientação bem bacana pra gente, e eu estou muito à vontade pra responder qualquer pergunta que seja possível de ser respondida, tá?\nP/1 – Está ótimo! Eu também agradeço aqui já de antemão em nome do Museu da Pessoa e da Sanofi. E, pra gente poder começar eu queria que você se apresentasse falando o seu nome completo, o local e a data do seu nascimento.\nR – Ok. Eu sou o Nelson de Jesus Catelan, eu nasci em São Paulo. Hoje eu trabalho na Sanofi há 21 anos e sou casado, tenho um filho. Meu filho hoje tem 24 anos e sou uma pessoa muito feliz por estar trabalhando hoje na Sanofi.\nP/1 – A data de nascimento?\nR – É 24 de abril de 1963.\nP/1 – A gente vai passar por todos esses pontos que você já foi falando, pra gente chegar nessa sua trajetória. Pra começar, eu queria que você me f"}, "folder_size_gb": 0.0}, "folder_size_gb": 74.666}, "SAN_HV03_Edegar de Oliveira": {"Audiovisual": {"Áudio": {"SAN_HV03.mp3": {"size_mb": 93.1502, "modified": "2018-09-21 22:27:24", "extension": "MP3", "full_path": "D:\\Sanofi 100 anos\\SAN_HV03_Edegar de Oliveira\\Audiovisual\\Áudio\\SAN_HV03.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 6103656.0, "duration": 6103.66}, "folder_size_gb": 0.091}, "Vídeo": {"Íntegra": {"SAN_HV003.mp4": {"size_mb": 2314.7481, "modified": "2018-09-24 02:23:34", "extensi cervo\\Baixa\\SAN_HV03_FT04.JPG", "category": "Image", "dimension": "1024x768", "resolution": "1024x768", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV03_FT04.jpg"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.002}, "Making Of": {"SAN_HV03_MO001.JPG": {"size_mb": 5.8888, "modified": "2018-09-21 11:56:26", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV03_Edegar de Oliveira\\Iconográfico\\Making Of\\SAN_HV03_MO001.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV03_MO001.jpg"}, "SAN_HV03_MO002.JPG": {"size_mb": 8.7757, "modified": "2019-02-26 07:00:32", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV03_Edegar de Oliveira\\Iconográfico\\Making Of\\SAN_HV03_MO002.JPG", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV03_MO002.jpg"}, "folder_size_gb": 0.014}, "folder_size_gb": 0.016}, "Textual": {"SAN_HV03_Edegar Fernando de Oliveira_ed.docx": {"size_mb": 0.0227, "modified": "2019-08-19 14:50:10", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV03_Edegar de Oliveira\\Textual\\SAN_HV03_Edegar Fernando de Oliveira_ed.docx", "category": "Textual", "content_preview": "Título da história\nRumo aos 50 anos de empresa\nUm vendedor nato\nMinibio\nEdegar Fernando de Oliveira nasceu em 1963 em um sítio de Birigui, interior de São Paulo. No início da adolescência, mudou-se com a grande família de dez irmãos para a capital. Aos 13 anos, estudava à noite e já trabalhava durante o dia, como office-boy na sede da indústria farmacêutica Hoechst (hoje Sanofi). Ali mesmo tinha início sua longeva carreira na empresa: de boy, passou logo a PVC, sigla para o acúmulo das funções de propagandista, vendedor e cobrador. Apesar de ser formado em Administração, Edegar se especializou mesmo em diabetes, ou mais precisamente nos medicamentos de ponta que ajudam a amenizar a doença. Com três filhos, incluindo os gêmeos que nasceram de seu segundo casamento, ele ainda se diz motivado para, logo, completar cinco décadas como vendedor de uma mesma empresa.\nSinopse\nA aptidão de Edegar Fernando de Oliveira para as vendas é evidente. Até mesmo ao contar sua história, ele não deixou de fazer a propaganda dos produtos que marcaram a trajetória que, desde seus 13 anos de idade, vem traçando em um único lugar: a indústria farmacêutica Hoechst, hoje Sanofi. De office-boy da presidência"}, "SAN_HV03_Edegar Fernando de Oliveira_rev.docx": {"size_mb": 0.0712, "modified": "2019-08-19 14:50:14", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV03_Edegar de Oliveira\\Textual\\SAN_HV03_Edegar Fernando de Oliveira_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de Edegar Fernando de Oliveira \nEntrevistado Mauricio Rodrigues \nSão Paulo, 21 de setembro de 2018 \nRealização Museu da Pessoa \nSAN_HV03_Edegar Fernando de Oliveira\nTranscrito por Karina Medici Barrella\nRevisado e editado por Viviane Aguiar\nP/1 – Edegar, bom dia.\nR – Bom dia!\nP/1 – Primeiro, eu queria agradecer aqui, em nome do Museu da Pessoa e da Sanofi, você ter aceitado o convite para fazer essa entrevista. E, pra gente começar, eu queria que você se apresentasse dizendo o seu nome completo, a data e o local do seu nascimento.\nR – Ótimo! Bom, eu também fiquei extremamente contente por esse convite. Meu nome é Edegar Fernando de Oliveira, nasci em 18 de junho de 1963 e ingressei na companhia em 1 de dezembro de 1978.\nP/1 – E qual é a sua cidade de nascimento?\nR – Ah, sim, eu nasci em Birigui, a cidade do calçado infantil, que também tem o jogo de biribol que é famoso lá, né? Fica no noroeste do estado de São Paulo.\nP/1 – E quais os nomes dos seus pais?\nR – O nome do meu pai é bastante interessante, acho que você nunca ouviu falar, é Otogamis, Otogamis de Oliveira. E a minha mãe, Esperança de Oliveira.\nP/1 – E você sabe a história de como eles s"}, "folder_size_gb": 0.0}, "folder_size_gb": 71.003}, "SAN_HV04_Elisete Veloso": {"Audiovisual": {"Áudio": {"SAN_HV04.mp3": {"size_mb": 83.6508, "modified": "2018-09-21 22:51:32", "extension": "MP3", "full_path": "D:\\Sanofi 100 anos\\SAN_HV04_Elisete Veloso\\Audiovisual\\Áudio\\SAN_HV04.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 5480544.0, "duration": 5480.54}, "folder_size_gb": 0.082}, "Vídeo": {"Íntegra": {"SAN_HV004.mp4": {"size_mb": 2264.6427, "modified": "2018-09-23 20:43:26", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV04_Elisete Veloso\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV004.mp4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5480475.0, "duration": 5480.48}, "SAN_HV004": {"SAN_HV04 (1).MP4": {"size_mb": 231.1665, "modified": "2016-06-28 18:23:20", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV04_Elisete Veloso\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV004\\SAN_HV04 (1).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 20020.0, "duration": 20.02}, "SAN_HV04 (2).MP4": {"size_mb": 448.2087, "modified": "2016-06-28 18:23:56", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV04_Elisete Veloso\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV004\\SAN_HV04 (2).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 39039.0, "duration": 39.04}, "SAN_HV04 (3).MP4": {"size_mb": 5730.7428, "modified": "2016-06-28 18:25:22", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV04_Eli on": "3093x3728", "color_mode": "RGB", "dpi": "400 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV04_FT05a.jpg"}, "folder_size_gb": 0.006}, "folder_size_gb": 0.006}, "Making Of": {"SAN_HV04_MO001.JPG": {"size_mb": 8.6412, "modified": "2019-02-26 07:07:50", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV04_Elisete Veloso\\Iconográfico\\Making Of\\SAN_HV04_MO001.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV04_MO001.jpg"}, "SAN_HV04_MO002.JPG": {"size_mb": 9.2824, "modified": "2019-02-26 07:08:22", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV04_Elisete Veloso\\Iconográfico\\Making Of\\SAN_HV04_MO002.JPG", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV04_MO002.jpg"}, "folder_size_gb": 0.018}, "folder_size_gb": 0.023}, "Textual": {"SAN_HV04_Elisete Veloso_ed.docx": {"size_mb": 0.0232, "modified": "2019-08-19 14:51:10", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV04_Elisete Veloso\\Textual\\SAN_HV04_Elisete Veloso_ed.docx", "category": "Textual", "content_preview": "Título da história\nA embaixadora da inclusão\nMinibio\nNascida no interior do Piauí, em 1968, Elisete Veloso se mudou, com a família, para São Paulo quando ainda era criança. Com cinco irmãos, em uma casa pequena, ela teve de se virar desde cedo para ajudar os pais. Aos 13 anos, começou a trabalhar. Foi vendedora de loja e estagiária em um banco até conseguir uma vaga na indústria farmacêutica Merrell Lepetit, que logo se transformaria na Sanofi. Ali, encontrou motivação para se formar em Química, iniciou uma trajetória de sucesso profissional e ainda conheceu seu futuro marido, com quem teria suas duas filhas. Hoje, em um alto cargo de gestão, ela também lidera os projetos de inclusão social da empresa, como aquele que permitiu a entrada de funcionários surdos e fez com que todos os demais aprendessem a “falar” em libras.\nSinopse\nElisete Veloso está acostumada a mudanças. Ela conta que, com a família, transferiu-se de sua cidade natal, no Piauí, para São Paulo quando ainda era criança. Depois, ainda adolescente, deu início à sua carreira na indústria farmacêutica Merrell Lepetit (hoje, Sanofi) e enfrentou, ali, uma série de alterações e fusões. Naquela que mais a impactou, em 1996,"}, "SAN_HV04_Elisete Veloso_rev.docx": {"size_mb": 0.0608, "modified": "2019-08-19 14:51:14", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV04_Elisete Veloso\\Textual\\SAN_HV04_Elisete Veloso_rev.docx", "category": "Textual", "content_preview": "Projeto 100 Anos Sanofi\nDepoimento de Elisete Veloso\nEntrevistada por Mauricio Rodrigues \nSão Paulo, 21 de setembro de 2018 \nRealização Museu da Pessoa \nSAN_HV04_Elisete Veloso\nTranscrito por Karina Medici Barrella\nRevisado e editado por Viviane Aguiar\nP/1 – Elisete, boa tarde.\nR – Boa tarde.\nP/1 – Primeiro, eu queria te agradecer por ter aceitado participar, em nome do Museu da Pessoa e da Sanofi, agradecer aqui a sua presença e por ter aceitado dar aqui a sua entrevista para esse projeto de cem anos de história da Sanofi. E, pra gente começar, eu queria que você me falasse o seu nome completo, a data e o local do seu nascimento.\nR – O meu nome é Elisete Veloso. Eu nasci em Picos, Piauí, em 18 de março de 1968.\nP/1 – Elisete, eu queria que você me contasse o nome dos seus pais.\nR – O meu pai se chama Francisco Antônio Veloso e a minha mãe, Maria de Sousa Veloso.\nP/1 – E você sabe a história de como eles se conheceram? Eles contaram pra você?\nR – Eles moravam na mesma região, e as famílias eram amigas, eu acho que foi um processo natural, não teve nenhuma particularidade assim que eu saiba.\nP/1 – Isso lá em Picos, né?\nR – Isso.\nP/1 – E você sabe por que eles te batizaram com esse n"}, "folder_size_gb": 0.0}, "folder_size_gb": 63.789}, "SA V05_Paulo César Oliveira\\Iconográfico\\Making Of\\SAN_HV05_MO002.JPG", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV05_MO002.jpg"}, "folder_size_gb": 0.018}, "folder_size_gb": 0.024}, "Textual": {"SAN_HV05_Paulo Cesar Reboucas Oliveira_ed.docx": {"size_mb": 0.021, "modified": "2019-08-19 14:51:36", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV05_Paulo César Oliveira\\Textual\\SAN_HV05_Paulo Cesar Reboucas Oliveira_ed.docx", "category": "Textual", "content_preview": "Título da história\nDe bombeiro à fábrica de Novalgina\nMedicamentos que salvam vidas\nMinibio\nPaulo César nasceu em 1971 na periferia de Itapecerica da Serra, Grande São Paulo. Teve uma infância feliz, de brincadeiras na rua, mas logo cedo, aos 15 anos, começou a se dividir entre os estudos e o trabalho. De seu primeiro emprego, nunca mais saiu: foi na indústria farmacêutica Sanofi, que, de office-boy, ele passou por diversas áreas até se tornar um importante funcionário do setor de exportação de medicamentos. Foi também por causa de seu emprego que Paulo se mudou para a região de Suzano, onde se casou e constituiu sua família, com dois filhos. \nSinopse\nQuando Paulo César era criança, não podia imaginar que trabalharia na empresa responsável pelo remédio que a mãe costumava lhe dar em caso de febre. Em vez de ser policial ou bombeiro, como sonhava ainda menino, aos 15 anos de idade ele conseguiu seu primeiro emprego na indústria farmacêutica Merrell Lepetit (hoje Sanofi) e, de lá, nunca mais saiu. Em seu depoimento, Paulo se lembra dos desafios que vivenciou por causa do emprego, incluindo a mudança da casa da família, em Itapecerica da Serra, para Suzano, onde se viu obrigado a se v"}, "SAN_HV05_Paulo Cesar Reboucas Oliveira_rev.docx": {"size_mb": 0.0479, "modified": "2019-08-19 14:51:30", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV05_Paulo César Oliveira\\Textual\\SAN_HV05_Paulo Cesar Reboucas Oliveira_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de Paulo César Rebouças Oliveira\nEntrevistado por ???\nSão Paulo, 06/09/2018 \nRealização Museu da Pessoa \nSAN_HV05_Paulo César Rebouças Oliveira\nTranscrito por Karina Liliane Custódio\nRevisado e editado por Viviane Aguiar\nP/1 – Paulo, então, antes de mais nada, eu queria te agradecer. Bom dia.\nR – Bom dia.\nP/1 – Eu queria agradecer a sua presença e a sua participação neste projeto dos cem anos da Sanofi. E, para a gente começar, eu queria que você se apresentasse falando o seu nome completo, a data e o local do seu nascimento.\nR – Meu nome é Paulo César Rebouças Oliveira, eu nasci em São Paulo, tenho 47 anos.\nP/1 – E a sua data de nascimento?\nR – 1971.\nP/1 – Certo. E, Paulo, você sabe dizer como seus pais... Quais os nomes dos seus pais?\nR – O nome da minha mãe é Helena Rebouças Oliveira, meu pai é Abílio Carneiro Oliveira.\nP/1 – Você sabe dizer como eles se conheceram, qual a história da origem...\nR – Eles se conheceram no interior da Bahia, eles moravam em fazendas, tinham fazenda próxima uma da outra, se conheceram lá. Porém, vieram a se casar em São Paulo, depois de um tempo.\nP/1 – E você tem irmãos?\nR – Tenho uma irmã chamada Simone, ela tem 4"}, "folder_size_gb": 0.0}, "folder_size_gb": 47.425}, "SAN_HV06_Idelma Gil": {"Audiovisual": {"Áudio": {"SAN_HV06.mp3": {"size_mb": 125.5129, "modified": "2018-10-22 01:19:46", "extension": "MP3", "full_path": "D:\\Sanofi 100 anos\\SAN_HV06_Idelma Gil\\Audiovisual\\Áudio\\SAN_HV06.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 8224800.0, "duration": 8224.8}, "folder_size_gb": 0.123}, "Vídeo": {"Íntegra": {"SAN_HV06.mp4": {"size_mb": 3129.5486, "modified": "2018-10-21 21:21:52", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV06_Idelma Gil\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV06.mp4", "category": "Video" "D:\\Sanofi 100 anos\\SAN_HV06_Idelma Gil\\Iconográfico\\Acervo\\SAN_HV006_FT003.jpg", "category": "Image", "dimension": "2410x1648", "resolution": "2410x1648", "color_mode": "RGB", "dpi": "400 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV006_FT003.jpg"}, "SAN_HV006_FT004.jpg": {"size_mb": 2.0789, "modified": "2021-09-29 07:11:04", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV06_Idelma Gil\\Iconográfico\\Acervo\\SAN_HV006_FT004.jpg", "category": "Image", "dimension": "4661x3253", "resolution": "4661x3253", "color_mode": "RGB", "dpi": "400 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV006_FT004.jpg"}, "SAN_HV006_FT005.jpg": {"size_mb": 0.2709, "modified": "2021-09-29 07:11:36", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV06_Idelma Gil\\Iconográfico\\Acervo\\SAN_HV006_FT005.jpg", "category": "Image", "dimension": "2405x1450", "resolution": "2405x1450", "color_mode": "RGB", "dpi": "400 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV006_FT005.jpg"}, "folder_size_gb": 0.005}, "folder_size_gb": 0.015}, "Textual": {"SAN_HV06_Idelma Gonçalves Bardini Gil_ed.docx": {"size_mb": 0.0239, "modified": "2019-08-19 14:51:48", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV06_Idelma Gil\\Textual\\SAN_HV06_Idelma Gonçalves Bardini Gil_ed.docx", "category": "Textual", "content_preview": "Título da história\nUm trabalho com propósito\nMinibio\nIdelma Gil nasceu em 1967 na cidade de Braúna, no interior de São Paulo, mas antes mesmo de completar seu primeiro aniversário já havia se mudado, com a família, para a capital. Caçula de quatro irmãs, ela passou uma infância divertida em um bairro da Zona Leste, soltando pipa em cima da laje e brincando de carrinho de rolimã. Muito cedo, aos 13 anos, conseguiu seu primeiro e único emprego: desde então, trabalha numa mesma indústria farmacêutica que, depois de diversas fusões, passou a atender por Sanofi. Ali, construiu uma sólida carreira como assistente administrativa e conheceu o homem com quem casaria e teria seus dois filhos.\nSinopse\nNascida em 1967 no interior de São Paulo, mas moradora da capital desde antes de completar um ano de idade, Idelma Gil se lembra com saudade da infância, das brincadeiras de rua e dos amigos com que conviveu em um bairro da Zona Leste. Aos 13 anos, no entanto, para ajudar a família, teve de arranjar emprego naquele que seria seu primeiro e também único local de trabalho por toda a vida. Na Astra Química do Brasil, mais tarde convertida na indústria farmacêutica Sanofi, ela começou na linha de pr"}, "SAN_HV06_Idelma Gonçalves Bardini Gil_rev.docx": {"size_mb": 0.0898, "modified": "2019-08-19 14:52:00", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV06_Idelma Gil\\Textual\\SAN_HV06_Idelma Gonçalves Bardini Gil_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de Idelma Gonçalves Bardini Gil\nEntrevistada por ???\nSão Paulo, ??/0?/2018\nRealização Museu da Pessoa\nSAN_HV06_Idelma Gonçalves Bardini Gil\nTranscrito por Mariana Wolff\nRevisado e editado por Viviane Aguiar\nP/1 – Boa tarde, em nome do Museu da Pessoa e da Sanofi, queria agradecer muito a sua participação, de você ter aceitado dar aqui essa entrevista para a gente. E, pra começar, eu queria que você se apresentasse, falando o seu nome completo, a data e o seu local de nascimento.\nR – Meu nome é Idelma Gonçalves Bardini Gil, mais conhecida como Idelma Gil. Eu nasci na cidade de Braúna, uma cidade do interior de São Paulo, no dia 6 de fevereiro de 1967.\nP/1 – E, Idelma, você sabe como é que foi que os seus pais escolheram o seu nome? Por que eles te batizaram como Idelma?\nR – Na verdade, foi uma escolha do meu pai, que não sabia exatamente que nome dar, então, ele foi até o cartório e começou a folhear o livro e no meio de tantos e vários outros nomes, ele acabou optando por esse. Não teve uma lógica, na verdade. A história é bem essa mesmo.\nP/1 – E quais os nomes dos seus pais?\nR – Meu pai chama Irineu e a minha mãe chama Florinda. Eu tenho outras t"}, "folder_size_gb": 0.0}, "folder_size_gb": 95.711}, "SAN_HV07_Pius Hornstein": {"Audiovisual": {"Áudio": {"SAN_HV07.mp3": {"size_mb": 75.1344, "modified": "2018-10-22 20:52:24", "extension": "MP3", "full_path": "D:\\Sanofi 100 anos\\SAN_HV07_Pius Hornstein\\Audiovisual\\Áudio\\SAN_HV07.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 4922976.0, "duration": 4922.98}, "folder_size_gb": 0.073}, "Vídeo": {"Íntegra": {"SAN_HV07.mp4": {"size_mb": 1873.4604, "modified": "2018-10-22 23:53:12", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV07_Pius Hornstein\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV07.mp4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4922918.0, "duration": 4922.92}, "SAN_HV007": {"SAN_HV07 (1).MP4": {"size_mb": 27.7665, "modified": "2016-07-29 18:31:42", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV07_Pius Hornstein\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV007\\SAN_HV07 (1).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2503.0, "duration": 2.5}, "SAN_HV07 (2).MP4": {"size_mb": 276.6843, "modified": "2016-07-29 18:34:00", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV07_Pius Hornstein\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV007\\SAN_HV07 (2).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 24024.0, "duration": 24.02}, "SAN_HV07 (3).MP4": {"size_mb": 3348.2437, "modified": "2016-07-29 18:34:56", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV07_Pius Hornstein\\Audiovisual\\Vídeo\\Íntegra\
