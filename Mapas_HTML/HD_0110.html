 Eu vi fazer aquela escola. Era o Galdino Lopes Chagas. Inclusive, antes que era Galdino Lopes Chaga, era de madeira, um barracão, depois que eles fizeram de tijolo e depois fizeram o João Solimeu. Inclusive, até estudei lá também. Estudei no Galdino até terceiro ou quarto ano, depois eu fui para o Solimeu, fiz a primeira e a segunda série. Não cheguei a completar a segunda, mas eu f"}, "ZN_HV002_Júlio Luciano Domingues_edi.docx": {"size_mb": 0.0163, "modified": "2019-08-02 09:43:50", "extension": "DOCX", "full_path": "D:\\Memória Zona Norte\\ZN_HV02\\Textual\\ZN_HV002_Júlio Luciano Domingues_edi.docx", "category": "Textual", "content_preview": "Julio Luciano Domingues\nSe soubesse, não mordia\nA Rosas de Ouro nasceu em frente ao Vile, depois que veio para a Freguesia do Ó. Então, ela saiu na Parapuã e eu fiquei encostado na grade da casa de um japonês, porque gostava de ver as brincadeiras do carnaval. De repente, o cachorro mordeu as minhas costas, furou a minha blusa e o japonês para mim: “Quem mandou você encostar aí?”  “O cachorro me mordeu.” Ele: “Quem mandou você encostar aí?” \nE eu gosto de cachorro, eles gostam tanto da gente. Eu pego coisas que sobram, ponho no saquinho, carrego na perua para tratar dos cachorrinhos na rua. Na minha casa, se tem um arroz, uma sobra, eu falo: “Não joga fora, deixa aí para a gente dar para os cachorrinhos, tem tantos passando fome.” Quando não tenho, se eu comprar uma coxinha, eu dou uma mordida e dou o resto.\nO cachorro me mordeu porque ele não sabia. Se soubesse quem eu sou, não mordia. \nVi a Rosas de Ouro nascer lá!\n Educador Fernando Bento Bellini e educandos                              Davi Felix e Rayssa Vitória – Centro de Juventudes Tijolinho"}, "folder_size_gb": 0.0}, "folder_size_gb": 108.835}, "ZN_HV03": {"Audiovisual": {"Áudio": {"ZN_HV03.mp3": {"size_mb": 58.9747, "modified": "2019-08-02 09:44:22", "extension": "MP3", "full_path": "D:\\Memória Zona Norte\\ZN_HV03\\Audiovisual\\Áudio\\ZN_HV03.mp3", "category o": {"ZN_HV003_DES001.jpg": {"size_mb": 0.0882, "modified": "2023-03-06 16:54:24", "extension": "JPG", "full_path": "D:\\Memória Zona Norte\\ZN_HV03\\Iconográfico\\Acervo\\ZN_HV003_DES001.jpg", "category": "Image", "dimension": "1040x585", "resolution": "1040x585", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_ZN_HV003_DES001.jpg"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.013}, "Textual": {"ZN_HV003_Roseane Maria Camara_edi.docx": {"size_mb": 0.0163, "modified": "2019-08-02 09:44:02", "extension": "DOCX", "full_path": "D:\\Memória Zona Norte\\ZN_HV03\\Textual\\ZN_HV003_Roseane Maria Camara_edi.docx", "category": "Textual", "content_preview": "Roseane Maria da Costa Camara\nChegando a São Paulo\nEsse foi o bairro que conheci, então é daqui que eu gosto. Eu sempre mostro a primeira casa em que moramos: “Foi nessa que eu morei.” Já está diferente, não está mais como era, mas ainda está lá. \nEra uma casa que tinha claridade, o sol entrava... Era o que nos esquentava, pois, quando chegamos, não tínhamos roupa de frio. A gente ficava procurando o sol para se esquentar. Não tinha agasalho e ia para a escola de sandália, porque no Nordeste é quente.\nEu vim com o sotaque de lá, falava “oxente”, “oxe”, quando a professora falava o nosso nome os meninos já riam. Quando falávamos presente, então... Todo mundo caía na risada. Eu ficava bastante envergonhada, mas não desisti de ir para escola... Desde que vim para cá até ir para a faculdade, porque eu tinha o sonho de ser professora.\nEducador Fernando Bento Bellini e educandos Davi Felix\ne  Rayssa Vitória - Centro de Juventudes Tijolinho"}, "ZN_HV003_Roseane Maria Camara_rev.docx": {"size_mb": 0.0443, "modified": "2020-03-05 11:17:58", "extension": "DOCX", "full_path": "D:\\Memória Zona Norte\\ZN_HV03\\Textual\\ZN_HV003_Roseane Maria Camara_rev.docx", "category": "Textual", "content_preview": "Depoimento de Roseane Maria Camara\nEntrevistado por Fernando Bellini e Rayssa Vitória\nSão Paulo, dia 09/08/2018\nEntrevista ZN-HV03\nRealização: Museu da Pessoa\nP/1 - Qual seu nome, o local onde você nasceu e o nome do bairro onde você mora?\nR - Me chamo Roseane Maria da Costa Camara. Nasci na Cidade do Cabo, Pernambuco. Morei cinco anos no Morro Grande e hoje moro na Vila Zat há mais de 17.\nP/1 - Você veio com quantos anos para São Paulo?\nR - 15 anos.\nP/1 - O que você mais gostava de fazer quando era criança?\nR - O que eu mais gostava de fazer era brincar com os meus irmãos. Porque como tinha três meninas e um menino, eu gostava muito de brincar. A gente aprontava muito naquele quintal em Pernambuco.\nP/1 - O que aprontavam?\nR - Não tem aqueles barris grandões? Os quintais lá são grandes. A gente entrava e o outro ficava empurrando até sair rolando dentro do barril.\nP/1 - O que seus pais faziam?\nR - Minha mãe era enfermeira e meu pai era açougueiro.\nP/2 - Que lembranças você tem da sua mãe?\nR - A lembrança que eu tenho é de ela sempre trabalhando muito e a gente ficando com outras pessoas. E a lembrança que eu tenho é que todo domingo ela levava a gente à praia. Do meu pai eu tenho p"}, "folder_size_gb": 0.0}, "folder_size_gb": 71.535}, "ZN_HV04": {"Audiovisual": {"Vídeo": {"Edições": {"ZN_HV004.mp4": {"size_mb": 165.4417, "modified": "2019-03-03 00:24:26", "extension": "MP4", "full_path": "D:\\Memória Zona Norte\\ZN_HV04\\Audiovisual\\Vídeo\\Edições\\ZN_HV004.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 141408.0, "duration": 141.41}, "folder_size_gb": 0.162}, "Íntegra": {"ZN_HV04.mp4": {"size_mb": 3359.3742, "modified": "2019-11-09 12:34:02", "extension": "MP4", "full_path": "D:\\Memória Zona Norte\\ZN_HV04\\Audiovisual\\Vídeo\\Íntegra\\ZN_HV04.mp4", "category": "Video", "dimension": "854x480", "aspect_ratio": "16:9 (HD)", "frame_rate": "59.940 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_code \ZN_HV04_DES003.jpg", "category": "Image", "dimension": "800x450", "resolution": "800x450", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_ZN_HV04_DES003.jpg"}, "ZN_HV04_DES004.jpg": {"size_mb": 0.2113, "modified": "2019-10-23 09:27:52", "extension": "JPG", "full_path": "D:\\Memória Zona Norte\\ZN_HV04\\Iconográfico\\Acervo\\Baixa\\ZN_HV04_DES004.jpg", "category": "Image", "dimension": "800x450", "resolution": "800x450", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_ZN_HV04_DES004.jpg"}, "ZN_HV04_DES001.jpg": {"size_mb": 0.2211, "modified": "2023-03-06 17:03:12", "extension": "JPG", "full_path": "D:\\Memória Zona Norte\\ZN_HV04\\Iconográfico\\Acervo\\Baixa\\ZN_HV04_DES001.jpg", "category": "Image", "dimension": "800x450", "resolution": "800x450", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_ZN_HV04_DES001.jpg"}, "folder_size_gb": 0.001}, "folder_size_gb": 0.001}, "Making Of": {"ZN_HV04_MO001.JPG": {"size_mb": 4.9979, "modified": "2018-09-04 12:48:26", "extension": "JPG", "full_path": "D:\\Memória Zona Norte\\ZN_HV04\\Iconográfico\\Making Of\\ZN_HV04_MO001.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_ZN_HV04_MO001.jpg"}, "ZN_HV04_MO002.JPG": {"size_mb": 5.2731, "modified": "2018-09-04 12:49:00", "extension": "JPG", "full_path": "D:\\Memória Zona Norte\\ZN_HV04\\Iconográfico\\Making Of\\ZN_HV04_MO002.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_ZN_HV04_MO002.jpg"}, "folder_size_gb": 0.01}, "folder_size_gb": 0.011}, "Textual": {"ZN_HV004_Ed carlos Silva Nascimento.docx": {"size_mb": 0.0435, "modified": "2019-08-02 09:44:24", "extension": "DOCX", "full_path": "D:\\Memória Zona Norte\\ZN_HV04\\Textual\\ZN_HV004_Ed carlos Silva Nascimento.docx", "category": "Textual", "content_preview": "Depoimento de Ed Carlos Silva Nascimento\nEntrevistado por Deise Soares e Maria Eulália Borges\nSão Paulo, 4 de setembro de 2018\nEntrevista ZN-HV04\nRealização: Museu da Pessoa\nP/1 - Qual o seu nome? \nR - Edcarlos Silva Nascimento.\nP/1 - Onde você nasceu?\nR - Zona Norte, São Paulo, Carandiru.\nP/1 - Qual é o nome dos seus pais?\nR - Berenice Moreira da Silva, José Carlos Luz Nascimento.\nP/1 - Você tem irmãos?\nR - Tenho uma, Sandra.\nP/1 - O que vocês gostavam de fazer juntos? \nR - Nós nos divertíamos muito na comunidade. Com o tempo, tivemos que nos separar, a comunidade andava muito pesada, aí vivi mais aqui com os amigos e ela voltou para a casa dos tios. Aí depois que ela completou 22 anos, ela voltou para a comunidade, ficou um pouco mais sossegada.\nP/2 - Mas ela se separou de você por causa da comunidade ou porque os teus pais não tinham condição de criar todo mundo?\nR - Isso mesmo. Uma parte disso, o meu pai nos largou pequenos, com cinco ou seis anos de idade, e na comunidade estava tendo muito roubo, vamos dizer, no português declarado, muito estupro, então, por a minha irmã ser bonita, ser cobiçada, ela teve que sair da comunidade. Aí com isso ela voltou para a casa dos parentes"}, "ZN_HV004_Ed carlos Silva Nascimento_ed.docx": {"size_mb": 0.0166, "modified": "2019-08-02 09:44:14", "extension": "DOCX", "full_path": "D:\\Memória Zona Norte\\ZN_HV04\\Textual\\ZN_HV004_Ed carlos Silva Nascimento_ed.docx", "category": "Textual", "content_preview": "Ed Carlos Silva Nascimento\nFoi na sorte\nO Carandiru ajudava pelos comércios que tinha. Era muita gente querendo, vamos dizer, alugar roupas. Minha mãe ficava na barraca e, quando visitava eles, ia como irmã. As mulheres iam também e eu, pequeno, ficava mais nas barracas, onde ficavam também os parentes. \nO massacre marcou muito a nossa região, foi uma coisa que ninguém esperava... Na hora em que jogaram as facas, nós vimos. Mas os caras já estavam entrando dando tiro, depois que os presos viram que estava morrendo muita gente, eles pediram paz, que não queriam mais briga, mas não adiantou, não. Os caras entraram e começaram a fuzilar, porque eu morava no morro, meu barraco era alto e com isso eu vi. Os cachorros que o policial soltava brigavam com preso, que caía da muralha. Policial mirando reto para o ladrão lá dentro. Tinha ladrão que estava até na janela com o pano branco, pedindo socorro, paz, e os caras puxavam ele para fora da janela e eu, depois, ouvia só o barulho do tiro. \nE meus tios me falaram que eles tiveram que se molhar mesmo de sangue. Os policiais entravam com os cachorros e com as espingardas com faca e quem tivesse vivo eles também matavam, vinham para acabar me"}, "folder_size_gb": 0.0}, "folder_size_gb": 66.476}, "ZN_HV05": {"Audiovisual": {"Áudio": {"ZN_HV05.mp3": {"size_mb": 122.6376, "modified": "2019-08-02 09:45:14", "extension": "MP3", "full_path": "D:\\Memória Zona Norte\\ZN_HV05\\Audiovisual\\Áudio\\ZN_HV05.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 8035584.0, "duration": 8035.58}, "folder_size_gb": 0.12}, "Vídeo": {"Edições": {"ZN_HV05.mp4": {"size_mb": 174.2203, "modified": "2019-03-03 01:03:16", "extension": "MP4", "full_path": "D:\\Memória Zona Norte\\ZN_HV05\\Audiovisual\\Vídeo\\Edições\\ZN_HV05.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 148849.0, "duration": 148.85}, "folder_size_gb": 0.17}, "Íntegra": {"ZN_HV05.mp4": {"size_mb": 5047.9654, "modified": "2018-09-07 21:18:12", "extension": "MP4", "full_path": "D:\\Memória Zona Norte\\ZN_HV05\\Audiovisual\\Vídeo\\Íntegra\\ZN_HV05.mp4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "59.940 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7957082.0, "duration": 7957.08}, "ZN_HV005": você nasceu?\nR - Eu nasci em Carapicuíba, São Paulo, em 1972.\nP/2 - Que dia é esse?\nR - Dia 12 de fevereiro. Era uma semana de carnaval. Foi quando houve o incêndio do Edifício Joelma e também, neste ano, o Emerson Fittipaldi ganhou o primeiro campeonato mundial de Fórmula 1 e a Apollo 17 foi lançada pela última vez até a Lua.\nP/1 - Muito bom. Você tem irmãos? \nR - Tenho, eu tenho quatro irmãos. Somos em três irmãs e dois irmãos.\nP/2 - Desses acontecimentos todos, ou do carnaval por exemplo, seus pais \nfalam alguma coisa assim, na hora que você ia nascer estava em pleno carnaval?\nR - Só falaram que era carnaval, que eles contaram para mim que eu nasci no dia de carnaval, só que eu nasci meia-noite e eu sentia muito frio, apesar de ser calor, e aí eu ouvi a minha infância inteira aquela música toda vez que as pessoas ouviam o meu nome, cantavam ‘‘Luciana..’‘.. Eu tinha uma raiva, porque acaba enjoando, não é?\nP/1 - Fora esses a"}, "ZN_HV05_Luciana Pessoas_ed.docx": {"size_mb": 0.0164, "modified": "2019-08-02 09:44:38", "extension": "DOCX", "full_path": "D:\\Memória Zona Norte\\ZN_HV05\\Textual\\ZN_HV05_Luciana Pessoas_ed.docx", "category": "Textual", "content_preview": "Luciana Aparecida Pessôas \nPassarinhos\nNessa época, fazia muito frio na Serra da Cantareira. Às 5h da manhã já tínhamos que estar em pé, acordar, fazer o café da manhã, tomar café, organizar o material e dar uma arrumada na casa para poder ir para a escola. Voltava, tinha um quadro de tarefas, porque nós éramos hiperativos, nunca tinha um momento sem ser organizado. E a minha mãe contava muitas histórias para a gente. Então, o que acontecia? Eu sempre fui uma pessoa muito criativa, gostava de ouvir e colocava as histórias de saudade dela em prática. Ela contou que, quando era pequena, em Duartina, matava passarinho para comer, porque tinha necessidade. Eu falei: “Era gostoso?” “Era.” No dia seguinte, eu matei um passarinho e fiz uma farofa, era um passarinho pequenininho para ela comer. \nEla ficou brava porque, primeiro, não concordava em matar passarinho, e a gente nessa época não passava por necessidades, mas não bateu nem nada. Ela falou: “Esse passarinho só tem pele e osso.” Não ia matar a fome de ninguém.\nEu lembro da minha infância, com 4 anos sozinha na feira... Começamos a fazer o projeto com crianças, porque, entre 4 e 6 anos, elas ficavam muito soltas aqui na comunidade."}, "folder_size_gb": 0.0}, "folder_size_gb": 146.222}, "ZN_HV06": {"Audiovisual": {"Áudio": {"ZN_HV06.mp3": {"size_mb": 126.4544, "modified": "2019-08-02 09:45:52", "extension": "MP3", "full_path": "D:\\Memória Zona Norte\\ZN_HV06\\Audiovisual\\Áudio\\ZN_HV06.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 8285832.0, "duration": 8285.83}, "folder_size_gb": 0.123}, "Vídeo": {"Edições": {"ZN_HV06.mp4": {"size_mb": 185.605, "modified": "2019-03-03 10:37:38", "extension": "MP4", "full_path": "D:\\Memória Zona Norte\\ZN_HV06\\Audiovisual\\Vídeo\\Edições\\ZN_HV06.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 157391.0, "duration": 157.39}, "folder_size_gb": 0.181}, "Íntegra": {"ZN_HV06.mp4": {"size_mb": 3123.1923, "modified": "2018-09-08 07:09:38", "extension": "MP4", "full_path": "D:\\Memória Zona Norte\\ZN_HV06\\Audiovisual\\Vídeo\\Íntegra\\ZN_HV06.mp4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "59.940 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 8203746.0, "duration": 8203.75}, "ZN_HV006": {"ZN_HV06 (1).MP4": {"size_mb": 1020.8191, "modified": "2016-06-12 19:16:56", "extension": "MP4", "full_path": "D:\\Memória Zona Norte\\ZN_HV06\\Audiovisual\\Vídeo\\Íntegra\\ZN_HV006\\ZN_HV06 (1).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "59.940 fps", "code "2018-09-05 17:07:42", "extension": "JPG", "full_path": "D:\\Memória Zona Norte\\ZN_HV06\\Iconográfico\\Making Of\\ZN_HV06_MO002.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_ZN_HV06_MO002.jpg"}, "folder_size_gb": 0.011}, "Acervo": {"ZN_HV006_DES001.jpg": {"size_mb": 0.1037, "modified": "2023-03-06 12:26:26", "extension": "JPG", "full_path": "D:\\Memória Zona Norte\\ZN_HV06\\Iconográfico\\Acervo\\ZN_HV006_DES001.jpg", "category": "Image", "dimension": "768x1280", "resolution": "768x1280", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_ZN_HV006_DES001.jpg"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.011}, "Textual": {"ZN_HV06_João Costa e Silva Neto.docx": {"size_mb": 0.0524, "modified": "2019-08-02 09:45:08", "extension": "DOCX", "full_path": "D:\\Memória Zona Norte\\ZN_HV06\\Textual\\ZN_HV06_João Costa e Silva Neto.docx", "category": "Textual", "content_preview": "Depoimento de João Costa e Silva Neto\nEntrevistado por Julieine Dell’Anhol e Marcia Trezza\nSão Paulo, 05 de setembro de 2018\nEntrevista ZN-HV06\nRealização: Museu da Pessoa\nP/1 - Fala seu nome completo.\nR - João Costa e Silva Neto.\nP/1 - Perfeito.\nR - Um sonhador.\nP/2 - Como é seu nome? Quando você nasceu? E onde você nasceu?\nR - Eu sou João Costa e Silva Neto, eu nasci no interior do estado do Piauí, aquele interiorzinho era chamado de São José de Nazária, hoje São José de Nazária passou a cidade, fica a 45 minutos da capital, Teresina, às margens do Rio Parnaíba, eu sou do dia 03 de Junho de 1951. Mamãe disse que era domingo, ela estava lavando roupa tinha um córrego perto de casa, por nome Roncador e ali ela sentiu que eu ia chegar só deu tempo de chegar em casa, eu sou o segundo filho, somo cinco ao todo.\nP/2 - Fala um pouquinho da sua infância, seu João.\nR - Olhe, eu tinha uma infância muito boa, nós vivíamos na roça, era uma época que não tinha violência e depois eu tive a felicidade de ter pais muito maravilhosos, que eu nunca percebi um indiferença entre eles, nunca vi eles brigarem, eles não tinham vício, eles não bebiam, não fumavam, eles eram católicos, mas não eram aquel"}, "ZN_HV06_João Costa e Silva Neto_ed.docx": {"size_mb": 0.0169, "modified": "2019-08-02 09:45:00", "extension": "DOCX", "full_path": "D:\\Memória Zona Norte\\ZN_HV06\\Textual\\ZN_HV06_João Costa e Silva Neto_ed.docx", "category": "Textual", "content_preview": "João Costa e Silva Neto\nUm sonhador\nEu nasci no interior do Estado do Piauí, às margens do Rio Parnaíba, mamãe disse que era domingo, estava lavando roupa num córrego perto de casa, por nome Roncador, e ali ela sentiu que eu estava vindo, só deu tempo dela chegar em casa.\nTinha um córrego, o Tietê também, não estava feita essa canalização, ele enchia... Aquelas casinhas enchiam todas de água. Aqui no barraco, nós tomamos muita enchente. Mês de fevereiro, época das cheias.\nQuando eu comprei, era só um vão. Aí, eu fiz a cozinha e a sala nessa altura, então, nossa ilha era ali. Enchia na parte dos quartos, nós mudávamos para a parte alta, depois tinha que lavar tudo. Mas ali eu plantei pé de rosa, tinha um jardim. Minha esposa sempre gostou de planta, tinha um pé de chuchu, que deu muito chuchu, um pé de abacate... Quando eu saí desse barraco, eles mandaram derrubar, tinha que derrubar, para ir lá para o Singapura. \nAí, em seguida, veio uma pessoa e já fez de novo, e o pior é que cortou o pezinho de abacate, que já dava abacate há uns três anos. Cortou o pé de rosa... O pessoal começou a fazer as casas. Hoje está tudo de bloco, bem-feito, mas era tudo de madeira. Teve um incêndio aqui"}, "folder_size_gb": 0.0}, "folder_size_gb": 148.173}, "ZN_HV07": {"Audiovisual": {"Áudio": {"ZN_HV07.mp3": {"size_mb": 117.6895, "modified": "2019-08-02 09:46:22", "extension": "MP3", "full_path": "D:\\Memória Zona Norte\\ZN_HV07\\Audiovisual\\Áudio\\ZN_HV07.mp3", "category": "Audio", "audio_cha 002.JPG": {"size_mb": 5.004, "modified": "2018-09-13 12:30:50", "extension": "JPG", "full_path": "D:\\Memória Zona Norte\\ZN_HV07\\Iconográfico\\Making Of\\ZN_HV07_MO002.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_ZN_HV07_MO002.jpg"}, "folder_size_gb": 0.009}, "Acervo": {"ZN_HV007_DES001.jpg": {"size_mb": 0.063, "modified": "2023-03-06 12:12:58", "extension": "JPG", "full_path": "D:\\Memória Zona Norte\\ZN_HV07\\Iconográfico\\Acervo\\ZN_HV007_DES001.jpg", "category": "Image", "dimension": "504x349", "resolution": "504x349", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_ZN_HV007_DES001.jpg"}, "ZN_HV007_DES002.jpg": {"size_mb": 0.2154, "modified": "2023-03-06 12:18:36", "extension": "JPG", "full_path": "D:\\Memória Zona Norte\\ZN_HV07\\Iconográfico\\Acervo\\ZN_HV007_DES002.jpg", "category": "Image", "dimension": "1047x719", "resolution": "1047x719", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_ZN_HV007_DES002.jpg"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.01}, "Textual": {"ZN_HV07_Jailde Dantas dos Santos Teixeira.docx": {"size_mb": 0.0633, "modified": "2019-10-23 09:40:32", "extension": "DOCX", "full_path": "D:\\Memória Zona Norte\\ZN_HV07\\Textual\\ZN_HV07_Jailde Dantas dos Santos Teixeira.docx", "category": "Textual", "content_preview": "Todo lugar tem uma história para contar: Memórias da Zona Norte\nJailde Dantas dos Santos Teixeira\nEntrevistada por Diego Silva dos Santos e Fernanda Augusta de Morais Melo\nSão Paulo, 13 de setembro de 2018\nEntrevista ZN-HV07\nRealização: Museu da Pessoa\nP/1 - Qual é o seu nome?\nR - Meu nome é Jailde Dantas dos Santos Teixeira.\nP/2 - Você nasceu onde e o dia do seu nascimento?\nR - Eu nasci em 27/04/1964. Nasci aqui em São Paulo, capital, Zona Norte. \nP/2 - Eu sei que aqui só quando a galera quer brincar que te chama de Jailde, que todo mundo te conhece como Jady. De onde que surgiu esse apelido?\nR - Meu primeiro namorado falava que o meu nome era horrível, então, ele falou assim: “pode ser Jady?”. Eu falei: “é melhor, eu também gosto”. Eu não gosto do meu nome porque eu não sei a origem, meus pais não souberam nunca me explicar sobre a origem do meu nome. E aí ficou Jady. E aí veio o meu segundo namorado, que é o meu marido, falou assim: “Jady, se eu tivesse dinheiro, eu pagaria para mudar o seu nome, porque Jady é muito lindo, esse Jailde não combina com você”. E hoje, muitas vezes, quando alguém me chama pelo nome eu não atendo, é o meu nome oficial. Eu não atendo porque eu não gos"}, "ZN_HV07_Jailde Dantas dos Santos Teixeixa_ed.docx": {"size_mb": 0.0133, "modified": "2020-01-13 10:12:58", "extension": "DOCX", "full_path": "D:\\Memória Zona Norte\\ZN_HV07\\Textual\\ZN_HV07_Jailde Dantas dos Santos Teixeixa_ed.docx", "category": "Textual", "content_preview": "Todo lugar tem uma história para contar: Memórias da Zona Norte\nJailde Dantas dos Santos Teixeira\nEntrevistada por Diego Silva dos Santos e Fernanda Augusta de Morais Melo\nSão Paulo, 13 de setembro de 2018\nEntrevista ZN-HV07\nRealização: Museu da Pessoa\nA gente se falou um bom tempo por telefone até se encontrar. Eu conversava com ele, mas só o tinha visto uma vez ou duas. Falei: “Diz que roupa você vai estar, para facilitar.” Ele: “Vou com uma calça cinza com listra branca e uma camisa amarela com listra preta.” Eu pensei: “Nossa senhora, que horror.”. Lembro que falei isso para a minha irmã mais velha e ela: “Nossa, Jady, você vai encontrar com uma pessoa que se veste desse jeito? Que horror.” Foi muito engraçado, porque ele estava tão lindo. E os sapatos marrons. Tenho fotos, era linda a roupa dele, se usasse hoje não estaria feio também, aquela camisa com uma calça jeans. Ele perguntou onde a gente poderia ir, eu falei: “Tem o Center Norte, que tem parque, é bem legal.” Marcamos o encontro. Eu o achei muito fofo, gostei muito dele. Na roda-gigante, estava começando a chover, foi lindo ele tirar a blusa para me proteger e depois me deu um beijo. Eu acho que nem foi um beijo de ve"}, "folder_size_gb": 0.0}, "folder_size_gb": 93.026}, "ZN_HV08": {"Audiovisual": {"Áudio": {"ZN_HV08.mp3": {"size_mb": 94.6293, "modified": "2019-08-02 09:46:48", "extension": "MP3", "full_path": "D:\\Memória Zona Norte\\ZN_HV08\\Audiovisual\\Áudio\\ZN_HV08.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 6200256.0, "duration": 6200.26}, "folder_size_gb": 0.092}, "Vídeo": {"Edições": {"ZN_HV08.mp4": {"size_mb": 164.2982, "modified": "2019-03-03 11:30:16", "extension": "MP4", "full_path": "D:\\Memória Zona Norte\\ZN_HV08\\Audiovisual\\Vídeo\\Edições\\ZN_HV08.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 140340.0, "duration": 140.34}, "folder_size_gb": 0.16}, "Íntegra": {"ZN_HV08.mp4": {"size_mb": 5090.6876, "modified": "2019-11-11 23:31:38", "extension": "MP4", "full_path": "D:\\Memória Zona Norte\\ZN_HV08\\Audiovisual\\Vídeo\\Íntegra\\ZN_HV08.mp4", "category": "Video", "dimension": "854x480", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6158319.0, "duration": 6158.32}, "ZN_HV08": {"ZN_HV08 (1).MP4": {"size_mb": 907.7802, "modified": "2016-06-20 18:08:10", "extension": "MP4", "full_path": "D:\\Memória Zona Norte\\ZN_HV08\\Audiovisual\\Vídeo\\Íntegra\\ZN_HV08\\ZN_HV08 (1).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 78579.0, "duration": 78.58}, "ZN_HV08 (2).MP4": {"size_mb": 1353.9313, "modified": "2016-06-20 18:09:48", "extension": "MP4", "full_path": "D:\\Memória Zona Norte\\ZN_HV08\\Audiovisual\\Vídeo , "folder_size_gb": 0.0}, "folder_size_gb": 0.009}, "Textual": {"ZN_HV08_Leocardio Jose Teixeira dos Santos_rev.docx": {"size_mb": 0.0481, "modified": "2019-08-02 09:45:44", "extension": "DOCX", "full_path": "D:\\Memória Zona Norte\\ZN_HV08\\Textual\\ZN_HV08_Leocardio Jose Teixeira dos Santos_rev.docx", "category": "Textual", "content_preview": "Depoimento de Leocárdio José Teixeira Santos\nEntrevistado por  Diego Silva dos Santos e Fernanda Augusta de Morais Mello\nSão Paulo, 13 de setembro de 2018\nEntrevista ZN-HV08\nRealização: Museu da Pessoa\nP/1 - Boa tarde. Eu quero saber o seu nome, o lugar que você nasceu e a data. \nR - Meu nome é Leocárdio José Teixeira Santos, nasci em Formosa e registrado em Chorrochó, porque onde eu morava não tinha cartório. \nP/1 - Quando?\nR - 09/12 de 1943.\nP/1 - Bom, o seu nome não é um nome muito comum que a gente vê muito por aí, de onde surgiu o seu nome? Você sabe se tem alguma história por trás?\nR - Não, existiu um livro que chamava Almanaque, não sei se você conhece e as pessoas escolhiam o nome por aquele que estava escrito naquele livro, então, por acaso foi escolhido dessa forma. \nP/1 - E os seus pais? \nR - Meu pai chamava Militão e minha mãe chamava Eva. E minha mãe é do Piauí e minha mãe é da Bahia. \nP/1 - E o que seus pais faziam?\nR - Trabalhava na roça.\nP/1 - Na roça. \nR - Trabalho de roça, plantar, colher. \nP/1 - E você ajudava eles?\nR - Ajudava sim.\nP/1 - O que você fazia lá?\nR - Meu pai ia cavando aquelas covas, eu saía atrás jogando a semente e cobrindo com terra, aquele trabal"}, "ZN_HV08_Leocardio Jose Teixeira dos Santos_edi.docx": {"size_mb": 0.0164, "modified": "2019-08-02 09:45:40", "extension": "DOCX", "full_path": "D:\\Memória Zona Norte\\ZN_HV08\\Textual\\ZN_HV08_Leocardio Jose Teixeira dos Santos_edi.docx", "category": "Textual", "content_preview": "Leocárdio José Teixeira dos Santos\nQuatro paredes\nEu morava na Vila Maria e comprei esse terreninho aqui, era uma chácara, foi loteada, não tinha luz, não tinha água, não tinha, sabe o que é nada? Era um relógio que distribuía água para todo mundo e é por necessidade de tudo isso que hoje eu faço esse trabalho de correr atrás de água, correr atrás de luz, correr atrás de asfalto, de esgoto, disso, daquilo. \nE, quando eu estava construindo, eu vinha sexta-feira de tarde, dormia, trabalhava sábado e domingo. De tarde ia embora a pé daqui para a Vila Maria, 11 quilômetros, porque não tinha lugar para tomar banho e eu não ia pegar o ônibus assim. \nA empresa em que eu trabalhava me dava a condução em dinheiro. Eu chegava aqui comprava saco de cal, pacote de prego, coisa parecida, gastando tudo, mas não podia dizer que não ia trabalhar, porque não tinha dinheiro. Aí o que eu fazia? Batia o pé da Vila Maria ao aeroporto de Cumbica a pé, três e meia da manhã eu estava na Dutra, e só Jesus, para ir trabalhar. Quando os outros chegavam às 7 horas, eu já estava lá. Trabalhei 15 anos na empresa, pedi para ser mandado embora, fiquei desempregado para construir. E andei essa trajetória todinha a"}, "folder_size_gb": 0.0}, "folder_size_gb": 75.224}, "ZN_HV09": {"Audiovisual": {"Áudio": {"ZN_HV09.mp3": {"size_mb": 82.1391, "modified": "2019-08-02 09:46:52", "extension": "MP3", "full_path": "D:\\Memória Zona Norte\\ZN_HV09\\Audiovisual\\Áudio\\ZN_HV09.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 5382144.0, "duration": 5382.14}, "folder_size_gb": 0.08}, "Vídeo": {"Edições": {"ZN_HV09.mp4": {"size_mb": 115.9918, "modified": "2019-03-03 11:50:24", "extension": "MP4", "full_path": "D:\\Memória Zona Norte\\ZN_HV09\\Audiovisual\\Vídeo\\Edições\\ZN_HV09.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 94895.0, "duration": 94.89}, "folder_size_gb": 0.113}, "Íntegra": {"ZN_HV09.mp4": {"size_mb": 2287.2292, "modified": "2018-10-05 02:26: _path": "D:\\Memória Zona Norte\\ZN_HV09\\Textual\\ZN_HV009_Renata Ribeiro de Camargo_rev.docx", "category": "Textual", "content_preview": "P/1 - Renata, a gente agora vai começar a entrevista. Fala o seu nome completo, o lugar que você nasceu e a data.\nR - O meu nome é Renata Ribeiro de Camargo, nasci em 29 de abril de 1983, signo de Touro, teimosa, e nasci aqui em São Paulo mesmo.\nP/1 - Na cidade de São Paulo?\nR - Na cidade de São Paulo.\nP/1 - Renata, fala o nome dos seu pais.\nR - Meus pais se chamam Gerson Ribeiro de Camargo e a minha mãe Aparecida Conceição Leme de Camargo.\nP/1 - E que lembrança você tem deles de quando você era criança?\nR - Dos meus pais? Bom, o meu pai gostava muito de ler, o meu pai é um advogado, então, ele tem o costume de fazer muitas leituras por conta da profissão e ele estimulava os filhos, de tempos em tempos ele trazia coleções de livros, eu lembro de um livro que, conforme você mexia nele, criava as imagens. Então, eram muito legal, por mais que a gente não sabia ainda o letramento, ler, mas ele contava através das imagens. É uma parte muito legal.\nP/1 - Bacana. E da sua mãe?\nR - Da minha mãe?\nP/1 - Uma lembrança marcante.\nR - Lembrança marcante da mãe.\nP/1 - Ou como ela era; como você descreve...\nR - Como ela é... \nP/1 - É, eu pensei em infância.\nR - A minha mãe é uma pessoa muito aten"}, "ZN_HV009_Renata Ribeiro de Camargo_edi.docx": {"size_mb": 0.0166, "modified": "2019-08-02 09:46:08", "extension": "DOCX", "full_path": "D:\\Memória Zona Norte\\ZN_HV09\\Textual\\ZN_HV009_Renata Ribeiro de Camargo_edi.docx", "category": "Textual", "content_preview": "Renata Ribeiro de Camargo\nEu quero voar\nEu e a Sueli, na época, entramos novas, a gente sabia a teoria e não sabia a prática. Um menino entrou na janela, ficou assim encaixado e falou: “Eu sou o Super-Homem, eu quero voar.” Minha colega começou pegando ele, segurando, aí ela começou a gritar. As crianças foram na minha sala me chamar: “Renata, Renata, o Cleiton está dando problema.” Eu fui na sala ao lado: “O que foi?” Ela: “Ele quer voar.” Eu falei: “Não, Cleiton, vem comigo, vem que eu vou voar com você.” Tirei ele de lá. “Vou te dar uma capa para voar.” Eu tinha um pedaço de TNT no armário, coloquei a capa e disse: “Mas essa capa só pode voar no chão”, coloquei a capa junto com ele e ficamos andando de um lado para o outro na sala, os outros alunos olhando: “Professora, não estamos entendendo nada.” Eu falei: “Vamos fazer um desenho do super-herói, vamos lá.” Entreguei a folha, todo mundo fez os desenhos, ele também fez o dele. Eu colei na parede os desenhos do Super-Homem e depois conversamos: “Nós somos Super-Homem, mas a gente tem que estar no chão.” “Está bom.”  \nEducadora Renata Ribeiro de Camargo e educandos Gabriel Guerra dos Santos e                                    He"}, "folder_size_gb": 0.0}, "folder_size_gb": 59.341}, "ZN_HV01": {"Audiovisual": {"Áudio": {"ZN_HV01.mp3": {"size_mb": 85.5056, "modified": "2019-08-02 09:43:56", "extension": "MP3", "full_path": "D:\\Memória Zona Norte\\ZN_HV01\\Audiovisual\\Áudio\\ZN_HV01.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 5602656.0, "duration": 5602.66}, "folder_size_gb": 0.084}, "Vídeo": {"Edições": {"ZN_HV001.mp4": {"size_mb": 264.5147, "modified": "2019-03-03 12:38:02", "extension": "MP4", "full_path": "D:\\Memória Zona Norte\\ZN_HV01\\Audiovisual\\Vídeo\\Edições\\ZN_HV001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 122656.0, "duration": 122.66}, "folder_size_gb": 0.258}, "Íntegra": {"ZN_HV001.mp4": {"size_mb": 2496.5619, "modified": "2019-11-08 18:55:52", "extension": "MP4", "full_path": "D:\\Memória Zona Norte\\ZN_HV01\\Audiovisual\\Vídeo\\Íntegra\\ZN_HV001.mp4", "category": "Video", "dimension": "854x480", "aspect_ratio": "16:9 (HD)", "frame_rate": "59.940 fps", "codec /thumb_ZN_HV001_DES003.jpg"}, "ZN_HV001_DES004.jpg": {"size_mb": 0.0218, "modified": "2023-03-06 11:52:30", "extension": "JPG", "full_path": "D:\\Memória Zona Norte\\ZN_HV01\\Iconográfico\\Acervo\\Baixa\\ZN_HV001_DES004.jpg", "category": "Image", "dimension": "300x225", "resolution": "300x225", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_ZN_HV001_DES004.jpg"}, "ZN_HV001_DES005.jpg": {"size_mb": 0.1079, "modified": "2023-03-06 11:53:44", "extension": "JPG", "full_path": "D:\\Memória Zona Norte\\ZN_HV01\\Iconográfico\\Acervo\\Baixa\\ZN_HV001_DES005.jpg", "category": "Image", "dimension": "710x947", "resolution": "710x947", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_ZN_HV001_DES005.jpg"}, "ZN_HV001_DES006.jpg": {"size_mb": 0.1586, "modified": "2023-03-06 11:55:38", "extension": "JPG", "full_path": "D:\\Memória Zona Norte\\ZN_HV01\\Iconográfico\\Acervo\\Baixa\\ZN_HV001_DES006.jpg", "category": "Image", "dimension": "1262x946", "resolution": "1262x946", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_ZN_HV001_DES006.jpg"}, "ZN_HV001_DES007.jpg": {"size_mb": 0.1219, "modified": "2023-03-06 12:08:08", "extension": "JPG", "full_path": "D:\\Memória Zona Norte\\ZN_HV01\\Iconográfico\\Acervo\\Baixa\\ZN_HV001_DES007.jpg", "category": "Image", "dimension": "710x947", "resolution": "710x947", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_ZN_HV001_DES007.jpg"}, "folder_size_gb": 0.001}, "folder_size_gb": 0.001}, "Making Of": {"ZN_HV01_MO001.JPG": {"size_mb": 4.934, "modified": "2018-08-07 15:40:38", "extension": "JPG", "full_path": "D:\\Memória Zona Norte\\ZN_HV01\\Iconográfico\\Making Of\\ZN_HV01_MO001.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_ZN_HV01_MO001.jpg"}, "ZN_HV01_MO002.JPG": {"size_mb": 4.2345, "modified": "2018-08-07 15:40:32", "extension": "JPG", "full_path": "D:\\Memória Zona Norte\\ZN_HV01\\Iconográfico\\Making Of\\ZN_HV01_MO002.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_ZN_HV01_MO002.jpg"}, "folder_size_gb": 0.009}, "folder_size_gb": 0.01}, "Textual": {"ZN_HV01_Elias Alvez da Rocha.docx": {"size_mb": 0.033, "modified": "2019-08-02 09:43:38", "extension": "DOCX", "full_path": "D:\\Memória Zona Norte\\ZN_HV01\\Textual\\ZN_HV01_Elias Alvez da Rocha.docx", "category": "Textual", "content_preview": "Depoimento de Elias Alves da Rocha\nEntrevistado por Helen Lima dos Santos e Gabriel Guerra dos Santos\nSão Paulo, 7 de agosto de 2018\nEntrevista ZN-HV01\nRealização: Museu da Pessoa\nP/2 - Boa tarde. \nR - Boa tarde. \nP/2 - Qual o seu nome e data de nascimento?\nR - Elias Alves da Rocha. 20 de janeiro de 1935. \nP/2 - Quais são os nomes dos seus pais?\nR - Firmino Alves da Rocha.\nP/2 - E mãe?\nR - Gioventina Ferreira do Carmo.\nP/2 - Tem irmãos?\nR - Tenho 21 irmãos.\nP/2 - O que você e seus irmãos costumavam fazer quando eram crianças?\nR - No Nordeste é diferente daqui de São Paulo. Lá as pessoas nascem e vão crescendo na roça. Vai crescendo e vai indo para a roça que na nossa época era coisa muito difícil. Quer dizer, eu vim a ser alfabetizado aqui em São Paulo depois de 25 ou 30 anos. \nP/2 - E quando o senhor e a sua família vieram para São Paulo?\nR - Primeiro vieram o meu irmão Lídio, o meu irmão Nestor e o meu irmão Zuca. Foram para o interior de Marília, ficaram lá vários anos e depois voltaram lá para Pernambuco.\nP/1 - Como foi a sua adolescência?\nR - A minha adolescência foi boa, viu. Porque depois de 5 anos a gente começou a ir para a roça acompanhar os mais velhos e conforme a gente"}, "ZN_HV01_Elias Alvez da Rocha_ed.docx": {"size_mb": 0.017, "modified": "2019-08-02 09:43:36", "extension": "DOCX", "full_path": "D:\\Memória Zona Norte\\ZN_HV01\\Textual\\ZN_HV01_Elias Alvez da Rocha_ed.docx", "category": "Textual", "content_preview": "Elias Alves da Rocha\nNa roça é diferente\nDesde que me entendo por gente, eu trabalho. A mãe levantava a gente de manhã e cada um tinha uma função. Dois iam tirar o leite das vacas, outro ia cuidar dos porcos, outro ia cuidar das ovelhas, outro ia dar comida para as galinhas. Quando terminava ali, “então agora é hora de ir pra roça”. Ia de manhã e só voltava à noite. Tomava um bom café de manhã, minha mãe fazia um cuscuz grande de milho, fervia o leite e fazia o café. Só íamos quando todo mundo estava alimentado. Levávamos água e, às 11h30, uma pessoa levava o almoço, era uma bacia de alumínio grande. Na época, só existia arroz para quem estava doente. Fomos criados com feijão, fava e farinha de mandioca. Tinha outro detalhe: quando a mulher ia ganhar neném, tinha sempre de 30 a 40 capões e ela ficava 40 dias só cuidando do pequeno e comendo pirão de capão. E, uma vez, uma vaca engoliu um negócio e ficou engasgada. Era uma das melhores vacas de leite que a gente tinha. Todo mundo do bairro ficou sabendo e veio encostando, tinha mais de 100 pessoas e não conseguimos desentalar, a vaquinha morreu. Na época do verão, íamos para o rio tomar banho, para os açudes. A gente se divertia nos"}, "folder_size_gb": 0.0}, "folder_size_gb": 50.876}, "folder_size_gb": 819.708}, "Santa Cruz do Rio Pardo": {"SCRP_HV001_Anésio Biancon": {"Audiovisual": {"Áudio": {"SCRP_HV001.mp3": {"size_mb": 102.4211, "modified": "2019-10-23 14:09:16", "extension": "MP3", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV001_Anésio Biancon\\Audiovisual\\Áudio\\SCRP_HV001.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 3352838.0, "duration": 3352.84}, "folder_size_gb": 0.1}, "Vídeo": {"Edições": {"SCRP_HV001.mp4": {"size_mb": 62.9391, "modified": "2019-10-23 09:47:18", "extension": "MP4", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV001_Anésio Biancon\\Audiovisual\\Vídeo\\Ediçõ "duration": 1585.12}, "00003.MTS": {"size_mb": 946.3242, "modified": "2018-10-15 09:48:34", "extension": "MTS", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV001_Anésio Biancon\\Audiovisual\\Vídeo\\Íntegra\\SCRP_HV001\\00003.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 366262.047873, "duration": 366.26}, "00004.MTS": {"size_mb": 1777.7402, "modified": "2018-10-15 10:01:00", "extension": "MTS", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV001_Anésio Biancon\\Audiovisual\\Vídeo\\Íntegra\\SCRP_HV001\\00004.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 693130.869847, "duration": 693.13}, "00005.MTS": {"size_mb": 338.6484, "modified": "2018-10-15 10:03:32", "extension": "MTS", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV001_Anésio Biancon\\Audiovisual\\Vídeo\\Íntegra\\SCRP_HV001\\00005.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 133586.216946, "duration": 133.59}, "00006.MTS": {"size_mb": 1732.043, "modified": "2018-10-15 10:15:08", "extension": "MTS", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV001_Anésio Biancon\\Audiovisual\\Vídeo\\Íntegra\\SCRP_HV001\\00006.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 673588.475632, "duration": 673.59}, "folder_size_gb": 8.827}, "folder_size_gb": 12.86}, "folder_size_gb": 12.921}, "folder_size_gb": 13.021}, "Textual": {"SCRP_HV001_Anésio Biancon.docx": {"size_mb": 0.041, "modified": "2019-10-23 09:44:08", "extension": "DOCX", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV001_Anésio Biancon\\Textual\\SCRP_HV001_Anésio Biancon.docx", "category": "Textual", "content_preview": "Quinze de outubro de 2018\nDepoente Anésio Biancom SCRP_HV001\nEntrevistadora Lia Cristina Lotito Paraventi, Noêmia de Fátima Ribeiro e Lesliane de Souza\nProjeto todo lugar tem uma história para contar\nSanta Cruz do Rio Pardo, HV 001\nP/1 - Senhor Anésio, o senhor sabe quem deu seu nome? De onde surgiu o nome Anésio?\nR - Não lembro, mas deve ser meus pais, sei lá, não sei.\nP/1 - Não conhece?\nR - É.   \nP/1 - Então conta para a gente um pouquinho. Pode falar sobre o seu pai, sua mãe, sua família. \nR - Certo. Meu trabalhava no sítio com carroça puxando uma coisa, puxando outra, a minha mãe também ajudava ele trabalhando no cafezal, apanhava café, carpia café. Depois meu pai começou a mexer com gado, tirar leite e nós ajudávamos ele, amarrava perna de vaca, amarrar bezerro, ajudar na roça mesmo também, nós fazíamos de tudo, filha. Nós sofremos que nem sovaco de aleijado mesmo viu, sofremos mesmo, barbaridade. Aí foi indo e eu comecei a aprender a mexer com trator, aí eu aprendi a mexer com trator e vai daqui, ara para lá, ara para cá acabei aprendendo, mexendo com trator de esteira. Trabalhei tempo derrubando árvore, tomando mordida de abelha. Fazia de tudo, filha, sofria mesmo, fazia cad"}, "SCRP_HV001_Anésio Biancon_ed.docx": {"size_mb": 0.0148, "modified": "2020-02-14 11:53:30", "extension": "DOCX", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV001_Anésio Biancon\\Textual\\SCRP_HV001_Anésio Biancon_ed.docx", "category": "Textual", "content_preview": "Título: A jornada do seu Anésio\n\nSinopse: Seu Anesio, um santacruzense de 79 anos tinha um sonho de ser motorista e dirigiu não só automóveis, mas uma vida inteira de boas histórias e acontecimentos.\nEdição: Anesio Biancon, senhor de 79 anos, baixinho, invocado, inteligente e curioso, tem uma história de vida parecida com muitos de sua idade. Nasceu na Fazenda União em Santa Cruz do Rio Pardo-SP.   Sua infância foi difícil, morava na fazenda onde ajudava os pais tirando leite e na lavoura de café. Teve três irmãos, dois homens e uma mulher, só a caçula está viva. Brincava com os irmãos nadando no ribeirão, jogando bola e caçando com estilingue. Estudou até o terceiro ano da “escola do sítio”, andava uns dois quilômetros para chegar, não gostava de estudar e não se considerava inteligente. Na juventude teve algumas namoradas, umas foi ele quem largou, outras largaram dele. Gostava muito de bailes, não dançava muito bem, sempre iam á bailes, os irmãos, os primos e ele que era o mais novo, quando chovia, eles moravam em uma fazenda e os bailes aconteciam em outra, tiravam a roupa colocavam em um saquinho, atravessavam o cafezal pelados só com o “botinão”, quando chegavam perto do bail"}, "folder_size_gb": 0.0}, "folder_size_gb": 13.021}, "SCRP_HV002_Toninha Pegorer": {"Audiovisual": {"Áudio": {"SCRP_HV002.mp3": {"size_mb": 99.0599, "modified": "2019-10-23 14:10:08", "extension": "MP3", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV002_Toninha Pegorer\\Audiovisual\\Áudio\\SCRP_HV002.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 3243844.0, "duration": 3243.84}, "folder_size_gb": 0.097}, "Vídeo": {"Edições": {"SCRP_HV002.mp4": {"size_mb": 57.0413, "modified": "2019-10-23 09:51:44", "extension": "MP4", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV002_Toninha Pegorer\\Audiovisual\\Vídeo\\Edições\\SCRP_HV002.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 156457.0, "duration": 156.46}, "folder_size_gb": 0.056}, "Íntegra": {"SCRP_HV002.mp4": {"size_mb": 4262.1333, "modified": "2018-11-02 05:23:04", "extension": "MP4", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV002_Toninha Pegorer\\Audiovisual\\Vídeo\\Íntegra\\SCRP_HV002.mp4", " , "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_SCRP_HV002_FT002.jpg"}, "SCRP_HV002_FT001.jpg": {"size_mb": 0.2816, "modified": "2019-10-15 13:25:14", "extension": "JPG", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV002_Toninha Pegorer\\Iconográfico\\Acervo\\Baixa\\SCRP_HV002_FT001.jpg", "category": "Image", "dimension": "800x600", "resolution": "800x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_SCRP_HV002_FT001.jpg"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "Textual": {"SCRP_HV002_Toninha Pegorer.docx": {"size_mb": 0.0406, "modified": "2019-10-15 14:08:28", "extension": "DOCX", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV002_Toninha Pegorer\\Textual\\SCRP_HV002_Toninha Pegorer.docx", "category": "Textual", "content_preview": "Quinze de outubro de 2018\nDepoente Anésio Biancom\nEntrevistadora Lia Cristina Lotito Paraventi, Noêmia de Fátima Ribeiro e Lesliane de Souza\nProjeto todo lugar tem uma história para contar\nSanta Cruz do Rio Pardo, HV 001\nP/1 - Senhor Anésio, o senhor sabe quem deu seu nome? De onde surgiu o nome Anésio?\nR - Não lembro, mas deve ser meus pais, sei lá, não sei.\nP/1 - Não conhece?\nR - É.   \nP/1 - Então conta para a gente um pouquinho. Pode falar sobre o seu pai, sua mãe, sua família. \nR - Certo. Meu trabalhava no sítio com carroça puxando uma coisa, puxando outra, a minha mãe também ajudava ele trabalhando no cafezal, apanhava café, carpia café. Depois meu pai começou a mexer com gado, tirar leite e nós ajudávamos ele, amarrava perna de vaca, amarrar bezerro, ajudar na roça mesmo também, nós fazíamos de tudo, filha. Nós sofremos que nem sovaco de aleijado mesmo viu, sofremos mesmo, barbaridade. Aí foi indo e eu comecei a aprender a mexer com trator, aí eu aprendi a mexer com trator e vai daqui, ara para lá, ara para cá acabei aprendendo, mexendo com trator de esteira. Trabalhei tempo derrubando árvore, tomando mordida de abelha. Fazia de tudo, filha, sofria mesmo, fazia cada pirambeir"}, "SCRP_HV002_Toninha Pegorer_edi.docx": {"size_mb": 0.0148, "modified": "2020-02-14 11:55:02", "extension": "DOCX", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV002_Toninha Pegorer\\Textual\\SCRP_HV002_Toninha Pegorer_edi.docx", "category": "Textual", "content_preview": "Toninha Pegorer, mulher bonita, elegante e vitoriosa.\n\nSinopse: Infância rompida, responsabilidade precoce, perdas e aprendizagens, na história de Toninha Pegorer, mulher bonita, vaidosa e elegante.\n\nAntonia Pegorer da Silva,74 anos, nascida na fazenda Água das Pedras em Santa Cruz do Rio Pardo-SP, filha mais velha de onze irmãos. Sua infância foi sofrida, pois teve que trabalhar muito cedo, nunca teve uma boneca, brincavam com os irmãos com bonecas feitas com sabugo de milho e buchinha que colocavam perninhas como se fosse” boizinhos”. Lembra que no natal os pais não tinham dinheiro para comprar presentes, o pai pegava os sapatinhos velhos e os deixavam brilhando, como presente. Quando tinha seis anos mudou-se com a família para o Paraná, lá seu pai trabalhava como sapateiro, começou a ficar muito doente, uma depressão profunda, passou a trabalhar em casa, ela juntamente com o irmão um pouco mais novo, ajudava a levar o material que o pai precisava para trabalhar, com um carrinho. Não completou o quarto ano primário, já trabalhava como doméstica e tinha que deixar a cozinha em ordem antes de ir para a escola, com isso sempre chegava atrasada e levava bronca da professora, se senti"}, "folder_size_gb": 0.0}, "folder_size_gb": 12.818}, "SCRP_HV003_Benedita Silva Santos": {"Audiovisual": {"Áudio": {"SCRP_HV003.mp3": {"size_mb": 144.236, "modified": "2019-10-23 14:11:18", "extension": "MP3", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV003_Benedita Silva Santos\\Audiovisual\\Áudio\\SCRP_HV003.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 4722238.0, "duration": 4722.24}, "folder_size_gb": 0.141}, "Vídeo" \\Vídeo\\Íntegra\\SCRP_HV003\\00002.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 1582666.859606, "duration": 1582.67}, "00003.MTS": {"size_mb": 944.0566, "modified": "2018-10-16 10:18:04", "extension": "MTS", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV003_Benedita Silva Santos\\Audiovisual\\Vídeo\\Íntegra\\SCRP_HV003\\00003.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 366209.950738, "duration": 366.21}, "00004.MTS": {"size_mb": 3071.7832, "modified": "2018-10-16 10:38:24", "extension": "MTS", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV003_Benedita Silva Santos\\Audiovisual\\Vídeo\\Íntegra\\SCRP_HV003\\00004.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 1193117.000415, "duration": 1193.12}, "folder_size_gb": 12.009}, "folder_size_gb": 16.628}, "folder_size_gb": 16.698}, "folder_size_gb": 16.839}, "Iconográfico": {"Acervo": {"Baixa": {"SCRP_HV003_FT001.jpg": {"size_mb": 0.2174, "modified": "2019-10-23 11:18:32", "extension": "JPG", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV003_Benedita Silva Santos\\Iconográfico\\Acervo\\Baixa\\SCRP_HV003_FT001.jpg", "category": "Image", "dimension": "450x600", "resolution": "450x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_SCRP_HV003_FT001.jpg"}, "SCRP_HV003_FT002.jpg": {"size_mb": 0.2943, "modified": "2019-10-23 11:18:38", "extension": "JPG", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV003_Benedita Silva Santos\\Iconográfico\\Acervo\\Baixa\\SCRP_HV003_FT002.jpg", "category": "Image", "dimension": "800x534", "resolution": "800x534", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_SCRP_HV003_FT002.jpg"}, "SCRP_HV003_FT003.jpg": {"size_mb": 0.2192, "modified": "2019-10-23 11:18:44", "extension": "JPG", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV003_Benedita Silva Santos\\Iconográfico\\Acervo\\Baixa\\SCRP_HV003_FT003.jpg", "category": "Image", "dimension": "800x450", "resolution": "800x450", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_SCRP_HV003_FT003.jpg"}, "folder_size_gb": 0.001}, "folder_size_gb": 0.001}, "folder_size_gb": 0.001}, "Textual": {"SCRP_HV003_Dona Benedita Silva dos Santos.docx": {"size_mb": 0.0455, "modified": "2019-10-23 11:02:16", "extension": "DOCX", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV003_Benedita Silva Santos\\Textual\\SCRP_HV003_Dona Benedita Silva dos Santos.docx", "category": "Textual", "content_preview": "Santa Cruz do Rio Pardo\nProjeto Todo lugar tem uma história para contar\n16 de outubro de 2018\nDepoente: SCRP_HV003_Dona Benedita Silva dos Santos\nEntrevistadores: Lilian de Castro Oliveira, Vanessa Andrade Pereira, Lia Cristina Lotito Paraventi\nSanta Cruz do Rio Pardo\nhistória de vida 003\nP/1 - Nós vamos transitar por várias fases de sua vida, primeiro nós vamos começar com a sua identificação. Qual o seu nome, local de nascimento e sua data de nascimento.\nR - Meu nome é Benedita Silva dos Santos, nasci em Getulina, estado de São Paulo, aos 26/09/46.\nP/1 - O nome de seus pais? Como que foi a sua formação?\nR - Antero Silva e a minha mãe Isabel Modesto dos Santos.\nP/1 - O que a senhora lembra dessa fase? De como eles eram? Como eles se tratavam?\nR - Como eles me tratavam?\nP/1 - Isso.\nR - Minha filha, foi muito difícil a minha vida, viu. Aos oito meses eu fiquei sem mãe, a minha mãe perdeu o juízo, foi para Franco da Rocha, ficou dois anos e oito meses internada, depois ela voltou e eu já estava grandinha. E só foi sofrimento, criança foi, porque naquele tempo os pais não tinham assim, sabe? Coisas assim para dar para os filhos. Então a gente só morava em sítio, fazenda e a minha vida"}, "SCRP_HV003_Dona Benedita Silva dos Santos_edi.docx": {"size_mb": 0.0143, "modified": "2020-02-14 11:58:42", "extension": "DOCX", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV003_Benedita Silva Santos\\Textual\\SCRP_HV003_Dona Benedita Silva dos Santos_edi.docx", "category": "Textual", "content_preview": "Bordando a felicidade\n\nSinopse: Benedita teve uma infância muito difícil com pai muito bravo e a mãe com problemas psiquiátricos, porém com o dom de bordados. Quando tinha apenas sete anos precisou ajudar seus pais a trabalhar na roça de café. Com doze anos começou a trabalhar em olarias fazendo muitos tijolos por mais de dez anos. Casou-se aos vinte e seis anos de idade, com um homem muito ruim, que a fez sofrer muito. Trabalhou em colheitas de cana de açúcar para criar seus quatro filhos na Fazenda Jamaica. Na terceira idade morando no município de Santa Cruz do Rio pardo –SP, começou a frequentar o Projeto REVIVER, onde aprendeu vários bordados que se tornou uma terapia, nem vê o tempo passar com o dom que herdou de sua mãe.\nEdição\n\nBenedita Silva Santos, nasceu em Getulina-SP aos 26/09/1946, filha de Antero Silva e Isabel Modesto dos Santos, foi muito difícil sua vida, aos oito meses de idade sua mãe foi internada em um Hospital psiquiátrico chamado Franco da Rocha. Após o tratamento de dois anos e oito meses sua mãe retornou para a casa com vários buracos na cabeça devido ao tratamento. Sua infância foi muito difícil, sempre moraram em sítios ou fazendas , aos sete anos freque"}, "folder_size_gb": 0.0}, "folder_size_gb": 16.839}, "SCRP_HV004_Sirley Adriana dos Santos": {"Audiovisual": {"Áudio": {"SCRP_HV004.mp3": {"size_mb": 105.0038, "modified": "2019-10-23 14:12:10", "extension": "MP3", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV004_Sirley Adriana dos Santos\\Audiovisual\\Áudio\\SCRP_HV004.mp3", "category": "Audio", "audio_channels": "Stereo", de alegria, festa, de diversão mesmo, meu pai sempre no cantinho dele. \nP/2 - Eles estão vivos?\nR - A minha mãe já faleceu, faz dezessete anos e o pai é vivo ainda. \nP/2 - E você nasceu em Ipaussu.\nR - Em Ipaussu.\nP/2 - E você passou a infância lá? Como que foi?\nR - Não, eu pass"}, "SCRP_HV004_Sirley Adriana dos Santos_edi.docx": {"size_mb": 0.0166, "modified": "2020-02-14 12:00:12", "extension": "DOCX", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV004_Sirley Adriana dos Santos\\Textual\\SCRP_HV004_Sirley Adriana dos Santos_edi.docx", "category": "Textual", "content_preview": "Quem planta fé colhe milagres\n\nSinopse: Sirley Adriana dos Santos nasceu em Ipaussu, em 23/02/1977. É filha de João dos Santos e Maria Aparecida dos Santos. Seu pai era trabalhador rural e sua mãe servente. O pai quieto e mãe extrovertida. Puxou a característica da mãe, Sirley é uma pessoa alegre e sorridente que sempre procura ajudar as pessoas ao seu redor. As dificuldades que enfrentou na vida, durante a infância e juventude, além do problema de saúde da filha Ana Clara, fizeram Sirley ser a mulher forte que é hoje.\nEdição\n\nSirley é filha de João dos Santos e Maria Aparecida dos Santos. Seu pai era trabalhador rural e sua mãe servente. Pai quieto e mãe extrovertida. Dos 3 aos 4 anos morou no sítio Mombuquinha, em Santa Cruz do Rio Pardo. A família gostava de se reunir no almoço. Ainda quando criança o dono da casa onde moravam solicitou a casa, e eles não tinham pra onde ir. Foi muito difícil arrumar uma casa de imediato. Sua mãe que era muito explosiva, colocou todos os móveis para fora da casa, e acabou espalhando os irmãos. Uns para casa de vizinhos e outros para casa dos avós. E sua mãe foi trabalhar. O sentimento de Sirley foi de ser abandonada, pois não tinha o hábito de i"}, "folder_size_gb": 0.0}, "folder_size_gb": 13.348}, "SCRP_HV005_Nair Aparecida Alves Florêncio": {"Audiovisual": {"Áudio": {"SCRP_HV005.mp3": {"size_mb": 126.6138, "modified": "2019-10-23 14:13:14" teve irmãos?\nR - Tenho. Tenho o Nivaldo, o Nilson, a"}, "SCRP_HV005_Nair Aparecida Alves Florêncio_edi.docx": {"size_mb": 0.0153, "modified": "2020-02-14 12:01:40", "extension": "DOCX", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV005_Nair Aparecida Alves Florêncio\\Textual\\SCRP_HV005_Nair Aparecida Alves Florêncio_edi.docx", "category": "Textual", "content_preview": "O que o vento me trouxe\n\nSinopse: Dona Nair, é dona de casa, nasceu em 16/11/1965, na cidade de Santa Cruz do Rio Pardo - SP. É filha de Anselmo Pontes e Alice Alves Pontes, a mãe era doméstica e o pai vigia noturno. Passou por muitas dificuldades e através do sofrimento superou os obstáculos que a vida lhe impôs.\nEdição\n\n\"Filho, onde você vai? Mãe, sou como uma folha seca e vou onde o vento me levar\".\nDona Nair é uma mulher que aprendeu com o sofrimento. Sua infância não foi ruim, mas quando ela tinha 06 anos seus pais se separaram e ela conviveu com seus avós maternos junto com sua mãe. Tem 3 irmãos do primeiro casamento de sua mãe e do segundo casamento tem uma irmã. Foi uma criança com poucos amigos, e considerava como amigas suas tias: Maria, Vera e Ivone. Suas brincadeiras favoritas eram passar esmalte nas unhas, se maquiar, fazer bonecas de milho verde, pular corda e amarelinha.\nMorava em uma casa de três cômodos, na cidade de Santa Cruz do Rio Pardo, na Vila Oitenta. Sua mãe colocava do lado de fora da casa quatro tijolos para fazer um fogão para cozinhar. Passaram por muitas dificuldades, mas sempre receberam ajuda de parentes, nunca faltou comida. Estudou até a quinta sér"}, "folder_size_gb": 0.0}, "folder_size_gb": 15.492}, "SCRP_HV006_Patricia Tassi": {"Audiovisual": {"Áudio": {"SCRP_HV006.mp3": {"size_mb": 180.1194, "modified": "2019-10-23 14:14:46", "extension": "MP3", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV006_Patricia Tassi\\Audiovisual\\Áudio\\SCRP_HV006.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 5898074  "JPG", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV006_Patricia Tassi\\Iconográfico\\Acervo\\Baixa\\SCRP_HV006_FT001.jpg", "category": "Image", "dimension": "450x600", "resolution": "450x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_SCRP_HV006_FT001.jpg"}, "SCRP_HV006_FT002.jpg": {"size_mb": 0.1648, "modified": "2019-10-15 13:45:54", "extension": "JPG", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV006_Patricia Tassi\\Iconográfico\\Acervo\\Baixa\\SCRP_HV006_FT002.jpg", "category": "Image", "dimension": "450x600", "resolution": "450x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_SCRP_HV006_FT002.jpg"}, "SCRP_HV006_FT003.jpg": {"size_mb": 0.1144, "modified": "2019-10-15 13:46:06", "extension": "JPG", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV006_Patricia Tassi\\Iconográfico\\Acervo\\Baixa\\SCRP_HV006_FT003.jpg", "category": "Image", "dimension": "450x600", "resolution": "450x600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_SCRP_HV006_FT003.jpg"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "Textual": {"SCRP_HV006_Patricia Tassi.docx": {"size_mb": 0.0559, "modified": "2019-10-15 14:12:04", "extension": "DOCX", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV006_Patricia Tassi\\Textual\\SCRP_HV006_Patricia Tassi.docx", "category": "Textual", "content_preview": "Depoente Patrícia Tassi\nEntrevistadora Ana Paula de Oliveira\n17/10/2018\nSanta Cruz do Rio Pardo HV 006F2\nR - Meu nome é Patrícia Tassi, eu tenho 44 anos, o que mais que é para eu falar? \nP/1 - Onde você nasceu?\nR - Eu nasci em São Caetano do Sul, São Paulo.\nP/1 - Você poderia falar um pouquinho sobre os seus pais? Nome dos seus pais, o que os seus pais faziam.\nR - Meu pai chama Rubens Tassi, minha Mãe chama Vera Lúcia Bizarro Tassi.\nP/1 - E o que eles faziam?\nR - O que eles faziam? Meu pai era representante comercial e a minha mãe era dona de casa... mas eu fiquei... como eu sou uma filha adotada, eu fiquei pouco tempo com eles quando era pequena, porque o meu pai bebia muito e usava droga, então o meu avô... porque foi o meu avô que foi me buscar em Minas Gerais. Na verdade eu nasci em Pouso Alegre, Minas Gerais, mas o meu documento é de São Caetano. Meu avô foi me buscar em Minas Gerais para me dar ao meu pai, filho dele, para ver se ele melhorava de beber e de droga, mas não resolveu nada. Meu avô me deixou lá, eu fiquei uns anos com eles, os quatros primeiros anos eu fiquei com eles, como não estava dando certo e a minha mãe de criação judiava de mim, e meu pai também bebia mui"}, "SCRP_HV006_Patricia Tassi_edi.docx": {"size_mb": 0.0136, "modified": "2020-02-14 12:03:14", "extension": "DOCX", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV006_Patricia Tassi\\Textual\\SCRP_HV006_Patricia Tassi_edi.docx", "category": "Textual", "content_preview": "Título: Amor bandido\n\nSinopse: Patrícia Tassi passou pela experiência de manter um relacionamento amoroso com o companheiro na prisão por muitos anos. Difícil foi superar as dificuldades de se restabelecer financeira e emocionalmente após sua morte.\nEdição\n\nPatrícia Tassi nasceu no dia 5 de novembro de 1973 na cidade de São Caetano do Sul. Criada pelos avós adotivos porque sofrera violência doméstica por parte de seus pais adotivos. Os avós puderam lhe proporcionar um padrão de vida abastado e um ambiente familiar com muito afeto e carinho. Lembra com saudades dos mimos que recebia, em especial, ás noites em que a avó lhe contava muitas histórias e fazia teatro de fantoches. Sobre o grande amor de sua vida, aos treze anos com a morte dos avós foi morar junto com seu primeiro namorado. Quando o esposo fez dezoito anos disse que iria viajar para fazer um curso de telefonia, porém foi surpreendida quando ao assistir o noticiário viu seu marido na TV. Ele e alguns outros colegas sequestraram autoridades e os torturaram. Foi condenado a 30 anos de prisão e Patrícia permaneceu por 16 anos indo visitá-lo. O presídio onde o marido se encontrava era o Carandiru, um local muito grande, abarr"}, "folder_size_gb": 0.0}, "folder_size_gb": 22.864}, "SCRP_HV007_Débora Regina de Souza": {"Audiovisual": {"Áudio": {"SCRP_HV007.mp3": {"size_mb": 139.5293, "modified": "2019-10-23 14:15:56", "extension": "MP3", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV007_Débora Regina de Souza\\Audiovisual\\Áudio\\SCRP_HV007.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 4567737.0, "duration": 4567.74}, "folder_size_gb": 0.136}, "Vídeo": {"Edições": {"SCRP_HV007.mp4": {"size_mb": 62.8235, "modified": "2019-10-23 10:40:14", "extension": "MP4", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV007_Débora Regina de Souza\\Audiovisual\\Vídeo\\Edições\\SCRP_HV007.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 195118.0, "duration": 195.12}, "folder_size_gb": 0.061}, "Íntegra": {"SCRP HV007.mp4": {"size_mb": 5682.5814, "modified": "2018-11-17 22:32:32", "extension": "MP4", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV007_Débora Regina de Souza\\Audiovisual\\Vídeo\\Íntegra\\SCRP HV007.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4572702.0, "duration": 4572.7}, "SCRP_HV007": {"00011.MTS": {"size_mb": 96.3984, "modified": "2018-10-17 16:39:24", "extension": "MTS", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV007_Débora Regina de Souza\\Audiovisual\\Vídeo\\Íntegra\\SCRP_HV007\\00011.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 37987.059567, "duration": 37.99}, "00012.MTS": {"s roça, na colheita de algodão, café, e ele de pedreiro até constru"}, "SCRP_HV007_Débora Regina de Souza_edi.docx": {"size_mb": 0.014, "modified": "2020-02-14 12:04:52", "extension": "DOCX", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV007_Débora Regina de Souza\\Textual\\SCRP_HV007_Débora Regina de Souza_edi.docx", "category": "Textual", "content_preview": "Título: Fé e superação\n\nSinopse: Debora passou sua infância numa época onde as crianças brincavam na rua e ajudavam os pais. Quando Jovem deixou os estudos para trabalhar casando-se precocemente e morando com os pais. Numa situação difícil no casamento onde era oprimida pelo esposo consegue escondida de todos passar num concurso público e obter sua liberdade recomeçando uma nova vida. Com os filhos, uma situação de descobertas e a superação de preconceitos pela escolha sexual deles, firmando-se na luta contra a violência e o preconceito em sua vida.\nEdição\n\nDébora teve sua infância na zona rural com seus pais e irmãos em uma vida humilde, porém feliz. Ao virem para cidade iniciou seus estudos e precocemente os deixou para trabalhar. Casou-se tendo um relacionamento conturbado onde era impedida de sair de casa e com seus filhos para qualquer passeio. Conseguiu passar em um concurso público que fez escondida do esposo e pediu a separação libertando-se de seu sofrimento e de seus três filhos e nesse período pode contar com o apoio dos pais. No primeiro dia de trabalho como servente no sítio Figueirinha de São Roque sentiu uma liberdade que superava o medo sendo sua maior lembrança o c"}, "folder_size_gb": 0.0}, "folder_size_gb": 17.782}, "SCRP_HV008_Wilson Tito Soares Junior": {"Audiovisual": {"Áudio": {"SCRP_HV008.mp3": {"size_mb": 144.1439, "modified": "2019-10-23 14:17:10", "extension": "MP3", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV008_Wilson Tito Soares Junior\\Audiovisual\\Áudio\\SCRP_HV008.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 47 tual\\SCRP_HV008_Winsol Tito.docx", "category": "Textual", "content_preview": "Santa Cruz do Rio Pardo - Todo lugar tem uma história para contar\nDepoente: Wilson Tito Soares Júnior\nEntrevistador: Stefânia Maria Lorenzetti\n18/10/18\nSanta Cruz do Rio Pardo - HV 08\nP/1 - Juninho, conta para mim um pouco da sua história. Sua infância, quem foi você lá na sua infância, como era, o que você fazia.\nR - Eu sempre fui sozinho. Não tive meu pai nem minha mãe porque se separaram por motivos pessoais. Fui criado desde uns tempos de vida pela minha avó e pelo meu avô. Eu nasci prematuro de seis para sete meses, quase morri. Tive que receber vários cuidados especiais, tomar remédios especiais para não acabar morto. Então meu vô e minha vó praticamente são meus pais de criação, mas sempre tive a presença do meu pai e da minha mãe. E minha infância, como eu disse, fui sempre sozinho. No começo eu brincava sozinho, até entrar na creche. Participei da creche do Frei Chico, Centro Social São José, e lá comecei a fazer várias amizades. Lá nós brincávamos, na época da páscoa ganhávamos ovo de páscoa. No dia das crianças tínhamos um almoço especial que era lá na BB, onde tinha frango, tinha brincadeiras. E tínhamos os nossos padrinhos da Itália, que sempre ajudavam o Centro Social"}, "SCRP_HV008_Winsol Tito_edi.docx": {"size_mb": 0.0149, "modified": "2020-02-14 13:21:38", "extension": "DOCX", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV008_Wilson Tito Soares Junior\\Textual\\SCRP_HV008_Winsol Tito_edi.docx", "category": "Textual", "content_preview": "Título: Menino do Rap, fruto da comunidade\n\nSinopse: Wilson Tito, conhecido como Will ou Juninho é um jovem adulto nascido na comunidade Vila Divinéia em Santa Cruz do Rio Pardo, interior do estado de São Paulo. Teve o Cras Betinha como porta de entrada para o mundo do Rap, tendo participado do primeiro FALAVILA onde, após uma oficina de rap e uma construção coletiva de letra de música, se apresentou no cinema da cidade com lotação máxima. Ele lembra desse dia como um marco histórico em sua vida.\nEdição\n\nMeu nome é Wilson Tito Soares Junior, eu sempre fui sozinho, não tive meu pai nem minha mãe por que eles se separaram por motivos pessoais deles. Eu fui criado pela minha avó e meu avô, nasci prematuro de seis para sete meses e quase morri. Meus avós são meus pais de criação mas sempre tive a presença dos meus pais biológicos. Na minha infância em sempre brincava sozinho até eu entrar na creche Frei Chico, Centro Social São José, e lá eu comecei a fazer várias amizades. Nós brincávamos, ganhávamos ovo de páscoa, no dia das crianças tinha um almoço especial que era na AABB e na época do Natal nós também ganhávamos a sacola no natal com vários presentes; era muita alegria pra mim.\nSe"}, "folder_size_gb": 0.0}, "folder_size_gb": 17.906}, "SCRP_HV009_Alzira de Oliveira": {"Audiovisual": {"Áudio": {"SCRP_HV009.mp3": {"size_mb": 159.6801, "modified": "2019-10-23 14:18:34", "extension": "MP3", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV009_Alzira de Oliveira\\Audiovisual\\Áudio\\SCRP_HV009.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 5228509.0, "duration": 5228.51}, "folder_size_gb": 0.156}, "Vídeo": {"Edições": {"SCRP_HV009.mp4": {"size_mb": 80.3891, "modified": "2019-10-23 10:47:58", "extension": "MP4", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV009_Alzira de Oliveira\\Audiovisual\\Vídeo\\Edições\\SCRP_HV009.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 178933.0, "duration": 178.93}, "folder_size_gb": 0.079}, "Íntegra": {"SCRP_HV009.mp4": {"size_mb": 6638.5225, "modified": "2018-11-20 01:25:52", "extension": "MP4", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV009_Alzira de Oliveira\\Audiovisual\\Vídeo\\Íntegra\\SCRP_HV009.mp4", "category": "Video", "dimension": "1920x1080", " E seu nome completo?\nR - Alzira de Oliveira.\nP/1 - Conta um pouco para a gente como foi sua infância.\nR - A minha infância foi essa, nós morávamos no sítio, meu pai era empreiteiro, então nós trabalhávamos tudo para a roça. Até nove anos eu fui para a escola, depois da escola ia trabalhar no café com meu pai e minha mãe. Nós somos em 15 irmãos, então nós trabalhávamos tudo perto um do outro.\nP/2 - Tinha brincadeiras também, nessa época?\nR - Tinha na escola, negócio de São João, Santo Antônio, essas coisas. Nós morávamos no sítio e essas brincadeiras que nós tínhamos.\nP/1 - A senhora se recorda de alguma professora?\nR - Recordo, mas já não existe mais. Já faleceu, mas eu me recordo dela, é a dona Florinda (Colhato) [00:01:47] e a dona (Menaíde) [00:01:50] Isaias. Essas eu recordo. A (Menaíde) [00:01:53] foi do sítio, e a Florinda (Colhato) [00:01:56] f"}, "SCRP_HV009_Alzira de Olveira_edi.docx": {"size_mb": 0.019, "modified": "2020-02-14 13:23:42", "extension": "DOCX", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV009_Alzira de Oliveira\\Textual\\SCRP_HV009_Alzira de Olveira_edi.docx", "category": "Textual", "content_preview": "Título: Dona Alzira: disposição sem comparação\n\nSinopse: A entrevista de Alzira de Oliveira, foi gravada dia 18 de Outubro 2018, no CRAS-II-BETINHA, e faz parte do Projeto: \"TODO LUGAR TEM UMA HISTÓRIA PRA CONTAR\". O depoimento de Dona Alzira começa com sua infância. Conta que antigamente as bonecas eram de papelão e que ela e suas irmãs deram banho nelas. Por conta disso, Alzira ficou sem a sua boneca.\nVeio para a cidade com quatorze anos, e seu primeiro filho, foi um menino e faleceu quando criança, depois arrumou seis filhas, tem quinze netos, e seis bisnetos. Ainda com quatorze anos, desfilou pela primeira vez, no carnaval, em Santo Antonio da Platina, onde ganhou prêmios. Toda vida foi passista, pois, gosta de calça cumprida. Diz: “O carnaval é movimento, eu gosto, é divertido. Daqui uns dias acho que terei que parar, porque estou com a junta dura”.\nEdição\n\nAlzira de Oliveira, tem 72 anos, nasceu no dia 18 de Dezembro de 1945, nas Três Barras, em Santa Cruz do Rio Pardo-SP.\nEntrevistada conta sobre sua infância no sítio em que morava e sobre como superou tantos desafios em sua vida.\n\"Nós trabalhava tudo na roça, até os nove anos fui na escola e depois chegava da escola e ia pa"}, "folder_size_gb": 0.0}, "folder_size_gb": 20.168}, "SCRP_HV010_Aparecido de Jesus Ribeiro": {"Audiovisual": {"Áudio": {"SCRP_HV010.mp3": {"size_mb": 121.842, "modified": "2019-10-23 14:19:36", "extension": "MP3", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV010_Aparecido de Jesus Ribeiro\\Audiovisual\\Áudio\\SCRP_HV010.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 3988873.0, "duration": 3988.87}, "folder_size_gb": 0.119}, "Vídeo": {"Edições": {"SCRP_HV010.mp4": {"size_mb": 71.3041, "modified": "2019-10-23 10:50:52", "extension": "MP4", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV010_Aparecido de Jesus Ribeiro\\Audiovisual\\Vídeo\\Edições\\SCRP_HV010.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 229158.0, "duration": 229.16}, "folder_size_gb": 0.07}, "Íntegra": {"SCRP_HV010.mp4": {"size_mb": 4912.9404, "modified": "2018-11-20 20:49:00", "extension": "MP4", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV010_Aparecido de Jesus Ribeiro\\Audiovisual\\Vídeo\\Íntegra\\SCRP_HV010.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3993190.0, "duration": 3993.19}, "SCRP_HV010": {"00000.MTS": {"size_mb": 58.6875, "modified": "2018-10-18 16:01:58", "extension": "MTS", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV010_Aparecido de Jesus Ribeiro\\Audiovisual\\Vídeo\\ ation_ms": 581474.233996, "duration": 581.47}, "folder_size_gb": 10.083}, "folder_size_gb": 14.88}, "folder_size_gb": 14.95}, "folder_size_gb": 15.069}, "Textual": {"~$RP_HV010_Juliana Renóvio e Márcia Trezza.docx": {"size_mb": 0.0002, "modified": "2019-10-23 11:12:46", "extension": "DOCX", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV010_Aparecido de Jesus Ribeiro\\Textual\\~$RP_HV010_Juliana Renóvio e Márcia Trezza.docx", "category": "Textual", "content_preview": "[Error reading content: Package not found at 'D:\\Santa Cruz do Rio Pardo\\SCRP_HV010_Aparecido de Jesus Ribeiro\\Textual\\~$RP_HV010_Juliana Renóvio e Márcia Trezza.docx']"}, "SCRP_HV010_Aparecido de Jesus.docx": {"size_mb": 0.0412, "modified": "2019-10-23 11:12:46", "extension": "DOCX", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV010_Aparecido de Jesus Ribeiro\\Textual\\SCRP_HV010_Aparecido de Jesus.docx", "category": "Textual", "content_preview": "Santa Cruz do Rio Pardo - Projeto Todo Lugar Tem uma História Para Contar\nDepoente Aparecido de Jesus Ribeiro\nEntrevistador Eliana Neves Pedro Ferreira e Márcia Trezza\n18 do dez de 2018\nSCRPHV010\nP/1 - Aparecido, seu nome completo, idade e data de nascimento.\nR - Meu nome é Aparecido de Jesus Ribeiro. Minha de nascimento é 27 do dez de 78.\nP/1- Aparecido, eu gostaria do seu nome, de onde que vem o seu apelido como Cidinho.\nR - O nome foi a minha mãe quem deu. Esse apelido...\nP/1- Desde a infância?\nR - ...desde a infância. Desde de pequenininho.\nP/1- Como era o Cidinho como criança?\nR - Bem arteiro e bagunceiro.\nP/1- Quais eram suas artes preferidas?\nR - Matar os passarinhos. Caçar de estilingue, pescar. Às vezes pegava aqueles peixes bem pequenininhos, arrancava a cabeça deles. Essas eram as duas artes.\nP/1- Cidinho, você sempre morou por aqui?\nR - Toda a vida. A vida inteirinha.\nP/1- No seu José ou na Divineia?\nR - Na Divineia.\nP/1- O que você lembra sobre a sua infância lá?\nR - Na minha infância, do que eu lembro, é que as coisas eram bem mais difíceis. Eu tinha de sair 18h e às 19h voltar porque o pai era muito rigoroso e não deixava sair. É uma das coisas que eu lembro bem, rec"}, "SCRP_HV010_Aparecido de Jesus_edi.docx": {"size_mb": 0.0154, "modified": "2020-02-14 13:25:52", "extension": "DOCX", "full_path": "D:\\Santa Cruz do Rio Pardo\\SCRP_HV010_Aparecido de Jesus Ribeiro\\Textual\\SCRP_HV010_Aparecido de Jesus_edi.docx", "category": "Textual", "content_preview": "Título: De empregado a patrão\n\nSinopse: \"Sempre gostei de ajudar e faço tudo o que for possível pelos outros\".  Cidinho tem uma bicicletaria, faz teatro e seu maior sonho é ter uma saveiro, para encher de bonecas e bolas e distribuir pela vila onde mora.\nVeio para a cidade com quatorze anos, e seu primeiro filho, foi um menino e faleceu quando criança, depois arrumou seis filhas, tem quinze netos, e seis bisnetos. Ainda com quatorze anos, desfilou pela primeira vez, no carnaval, em Santo Antonio da Platina, onde ganhou prêmios. Toda vida foi passista, pois, gosta de calça cumprida. Diz: “O carnaval é movimento, eu gosto, é divertido. Daqui uns dias acho que terei que parar, porque estou com a junta dura”.\nEdição\n\nAparecido de Jesus Ribeiro, o Cidinho, como é conhecido, nasceu em 27 de outubro de 1978. Desde a infância, sempre foi bastante bagunceiro, gostava de caçar passarinho e pescar. Tem 5 irmãos e 1 de criação. Mora na Divinéia desde criança, sua infância foi difícil, pois ajudava o pai no sitio que ele trabalhava, acordava cedo e ia tirar leite da vaca e abrir a porteira para os bois. Frequentou o ensino fundamental na escola Maria José Rios e sua professora preferida era a D"}, "folder_size_gb": 0.0}, "folder_size_gb": 15.069}, "folder_size_gb": 165.308}, "Dermatite Atópica": {"PCSH_HV646_Camila Batista": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV646_ED001.mp4": {"size_mb": 353.7883, "modified": "2018-09-12 16:05:54", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV646_Camila Batista\\A
