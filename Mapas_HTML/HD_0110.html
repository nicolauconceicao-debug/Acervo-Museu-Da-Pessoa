il": "thumbnails/HD_0110/thumb_PCSH_HV664_FT02.jpg"}, "PCSH_HV664_FT03.jpg": {"size_mb": 0.1231, "modified": "2018-12-26 11:35:52", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV664_Thiago Daher\\Iconográfico\\Acervo\\Baixa\\PCSH_HV664_FT03.jpg", "category": "Image", "dimension": "575x785", "resolution": "575x785", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV664_FT03.jpg"}, "PCSH_HV664_FT04.jpg": {"size_mb": 0.2096, "modified": "2019-01-08 17:00:42", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV664_Thiago Daher\\Iconográfico\\Acervo\\Baixa\\PCSH_HV664_FT04.jpg", "category": "Image", "dimension": "894x582", "resolution": "894x582", "color_mode": "RGB", "dpi": "149 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV664_FT04.jpg"}, "PCSH_HV664_FT05.jpg": {"size_mb": 0.1646, "modified": "2019-01-08 17:01:20", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV664_Thiago Daher\\Iconográfico\\Acervo\\Baixa\\PCSH_HV664_FT05.jpg", "category": "Image", "dimension": "898x602", "resolution": "898x602", "color_mode": "RGB", "dpi": "149 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV664_FT05.jpg"}, "PCSH_HV664_FT06.jpg": {"size_mb": 0.1827, "modified": "2019-01-08 17:01:56", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV664_Thiago Daher\\Iconográfico\\Acervo\\Baixa\\PCSH_HV664_FT06.jpg", "category": "Image", "dimension": "878x587", "resolution": "878x587", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV664_FT06.jpg"}, "PCSH_HV664_FT07.jpg": {"size_mb": 0.2073, "modified": "2019-01-08 17:02:16", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV664_Thiago Daher\\Iconográfico\\Acervo\\Baixa\\PCSH_HV664_FT07.jpg", "category": "Image", "dimension": "592x900", "resolution": "592x900", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV664_FT07.jpg"}, "PCSH_HV664_FT08.jpg": {"size_mb": 0.1237, "modified": "2019-01-08 17:02:42", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV664_Thiago Daher\\Iconográfico\\Acervo\\Baixa\\PCSH_HV664_FT08.jpg", "category": "Image", "dimension": "876x578", "resolution": "876x578", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV664_FT08.jpg"}, "PCSH_HV664_FT09.jpg": {"size_mb": 0.0897, "modified": "2019-01-08 17:03:14", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV664_Thiago Daher\\Iconográfico\\Acervo\\Baixa\\PCSH_HV664_FT09.jpg", "category": "Image", "dimension": "752x496", "resolution": "752x496", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV664_FT09.jpg"}, "PCSH_HV664_FT10.jpg": {"size_mb": 0.0903, "modified": "2019-01-08 17:03:42", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV664_Thiago Daher\\Iconográfico\\Acervo\\Baixa\\PCSH_HV664_FT10.jpg", "category": "Image", "dimension": "756x512", "resolution": "756x512", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV664_FT10.jpg"}, "folder_size_gb": 0.001}, "folder_size_gb": 0.024}, "folder_size_gb": 0.024}, "Textual": {"PCSH_HV664_Thiago Daher.docx": {"size_mb": 0.008, "modified": "2018-12-26 05:36:28", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV664_Thiago Daher\\Textual\\PCSH_HV664_Thiago Daher.docx", "category": "Textual", "content_preview": "Nome da história:\nAprendi a ter equilíbrio e ser mais forte\nMinibio: Na infância, Thiago costumava viajar com o pai, que tinha um motor home e sempre pegava as estradas a trabalho. Suas primeiras lembranças se entrelaçam com essas viagens, a água do mar e um pequeno arder na pele, fruto da dermatite atópica, doença de pele que o Thiago teve que aprender a conviver desde muito cedo. Foram os anos e o carinho de pessoas especiais em sua vida que o fizeram aceitar e lidar com sua doença. Aceitar e lidar melhor consigo mesmo. Hoje, Thiago se dedica a pequenos prazeres: a vida com a esposa Lívia, a loja de roupas que é sócio e o triatlo, esporte que se dedica e compete. \nSinopse: Thiago Daher, quando pequeno, só queria ficar deitado em seu colchão quando suas crises de dermatite atópica alcançava os piores estágios. Se sentia meio só, longe da escola e dos amigos para jogar bola. Foram a maturidade dos anos, o amor da família e da esposa que fizeram com que ele se aceitasse como é e percebesse que sua doença, na verdade, o ensinou a ser uma pessoa mais forte. \nTAGs: dermatite atópica; infância; escola; autoestima; \nHistória:\nQuando criança, em épocas de crise da dermatite atópica, eu nã"}, "PCSH_HV664_Thiago Daher_rev.docx": {"size_mb": 0.0471, "modified": "2019-04-15 07:08:22", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV664_Thiago Daher\\Textual\\PCSH_HV664_Thiago Daher_rev.docx", "category": "Textual", "content_preview": "Depoimento de Thiago Dalla Bernardina Daher\nEntrevistado por Marcia Trezza\nVitória, 28 de novembro de 2018\nDepoimento PCSH_HV664\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\nP/1 - Thiago, para a gente começar, você diz, por favor, o seu nome completo, onde você nasceu e a data.\nR - Meu nome é Thiago Dalla Bernardina Daher, eu nasci em Vitória, Espírito Santo, no dia 04 de janeiro de 1980.\nP/1 - Fala o nome dos seus pais.\nR - Meu pai se chamava Francisco Jorge Daher Neto e minha mãe, Sandra Mara Dalla Bernardina Daher.\nP/1 - Fala um pouco deles, como eles são, o que eles fazem.\nR - Então, meu pai era comerciante, ele já é falecido. Ele faleceu em julho de 2002. Era comerciante, viajava muito e minha mãe sempre foi dona de casa, a Sandra, sempre foi do lar.\nP/1 - Sei, e que lembranças você tem de quando você era criança do seu pai e depois da sua mãe?\nR - Eu sempre tive ótimas lembranças dele, entendeu, desde quando era, sei lá, desde muito pequeno; lembrava da gente viajando muito, ele gostava muito de acampar. A gente viajava muito acampando, e ele era um cara muito alegre, muito feliz, proativo, sempre gostava de fazer as coisas. E a minha mãe, também, sempre foi"}, "folder_size_gb": 0.0}, "folder_size_gb": 12.043}, "PCSH_HV665_Ariana Yang": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV665_ED001.mp4": {"size_mb": 269.565, "modified": "2018-12-19 11:04:24", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV665_Ariana Yang\\Audiovisual\\Vídeo\\Edição\\PCSH_HV665_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 225267.0, "duration": 225.27}, "PCSH_HV665_ED001_leg.mp4": {"size_mb": 269.4713, "modified": "2019-04-11 12:48:20", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV665_Ariana Yang\\Audiovisual\\Vídeo\\Edição\\PCSH_HV665_ED001_leg.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 225267.0, "duration": 225.27}, "folder_size_gb": 0.526}, "Íntegra": {"PCSH_HV665.mp4": {"size_mb": 13361.5123, "modified": "2018-12-12 23:16:14", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV665_Ariana Yang\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV665.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6873700.0, "duration": 6873.7}, "folder_size_gb": 13.048}, "folder_size_gb": 13.575}, "Áudio": {"PCSH_HV665.mp3": {"size_mb": 210.4429, "modified": "2018-12-06 08:58:20", "extension": "MP3", "full_path": "D:\\Dermatite Atópica\\PCSH_HV665_Ariana Yang\\Audiovisual\\Áudio\\PCSH_HV665.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 6895430.0, "duration": 6895.43}, "folder_size_gb": 0.206}, "folder_size_gb": 13.78}, "Textual": {"PCSH_HV665_Ariana Yang_rev.docx": {"size_mb": 0.0359, "modified": "2019-04-15 07:09:50", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV665_Ariana Yang\\Textual\\PCSH_HV665_Ariana Yang_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História\nDepoimento de Ariana Yang\nEntrevistada por Carol Margiotte Grohmann\nCampinas, 03 de dezembro de 2018\nEntrevista número PCSH-HV665\nRealização: Museu da Pessoa\nP/1 - Doutora, boa tarde. Muito obrigado por receber a gente aqui hoje, e para começar, seu nome completo.\nR - Eu que agradeço. Ariana Campos Yang.\nP/1 - O local e a data de nascimento.\nR - 04/07/1973, Catanduva, São Paulo.\nP/1 - A senhora sabe porque seus pais te batizaram com esse nome?\nR - Meu pai se chamava Ari, ele faleceu esse ano, minha mãe não se chama Ana, e ele queria que o nome dele estivesse nos nomes dos filhos, e eu sou a filha mais velha, e ficou Ariana. Minha mãe trabalhava em um hospital, e tinha uma história de que quando ela trabalhava nasceram duas gêmeas lindas, e uma delas se chamava Ariana, e então juntou a história da minha mãe e o desejo do meu pai, e eu nasci Ariana.\nP/1 - E seus pais contavam a história de como foi o dia do seu nascimento?\nR - Do dia não, eu não sei como foi o dia do nascimento. A minha mãe era filha única, e sempre teve um trauma de filha única, então ela conta que quando eu nasci ela já pensava em me dar um irmão porque ela não queria que eu vivesse sozi"}, "PCSH_HV665_Ariana Yang_edi.docx": {"size_mb": 0.0088, "modified": "2018-12-26 04:41:06", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV665_Ariana Yang\\Textual\\PCSH_HV665_Ariana Yang_edi.docx", "category": "Textual", "content_preview": "Nome da história:\nA educação e a medicina: duas paixões\nMinibio: Ariana Campos Yang nasceu em Catanduva, São Paulo, em julho de 1973. Carrega no nome o desejo do seu pai, Ari, de ver os filhos com seu nome. Leva da infância as memórias do dia a dia em uma vila militar na região de Guarulhos e dos livros, que aprendeu a gostar por influência da mãe. Sonhava em ser professora. Se tornou médica. Mas os sonhos de ajudar as pessoas e mudar o mundo a sua volta continuam vivos, com a Ariana os realizando dia a dia.\nSinopse: Ariana Yang sonhava em ser professora para ajudar a sociedade, ensinar e nunca deixar de estudar. Para sua alegria, encontrou seus objetivos também na medicina. É uma das fundadoras do CEDA [Cuidado e Educação em Dermatite Atópica], projeto que busca, por meio do ensino e da troca de experiências, mobilizar pacientes de dermatite atópica a olharem com mais atenção seus tratamentos. Mas para Ariana, o CEDA também representa algo a mais: é o espaço para se encontrar como aluna e também professora.\nTAGs: educação; dermatite atópica; medicina; projetos sociais; profissão.\nHistória:\nMinha mãe acreditava muito no poder do estudo - e isso passou para mim. Meu sonho era ser pr"}, "folder_size_gb": 0.0}, "folder_size_gb": 13.78}, "PCSH_HV667_Frederico Augusto do Nascimento": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV667_ED001.mp4": {"size_mb": 402.7531, "modified": "2019-02-11 13:57:26", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV667_Frederico Augusto do Nascimento\\Audiovisual\\Vídeo\\Edição\\PCSH_HV667_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 217884.0, "duration": 217.88}, "PCSH_HV667_ED001_leg.mp4": {"size_mb": 260.3206, "modified": "2019-04-15 11:50:50", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV667_Frederico Augusto do Nascimento\\Audiovisual\\Vídeo\\Edição\\PCSH_HV667_ED001_leg.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 217884.0, "duration": 217.88  "894x594", "resolution": "894x594", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV667_FT03.jpg"}, "PCSH_HV667_FT04.jpg": {"size_mb": 0.1567, "modified": "2019-01-09 08:12:44", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV667_Frederico Augusto do Nascimento\\Iconográfico\\Baixa\\PCSH_HV667_FT04.jpg", "category": "Image", "dimension": "884x588", "resolution": "884x588", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV667_FT04.jpg"}, "PCSH_HV667_FT05.jpg": {"size_mb": 0.1355, "modified": "2019-01-09 08:13:20", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV667_Frederico Augusto do Nascimento\\Iconográfico\\Baixa\\PCSH_HV667_FT05.jpg", "category": "Image", "dimension": "880x586", "resolution": "880x586", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV667_FT05.jpg"}, "PCSH_HV667_FT06.jpg": {"size_mb": 0.1551, "modified": "2019-01-09 08:13:58", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV667_Frederico Augusto do Nascimento\\Iconográfico\\Baixa\\PCSH_HV667_FT06.jpg", "category": "Image", "dimension": "886x586", "resolution": "886x586", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV667_FT06.jpg"}, "folder_size_gb": 0.001}, "folder_size_gb": 0.001}, "Textual": {"PCSH_HV667_Frederico Augusto do Nascimento_edi.docx": {"size_mb": 0.0082, "modified": "2019-04-15 07:11:06", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV667_Frederico Augusto do Nascimento\\Textual\\PCSH_HV667_Frederico Augusto do Nascimento_edi.docx", "category": "Textual", "content_preview": "História:\nO bicho da minha unha e a vontade de coçar\nMinibio: \nFrederico Augusto do Nascimento é natural de Jacareí, cidade da região do Vale do Paraíba, no estado de São Paulo. Após perder o pai, viveu com sua mãe dividindo dores, alegrias e viagens. Desde sempre, também teve que conviver com a dermatite atópica, mas sempre procurando a saída para levar uma vida saudável.\nSinopse:\nFrederico ficava com sua camiseta suja de sangue por causa da dermatite atópica. Sentia uma coceira incontrolável, que resultava em manchas de sangue na roupa. Até encontrar uma saída, foram várias tentativas de tratamento. Dores, desafios e o desejo de ficar bem.\nTAGs: dermatite atópica; infância; problemas respiratórios; tratamento; trabalho; sangue;\nEdição\nA minha história é bastante interessante. Não acho que ela seja uma história comum. O que eu queria deixar registrado é o processo de aprendizagem que eu vivo. De ser um eterno insatisfeito, do ponto de vista de sempre querer aprender mais e sempre buscar mais. Ao mesmo tempo, sou muito grato pela família que eu construí até esse momento. \nDesde que me recordo, eu tenho dermatite atópica. Ela, de uma certa forma, sempre esteve presente na minha infâ"}, "PCSH_HV667_Frederico Augusto do Nascimento_rev.docx": {"size_mb": 0.0368, "modified": "2019-04-15 07:11:34", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV667_Frederico Augusto do Nascimento\\Textual\\PCSH_HV667_Frederico Augusto do Nascimento_rev.docx", "category": "Textual", "content_preview": "Depoimento de Frederico Augusto do Nascimento\nEntrevistado por Marcia Trezza\nSorocaba, 12 de dezembro de 2018\nEntrevista número PCSH_HV667\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\nP/1 - A gente vai começar, Frederico, a entrevista. Fala para mim o seu nome completo, a cidade que você nasceu e que data. \nR - Meu nome é Frederico Augusto do Nascimento, eu sou natural de Jacareí, estado de São Paulo, Vale do Paraíba. E eu nasci no dia 10 de maio de 1976.\nP/1 - Qual o nome dos seus pais?\nR - O nome do meu pai é Guido do Nascimento e da minha mãe é Maria Aparecida do Nascimento.\nP/1 - Qual a origem deles? Eles são também da região? Vieram de outro lugar?\nR - Até onde eu sei, que eu tenho conhecimento e recordação, eles são naturais de Jacareí também. Com um pouco de história ali da região mais rural, que era Santa Branca, por parte da minha mãe. Santa Branca, Salesópolis, ali.\nP/1 - E seu pai de Jacareí mesmo?\nR - Que eu saiba, sim.\nP/1 - A atividade deles, ou atual ou quando eram mais jovens?\nR - O meu pai já é falecido. Ele faleceu quando eu era muito jovem, quando eu tinha cinco anos de idade. Ele era projetista lá na General Motors de Caçapava, se eu não me eng"}, "folder_size_gb": 0.0}, "folder_size_gb": 6.903}, "PCSH_HV670_Angela Cancian": {"Iconográfico": {"Acervo": {"Baixa": {"PCSH_HV670_FT01.jpg": {"size_mb": 0.1599, "modified": "2019-02-25 10:56:42", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV670_Angela Cancian\\Iconográfico\\Acervo\\Baixa\\PCSH_HV670_FT01.jpg", "category": "Image", "dimension": "1275x1753", "resolution": "1275x1753", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV670_FT01.jpg"}, "PCSH_HV670_FT02.jpg": {"size_mb": 0.1925, "modified": "2019-02-25 10:57:02", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV670_Angela Cancian\\Iconográfico\\Acervo\\Baixa\\PCSH_HV670_FT02.jpg", "category": "Image", "dimension": "1753x1275", "resolution": "1753x1275", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV670_FT02.jpg"}, "PCSH_HV670_FT03.jpg": {"size_mb": 0.2514, "modified": "2019-02-25 10:56:56", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV670_Angela Cancian\\Iconográfico\\Acervo\\Baixa\\PCSH_HV670_FT03.jpg", "category": "Image", "dimension": "1275x1753", "resolution": "1275x1753", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV670_FT03.jpg"}, "PCSH_HV670_FT04.jpg": {"size_mb": 0.2411, "modified": "2019-02-25 10:57:04", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV670_Angela Cancian\\Iconográfico\\Acervo\\Baixa\\PCSH_HV670_FT04.jpg", "category": "Image", "dimension": "1753x1275", "resolution": "1753x1275" .tif": {"size_mb": 3.2067, "modified": "2018-12-13 21:32:38", "extension": "TIF", "full_path": "D:\\Dermatite Atópica\\PCSH_HV670_Angela Cancian\\Iconográfico\\Acervo\\Alta\\PCSH_HV670_FT05.tif", "category": "Image", "dimension": "1275x1753", "resolution": "1275x1753", "color_mode": "RGBA", "dpi": "149 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV670_FT05.jpg"}, "PCSH_HV670_FT06.tif": {"size_mb": 3.0489, "modified": "2018-12-13 21:33:42", "extension": "TIF", "full_path": "D:\\Dermatite Atópica\\PCSH_HV670_Angela Cancian\\Iconográfico\\Acervo\\Alta\\PCSH_HV670_FT06.tif", "category": "Image", "dimension": "1275x1753", "resolution": "1275x1753", "color_mode": "RGBA", "dpi": "149 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV670_FT06.jpg"}, "PCSH_HV670_FT07.tif": {"size_mb": 2.892, "modified": "2018-12-13 21:34:56", "extension": "TIF", "full_path": "D:\\Dermatite Atópica\\PCSH_HV670_Angela Cancian\\Iconográfico\\Acervo\\Alta\\PCSH_HV670_FT07.tif", "category": "Image", "dimension": "1275x1753", "resolution": "1275x1753", "color_mode": "RGBA", "dpi": "149 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV670_FT07.jpg"}, "PCSH_HV670_FT08.tif": {"size_mb": 1.1733, "modified": "2019-02-25 11:25:20", "extension": "TIF", "full_path": "D:\\Dermatite Atópica\\PCSH_HV670_Angela Cancian\\Iconográfico\\Acervo\\Alta\\PCSH_HV670_FT08.tif", "category": "Image", "dimension": "892x590", "resolution": "892x590", "color_mode": "RGBA", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV670_FT08.jpg"}, "PCSH_HV670_FT09.tif": {"size_mb": 3.0689, "modified": "2018-12-13 21:37:32", "extension": "TIF", "full_path": "D:\\Dermatite Atópica\\PCSH_HV670_Angela Cancian\\Iconográfico\\Acervo\\Alta\\PCSH_HV670_FT09.tif", "category": "Image", "dimension": "1275x1753", "resolution": "1275x1753", "color_mode": "RGBA", "dpi": "149 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV670_FT09.jpg"}, "PCSH_HV670_FT010.tif": {"size_mb": 3.7415, "modified": "2018-12-13 21:38:24", "extension": "TIF", "full_path": "D:\\Dermatite Atópica\\PCSH_HV670_Angela Cancian\\Iconográfico\\Acervo\\Alta\\PCSH_HV670_FT010.tif", "category": "Image", "dimension": "1275x1753", "resolution": "1275x1753", "color_mode": "RGBA", "dpi": "149 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV670_FT010.jpg"}, "folder_size_gb": 0.033}, "folder_size_gb": 0.035}, "folder_size_gb": 0.035}, "Textual": {"PCSH_HV670_Angela Cristina Cancian de Jesus de Andrade_edi.docx": {"size_mb": 0.0096, "modified": "2019-04-15 07:13:52", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV670_Angela Cancian\\Textual\\PCSH_HV670_Angela Cristina Cancian de Jesus de Andrade_edi.docx", "category": "Textual", "content_preview": "História: \nReceita para a cura: amar e cozinhar\nMinibio:\nÂngela Cristina é fruto de pais “poços de amor”, como gosta de definir. Viu a luta dos pais para cuidar dela, que sempre teve problemas de saúde. Batalhas em busca de tratamento e de uma vida mais saudável. Mas o que nunca faltou foi amor. Dela, de seus pais, de suas irmãs, de seu filho. Assim, Ângela se tornou cozinheira e uma apaixonada pela cozinha. De tão bem cuidada, passou a valorizar o cuidar.\nSinopse: \nÂngela conta sua trajetória de doenças que a acompanham durante toda a vida. Sempre foi uma criança doente, como costuma dizer. Foram várias as batalhas e os desafios, com muito sacrifício de seus pais a fim de buscar um tratamento eficaz. Foi, acima de tudo, o amor que sua família sente por ela. Por isso Ângela aconselha: valorize, ame e cuide daqueles que estão perto. Eles são a receita principal para qualquer processo de cura. \nTAGs: dermatite atópica; infância; superação; preconceito; amor; maternidade; família; espiritualidade\nFui uma criança muito doente. Nasci mega saudável, todo mundo falava que eu era um bebê lindo. Mas com um ano e meio, comecei a ficar doente. Meus pais até tinham uma situação estável, mas co"}, "PCSH_HV670_Angela Cristina Cancian de Jesus de Andrade_rev.docx": {"size_mb": 0.0484, "modified": "2019-04-15 07:14:08", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV670_Angela Cancian\\Textual\\PCSH_HV670_Angela Cristina Cancian de Jesus de Andrade_rev.docx", "category": "Textual", "content_preview": "Depoimento de Ângela Cristina Cancian de Jesus de Andrade\nEntrevistada por Marcia Trezza\nSorocaba, 13 de dezembro de 2018\nEntrevista número PCSH_HV670\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\nP/1 - Ângela para a gente começar vai pedir para você falar de novo seu nome completo, a cidade que você nasceu e a data de nascimento.\nR - Eu sou Ângela Cristina Cancian de Jesus Andrade, um nomão, eu nasci em Campo Grande, Mato Grosso do sul, sou mato-grossense, nasci no dia 05 de maio de 1978.\nP/1 - Você pode me falar um pouquinho dos seus pais, dos seus avós, como era, de onde vieram à origem da sua família.\nR - Por parte da minha mãe a minha família é de origem italiana, meu avô veio da Itália, veio pequenininho, e chegando aqui o pai do meu avô, acabou se distribuindo com os irmãos dele. Então, o pai do meu avô e o meu avô foram para a região de Mato Grosso, por antes era Mato Grosso, depois que ficou Mato Grosso do Sul. E meu avô conheceu a minha avó que era filha de italianos, mas nascida no Brasil e se casaram e tiveram vários filhos doa quais seis vivos, hoje já não mais, e seis viveram, e teve a minha mãe. A minha mãe, das mulheres ela era a filha mais nova. A"}, "folder_size_gb": 0.0}, "Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV670_ED001.mp4": {"size_mb": 417.262, "modified": "2019-02-11 14:30:04", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV670_Angela Cancian\\Audiovisual\\Vídeo\\Edição\\PCSH_HV670_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 225459.0, "duration": 225.46}, "PCSH_HV670_ED001_leg.mp4": {"size_m ues Silva\\Audiovisual\\Vídeo\\Edição\\PCSH_HV648_ED001_leg.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "30.000 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 170533.0, "duration": 170.53}, "folder_size_gb": 0.496}, "Íntegra": {"PCSH_HV648.mp4": {"size_mb": 11319.0279, "modified": "2018-04-18 00:09:44", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV648_Valter Marques Silva\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV648.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5825720.0, "duration": 5825.72}, "folder_size_gb": 11.054}, "folder_size_gb": 11.549}, "Áudio": {"PCSH_HV648.mp3": {"size_mb": 179.8787, "modified": "2018-04-18 06:36:24", "extension": "MP3", "full_path": "D:\\Dermatite Atópica\\PCSH_HV648_Valter Marques Silva\\Audiovisual\\Áudio\\PCSH_HV648.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 5893899.0, "duration": 5893.9}, "folder_size_gb": 0.176}, "folder_size_gb": 11.725}, "Textual": {"PCSH_HV648_Valter Marques Silva_edi.docx": {"size_mb": 0.007, "modified": "2019-04-15 06:49:14", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV648_Valter Marques Silva\\Textual\\PCSH_HV648_Valter Marques Silva_edi.docx", "category": "Textual", "content_preview": "Nome da história\nFilho, você consegue fazer tudo\nMinibio\nValter Marques Silva nasceu em São Paulo em dezembro de 1974. Filho de Delmira e Joaquim, desde criança enfrenta problemas de saúde, como bronquite, alergias e dermatite atópica. Aprendeu desde sempre a encontrar caminhos entre os tratamentos. Adepto de uma boa pelada, dominava os campos como zagueiro. Hoje é pai de Luiz Felipe, seu filho e sua vida. \nSinopse\nValter, ao escutar seu filho falar que não era capaz de algo, fez a única coisa que estava ao seu alcance: dar seu amor de pai. Falar para o pequeno Luiz Felipe que poderia ter e ser tudo o que quisesse. E poderia sempre pedir ajuda. Também fala da dor de ver seu filho com a mesma doença que ele tem, a dermatite atópica, e como precisou ensinar, enquanto também aprendia, como seu filho poderia lidar com ela.\nTAGs: paternidade; filho; dermatite atópica; motivação; superação.\nEdição: \nTeve a vez em que meu filho Luiz Felipe me falou: “Papai, eu não consigo fazer isso!” E eu falei: “Luiz Felipe, você consegue fazer tudo na sua vida, você pode fazer absolutamente tudo! Se você tiver dificuldades, diga: papai, me ajuda? Mamãe, me ajuda?; vovó, titia e titio, me ajuda?”. Sempr"}, "PCSH_HV648_Valter Marques Silva_rev.docx": {"size_mb": 0.0446, "modified": "2019-04-15 06:48:48", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV648_Valter Marques Silva\\Textual\\PCSH_HV648_Valter Marques Silva_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História\nDepoimento de Valter Marques Silva\nEntrevistado por Denise Cooke e Carol Margiotte\nSão Paulo, 11 de abril de 2018.\nEntrevista número PCSH_HV648\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\nP1 - Bom dia, bem-vindo a entrevista do Museu da Pessoa, você fala para a gente o seu nome, o local e data de nascimento?\nR - Bom dia, Valter Marques Silva, São Paulo, 20 de dezembro de 1974. \nP1 - E conta um pouco para a gente sobre os seus pais, qual é o nome deles, o que eles faziam.\nR - Meu pai é o Joaquim Venâncio da Silva, ele era supervisor de injetora plástica, e minha mãe Delmira Marques da Silva, atual diretora de escola do estado. \nP1 - E você lembra, ou você sabe alguma coisa sobre o dia do seu nascimento?\nR - Não, nunca me foi contado não. \nP1 - E você tem irmãos?\nR - Tenho, Marlene, 45 anos, Joaquim, chamamos ele de Jonas, 35 anos. \nP1 - Você é o irmão mais velho?\nR - Eu sou o do meio, 43.\nP1 - Conta um pouco para a gente da sua infância, o que você se lembra?\nR - Eu lembro que era muito bom, minha infância sempre foi maravilhosa.\nP1 - Onde é que você passou a infância?\nR - Em São Paulo mesmo, a gente morava no Jardim Monte Azul, meu pai"}, "folder_size_gb": 0.0}, "Iconográfico": {"Acervo": {"PCSH_HV648_FT001.jpeg": {"size_mb": 0.3285, "modified": "2023-03-03 17:09:36", "extension": "JPEG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV648_Valter Marques Silva\\Iconográfico\\Acervo\\PCSH_HV648_FT001.jpeg", "category": "Image", "dimension": "1440x1320", "resolution": "1440x1320", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV648_FT001.jpg"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "folder_size_gb": 11.725}, "PCSH_HV656_Higor dos Santos Fabri": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV656_ED0001.mp4": {"size_mb": 336.8949, "modified": "2018-09-12 18:18:00", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV656_Higor dos Santos Fabri\\Audiovisual\\Vídeo\\Edição\\PCSH_HV656_ED0001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 185218.0, "duration": 185.22}, "PCSH_HV656_ED0001_leg.mp4": {"size_mb": 218.8901, "modified": "2019-04-15 15:43:00", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV656_Higor dos Santos Fabri\\Audiovisual\\Vídeo\\Edição\\PCSH_HV656_ED0001_leg.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "30.000 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 185233.0, "duration": 185.23}, "folder_size_gb": 0.543}, "Íntegra": {"PCSH_HV656.mp4": {"size_mb": 6864.2496, "modified": "2018-07-11 01:14:02", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV656_Higor dos Santos Fabri\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV656.mp4", "category": "Video", "dimension": "1920x1080", "as l": "thumbnails/HD_0110/thumb_PCSH_HV656_FT02.jpg"}, "PCSH_HV656_FT03.jpg": {"size_mb": 0.5193, "modified": "2018-07-04 11:10:46", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV656_Higor dos Santos Fabri\\Iconográfico\\Acervo\\Baixa\\PCSH_HV656_FT03.jpg", "category": "Image", "dimension": "1772x1170", "resolution": "1772x1170", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV656_FT03.jpg"}, "PCSH_HV656_FT04.jpg": {"size_mb": 0.4356, "modified": "2018-07-04 11:12:06", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV656_Higor dos Santos Fabri\\Iconográfico\\Acervo\\Baixa\\PCSH_HV656_FT04.jpg", "category": "Image", "dimension": "1614x1070", "resolution": "1614x1070", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV656_FT04.jpg"}, "PCSH_HV656_FT05.jpg": {"size_mb": 0.3947, "modified": "2018-07-04 11:13:26", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV656_Higor dos Santos Fabri\\Iconográfico\\Acervo\\Baixa\\PCSH_HV656_FT05.jpg", "category": "Image", "dimension": "1652x1062", "resolution": "1652x1062", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV656_FT05.jpg"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.024}, "Making of": {"PCSH_HV656_MO001.jpg": {"size_mb": 0.0708, "modified": "2018-09-20 15:34:00", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV656_Higor dos Santos Fabri\\Iconográfico\\Making of\\PCSH_HV656_MO001.jpg", "category": "Image", "dimension": "932x486", "resolution": "932x486", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV656_MO001.jpg"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.024}, "Textual": {"PCSH_HV656_Higor dos Santos Fabri_edi.docx": {"size_mb": 0.0084, "modified": "2019-04-15 06:58:42", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV656_Higor dos Santos Fabri\\Textual\\PCSH_HV656_Higor dos Santos Fabri_edi.docx", "category": "Textual", "content_preview": "Nome da história\nEle falava: “Sua pele é linda!”\nMinibio\nHigor com H é em homenagem ao personagem de uma novela, que sua mãe muito gostava. Apegado a família e a irmã, Higor lembra de quando começou a estudar: sua irmã tinha que ficar na sala com ele, para ele conseguir ficar na escola. Com o tempo cresceu, ganhou confiança, se descobriu. Conheceu Leandro, seu amor, pela internet e hoje dividem uma casa e um salão. Convive com as dificuldades da dermatite atópica, mas as supera com um companheiro e uma família ao lado. \nSinopse\nHigor conta como começou a namorar o Leandro pela internet e da ida a São Paulo para conhecê-lo. Como foi falar para sua família de sua sexualidade e voltar para sua cidade, Santa Mercedes, e construir uma casa com Leandro. E da sua primeira crise de dermatite atópica com o companheiro ao seu lado. Difícil, longa, de duros seis meses de duração. Mas que foi amenizada pelo afeto de seu amor, que falava que sua pele era linda e estava ao seu lado. \nTAGs\ndermatite atópica, internet, namoro, crise, lgbt. \nEdição\nEu conheci o Leandro pela internet. Começamos a namorar virtualmente e quando fizemos um mês de relacionamento, fui para São Paulo. Fiquei por volta de"}, "PCSH_HV656_Higor dos Santos Fabri_rev.docx": {"size_mb": 0.0273, "modified": "2019-04-15 06:59:04", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV656_Higor dos Santos Fabri\\Textual\\PCSH_HV656_Higor dos Santos Fabri_rev.docx", "category": "Textual", "content_preview": "Programa Conte sua História\nDepoimento de Higor dos Santos Fabri\nEntrevistado por Carolina Margiotte e Denise Cooke\nSanta Mercedes, 04 de julho de 2018\nEntrevista número PCSH_HV656\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\nP/1 - Higor, bom dia.\nR - Bom dia.\nP/1 - Obrigada por receber a gente aqui na sua casa.\nR - Eu que agradeço.\nP/1 - E para começar, seu nome completo.\nR - Higor dos Santos Fabri.\nP/1 - Local e data de nascimento.\nR - Local que eu resido?\nP/1 - Que você nasceu. O local e o dia do seu nascimento.\nR - Dracena, três do quatro de 1997.\nP/1 - Higor, conta para a gente, você sabe porque seus pais te deram esse nome? Higor, com H?\nR - Sim. Minha mãe gostava de uma novela que tinha um cigano que se chamava Higor.\nP/1 - E aí seu pai aceitou? Como que foi essa negociação?\nR - Eu acho que foi ela mesma que decidiu.\nP/1 - E seus pais te contaram o dia do seu nascimento como foi?\nR - Não.\nP/1 - E falando nos seus pais, qual o nome deles?\nR - Completo?\nP/1 - Pode ser.\nR - Marta Francisco dos Santos Fabri, Jassi Geraldo Fabri.\nP/1 - Fala um pouco sobre eles. Como eles são, a profissão.\nR - Meu pai é agente sanitário e minha mãe trabalha em serviços gerais.\nP/"}, "folder_size_gb": 0.0}, "folder_size_gb": 7.323}, "PCSH_HV659_Érika Borges Feitosa": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV659_ED001.mp4": {"size_mb": 184.6433, "modified": "2018-12-18 15:28:10", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV659_Érika Borges Feitosa\\Audiovisual\\Vídeo\\Edição\\PCSH_HV659_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 156256.0, "duration": 156.26}, "PCSH_HV659_ED001_leg.mp4": {"size_mb": 184.888, "modified": "2019-04-15 15:43:00", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV659_Érika Borges Feitosa\\Audiovisual\\Vídeo\\Edição\\PCSH_HV659_ED001_leg.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "30.000 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 157067.0, "duration": 157.07}, "folder_size_gb": 0.361}, "Íntegra": {"PCSH_HV659.mp4": {"size_mb": 3867.3458, "modified": "2018-10-12 00:02:14", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV659_Érika Borges Feitosa\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV659.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1991957.0, "duration": 1991.96}, "folder_size_gb": 3.777}, "folder_size_gb": 4.138}, "Áudio": {"PCSH_HV659.mp3": {"size_mb": 61.5288, "modified": "2018-09-11 06:54:36", "extension": "MP3", "full_path": "D:\\Dermatite Atópica\\PCSH_HV659_Érika Borges Feitosa\\Audiovisual\\Áudio\\PCSH_HV659.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 2015872.0, "duration": 2015.87}, "folder_size_gb": 0.06}, "folder_size_gb": 4.198}, "Iconográfico": {"Making of": {"PCSH_HV659_MO001.JPG": {"size_mb": 2.2388, "modified": "2021-11-04 14:18:26", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV659_Érika Borges Feitosa\\Iconográfico\\Making of\\PCSH_HV659_MO001.JPG", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV659_MO001.jpg"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.002}, "Textual": {"PCSH_HV659_Érica Borges Feitosa_rev.docx": {"size_mb": 0.0218, "modified": "2019-04-15 07:02:22", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV659_Érika Borges Feitosa\\Textual\\PCSH_HV659_Érica Borges Feitosa_rev.docx", "category": "Textual", "content_preview": "Programa Conte sua História\nDepoimento de Érica Borges Feitosa\nEntrevistada por Carol Margiotte\nSão Paulo, 31 de agosto de 2018\nEntrevista número PCSH_HV659\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\nP/1 - Érica, boa tarde.\nR - Boa tarde.\nP/1 - Obrigada por ter vindo aqui, hoje, para a gente escutar a sua história. E, para começar, seu nome completo?\nR - Érica Borges Feitosa.\nP/1 - Local e data de nascimento?\nR - Espírito Santo do Pinhal, São Paulo. Dia 02/12/88.\nP/1 - E você sabe por que seus pais te deram esse nome, “Érica?”.\nR - Não sei. Na verdade, minha mãe achava que era homem, era Erick, então, acabou que, na hora, descobriu que era menina, ficou Érica, super criativa.\nP/1 - Mas ela já tinha preparado tudo para vir um menino?\nR - Não, não tinha. Naquela época, não tinha muita coisa, então… Mas a minha mãe não quis fazer, mesmo. O exame, nada.\nP/1 - Mas seus pais contavam para você a história do dia do seu nascimento, como foi?\nR - Minha mãe comenta quando eu pergunto.\nP/1 - E o que ela conta?\nR - Agora eu não vou lembrar, mas hoje eu perguntei o porquê o nome, porque ela escolheu, e ela falava que ela queria Erick Henrique, mas aí era menina e ela colocou"}, "PCSH_HV659_Érika Borges Feitosa_edi.docx": {"size_mb": 0.0083, "modified": "2019-04-15 07:19:54", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV659_Érika Borges Feitosa\\Textual\\PCSH_HV659_Érika Borges Feitosa_edi.docx", "category": "Textual", "content_preview": "Nome da história:\nMuito mais que a dermatite atópica\nMinibio: Érica Borges Feitosa nasceu no interior de São Paulo, em Espírito Santo do Pinhal. Em sua breve vida, Érica já passou e viu muito. De pequena, carrega lembranças doces e o incômodo de se ver obrigada a conviver com a dermatite atópica, que tem desde sempre. Incômodo que cresceu com as mudanças e os desafios, fazendo as crises aumentarem. Foram os novos tratamentos, o médico de confiança que encontrou e o amor carinhoso de seu marido, Jefferson, que fizeram ela melhorar, que fazem a Érica se sentir bem e hoje sonhar com filhos, um trabalho estável e uma vida tranquila. \nSinopse: Érica Borges Feitosa tem dermatite atópica desde pequenininha. Mas foi com o tempo e com mudanças que a doença foi piorando. As crises que eram esporádicas se tornaram frequentes, e o problema se agravou com a mudança para São Paulo. No meio desse turbilhão, Érica relata a loucura que fez para o casamento, com o medo de subir ao altar com feridas: contra a recomendação médica, tomou injeção para estar bem e se casar com o amor de sua vida se esquecendo, por um instante, da dermatite.\nTAGs: dermatite atópica; casamento; vacina; faculdade; mudança\nD"}, "folder_size_gb": 0.0}, "folder_size_gb": 4.2}, "PCSH_HV662_Simone Cardoso dos Santos": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV662_ED001.mp4": {"size_mb": 265.5875, "modified": "2018-12-18 15:36:28", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV662_Simone Cardoso dos Santos\\Audiovisual\\Vídeo\\Edição\\PCSH_HV662_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 222255.0, "duration": 222.25}, "PCSH_HV662_ED001_leg.mp4": {"size_mb": 266.9259, "modified": "2019-04-15 15:43:00", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV662_Simone Cardoso dos Santos\\Audiovisual\\Vídeo\\Edição\\PCSH_HV662_ED001_leg.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "30.000 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 222667.0, "duration": 222.67}, "folder_size_gb": 0.52}, "Íntegra": {"PCSH_HV662.mp4": {"size_mb": 8623.3413, "modified": "2018-10-31 21:38:48", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV662_Simone Cardoso dos Santos\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV662.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4439535.0, "duration": 4439.53}, "folder_size_gb": 8.421}, "folder_size_gb": 8.941}, "Áudio": {"PCSH_HV662.mp3": {"size_mb": 67.7603, "modified": "2018-10-08 16:33:28", "extension": "MP3", "full_path": "D:\\Dermatite Atópica\\PCSH_HV662_Simone Cardoso dos Santos\\Audiovisual\\Áudio\\PCSH_HV662.mp3", "category": "Audio", "audio_channels": "Stereo", "aud ca\\PCSH_HV662_Simone Cardoso dos Santos\\Textual\\PCSH_HV662_Simone Cardoso dos Santos_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História\nDepoimento de Simone Cardoso dos Santos\nEntrevistada por Denise Cooke\nGuarulhos, 04 de outubro de 2018\nEntrevista número PCSH_HV662\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\nP/1 - Oi, Simone, muito obrigada por estar aqui contando a sua história para a gente, seja bem-vinda. E vamos começar, fala para nós o seu nome, a data do seu nascimento e onde você nasceu.\nR - Bom, meu nome é Simone Cardoso dos Santos, eu nasci aqui em Guarulhos, nasci em 13 de janeiro de 1973. \nP/1 - E você sabe alguma coisa sobre o dia do seu nascimento?\nR - Importante? Eu nunca pesquisei, eu não sei o que pode ter acontecido.\nP/1 - E você sabe como os seus pais se conheceram?\nR - Meus pais se conheceram em uma vila que tinha aqui em Guarulhos, que já existiam famílias deles, a minha mãe tinha uma quantidade de pessoas que já moravam lá, meu pai também e minha mãe trabalhava em uma fábrica de brinquedos, a Estrela, e eu acho que eles se encontravam ali quando ele ia visitar a família e aí começaram a namorar e casaram.\nP/1 - Como é o nome deles?\nR - O meu pai chama Severino Cardoso dos Santos, a minha mãe Edjane Cardoso dos Santos.\nP/1 - E onde você nasceu? Em"}, "PCSH_HV662_Simone Cardoso dos Santos_REV_LYK.docx": {"size_mb": 0.0093, "modified": "2018-12-26 05:22:06", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV662_Simone Cardoso dos Santos\\Textual\\PCSH_HV662_Simone Cardoso dos Santos_REV_LYK.docx", "category": "Textual", "content_preview": "Nome da história: Eu posso dar a volta por cima\nMinibio: Simone Cardoso dos Santos nasceu em Guarulhos no ano de 1973. Ainda que precisasse lidar com a dermatite atópica, desde suas primeiras lembranças, cresceu dando risada com as amigas, numa infância feliz. Se lembra com divertimento dessa época e também dos enfrentamentos ao pai para poder ir à rua brincar. Com o passar dos anos, construiu família, se tornou mãe do Gustavo e do Erick e hoje é assistente aeroportuária. Viu sua dermatite ir e voltar diversas vezes, e descobriu com isso a importância de olhar para si, falar de seus sentimentos.\nSinopse: Simone Cardoso dos Santos tem dermatite atópica desde as primeiras memórias. Aos cinco anos já fazia tratamento e, dessa época, carrega boas lembranças: de menores preocupações com a pele e das vezes que desafiava seu pai para poder fazer o que desejava. Por alguns anos, a dermatite não afetou Simone, mas as complicações de saúde de seu ex-marido trouxeram de volta as crises. Mas também trouxeram a possibilidade de Simone conhecer mais a si e de ver que a dermatite atópica não é um obstáculo para seus sonhos.\nTAGs: dermatite atópica; infância; adolescência; casamento; filhos; terap"}, "folder_size_gb": 0.0}, "folder_size_gb": 9.035}, "PCSH_HV666_Orlando Tadeu Scolari": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV666_ED001.mp4": {"size_mb": 394.3602, "modified": "2019-02-11 13:50:24", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV666_Orlando Tadeu Scolari\\Audiovisual\\Vídeo\\Edição\\PCSH_HV666_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 213680.0, "duration": 213.68}, "PCSH_HV666_ED001_leg.mp4": {"size_mb": 254.7204, "modified": "2019-04-15 11:50:50", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV666_Orlando Tadeu Scolari\\Audiovisual\\Vídeo\\Edição\\PCSH_HV666_ED001_leg.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 213680.0, "duration": 213.68}, "folder_size_gb": 0.634}, "Íntegra": {"PCSH_HV666.mp4": {"size_mb": 6845.8509, "modified": "2018-12-18 17:03:20", g"}, "PCSH_HV666_MO004.JPG": {"size_mb": 5.1007, "modified": "2018-12-17 10:59:04", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV666_Orlando Tadeu Scolari\\Iconográfico\\Making of\\PCSH_HV666_MO004.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV666_MO004.jpg"}, "folder_size_gb": 0.021}, "folder_size_gb": 0.023}, "Textual": {"PCSH_HV666_Orlando Tadeu Scolari_edi.docx": {"size_mb": 0.0081, "modified": "2019-02-13 08:00:48", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV666_Orlando Tadeu Scolari\\Textual\\PCSH_HV666_Orlando Tadeu Scolari_edi.docx", "category": "Textual", "content_preview": "História:\nTiro de canhão em mosquito\nMinibio: \nOrlando é filho de Orlando e Ivete: do pai, guarda a lembrança do trabalhador incansável; da mãe, a mãezona que abraça tudo. Com o falecimento dela, Orlando descobriu ser portador da dermatite atópica. Em crise, sente como se o suor queimasse sua pele. Mas isso não o impediu de continuar as peladas com os amigos, que o conhecem pelo apelido de Bola.\nSinopse:\nQuando Ivete, a mãe de Orlando, descobriu estar com câncer, a família inteira sofreu com ela. Por meses, as idas e voltas do hospital para a cidade de São Paulo foram custosos para todos. Quando Ivete faleceu, não foi só a perda de uma das pessoas que mais amava que acometeu Orlando: também descobriu ali, por causa do trauma, que tinha dermatite atópica. O suor começou a queimar sua pele, a coceira começou a machucar. O homem que sempre encontrou prazer no esporte, agora, sentia dificuldade de praticar qualquer atividade física. Foram meses de diagnósticos errados e procura por ajuda médica certeira. Até que, enfim, conheceu um médico que acertou no tratamento.\nTAGs: dermatite atópica; luto; trauma; mãe; tratamento; câncer\nMinha mãe recebeu o diagnóstico: câncer. Câncer linfático."}, "PCSH_HV666_Orlando Tadeu Scolari_rev.docx": {"size_mb": 0.0479, "modified": "2019-04-15 07:10:34", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV666_Orlando Tadeu Scolari\\Textual\\PCSH_HV666_Orlando Tadeu Scolari_rev.docx", "category": "Textual", "content_preview": "Depoimento de Orlando Tadeu Scolari\nEntrevistado por Márcia Trezza\nSorocaba, 12 de dezembro de 2018\nEntrevista PSCH_HV666\nRealização: Museu da Pessoa\nRevisado e editado por: Bruno Pinho\nP/1 - Então Tadeu, nós vamos começar agora. Para começar fala seu nome completo, onde você nasceu e a data.\nR - Orlando Tadeu Scolari, dia 23 do 9 de 76, aqui em Sorocaba mesmo.\nP/1 - Qual o nome dos seus pais?\nR - Orlando Scolari e Ivete José Scolari.\nP/1 - Você pode descrever seu pai primeiro? Como é seu pai, das lembranças que você tem dele da infância.\nR - Eu tenho lembrança dele de um homem muito trabalhador. Trabalhava em uma empresa siderúrgica e normalmente ele fazia os três horários. Uma semana ele fazia das 6 às 2, uma semana das 2 às 10 e uma semana das 10 da noite as 6 da manhã. Então, algumas vezes da semana eu só via meu pai depois da escola, porque ele chegava cedo e íamos para a escola, ele acordava e a gente tinha o contato com ele à noite. Essa é a parte assim... mais na parte do meu pai trabalhador. Na parte mais de família, comigo ele era um cara legal, sempre muito atencioso, não muito com a minha irmã, também não muito com a minha mãe, mas é um cara que sempre foi um cara famíl"}, "folder_size_gb": 0.0}, "folder_size_gb": 7.466}, "PCSH_HV668_Kelly Cristina Duarte": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV668_ED001.mp4": {"size_mb": 569.5326, "modified": "2019-02-11 14:12:34", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV668_Kelly Cristina Duarte\\Audiovisual\\Vídeo\\Edição\\PCSH_HV668_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 30360 cervo\\Baixa\\PSCH_HV668_FT01.jpg", "category": "Image", "dimension": "687x519", "resolution": "687x519", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PSCH_HV668_FT01.jpg"}, "PSCH_HV668_FT02.jpg": {"size_mb": 0.5829, "modified": "2019-01-09 08:24:36", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV668_Kelly Cristina Duarte\\Iconográfico\\Acervo\\Baixa\\PSCH_HV668_FT02.jpg", "category": "Image", "dimension": "1195x1497", "resolution": "1195x1497", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PSCH_HV668_FT02.jpg"}, "PSCH_HV668_FT03.jpg": {"size_mb": 0.1423, "modified": "2019-01-09 08:25:16", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV668_Kelly Cristina Duarte\\Iconográfico\\Acervo\\Baixa\\PSCH_HV668_FT03.jpg", "category": "Image", "dimension": "597x885", "resolution": "597x885", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PSCH_HV668_FT03.jpg"}, "PSCH_HV668_FT04.jpg": {"size_mb": 0.127, "modified": "2019-01-09 08:25:50", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV668_Kelly Cristina Duarte\\Iconográfico\\Acervo\\Baixa\\PSCH_HV668_FT04.jpg", "category": "Image", "dimension": "896x598", "resolution": "896x598", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PSCH_HV668_FT04.jpg"}, "PSCH_HV668_FT05.jpg": {"size_mb": 0.1291, "modified": "2019-01-09 08:27:02", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV668_Kelly Cristina Duarte\\Iconográfico\\Acervo\\Baixa\\PSCH_HV668_FT05.jpg", "category": "Image", "dimension": "892x596", "resolution": "892x596", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PSCH_HV668_FT05.jpg"}, "PSCH_HV668_FT06.jpg": {"size_mb": 0.1786, "modified": "2019-01-09 08:27:38", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV668_Kelly Cristina Duarte\\Iconográfico\\Acervo\\Baixa\\PSCH_HV668_FT06.jpg", "category": "Image", "dimension": "898x596", "resolution": "898x596", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PSCH_HV668_FT06.jpg"}, "PSCH_HV668_FT07.jpg": {"size_mb": 0.1622, "modified": "2019-01-09 08:43:38", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV668_Kelly Cristina Duarte\\Iconográfico\\Acervo\\Baixa\\PSCH_HV668_FT07.jpg", "category": "Image", "dimension": "586x891", "resolution": "586x891", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PSCH_HV668_FT07.jpg"}, "PSCH_HV668_FT08.jpg": {"size_mb": 0.1425, "modified": "2019-01-09 08:49:06", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV668_Kelly Cristina Duarte\\Iconográfico\\Acervo\\Baixa\\PSCH_HV668_FT08.jpg", "category": "Image", "dimension": "594x889", "resolution": "594x889", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PSCH_HV668_FT08.jpg"}, "PSCH_HV668_FT09.jpg": {"size_mb": 0.0864, "modified": "2019-01-09 08:49:44", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV668_Kelly Cristina Duarte\\Iconográfico\\Acervo\\Baixa\\PSCH_HV668_FT09.jpg", "category": "Image", "dimension": "597x580", "resolution": "597x580", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PSCH_HV668_FT09.jpg"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.002}, "folder_size_gb": 0.002}, "Textual": {"PCSH_HV668_Kelly Cristina Duarte_edi.docx": {"size_mb": 0.0087, "modified": "2019-04-15 07:13:02", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV668_Kelly Cristina Duarte\\Textual\\PCSH_HV668_Kelly Cristina Duarte_edi.docx", "category": "Textual", "content_preview": "Minha vida: tudo um em um milhão\nMinibio:  \nKelly encontrou seu caminho profissional quando começou a trabalhar com crianças, como secretária de uma escola infantil. Em contato com tantos pequenos, sonhou com o seu: queria engravidar. Quase como um milagre, engravidou aos 35 anos, trazendo Débora para o mundo. Depois de traumas, desamores e dificuldades, nutre um amor incondicional pela sua filha. As lutas que vieram a seguir, serviram para estreitar o laço entre as duas e a gratidão de Kelly a Deus.\nSinopse:\nKelly conta sobre seu maior sonho: ser mãe. Apesar de sempre ouvir do médico que não seria possível, aconteceu. Um milagre, afirma Kelly. Nove meses depois, nasce Débora. Os pés tortos do primeiro ano não foram impeditivos para que a menina pudesse dar seus primeiros passos, ao lado de sua amorosa mãe. O diagnóstico que veio a seguir, de dermatite atópica, só serviu para as duas se aproximarem ainda mais, com Débora buscando colo e Kelly oferecendo todo o carinho. E, assim, nos braços uma da outra, encontraram força para vencer.\nTAGs: dermatite atópica; gravidez; amor; tratamento; parto; maternidade; superação\nHistória\nSempre sonhei em ter uma linda barriga de grávida, maravil"}, "PCSH_HV668_Kelly Cristina Duarte_rev.docx": {"size_mb": 0.0385, "modified": "2019-04-15 07:12:56", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV668_Kelly Cristina Duarte\\Textual\\PCSH_HV668_Kelly Cristina Duarte_rev.docx", "category": "Textual", "content_preview": "Depoimento de Kelly Cristina Duarte\nEntrevistada por Marcia Trezza\nSorocaba, 13 de dezembro de 2018\nEntrevista PCSH_HV668\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\nP/1 - Vai ser uma conversa, as perguntas vão ser só para te ajudar, não precisa me esperar perguntar, e quanto mais detalhes melhor. Para começar me fala seu nome completo, onde você nasceu e a data.\nR - Meu nome é Kelly Cristina Duarte, nasci em Santo André, São Paulo, nasci em 10 de junho de 1974, tenho 44 anos, hoje sou funcionária pública, trabalho no município de Votorantim, em uma escola infantil, sou secretária.\nP/1 - Faz quanto tempo que você trabalha nessa escola?\nR - 18 anos.\nP/1 - Antes você trabalhava em que?\nR - Imobiliária, desde os meus 15 anos de idade.\nP/1 - Foi seu primeiro trabalho?\nR - Não, eu ainda tinha os meus 12 anos e já ajudava meu pai no salão de cabeleireiro que ele tinha na rodoviária, lá eu ajudava ele em coisas pequenas, mas sempre gostei de estar na correria.\nP/1 - Você aprender a fazer alguma coisa de cabeleireira?\nR - Pelo contrário, não gosto nem um pouco de mexer com cabelo, eu tenho uma família toda cabeleireira, meus tios, meu pai, meu irmão, mas não.\nP/1 - Lá vo"}, "folder_size_gb": 0.0}, "folder_size_gb": 11.547}, "PCSH_HV669_Helton Mendes Fidalgo": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV669_ED001.mp4": {"size_mb": 412.2779, "modified": "2019-02-11 14:21:32", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV669_Helton Mendes Fidalgo\\Audiovisual\\Vídeo\\Edição\\PCSH_HV669_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 223623.0, "duration": 223.62}, "PCSH_HV669_ED001_leg.mp4": {"size_mb": 266.9525, "modified": "2019-04-11 12:48:20", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV669_Helton Mendes Fidalgo\\Audiovisual\\Vídeo\\Edição\\PCSH_HV669_ED001_leg.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 223623.0, "duration": 223.62}, "folder_size_gb": 0.663}, "Íntegra": {"PCSH_HV669.mp4": {"size_mb": 11062.3717, "modified": "2019-01-10 18:25:00", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV669_Helton Mendes Fidalgo\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV669.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5692187.0, "duration": 5692.19}, "folder_size_gb": 10.803}, "folder_size_gb": 11.466}, "Áudio": {"PCSH_HV669.mp3": {"size_mb": 87.0226, "modified": "2018-12-14 07:49:38", "extension": "MP3", "full_path": "D:\\Dermatite Atópica\\PCSH_HV669_Helton Mendes Fidalgo\\Audiovisual\\Áudio\\PCSH_HV669.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 5702256.0, "duration": 5702.26}, "folder_size_gb": 0.085}, "folder_size_gb": 11.551}, "Textual": {"PCSH_HV669_Helton Mendes Hidalgo_edi.docx": {"size_mb": 0.0091, "modified": "2019-04-15 07:13:28", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV669_Helton Mendes Fidalgo\\Textual\\PCSH_HV669_Helton Mendes Hidalgo_edi.docx", "category": "Textual", "content_preview": "História:\nFamília, trabalho e jiu-jitsu\nMinibio: \nHelton Mendes Hidalgo nasceu em Sorocaba, São Paulo, em junho de 1983. Filho de uma mãe séria e um pai bom de bola, quase jogador profissional, Helton cresceu aprontando e dando trabalho para os dois. Mais tarde, formou-se em Turismo e ganhou experiência na área. Com a vontade de ser empresário, voltou para a sua cidade natal para abrir um negócio que levava o nome do pai, sua grande inspiração. Mais tarde, descobriu que tinha de dermatite atópica, mas encontrou na espiritualidade como um caminho para somar a sua trajetória. \nSinopse:\nSeguindo o espiritismo, curtindo a família, o trabalho e o jiu-jitsu, Helton encontrou o caminho para manter mente, corpo e espírito alinhados e fortes para conviver com a dermatite atópica, doença que descobriu quando adulto. Helton narra como foi a descoberta, os primeiros anos lidando com a doença, as restrições alimentares, e a jornada até encontrar um médico de confiança que passou o melhor tratamento para ele.\nTAGs: dermatite atópica; alimentação; relacionamento; empresa; esporte; jiu jitsu; espiritismo \nEu sempre namorei sério. O último durou dez anos. Quase casei, quase mesmo: a gente brigou fa"}, "PCSH_HV669_Helton Mendes Hidalgo_rev.docx": {"size_mb": 0.0358, "modified": "2019-04-15 07:13:34", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV669_Helton Mendes Fidalgo\\Textual\\PCSH_HV669_Helton Mendes Hidalgo_rev.docx", "category": "Textual", "content_preview": "Depoimento de Helton Mendes Hidalgo\nEntrevistado por Marcia Trezza\nSorocaba, 13 dezembro de 2018\nEntrevista número PCSH_HV669\nRealização: Museu da Pessoa\nP/1 - Para a gente começar a entrevista, fala seu nome completo, onde você nasceu, a cidade, e que data.\nR - Meu nome é Helton Mendes Hidalgo, eu nasci em Sorocaba, dia 01 de junho de 1983.\nP/1 - Você pode falar o nome dos seus pais.\nR - Meu pai, Jesus José Martins Hidalgo, e minha mãe, Sueli Mendes Hidalgo.\nP/1 - Eles também eram de Sorocaba?\nR - Sim, aqui de Sorocaba.\nP/1 - Sempre viveram aqui?\nR - Sim.\nP/1 - Qual é a origem da sua família, do seu pai e da sua mãe?\nR - Meu pai é filho de um imigrante espanhol que fugiu da guerra, no começo do século vinte, e eles vieram para duas cidades antes de Sorocaba, Avaré, eu acho e mais alguma outra e acabaram ficando em Sorocaba e a família da minha mãe era de Minas Gerais, aqui do Brasil, mesmo, e de Minas vieram para Sorocaba.\nP/1 - O seu avô veio junto com a sua avó?\nR - Não, meu avô era espanhol e minha avó não, conheceu ela aqui.\nP/1 - E a atividade dos seus pais, o que seu pai e sua mãe fazem?\nR - Meu pai faleceu ano passado e minha mãe sempre ficou com a gente em casa, mesmo, cui"}, "folder_size_gb": 0.0}, "folder_size_gb": 11.551}, "PCSH_HV653_Marcia da Silva Moreno": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV653_ED0001.mp4": {"size_mb": 262.6708, "modified": "2018-12-18 15:39:56", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV653_Marcia da Silva Moreno\\Audiovisual\\Vídeo\\Edição\\PCSH_HV653_ED0001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 220053.0, "duration": 220.05}, "PCSH_HV653_ED0001_leg.mp4": {"size_mb": 263.5466, "modifie ": "720x556", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV653_FT05.jpg"}, "PCSH_HV653_FT06.jpg": {"size_mb": 0.0524, "modified": "2018-10-25 14:54:14", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV653_Marcia da Silva Moreno\\Iconográfico\\Acervo\\Baixa\\PCSH_HV653_FT06.jpg", "category": "Image", "dimension": "720x749", "resolution": "720x749", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV653_FT06.jpg"}, "PCSH_HV653_FT07.jpg": {"size_mb": 0.1049, "modified": "2018-10-25 14:54:12", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV653_Marcia da Silva Moreno\\Iconográfico\\Acervo\\Baixa\\PCSH_HV653_FT07.jpg", "category": "Image", "dimension": "972x1041", "resolution": "972x1041", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV653_FT07.jpg"}, "PCSH_HV653_FT08.jpg": {"size_mb": 0.1249, "modified": "2018-10-25 14:54:12", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV653_Marcia da Silva Moreno\\Iconográfico\\Acervo\\Baixa\\PCSH_HV653_FT08.jpg", "category": "Image", "dimension": "720x1280", "resolution": "720x1280", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV653_FT08.jpg"}, "PCSH_HV653_FT09.jpg": {"size_mb": 0.041, "modified": "2018-10-25 14:54:08", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV653_Marcia da Silva Moreno\\Iconográfico\\Acervo\\Baixa\\PCSH_HV653_FT09.jpg", "category": "Image", "dimension": "555x960", "resolution": "555x960", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV653_FT09.jpg"}, "PCSH_HV653_FT10.jpg": {"size_mb": 0.0762, "modified": "2018-10-25 14:54:10", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV653_Marcia da Silva Moreno\\Iconográfico\\Acervo\\Baixa\\PCSH_HV653_FT10.jpg", "category": "Image", "dimension": "720x720", "resolution": "720x720", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV653_FT10.jpg"}, "folder_size_gb": 0.001}, "folder_size_gb": 0.001}, "folder_size_gb": 0.011}, "Textual": {"PCSH_HV653_Marcia Moreno_edi.docx": {"size_mb": 0.0123, "modified": "2019-04-15 06:55:14", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV653_Marcia da Silva Moreno\\Textual\\PCSH_HV653_Marcia Moreno_edi.docx", "category": "Textual", "content_preview": "Nome da história\nSomos muito mais que um corpo\nMinibio: Da infância, Marcia não carrega um sentimento de nostalgia. As memórias se misturam entre brincadeiras, a criação com a avó e um distanciamento da mãe. Um “vai com a mãe e ficar com a vó” que a deixava perdida. A obesidade, um quadro de anorexia e bulimia também marcaram. Foram tempos duros, mas tempos superados. Cresceu, viveu, construiu família. Encontrou no amor do filho e do marido força para continuar. Encontrou no fundo de si uma capacidade de se aceitar, olhar o lado bom e viver. \nSinopse\nMárcia Moreno descobriu que tinha dermatite atópica da pior maneira possível: depois de quase morrer em um acidente de carro. Depois disso, vivenciou outras tantas quase mortes. De desesperança, depressão e a vontade de dar um basta em tudo. Nas feridas que coçava. Mas encontrou no amor de seu filho e de seu marido a vontade de continuar. No médico que a escutou e sugeriu outros caminhos. E no grupo que criou no Facebook e se tornou um espaço de compartilhar dores e conquistas. Hoje, só quer viver a vida de outra forma, olhando o lado bom das crises.\nTAGs: dermatite atópica; acidente; sus; filho; suícidio; facebook; esperança\nHistória"}, "PCSH_HV653_Marcia Moreno_rev.docx": {"size_mb": 0.0504, "modified": "2019-04-15 06:55:22", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV653_Marcia da Silva Moreno\\Textual\\PCSH_HV653_Marcia Moreno_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História\nDepoimento de Márcia da Silva Moreno\nEntrevistada por Denise Cook\nPrimavera do Leste, 29 de junho de 2018\nEntrevista de número PCSH_HV653\nRevisado e editado por Bruno Pinho\nP/1 - Márcia, muito obrigada por estar aqui contando a sua história para nós. Seja bem-vinda. Vamos falar de que dia, ano e onde você nasceu.\nR - Eu nasci no dia dois de outubro de 1991 na cidade de Janiópolis, Paraná, 22h40 para ser mais precisa e passei a minha infância toda lá. Até os 17 anos eu morei nessa cidade e depois eu fui para outra cidade, maior: Arapongas, no Paraná. \nP/1 - E você sabe alguma coisa sobre o dia do seu nascimento? Seus pais te contaram?\nR - Na verdade, assim, minha família teve muita turbulência. Foi um momento de muitos conflitos. Eu não vou dizer para você que o meu aniversário foi um momento de celebração, aquela coisa de acolhimento, realmente. Minha mãe e meu pai tiveram muitos conflitos familiares. Minha mãe é de uma origem muito humilde. Ela é neta de indígenas e o meu pai é italiano. A família do meu pai nunca aceitou a minha mãe, mas eles se casaram e em pouco menos de um ano ela engravidou de mim. E, para a minha família, aquilo foi uma bomba, por"}, "folder_size_gb": 0.0}, "folder_size_gb": 14.025}, "folder_size_gb": 272.429}, "Metrô 50 anos": {"MET_HV01": {"Audiovisual": {"Vídeo": {"Edição": {"MET_HV01_ED001.mp4": {"size_mb": 209.941, "modified": "2018-06-21 12:40:14", "extension": "MP4", "full_path": "D:\\Metrô 50 anos\\MET_HV01\\Audiovisual\\Vídeo\\Edição\\MET_HV01_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 172939.0, "duration": 172.94}, "folder_size_gb": 0.205}, "Íntegra": {"MET_HV01.mp4": {"size_mb": 9915.3354, "modified": "2018-05-22 23:20:30", "extension": "MP4", "full_path": "D:\\Metrô 50 anos\\MET_HV01\\Audiovisual\\Vídeo\\Íntegra\\MET_HV01.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AV ra Filho_edi.docx", "category": "Textual", "content_preview": "Nome da história\nLaurindo, um \"Forrest Gump\" do Metrô\nMinibio\nLaurindo Martins Junqueira Filho, nasceu na cidade de Santos, São Paulo. Estudou Física Nuclear na USP. Entrou no Metrô na década de 70, foi Presidente da CET de Santos, Secretário dos Transportes de Campinas, fez parte da ANTP (Associação Nacional de Transportes Públicos) e hoje está aposentado do Metrô mas continua prestando serviços de consultoria para diversas empresas.\nSinopse\nEssa é a história de Laurindo, atuante no movimento estudantil, foi preso no início da década de 70 e da prisão ouviu barulhos estranhos e soube que estavam construindo um túnel de Metrô. Já na empresa, participou da criação dos sistemas do Centro de Controle Operacional (CCO) que se tornaram um marco na questão de segurança em todo o Brasil e no mundo. Essa tecnologia foi utilizada em outros segmentos, além dos transportes. Desde então, o amor pelo Metrô entrou em sua vida e permanece até hoje.\nTAGs\nmetrô\ntecnologia\nhospital\nferrovia\nprisão\nonu\nmetrô\n50 anos metrô de sp\nvagão\ntransiberiana física\nsistemas de controle\nequador\nEdição\n“A origem ferroviária tá aí, meu avô foi chefe de trem naquela que é considerada a maior ferrovia do mundo, que"}, "MET_HV1_Laurindo Martins Junqueira Filho_rev.docx": {"size_mb": 0.0413, "modified": "2019-02-21 05:27:04", "extension": "DOCX", "full_path": "D:\\Metrô 50 anos\\MET_HV01\\Textual\\MET_HV1_Laurindo Martins Junqueira Filho_rev.docx", "category": "Textual", "content_preview": "Depoimento de Laurindo Martins Junqueira Filho\nEntrevistado por Nanci Souza do Nascimento e Evandro Silvério\nSão Paulo, 22 de maio de 2018\nEntrevista número MET_HV01\nRealização: Museu da Pessoa\nP/1 - Bom dia.\nR - Bom dia.\nP/1 - Fala pra mim seu nome completo, nome de guerra no metrô, local e data de nascimento.\nR - Eu nasci em Santos em 1945, durante o período da guerra, meu pai era militar e ele comandava um destacamento naquela época, voltado para proteger o porto e os sistemas de eletricidade de (R Border) [00:00:54]. Meu nome é Laurindo Martins Junqueira Filho. Eu nasci em Santos por acaso. Como meu pai era militar ele se deslocava pelo litoral brasileiro e foi essa a razão.\nP/1 - E no metrô, você é conhecido como?\nR - Laurindo. O nome de guerra foi esse, desde o começo. Não tinha nenhum outro com esse nome, só meu pai mesmo.\nP/1 - Antes de entrar propriamente na sua história, conta mais um pouquinho sobre a origem da sua família.\nR - É interessante, porque Junqueira a origem é portuguesa. Eles chegaram no Brasil em 1759, mais ou menos, um casal, e se dirigiram pra região de Poços de Caldas para abrir fazendas, completamente mata bruta, virgem. E esse casal, nós fizemos um leva"}, "folder_size_gb": 0.0}, "folder_size_gb": 10.013}, "MET_HV02": {"Audiovisual": {"Vídeo": {"Edição": {"MET_HV02_ED001.mp4": {"size_mb": 197.8, "modified": "2018-07-15 22:32:10", "extension": "MP4", "full_path": "D:\\Metrô 50 anos\\MET_HV02\\Audiovisual\\Vídeo\\Edição\\MET_HV02_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 162996.0, "duration": 163.0}, "folder_size_gb": 0.193}, "Íntegra": {"MET_HV02.mp4": {"size_mb": 9048.7768, "modified": "2018-05-22 23:51:26", "extension": "MP4", "full_path": "D:\\Metrô 50 anos\\MET_HV02\\Audiovisual\\Vídeo\\Íntegra\\MET_HV02.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7352712.0, "duration": 7352.71}, "folder_size_gb": 8.837}, "folder_size_gb": 9.03}, "Áudio": {"MET_HV02.mp3": {"size_mb": 112.2082, "modified": "2018-05-25 09:30:58", "extension": "MP3", "full_path": "D:\\Metrô 50 anos\\MET_HV02\\Audiovisual\\Áudio\\MET_HV02.mp3", "category": "Audio", "audio_channels": "Stereo"
