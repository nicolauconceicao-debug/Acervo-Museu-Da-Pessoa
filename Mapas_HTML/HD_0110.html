", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV07_MO001.jpg"}, "SAN_HV07_MO002.JPG": {"size_mb": 6.3489, "modified": "2019-02-26 07:04:46", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV07_Pius Hornstein\\Iconográfico\\Making Of\\SAN_HV07_MO002.JPG", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV07_MO002.jpg"}, "folder_size_gb": 0.013}, "folder_size_gb": 0.013}, "Textual": {"SAN_HV07_Pius Hornstein_ed.docx": {"size_mb": 0.0236, "modified": "2019-08-19 14:52:14", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV07_Pius Hornstein\\Textual\\SAN_HV07_Pius Hornstein_ed.docx", "category": "Textual", "content_preview": "Título da história\nOrgulho do passado, fome de futuro\nQuero fazer a diferença na saúde\nMinibio\nPius Hornstein nasceu em 1976 na Basileia, na Suíça. Quando criança, a conversa que mais ouvia entre seus pais era sobre a loja da família que, mais tarde, seria convertida em uma farmácia – o tino para os negócios, portanto, já vinha sendo despertado desde a infância. De oceanógrafo à la Jacques Cousteau, profissão com que sonhava quando pequeno, decidiu cursar Farmácia. E deu início, na Suíça, a uma bem-sucedida carreira na indústria farmacêutica Sanofi, que o levaria a viver em diversos lugares do mundo: na França, na Alemanha, na Turquia e, enfim, no Brasil, onde assumiu o posto de diretor-geral do grupo. Com duas filhas gêmeas, ele sonha em construir, com seu trabalho, um futuro melhor para as crianças e para o país.    \nSinopse\nEm seu depoimento, Pius Hornstein retorna à infância na Suíça para se lembrar da escola, de seu antigo sonho de ser oceanógrafo como o ídolo Jacques Cousteau e do tino para os negócios que seus pais, como empreendedores, já despertavam nele quando pequeno. No entanto, como ele mesmo afirma, é bom ter orgulho do passado, mas mais importante é ter “fome” de con"}, "SAN_HV07_Pius Hornstein_rev.docx": {"size_mb": 0.0541, "modified": "2019-08-19 14:52:20", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV07_Pius Hornstein\\Textual\\SAN_HV07_Pius Hornstein_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de Pius Hornstein\nEntrevistado por Denise Cooke e Maurício Rodrigues \nSão Paulo, 22/10/2018\nRealização Museu da Pessoa\nSAN_HV07_Pius Hornstein\nTranscrito por ???\nRevisado e editado por Viviane Aguiar\nP/1 – Boa tarde, Pius, muito obrigada por estar aqui, conversando com a gente.\nR – Boa tarde, Denise.\nP/1 – Vamos começar: fala pra gente o seu nome, local e data de nascimento.\nR – Sou Pius Hornstein, sou suíço. Nasci na Basileia, na Suíça, em julho de 1976.\nP/1 – Conta pra gente um pouco a história dos seus pais. Qual o nome deles e o que eles faziam?\nR – Meu pai se chama Max, e a minha mãe (Heidi?), um nome bem suíço. Eles são pessoas do varejo e da saúde agora, mas não da farmácia, tiveram outros negócios antes das farmácias, que cuidavam também da saúde. Era um negócio pequeno e ainda temos, hoje esse negócio é uma farmácia. Então, eles sempre foram empreendedores.\nP/1 – E qual é a origem dos seus pais?\nR – Suíços. Um da parte da Suíça Oriental e um da Suíça mais no norte, mais perto da Alemanha.\nP/1 – E que lembranças você tem da sua infância?\nR – Sempre tive algo ligado, pela história dos meus pais, sempre ligado com negócios, porque, se você t"}, "folder_size_gb": 0.0}, "folder_size_gb": 57.422}, "SAN_HV08_Virginia Tavares": {"Audiovisual": {"Áudio": {"SAN_HV08.mp3": {"size_mb": 83.4682, "modified": "2018-11-02 23:34:48", "extension": "MP3", "full_path": "D:\\Sanofi 100 anos\\SAN_HV08_Virginia Tavares\\Audiovisual\\Áudio\\SAN_HV08.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 5469024.0, "duration": 5469.02}, "folder_size_gb": 0.082}, "Vídeo": {"Íntegra": {"SAN_HV08.mp4": {"size_mb": 2081.4952, "modified": "2018-11-03 04:36:48", "exte n": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV08_Virginia Tavares\\Iconográfico\\Making Of\\SAN_HV08_MO002.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV08_MO002.jpg"}, "folder_size_gb": 0.01}, "folder_size_gb": 0.01}, "Textual": {"SAN_HV08_Virginia Tavares_ed.docx": {"size_mb": 0.0228, "modified": "2019-08-19 14:52:32", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV08_Virginia Tavares\\Textual\\SAN_HV08_Virginia Tavares_ed.docx", "category": "Textual", "content_preview": "Título da história\nSonhos realizados\nLembranças de veraneio\nMinibio\nCom pais e avós pernambucanos, Virgínia Tavares nasceu na cidade de São Paulo, mas teve o privilégio de, quando criança, “veranear” todos os anos nas praias do Recife – uma delas, em particular, a Ponta de Pedras marcou sua história por ter sido o local em que seus pais se conheceram e onde ela mesma deu seu primeiro beijo. Nascida em 1979, Virgínia gostava de estudar e se inspirou nas profissões dos pais para construir sua própria carreira: como a mãe, formou-se em Direito; como o pai, médico, foi trabalhar na área de saúde, no setor jurídico e depois nas finanças da indústria farmacêutica Sanofi. Com uma sólida trajetória profissional, casada e mãe de dois filhos, Virgínia se sente realizada em todos os sentidos de sua vida.\nSinopse\nAo ser questionada sobre seus sonhos, a paulistana Virgínia Tavares foi clara: se sente tão realizada que prefere agradecer a pedir novas conquistas para sua vida. Enquanto conta sua história, ela vai revelando sua bem-sucedida trajetória. Lembra-se da infância em São Paulo e, principalmente, dos períodos em que, todos os anos, “veraneava” nas praias de Pernambuco, terra natal de seus"}, "SAN_HV08_Virginia Tavares_rev.docx": {"size_mb": 0.0592, "modified": "2019-08-19 14:52:38", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV08_Virginia Tavares\\Textual\\SAN_HV08_Virginia Tavares_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de Virgínia Tavares\nEntrevistada por Maurício Rodrigues \nSão Paulo, ??/??/2018 \nRealização Museu da Pessoa \nSAN_HV08_Virginia Tavares\nTranscrito por Mariana Wolff\nRevisado e editado por Viviane Aguiar\nP/1 – Virgínia, boa tarde!\nR – Boa tarde.\nP/1 – Antes de mais nada, em nome do Museu da Pessoa e da Sanofi, eu queria te agradecer por ter aceitado participar e dar essa entrevista aqui pra gente. E, pra gente começar, eu queria que você se apresentasse dizendo o seu nome completo, a data e o local do seu nascimento.\nR – Meu nome é Virgínia Tavares, na verdade, o nome completo é Virgínia Corrêa Rabelo Tavares, conhecida como Virgínia Tavares. Eu nasci aqui em São Paulo mesmo, dia 25 de junho de 1979.\nP/1 – E você sabe dizer o porquê de os seus pais te batizaram dessa forma, como Virgínia? \nR – Por que os meus pais...? Eu acho que a minha mãe tinha um prima que ela achava o nome muito bonito. Acho que é isso.\nP/1 – E você pode dizer o nome dos seus pais?\nR – Carlos Roberto Vanderlei Tavares e Verônica Maria Corrêa Rabelo Tavares.\nP/1 – E você sabe como é que eles se conheceram? Como que teve origem a sua família?\nR – Olha, meus pais são de Recife e el"}, "folder_size_gb": 0.0}, "folder_size_gb": 63.584}, "SAN_HV09_Luciana Schuetze": {"Audiovisual": {"Áudio": {"SAN_HV09.mp3": {"size_mb": 116.6783, "modified": "2018-11-03 00:09:28", "extension": "MP3", "full_path": "D:\\Sanofi 100 anos\\SAN_HV09_Luciana Schuetze\\Audiovisual\\Áudio\\SAN_HV09.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 7645704.0, "duration": 7645.7}, "folder_size_gb": 0.114}, "Vídeo": {"Íntegra": {"SAN_HV09.mp4": {"size_mb": 2909.2734, "modified": "2018-11-04 08:22:06", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV09_Luciana Schuetze\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV09.mp4", "category": "Vide 06.jpg": {"size_mb": 2.0105, "modified": "2021-09-29 08:26:22", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV09_Luciana Schuetze\\Iconográfico\\Acervo\\SAN_HV009_FT006.jpg", "category": "Image", "dimension": "3624x2472", "resolution": "3624x2472", "color_mode": "RGB", "dpi": "599 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV009_FT006.jpg"}, "SAN_HV009_FT007.jpg": {"size_mb": 2.0611, "modified": "2021-09-29 08:27:12", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV09_Luciana Schuetze\\Iconográfico\\Acervo\\SAN_HV009_FT007.jpg", "category": "Image", "dimension": "2440x3640", "resolution": "2440x3640", "color_mode": "RGB", "dpi": "599 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV009_FT007.jpg"}, "SAN_HV009_FT008.jpg": {"size_mb": 2.0604, "modified": "2021-09-29 08:06:18", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV09_Luciana Schuetze\\Iconográfico\\Acervo\\SAN_HV009_FT008.jpg", "category": "Image", "dimension": "3640x2576", "resolution": "3640x2576", "color_mode": "RGB", "dpi": "599 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV009_FT008.jpg"}, "SAN_HV009_FT009A.jpg": {"size_mb": 8.3877, "modified": "2021-09-29 08:18:10", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV09_Luciana Schuetze\\Iconográfico\\Acervo\\SAN_HV009_FT009A.jpg", "category": "Image", "dimension": "6992x4864", "resolution": "6992x4864", "color_mode": "RGB", "dpi": "599 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV009_FT009A.jpg"}, "SAN_HV009_FT009B.jpg": {"size_mb": 8.3105, "modified": "2021-09-29 08:18:22", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV09_Luciana Schuetze\\Iconográfico\\Acervo\\SAN_HV009_FT009B.jpg", "category": "Image", "dimension": "6992x4808", "resolution": "6992x4808", "color_mode": "RGB", "dpi": "599 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV009_FT009B.jpg"}, "SAN_HV009_FT009C.jpg": {"size_mb": 7.6844, "modified": "2021-09-29 08:18:44", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV09_Luciana Schuetze\\Iconográfico\\Acervo\\SAN_HV009_FT009C.jpg", "category": "Image", "dimension": "6992x4800", "resolution": "6992x4800", "color_mode": "RGB", "dpi": "599 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV009_FT009C.jpg"}, "folder_size_gb": 0.049}, "folder_size_gb": 0.059}, "Textual": {"SAN_HV09_Luciana Schuetze_ed.docx": {"size_mb": 0.0254, "modified": "2019-08-19 14:52:58", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV09_Luciana Schuetze\\Textual\\SAN_HV09_Luciana Schuetze_ed.docx", "category": "Textual", "content_preview": "Título da história\nOtimismo contagiante\nEspírito esportivo\nFérias no ex-hotel Picaré\nMinibio\nLuciana Schuetze nasceu na cidade de São Paulo, em 1973, mas passou a maior parte da infância vivendo em Ubatuba, no litoral. É de lá que ela guarda suas melhores recordações, como a ida para a escola de biquíni por baixo do uniforme, as férias no hotel desativado do avô, os aniversários comemorados à beira-mar. O intenso contato com a natureza a levou a escolher a profissão de engenheira química: o que ela queria era transformar o lixo e contribuir com a preservação do meio ambiente. Foi estagiar na indústria farmacêutica que hoje corresponde ao grupo Sanofi e, de lá, nunca mais saiu. Como líder do setor de segurança, ela se sente realizada por implantar ações ligadas não só à conservação do ambiente, mas também à qualidade de vida das pessoas. Mãe de dois filhos gêmeos e moradora de Campinas, ela ainda se dedica aos esportes: faz triatlo, corrida de aventura, travessias a nado... Alegre e otimista, Luciana não para. \nSinopse\nA alegria e o otimismo de Luciana Schuetze, que hoje contagiam todos em seu trabalho, vêm desde sua infância. Empolgada, ela se recorda do tempo em que morava em uma"}, "SAN_HV09_Luciana Schuetze_rev.docx": {"size_mb": 0.0998, "modified": "2019-08-19 14:53:02", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV09_Luciana Schuetze\\Textual\\SAN_HV09_Luciana Schuetze_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de Luciana Schuetze\nEntrevistado por ???\nSão Paulo, ??/??/2018 \nRealização Museu da Pessoa \nSAN_HV09_Luciana Schuetze\nTranscrito por Mariana Wolff\nRevisado e editado por Viviane Aguiar\nP/1 – Luciana, muito bom dia. Antes de mais nada, eu queria te agradecer pela sua participação e por você ter topado vir aqui para compartilhar a sua história em nome do Museu e da Sanofi. E, pra iniciar, eu queria que você se apresentasse dizendo o seu nome completo, a data e o local do seu nascimento.\nR – Obrigada. Bom dia também. Eu tô muito contente de estar aqui e poder compartilhar um pouquinho da história que eu vivi aí nesses anos todos. Eu sou Luciana Schuetze, nasci em São Paulo em 30 de novembro de 1973.\nP/1 – E quais os nomes dos seus pais?\nR – Meus pais chamam Ubirajara e Sônia. Minha avó colocou o nome no meu pai de Ubirajara, minha família toda é alemã, pelo meu sobrenome, e meu pai nasceu bem na época da guerra, 43, 42, então, a minha avó quis disfarçar. Meu pai é um loiro de olho azul e chama Ubirajara (risos). Ela pôs o nome de índio que era para disfarçar, não adiantou nada, é um loirão de olho azul. Então, é o Bira e a Sônia, são os meus pais.\nP/"}, "folder_size_gb": 0.0}, "folder_size_gb": 88.997}, "SAN_HV10_Hubert Guarino": {"Audiovisual": {"Áudio": {"SAN_HV10.mp3": {"size_mb": 89.6846, "modified": "2018-11-03 00:29:40", "extension": "MP3", "full_path": "D:\\Sanofi 100 anos\\SAN_HV10_Hubert Guarino\\Audiovisual\\Áudio\\SAN_HV10.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 5876424.0, "duration": 5876.42}, "folder_size_gb": 0.088}, "Vídeo": {"Íntegra": {"SAN_HV10.mp4": {"size_mb": 4199.6948, "modified": "2018-11-10 06:54:46", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV10_Hubert Guarino\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV10.mp4", "category": "Video", "dimension": "3840x2160", "a 14:53:08", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV10_Hubert Guarino\\Textual\\SAN_HV10_Hubert Guarino_ed.docx", "category": "Textual", "content_preview": "Título da história\n“Caramba, eu não sou mais francês!” \nA invenção da campanha da gripe\nMinibio\nNascido na França, em 1966, Hubert Guarino teve de se mudar, aos dez anos de idade, para o país onde o pai coordenaria uma filial da empresa em que era funcionário: o Brasil. A transição para o Rio de Janeiro não foi fácil, mas logo ele se “acariocou”. Ainda retornou para a França, para cursar a faculdade de Administração, mas percebeu que sua vida já havia criado raízes aqui. De volta, estabeleceu-se em São Paulo, onde passou a trabalhar na indústria farmacêutica que se tornaria o Grupo Sanofi. Com uma clara tendência à liderança, galgou cargos importantes na empresa, como aquele que permitiu a criação da campanha de vacinação contra a gripe, que ganhou a atenção dos setores públicos e, em pouco tempo, passou a ter abrangência nacional.\nSinopse\nO francês Hubert Guarino conta ter recebido com espanto a notícia de que, aos dez anos de idade, em 1977, teria de se mudar com a família para o Rio de Janeiro, no Brasil. De tão drástica, essa transição representou, para ele, um segundo nascimento: teve de aprender uma nova língua e a lidar com uma cultura completamente diferente. Acabou, contud"}, "SAN_HV10_Hubert Guarino_rev.docx": {"size_mb": 0.0663, "modified": "2019-08-19 14:53:16", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV10_Hubert Guarino\\Textual\\SAN_HV10_Hubert Guarino_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de Hubert Guarino\nEntrevistado por ???\nSão Paulo, ??/??/2018 \nRealização Museu da Pessoa \nSAN_HV10_Hubert Guarino\nTranscrito por Mariana Wolff\nRevisado e editado por Viviane Aguiar\nP/1 – Hubert, boa tarde. Em nome do Museu da Pessoa e da Sanofi, queria agradecer a sua participação, por ter aceitado. E, pra gente iniciar, eu queria que você se apresentasse dizendo o seu nome completo, a data e o local do seu nascimento.\nR – Eu que agradeço, Maurício, pela dedicação de tentar resgatar todos os elementos que são chaves da história da companhia. Meu nome é Hubert Guarino, eu tenho 52 anos, tenho 26 anos de Sanofi, do Grupo Sanofi, e eu nasci em 1966, em Boulogne-Billancourt, em Paris.\nP/1 – E quais os nomes dos seus pais?\nR – Mario Guarino e Françoise Marie Desjardins Guarino.\nP/1 – E você pode dizer um pouco da história da sua família, como que se constituiu, como que se conheceram os seus pais?\nR – Meus pais se conheceram (risos), pelo que eu soube, eles se conheceram em Paris. Meu pai era filho de franceses que nasceram na Argélia, numa colônia francesa na época, e ele conheceu a minha mãe em Paris, ele estava estudando em Paris. E a minha mãe era"}, "folder_size_gb": 0.0}, "folder_size_gb": 116.494}, "SAN_HV11_Nelson Mussolini": {"Audiovisual": {"Áudio": {"SAN_HV11.mp3": {"size_mb": 67.5179, "modified": "2018-11-03 00:35:58", "extension": "MP3", "full_path": "D:\\Sanofi 100 anos\\SAN_HV11_Nelson Mussolini\\Audiovisual\\Áudio\\SAN_HV11.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 4424040.0, "duration": 4424.04}, "folder_size_gb": 0.066}, "Vídeo": {"Íntegra": {"SAN_HV011.mp4": {"size_mb": 1683.6666, "modified": "2018-11-12 04:16:34", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV11_Nelson Mussolini\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV011.mp4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4423986.0, "duration": 4423.99}, "SAN_HV011": {"SAN_HV11 (1).MP4": {"size_mb": 1535.6182, "modified": "2016-08-05 10:47:50", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV11_Nelson Mussolini\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV011\\SAN_HV11 (1).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 133133.0, "duration": 133.13}, "SAN_HV11 (2).MP4": {"size_mb": 49118.4799, "modified": "2016-08-05 10:50:22", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV11_Nelson Mussolini\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV011\\SAN_HV11 (2).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4259255.0, "duration": 4259.26}, "SAN_HV11 (3).MP4": {"size_mb": 580.96, "modified": "2016-08-05 12:01:22", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV11_Nelson Mussolini\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV011\\SAN_HV11 (3).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 50050.0, "duration": 50.05}, "folder_size_gb": 50.034}, "folder_size_gb": 51.678}, "folder_size_gb": 51.678}, "folder_size_gb": 51.744}, "Iconográfico": {"Making Of": {"SAN_HV11_MO001.JPG": {"size_mb": 6.8482, "modified": "2019-02-26 07:09:38", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV11_Nelson Mussolini\\Iconográfico\\Making Of\\SAN_HV11_MO001.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV11_MO001.jpg"}, "SAN_HV11_MO002.JPG": {"size_mb": 5.9861, "modified": "2019-02-26 07:10:04", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV11_Nelson Mussolini\\Iconográfico\\Making Of\\SAN_HV11_MO002.JPG", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV11_MO002.jpg"}, "folder_size_gb": 0.013}, "folder_size_gb": 0.013}, "Textual": {"SAN_HV11_Nelson Augusto Mussolini_ed.docx": {"size_mb": 0.0215, "modified": "2019-08-19 14:53:32", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV11_Nelson Mussolini\\Textual\\SAN_HV11_Nelson Augusto Mussolini_ed.docx", "category": "Textual", "content_preview": "Título da história\nDefensor dos frascos e comprimidos\nMinibio\nNatural de São Paulo, Nelson Augusto Mussolini nasceu em 1958 em uma família de pai empresário e corretor de imóveis e mãe poetisa e professora. Na infância, passava férias tranquilas em Santa Rita do Passa Quatro, terra natal da mãe, mas sempre preferiu os ares da cidade grande ao “ar puro” do interior. Fez faculdade de Direito e, quando ainda era estudante, deu início àquela que seria uma longa carreira na área farmacêutica. Liderou o setor jurídico da Fontoura Wyeth (hoje Pfizer), da Novartis, da Eurofarma e trabalhou em inúmeras entidades associativas, inclusive o Sindicato da Indústria de Produtos Farmacêuticos do Estado de São Paulo, no qual atua como presidente executivo. Casado e com dois filhos, orgulha-se de sua função, por meio da qual pode “vender” saúde em caixinhas de remédio. \nSinopse\nA frase que dá título a esta história é a que os dois filhos do paulista Nelson Augusto Mussolini usam para descrever o pai, que fez da profissão de advogado no setor de indústrias farmacêuticas sua grande paixão. Em seu depoimento, Nelson se lembra da graduação em Direito, que cursou na faculdade Mackenzie, em São Paulo, e d"}, "SAN_HV11_Nelson Augusto Mussolini_rev.docx": {"size_mb": 0.0503, "modified": "2019-08-19 14:53:28", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV11_Nelson Mussolini\\Textual\\SAN_HV11_Nelson Augusto Mussolini_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de Nelson Augusto Mussolini\nEntrevistado por ???\nSão Paulo, ??/??/2018 \nRealização Museu da Pessoa \nTranscrito por Liliane Custódio\nRevisado e editado por Viviane Aguiar\nP/1 – Seu Nelson, bom dia.\nR – Bom dia.\nP/1 – Obrigada por ter recebido a gente hoje. E, para começar, seu nome completo?\nR – Nelson Augusto Mussolini.\nP/1 – Local e data de nascimento?\nR – 2 de março de 1958, São Paulo, capital.\nP/1 – E o senhor sabe por que seus pais te deram este nome?\nR – Então, sei. Sei. O meu pai gostava de um almirante inglês, que se chamava Almirante Nelson. Augusto pelos Augustus de Roma. E Mussolini, que é o sobrenome da minha família.\nP/1 – E os seus pais contaram como foi o dia do seu nascimento?\nR – Não. Quer dizer, devem ter contato, mas eu não lembro mais. Já tenho 60 anos, então, fica mais difícil.\nP/1 – E, falando nos seus pais, qual o nome deles?\nR – Gilson, o meu pai, já falecido, e Maria Enid Mussolini, minha mãe, que ainda está viva, tem 91 anos.\nP/1 – E fale um pouco sobre eles. O que eles faziam, como eles são?\nR – Então, meu pai era empresário, ele trabalhava também no ramo imobiliário, como corretor, fez 500 mil coisas diferentes na vida."}, "folder_size_gb": 0.0}, "folder_size_gb": 51.757}, "SAN_HV12_Renato Kfouri": {"Audiovisual": {"Áudio": {"SAN_HV12.mp3": {"size_mb": 34.5676, "modified": "2018-11-03 01:03:36", "extension": "MP3", "full_path": "D:\\Sanofi 100 anos\\SAN_HV12_Renato Kfouri\\Audiovisual\\Áudio\\SAN_HV12.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 2264832.0, "duration": 2264.83}, "folder_size_gb": 0.034}, "Vídeo": {"Íntegra": {"SAN_HV12.mp4": {"size_mb": 867.6359, "modified": "2018-11-12 16:37:14", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV12_Renato Kfouri\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV12.mp4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 2264763.0, "duration": 2264.76}, "SAN_HV012": {"SAN_HV12 (1).MP4": {"size_mb": 159.1085, "modified": "2016-08-05 14:13:34", "extensio a\nInfectologista sem querer\nSumidade em vacinas\nVestibular com catapora\nMinibio\nRenato Ávila Kfouri nasceu em 1964 da segunda gestação de sua mãe – da primeira, ela havia tido gêmeos, algo que, aliás, descobrira apenas durante o parto. Natural de São Paulo, Renato nutria o desejo de se tornar médico desde criança. E assim foi. Estudou Medicina na Faculdade de Ciências Médicas de Santos, para onde se mudou durante o longo curso. Optou pela especialização em pediatria e em neonatologia e, já de volta à capital, trabalhou em hospitais e em um consultório próprio até ter a ideia de criar um centro de vacinação. Aí, tinha início sua segunda e, desta vez, inesperada especialização. Tornou-se uma sumidade em infectologia, fundou a Sociedade Brasileira de Imunizações e passou a integrar diversas outras entidades, locais e nacionais. Casado, com duas filhas, ainda sonha com uma maior democratização das vacinas para toda a sociedade.   \nSinopse\nDesde pequeno, o paulistano Renato Ávila Kfouri sabia que seria médico. Ele conta que, no dia do vestibular, uma crise de catapora e febre alta quase atrapalhou o início de seus estudos. Mesmo debilitado, no entanto, Renato passou dir"}, "SAN_HV12_Renato Kfouri_rev.docx": {"size_mb": 0.0415, "modified": "2019-08-19 14:53:54", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV12_Renato Kfouri\\Textual\\SAN_HV12_Renato Kfouri_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de Renato Kfouri\nEntrevistado por Carolina Grohmann\nSão Paulo, ??/??/2018 \nRealização Museu da Pessoa \nSAN_HV12_Renato Kfouri\nTranscrito por Mariana Wolff\nRevisado e editado por Viviane Aguiar\nP/1 – Doutor, bom dia.\nR – Bom dia.\nP/1 – Obrigada por receber a gente aqui.\nR – É um prazer sempre.\nP/1 – Pra começar, seu nome completo.\nR – Renato de Ávila Kfouri.\nP/1 – Local e a data de nascimento.\nR – Nasci em São Paulo, 29 de dezembro de 1964.\nP/1 – E o senhor sabe por que os seus pais te deram esse nome, Doutor?\nR – Sabe que eu não sei? Essa é uma pergunta que eu já fiz para a minha mãe, na verdade, eles estavam esperando uma menina, esperando a Rita, acho que é porque é uma semelhança entre Rita e Renata e Renato. Acho que deve ter sido por aí, eles não souberam me responder, mas eles tiveram gêmeos, um casal de gêmeos de meninos antes de mim. Daí, quando eu nasci, ainda tentando menina, veio o Renato, esperando a Rita, deve ter sido por aí a explicação. \nP/1 – E os seus pais contaram a história de como foi o seu nascimento?\nR – Contaram. Eu nasci muito grande. Na verdade, a história dos nascimentos da minha família foram partos hospitalares, que mu"}, "folder_size_gb": 0.0}, "folder_size_gb": 26.591}, "SAN_HV13_José Coelho": {"Audiovisual": {"Áudio": {"SAN_HV13_V1.mp3": {"size_mb": 183.5074, "modified": "2018-11-03 01:13:24", "extension": "MP3", "full_path": "D:\\Sanofi 100 anos\\SAN_HV13_José Coelho\\Audiovisual\\Áudio\\SAN_HV13_V1.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 12025080.0, "duration": 12025.08}, "SAN_HV13_V2.mp3": {"size_mb": 183.5074, "modified": "2018-12-05 04:35:36", "extension": "MP3", "full_path": "D:\\Sanofi 100 anos\\SAN_HV13_José Coelho\\Audiovisual\\Áudio\\SAN_HV13_V2.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 12025080.0, "duration": 12025.08}, "folder_size_gb": 0.358}, "Vídeo": {"Íntegra": {"SAN_HV13.mp4": {"size_mb": 4575.6701, "modified": "2018-11-12 15:01:22", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV13_José Coelho\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV13.mp4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 12025013.0, "duration": 12025.01}, "SAN_HV013": {"SAN_HV13 (1).MP4": {"size_mb": 230.5723, "modified": "2016-08-05 17:56:32", "extension": "MP4", "full_path": nográfico\\Making Of\\SAN_HV13_MO002.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV13_MO002.jpg"}, "folder_size_gb": 0.011}, "folder_size_gb": 0.011}, "Textual": {"SAN_HV13_José Coelho_ed.docx": {"size_mb": 0.0245, "modified": "2019-08-19 14:54:18", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV13_José Coelho\\Textual\\SAN_HV13_José Coelho_ed.docx", "category": "Textual", "content_preview": "Título da história\nDois casamentos de 40 anos\nQuem tem história tem futuro\nMinibio\nJosé Coelho teve uma infância de surfe e brincadeiras nos canais de Santos. Nascido em 1952 na cidade do litoral paulista, ele foi criado em uma família de poucos recursos e, aos 16 anos de idade, já arranjava seu primeiro emprego, como office-boy de uma administradora de condomínios. Embora não tenha sido a escolha de seus sonhos, a graduação na faculdade de Economia permitiu que conhecesse aquela que seria sua esposa, com quem teria três filhos, e que desse início à carreira na indústria farmacêutica, como representante comercial. Contratado pela companhia que mais tarde seria transformada em Sanofi, ele construiu uma bem-sucedida trajetória que o levou à gerência comercial e a uma dedicação de quatro décadas. Orgulhoso de sua história, José permanece na ativa, sempre aberto a mudanças e com os olhos no futuro.  \nSinopse\nSão muitas as histórias que o paulista José Coelho tem para contar, em especial sobre as quatro décadas em que vem cultivando o “casamento” com dois pilares de sua vida: a esposa, com quem teve três filhos, e a indústria farmacêutica Sanofi, onde construiu sua carreira. Ele se “uni"}, "SAN_HV13_José Coelho_rev.docx": {"size_mb": 0.1043, "modified": "2019-08-19 14:54:26", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV13_José Coelho\\Textual\\SAN_HV13_José Coelho_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de José Coelho\nEntrevistado por Maurício Rodrigues\nSão Paulo, ??/??/2018 \nRealização Museu da Pessoa \nSAN_HV13_José Coelho\nTranscrito por Mariana Wolff\nRevisado e editado por Viviane Aguiar\nP/1 – Coelho, boa tarde.\nR – Boa tarde.\nP/1 – Primeiramente, em nome da Sanofi e do Museu da Pessoa, eu queria agradecer muito por você ter aceitado participar aqui desse Projeto Sanofi 100 Anos. E, pra gente iniciar, eu queria que você se apresentasse falando o seu nome completo, a data e o local do seu nascimento.\nR – Tá certo. Primeiramente, quem agradece sou eu pela oportunidade de poder contar um pouco da história minha e da companhia também, durante esse tempo todo. Então, o meu nome é José Eduardo Coelho, eu nasci no dia 2 de outubro de 1952, na cidade de Santos, litoral de São Paulo. \nP/1 – Ótimo. E, Coelho, você pode me dizer o nome dos seus pais?\nR – Claro! Infelizmente, já são falecidos. Meu pai era Armênio Coelho e minha mãe, Ana Fernandes Coelho.\nP/1 – E o que eles faziam? Quais eram as ocupações deles?\nR – Meu pai fez uma carreira na Sabesp [Companhia de Saneamento Básico do Estado de São Paulo]. Ele começou lá de forma bastante humilde, ele ajuda"}, "folder_size_gb": 0.0}, "folder_size_gb": 140.468}, "SAN_HV14_Nelson Libbos": {"Audiovisual": {"Áudio": {"SAN_HV14.mp3": {"size_mb": 84.6578, "modified": "2018-11-03 01:17:48", "extension": "MP3", "full_path": "D:\\Sanofi 100 anos\\SAN_HV14_Nelson Libbos\\Audiovisual\\Áudio\\SAN_HV14.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 5547096.0, "duration": 5547.1}, "folder_size_gb": 0.083}, "Vídeo": {"Íntegra": {"SAN_HV14.mp4": {"size_mb": 2110.8211, "modified": "2018-11-12 19:42:44", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV14_Nelson Libbos\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV14.mp4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_chann asceu na cidade de São Paulo, em 1951, em uma família de origem sírio-libanesa. Morou com os avós em uma casa da Rua São Caetano, hoje conhecida como Rua das Noivas, onde mantinham uma loja especializada em fazer plissê em tecidos. Sem condições financeiras para cursar uma faculdade, Nelson começou a trabalhar muito cedo e, assim que terminou o serviço militar, arranjou um emprego de representante em uma indústria farmacêutica. Nesse setor, construiu uma carreira brilhante: foi vendedor, supervisor, gerente e, enfim, presidente de, ao todo, sete grandes companhias. Apaixonado pela área, se orgulha de ter contribuído com o desenvolvimento e a comercialização de inúmeros medicamentos que fizeram a diferença na vida das pessoas. \nSinopse\nÉ o próprio Nelson Libbos que define sua trajetória profissional como “meteórica” – e com razão. Nascido em São Paulo, em uma família de origem sírio-libanesa, ele voltou à infância para relembrar a época de poucos recursos financeiros, que o obrigou a trabalhar muito cedo e o impediu de cursar uma faculdade. Contratado como represente em uma indústria farm"}, "SAN_HV14_Nelson Libbos_rev.docx": {"size_mb": 0.0631, "modified": "2019-08-19 14:55:40", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV14_Nelson Libbos\\Textual\\SAN_HV14_Nelson Libbos_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de Nelson Libbos\nEntrevistado por Maurício Rodrigues \nSão Paulo, ??/??/2018 \nRealização Museu da Pessoa \nSAN_HV14_Nelson Libbos\nTranscrito por Mariana Wolff\nRevisado e editado por Viviane Aguiar\nP/1 – Seu Nelson, boa tarde.\nR – Boa tarde.\nP/1 – Primeiramente, em nome do Museu da Pessoa e da Sanofi, queria agradecer por você ter aceitado participar e contar aqui um pouco da sua história para a gente. E, para iniciarmos, eu queria que o senhor se apresentasse, dizendo o seu nome completo, a data e o local do seu nascimento.\nR – Meu nome completo é Nelson Naim Libbos, nasci em 13 de fevereiro de 1951, em São Paulo, na capital. \nP/1 – E quais os nomes dos seus pais?\nR – Meu pai é Naim Azar Libbos, libanês, imigrou para o Brasil em 1914, e minha mãe, Julia Lacami LIbbos, síria, imigrou para o Brasil em 1916.\nP/1 – O senhor pode, então, contar qual a história dessas famílias, como que elas se encontraram?\nR – Meu pai teve uma família antes, ficou viúvo. Casou-se com a minha mãe, minha mãe, praticamente, educou os meus dois irmãos, um irmão e uma irmã do primeiro casamento. Meu pai ficou viúvo quando meus irmãos tinham dez e oito anos. E, depois, quando"}, "folder_size_gb": 0.0}, "folder_size_gb": 64.482}, "SAN_HV15_Antoine Daher": {"Audiovisual": {"Áudio": {"SAN_HV15.mp3": {"size_mb": 48.4516, "modified": "2018-11-03 01:22:54", "extension": "MP3", "full_path": "D:\\Sanofi 100 anos\\SAN_HV15_Antoine Daher\\Audiovisual\\Áudio\\SAN_HV15.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 3174624.0, "duration": 3174.62}, "folder_size_gb": 0.047}, "Vídeo": {"Íntegra": {"SAN_HV15.mp4": {"size_mb": 1663.0777, "modified": "2018-11-12 22:46:34", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV15_Antoine Daher\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV15.mp4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3174571.0, "duration": 3174.57}, "SAN_HV015": {"SAN_HV15 (1).MP4": {"size_mb": 11037.992, "modified": "2016-08-07 18:03:16", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV15_Antoine Daher\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV015\\SAN_HV15 (1).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1068067.0, "duration": 1068.07}, "SAN_HV15 (2).MP4": {"size_mb": 22184.1102, "modified": "2016-08-07 18:21:50", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV15_Antoine Daher\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV015\\SAN_HV15 (2).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2135133.0, "duration": 2135.13}, "folder_size_gb": 32.443}, "folder_size_gb": 34.068}, "folder_size_gb": 34.068}, "folder_size_gb": 34.115}, "Iconográfico": {"Making Of": {"SAN_HV15_MO001.JPG": {"size_mb": 6.0126, "modified": "2018-10-31 16:13:04", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV15_Antoine Daher\\Iconográfico\\Making Of\\SAN_HV15_MO001.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV15_MO001.jpg"}, "SAN_HV15_MO002.JPG": {"size_mb": 7.8967, "modified": "2018-10-31 16:13:10", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV15_Antoine Daher\\Iconográfico\\Making Of\\SAN_HV15_MO002.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV15_MO002.jpg"}, "folder_size_gb": 0.014}, "folder_size_gb": 0.014}, "Textual": {"SAN_HV15_Antoine Daher_ed.docx": {"size_mb": 0.0241, "modified": "2019-08-19 14:55:56", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV15_Antoine Daher\\Textual\\SAN_HV15_Antoine Daher_ed.docx", "category": "Textual", "content_preview": "Título da história\nUm filho e um pai muito raros\nAmor e dedicação fazem milagres\nMinibio\nQuando o libanês Antoine Daher se mudou para o Brasil, aos 20 e poucos anos, imaginava que ficaria aqui apenas por um tempo, até que a situação de seu país melhorasse e ele pudesse exercer lá um cargo político, para o qual havia estudado e se pós-graduado. Dono de uma confecção de roupas na cidade de São Paulo, Antoine acabou se apaixonando por uma brasileira, e seus planos mudaram por completo. Com ela se casou e teve um filho que, aos três anos, foi diagnosticado com a rara síndrome de Hunter. Dedicado a contrariar o médico que lhe disse que o menino não tinha muito tempo de vida, ele criou a Casa Hunter, focada em atender pacientes com essa ou outras doenças raras e em incentivar e apoiar pesquisas relacionadas a elas no Brasil.\nSinopse\nEmbora o intuito do libanês Antoine Daher fosse exercer um cargo político em seu país de origem, a grande “causa” de sua vida estaria no Brasil, para onde se mudou na década de 1990. Foi em São Paulo que ele se casou e teve seu filho Anthony, portador da rara e degenerativa síndrome de Hunter. É emocionante a lembrança do momento em que Antoine conheceu um me"}, "SAN_HV15_Antoine Daher_rev.docx": {"size_mb": 0.0467, "modified": "2019-08-19 14:56:12", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV15_Antoine Daher\\Textual\\SAN_HV15_Antoine Daher_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de Antoine Daher [estava incorreto no nome do arquivo e da história; alterei de Antonie para Antoine]\nEntrevistado por Maurício Rodrigues \nSão Paulo, ??/??/2018 \nRealização Museu da Pessoa \nSAN_HV15_Antoine Daher\nTranscrito por Mariana Wolff\nRevisado e editado por Viviane Aguiar\nP/1 – Muito boa tarde. Primeiramente, queria agradecer o aceite pela entrevista em nome da Sanofi e do Museu da Pessoa, e, pra gente iniciar, eu queria que você se apresentasse dizendo o seu nome completo, a data e o local do seu nascimento.\nR – Em primeiro lugar, gostaria de agradecer essa oportunidade, nós temos orgulho da parceria com uma empresa que nem a Sanofi. Meu nome é Antoine Daher, eu nasci no Líbano em 13 de março de 1975. Estou no Brasil há 20 anos.\nP/1 – E você pode contar um pouco da origem da sua família?\nR – Claro, minha família é de origem libanesa, eu estudei numa escola francesa, faculdade francesa também. Eu sou graduado, eu tenho mestrado em Ciências Políticas Administrativas, em francês chama Science Politique Administrative, porque, no Líbano, a gente faz as duas coisas juntas, no mesmo diploma, vamos dizer, você tem as duas, porque você não pode se"}, "folder_size_gb": 0.0}, "folder_size_gb": 34.129}, "SAN_HV16_Marcos Boulos": {"Audiovisual": {"Áudio": {"SAN_HV16.mp3": {"size_mb": 68.8688, "modified": "2018-11-03 01:35:58", "extension": "MP3", "full_path": "D:\\Sanofi 100 anos\\SAN_HV16_Marcos Boulos\\Audiovisual\\Áudio\\SAN_HV16.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 4512576.0, "duration": 4512.58}, "folder_size_gb": 0.067}, "Vídeo": {"Íntegra": {"SAN_HV16.mp4": {"size_mb": 2101.0916, "modified": "2018-11-13 02:28:08", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV16_Marcos Boulos\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV16.mp4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4512508.0, "duration": 4512.51}, "SAN_HV016": {"SAN_HV16 (1).MP4": {"size_mb": 211.9512, "modified": "2016-08-07 21:34:00", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV16_Marcos Boulos\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV016\\SAN_HV16 (1).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 18519.0, "duration": 18.52}, "SAN_HV16 (2).MP4": {"size_mb": 1441.2878, "modified": "2016-08-07 21:34:26", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV16_Marcos Boulos\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV016\\SAN_HV16 (2).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 125626.0, "duration": 125.63}, "SAN_HV16 (3).MP4": {"size_mb": 4990.2112, "modified": "2016-08-07 21:38:28", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV16_Marcos Boulos\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV016\\SAN_HV16 (3).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 434935.0, "duration": 434.94}, "SAN_HV16 (4).MP4": {"size_mb": 45348.8804, "modified": "2016-08-07 21:45:46", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV16_Marcos Boulos\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV016\\SAN_HV16 (4).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3951948.0, "duration": 3951.95}, "folder_size_gb": 50.774}, "folder_size_gb": 52.826}, "folder_size_gb": 52.826}, "folder_size_gb": 52.893}, "Textual": {"SAN_HV16_Marcos Boulos_ed.docx": {"size_mb": 0.0238, "modified": "2019-08-19 14:56:28", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV16_Marcos Boulos\\Textual\\SAN_HV16_Marcos Boulos_ed.docx", "category": "Textual", "content_preview": "Título da história\nMedicina e justiça social\nMinibio\nFilho de pai libanês e mãe paulista, Marcos Boulos nasceu na cidade de São Paulo, em 1945, mas passou parte da infância e da adolescência em Santo Anastácio, no interior. Quando ficou mais velho, para ajudar a família, passou a dar aulas de matemática enquanto fazia o cursinho pré-vestibular e mesmo enquanto cursava a faculdade de Medicina, em Sorocaba. Já formado, estabeleceu-se na capital e deu sequência à trajetória acadêmica na Universidade de São Paulo, onde se especializou em pesquisas sobre a malária e se tornou infectologista. Sempre atuante no serviço público e preocupado com a função social de sua profissão, acompanhou o surgimento de doenças como a Aids e também de vacinas e tratamentos para curá-las. Casado com uma médica há mais de quatro décadas, é pai de três filhos – o caçula, Guilherme, foi candidato à presidência da República em 2018.    \nSinopse\nCom uma longa carreira como infectologista e professor da Universidade de São Paulo, o paulista Marcos Boulos conta que nutriu a vontade de ser médico desde a infância, inspirado pela profissão do padrinho que tinha como ídolo – e que também o influenciou, no futebol, a"}, "SAN_HV16_Marcos Boulos_rev.docx": {"size_mb": 0.053, "modified": "2019-08-19 14:56:34", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV16_Marcos Boulos\\Textual\\SAN_HV16_Marcos Boulos_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de Marcos Boulos\nEntrevistado por ???\nSão Paulo, ??/??/2018 \nRealização Museu da Pessoa\nSAN_HV16_ Marcos Boulos\nTranscrito por Liliane Custódio\nRevisado e editado por Viviane Aguiar\nP/1 – Bem, Seu Marcos, boa noite.\nR – Boa noite.\nP/1 – Em nome da Sanofi e do Museu da Pessoa, primeiramente, eu queria agradecer de o senhor ter aceitado o convite para a realização desta entrevista. E, para iniciarmos, eu queria que o senhor se apresentasse dizendo o seu nome completo, a data e o local do seu nascimento.\nR – O meu nome é Marcos Boulos, eu nasci em São Paulo, em 20 de agosto de 1945.\nP/1 – Certo. E o senhor pode dizer o nome dos seus pais?\nR – É Iskander Boulos e Aparecida (Beneder?) Boulos.\nP/1 – O senhor sabe contar a história de como eles se conheceram, qual a origem da família?\nR – O meu pai é libanês, era libanês, ele veio para cá com 16 anos, com quatro irmãos mais jovens, depois que os pais deles morreram no Líbano. E aqui foram atendidos, ou foram recepcionados por tios distantes, onde deixaram os mais jovens, as meninas, que eram bem mais jovens, uma estava com provavelmente três, a outra com um ano, e os três irmãos mais velhos. Ele, que era"}, "folder_size_gb": 0.0}, "Iconográfico": {"Making Of": {"SAN_HV16_MO001.JPG": {"size_mb": V17_MO002.jpg"}, "folder_size_gb": 0.011}, "folder_size_gb": 0.011}, "Textual": {"SAN_HV17_Hélio Anastácio_ed.docx": {"size_mb": 0.0269, "modified": "2019-08-19 14:56:54", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV17_Helio Anastacio\\Textual\\SAN_HV17_Hélio Anastácio_ed.docx", "category": "Textual", "content_preview": "Título da história\nNão se toca a vida pelo retrovisor\nMinibio\nHélio Anastácio nasceu em Palmital, no interior de São Paulo, em 1949. Criado em uma família de agricultores que também mantinham um comércio em Assis, para onde se mudaram quando ele ainda era pequeno, Hélio tomou um rumo diferente do que se esperava de um jovem com sua história. Em vez de dar continuidade aos negócios do pai, resolveu seguir para a capital, ainda que nunca tivesse pisado lá. Aos 20 anos de idade, na cidade de São Paulo, deu início a uma bem-sucedida carreira. Formou-se em Ciências Contábeis e, do setor fiscal de uma gráfica, saltou para os cargos de diretor financeiro, diretor comercial e presidente de grandes companhias farmacêuticas. Casado por duas vezes, com cinco filhos, ele se orgulha de suas conquistas e, apesar das quase cinco décadas de trabalho, não pensa em se aposentar.  \nSinopse\nNascido em 18 de julho de 1949, o paulista Hélio Anastácio guarda na memória as datas exatas dos momentos que marcaram sua vida. Foi em 4 de janeiro de 1970 que ele desembarcou na capital de São Paulo, vindo da cidade Assis, onde morava, para dar início a uma carreira diferente da imaginada por seus pais, que tinha"}, "SAN_HV17_Hélio Anastácio_rev.docx": {"size_mb": 0.0734, "modified": "2019-08-19 14:56:58", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV17_Helio Anastacio\\Textual\\SAN_HV17_Hélio Anastácio_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de Hélio Anastácio\nEntrevistado por Maurício Rodrigues \nSão Paulo, 05/11/2018 \nRealização Museu da Pessoa \nSAN_HV17_Hélio Anastácio\nTranscrito por Mariana Wolff\nRevisado e editado por Viviane Aguiar\nP/1 – Seu Hélio, então, muito boa tarde. Antes de mais nada, eu queria agradecer, em nome da Sanofi e do Museu da Pessoa, o senhor ter aceitado o convite para dar esta entrevista. E, pra gente iniciar, eu gostaria que o senhor se apresentasse falando o seu nome completo, a data e o local do seu nascimento.\nR – Meu nome é Hélio Anastácio, eu nasci em 18 de julho de 1949, no interior de São Paulo, numa cidade chamada Assis, desculpe. Agora vou começar de novo. Meu nome é Hélio Anastácio, eu nasci em 18 de julho de 1949 numa cidade do interior de São Paulo, chamada Palmital.\nP/1 – Certo. E o senhor sabe dizer qual é a história dos seus pais terem te batizado com esse nome?\nR – Na verdade, isso foi uma decisão de uma tia que decidiu botar nome de Hélio, ninguém entendeu e, até hoje, nenhum membro da família entende porque a minha avó morreu me chamando de Henrique, porque era o nome que ela desejava que eu chamasse. Mas, por coisas do destino, uma tia que"}, "folder_size_gb": 0.0}, "folder_size_gb": 79.516}, "SAN_HV18_Antonio Fernandes": {"Audiovisual": {"Áudio": {"SAN_HV18.mp3": {"size_mb": 45.8583, "modified": "2018-11-13 21:21:18", "extension": "MP3", "full_path": "D:\\Sanofi 100 anos\\SAN_HV18_Antonio Fernandes\\Audiovisual\\Áudio\\SAN_HV18.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 3004560.0, "duration": 3004.56}, "folder_size_gb": 0.045}, "Vídeo": {"Íntegra": {"SAN_HV18.mp4": {"size_mb": 1143.5541, "modified": "2018-11-15 06:14:44", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV18_Antonio Fernandes\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV18.mp4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3004501.0, "duration": 3004.5}, "SAN_HV018": {"SAN_HV18 (1).MP4": {"size_mb": 264.0416, "modified": "2016-08-15 11:2 : 0.1786, "modified": "2021-09-29 09:27:18", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV18_Antonio Fernandes\\Iconográfico\\Acervo\\Baixa\\SAN_HV018_FT010A.jpg", "category": "Image", "dimension": "1280x960", "resolution": "1280x960", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV018_FT010A.jpg"}, "SAN_HV018_FT10B.jpg": {"size_mb": 0.2223, "modified": "2021-09-29 09:27:38", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV18_Antonio Fernandes\\Iconográfico\\Acervo\\Baixa\\SAN_HV018_FT10B.jpg", "category": "Image", "dimension": "1280x960", "resolution": "1280x960", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV018_FT10B.jpg"}, "folder_size_gb": 0.013}, "folder_size_gb": 0.196}, "folder_size_gb": 0.209}, "Textual": {"SAN_HV18_Antônio Fernandes_ed.docx": {"size_mb": 0.0224, "modified": "2019-08-19 14:57:18", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV18_Antonio Fernandes\\Textual\\SAN_HV18_Antônio Fernandes_ed.docx", "category": "Textual", "content_preview": "Título da história\nO seminarista que virou dono de farmácia\nDo lado de lá do balcão\nMinibio\nAntônio Fernandes nasceu em Portugal, em 1945. Como seminarista, estudou em um colégio interno até que, prestes a ser obrigado a servir o exército, acatou a decisão de seu pai e se mudou para o Brasil. Aos 16 anos de idade, instalou-se no bairro da Penha, em São Paulo, na casa de uma irmã, e logo deu início à sua trajetória profissional. Foi trabalhar como ajudante geral em uma empresa farmacêutica e, de cargo em cargo, chegou a representante comercial. Seguiu assim até comprar sua própria farmácia, que mantém por quase três décadas e por meio da qual conseguiu criar e formar os três filhos – um deles, seguindo os passos do pai, também se tornou farmacêutico.  \nSinopse\nNascido em Portugal, em 1945, Antônio Fernandes teve de abandonar o seminário para atender a decisão de seu pai e se mudar para o Brasil. Antes mesmo de completar 16 anos, estabeleceu-se em São Paulo, onde deu início a uma nova vida. Ele conta como começou sua carreira na função de ajudante geral em uma empresa de medicamentos, como galgou a posição de representante comercial e como acabou se transferindo para o lado de lá do"}, "SAN_HV18_Antônio Fernandes_rev.docx": {"size_mb": 0.043, "modified": "2019-08-19 14:57:22", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV18_Antonio Fernandes\\Textual\\SAN_HV18_Antônio Fernandes_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de Antônio Fernandes\nEntrevistado por Maurício Rodrigues \nSão Paulo, 08/11/2018 \nRealização Museu da Pessoa \nSAN_HV18_Antônio Fernandes\nTranscrito por Mariana Wolff\nRevisado e editado por Viviane Aguiar\nP/1 – Seu Antônio, bom dia.\nR – Bom dia.\nP/1 – Primeiramente, em nome do Museu da Pessoa e da Sanofi, queria agradecer pelo senhor ter aceitado fazer esta entrevista com a gente e, pra começar, eu queria que o senhor se apresentasse falando o seu nome completo, data e local de nascimento.\nR – Eu também quero agradecer o convite, fiquei muito orgulhoso e vou tentar fazer o meu melhor. Meu nome é Antônio de Deus Fernandes, sou natural de Portugal e cheguei ao Brasil em 1961.\nP/1 – Sim, e a sua data de nascimento?\nR – 15 de agosto de 1945.\nP/1 – E quais os nomes dos seus pais?\nR – Meu pai é José Júlio Fernandes e a minha mãe é Antônia da Conceição.\nP/1 – E o senhor pode falar da origem? Contar a origem da sua família? Como que se conheceram os seus pais?\nR – Bom, como eles se conheceram, eu não vou lembrar mesmo, porque eu já tenho uma idade meio avançada, eu já tenho 73 anos e eu não me lembro como se conheceram. Mas somos da área rural lá em Portuga"}, "folder_size_gb": 0.0}, "folder_size_gb": 35.002}, "SAN_HV19_Jorge Raimundo": {"Audiovisual": {"Áudio": {"SAN_HV19.mp3": {"size_mb": 53.5393, "modified": "2018-11-13 21:25:06", "extension": "MP3", "full_path": "D:\\S thumbnail": "thumbnails/HD_0110/thumb_SAN_HV19_MO001.jpg"}, "SAN_HV19_MO002.JPG": {"size_mb": 5.7959, "modified": "2019-02-26 06:55:24", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV19_Jorge Raimundo\\Iconográfico\\Making Of\\SAN_HV19_MO002.JPG", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV19_MO002.jpg"}, "folder_size_gb": 0.013}, "folder_size_gb": 0.013}, "Textual": {"SAN_HV19_Jorge Raimundo_ed.docx": {"size_mb": 0.0259, "modified": "2019-08-19 14:57:36", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV19_Jorge Raimundo\\Textual\\SAN_HV19_Jorge Raimundo_ed.docx", "category": "Textual", "content_preview": "Título da história\nViciado pela profissão\nUma carreira multinacional\nA criação da lei de patentes\nMinibio\nJorge Raimundo Filho nasceu em 1940, na cidadezinha de Oliveira Fortes, em Minas Gerais, como o caçula de uma família de 11 irmãos. Quando seu pai morreu, ele tinha 13 anos e precisou arranjar um emprego. Começou como entregador e estoquista em uma drogaria, passou a propagandista de uma indústria farmacêutica e logo deu início a uma profícua carreira “multinacional” no setor. Apesar de ter se formado em Direito e trabalhado no setor jurídico da companhia Pfizer, foi em cargos de gerência que se destacou. Nessa posição, atuou nos Estados Unidos e na Venezuela até se tornar presidente da britânica Glaxo e ser responsável pelo comando de filiais de 32 países. Nessa bem-sucedida trajetória, também se inclui a luta de Jorge para a implementação da lei de patentes no Brasil na década de 1990. \nSinopse\nDa função de estoquista em uma farmácia na cidade mineira de Oliveira Fortes, onde nasceu em 1940, Jorge Raimundo ganhou o mundo: de lá, mudou-se para Petrópolis, como propagandista da indústria farmacêutica Bristol; aos 21 anos, foi contratado no mesmo cargo pela Pfizer, que o levou a"}, "SAN_HV19_Jorge Raimundo_rev.docx": {"size_mb": 0.0489, "modified": "2019-08-19 14:57:42", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV19_Jorge Raimundo\\Textual\\SAN_HV19_Jorge Raimundo_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de Jorge Raimundo\nEntrevistado por Maurício Rodrigues \nSão Paulo, 08/11/2018 \nRealização Museu da Pessoa \nSAN_HV19_Jorge Raimundo\nTranscrito por Mariana Wolff\nRevisado e editado por Viviane Aguiar\nP/1 – Seu Jorge, muito boa tarde.\nR – Boa tarde, Maurício.\nP/1 – Em nome da Sanofi e do Museu da Pessoa, queria agradecer o senhor por ter aceitado o convite para fazer esta entrevista. E, pra gente iniciar, eu queria que o senhor se apresentasse falando o seu nome completo, a data e o local de nascimento.\nR – Eu sou Jorge Raimundo Filho, eu nasci em 27 de fevereiro de 1940, em Minas Gerais, numa pequena cidade chamada Oliveira Fortes.\nP/1 – Certo. E só pra gente contextualizar um pouco da sua origem, o senhor pode falar um pouco da origem da sua família?\nR – Os meus pais são imigrantes, foram imigrantes. Meu pai veio do Líbano, e a minha mãe também, eles chegaram aqui por volta de 1925, na época em que o Brasil precisava de mão de obra na agricultura. E o meu pai chegou, parou no Rio e ele tinha um parente que o levou para essa cidade no interior de Minas. Se ele tivesse vindo para São Paulo ou tivesse ficado no Rio, a nossa história de família seria di"}, "folder_size_gb": 0.0}, "folder_size_gb": 41.043}, "SAN_HV20_David Pinho": {"Audiovisual": {"Áudio": {"SAN_HV20.mp3": {"size_mb": 30.5553, "modified": "2018-11-13 21:08:44", "extension": "MP3", "full_path": "D:\\Sanofi 100 anos\\SAN_HV20_David Pinho\\Audiovisual\\Áudio\\SAN_HV20.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 2001552.0, "duration": 2001.55}, "folder_size_gb": 0.03}, "Vídeo": {"Íntegra": {"SAN_HV20.mp4": {"size_mb": 761.8254, "modified": "2018-11-13 22:42:06", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV20_David Pinho\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV20.mp4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 2001500.0, "duration": 2001.5}, "SAN_HV020": {"HV20 (1).MP4": {"size_mb": 1049.1215, "modified": "2016-08-20 18:25:20", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV20_David Pinho\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV020\\HV20 (1).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 91091.0, "duration": 91.09}, "HV20 (2).MP4": {"size_mb": 1986.3683, "modified": "2016-08-20 18:27:46", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV20_David Pinho\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV020\\HV20 (2).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 173173.0, "duration": 173.17}, "HV20 (3).MP4": {"size_mb": 2016.9633, "modified": "2016-08-20 18:31:24", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV20_David Pinho\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV020\\HV20 (3).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 175676.0, "duration": 175.68}, "HV20 (4).MP4": {"size_mb": 17906.2643, "modified": "2016-08-20 18:34:38", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV20_David Pinho\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV020\\HV20 (4).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1561560.0, "duration": 1561.56}, "folder_size_gb": 22.421}, "folder_size_gb": 23.165}, "folder_size_gb": 23.165}, "folder_size_gb": 23.194}, "Iconográfico": {"Making Of": {"SAN_HV20_MO001.JPG": {"size_mb": 7.7927, "modified": "2019-02-26 05:23:38", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV20_David Pinho\\Iconográfico\\Making Of\\SAN_HV20_MO001.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV20_MO001.jpg"}, "SAN_HV20_MO002.JPG": {"size_mb": 7.7203, "modified": "2019-02-26 05:24:28", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV20_David Pinho\\Iconográfico\\Making Of\\SAN_HV20_MO002.JPG", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV20_MO002.jpg"}, "folder_size_gb": 0.015}, "folder_size_gb": 0.015}, "Textual": {"SAN_HV20_David Pinho_ed.docx": {"size_mb": 0.0213, "modified": "2019-08-19 14:58:14", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV20_David Pinho\\Textual\\SAN_HV20_David Pinho_ed.docx", "category": "Textual", "content_preview": "Título da história\nFiel aos sonhos... e à Portuguesa\nMinibio\nO pai de David Pinho sonhava que o filho seguisse sua carreira na medicina. Nascido na cidade de São Paulo, em 1970, o menino acabou trilhando uma trajetória diferente, embora também no meio da saúde. Graduado em Engenharia Mecânica, David foi trabalhar na indústria farmacêutica, onde se destacou em posições de liderança – aos 29 anos, conquistou o posto de mais jovem diretor industrial da companhia Abbott. Na bem-sucedida carreira, passou por diversas empresas e cargos até se firmar como diretor comercial do grupo Sanofi. Casado, com três filhos, considera a família em que nasceu e a que construiu como seus principais alicerces – um outro é a paixão pela Portuguesa, time de futebol que, mesmo não indo bem nos campeonatos, sempre mereceu sua fiel torcida.\nSinopse\nInfluenciado pelo avô, o paulistano David Pinho cresceu torcendo pela Portuguesa, mesmo quando o time não estava tão bem nos campeonatos de futebol. Talvez tenha surgido aí a persistência que o levou a nunca desistir de seu sonho de infância: trabalhar com algo que pudesse fazer a diferença na vida das pessoas. Em seu depoimento, David se lembra de sua próspera t"}, "SAN_HV20_David Pinho_rev.docx": {"size_mb": 0.0335, "modified": "2019-08-19 14:58:18", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV20_David Pinho\\Textual\\SAN_HV20_David Pinho_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de David Pinho\nEntrevistado por Maurício Rodrigues \nSão Paulo, 13/15/2018 \nRealização Museu da Pessoa \nSAN_HV20_David Pinho\nTranscrito por Mariana Wolff\nRevisado e editado por Viviane Aguiar\nP/1 – David, boa tarde.\nR – Boa tarde.\nP/1 – Em nome do Museu da Pessoa e da Sanofi, queria agradecer você por ter disponibilizado esse tempo pra gente fazer a entrevista contigo. Pra começar, eu queria que você se apresentasse falando o seu nome completo, a data e o local do seu nascimento.\nR – David Pinho Filho, 4 de novembro de 1970, nasci na capital do Estado de São Paulo.\nP/1 – E, David, você pode contar um pouco da origem da sua família, como que os seus pais se conheceram?\nR – Bom, minha família é toda da Europa, 25% italiana, 25% belga, 50% portuguesa, que é onde eu mais fiquei próximo, por causa do meu avô paterno. Então, meus pais se conheceram no ônibus, meu pai voltando da escola e minha mãe indo dar aula. Minha mãe era professora. Então, eles se encontraram no ônibus, começaram um namoro que acabou virando um casamento de longa data, que teve cinco filhos e que eu sou o mais velho deles. \nP/1 – Certo. E, David, você pode me descrever que lembrança"}, "folder_size_gb": 0.0}, "folder_size_gb": 23.21}, "SAN_HV21_Eugênio de Zagottis": {"Audiovisual": {"Áudio": {"SAN_HV21.mp3": {"size_mb": 42.6245, "modified": "2018-11-15 04:28:14", "extension": "MP3", "full_path": "D:\\Sanofi 100 anos\\SAN_HV21_Eugênio de Zagottis\\Audiovisual\\Áudio\\SAN_HV21.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 2792856.0, "duration": 2792.86}, "folder_size_gb": 0.042}, "Vídeo": {"Íntegra": {"SAN_HV21.mp4": {"size_mb": 1063.0984, "modified": "2018-11-15 21:19:04", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV21_Eugênio de Zagottis\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV21.mp4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 2792790.0, "duration": 2792.79}, "SAN_HV021": {"SAN_HV21.MP4": {"size_mb": 32027.2006, "modified": "2016-08-21 12:00:28", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV21_Eugênio de Zagottis\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV021\\SAN_HV21.MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2792790.0, "duration": 2792.79}, "folder_size_gb": 31.277}, "folder_size_gb": 32.315}, "folder_size_gb": 32.315}, "folder_size_gb": 32.356}, "Iconográfico": {"Making Of": {"SAN_HV21_MO001.JPG": {"size_mb": 5.6154, "modified": "2018-11-14 10:10:26", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV21_Eugênio de Zagottis\\Iconográfico\\Making Of\\SAN_HV21_MO001.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV21_MO001.jpg"}, "SAN_HV21_MO002.JPG": {"size_mb": 7.7941, "modified": "2019-02-26 05:27:16", "extension": "JPG", "full_path": "D:\\Sanofi 100 anos\\SAN_HV21_Eugênio de Zagottis\\Iconográfico\\Making Of\\SAN_HV21_MO002.JPG", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_SAN_HV21_MO002.jpg"}, "folder_size_gb": 0.013}, "folder_size_gb": 0.013}, "Textual": {"SAN_HV21_Eugênio De Zagottis_ed.docx": {"size_mb": 0.0221, "modified": "2019-08-19 14:58:30", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV21_Eugênio de Zagottis\\Textual\\SAN_HV21_Eugênio De Zagottis_ed.docx", "category": "Textual", "content_preview": "Título da história\nHerança farmacêutica\nDe bisavô a bisneto\nMinibio\nEugênio De Zagottis nasceu em 1970, em São Paulo, e foi criado em um apartamento no bairro dos Jardins. Uma de suas diversões, quando criança, era visitar as lojas da Droga Raia, “descendentes” da pioneira farmácia fundada em 1905 por seu bisavô, o italiano Giovanni Batista Raia. O contato com o comércio o levou a optar, mais tarde, por cursar a faculdade de Administração. Depois de trabalhar em outras empresas, acabou, enfim, se inserindo no negócio da família. Na direção da drogaria, trabalhou para a sua expansão por meio de ações como a abertura de capital e a fusão com outra grande rede, a Drogasil. Casado e pai de dois filhos, ele atua também na principal associação do setor no Brasil.\nSinopse\nEm 1905, o bisavô de Eugênio De Zagottis abriu uma das mais longevas farmácias do Brasil, a Droga Raia, em Araraquara, no interior de São Paulo. Quase cem anos mais tarde, já transformada em uma grande rede, foi a vez do bisneto entrar em seu comando. Nascido em São Paulo, em 1970, Eugênio se recorda de brincar nas lojas da cadeia, quando criança, e da influência que o legado familiar teve em sua decisão de cursar a facu"}, "SAN_HV21_Eugênio De Zagottis_rev.docx": {"size_mb": 0.0455, "modified": "2019-08-19 14:58:36", "extension": "DOCX", "full_path": "D:\\Sanofi 100 anos\\SAN_HV21_Eugênio de Zagottis\\Textual\\SAN_HV21_Eugênio De Zagottis_rev.docx", "category": "Textual", "content_preview": "Projeto Sanofi 100 Anos\nDepoimento de Eugênio De Zagottis\nEntrevistado por Maurício Rodrigues \nSão Paulo, 14/11/2018 \nRealização Museu da Pessoa \nSAN_HV21_Eugênio De Zagottis\nTranscrito por Mariana Wolff\nRevisado e editado por Viviane Aguiar\nP/1 – Eugênio, bom dia.\nR – Bom dia.\nP/1 – Em nome do Museu da Pessoa e da Sanofi, queria agradecer por você ter aceitado o convite para fazer essa entrevista.\nR – Eu que agradeço.\nP/1 – E, pra gente iniciar, eu queria que você se apresentasse falando o seu nome completo, a data e o local do seu nascimento.\nR – Eu sou Eugênio De Zagottis, nasci em São Paulo, 21 de novembro de 1970.\nP/1 – Eugênio, você pode contar um pouco da origem da sua família, como os seus pais se conheceram?\nR – Minha família é uma família italiana, basicamente. Minha mãe é filha de italianos, na verdade, filha de um italiano com outra filha de italiano, mas, culturalmente, todo mundo é italiano. Meu pai era filho... Já é falecido, o pai era família italiana, embora eu não conheci. O pai dele morreu cedo e a mãe dele era do interior de São Paulo, provavelmente, de ascendência portuguesa. E eles se conheceram numa viagem de navio.\nP/1 – E quais eram as atividades de cada um"}, "folder_size_gb": 0.0}, "folder_size_gb": 32.37}, "SAN_HV22_Akira Homma": {"Audiovisual": {"Áudio": {"SAN_HV22.mp3": {"size_mb": 70.129, "modified": "2018-12-08 19:29:18", "extension": "MP3", "full_path": "D:\\Sanofi 100 anos\\SAN_HV22_Akira Homma\\Audiovisual\\Áudio\\SAN_HV22.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 4595160.0, "duration": 4595.16}, "folder_size_gb": 0.068}, "Vídeo": {"Íntegra": {"SAN_HV22 (1).MP4": {"size_mb": 326.4759, "modified": "2016-09-02 11:17:24", "extension": "MP4", "full_path": "D:\\Sanofi 100 anos\\SAN_HV22_Akira Homma\\Audiovisual\\Vídeo\\Íntegra\\SAN_HV22 (1).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "P
