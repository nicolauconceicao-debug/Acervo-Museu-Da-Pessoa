ite Atópica\\PCSH_HV646_Camila Batista\\Iconográfico\\Acervo\\PCSH_HV646_FT05.docx", "category": "Textual", "content_preview": "CADASTRO DE IMAGEM"}, "Baixa": {"PCSH_HV646_FT01.jpg": {"size_mb": 0.1018, "modified": "2018-04-18 10:19:10", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV646_Camila Batista\\Iconográfico\\Acervo\\Baixa\\PCSH_HV646_FT01.jpg", "category": "Image", "dimension": "731x1035", "resolution": "731x1035", "color_mode": "RGB", "dpi": "200 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV646_FT01.jpg"}, "PCSH_HV646_FT02.jpg": {"size_mb": 0.0755, "modified": "2018-04-18 10:19:10", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV646_Camila Batista\\Iconográfico\\Acervo\\Baixa\\PCSH_HV646_FT02.jpg", "category": "Image", "dimension": "720x960", "resolution": "720x960", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV646_FT02.jpg"}, "PCSH_HV646_FT03.JPG": {"size_mb": 2.3216, "modified": "2018-04-18 10:19:10", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV646_Camila Batista\\Iconográfico\\Acervo\\Baixa\\PCSH_HV646_FT03.JPG", "category": "Image", "dimension": "2592x1944", "resolution": "2592x1944", "color_mode": "RGB", "dpi": "350 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV646_FT03.jpg"}, "PCSH_HV646_FT04.jpg": {"size_mb": 0.0971, "modified": "2018-04-18 10:19:10", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV646_Camila Batista\\Iconográfico\\Acervo\\Baixa\\PCSH_HV646_FT04.jpg", "category": "Image", "dimension": "960x540", "resolution": "960x540", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV646_FT04.jpg"}, "PCSH_HV646_FT05.png": {"size_mb": 1.3099, "modified": "2018-04-18 10:19:10", "extension": "PNG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV646_Camila Batista\\Iconográfico\\Acervo\\Baixa\\PCSH_HV646_FT05.png", "category": "Image", "dimension": "722x845", "resolution": "722x845", "color_mode": "RGB", "dpi": "95 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV646_FT05.jpg"}, "folder_size_gb": 0.004}, "folder_size_gb": 0.004}, "Making Of": {"PCSH_HV646_MO001.jpg": {"size_mb": 0.7014, "modified": "2018-04-18 14:08:08", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV646_Camila Batista\\Iconográfico\\Making Of\\PCSH_HV646_MO001.jpg", "category": "Image", "dimension": "1920x1080", "resolution": "1920x1080", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV646_MO001.jpg"}, "folder_size_gb": 0.001}, "folder_size_gb": 0.005}, "Textual": {"PCSH_HV646_Camila Batista_edi.docx": {"size_mb": 0.0084, "modified": "2019-04-15 06:40:34", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV646_Camila Batista\\Textual\\PCSH_HV646_Camila Batista_edi.docx", "category": "Textual", "content_preview": "Nome da história\nMissão: otimismo\nMinibio\nCamila Batista nasceu no dia 14 de fevereiro de 1991 em São Paulo (SP). É filha de Martinha e Geraldo e segue uma tradição familiar de nomes iniciados com a letra C. É criadora de um canal do Youtube que fala sobre dermatite atópica, doença imunológica crônica que é portadora e que aprendeu a lidar depois de muitas angústias. Frequenta a Igreja Cristã e ama ajudar os outros, participando de inúmeros projetos sociais. Se define como good vibes e só quer levar otimismo e uma mensagem positiva para as outras pessoas. \nSinopse\nCamila tem paixão em ajudar os outros. Encontrou nos trabalhos sociais e nos vídeos de seu canal uma forma de levar mensagens positivas para as pessoas e, mais que isso, para si. Falando para os outros que também tinham dermatite atópica,  se redescobriu e hoje só quer propagar uma coisa: otimismo.\nTAGs\nsanofi; dermatite atópica; igreja; projetos sociais; youtube; otimismo; hospital; beneficência portuguesa.\nEDIÇÃO\nEu sempre tive um convívio muito grande dentro da igreja. Comecei primeiro na Católica e fui depois para a Cristã e lá tive contato com o trabalho social. É perceptível a tristeza e o sofrimento que muitas pess"}, "PCSH_HV646_Camila Batista_rev.docx": {"size_mb": 0.0418, "modified": "2019-04-15 06:41:44", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV646_Camila Batista\\Textual\\PCSH_HV646_Camila Batista_rev.docx", "category": "Textual", "content_preview": "Programa Conte sua História\nDepoimento de Camila Batista\nEntrevistada por Denise Cooke e Carolina Margiotte\nSão Paulo, 10 de abril de 2018\nEntrevista número PCSH_HV646\nRevisado e editado por Bruno Pinho\nP/1 - Oi Camila, tudo bem?\nR - Tudo bem. \nP/1 - Bom, você podia falar para a gente o seu nome, o local e a data do seu nascimento?\nR - Meu nome é Camila, eu nasci em São Paulo e eu tenho 27 anos.\nP/1 - Você sabe a história do seu nome? Por que os seus pais escolheram esse nome para você?\nR - Nunca parei para pensar nisso. Mas eu tenho irmãos por parte de pai, então acho que o meu pai quis seguir: os meus irmãos têm os nomes todos com a letra C, então em mim teve essa continuidade. Mas o meu irmão, não. O meu irmão que morou comigo, mesmo pai e mesma mãe. Mas minha mãe só me conta assim, que ela tinha uma dúvida do nome, que poderia ser Renata, Valéria ou Camila, mas ficou sendo Camila. \nP/1 - E você sabe alguma coisa sobre o seu nascimento? Tem alguma história para contar sobre o dia do seu nascimento?\nR - Eu sei que a gravidez da minha mãe foi uma gravidez de risco porque, se eu não me engano, ela tinha um cisto no rim e na época ela não podia fazer exames para saber se era uma coi"}, "folder_size_gb": 0.0}, "folder_size_gb": 10.163}, "PCSH_HV647_Delmira Marques": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV647_ED001.mp4": {"size_mb": 266.8057, "modified": "2018-09-12 16:19:24", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV647_Delmira Marques\\Audiovisual\\Vídeo\\Edição\\PCSH_HV647_ED001.mp4", "category": "Video", "dimension": "1504x846", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "cod SH_HV647_FT07.jpg", "category": "Image", "dimension": "960x1280", "resolution": "960x1280", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV647_FT07.jpg"}, "PCSH_HV647_FT08.jpeg": {"size_mb": 0.3646, "modified": "2018-04-08 13:53:58", "extension": "JPEG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV647_Delmira Marques\\Iconográfico\\Acervo\\Baixa\\PCSH_HV647_FT08.jpeg", "category": "Image", "dimension": "2560x1440", "resolution": "2560x1440", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV647_FT08.jpg"}, "folder_size_gb": 0.014}, "folder_size_gb": 0.014}, "Making of": {"PCSH_HV647_MO001.JPG": {"size_mb": 0.1196, "modified": "2018-09-12 16:00:44", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV647_Delmira Marques\\Iconográfico\\Making of\\PCSH_HV647_MO001.JPG", "category": "Image", "dimension": "1286x650", "resolution": "1286x650", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV647_MO001.jpg"}, "PCSH_HV647_MO002.JPG": {"size_mb": 6.1441, "modified": "2018-10-25 11:52:30", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV647_Delmira Marques\\Iconográfico\\Making of\\PCSH_HV647_MO002.JPG", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV647_MO002.jpg"}, "folder_size_gb": 0.006}, "folder_size_gb": 0.02}, "Textual": {"PCSH_HV647_Delmira Marques_edi.docx": {"size_mb": 0.0077, "modified": "2019-04-15 06:47:16", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV647_Delmira Marques\\Textual\\PCSH_HV647_Delmira Marques_edi.docx", "category": "Textual", "content_preview": "Nome da história\nSonho de mãe: ver o filho bem\nMinibio\nDelmira Marques da Silva, também conhecida como Dona Delmira, vem de Remanso, pequena cidade do interior da Bahia. Nasceu em novembro de 1954 e cresceu no meio de fazendas, mas cedo se mudou para São Paulo com a família. Na capital paulista, fez sua vida e sua própria família, criando três filhos: Marlene, Valter e Joaquim.\nSinopse\nDona Delmira só deseja conseguir um tratamento para seu filho, Valter, diagnosticado com dermatite atópica. Em busca de uma solução, já tentou diferentes abordagens: clínicas, tratamentos alternativos, curandeiros e afins. Essa é uma história do amor incondicional de uma mãe que só quer ver o filho bem. \nTAGs: maternidade, dermatite atópica,tratamento, medicina, filho, santo andré. \nEdição:\nEu falo para ele: “Reage meu filho, vai à luta! Você escolheu a parte mais fácil: entrar embaixo do seu edredom”. Eu sou mãe e quero ver o filho bem. Será que é um cuidado excessivo? Você não faria isso pelo seu filho? Sou mãe e faria qualquer coisa para tirá-lo dessa situação.\nQuando nasceu, o Valter chorava tanto! Chorava dia e noite e as vezes eu pedia para o pai, Joaquim, ficar com ele, pois eu não conseguia a"}, "PCSH_HV647_Delmira Marques_rev.docx": {"size_mb": 0.0629, "modified": "2019-04-15 06:43:02", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV647_Delmira Marques\\Textual\\PCSH_HV647_Delmira Marques_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História\nDepoimento de Delmira Marques\nEntrevistada por Carolina Margiotte e Denise Cooke\nSão Paulo 11 de abril de 2018\nEntrevista nº PCSH_HV647\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\nP1 - Dona Delmira, muito obrigada por você ter aceitado o nosso convite e por nos receber na sua casa. Para começar, por gentileza, o seu nome completo, o local e a data de nascimento. \nR - Delmira Marques da Silva, São Paulo, não, não, o local de nascimento. \nP1 - O local e a data de nascimento, por favor. \nR - Vamos recomeçar?\nP1 - Claro, bem tranquilo, dona Delmira, eu posso perguntar de novo. \nR - Agora eu me organizo. \nP1 - Dona Delmira, obrigado por nos receber aqui e por aceitar o nosso convite para escutar a sua história de vida. E para começar, o seu nome completo, o local e a data de nascimento. \nR - Meu nome completo, Delmira Marques da Silva, Remanso, Bahia. \nP1 - E a data de nascimento?\nR - 16 de novembro de 1954, e eu que agradeço, o agradecimento é só meu. \nP1 - Dona Delmira, a senhora conhece a história do seu nascimento?\nR - Pouquíssimo. Pelo o que a minha mãe conta, nasci lá no sertão do Piauí, a minha mãe fala que em uma fazenda, que está s"}, "folder_size_gb": 0.0}, "folder_size_gb": 20.333}, "PCSH_HV649_Juliana Tostes": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV649_ED001.mp4": {"size_mb": 458.3988, "modified": "2018-09-12 16:48:38", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV649_Juliana Tostes\\Audiovisual\\Vídeo\\Edição\\PCSH_HV649_ED001.mp4", "category": "Video", "dimension": "1504x846", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 247881.0, "duration": 247.88}, "PCSH_HV649_ED001_leg.mp4": {"size_mb": 297.0177, "modified": "2019-04-15 15:53:38", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV649_Juliana Tostes\\Audiovisual\\Vídeo\\Edição\\PCSH_HV649_ED001_leg.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "30.000 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 248467.0, "duration": 248.47}, "folder_size_gb": 0.738}, "Íntegra": {"PCSH_HV649.mp4": {"size_mb": 15754.783, "modified": "2018-04-18 02:32:52", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV649_Juliana Tostes\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV649.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 8110035.0, "duration": 8110.03}, "folder_size_gb": 15.386}, "folder_size_gb": 16.123}, "Áudio": {"PCSH_HV649.mp3": {"size_mb":  {"size_mb": 0.0279, "modified": "2026-03-09 16:43:10", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV649_Juliana Tostes\\Iconográfico\\Acervo\\PCSH_HV649_FT03.docx", "category": "Textual", "content_preview": "CADASTRO DE IMAGEM"}, "PCSH_HV649_FT04.docx": {"size_mb": 0.0279, "modified": "2026-03-09 16:43:14", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV649_Juliana Tostes\\Iconográfico\\Acervo\\PCSH_HV649_FT04.docx", "category": "Textual", "content_preview": "CADASTRO DE IMAGEM"}, "PCSH_HV649_FT05.docx": {"size_mb": 0.0279, "modified": "2026-03-09 16:43:16", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV649_Juliana Tostes\\Iconográfico\\Acervo\\PCSH_HV649_FT05.docx", "category": "Textual", "content_preview": "CADASTRO DE IMAGEM"}, "PCSH_HV649_FT06.docx": {"size_mb": 0.0279, "modified": "2026-03-09 16:43:18", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV649_Juliana Tostes\\Iconográfico\\Acervo\\PCSH_HV649_FT06.docx", "category": "Textual", "content_preview": "CADASTRO DE IMAGEM"}, "PCSH_HV649_FT07.docx": {"size_mb": 0.0278, "modified": "2026-03-09 16:43:22", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV649_Juliana Tostes\\Iconográfico\\Acervo\\PCSH_HV649_FT07.docx", "category": "Textual", "content_preview": "CADASTRO DE IMAGEM"}, "folder_size_gb": 0.001}, "folder_size_gb": 0.007}, "Textual": {"PCSH_HV649_Juliana Tostes_edi.docx": {"size_mb": 0.0083, "modified": "2019-04-15 06:50:24", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV649_Juliana Tostes\\Textual\\PCSH_HV649_Juliana Tostes_edi.docx", "category": "Textual", "content_preview": "Nome da história\nEquilíbrio, o primeiro passo\nMinibio\nJuliana Tostes aprendeu com o tempo a amar os palcos. Com teatro e canto, aprendeu algo ainda mais profundo: amar e aceitar a si própria. Mineira, nascida em 1993, mora em Belo Horizonte e segue o caminho para alcançar seus sonhos. Também é a criadora de um dos maiores grupos sobre dermatite atópica no Facebook.\nSinopse\nJuliana aprendeu cedo sobre perda. A morte de seu pai foi a primeira de muitas situações que se tornaram gatilhos emocionais que agravaram o estado de sua dermatite atópica. Com os anos, aprendeu a olhar para seus sentimentos, buscando autoconhecimento e aceitando não só sua pele, mas quem ela é.\nTAGs\ndermatite; depressão; pai; filha; luto; psicológico \nEdição\nEu coloquei uma coisa na minha cabeça depois de uma fala do meu pai, numa época que ele estava doente. Era um café da manhã, estávamos minha mãe, meu pai e eu e ele falou assim: ‘‘Ju, assim que eu for embora, você é quem vai fazer o meu papel. Você vai tomar conta da sua mãe e da sua irmã\". Na hora, eu nem levei a sério.\nMais tarde, eu tive que assumir esse papel de cuidar da minha irmã e da minha mãe, como se eu fosse mais forte. E, obviamente, não fui. Ne"}, "PCSH_HV649_Juliana Tostes_rev.docx": {"size_mb": 0.0455, "modified": "2019-04-15 06:50:14", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV649_Juliana Tostes\\Textual\\PCSH_HV649_Juliana Tostes_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História\nDepoimento de Juliana Tostes\nEntrevistado Denise Cooke e Carol Margiotte\nBelo Horizonte, 16 de abril de 2018\nEntrevista número PCSH_HV649\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\nP/1 - Juliana, primeiro a gente queria te agradecer muito por estar aqui com a gente contando sua história. \nR - Obrigada.\nP/1 - Eu queria começar perguntando para você o seu nome, o local e a sua data de nascimento.\nR - Eu me chamo Juliana Milagres Tostes. Eu moro aqui em Belo Horizonte, mas sou de Barbacena. Eu tenho 24 anos e nasci dia 07/07/1993. \nP/1 - E quais são os nomes dos seus pais?\nR - Maria do Carmo Milagres (Corsi) [00:01:00] Tostes e Luiz Cesar Tostes.\nP/1 - Você tem irmãos?\nR - Tenho uma. Chama-se Ana Paula Tostes.\nP/1 - E ela é mais velha ou mais nova?\nR - Ela é mais nova. Ela vai fazer 20 anos agora em abril.\nP/2 - Você sabe como os seus pais escolheram o seu nome?\nR - O meu eu não sei. Acho que o meu foi à toa: ‘‘Juliana é legal’‘. Eu sei o da minha irmã. Tinha uma jogadora de vôlei que se chamava Ana Paula e o meu pai gostava muito de esportes. Então, disse: ‘‘vou chamar de Ana Paula’‘. \nP/1 - E você sabe alguma coisa sobre o dia do seu n"}, "folder_size_gb": 0.0}, "folder_size_gb": 16.371}, "PCSH_HV650_Márcio Gonçalves": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV650_ED001.mp4": {"size_mb": 396.6244, "modified": "2018-09-12 18:23:58", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV650_Márcio Gonçalves\\Audiovisual\\Vídeo\\Edição\\PCSH_HV650_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 215882.0, "duration": 215.88}, "PCSH_HV650_ED001_leg.mp4": {"size_mb": 256.6254, "modified": "2019-04-15 15:43:00", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV650_Márcio Gonçalves\\Audiovisual\\Vídeo\\Edição\\PCSH_HV650_ED001_leg.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 215882.0, "duration": 215.88}, "folder_size_gb": 0.638}, "Íntegra": {"PCSH_HV650.mp4": {"size_mb": 10412.9538, "modified": "2018-07-07 04:29:50", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV650_Márcio Gonçalves\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV650.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5359688.0, "duration": 5359.69}, "folder_size_gb": 10.169}, "folder_size_gb": 10.807}, "Áudio": {"PCSH_HV650_Márcio Gonçalves.mp3": {"size_mb": 163.6025, "modified": "2018-05-08 10:31:26", \\Alta\\PCSH_HV650_FT06.tif", "category": "Image", "dimension": "2378x2962", "resolution": "2378x2962", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV650_FT06.jpg"}, "PCSH_HV650_FT07.tif": {"size_mb": 4.6322, "modified": "2018-04-24 09:26:40", "extension": "TIF", "full_path": "D:\\Dermatite Atópica\\PCSH_HV650_Márcio Gonçalves\\Iconográfico\\Acervo\\Alta\\PCSH_HV650_FT07.tif", "category": "Image", "dimension": "1161x1763", "resolution": "1161x1763", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV650_FT07.jpg"}, "folder_size_gb": 0.059}, "folder_size_gb": 0.065}, "folder_size_gb": 0.107}, "Textual": {"PCSH_HV650_Márcio Gonçalves_edi.docx": {"size_mb": 0.0077, "modified": "2019-04-15 06:51:16", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV650_Márcio Gonçalves\\Textual\\PCSH_HV650_Márcio Gonçalves_edi.docx", "category": "Textual", "content_preview": "Nome da história\nNão estou sozinho\nMinibio\nMárcio Gonçalves nasceu em 1992. Filho de Marislei e Geraldo e irmão de Laura, hoje Márcio é diretor de atividades do Dermacamp.\nSinopse\nMárcio relembra suas memórias de infância e conta um pouco de sua história e de como conquistou amigos a partir do Dermacamp, acampamento focado em crianças com problemas de pele ou com alguma lesão física. \nTAGs\ndermatite; acampamento; amizade; namoro; abraço\nEdição\nEu já nasci com dermatite atópica e vivo com ela desde sempre. Eu sabia que era diferente por conta do meu problema de pele. Eu tento enxergar o lado positivo da situação. Não é fácil viver com dermatite atópica, porque é uma doença que você tem que ter um autocontrole, você tem que ter uma cautela sobre o que você pode ou não fazer. Eu sei que para mim a dermatite é uma consequência de emoções: se eu estou muito triste, se eu deixar a tristeza dominar, eu sei que em um ou dois dias a dermatite vai aparecer na minha pele.\nNa infância eu tive a oportunidade de conhecer o projeto Dermacamp, destinado a crianças que têm problema de pele, alguma lesão física que abala o psicológico delas - como, por exemplo, não conseguir socializar.\nA gente acol"}, "PCSH_HV650_Márcio Gonçalves_rev.docx": {"size_mb": 0.0376, "modified": "2019-04-15 06:51:22", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV650_Márcio Gonçalves\\Textual\\PCSH_HV650_Márcio Gonçalves_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História\nDepoimento de Márcio Gonçalves\nEntrevistado por Denisse Cooke e Carol Margiotte\nCampinas, 24 de abril de 2018\nEntrevista número: PCSH_HV650\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\nP/1 - Bom dia, Márcio.\nR - Bom dia.\nP/1 - Obrigada por nos convidar aqui para a sua casa, tão gostosa, para te entrevistar.\nR - Imagine.\nP/1 - Vamos começar falando o seu nome, local e data de nascimento.\nR - Eu me chamo Márcio Fernandes Gonçalves, sempre morei em Campinas – estamos aqui agora – e nasci em 1992, dia 19/06.\nP/1 - E você sabe a história do seu nascimento, do dia que você nasceu?\nR - Na verdade, eu sou a segunda gravidez da minha mãe – ela perdeu o primeiro filho. Foi tranquilo, pelo que eu sei, pelo que me contaram foi uma gravidez tranquila. Demorei para nascer, passei dos nove meses, quase dez. E pelo que ela me contava, dentro da barriga eu gostava de ficar no sol. Eu ficava bem quietinho e, quando ela me colocava no sol, eu ficava meio agitado. Não sei se eu estava gostando ou se estava odiando, mas eu respondia aquilo. Teoricamente foi tranquilo, foi um parto normal e foi bom. Não foi uma gravidez de risco, não foi nada disso. \nP/1 - E"}, "folder_size_gb": 0.0}, "folder_size_gb": 11.073}, "PCSH_HV651_Gabriel Souza": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV651_ED001.mp4": {"size_mb": 421.4014, "modified": "2018-09-12 17:07:22", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV651_Gabriel Souza\\Audiovisual\\Vídeo\\Edição\\PCSH_HV651_ED001.mp4", "c ite Atópica\\PCSH_HV651_Gabriel Souza\\Iconográfico\\Making of\\PCSH_HV651_MO003.JPG", "category": "Image", "dimension": "5760x3840", "resolution": "5760x3840", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV651_MO003.jpg"}, "PCSH_HV651_MO004.jpg": {"size_mb": 0.1163, "modified": "2018-09-12 16:30:48", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV651_Gabriel Souza\\Iconográfico\\Making of\\PCSH_HV651_MO004.jpg", "category": "Image", "dimension": "938x530", "resolution": "938x530", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV651_MO004.jpg"}, "folder_size_gb": 0.016}, "folder_size_gb": 0.02}, "Textual": {"PCSH_HV651_Gabriel Souza_edi.docx": {"size_mb": 0.0079, "modified": "2019-04-15 06:52:08", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV651_Gabriel Souza\\Textual\\PCSH_HV651_Gabriel Souza_edi.docx", "category": "Textual", "content_preview": "Nome da história\nSou aquilo que sempre quis ser\nMinibio\nGabriel Souza e Silva nasceu em Jundiaí em novembro de 1998. Tímido, sempre buscou a coragem para ganhar voz.\nSinopse\nTímido, sempre buscou a coragem para ganhar voz. Encontrou isso em seu canal no Youtube, que o fez conhecer pessoas que, como ele, tinham dermatite atópica. Essa jornada mostrou para Gabriel que suas batalhas o fizeram mais resistente, mostrando para ele que dá para continuar.\nTAGs\nyoutube; dermatite atópica; timidez; internet; adolescência.\nEdição\nPor um bom tempo a minha timidez foi uma barreira que me impediu de fazer muitas coisas. Chegou um ponto que eu não estava aguentando mais ficar só sentado num banco com a boca fechada.\nEu sempre quis ter voz, sempre quis que me escutassem, só que você nunca vai conseguir fazer isso se você não abrir a sua boca.\nO que eu comecei a fazer foi tentar enfrentar esses meus medos e essa minha timidez: me inscrevi em um grupo de teatro, criei um canal no Youtube, fiz apresentações, interagi com pessoas diferentes e tentei de todas as formas vencer essa barreira: e consegui.\nA internet foi um bom passo para eu vencer a timidez, porque aprendi a receber críticas e consegui me"}, "PCSH_HV651_Gabriel Souza_rev.docx": {"size_mb": 0.0316, "modified": "2019-04-15 06:52:34", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV651_Gabriel Souza\\Textual\\PCSH_HV651_Gabriel Souza_rev.docx", "category": "Textual", "content_preview": "Programa Conte a Sua História\nDepoimento de Gabriel Souza e Silva\nEntrevistado por Denise Cooke\nJundiaí, 5 de maio de 2018\nEntrevista número PCSH_HV651\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\nP/1 - Bom dia, Gabriel. Obrigada por estar aqui contando a sua história para a gente.\nR - Bom dia. Imagina, é um prazer estar aqui.\nP/1 - Vamos começar. Me fala o seu nome, o seu local e data de nascimento.\nR - Bom, meu nome é Gabriel Souza e Silva eu sou de Jundiaí, São Paulo, e eu nasci em 24 de novembro de 1998.\nP/1 - E você sabe alguma coisa do seu dia de nascimento?\nR - Para falar a verdade, não. Eu só tenho um conhecido que nasceu no mesmo dia, mas não sei se é o dia de alguma coisa ou é um fato.\nP/1 - O parto? O dia que você nasceu, sua mãe te conta alguma história como é que foi?\nR - Do parto eu só sei que foi uma segunda-feira e eu nasci eu acho que 1:00 ou 1:15 da manhã. Mas acho que não tem nenhum fato curioso, não.\nP/1 - Me fala o nome dos seus pais.\nR - O nome da minha mãe é Edna e o nome meu pai é Ari.\nP/1 - Você é filho único?\nR - Sim, sou filho único.\nP/1 - Me fala da sua infância. Você nasceu e cresceu nessa casa?\nR - Não, não exatamente nessa casa. Eu s"}, "folder_size_gb": 0.0}, "folder_size_gb": 8.169}, "PCSH_HV652_Luana Mercante da Rocha Viana": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV652_ED001.mp4": {"size_mb": 400.9937, "modified": "2018-09-12 18:37:24", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV652_Luana Mercante da Rocha Viana\\Audiovisual\\V tegory": "Image", "dimension": "5760x3840", "resolution": "5760x3840", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV652_MO001.jpg"}, "PCSH_HV652_MO002.JPG": {"size_mb": 4.7674, "modified": "2018-05-21 17:34:40", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV652_Luana Mercante da Rocha Viana\\Iconográfico\\Making of\\PCSH_HV652_MO002.JPG", "category": "Image", "dimension": "5760x3840", "resolution": "5760x3840", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV652_MO002.jpg"}, "PCSH_HV652_MO003.JPG": {"size_mb": 4.9592, "modified": "2018-05-21 17:34:40", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV652_Luana Mercante da Rocha Viana\\Iconográfico\\Making of\\PCSH_HV652_MO003.JPG", "category": "Image", "dimension": "5760x3840", "resolution": "5760x3840", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV652_MO003.jpg"}, "folder_size_gb": 0.014}, "folder_size_gb": 0.039}, "Textual": {"PCSH_HV652_Luana Mercante da Rocha Viana_edi.docx": {"size_mb": 0.0074, "modified": "2019-04-15 06:54:22", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV652_Luana Mercante da Rocha Viana\\Textual\\PCSH_HV652_Luana Mercante da Rocha Viana_edi.docx", "category": "Textual", "content_preview": "Nome da história\nMulher, negra e flamenguista\nMinibio\nMulher negra, carioca, Luana hoje assume seu cabelo como ato de afirmação para o mundo. Flamenguista, vai na maior quantidade de jogos que dá. Acha que ir ao estádio é uma sensação única. Tem dermatite atópica e convive com os altos e baixos da doença, sempre aprendendo algo com as crises.\nSinopse\nLuana é mulher negra, carioca e conta como foi voltar a ter cabelo crespo, passar pela transição e se assumir. E também como é ser mulher numa cidade que supervaloriza o corpo. Sobre o corpo, também fala da dermatite atópica, doença que tem e que a fez enfrentar uma grande crise durante a época da faculdade. \nTAGs: dermatite atópica, cachos, crespo, ufrj, crise, pai. \nEdição\nSempre fui muito alérgica, sempre tive bronquite, e a dermatite atópica sempre esteve muito presente. Durante a faculdade tive uma crise. Acho que tem a ver muito com a parte psicológica, emocional, pois havia tido uma discussão com meu pai. Não sei o que aconteceu. Essa crise foi um tormento, foi desesperador. Eu não sei dizer o que passou pela minha cabeça, o que tudo isso culminou, mas foi péssimo. Parece que todo o mundo desabou no mesmo momento.\nVocê fica muit"}, "PCSH_HV652_Luana Mercante da Rocha Viana_rev.docx": {"size_mb": 0.0358, "modified": "2018-10-09 13:15:22", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV652_Luana Mercante da Rocha Viana\\Textual\\PCSH_HV652_Luana Mercante da Rocha Viana_rev.docx", "category": "Textual", "content_preview": "Programa Conte a sua história\nDepoimento de Luana Mercante da Rocha Viana⠀\nEntrevistada por Denise Cooke e Carol Margiotte\nRio de Janeiro, 10 de maio de 2018\nEntrevista número PCSH_HV652\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\n_______________________________________________________________\nP/1 - Oi Luana. Obrigada por estar aqui contando a sua história para a gente. Seja bem-vinda. Vamos começar falando o seu nome, local e data de nascimento.\nR - Meu nome é Luana Mercante da Rocha Viana. Tenho 23 anos e nasci aqui no Rio de Janeiro mesmo. \nP/1 - Você sabe alguma coisa sobre o dia do seu nascimento?\nR - Dia 10 de abril? Não.\nP/1 - Como que foi?\nR - Não tem nenhum marco histórico também. Mas acho que não foi nada fora da normalidade, extraordinário. \nP/1 - E como era a casa onde você nasceu? Onde você passou a sua infância?\nR - Era um apartamento muito bom no Méier. Eu andava de bicicleta dentro dele. A única coisa estranha era que a sala não tinha janela basculante. A sala era imensa. Tinha um corrredorzão, mas ela não tinha janela. Minha mãe detestava o apartamento por causa disso. \nP/1 - E o que você gostava de fazer quando você era criança?\nR - Nossa, eu se"}, "folder_size_gb": 0.0}, "folder_size_gb": 8.852}, "PCSH_HV654_Biel Torres": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV654_ED001.mp4": {"size_mb": 397.8417, "modified": "2018-09-12 18:12:24", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV654_Biel Torres\\Audiovisual\\Vídeo\\Edição\\PCSH_HV654_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 216450.0, "duration": 216.45}, "PCSH_HV654_ED001_leg.mp4": {"size_mb": 257.3165, "modified": "2019-04-11 12:48:20", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV654_Biel Torres\\Audiovisual\\Vídeo\\Edição\\PCSH_HV654_ED001_leg.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 216450.0, "duration": 216.45}, "folder_size_gb": 0.64}, "Íntegra": {"PCSH_HV654.mp4": {"size_mb": 8410.2821, "modified": "2018-07-10 21:56:38", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV654_Biel Torres\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV654.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4329358.0, "duration": 4329.36}, "folder_size_gb": 8.213}, "folder_size_gb": 8.853}, "Áudio": {"PCSH_HV654.mp3": {"size_mb": 66.6608, "modified": "2018-07-31 07:33:06", "extension": "MP3", "full_path": "D:\\Dermatite Atópica\\PCSH_HV654_Biel Torres\\Audiovisual\\Áudio\\PCSH_HV654.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 4367952.0, "duration": 4367.95}, "folder_size_gb": 0.065}, "folder_size_gb": 8.918}, "Iconográfico": {"Acervo": {"Baixa extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV654_Biel Torres\\Textual\\PCSH_HV654_Biel Torres_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História\nDepoimento de Biel Torres\nEntrevistado por Denise Cooke e Carol Margiotte\nAraçatuba, 03 de julho de 2018\nEntrevista número PCSH_HV654\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\nP/1 - Oi, Gabriel. Obrigada por estar aqui contando sua história para a gente. Bem-vindo. Vamos começar falando o seu nome, a data e o local do seu nascimento. \nR - Luís Gabriel Torres de Souza, nasci em Araçatuba, 07 de janeiro de 1999.\nP/1 - E o que você sabe sobre o dia do seu nascimento?\nR - Eu sei que eu demorei muito para nascer, eu acho que eu nasci quase de 10 meses. Geralmente é 9, então eu demorei bastante. Mas foi tranquilo, creio eu. \nP/1 - E você sabe alguma coisa sobre a história do seu nome? \nR - Foi por causa do meu pai, era para ser outro nome, de uma novela. Acho que Alef, não é? Meu pai ia escolher se fosse menina e minha mãe, se fosse menino, iria pôr Alef. Na hora, ele encrencou, não quis e colocou Luís Gabriel. Luís do Luís Carlos dele e Gabriel porque a minha mãe quis.\nP/1 - E o que você lembra da sua infância?\nR - Eu sempre fui muito quieto, muito na minha, mas era uma infância boa, foi tranquila. Brinquei bastante, mas sempre muito quie"}, "PSCH_HV654_Biel Torres_edi.docx": {"size_mb": 0.0087, "modified": "2019-04-15 06:56:22", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV654_Biel Torres\\Textual\\PSCH_HV654_Biel Torres_edi.docx", "category": "Textual", "content_preview": "Nome da história\nHá bondade no mundo\nMinibio\nFã de anime e de jogos, Biel, como costuma ser chamado, passa a maior parte do dia entre essas duas atividades. Por gosto, mas também forçado pela dermatite atópica, doença que tem e trata com garra, mas que exige limitações. Pouco gosta das mesmas coisas que as pessoas de sua geração. Um exemplo é balada, que diz detestar. Seu prazer está nos jogos, nos animes e no trabalho que tinha com seu avô, de ordenhar vaca, cuidar do campo. \nSinopse\nBiel Torres conta sobre sua doença, a dermatite atópica - que, apesar de não ser transmissível, o cachorro também desenvolveu! O motivo pode ter sido por amor: do cachorro com seu dono, de seu vô, que deu o animal mesmo sem gostar de cachorro. Deu porque ouviu que fazia bem ter um animal. Gabriel também conta de sua primeira ida a São Paulo e o que aprendeu vendo um hospital com tanta gente.\nTAGs\ncachorro, avô, Clínicas, hospital, dermatite atópica. \nEdição\nNa época que eu tive uma crise forte, meu cachorro teve dermatite atópica também. Deu nele. Tem explicação: eu ganhei ele porque meu avô ouviu que ter animal fazia bem à pessoa. Aí ele trouxe o cachorro. Tanto que ele detesta animal, detesta cachor"}, "folder_size_gb": 0.0}, "folder_size_gb": 8.958}, "PCSH_HV655_Cíntia Torres": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV655_ED001.mp4": {"size_mb": 431.9424, "modified": "2018-09-12 18:15:34", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV655_Cíntia Torres\\Audiovisual\\Vídeo\\Edição\\PCSH_HV655_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 234101.0, "duration": 234.1}, "PCSH_HV655_ED001_leg.mp4": {"size_mb": 278.9182, "modified": "2019-04-15 11:50:50", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV655_Cíntia Torres\\Audiovisual\\Vídeo\\Edição\\PCSH_HV655_ED001_leg.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 234101.0, "duration": 234.1}, "folder_size_gb": 0.694}, "Íntegra": {"PCSH_HV655.mp4": {"size_mb": 12942.3258, "modified": "2018-07-11 00:06:38", "extension": "MP4", "full_path": "D:\\Dermati pg"}, "PCSH_HV655_FT07.tif": {"size_mb": 11.1957, "modified": "2018-07-03 12:50:08", "extension": "TIF", "full_path": "D:\\Dermatite Atópica\\PCSH_HV655_Cíntia Torres\\Iconográfico\\Acervo\\Alta\\PCSH_HV655_FT07.tif", "category": "Image", "dimension": "1776x2528", "resolution": "1776x2528", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV655_FT07.jpg"}, "folder_size_gb": 0.04}, "folder_size_gb": 0.047}, "Making of": {"PCSH_HV655_MO001.jpg": {"size_mb": 0.0757, "modified": "2018-09-20 15:27:58", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV655_Cíntia Torres\\Iconográfico\\Making of\\PCSH_HV655_MO001.jpg", "category": "Image", "dimension": "930x480", "resolution": "930x480", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV655_MO001.jpg"}, "PCSH_HV655_MO002.JPG": {"size_mb": 5.537, "modified": "2018-07-11 15:14:06", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV655_Cíntia Torres\\Iconográfico\\Making of\\PCSH_HV655_MO002.JPG", "category": "Image", "dimension": "5760x3840", "resolution": "5760x3840", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV655_MO002.jpg"}, "folder_size_gb": 0.005}, "folder_size_gb": 0.053}, "Textual": {"PCSH_HV655_Cíntia Torres_edi.docx": {"size_mb": 0.0095, "modified": "2019-04-15 06:57:38", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV655_Cíntia Torres\\Textual\\PCSH_HV655_Cíntia Torres_edi.docx", "category": "Textual", "content_preview": "Nome da história\nA fé, a vida e as feridas do meu filho Gabriel\nMinibio\nCíntia nasceu em Araçatuba, em março de 1974. Crescendo com um superpai e uma mãe confidente, como ela mesmo gosta de definir. Família estável, condições financeiras, uma infância para não se esquecer. Foram anos para Cíntia começar a conhecer as dores da vida. Dores que encarou com firmeza, seguindo os valores e aprendizados que seu pai deixou. Trabalhou como faxineira, catadora de lixo, bordadeira. Tudo o que poderia dar uma melhor condição melhor para seus filhos e para ela. Foi morar em um assentamento, onde construiu sua casa e seu lar. Tem um filho e uma filha. Gabriel, seu filho, tem dermatite atópica e vai com Cíntia diversas vezes para São Paulo receber tratamento. \nSinopse\nCíntia conta sobre seu filho, Gabriel, que tem dermatite atópica. Narra com a dor de uma mãe as feridas - não do corpo, mas da alma - e o sofrimento que seu filho por vezes sente, que também dói nela. Conta o envolvimento do Gabriel com a fé e com a igreja e das dificuldades de sua doença. Dos sonhos interrompidos. Mas fala, acima de tudo, sobre o amor incondicional de uma mãe para seu filho. \nTAGs: dermatite atópica, igreja, fé, do"}, "PCSH_HV655_Cíntia Torres_rev.docx": {"size_mb": 0.0452, "modified": "2019-04-15 06:57:48", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV655_Cíntia Torres\\Textual\\PCSH_HV655_Cíntia Torres_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História\nDepoimento de Cíntia Torres\nEntrevistada por Carolina Margiotte e Denise Cooke\nAraçatuba, 03 de julho de 2018\nEntrevista nº PCSH_HV655\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\nP/1 - Obrigada, Cíntia. Cíntia, boa tarde. \nR - Boa tarde. \nP/1 - Obrigada por receber a gente aqui hoje na sua casa. \nR - Eu que agradeço. \nP/1 - E para começar, o seu nome completo?\nR - Cíntia Helena Batista Torres. \nP/1 - Local e data de nascimento?\nR - Araçatuba, 21 de março de 1974. \nP/1 - E você sabe porque seus pais te batizaram de Cíntia Helena?\nR - Bom, meu pai sempre gostou de Helena, sempre gostava desse nome, e meu pai se chamava Aracinto, mas ele tinha o apelido de Cíntio, e veio a Cíntia. \nP/1 - E seus pais contam ou contavam alguma história do dia do seu nascimento, como foi?\nR - Meu pai estava viajando, minha morava em um bairro aqui de Araçatuba, mas naquela época era bem assim, ela não tinha carro próprio, e ela passou mal, meu avô que levou, e já chamou, foi de taxi, porque morava em um bairro mais distante, não era uma cidade igual é hoje. Mas foi tranquilo. \nP/1 - E falando nos seus pais, qual o nome deles?\nR - Minha mãe é Márcia Pedrina B"}, "folder_size_gb": 0.0}, "folder_size_gb": 13.485}, "PCSH_HV657_Caio de Castro": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV657_ED001.mp4": {"size_mb": 277.8635, "modified": "2018-12-18 15:19:18", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV657_Caio de Castro\\Audiovisual\\Vídeo\\Edição\\PCSH_HV657_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 232365.0, "duration": 232.37}, "PCSH_HV657_ED001_leg.mp4": {"size_mb": 279.0619, "modified": "2019-04-15 16:05:42", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV657_Caio de Castro\\Audiovisual\\Vídeo\\Edição\\PCSH_HV657_ED001_leg.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "30.000 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 232967.0, "duration": 232.97}, "folder_size_gb": 0.544}, "Íntegra": {"PCSH_HV657.mp4": {"size_mb": 13713.7108, "modified": "2018-10-09 19:57:20", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV657_Caio de Castro\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV657.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7056917.0, "duration": 7056.92}, "folder_size_gb": 13.392}, "folder_size_gb": 13.936}, "Áudio": {"PCSH_HV657.mp3": {"size_mb": 108.7099, "modified": "2018-09-11 06:53:24", "extension": "MP3", "full_path": "D:\\Dermatite Atópica\\PCSH_HV657_Caio de Castro\\Audiovisual\\Áudio\\PCSH_HV657.mp3", "category": "Audio", "audio_channels" astro\\Iconográfico\\Acervo\\Alta\\PCSH_HV657_FT13.tif", "category": "Image", "dimension": "2385x2972", "resolution": "2385x2972", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV657_FT13.jpg"}, "folder_size_gb": 0.131}, "folder_size_gb": 0.146}, "Making of": {"PCSH_HV657_MO001.jpg": {"size_mb": 7.0249, "modified": "2018-09-11 12:35:18", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV657_Caio de Castro\\Iconográfico\\Making of\\PCSH_HV657_MO001.jpg", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "240 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV657_MO001.jpg"}, "PCSH_HV657_MO002.jpg": {"size_mb": 6.4896, "modified": "2018-09-11 12:35:18", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV657_Caio de Castro\\Iconográfico\\Making of\\PCSH_HV657_MO002.jpg", "category": "Image", "dimension": "2802x3706", "resolution": "2802x3706", "color_mode": "RGB", "dpi": "240 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV657_MO002.jpg"}, "folder_size_gb": 0.013}, "folder_size_gb": 0.16}, "Textual": {"PCSH_HV657_Caio de Castro_rev.docx": {"size_mb": 0.043, "modified": "2019-04-15 06:59:58", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV657_Caio de Castro\\Textual\\PCSH_HV657_Caio de Castro_rev.docx", "category": "Textual", "content_preview": "Programa Conte a sua História\nDepoimento de Caio de Castro\nEntrevistado por Carol Margiotte e Denise Cooke\nCuritiba, 23 de agosto de 2018\nEntrevista número PCSH_HV657\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\nP/1 - Doutor, bom dia. \nR - Bom dia.\nP/1 - Obrigada por receber a gente aqui hoje e para começar, por gentileza seu nome completo.\nR - Caio César Silva de Castro.\nP/1 - Local e data de nascimento?\nR - Jacarezinho, Paraná. 25 de fevereiro de 1967.\nP/1 - E o senhor sabe porque os seus pais te deram esse nome, Caio César?\nR - Meu pai é Júlio César, meu irmão é Marco Antônio. Minha mãe era professora de história, ela gostava bastante. Provavelmente isso, mas eu não sei se pela sonoridade. César também é da minha família. Do meu avô é José César. César era um nome de família. É da cidade Cerqueira César, lá do lado de Avaré. Então, a família César. E o César do meu pai, meu, veio de enfeito, mas não é mais sobrenome, mas acabou vindo de roldão na família. \nP/1 - E os seus pais contavam a história de como foi o dia do seu nascimento?\nR - Não. Eu só sei que eu nasci de fórceps e naquela época não se sabia o sexo da criança, então, eles não sabiam, compravam o enx"}, "PCSH_HV657_Caio de Castro_ed.docx": {"size_mb": 0.0087, "modified": "2018-12-26 05:03:52", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV657_Caio de Castro\\Textual\\PCSH_HV657_Caio de Castro_ed.docx", "category": "Textual", "content_preview": "Nome da história:\nSer médico: o exercício de se colocar no lugar do outro\nMinibio: \nCaio de Castro nasceu em Jacarezinho, Paraná, no ano de 1967. Criado no interior, lembra-se com carinho da infância na cidade pequena. Assim como as expressões em italiano de sua avó, que viraram patrimônio da família. Descobrindo o nome aprovado para o curso de medicina, Caio também despertou um sentimento de orgulho em toda a família: agora teriam um médico entre eles. Enquanto se formava, nutria outra grande paixão: a poesia.\nSinopse:\nCaio seria o primeiro médico da família. A comoção foi geral quando soube pelo jornal que havia sido aprovado na faculdade. Nos estudos, não demorou muito para descobrir a especialidade que seguiria: dermatologia. Na sua cidade havia muitas pessoas com hanseníase e o desejo do Caio era ajudá-los. O mesmo desejo que move ele até hoje, atendendo pessoas com problema de pele com carinho e empatia, buscando entender as dores de seu paciente. Com o passar dos anos, concluiu que a dermatite atópica é a mais grave das doenças de pele que trata hoje. \nTAGs: dermatite atópica; empatia; consulta; medicina; faculdade\nHistória:\nSou o primeiro médico de uma família de agricultor"}, "folder_size_gb": 0.0}, "folder_size_gb": 14.202}, "PCSH_HV658_Lincoln Fabrício": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV658_ED001.mp4": {"size_mb": 210.1975, "modified": "2018-12-18 15:23:42", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV658_Lincoln Fabrício\\Audiovisual\\Vídeo\\Edição\\PCSH_HV658_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 177244.0, "duration": 177.24}, "PCSH_HV658_ED001_leg.mp4": {"size_mb": 211.312, "modified": "2019-04-15 15:53:38", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV658_Lincoln Fabrício\\Audiovisual\\Vídeo\\Edição\\PCSH_HV658_ED001_leg.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "30.000 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 178633.0, "duration": 178.63}, "folder_size_gb": 0.412}, "Íntegra": {"PCSH_HV658.mp4": {"size_mb": 14492.0633, "modified": "2018-10-10 00:36:54", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV658_Lincoln Fabrício\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV658.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7459452.0, "duration": 7459.45}, "folder_size_gb": 14.152}, "folder_size_gb": 14.564}, "Áudio": {"PCSH_HV658.mp3": {"size_mb": 113.8324, "modified": "2018-09-11 06:54:08", "extension": "MP3", "full_path": "D:\\Dermatite Atópica\\PCSH_HV658_Lincoln Fabrício\\Audiovisual\\Áudio\\PCSH_HV658.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 7459512.0, "duration": 7459.51}, "folder_size_gb": 0.111}, "folder_size_gb": 14.675}, sion": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV658_Lincoln Fabrício\\Iconográfico\\Acervo\\Baixa\\PCSH_HV658_FT08.jpg", "category": "Image", "dimension": "934x1271", "resolution": "934x1271", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV658_FT08.jpg"}, "PCSH_HV658_FT09.JPG": {"size_mb": 0.1729, "modified": "2019-02-11 10:11:16", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV658_Lincoln Fabrício\\Iconográfico\\Acervo\\Baixa\\PCSH_HV658_FT09.JPG", "category": "Image", "dimension": "1136x1128", "resolution": "1136x1128", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV658_FT09.jpg"}, "PCSH_HV658_FT10.jpg": {"size_mb": 0.127, "modified": "2019-02-11 10:11:18", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV658_Lincoln Fabrício\\Iconográfico\\Acervo\\Baixa\\PCSH_HV658_FT10.jpg", "category": "Image", "dimension": "960x540", "resolution": "960x540", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV658_FT10.jpg"}, "folder_size_gb": 0.007}, "folder_size_gb": 0.068}, "Making of": {"PCSH_HV658_MO001.jpg": {"size_mb": 10.4179, "modified": "2018-09-11 12:35:18", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV658_Lincoln Fabrício\\Iconográfico\\Making of\\PCSH_HV658_MO001.jpg", "category": "Image", "dimension": "3307x5000", "resolution": "3307x5000", "color_mode": "RGB", "dpi": "240 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV658_MO001.jpg"}, "PCSH_HV658_MO002.jpg": {"size_mb": 4.8372, "modified": "2018-09-11 12:35:18", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV658_Lincoln Fabrício\\Iconográfico\\Making of\\PCSH_HV658_MO002.jpg", "category": "Image", "dimension": "3131x4749", "resolution": "3131x4749", "color_mode": "RGB", "dpi": "240 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV658_MO002.jpg"}, "folder_size_gb": 0.015}, "folder_size_gb": 0.083}, "Textual": {"PCSH_HV658_Lincoln Fabrício_rev.docx": {"size_mb": 0.0439, "modified": "2019-04-15 07:00:46", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV658_Lincoln Fabrício\\Textual\\PCSH_HV658_Lincoln Fabrício_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História\nDepoimento de Lincoln Fabrício\nEntrevistado por Denise Cooke e Carol Margiotte\nCuritiba, 23 de agosto de 2018\nEntrevista número PCSH_HV658\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\nP/1 - Boa tarde, Lincoln, muito obrigada por estar aqui contando a sua história para a gente. Em primeiro lugar, gostaria que você falasse o seu nome completo.\nR - Boa tarde. O prazer é todo meu. Lincoln Helder Zambaldi Fabricio.\nP/1 - A data e o local do seu nascimento.\nR - 27 de março de 72, Curitiba, Paraná.\nP/1 - Você sabe alguma coisa sobre o dia do seu nascimento?\nR - Acho que um dia muito feliz. Horrível começar falando assim. Tenho que dizer onde vivem meus pais. Tem muita história, já que você falou do meu nome, eu fiquei pensando no meu pai. Meu pai namorava minha mãe e falava que se um dia fosse ter um filho homem que se chamaria Lincoln e virou um nome composto, Lincoln Helder, meu pai gostava de duas grandes personalidades, e ainda gosta, Abraham Lincoln e o bispo Dom Helder. Então, ele juntou os nomes e nasceu Lincoln Helder.\nP/1 - Qual é o nome dos seus pais?\nR - Antônio Gerson Fabricio, conhecido como Fabricio. Meu pai pouca gente conhece,"}, "PCSH_HV658_Lincoln Helder Zambaldi Fabricio_EDI.docx": {"size_mb": 0.009, "modified": "2019-04-15 07:19:32", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV658_Lincoln Fabrício\\Textual\\PCSH_HV658_Lincoln Helder Zambaldi Fabricio_EDI.docx", "category": "Textual", "content_preview": "História:\nMedicina: escola da vida\nMinibio:  Lincoln Helder Zambaldi Fabricio nasceu no Paraná em março de 1972. Seu nome é a junção de dois ídolos de seu pai: Abraham Lincoln e o Bispo Dom Helder. Da infância, se lembra das visitas gostosas a casa dos avós. Era lá que passava as férias, rodeado de lanchinhos e música. O contato com o tio e a influência de um professor da escola o fizeram escolher medicina, profissão que não só ama, mas que julga uma escola de vida. Nela, descobriu a importância de escutar e de se preocupar com o outro. Nos momentos vagos, encontra na família, na poesia e na música suas válvulas de escape e alegria. \nSinopse: Lincoln Fabrício sempre se interessou na relação entre o médico e paciente. Nunca quis ser só um doutor que “canetava” uma receita, sem ao menos olhar nos olhos do paciente. Gosta é de puxar a cadeira, se colocar atento e escutar. De ajudar realmente alguém. Os anos de carreira o ensinaram que a medicina é uma grande escola de vida, que ele recomenda para todo mundo. \nTAGs: dermatite atópica; medicina; empatia; cuidado; paternidade\nHistória\nSempre a relação médico-paciente é uma coisa que me destacou. A maneira de falar, a maneira de cuidar. E"}, "folder_size_gb": 0.0}, "folder_size_gb": 14.759}, "PCSH_HV660_Maria Helena Santana Mandelbaum": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV660_ED001.mp4": {"size_mb": 332.1225, "modified": "2018-12-18 15:22:02", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV660_Maria Helena Santana Mandelbaum\\Audiovisual\\Vídeo\\Edição\\PCSH_HV660_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 276443.0, "duration": 276.44}, "PCSH_HV660_ED001_leg.mp4": {"size_mb": 333.2882, "modified": "2019-04-15 15:53:38", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV660_Maria Helena Santana Mandelbaum\\Audiovisual\\Vídeo\\Edição\\PCSH_HV660_ED001_leg.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "30.000 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 277067.0, "duration": 277.07}, "folder_size_gb": 0.65}, "Íntegra": {"PCSH_HV660.mp4": {"size_mb": 7026.9734, "modified": "2018-10-15 08:43:24", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV660_Maria Helena Santana Mandelbaum\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV660.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3617380.0, "duration": 3617.38}, "folder_size_gb": 6.862}, "folder_size_gb": 7.512}, "Áudio": {"PCSH_HV660.mp3": {"size_mb": 110.3617, "modified": "2018-10-08 16:11:36", "extension": "MP3", "full_path": "D:\\Dermatite Atópica\\PCSH_HV660_Maria Helena Santana Mandelbaum\\Audiovisual\\Áudio\\PCSH_HV660.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 3615758.0, "duration": 3615.76}, "folder_size_gb": 0.108}, "folder_size_gb": 7.62}, "Iconográfico": {"Making of": {"PCSH_HV660_MO001.jpeg": {"size_mb": 5.1409, "modified": "2018-10-15 14:11:00", "extension": "JPEG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV660_Maria Helena Santana Mandelbaum\\Iconográfico\\Making of\\PCSH_HV660_MO001.jpeg", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV660_MO001.jpg"}, "PCSH_HV660_MO002.jpeg": {"size_mb": 5.1768, "modified": "2018-10-15 14:11:00", "extension": "JPEG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV660_Maria Helena Santana Mandelbaum\\Iconográfico\\Making of\\PCSH_HV660_MO002.jpeg", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV660_MO002.jpg"}, "folder_size_gb": 0.01}, "folder_size_gb": 0.01}, "Textual": {"PCSH_HV660_Maria Helena Santana Mandelbaum_rev.docx": {"size_mb": 0.0267, "modified": "2019-04-15 07:03:56", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV660_Maria Helena Santana Mandelbaum\\Textual\\PCSH_HV660_Maria Helena Santana Mandelbaum_rev.docx", "category": "Textual", "content_preview": "Programa conte a sua história\nDepoimento de Maria Helena Santana Mandelbaum\nentrevistada por Denise Cooke\nSão José dos Campos, 02 de outubro de 2018\nEntrevista número PCSH_HV660\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\nP/1 - Bom dia doutora. Muito obrigada por estar aqui contando a sua história para a gente. Fala para nós o seu nome.\nR - O meu nome é Maria Helena Santana Mandelbaum. \nP/1 - Onde e quando a senhora nasceu?\nR - Eu nasci em São Paulo, no bairro da Freguesia do Ó, no dia dez de junho de 1953.\nP/1 - A senhora sabe alguma coisa sobre o dia do seu nascimento?\nR - Eu sempre tive muita curiosidade. Eu sou muito curiosa. Eu quis saber de outras pessoas que nasceram no mesmo dia que eu. Eu descobri, por exemplo, que o Frank Sinatra faz aniversário no mesmo dia. Eu adoro música. Eu descobri que tem vários escritores, cientistas. Eu tive sempre essa curiosidade de saber se eu tinha nascido em um dia importante não só para a minha mãe, mas para outras pessoas ou para a humanidade. \nP/1 - Me fala uma coisa; como seus pais se conheceram?\nR - Meus pais se conheceram, na verdade, como era comum naquela época. Eles são de Minas Gerais, da região de Mariana, Ouro"}, "PSCH_HV660_Maria Helena Santana Mandelbaum_REV_LYK.docx": {"size_mb": 0.0082, "modified": "2018-12-26 04:53:42", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV660_Maria Helena Santana Mandelbaum\\Textual\\PSCH_HV660_Maria Helena Santana Mandelbaum_REV_LYK.docx", "category": "Textual", "content_preview": "Nome da história: Quero cuidar das pessoas: ser enfermeira!\nMinibio: Maria Helena Mandelbaum nasceu no dia 10 de junho de 1953, “o mesmo dia que Frank Sinatra faz aniversário”, orgulha-se. Mas é apenas um de tantos orgulhos que compartilha: a vida que leva, as pessoas que tem ao redor, o propósito de vida que encontrou cedo e o projeto que ajudou a criar, o Dermacamp. Ao perder o pai quando ainda era pequena, se viu cuidando dos irmãos menores enquanto a mãe se dedicava aos outros afazeres. Foi aí que descobriu sua paixão maior: cuidar do outro. Hoje, se alegra por fazer isso. \nSinopse: Maria Helena Mandelbaum é enfermeira “desde sempre”. Um dos seus maiores prazeres é cuidar das pessoas, acolher e ajudar o outro. Desde pequena já fazia isso, primeiro com os irmãos, depois em um consultório, ainda adolescente. Quando chegou a época da faculdade, não restava dúvidas do que queria para o resto da vida: continuar enfermeira. Aprendeu a importância de grupos de apoio para os pacientes. Com o tempo, idealizou o Dermacamp. O acampamento de dermatologia ganhou vida para acolher crianças com doenças de pele e para dar mais sentido, não só à vida das pessoas atendidas, mas também à jornada"}, "folder_size_gb": 0.0}, "folder_size_gb": 7.63}, "PCSH_HV661_Samuel Henrique Mandelbaum": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV661_ED001.mp4": {"size_mb": 310.8317, "modified": "2018-12-18 15:32:12", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV661_Samuel Henrique Mandelbaum\\Audiovisual\\Vídeo\\Edição\\PCSH_HV661_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 259359.0, "duration": 259.36}, "PCSH_HV661_ED001_leg.mp4": {"size_mb": 312.1832, "modified": "2019-04-15 16:05:42", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV661_Samuel Henrique Mandelbaum\\Audiovisual\\Vídeo\\Edição\\PCSH_HV661_ED001_leg.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "30.000 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 260000.0, "duration": 260.0}, "folder_size_gb": 0.608}, "Íntegra": {"PCSH_HV661 372x586", "color_mode": "RGBA", "dpi": "149 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV661_FT005.jpg"}, "PCSH_HV661_FT007.png": {"size_mb": 0.4861, "modified": "2020-03-05 17:24:26", "extension": "PNG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV661_Samuel Henrique Mandelbaum\\Iconográfico\\Acervo\\Baixa\\PCSH_HV661_FT007.png", "category": "Image", "dimension": "435x624", "resolution": "435x624", "color_mode": "RGBA", "dpi": "149 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV661_FT007.jpg"}, "folder_size_gb": 0.005}, "folder_size_gb": 0.005}, "Making of": {"PCSH_HV661_MO001.jpeg": {"size_mb": 5.8633, "modified": "2018-10-15 14:11:00", "extension": "JPEG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV661_Samuel Henrique Mandelbaum\\Iconográfico\\Making of\\PCSH_HV661_MO001.jpeg", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV661_MO001.jpg"}, "PCSH_HV661_MO002.jpeg": {"size_mb": 4.9079, "modified": "2018-10-15 14:11:00", "extension": "JPEG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV661_Samuel Henrique Mandelbaum\\Iconográfico\\Making of\\PCSH_HV661_MO002.jpeg", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV661_MO002.jpg"}, "folder_size_gb": 0.011}, "folder_size_gb": 0.016}, "Textual": {"PCSH_HV661_Samuel Henrique Mandelbaum_edi.docx": {"size_mb": 0.0086, "modified": "2019-04-15 07:05:30", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV661_Samuel Henrique Mandelbaum\\Textual\\PCSH_HV661_Samuel Henrique Mandelbaum_edi.docx", "category": "Textual", "content_preview": "Nome da história:\nTrabalhamos para que a criança possa ser só criança\nMinibio: Samuel Henrique Mandelbaum nasceu no interior de São Paulo no ano de 1951, mês de outubro. Carrega consigo as ótimas lembranças de uma infância em cidade pequena, da vontade em conhecer todas as pessoas que por ele passavam e das brincadeiras sem medo. Daquela época, também lembra de querer ser médico. Desejo realizado quando alcançou a idade adulta, quando passou a morar em São Paulo. Na nova cidade, descobriu alguns amores: a esposa, o contato com músicos e a dermatologia - foi nessa área que se especializou e décadas depois criou o Dermacamp, acampamento que recebe crianças com doenças de pele.\nSinopse: Samuel Mandelbaum criou o Dermacamp buscando realizar um sonho: ver crianças podendo ser apenas crianças. O acampamento dermatológico, que busca atender crianças com doenças de pele, já recebeu muitas pessoas nos seus poucos anos de existência. Samuel se orgulha das crianças que chegam acanhadas e saem autênticas, felizes consigo mesmas independente dos problemas. Nesses momentos, ele se lembra do seu sonho e sorri, porque ele enxerga crianças sendo só crianças. \nTAGs: dermacamp; dermatite atópica; med"}, "PCSH_HV661_Samuel Henrique Mandelbaum_rev.docx": {"size_mb": 0.0288, "modified": "2019-04-15 07:05:40", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV661_Samuel Henrique Mandelbaum\\Textual\\PCSH_HV661_Samuel Henrique Mandelbaum_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História\nDepoimento de Samuel Henrique Mandelbaum\nEntrevistado por Denise Cooke\nSão José dos Campos, 2 de outubro de 2018\nEntrevista número PCSH_HV661\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\nP/1 - Boa tarde doutor, muito obrigada por estar aqui contando a sua história para a gente. Fala para a gente o seu nome.\nR -  Boa tarde, é um prazer enorme estar com vocês. O meu nome é Samuel Henrique Mandelbaum.\nP/1 - Em que ano e onde o senhor nasceu?\nR -  Eu nasci em 1950, 21 de outubro, na cidade de Assis, interior do estado de São Paulo, na região da antiga Sorocabana.\nP/1 - Conta um pouco para a gente a história dos seus pais. Como eles se chamavam?\nR -  O meu pai se chamava Summer Mandelbaum, ele nasceu na Polônia, numa cidade pequena, chamada Sandomierz, ele nasceu em 1917. Ele veio para o Brasil muito novo, com 19 anos. A família da minha mãe, minha mãe nasceu no interior de São Paulo, na cidade de Quatá, também na região da Sorocabana, e a família dela é de origem portuguesa, a mãe e o pai vieram para o Brasil de navio em 1896. O meu pai nasceu na Polônia, nessa cidade pequena, e veio para o Brasil antes de começar a segunda guerra mundial,"}, "folder_size_gb": 0.0}, "folder_size_gb": 10.201}, "PCSH_HV663_Martti Antila": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV663_ED001.mp4": {"size_mb": 270.8753, "modified": "2018-12-19 10:20:04", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV663_Martti Antila\\Audiovisual\\Vídeo\\Edição\\PCSH_HV663_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 226326.0, "duration": 226.33}, "PCSH_HV663_ED001_leg.mp4": {"size_mb": 270.6732, "modified": "2019-04-11 12:48:20", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV663_Martti Antila\\Audiovisual\\Vídeo\\Edição\\PCSH_HV663_ED001_leg.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 226326.0, "duration": 226.33}, "folder_size_gb": 0.529}, "Íntegra": {"PCSH_HV663.mp4": {"size_mb": 9317.3697, "modified": "2018-11-26 20:13:20", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV663_Martti Antila\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV663.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7574134.0, "duration": 7574.13}, "folder_size_gb": 9.099}, "folder_size_gb": 9.628}, "Áudio": {"PCSH_HV663.mp3": {"size_mb": 115.7118, "modified": "2018-12-05 08:01:00", "extension": "MP3", "full_path": "D:\\Dermatite Atópica\\PCSH_HV663_Martti Antila\\Audiovisual\\Áudio\\PCSH_HV663.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 7582680.0, "duration": 7582.68}, "folder_size_gb": 0.113}, "folder_size_gb": 9.741}, "Iconográfico": {"Making of": {"PCSH_HV663_MO001.CR2": {"size_mb": 23.8536, "modified": "2018-11-28 15:04:04", "extension": "CR2", "full_path": "D:\\Dermatite Atópica\\PCSH_HV663_Martti Antila\\Iconográfico\\Making of\\PCSH_HV663_MO001.CR2", "category": "Image"}, "PCSH_HV663_MO002.JPG": {"size_mb": 4.3802, "modified": "2018-11-28 15:04:04", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV663_Martti Antila\\Iconográfico\\Making of\\PCSH_HV663_MO002.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV663_MO002.jpg"}, "PCSH_HV663_MO003.CR2": {"size_mb": 23.2581, "modified": "2018-11-28 15:04:04", "extension": "CR2", "full_path": "D:\\Dermatite Atópica\\PCSH_HV663_Martti Antila\\Iconográfico\\Making of\\PCSH_HV663_MO003.CR2", "category": "Image"}, "PCSH_HV663_MO004.JPG": {"size_mb": 5.4244, "modified": "2018-11-28 15:04:04", "extension": "JPG", "full_path": "D:\\Dermatite Atópica\\PCSH_HV663_Martti Antila\\Iconográfico\\Making of\\PCSH_HV663_MO004.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0110/thumb_PCSH_HV663_MO004.jpg"}, "folder_size_gb": 0.056}, "folder_size_gb": 0.056}, "Textual": {"PCSH_HV663_Martti Atila_rev.docx": {"size_mb": 0.0414, "modified": "2019-04-15 07:07:06", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV663_Martti Antila\\Textual\\PCSH_HV663_Martti Atila_rev.docx", "category": "Textual", "content_preview": "Programa Conte sua História\nDepoimento de Martti Atila\nEntrevistado por Carol Margiotte\nSorocaba, 23 de novembro de 2018\nEntrevista número PCSH_HV663\nRealização: Museu da Pessoa\nRevisado e editado por Bruno Pinho\nP/1 - Doutor, boa tarde. Muito obrigada por receber a gente aqui hoje. \nR - Eu que agradeço. \nP/1 - E, para começar, seu nome completo. \nR - Martti Anton Antila. \nP/1 - O local e a data do nascimento. \nR - Bom, eu nasci em Mogi das Cruzes, dia 08 de maio de 1963. \nP/1 - E seus pais contavam histórias para o senhor sobre o dia do seu nascimento, como foi?\nR - Sim, meus pais são da Finlândia e mudaram para o Brasil, no começo da década de 60, primeiro ele veio; e mudaram para Mogi das Cruzes, onde ele acabou montando a fábrica de tratores (Valmet) [00:01:12]. Então graças ao boom econômico daquela época, então havia uma indústria finlandesa de tratores. E, nesse período, meus pais já tinham dois filhos: o Marco, que era o mais velho, que já mudou para o Brasil por volta dos nove, dez anos; e minha irmã, um ano menos. Minha mãe acabou engravidando, em 1962, logo após a vinda para o Brasil. Acabo nascendo em maio de 63, pequenininho, com quase dois quilos, saindo do hospital c"}, "PCSH_HV663_Martti Atila_edi.docx": {"size_mb": 0.0092, "modified": "2018-12-26 05:13:32", "extension": "DOCX", "full_path": "D:\\Dermatite Atópica\\PCSH_HV663_Martti Antila\\Textual\\PCSH_HV663_Martti Atila_edi.docx", "category": "Textual", "content_preview": "Nome da história:\nUm médico de quebrar barreiras\nMinibio: Martti Antila nasceu em Mogi das Cruzes no início da década de 1960. É filho de pais finlandeses que se mudaram para o Brasil. Por isso, tem uma criação dupla: a brasileira e a finlandesa. Apesar de ter sonhado em ser engenheiro, se tornou médico. E hoje sorri ao contar que tomou uma sábia decisão ao decepcionar os sonhos do menino Martti. Casou com Cláudia, companheira que conheceu quando tinha 14 anos. Com ela teve dois filhos, que para sua alegria se tornaram médicos. De sonhos, hoje só carrega um principal: continuar tendo amigos e pessoas especiais para viver bons momentos. \nSinopse: Até a adolescência, Martti Antila sonhava em ser engenheiro. Inspirado no pai e no irmão, fantasia como seria os dias na futura profissão que tinha como certa. Mas aos 49 do segundo tempo, como gosta de dizer, mudou de ideia: decidiu ser médico. Queria fixar raízes - e enxergava na medicina o melhor jeito para isso. Mas não foi isso o que aconteceu: pouco tempo depois, iria morar na Finlândia para estudar. Também se encantaria pelo tratamento de alergias e um contato mais humano com os pacientes. E é isso que leva para seus pacientes de der"}, "folder_size_gb": 0.0}, "folder_size_gb": 9.796}, "PCSH_HV664_Thiago Daher": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV664_ED001.mp4": {"size_mb": 258.6997, "modified": "2018-12-19 11:02:30", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV664_Thiago Daher\\Audiovisual\\Vídeo\\Edição\\PCSH_HV664_ED001.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 216616.0, "duration": 216.62}, "PCSH_HV664_ED001_leg.mp4": {"size_mb": 258.7567, "modified": "2019-04-15 11:50:50", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV664_Thiago Daher\\Audiovisual\\Vídeo\\Edição\\PCSH_HV664_ED001_leg.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 216616.0, "duration": 216.62}, "folder_size_gb": 0.505}, "Íntegra": {"PCSH_HV664.mp4": {"size_mb": 11651.5069, "modified": "2018-12-12 19:50:54", "extension": "MP4", "full_path": "D:\\Dermatite Atópica\\PCSH_HV664_Thiago Daher\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV664.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels":
