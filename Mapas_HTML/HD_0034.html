ares_ed.doc": {"size_mb": 0.0425, "modified": "2019-06-07 07:38:20", "extension": "DOC", "full_path": "H:\\Programa Conte sua História (2011)\\Doadores de Sabedoria\\PCSH_HV317_Maria José Reis dos Anjos Moniz Soares\\Textual\\PCSH_HV317_Maria José Reis dos Anjos Moniz Soares_ed.doc", "category": "Textual"}, "PCSH_HV317_Maria José Reis dos Anjos Moniz Soares_ed.docx": {"size_mb": 0.0122, "modified": "2026-02-24 13:16:58", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Doadores de Sabedoria\\PCSH_HV317_Maria José Reis dos Anjos Moniz Soares\\Textual\\PCSH_HV317_Maria José Reis dos Anjos Moniz Soares_ed.docx", "category": "Textual", "content_preview": "Conte sua História – Memória dos brasileiros\nDepoimento de Maria José Reis dos Anjos Muniz Soares\nEntrevistada por Fernanda Prado\nSão Paulo, 15 de agosto de 2011\nRealização Museu da Pessoa\nEntrevista número PCSH_HV317\nMinibio\nMaria José Reis dos Anjos Muniz Soares, nasceu em Lisboa, no dia 27 de outubro de 1926. Desde pequena tocava piano de ouvido e chegou a estudar Música. Tocou com orquestra de câmara e dessa experiência com a música é que lhe foi possível superar com destreza os desafios da vida. Aos mais de 40 anos e três filhas, imigrou ao Brasil na esperança de se acertar com o marido que nunca mais apareceu. Maria José foi chamada a trabalhar para a Copersucar, para dar um rosto, uma face ao açúcar. Trabalhou fazendo receitas de doces na televisão e ministrando aulas de culinária, sempre de doces. Aposentou-se e, até hoje, lembra-se com carinho do seu tempo de trabalho.\nSinopse\nMaria José nascida em Portugal narra como foi sua infância por ali e como foi a descoberta da música. Desde pequena sentava-se ao piano e tocava de ouvido. Dali nasceu sua paixão por música. Estudou música com o instrumento, o piano, e sem ele. Com a música aprendeu a lidar com diversas sensações e s"}, "PCSH_HV317_Maria José Reis dos Anjos Moniz Soares_rev.docx": {"size_mb": 0.0453, "modified": "2020-03-13 13:29:04", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Doadores de Sabedoria\\PCSH_HV317_Maria José Reis dos Anjos Moniz Soares\\Textual\\PCSH_HV317_Maria José Reis dos Anjos Moniz Soares_rev.docx", "category": "Textual", "content_preview": ""}, "PCSH_HV317_Maria José Rios_dec.docx": {"size_mb": 0.0156, "modified": "2018-10-10 13:16:56", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Doadores de Sabedoria\\PCSH_HV317_Maria José Reis dos Anjos Moniz Soares\\Textual\\PCSH_HV317_Maria José Rios_dec.docx", "category": "Textual", "content_preview": "PCSH_HV317 Maria José Rios"}, "folder_size_gb": 0.0}, "folder_size_gb": 42.487}, "folder_size_gb": 128.625}, "Livre": {"PCSH_HV281_Amilcar José da Costa Carvalho": {"Audiovisual": {"Acesso": {"PCSH_HV281_Amilcar José da Costa Carvalho.mp4": {"size_mb": 12529.7583, "modified": "2023-11-30 19:29:02", "extension": "MP4", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV281_Amilcar José da Costa Carvalho\\Audiovisual\\Acesso\\PCSH_HV281_Amilcar José da Costa Carvalho.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7545605.0, "duration": 7545.6, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 12.236}, "Preservação": {"MDV_7368.avi": {"size_mb": 8319.539, "modified": "2018-09-28 12:01:18", "extension": "AVI", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV281_Amilcar José da Costa Carvalho\\Audiovisual\\Preservação\\MDV_7368.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2341906.0, "duration": 2341.91, "resolution": "720x480", "fps": 29.97}, "MDV_7369.avi": {"size_mb": 8571.0745, "modified": "2018-09-28 12:59:24", " ize_gb": 0.0}, "folder_size_gb": 0.0}, "Textual": {"PCSH_HV283_Denise Grinspum_dec.docx": {"size_mb": 0.0151, "modified": "2018-10-19 13:49:44", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV283_Denise Grinspum\\Textual\\PCSH_HV283_Denise Grinspum_dec.docx", "category": "Textual", "content_preview": "PCSH_HV283 Denise Grinspum"}, "PCSH_HV283_Denise Grinspum_rev.docx": {"size_mb": 0.0323, "modified": "2019-05-27 12:34:28", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV283_Denise Grinspum\\Textual\\PCSH_HV283_Denise Grinspum_rev.docx", "category": "Textual", "content_preview": "Conte Sua História\nDepoimento de Denise Grinspum\nEntrevistada por Rosana Miziara e Gabriela Nassar\nSão Paulo, 16/05/2011\nRealização: Museu da Pessoa\nEntrevista nº PCSH_HV283\nTranscrito por ____________\nRevisado por Genivaldo Cavalcanti Filho \nP/1 - Denise, para começar, você pode falar seu nome completo, local e data de nascimento?\nR - Meu nome é Denise Grinspum. Eu nasci em São Paulo, em 28 de fevereiro de 1959.\nP/1 - E seus pais são aqui de São Paulo também?\nR - Meus pais são pernambucanos.\nP/1 - O pai e a mãe?\nR - Meu pai chegou a Pernambuco com um ano de idade, vindo da Bessarábia com meus avós em 1924, 1926. Meus pais se mudaram para São Paulo em 1952 - desculpe, em 1953.\nP/1 - Sua mãe também é de Pernambuco?\nR - A minha mãe é nascida em Pernambuco.\nP/1 - Você sabe como eles se conheceram? O que eles faziam lá?\nR - Eles se conheceram no Clube Israelita, dançando naqueles bailes noturnos. Conheceram-se lá.\nP/1 - E qual era a atividade, o que o seu pai fazia?\nR - Meu pai era comerciante, porque perdeu o pai dele muito jovem e assumiu a profissão do meu avô, de vendedor.\nP/1 - Ele vendia o quê?\nR - Ele vendia meias, coisas. Ele ia à casa das pessoas vender lingerie, meias, produt"}, "folder_size_gb": 0.0}, "folder_size_gb": 23.101}, "PCSH_HV284_Denise Peixoto Abeleira": {"Audiovisual": { : 1.0055, "modified": "2019-05-20 11:52:48", "extension": "JPG", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV284_Denise Peixoto Abeleira\\Iconográfico\\Making of\\Baixa\\PCSH_HV284_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "3264x2448", "height": 2448, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3264x2448"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.002}, "folder_size_gb": 0.003}, "Textual": {"PCSH_HV284_Denise Peixoto Abeleira_REV.docx": {"size_mb": 0.0413, "modified": "2019-05-22 13:04:36", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV284_Denise Peixoto Abeleira\\Textual\\PCSH_HV284_Denise Peixoto Abeleira_REV.docx", "category": "Textual", "content_preview": "Conte Sua História\nDepoimento de Denise Cristina Carminatte Peixoto Abeleira \nSão Paulo, 16/05/2011 \nEntrevistada por Rosana Miziara e Glaucia Ribeiro de Lima\nRealização: Museu da Pessoa\nEntrevista nº PCSH_HV284\nTranscrito por ____________\nRevisado por Genivaldo Cavalcanti Filho\nP/1 – Qual o seu nome completo, local e data de nascimento?\nR – Meu nome é Denise Cristina Carminatte Peixoto Abeleira. Eu nasci em Araras, em 25 de dezembro de 1965.\nP/1 – Seus pais são de Araras?\nR – Os dois.\nP/1 – Eles nasceram lá?\nR – Nasceram em Araras.\nP/1 – Qual atividade do seu pai?\nR – Os dois já são falecidos. Minha mãe chegou a trabalhar na Nestlé, ela tinha formação básica. Trabalhou na Nestlé, mas morreu muito jovem. O meu pai era metalúrgico, depois teve uma oficina mecânica metalúrgica. Meu pai começou como metalúrgico numa oficina que tinha lá em Araras, numa fábrica e depois mudou para São Paulo - na verdade, para São Caetano - e tinha uma oficina mecânica. \nP/1 – Mas ele trabalhava em algum lugar antes de ter essa oficina em Araras?\nR – Trabalhava em uma metalúrgica em Araras; eu não me lembro mais o nome, nem existe mais. Ele começou a formação dele em Araras, depois...\n\nP/1 – Até quantos"}, "folder_size_gb": 0.0}, "folder_size_gb": 26.197}, "PCSH_HV285_Paulo Pina": {"Audiovisual": {"Acesso": {"PCSH_HV285_Paulo Pina.mp4": {"size_mb": 9878.5861, "modified": "2023-11-30 20:57:36", "extension": "MP4", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV285_Paulo Pina\\Audiovisual\\Acesso\\PCSH_HV285_Paulo Pina.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5963024.0, "duration": 5963.02, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 9.647}, "Preservação": {"MDV_6776.avi": {"size_mb": 8633.4287, "modified": "2018-09-27 15:39:00", "extension": "AVI", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV285_Paulo Pina\\Audiovisual\\Preservação\\MDV_6776.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2389220.0, "duration": 2389.22, "resolution": "720x480", "fps": 29.97}, "MDV_6777.avi": {"size_mb": 8931.7208, "modified": "2018-09-27 16:43:22", "extension": "AVI", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV285_Paulo Pina\\Audiovisual\\Preservação\\MDV_6777.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2471769.0, "duration": 2471.77, "resolution": "720x480", "fps": 29.97}, "MDV_6778.avi": {"size_mb": 4143.0449, "modified": "2018-09-27 17:09:46", "extension": "AVI", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV285_Paulo Pina\\Audiovisual\\Preservação\\MDV_6778.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": om ele, porque eles se separaram quando eu era criança. Na verdade, eu acabei ficando com a minha mãe.\nP/1 - Eles se conheceram aqui em São Paulo. Como eles se conheceram?\nR - Eles se conheceram em São Paulo. Porque foi o seguinte. É uma história muito comprida e eu vou tentar resumir.\nP/1 - Pode contar.\nR - Minha avó, ela tinha seis filhos e quando ela estava grávida do último filho"}, "folder_size_gb": 0.0}, "folder_size_gb": 30.857}, "PCSH_HV286_João Luís Veronezzi Pacheco": {"Audiovisual": {"Acesso": {"PCSH_HV286_João Luís Veronezzi Pacheco.mp4": {"size_mb": 5897.0348, "modified": "2023-11-30 21:12:52", "extension": "MP4", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV286_João Luís Veronezzi Pacheco\\Audiovisual\\Acesso\\PCSH_HV286_João Luís Veronezzi Pacheco.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3570567.0, "duration": 3570.57, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 5.759}, "Preservação": {"MDV_6779.avi": {"size_mb": 8727.2582, "modified": "2018-09-27 17:33:12", "extension": "AVI", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV286_João Luís Veronezzi Pacheco\\Audiovisual\\Preservação\\MDV_6779.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2415179.0, "duration": 2415.18, "resolution": "720x480", "fps": 29.97}, "MDV_6780.avi": {"size_mb": 4240.3359, "modified": "2018-09-27 17:58:00", "extension": "AVI", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV286_João Luís Veronezzi Pacheco\\Audiovisual\\Preservação\\MDV_6780.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels 002}, "Textual": {"PCSH_HV289_Mariana de Souza Rolim_rev.docx": {"size_mb": 0.0352, "modified": "2020-03-13 10:26:54", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV289_Mariana de Souza Rolim\\Textual\\PCSH_HV289_Mariana de Souza Rolim_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História\nDepoimento de Mariana de Souza\nEntrevistada por Gustavo Sanchez\nSão Paulo, 19 de maio de 2011\nRealização InstItuto Museu da Pessoa\nCódigo: PCSH_HV289\nTranscrito por Melina de Moura Marchetti\nRevisado por Joice Yumi Matsunaga\nP/1 – Então, Mariana, para começar eu vou pedir para você falar seu nome completo, a data e o seu local de nascimento.\nR – Meu nome é Mariana de Souza Rolim, eu nasci em São Paulo, aqui na capital mesmo. Nasci no dia 12 de agosto de 1978.\nP/1 – Você conheceu seus avós, Mariana?\nR – Conheci três, né! Conheci meus dois avós maternos, sendo que meu avô depois faleceu, eu tinha oito anos, então convivi muito com a minha avó. E por parte de pai eu conheci só minha avó. Quando meu avô faleceu minha mãe estava grávida de mim.\nP/1 – Mas com a sua avó, você chegou a conviver...\nR – Sim. Sim... Com as duas eu convivi bastante. As duas faleceram depois dos oitenta, então eu pude conviver bastante com elas.\nP/1 – Você tem lembrança de infância, de ir pra casa delas? \nR – Sim, nossa, muito! Mesmo porque minha família é toda de São Caetano do Sul, né? Meus pais se casaram lá, e, assim que se casaram, se mudaram pra São Paulo, né? Primeiro no Ipira"}, "folder_size_gb": 0.0}, "folder_size_gb": 27.805}, "PCSH_HV290_Julieta De Campos Pereira": {"Audiovisual": {"Acesso": {"PCSH_HV290_Julieta de Campos Pereira.mp4": {"size_mb": 7461.8508, "modified": "2024-06-12 16:05:32", "extension": "MP4", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV290_Julieta De Campos Pereira\\Audiovisual\\Acesso\\PCSH_HV290_Julieta de Campos Pereira.mp4", "category": "Video", "dimension": "1280x720"  7 de novembro de 1957, na cidade de São Paulo.\nP/1 - Você conheceu seus avós?\nR - Conheci minha avó materna.\nP/1 - Você chegou a conviver com ela na infância?\nR - Pouco tempo, uns três anos, mais ou menos.\nP/1 - Os seus pais faziam o quê?\nR - Ah, os meus pais… batalhadores (risos). Meu pai era motorista de uma empresa e minha mãe trabalhava como doméstica.\nP/1 - Que lembranças você tem marcantes do seu pai? Da infância, de criança?\nR - Ele foi um grande companheiro durante toda a minha infância e adolescência, era um pai muito presente. Ele casou velho, com quarenta e seis anos, e esperava muito ter uma filha. Daí, eu! (risos) Ele era boêmio, resolveu casar e eu nasci… Fui muito comemorada, principalmente por ele. Durante a vida dele, ele sempre me paparicou basta"}, "folder_size_gb": 0.0}, "folder_size_gb": 23.298}, "PCSH_HV291_Jorge da Cunha Lima": {"Audiovisual": {"Acesso": {"PCSH_HV291_Jorge da Cunha.mp4": {"size_mb": 20306.6848, "modified": "2023-11-30 23:05:22", "extension": "MP4", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV291_Jorge da Cunha Lima\\Audiovisual\\Acesso\\PCSH_HV291_Jorge da Cunha.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 12229351.0, "duration": 12229.35, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 19.831}, "Preservação": {"MDV_6791.avi": {"size_mb": 8358.0732, "modified": "2018-09-28 11:03:56", "extension": "AVI", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV291_Jorge da Cunha Lima\\Audiovisual\\Preservação\\MDV_6791.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2313010.0, "duration": 2313.01, "resolution": "720x480", "fps": 29.97}, "MDV_6792.avi": {"size_mb": 8604  "RGB", "duration": 0.0, "resolution": "3264x2448"}, "PCSH_HV292_MO002.jpg": {"size_mb": 0.8786, "modified": "2019-05-09 07:44:54", "extension": "JPG", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV292_Maria José da Silveira\\Iconográfico\\Making of\\Baixa\\PCSH_HV292_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "3264x2448", "height": 2448, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3264x2448"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.002}, "folder_size_gb": 0.003}, "Textual": {"PCSH_HV292_Maria José da Silveira_dec.docx": {"size_mb": 0.0255, "modified": "2018-11-30 05:38:32", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV292_Maria José da Silveira\\Textual\\PCSH_HV292_Maria José da Silveira_dec.docx", "category": "Textual", "content_preview": "PCSH_HV292_Maria José da Silveira"}, "PCSH_HV292_Maria José da Silveira_rev.docx": {"size_mb": 0.0302, "modified": "2019-05-09 07:34:08", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV292_Maria José da Silveira\\Textual\\PCSH_HV292_Maria José da Silveira_rev.docx", "category": "Textual", "content_preview": "Projeto Conte sua história \nEntrevistado por Rosana Misiário e Débora Querido\nDepoimento de Maria José da Silveira\nSão Paulo 24/05/2011\nRealização Museu da Pessoa\nDepoimento PCSH_HV292\nTranscrito por Melina de Moura Marchetti\nRevisado por Teresa de Carvalho Magalhães\nP/1-  Você pode falar seu nome, o local e data de nascimento?\nR- Posso. Eu nasci em São Paulo, Capital, aos 25 de agosto de 1942.\nP/1-  Seus pais nasceram aqui em São Paulo?\nR-  Meus pais nasceram em São Paulo na Capital também.\nP/1- E seus avós?\nR- Meus avós nasceram...a minha avó materna, paterna veio da Itália e ficou em Amparo inicialmente. Depois se casou com o meu avô e veio morar em São Paulo, Capital.\nP/1- O seu avô é de São Paulo?\nR- O meu avô é de Amparo, o meu avô paterno.\nP/1- E a sua avó veio da Itália e foi pra Amparo por quê?\nR- Veio da Itália como imigrante e se hospedou na...na Hospedaria dos imigrantes, posteriormente ela foi encaminhada para Amparo, onde conheceu o meu avô e lá se casou com ele. E depois, meu avô era funcionário do Departamento de Águas e Esgotos e eles se transferiram para São Paulo, onde nasceu meu pai.\nP/1-  Que bairro que era?\nR- Ele nasceu na Aclimação aos 17 de outubro de 1910."}, "folder_size_gb": 0.0}, "folder_size_gb": 18.901}, "PCSH_HV293_João Augusto Barbosa": {"Audiovisual": {"Acesso": {"PCSH_HV293_João Augusto Barbosa.mp4": {"size_mb": 8958.0494, "modified": "2023-11-30 23:32:00", "extension": "MP4", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV293_João Augusto Barbosa\\Audiovisual\\Acesso\\PCSH_HV293_João Augusto Barbosa.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5397993.0, "duration": 5397.99, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 8.748}, "Preservação": {"MDV_6893.avi": {"size_mb": 8684.5802, "modified": "2018-10-04 12:01:00", "extension": "AVI", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV293_João Augusto Barbosa\\Audiovisual\\Preservação\\MDV_6893.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2403368.0, "duration": 2403.37, "resolution": "720x480", "fps": 29.97}, "MDV_6894.avi": {"size_mb": 8733.7638, "modified": "2018-11-12 10:54:58", "extension": "AVI", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV293_João Augusto Barbosa\\Audiovisual\\Preservação\\MDV_6894.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_ , "content_preview": "PCSH_HV293_João Augusto Barbosa"}, "PCSH_HV293_João Augusto Barbosa_rev.docx": {"size_mb": 0.0334, "modified": "2019-05-10 05:31:14", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV293_João Augusto Barbosa\\Textual\\PCSH_HV293_João Augusto Barbosa_rev.docx", "category": "Textual", "content_preview": "Conte sua história_2011\nDepoimento de João Augusto Barbosa\nEntrevistado por Rosana Miziara e Consuelo Monteiro\nSão Paulo, 26 de maio de 2011\nRealização: Museu da Pessoa\nEntrevista número PCSH_HV293\nRevisado por Teresa de Carvalho Magalhães\nP/1-João, vamos começar com você dizendo seu nome completo, data e local de nascimento.\nR-Meu nome é João Augusto Barbosa. Eu nasci no dia 22 de junho de 1956, em Itapevi, São Paulo, que é uma cidadezinha aqui da Região oeste. Um pouco depois de Osasco. \nP/1-Seus pais são de Itapevi?\nR-Não. Meus pais são da Bahia. O pai e a mãe. Minha mãe era da Barra da Bahia e o meu pai era de Remanso. Também na Bahia.\nP/1-Você sabe como eles se conheceram?\nR-Meus avós vieram da Bahia para cá, naquele período forte dos anos trinta de migração interna, para trabalhar na lavoura do estado de São Paulo. E só minha mãe... Antes disso, minha mãe morou durante um tempo, com os padrinhos dela, no Rio de Janeiro. Ela foi para o Rio aos sete anos. Ela nasceu em 1922. Então, ela chegou ao Rio em 1929, que é justamente o período que coincide com o rádio e o samba descendo do morro para a cidade, no Rio. Então, ela pega aquele período inicial da Rádio Nacional. Pega aquela"}, "folder_size_gb": 0.0}, "folder_size_gb": 28.048}, "PCSH_HV294_Paulo Vanzolini": {"Audiovisual": {"Acesso": {"PCSH_HV294_Paulo Vanzolini.mp4": {"size_mb": 5255.4971, "modified": "2023-11-30 23:44:12", "extension": "MP4", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV294_Paulo Vanzolini\\Audiovisual\\Acesso\\PCSH_HV294_Paulo Vanzolini.mp4", "category": "Video", "dimension": "1280x720", "height" ão, ele foi ao cartório no Brás e fez uma certidão de nascimento de onze…\nP/1- O senhor podia falar o nome dos seus pais e atividades deles?\nR - O meu pai chamava-se Carlos Alberto Vanzolini. Era engenheiro e professor da Politécnica. Minha mãe chamava-se Finoca Gilze Vanzolini e era dona de casa.\nP/1 - E o senhor passou a sua infância em que bairro de São Paulo?\nR - Alameda Tietê e Rua Atlântica.\nP/1 - Que ótimo! E como era naquela época da década de vin"}, "folder_size_gb": 0.0}, "folder_size_gb": 16.487}, "PCSH_HV295_Rubens Kutner": {"Audiovisual": {"Acesso": {"PCSH_HV295_Rubens Kutner.mp4": {"size_mb": 7775.4486, "modified": "2023-12-01 00:02:32", "extension": "MP4", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV295_Rubens Kutner\\Audiovisual\\Acesso\\PCSH_HV295_Rubens Kutner.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4693255.0, "duration": 4693.26, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 7.593}, "Preservação": {"MDV_6898.avi": {"size_mb": 8616.6744, "modified": "2018-10-01 10:52:12", "extension": "AVI", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV295_Rubens Kutner\\Audiovisual\\Preservação\\MDV_6898.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2384578.0, "duration": 2384.58, "resolution": "720x480", "fps": 29.97}, "MDV_6899.avi": {"size_mb": 8493.9426, "modified": "2018-10-01 11:55:16", "extension": "AVI", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV295_Rubens Kutner\\Audiovisual\\Preservação\\MDV_6899.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo .em 15 de dezembro de 1962, por tanto lá se vão quarenta e oito anos, né.\n\nP/1 - E você conheceu seus avós? Teve convívio com eles?\nR – Convivi com os quatro avós, felizmente. Com os paternos, sobretudo com o meu avô paterno, menos tempo. Ele morreu em 1970, por tanto eu tinha sete pra oito anos, mas lembro bem dele. Com a minha avó, ela morreu em 1979, então eu já convivi mais, mãe do meu pai. E com os meus avós maternos eu convivi bastante. Até, sei lá, até 1994 é...1991 a minha avó materna e 1994 o meu avô. Eram bastante presentes, ficavam com a gente em casa e...tanto meu pai como a minha mãe são filhos únicos, né. E eu tenho um irmão mais"}, "folder_size_gb": 0.0}, "folder_size_gb": 24.308}, "PCSH_HV296_Márcia Viviane Ponte de Queiroz": {"Audiovisual": {"Acesso": {"PCSH_HV296_Marcia Viviane Ponte de Queiroz.mp4": {"size_mb": 10438.5116, "modified": "2024-06-14 19:41:06", "extension": "MP4", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV296_Márcia Viviane Ponte de Queiroz\\Audiovisual\\Acesso\\PCSH_HV296_Marcia Viviane Ponte de Queiroz.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6289150.0, "duration": 6289.15, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 10.194}, "Preservação": {"MDV_6900.avi": {"size_mb": 8644.2789, "modified": "2024-06-14 13:16:44", "extension": "AVI", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV296_Márcia Viviane Ponte de Queiroz\\Audiovisual\\Preservação\\MDV_6900.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2392223.0, "duration": 2392.22, "resolution": "720x480", "fps": 29.97}, "MDV_6901.avi": {"size_mb": 8842.2664, "modified": "2024-06-14 14:09:04", "extension": "AVI", n\nP/1 - E o que seus pais... Seus avós também são de lá? Toda a sua família é de lá?\n\nR - Toda a minha família de parte de mãe é de Pentecostes e a família da parte do meu pai, de Maranguape.\n\nP/1 - Você sabe como é que seu pai e sua mãe se conheceram?\n\nR - Não, porque minha mãe morreu [quando] eu tinha três anos só.\nP/1 - Três anos?\n\nR - É. E depois meu pai levou a gente pra família dele, aí ele casou-se com outra e eu fiquei na casa de uma tia.\n\nP/1 - E qual era a profissão do seu pai?\n\nR - Agricultor.\n\nP/1 - Você lembra dessa sua casa de infância em Pentecostes?\n\nR - Em Pentecostes? Lembro.\n\nP/1 - C"}, "folder_size_gb": 0.0}, "folder_size_gb": 33.601}, "PCSH_HV301_Francisco dos Santos": {"Audiovisual": {"Acesso": {"PCSH_HV301_Francisco dos Santos.mp4": {"size_mb": 10767.5022, "modified": "2023-12-01 01:56:18", "extension": "MP4", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV301_Francisco dos Santos\\Audiovisual\\Acesso\\PCSH_HV301_Francisco dos Santos.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6492386.0, "duration": 6492.39, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 10.515}, "Preservação": {"MDV_6807.avi": {"size_mb": 8779.2137, "modified": "2018-10-03 09:27:20", "extension": "AVI", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV301_Francisco dos Santos\\Audiovisual\\Preservação\\MDV_6807.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2429560.0, "duration": 2429.56, "resolution": "720x480", "fps": 29.97}, "MDV_6808.avi": {"size_mb": 8692.0506, "modified": "2018-10-03 10:22:54", "extension": "AVI", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV301_Francis PCSH_HV304_MO001.jpg": {"size_mb": 1.0865, "modified": "2019-06-05 08:37:54", "extension": "JPG", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV304_Sebastião Augusto de Freitas\\Iconográfico\\Making of\\Baixa\\PCSH_HV304_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "3264x2448", "height": 2448, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3264x2448"}, "PCSH_HV304_MO002.jpg": {"size_mb": 1.0761, "modified": "2019-06-05 08:38:06", "extension": "JPG", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV304_Sebastião Augusto de Freitas\\Iconográfico\\Making of\\Baixa\\PCSH_HV304_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "3264x2448", "height": 2448, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3264x2448"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.002}, "folder_size_gb": 0.002}, "Textual": {"PCSH_HV304_Sebastião Augusto de Freitas_dec.docx": {"size_mb": 0.007, "modified": "2018-10-09 06:47:26", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV304_Sebastião Augusto de Freitas\\Textual\\PCSH_HV304_Sebastião Augusto de Freitas_dec.docx", "category": "Textual", "content_preview": "Sebastião Augusto de Freitas - 30 de junho de 2011\nGlaucia Ribeiro e Henrique Tadeu\nNascido em 23 de abril de 1928, Tiradentes.\n00:35 - Apresentação.\n02:55 - Eu sou herdeiro do meu pai, que assinava a firma do meu avô.\n08:30 - A minha casa era uma casa popular. Meu pai era muito bom,  ele dava muito conselho. Ele contava muita história. Em noite de luar, o vovô deitava no meio do terreno e contava histórias.\n24:50 -Tenho 7 irmãos. Na escola teve alguns que pelejaram, e outros aprenderam bem.\n28:30 - O doutor disse que minha mãe tinha lesão no coração. O dia que ela amanhecesse feliz, ela iria morrer. Não deu outra.\n29:40 -Conheci minha esposa com 18 anos, por causa de uma outra namorada que eu tinha em tiradentes.\n35:10 - Eu fazia sopa de português. Com pé de porca, batata, cenoura beterraba. Eles comem que lambuza até a barba.\n37:30 - Recebi um telefonema um dia que a ponte de Barbacena tinha caída. Eu estava arrumando as madeiras da ponte, consertando a ponte e a maria deu uma olhada para mim.\n44:50 - Fiquei lá na terra dela trabalhando como empregado para ganhar 1 salário mínimo.\n46:40 -Comecei a fazer de tudo. Panela, vaso, tudo que eu fazia eu vendia.\n48:50 - Enquanto a pessoa"}, "PCSH_HV304_Sebastião Augusto de Freitas_rev.docx": {"size_mb": 0.0461, "modified": "2019-06-06 06:49:24", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV304_Sebastião Augusto de Freitas\\Textual\\PCSH_HV304_Sebastião Augusto de Freitas_rev.docx", "category": "Textual", "content_preview": ""}, "folder_size_gb": 0.0}, "folder_size_gb": 26.176}, "PCSH_HV305_Mauricio Gallacci Pereira": {"Audiovisual": {"Acesso": {"PCSH_HV305_Mauricio Gallacci Pereira.mp4": {"size_mb": 18628.1476, "modified": "2023-12-01 03:28:20", "extension": "MP4", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV305_Mauricio Gallacci Pereira\\Audiovisual\\Acesso\\PCSH_HV305_Mauricio Gallacci Pereira.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 11213603.0, "duration": 11213.6, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 18.192}, "Preservação": {"MDV_6817.avi": {"size_mb": 8634.5137, "modified": "2018-10-08 09:07:36", "extension": "AVI", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV305_Mauricio Gallacci Pereira\\Audiovisual\\Preservação\\MDV_6817.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2389520.0, "duration": 2389.52, "resolution onal para nós não dizia nada.\n09:50 - Eu vim para Santos porque um tio precisava de um menino para aprender o ofício de alfaiate.\n11:40 - As músicas do Ari Barroso nos descrevia a beleza do mar. Quando eu vi o mar, eu já conhecia o mar pela imagem plantada na minha cabeça pelas músicas.\n14:20 - Eu retomei os estudos no ginásio. A gente saía com formação de auxiliar de escritório.\n17:55 - Fui para o exército. Ali eu já tinha um conhecimento bom e fiz cursos para ser cabo e sargento. Eu estudava muito. \n20:40 - Eu era o único negro. Cheguei a ser eleito vice-presidente do grêmio estudantil.\n25:30 - Os negros tinham o pé na cozinha. Com a vinda e a evolução dos n"}, "PCSH_HV306_Hilmo Alves_rev.docx": {"size_mb": 0.0273, "modified": "2019-06-05 11:47:50", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV306_Hilmo Alves\\Textual\\PCSH_HV306_Hilmo Alves_rev.docx", "category": "Textual", "content_preview": ""}, "folder_size_gb": 0.0}, "folder_size_gb": 17.834}, "PCSH_HV307_Manoel Bezerra de Vasconcelos": {"Audiovisual": {"Acesso": {"PCSH_HV307_Manoel Bezerra de Vasconcelos.mp4": {"size_mb": 15560.116, "modified": "2023-12-01 04:18:54", "extension": "MP4", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV307_Manoel Bezerra de Vasconcelos\\Audiovisual\\Acesso\\PCSH_HV307_Manoel Bezerra de Vasconcelos.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 9392650.0, "duration": 9392.65, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 15.195}, "Preservação": {"MDV_6824.avi": {"size_mb": 8547.5903, "modified": "2024-08-07 12:54:36", "extension": "AVI", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV307_Manoel Bezerra de Vasconcelos\\Audiovisual\\Preservação\\MDV_6824.avi", "category": "Video", "dimension": "720x480", "height": 480, "as :\\Programa Conte sua História (2011)\\Livre\\PCSH_HV308_Pedro Gennari\\Iconográfico\\Making of\\Baixa\\PCSH_HV308_MO004.jpg", "category": "Image", "duration_ms": 0, "dimension": "2448x3264", "height": 3264, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2448x3264"}, "PCSH_HV308_MO005.jpg": {"size_mb": 0.957, "modified": "2019-06-19 12:56:30", "extension": "JPG", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV308_Pedro Gennari\\Iconográfico\\Making of\\Baixa\\PCSH_HV308_MO005.jpg", "category": "Image", "duration_ms": 0, "dimension": "2448x3264", "height": 3264, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2448x3264"}, "PCSH_HV308_MO006.jpg": {"size_mb": 0.8997, "modified": "2019-06-19 12:56:34", "extension": "JPG", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV308_Pedro Gennari\\Iconográfico\\Making of\\Baixa\\PCSH_HV308_MO006.jpg", "category": "Image", "duration_ms": 0, "dimension": "2448x3264", "height": 3264, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2448x3264"}, "folder_size_gb": 0.006}, "folder_size_gb": 0.006}, "folder_size_gb": 0.008}, "Textual": {"PCSH_HV308_Pedro Gennari_dec.docx": {"size_mb": 0.0149, "modified": "2018-10-19 13:40:46", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV308_Pedro Gennari\\Textual\\PCSH_HV308_Pedro Gennari_dec.docx", "category": "Textual", "content_preview": "PCSH_HV308 Pedro Gennari"}, "PCSH_HV308_Pedro Gennari_REV.docx": {"size_mb": 0.0515, "modified": "2019-06-13 13:17:14", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV308_Pedro Gennari\\Textual\\PCSH_HV308_Pedro Gennari_REV.docx", "category": "Textual", "content_preview": "Conte Sua História \nDepoimento de Pedro Gennari\nEntrevistado por Tiago Majolo e Gabriela Nassar\nSão Paulo, 19/07/2011\nRealização: Museu da Pessoa \nEntrevista nº PCSH_ HV308\nRevisado por Genivaldo Cavalcanti Filho \nP/1 - Queria que o senhor falasse o nome completo, o local e a data de nascimento.\nR - Eu nasci em doze de março de 1924 na Rua Butantã. O número da casa não me lembro. Ah, posso mencionar o seguinte: onde eu nasci hoje está situado um prédio grande da Companhia Telefônica. E ali moravam meus parentes. Meus tios. Todos descendentes de imigrantes. \nEu nasci na casa de um compadre dos meus pais, que eram pessoas mais abastadas. O sobrenome deles era Rizzo. Inclusive ele tinha um irmão, que já faleceu há muito tempo; ele [se] chamava Francisco. E tinha um irmão que chamava Jorge, tem o nome dele até perto do [Shopping] Eldorado - Rua Jorge Rizzo. Ele foi o homem mais rico de Pinheiros. \nAquela várzea, onde tem o Eldorado hoje, aqueles prédios enormes... Não tinha [a Avenida] Marginal [Pinheiros] ainda, o Rio Pinheiros não era retificado, então esse Jorge... Na várzea dele, tiravam barro e areia para fazer tijolos. Ele se tornou o homem mais rico de Pinheiros, mas era uma pes"}, "folder_size_gb": 0.0}, "folder_size_gb": 46.235}, "PCSH_HV309_Estevinha Pavan Ribeiro": {"Audiovisual": {"Acesso": {"PCSH_HV309_Estevinha Pavan Ribeiro.mp4": {"size_mb": 5774.4793, "modified": "2023-12-01 05:07:02", "extension": "MP4", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV309_Estevinha Pavan Ribeiro\\Audiovisual\\Acesso\\PCSH_HV309_Estevinha Pavan Ribeiro.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3484047.0, "duration": 3484.05, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 5.639}, "Preservação": {"MDV_6834.avi": {"size_mb": 8804.773, "modified": "2018-10-04 15:24:42", "extension": "AVI", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV309_Estevinha Pavan Ribeiro\\Audiovisual\\Preservação\\MDV_6834.avi", "category": "Video", "dimension": "720x480", "height": 480, " n": "720x480"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "folder_size_gb": 0.002}, "Textual": {"PCSH_HV311_João Chrisostomo de Jesus_dec.docx": {"size_mb": 0.0156, "modified": "2019-01-07 11:34:56", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV311_João Crisostemo de Jesus\\Textual\\PCSH_HV311_João Chrisostomo de Jesus_dec.docx", "category": "Textual", "content_preview": "Código: PCSH_HV311\nNome: João Chrisostomo de Jesus\nEntrevistadores: Rosana Miziara e Consuelo Montero\nData: 21/07/2011\n00:01:02 - Eu me chamo João Chrisóstomo de Jesus, nasci em 1922 na cidade de Irará, no estado da Bahia. Minha mãe foi beneficiada pela Lei do Ventre Livre. Ela sempre comentava que viveu na casa grande, não na senzala.\n00:03:57 – O fazendeiro baiano escolhia os negros pequenos, canela fina e dentes bons. A lei que autorizava a escravidão obrigava aos senhores alimentar e cuidar da saúde dos escravos, então eles procuravam os pequenos e sadios, imaginando ter menos despesas.\n00:07:01 - A minha mãe doava os filhos homens para pessoas que tinham posses usarem o trabalho deles e darem educação. Os fazendeiros eram orientados a não abrir a educação para os pobres porque “Deus dava a inteligência para todos, agora o saber, só para quem poderia pagar.”\n00:13:09 -  Havia um pelotão de voluntários para enterrar as pessoas, foi uma coisa terrível.\n00:15:17 - A minha mãe passava a roupa de grande parte da cidade, principalmente das famílias abonadas.\n00:17:07 - O pai do Tom Zé, o seu Everton Martins, ia uma vez por mês para noivar a filha do coronel Cazuza e levava o meu irmã"}, "folder_size_gb": 0.0}, "folder_size_gb": 48.325}, "PCSH_HV312_Adin Costa": {"Audiovisual": {"Acesso": {"PCSH_HV312_Adin Costa.mp4": {"size_mb": 12753.8817, "modified": "2023-12-01 06:19:06", "extension": "MP4", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV312_Adin Costa\\Audiovisual\\Acesso\\PCSH_HV312_Adin Costa.mp4", "category": "Vide 19-06-07 07:32:40", "extension": "DOC", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV313_Mouzar Benedito\\Textual\\PCSH_HV313 - minibio e sinopse.doc", "category": "Textual"}, "PCSH_HV313 - minibio e sinopse.docx": {"size_mb": 0.0066, "modified": "2026-02-24 13:17:00", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV313_Mouzar Benedito\\Textual\\PCSH_HV313 - minibio e sinopse.docx", "category": "Textual", "content_preview": "PCSH_HV_313_Mouzar Benedito da Silva. Título da história: Semeador de sonhos\nMini bio\nAs recordações carregadas de emoções mais íntimas e marcantes da infância; o lirismo do lugar e a suave beleza dos rios ao pé da casa, dos becos com nome dos vivos; o mistério dos loucos “mudos” bem tratados. A influência da pobreza digna, as dificuldades suportáveis; o mar de morros projetando um mundo que existia pra ser descoberto; o olhar perdido no pontinho de fumaça riscado na distância, caminho do trem imaginado. São lembranças definitivas de Benedito Mouzar da Silva, nascido nos cafundós do tempo e das Gerais – para ser mais específico, 23 de novembro de 1946, Nova Resende, sul de Minas.\nEis o começo que deu impulso a uma trajetória de vida ímpar, onde os princípios foram guardados e aplicados; os 'causos' contados e publicados; a coerência foi valor maior, assim como a dignidade, o trabalho, a generosidade. A existência que ainda não terminou – e promete jamais ter pouca intensidade. O desprendimento convidando o compromisso ético a renovar a sinceridade ideológica. A riqueza apartada dos bens materiais, mas visível e sempre presente na continuidade de seu sonho anarquista.\nSinopse\nNa lon"}, "PCSH_HV313_Mouzar Benedito da Silva_rev.docx": {"size_mb": 0.0691, "modified": "2019-06-13 05:25:18", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV313_Mouzar Benedito\\Textual\\PCSH_HV313_Mouzar Benedito da Silva_rev.docx", "category": "Textual", "conte  Museu da Pessoa\nDepoimento PCSH_HV_321\nTranscrito por Rosangela Maria Nunes Henriques \nP/1 – Primeiro vou pedir para você repetir o seu nome inteiro, a sua data de nascimento e o local onde você nasceu.\nR – Meu nome é Miriam Abdo de Camargo Pinheiro, eu tenho 50 anos e nasci em São Paulo.\nP/1 – Que dia que você nasceu?\nR – 15 de abril de 1961.\nP/1 – E qual que era o nome dos seus pais?\nR – Meu pai era Naim Abdala Abdo, já falecido, imigrante libanês, que veio do Líbano para cá, quando ainda era menino com 12 anos de idade, uma história muito curiosa. E minha mãe Chafica Saium Abdo, que também veio do Líbano para cá, mas com meses e foi registrada aqui, também falecida.\nP/1 – E qual que é a história muito curiosa do seu pai?\nR – Meu pai veio do Líbano para cá, e são histórias que a gente não consegue esquecer. Então, ele veio fugido da guerra na época, então, ele sempre contava para a gente, que ele atravessou, na época da guerra, para fugir da guerra e a mãe e o pai pediram que para que ele e o filho mais velho a"}, "PCSH_HV321_Miriam Abdo de Camargo Pinheiro_rev.docx": {"size_mb": 0.0841, "modified": "2019-06-18 07:12:08", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV321_Mirian Abdo de Camargo Pinheiro\\Textual\\PCSH_HV321_Miriam Abdo de Camargo Pinheiro_rev.docx", "category": "Textual", "content_preview": ""}, "PCSH_HV321_Mirian Abdo_dec.docx": {"size_mb": 0.017, "modified": "2018-10-29 12:36:06", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV321_Mirian Abdo de Camargo Pinheiro\\Textual\\PCSH_HV321_Mirian Abdo_dec.docx", "category": "Textual", "content_preview": ""}, "folder_size_gb": 0.0}, "folder_size_gb": 46.29}, "PCSH_HV322_Natália Rodrigues Alves Rocha de Barros": {"Audiovisual": {"Acesso": {"PCSH_HV322_Natália Rodrigues Alves Rocha de Barros.mp4": {"size_mb": 5880.3473, "modified": "2024-06-15 00:03:36", "extension": "MP4", "full_path": "H:\\Programa Conte sua H  {"Minibio.docx": {"size_mb": 0.0063, "modified": "2019-06-24 07:57:52", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV323_Sebastião Marinho\\Textual\\Minibio.docx", "category": "Textual", "content_preview": "Minibio\nSebastião Marinho nasceu em 10/03/1948. É cantador repentista profissional desde 1968, natural de Solânea, estado da Paraíba é o presidente-fundador da Ucran-União dos Cantadores, Repentistas e Apologistas do Nordeste. Foi entrevistado pelo Museu da Pessoa em 2001.\nSebastião Marinho é cantador repentista desde 1968, e volta ao Museu da Pessoa para complementar seu depoimento dado em 2001. Sebastião expõe toda sua admiração pela cultura nordestina e conta como ela se apresenta na cidade de São Paulo. Ele descreve a rotina do repentista, a visão e as expectativas que o povo nordestino têm sobre a região sudeste do Brasil. Sebastião é presidente-fundador da UCRAN - União dos Cantadores, Repentistas e Apologistas do Nordeste."}, "PCSH_HV323_Sebastiao Marinho_rev.docx": {"size_mb": 0.0662, "modified": "2019-06-28 05:49:26", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV323_Sebastião Marinho\\Textual\\PCSH_HV323_Sebastiao Marinho_rev.docx", "category": "Textual", "content_preview": ""}, "PCSH_HV323_Sebastião Marinho_dec.docx": {"size_mb": 0.016, "modified": "2018-10-17 12:20:42", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV323_Sebastião Marinho\\Textual\\PCSH_HV323_Sebastião Marinho_dec.docx", "category": "Textual", "content_preview": ""}, "Sebastião Marinho_transcrição.doc": {"size_mb": 0.0815, "modified": "2018-09-13 08:28:48", "extension": "DOC", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV323_Sebastião Marinho\\Textual\\Sebastião Marinho_transcrição.doc", "category": "Textual"}, "Sebastião Marinho_transcrição.docx": {"size_mb": 0.019, "modified": "2026-02-24 13:17:03", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV323_Sebastião Marinho\\Textual\\Sebastião Marinho_transcrição.docx", "category": "Textual", "content_preview": "sebastião marinho\nrepentista\nbiografia.\nSebastião Marinho 55, é cantador repentista profissional desde 1968, natural de Solânea, estado da Paraíba é o presidente-fundador da Ucran-União dos Cantadores, Repentistas e Apologistas do Nordeste. \n(Trechos da matéria feita no final dos anos 80 na revista \"Quinta Roda\") \n(...) Essa atividade é, desde os sete anos, a grande paixão da vida de Sebastião Marinho, um paraibano de Solânea, que com seu jeito sereno e sonhador já passou por muitos problemas sem nunca desistir dessa opção; a de viver como um cantador das coisas do nordeste. E para isso ele teve que enfrentar não só as críticas da família, como também as constantes faltas de dinheiro e perspectivas. \nA família de Sebastião Marinho ainda tentou convencê-lo a procurar uma profissão mais estável e, aos 13 anos, fizeram com que ele fosse cuidar de uma mercearia. Mas sempre que tinha alguma cantoria, ele fechava o estabelecimento e ia desafiar os velhos cantadores. Quando fez dezoito anos, Sebastião achou que já era tempo de \"conhecer mundo\", e partiu para a cidade onde montou um programa na rádio Difusora de Bananeiras. Era um programa diário, e com ele, Sebastião começou a ficar famos"}, "folder_size_gb": 0.0}, "folder_size_gb": 34.321}, "PCSH_HV324_Marco Antonio da Silva Souza": {"Audiovisual": {"Acesso": {"PCSH_HV324_Marco Antonio da Silva Souza.mp4": {"size_mb": 11589.07, "modified": "2024-06-15 00:57:24", "extension": "MP4", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV324_Marco Antonio da Silva Souza\\Audiovisual\\Acesso\\PCSH_HV324_Marco Antonio da Silva Souza.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 698 o", "audio_codec": "PCM", "duration_ms": 1044944.0, "duration": 1044.94, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 28.286}, "folder_size_gb": 49.001}, "Iconográfico": {"Making Of": {"Baixa": {"Sequence 04.jpg": {"size_mb": 0.1405, "modified": "2011-11-08 12:52:32", "extension": "JPG", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV326_Roberto Clovís\\Iconográfico\\Making Of\\Baixa\\Sequence 04.jpg", "category": "Image", "duration_ms": 0, "dimension": "720x480", "height": 480, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "720x480"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "Textual": {"PCSH_HV326_Roberto Clovís_dec.docx": {"size_mb": 0.0161, "modified": "2018-10-22 13:39:48", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV326_Roberto Clovís\\Textual\\PCSH_HV326_Roberto Clovís_dec.docx", "category": "Textual", "content_preview": ""}, "PCSH_HV326_Roberto Clóvis_sem rev (camila, em tratamento).doc": {"size_mb": 0.1792, "modified": "2019-08-08 07:48:24", "extension": "DOC", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV326_Roberto Clovís\\Textual\\PCSH_HV326_Roberto Clóvis_sem rev (camila, em tratamento).doc", "category": "Textual"}, "PCSH_HV326_Roberto Clóvis_sem rev (camila, em tratamento).docx": {"size_mb": 0.0535, "modified": "2026-02-24 13:17:05", "extension": "DOCX", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV326_Roberto Clovís\\Textual\\PCSH_HV326_Roberto Clóvis_sem rev (camila, em tratamento).docx", "category": "Textual", "content_preview": "Conte sua História – Memória dos Brasileiros\nDepoimento de Roberto Clóvis (Mandialardo?)\nEntrevistado por Rosana (Miziaro?) e Luciano Fernando Brandão\nSão Paulo, 25/10/2011\nRealização Museu da Pessoa, Projeto Doadores de Sabedoria\nEntrevista PCSH_HV_326\nTranscrito por Melina de Moura Marchetti\nP/1 - Local de nascimento e data de nascimento...\nR - Vamos lá. O meu nome é Roberto Clóvis (Mandialardo?), vocês podem me chamar de Bob que é como sempre fui conhecido aí. É, eu nasci em uma cidade chamada Vera Cruz, que fica em São Paulo, ela é muito grande (risos) então a gente coloca como referencia a cidade de Marília. Nasci em 26 de março de 1966.\nP/1 - É, você sabe um pouco das suas origens familiares? Os seus pais são de Vera cruz?\nR - Sim, sim, sim, sim. O meu pai nasce em Cabrália e a minha mãe nasceu em Matão, somos a família inteira oriunde da Itália, são descendentes de italianos. Os meus bisavós chegaram no Brasil em 1900 e constituíram família nessa região de Matão, Araraquara, vera Cruz, Garça, Jales e ele foram, é, colonos, trabalharam em fazenda e em 1968 a gente veio para São Paulo. \nP/1 - Eles trabalhavam em quê, em fazenda de café? \nR - Em fazenda de café, que é a grande."}, "folder_size_gb": 0.0}, "folder_size_gb": 49.002}, "PCSH_HV327_José Domingos Teixeira": {"Audiovisual": {"Acesso": {"PCSH_HV327_José Domingos Teixeira.mp4": {"size_mb": 11817.0123, "modified": "2024-06-26 01:35:40", "extension": "MP4", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV327_José Domingos Teixeira\\Audiovisual\\Acesso\\PCSH_HV327_José Domingos Teixeira.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7118478.0, "duration": 7118.48, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 11.54}, "Preservação": {"MDV_6881.avi": {"size_mb": 8622.8195, "modified": "2018-10-16 14:35:12", "extension": "AVI", "full_path": "H:\\Programa Conte sua História (2011)\\Livre\\PCSH_HV327_José Domingos Teixeira\\Audiovisual\\Preservação\\MDV_6881.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2386284     "Video": ['mp4', 'mov', 'mkv', 'avi', 'm4v', 'mts', 'm2ts', 'wmv', 'flv', 'webm', 'vob', 'ogv', '3gp', 'mxf'],
    "Audio": ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'aiff', 'pcm', 'aif'],
    "Image": ['jpg', 'jpeg', 'tif', 'tiff', 'png', 'gif', 'bmp', 'webp', 'cr2', 'nef', 'arw', 'dng'],
    "Textual": ['doc', 'docx', 'pdf', 'txt', 'rtf', 'odt', 'xls', 'xlsx', 'ppt', 'pptx']
};

const ICONS = { "Video": "🎞️", "Audio": "🎧", "Image": "🖼️", "Textual": "📝", "Other": "📄" };

function formatSmartSize(mbValue) {
    if (!mbValue || mbValue === 0) return "0 B";
    let bytes = mbValue * 1024 * 1024; 
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(2) + " " + units[i];
}

function getIcon(name, isFolder) {
    if (isFolder) return "📁";
    const ext = name.split('.').pop().toLowerCase();
    for (const [category, list] of Object.entries(EXTENSIONS)) {
        if (list.includes(ext)) return ICONS[category];
    }
    return ICONS["Other"];
}

function formatTime(ms) {
    if (!ms || ms === 0) return "N/A";
    let totalSeconds = Math.floor(ms / 1000);
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;
    return [hours, minutes, seconds].map(v => v < 10 ? "0" + v : v).join(":");
}

function tryLoadImage(imgElement, thumbnailPath, originalName) {
    if (!thumbnailPath && !originalName) return;
    let path = thumbnailPath || `thumbnails/thumb_${originalName.split('.').slice(0, -1).join('.')}.jpg`;
    imgElement.onerror = function() {
        this.onerror = null;
        this.src = 'https://via.placeholder.com/150?text=Sem+Preview';
    };
    imgElement.src = path;
}

function copyPreviewText() {
    const box = document.getElementById('preview-text');
    if (box) {
        navigator.clipboard.writeText(box.textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy Content"; }, 2000);
    }
}

function calculateFolderStats(node) {
    let stats = { Video: { count: 0, size: 0 }, Audio: { count: 0, size: 0 }, Image: { count: 0, size: 0 }, Textual: { count: 0, size: 0 }, Other: { count: 0, size: 0 }, totalSize: 0 };
    function traverse(curr) {
        for (let key in curr) {
            if (key === "folder_size_gb") continue;
            let item = curr[key];
            if (item.folder_size_gb !== undefined) traverse(item);
            else {
                let cat = item.category || "Other";
                if (!stats[cat]) cat = "Other";
                stats[cat].count++;
                stats[cat].size += item.size_mb || 0;
                stats.totalSize += item.size_mb || 0;
            }
        }
    }
    traverse(node);
    return stats;
}

function showMetadata(name, data, path) {
    const panel = document.getElementById("metadata-panel");
    const content = document.getElementById("meta-content");
    panel.style.display = "block";

    const isFolder = data.folder_size_gb !== undefined;
    let html = `
        <span class="meta-label">Nome</span><span class="meta-value">${name}</span>
        <span class="meta-label">Caminho</span><span class="meta-value">${data.full_path || path.join("/")}</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(data.full_path || "").replace(/\\/g, "\\\\")}')">Copy Path</button>
        <span class="meta-label">Tamanho</span><span class="meta-value" style="color:var(--accent); font-weight:bold;">${formatSmartSize(isFolder ? data.folder_size_gb * 1024 : data.size_mb)}</span>
    `;

    if (isFolder) {
        const stats = calculateFolderStats(data);
        const getPct = (size) => stats.totalSize > 0 ? ((size / stats.totalSize) * 100).toFixed(1) : 0;
        html += `
            <div class="stats-container">
                <span class="meta-label">Conteúdo</span>
                <div class="stats-bar">
                    <div class="bar-segment" style="width:${getPct(stats.Video.size)}%; background:var(--video)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Audio.size)}%; background:var(--audio)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Image.size)}%; background:var(--image)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Textual.size + stats.Other.size)}%; background:var(--other)"></div>
                </div>
                <div class="stat-row"><span>🎞️ Video</span><b>${stats.Video.count}</b></div>
                <div class="stat-row"><span>🎧 Audio</span><b>${stats.Audio.count}</b></div>
                <div class="stat-row"><span>🖼️ Images</span><b>${stats.Image.count}</b></div>
                <div class="stat-row"><span>📄 Docs / Other</span><b>${stats.Textual.count + stats.Other.count}</b></div>
            </div>`;
    } else {
        if (data.category === "Image" || data.thumbnail) {
            html += `<h3>Preview</h3>
                     <div class="img-preview-container">
                        <img id="preview-img" src="" alt="Carregando...">
                     </div>`;
            setTimeout(() => {
                const img = document.getElementById('preview-img');
                tryLoadImage(img, data.thumbnail, name);
            }, 50);
        }

        html += `<span class="meta-label">Modificado</span><span class="meta-value">${data.modified || "N/A"}</span>`;
        
        if (data.category === "Video") {
            // Garante que displayRes exista ou usa a dimensão original
            const displayRes = data.dimension || "N/A"; 
            
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Resolução</span><span class="meta-value">${displayRes}</span>
                <span class="meta-label">Duração / Áudio</span><span class="meta-value">${formatTime(data.duration_ms)} / ${data.audio_channels || "N/A"}</span>
                <span class="meta-label">Aspecto / FPS</span><span class="meta-value">${data.aspect_ratio || "N/A"} / ${data.frame_rate || "N/A"}</span>`;
        } else if (data.category === "Audio") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Duração</span><span class="meta-value">${formatTime(data.duration_ms)}</span>
                <span class="meta-label">Canais</span><span class="meta-value">${data.audio_channels || "N/A"}</span>`;
        } else if (data.category === "Image") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Dimensões</span><span class="meta-value">${data.dimension || "N/A"}</span>
                <span class="meta-label">DPI</span><span class="meta-value">${data.dpi || "N/A"}</span>`;
        }

        // NOVIDADE: Verifica explicitamente por content_preview ou categoria textual
        if (data.content_preview) {
            html += `<h3>Conteúdo do Documento</h3>
                     <div class="preview-box" id="preview-text">Loading content...</div>
                     <button class="copy-btn" onclick="copyPreviewText()">Copiar Conteúdo</button>`;
        }
    }
    
    content.innerHTML = html;

    // Sincronização garantida: espera o DOM atualizar para injetar o texto
    if (data.content_preview) {
        setTimeout(() => {
            const box = document.getElementById('preview-text');
            if (box) box.textContent = data.content_preview;
        }, 10);
    }
}

function renderColumn(node, level, path = []) {
    const explorer = document.getElementById("explorer");
    while (explorer.children.length > level) explorer.removeChild(explorer.lastChild);
    const col = document.createElement("div"); col.className = "column";
    const keys = Object.keys(node).filter(k => k !== "folder_size_gb").sort((a, b) => {
        const aIsF = node[a].folder_size_gb !== undefined;
        const bIsF = node[b].folder_size_gb !== undefined;
        return (aIsF !== bIsF) ? bIsF - aIsF : a.localeCompare(b);
    });
    keys.forEach(name => {
        const val = node[name];
        const isFolder = val.folder_size_gb !== undefined;
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `<span class="icon">${getIcon(name, isFolder)}</span> <span class="item-text">${name}</span>`;
        item.onclick = () => {
            Array.from(col.children).forEach(c => c.classList.remove('active'));
            item.classList.add('active');
            showMetadata(name, val, path.concat(name));
            if (isFolder) renderColumn(val, level + 1, path.concat(name));
            else while (explorer.children.length > level + 1) explorer.removeChild(explorer.lastChild);
        };
        col.appendChild(item);
    });
    explorer.appendChild(col);
}

function performSearch() {
    const term = document.getElementById("search").value.toLowerCase();
    const explorer = document.getElementById("explorer");
    if (!term) { renderColumn(TREE, 0); return; }
    const results = [];
    function searchNode(node, currentPath) {
        for (const key in node) {
            if (key === "folder_size_gb") continue;
            const item = node[key];
            const isFolder = item.folder_size_gb !== undefined;
            const match = key.toLowerCase().includes(term) || (item.content_preview && item.content_preview.toLowerCase().includes(term));
            if (match) results.push({ name: key, data: item, path: currentPath.concat(key), isFolder });
            if (isFolder) searchNode(item, currentPath.concat(key));
        }
    }
    searchNode(TREE, ["Root"]);
    explorer.innerHTML = "";
    const col = document.createElement("div"); col.className = "column"; col.style.minWidth = "100%";
    results.slice(0, 100).forEach(res => {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<span class="icon">${getIcon(res.name, res.isFolder)}</span> <div><b>${res.name}</b><br><small>${res.path.join("/")}</small></div>`;
        div.onclick = () => showMetadata(res.name, res.data, res.path);
        col.appendChild(div);
    });
    explorer.appendChild(col);
}

document.addEventListener("DOMContentLoaded", () => renderColumn(TREE, 0));
</script>
