s eram pobre, mas souberam nos orientar na vida.\nP/2 – Como era o bairro onde morava, a rua, as brincadeiras?\nR – E, Rio Preto morava na Rua Amaral.\nP/2 – E como era essa rua?\nR – Era uma rua de movimento que nem, vamos dizer, essa aqui, que nem a Episcopal, uma rua assim, travessa assim, passava onde lá é a Tiradentes o outro era, e passava"}, "folder_size_gb": 0.0}, "Imagens": {"MCA_HV007.xlsx": {"size_mb": 0.019, "modified": "2021-01-28 17:39:30", "extension": "XLSX", "full_path": "D:\\MCA\\MCA_HV003_Héllio Miceli\\Imagens\\MCA_HV007.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nMCA_HV007_MO001 | Hélio Micelli | Retrato | 1999 | São Carlos - SP | Retrato de Hellio Miceli. São Carlos, SP, 1999.  | SESC SP, memórias do comércio, Araraquara | Créditos: Marcia Zoet\nMCA_HV007_FT001 | Hélio Micelli | A Econômica | 1972 | São Carlos - SP | Em evento no armazém 'A Econômica', de Hélio, o diretor do jornal 'A Folha de São Carlos' lhe entrega o diploma pela criação da 'Semana do Consumidor' no comércio de São Carlos.  | Sesc sp, memórias do comércio, Araraquara, homenagem, diploma, armazém"}, "MCA_HV007_FT001.jpg": {"size_mb": 0.015, "modified": "2005-07-26 15:33:52", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV003_Héllio Miceli\\Imagens\\MCA_HV007_FT001.jpg", "category": "Image", "duration_ms": 0, "dimension": "360x239", "height": 239, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "360x239"}, "MCA_HV007_MO001.jpg": {"size_mb": 0.0155, "modified": "2005-07-26 15:33:32", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV003_Héllio Miceli\\Imagens\\MCA_HV007_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "245x360", "height": 360, "dpi": 100.0, "color_mode": "RGB", "duration": 0.0, "resolution": "245x360"}, "folder_size_gb": 0.0}, "folder_size_gb": 26.493}, "MCA_HV014_Clarice Gomes Afonso": {"Audiovisual": {"Pre o\nEntrevistado por Karen Worcman e Daniela de Lima\nAraraquara, 18 de Setembro de 1999\nP/1 – Clarice, pode começar dizendo o seu nome, o local de nascimento e a data.\nR – Meu nome é Clarice Gomes Afonso, nasci aqui mesmo, em Araraquara.\nP/1 – E quando nasceu?\nR – Dia 25 de agosto de 1954.\nP/1 – E como é o nome de seu pai?\nR – O nome de meu pai é Olívio Gomes da Silva, minha mãe Conceição Ferreira da Silva.\nP/1 – Seu pai nasceu onde?\nR – Meu pai nasceu aqui em Araraquara também. Minha mãe também é de Araraquara.\nP/1 – Você sabe quando eles nasceram?\nR – Meu pai? Dia 25 de Março de 1912 e minha mãe, dia 21 de Abril de 1921.\nP/1 – Você pode me dizer o nome de seus avós, se você os conhecia?\nR – Meus avós, eu conheci assim, muito pouco. Minha avó materna não cheguei a conhecer. Eles vieram de Portugal, tanto os avós maternos como paternos. \nP/1 – Todos os seus avós vieram de Portugal...\nR – Todos eles vieram de Portugal.\nP/1 – Você sabe o nome deles, Clarice?\nR – De minha avó paterna é Jesuína e do meu avô... Não lembro agora no momento... \nP/1 – Está bom! E do materno? Depois, quando lembrar, você conta...\nR – Materno, o meu avó era Manoel? Cabral e min"}, "folder_size_gb": 0.0}, "Imagens": {"MCA_HV005.xlsx": {"size_mb": 0.0194, "modified": "2021-02-03 11:13:18", "extension": "XLSX", "full_path": "D:\\MCA\\MCA_HV014_Clarice Gomes Afonso\\Imagens\\MCA_HV005.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nMCA_HV005_MO001 | Clarice Gomes Afonso | Making of 1 | 1999 | Araraquara - SP | Retrato de Clarice Gomes Afonso. Araraquara, SP, 1999. Foto: Marcia Zoet\nMCA_HV005_FT001 | Clarice Gomes Afonso | Mercadinho de Geraldo de Oliveira | 1971 | Araraquara - SP | Clarice Gomes Afonso (à esquerda) e sua amiga Helena (à direita) no mercadinho de Geraldo de Oliveira, onde trabalhavam. Foi o primeiro emprego de Clarice. | Memórias do comércio, a o Paraná, já apanhou malária, apanhou maleita, e o governo não tinha recurso.\nP/1 – E aí o que aconteceu?\nR – Sofreram cinco anos mais ou menos.\nP/1 - Lá no Paraná?\nR – Com a malária, é.\nP/1 – Lá no Paraná eles foram trabalhar com o quê?\nR – Lavoura, sempre lavoura.\nP/1 – Mas o que, café?\nR – Na época eles fazia de tudo, café, algodão, arroz, milho, plantava essas coisas, né?\nP/1 – E eles vieram num grupo, de Okin"}, "folder_size_gb": 0.0}, "Imagens": {"MCA_HV006.xlsx": {"size_mb": 0.0199, "modified": "2021-01-28 17:24:30", "extension": "XLSX", "full_path": "D:\\MCA\\MCA_HV015_Eishim Uesato\\Imagens\\MCA_HV006.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nMCA_HV006_FT001 | Eishim Uesato | casamento | 1951 | Tambará | O casamento de Eishim Uezato e Yonne Uezato, na igreja matriz. Tambará, PR, 1951 | SESC SP, memórias do comércio, Araraquara, casamento, vestido de noiva, noivos\nMCA_HV006_FT002 | Eishim Uesato | Balcão da Sorveteria | s.d. | Araraquara - SP | Na Nosso Sorvete, sorveteria e bar de Tetsuo Uezato, irmão de Eishim Uezato, da esquerda para a direita (fora do balcão e de chapéu) freguês; empregados; Tetsuo e Tereza.\u003cbr\u003e | SESC SP, memórias do comercio, araraquara, sorveteria, sorvete, balcão | pesquisadora Flávia. original 18 x 23,5\nMCA_HV006_FT003 | Eishim Uesato | Família em festa | 1950 | Araraquara - SP | Festa na casa de Eishim Uezato. Da esquerda para a direita, Gilza (sobrinha); Tereza (irmã); Pedro (irmão); Nelson (cunhado); Suque (sobrinho); Eishim; José Roberto (filho); Hiro (primo); Tatsuko (cunhado). N"}, "MCA_HV006_FT001.jpg": {"size_mb": 0.018, "modified": "2005-07-26 15:30:04", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV015_Eishim Uesato\\Imagens\\MCA_HV006_FT001.jpg", "category": "Image", "duration_ms": 0, "dimension": "251x360", "height": 360, "dpi": 100.0, "color_mode": "L", "duration": 0.0, "r  "Textual", "content_preview": "Depoimento de Aparecido Dahab\nEntrevistado por Claudia Leonor e Flavia Darre Barbosa\nAraraquara, 18 de Setembro de 1999\nP/1 – Pra começar a entrevista, qual o seu nome completo, o local e a data de nascimento?\nR – É Aparecido Dahab. Local de nascimento é São Paulo, a data é 02 de novembro de 1930.\nP/1 – O nome dos seus pais?\nR – Meu pai chamava-se Tufik Dahab e a minha mãe chamava-se Bassma Dahab\nP/1 – Quando eles nasceram e onde?\nR – Os meus pais, mais ou menos, eles tinham a mesma idade... Mais ou menos, eles tinham a mesma idade. Como nessa época, em 1901, que foi, mais ou menos, a data do nascimento, não havia registro. Então, praticamente, eles acabaram determinando que o dia seria... É uma determinação, então determinou que seria 1º de maio de 1901, que os dois tinham a mesma idade.\nP/1 - Primeiro de maio é pros dois?\nR - Pros dois.\nP/1 - É mesmo! Que interessante.\nP/1 - Eles casaram-se lá no Líbano e vieram pro Brasil, e... só não me recordo agora a data que eles vieram ao Brasil. Só que sou filho único e nasci só depois de nove anos de casado. Então ficou só eu. Levo o meu nome de Aparecido não me pergunta porque que é Aparecido, porque na verdade todo mundo me conhece como"}, "folder_size_gb": 0.0}, "Imagens": {"MCA_HV003.xlsx": {"size_mb": 0.0209, "modified": "2021-02-03 11:04:38", "extension": "XLSX", "full_path": "D:\\MCA\\MCA_HV016_Apparecido Dahab\\Imagens\\MCA_HV003.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nMCA_HV003_MO001 | Aparecido Dahab | Making of 1 | 1999 | Araraquara - SP | Retrato de Aparecido Dahab.  | Araraquara, Memórias do comércio, registro, óculos  | Créditos: Marcia Zuet\nMCA_HV003_FT001 | Aparecido Dahab | casamento | 1956 | Araraquara - SP | Casamento de Josef e Farizi (irmã de Isabelle) e Aparecido e Isabelle. Casamento de Aparecido Dahab. Da esquerda para a direita, mãe?\nR – Maria Tenório Bezerra.\nP/1 – E nome dos avós paternos?\nR – Ostinvaldo Bezerra e Cândida Torres Galinto\nP/1 – E dos avós maternos?\nR – André Bezerra Vasconcelos e Felissa de Vasconcelos\nP/1 – Pode repetir o nome da avó materna?\nR – Felissa Vasconcelos Bezerra. Esqueci do Bezerra.\nP/1 – E qual era a atividade profissional, o que seus avós faziam?\nR – Trabalhavam na agricultura. Era sitiante.\nP/1 – O que eles plantavam?\nR – Plantavam algodão, milho, mamona, mandioca, às"}, "folder_size_gb": 0.0}, "Imagens": {"MCA_HV010.xlsx": {"size_mb": 0.0193, "modified": "2021-01-29 08:29:22", "extension": "XLSX", "full_path": "D:\\MCA\\MCA_HV018_Olívio Alves Bezerra\\Imagens\\MCA_HV010.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nMCA_HV010_MO001 | Olívio Alves Bezerra | Retrato  | 1999 | Araraquara - SP | Retrato de Olívio Alves Bezerra. Araraquara, SP.  | SESC SP, Memórias do comércio, Araraquara, loja de rua, Bar e Café São Jorge | Créditos: Márcia Zoet\nMCA_HV010_FT001 | Olívio Alves Bezerra | A parede atrás do balcão | 1996 | Araraquara - SP | No Bar Café São Jorge, a parede, é recoberta de cartazes sobre equipes de futebol feitos pelo gráfico Benedito Lozzi Vianna, amigo de Olívio Alves Bezerra. Araraquara, SP, 1996 | SESC SP, Memórias do comércio, Araraquara, BALCÃO, cartazes, garrafas, Portuguesa de Desportos\nMCA_HV010_FT002 | Olívio Alves Bezerra | Comemoração do aniversário de Paulo Barbieri | 1961 | Araraquara - SP | Na comemoração do aniversário de Paulo Barbieri, Olívio Alves Bezerra (à direita).  | SESC SP, Memórias do comércio, Araraquara, amigos, bar, comemoração, aniversário, amiza"}, "MCA_HV010_FT001.jpg": {"size_mb": 0.0235, "modified": "2005-07-26 15:59:52", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV018_Olívio Alves Bezerra\\Imagens\\MCA_HV010_FT001.jpg", "category": "Image", "duration_ms": 0, "dimension": "360x218 mension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5517078.0, "duration": 5517.08, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 10.462}, "Áudio": {"MCA_HV007_Amalia Acetozi Massafera.wav": {"size_mb": 1026.9049, "modified": "2022-06-06 16:35:24", "extension": "WAV", "full_path": "D:\\MCA\\MCA_HV007_Amalia Acetozi Massafera\\Audiovisual\\Áudio\\MCA_HV007_Amalia Acetozi Massafera.wav", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 5608269.0, "duration": 5608.27}, "folder_size_gb": 1.003}, "folder_size_gb": 31.256}, "Textual": {"MCA_HV007_Amalia Acetozi Massafera_rev.doc": {"size_mb": 0.105, "modified": "2000-07-04 20:32:32", "extension": "DOC", "full_path": "D:\\MCA\\MCA_HV007_Amalia Acetozi Massafera\\Textual\\MCA_HV007_Amalia Acetozi Massafera_rev.doc", "category": "Textual"}, "MCA_HV007_Amalia Acetozi Massafera_rev.docx": {"size_mb": 0.0342, "modified": "2026-02-12 11:26:52", "extension": "DOCX", "full_path": "D:\\MCA\\MCA_HV007_Amalia Acetozi Massafera\\Textual\\MCA_HV007_Amalia Acetozi Massafera_rev.docx", "category": "Textual", "content_preview": "Depoimento de Amalia Acetozi Massafera\nEntrevistado por Rosali Henriques e Flávia Barbosa\nAraraquara, 16 de setembro de 1999\nP/1 – Dona Amalia, para começar a entrevista diga seu nome completo, local e a data de nascimento.\nR – Eu nasci dia 25 de junho de 1917, em Araraquara.\nP/1 – Qual o seu nome completo?.\nR – Amalia Acetozi Massafera.\nP/1 – Qual o nome dos seus pais?\nR – Meus pais são Secundino Acetozi e Maria Prozilo Avanci, depois Acetozi, né, também.\nP/1 – Qual a origem deles?\nR – Italianos, de origem quer dizer, eles são descendentes, né, porque os meus avós vieram da Itália, tanto materno como paterno e fixaram aqui, adoraram Araraquara, mais engraçado é ela contar, né, a minha avó sabe, contava que no navio quando eles distribuíam banana, ela achou tão gostosa a banana, ela comia com casca e tudo (riso) depois que ela aprendeu que não era como maçã, que comia com casca, e a banana ela comia com casca.\nP/1 – Por que eles vieram aqui pra Araraquara?\nR – Ah porque eles escolheram aqui, acho que foi distribuído, né, os lugares que, como é que fala, quando vem de lá pra cá.\nP/1 – Imigrantes.\nR – Imigrantes, vieram como imigrantes, olha trabalharam, viu, os italianos, os alemães"}, "folder_size_gb": 0.0}, "Imagens": {"MCA_HV001.xlsx": {"size_mb": 0.0204, "modified": "2021-02-02 19:13:48", "extension": "XLSX", "full_path": "D:\\MCA\\MCA_HV007_Amalia Acetozi Massafera\\Imagens\\MCA_HV001.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nMCA_HV001_MO001 | Amália Acetozi Massafera | Making of | 1999 | Araraquara - SP | Retrato de Amalia Acetozi Massafera.  | SESC SP, Memórias do Comércio, retrato, Araraquara, mulher | Créditos: Márcia Zoet. Local no acervo MP CD 884\nMCA_HV001_FT001 | Amália Acetozi Massafera | Retrato de Amalia Acetozi Massafera | 1941 | Araraquara - SP | Amalia Acetozi Massafera fotografada por seu Rivas, que também era caricaturista, no 'Foto Estúdio', um dos mais antigos da cidade. Araraquara, SP, 1941. Foto: Rivas | SESC SP, Memórias do Comércio, retrato, Araraquara, mulher, comércio, retrato antigo | Local no acervo: MP CD 884   original 14 cm x 8,5 cm\npesquisador Daniela em 27/09/Créditos: Foto estúdio\nMCA_HV001_FT002 | Amália Acetozi Massafera | Passeio na Chácara de Nhozinho | 1941 | Araraquara - SP | Amalia em passeio na chácara de Nhozinho, amigo de sua família. Araraquara, SP, "}, "MCA_HV001_DOC001.jpg": {"size_mb": 0.0265, "modified": "2005-07-26 14:29:38", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV007_Amalia Acetozi Massafera\\Imagens\\MCA_HV001_DOC001.jpg", "category": "Image", "duration_ms": 0, "dimension": "360x235", "height": 235, "d tou muito porque estudou em seminário lá na Itália, então veio pra cá pro Brasil mas assim naquela imigração que teve grande, né, então ele veio pra cá pra fazenda mas não se adaptou e foi pra Companhia de Estrada de Ferro.\nP/1 – E o"}, "folder_size_gb": 0.0}, "folder_size_gb": 39.552}, "MCA_HV012_Joaquim Palomino Rodrigues": {"Audiovisual": {"Preservação": {"HI8_0124.avi": {"size_mb": 25592.2489, "modified": "2008-04-08 13:35:57", "extension": "AVI", "full_path": "D:\\MCA\\MCA_HV012_Joaquim Palomino Rodrigues\\Audiovisual\\Preservação\\HI8_0124.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 7082122.0, "duration": 7082.12, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 24.992}, "Acesso": {"MCA_HV012_Joaquim Palomino Rodrigues.mp4": {"size_mb": 13582.6623, "modified": "2022-06-08 00:16:56", "extension": "MP4", "full_path": "D:\\MCA\\MCA_HV012_Joaquim Palomino Rodrigues\\Audiovisual\\Acesso\\MCA_HV012_Joaquim Palomino Rodrigues.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6992285.0, "duration": 6992.28, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 13.264}, "Áudio": {"MCA_HV012_Joaquim Palomino Rodrigues.wav": {"size_mb": 1296.779, "modified": "2022-06-07 12:02:00", "extension": "WAV", "full_path": "D:\\MCA\\MCA_HV012_Joaquim Palomino Rodrigues\\Audiovisual\\Áudio\\MCA_HV012_Joaquim Palomino Rodrigues.wav", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 7082142.0, "duration": 7082.14}, "folder_size_gb": 1.266}, "folder_size_gb": 39.523}, "Textual": {"MCA_HV012_Joaquim Palomino Rodrigues_rev.doc": {"size_mb": 0.1416, "modified": "2000-07-05 12:00:26", "extension": "DOC", "full_path": "D:\\MCA\\MCA_HV012_Joaquim Palomino Rodrigues\\Textual\\MCA_HV012_Joaquim Palomino Rodrigues_rev.doc", "category": "Textual"}, "MCA_HV012_Joaquim Palomino Rodrigues_rev.docx": {"size_mb": 0.0425, "modified": "2026-02-12 11:26:58", "extension": "DOCX", "full_path": "D:\\MCA\\MCA_HV012_Joaquim Palomino Rodrigues\\Textual\\MCA_HV012_Joaquim Palomino Rodrigues_rev.docx", "category": "Textual", "content_preview": "Depoimento de Joaquim Palomino Rodrigues\nEntrevistado por: Karen Worcman e Flávia Darre Barbosa\nAraraquara, 17 de Setembro de 1999\nP/1 – Bem Senhor Joaquim, para começar, diga seu nome, o lugar onde nasceu e a data. \nR – Eu me chamo Joaquim Palomino Rodrigues, sou natural de Taquaritinga, Estado de São Paulo, nasci no dia 2 de dezembro de 1932.\nP/1 – Nossa! No ano da Revolução?\nR - É. Minha mãe se assustou porque quando terminou a Revolução, quando saíram os fogos, aí eu nasci.\nP/1 – Pode me dizer o nome dos seus pais e se lembra onde nasceram?\nR - Meu pai, Félix da Cruz Palomino, nasceu na Espanha, eles vieram fugidos da Espanha e chegaram em Taquaritinga.\nP/1 – Eles quem? Ele e os pais dele?\nR - E os pais dele.\nP/1 – Ele veio com que idade?\nR - Ele veio com uns sete anos da Espanha.\nP/1 – E eles fugiram do quê?\nR - De navio.\nP/1 – Sim. Mas qual era o motivo, você sabe?\nR - Não. Naquele tempo, parece que era uma doença que tinha dado na Espanha e eles falaram que tinha que fugir e fugiram. E os meus pais chegaram em Taquaritinga. Mas tem uma coisa, quando eles chegaram em Taquaritinga, porque o nome verdadeiro do meu pai não é Félix da Cruz Palomino e sim, Félix Marmol. Quando ele"}, "folder_size_gb": 0.0}, "Imagens": {"MCA_HV016.xlsx": {"size_mb": 0.0216, "modified": "2021-02-03 15:33:26", "extension": "XLSX", "full_path": "D:\\MCA\\MCA_HV012_Joaquim Palomino Rodrigues\\Imagens\\MCA_HV016.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nMCA_ _size_gb": 28.314}, "Textual": {"MCA_HV013_João Francisco Navarro Garcia_rev.doc": {"size_mb": 0.104, "modified": "2000-07-05 12:04:34", "extension": "DOC", "full_path": "D:\\MCA\\MCA_HV013_João Francisco Navarro Garcia\\Textual\\MCA_HV013_João Francisco Navarro Garcia_rev.doc", "category": "Textual"}, "MCA_HV013_João Francisco Navarro Garcia_rev.docx": {"size_mb": 0.0299, "modified": "2026-02-12 11:27:00", "extension": "DOCX", "full_path": "D:\\MCA\\MCA_HV013_João Francisco Navarro Garcia\\Textual\\MCA_HV013_João Francisco Navarro Garcia_rev.docx", "category": "Textual", "content_preview": "Depoimento de João Francisco Navarro Garcia\nEntrevistado por: Daniela Lima e Claudia Leonor\nAraraquara, 17 de Setembro de 1999\nP/1 - O senhor pode começar falando seu nome, local e data de nascimento.\nR - Meu nome é João Francisco Navarro Garcia, nasci em Nova Europa, uma cidadezinha bem pertinho aqui de Araraquara, no dia 09 de março de 1940.\nP/1 - O nome dos seus pais?\nR - Meus pais, meu pai é João Navarro Peres, minha mãe é Maria do Carmo Garcia.\nP/1 - E os avós?\nR - Meus avós, é Maria Peres Plazzas, avós paternos e o meu avô João Navarro Saes.\nP/1 - Eles são daqui de Araraquara?\nR - Os meus avós vieram da Espanha, não pra Nova Europa, eles vieram pra Jaú e depois foram pra Nova Europa. Já o meu pai, meu pai também nascido em Jaú e depois foram pra Nova Europa, e meu pai e minha mãe até hoje estão em Nova Europa.\nP/1 - E os avós maternos também...\nR - Maternos também, depois eles foram embora de Nova Europa. Eles foram pra uma cidadezinha do Paraná, onde eles vieram a falecer.\nP/1 - E a atividade profissional dos seus pais e os avós?\nR - Dos meus pais e avós, eles eram lavradores, né? Os avós tanto paternos como maternos, eles eram lavradores. Meu pai também se aposentou como la"}, "folder_size_gb": 0.0}, "Imagens": {"MCA_HV009.xlsx": {"size_mb": 0.0195, "modified": "2021-02-03 11:24:38", "extension": "XLSX", "full_path": "D:\\MCA\\MCA_HV013_João Francisco Navar etembro de 1999\nP/1 – Dona Maria, para começar a entrevista diga o seu nome completo, o local e data de nascimento.\nR – Maria de Paula Bueno Circelli, é, olha, tem que ter o endereço né? Avenida Dr. Carlos Botelho…\nP/1 – Que a senhora mora hoje?\nR – É. 1983, Centro.\nP/1 – Que dia que a senhora nasceu?\nR – Dia 19 de janeiro de 1935.\nP/1 – Onde?\nR – Em Araraquara.\nP/1 – O nome do seu pai e da sua mãe ?\nR – Benedito de Paula Bueno e Jorvina Alves de Godoy Bueno.\nP/1 – E de onde que eles são?\nR – O meu pai é de Jundiaí e a minha mãe, de Itirapina.\nP/1 – Itirapina. E o que é que eles faziam profissionalmente?\nR – Meu pai era maquinista da Paulista da Fepasa e minha mãe era doméstica, do lar.\nP/1- A senhora tinha irmãos?\nR – Dois irmãos. \nP/1 – Qual o nome deles?\nR – Silas de Paula Bueno e Cleonice de Paula Bueno Zanor que ela é casada, né?\nP/1 – Ah tá, e o que a senhora lembra da sua infância, da rua onde morava aqui em Araraquara?\nR – Araraquara não lembro, porque sai pequena de lá, e lembro bem de Rio Claro, onde fui criada lembro bem da infância, foi uma infância bem agit"}, "folder_size_gb": 0.0}, "Imagens": {"MCA_HV020.xlsx": {"size_mb": 0.0194, "modified": "2021-01-29 13:30:04", "extension": "XLSX", "full_path": "D:\\MCA\\MCA_HV004_Maria de Paula Bueno Circelli\\Imagens\\MCA_HV020.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nMCA_HV020_MO001 | Maria de Paula Bueno Circelli | Retrato | 1999 | São Carlos - SP | Retrato de Maria de Paula Bueno Circelli. São Carlos, SP, 1999.  | Créditos Márcia Zoet | MCA004FT001\nMCA_HV020_FT001 | Maria de Paula Bueno Circelli | Casamento | 1983 | São Carlos - SP | Casamento de Maria de Paula Bueno Circelli e Antônio Circelli. São Carlos, SP, 1983. | SESC SP, Memórias do comércio, Araraquara, matrimonio, cerimônia de casamento, casamento | MCA004FT\nMCA_HV020_FT002 | Maria de Paula Bueno Circelli | Casamento civil de Maria e Antônio | s.d. | s.l. | Benevido de Paula Bueno, Maria de Paula Bueno Circelli, Antônio Circelli e Narcisa de Paula Bueno (da esq. p/ dir.), por ocasião do casamento civil de Maria e Antônio, após felizes 20 anos de convivência | SESC SP, Memórias do comércio, Araraquara, matrimonio, casamento no civil, cerimônia de casamento, casamento | MCA0"}, "MCA_HV020_FT001.jpg": {"size_mb": 0.0198, "modified": "2005-07-26 15:54:44", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV004_Maria de Paula Bueno Circelli\\Imagens\\MCA_HV020_FT001.jpg", "category": "Image", "duration_ms": 0, "dimension": "290x360", "height": 360, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "290x360"}, "MCA_HV020_FT002.jpg": {"size_mb": 0.0209, "modified": "2005-07-26 15:54:52", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV004_Maria de Paula Bueno Circelli\\Imagens\\MCA_HV020_FT002.jpg", "category": "Image", "duration_ms": 0, "dimension": "290x360", "height": 360, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "290x360"}, "MCA_HV020_FT003.jpg": {"size_mb": 0.0182, "modified": "2005-07-26 15:55:02", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV004_Maria de Paula Bueno Circelli\\Imagens\\MCA_HV020_FT003.jpg", "category": "Image", "duration_ms": 0, "dimension": "263x360", "height": 360, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "263x360"}, "MCA_HV020_FT004.jpg": {"size_mb": 0.021, "modified": "2005-07-26 15:55:12", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV004_Maria de Paula Bueno Circelli\\Imagens\\MCA_HV020_FT004.jpg", "category": "Image", "duration_ms": 0, "dimension": "360x296", "height": 296, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "360x296"}, "MCA_HV020_MO001.jpg": {"size_mb": 0.0121, "modified": "2005-07-26 15:54:16", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV004_Maria de Paula Bueno Circelli\\Imagens\\MCA_HV020_MO001.jpg", "category": "Image", "duration_ms": eto, aonde você nasceu e o dia?\nR – Cilson Marques de Lima, nascido ao 04 de agosto de 1963, Santo Antônio da Platina, Paraná.\nP/1 – O nome dos seus pais?\nR – João Marques de Lima, já falecido e Íria Rosa de Lima, a mãe.\nP/1 – Qual é a ascendência, você sabe?\nR – Como é?\nP/1 – Ascendência, se é italiano, português...\nR – É Mineiro.\nP/1 – Mineiro? Eles vieram de Minas?\nR – Meu pai, mineiro e minha mãe paranaense, mesmo.\nP/1 – Que cidade seu pai nasceu?\nR – Meu pai, acho que é Governador Valadares.\nP/1 – E a sua mãe?\nR – É Santo Antônio da Platina. naquela região ali.\nP/1 – Cilson, o que eles fazem? O que o seu pai fazia, qual era a profissão dele?\nR – Meu pai era agricultor, antes. Depois ele foi... a gente foi embora para o Paraná, lá em Andirá,  lá ele entrou na Prefeitura Municipal e trabalhou durante 15, 16 anos, na parte de... ele era pedreiro da prefeitura. Fazia de tudo na prefeitura, assim de serviços de pedreiro. Inclusive, o apelido dele era João Lajota. Ele fazia as lajotas da cidade inteira, era ele que fazia."}, "folder_size_gb": 0.0}, "Imagens": {"MCA_HV004.pdf": {"size_mb": 1.1299, "modified": "2021-02-02 13:05:24", "extension": "PDF", "full_path": "D:\\MCA\\MCA_HV002_Cilson Marques de Lima\\Imagens\\MCA_HV004.pdf", "category": "Textual", "content_preview": ""}, "MCA_HV004.xlsx": {"size_mb": 0.0194, "modified": "2021-02-02 13:49:06", "extension": "XLSX", "full_path": "D:\\MCA\\MCA_HV002_Cilson Marques de Lima\\Imagens\\MCA_HV004.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nMCA_HV004_MO001 | Cilson Marques de Lima | Making of 1\nMCA_HV004_FT001 | Cilson Marques de Lima | Diploma da pré-escola do Rodrigo (filho de Cilson) | 1998 | São Carlos - SP | O filho de Cilson, Rodrigo, passou para a primeira série e recebeu o diploma de conclusão da pré-escola. Cilson resolveu guardar uma recordação da primeira conquista escolar do filho. | diploma, pré-escola, pai e filho, recordação, família, escola, conquistas | medidas 15,5 x 10 cm\nMCA_HV004_FT002 | Cilson Marques de Lima | Cilson trabalhando na Van, no Broa em 1998 | 1998 | Broa | As fotos da Van foram tiradas no Broa a pedido do prefeito, a fim de renovar a permissão para continuar trabalhando no local. O prefeito queria ver em que condições Cilson estava trabalhando,  como era a van e quais as condições de limpeza.  | trabalho, van, cachorro quente, vendedor, trabalhador, comerciante, transporte"}, "MCA_HV004_FT001.jpg": {"size_mb": 0.0134, "modified": "2005-07-26 15:23:50", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV002_Cilson Marques de Lima\\Imagens\\MCA_HV004_FT001.jpg", "category": "Image", "duration_ms": 0, "dimension": "360x277", "height": 277, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "360x277"}, "MCA_HV004_FT002.jpg": {"size_mb": 0.0191, "modified": "2005-07-26 15:23:56", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV002_Cilson Marques de Lima\\Imagens\\MCA_HV004_FT002.jpg", "category": "Image", "duration_ms": 0, "dimension": "360x224", "height": 224, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "360x224"}, "MCA_HV004_FT003.jpg": {"size_mb": 0.0183, "modified": "2005-07-26 15:24:12", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV002_Cilson Marques de Lima\\Imagens\\MCA_HV004_FT003.jpg", "category": "Image", "duration_ms": 0, "dimension": "360x227", "height": 227, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "360x227"}, "MCA_HV004_FT004.jpg": {"size_mb": 0.0166, "modified": "2005-07-26 15:26:42", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV002_Cilson Marques de Lima\\Imagens\\MCA_HV004_FT004.jpg", "category": "Image", "duration_ms": 0, "dimension": "360x227", "height": 227, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "360x227"}, "MCA_HV004_MO001.jpg": {"size_mb": 0.0106, "modified": "2005-07-26 15:23:26", "extension": "JPG", "MCA_HV005_Salvador Scutti_rev.docx": {"size_mb": 0.032, "modified": "2026-02-12 11:27:06", "extension": "DOCX", "full_path": "D:\\MCA\\MCA_HV005_Salvador Scutti\\Textual\\MCA_HV005_Salvador Scutti_rev.docx", "category": "Textual", "content_preview": "Depoimento de Salvador Scutti\nEntrevistado por Ari Meneghini e Marlucy Godoy\nAraraquara, 15 de setembro de 1999\nP/1 – Então diga o seu nome, o local e a data de nascimento.\nR – Salvador Scutti, nascido em Matão, Estado de São Paulo, 24 de julho de 1928.\nP/1 – E qual o nome dos seus pais?\nR – Julio Scutti e Benta Maria Ragazzi.\nP/1 – E do seus avós paternos?\nR – José Ragazzi e Lavínia Roda.\nP/1 – E os maternos?\nR – Ah, tá invertido.\nP/1 – Tudo bem.\nR – Maternos é que é o José Ragazzi e paternos é Salvador Scutti e Rosa Furlan.\nP/1 – E qual que era a atividade dos seus avós?\nR – Lavradores.\nP/1 – E dos seus pais?\nR – Meu pai começou como lavrador, depois ele trabalhava com caminhão de aluguel, caminhão próprio.\nP/1 – E a sua mãe?\nR – Era do lar.\nP/1 – Qual é a origem do nome da família Scutti?\nR – A origem deve ser italiano, porque são descendentes de italianos.\nP/1 – Qual a região da Itália?\nR – Do paterno, é Altino e materno é de Mantola.\nP/1 – E quantos irmãos o senhor tem?\nR – Irmãos, são...\nP/1 – Irmãos, irmãs.\nR – Quatro, dois irmãos e duas irmãs.\nP/1 – Bom, vamos falar agora da sua infância, como era o local onde morava, a casa, a rua, o bairro?\nR – Bom o início mesmo foi na f"}, "folder_size_gb": 0.0}, "Imagens": {"MCA_HV012.xlsx": {"size_mb": 0.02, "modified": "2021-02-02 15:29:36", "extension": "XLSX", "full_path": "D:\\MCA\\MCA_HV005_Salvador Scutti\\Imagens\\MCA_HV012.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nMCA_HV012_MO001 | Salvador Scutti | Retrato | 1999 | São Carlos - SP | Retrato de Salvador Scutti. São Carlos, SP. 1999.  | Sesc SP, Memórias do Comércio | Créditos Márcia Zoet\nMCA_HV012_FT001 | Salvador Scutti | Quando ainda era moço | 1946 | Matão - SP | Salvador Scutti, aos 22 anos, faz um retrato para dar de presente à sua futura esposa, Eurídice. Matão, SP, 22/05/1946 | SESC SP, Memórias do Comércio, retrato, juventude, presente, gravata\nMCA_HV012_FT002 | Salvador Scutti | Casamento de Salvador Scutti e Eurídice | 1957 | Matão - SP | Casamento de Salvador Scutti e Eurídice, realizado pelo padre Amada Romão, na Igreja Matriz de Matão. Aos fundos, sr. Venâncio Macagna e sra. Elisa Ragassi, seus padrinhos. Matão, SP, 1957 | Sesc SP, Memórias do Comércio, noivo, casamento, matrimônio, celebração religiosa, igreja, vestido de noiva, padre\nMCA_HV012_FT003 | Salvador Scutt"}, "MCA_HV012_DOC001.jpg": {"size_mb": 0.0157, "modified": "2005-07-26 16:06:16", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV005_Salvador Scutti\\Imagens\\MCA_HV012_DOC001.jpg", "category": "Image", "duration_ms": 0, "dimension": "224x360", "height": 360, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "224x360"}, "MCA_HV012_DOC002.jpg": {"size_mb": 0.0203, "modified": "2005-07-26 16:06:26", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV005_Salvador Scutti\\Imagens\\MCA_HV012_DOC002.jpg", "category": "Image", "duration_ms": 0, "dimension": "224x360", "height": 360, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "224x360"}, "MCA_HV012_FT001.jpg": {"size_mb": 0.0296, "modified": "2005-07-26 16:06:34", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV005_Salvador Scutti\\Imagens\\MCA_HV012_FT001.jpg", "category": "Image", "duration_ms": 0, "dimension": "255x344", "height": 344, "dpi": 150.0, "color_mode": "RGB", "duration": 0.0, "resolution": "255x344"}, "MCA_HV012_FT002.jpg": {"size_mb": 0.0157, "modified": "2005-07-26 16:06:46", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV005_Salvador Scutti\\Imagens\\MCA_HV012_FT002.jpg", "category": "Image", "duration_ms": 0, "dimension": "266x360", "height": 36 :30", "extension": "DOC", "full_path": "D:\\MCA\\MCA_HV017_Tufik Lutaif\\Textual\\MCA_HV017_Tufik Lutaif_rev.doc", "category": "Textual"}, "MCA_HV017_Tufik Lutaif_rev.docx": {"size_mb": 0.0236, "modified": "2026-02-12 11:27:08", "extension": "DOCX", "full_path": "D:\\MCA\\MCA_HV017_Tufik Lutaif\\Textual\\MCA_HV017_Tufik Lutaif_rev.docx", "category": "Textual", "content_preview": "Depoimento de Tufik Lutaif\nEntrevistado por Claudia Leonor e Daniela de Lima\nAraraquara,18 de Setembro de 1999\nP/1 – Para começar a entrevista, com o senhor,  diga  seu nome completo, o local e a data de nascimento.\nR – Meu nome é Tufik, com K, Lutaif, com F mudo. Sou nascido a 22 de dezembro de 1931, na cidade de Itápolis. Nasci no mesmo local onde hoje trabalho, antigamente denominado Rua Quinze de Novembro, número 33. Hoje, Presidente Valentim Gentil, 1023.\nP/1 – Era casa?\nR – É, era casa e residência. Meu pai morou ali, trabalhava ali, tinha casa e comércio na frente e residência no fundo. Até hoje permanece ainda, lógico, e ampliada com o tempo. Até o dia 10 de dezembro residia a minha mãe, que faleceu dia 10 de dezembro.\nP/1 – O nome de seus pais...\nR – Meu pai chamava-se Lutfi José Lutaif e minha mãe Assma Yazig Lutaif.\nP/1 – De onde eles são?\nR - Do Líbano.\nP/1 - O senhor sabe de onde?\nR - Acho que é Hasbaia, né, Hasbaia.\nP/1 - Como  vieram para cá, como chegaram  aqui?\nR – É, ele veio como? Pra trabalhar, não. O destino dele foi trabalhar como dentista. Ele veio para Itápolis, naturalmente como outros libaneses e trabalhou por um ano como dentista. Mas ele viu que nesse an"}, "folder_size_gb": 0.0}, "Imagens": {"MCA_HV013.xlsx": {"size_mb": 0.02, "modified": "2021-01-29 09:40:24", "extension": "XLSX", "full_path": "D:\\MCA\\MCA_HV017_Tufik Lutaif\\Imagens\\MCA_HV013.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nMCA_HV013_MO001 | Tufik Lutaif | Retrato | 1999 | Araraquara - SP | Retrato de Tufik Lutaif. Araraquara, SP, 1999. | sesc sp, memórias do comércio, araraquara | créditos Márcia Zoet\nMCA_HV013_FT001 | Tufik Lutaif | Retrato do escoteiro | 1939 | Itápolis - SP | Tufik Lutaif quando era escoteiro, com 7 ou 8 anos de idade. Itápolis, SP, c. 1939. | sesc sp, memórias do comércio, araraquara, escoteiro, registro antigo, criança\nMCA_HV013_FT002 | Tufik Lutaif | Casamento | 1956 | Itápolis - SP | O casamento de Nazir Maria Hartung Lutaif e Tufik Lutaif. A foto foi feita na sala da casa de Assma Yasig Lutaif, mãe de Tufik. Itápolis, SP, 08/07/1956 | sesc sp, memórias do comércio, araraquara, noivos, casamento, vestido de noiva, vestido de casamento\nMCA_HV013_FT003 | Tufik Lutaif | Desfile comemorativo dos 100 anos da cidade  | 1962 | Itápolis - SP | Homenagem dos avicultores de I"}, "MCA_HV013_FT001.jpg": {"size_mb": 0.0137, "modified": "2005-07-26 16:08:36", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV017_Tufik Lutaif\\Imagens\\MCA_HV013_FT001.jpg", "category": "Image", "duration_ms": 0, "dimension": "236x295", "height": 295, "dpi": 100.0, "color_mode": "RGB", "duration": 0.0, "resolution": "236x295"}, "MCA_HV013_FT002.jpg": {"size_mb": 0.0192, "modified": "2005-07-26 16:08:44", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV017_Tufik Lutaif\\Imagens\\MCA_HV013_FT002.jpg", "category": "Image", "duration_ms": 0, "dimension": "270x360", "height": 360, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "270x360"}, "MCA_HV013_FT003.jpg": {"size_mb": 0.0247, "modified": "2005-07-26 16:08:54", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV017_Tufik Lutaif\\Imagens\\MCA_HV013_FT003.jpg", "category": "Image", "duration_ms": 0, "dimension": "360x235", "height": 235, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "360x235"}, "MCA_HV013_FT004.jpg": {"size_mb": 0.0205, "modified": "2005-07-26 16:09:04", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV017_Tufik Lutaif\\Imagens\ raraquara 17 de setembro de 1999\nP/1 – Bom, para começar a entrevista, diga seu nome completo, local e a data de nascimento.\nR – José Antonio Fragalli, nascido em Matão, 9 de dezembro de 1951.\nP/1 – Você nasceu na cidade mesmo?\nR – É, eu era morador de uma área de fazenda, distante a 8 km de Matão, e nasci acho que na própria fazenda mesmo.\nP/1 – E qual o nome dos seus pais, Fragalli?\nR – Meu pai é Francisco Fragalli, minha mãe é Regina Pessin Fragalli. Meu pai é de origem de São Carlos e minha mãe, origem de Araraquara.\nP/1 – Por que eles foram pra Matão?\nR – Logo na época da Segunda Guerra Mundial, década de 40, meu pai morava num, num sítio, aqui, entre Araraquara e Matão, e ele tinha uma pequena, naquele tempo era jardineira, né, que fazia a ligação do sítio daí da região, até Araraquara. E durante a guerra, escasseou gasolina, combustível, essas coisas, e inviabilizou esse trabalho dele, e praticamente precisou paralisar. E então, ele mudou-se pra Matão e foi em busca de emprego na Fábrica de Óleos Cambhuy, que é lá no bairro de Toriba, hoje essa fábrica de óleo já não existe mais, mas em 44"}, "folder_size_gb": 0.0}, "Imagens": {"MCA_HV018.xlsx": {"size_mb": 0.0205, "modified": "2021-01-29 13:11:46", "extension": "XLSX", "full_path": "D:\\MCA\\MCA_HV011_José Antônio Fragali\\Imagens\\MCA_HV018.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Visita de sua avó Domingas Carreri a sua família, na fazenda | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nMCA_HV018_MO001 | José Antonio Fragalli | Retrato | 1999 | Araraquara- SP | Retrato de José Antônio Fragalli. Araraquara, SP, 1999.  | créditos: Marcia Zoet\nMCA_HV018_FT001 | José Antonio Fragalli | Festa de confraternização | 1959 | Matão - SP | Funcionários da fábrica Óleos Alimentícios Cambuhy, em festa de confraternização de final em 23/12/1959. A fábrica, instalada em prédio construído em 1934, integrava o grupo da Fazenda Cambuhy, iniciou as suas atividades na década de 30 e operou até o início dos anos 80. | Memórias do Comércio, festa, Araraquara, fábrica Cambuhy \nMCA_HV018_FT002 | José Antonio Fragalli | formatura na Escola Normal | 1969 | Matão - SP |  José Antônio Fragalli, no dia de sua formatura na Escola Normal (penúltimo, da fileira do meio, ao lado do padre), quando ainda formavam-se turmas do Normal, "}, "MCA_HV018_FT001.jpg": {"size_mb": 0.0282, "modified": "2005-07-26 15:50:18", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV011_José Antônio Fragali\\Imagens\\MCA_HV018_FT001.jpg", "category": "Image", "duration_ms": 0, "dimension": "360x270", "height": 270, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "360x270"}, "MCA_HV018_FT002.jpg": {"size_mb": 0.0188, "modified": "2005-07-26 15:50:24", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV011_José Antônio Fragali\\Imagens\\MCA_HV018_FT002.jpg", "category": "Image", "duration_ms": 0, "dimension": "360x260", "height": 260, "dpi": 72.0, "color_mode": "L", "duration": 0.0, "resolution": "360x260"}, "MCA_HV018_FT003.jpg": {"size_mb": 0.0151, "modified": "2005-07-26 15:50:34", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV011_José Antônio Fragali\\Imagens\\MCA_HV018_FT003.jpg", "category": "Image", "duration_ms": 0, "dimension": "213x360", "height": 360, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "213x360"}, "MCA_HV018_FT004.jpg": {"size_mb": 0.0191, "modified": "2005-07-26 15:50:44", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV011_José Antônio Fragali\\Imagens\\MCA_HV018_FT004.jpg", "category": "Image", "duration_ms": 0, "dimension": "360x277", "height": 277, "dpi": 100.0, "color_mode": "L", "duration": 0.0, "resolution": "360x277"}, "MCA_HV018_FT005.jpg": {"size_mb": 0.0199, "modified": "2005-07-26 15:50:58", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV011_José Antônio Fragali\\Imagens\\MCA_HV018_FT005.jpg", "category": "Image", "duration_ms": 0, "dimension": "360x269", "height": 269, ": "Stereo", "audio_codec": "PCM", "duration_ms": 2789186.0, "duration": 2789.19}, "MCA_HV008_Ivo Dell'Acqua Júnior (parte 1).wav": {"size_mb": 1314.3747, "modified": "2022-06-06 17:03:58", "extension": "WAV", "full_path": "D:\\MCA\\MCA_HV008_Ivo Dell´Acqua Júnior\\Audiovisual\\Áudio\\MCA_HV008_Ivo Dell'Acqua Júnior (parte 1).wav", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 7178238.0, "duration": 7178.24}, "folder_size_gb": 1.782}, "folder_size_gb": 55.375}, "Textual": {"MCA_HV008_Ivo Dell´Acqua Júnior_rev.doc": {"size_mb": 0.1348, "modified": "2000-07-05 11:42:32", "extension": "DOC", "full_path": "D:\\MCA\\MCA_HV008_Ivo Dell´Acqua Júnior\\Textual\\MCA_HV008_Ivo Dell´Acqua Júnior_rev.doc", "category": "Textual"}, "MCA_HV008_Ivo Dell´Acqua Júnior_rev.docx": {"size_mb": 0.048, "modified": "2026-02-12 11:27:12", "extension": "DOCX", "full_path": "D:\\MCA\\MCA_HV008_Ivo Dell´Acqua Júnior\\Textual\\MCA_HV008_Ivo Dell´Acqua Júnior_rev.docx", "category": "Textual", "content_preview": "Depoimento de Ivo Dall’Acqua Júnior\nEntrevistado por Ary Meneghini e Cláudia Leonor\nAraraquara, 16 de setembro de 1999\nP/1 – Poderia dizer qual o seu nome, local e data de nascimento?\nR – Meu nome é Ivo Dall’Acqua Júnior, nasci em Araraquara, no dia 10 de novembro de 1946\nP/1 – O nome dos seus pais?\nR – Ivo Dall’ Acqua , meu pai, e minha mãe, Zuleika Bertoni Dall ‘Acqua.\nP/1 – E o nome dos seus avós? \nR – Meus avós paternos Higinio Dall’Acqua e Edwirges Coleratto Dall’ Acqua. \nP/1 – E o nome dos seus avós maternos?\nR – Pedro Bertoni e Iria Sampaio Bertoni \nP/1 – Qual a origem do nome Dall’Acqua?\nR – O meu avô é natural de Garello, província de Mantova, no norte da Itália. A província de Mantova é atualmente Lombardia, mas é da região de cultura veneta. E a minha avó era emiliana. Mas de uma região bem próxima a Mantova também. \nP/1 – E qual era a atividade dos seus avós?\nR – Meu avô, inicialmente, veio pro Brasil e voltou pra Itália. Fez o exército, e quando retornou, passou a trabalhar como administrador de fazenda. E foi quando ele se casou. Depois, eles se mudaram pra Araraquara e ele passou a ser representante comercial. Na época, não era representante comercial, era uma espéci"}, "folder_size_gb": 0.0}, "Imagens": {"MCA_HV008.xlsx": {"size_mb": 0.0198, "modified": "2021-02-03 21:26:40", "extension": "XLSX", "full_path": "D:\\MCA\\MCA_HV008_Ivo Dell´Acqua Júnior\\Imagens\\MCA_HV008.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nMCA_HV008_MO001 | Ivo Dall'Acqua Júnior | Retrato - Ivo Dall´Acqua Júnior | 1999 | Araraquara - SP | Retrato de Ivo DallAcqua Júnior, tirado para o projeto Memórias do Comércio | SESC SP, Mmemórias do comércio, retrato, Araraquara\nMCA_HV008_FT001 | Ivo Dall'Acqua Júnior | Inauguração | s.d. | s.l. | Inauguração da loja do tio de Ivo Dall´Acqua Jr., Sr. Olavo Bertoni | SESC SP, Memórias do comércio, inauguração, Araraquara, loja, flores, convidados\nMCA_HV008_FT002 | Ivo Dall'Acqua Júnior | Ivo com Tônia Carrero | 1995 | Araraquara - SP | Ivo Dall´Acqua Júnior e a atriz Tônia Carrero, participando de um evento em homenagem a Luiz Antônio Martinez Corrêa. Araraquara, SP, 1995. | SESC SP, Memórias do comércio, Araraquara, Tonia Carrero, homenagem, eventos\nMCA_HV008_FT003 | Ivo Dall'Acqua Júnior | Inauguração da Decolores Tintas | s.d. | Araraquara - SP | Inauguração da Decol"}, "MCA_HV008_FT001.jpg": {"size_mb": 0.0476, "modified": "2005-07-26 15:34:34", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV008_Ivo Dell´Acqua Júnior\\Imagens\\MCA_HV008_FT001.jpg", "category": "Image", "duration_ms": 0, "dimension": "360x261", "height": 261, "dpi": null, "color_mode": "RGB", "duration": 0.0, "resolution": "360x261"}, "MCA_HV008_FT002.jpg": {"size_mb": 0.0349, "modified": "2005-07-26 15:34:42", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV008_Ivo Dell´Ac Antonio Custódio de Lima\\Imagens\\MCA_HV002_FT014.jpg", "category": "Image", "duration_ms": 0, "dimension": "360x518", "height": 518, "dpi": 150.0, "color_mode": "L", "duration": 0.0, "resolution": "360x518"}, "MCA_HV002_MO001.jpg": {"size_mb": 0.0129, "modified": "2005-07-26 14:36:44", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV010_Antonio Custódio de Lima\\Imagens\\MCA_HV002_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "257x360", "height": 360, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "257x360"}, "folder_size_gb": 0.0}, "Textual": {"MCA_HV010_Antonio Custódio de Lima_rev.doc": {"size_mb": 0.1021, "modified": "2000-07-05 11:30:18", "extension": "DOC", "full_path": "D:\\MCA\\MCA_HV010_Antonio Custódio de Lima\\Textual\\MCA_HV010_Antonio Custódio de Lima_rev.doc", "category": "Textual"}, "MCA_HV010_Antonio Custódio de Lima_rev.docx": {"size_mb": 0.0305, "modified": "2026-02-12 11:27:16", "extension": "DOCX", "full_path": "D:\\MCA\\MCA_HV010_Antonio Custódio de Lima\\Textual\\MCA_HV010_Antonio Custódio de Lima_rev.docx", "category": "Textual", "content_preview": "Depoimento de Antônio Custodio de Lima\nEntrevistado por Karen Worcman e Cláudia Leonor\nAraraquara, 17 de setembro de 1999\nP/1 – Seu Lima, para começar a entrevista, diga o seu nome completo, o local e a data de nascimento.\nR – Meu nome é Antônio Custódio de Lima, sou nascido em Boa Esperança do Sul, em 10 de setembro de 1919. Mas já sou considerado araquarense, porque já recebi título na Câmara Municipal. Então, nascimento é Boa Esperança do Sul e a moradia é em Araraquara, desde a infância.\nP/1 – O senhor tinha dito que, na verdade, tinha nascido no dia seis.\nR – É, o dia seis é o correto. Mas, fui registrado no dia dez, então... Que eu recebo aí no banco, aí na LBV, tudo cartão, que eu contribuo com toda essa gente. APAE, me cumprimentam sempre dia dez.\nP/1 – Por que foi registrado no dia dez?\nR – Eu não posso te afirmar. Eu sei que meu pai morava em fazenda, muito distante às vezes do local de registro. E também meu pai era um homem que não tinha muita escola, acho que ele não ligava muito para a coisa, né? Minha mãe, sim. Minha mãe é que fazia a escrita da fazenda lá, à noite. Depois que ia dormir a filharada, né? Um mundo de filho. Então, ela ia lá com o meu pai para o escritó"}, "folder_size_gb": 0.0}, "Audiovisual": {"Acesso": {"MCA_HV010_Antonio Custódio de Lima.mp4": {"size_mb": 11876.4617, "modified": "2022-06-09 17:19:08", "extension": "MP4", "full_path": "D:\\MCA\\MCA_HV010_Antonio Custódio de Lima\\Audiovisual\\Acesso\\MCA_HV010_Antonio Custódio de Lima.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6301762.0, "duration": 6301.76, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 11.598}, "Preservação": {"HI8_0123.avi": {"size_mb": 23634.3784, "modified": "2022-03-08 15:21:04", "extension": "AVI", "full_path": "D:\\MCA\\MCA_HV010_Antonio Custódio de Lima\\Audiovisual\\Preservação\\HI8_0123.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 6539870.0, "duration": 6539.87, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 23.08}, "Áudio": {"MCA_HV010_Antonio Custódio de Lima.wav": {"size_mb": 1197.4855, "modified": "2022-06-09 15:29:04", "extension": "WAV", "full_path": "D:\\MCA\\MCA_HV010_Antonio Custódio de Lima\\Audiovisual\\Áudio\\MCA_HV010_Antonio Custódio de Lima.wav", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 6539867.0, "duration": 6539.87}, "folder_size_gb": 1.169}, "folder_size_gb": 35.848}, "folder_size_gb": 35.848}, "MCA_HV021_Paulo Roberto Gullo": {"Imagens": {"MCA_HV011.xlsx": {"size_mb": 0.0188, "modified": "2021-01-29 08:33:54", "extension": "XLSX", "full_path": "D:\\MCA\\MCA_HV021_Paulo Roberto Gullo\\Imagens\\MCA_HV011.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nMCA_HV011_MO001 | Paulo Roberto Gullo | Retrato | 1999 | São Carlos - SP | Retrato de Paulo Roberto Gullo. São Carlos, SP.  | Memórias do Comércio, SESC SP  | Créditos: Márcia Zoet"}, "MCA_HV011_MO001.jpg": {"size_mb": 0.0162, "modified": "2005-07-26 16:05:10", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV021_Paulo Roberto Gullo\\Imagens\\MCA_HV011_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "196x300", "height": 300, "dpi": null, "color_mode": "RGB", "duration": 0.0, "resolution": "196x300"}, "folder_size_gb": 0.0}, "Textual": {"MCA_HV021_Paulo Roberto Gullo_rev.doc": {"size_mb": 0.1104, "modified": "2000-07-05 13:38:22", "extension": "DOC", "full_path": "D:\\MCA\\MCA_HV021_Paulo Roberto Gullo\\Textual\\MCA_HV021_Paulo Roberto Gullo_rev.doc", "category": "Textual"}, "MCA_HV021_Paulo Roberto Gullo_rev.docx": {"size_mb": 0.037, "modified": "2026-02-12 11:27:18", "extension": "DOCX", "full_path": "D:\\MCA\\MCA_HV021_Paulo Roberto Gullo\\Textual\\MCA_HV021_Paulo Roberto Gullo_rev.docx", "category": "Textual", "content_preview": "Depoimento de Paulo Roberto Gullo\nEntrevistado por Cláudia Leonor\nSão Carlos, 19 de outubro de 1999\nP/1 – Diga o seu nome completo, o local e a data de nascimento.\nR - Paulo Roberto Gullo, São Carlos, 14 de outubro de 1955.\nP/1 - E o nome dos seus pais?\nR - Meu pai, José Gullo Filho, minha mãe,  Ruth Martins Gullo.\nP/1 - Eles são de São Carlos?\nR - São de São Carlos. É meu pai é de São Carlos, minha mãe nasceu em uma cidade, esqueci o nome, você acredita?\nP/1 - Não tem problema, depois vem na cabeça.\nR - Tá!\nP/1 - E o nome dos seus avós?\nR - Por parte paterno é José Gullo e minha avó Carolina Catanzaro Gullo. Por parte de mãe é João Martins e a vovó de novo Dá branco assim direto?\nP/1 - Não! Não tem problema! Depois você lembra, você vai ver! Ô Paulo, de onde que veio o nome Gullo? \nR - O Gullo, ele vem da Itália. É origem italiana. Meus avós vieram da Itália no ano da imigração,  onde teve, até a história dessa novela é bem,  cai muito bem com os meus avós. Minha avó veio para o Brasil com nove anos, e o meu avô veio com 24, no mesmo navio.\nP/1 - Ah, é? \t\nR - Teve uma malária lá, e eles saíram praticamente foragidos. Entraram no navio com parentes e caíram direto pra São Carlos, i"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "MCA_HV019_Leonor Pereira de Barros Amaral": {"Imagens": {"MCA_HV019.xlsx": {"size_mb": 0.0197, "modified": "2021-01-29 13:52:46", "extension": "XLSX", "full_path": "D:\\MCA\\MCA_HV019_Leonor Pereira de Barros Amaral\\Imagens\\MCA_HV019.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nMCA_HV019_MO001 | Leonor Pereira Amaral de Barros | Making of 1 | 1999 | São Carlos - SP | Retrato de Leonor Pereira de Barros do Amaral. São Carlos, SP, 1999.  | créditos Márcia Zoet\nMCA_HV019_FT001 | Leonor Pereira Amaral de Barros | Neta de Dona Leonor | s.d. | São Carlos - SP | Deonice (neta de dona Leonor) no pátio da Fazenda do Pinhal. São Carlos, SP, década de 60. | SESC SP, Memórias do comércio, Fazenda do Pinhal, jovem, pátio, neta\nMCA_HV019_FT002 | Leonor Pereira Amaral de Barros | Filhos | 1957 | São Carlos - SP | Filho de Leonor Pereira do Amaral de Barros, Pedro, e sua esposa, Neide, na Fazenda do Pinhal. São Carlos, SP, 22/02/1957. | SESC SP, Memórias do comércio, Fazenda do Pinhal, casal, fazenda, filhos\nMCA_HV019_FT003 | Leonor Pereira Amaral de Barros | Neto de Dona Leonor | s.d. | São Carlos - SP | Carlos, neto de Dona Leonor, no terreiro de café da Faz"}, "MCA_HV019_FT001.jpg": {"size_mb": 0.0284, "modified": "2005-07-26 15:52:38", "extension": "JPG", "full_pa lembro que foi na fazenda, e estava ainda apanhando café. Quando... mas agora, a data que eu não sei?\nP/1 - E que dia ?\nR - O dia é que eu não sei também.\nP/1 - Não tem problema. E o a senhora lembra da fazenda, quando era criança? Como era?\nR - A senhora quer saber dos nomes?\nP/1 - Do nome, ou das pessoas...\nP/2- De tudo!\nR - Então, morei lá na fazenda do Ney Vieira, morei na fazenda do Zeca, no Taída, no Madeira... tudo fazenda. E aquele tempo era tudo criançada... criança queria saber de andar brincando. Queria saber de an"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "MCA_HV020_Maria Jovita Braga Ocon": {"Imagens": {"MCA_HV021.xlsx": {"size_mb": 0.0191, "modified": "2021-02-03 15:48:56", "extension": "XLSX", "full_path": "D:\\MCA\\MCA_HV020_Maria Jovita Braga Ocon\\Imagens\\MCA_HV021.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nMCA_HV021_MO001 | Maria Jovita Brava Ocon | Making of 1 | 1999 | Ibitinga - SP | Retrato de Maria Jovita Braga Ocon. Ibitinga, SP.  | SESC SP, Memórias do comércio, araraquara | Créditos: Márcia Zoet\nMCA_HV021_FT001 | Maria Jovita Brava Ocon | Casamento de Maria e Gilberto Timoteo | 1936-01-06 00:00:00 | Taunai | Primeira foto que Dona Maria tirou na vida. Foram de trem até Taunai para realizar o casamento, já que o juiz não queria realizá-lo em Akidarana, cidade natal de Dona Maria. | casamento, registro de casamento, vestido de noiva, noivos,  | 17,6 x 12 cm | MCA020FT001"}, "MCA_HV021_FT001.jpg": {"size_mb": 0.0878, "modified": "2002-07-18 17:56:20", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV020_Maria Jovita Braga Ocon\\Imagens\\MCA_HV021_FT001.jpg", "category": "Image", "duration_ms": 0, "dimension": "427x572", "height": 572, "dpi": 96.0, "color_mode": "RGB", "duration": 0.0, "resolution": "427x572"}, "MCA_HV021_MO001.jpg": {"size_mb": 0.0178, "modified": "2005-07-26 15:55:58", "extension": "JPG", "full_path": "D:\\MCA\\MCA_HV020_Maria Jovita Braga Ocon\\Imagens\\MCA_HV021_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "252x360", "height": 360, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "252x360"}, "ALTA": {"MCA_HV021_FT001.tif": {"size_mb": 0.6991, "modified": "2002-07-18 17:56:20", "extension": "TIF", "full_path": "D:\\MCA\\MCA_HV020_Maria Jovita Braga Ocon\\Imagens\\ALTA\\MCA_HV021_FT001.tif", "category": "Image", "duration_ms": 0, "dimension": "427x572", "height": 572, "dpi": 150.0, "color_mode": "RGB", "duration": 0.0, "resolution": "427x572"}, "folder_size_gb": 0.001}, "folder_size_gb": 0.001}, "Textual": {"MCA_HV020_Maria Jovita Braga Ocon_rev.doc": {"size_mb": 0.1348, "modified": "2000-07-05 13:50:28", "extension": "DOC", "full_path": "D:\\MCA\\MCA_HV020_Maria Jovita Braga Ocon\\Textual\\MCA_HV020_Maria Jovita Braga Ocon_rev.doc", "category": "Textual"}, "MCA_HV020_Maria Jovita Braga Ocon_rev.docx": {"size_mb": 0.0392, "modified": "2026-02-12 11:27:22", "extension": "DOCX", "full_path": "D:\\MCA\\MCA_HV020_Maria Jovita Braga Ocon\\Textual\\MCA_HV020_Maria Jovita Braga Ocon_rev.docx", "category": "Textual", "content_preview": "Depoimento de Maria Jovita Braga Ocon\nEntrevistada por Flavia Darre Barbosa e  Claudia Leonor\nIbitinga, 05 de Setembro de 1999\nOBS: Neuda, filha de Maria  Jovita.\nP/1 - Bom, então vou pedir para a senhora repetir o seu  nome.\nR - Maria Jovita Braga Ocon.\nP/1 - E a senhora estava falando ... o nome dos seus pais. \nR - Ângelo Calvi e Maria Antonia Braga.\nP/1 - E a senhora estava falando, antes de começar a entrevista,  do seu pai que... quem é que veio?\nR - Os meus avós, o pai do meu pai e o pai da minha mãe. O pai da minha mãe era português e o pai do meu pai era italiano. Italiano mesmo.\nP/1 - É? E porque eles vieram?\nR - Eles vieram naquele tempo do café, vieram naqueles navios... que mandava buscar aquela italianada pra trabalhar no Brasil, trabalhar com o café. Aí, chegando no Brasil o meu avô... eles foram pra lavoura, era o meu avô, a minha avó e dois filhos, um tio e uma tia. E ele achou que estava trabalhando feito escravo, resolveu ir para o Paraguai. E lá no Paraguai, o meu avô pôs um hotel, um restaurante... é, um hotel. Então eles trabalhavam com hotel, nesse hotel, no Paraguai, nasceu meu pai. Aí, depois o meu avô vendeu o hotel e veio para o Brasil, mas o meu pai já es"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.001}, "folder_size_gb": 624.669}, "Tetrapak": {"CB": {"TPK_CB001_Paulo Henrique Fonseca da Silva": {"Textual": {"TPK_CB001_Paulo Henrique Fonseca da Silva.docx": {"size_mb": 0.0107, "modified": "2019-10-15 11:02:58", "extension": "DOCX", "full_path": "D:\\Tetrapak\\CB\\TPK_CB001_Paulo Henrique Fonseca da Silva\\Textual\\TPK_CB001_Paulo Henrique Fonseca da Silva.docx", "category": "Textual", "content_preview": ""}, "folder_size_gb": 0.0}, "Video": {"Acesso": {"TPK_CB001_Paulo Henrique Fonseca da Silva.mp4": {"size_mb": 1953.9904, "modified": "2019-08-29 15:29:50", "extension": "MP4", "full_path": "D:\\Tetrapak\\CB\\TPK_CB001_Paulo Henrique Fonseca da Silva\\Video\\Acesso\\TPK_CB001_Paulo Henrique Fonseca da Silva.mp4", "category": "Video", "dimension": "640x480", "height": 480, "aspect_ratio": "4:3 (SD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1970202.0, "duration": 1970.2, "resolution": "640x480", "fps": 29.97}, "folder_size_gb": 1.908}, "Bruto": {"MDV_3032.avi": {"size_mb": 7340.2273, "modified": "2019-06-25 11:13:42", "extension": "AVI", "full_path": "D:\\Tetrapak\\CB\\TPK_CB001_Paulo Henrique Fonseca da Silva\\Video\\Bruto\\MDV_3032.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2031329.0, "duration": 2031.33, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 7.168}, "folder_size_gb": DOCX", "full_path": "D:\\Tetrapak\\HV\\TPK_HV002_Ademir Wolf\\Textual\\TPK_HV002_Ademir Wolf_rev.docx", "category": "Textual", "content_preview": "Projeto Memória Tetra Pak 50 anos de Brasil\nDepoimento de Ademir Wolf\nEntrevistado por Rodrigo de Godoy e Larissa Rizzatti\nSão Paulo, 11 de setembro de 2007\nRealização: Museu da Pessoa\nEntrevista TPK_HV002\nTranscrito por Tereza Ruiz\nRevisado por Teresa de Carvalho Magalhães\nP/1 - Boa tarde Seu Ademir.\nR - Boa tarde.\nP/1 - Para começar eu gostaria que o senhor dissesse seu nome completo, local e data de nascimento.\nR - Meu nome é Ademir Wolf, sou nascido em Indaiatuba, no interior do estado de São Paulo, nasci dia seis do dez de 1954.\nP/1 - E qual é a função que o senhor ocupa hoje na Tetra Pak?\nR - Minha função lá é operador de Doctor Machine.\nP/1 - E o nome dos seus pais?\nR - É Carlos Wolf e Helena Escupiem Wolf.\nP/1 - Certo, e eles nasceram onde?\nR - Nasceram em Indaiatuba mesmo.\nP/1 - Em Indaiatuba?\nR- É.\nP/1 - Os dois?\nR - Hum.\nP/1 - E a atividade deles?\nR - Meu pai era lavrador, trabalhou sempre na roça. E minha mãe era do lar. E a nossa família, nós éramos em doze irmãos, era uma família grande.\nP/1 - Ah.\nR - E foi assim a luta.\nP/1 - E mas eles nasceram em Indaiatuba, mas a família do senhor é mesmo local de Indaiatuba ou veio de alguma outra cidade, de alguma outra região?"}, "folder_size_gb": 0.0}, "folder_size_gb": 11.897}, "TPK_HV003_Clovis Albertini": {"Acesso": {"TPK_HV003_Clovis Albertini.mp4": {"size_mb": 1231.271, "modified": "2021-07-29 04:25:42", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV003_Clovis Albertini\\Acesso\\TPK_HV003_Clovis Albertini.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5969797.0, "duration": 5969.8, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.202}, "BRUTO": {"DVC_0815.a ari, São Paulo.\nP – Clóvis, qual o seu cargo na Tetra Pak?\nR – O meu cargo é líder de pré-impressão, só que não exerço mais essa função. Eu estou alocado no Departamento Gráfico. Hoje eu sou suporte para a coordenadora do Departamento Gráfico.\nP – E os seus pais, qual o nome deles?\nR – Meu pai e minha mãe são falecidos, Orlando e Judite.\nP – E qual era a atividade deles?\nR – Foram, durante muitos anos, comerciantes. Eles tinham um bar e restaurante em Capivari, muito movimentado inclusive, onde eles fizeram suas vidas. \nP – E eles nasceram em Capivari?\nR – Ambos nasceram. \nP – E a sua infância você passou em Capivari ou em outra cidade?\nR – Eu passei a minha infância em Capivari. O grande período da juventude brasileira foi o perí"}, "folder_size_gb": 0.0}, "folder_size_gb": 22.616}, "TPK_HV004_Renato Eyng": {"Acesso": {"TPK_HV004_Renato Eyng.mp4": {"size_mb": 1015.7126, "modified": "2021-07-29 05:40:48", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV004_Renato Eyng\\Acesso\\TPK_HV004_Renato Eyng.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4931160.0, "duration": 4931.16, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 0.992}, "BRUTO": {"DVC_0816.avi": {"size_mb": 18077.0809, "modified": "2020-02-17 11:05:20", "extension": "AVI", "full_path": "D:\\Tetrapak\\HV\\TPK_HV004_Renato Eyng\\BRUTO\\DVC_0816.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 5002730.0, "duration": 5002.73, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 17.653}, "Imagens": {"TPK_HV004.xlsx": {"size_mb": 0.0191, "modified": "2020-12-11 20:12:28", "extension": "XLSX", "full_path": "D:\\Tetrapak\\HV\\TPK_HV004_Renato Eyng\\Imagens\\TPK_HV004.xlsx", ": "2048x3072"}, "folder_size_gb": 0.141}, "folder_size_gb": 0.15}, "folder_size_gb": 0.15}, "Textual": {"TPK_HV005_Antônio Luiz de Medeiros_rev.docx": {"size_mb": 0.0305, "modified": "2020-08-12 11:34:34", "extension": "DOCX", "full_path": "D:\\Tetrapak\\HV\\TPK_HV005_Antonio Luiz de Medeiros\\Textual\\TPK_HV005_Antônio Luiz de Medeiros_rev.docx", "category": "Textual", "content_preview": "Projeto Memoria Tetra Pak 50 Anos de Brasil\nDepoimento de Antônio Luiz de Medeiros\nEntrevistado por Rodrigo de Godoy e Larissa Rizzatti\nSão Paulo, 12 de setembro de 2007\nRealização Museu da Pessoa\nCódigo: TPK_ HV005\nTranscrito por Caroline Carrion\nRevisado por Bruna Ghirardello\nP1- Boa tarde.\nR- Boa tarde.\nP1- Para começar, eu gostaria que você dissesse o seu nome completo, o local e data de nascimento.\nR- Antônio Luiz de Medeiros. Cidade Monte Mor [Estado de São Paulo]. \nP1- E a data?\nR- Data de nascimento, 18 de agosto de 1959, 1959.\nP1- Certo. E qual que é a sua função na Tetra Pak?\nR- A minha função na Tetra Pak teve uma caminhada... No dia de hoje, é, pode, pode ser montador de pré-impressão, é, pré-impressão.\nP1- Certo. E o nome dos seus pais, Antônio?\nR- Luiz Gonzaga de Medeiros, e da mãe Lenira Fernandes de Medeiros.\nP1- E eles são de Monte Mor também?\nR- Eles são natural de Monte Mor .\nP1- Ambos nasceram lá?\nR- Ambos nasceram em Monte Mor mesmo.\nP1- E qual é a atividade deles?\nR- O meu pai foi funcionário público, hoje está aposentado. E a minha mãe, trabalha   na casa mesmo. \nP1- Certo. E você nasceu e sempre morou em Monte Mor ?\nR- Eu nasci e sempre morei em Monte Mor ."}, "folder_size_gb": 0.0}, "folder_size_gb": 15.73}, "TPK_HV006_Nelson José da Silva": {"Acesso": {"TPK_HV006_Nelson José da Silva.mp4": {"size_mb": 584.7291, "modified": "2021-07-29 07:26:26", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV006_Nelson José da Silva\\Acesso\\TPK_HV006_Nelson José da Silva.mp4", "category": "Video", "dimension": "1280x720", "height": 72 ssa Gomes e Valdir Bertoldi\nSão Paulo, 12 de setembro de 2007\nRealização Museu da Pessoa\nCódigo: TPK_HV006\nTranscrito por Regina Paula de Souza\nRevisado por Bruna Ghirardello\nP/1 – Boa tarde seu Nelson.\nR – Boa tarde.\nP/1 – Para começar eu queria que o senhor falasse o seu nome completo.\nR – Nelson José da Silva.\nP/1 – E o local e data de nascimento?\nR –  Garanhuns, Pernambuco.\nP/1 – E a data?\nR – Dez de janeiro de 1934 .\nP/1 – Qual é a função que o senhor ocupa na Tetra Pak?\nR – Jardineiro.\nP/1 – O nome dos seus pais, poderia falar para nós?\nR – Alfredo José da Silva e Hermina Maria da Silva.\nP/1 – Onde eles nasceram?\nR – Garanhuns, também. Minha mãe não nasceu bem em Garanhuns, nasceu em Palmeirina, município de Garanhuns.\nP/1 – Tudo ali perto?\nR – É... É a mesma coisa.\nP/2 – Palmeirina é um bairro?\nR – É um bairro.\nP/1 – Ah certo. E quais as atividades deles? O que eles faziam?\nR – Agricultor.\nP/1 – Eram agricultores?\nR – É.\nP/1 – E o senhor morou lá por quanto tempo? Quando veio para cá?\nR – Eu vim para cá com 27 anos.\nP/1 – Então, antes disso morava lá?\nR – Morava lá.\nP/1 – Lá em Pernambuc"}, "folder_size_gb": 0.0}, "folder_size_gb": 10.889}, "TPK_HV007_Rosemeire Retamero": {"Acesso": {"TPK_HV007_Rosemeire Retamero.mp4": {"size_mb": 1154.8624, "modified": "2021-07-29 08:48:16", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV007_Rosemeire Retamero\\Acesso\\TPK_HV007_Rosemeire Retamero.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5625120.0, "duration": 5625.12, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.128}, "BRUTO": {"DVC_0819.avi": {"size_mb": 20441.6258, "modified": "2020-02-18 12:05:02", "extension": "AVI", "full_path": "D:\\Tetrapak\\HV\\TPK_HV007_Rosemeire Retamero\\BRUTO\\DVC_0819.avi", "category": "Video", "dimension": "720x480", "heigh d": "2007-10-30 00:28:30", "extension": "TIF", "full_path": "D:\\Tetrapak\\HV\\TPK_HV008_Brigitte Keul\\Imagens\\Making of\\Alta\\TPK_HV008_MO008.TIF", "category": "Image", "duration_ms": 0, "dimension": "2336x3504", "height": 3504, "dpi": 350.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2336x3504"}, "folder_size_gb": 0.366}, "folder_size_gb": 0.382}, "folder_size_gb": 0.382}, "Textual": {"TPK_HV008_Brigitte Keul_rev.docx": {"size_mb": 0.0368, "modified": "2020-08-13 09:18:12", "extension": "DOCX", "full_path": "D:\\Tetrapak\\HV\\TPK_HV008_Brigitte Keul\\Textual\\TPK_HV008_Brigitte Keul_rev.docx", "category": "Textual", "content_preview": "Projeto Memória Tetra Pak 50 Anos Brasil\nDepoimento de Brigitte Keul.\nEntrevistada por Rodrigo de Godoy e Valdir Bertoldi Jr.\nSão Paulo, 13/09/2007\nRealização: Museu da Pessoa\nTPK_HV008_Brigitte Keul\nRevisado por Camila Catani Ferraro\nP - Boa Tarde.\nR - Boa Tarde.\nP - Para começar, eu gostaria que você dissesse seu nome completo, data e local de nascimento.\nR - Meu nome completo é Brigitte Keul. Nasci em 31 de março de 1947 e o local de nascimento é Hanwhisa, Rússia. \nP - E hoje você está aposentada, Brigitte?\nR - Sim, hoje eu estou.\nP - Mas qual a função que você ocupou antes de aposentar-se na Tetra Pak?\nR - Eu entrei na Tetra Pak como gerente de merchandising, mas eu fazia de tudo um pouquinho. Então eram duas mil utilidades (risos).\nP - Qual o nome dos seus pais, Brigitte?\nR – Gundisch Johann e Maria Keul. \nP - E eles são originários de onde?\nR - O meu pai era romeno e a minha mãe alemã. Minha mãe era alemã e foi para Romênia, para uma colônia alemã, onde ela conheceu meu pai. Aí eles foram presos na Rússia. \nP - Conta um pouquinho essa história. Quais eram as atividades dos seus pais?\nR - A minha mãe era doméstica e o meu pai era tenente, naquela época - ele seguiu a carreira"}, "folder_size_gb": 0.0}, "folder_size_gb": 18.558}, "TPK_HV009_Mauro Moraes": {"Acesso": {"TPK_HV009_Mauro Morais.mp4": auro Moraes.docx", "category": "Textual", "content_preview": "Projeto Memória Tetra Pak 50 anos de Brasil\nDepoimento de Mauro Moraes\nEntrevistado por Beth Quintino e Larissa Rizzatti\nSão Paulo 13 de setembro de 2007\nRealização Museu da Pessoa\nTetra Pak_HV_009_Mauro Alberto de Oliveira Morais\nTranscrito por Luisa Fioravanti\nRevisado por Camila Catani Ferraro \nP/1 – Boa tarde Mauro, queria começar com você falando o seu nome, data e local de nascimento.\nR – Boa tarde! Meu nome completo é Mauro Alberto de Oliveira Morais, sou nascido na cidade de Elias Fausto, na data de 01 de outubro de 1955.\nP/1 – E atualmente, qual é o seu cargo na Tetra Pak?\nR - Sou gerente de desenvolvimento de embalagens.\nP/1 – E o nome dos seus pais?\nR – Meu pai é Rubens de Oliveira Morais, minha mãe Nadir da Mendes Cruz Morais.\nP/1 – E eles nasceram aonde?\nR – Elias Fausto, também.\nP/1 – E qual é a atividade deles?\nR – Meu pai hoje é aposentado, mas antes de aposentar ele era padeiro e a minha mãe tomava conta de casa.\nP/1 – E você morou até que idade em Elias Fausto?\nR – Isso é uma coisa interessante porque até os meus 18 anos, naquela época todo mundo sonhava quando pudesse trabalhar fora, trabalhar aqui em São Paulo porque a quantidade de emprego era muito grande, ent"}, "folder_size_gb": 0.0}, "folder_size_gb": 23.967}, "TPK_HV010_Mario de Souza Pereira": {"Acesso": {"TPK_HV010_Mario de Souza Pereira.mp4": {"size_mb": 1199.7898, "modified": "2021-07-29 13:07:36", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV010_Mario de Souza Pereira\\Acesso\\TPK_HV010_Mario de Souza Pereira.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5815476.0, "duration": 5815.48, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.172}, "BRUTO": {"DVC_0822.avi": {"size_mb": 21160.4562, "modified": "2020-02-18 15:47:56", " do, nasci no dia 24 de março de 1965, em São Paulo [Capital].\nP/1 – Certo, e qual é a sua função atual na Tetra Pak?\nR – Hoje eu sou gerente de projetos, manutenção e programa WCM [World Class Manufacturing]\nP/1 – E o nome dos seus pais Walter?\nR – Meu pai chamava Augusto Gabaldo e a minha mãe Nair Elis Augusto.\nP/1 – E eles nasceram onde?\nR – Meu pai na Itália e minha mãe no interior de São Paulo, na cidade de Monte Mor [SP].\nP/1 – Ela é de Monte Mor mesmo? E qual a atividade deles?\nR – O meu pai, os dois são falecidos. O meu pai a última profissão dele foi advogado em São Paulo e da minha mãe foi do lar, dona de casa.\nP/1 – E você nasceu em são Paulo e passou a sua infância aqui?\nR – Eh, eu morei em São Paulo por 23 anos, passei a minha infância aqui e a minha ado"}, "folder_size_gb": 0.0}, "folder_size_gb": 22.81}, "TPK_HV012_Maria Catarina Palhares": {"Acesso": {"TPK_HV012_Maria Catarina Palhares.mp4": {"size_mb": 990.4246, "modified": "2021-07-29 15:46:00", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV012_Maria Catarina Palhares\\Acesso\\TPK_HV012_Maria Catarina Palhares.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4819615.0, "duration": 4819.61, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 0.967}, "BRUTO": {"DVC_0824.avi": {"size_mb": 17579.2647, "modified": "2020-02-19 13:06:10", "extension": "AVI", "full_path": "D:\\Tetrapak\\HV\\TPK_HV012_Maria Catarina Palhares\\BRUTO\\DVC_0824.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4864960.0, "duration": 4864.96, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 17.167}, "Imagens": {"TPK_HV012.xlsx": {"size_mb": 0.0191, "modified": "2020-12-11 14:21:08", "extensi ght": 2048, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3072x2048"}, "TPK_HV012_MO007.TIF": {"size_mb": 18.0186, "modified": "2007-10-30 01:19:34", "extension": "TIF", "full_path": "D:\\Tetrapak\\HV\\TPK_HV012_Maria Catarina Palhares\\Imagens\\Making of\\Alta\\TPK_HV012_MO007.TIF", "category": "Image", "duration_ms": 0, "dimension": "2048x3072", "height": 3072, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2048x3072"}, "TPK_HV012_MO008.TIF": {"size_mb": 18.0185, "modified": "2007-09-20 09:55:56", "extension": "TIF", "full_path": "D:\\Tetrapak\\HV\\TPK_HV012_Maria Catarina Palhares\\Imagens\\Making of\\Alta\\TPK_HV012_MO008.TIF", "category": "Image", "duration_ms": 0, "dimension": "2048x3072", "height": 3072, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2048x3072"}, "folder_size_gb": 0.141}, "folder_size_gb": 0.152}, "folder_size_gb": 0.152}, "Textual": {"TPK_HV012_ Maria Catarina Pila Palhares_rev.docx": {"size_mb": 0.0331, "modified": "2020-08-31 04:39:12", "extension": "DOCX", "full_path": "D:\\Tetrapak\\HV\\TPK_HV012_Maria Catarina Palhares\\Textual\\TPK_HV012_ Maria Catarina Pila Palhares_rev.docx", "category": "Textual", "content_preview": "Projeto Memória Tetra Pak 50 Anos de Brasil\nDepoimento de Maria Catarina Pila Palhares\nEntrevistada por Rodrigo de Godoy e Larissa Rizzatti\nSão Paulo, 14/09/07. \nRealização: Museu da Pessoa. \nTetra Pak_HV_012_Maria Catarina Pila Palhares. \nTranscrito por Vanuza Ramos\nP – Oi, Boa Tarde. \n\nR – Boa tarde. \n\nP – Você poderia começar falando seu nome completo, a data e o local de seu nascimento? \n\nR – Maria Catarina Pila Palhares. Nasci em Campinas [SP], em 15 de novembro de 1959. \n\nP – Catarina, qual é o cargo que você ocupa na Tetra Pak? \n\nR – Hoje eu ocupo o cargo de coordenadora de exportação. \n\nP – E você poderia falar o nome de seus pais e a atividade deles? \n\nR – Meu pai é Joaquim Amaral Palhares - é falecido – e ele era ferroviário; a minha mãe é Aldete Pila Palhares, é do lar. \n\nP – E eles são de que cidade, nasceram onde? \n\nR – Mogi Mirim [SP]; os dois conheceram-se em Mogi Mirim também. \n\nP – E você nasceu...? \n\nR – Eu nasci em Campinas, fui criada em Campinas e vivo em Campinas até hoje. \n\nP – Você pode contar-nos um pouco sobre como foi a sua infância em Campinas? \n\nR – Eu acho que a minha infância foi bastante privilegiada, porque nós não tínhamos os perigos que temos hoje"}, "folder_size_gb": 0.0}, "folder_size_gb": 18.286}, "TPK_HV013_José Fernando Gasparotto": {"Acesso": {"TPK_HV013_José Fernando Gasparotto.mp4": {"size_mb": 1426.8672, "modified": "2021-07-29 17:27:54", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV013_José Fernando Gasparotto\\Acesso\\TPK_HV013_José Fernando Gasparotto.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6916010.0, "duration": 6916.01, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.393}, "BRUTO": {"DVC_0825.avi": {"size_mb": 25105.6747, "modified": "2020-02-19 15:53:08", "extension": "AVI", "full_path": "D:\\Tetrapak\\HV\\TPK_HV013_José Fernando Gasparotto\\BRUTO\\DVC_0825.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 6947874.0, "duration": 6947.87, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 24.517}, "Imagens": {"TPK_HV013.xlsx": {"size_mb": 0.0191, "modified": "2020-12-11 13:34:54", "extension": "XLSX", "full_path": "D:\\Tetrapak\\HV\\TPK_HV013_José Fernando Gasparotto\\Imagens\\TPK_HV013.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nTPK_HV013_MO001 | José Fernando Gasparotto | Mak ll_path": "D:\\Tetrapak\\HV\\TPK_HV014_Ulrich Jando\\Textual\\TPK_HV014_Ulrich Jando_rev.docx", "category": "Textual", "content_preview": "Projeto Memória Tetra Pak 50 anos de Brasil\nDepoimento de Ulrich Jando\nEntrevistado por Rodrigo de Godoy e Larissa Rizzatti.\nSão Paulo, 19/09/2007\nRealização: Museu da Pessoa\nTPK_HV014\nRevisado por Fernando Martins\nP/1-  Boa tarde. Para começar eu gostaria que o senhor dissesse o seu nome completo, local e data de nascimento?\nR-  Meu nome é Urich Jando. Eu nasci no dia 14 de agosto de 1938 em um vilarejo pequeno que se chama Gnewikow que fica perto de Berlim. \nP/1-  Certo. Atualmente o senhor está aposentado da Tetra Pak?\nR-  Sim.\nP/1-  Mas, a última função que o senhor ocupou na Tetra Pak, antes de se aposentar, qual foi?\nR-  Eu trabalhei na área de projetos, em instalações de máquinas de envase, distribuição, de fazer os projetos, os layouts nessas interligações desse daí, em envase até a distribuição de transportadores. Tudo isso foi feito...\nP/1-  Certo. O nome dos seus pais Sr. Jando?\nR-  Willy Heinrich Jando e Else Anna Elisabeth Jando.\nP/1-  Eles nasceram onde?\nR-  É... Esse foi um problema. Meu pai nasceu em Derendorf. Minha mãe eu não tenho certeza... Mas, vamos falar... Ela nasceu em Gnewikow também, onde eu nasci. \nP/1-  Então, ambos eram alemães mesmo?   \nR-  É, “ambos"}, "folder_size_gb": 0.0}, "folder_size_gb": 14.9}, "TPK_HV015_Rosivana Maria Rossi": {"Acesso": {"TPK_HV015_Rosivana Maria Rossi.mp4": {"size_mb": 1016.3145, "modified": "2021-07-29 19:36:34", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV015_Rosivana Maria Rossi\\Acesso\\TPK_HV015_Rosivana Maria Rossi.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4954550.0, "duration": 4954.55, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 0.992}, "BRUTO": {"DVC_0827.a nR – Boa tarde.\nP – Obrigada por você ter vindo. \nR – Por nada.\nP – Você poderia falar o seu nome completo, data e local de nascimento?\nR – Meu nome é Rosivana Maria Rossi Gonçalves; eu nasci em Elias Fausto [SP], no dia 22 de junho de 1963.\nP – Rose, qual a sua função hoje na Tetra Pak, o seu cargo?\nR – Meu cargo é analista de materiais.\nP – Você poderia falar o nome dos seus pais?\nR – Meu pai chama-se Antônio Rossi; minha mãe, Doraci Bérgamo Rossi.\nP – Eles nasceram em Elias Fausto também?\nR – Também nasceram em Elias Fausto. Meu pai é falecido, só tenho minha mãe.\nP – E qual a atividade deles?\nR – Meu pai tinha lavoura de tomates em uma área pequena e ele trazia tomate para São Paulo, no Ceasa [Centrais de Abastecimento S.A.]. Minha mãe, quando ele era vivo, era doméstica; depois que todos os filhos casaram-se, ela resolveu trabalhar - está trabalhando até hoje na prefeitura de Elias Fausto; é aposentada, mas também trabalha.\nP – Voc"}, "folder_size_gb": 0.0}, "folder_size_gb": 18.801}, "TPK_HV016_Carlos Alberto Veenstra": {"Acesso": {"TPK_HV016_Carlos Alberto Veenstra.mp4": {"size_mb": 977.0747, "modified": "2021-07-29 20:50:36", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV016_Carlos Alberto Veenstra\\Acesso\\TPK_HV016_Carlos Alberto Veenstra.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4735964.0, "duration": 4735.96, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 0.954}, "BRUTO": {"DVC_0828.avi": {"size_mb": 17225.761, "modified": "2020-02-21 14:50:48", "extension": "AVI", "full_path": "D:\\Tetrapak\\HV\\TPK_HV016_Carlos Alberto Veenstra\\BRUTO\\DVC_0828.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4767129.0, "dur
