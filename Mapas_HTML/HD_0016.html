da de toda a instalação dos equipamentos que a Tetra Pak vende no Brasil. \n\nP/1 – E você poderia falar o nome de seus pais para gente? \n\nR – Meu pai se chama Teunis Veenstra, e minha mãe se chama Greice Veenetra. \n\nP/1 – E onde eles nasceram? \n\nR – Meu pai nasceu na Holanda, e a minha mãe nasceu no Canadá. \nP/1 – E você lembra quando que eles vieram para cá, você sabe? \n\nR – Ah, eles vieram para cá em finalzinho da década de 50. \n\nP/1 – E se conheceram aqui no Brasil.\n\nR –  Não, se conheceram lá no Canadá. \nP/1 – Ah, se conheceram fora?\nR –M"}, "folder_size_gb": 0.0}, "folder_size_gb": 17.924}, "TPK_HV017_Paulo Sergio Ignacio Bicudo": {"Acesso": {"TPK_HV017_Paulo Sergio Ignacio Bicudo.mp4": {"size_mb": 947.2192, "modified": "2021-07-31 21:51:58", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV017_Paulo Sergio Ignacio Bicudo\\Acesso\\TPK_HV017_Paulo Sergio Ignacio Bicudo.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4595358.0, "duration": 4595.36, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 0.925}, "BRUTO": {"DVC_0829.avi": {"size_mb": 16749.5205, "modified": "2020-02-21 17:11:26", "extension": "AVI", "full_path": "D:\\Tetrapak\\HV\\TPK_HV017_Paulo Sergio Ignacio Bicudo\\BRUTO\\DVC_0829.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4635330.0, "duration": 4635.33, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 16.357}, "Imagens": {"TPK_HV017.xlsx": {"size_mb": 0.0191, "modified": "2020-12-11 20:01:06", "extension": "XLSX", "full_path": "D:\\Tetrapak\\HV\\TPK_HV017_Paulo Sergio Ignacio Bicudo\\Imagens\\TPK_HV017.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Loca  parte do controle de qualidade, trabalho com especificações e trabalho também no departamento de CMT, que é o desenvolvimento de novos produtos. \nP/1 – Nós já voltamos a isso. E os seus pais nasceram em Itatiba também?\nR – Sim.\nP/1 – São todos de lá?\nR – Todos de Itatiba. A família toda é nascida e cria"}, "folder_size_gb": 0.0}, "folder_size_gb": 17.431}, "TPK_HV018_Ana Maria Furlan": {"Acesso": {"TPK_HV018_Ana Maria Furlan.mp4": {"size_mb": 1216.1053, "modified": "2021-07-31 23:21:44", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV018_Ana Maria Furlan\\Acesso\\TPK_HV018_Ana Maria Furlan.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5911539.0, "duration": 5911.54, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.188}, "BRUTO": {"DVC_0830_01.avi": {"size_mb": 14072.4619, "modified": "2020-02-27 11:12:52", "extension": "AVI", "full_path": "D:\\Tetrapak\\HV\\TPK_HV018_Ana Maria Furlan\\BRUTO\\DVC_0830_01.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3894457.0, "duration": 3894.46, "resolution": "720x480", "fps": 29.97}, "DVC_0830_02.avi": {"size_mb": 7419.6747, "modified": "2020-02-27 11:57:12", "extension": "AVI", "full_path": "D:\\Tetrapak\\HV\\TPK_HV018_Ana Maria Furlan\\BRUTO\\DVC_0830_02.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2053318.0, "duration": 2053.32, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 20.988}, "Imagens": {"TPK_HV018.xlsx": {"size_mb": 0.0191, "modified": "2020-12-10 11:43:24", "extension": "XLSX", "full_path": "D:\\Tetrapak\\HV\\TPK_HV018_An de deles?\nR – O meu pai era fiscal e a minha mãe sempre foi dona de casa.\nP – Você sabe onde eles nasceram?\nR – O meu pai nasceu em Valinhos [SP] e minha mãe nasceu em Vinhedo.\nP – Você tem irmãos?\nR – Eu tenho um irmão mais velho e duas irmãs mais novas.\nP – Eles fazem o quê?\nR – O meu irmão trabalhou como pintor de automóveis e hoje é aposentado; tenho uma irmã que trabalha em cartório, em Vinhedo; a minha irmã mais nova não trabalha.\nP – Você passou a sua"}, "folder_size_gb": 0.0}, "folder_size_gb": 22.329}, "TPK_HV019_Ricardo de Come Penof": {"Acesso": {"TPK_HV019_Ricardo de Come Penof.mp4": {"size_mb": 1245.8813, "modified": "2021-08-01 00:51:56", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV019_Ricardo de Come Penof\\Acesso\\TPK_HV019_Ricardo de Come Penof.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6097658.0, "duration": 6097.66, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.217}, "BRUTO": {"DVC_0831.avi": {"size_mb": 22237.7417, "modified": "2020-02-27 16:05:36", "extension": "AVI", "full_path": "D:\\Tetrapak\\HV\\TPK_HV019_Ricardo de Come Penof\\BRUTO\\DVC_0831.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 6154182.0, "duration": 6154.18, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 21.717}, "Imagens": {"TPK_HV019.xlsx": {"size_mb": 0.0191, "modified": "2020-12-14 12:20:00", "extension": "XLSX", "full_path": "D:\\Tetrapak\\HV\\TPK_HV019_Ricardo de Come Penof\\Imagens\\TPK_HV019.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nTPK_HV019_MO001 | Ricardo de Come Penof | Making of 1 | s.d de": "RGB", "duration": 0.0, "resolution": "2048x3072"}, "TPK_HV019_MO008.TIF": {"size_mb": 18.015, "modified": "2007-09-22 23:24:54", "extension": "TIF", "full_path": "D:\\Tetrapak\\HV\\TPK_HV019_Ricardo de Come Penof\\Imagens\\Making of\\Alta\\TPK_HV019_MO008.TIF", "category": "Image", "duration_ms": 0, "dimension": "2048x3072", "height": 3072, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2048x3072"}, "folder_size_gb": 0.141}, "folder_size_gb": 0.15}, "folder_size_gb": 0.15}, "Textual": {"TPK_HV019_Ricardo de Come Penof.docx": {"size_mb": 0.0651, "modified": "2020-08-07 09:58:04", "extension": "DOCX", "full_path": "D:\\Tetrapak\\HV\\TPK_HV019_Ricardo de Come Penof\\Textual\\TPK_HV019_Ricardo de Come Penof.docx", "category": "Textual", "content_preview": "Projeto: Tetra Pak - 50 anos de Brasil \nDepoimento de Ricardo de Come Penof\nEntrevistado por Rodrigo de Godoy e Larissa Rizzatti\nLocal: São Paulo - SP\nData: 21/09/2007\nRealização: Museu da Pessoa\nCódigo do depoimento: TPK_HV019\nTranscrito por Regina Paula de Souza\nRevisado por Grazielle Pellicel\nP/1 - Rodrigo de Godoy\nP/2 - Larissa Rizzatti\nR - Ricardo de Come Penof\nP/1 – Bom dia!\nR – Bom dia.\nP/1 – Para começar, eu queria que você dissesse seu nome completo, local e data de nascimento?\nR – Ricardo de Come Penof, 28 de abril de 1961, nascido aqui em São Paulo.\nP/1 – E qual é o seu cargo atual na Tetra Pak?\nR – Eu tenho a responsabilidade sobre a diretoria de categoria de lácteos, tudo que abrange produto de lacticínios e também da vice-presidência de “card solution”.\nP/1- Certo. E o nome dos seus pais, Penof?\nR – Vasilio Penof e Clarisse de Come Penof.\nP/1 – Eles são naturais de onde?\nR – Meu pai é do Ipiranga, aqui em São Paulo; e minha mãe, de Socorro, no interior de São Paulo.\nP/1 – E a atividade deles?\nR – Os dois são falecidos, mas meu pai trabalhava com embalagens também, foi encarregado de produção em uma empresa de embalagens, e minha mãe se dedicou a nossa família.\nP/1 – E"}, "folder_size_gb": 0.0}, "folder_size_gb": 23.084}, "TPK_HV020_Luiz Antonio de S Ribeiro": {"Acesso": {"TPK_HV020_Luiz Antonio de S. Ribeiro.mp4": {"size_mb": 1385.1143, "modified": "2021-08-01 02:33:38", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV020_Luiz Antonio de S Ribeiro\\Acesso\\TPK_HV020_Luiz Antonio de S. Ribeiro.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6715742.0, "duration": 6715.74, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.353}, "BRUTO": {"DVC_0832.avi": {"size_mb": 24452.6386, "modified": "2020-02-27 13:55:44", "extension": "AVI", "full_path": "D:\\Tetrapak\\HV\\TPK_HV020_Luiz Antonio de S Ribeiro\\BRUTO\\DVC_0832.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 6767160.0, "duration": 6767.16, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 23.88}, "Imagens": {"TPK_HV020.xlsx": {"size_mb": 0.02, "modified": "2020-12-11 13:49:14", "extension": "XLSX", "full_path": "D:\\Tetrapak\\HV\\TPK_HV020_Luiz Antonio de S Ribeiro\\Imagens\\TPK_HV020.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nTPK_HV020_MO001 | Luiz Antonio de Sousa Ribeiro | Making of 1 | s.d. | s.l.\nTPK_HV020_MO002 | Luiz Antonio de Sousa Ribeiro | Making of 2 | s.d. | s.l.\nTPK_HV020_MO003 | Luiz Antonio de Sousa Ribeiro | Making of 3 | s.d. | s.l.\nTPK_HV020_MO004 | Luiz Antonio de Sousa Ribeiro | Making of 4 | s.d. | s.l.\nTPK_HV020_MO005 | Luiz Antonio de Sousa Ribeiro | Making of 5 | s.d. | s.l.\nTPK_HV020_MO006 | Luiz Antonio de Sousa Ribeiro | Making of 6 | s.d. | s.l.\nTPK_HV020_MO007 | Luiz Antonio tual\\TPK_HV021_Mauro Donizete Terruel_rev.docx", "category": "Textual", "content_preview": "Projeto: Tetra Pak - 50 anos de Brasil\nDepoimento de Mauro Donizete Terruel\nEntrevistado por Rodrigo de Godoy e Valdir Bertoldi\nLocal: São Paulo - SP\nData: 21/09/2007\nRealização: Museu da Pessoa\nCódigo do depoimento: TPK_HV021\nTranscrito por Sônia Regina Ferreira\nRevisado por Grazielle Pellicel\nP/1 - Rodrigo de Godoy\nP/2 - Valdir Bertoldi\nR - Mauro Donizete Terruel\nP/1 – Boa tarde.\nR – Boa tarde.\nP/1 – Para começar, eu gostaria que você dissesse seu nome completo, local e data de nascimento.\nR – Eu me chamo Mauro Donizete Terruel, sou do Monte Mor (SP) [e] nascido em 30 de maio de 1962.\nP/1 – E qual o seu cargo hoje na Tetra Pak?\nR – Analista de Processo\nP/1 – O nome dos seus pais, quais são?\nR – Pedro Terruel e Maria Julia Terruel.\nP/1 – Eles nasceram onde, Mauro?\nR – Em Mogi Mirim (SP), na cidade de Mogi Mirim\nP/1 – Os dois?\nR – Os dois, em Mogi Mirim.\nP/1 – E qual é a atividade deles?\nR – Meu pai era funcionário público e a minha mãe era do lar.\nP/1 – Certo. Você nasceu e se criou sempre em Monte Mor?\nR – Sim, nascido e criado em Monte Mor.\nP/1 – E como era Monte Mor na época que você era criança?\nR – Como era Monte Mor?\nP/1 – O que você lembra da cidade na sua época de criança?"}, "folder_size_gb": 0.0}, "folder_size_gb": 12.555}, "TPK_HV022_Gisele Gurgel": {"Acesso": {"TPK_HV022_Gisele Gurgel.mp4": {"size_mb": 1317.7039, "modified": "2021-08-01 05:04:22", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV022_Gisele Gurgel\\Acesso\\TPK_HV022_Gisele Gurgel.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6439600.0, "duration": 6439.6, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.287}, "BRUTO": {"DVC_0834.avi": {"size_mb": 23446.1556, "modified": "2020-02-28 14:01:0  de 1971.\nP/1 – E qual a sua função hoje, na Tetra Pak?\nR – Hoje eu sou gerente de Marketing da área de lácteos – cuido das categorias de leite longa vida, creme de leite, leite condensado, aromatizado, fermentado. (risos)\nP/1 – E qual o nome dos seus pais?\nR – Meu pai é Cecil Dias; minha mãe, Adriana Maria Gurgel Dias. (risos)\nP/1 – E eles nasceram onde?\nR – Minha mãe nasceu em Jaú [SP] e meu pai em Diamantina [SP].\nP/1 – E qual era a atividade deles?\nR – Meu pai era gerente do Banco Econômico, mas aposentou-se um pouco cedo – hoje ele é aposentado. Minha mãe é do lar – sempre fez várias atividades, mas a maior delas era cuidar dos três filhos, levar-me ao Balé, ao Inglês, à escola... (risos)\nP/1 –"}, "folder_size_gb": 0.0}, "folder_size_gb": 24.335}, "TPK_HV023_Daniel do Amarante": {"Acesso": {"TPK_HV023_Daniel do Amarante.mp4": {"size_mb": 1201.6902, "modified": "2021-08-01 06:33:44", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV023_Daniel do Amarante\\Acesso\\TPK_HV023_Daniel do Amarante.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5829758.0, "duration": 5829.76, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.174}, "Imagens": {"TPK_HV023.xlsx": {"size_mb": 0.0191, "modified": "2020-12-10 21:44:24", "extension": "XLSX", "full_path": "D:\\Tetrapak\\HV\\TPK_HV023_Daniel do Amarante\\Imagens\\TPK_HV023.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nTPK_HV023_MO001 | Daniel do Amarante | Making of 1 | s.d. | s.l.\nTPK_HV023_MO002 | Daniel do Amarante | Making of 2 | s.d. | s.l.\nTPK_HV023_MO003 | Daniel do Amarante | Making of 3 | s.d. | s.l.\nTPK_HV023_MO004 | Daniel do Amarante | Making of 4 | s.d. | s.l.\nTPK_HV023_MO005 | Daniel do Amarante | Making o 3072", "height": 3072, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2048x3072"}, "folder_size_gb": 0.141}, "folder_size_gb": 0.149}, "folder_size_gb": 0.149}, "Textual": {"TPK_HV023_Daniel do Amarante_REV.docx": {"size_mb": 0.0545, "modified": "2020-08-11 13:43:34", "extension": "DOCX", "full_path": "D:\\Tetrapak\\HV\\TPK_HV023_Daniel do Amarante\\Textual\\TPK_HV023_Daniel do Amarante_REV.docx", "category": "Textual", "content_preview": "Projeto Memória Tetra Pak 50 Anos de Brasil\nDepoimento de Daniel do Amarante\nEntrevistado por Beth Quintino e Valdir Bertoldi\nSão Paulo, 24 de setembro de 2007\nRealização Museu da Pessoa\nCódigo: TPK_HV023\nTranscrito por Augusto César Mauricio Borges\nRevisado por Joice Yumi Matsunaga\nP/1 – Boa tarde Daniel.\nR – Boa tarde.\nP/1 – Você poderia falar o seu nome completo, data e local de nascimento?\nR – Perfeito. O meu nome é Daniel do Amarante, tenho trinta e três anos e nasci no dia 2 de fevereiro de 1974. Sou natural de Cascavel, Paraná.\nP/1 – E qual sua função hoje na Tetra Pak?\nR – Hoje eu sou gerente na área de laminação, corte, doctor e paletização.\nP/1 – E você poderia falar o nome dos seus pais e local de nascimento deles?\nR – Perfeito. O meu pai é Havanir do Amarante, natural do Rio Grande do Sul, da cidade de Espumoso [RS]. A minha mãe é Ana Maria do Amarante e ela é natural de Xanxerê, Santa Catarina [SC].\nP/1 – E qual é a atividade deles?\nR – O meu pai ele foi natural do Rio Grande do Sul, ele é filho de agricultor assim como o meu avô. Ele se formou em Mecânica na época que você não tinha uma escola técnica, mas que ele propriamente dito adquiriu as habilidades necessárias."}, "folder_size_gb": 0.0}, "BRUTO": {"DVC_0835.avi": {"size_mb": 21336.0199, "modified": "2020-02-28 11:39:44", "extension": "AVI", "full_path": "D:\\Tetrapak\\HV\\TPK_HV023_Daniel do Amarante\\BRUTO\\DVC_0835.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29 n": "2048x3072"}, "folder_size_gb": 0.141}, "folder_size_gb": 0.149}, "folder_size_gb": 0.149}, "Textual": {"TPK_HV024_Ivan Kopruszynski_REV.docx": {"size_mb": 0.047, "modified": "2020-08-13 10:03:04", "extension": "DOCX", "full_path": "D:\\Tetrapak\\HV\\TPK_HV024_Ivan Koprusziynski\\Textual\\TPK_HV024_Ivan Kopruszynski_REV.docx", "category": "Textual", "content_preview": "Projeto Memória Tetra Pak 50 anos de Brasil\nDepoimento de Ivan Kopruszynski\nEntrevistado por Rodrigo de Godoy e Valdir Bertoldi \nSão Paulo, 24 de setembro de 2007\nRealização Museu da Pessoa\nCódigo: TPK_HV024\nTranscrito por Michelle de Oliveira Alencar\nRevisado por Joice Yumi Matsunaga\nP/1 – Boa tarde.\nR – Boa tarde.\nP/1 – Para começar, eu queria que o senhor dissesse o seu nome completo, local e a data de nascimento.\nR – Nome: Ivan Kopruszynski, nasci em Curitiba [Estado do Paraná] no dia 26 de fevereiro de 1970.\nP/1 – Certo. E qual o seu cargo atual na Tetra Pak? \nR – Hoje eu sou coordenador de manutenção.\nP/1 – E o nome dos seus pais?\nR – É, o meu pai chama Ricardo Kopruszynski, minha mãe Sueli Maria Kopruszynski.\nP/1 – E eles são de Curitiba mesmo?\nR – Minha mãe é de Niterói [Estado do Rio de Janeiro] e o meu pai é de Curitiba [PR]. \nP/1 – E qual é a atividade deles?\nR – Meu pai é médico, meu pai é falecido já há algum tempo, e minha mãe é professora, mas está aposentada.\nP/1 – E você nasceu ou se criou em Curitiba?\nR – Não. Na verdade, eu fui somente para nascer em Curitiba, pela função médica do meu pai, ele tinha alguns amigos e resolveu que – era um parto de gêmeos, eu tenho"}, "folder_size_gb": 0.0}, "folder_size_gb": 16.235}, "TPK_HV025_Sebastião Gabriel": {"Acesso": {"TPK_HV025_Sebastião Gabriel.mp4": {"size_mb": 966.3121, "modified": "2021-08-01 08:48:30", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV025_Sebastião Gabriel\\Acesso\\TPK_HV025_Sebastião Gabriel.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", to por Paula Leal\nRevisado por Letícia Maiumi Mendonça\nP/1 – Bom dia. O senhor poderia falar seu nome completo, data e local de nascimento?\nR – Meu nome é Sebastião Gabriel, nasci dia 30 de janeiro de 1961 na cidade de Pirajuí, São Paulo.\nP/1 – E qual sua função na Tetra Pak?\nR – Hoje eu sou assistente de controle de produção.\nP/1 – Qual o nome de seus pais?\nR – Guilherme Gabriel e Iracema Nunes Gabriel.\nP/1 – E onde eles nasceram?\nR – Meu pai nasceu em Alagoas, na cidade de (Assembléia?), e minha mãe nasceu no estado de São Paulo mesmo, na cidade por nome de Uru, por perto de Pirajuí também.\nP/1 – Qual a atividade deles?\nR – Meu pai é aposentado, minha mãe já é falecida.\nP/1 – Seu pai veio de Alagoas para cá quando, você sabe?\nR – Não, não sei, não me lembro.\nP/1 – Ele veio, conheceu sua mãe aqui e se casaram aqui?\nR – Foi, isso.\nP/1 – Sua infância foi onde?\nR – A minha infância até os 6 anos foi em Pirajuí mesmo. Depois eu vim morar em São Paulo, morei em São Paulo por um"}, "folder_size_gb": 0.0}, "folder_size_gb": 17.755}, "TPK_HV026_Benedito Carlos de Camargo": {"Acesso": {"TPK_HV026_Benedito Carlos de Camargo.mp4": {"size_mb": 924.2624, "modified": "2021-08-01 09:59:50", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV026_Benedito Carlos de Camargo\\Acesso\\TPK_HV026_Benedito Carlos de Camargo.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4488718.0, "duration": 4488.72, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 0.903}, "BRUTO": {"DVC_0838.avi": {"size_mb": 16415.0956, "modified": "2020-03-02 16:13:34", "extension": "AVI", "full_path": "D:\\Tetrapak\\HV\\TPK_HV026_Benedito Carlos de Camargo\\BRUTO\\DVC_0838.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Ste 2007-10-31 22:25:54", "extension": "TIF", "full_path": "D:\\Tetrapak\\HV\\TPK_HV029_Luis Fernando Ceribelli Madi\\Imagens\\Making of\\Alta\\TPK_HV029_MO008.tif", "category": "Image", "duration_ms": 0, "dimension": "3072x2048", "height": 2048, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3072x2048"}, "folder_size_gb": 0.141}, "folder_size_gb": 0.152}, "folder_size_gb": 0.152}, "Textual": {"TPK_HV029_Luis Fernando Ceribelli_rev.docx": {"size_mb": 0.0316, "modified": "2020-08-05 11:02:56", "extension": "DOCX", "full_path": "D:\\Tetrapak\\HV\\TPK_HV029_Luis Fernando Ceribelli Madi\\Textual\\TPK_HV029_Luis Fernando Ceribelli_rev.docx", "category": "Textual", "content_preview": "Projeto Memória Tetra Pak 50 anos de Brasil\nDepoimento de Luis Fernandes Ceribelli Madi\nEntrevistado por Elizabeth Quintino e Rodrigo de Godoy\nSão Paulo, 23 de outubro de 2007\nRealização Museu da Pessoa\nEntrevista número TPK_HV029\nTranscrito por Ana Lúcia V. Queiroz\nRevisado por Teresa de Carvalho Magalhães\nP/1 – Boa tarde, Luis, obrigada por você ter vindo. Você poderia me dizer seu nome completo, local e data de nascimento?\nR – Luis Fernandes Ceribelli Madi, nasci no dia 4 de abril de 1949 em Mirassol, estado de São Paulo.\nP/1 – E a sua família é de Mirassol?\nR – Família de Mirassol. Família Madi, originalmente ficou naquela região. Para complementar, para fazer alguma coisa mais íntima e diferenciada arranjamos cinco encontros da família Madi em Mirassol.\nP/1 – É uma família grande.\nR – É uma família grande, na média de 300 pessoas, com pico de 400 pessoas em uma festa de três dias. \nP/1 – E os seus pais são de Mirassol?\nR – Minha mãe é falecida, nasceu em Campinas e meu pai está com 92 anos e nasceu em Olímpia, estado de São Paulo.\nP/1 – E qual era a atividade deles?\nR – Minha mãe era professora e meu pai era alfaiate. Minha mãe de origem italiana e meu pai de origem libanesa."}, "folder_size_gb": 0.0}, "folder_size_gb": 16.695}, "TPK_HV030_Dirceu Paviott ituição? \nR – Da Sun Chemical do Brasil, nós somos fornecedores de tinta de impressão para o grupo Tetra Pak. \nP/1 - E qual é o seu cargo? \nR – Eu sou o gerente geral da empresa. \nP/1 - E o nome dos seus pais Luís? \nR – Meu pai chamava-se Amarildo Lucietto Filho e minha mãe Leoni Del porto Lucietto. \n P/1 - Eles são naturais de qual cidade? \nR – Meu pai nasceu em Santana do Parnaíba e minha mãe Caieiras, São Paulo. \nP/1 - E a atividade deles? \nR – Meu pai era impressor e minha mãe sempre foi do lar.\nP/1 - E você nasceu em Caieiras que é uma cidade bem próxima de São Paulo. Você passou sua infância em Caieiras? \nR – També"}, "folder_size_gb": 0.0}, "folder_size_gb": 20.877}, "TPK_HV033_Wady Miguel Hakim": {"Audiovisual": {"Acesso": {"TPK_HV033_Wady Miguel Hakim.mp4": {"size_mb": 11336.2122, "modified": "2022-05-25 23:01:14", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV033_Wady Miguel Hakim\\Audiovisual\\Acesso\\TPK_HV033_Wady Miguel Hakim.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5994689.0, "duration": 5994.69, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 11.071}, "Preservação": {"DVC_0845.avi": {"size_mb": 21818.5253, "modified": "2022-05-25 13:50:18", "extension": "AVI", "full_path": "D:\\Tetrapak\\HV\\TPK_HV033_Wady Miguel Hakim\\Audiovisual\\Preservação\\DVC_0845.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 6038166.0, "duration": 6038.17, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 21.307}, "folder_size_gb": 32.378}, "Imagens": {"TPK_HV033.xlsx": {"size_mb": 0.0191, "modified": "2020-12-15 12:59:18", "extension": "XLSX", "full_path": "D:\\Tetrapak\\HV\\TPK_HV033_Wady Miguel Hakim\\Imagens\\TPK_HV033. Ele veio para o Brasil com quantos anos? \nR – Meu pai veio para o Brasil com 19 anos. Morreu muito cedo, aos 56 anos de idade. \nP – O senhor tem irmãos? \nR – Tive um irmão, chamado Rodolfo Miguel Hakin, e uma irmã, Lurdes Abraão - o meu pai era Miguel Abraão, então o nome dela ficou como Abraão. \nP – São falecidos? \nR – São falecidos. \nP – Como é a sua cid"}, "folder_size_gb": 0.0}, "folder_size_gb": 32.524}, "TPK_HV034_Claudia Regina Arruda": {"Audiovisual": {"Acesso": {"TPK_HV034_Claudia Regina Arruda.mp4": {"size_mb": 7049.6176, "modified": "2022-05-26 00:30:06", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV034_Claudia Regina Arruda\\Audiovisual\\Acesso\\TPK_HV034_Claudia Regina Arruda.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3719682.0, "duration": 3719.68, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 6.884}, "Preservação": {"DVC_0846.avi": {"size_mb": 13589.9518, "modified": "2022-05-25 17:37:32", "extension": "AVI", "full_path": "D:\\Tetrapak\\HV\\TPK_HV034_Claudia Regina Arruda\\Audiovisual\\Preservação\\DVC_0846.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3760924.0, "duration": 3760.92, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 13.271}, "folder_size_gb": 20.156}, "Imagens": {"TPK_HV034.xlsx": {"size_mb": 0.0191, "modified": "2020-12-14 21:00:34", "extension": "XLSX", "full_path": "D:\\Tetrapak\\HV\\TPK_HV034_Claudia Regina Arruda\\Imagens\\TPK_HV034.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Descrição | Palavras-chave (Tags) | Obs | Referências Anteriores\nTPK_HV034_MO001 | Claudia Regina Arruda | Making of 1 | s.d. | s.l.\nTPK_HV034_MO002 , tenho um irmão, Rodrigo, e a Sandra. Os dois também são campineiros.\nP/1 – Qual a atividade de seu pai?\nR – Meu pai é militar. Militar, hoje militar aposentado.\nP/1 – E da sua mãe?\nR – Minha mãe sempre foi de casa, cuidando dos filhos; trabalhando em casa mesmo.\nP/1 – E vocês moravam onde?\nR – Eu sempre morei em vila militar em Campinas, porque meu pai, logo que ele se mudou de Catanduva para Campinas já ingressou no quartel e a gente sempre morou numa área militar.\nP/1 – Você conta para gente assim"}, "folder_size_gb": 0.0}, "folder_size_gb": 20.304}, "TPK_HV035_Francisco Maria Quadrado Junior": {"Audiovisual": {"Acesso": {"TPK_HV035_Francisco Maria Quadrado Junior.mp4": {"size_mb": 9660.6843, "modified": "2022-05-26 02:51:14", "extension": "MP4", "full_path": "D:\\Tetrapak\\HV\\TPK_HV035_Francisco Maria Quadrado Junior\\Audiovisual\\Acesso\\TPK_HV035_Francisco Maria Quadrado Junior.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5225921.0, "duration": 5225.92, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 9.434}, "Preservação": {"DVC_0847_1.avi": {"size_mb": 4786.0082, "modified": "2022-05-25 14:15:04", "extension": "AVI", "full_path": "D:\\Tetrapak\\HV\\TPK_HV035_Francisco Maria Quadrado Junior\\Audiovisual\\Preservação\\DVC_0847_1.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1324456.0, "duration": 1324.46, "resolution": "720x480", "fps": 29.97}, "DVC_0847_2.avi": {"size_mb": 14252.6968, "modified": "2022-05-25 15:24:56", "extension": "AVI", "full_path": "D:\\Tetrapak\\HV\\TPK_HV035_Francisco Maria Quadrado Junior\\Audiovisual\\Preservação\\DVC_0847_2.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5 const EXTENSIONS = {
    "Video": ['mp4', 'mov', 'mkv', 'avi', 'm4v', 'mts', 'm2ts', 'wmv', 'flv', 'webm', 'vob', 'ogv', '3gp', 'mxf'],
    "Audio": ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'aiff', 'pcm', 'aif'],
    "Image": ['jpg', 'jpeg', 'tif', 'tiff', 'png', 'gif', 'bmp', 'webp', 'cr2', 'nef', 'arw', 'dng'],
    "Textual": ['doc', 'docx', 'pdf', 'txt', 'rtf', 'odt', 'xls', 'xlsx', 'ppt', 'pptx']
};

const ICONS = { "Video": "🎞️", "Audio": "🎧", "Image": "🖼️", "Textual": "📝", "Other": "📄" };

function formatSmartSize(mbValue) {
    if (!mbValue || mbValue === 0) return "0 B";
    let bytes = mbValue * 1024 * 1024; 
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(2) + " " + units[i];
}

function getIcon(name, isFolder) {
    if (isFolder) return "📁";
    const ext = name.split('.').pop().toLowerCase();
    for (const [category, list] of Object.entries(EXTENSIONS)) {
        if (list.includes(ext)) return ICONS[category];
    }
    return ICONS["Other"];
}

function formatTime(ms) {
    if (!ms || ms === 0) return "N/A";
    let totalSeconds = Math.floor(ms / 1000);
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;
    return [hours, minutes, seconds].map(v => v < 10 ? "0" + v : v).join(":");
}

function tryLoadImage(imgElement, thumbnailPath, originalName) {
    if (!thumbnailPath && !originalName) return;
    let path = thumbnailPath || `thumbnails/thumb_${originalName.split('.').slice(0, -1).join('.')}.jpg`;
    imgElement.onerror = function() {
        this.onerror = null;
        this.src = 'https://via.placeholder.com/150?text=Sem+Preview';
    };
    imgElement.src = path;
}

function copyPreviewText() {
    const box = document.getElementById('preview-text');
    if (box) {
        navigator.clipboard.writeText(box.textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy Content"; }, 2000);
    }
}

function calculateFolderStats(node) {
    let stats = { Video: { count: 0, size: 0 }, Audio: { count: 0, size: 0 }, Image: { count: 0, size: 0 }, Textual: { count: 0, size: 0 }, Other: { count: 0, size: 0 }, totalSize: 0 };
    function traverse(curr) {
        for (let key in curr) {
            if (key === "folder_size_gb") continue;
            let item = curr[key];
            if (item.folder_size_gb !== undefined) traverse(item);
            else {
                let cat = item.category || "Other";
                if (!stats[cat]) cat = "Other";
                stats[cat].count++;
                stats[cat].size += item.size_mb || 0;
                stats.totalSize += item.size_mb || 0;
            }
        }
    }
    traverse(node);
    return stats;
}

function showMetadata(name, data, path) {
    const panel = document.getElementById("metadata-panel");
    const content = document.getElementById("meta-content");
    panel.style.display = "block";

    const isFolder = data.folder_size_gb !== undefined;
    let html = `
        <span class="meta-label">Nome</span><span class="meta-value">${name}</span>
        <span class="meta-label">Caminho</span><span class="meta-value">${data.full_path || path.join("/")}</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(data.full_path || "").replace(/\\/g, "\\\\")}')">Copy Path</button>
        <span class="meta-label">Tamanho</span><span class="meta-value" style="color:var(--accent); font-weight:bold;">${formatSmartSize(isFolder ? data.folder_size_gb * 1024 : data.size_mb)}</span>
    `;

    if (isFolder) {
        const stats = calculateFolderStats(data);
        const getPct = (size) => stats.totalSize > 0 ? ((size / stats.totalSize) * 100).toFixed(1) : 0;
        html += `
            <div class="stats-container">
                <span class="meta-label">Conteúdo</span>
                <div class="stats-bar">
                    <div class="bar-segment" style="width:${getPct(stats.Video.size)}%; background:var(--video)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Audio.size)}%; background:var(--audio)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Image.size)}%; background:var(--image)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Textual.size + stats.Other.size)}%; background:var(--other)"></div>
                </div>
                <div class="stat-row"><span>🎞️ Video</span><b>${stats.Video.count}</b></div>
                <div class="stat-row"><span>🎧 Audio</span><b>${stats.Audio.count}</b></div>
                <div class="stat-row"><span>🖼️ Images</span><b>${stats.Image.count}</b></div>
                <div class="stat-row"><span>📄 Docs / Other</span><b>${stats.Textual.count + stats.Other.count}</b></div>
            </div>`;
    } else {
        if (data.category === "Image" || data.thumbnail) {
            html += `<h3>Preview</h3>
                     <div class="img-preview-container">
                        <img id="preview-img" src="" alt="Carregando...">
                     </div>`;
            setTimeout(() => {
                const img = document.getElementById('preview-img');
                tryLoadImage(img, data.thumbnail, name);
            }, 50);
        }

        html += `<span class="meta-label">Modificado</span><span class="meta-value">${data.modified || "N/A"}</span>`;
        
        if (data.category === "Video") {
            // Garante que displayRes exista ou usa a dimensão original
            const displayRes = data.dimension || "N/A"; 
            
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Resolução</span><span class="meta-value">${displayRes}</span>
                <span class="meta-label">Duração / Áudio</span><span class="meta-value">${formatTime(data.duration_ms)} / ${data.audio_channels || "N/A"}</span>
                <span class="meta-label">Aspecto / FPS</span><span class="meta-value">${data.aspect_ratio || "N/A"} / ${data.frame_rate || "N/A"}</span>`;
        } else if (data.category === "Audio") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Duração</span><span class="meta-value">${formatTime(data.duration_ms)}</span>
                <span class="meta-label">Canais</span><span class="meta-value">${data.audio_channels || "N/A"}</span>`;
        } else if (data.category === "Image") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Dimensões</span><span class="meta-value">${data.dimension || "N/A"}</span>
                <span class="meta-label">DPI</span><span class="meta-value">${data.dpi || "N/A"}</span>`;
        }

        // NOVIDADE: Verifica explicitamente por content_preview ou categoria textual
        if (data.content_preview) {
            html += `<h3>Conteúdo do Documento</h3>
                     <div class="preview-box" id="preview-text">Loading content...</div>
                     <button class="copy-btn" onclick="copyPreviewText()">Copiar Conteúdo</button>`;
        }
    }
    
    content.innerHTML = html;

    // Sincronização garantida: espera o DOM atualizar para injetar o texto
    if (data.content_preview) {
        setTimeout(() => {
            const box = document.getElementById('preview-text');
            if (box) box.textContent = data.content_preview;
        }, 10);
    }
}

function navigateToPath(path) {
    // Limpa a busca e renderiza a visualização normal
    document.getElementById("search").value = "";
    renderColumn(TREE, 0);

    let currentNode = TREE;
    // O primeiro item do path costuma ser "Root" ou o nome do HD, pulamos ele se necessário
    const pathParts = path.slice(1); 

    pathParts.forEach((part, index) => {
        setTimeout(() => {
            const columns = document.querySelectorAll('.column');
            const currentColumn = columns[index];
            if (!currentColumn) return;

            const items = currentColumn.querySelectorAll('.item');
            for (let item of items) {
                if (item.querySelector('.item-text').textContent === part) {
                    item.click(); // Simula o clique no item para abrir a próxima coluna ou metadados
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    break;
                }
            }
        }, (index + 1) * 100); // Pequeno delay para a coluna anterior renderizar
    });
}

function renderColumn(node, level, path = []) {
    const explorer = document.getElementById("explorer");
    while (explorer.children.length > level) explorer.removeChild(explorer.lastChild);
    const col = document.createElement("div"); col.className = "column";
    const keys = Object.keys(node).filter(k => k !== "folder_size_gb").sort((a, b) => {
        const aIsF = node[a].folder_size_gb !== undefined;
        const bIsF = node[b].folder_size_gb !== undefined;
        return (aIsF !== bIsF) ? bIsF - aIsF : a.localeCompare(b);
    });
    keys.forEach(name => {
        const val = node[name];
        const isFolder = val.folder_size_gb !== undefined;
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `<span class="icon">${getIcon(name, isFolder)}</span> <span class="item-text">${name}</span>`;
        item.onclick = () => {
            Array.from(col.children).forEach(c => c.classList.remove('active'));
            item.classList.add('active');
            showMetadata(name, val, path.concat(name));
            if (isFolder) renderColumn(val, level + 1, path.concat(name));
            else while (explorer.children.length > level + 1) explorer.removeChild(explorer.lastChild);
        };
        col.appendChild(item);
    });
    explorer.appendChild(col);
}

function performSearch() {
    const term = document.getElementById("search").value.toLowerCase();
    const explorer = document.getElementById("explorer");
    if (!term) { renderColumn(TREE, 0); return; }
    
    const results = [];
    function searchNode(node, currentPath) {
        for (const key in node) {
            if (key === "folder_size_gb") continue;
            const item = node[key];
            const isFolder = item.folder_size_gb !== undefined;
            const match = key.toLowerCase().includes(term) || (item.content_preview && item.content_preview.toLowerCase().includes(term));
            
            if (match) results.push({ name: key, data: item, path: currentPath.concat(key), isFolder });
            if (isFolder) searchNode(item, currentPath.concat(key));
        }
    }
    
    searchNode(TREE, ["Root"]); // Certifique-se que o nome base aqui condiz com seu JSON
    explorer.innerHTML = "";
    const col = document.createElement("div"); col.className = "column"; col.style.minWidth = "100%";
    
    results.slice(0, 100).forEach(res => {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<span class="icon">${getIcon(res.name, res.isFolder)}</span> 
                         <div><b>${res.name}</b><br><small style="color:#888">${res.path.join(" › ")}</small></div>`;
        
        // AQUI ESTÁ A MUDANÇA: Chama a navegação em vez de apenas mostrar metadados
        div.onclick = () => navigateToPath(res.path);
        
        col.appendChild(div);
    });
    explorer.appendChild(col);
}

document.addEventListener("DOMContentLoaded", () => renderColumn(TREE, 0));
