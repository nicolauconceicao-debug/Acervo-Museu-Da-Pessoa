de Oliveira_rev.docx", "category": "Textual", "content_preview": "Fernando Julio Perrise de Oliveira\nMinibiografia: \nPerrise nasceu em 22 de outubro de 1943 no Rio de Janeiro. Casou seis vezes e tem seis filhos. Sua infância foi no bairro de Engenho de Dentro, lugar tranquilo, com muitas brincadeiras e considerava muito importante os almoços em família. Sua avó materna usava muitos provérbios populares, hoje os utiliza em suas matérias homenageando-a. O seu avô paterno era sertanista e acompanhou Rondon em todas as suas expedições. Seu pai era líder sindical dos bancários e um grande estudioso. Sua infância e juventude foram atribuladas por interferência política que fez dedicar a luta por questões sociais. Sua casa tinha uma biblioteca com quatro mil livros que foram queimados pela Ditadura, nesta época chegou a fugir para um sítio, ficando isolado com seu pai, onde dedicava seu tempo aos estudos, parte convergia ao assunto do projeto do livro, História Nova Brasileira, de Nelson Werneck Sodré. Entrou para política estudantil, foi a Cuba e voltou decidido a fazer a Revolução. Nesse período teve poliomielite que o levou a um ano de tratamento quando começou uma profunda reflexão. Sua ideia de força armada foi afastada e se aproximou da corrente d"}, "folder_size_gb": 0.0}, "folder_size_gb": 43.443}, "BR_HV047_Shigeaki Ueki": {"Audiovisual": {"Acesso": {"BR_HV047_Shigeaki Ueki.mp4": {"size_mb": 13691.1042, "modified": "2023-11-27 16:54:22", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV047_Shigeaki Ueki\\Audiovisual\\Acesso\\BR_HV047_Shigeaki Ueki.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 8248774.0, "duration": 8248.77, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 13.37}, "Preservação": {"MDV_8030.avi": {"size_mb": 13282.9846, "modified": "2023-11-23 17:24:08", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV047_Shigeaki Ueki\\Audiovisual\\Preservação\\MDV_8030.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3675974.0, "duration": 3675.97, "resolution": "720x480", "fps": 29.97}, "MDV_8031.avi": {"size_mb": 13116.3714, "modified": "2023-11-23 18:40:42", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV047_Shigeaki Ueki\\Audiovisual\\Preservação\\MDV_8031.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3629853.0, "duration": 3629.85, "resolution": "720x480", "fps": 29.97}, "MDV_8032.avi": {"size_mb": 3910.6862, "modified": "2023-11-24 14:21:54", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV047_Shigeaki Ueki\\Audiovisual\\Preservação\\MDV_8032.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1082181.0, "duration": 1082.18, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 29.6}, "folder_size_gb": 42.97}, "Textual": {"BR_HV047_Shigeaki Ueki_rev.docx": {"size_mb": 0.0762, "modified": "2012-03-02 11:16:34", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV047_Shigeaki Ueki\\Textual\\BR_HV047_Shigeaki Ueki_rev.docx", "category": "Textual", "content_preview": "Shigeaki Ueki\nMinibiografia:\n Shigeaki Ueki nasceu em Bastos, interior de São Paulo, em 15 de agosto de 1935, seus avós paternos e maternos migraram do Japão para o Brasil quando seus pais ainda eram jovens. Durante a Segunda Guerra Mundial sofreu com as consequências do racionamento de mercadoria que afetou diretamente o comércio do seu pai, e que exigiu uma rigorosa disciplina em seu comércio. Desde criança, como primogênito, teve uma criação mais rígida e com muita disciplina, herdou, através da profissão do seu pai, um grande conhecimento de gestão.  Fez curso de Técnico em Contabilidade e trabalhou no Laboratório Licor Cacau Xavier, Banco Moreira Sales e num Escritório de Engenharia.  Formou-se em Direto em São Paulo e chegou a montar, com três sócios, um escritório de advocacia de sucesso. Uns dos sócios era Jurandir Maia, sobrinho de Daniel Machado de Campos que era Presidente da Associação Comercial de São Paulo. Daniel Campos o apresentou ao Paulo Egydio que era Ministro de Indústria e Comércio, no Governo de Castelo Branco, para ser seu Assessor.  Foi Consultor da Organização dos Estados das Américas nos EUA e de volta ao Brasil foi trabalhar na indústria petroquímica, qu"}, "folder_size_gb": 0.0}, "folder_size_gb": 42.97}, "BR_HV048_Roda de Histórias 3 (Fornecedores)": {"Audiovisual": {"Acesso": {"BR_HV048_Roda de Histórias 3.mp4": {"size_mb": 7270.7287, "modified": "2019-01-31 15:00:54", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV048_Roda de Histórias 3 (Fornecedores)\\Audiovisual\\Acesso\\BR_HV048_Roda de Histórias 3.mp4", "category": "Video", "dimension": "640x480", "height": 480, "aspect_ratio": "4:3 (SD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7727762.0, "duration": 7727.76, "resolution": "640x480", "fps": 23.976}, "folder_size_gb": 7.1}, "Preservação": {"MDV_8033.avi": {"size_mb": 13256.6983, "modified": "2019-01-28 14:00:29", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV048_Roda de Histórias 3 (Fornecedores)\\Audiovisual\\Preservação\\MDV_8033.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3668698.0 tuguês. Herdou todas as tradições italianas. Há muitos anos atua na área de Informática e trabalha para Grahman Packaging, líder de mercado em embalagem que fabrica, no Brasil, exclusivamente para BR Distribuidora \nAugusto nasceu em 22 de maio de 1941 em Itajaí, Santa Catarina. Seus bisavós eram italianos e é o décimo filho entre 11 irmãos, todos agricultores, mas Augusto quis ser motorista. Quando comprou seu terceiro caminhão resolveu ter um posto de gasolina e construiu o primeiro posto da BR em Santa Catarina.\nÁlvaro nasceu em 19 de julho de 1959, Rio de Janeiro. Neto de Vital Brasil, cientista que descobriu o soro antiofídico, formo"}, "folder_size_gb": 0.0}, "folder_size_gb": 34.39}, "BR_HV049_Dilson Gestal Pereira": {"Audiovisual": {"Áudio": {"BR_HV049_Dilson Gestal Pereira.mp3": {"size_mb": 80.4743, "modified": "2008-02-08 20:04:00", "extension": "MP3", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV049_Dilson Gestal Pereira\\Audiovisual\\Áudio\\BR_HV049_Dilson Gestal Pereira.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 5273939.0, "duration": 5273.94}, "folder_size_gb": 0.079}, "folder_size_gb": 0.079}, "Textual": {"BR_HV049_Dilson Gestal Pereira_rev.docx": {"size_mb": 0.0667, "modified": "2012-03-07 13:51:28", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV049_Dilson Gestal Pereira\\Textual\\BR_HV049_Dilson Gestal Pereira_rev.docx", "category": "Textual", "content_preview": "Nome: Dilson Gestal Pereira\nCódigo da entrevista: BR_TM_049\nMinibiografia\nDilson Gestal Pereira nasceu em 31 de Janeiro de 1934. Em 1958 graduou-se em Arquitetura e Urbanismo na Faculdade Nacional de Arquitetura e Urbanismo do Brasil. Sua experiência profissional demonstra um vasto currículo em obras de urbanização e engenharia de tráfego, a segunda atividade foi tema também de duas especializações no início da década de 1960. No início da década de 1970 participou do projeto da Petrobras Distribuidora de arquitetura dos postos, desenvolvendo e inovando postos no Sudeste, Norte e Nordeste. Ainda desenvolve projetos de arquitetura.\nSinopse\nDilson Gestal Pereira nasceu em 31 de Janeiro de 1934. Em 1958 graduou-se em Arquitetura e Urbanismo na Faculdade Nacional de Arquitetura e Urbanismo do Brasil. Em 1962 e 1963 especializou-se em Engenharia de tráfego na Universidade Católica do Rio de Janeiro e no Instituto de Pes. Rodoviárias do Ministério dos transportes. Desenvolveu projetos de arquitetura e urbanismo em prefeituras e empresas, dentre os projetos podemos destacar no Rio de Janeiro: urbanização do Parque do Flamengo; urbanização do Mourisco; urbanização da Lagoa Rodrigo de Freit"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.079}, "BR_HV050_Daniel Paludo": {"Audiovisual": {"Acesso": {"BR_HV050_Daniel Paludo.mp4": {"size_mb": 4511.6052, "modified": "2023-11-29 16:27:05", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV050_Daniel Paludo\\Audiovisual\\Acesso\\BR_HV050_Daniel Paludo.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 2726224.0, "duration": 2726.22, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 4.406}, "Preservação": {"MDV_8036.avi": {"size_mb": 8559.4143, "modified": "2023-11-27 18:37:49", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV050_Daniel Paludo\\Audiovisual\\Preservação\\MDV_8036.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2368666.0, "duration": 2368.67, "resolution": "720x480", "fps": 29.97}, "MDV_8037.avi": {"size_mb": 1431.472, "modified": "2023-11-27 18:41:40", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV050_Daniel Paludo\\Audiovisual\\Preservação\\MDV_8037.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 396096.0, "duration": 396.1, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 9.757}, "folder_size_gb": 14.163}, "Textual": {"BR_HV050_Daniel Paludo_ed.docx": {"size_mb": 0.0132, "modified": "2012-03-26 11:05:52", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV050_Daniel Paludo\\Textual\\BR_HV050_Daniel Paludo_ed.docx", "category": "Textual", "content_preview": "Nome: Daniel Paludo\nCódigo da entrevista: BR_HV_050\nMinibiografia:\nDaniel Paludo nasceu em 10 de fevereiro de 1976, em Nova Prata, Rio Grande do Sul. Formou-se em Administração de Empresa com habilitação em Comércio Exterior. Cursou International Business na Universidade da Califórnia, EUA, que foi de grande importância pessoal e profissional. Em 2001 fundou a empresa Cia. Huber. Hoje é Presidente do Conselho da Cia. Huber e Diretor Geral da Unidade de Reforma de Pneus da Vipal. Vipal fui fundada pelo seu avô em 1973.\nSinopse:\nA entrevista aborda sobre sua história de vida desde a infância à vida profissional. Relata a história da empresa Vipal que é especializada em reformulação de pneus, da parceria com a BR e dos novos empreendimentos. Fala sobre a empresa Cia. Huber que fornece matéria prima para indústrias de calçados, tintas e peça técnicas. Sobre a BR destaca: o modelo de gestão, o apoio técnico no processo de formulação de produto na Vipal e a solidez no mercado."}, "BR_HV050_Daniel Paludo_rev.doc": {"size_mb": 0.0601, "modified": "2012-03-26 11:06:10", "extension": "DOC", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV050_Daniel Paludo\\Textual\\BR_HV050_Daniel Paludo_rev.doc", "category": "Textual"}, "BR_HV050_Daniel Paludo_rev.docx": {"size_mb": 0.0189, "modified": "2026-02-12 16:21:57", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV050_Daniel Paludo\\Textual\\BR_HV050_Daniel Paludo_rev.docx", "category": "Textual", "content_preview": "BR Distribuidora\nDepoimento de Daniel Paludo\nEntrevistado por Denyse Emerich\nPorto Alegre, 11 de outubro de 2010.\nRealização Museu da Pessoa\nEntrevista: BR_HV_050\nTranscrito por Cristina Eira/ MW Transcrições (Mariana Wolff)\nP/1 – Eu gostaria de começar essa entrevista pedindo para que você diga o seu nome completo, local e data de nascimento.\nR – Meu nome é Daniel Paludo, nasci em Nova Prata, no Rio Grande do Sul, em 10 de fevereiro de 1976.\nP/1 – Antes de entrar no assunto da BR, que foi para esse assunto da sua empresa, a Vipal com a BR, a ligação dela, eu queria conhecer um pouquinho a sua cidade. Vamos fazer uma viagem no tempo. Eu queria saber como era, se você lembra como era a sua infância na sua cidade no interior do Rio de Grande do Sul. Você se lembra das brincadeiras?\nR – Primeiro: obrigado, é um prazer estar participando deste momento da BR Distribuidora, ser convidado para essa entrevista. Nova Prata é uma cidadezinha localizada na Serra Gaúcha, no Nordeste do Estado com 20 mil habitantes, realmente pequena. Eu tive o prazer de ter toda a minha infância lá, com muitas brincadeiras ao ar livre, diferentemente dos grandes centros. Eu costumo dizer que a infância da gent"}, "folder_size_gb": 0.0}, "folder_size_gb": 14.163}, "BR_HV051_Eduardo Costa de Faria": {"Audiovisual": {"Acesso": {"BR_HV051_Eduardo Costa de Faria.mp4": {"size_mb": 6306.4618, "modified": "2023-11-29 13:15:39", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV051_Eduardo Costa de Faria\\Audiovisual\\Acesso\\BR_HV051_Eduardo Costa de Faria.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3805268.0, "duration": 3805.27, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 6.159}, "Preservação": {"MDV_8038.avi": {"size_mb": 13413.9011, "modified": "2019-01-31 14:44:42", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV051_Eduardo Costa de Faria\\Audiovisual\\Preservação\\MDV_8038.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3712208.0, "duration": 3712.21, "resolution": "720x480", "fps": 29.97}, "MDV_8039 .avi": {"size_mb": 352.0844, "modified": "2019-01-31 14:57:06", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV051_Eduardo Costa de Faria\\Audiovisual\\Preservação\\MDV_8039 .avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 97397.0, "duration": 97.4, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 13.443}, "folder_size_gb": 19.602}, "Textual": {"BR_HV051_Eduardo Costa de Faria_rev.doc": {"size_mb": 0.0879, "modified": "2012-03-21 13:48:30", "extension": "DOC", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV051_Eduardo Costa de Faria\\Textual\\BR_HV051_Eduardo Costa de Faria_rev.doc", "category": "Textual"}, "BR_HV051_Eduardo Costa de Faria_rev.docx": {"size_mb": 0.0255, "modified": "2026-02-12 16:21:59", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV051_Eduardo Costa de Faria\\Textual\\BR_HV051_Eduardo Costa de Faria_rev.docx", "category": "Textual", "content_preview": "BR Distribuidora\nDepoimento de Eduardo Costa de Faria\nEntrevistado por Denyse Emerich\nBelo Horizonte, 21/10/2011 \nRealização: Museu da Pessoa\nEntrevista número BR_HV_051(050)\nTranscrito por José Roberto Ruiz / MW Transcrições (Mariana Wolff)\nP/1 – Qual o seu nome completo, local e data de nascimento?\nR – Eduardo Costa de Faria, 27 de janeiro de 1971, nascido em Belo Horizonte.\nP/1 – O nome dos seus pais e os nomes dos seus avós.\nR – Abel Vieira de Faria, meu pai. Minha mãe, Maria Eulália Costa de Faria. Meus avós paternos, José e Maria da Conceição e meus avós maternos, Eulália e Francisco.\nP/1 – Qual era a atividade profissional dos seus pais?\nR – Meu pai era bancário do Banco do Brasil. A carreira inteira lá e aposentado no Banco do Brasil. A minha mãe sempre foi do lar.\nP/1 – O seu pai era um bancário que ficava quieto em um lugar?\nR – Não. No começo da carreira ele rodou um pouco, mas a grande parte passou em Belo Horizonte.\nP/1 – Você tem irmãos?\nR – Nove.\nP/1 – Em que lugar desses dez você está?\nR – Eu sou o nono.\nP/1 – Era uma casa movimentada?\nR – Muito. Era não, é ainda. \nP/1 – Vamos falar um pouquinho da sua infância em Belo Horizonte. A cidade já era a capital do Estado,"}, "folder_size_gb": 0.0}, "folder_size_gb": 19.602}, "BR_HV052_Bruno Estefani Ramos de Morais": {"Audiovisual": {"Acesso": {"BR_HV052_Bruno Estefani Ramos de Morais.mp4": {"size_mb": 5452.1503, "modified": "2023-11-25 18:59:27", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV052_Bruno Estefani Ramos de Morais\\Audiovisual\\Acesso\\BR_HV052_Bruno Estefani Ramos de Morais.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3284414.0, "duration": 3284.41, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 5.324}, "Preservação": {"MDV_8040.avi": {"size_mb": 12061.8726, "modified": "2019-01-31 13:27:38", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV052_Bruno Estefani Ramos de Morais\\Audiovisual\\Preservação\\MDV_8040.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3338034.0, "duration": 3338.03, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 11.779}, "folder_size_gb": 17.104}, "Textual": {"BR_HV052_Bruno Estefani Ramos de Morais_rev.doc": {"size_mb": 0.0796, "modified": "2012-03-21 13:49:08", "extension": "DOC", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV052_Bruno Estefani Ramos de Morais\\Textual\\BR_HV052_Bruno Estefani Ramos de Morais_rev.doc", "category": "Textual"}, "BR_HV052_Bruno Estefani Ramos de Morais_rev.docx": {"size_mb": 0.0216, "modified": "2026-02-12 16:22:01", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV052_Bruno Estefani Ramos de Morais\\Textual\\BR_HV052_Bruno Estefani Ramos de Morais_rev.docx", "category": "Textual", "content_preview": "Projeto BR Distribuidora.\nDepoimento de Bruno Estefani Ramos de Morais\nEntrevistado por Denyse Emerich\nGoiânia, 09/11/2011\nRealização: Museu da Pessoa\nEntrevista BR_HV_052\nTranscrito por André Marcelino / MW Transcrições (Mariana Wolff)\nP/1 – Nós vamos começar a entrevista, eu gostaria que você dissesse seu nome, local e data de nascimento.\nR – Meu nome é Bruno Estefani Ramos de Morais, nasci em Goiânia em 17 de junho de 1972.\nP/1 – O senhor poderia dizer, por favor, o nome dos seus pais e dos seus avós.\nR – Os meus pais são Diovaldo Carmo de Morais e Maria Luiza Ramos de Morais. Meus avós maternos Eurípedes Ramos de Morais e Ana Alves de Souza. Avós paternos João Carlos de Morais e Iraídes Vasconcelos de Morais.\nP/1 – Qual era atividade profissional, provavelmente do seu pai ainda seja, e de seus avós?\nR – Meus avós eram comerciantes. Meu pai também é comerciante, contador, e atua na contabilidade até hoje.\nP/1 – E os seus avós eram comerciantes de que ramo?\nR – Meus avós eram do interior e meu pai e minha família ainda moram no interior de Goiás. Eles mexiam mais com comércio, tinham açougues. Mexia com fazenda. Meu pai não seguiu esse ramo, foi para o comércio de bebidas, tinha"}, "folder_size_gb": 0.0}, "folder_size_gb": 17.104}, "fol const EXTENSIONS = {
    "Video": ['mp4', 'mov', 'mkv', 'avi', 'm4v', 'mts', 'm2ts', 'wmv', 'flv', 'webm', 'vob', 'ogv', '3gp', 'mxf'],
    "Audio": ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'aiff', 'pcm', 'aif'],
    "Image": ['jpg', 'jpeg', 'tif', 'tiff', 'png', 'gif', 'bmp', 'webp', 'cr2', 'nef', 'arw', 'dng'],
    "Textual": ['doc', 'docx', 'pdf', 'txt', 'rtf', 'odt', 'xls', 'xlsx', 'ppt', 'pptx']
};

const ICONS = { "Video": "🎞️", "Audio": "🎧", "Image": "🖼️", "Textual": "📝", "Other": "📄" };

function formatSmartSize(mbValue) {
    if (!mbValue || mbValue === 0) return "0 B";
    let bytes = mbValue * 1024 * 1024; 
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(2) + " " + units[i];
}

function getIcon(name, isFolder) {
    if (isFolder) return "📁";
    const ext = name.split('.').pop().toLowerCase();
    for (const [category, list] of Object.entries(EXTENSIONS)) {
        if (list.includes(ext)) return ICONS[category];
    }
    return ICONS["Other"];
}

function formatTime(ms) {
    if (!ms || ms === 0) return "N/A";
    let totalSeconds = Math.floor(ms / 1000);
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;
    return [hours, minutes, seconds].map(v => v < 10 ? "0" + v : v).join(":");
}

function tryLoadImage(imgElement, thumbnailPath, originalName) {
    if (!thumbnailPath && !originalName) return;
    let path = thumbnailPath || `thumbnails/thumb_${originalName.split('.').slice(0, -1).join('.')}.jpg`;
    imgElement.onerror = function() {
        this.onerror = null;
        this.src = 'https://via.placeholder.com/150?text=Sem+Preview';
    };
    imgElement.src = path;
}

function copyPreviewText() {
    const box = document.getElementById('preview-text');
    if (box) {
        navigator.clipboard.writeText(box.textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy Content"; }, 2000);
    }
}

function calculateFolderStats(node) {
    let stats = { Video: { count: 0, size: 0 }, Audio: { count: 0, size: 0 }, Image: { count: 0, size: 0 }, Textual: { count: 0, size: 0 }, Other: { count: 0, size: 0 }, totalSize: 0 };
    function traverse(curr) {
        for (let key in curr) {
            if (key === "folder_size_gb") continue;
            let item = curr[key];
            if (item.folder_size_gb !== undefined) traverse(item);
            else {
                let cat = item.category || "Other";
                if (!stats[cat]) cat = "Other";
                stats[cat].count++;
                stats[cat].size += item.size_mb || 0;
                stats.totalSize += item.size_mb || 0;
            }
        }
    }
    traverse(node);
    return stats;
}

function showMetadata(name, data, path) {
    const panel = document.getElementById("metadata-panel");
    const content = document.getElementById("meta-content");
    panel.style.display = "block";

    const isFolder = data.folder_size_gb !== undefined;
    let html = `
        <span class="meta-label">Nome</span><span class="meta-value">${name}</span>
        <span class="meta-label">Caminho</span><span class="meta-value">${data.full_path || path.join("/")}</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(data.full_path || "").replace(/\\/g, "\\\\")}')">Copy Path</button>
        <span class="meta-label">Tamanho</span><span class="meta-value" style="color:var(--accent); font-weight:bold;">${formatSmartSize(isFolder ? data.folder_size_gb * 1024 : data.size_mb)}</span>
    `;

    if (isFolder) {
        const stats = calculateFolderStats(data);
        const getPct = (size) => stats.totalSize > 0 ? ((size / stats.totalSize) * 100).toFixed(1) : 0;
        html += `
            <div class="stats-container">
                <span class="meta-label">Conteúdo</span>
                <div class="stats-bar">
                    <div class="bar-segment" style="width:${getPct(stats.Video.size)}%; background:var(--video)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Audio.size)}%; background:var(--audio)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Image.size)}%; background:var(--image)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Textual.size + stats.Other.size)}%; background:var(--other)"></div>
                </div>
                <div class="stat-row"><span>🎞️ Video</span><b>${stats.Video.count}</b></div>
                <div class="stat-row"><span>🎧 Audio</span><b>${stats.Audio.count}</b></div>
                <div class="stat-row"><span>🖼️ Images</span><b>${stats.Image.count}</b></div>
                <div class="stat-row"><span>📄 Docs / Other</span><b>${stats.Textual.count + stats.Other.count}</b></div>
            </div>`;
    } else {
        if (data.category === "Image" || data.thumbnail) {
            html += `<h3>Preview</h3>
                     <div class="img-preview-container">
                        <img id="preview-img" src="" alt="Carregando...">
                     </div>`;
            setTimeout(() => {
                const img = document.getElementById('preview-img');
                tryLoadImage(img, data.thumbnail, name);
            }, 50);
        }

        html += `<span class="meta-label">Modificado</span><span class="meta-value">${data.modified || "N/A"}</span>`;
        
        if (data.category === "Video") {
            // Garante que displayRes exista ou usa a dimensão original
            const displayRes = data.dimension || "N/A"; 
            
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Resolução</span><span class="meta-value">${displayRes}</span>
                <span class="meta-label">Duração / Áudio</span><span class="meta-value">${formatTime(data.duration_ms)} / ${data.audio_channels || "N/A"}</span>
                <span class="meta-label">Aspecto / FPS</span><span class="meta-value">${data.aspect_ratio || "N/A"} / ${data.frame_rate || "N/A"}</span>`;
        } else if (data.category === "Audio") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Duração</span><span class="meta-value">${formatTime(data.duration_ms)}</span>
                <span class="meta-label">Canais</span><span class="meta-value">${data.audio_channels || "N/A"}</span>`;
        } else if (data.category === "Image") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Dimensões</span><span class="meta-value">${data.dimension || "N/A"}</span>
                <span class="meta-label">DPI</span><span class="meta-value">${data.dpi || "N/A"}</span>`;
        }

        // NOVIDADE: Verifica explicitamente por content_preview ou categoria textual
        if (data.content_preview) {
            html += `<h3>Conteúdo do Documento</h3>
                     <div class="preview-box" id="preview-text">Loading content...</div>
                     <button class="copy-btn" onclick="copyPreviewText()">Copiar Conteúdo</button>`;
        }
    }
    
    content.innerHTML = html;

    // Sincronização garantida: espera o DOM atualizar para injetar o texto
    if (data.content_preview) {
        setTimeout(() => {
            const box = document.getElementById('preview-text');
            if (box) box.textContent = data.content_preview;
        }, 10);
    }
}

function renderColumn(node, level, path = []) {
    const explorer = document.getElementById("explorer");
    while (explorer.children.length > level) explorer.removeChild(explorer.lastChild);
    const col = document.createElement("div"); col.className = "column";
    const keys = Object.keys(node).filter(k => k !== "folder_size_gb").sort((a, b) => {
        const aIsF = node[a].folder_size_gb !== undefined;
        const bIsF = node[b].folder_size_gb !== undefined;
        return (aIsF !== bIsF) ? bIsF - aIsF : a.localeCompare(b);
    });
    keys.forEach(name => {
        const val = node[name];
        const isFolder = val.folder_size_gb !== undefined;
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `<span class="icon">${getIcon(name, isFolder)}</span> <span class="item-text">${name}</span>`;
        item.onclick = () => {
            Array.from(col.children).forEach(c => c.classList.remove('active'));
            item.classList.add('active');
            showMetadata(name, val, path.concat(name));
            if (isFolder) renderColumn(val, level + 1, path.concat(name));
            else while (explorer.children.length > level + 1) explorer.removeChild(explorer.lastChild);
        };
        col.appendChild(item);
    });
    explorer.appendChild(col);
}

    const explorer = document.getElementById("explorer");
    if (!term) { renderColumn(TREE, 0); return; }
    const results = [];
    function searchNode(node, currentPath) {
        for (const key in node) {
            if (key === "folder_size_gb") continue;
            const item = node[key];
            const isFolder = item.folder_size_gb !== undefined;
            const match = key.toLowerCase().includes(term) || (item.content_preview && item.content_preview.toLowerCase().includes(term));
            if (match) results.push({ name: key, data: item, path: currentPath.concat(key), isFolder });
            if (isFolder) searchNode(item, currentPath.concat(key));
        }
    }
    searchNode(TREE, ["Root"]);
    explorer.innerHTML = "";
    const col = document.createElement("div"); col.className = "column"; col.style.minWidth = "100%";
    results.slice(0, 100).forEach(res => {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<span class="icon">${getIcon(res.name, res.isFolder)}</span> <div><b>${res.name}</b><br><small>${res.path.join("/")}</small></div>`;
        div.onclick = () => showMetadata(res.name, res.data, res.path);
        col.appendChild(div);
    });
    explorer.appendChild(col);
}

document.addEventListener("DOMContentLoaded", () => renderColumn(TREE, 0));
</script>
</body>
</html>
