4_Iza Gonçalves da Silva\\Textual\\BR_HV004_Iza Gonçalves da Silva_rev.docx", "category": "Textual", "content_preview": "Iza Gonçalves da Silva\nNascida em 18 de maio de 1948, filha única, Iza Gonçalves da Silva teve uma infância tranquila em São João do Meriti [Rio de Janeiro]. Fez o curso Técnico em Administração na Escola de Serviço Público, no Rio de Janeiro. Concluiu também outros cursos ligados à área de Administração, Português e Datilografia. Seu primeiro emprego foi na Administradora Fluminense, em seguida trabalhou também como datilógrafa na Serpro [Serviço Federal de Processamento de Dados]. Foi selecionada para trabalhar na Petrobás e então fez concurso para BR Distribuidora. Foi a funcionária número Um da BR e sempre foi muito marcante na empresa por ir trabalhar de moto. Trabalhou sempre na Secretaria Geral, onde organizava documentos e auxiliava a diretoria para reuniões.\nSinopse\n__________________________________________________________\nIza nasceu no Rio de Janeiro, mas foi criada em São João de Meriti. Depois de ter se formado no Ensino Médio, fez um curso técnico de administração na Escola de Serviço Público. Seu primeiro emprego foi na Administradora Fluminense como datilógrafa, depois foi contratada pela SERPRO [Serviço Federal de Processamento de Dados], onde trabalhou por seis me"}, "folder_size_gb": 0.001}, "folder_size_gb": 11.808}, "BR_HV005_Luis Cláudio Sacramento Bispo": {"Audiovisual": {"Acesso": {"BR_HV005_Luis Cláudio Sacramento Bispo.mp4": {"size_mb": 12619.5239, "modified": "2023-11-07 23:29:00", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV005_Luis Cláudio Sacramento Bispo\\Audiovisual\\Acesso\\BR_HV005_Luis Cláudio Sacramento Bispo.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 8793818.0, "duration": 8793.82, "resolution": "1280x720", "fps": 29.97} ize_gb": 31.523}, "folder_size_gb": 43.847}, "Textual": {"BR_HV005_Luis Cláudio Sacramento Bispo_rev.doc": {"size_mb": 0.373, "modified": "2012-01-31 15:35:38", "extension": "DOC", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV005_Luis Cláudio Sacramento Bispo\\Textual\\BR_HV005_Luis Cláudio Sacramento Bispo_rev.doc", "category": "Textual"}, "BR_HV005_Luis Cláudio Sacramento Bispo_rev.docx": {"size_mb": 0.2318, "modified": "2026-02-12 16:20:31", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV005_Luis Cláudio Sacramento Bispo\\Textual\\BR_HV005_Luis Cláudio Sacramento Bispo_rev.docx", "category": "Textual", "content_preview": "Luis Cláudio Sacramento Bispo\nLuis Cláudio Sacramento Bispo nasceu no Rio de Janeiro em 30 de Outubro de 1973. Formou-se em Ciências Contábeis pela Universidade Federal do Rio de Janeiro (UFRJ), durante a graduação atuou em empresas de contabilidade, já formado trabalhou com auditoria fiscal, atividade que exerceu até sua entrada na Petrobras Distribuidora em 1996. Em 1997 prestou novo concurso para a BR, porém desta vez para cargo de nível superior. Sempre atuou na Contabilidade da empresa, e hoje exerce a função de gerente.\nSinopse\nCriado em Santa Teresa, Luis Cláudio destaca em sua infância o incentivo dos pais ao estudo. Aluno do tradicional colégio carioca Pedro II, Luis Cláudio ingressou na Universidade Federal do Rio de Janeiro (UFRJ) na graduação de Ciências Contábeis. Estagiou em empresas de contabilidade e já formado atuou na área de auditoria fiscal de uma importante empresa no mercado. Ingressou na Petrobrás Distribuidora em 1996 em um concurso para vaga de nível técnico onde o pai efetuou sua inscrição, em 1997 se submeteu a novo concurso desta vez para ocupar vaga de nível superior. Já na companhia atuou sempre na área de Contabilidade, que inicialmente era integrada."}, "folder_size_gb": 0.001}, "folder_size_gb": 43.847}, "BR_HV006_Guilherme Edel": {"Audiovisual": {"Acesso": {"BR_HV006_Guilherme arreira profissional como auxiliar de engenheiro no BNDES. Seu ingresso na Petrobras em 1969 como engenheiro químico permitiu que através do curso oferecido pela Cia acrescentasse a sua formação engenharia de processamento de petróleo. Em sua trajetória destaca-se a participação na superintendência de distribuição, no Disguá e na área de Marketing da Cia. Atualmente é assistente na Diretoria de Mercado Consumidor.\nSinopse\nCarlos Fortunato de Campos Fest nasceu em Lavras-Minas Gerais, no dia 29 de novembro de 1939. Aos 18 anos de idade mudou-se para o Rio de Janeiro, onde conseguiu o primeiro emprego no Banco Nacional de Minas Gerais como escriturário. Cursou Engenharia Química como graduação na Universidade Federal do Rio de Janeiro em 1965, e recém formado atuou desenvolvendo programação dentro de uma empresa de distribuição de petróleo. Posteriormente assumiu o cargo de auxiliar de engenheiro no BNDES. In"}, "folder_size_gb": 0.0}, "folder_size_gb": 102.719}, "BR_HV008_Marinez Donato Borgerth Teixeira": {"Audiovisual": {"Acesso": {"BR_HV008_Marinez Donato Borgerth Teixeira.mp4": {"size_mb": 7834.7525, "modified": "2023-11-08 01:16:39", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV008_Marinez Donato Borgerth Teixeira\\Audiovisual\\Acesso\\BR_HV008_Marinez Donato Borgerth Teixeira.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5006268.0, "duration": 5006.27, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 7.651}, "Preservação": {"MDV_7891.avi": {"size_mb": 8841.6636, "modified": "2019-02-11 14:04:36", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV008_Marinez Donato Borgerth Teixeira\\Audiovisual\\Preservação\\MDV_7891.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "D  Filho no final da década de 1970. Trabalhou em banco, e em uma empresa de engenharia como RH e foi admitida na BR em 1986 como a primeira assistente social na Cia, onde atuou sozinha por 17 anos. Implementou importantes programas de assistência aos funcionários e suas famílias e atua como assistente social da Cia até hoje chefiando uma equipe.\nSinopse\nCarioca, Marinez foi criada por um administrador de empresas e uma secretária. Destaca na sua infância o referencial materno e as férias com a família no Espírito Santo. Morou no bairro portuário do Caju por alguns anos por conta dos negócios da família. Formou-se em assistência social, fez MBA em RH e foi admitida na BR em 1986 por análise de currículo. Na Cia implementou importantes projetos como o dentinho mágico, recuperação de dependentes químicos e preparo à aposentadoria, este último é referência no meio e um grande auxílio aos funcionários até hoje.\nProjeto Memória BR Distribuidora\nDepoimento de Marinez Donato Borgeth Teixeira\nEntrevistado por"}, "folder_size_gb": 0.0}, "folder_size_gb": 25.525}, "BR_HV009_José Eduardo Sobral Barrocas": {"Audiovisual": {"Acesso": {"BR_HV009_José Eduardo Sobral Barrocas.mp4": {"size_mb": 13285.0335, "modified": "2023-11-08 02:17:00", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV009_José Eduardo Sobral Barrocas\\Audiovisual\\Acesso\\BR_HV009_José Eduardo Sobral Barrocas.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 8414907.0, "duration": 8414.91, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 12.974}, "Preservação": {"MDV_7879.avi": {"size_mb": 4052.2329, "modified": "2019-02-12 12:45:42", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV009_José Eduardo Sobral Barrocas\\Audiovisual\\Preservação\\MDV_7879.avi", "category": "Video", "dimension": "720x480", " .doc", "category": "Textual"}, "BR_HV009_José Eduardo Sobral Barrocas_rev.docx": {"size_mb": 0.2617, "modified": "2026-02-12 16:20:38", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV009_José Eduardo Sobral Barrocas\\Textual\\BR_HV009_José Eduardo Sobral Barrocas_rev.docx", "category": "Textual", "content_preview": "Nome: José Eduardo Sobral Barrocas\nCódigo da entrevista: BR_HV_009\nMinibiografia\nJose Eduardo Sobral Barrocas ingressou na BR em Novembro de 1980 por meio concurso público. Auxiliou na implantação do processamento de dados da BR, que anteriormente utilizava o sistema da Petrobras. Por volta de 1983, participou da definição da área de TI, a qual assumiu a gerência em 1986. Foi assistente do diretor financeiro da BR em 2001 e exerceu o cargo de gerente executivo de TI em 2003, quando acompanhou a instalação do SAP-R3. Entre 2004 e 2008 esteve afastado da BR. Desde 2008 exerce a função de assistente do diretor da rede de postos de serviço (DRPS). É também diretor de meio ambiente do Sindicato Nacional das Empresas Distribuidoras de Combustíveis e de Lubrificantes (SIDICOM).\nSinopse\nJose Eduardo Sobral Barrocas ingressou na BR em Novembro de 1980 por meio concurso público na área de TI da companhia, atuando como analista de sistema. Nesta função desenvolveu o 1º sistema de conciliação bancária da companhia e acompanhou a 1º reestruturação da BR, onde os distritos foram substituídos por regionais, por conta das telecomunicações. Acompanhou em 1986 a implantação do 1º computador da BR, o"}, "folder_size_gb": 0.001}, "folder_size_gb": 42.906}, "BR_HV010_Carlos Alberto Pinheiro": {"Audiovisual": {"Acesso": {"BR_HV010_Carlos Alberto Pinheiro.mp4": {"size_mb": 10658.6724, "modified": "2023-11-08 03:09:50", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV010_Carlos Alberto Pinheiro\\Audiovisual\\Acesso\\BR_HV010_Carlos Alberto Pinheiro.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_r doc", "category": "Textual"}, "BR_HV010_Carlos Alberto Pinheiro_rev.docx": {"size_mb": 0.2908, "modified": "2026-02-12 16:20:41", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV010_Carlos Alberto Pinheiro\\Textual\\BR_HV010_Carlos Alberto Pinheiro_rev.docx", "category": "Textual", "content_preview": "Carlos Alberto Pinheiro\nCarlos Alberto Pinheiro participou da criação da BR em 1971, convidado por Marcelo de Abreu para atuar na área administrativa, onde permaneceu por três anos. Acompanhou o lançamento do Lubrax. Foi gerente de Comunicação da Companhia por 18 anos. Entre 1991 e 1992, foi assistente do vice-presidente e nos últimos três anos da sua carreira foi chefe administrativo da fábrica de lubrificantes da BR. Aposentou-se em 1995.\nSinopse\nCarlos Alberto Pinheiro prestou concurso para a Petrobras em 1969. Em 1971, foi convidado por Marcelo Alves de Abreu para integrar a equipe da BR na área Adinistrativa. Na Cia atuou na gerência de serviços auxiliares, e em 1974 assumiu a assessoria de promoções. Acompanhou importantes momentos da BR, como: lançamento do Lubrax, o Desafio BR, criação de produtos como calendários e cofrinhos, entre outros. Foi responsável pelo contrato entre a BR Distribuidora e o Flamengo. Entre 1991 e 1992 foi assistente do vice–presidente e nos últimos três anos da sua carreira foi chefe administrativo da fábrica de lubrificantes da BR. Aposentou-se em 1995.\nProjeto BR Distribuidora\nDepoimento de Carlos Alberto Pinheiro\nEntrevistado por Marcia Paiva e P"}, "folder_size_gb": 0.001}, "folder_size_gb": 33.258}, "BR_HV011_Ana Paula Vieira Fernandes": {"Audiovisual": {"Acesso": {"BR_HV011_Ana Paula Vieira Fernandes.mp4": {"size_mb": 12056.2064, "modified": "2023-11-08 04:08:37", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV011_Ana Paula Vieira Fernandes\\Audiovisual\\Acesso\\BR_HV011_Ana Paula Vieira Fernandes.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_rati  1981 atuou nas áreas consumidora, jurídico,"}, "folder_size_gb": 0.0}, "folder_size_gb": 43.495}, "BR_HV013_Arthur de Carvalho Fernandes Neto": {"Audiovisual": {"Acesso": {"BR_HV013_Arthur de Carvalho Fernandes Neto.mp4": {"size_mb": 8139.6271, "modified": "2023-11-08 05:55:11", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV013_Arthur de Carvalho Fernandes Neto\\Audiovisual\\Acesso\\BR_HV013_Arthur de Carvalho Fernandes Neto.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5196858.0, "duration": 5196.86, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 7.949}, "Preservação": {"MDV_7908.avi": {"size_mb": 8533.5446, "modified": "2023-11-27 17:25:41", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV013_Arthur de Carvalho Fernandes Neto\\Audiovisual\\Preservação\\MDV_7908.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2361526.0, "duration": 2361.53, "resolution": "720x480", "fps": 29.97}, "MDV_7909.avi": {"size_mb": 9047.5754, "modified": "2019-01-28 14:22:50", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV013_Arthur de Carvalho Fernandes Neto\\Audiovisual\\Preservação\\MDV_7909.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2503832.0, "duration": 2503.83, "resolution": "720x480", "fps": 29.97}, "MDV_7910.avi": {"size_mb": 1362.8742, "modified": "2019-01-28 14:31:13", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV013_Arthur de Carvalho Fernandes Neto\\Audiovisual\\Preservação\\MDV_7910.avi", "category": "Vid o de Recife, na Gerência de atendimento a clientes.\nSinopse\n_______________________________________________________________ \nCriada em Recife, Maria de Lourdes se dedicou, desde cedo, a trabalhar e a ajudar a mãe. Maria de Lourdes demonstrou teve interesse na área de exatas. Fez curso Técnico em Edificações no CEFET de Pernambuco e curso de Auxiliar de Escritório no SENAC. Iniciou a graduação em engenharia civil, mas não pôde concluí-la por problemas familiares. Maria de Lourdes contou como foi sua trajetória na Petrobras Distribuidora, iniciando no setor de operações, passando por lubrificantes e atendimento ao cliente. Ela contou ainda a mudança das regionais para Unidades de Negócios e o início e desenvolvimento dos negócios com aviação.\nClaquete: Projeto Memória BR Distribuidora 40 anos\nDepoimento d"}, "folder_size_gb": 0.0}, "folder_size_gb": 42.891}, "BR_HV015_Marcelo Dias": {"Audiovisual": {"Acesso": {"BR_HV015_Marcelo Dias.mp4": {"size_mb": 18270.8063, "modified": "2023-11-08 11:12:45", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV015_Marcelo Dias\\Audiovisual\\Acesso\\BR_HV015_Marcelo Dias.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 10995818.0, "duration": 10995.82, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 17.843}, "Preservação": {"MDV_7915.avi": {"size_mb": 8932.322, "modified": "2023-10-27 17:51:40", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV015_Marcelo Dias\\Audiovisual\\Preservação\\MDV_7915.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2471936.0, "duration": 2471.94, "resolution": "720x480", "fps": 29.97}, "MDV_7916.avi": {"size_mb": 8927.2601, "modified": "2023-10- path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV015_Marcelo Dias\\Textual\\BR_HV015_Marcelo Dias_rev.doc", "category": "Textual"}, "BR_HV015_Marcelo Dias_rev.docx": {"size_mb": 0.0572, "modified": "2026-02-12 16:20:53", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV015_Marcelo Dias\\Textual\\BR_HV015_Marcelo Dias_rev.docx", "category": "Textual", "content_preview": "Marcelo Dias\n\t\t\t\t\t\tMarcelo Dias nasceu em Uberaba, Minas Gerais, mas por conta de transferências de negócios de seu pai, teve sua infância, adolescência, até formação no Rio de Janeiro. Formado em Economia pela Universidade Fedral do Rio de Janeiro, participou na juventude do Projeto Rondon, no qual passou um mês na cidade de Parintins [Amazonas] e trabalhou na sede do projeto em Brasília. Em seguida trabalhou na atual CODERT, Companhia de Desenvolvimento de Rodoviárias e Terminais de Estacionamento do Rio de Janeiro. Iniciou sua carreira na Petrobas na área de planejamento e em seguida foi apara área comercal, na Gerência de Vendas  Revendedores. Já passou pelos distritos de Campinas e Belo Horizonte, onde é atualmente Gerente da Rede de Postos.\nSinpose\n__________________________________________________________\nAtuou inicialmente na Gerência de Planejamento com planejamento orçamentário sendo promovido a chefe do setor. Posteriormente atuou como chefe de mercado na gerência de vendas e revendedores, passou pela DISCAM em Campinas e depois a DISBEL em Belo Horizonte onde foi chefe do Setor de Vendas a Revendedores. Foi transferido para a Gerência de Vendas Automotivas de Varginha,"}, "folder_size_gb": 0.0}, "folder_size_gb": 56.962}, "BR_HV016_Sérgio Oliveira de Carvalho": {"Audiovisual": {"Acesso": {"BR_HV016_Sérgio Oliveira de Carvalho.mp4": {"size_mb": 13873.0556, "modified": "2023-11-13 20:26:32", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV016_Sérgio Oliveira de Carvalho\\Audiovisual\\Acesso\\BR_HV016_Sérgio Oliveira de Carvalho.mp4", "c . Fui descendo e cheguei na Lagoa. Da Lagoa vim pra Flamengo, Botafogo e Teresópolis, onde eu estou. \n\nP/1 – Mas e a tua infância? Você cresceu"}, "folder_size_gb": 0.0}, "folder_size_gb": 43.269}, "BR_HV017_Nelson Costa Cardoso": {"Audiovisual": {"Acesso": {"BR_HV017_Nelson Costa Cardoso.mp4": {"size_mb": 11680.9915, "modified": "2023-11-13 22:26:43", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV017_Nelson Costa Cardoso\\Audiovisual\\Acesso\\BR_HV017_Nelson Costa Cardoso.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7032025.0, "duration": 7032.02, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 11.407}, "Preservação": {"MDV_7924.avi": {"size_mb": 8249.2083, "modified": "2023-10-31 17:29:04", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV017_Nelson Costa Cardoso\\Audiovisual\\Preservação\\MDV_7924.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2282880.0, "duration": 2282.88, "resolution": "720x480", "fps": 29.97}, "MDV_7925.avi": {"size_mb": 8534.4495, "modified": "2023-11-01 12:19:50", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV017_Nelson Costa Cardoso\\Audiovisual\\Preservação\\MDV_7925.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2361826.0, "duration": 2361.83, "resolution": "720x480", "fps": 29.97}, "MDV_7926.avi": {"size_mb": 8893.7441, "modified": "2023-11-01 13:15:42", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV017_Nelson Costa Cardoso\\Audiovisual\\Preservação\\MDV_7926.avi", "cat capital, foi trabalhar na BR como engenheiro após curtas experiências profissionais em outras empresas. Ingressou na BR em 1977 na Gerência de Engenharia. Lá acompanhou de longe a constituição de bases e terminais, inclusive as chamadas Bases in Pool que são bases divididas por várias distribuidoras. Posteriormente passou a atuar na Gerência de Materiais onde era o responsável pelas compras da Cia. Retornando a engenharia, trabalhou no Setor de Planejamento Corporativo onde realizou alguns planos de metas para a BR por razão da abertura de mercado. . Ao longo de sua trajetória vivenciou algumas impor"}, "folder_size_gb": 0.001}, "folder_size_gb": 42.483}, "BR_HV019_Jackson Rocha Franco": {"Audiovisual": {"Acesso": {"BR_HV019_Jackson Rocha Franco.mp4": {"size_mb": 15310.6241, "modified": "2023-11-23 16:08:22", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV019_Jackson Rocha Franco\\Audiovisual\\Acesso\\BR_HV019_Jackson Rocha Franco.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 9219610.0, "duration": 9219.61, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 14.952}, "Preservação": {"MDV_7931.avi": {"size_mb": 9022.9829, "modified": "2023-11-01 14:11:02", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV019_Jackson Rocha Franco\\Audiovisual\\Preservação\\MDV_7931.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2497028.0, "duration": 2497.03, "resolution": "720x480", "fps": 29.97}, "MDV_7932.avi": {"size_mb": 8962.4625, "modified": "2023-11-01 15:02:15", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV019_Jackson Rocha Franco\\Audiovisual\\Preservação\\MDV_7932.avi", "category": "Video escritório na área financeira da companhia (São Paulo), onde realizou o acompanhamento de cobrança de títulos de bancos e empenho. Foi para a área comercial em 1985 fazendo o controle de cotas de óleo combustível e em 1989 realizou um concurso interno em que passou a auxiliar de vendas nea área comercial de produtos químicos. Trabalhou desde então na Gerência de Produtos Químicos como assistente de vendas, passando pela Gerência de Tintas, Adesivos e Vernizes. Recentemente foi convidado para ocupar o cargo de Gerente de Vendas de Fertilizantes, em Salvador, Bahia.\nSinopse\n__________________________________________________________\nFormado em Administração, Jackson Franco entrou na BR ainda durante o período de faculdade, em 1981, como auxiliar de escritório no departamento Financeiro. Em seguida fez concurso interno e foi transferido para área comercial o que era um de seus obtivos de carreira. Trabalhou com controle de combustíveis a consumidores. Ficou lotado na GPQ- Gerência de Produtos Químicos, desempenhan"}, "folder_size_gb": 0.0}, "folder_size_gb": 47.741}, "BR_HV020_Dalva Gonçalves Bezerra": {"Audiovisual": {"Acesso": {"BR_HV020_Dalva Gonçalves Bezerra.mp4": {"size_mb": 7385.5511, "modified": "2023-11-16 18:46:17", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV020_Dalva Gonçalves Bezerra\\Audiovisual\\Acesso\\BR_HV020_Dalva Gonçalves Bezerra.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4456719.0, "duration": 4456.72, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 7.212}, "Preservação": {"MDV_7935.avi": {"size_mb": 8796.5741, "modified": "2023-11-06 15:57:41", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV020_Dalva Gonçalves Bezerra\\Audiovisual\\Preservação\\MDV_7935.avi", "category": "Video", "dimension": "720x480", "height": 480, "asp ento da empresa. Finaliza falando de suas atribuições e o crescimento que adquiriu ao longo de sua carreira na BR.\nMinibio\nDalva Bezzera, descendente de portugueses, nasceu no Rio de Janeiro em 2 de outubro de 1957. Foi cedo para colégio de freiras e chegou a ser catequista.  Mais tarde, mudou de bairro e de escola, passando a se dedicar às atividades esportivas como handball e ping-pong. Para o lazer gostava de cinema, artesanato, e de visitar museus. Na escola, sempre gostou de Matemática. \nComeçou a trabalhar muit"}, "folder_size_gb": 0.0}, "folder_size_gb": 23.118}, "BR_HV021_José Lima de Andrade Neto": {"Audiovisual": {"Acesso": {"BR_HV021_José Lima de Andrade Neto.mp4": {"size_mb": 19960.6671, "modified": "2023-11-23 20:41:12", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV021_José Lima de Andrade Neto\\Audiovisual\\Acesso\\BR_HV021_José Lima de Andrade Neto.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 12017506.0, "duration": 12017.51, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 19.493}, "Preservação": {"MDV_7937.avi": {"size_mb": 8412.3244, "modified": "2023-11-08 17:38:38", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV021_José Lima de Andrade Neto\\Audiovisual\\Preservação\\MDV_7937.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2328026.0, "duration": 2328.03, "resolution": "720x480", "fps": 29.97}, "MDV_7938.avi": {"size_mb": 8989.2265, "modified": "2023-11-09 09:05:08", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV021_José Lima de Andrade Neto\\Audiovisual\\Preservação\\MDV_7938.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ra es Furlanetto_rev.docx": {"size_mb": 0.055, "modified": "2026-02-12 16:21:10", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV022_Paulo Cesar Chaves Furlanetto\\Textual\\BR_HV022_Paulo Cesar Chaves Furlanetto_rev.docx", "category": "Textual", "content_preview": "Paulo Cesar Chaves Furlanetto\nNascido no Rio de Janeiro no dia quatro de setembro de 1947, Paulo Furlanetto passou sua infância toda em Santa Teresa. Foi escoteiro quando criança e adolescente e, por gostar de motores e carros, praticou kartismo. Começou seus estudos em um jardim de infância e primário de Santa Teresa, foi para o Colégio Cruzeiro na época do ginásio e fez pré-vestibular no cursinho Vetor enquanto estava na Marinha. Nesta época, fez um curso de máquinas que o direcionou em sua escolha por Engenharia Mecânica na PUC [Pontifícia Universidade Católica] do RJ. Formou-se no final de 1972 e em janeiro 1973 ingressou na BR no setor de manutenção na área de engenharia. Entre os anos de 1975 até 2009, passou por diversos setores e áreas na Companhia, atuando: no setor de Projetos e Obras da Gerência de Engenharia de Distribuição; como chefe do Setor de Projetos e Obras da Gerência de Engenharia de Distribuição; como gerente de produtos de Aviação; como assistente do Diretor de Marketing a Consumidores; como Gerente Industrial; como Gerente de Engenharia. Após isso, passou pelas áreas de Segurança, Meio Ambiente e Saúde, Serviços Gerais (GSG), Contratações (GSC / GCONT) e ser"}, "folder_size_gb": 0.0}, "folder_size_gb": 64.237}, "BR_HV023_Edson Jones Borges": {"Audiovisual": {"Acesso": {"BR_HV023_Edson Jones Borges.mp4": {"size_mb": 10236.0172, "modified": "2023-11-24 03:32:19", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV023_Edson Jones Borges\\Audiovisual\\Acesso\\BR_HV023_Edson Jones Borges.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": 2 16:21:13", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV023_Edson Jones Borges\\Textual\\BR_HV023_Edson Jones Borges_rev.docx", "category": "Textual", "content_preview": "Edson Jones Borges\nEdson Jones Borges nasceu em Aracaju, Sergipe, no dia 06 de Agosto de 1939. De uma família de sete filhos, seu pai trabalhava no Banco do Brasil e era transferido a cada localidade, por isso a família mudou-se para diversas cidades como Aracaju, Manaus e Rio de Janeiro. Parte de sua infância foi em Manaus, mas Edson lembra mesmo de sua infância no Rio de Janeiro onde permaneceu a maior parte de sua vida. Com 15 anos foi auxiliar de desenho na editora e revista chamada Vila Doméstica, onde ficou durante quatro ou seis meses por conta dos estudos, e depois fez cartaz para lojas, agência de viagens, faixas para deputado. Aos 17 anos, Edson perdeu seu pai. Serviu o exército aos 18, 19 anos. Trabalhou como desenhista-cartógrafo e desenhista de arquitetura, onde começou sua vontade de fazer arquitetura e onde aprendeu, na prática, junto com um arquiteto detalhista, a arquitetura básica que se estuda nos primeiros anos na faculdade. Formou-se pela Faculdade Nacional de Arquitetura do Fundão, UFRJ. Ingressou em maio de 1971 entrou na Petrobras, Sudist [Superintendência de Distribuição], através de entrevista, trabalhando na parte de arquitetura de postos, posteriormente"}, "folder_size_gb": 0.001}, "folder_size_gb": 31.951}, "BR_HV024_José Roberto Hescket Hall": {"Audiovisual": {"Acesso": {"BR_HV024_José Roberto Hescket Hall.mp4": {"size_mb": 21460.5327, "modified": "2023-11-24 08:32:29", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV024_José Roberto Hescket Hall\\Audiovisual\\Acesso\\BR_HV024_José Roberto Hescket Hall.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 12918371.0, esolution": "720x480", "fps": 29.97}, "MDV_7956.avi": {"size_mb": 9011.9522, "modified": "2023-11-17 14:10:11", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV024_José Roberto Hescket Hall\\Audiovisual\\Preservação\\MDV_7956.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2493925.0, "duration": 2493.93, "resolution": "720x480", "fps": 29.97}, "MDV_7957.avi": {"size_mb": 3802.4062, "modified": "2023-10-31 12:36:16", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV024_José Roberto Hescket Hall\\Audiovisual\\Preservação\\MDV_7957.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1052251.0, "duration": 1052.25, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 45.879}, "folder_size_gb": 66.836}, "Textual": {"BR_HV024_José Roberto Hescket Hall_rev.doc": {"size_mb": 0.3428, "modified": "2012-03-30 16:35:32", "extension": "DOC", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV024_José Roberto Hescket Hall\\Textual\\BR_HV024_José Roberto Hescket Hall_rev.doc", "category": "Textual"}, "BR_HV024_José Roberto Hescket Hall_rev.docx": {"size_mb": 0.0756, "modified": "2026-02-12 16:21:16", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV024_José Roberto Hescket Hall\\Textual\\BR_HV024_José Roberto Hescket Hall_rev.docx", "category": "Textual", "content_preview": "José Roberto Hescket Hall\nNascido na Tijuca, Rio de Janeiro, no dia 12 de maio de 1950. Passou toda sua infância no Grajaú e as férias com a família em Rio das Ostras, RJ. Estudou no Colégio Militar, que o direcionou a escolher sua futura carreira. Formou-se engenheiro mecânico no Instituto Militar de Engenharia (IME), em 1973. Em 1974, deixou seu currículo na BR que, nesta época, não realizava concursos. Em março de 1974, ingressou na Companhia como engenheiro, em uma área de programação de controle de obras, na Gerência de Engenharia de Distribuição. Em 1982 foi trabalhar na Gerência de Aviação, onde foi Chefe de Engenharia de Aviação, Chefe de Operações e Superintendente de Comercialização direta. No ano de 1995 assumiu o cargo de Assistente do Diretor de Operações, até 1996, quando atuou na área de Planejamento e Desempenho como Assistente do Diretor de Mercado Consumidor, até 2001. Em 2003, foi Assistente, na Gerência de Planejamento Químico, inserida da Gerência de Produtos Químicos. Desde 2007, é um dos assistentes da Presidência da Companhia.\nSinopse\nJosé Roberto Hall formou-se em Engenharia Mecânica no IME, em 1973. Ingressou na BR em 1974, na área de Programação e Contrat"}, "folder_size_gb": 0.0}, "folder_size_gb": 66.837}, "BR_HV025_João Braga Castelo Branco": {"Audiovisual": {"Acesso": {"BR_HV025_João Braga Castelo Branco.mp4": {"size_mb": 13864.1777, "modified": "2023-11-24 11:41:28", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV025_João Braga Castelo Branco\\Audiovisual\\Acesso\\BR_HV025_João Braga Castelo Branco.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 8350242.0, "duration": 8350.24, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 13.539}, "Preservação": {"MDV_7958.avi": {"size_mb": 8618.7854, "modified": "2023-11-17 15:12:23", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV025_João Braga Castelo Branco\\Audiovisual\\Preservação\\MDV_7958.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2385116.0, "duration": 2385. )\\HV\\BR_HV025_João Braga Castelo Branco\\Textual\\BR_HV025_João Braga Castelo Branco_rev.docx", "category": "Textual", "content_preview": "João Braga Castelo Branco\nJoão Braga Castelo Branco nasceu em Teresina, Piauí, no dia 30 de maio de 1958. Saiu de sua cidade para fazer vestibular em Fortaleza, e em 1976 entrou na Escola de Engenharia da Universidade Federal do Ceará no curso de Engenharia Civil. Ao se formar, foi trabalhar em uma empresa de urbanização da prefeitura de Fortaleza, onde ficou por dez anos. Em 1990 ingressou na BR através de concurso público, fazendo o treinamento em Fortaleza, e sendo, então, alocado como supervisor da Base de Distribuição em Teresina, permanecendo até o ano de 1995. Entre 1995 e 2007 foi gerente do Terminal de São Luís, no Maranhão. Desde abril de 2007 é gerente regional de operações-Norte, em Manaus. \nSinopse\nNascido e criado em Teresina, João Braga conta como foi sua infância na pacata cidade com sua família, suas férias em Fortaleza na casa de tios e como aprendera lições importantes na padaria de seu pai. Destaca como foi o processo de ida à Fortaleza, aos 17 anos, para fazer vestibular e como formou-se em engenharia civil na Universidade Federal do Ceará. Recém-formado, foi convidado pelo prefeito de Fortaleza para fazer um trabalho em uma empresa de urbanização e por lá fico"}, "folder_size_gb": 0.0}, "folder_size_gb": 43.29}, "BR_HV026_Jorge Celestino Ramos": {"Audiovisual": {"Acesso": {"BR_HV026_Jorge Celestino Ramos.mp4": {"size_mb": 12234.9282, "modified": "2023-11-24 14:04:08", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV026_Jorge Celestino Ramos\\Audiovisual\\Acesso\\BR_HV026_Jorge Celestino Ramos.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7369229.0, "duration": 7369.23, "resolution": "1280x720", "fps": 29.97}, "folder_size_g tual": {"BR_HV026_Jorge Celestino Ramos_rev.doc": {"size_mb": 0.1201, "modified": "2012-03-02 10:23:06", "extension": "DOC", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV026_Jorge Celestino Ramos\\Textual\\BR_HV026_Jorge Celestino Ramos_rev.doc", "category": "Textual"}, "BR_HV026_Jorge Celestino Ramos_rev.docx": {"size_mb": 0.033, "modified": "2026-02-12 16:21:20", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV026_Jorge Celestino Ramos\\Textual\\BR_HV026_Jorge Celestino Ramos_rev.docx", "category": "Textual", "content_preview": "Projeto BR Distribuidora\nDepoimento de Jorge Celestino\nEntrevistado por Priscila Serejo e Thaísa Marques \nRio de Janeiro, 19/07/2011 \nRealização Museu da Pessoa\nEntrevista BR_HV_026_Jorge Celestino\nTranscrito por Melina de Moura Marchetti\nP/1 - Então Jorge, boa tarde, obrigada pela sua presença. Eu vou começar fazendo as perguntas. Eu queria que você dissesse seu nome completo, o local e a data de nascimento.\nR - Meu nome é Jorge Celestino Gomes. Eu nasci no Rio de Janeiro, no dia 11 de outubro de 1956.\nP/1 - E o nome dos seus pais e dos seus avós?\nR - O meu avô era Celestino Francisco Ramos e minha avó Perciliana Francisca Ramos. Meu pai Manuel Ramos e minha mãe Judith Célia Ramos.\nP/1 - E qual era a atividade dos seus pais?\nR - Meu pai era funcionário público, ele trabalhou muito tempo para o governo do Estado e para o município. Minha mãe era doméstica, cuidava dos filhos. São Quatro filhos, três homens e uma mulher. Na época as mulheres cuidavam mais dos afazeres domésticos.\nP/1 - E onde o senhor cresceu?\nR - Eu nasci e me criei aqui no Rio de Janeiro. Nasci no subúrbio, em Santa Cruz, o último bairro do Rio de Janeiro. Foi ali que eu praticamente me formei. Eu morei em outros"}, "folder_size_gb": 0.0}, "folder_size_gb": 38.196}, "BR_HV027_Claudio de Mello": {"Audiovisual": {"Acesso": {"BR_HV027_Claudio de Mello.mp4": {"size_mb": 7096.6434, "modified": "2023-11-24 15:27:36", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV027_Claudio de Mello\\Audiovisual\\Acesso\\BR_HV027_Claudio de Mello.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4280076.0, "duration": 4280.08, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 6.93}, "Preservação": {"MDV_7966.avi": {"size_mb": 8544.4563, "modified": "2023-11-01 16:33:32", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV027_Claudio de Mello\\Audiovisual\\Preservação\\MDV_7966.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2364594.0, "duration": 2364.59, "resolution": "720x480", "fps": 29.97}, "MDV_7967.avi": {"size_mb": 7098.2359, "modified": "2023-11-01 17:17:45", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV027_Claudio de Mello\\Audiovisual\\Preservação\\MDV_7967.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1964362.0, "duration": 1964.36, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 15.276}, "folder_size_gb": 22.206}, "Textual": {"BR_HV027_Claudio de Mello_rev.docx": {"size_mb": 0.1274, "modified": "2012-04-23 16:26:16", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV027_Claudio de Mello\\Textual\\BR_HV027_Claudio de Mello_rev.docx", "category": "Textual", "content_preview": "Cláudio de Mello\nNascido no Rio de Janeiro, Claudio foi criado por seus avós maternos desde um ano de idade. Passou sua infância em Bonsucesso com seus avós, enquanto seus pais, junto com suas irmãs moravam nas proximidades do Méier, mas passavam férias juntos, em família, em colônias de férias no SESC. Estudou acordeon, participou de audições com este instrumento, mas desistiu da música. Estudou em colégio de irmãs, fez prova de admissão para o Pedro II, fez vestibular na Hélio Alonso e formou-se nesta mesma instituição em Relações Públicas no ano de 1979 - por questões financeiras, fez sua faculdade alguns anos após ter entrado na BR. Em 1972 entrou para Serviços Aéreos Cruzeiro do Sul na área administrativa de controle de voo. No final de 1972 ingressou na BR na área de aviação, sendo transferido para a área de faturamento da empresa em 1973 e ficando nesta função até 1994. Neste ano, por motivos de saúde, afastou-se da Companhia, voltando em 1995 para a área de Comunicação trabalhando com patrocínios, até o ano de 2009 quando se aposentou. No momento, trabalha como freelancer na Fórmula Truck.\nSinopse\nFormado em Relações Públicas em 1979 na Organização Hélio Alonso de Educação"}, "folder_size_gb": 0.0}, "folder_size_gb": 22.207}, "BR_HV028_Maria Cristina Teixeira": {"Audiovisual": {"Acesso": {"BR_HV028_Maria Cristina Teixeira.mp4": {"size_mb": 10640.4186, "modified": "2023-11-24 17:23:08", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV028_Maria Cristina Teixeira\\Audiovisual\\Acesso\\BR_HV028_Maria Cristina Teixeira.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6411338.0, "duration": 6411.34, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 10.391}, "Preservação": {"MDV_7968.avi": {"size_mb": 8529.1451, "modified": "2023-11-06 18:16:55", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV028_Maria Cristina Teixeira\\Audiovisual\\Preservação\\MDV_7968.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2360356.0, "duration": 2360.36, "resolution": "720x480", "fps": 29.97}, "MDV_7969.avi": {"size_mb": 8673.8156, "modified": "2023-11-16 17:42:19", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV028_Maria Cristina Teixeira\\Audiovisual\\Preservação\\MDV_7969.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2400398.0, "duration": 2400.4, "resolution": "720x480", "fps": 29.97}, "MDV_7970.avi": {"size_mb": 6181.9307, "modified": "2023-11-07 14:22:45", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV028_Maria Cristina Teixeira\\Audiovisual\\Preservação\\MDV_7970.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1710776.0, "duration": 1710.78, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 22.837}, "folder_size_gb": 33.228}, "Textual": {"BR_HV028_Maria Cristina Teixeira_rev.docx": {"size_mb": 0.2559, "modified": "2012-03-07 13:48:06", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV028_Maria Cristina Teixeira\\Textual\\BR_HV028_Maria Cristina Teixeira_rev.docx", "category": "Textual", "content_preview": "Nome: Maria Cristina Teixeira\nCódigo da entrevista: BR_HV_028\nMinibiografia\nMaria Cristina Teixeira nasceu em cinco de Maio de 1958  a infância nos bairros de Copacabana e posteriormente Laranjeiras. Iniciou a Graduação em Física na Universidade Federal Rural do Rio de Janeiro, porém com a aprovação no concurso da Petrobras em 1978 trancou o curso e iniciou ma nova graduação na SUESC [Sociedade Universitária de Ensino Superior e Cultura]: Ciências Contábeis. Na BR Distribuidora iniciou sua carreira na área de Contabilidade, onde esteve por 22 anos, indo em seguida para área de TI e logo depois para Financeiro, onde atua até hoje.\nSinopse\nMaria Cristina Teixeira nasceu em cinco de Maio de 1958  em Ciências Contábeis na SUESC. Ingressou na BR em 1978. Trabalhou na Gerência de Contabilidade e de Tecnologia da Informação. Acompanhou o processo de fechamento de capital da BR. Atualmente trabalha no Financeiro.\nProjeto Memória BR Distribuidora\nDepoimento de Maria Cristina Teixeira\nEntrevistada por Márcia de Paiva e Priscila Serejo\nRio de Janeiro 20/07/2011\nRealização Museu da Pessoa\nEntrevista BR_HV_28\nTranscrito por João Alberto Gonçalves Benvindo/ Pedro Henrique Cordeiro/ Diego Rezende"}, "folder_size_gb": 0.0}, "folder_size_gb": 33.228}, "BR_HV029_Antonio Rubens Silva Silvino": {"Audiovisual": {"Acesso": {"BR_HV029_Antonio Rubens Silva Silvino.mp4": {"size_mb": 24417.908, "modified": "2023-11-24 22:58:49", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV029_Antonio Rubens Silva Silvino\\Audiovisual\\Acesso\\BR_HV029_Antonio Rubens Silva Silvino.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 14700386.0, "duration": 14700.39, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 23.846}, "Preservação": {"MDV_7971.avi": {"size_mb": 7931.3557, "modified": "2023-11-07 15:26:45", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV029_Antonio Rubens Silva Silvino\\Audiovisual\\Preservação\\MDV_7971.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2194926.0, "duration": 2194.93, "resolution": "720x480", "fps": 29.97}, "MDV_7972.avi": {"size_mb": 8580.2562, "modified": "2023-11-07 16:10:12", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV029 mesmo tempo cursava Economia  de Santos. No final da faculdade estagiou na General Motors e posteriormente trabalhou na Associação Brasileira de Produtores de Fibras Sintéticas, até ser admitido na Petrobras Distribuidora em 1976, quando começou a trabalhar no Setor Administrativo do Dispal. Trabalhou também no Setor de Vendas a Revendedores. Ocupo"}, "folder_size_gb": 0.0}, "folder_size_gb": 76.074}, "BR_HV030_Marcos Thadeu Giacomini Lobo": {"Audiovisual": {"Acesso": {"BR_HV030_Marcos Thadeu Giacomini Lobo.mp4": {"size_mb": 5119.3405, "modified": "2023-11-27 17:51:01", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV030_Marcos Thadeu Giacomini Lobo\\Audiovisual\\Acesso\\BR_HV030_Marcos Thadeu Giacomini Lobo.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4062224.0, "duration": 4062.22, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 4.999}, "Preservação": {"MDV_7978.avi": {"size_mb": 8621.9756, "modified": "2019-01-30 15:08:08", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV030_Marcos Thadeu Giacomini Lobo\\Audiovisual\\Preservação\\MDV_7978.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2386050.0, "duration": 2386.05, "resolution": "720x480", "fps": 29.97}, "MDV_7979.avi": {"size_mb": 6223.2487, "modified": "2023-11-23 21:08:31", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV030_Marcos Thadeu Giacomini Lobo\\Audiovisual\\Preservação\\MDV_7979.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1722154.0, "duration": 1722.15, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 14.497}, "folder_size_gb": 19.497}, "Textual": {"BR_HV030_Marcos Thadeu Giacomini Lobo_rev.doc": {"size_mb": 0.2983, "modified": "2012-03-07 13:50:02", "extension": "DOC", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV030_Marcos Thadeu Giacomini Lobo\\Textual\\BR_HV030_Marcos Thadeu Giacomini Lobo_rev.doc", "category": "Textual"}, "BR_HV030_Marcos Thadeu Giacomini Lobo_rev.docx": {"size_mb": 0.2346, "modified": "2026-02-12 16:21:23", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV030_Marcos Thadeu Giacomini Lobo\\Textual\\BR_HV030_Marcos Thadeu Giacomini Lobo_rev.docx", "category": "Textual", "content_preview": "Nome: Marcos Thadeu Giacomini Lobo\nCódigo da entrevista: BR_HV_030\nMinibiografia\nMarcos Thadeu Giacomini Lobo nasceu em Cuiabá, onde foi criado. Deixou sua cidade de origem e mudou-se para Campinas-SP para cursar Engenharia Mecânica na UNICAMP. Em 1987 foi admitido na BR Distribuidora via análise curricular, sendo admitido como engenheiro mecânico na Gerência de Vendas de Cuiabá. Atuou na área de consumidores e revendedores durante sua trajetória na Cia.\nSinopse\nNascido em Cuiabá, cursou Engenharia Mecânica na UNICAMP. Em 1987 enviou currículo para a BR, fez entrevista e foi contratado como engenheiro mecânico na Gerência de vendas de Cuiabá na área de atendimento técnico de vendas – nesta época a Gerência era mista atendendo clientes consumidores e revendedores. Por volta de 1998/1999, foi constituída uma superintendência de lubrificantes em que Marcos Lobo participou, mas que foi extinta após um ano por questões de funcionalidade. Após este período, passou para Gerência Regional de Consumidores Centro-Oeste, realizando fornecimento de lubrificantes, combustíveis e graxas aos clientes. Discorreu sobre treinamento de cliente e engenheiros, e ainda sobre a participação da Cia em Fei"}, "folder_size_gb": 0.001}, "folder_size_gb": 19.497}, "BR_HV031_Frederico Bichara Henriq b": 0.2363, "modified": "2026-02-12 16:21:25", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV031_Frederico Bichara Henriques\\Textual\\BR_HV031_Frederico Bichara Henriques_rev.docx", "category": "Textual", "content_preview": "Nome: Frederico Bichara Henriques\nCódigo da entrevista: BR_HV_031\nMinibiografia\nFrederico Bichara Henriques nasceu em Campos, Rio de Janeiro em 30 de dezembro de 1973. Descendente de Libaneses cresceu na companhia do irmão aos cuidados de sua mãe. Cursou engenharia química na UFRJ (Universidade Federal do Rio de Janeiro) entre 1993 e 1997. No ano posterior a sua formatura, entrou em seu primeiro trabalho formal, a BR. Devido a sua aprovação para subsidiaria da Petrobrás, ele saiu do Rio de Janeiro e foi morar no Espírito Santo, onde reside há 13 anos. Frederico Bichara atualmente é gerente de marketing e comercialização da BR no ES é casado e tem um filho, o Gabriel. \nSinopse\nFrederico Bichara Henriques nasceu em Campos-RJ e cursou Engenharia Química na UFRJ. Formado, foi admitido na BR Distribuidora em 1998, atuando na parte de distribuição de gás natural. Durante sua trajetória na Cia acompanhou as mudanças da gerência passando pelas áreas de vendas, negócios, comercialização, e na atual Gerência de Marketing e Comercialização de Gás Canalizado no ES.\nProjeto Memória Petrobras Distribuidora\nDepoimento de Frederico Bichara Henriques\nEntrevistadores Thaísa Marques e Priscila Serejo"}, "folder_size_gb": 0.001}, "folder_size_gb": 21.952}, "BR_HV032_Azamor Renovato dos Santos Filho": {"Audiovisual": {"Acesso": {"BR_HV032_Azamor Renovato dos Santos Filho.mp4": {"size_mb": 6822.4658, "modified": "2023-11-25 00:03:30", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV032_Azamor Renovato dos Santos Filho\\Audiovisual\\Acesso\\BR_HV032_Azamor Renovato dos Santos Filho.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "code  no dia 14 de março. Estudou na Universidade Federal do Amazonas em dois períodos, em 1978 iniciou a graduação de Geologia e em 1993 cursou Arquitetura e Urbanismo. Sua carreira profissional teve início como auxiliar de escritório no início da década de 1970 e posteriormente atuou no Departamento de Estradas e Rodagem do Amazonas. Ingressou na BR Distribuidora em 1982 onde desempenhou diferentes funções, tendo destaque duas atividades nos Aeroportos. Atualmente é gerente Regional de Operações Norte e coordenador de logística e suprimento da mesma regional.\nSinopse\nAzamor Renovato nasceu em Manaus em 14 de Março de 1954. Iniciou a graduação em Geologia na Universidade Federal do Amazonas entre 1978 e 1982, onde posteriormente cursou Arquitetura e Urbanismo, entre 1993 a 1995. Antes da BR, trabalhou como auxiliar de escritório em uma empresa de construção civil (1972 e 1973) e foi laboratorista do Departamento de Estradas de Rodagem do Amazonas, até 1982, quando passou no concurso da Petrobras Distribuidora. Iniciou suas atividades na BR, na regional"}, "folder_size_gb": 0.001}, "folder_size_gb": 21.302}, "BR_HV033_Maria Virgínia Telles Barreto Lins Serfaty": {"Audiovisual": {"Acesso": {"BR_HV033_Maria Virgínia Telles Barreto Lins Serfaty.mp4": {"size_mb": 8907.2107, "modified": "2023-11-27 20:22:16", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV033_Maria Virgínia Telles Barreto Lins Serfaty\\Audiovisual\\Acesso\\BR_HV033_Maria Virgínia Telles Barreto Lins Serfaty.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5368230.0, "duration": 5368.23, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 8.698}, "Preservação": {"MDV_7984.avi": {"size_mb": 8561.3051, "modified": "2023-11-23 21:47:09", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV033_Maria Virgínia nharia Mecânica na PUC (Pontifícia Universidade Católica) do Rio de Janeiro. Iniciou o mestrado, mas não concluiu, pois entrou na BR em 1985 através de concurso público realizado para a Petrobras e, foi, então, trabalhar na área de transportes. Desenvolveu diversas funções, entre elas, fiscalizando obras e empreendimentos de instalações da BR por todo o país. \nSinopse\nFormada em Engenharia Mecânica pela PUC-Rio, entrou como suplente no concurso para a Petróleo Brasileiro – Petrobras, assinando com a BR em 1985 na área de transportes para cuidar da manutenção de vagões-tanque. Entre trabalhos administrativos na sede no Rio de Janeiro, atuou como fiscal de obras e fiscal de empreendimentos no Maranhão até Açailândia, no interior da Bahia, no Espírito Santo, no Rio de Janeiro e em Minas Gerais, acompanhando as unidades novas da Companhia. Convidada, assumiu a área de Segurança e Meio Ambiente (SEMA) e fez uma pós-graduação em questões ambientai"}, "folder_size_gb": 0.0}, "folder_size_gb": 27.826}, "BR_HV034_Aspen Ricardo Andersen da Silva": {"Audiovisual": {"Acesso": {"BR_HV034_Aspen Ricardo Andersen da Silva.mp4": {"size_mb": 10752.3774, "modified": "2023-11-25 02:03:54", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV034_Aspen Ricardo Andersen da Silva\\Audiovisual\\Acesso\\BR_HV034_Aspen Ricardo Andersen da Silva.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6480608.0, "duration": 6480.61, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 10.5}, "Preservação": {"MDV_7987.avi": {"size_mb": 8223.7711, "modified": "2019-01-21 15:47:58", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV034_Aspen Ricardo Andersen da Silva\\Audiovisual\\Preservação\\MDV_7987.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rat s. A família materna é de origem dinamarquesa que chegou à região de Resende no início do século XX. Morou no bairro de Lins, Jacarepaguá, Méier, Engenho de Dentro e hoje mora na Tijuca. Sua infância foi marcada pela tradição do subúrbio carioca com encontros em casa de família e festas nos fins de semana. Sua primeira escola foi a Grilo Falante no bairro de Lins, depois ADN no Méier, Dom Pedro II de Engenho de Dentro e Centro. Sempre gostou de estudar matérias exatas, começou a tocar violão e guitarra na juventude, permanecendo até hoje como seu hobby. Concluiu Engenharia Mecânica na UFRJ em 2001 e atualmente está cursando MBA em Gestão de Negócios. Seu primeiro trabalho foi como estagiário numa micro empresa de engenharia, nesse período apaixonou-se pela área de termo dinâmica e mecânica de fluídos, especificamente em ar condicionado e parte térmica. Buscou estágio nesse setor e foi para Datum, sendo efetivado posteriormente, mas sempre buscou a Petrobras desde a época da faculdade. Quanto abriu concurso em 2002, passou"}, "folder_size_gb": 0.0}, "folder_size_gb": 33.529}, "BR_HV035_Hermano Monteiro Teles Filho": {"Audiovisual": {"Acesso": {"BR_HV035_Hermano Monteiro Teles Filho.mp4": {"size_mb": 15136.2296, "modified": "2023-11-28 00:11:16", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV035_Hermano Monteiro Teles Filho\\Audiovisual\\Acesso\\BR_HV035_Hermano Monteiro Teles Filho.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 9114105.0, "duration": 9114.1, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 14.781}, "Preservação": {"MDV_7990.avi": {"size_mb": 8589.3859, "modified": "2023-11-27 13:45:05", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV035_Hermano Monteiro Teles Filho\\Audiovisual\\Preservação\\MDV_7990.avi", "category": "Video", "dimensi eiro Teles Filho_rev.doc", "category": "Textual"}, "BR_HV035_Hermano Monteiro Teles Filho_rev.docx": {"size_mb": 0.0492, "modified": "2026-02-12 16:21:32", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV035_Hermano Monteiro Teles Filho\\Textual\\BR_HV035_Hermano Monteiro Teles Filho_rev.docx", "category": "Textual", "content_preview": "Hermano Monteiro Teles Filho\nHermano Monteiro Teles Filho nasceu em Crato, Ceará, no dia 18 de junho de 1952. Quarto de oito irmãos, foi para Recife onde terminou o ensino médio e prestou vestibular para a UFPE em Engenharia Civil, formando-se em 1975. Antes de entrar para a BR, trabalhou na Esso como engenheiro entre os anos de 1975 a 1982 nas bases de Recife e São Luís. Em 1983, através de concurso, ingressou na BR no setor de operações acompanhando obras, serviços de manutenção e inspecionando bases no Distrito de Recife (base); atuou ainda pelo Terminal de Mataripe (BA), Bases de Recife, Suape, Maceió e Terminal de Fortaleza entre os anos 1986 a 2010. Atualmente é Gerente do Terminal de Brasília. \nSinopse\nHermano Monteiro Teles Filho graduou-se em Engenharia Civil na Universidade Federal de Pernambuco (UFPE) em 1975. Trabalhou na Esso como engenheiro responsável pela fiscalização de obras na área de Recife, entre 1976 e 1983, passando pelas bases de Recife e São Luís, quando ingressou através de concurso público para a Petrobras Distribuidora. Na BR, começou a trabalhar no setor de operações do Distrito de Recife (Disrec), onde coordenou a manutenção da base e substituía eventu"}, "folder_size_gb": 0.0}, "folder_size_gb": 47.116}, "BR_HV036_Denize de Lima Santana": {"Audiovisual": {"Acesso": {"BR_HV036_Denize de Lima Santana.mp4": {"size_mb": 9629.1591, "modified": "2023-11-25 04:24:38", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV036_Denize de Lima Santana\\Audiovisual\\Acesso\\BR_HV036_Denize de Lima Santana.mp4", "category": "Video", "dimension": "1280x720", "height": 720 ev.doc", "category": "Textual"}, "BR_HV036_Denize de Lima Santana_rev.docx": {"size_mb": 0.2304, "modified": "2026-02-12 16:21:35", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV036_Denize de Lima Santana\\Textual\\BR_HV036_Denize de Lima Santana_rev.docx", "category": "Textual", "content_preview": "Denize de Lima Santana\nDenize de Lima Santana nasceu em 17 de junho de 1963, em Manaus-AM. Criada em Manaus demonstrou desde cedo habilidade para cálculos, cursando então segundo grau técnico em Estradas. Em 1986 prestou concurso para a Petrobrás, sendo admitida no início do ano de 1987 em cargo de nível médio. Atuou como secretária, trabalhou no Departamento Financeiro, na Gerência de vendas, na Gerência de produtos especiais em Salvador e desde sua volta a Manaus em 2003 atua na Gerência de Redes de Postos.\nSinopse\nDenize fez curso técnico em Estradas. Ingressou na BR em fevereiro de 1987, para trabalhar em Manaus, como técnica de nível médio, atuando como secretária. Trabalhou no departamento financeiro (contas pagar, cadastro mecanizado e análise de documentos) e na gerência de vendas. Enfrentou muitos desafios (dificuldades logísticas, especificidades do mercado consumidor), antes da existência de e-mails e internet. Trabalhou também em Salvador, em 2002, na Gerência de Produtos Especiais. Voltou a Manaus em 2003 e, desde então, trabalha na Gerência de Redes de Postos. Discorreu sobre a história da BR na Amazônia, especialmente da área automotiva, Postos Fluviais e Rede de Pos"}, "folder_size_gb": 0.001}, "folder_size_gb": 30.095}, "BR_HV037_Carlos Sant'Anna": {"Audiovisual": {"Acesso": {"BR_HV037_Carlos Sant'Anna.mp4": {"size_mb": 8166.5873, "modified": "2023-11-25 05:41:59", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV037_Carlos Sant'Anna\\Audiovisual\\Acesso\\BR_HV037_Carlos Sant'Anna.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", ified": "2026-02-12 16:21:37", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV037_Carlos Sant'Anna\\Textual\\BR_HV037_Carlos Sant'Anna_rev.docx", "category": "Textual", "content_preview": "Carlos Sant’Anna\nCarlos Sant’Anna nasceu em Belo Horizonte-MG em 1930. Mudou-se para o Rio de Janeiro onde graduou-se em Geografia e História na antiga Faculdade Nacional de Filosofia. Seu ingresso na Petrobras em 1958 foi na área de Comercialização de Petróleo e Derivados. Em sua trajetória na holding pode-se destacar sua importante participação na Interbrás e sua presidência na BR Distribuidora. Aposentou-se em 1990, e atua junto a Cia através de sua empresa de consultoria.\nSinopse\nCarlos Sant’Anna nasceu em Belo Horizonte, MG, no dia 11 de agosto de 1930. Formou-se bacharel em Geografia e História pela Faculdade Nacional de Filosofia, atual UFRJ. Ingressou na Petrobras em fevereiro de 1958, no Escritório de Comercialização de Petróleo e Derivados, tendo chegado a superintendente deste Departamento. Foi um dos idealizadores da Interbrás, subsidiária da Petrobras, criada em 1973, e também presidente da Petrobras Distribuidora. Na década de 1980, voltou à Petrobras como presidente, tendo assumido neste momento também a presidência da Interbrás. Aposentou-se em 1990 e, atualmente, trabalha em sua empresa de consultoria, que presta serviços a Petrobras e a outras empresas.\nProjeto BR"}, "folder_size_gb": 0.001}, "folder_size_gb": 25.678}, "BR_HV038_Milena Rosa Lobato": {"Audiovisual": {"Acesso": {"BR_HV038_Milena Rosa Lobato.mp4": {"size_mb": 11682.0896, "modified": "2023-11-25 07:43:39", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV038_Milena Rosa Lobato\\Audiovisual\\Acesso\\BR_HV038_Milena Rosa Lobato.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7037764.0, "duration" der_size_gb": 25.28}, "folder_size_gb": 36.688}, "Textual": {"BR_HV038_Milena Rosa Lobato_rev.doc": {"size_mb": 0.3916, "modified": "2012-02-28 10:35:28", "extension": "DOC", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV038_Milena Rosa Lobato\\Textual\\BR_HV038_Milena Rosa Lobato_rev.doc", "category": "Textual"}, "BR_HV038_Milena Rosa Lobato_rev.docx": {"size_mb": 0.2105, "modified": "2026-02-12 16:21:40", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV038_Milena Rosa Lobato\\Textual\\BR_HV038_Milena Rosa Lobato_rev.docx", "category": "Textual", "content_preview": "Milena Rosa Lobato\nMilena Rosa Lobato nasceu no Rio de Janeiro, é natural do bairro de São Cristóvão, e passou sua infância entre Jacarepaguá e Teresópolis. Formada em Direito pela Faculdade Cândido Mendes, especializou-se em Gestão e Políticas Públicas pela Fundação Getúlio Vargas, onde atualmente estuda Sustentabilidade. No sistema Petrobrás desde 2002, sempre fez parte da área de responsabilidade social da empresa e tem vasta experiência na gestão de políticas de inclusão de pessoas e comunidades desprivilegiadas do entorno da Petrobrás. Hoje atua na Ouvidoria Geral da Petrobrás Distribuidora como coordenadora regional. \nSinopse\nMilena Lobato é bacharel em Direito pela Universidade Candido Mendes, com pós-graduação em Administração Pública pela Fundação Getúlio Vargas e em Responsabilidade Social e Terceiro Setor pela UFRJ. Ingressou na BR em 2002 através de concurso público feito em 1999. No sistema Petrobrás desde 2002 sempre atuou na área de responsabilidade social da empresa. Sua experiência na gestão de políticas de inclusão, tanto de trabalhadores como de consumidores se deu pelo contato com projetos como o Cidadão Capaz, o Posto-Escola e o Siga Bem Criança.  Entrou na Ger"}, "folder_size_gb": 0.001}, "folder_size_gb": 36.689}, "BR_HV039_Roda de Histórias 1 (Revendedores)": {"Textual": {"BR_HV039_Roda de Histórias 1 (Revendedores)_rev.doc": {"size_mb": 1.2544, "modified": "2012-02-28 10:42:02", "extension": "DOC", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV039_Roda de Histórias 1 (Revendedores)\\Textual\\BR_HV039_Roda de Histórias 1 (Revendedores)_rev.doc", "category": "Textual"}, "BR_HV039_Roda de Histórias 1 (Revendedores)_rev.docx": {"size_mb": 1.0843, "modified": "2026-02-12 16:21:42", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV039_Roda de Histórias 1 (Revendedores)\\Textual\\BR_HV039_Roda de Histórias 1 (Revendedores)_rev.docx", "category": "Textual", "content_preview": "Adriano da Rocha Pereira\nAdriano da Rocha Pereira é português, mas veio para o Brasil ainda no início da década de 1960, diretamente ao Rio de Janeiro, onde experimentou uma série de outros trabalhos até se firmar na revenda de combustível que hoje sob o seu comando somam seis postos. \nAmadeu Monteiro dos Santos\nAmadeu Monteiro dos Santos é filho de português, mas é natural de Santos-SP. Ainda criança, na borracharia de seu pai, aprendeu como poucos o funcionamento do processo de distribuição de combustível e está há mais de 50 anos atuando no ramo.\nEdival Benigno do Rosário\nEdival Benigno do Rosário, natural de Carlos Chagas em Minas Gerais estabeleceu-se em Salvador, na Bahia. Porém, sua trajetória mostra uma vida de muitos deslocamentos e perspicácia nas decisões que construíram o seu presente. Há mais de 40 anos na revenda de combustível, é proprietário de três postos com a bandeira Petrobras. \nIsmael Anselmo\nIsmael Anselmo é paranaense, natural de Cambé, e narra uma trajetória de muito vínculo com a atividade do combustível. Primeiro como funcionário e, posteriormente, como proprietário de dois postos com a bandeira Petrobras. \nRicardo Rodriguez Lopez \nRicardo Rodrigues Lopes"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.002}, "BR_HV040_Carlos Victor Zidaric": {"Audiovisual": {"Acesso": {"BR_HV040_Carlos Victor Zidaric.mp4": {"size_mb": 6875.0209, "modified": "2023-11-25 08:21:58", "extension": category": "Textual", "content_preview": "Carlos Victor Zidaric\nCarlos Victor Zidaric nasceu no dia 20 de outubro de 1952, em Porto Alegre, RS. Em 1986 graduou-se em Engenharia Mecânica pela PUC-RS. Ingressou na BR em 1973 na Gerência de Operações Financeiras como auxiliar de escritório. Em sua trajetória na Cia ocupou cargos de assistente administrativo; coordenador de Atividade de Pessoal e Chefe de Setor em diferentes Gerências.\nSinopse\nFormou-se em Engenharia Mecânica pela PUC-RS em 1986. Entrou na BR em 1973, indo trabalhar na Gerência de Operações Financeiras (GOP) do Distrito de Porto Alegre, como auxiliar de escritório. Entre 1986 e 1989, assumiu a função de escriturário, assumindo a coordenadoria de atividades de contas a pagar da GOP. Entre 1989 e 1994 trabalhou na Gerência Administrativa (atual Recursos Humanos e Compartilhados), como assistente administrativo, coordenador da Atividade de Pessoal e chefe do setor. Entre 1994 foi trabalhar em Curitiba como chefe do setor Administrativo. A partir de 1996, assumiu a Coordenadoria Administrativa do Terminal de Itajaí, responsável pelo Sistema de Gestão Integrada (ISSO 9001, ISSO 14001 e OHSAS 18000. Em 2002, atuou como assistente técnico de Administração do mesmo Te"}, "folder_size_gb": 0.0}, "folder_size_gb": 21.773}, "BR_HV041_Maria das Graças Silva Foster": {"Audiovisual": {"Acesso": {"BR_HV041_Maria das Graças Silva Foster.mp4": {"size_mb": 12271.103, "modified": "2023-11-25 11:02:14", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV041_Maria das Graças Silva Foster\\Audiovisual\\Acesso\\BR_HV041_Maria das Graças Silva Foster.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7392218.0, "duration": 7392.22, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 11.983}, "Preservação": {"MDV_8010.avi": {"size_mb": 6835.1668,  Silva Foster_ed.docx": {"size_mb": 0.0188, "modified": "2012-02-03 14:42:28", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV041_Maria das Graças Silva Foster\\Textual\\BR_HV041_Maria das Graças Silva Foster_ed.docx", "category": "Textual", "content_preview": ""}, "BR_HV041_Maria das Graças Silva Foster_rev.docx": {"size_mb": 0.0982, "modified": "2012-02-03 14:52:26", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV041_Maria das Graças Silva Foster\\Textual\\BR_HV041_Maria das Graças Silva Foster_rev.docx", "category": "Textual", "content_preview": "Maria das Graças Silva Foster\nMaria das Graças Silva Foster nasceu , Caratinga, no dia 26 de agosto de 1953. De família humilde, com menos de dois anos de idade, mudou-se junto aos seus pais e irmã para o Rio de Janeiro, morando na zona norte, em Bonsucesso, até seus doze anos de idade, quando, então, foi para a Ilha do Governador. Fez curso vestibular no Bahiense e graduou-se  na Universidade Federal Fluminense em 1978. Fez estágio no Instituto Nacional de Tecnologia, na Divisão de Papel e Papelão, e na General Electric. Antes de entrar na Petrobras, trabalhou na Nuclen – Nuclebrás Engenharia, destacando-se como a primeira colocada no curso nacional da Nuclebras - Projeto Urânio III. Concluiu sua pós-graduação  na Coppe/UFRJ. Entrou na Petrobras em 1981, começando a trabalhar no Centro de Pesquisas e Desenvolvimento Leopoldo Américo Miguez de Mello (CENPES), nas áreas de Perfuração e de Produção. Foi Secretária de Petróleo, Gás Natural e Combustíveis Renováveis do Ministério de Minas e Energia e presidente da Petrobras Distribuidora. Atualmente é diretora de Gás e Energia da Petrobras, tendo sido a primeira mulher a ocupar um cargo na Diretoria da empresa.  \nSinopse\nGraça Foster c"}, "folder_size_gb": 0.0}, "folder_size_gb": 38.374}, "BR_HV042_Orlando Galvão Filho": {"Audiovisual": {"Acesso": {"BR_HV042_Orlando Galvão Filho.mp4": {"size_mb": 9554.1259, "modified": " rlando Galvão Filho_rev.doc": {"size_mb": 0.1367, "modified": "2012-03-02 10:53:40", "extension": "DOC", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV042_Orlando Galvão Filho\\Textual\\BR_HV042_Orlando Galvão Filho_rev.doc", "category": "Textual"}, "BR_HV042_Orlando Galvão Filho_rev.docx": {"size_mb": 0.033, "modified": "2026-02-12 16:21:47", "extension": "DOCX", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV042_Orlando Galvão Filho\\Textual\\BR_HV042_Orlando Galvão Filho_rev.docx", "category": "Textual", "content_preview": "BR Distribuidora\nEntrevistado por Denyse Emerich e Thaísa Marques\nDepoimento de Orlando Galvão Filho\nRio de Janeiro 29/07/2011\nRealização Museu da Pessoa\nEntrevista BR_HV_042_Orlando Galvão Filho\nP/1 – Bom dia seu Orlando.\nR – Bom dia.\nP/1 – Para começar, eu gostaria que o senhor dissesse seu nome completo, local e data de nascimento.\nR – Meu nome é Orlando Galvão filho, nasci em Itabuna, Bahia, em 14 de julho de 1940.\nP/1 – Por favor, você poderia nos dizer o nome dos seus pais e dos seus avós?\nR – Claro. Meus pais são: Orlando Galvão, também de Itabuna, e Mirtes Pereira Galvão. Meus avós, por parte de pai, é Ruffo Galvão e Marieta Galvão, é a turma de Itabuna. E meus avós por parte de mãe:  Luiz Pereira e Adelaide D’Avila Pereira, é o ramo Português da família.\nP/1 – Qual era a atividade profissional dos seus pais?\nR – Minha mãe era dona de casa e meu pai era médico.\nP/1 – Você tem irmãos?\nR – Tenho duas irmãs.\nP/1 – Você nasceu em Itabuna, deve ter vivido um tempinho lá. Como era Itabuna na época da sua infância?\nR – Minhas lembranças são muito poucas de Itabuna, porque eu saí de lá com nove ou dez anos, então eu me lembro muito pouco de Itabuna. Depois voltei lá duas ou três ve"}, "folder_size_gb": 0.0}, "folder_size_gb": 29.683}, "BR_HV043_Júlio Cezar Maia da Fontoura": {"Audiovisual": {"Acesso": {"BR_HV043_Júlio Cezar Maia da Fontoura.mp4": {"size_mb": 7405.6039, "modified": "2023-11-25 14:55:27", "extension": da Fontoura\\Textual\\BR_HV043_Júlio Cezar Maia da Fontoura_rev.docx", "category": "Textual", "content_preview": "Júlio Cesar Maia da Fontoura\nJulio Cesar Maia da Fontoura nasceu em Fortaleza, CE, em 1947. Formado em Engenharia Química pela Universidade Federal do Ceará e presente na BR Distribuidora desde 1971, hoje é consultor sênior para assuntos relacionados a lubrificantes automotivos. Foi também assistente de produção, gerente comercial e de distribuição, com ampla experiência operacional, tanto na condução de processos produtivos quanto logísticos e comerciais. Também prestou consultoria para a instalação de refinarias em alguns países da América latina nas décadas de 1990 e 2000.\nSinopse\nO engenheiro químico Julio Cesar Maia da Fontoura é consultor sênior na BR Distribuidora e seu relato mostra boa parte de sua trajetória profissional dentro da empresa. Natural de Fortaleza-CE, mudou-se para o Rio de Janeiro em 1970 após aprovação em concurso público. Seu primeiro contato com a indústria petroleira foi na REDUQUE, uma refinaria da Petrobras localizada em Duque de Caxias-RJ. Ao longo de 41 anos de trabalho e sempre responsável pela cadeia de lubrificantes automotivos, passou por diversas áreas dentro da Petrobrás e da BR Distribuidora. Com sua experiência, tanto na condução de processos"}, "folder_size_gb": 0.001}, "folder_size_gb": 22.896}, "BR_HV044_Roda de Histórias 2 (Sindicalistas)": {"Audiovisual": {"Preservação": {"MDV_8019.avi": {"size_mb": 7681.0004, "modified": "2019-01-23 14:37:40", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV044_Roda de Histórias 2 (Sindicalistas)\\Audiovisual\\Preservação\\MDV_8019.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2162160.0, "duration": 2162.16, "resolution": "720x480", "fps": 29.97}, "MDV_8020.avi": {"size_mb": 7341.0506, "modified": "  na área de biocombustíveis. Destaca a grandeza da Petrobras Biocombustível, Transpetro, Braskem, do maior programa de expansão de produção de refino no mundo e da confirmação do Pré-sal como extraordinária perspectiva e oportunidade de exploração de petróleo.\nSobre a BR destaca a política de investimento voltada para aumentar as condições de logística, principalmente na área no Nordeste, Norte e Centro-Oeste e na expansão do consumo do etanol e biocombustíveis, o preparo para o diesel 10 ppm, o crescimento das redes de conveniências e o segmento dos grandes consumidores. Analisa a BR como uma empresa que desenvolve uma logística de alto nível e c"}, "folder_size_gb": 0.0}, "folder_size_gb": 4.624}, "BR_HV046_Fernando Julio Perissé de Oliveira": {"Audiovisual": {"Acesso": {"BR_HV046_Fernando Julio Perissé de Oliveira.mp4": {"size_mb": 13947.7999, "modified": "2023-11-25 17:59:33", "extension": "MP4", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV046_Fernando Julio Perissé de Oliveira\\Audiovisual\\Acesso\\BR_HV046_Fernando Julio Perissé de Oliveira.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 8400325.0, "duration": 8400.33, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 13.621}, "Preservação": {"MDV_8026.avi": {"size_mb": 8614.1012, "modified": "2023-11-22 16:56:05", "extension": "AVI", "full_path": "D:\\40 anos memória BR (BR)\\HV\\BR_HV046_Fernando Julio Perissé de Oliveira\\Audiovisual\\Preservação\\MDV_8026.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2383815.0, "duration": 2383.82, "resolution": "720x480", "fps": 29.97}, "MDV_8027.avi": {"size_mb": 8358.073, "modified": "2019-01-21 11:50:04", "extension": "AVI", "full_path": "D:\\40 a
