y": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Nome da História | Nome dos personagens | Descrição | Palavras-chave (Tags) | Obs | Referências anteriores | local no acervo\nFGL_HV024_FT001 | Cezar Augusto Lago Marques | Primeira comunhão | 1975.0 | Niterói, RJ | Planejando o jogo | Cezar Marques | Cezar fez a primeira comunhão aos 9 anos na Escola Católica Instituto Abel, ocasião em que conheceu Leonardo Araújo | primeira comunhão, festa, igreja, infância, escola católica, memória, história, Gol de Letra\nFGL_HV024_FT002 | Cezar Augusto Lago Marques | Festa Junina | anos 70 | Niterói, RJ | Planejando o jogo | cezar Marques | Participação na festa junina no ultimo ano do Jardim de Infância Alberto de Oliveira | Festa junina, infância, festa, escola, memória, história, Gol de Letra"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.004}, "Textual": {"FGL_HV024_Cezar-Augusto-Lago-Marques_REV.docx": {"size_mb": 0.0657, "modified": "2019-03-25 10:23:16", "extension": "DOCX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV024_Cezar Augusti Lago Marques\\Textual\\FGL_HV024_Cezar-Augusto-Lago-Marques_REV.docx", "category": "Textual", "content_preview": "Dez Anos da Fundação Gol de Letra\nDepoimento de Cezar Augusto Lago Marques\nEntrevistado por Nádia Lopes e Márcia Ruiz\nRio de janeiro, 25/07/2009\nRealização: Museu da Pessoa\nEntrevista nº FGL_HV024\nTranscrito por Keila Barbosa\nRevisado por Genivaldo Cavalcanti Filho\nP/1 – Cezar, primeiramente obrigada, por você ter aceito o nosso convite. Pra começar, eu gostaria que você dissesse seu nome completo, o local e a data de nascimento.\nR – Meu nome é Cezar Augusto Lago Marques. Eu nasci em Niterói, estado do Rio de Janeiro, e qual a outra? (risos)\nP/1 – Você nasceu em que dia?\nR – Eu nasci no dia quatro de março de 1966.\nP/1 – Nome dos seus pais?\nR – Cezar Garcia Marques e Terezinha Maria Lago Marques.\nP/1 – Você conheceu os seus avós?\nR – Conheci meus avós, só não conheci meu avô materno, o resto eu conheci.\nP/1 – Nome dos seus avós?\nR – Meu avô materno é José Lago, e avó, Maristela. A avó paterna é Cilene Garcia Marques e [o avô paterno é] Júlio José Dias Marques.\nP/1 – Você sabe a origem da sua família?\nR – Por parte do meu pai, é origem portuguesa, meu avô era português. A minha mãe também, mas já eram nascidos aqui no Brasil.\nP/1 – Já eram daqui mesmo?\nR – Já eram daqui.\nP/1 – E dos"}, "folder_size_gb": 0.0}, "folder_size_gb": 38.265}, "FGL_HV023_Felipe Pitaro Ramos": {"Imagens": {"FELIPE.tif": {"size_mb": 1.6431, "modified": "2009-11-25 15:31:10", "extension": "TIF", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV023_Felipe Pitaro Ramos\\Imagens\\FELIPE.tif", "category": "Image", "duration_ms": 0, "dimension": "1023x1083", "height": 1083, "dpi": 96.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1023x1083"}, "folder_size_gb": 0.002}, "Textual": {"FGL_HV023_Felipe-Ramos_REV.docx": {"size_mb": 0.0511, "modified": "2019-03-25 10:23:16", "extension": "DOCX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV023_Felipe Pitaro Ramos\\Textual\\FGL_HV023_Felipe-Ramos_REV.docx", "category": "Textual", "content_preview": "Dez anos da Fundação Gol de Letra\nDepoimento de Felipe Pitaro Ramos\nEntrevistado por Márcia Ruiz e Nádia Lopes\nRio de Janeiro, 25/07/2009\nRealização: Museu da Pessoa\nEntrevista nº FGL_HV023\nTranscrito por Karina Medici Barrella\nRevisado por Genivaldo Cavalcanti Filho\nP/1 – Bom dia, Felipe. Queria agradecer a sua participação. Para iniciar, eu gostaria que você dissesse o seu nome completo, local e data de nascimento.\nR – O meu nome é Felipe Pitaro Ramos. Eu nasci no Rio de Janeiro, em dezoito de março de 1978.\nP/1 – Em que bairro do Rio você nasceu?\nR – Eu nasci em maternidade na Tijuca, mas fui criado até os 21 anos em Quintino, na zona norte da cidade.\nP/1 – Qual é o nome dos seus pais?\nR – Meu pai chama-se Fernando dos Santos Ramos e a minha mãe, Silvia Regina Pitaro Ramos.\nP/1 – E seus avós paternos?\nR – Chamavam-se Fernando da Silva Ramos e Iolanda da Silva Ramos.\nP/1 – Parte materna?\nR – Nelson Natal Pitaro e Rosinha Carnaval Pitaro.\nP/1 – Você sabe a origem deles?\nR – Dos meus avós paternos, não muito. A família não tinha uma ascendência clara pra mim. Na parte materna, sim. Os avós da minha mãe vieram da Itália, de ambas as partes. Chegaram aqui muito jovens, por volta de q"}, "folder_size_gb": 0.0}, "Audiovisual": {"Acesso": {"FGL_HV023_Felipe Pitaro Ramos.mp4": {"size_mb": 13215.7255, "modified": "2022-02-05 11:14:06", "extension": "MP4", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV023_Felipe Pitaro Ramos\\Audiovisual\\Acesso\\FGL_HV023_Felipe Pitaro Ramos.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6925352.0, "duration": 6925.35, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 12.906}, "Preservação": {"MDV_6123.avi": {"size_mb": 8896.4136, "modified": "2019-01-14 10:31:22", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV023_Felipe Pitaro Ramos\\Audiovisual\\Preservação\\MDV_6123.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2504238.0, "duration": 2504.24, "resolution": "720x480", "fps": 29.97}, "MDV_6124.avi": {"size_mb": 8888.8214, "modified": "2019-01-14 11:17:54", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV023_Felipe Pitaro Ramos\\Audiovisual\\Preservação\\MDV_6124.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2502082.0, "duration": 2502.08, "resolution": "720x480", "fps": 29.97}, "MDV_6125.avi": {"size_mb": 7956.3283, "modified": "2019-01-14 11:58:32", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV023_Felipe Pitaro Ramos\\Audiovisual\\Preservação\\MDV_6125.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2239671.0, "duration": 2239.67, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 25.138}, "folder_size_gb": 38.044}, "folder_size_gb": 38.046}, "FGL_HV022_Anna Karla Rodrigues Freira": {"Textual": {"FGL_HV022_Anna Karla Rodrigues Freire_rev.doc": {"size_mb": 0.0991, "modified": "2019-03-25 10:23:16", "extension": "DOC", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV022_Anna Karla Rodrigues Freira\\Textual\\FGL_HV022_Anna Karla Rodrigues Freire_rev.doc", "category": "Textual"}, "FGL_HV022_Anna Karla Rodrigues Freire_rev.docx": {"size_mb": 0.0283, "modified": "2026-02-20 11:38:06", "extension": "DOCX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV022_Anna Karla Rodrigues Freira\\Textual\\FGL_HV022_Anna Karla Rodrigues Freire_rev.docx", "category": "Textual", "content_preview": "10 anos da Fundação Gol de Letra\nDepoimento de Anna Karla Rodrigues Freire\nEntrevistada por Nádia Lopes e Márcia Ruiz\nRio de Janeiro, 25/07/2009.\nRealização Museu da Pessoa\nEntrevista FGL_ HV022\nRevisado por Gustavo Kazuo\nP/1 – Bom dia, Anna.\nR – Bom dia.\nP/1 – Obrigada por você ter aceitado o nosso convite, tá? Para começar eu gostaria que você dissesse seu nome completo, local e data de nascimento.\nR – Meu nome completo: Anna Karla Rodrigues Freire, eu nasci em 4 do 4 de 1988 em Niterói.\nP/1 – O nome dos seus pais?\nR – Minha mãe é Maria de Fátima Rodrigues e o nome do meu pai é José Ricardo Freire de Oliveira. \nP/1 – Atividade dos seus pais? \nR – Dos meus pais? Minha mãe é manicure e meu pai é padeiro. \nP/1 – E você tem irmãos?\nR – Eu tenho dois irmãos, um de 26 e o outro de 32.\nP – O nome deles?\nR – O mais velho é Eduardo e o do meio é Felipe. \nP/1 – Aí você é a caçulinha?\nR – Hum, hum. \nP/1 – E o que é que eles fazem?\nR – O do meio, o Felipe trabalha em um supermercado e o mais velho tem uma oficina mecânica. \nP/1/ - Você é nascida em Niterói, né?\nR – Aham.\nP/1 – A gente vai falar um pouquinho da sua infância, tá?\nR – Tá.\nP/1 – Você chegou a conhecer os seus avós por parte de p"}, "folder_size_gb": 0.0}, "Audiovisual": {"Acesso": {"FGL_HV022_Anna Karla Rodrigues Freira.mp4": {"size_mb": 8073.5959, "modified": "2022-02-05 09:08:38", "extension": "MP4", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV022_Anna Karla Rodrigues Freira\\Audiovisual\\Acesso\\FGL_HV022_Anna Karla Rodrigues Freira.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4369765.0, "duration": 4369.77, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 7.884}, "Preservação": {"MDV_6121.avi": {"size_mb": 8643.8469, "modified": "2019-01-14 08:28:30", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV022_Anna Karla Rodrigues Freira\\Audiovisual\\Preservação\\MDV_6121.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2433197.0, "duration": 2433.2, "resolution": "720x480", "fps": 29.97}, "MDV_6122.avi": {"size_mb": 7058.9325, "modified": "2019-01-14 09:23:20", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV022_Anna Karla Rodrigues Freira\\Audiovisual\\Preservação\\MDV_6122.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "  Maria Wilheim\\Imagens\\FGL_HV021_FT022.jpg", "category": "Image", "duration_ms": 0, "dimension": "1600x1200", "height": 1200, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1600x1200"}, "FGL_HV021_FT023.jpg": {"size_mb": 0.5339, "modified": "2009-07-22 15:18:20", "extension": "JPG", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV021_Ana Maria Wilheim\\Imagens\\FGL_HV021_FT023.jpg", "category": "Image", "duration_ms": 0, "dimension": "1600x1200", "height": 1200, "dpi": 72.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1600x1200"}, "folder_size_gb": 0.011}, "Textual": {"FGL_HV021_Ana Maria Wilheim_rev.doc": {"size_mb": 0.1367, "modified": "2019-03-25 10:23:16", "extension": "DOC", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV021_Ana Maria Wilheim\\Textual\\FGL_HV021_Ana Maria Wilheim_rev.doc", "category": "Textual"}, "FGL_HV021_Ana Maria Wilheim_rev.docx": {"size_mb": 0.0431, "modified": "2026-02-20 11:38:08", "extension": "DOCX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV021_Ana Maria Wilheim\\Textual\\FGL_HV021_Ana Maria Wilheim_rev.docx", "category": "Textual", "content_preview": "Dez Anos da Fundação Gol de Letra\nDepoimento de Ana Maria Wilheim\nEntrevistado por Nádia Lopes\nSão Paulo, 22/07/2009.\nRealização Museu da Pessoa\nEntrevista FGL_HV021\nTranscrito por Keila Barbosa\nRevisado por Gustavo Kazuo\nP/1 – Bom, pra começar, Ana, eu gostaria que você dissesse o seu nome completo, local e data de nascimento.\nR – Ana Maria Wilheim, nasci em São Paulo, em 15 de dezembro de 1957.\nP/1 – O nome dos seus pais?\nR – Jorge Wilheim e Joana Wilheim.\nP/1 – Você sabe a origem do seu nome?\nR – Os meus pais são imigrantes judeus europeus, meu pai veio de Trieste, de família austro-húngara, e minha mãe veio da Polônia. Então esse sobrenome tem uma origem, é um nome alemão, vem de Walheim, um vilarejo, na Alemanha.\nP/1 – Você sabe como eles se conheceram?\nR – Meus pais se conheceram no Brasil, em São Paulo, na adolescência, num grupo de pessoas da mesma origem, provavelmente.\nP/1 – Escola... você tem alguma história disso, que sua mãe teria contado?\nR – Meus pais... minha mãe estudou no Mackenzie, no colegial, enfim, foi... (tosse); e meu pai no Rio Branco, e eles se conheceram nesse grupo de amigos, enfim, grupo de amigos. Meu pai gostava muito de música, minha mãe não muito, m"}, "folder_size_gb": 0.0}, "Audiovisual": {"Acesso": {"FGL_HV021_Ana Maria Wilheim.mp4": {"size_mb": 14473.3741, "modified": "2022-02-05 07:46:12", "extension": "MP4", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV021_Ana Maria Wilheim\\Audiovisual\\Acesso\\FGL_HV021_Ana Maria Wilheim.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7561387.0, "duration": 7561.39, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 14.134}, "Preservação": {"MDV_6117.avi": {"size_mb": 8830.4391, "modified": "2019-01-11 10:07:58", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV021_Ana Maria Wilheim\\Audiovisual\\Preservação\\MDV_6117.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2443702.0, "duration": 2443.7, "resolution": "720x480", "fps": 29.97}, "MDV_6118.avi": {"size_mb": 9050.3438, "modified": "2019-01-11 10:56:18", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV021_Ana Maria Wilheim\\Audiovisual\\Preservação\\MDV_6118.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2504567.0, "duration": 2504.57, "resolution": "720x480", "fps": 29.97}, "MD 1 – Bom, boa tarde, Rosângela.\nR – Boa tarde.\nP/1 – Pra começar, você podia falar o seu nome completo, local e data de nascimento?\nR – Tá. O meu nome é Rosângela Batista Gangá, tenho 29 anos, minha data de nascimento, 25/11/79, São Paulo, capital. \nP/1 – Tá. E qual que é o nome dos seus pais?\nR – Roque Batista Gangá e Maura Rezende da Silva.\nP/1 – E o quê que eles fazem?\nR – A minha mãe é camelô e o meu pai do lar.\nP/1 – E você sabe como eles se conheceram, de onde que eles vêm?\nR – Meus pais vêm do interior de Minas, norte de Minas, né? Meu pai e minha mãe se conheceram na fazenda dos tios do meu pai, que a minha mãe era colona da fazenda do tio do meu pai. Aí se conheceram lá, tudo, mas só foram se envolver aqui em São Paulo.\nP/1 – Como é que foi isso? Por quê que eles vieram pra São Paulo?\nR – Atrás de emprego, né? Condições melhores de vida, né? Meu pai veio primeiro, tudo, minha mãe veio uns anos depois.\nP/1 – Tá e aí como é q"}, "folder_size_gb": 0.0}, "folder_size_gb": 43.063}, "FGL_HV019_Sebastião de Oliveira": {"Audiovisual": {"Acesso": {"FGL_HV019.mp4": {"size_mb": 10858.1236, "modified": "2019-02-12 10:06:10", "extension": "MP4", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV019_Sebastião de Oliveira\\Audiovisual\\Acesso\\FGL_HV019.mp4", "category": "Video", "dimension": "640x480", "height": 480, "aspect_ratio": "4:3 (SD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 11157813.0, "duration": 11157.81, "resolution": "640x480", "fps": 29.97}, "FGL_HV019_Sebastião de Oliveira.mp4": {"size_mb": 20653.3625, "modified": "2022-02-05 04:13:40", "extension": "MP4", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV019_Sebastião de Oliveira\\Audiovisual\\Acesso\\FGL_HV019_Sebastião de Oliveira.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "a ", "audio_codec": "PCM", "duration_ms": 2418850.0, "duration": 2418.85, "resolution": "720x480", "fps": 29.97}, "MDV_6113.avi": {"size_mb": 6697.7103, "modified": "2019-01-15 17:13:10", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV019_Sebastião de Oliveira\\Audiovisual\\Preservação\\MDV_6113.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1853518.0, "duration": 1853.52, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 40.06}, "folder_size_gb": 70.833}, "Textual": {"FGL_HV019.doc": {"size_mb": 0.1846, "modified": "2019-03-25 10:23:16", "extension": "DOC", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV019_Sebastião de Oliveira\\Textual\\FGL_HV019.doc", "category": "Textual"}, "FGL_HV019.docx": {"size_mb": 0.0541, "modified": "2026-02-20 11:38:16", "extension": "DOCX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV019_Sebastião de Oliveira\\Textual\\FGL_HV019.docx", "category": "Textual", "content_preview": "Dez anos da Fundação Gol de Letra\nDepoimento de Sebastião de Oliveira\nEntrevistada por Nádia Lopes e Ricardo Petroni \nSão Paulo, 01/07/2009.\nRealização Museu da Pessoa\nEntrevista FGL_HV019\nTranscrito por Karina Medici Barrella\nRevisado por Gustavo Kazuo\nP/1 – Senhor Oliveira, obrigada por ter aceitado o nosso convite. Pra começar, eu gostaria que o senhor dissesse o seu nome completo, o local e data de nascimento.\nR – Sou Sebastião de Oliveira Paes e a minha data de nascimento é 30 de dezembro de 1956. \nP/1 – Nasceu em que cidade?\nR – Nasci na cidade de Viçosa, no estado de Alagoas, uma cidade próxima à Maceió.\nP/1 – O nome dos seus pais.\nR – João Paes Neto e Josefa de Oliveira Paes.\nP/1 – Os seus pais também são de Alagoas?\nR – São de Alagoas.\nP/1 – Os dois da mesma cidade?\nR – Mesma cidade. O meu pai é descendente de paraguaio e a minha mãe de alemão.\nP/1 – Nossa! Você sabe a história deles? Como as famílias foram parar em Alagoas?\nR – Não, porque quando os meus avós vieram os meus pais eram pequenos. Os meus avós maternos e paternos eram irmãos. O pai do meu pai e o pai da minha mãe eram irmãos. Agora, a mãe do meu pai era descendente de paraguaio e o pai da minha mãe era descen"}, "folder_size_gb": 0.0}, "Imagens": {"FGL_HV019_FT004.jpg": {"size_mb": 0.1246, "modified": "2021-05-26 14:07:28", "extension": "JPG", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV019_Sebastião de Oliveira\\Imagens\\FGL_HV019_FT004.jpg", "category": "Image", "duration_ms": 0, "dimension": "704x702", "height": 702, "dpi": 200.0, "color_mode": "RGB", "duration": 0.0, "resolution": "704x702"}, "FGL_HV019_FT004.tif": {"size_mb": 2.0571, "modified": "2009-07-01 09:45:22", "extension": "TIF", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV019_Sebastião de Oliveira\\Imagens\\FGL_HV019_FT004.tif", "category": "Image", "duration_ms": 0, "dimension": "855x840", "height": 840, "dpi": 200.0, "color_mode": "RGB", "duration": 0.0, "resolution": "855x840"}, "FGL_HV019_Sebastião de Oliveira Paes.xlsx": {"size_mb": 0.0567, "modified": "2021-05-26 14:12:36", "extension": "XLSX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV019_Sebastião de Oliveira\\Imagens\\FGL_HV019_Sebastião de Oliveira Paes.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Nome da História | Nome dos personagens | Descrição | Palavras-chave (Tags) | Obs | Referências anteriores | local no acervo\nFGL_HV019_FT001 | Sebastião de Oliveira Paes | A árvore da Rua Antonio Portugal | 1976.0 | São Paulo | A esperança da Vila Albertina | Oliveira e Flávio (amigo de Oliveira) | Na antiga Rua Antonio Portugal na Vila Albertina existia uma árvores que os moradores adoravam subir como o Oliveira e seu amigo Flavio. Essa árvore foi derrubada em 1978 | árvore, ção Gol de Letra\nDepoimento de Raí de Oliveira \nEntrevistado por Márcia Ruiz e Camila Prado\nSão Paulo, 30/06/2009.\nRealização Museu da Pessoa \nEntrevista FGL_HV018\nTranscrito por Rosângela Maria Nunes Henriques\nRevisado por Gustavo Kazuo\nP/1 – Boa tarde, Raí.\nR – Boa tarde.\nP/1 – Pra iniciar eu queria que você dissesse seu nome completo, o local e a data de nascimento?\nR – Raí Sousa Vieira de Oliveira, eu nasci em Ribeirão Preto, interior de São Paulo no dia 15 de maio de 1965.\nP/1 – Qual é o nome dos seus pais?\nR – Raimundo Vieira de Oliveira, já falecido há uns cinco anos e Guiomar Sousa Vieira de Oliveira, minha mãe ainda mora em Ribeirão Preto.\nP/1 – Você chegou a conhecer seus avós?\nR – Eu tive pouco contato, eu conheci a minha avó por parte de mãe, mas ela morava em Belém do Pará e também faleceu quando eu era muito pequeno. E meu avô por parte do meu pai, Artur, que era de Fortaleza também, a gente se via nas férias e também eu devia ter uns doze anos quando ele faleceu assim, eu não tive muito contato com os avós não.\nP/1 – E seus pais nasceram em Fortaleza e Belém ou em Ribeirão Preto?\nR – O Sóstenes deve saber muito mais do que eu, porque de seis filhos e"}, "folder_size_gb": 0.0}, "folder_size_gb": 102.879}, "FGL_HV017_Tina Belíssimo": {"Audiovisual": {"Acesso": {"FGL_HV017.mp4": {"size_mb": 8445.5129, "modified": "2019-02-11 17:00:44", "extension": "MP4", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV017_Tina Belíssimo\\Audiovisual\\Acesso\\FGL_HV017.mp4", "category": "Video", "dimension": "640x480", "height": 480, "aspect_ratio": "4:3 (SD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 8584143.0, "duration": 8584.14, "resolution": "640x480", "fps": 29.97}, "FGL_HV017_Tina Belíssimo.mp4": {"size_mb": 15880.9611, "modified": "2022-02-05 01:50:24", "extension": "MP4", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV017_Tina Belíssimo\\Audiovisua 072", "height": 3072, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2048x3072"}, "FGL_HV017_MO001.jpg": {"size_mb": 1.4028, "modified": "2021-06-03 13:47:32", "extension": "JPG", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV017_Tina Belíssimo\\Imagens\\Making of Tina_Fotos MARCIA ZOET\\baixa resolução\\FGL_HV017_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "3072x2048", "height": 2048, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3072x2048"}, "folder_size_gb": 0.01}, "folder_size_gb": 0.151}, "folder_size_gb": 0.186}, "Textual": {"FGL_HV017 Cristina Belíssimo concluida.doc": {"size_mb": 0.1846, "modified": "2019-03-25 10:23:18", "extension": "DOC", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV017_Tina Belíssimo\\Textual\\FGL_HV017 Cristina Belíssimo concluida.doc", "category": "Textual"}, "FGL_HV017 Cristina Belíssimo concluida.docx": {"size_mb": 0.0477, "modified": "2026-02-20 11:38:20", "extension": "DOCX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV017_Tina Belíssimo\\Textual\\FGL_HV017 Cristina Belíssimo concluida.docx", "category": "Textual", "content_preview": "Dez Anos da Fundação Gol de Letra\nDepoimento de Cristina Bellíssimo \nEntrevistada por Cláudia Leonor e Camila Prado \nSão Paulo, 30/06/2009.\nRealização Museu da Pessoa \nEntrevista nº FGL_HV017\nTranscrito por Rosângela Maria Nunes Henriques.\nRevisado por Gustavo Kazuo\nP/1 – Então pra começar essa entrevista Tina, eu vou pedir pra você falar seu nome completo, o local e a data de nascimento?\nR – Eu me chamo Dirce Cristina Bellíssimo, eu nasci no dia 23 de julho de 1966, em Ribeirão Preto.\nP/1 – E o nome dos seus pais?\nR – Paulo Roberto Bellíssimo, já falecido e Aparecida Dirce de Aguiar Araújo.\nP/1 – E seu pai trabalhava com o quê? \nR – Meu pai tinha um restaurante e quando eu conheci, eu não sei se é por isso também que eu entrei no caminho, mas ele tinha restaurante, a família... Meus avós que vieram da Itália, o meu avô tinha um hotel, então foi assim que eles chegaram em Ribeirão.\nP/1 – E o que você sabe desses avós? O nome deles? Como eles chegaram aqui no Brasil, você sabe dessa história?\nR – Eu não sei de tudo, porque eu perdi meu avô cedo, eu perdi meu avô com oito anos, era um dos que pra mim foi uma super perda porque eu era neta predileta, então morreu o meu avô que me papa"}, "folder_size_gb": 0.0}, "folder_size_gb": 55.216}, "FGL_HV016_Sóstenes Brasileiro de Oliveira": {"Audiovisual": {"Acesso": {"FGL_HV016.mp4": {"size_mb": 9244.6349, "modified": "2019-02-11 15:41:22", "extension": "MP4", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV016_Sóstenes Brasileiro de Oliveira\\Audiovisual\\Acesso\\FGL_HV016.mp4", "category": "Video", "dimension": "640x480", "height": 480, "aspect_ratio": "4:3 (SD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 9338196.0, "duration": 9338.2, "resolution": "640x480", "fps": 29.97}, "FGL_HV016_Sóstenes Brasileiro de Oliveira.mp4": {"size_mb": 17519.7374, "modified": "2022-02-04 23:33:08", "extension": "MP4", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV016_Sóstenes Brasileiro de Oliveira\\Audiovisual\\Acesso\\FGL_HV016_Sóstenes Brasileiro de Oliveira.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 9344401.0, "duration": 9344.4, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 26.137}, "Preservação": {"MDV_6094.avi": {"size_mb": 8811.2875, "modified": "2019-01-11 14:17:24", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV016_Sóstenes Brasileiro de Oliveira\\Audiovisual\\Preservação\\MDV_6094.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps \\Imagens\\Making of Sóstenes_Fotos MARCIA ZOET\\baixa resolução\\FGL_HV016_MO009.jpg", "category": "Image", "duration_ms": 0, "dimension": "3072x2048", "height": 2048, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3072x2048"}, "folder_size_gb": 0.009}, "folder_size_gb": 0.167}, "folder_size_gb": 0.21}, "Textual": {"FGL_HV016_Sóstenes Brasileiro_REV.docx": {"size_mb": 0.1066, "modified": "2019-03-25 10:23:18", "extension": "DOCX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV016_Sóstenes Brasileiro de Oliveira\\Textual\\FGL_HV016_Sóstenes Brasileiro_REV.docx", "category": "Textual", "content_preview": "Dez anos da Fundação Gol de Letra\nEntrevista de Sóstenes Brasileiro Sampaio de Souza Vieira de Oliveira\nEntrevistado por  Nádia Lopes e Camila Prado\nSão Paulo, 29/06/2009\nEntrevista número: FGL_HV016 \nRealização: Museu da Pessoa\nTranscrito por Tereza Ruiz\nRevisado por Luiza Gallo Favareto \nP/1 – Sóstenes, a gente começa com uma identificação. Então por favor, teu nome inteiro, data de nascimento, local de nascimento.\nR – Sóstenes Brasileiro Sampaio de Souza Vieira de Oliveira, nascido em 23 de março de 55, em Belém do Pará.\nP/1 – E o nome dos seus pais.\nR – Meu pai é Raimundo Vieira de Oliveira, minha mãe Guiomar Souza Vieira de Oliveira.\nP/1 – Você sabe a história do seu nome?\nR – A história do meu nome... Meu pai tava estudando a Literatura grega, na época, e quis pôr o nome. Tem uma coisa que a gente sempre brincava, que nordestino gosta de pôr nome diferente, porque sempre acha que o filho vai ser alguma coisa. E no caso dele teve dois filhos famosos. Então é uma brincadeira. E aí o nome grego, né? E o nome muito comprido é o meu e do Sócrates, que são os dois primeiros, os mais velhos, depois ele mudou, aí fez os nomes mais curtos. Mais aí ele quis por Sócrates, Sóstenes, Bras"}, "folder_size_gb": 0.0}, "folder_size_gb": 62.008}, "FGL_HV015_Vera Lúcia Zanuto": {"Audiovisual": {"Acesso": {"FGL_HV015_Vera Lúcia Za on": "2048x3072", "height": 3072, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2048x3072"}, "FGL_HV015_MO001.jpg": {"size_mb": 1.0108, "modified": "2021-06-25 17:16:26", "extension": "JPG", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV015_Vera Lúcia Zanuto\\Imagens\\Making of\\baixa resolução\\FGL_HV015_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "3072x2048", "height": 2048, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3072x2048"}, "FGL_HV015_MO002.jpg": {"size_mb": 1.2656, "modified": "2021-06-25 17:17:38", "extension": "JPG", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV015_Vera Lúcia Zanuto\\Imagens\\Making of\\baixa resolução\\FGL_HV015_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "2048x3072", "height": 3072, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2048x3072"}, "folder_size_gb": 0.011}, "folder_size_gb": 0.169}, "folder_size_gb": 0.216}, "Textual": {"FGL_HV015_Vera Lucia Zanotto_REV.docx": {"size_mb": 0.0442, "modified": "2019-03-25 10:23:18", "extension": "DOCX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV015_Vera Lúcia Zanuto\\Textual\\FGL_HV015_Vera Lucia Zanotto_REV.docx", "category": "Textual", "content_preview": "Dez Anos da Fundação Gol de Letra\nDepoimento de Vera Lucia Zanotto\nEntrevistada por Nádia Lopes e Ricardo Pedroni\nSão Paulo, 29/06/2009\nRealização: Museu da Pessoa\nEntrevista número: FGL_HV015\nTranscrita por Vanuza Ramos\nRevisado por Luiza Gallo Favareto\nP/1 – Bom dia, Vera. \n\nR – Bom dia. \n\nP/1 – Obrigada por você ter aceitado o nosso convite para a entrevista. Pra começar eu queria que você dissesse seu nome completo, local e data de nascimento. \n\nR – Vera Lucia Zanotto. Eu nasci na cidade de Piquete, tenho 52 anos de muita luta nos nossos projetos, estou aí a disposição de vocês. \n\nP/1 – Só pra registrar, qual é a data de nascimento? \n\nR – Treze do dois de 58. \n\nP/1 – O nome dos seus pais? \n\nR – José Pereira da Silva e Elizabete (Fatori?) Pereira. \n\nP/1 – Qual é a atividade profissional dos seus pais? \n\nR – Meu pai é militar, falecido já, e minha mãe dona de casa. \n\nP/1 – Seus pais são de Piquete mesmo? \n\nR – Não, meu pai veio do Nordeste, de Alagoas. E a minha mãe do interior de São Paulo, Penápolis. \n\nP/1 – Você sabe a história deles, como eles se encontraram? \n\nR – Meu pai sendo militar, ele andou muito. A minha mãe tinha família no Rio de Janeiro, então meu pai foi transferi"}, "folder_size_gb": 0.0}, "folder_size_gb": 31.132}, "FGL_HV027_Leonardo Nascimento de Araujo": {"Textual": {"FGL_HV027_Leonardo-Nascimento-de-Araújo_REV.docx": {"size_mb": 0.0403, "modified": "2019-03-25 10:23:16", "extension": "DOCX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV027_Leonardo Nascimento de Araujo\\Textual\\FGL_HV027_Leonardo-Nascimento-de-Araújo_REV.docx", "category": "Textual", "content_preview": "Dez anos da Fundação Gol de Letra\nDepoimento de Leonardo Nascimento de Araújo\nEntrevistado por Jurema Carvalho\nMilão, 04/11/2009\nRealização: Museu da Pessoa\nEntrevista nº FGL_HV027\nTranscrito por Karina Medici Barrella\nRevisado por Genivaldo Cavalcanti Filho\nP/1 – Primeira coisa, você tem que se identificar: nome completo, local, data de nascimento, e nome dos seus pais.\nR – Nome dos meus pais também?\nP/1 – Também.\nR – Leonardo Nascimento de Araújo, nasci em cinco de setembro de 1969, em Niterói, Rio de Janeiro. Filho de Francisco Reis Viana de Araújo e Aurélia Nascimento de Araújo.\nP/1 – O que você lembra da origem dos seus pais? Eles vem de onde, são brasileiros mesmo?\nR – A origem é muito variada. A minha mãe é filha de um português. Meu avô era português, nascido em Portugal e migrado pro Brasil, casado com minha avó que tem ascendência nordestina, acho que não tem ascendência europeia, pelo menos perto da sua geração. E o meu pai também, filho de cearenses com ascendência espanhola, mas muito mais distante. Então tenho um pouco de ascendência portuguesa e espanhola, e o nordeste tanto da nossa vida.\nP/1 – Você conviveu com seus avós?\nR – Os meus avós paternos, sim, sempre. Inf"}, "folder_size_gb": 0.0}, "Audiovisual": {"Acesso": {"FGL_HV027_Leonardo Nascimento de Araujo.mp4": {"size_mb": 9689.4667, "modified": "2022-02-15 18:40:34", "extension": "MP4", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV027_Leonardo Nascimento de Araujo\\Audiovisual\\Acesso\\FGL_HV027_Leonardo Nascimento de Araujo.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5243172.0, "duration": 5243.17, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 9.462}, "Preservação": {"MDV_6138.mov": {"size_mb": 10954.3733, "modified": "2019-01-15 09:28:42", "extension": "MOV", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV027_Leonardo Nascimento de Araujo\\Audiovisual\\Preservação\\MDV_6138.mov", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3011776.0, "duration": 3011.78, "resolution": "720x480", "fps": 29.97}, "MDV_6139.avi": {"size_mb": 8817.1979, "modified": "2022-02-15 11:56:28", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV027_Leonardo Nascimento de Araujo\\Audiovisual\\Preservação\\MDV_6139.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2440113.0, "duration": 2440.11, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 19.308}, "folder_size_gb": 28.771}, "folder_size_gb": 28.771}, "RETRATOS - MARCIA ZOET": {"depoentes": {"não identificado": {"gol0
