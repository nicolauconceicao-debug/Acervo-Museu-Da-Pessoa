\nR – Meu nome é Gilmara Ferreira da Silva. Nasci no dia sete de setembro... Não! Nove de julho de 1980, em Diadema.\nP/1 – Fala um pouquinho de seus pais.\nR – Minha mãe, que… Aliás, não era minha mãe, mas como meu pai falou que era uma história muito demorada de contar, ele contou só um pedaço. Ele falou que essa mulher, a mãe dos meus irmãos, falou que me adotou. Eu estou achando que é mentira. Minha mãe verdadeira, estou achando que é ela. \nP/1 – E qual o nome dela?\nR – Minha mãe? Neide. \nP/1 – E o nome de seu pai?\nR - Meu pai era Pacheco, mas infelizmente o perdi com sete anos.\nP/1 – E quantos irmãos você tem?\nR – Nós somos em doze, mas como moramos longe a gente fica uma separada da outra.  Como eu moro pra cá e as outras moram lá, [isso] nos distanciou. \nP/1 - Conta pra gente. Seu pai, qual era a profi"}, "folder_size_gb": 0.0}, "folder_size_gb": 6.135}, "ARTCID_HV006_Marcos Rogério da Silva": {"Audiovisual": {"Acesso": {"ARTCID_HV006_Marcos Rogério da Silva.mp4": {"size_mb": 262.8789, "modified": "2021-07-21 13:48:42", "extension": "MP4", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV006_Marcos Rogério da Silva\\Audiovisual\\Acesso\\ARTCID_HV006_Marcos Rogério da Silva.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1288788.0, "duration": 1288.79, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 0.257}, "Preservação": {"MP_0437.avi": {"size_mb": 4960.2082, "modified": "2008-05-09 15:46:46", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV006_Marcos Rogério da Silva\\Audiovisual\\Preservação\\MP_0437.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1372546.0, "duration": 1372.55, "resolution": "720x480", "fps": 29.97 Gilson, fala um pouco sobre seus pais, o nome deles. De onde eles são?\nR - Os meus pais são lá de Minas, eu já sou daqui de São Paulo.\nP/1 - Qual é o nome do seu pai?\nR - Francisco Rodrigues Pereira.\nP/1 - E a sua mãe?\nR - Edneia Santos.\nP/1 - Conte um pouco, seu pai fazia o quê?\nR - É caminhoneiro. Hoje em dia ele pegou diabetes e afetou a vista dele, é cego, aposentado. E a minha mãe é empregada doméstica. Perdi minha mãe, já.\nP/1 - Ela já é falecida? E você sabe porque eles vieram aqui para São Paulo?\nR - Vieram porque lá não tinham condições, então vieram pra tentar alguma coisa aqui e depois não deram certo, brigaram. Alguns irmãos se separaram, todo mundo se separou e comecei a ficar na rua.\nP/1 - Você tem quantos irmão"}, "folder_size_gb": 0.0}, "folder_size_gb": 16.2}, "ARTCID_HV012_Carla Cristina Perillo": {"Audiovisual": {"Acesso": {"ARTCID_HV012_Carla Cristina Perillo.mp4": {"size_mb": 747.4626, "modified": "2021-07-21 15:00:20", "extension": "MP4", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV012_Carla Cristina Perillo\\Audiovisual\\Acesso\\ARTCID_HV012_Carla Cristina Perillo.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3659022.0, "duration": 3659.02, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 0.73}, "corrompido": {"MP_0441.avi": {"size_mb": 0.0, "modified": "2022-04-07 15:19:41", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV012_Carla Cristina Perillo\\Audiovisual\\corrompido\\MP_0441.avi", "category": "Video", "duration_ms": 0, "duration": 0.0}, "folder_size_gb": 0.0}, "Preservação": {"MP_0441.avi": {"size_mb": 13283.1248, "modified": "2008-05-09 17:00:22", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV012_Carla Cristina Perillo\\Audiovisual\\Preservação\\MP_0441.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3675782.0, "duration": 3675.78, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 12.972}, "folder_size_gb": 13.702}, "Textual": {"ARTCID_HV012_REV.docx": {"size_mb": 0.0346, "modified": "2019-03-25 10:31:14", "extension": "DOCX", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV012_Carla Cristina Perillo\\Textual\\ARTCID_HV012_REV.docx", "category": "Textual", "content_preview": "Arte Cidade\nDepoimento de Carla Cristina Perillo\nEntrevistada por Rosali Henriques e Karen Worcman\nSão Paulo, 16/05/1999\nRealização: Museu da Pessoa\nEntrevista n° ARTCID_HV012\nTranscrito por Marília Eira Velha\nRevisado por Genivaldo Cavalcanti Filho\nP/1 - Carla, então vamos começar a entrevista com você falando para a gente seu nome, quando e onde você nasceu.\nR- Meu nome é Carla Cristina Perillo. Eu nasci na Vila Alpina no dia 27 de maio de 1983.\nP/1 - Nasceu a pouquinho tempo atrás, né?\nR - Sim. (risos)\nP/1 - E onde fica a Vila Alpina?\nR - Onde fica?\nP/1 - Fica perto de que bairro, onde é? Fica no centro?\nR- Ali perto do Parque São Lucas, conhece? Ali pertinho.\nP/1- E como é o nome da sua mãe e do seu pai?\nR - É Alba Ferreti Perillo e, do meu pai, Carlos Alberto Perillo.\nP/1- Você tem muitos irmãos?\nR - Tenho dois irmãos.\nP/1- Como eles se chamam?\nR - Leandro Perillo e Carlos Tomás Perillo.\nP/1 - Você lembra da casa que você nasceu, como é que era?\nR - Ah, eu lembro porque aquela casa era própria. A gente morava com a minha avó. Era uma casona e tinha várias casas no quintal também. Era grandona, a casa.\nP/1 - E a sua avó, como é que se chamava?\nR - Maria Antônia Perillo.\nP/1- Vo"}, "folder_size_gb": 0.0}, "folder_size_gb": 13.702}, "ARTCID_HV015_Franco Mikuletic": {"Audiovisual": {"Acesso": {"ARTCID_HV015_Franco Mikuletic.mp4": {"size_mb": 12628.585, "modified": "2022-03-24 15:37:24", "extension": "MP4", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV015_Franco Mikuletic\\Audiovisual\\Acesso\\ARTCID_HV015_Franco Mikuletic.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6507168.0, "duration": 6507.17, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 12.333}, "Preservação": {"MDV_3438.avi": {"size_mb": 8776.5606, "modified": "2018-11-21 17:05:46", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV015_Franco Mikuletic\\Audiovisual\\Preservação\\MDV_3438.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2428826.0, "duration": 2428.83, "resolution": "720x480", "fps": 29.97}, "MDV_3439.avi": {"size_mb": 9030.0949, "modified": "2018-11-21 17:55:36", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV015_Franco Mikuletic\\Audiovisual\\Preservação\\MDV_3439.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2498996.0, "duration": 2499.0, "resolution": "720x480", "fps": 29.97}, "MDV_3440.avi": {"size_mb": 5696.8922, "modified": "2018-11-21 18:23:48", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV015_Franco Mikuletic\\Audiovisual\\Preservação\\MDV_3440.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1576542.0, "duration": 1576.54, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 22.953}, "folder_size_gb": 35.285}, "Textual": {"ARTCID_HV015_REV.docx": {"size_mb": 0.0515, "modified": "2019-03-18 12:28:06", "extension": "DOCX", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV015_Franco Mikuletic\\Textual\\ARTCID_HV015_REV.docx", "category": "Textual", "content_preview": "Projeto Arte Cidade\nDepoimento de Franco Mikulevic\nEntrevistado por José Santos e Rosali Henriques\nSão Paulo, 16/05/1999\nRealização: Museu da Pessoa\nEntrevista n.º ARTCID_HV015\nRevisado por Genivaldo Cavalcanti Filho\nP/1 – Boa tarde, seu Franco.\nR – Boa tarde.\nP/1 – Queria começar a entrevista pedindo que o senhor falasse seu nome completo.\nR – Eu me chamo Franco Mikuletic.\nP/1 – E o senhor nasceu onde? Em que data?\nR – Eu nasci em 25 de outubro de 1933, na cidade de Ilirska Bistrica, [que] se localiza na Eslovênia, entre vinte quilômetros de Trieste e 34 de Rijeka, antiga Fiume.\nP/1 – E o senhor se lembra do nome completo de seus pais e da sua mãe?\nR – Meu pai se chamava José Mikuletic e minha mãe chamava-se Carolina Bastiancic Mikuletic.\nP/1 – E o senhor conheceu seus avós?\nR – Conheci bastante meus avós. Meu avô era mais _______. Ele viajava e de vez em quando eu ia de carona, na charrete dele. Ele viajava por toda aquela redondeza, porque era o único médico que tinha naquela região, na época; talvez a cada mil quilômetros tinha um médico. Ele era do exército da Áustria e pelo bem da população eles cediam para assistir parturiente, cavalos, vacas; tudo que era vivo na redondeza"}, "folder_size_gb": 0.0}, "folder_size_gb": 35.285}, "ARTCID_HV018_Antônio Tómas": {"Textual": {"ARTCID_HV018_REV.docx": {"size_mb": 0.0423, "modified": "2019-03-26 12:17:26", "extension": "DOCX", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV018_Antônio Tómas\\Textual\\ARTCID_HV018_REV.docx", "category": "Textual", "content_preview": "Arte Cidade\nDepoimento de Antônio Tomaz da Silva\nEntrevistado por Karen Worcman e Ricardo Guanabara\nSão Paulo, 18/05/1999\nRealização: Museu da Pessoa\nEntrevista nº ARTCID_HV018\nTranscrito por Valéria Peixoto de Alencar\nRevisado por Genivaldo Cavalcanti Filho\nP/1 – Vamos começar a entrevista?\nR – Vamos.\nP/1 – Então deixe-me perguntar o seu nome e onde e quando você nasceu.\nR – O meu nome é Antônio Tomaz da Silva. Eu nasci na Paraíba, numa cidade por nome de Pocinha, no ano de 1952, no dia sete de dezembro.\nP/1 – Essa cidade fica perto de onde? Ela é no litoral ou é no interior?\nR – Ela é no interior. Não é bem no interior, ela fica próximo à cidade de Campina Grande. Fica a alguns quilômetros, mas fica próximo.\nP/1 – É uma cidade grande ou pequena?\nR – Ela é uma cidade pequena, mas bem industrializada, entende? Na época, ela tinha muitos movimentos de um produto chamado sisal, que eles produzem. Ela é pequena, mas é muito movimentada.\nP/1 – Como é o nome do seu pai e da sua mãe?\nR - O nome do pai é Aprígio Tomaz da Silva.\nP/1 – Aprígido?\nR – Aprígio Tomaz da Silva.\nP/1 – E de sua mãe?\nR – Maria Alves da Conceição.\nP/1 – Quantos irmãos você tinha?\nR – Onze irmãos.\nP/1 - ‘Alagoas’, co"}, "folder_size_gb": 0.0}, "Audiovisual": {"Acesso": {"ARTCID_HV018_Antônio Tómas.mp4": {"size_mb": 9786.4431, "modified": "2022-03-24 18:18:14", "extension": "MP4", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV018_Antônio Tómas\\Audiovisual\\Acesso\\ARTCID_HV018_Antônio Tómas.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5184480.0, "duration": 5184.48, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 9.557}, "Preservação": {"MDV_3429.avi": {"size_mb": 1696.4899, "modified": "2022-03-25 12:11:38", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV018_Antônio Tómas\\Audiovisual\\Preservação\\MDV_3429.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 469436.0, "duration": 469.44, "resolution": "720x480", "fps 70 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1293959.0, "duration": 1293.96, "resolution": "720x480", "fps": 29.97}, "MDV_3432.avi": {"size_mb": 9024.4296, "modified": "2018-11-26 08:43:46", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV019_Daniel Ribeiro dos Santos\\Audiovisual\\Preservação\\MDV_3432.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2497425.0, "duration": 2497.43, "resolution": "720x480", "fps": 29.97}, "MDV_3444.avi": {"size_mb": 1018.5537, "modified": "2018-11-23 10:46:28", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV019_Daniel Ribeiro dos Santos\\Audiovisual\\Preservação\\MDV_3444.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 281815.0, "duration": 281.81, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 14.374}, "folder_size_gb": 20.903}, "Textual": {"ARTCID_HV019_dec.docx": {"size_mb": 0.0079, "modified": "2018-09-25 07:57:44", "extension": "DOCX", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV019_Daniel Ribeiro dos Santos\\Textual\\ARTCID_HV019_dec.docx", "category": "Textual", "content_preview": "Daniel Ribeiro dos Santos - 18 de maio de 1999\nEntrevistado por Karen Worckman.\nNascido em 5 de setembro de 1972 Coaraci, Bahia.\n00:25 - Apresentação.\n01:10 - Coaraci é uma cidade pequena, com 200 mil pessoas. Lá na bahia, meu pai era comerciante e minha mãe era doméstica.\n02:55 - Meus irmãos são por parte de mãe, eu não vivia com meu pai.\n04:05 - Meu pai não queria que eu morasse com minha mãe, ele achava que eu não era filho dele. Ele me deixou numa casa de uma família para tomar conta de mim. Minha mãe ficou sabendo disso aí. Ela foi junto com meu tio e me achou dentro de uma caixa, sem tomar banho.\n07:48 - Fui morar com minha avó. Era uma casa de barro. Morava bastante gente na casa. minha mãe arrumou uma casa e fui morar com ela. Minha irmã é quem cuidava de mim. Ela chegava até a apanhar por causa de mim.\n09:44 - Minha mãe era brava demais, batia na gente. O pessoal de lá é assim, baste mesmo, geralmente eles usavam aquelas palmatórias. Eu brigava com os outros meninos do colégio, jogava pedra na casa dos outros. Minha mãe batia mesmo, sem pena.\n13:07 - Nós viemos todo mundo para São Paulo. Ficamos na casa da amiga da minha mãe.\n15:20 - Para mim não faltava nada, mas minha mã"}, "ARTCID_HV019_REV.docx": {"size_mb": 0.0642, "modified": "2019-03-25 10:55:54", "extension": "DOCX", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV019_Daniel Ribeiro dos Santos\\Textual\\ARTCID_HV019_REV.docx", "category": "Textual", "content_preview": "Arte Cidade\nDepoimento de Daniel Ribeiro dos Santos\nEntrevistado por Karen Worcman e Marina D’Andrea\nSão Paulo, 18/05/1999\nEntrevista n.º ARTCID_HV019\nRealização: Museu da Pessoa\nTranscrito por Neuza Guerreiro de Carvalho\nRevisado por Genivaldo Cavalcanti Filho\nP/1 – Daniel, vamos começar a entrevista perguntando seu nome completo e o lugar em que você nasceu.\nR - O meu nome é Daniel Ribeiro dos Santos e o local é Coaraci, Bahia.\nP/1 – E quando você nasceu?\nR – [Em] cinco de Setembro de 1972.\nP/1 – Como era o nome de seus pais?\nR – José Ribeiro dos Santos e Maria Lúcia Alves.\nP/1 – Você tem muitos irmãos?\nR – Eu tenho dois irmãos: uma irmã e um irmão.\nP/1 – Como eles se chamam?\nR - Chamam-se Marcos Roberto dos Santos e Kátia Cilene Alves.\nP/1 – Todo mundo nasceu lá na Bahia?\nR – Todos.\nP/1 – Como era sua cidade, Coaraci?  Era cidade grande?\nR – Era cidade pequena. Cerca de cem, duzentas mil pessoas. \nP/1 – Trezentas mil pessoas?\nR - Não. Duzentas mil pessoas.\nP/1 – Ela fica perto de...\nR – Perto de Itabuna, Ilhéus. É [no] sul da Bahia.\nP/1 – Ela é perto da praia?\nR – Não. Ela fica... Não é perto. Dá uma hora e meia de um local que [se] chama Ilhéus, que é o local que tem praia.\nP/1"}, "folder_size_gb": 0.0}, "folder_size_gb": 20.903}, "ARTCID_HV004_Rosa Rinaldi dos Santos": {"Textual": {"ARTCID_HV004_REV.docx": {"size_mb": 0.0242, "modified": "2019-02-25 08:38:50", "extension": "DOCX", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV004_Rosa Rinaldi dos Santos\\Textual\\ARTCID_HV004_REV.docx", "category": "Textual", "content_preview": "Arte Cidade\nDepoimento de Rosa Rinaldi dos Santos\nEntrevistado por Marina D’Andrea e Rosali Henriques\nSão Paulo, 13/05/1999\nRealização: Museu da Pessoa\nEntrevista nº ARTCID_HV003\nTranscrito por Fernando M. C. Ferraz\nRevisado por Genivaldo Cavalcanti Filho \nP/1 - Vamos começar. Qual é o seu nome completo, por favor, e a sua idade?\nR - Rosa Rinaldi dos Santos.\nP/1 - Dia do nascimento?\nR - Sete de agosto de 1899.\nP/1 - Muito bem, e o nome dos seus pais?\nR - Caetano Rinaldi e minha mãe, Maria Prandi.\nP/1 - Eles são italianos?\nR - É.\nP/1 - Onde eles nasceram?\nR - Ele em Ferrara e ela em Roma.\nP/1 - E quando eles vieram para o Brasil, a senhora sabe?\nR - A minha mãe tinha dezoito anos e o meu pai tinha trinta.\nP/1 - E eles casaram lá na Itália?\nR - Aqui. Casaram na cidade de Itapira.\nP/1 - E depois vieram pra São Paulo?\nR - Sempre moraram aqui. Meu pai… Todos nós, nunca saímos de São Paulo.\nP/1 - E de Itapira vieram pra São Paulo?\nR- Vieram pra São Paulo.\nP/1 - Em que bairro?\nR - Foi no bairro da Barra Funda, onde eu nasci.\nP/1 - A senhora tem muitos irmãos?\nR - Somos dez.\nP/1 - Nossa, quantos!\nR - Mas já morreu quase tudo.\nP/1 - Não tem nenhum vivo ainda?\nR - Tem três, da minha parte tr"}, "folder_size_gb": 0.0}, "Audiovisual": {"Preservação": {"MP_0435.avi": {"size_mb": 11111.1385, "modified": "2008-05-09 15:19:14", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV004_Rosa Rinaldi dos Santos\\Audiovisual\\Preservação\\MP_04 is, como eles eram?\nR – Ah, não lembro assim. Meu pai é um senhor moreno, 1,73 de"}, "folder_size_gb": 0.0}, "folder_size_gb": 12.384}, "ARTCID_HV003_Katarina Kemeter Vidmar": {"Audiovisual": {"Acesso": {"ARTCID_HV003_Katarina Kemeter Vidmar.mp4": {"size_mb": 7763.4744, "modified": "2022-03-22 20:24:44", "extension": "MP4", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV003_Katarina Kemeter Vidmar\\Audiovisual\\Acesso\\ARTCID_HV003_Katarina Kemeter Vidmar.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4020183.0, "duration": 4020.18, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 7.582}, "Preservação": {"MDV_3448.avi": {"size_mb": 9167.8048, "modified": "2018-11-23 08:47:36", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV003_Katarina Kemeter Vidmar\\Audiovisual\\Preservação\\MDV_3448.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2537102.0, "duration": 2537.1, "resolution": "720x480", "fps": 29.97}, "MDV_3449.avi": {"size_mb": 5629.5011, "modified": "2018-11-23 09:13:52", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV003_Katarina Kemeter Vidmar\\Audiovisual\\Preservação\\MDV_3449.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1557888.0, "duration": 1557.89, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 14.45}, "folder_size_gb": 22.032}, "Textual": {"ARTCID_HV003_REV.docx": {"size_mb": 0.0304, "modified": "2019-02-25 09:04:30", "extension": "DOCX", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV003_Katarina Kemeter Vidmar\\Textual\\ARTCID_HV003_REV.docx", "category": "Textual", "content_preview": "Arte Cidade\nDepoimento de Katarina Kemeter Vidmar\nEntrevistado por Rosali Henriques e André Goldman\nSão Paulo, 13/05/1999\nRealização: Museu da Pessoa\nEntrevista nº ARTCID_HV003\nTranscrito por Viviena da Silveira Oliveira\nRevisado por Genivaldo Cavalcanti Filho\nP/1 – Dona Katarina, a gente queria começar esta entrevista com a senhora dizendo o seu nome completo, local e data de nascimento.\nR - Meu nome é Katarina Kemeter Vidmar. Nasci em quatro de abril de 1936, na cidade de Lacarak, na época era [na] Croácia.\nP/1 – Qual é o nome de seus pais?\nR – Meu pai se chamava Stuepan Kemeter e minha mãe, Elizabeta Kemeter.\nP/1 – O lugar que a senhora nasceu era Croácia. E agora não é mais?\nR – Não, porque os sérvios tomaram essa parte e se tornou Iugoslávia.\nP/1 – E atualmente é Iugoslávia ainda?\nR – Atualmente é Iugoslávia.\nP/1 – Dona Katarina, a origem de sua família sempre foi daquela região?\nR – Sim, nós somos croatas. A minha mãe é de ascendência alemã. No tempo dos Habsburgos a família dela migrou para Croácia, depois ela casou-se com meu pai, que era croata. Ela também se considerava croata, pois tinha nascido ali, os pais dela tinham nascido na Croácia, então somos de origem croata.\nP"}, "folder_size_gb": 0.0}, "folder_size_gb": 22.032}, "ARTCID_HV007_Rogério Tales da Silva": {"Audiovisual": {"Acesso": {"ARTCID_HV007_Rogério Tales da Silva.mp4": {"size_mb": 3655.6606, "modified": "2022-03-22 19:12:24", "extension": "MP4", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV007_Rogério Tales da Silva\\Audiovisual\\Acesso\\ARTCID_HV007_Rogério Tales da Silva.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1890689.0, "duration": 1890.69, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 3.57}, "Preservação": {"MDV_3456.avi": {"size_mb": 6843.2548, "modified": "2018-11-22 09:39:18", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV007_Rogério Tales da Silva\\Audiovisual\\Preservação\\MDV_3456.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1893792.0, "duration": 1893.79, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 6.683}, "folder_size_gb": 10.253}, "Textual": {"ARTCID_HV007_REV.docx": {"size_mb": 0.0222, "modified": "2019-03-07 11:14:42", "extension": "DOCX", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV007_Rogério Tales da Silva\\Textual\\ARTCID_HV007_REV.docx", "category": "Textual", "content_preview": "Projeto Arte Cidade\nDepoimento de Rogério Tales da Silva\nEntrevistado por Rosali Henriques e André Goldman\nSão Paulo, 14/05/1999\nRealização: Museu da Pessoa\nEntrevista nº ARTCID_HV007\nTranscrito por Nivaldo Alexandre de Freitas\nRevisado por Genivaldo Cavalcanti Filho\nP/1 - Seu Rogério, nós gostaríamos de começar a entrevista com o senhor falando o seu nome completo, local e a data de nascimento.\nR - Meu nome é Rogério Tales da Silva. Nasci em 27 de Setembro de 1938 na cidade de Ilhéus, Bahia.\nP/1 - Seus pais são da Bahia também, seu Rogério?\nR - São, mas são falecidos.\nP/1 - Qual o nome dos seus pais?\nR - Roberto da Silva e Rosana Tales da Silva.\nP/1 - O senhor sabe quais as atividades que eles faziam lá na Bahia?\nR - Bom, ele era metalúrgico e a minha mãe era costureira.\nP/1 - Conte para a gente um pouco da sua infância.\nR - Eu fui da Bahia para o Rio de Janeiro com um ano. Com sete anos a minha irmã me colocou no (San?) e de lá eu saí para o sul de Minas, [para] uma escola de padres. Em 74 eu fugi e fiquei perambulando, fui recolhido novamente em 79 e já era [na] Funabem [Fundação Nacional do Bem-Estar do Menor]. Nesse ínterim, eu fui para a Escola de Marinheiros de Vila Velha. F"}, "folder_size_gb": 0.0}, "folder_size_gb": 10.253}, "ARTCID_HV009_José Cavalcante de Araújo": {"Audiovisual": {"Acesso": {"ARTCID_HV009_José Cavalcante de Araújo.mp4": {"size_mb": 7311.5245, "modified": "2022-03-22 18:25:20", "extension": "MP4", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV009_José Cavalcante de Araújo\\Audiovisual\\Acesso\\ARTCID_HV009_José Cavalcante de Araújo.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3768765.0, "duration": 3768.76, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 7.14}, "Preservação": {"MDV_3446.avi": {"size_mb": 9272.2084, "modified": "2018-11-22 11:12:30", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV009_José Cavalcante de Araújo\\Audiovisual\\Preservação\\MDV_3446.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2565998.0, "duration": 2566.0, "resolution": "720x480", "fps": 29.97}, "MDV_3447.avi": {"size_mb": 4948.798, "modified": "2018-11-22 11:35:26", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV009_José Cavalcante de Araújo\\Audiovisual\\Preservação\\MDV_3447.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1369502.0, "duration": 1369.5, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 13.888}, "folder_size_gb": 21.028}, "Textual": {"ARTCID_HV009_REV.docx": {"size_mb": 0.0453, "modified": "2019-07-17 08:47:32", "extension": "DOCX", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV009_José Cavalcante de Araújo\\Textual\\ARTCID_HV009_REV.docx", "category": "Textual", "content_preview": "Depoimento de José Cavalcanti de Araújo\nEntrevistado por Karen Worcman e Marta Souza Santos\nSão Paulo, SESC Belenzinho, 14 de maio de 1999.\nRealização Museu da Pessoa\nEntrevista 009\nTranscrito por Ana Lúcia Queiroz\nRevisado por Carolina Cervera Faria\nP/1 – Então vamos lá, senhor Cavalcanti. Vamos começar a entrevista perguntando seu nome e o lugar em que o senhor nasceu.\nR – Tá bom... \nP/1 – Tá, o senhor conta para gente?\nR - Pode falar?\nP/1 – Então, o senhor diz para gente seu nome e o lugar em que o senhor nasceu?\nR – É José Cavalcanti de Araújo. \nP/1 – E o senhor nasceu aonde?\nR - Nasci em Mombaça, no estado do Ceará.\nP/1 – Que ano, o senhor lembra?\nR – 1939.\nP/1 – 1939. Então hoje o senhor tem cinquenta e nove anos?\nR – É, cinquenta e nove.\nP/1 – E como é o nome do seu pai e da sua mãe?\nR – Meu pai é José Antônio de Araújo. \nP/1 – E a sua mãe?\nR - A finada minha mãe é Otília Cavalcanti de Araújo.\nP/1 – E seu pai ainda está vivo?\nR – Ele tava tocando uma “farmacinha” lá no Ceará, não sei bem, porque eu mandei duas cartas e veio de volta, não foi localizado aquele endereço. \nP/1 – Faz tempo que o senhor não vê ele?\nR – Ah, desde quando eu saí de lá. Fui criado aqui, cheguei aqui"}, "folder_size_gb": 0.0}, "folder_size_gb": 21.028}, "ARTCID_HV010_João Gomes de Souza Filho": {"Audiovisual": {"Acesso": {"ARTCID_HV010_João Gomes de Souza Filho.mp4": {"size_mb": 8675.0953, "modified": "2022-03-22 17:28:14", "extension": "MP4", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV010_João Gomes de Souza Filho\\Audiovisual\\Acesso\\ARTCID_HV010_João Gomes de Souza Filho.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4566662.0, "duration": 4566.66, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 8.472}, "Preservação": {"MDV_3444.avi": {"size_mb": 9233.8709, "modified": "2018-11-22 09:36:20", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV010_João Gomes de Souza Filho\\Audiovisual\\Preservação\\MDV_3444.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2555387.0, "duration": 2555.39, "resolution": "720x480", "fps": 29.97}, "MDV_3445.avi": {"size_mb": 7682.0104, "modified": "2018-11-22 10:15:22", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV010_João Gomes de Souza Filho\\Audiovisual\\Preservação\\MDV_3445.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2125924.0, "duration": 2125.92, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 16.519}, "folder_size_gb": 24.991}, "Textual": {"ARTCID_HV010_REV.docx": {"size_mb": 0.0434, "modified": "2019-03-07 12:32:22", "extension": "DOCX", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV010_João Gomes de Souza Filho\\Textual\\ARTCID_HV010_REV.docx", "category": "Textual", "content_preview": "Arte Cidade\nDepoimento de João Gomes de Souza Filho\nEntrevistado por Karen Worcman e Rosali Henriques\nSão Paulo, 14/05/1999 \nRealização: Museu da Pessoa\nEntrevista nº ARTCID_HV010\nTranscrição de Neuza Guerreiro de Carvalho\nRevisado por Genivaldo Cavalcanti Filho\nP/1 – Vamos começar a entrevista? Vamos perguntar o seu nome e o lugar onde o senhor nasceu.\nR – O meu nome é João Gomes, completo é João Gomes de Souza Filho. Eu nasci na Paraíba, em João Pessoa, em nove de dezembro de 1946.\nP/1 – E qual o nome de seu pai e de sua mãe?\nR – O meu pai se chamava João Gomes de Souza e minha mãe chamava Francisca Gomes de Souza. Faleceu, já.\nP/1 – Os dois?\nR – Sim. \nP/1 – Eles também eram lá de João Pessoa?\nR -  Eram. Os dois eram lá de João Pessoa. \nP/1 – O que seu pai fazia? \nR – O meu pai se 9\nRealização: Museu da Pessoa\nEntrevista nº ARTCID_HV016\nTranscrito por Rubyblu Zatz de Mattos\nRevisado por Genivaldo Cavalcanti Filho \nP/1 – Então vamos começar a entrevista com você dizendo seu nome e data do nascimento.\nR – Meu nome é Zeinab Mohamed Salman, nasci [no] dia 21 de março de 1980. Estou com dezenove anos.\nP/1 – Onde você nasceu?\nR – Eu nasci na cidade de Haouch Er Rafqah, no estado [de] Baalbek, no Líbano.\nP/1 – E como era o nome dos seus pais?\nR – Meu pai [se] chama Mohamed Ali Salman. Ele é coronel do exército aposentado há um ano. A minha mãe [se] chama Rachid Iasdek. Ela não porta o sobrenome do meu pai. Ela é dona de casa, não pratica nenhuma função.\nP/1 – Onde eles nasceram? \nR – Meu pai nasceu numa cidade chamada Mustad, também no estado Baalbek. A minha mãe nasceu em Haouch Er Rafqah, a mesma cidade que eu nasci no Líbano.\nP/1 – E a idade deles?\nR – Minha mãe tem 44 e o meu pai, 45.\nP/1 – E seus avós? Você conheceu seus avós?\nR – Conheci minha avó materna e paterna. Não cheguei a conhecer meus avós. Minha avó materna é viva ainda, [se] chama"}, "folder_size_gb": 0.0}, "folder_size_gb": 16.543}, "ARTCID_HV017_Myriam Andreozzi": {"Audiovisual": {"Acesso": {"ARTCID_HV017_Myriam Andreozzi.mp4": {"size_mb": 621.772, "modified": "2021-07-21 15:54:34", "extension": "MP4", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV017_Myriam Andreozzi\\Audiovisual\\Acesso\\ARTCID_HV017_Myriam Andreozzi.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "HEVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3034298.0, "duration": 3034.3, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 0.607}, "Preservação": {"MP_0446.avi": {"size_mb": 14462.5583, "modified": "2008-05-12 11:14:40", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV017_Myriam Andreozzi\\Audiovisual\\Preservação\\MP_0446.avi", "category": "Video", "dimens  dia primeiro de setembro de 1935. \nP/1 – E a senhora nasceu em que bairro, Dona Myriam?\nR – No Brás.\nP/1 – A sua família é de origem italiana? \nR – É. São italianos, meus avós de Aversa, parte da Itália, né? No sul.\nP/1 – De que região é, a senhora sabe?\nR – Eu não sei bem se é sul. Sei que a cidade é Aversa, mas a região certa eu não estou lembrada.\nP/1 – A senhora sabe por que que eles vieram para o Brasil?\nR – Eles são todos imigrantes, né? Lá não estava bom, então vieram para cá. Um dos meus avós, que é pai da minha mãe, é quem trouxe uma santa, chamada Nossa Senhora de Casaluce. Ele [trouxe] com os amigos, quando imigraram aqui para São Paulo em 1900. É uma réplica dessa Nossa Senhora q"}, "folder_size_gb": 0.0}, "folder_size_gb": 27.815}, "ARTCID_HV020_Suzette Ilda Mendes": {"Audiovisual": {"Acesso": {"ARTCID_HV020_Suzette Ilda Mendes.mp4": {"size_mb": 7179.3965, "modified": "2022-03-24 19:51:16", "extension": "MP4", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV020_Suzette Ilda Mendes\\Audiovisual\\Acesso\\ARTCID_HV020_Suzette Ilda Mendes.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 3885548.0, "duration": 3885.55, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 7.011}, "Preservação": {"MDV_3457.avi": {"size_mb": 8240.2876, "modified": "2018-11-22 10:47:34", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV020_Suzette Ilda Mendes\\Audiovisual\\Preservação\\MDV_3457.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2280411.0, "duration": 2280.41, "resolution": "720x480", "fps": 29.97}, "MDV_3458.avi": {"size_mb": 5885.7172, "modified": "2018-11-23 08:31:36", "extension": "AVI", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV020_Suzette Ilda Mendes\\Audiovisual\\Preservação\\MDV_3458.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1628794.0, "duration": 1628.79, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 13.795}, "folder_size_gb": 20.806}, "Textual": {"ARTCID_HV020_REV.docx": {"size_mb": 0.0282, "modified": "2019-03-12 11:41:36", "extension": "DOCX", "full_path": "D:\\Arte Cidade (ARTCID)\\ARTCID_HV020_Suzette Ilda Mendes\\Textual\\ARTCID_HV020_REV.docx", "category": "Textual", "content_preview": "Arte Cidade\nDepoimento de Suzette Ilda Mendes\nEntrevistada por Marina D’Andrea\nSão Paulo, 18/05/2000\nRealização: Museu da Pessoa \nEntrevista nº ARTCID_HV020\nTranscrito por Rejane Goularth Sciascia\nRevisado por Genivaldo Cavalcanti Filho\nP/1 - Olá Suzette, você poderia nos falar seu nome, local e data de nascimento?\nR - Meu nome é Suzette Ilda Vilarinho. Depois de casada recebi o nome de Suzette Ilda Mendes. Nasci no dia dezenove de dezembro de 1963. Sou filha de portugueses e nasci em Luanda, Angola, [na] África. \nMeu pai se chama Virgílio Antônio Vilarinho e minha mãe, Ilda do Nascimento Vilarinho. Eles nasceram em Portugal, Trás-os-Montes, [em] Macedo de Cavalheiros. Meu pai era caminhoneiro e dono de armazéns e minha mãe era dona de casa. \nP/1 - Você se lembra dos seus avós?\nMeus avós moravam na aldeia de Grandíssimo em Portugal e tinham um… Aqui se chama sítio, lá era fazenda. [Era] grande. Eles tinham criação de vacas leiteiras, criação de porcos, galinhas, hortas, de hortifrutigrangeiros, pomares, vinhas e olivais. Eles sempre foram bem de vida.\nP/1 - Você tinha irmãos?\nR - Tenho um irmão.\nP/1 - Qual o nome dele?\nR – Vasco Virgílio Vilarinho.\nP/1 – O que ele faz?\nR - Ele é co"}, "folder_size_gb": 0.0}, "folder_size_gb": 20.806}, "folder_size_gb": 358.674}, "Avon - Memória dos 50 anos de Brasil (A  do seu nascimento.\nR – Meu nome é Alexandre Carvalho Ferreira, eu moro em São Paulo na Zona Norte, bem próximo ali da Vila Albertina, mas é mais Serra da Cantareira e eu nasci no dia treze de novembro de 1982.\nP/1 – Nome dos seus pais?\nR – Meu pai é José Vitor Ferreira e a minha mãe é Carla Maria Carvalho de Araújo Ferreira, é grande.\nP/1 – E você tava falando que eles vieram de Três Corações...\nR – É, na realidade o meu pai, a família do meu pai é de Três Corações, ele vem de uma família de construtores de casas de madeira, então boa parte dos tios do meu pai seguiram essa área, alguns trabalham ainda com isso. E lá em Três Corações a informação que eu tenho mais próxima é essa que o meu bisavô trabalhava com casas dessas. Existe um projeto de produção e ele ia lá numa empresa que ele trabalhava e ele montava a casa em questã"}, "folder_size_gb": 0.0}, "folder_size_gb": 38.289}, "FGL_IC": {"MDV_1586.avi": {"size_mb": 531.5131, "modified": "2019-01-16 10:53:02", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_IC\\MDV_1586.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 147078.0, "duration": 147.08, "resolution": "720x480", "fps": 29.97}, "MDV_1587.avi": {"size_mb": 5676.7557, "modified": "2019-01-16 11:24:34", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_IC\\MDV_1587.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1597951.0, "duration": 1597.95, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 6.063}, "FGL_HV012_Célia Hara (incompleto)": {"Audiovisual": {"Preservação": {"MDV 6082.avi": {"size_mb": 8663.5681, "modified": "2019-01-24 12:50:32", "extension": "AVI", "full_path": "D:\\Fundaçã  Anos da Fundação Gol de Letra\nDepoimento de Célia Yoshi Hara\nEntrevistado por Nádia Lopes e Camila Prado\nSão Paulo, 26/06/2009\nRealização Museu da Pessoa\nEntrevista número: FGL_HV012\nTranscrito por Jennifer Serra\nRevisado por Luiza Gallo Favareto \nP/1 – Obrigada por ter aceito o nosso convite, Célia. Pra começar eu gostaria que você dissesse seu nome completo, local e data de nascimento. \n\nR – Tá, é Célia Yoshi Hara, sete do dois de 1957, São Paulo, capital. \n\nP/1 – E o nome dos seus pais? \n\nR – Hara Yoshi (Torokite?), (Tokie Tesuka Torokite?). \n\nP/1 – Eles nasceram no Brasil mesmo? \n\nR – Então, minha mãe é nascida no Japão. Meu pai já não, é de Ribeirão Preto, São Paulo. \n\nP/1 – E você sabe alguma coisa de como eles se conheceram, quando é que ela veio pro Brasil? \n\nR – Pelas conversas, pelas histórias, minha mãe veio pequena do Japão, com cinco anos de idade, e se instalou em Bauru, na área rural. E meu pai a conheceu, porque ele foi fazer um curso, parece que foi de plantação de algodão e foi fazer estágio na fazenda lá dos meus avós e aí se conheceram. História mais ou menos assim. \n\nP/1 – Nossa, então eles eram novinhos quando se conheceram?\n\nR – É, acho que sim. É que na"}, "folder_size_gb": 0.0}, "folder_size_gb": 37.013}, "FGL_HV001_Wanderley Santos da Silva": {"Audiovisual": {"Acesso": {"FGL_HV001_Wanderley Santos da Silva.mp4": {"size_mb": 5027.1186, "modified": "2022-01-29 15:47:46", "extension": "MP4", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV001_Wanderley Santos da Silva\\Audiovisual\\Acesso\\FGL_HV001_Wanderley Santos da Silva.mp4", "category": "Video", "dimension": "854x480", "height": 480, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5562724.0, "duration": 5562.72, "resolution": "854x480", "fps": 29.97}, "folder_size_gb": 4.909}, "Preservação": {"MDV_6046.avi": {"size_mb": 9042.6336, "modified": "2019-01-10 11: Letra\nDepoimento de Wanderley Santos da Silva\nEntrevistado por Nádia Lopes e Ricardo Pedroni\nSão Paulo, 18/06/2009.\nRealização Museu da Pessoa\nEntrevista FGL_HV001\nTranscrito por Rosângela Maria Nunes Henriques\nRevisado por Ligia Furlan\nP/1 – Bom, primeiramente, obrigada por você ter comparecido para dar o depoimento pra gente. Para começar, Wanderley, eu gostaria que você dissesse seu nome completo, o local e a data de nascimento.\nR – Meu nome é Wanderley Santos da Silva, com “w” e “y”. Sou da Vila Albertina, Parque Ramos de Freitas e... A idade?\nP/1 – Você nasceu em que dia?\nR – Eu nasci no dia três de março de 1985, em São Paulo.\nP/1 – Qual o nome dos seus pais?\nR – Minha mãe se chama Maria de Lourdes e meu pai se chama Arnaldo da Silva.\nP/1 – E qual é a atividade profissional da sua mãe e do seu pai?\nR – Minha mãe é doméstica e meu pai, pedreiro.\nP/1 – E você sabe a origem da sua família? Eles são de São Paulo mesmo?\nR – Não, meu pai e minha mãe... Eles se conheceram aqui em São Paulo, mas são da Bahia, de Mata Verde e Vitória da Conquista.\nP/1 – Os dois são lá da Bahia?\nR – Sim, mas se conheceram aqui, eu não sei como, mas se conheceram aqui.\nP/1 –"}, "folder_size_gb": 0.0}, "Imagens": {"FGL_HV001_FT001.jpg": {"size_mb": 0.2355, "modified": "2021-05-12 16:38:04", "extension": "JPG", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV001_Wanderley Santos da Silva\\Imagens\\FGL_HV001_FT001.jpg", "category": "Image", "duration_ms": 0, "dimension": "773x1109", "height": 1109, "dpi": 200.0, "color_mode": "RGB", "duration": 0.0, "resolution": "773x1109"}, "FGL_HV001_FT001.tif": {"size_mb": 2.4557, "modified": "2009-11-18 13:10:46", "extension": "TIF", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV001_Wanderley Santos da Silva\\Imagens\\FGL_HV001_FT001.tif", "category": "Image", "duration_ms": 0, "dimension": "773x1109", "height": 1109, "dpi": 200.0, "color_mode": "RGB", "duration": 0.0, "resolution": "773x1109"}, "FGL_ )\\Textual\\FGL_HV002.doc", "category": "Textual"}, "FGL_HV002.docx": {"size_mb": 0.0262, "modified": "2026-02-20 11:37:42", "extension": "DOCX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV002_José Roberto de Souza (Pitti)\\Textual\\FGL_HV002.docx", "category": "Textual", "content_preview": "Dez Anos da Fundação Gol de Letra\nDepoimento de José Roberto de Souza\nEntrevistado por Nádia Lopes e Cláudia Leonor\nSão Paulo, 18/06/2009\nRealização Museu da Pessoa\nEntrevista FGL_HV002\nTranscrito por Keila Barbosa\nRevisado por Ligia Furlan\nP/1 – Piti, primeiramente obrigada por você ter comparecido para dar seu depoimento. Para começar eu gostaria que você dissesse seu nome completo, local e data de nascimento.\nR – Bom, meu nome é José Roberto de Souza, mas todo mundo me conhece como Piti, foi um apelido que ganhei há muito tempo atrás, era adolescente ainda. Nasci em São Paulo, aqui na capital mesmo, já faz um tempinho, nasci em 1950 (risos).\nP/1 – E o dia?\nR - No dia seis de julho.\nP/1 – Em seis de julho. Tá. Bom, esse Piti... Você é só conhecido por Piti, né?\nR – É, no mercado publicitário, foi um antigo patrão meu, no primeiro emprego que eu tive, me batizou. Ele era descendente de italianos, e me batizou como Piti, que seria o “Pitilino” da turma, e ficou Piti até hoje. Inclusive o nome da minha empresa virou Piti também.\nP/1 – Como é o nome dos seus pais?\nR – Meu pai chamava José de Souza, e minha mãe chamava Luiza Laurina de Souza.\nP/1 – E eles são de São Paulo mesmo?\nR – E"}, "folder_size_gb": 0.0}, "Imagens": {"legenda PItti.doc": {"size_mb": 0.019, "modified": "2009-10-30 14:14:48", "extension": "DOC", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV002_José Roberto de Souza (Pitti)\\Imagens\\legenda PItti.doc", "category": "Textual"}, "legenda PItti.docx": {"size_mb": 0.0049, "modified": "2026-02-20 11:37:46", "extension": "DOCX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV002_José Roberto de Sou e 1953.\nP/1 – Onde é que o senhor nasceu?\nR – Na cidade de Águas Belas, estado de Pernambuco. Aí perguntei pro meu pai: “Por que Águas Belas?”... Porque eu não conheço a cidade, eu cheguei no meu bairro com quatro anos de idade. Quatro anos de idade eu cheguei a São Paulo. “Ah, porque lá tem um rio muito grande, muito caudaloso, rio Ipanema, e muitas minas e tal, por isso que tem o nome de Águas Belas”. Mas aí eu fui pesquisas, não fiquei só com a informação dele, fui pesquisar e encontrei a história correta do nome Águas Belas, por que Águas Belas. \nP/1 e P/2 – E que história é essa?\nR – Ah sim! Então, Águas Belas era só um povoamento indígena. Então tinha lá duas tribos, Carijós e Tupiniquins, se não me falha a memória. E ia passan"}, "folder_size_gb": 0.0}, "Imagens": {"FGL_HV003_Averaldo Nunes Cordeiro.xlsx": {"size_mb": 0.0623, "modified": "2021-05-13 15:05:40", "extension": "XLSX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV003_Averaldo Nunes Cordeiro\\Imagens\\FGL_HV003_Averaldo Nunes Cordeiro.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Nome da História | Nome dos personagens | Descrição | Palavras-chave (Tags) | Obs | Referências anteriores | local no acervo\nFGL_HV003_FT001 | Averaldo Nunes Cordeiro | Bar da Costela  | 1968.0 | São Paulo, SP | Preservar para a eternidade | Bar da Costela em 1968. Localizado na Rua Cabidutu, esquina com Rua Antonio Joaquim de Oliveira | Bar da Costela, São Paulo-SP, comida, história, gastronomia, paulista, paulistano, Gol de Letra\nFGL_HV003_FT002 | Averaldo Nunes Cordeiro | Quintal de casa | 1977.0 | s.l. | Preservar para a eternidade | Maria Cinésia (mãe), dona Alice com a criança Zuleide (irmã) e a Karen (filha) | família, história, recordação, casa, memória, Gol de Letra\nFGL_HV003_FT003 | Averaldo Nunes Cordeiro | Construção do Bar da Costela | 1968.0 | São Paulo, SP | Preservar para a eternidade | Trabalhadores na construção do Bar da Cos .0894, "modified": "2019-03-25 10:23:16", "extension": "DOC", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV004_Eduardo Hatada\\Textual\\FGL_HV004.doc", "category": "Textual"}, "FGL_HV004.docx": {"size_mb": 0.0251, "modified": "2026-02-20 11:37:50", "extension": "DOCX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV004_Eduardo Hatada\\Textual\\FGL_HV004.docx", "category": "Textual", "content_preview": "Dez Anos da Fundação Gol de Letra\nEntrevista de Eduardo Hatada\nEntrevistado por Ricardo Pedroni e Nadia Lopes\nSão Paulo, 20/06/2009\nRealização Museu da Pessoa\nEntrevista FGL_HV004\nTranscrito por Vanuza Ramos\nRevisado por Ligia Furlan\nP/1 – Antes de tudo, bom dia! \n\nR – Bom dia. \n\nP/1 – Obrigado por ter aceitado nosso convite. Para começar, você poderia falar o seu nome, data e local de nascimento? \n\nR – Eduardo Hatada, 12 de agosto de 1978, eu nasci em São Paulo.  \n\nP/1 – Qual é o nome dos seus pais? \n\nR – Aparecida Paulina Hatada e Kasumi Hatada. \n\nP/1 – Você poderia contar um pouquinho dos seus pais? Como eles se conheceram, o que eles fazem? \n\nR – Assim, (riso) que eles não são de contar muito. A minha mãe foi adotada, eu sei que a minha mãe foi adotada e ela se apaixonou muito por meu pai. Mas eu não tenho muitas histórias deles, como foi o conhecimento deles, sei que a minha mãe ficou muito apaixonada por ele. Eu acho que ela sofreu muito na infância, ela não teve uma infância muito feliz. Acho que o pai trouxe muita felicidade pra ela no começo do casamento, do relacionamento deles, enfim. \n\nP/1 – E qual é a atividade deles? \n\nR – Então, a minha mãe trabalhava em empresas de"}, "folder_size_gb": 0.0}, "Imagens": {"FGL_HV004_Eduardo Hatada.xlsx": {"size_mb": 0.0562, "modified": "2021-05-14 15:32:58", "extension": "XLSX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV004_Eduardo Hatada\\Imagens\\FGL_HV004_Eduardo Hatada.xlsx", "category": "Textual", "content_preview": "Código | Nome do De r Nádia Lopes \nSão Paulo, 20/06/2009\nRealização Museu da Pessoa\nEntrevista FGL_HV005\nTranscrito por Guilherme Pereira de Carvalho\nRevisado por Ligia Furlan\nP/1 – Boa tarde. Para começar, eu gostaria que você dissesse seu nome completo, local e data de nascimento.\nR – Maria Helena de Santos Gonçalves. Nasci em São Paulo, mesmo.\nP/1 – Quando?\nR – Em dois de agosto de 1980.\nP/1 – Qual o nome dos seus pais?\nR – Minha mãe, Ana Maria Cesário Dos Santos Gonçalves, e o meu pai, Antônio Carlos Gonçalves.\nP/1 – Você sabe se os seus pais são de São Paulo, mesmo?\nR – São. Só que meu pai é do interior de São Paulo, uma cidade chamada Monte Alto. \nP/1 – Sua mãe é de São Paulo, mesmo? E eles são daquele lugar que você mora, da Vila...\nR – Vila Albertina. Eu que fui pra Vila Rosa. Minha mãe sempre viveu lá, desde que era fazenda mesmo. Onde minha mãe mora, o nome é Fazendinha, porque era uma fazenda lá e tal. Meu pai veio depois, eu não sei exatamente como é que ele foi parar lá (risos).\nP/1 – Mas eles se conheceram na Fazendinha?\nR – Sim. Eu acho que foi num casamento, que eles se conheceram. \nP/1 – V"}, "folder_size_gb": 0.0}, "Imagens": {"FGL_HV005_Maria Helena dos Santos.xlsx": {"size_mb": 0.0552, "modified": "2021-05-21 17:20:14", "extension": "XLSX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV005_Maria Helena dos Santos\\Imagens\\FGL_HV005_Maria Helena dos Santos.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Nome da História | Nome dos personagens | Descrição | Palavras-chave (Tags) | Obs | Referências anteriores | local no acervo\nFGL_HV005_FT001 | Maria Helena dos Santos | Maria Helena e seu pai | 1986.0 | s.l. | Escola, minha segunda casa | Maria Helena e seu pai em casa | família, infância, pai, casa, memória, história, Gol de Letra\nFGL_HV005_FT002 | Maria Helena dos Santos | No colo da mãe | 1981.0 | s.l. | Escola, minha segunda casa | mãe, Maria Helena e Anderson (tio) | Maria Helena no colo da mãe, sendo observada pelo tio Anderson - com 6 anos | família, infância, mãe, tio, memória, história, Gol de Letra"}, "Alta resolução": {"FGL_HV005_FT002.tif": {"size_mb": 3.8425, "modified": "2009-07-15 15:57:14", "extension": "TIF", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV005_Maria Helena dos Santos\\Imagens\\Alta resolução\\FGL_HV005_FT002.tif", "category": "Image", "duration_ms": 0, "dimension": "1116x1200", "height": 1200, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1116x1200"}, "FGL_HV005_FT001.tif": {"size_mb": 3.8452, "modified": "2009-07-15 15:56:36", "extension": "TIF", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV005_Maria Helena dos Santos\\Imagens\\Alta resolução\\FGL_HV005_FT001.tif", "category": "Image", "duration_ms": 0, "dimension": "1146x1170", "height": 1170, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1146x1170"}, "folder_size_gb": 0.008}, "Baixa resolução": {"FGL_HV005_FT001.jpg": {"size_mb": 0.287, "modified": "2009-07-15 15:54:06", "extension": "JPG", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV005_Maria Helena dos Santos\\Imagens\\Baixa resolução\\FGL_HV005_FT001.jpg", "category": "Image", "duration_ms": 0, "dimension": "1146x1122", "height": 1122, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1146x1122"}, "FGL_HV005_FT002.jpg": {"size_mb": 0.3557, "modified": "2009-07-15 15:54:54", "extension": "JPG", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV005_Maria Helena dos Santos\\Imagens\\Baixa resolução\\FGL_HV005_FT002.jpg", "category": "Image", "duration_ms": 0, "dimension": "1164x1212", "height": 1212, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1164x1212"}, "folder_size_gb": 0.001}, "Making of Helena_Fotos MARCIA ZOET": {"Making of_FGL_HV005_ Maria Helena dos Santos.xlsx": {"size_mb": 0.0544, "modified": "2021-06-01 14:23:04", "extension": "XLSX", "full_path" a Medici Barrella\nRevisado por Ligia Furlan\nP/1 – Primeiramente obrigada, Mônica, por ter aceitado o nosso convite.\nR – Eu que agradeço, acho que vai ser bem legal (risos).\nP/1 – Pra começar a gente faz uma identificação, não se preocupe porque vai fluindo, tá? \nR – Tá bom.\nP/1 – Qual o seu nome completo, local e data de nascimento?\nR – Mônica Zagallo Camargo, nasci em São Paulo, na Vila Matilde.\nP/1 – E o nome dos seus pais?\nR – César Rocha Camargo e Adelaide Zagallo Camargo.\nP/1 – E qual é a atividade profissional dos seus pais?\nR – A minha mãe era professora, é falecida; o meu pai é auditor.\nP/1 – Os seus pais são de São Paulo, mesmo?\nR – O meu pai é de Araraquara e a minha mãe é de São Paulo.\nP/1 – Você sabe alguma coisa da história deles? Como eles se conheceram, como vieram parar aqui?\nR – Eu sei algumas histórias deles. Eu sei que o meu pai era muito mulherengo, tinha muitas namoradas, e a minha mãe era o oposto: Tinha pouquíssimos namorados e era oito anos mais vel"}, "folder_size_gb": 0.0}, "Imagens": {"FGL_HV006_Mônica Zagallo Camargo.xlsx": {"size_mb": 0.0581, "modified": "2021-05-21 17:53:12", "extension": "XLSX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV006_Mônica Zagallo Camargo\\Imagens\\FGL_HV006_Mônica Zagallo Camargo.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Nome da História | Nome dos personagens | Descrição | Palavras-chave (Tags) | Obs | Referências anteriores | local no acervo\nFGL_HV006_DOC001 | Mônica Zagallo Camargo | Desenho do primário | 1978.0 | s.l. | Aprender, conviver e multiplicar | Desenho de Mônica quando estava no primária (2ª série) | desenho, infância, memória, escola, história, FGL\nFGL_HV006_DOC002 | Mônica Zagallo Camargo | Circo | 1979.0 | s.l. | Aprender, conviver e multiplicar | Desenho de Mônica como tema circo, desenvolvido na 2ª série primária em Porto Alegre | desenho, infância, memória, circo, escola, história, FGL\nFGL_HV0 zação Museu da Pessoa\nEntrevista  FGL_HV007_ Luciano Pereira de Almeida\nTranscrita por Rodrigo Fonseca\nRevisado por Erick Vinicius de Araujo Borges\nP/1 – Primeiro de tudo, obrigado Luciano por ter aceitado o nosso convite. É, para começar, o senhor podia falar o seu nome completo, local e data de nascimento?\nR – Luciano Pereira de Almeida, local de nascimento. São José do Rio Preto em 29 de abril de 1975.\nP/1 – Qual que é o nome dos seus pais?\nR – Meu pai, Paulo José de Almeida, minha mãe Vera Aparecida de Almeida.\nP/1 – Qual que é a atividade deles?\nR – Meu pai é aposentado e a minha mãe, ela é aposentada também, funcionária pública.\nP/1 – O que seu pai fazia?\nR – Meu pai trabalhou durante muito tempo nos Correios, inspetor de linhas telegráficas, depois se aposentou do Correio e continua trabalhando para uma empresa em Ribeirão Preto, uma concessionária da Mercedes-Benz.\nP/1 – E a sua mãe?\nR – Minha mãe, ela muito tempo foi... Ela trabalhou na juventude, quando casou ela foi do lar, doméstica e depois ela entrou num concurso públic"}, "folder_size_gb": 0.0}, "Imagens": {"FGL_HV007_Luciano Pereira de Almeida.xlsx": {"size_mb": 0.0585, "modified": "2021-05-18 14:42:16", "extension": "XLSX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV007_Luciano Pereira de Almeida\\Imagens\\FGL_HV007_Luciano Pereira de Almeida.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Nome da História | Nome dos personagens | Descrição | Palavras-chave (Tags) | Obs | Referências anteriores | local no acervo\nFGL_HV007_FT001 | Luciano Pereira de Almeida | Formatura da pré-escola | 1980.0 | Ribeirão Preto, SP | Tirando a vida de letra | Luciano Pereira de Almeida e José Henrique Pereira de Almeida | Formatura da pré-escola | escola, infância, formatura, pré-escola, memória, história, FGL\nFGL_HV007_FT002 | Luciano Pereira de Almeida | Tocando gaita | 2005.0 | Ribeirão Preto, SP | Tirando a vida de letra | Paulo D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV008_Elaine Alves Xavier\\Audiovisual\\Preservação\\MDV_6066.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1642005.0, "duration": 1642.01, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 14.266}, "folder_size_gb": 21.367}, "Textual": {"FGL_HV008.doc": {"size_mb": 0.0952, "modified": "2019-03-25 10:23:16", "extension": "DOC", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV008_Elaine Alves Xavier\\Textual\\FGL_HV008.doc", "category": "Textual"}, "FGL_HV008.docx": {"size_mb": 0.026, "modified": "2026-02-20 11:38:00", "extension": "DOCX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV008_Elaine Alves Xavier\\Textual\\FGL_HV008.docx", "category": "Textual", "content_preview": "10 anos da Fundação Gol de Letra\nDepoimento de Elaine Alves Xavier\nEntrevistada por Nádia Lopes e Ricardo Pedroni\nSão Paulo, 23/06/2009\nRealização Museu da Pessoa\nEntrevista: FGL_HV008 \nTranscrito por Tereza Ruiz\nRevisado por Ligia Furlan\nP/1 – Elaine, bom dia. \nR – Bom dia.\nP/1 – Obrigado por você ter aceitado o nosso convite, tá?\nR – Imagina.\nP/1 – Para começar nós gostaríamos que você dissesse o seu nome completo, o local e data de nascimento.\nR – Tá. É Elaine Alves Xavier, eu nasci em 1974, aqui em São Paulo mesmo.\nP/1 – Que dia você nasceu?\nR – 27 de dezembro.\nP/1- Em São Paulo mesmo. Que lugar de São Paulo?\nR – São Miguel.\nP/1 – São Miguel. Nome dos seus pais?\nR – É Valdomiro e Rita.\nP/1 – Você pode falar o nome inteiro deles?\nR – Valdomiro Alves Xavier e Maria Rita Carvalho.\nP/1 – Qual é a atividade profissional dos seus pais?\nR – Minha mãe era ascensorista, hoje ela está aposentada. E o meu pai, pedreiro.\nP/1 – E seus pais são de São Paulo mesmo? \nR – São de São Paulo.\nP/1 – Nasceram em São Paulo?\nR – Não, minha mãe é da Bahia e meu pai é de Minas.\nP/1 – E você sabe quando que eles vieram pra São Paulo?\nR – A minha mãe veio com uns 12 anos. Agora, o meu pai eu não sei muito"}, "folder_size_gb": 0.0}, "Imagens": {"FGL_HV008_Elaine Alves Xavier.xlsx": {"size_mb": 0.0556, "modified": "2021-05-14 17:22:22", "extension": "XLSX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV008_Elaine Alves Xavier\\Imagens\\FGL_HV008_Elaine Alves Xavier.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Nome da História | Nome dos personagens | Descrição | Palavras-chave (Tags) | Obs | Referências anteriores | local no acervo\nFGL_HV008_FT001 | Elaine Alves Xavier | Formatura pré-escolar | 1980.0 | São Paulo | Nascem flores | Elaine com 6 anos | Formatura do pré. Escola Municipal localizada na Vila EDE (Zona Norte) | infância, escola, formatura, criança, história, memória, Gol de Letra\nFGL_HV008_FT002 | Elaine Alves Xavier | Na laje de casa | 1988.0 | São Paulo | Nascem flores | Elaine com 14 anos | Na laje de casa na Vila Albertina. ao fundo a Serra da Cantareira | casa, Vila Albertina, São Paulo, Serra da Cantareira, memória, história, adolescencia, Gol de Letra\nFGL_HV008_FT003 | Elaine Alves Xavier | Crisma - 1 | 1990.0 | s.l. | Nascem flores | Elaine | Elaine durante a crisma com a amiga Madalena | crisma, igreja, religião, cerimônia, história, memória, Gol de Letra\nFGL_HV008_FT004 | Elaine Alves Xavier | Crisma - 2 | 1990.0 | s.l"}, "Alta resolução": {"FGL_HV008_FT001.tif": {"size_mb": 16.6585, "modified": "2009-07-16 15:52:52", "extension": "TIF", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV008_Elaine Alves Xavier\\Imagens\\Alta resolução\\FGL_HV008_FT001.tif", "category": "Image", "duration_ms": 0, "dimension": "2085x2791", "height": 2791, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2085x2791"}, "FGL_HV008_FT002.tif": {"size_mb": 4.2777, "modified": "2009-07-16 15:58:36", "extension": "T ou com contabilidade também numa... Na Federação de Tênis Francesa.\nP/1 – E qual é a origem dos seus pais?\nR – Meu pai é romeno, minha mãe é brasileira e... Bom, a minha família é um"}, "folder_size_gb": 0.0}, "Imagens": {"FGL_HV009_Jérèmie Nicoläe Dron.xlsx": {"size_mb": 0.06, "modified": "2021-05-18 13:56:08", "extension": "XLSX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV009_Jérèmie Nicoläe Dron\\Imagens\\FGL_HV009_Jérèmie Nicoläe Dron.xlsx", "category": "Textual", "content_preview": "Código | Nome do Depoente | Título | Data | Local | Nome da História | Nome dos personagens | Descrição | Palavras-chave (Tags) | Obs | Referências anteriores | local no acervo\nFGL_HV009_FT001 | Jérèmie Nicoläe Dron | Família de Jeremie | 1985.0 | Paris, França | Gol de raquete | Sever Constantin (pai), Thomas (irmão), Jeremie e em primeiro plano Alice (mãe) e Cornélia (avó materna) | Reunião de família | família, reunião, memória, história, Gol de Letra, Paris-França\nFGL_HV009_FT002 | Jérèmie Nicoläe Dron | Com amigos no clube de tênis | 1988.0 | Paris, França | Gol de raquete | o depoente não se lembra dos nomes | Jeremie com 11 anos e os amigos no clube de Tênis | tênis, quadra, amigos, memória, história, jogo de tênis, Gol de Letra\nFGL_HV009_FT003 | Jérèmie Nicoläe Dron | A caminho do jogo | 1984.0 | s.l. | Gol de raquete | Jeremie e Thomas | Jeremie com o irmão a caminho do jogo de tênis | tênis, quadra, irmão, memória, história, jogo de tênis, esporte, Gol de Letra\nFGL_HV009_FT00"}, "Alta resolução": {"FGL_HV009_FT014.tif": {"size_mb": 5.9894, "modified": "2009-07-16 16:54:32", "extension": "TIF", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV009_Jérèmie Nicoläe Dron\\Imagens\\Alta resolução\\FGL_HV009_FT014.tif", "category": "Image", "duration_ms": 0, "dimension": "1200x1740", "height": 1740, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1200x1740"}, "FGL_HV009_FT002.tif": {"size_mb": 5.1694, "modified": "2009-0 s famílias pro interior do país, para lugares bem longes. Então eu nasci em Uberlândia, mas ele já morava no interior de Goiás, uma cidade que chama-se Goiatuba. E a minha mãe dá risada porque ela fa"}, "folder_size_gb": 0.0}, "folder_size_gb": 48.678}, "FGL_HV010_Olga Cristiane Lembo": {"Audiovisual": {"Acesso": {"FGL_HV010_Olga Cristiane Lembo.mp4": {"size_mb": 22479.9352, "modified": "2022-01-30 19:45:48", "extension": "MP4", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV010_Olga Cristiane Lembo\\Audiovisual\\Acesso\\FGL_HV010_Olga Cristiane Lembo.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 12155677.0, "duration": 12155.68, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 21.953}, "Preservação": {"MDV 6071.avi": {"size_mb": 8623.4213, "modified": "2019-01-22 13:32:02", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV010_Olga Cristiane Lembo\\Audiovisual\\Preservação\\MDV 6071.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2386445.0, "duration": 2386.45, "resolution": "720x480", "fps": 29.97}, "MDV 6072.avi": {"size_mb": 9165.7502, "modified": "2019-01-22 14:15:26", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV010_Olga Cristiane Lembo\\Audiovisual\\Preservação\\MDV 6072.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2536506.0, "duration": 2536.51, "resolution": "720x480", "fps": 29.97}, "MDV 6073.avi": {"size_mb": 8578.9361, "modified": "2019-01-22 14:56:42", "extension": "AVI", "full_path": "D:\\Fundação Gol olor_mode": "RGB", "duration": 0.0, "resolution": "3072x2048"}, "FGL_HV010_MO001.jpg": {"size_mb": 1.0889, "modified": "2021-06-02 15:33:10", "extension": "JPG", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV010_Olga Cristiane Lembo\\Imagens\\Making of Olga_Fotos MARCIA ZOET\\baixa resolução\\FGL_HV010_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "3072x2048", "height": 2048, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3072x2048"}, "FGL_HV010_MO002.jpg": {"size_mb": 1.0503, "modified": "2021-06-02 15:34:44", "extension": "JPG", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV010_Olga Cristiane Lembo\\Imagens\\Making of Olga_Fotos MARCIA ZOET\\baixa resolução\\FGL_HV010_MO002.jpg", "category": "Image", "duration_ms": 0, "dimension": "3072x2048", "height": 2048, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3072x2048"}, "folder_size_gb": 0.01}, "folder_size_gb": 0.168}, "folder_size_gb": 0.295}, "Textual": {"FGL_HV010.docx": {"size_mb": 0.0693, "modified": "2019-03-25 10:23:18", "extension": "DOCX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV010_Olga Cristiane Lembo\\Textual\\FGL_HV010.docx", "category": "Textual", "content_preview": "Dez anos da Fundação Gol de Letra\nDepoimento de Olga Cristiane Lembo\nEntrevistada por Ricardo Petroni e Camila Prado\nSão Paulo 25/06/2009\nRealização: Museu da Pessoa\nEntrevista número: FGL_HV010\nTranscrito por Karina Medici Barrella\nRevisado por Luiza Gallo Favareto \nP/1 – Pra começar, Olga, você poderia falar o seu nome completo, local e data de nascimento?\nR – Meu nome é Olga Cristiane Lembo, eu nasci na cidade de São Paulo no dia 30 de junho de 1967.\nP/1 – Quais são os nomes dos seus pais?\nR – Marcos Antonio Lembo e Dione Longhi Lembo.\nP/1 – E a atividade deles?\nR – Meu pai é fotógrafo profissional, trabalha em outras coisas mas, na prática, ele também foi músico, pistonista. E a minha mãe trabalhou sempre em área administrativa, foi costureira por um tempo. Hoje os dois estão aposentados, mas tem essa mescla entre os dois.\nP/1 – Você sabe a origem da sua família?\nR – É uma família de origem italiana, pelos nomes, Longhi e Lembo, porém não vindos diretamente de lá, e sim bisavós, mas não avós. Meu avô materno nascido no estado do Rio de Janeiro, na cidade de Macaé. Embora de família italiana, mas mais concentrados nessa região. E a minha avó, da qual eu tenho o nome, a minha avó"}, "folder_size_gb": 0.0}, "folder_size_gb": 65.563}, "FGL_HV013_Cristiana Mercadante Esper Berthoud (incompleto)": {"Audiovisual": {"FGL_HV013_Cristiana Mercadante Esper Berthoud.mp4": {"size_mb": 8878.7915, "modified": "2022-02-15 17:19:44", "extension": "MP4", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV013_Cristiana Mercadante Esper Berthoud (incompleto)\\Audiovisual\\FGL_HV013_Cristiana Mercadante Esper Berthoud.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4804634.0, "duration": 4804.63, "resolution": "1280x720", "fps": 29.97}, "Preservação": {"MDV 6085.avi": {"size_mb": 8648.1368, "modified": "2019-01-24 15:20:32", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV013_Cristiana Mercadante Esper Berthoud (incompleto)\\Audiovisual\\Preservação\\MDV 6085.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2393291.0, "duration": 2393.29, "resolution": "720x480", "fps": 29.97}, "MDV 6086.avi": {"size_mb": 8726.2892, "modified": "2019-01-24 16:25:18", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV013_Cristiana Mercadante Esper Berthoud (incompleto)\\Audiovisual\\Preservação\\MDV 6086.avi", "category": "Vid é Esper e Magda Mercadante Esper.\nP/1 – E a atividade deles?\nR – Meu pai comerciante e minha mãe professora aposentada há bons anos, aposentadíssima, na casa dos oitenta já. \nP/1 – Ah tá. E você tem irmãos?\nR – Tenho, nós somos em cinco.\nP/1 – Pode falar o nome deles na ordem?\nR – Eu sou bem do meio, então tem o mais velho, Alexandre, depois vem Maiara, eu, aí tem Juliano e Plínio. Na verdade eram seis, porque o Plínio era gêmeo, mas morreu logo dias depois do nascimento, seríamos seis então, Plínio e Rodrigo.\nP/1 – E fala um pouquinho da sua infância. Em que bairro você nasceu, em que cidade?\nR – Ent"}, "folder_size_gb": 0.0}, "folder_size_gb": 25.862}, "FGL_TM002_Patrícia Liberali": {"Audiovisual": {"Acesso": {"FGL_TM002.mp4": {"size_mb": 11651.3659, "modified": "2019-01-21 19:01:48", "extension": "MP4", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_TM002_Patrícia Liberali\\Audiovisual\\Acesso\\FGL_TM002.mp4", "category": "Video", "dimension": "640x480", "height": 480, "aspect_ratio": "4:3 (SD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Mono", "audio_codec": "AAC", "duration_ms": 11989544.0, "duration": 11989.54, "resolution": "640x480", "fps": 29.97}, "FGL_TM002_Patrícia Liberali.mp4": {"size_mb": 22935.0517, "modified": "2022-02-06 16:35:40", "extension": "MP4", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_TM002_Patrícia Liberali\\Audiovisual\\Acesso\\FGL_TM002_Patrícia Liberali.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 11994282.0, "duration": 11994.28, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 33.776}, "Preservação": {"MDV_6143.avi": {"size_mb": 8774.5126, "modified": "2019-01-17 13:48:28", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_TM002_Patrícia Liberali\\Audiovisual\\Preservação\\MDV_ eu nasci dia dezenove de setembro de 1972 em São Paulo. Eu morava no Bom Retiro. Nasci no Hospital Beneficência Portuguesa.\nP/1 – E o nome dos seus pais?\nR – Edgar Liberali e Sílvia Maria Liberali.\nP/1 – Qual a atividade deles?\nR – Meu pai sempre foi empresário, um empresário artesanal. Ele sempre fez estojo, faqueiro, sempre trabalhou com atividade manual. E a minha mãe, formada em Contabilidade, trabalhou na área durante um tempo, depois foi telefonista do Citibank e, quando nasceu o segundo filho - nós somos em cinco -, ela deixou a atividade profissional e foi ser mãe. Hoje é mãe e avó.\nP/1 – Você sabe qual é a origem da sua família?\nR – Minha mãe é de ascendência alemã e o meu pai de ascendência italiana. Região, essas coisas, eu não sei. \nP/1 – E você tem irmãos?\nR – Tenho quatro. Trê"}, "folder_size_gb": 0.0}, "folder_size_gb": 76.626}, "FGL_TM001_Sônia London": {"Imagens": {"sonia london - gol000094.tif": {"size_mb": 18.0289, "modified": "2009-06-28 21:13:08", "extension": "TIF", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_TM001_Sônia London\\Imagens\\sonia london - gol000094.tif", "category": "Image", "duration_ms": 0, "dimension": "3072x2048", "height": 2048, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3072x2048"}, "sonia london - gol000095.tif": {"size_mb": 18.0302, "modified": "2009-06-28 21:12:52", "extension": "TIF", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_TM001_Sônia London\\Imagens\\sonia london - gol000095.tif", "category": "Image", "duration_ms": 0, "dimension": "2048x3072", "height": 3072, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "2048x3072"}, "sonia london - gol000096.tif": {"size_mb": 18.0299, "modified": "2009-06-28 21:12:38", "extension": "TIF", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_TM001_Sônia London\\Imagens\\sonia london - gol000096.tif", "category": "Image", "duration_ms": 0, "dimension": "3072x2048", "height": 2048, "dpi": pleto, data e local de nascimento?\nR – Sônia Helena Doria London, local de nascimento, São Paulo, dezessete de dezembro de 1952.\nP/1 – E qual é o nome dos seus pais?\nR – Meu pai chamava Hélio Ivo Angrizani Doria. Minha mãe, Nancy Angrizani Doria.\nP/1 – E a atividade deles?\nR – Meu pai foi juiz de direito, que já morreu, e a minha mãe não fez nada. Quer dizer, estudou. Estudou História e Geografia, mas nunca trabalhou.\nP/1 – E tem irmãos?\nR – Tenho dois. Um mais velho, Carlos Alberto, e um mais novo, Og Roberto. Og Roberto, que é difícil entender, né?\nP/2 – É Og?\nR – Og. O, G mudo.\nP/1 – E qual é a sua formação, Sônia?\nR – Eu fiz Letras. Língua e Literatura Francesa e Portuguesa. \nP/1 – Como foi essa opção?\nR – Foi difícil, não sabia muito o que fazer. Eu gostava muito da França, tinha muita vontade de conhecer e achava lindo quem traduzia, q"}, "folder_size_gb": 0.0}, "folder_size_gb": 34.431}, "FGL_HV026_Beatriz Campos Pantaleão": {"Audiovisual": {"Acesso": {"FGL_HV026_Beatriz Campos Pantaleão.mp4": {"size_mb": 19165.2311, "modified": "2022-02-06 00:00:36", "extension": "MP4", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV026_Beatriz Campos Pantaleão\\Audiovisual\\Acesso\\FGL_HV026_Beatriz Campos Pantaleão.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 10362986.0, "duration": 10362.99, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 18.716}, "Preservação": {"MDV_6133.avi": {"size_mb": 8956.3145, "modified": "2019-01-16 14:52:42", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV026_Beatriz Campos Pantaleão\\Audiovisual\\Preservação\\MDV_6133.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": iburgo Carnaval 1979. \nEm pé: Alexandre, Junior, Guilherme, Andre, Leonardo e Felipe\nSentadas: Marcia, Bia, Luciana e Raquel\nFoto 3 -Fazenda Silva Jardim, 1976. Bia e Junior (meu irmão)\nFoto 4 - Sítio em Nova Friburgo 1973. Bia, Marcelinho, Tia Angela, Carminha e Marcia (irmã)\nFoto 5 - Casinha de Bonecas no Sítio de Nova Friburgo 1979 Bia e Marcia\nFoto 6 - Festa Junina na Fazenda de Silva Jardim, 1981\nFoto 7 - Meu aniversário 1977\nFoto 8 - 1971\nFoto 9 - Na minha casa em Niterói, 1977, havia participado de um coral na escola\nFoto 10 - Sítio Nova Friburgo.Bia e Antonio (pai) 1971\nFoto 11- 1971\nFoto 12 - não estou na foto\nFoto 13 - Sitio Nova Friburgo 1972\nFoto 14 - Festa Junina na Escola Betania 1974. Luciana (prima), Bia e Raquel (prima)\nFoto 15 - Entrega do livro 1977. Bia e Tia Estela Escola Gay Lussac\nFoto 16 - Turma da Alfabetização 1977. professora Tia Estela. eu sou a terceira sentada no banco da direita para esquerda\nFoto 17 - Paris, despedida do Rai no Planet Hollywood, não me lembro a data\nFoto 18 - Não sei a data, acredito que uns 3 anos\nFoto 19 - Fazenda Silva"}, "Alta Resolução": {"FGL_HV026_FT028.tif": {"size_mb": 2.1545, "modified": "2009-10-28 10:47:52", "extension": "TIF", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV026_Beatriz Campos Pantaleão\\Imagens\\Alta Resolução\\FGL_HV026_FT028.tif", "category": "Image", "duration_ms": 0, "dimension": "1033x728", "height": 728, "dpi": 200.0, "color_mode": "RGB", "duration": 0.0, "resolution": "1033x728"}, "FGL_HV026_FT001.tif": {"size_mb": 1.1837, "modified": "2009-10-28 09:12:40", "extension": "TIF", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV026_Beatriz Campos Pantaleão\\Imagens\\Alta Resolução\\FGL_HV026_FT001.tif", "category": "Image", "duration_ms": 0, "dimension": "628x658", "height": 658, "dpi": 200.0, "color_mode": "RGB", "duration": 0.0, "resolution": "628x658"}, "FGL_HV026_FT002.tif": {"size_mb": 1.2986, "modified": "2009-10-28 09:13:34", "ext  o vovô José, pai da minha mãe, que já tinha morrido quando eu nasci. E por parte do meu pai era o vovô Juca, José, e a vovó Tentem, que era Hortência e ficou vovó Tentem. (risos)\nP/1 – E você sabe a atividade deles?\nR – Os meus dois avós… Os dois eram médicos, na verdade. Ele era patologista, esse meu avô [que] morreu. Ele criou um laboratório; com a morte dele a minha avó assumiu o laboratório, mas ela não er"}, "folder_size_gb": 0.0}, "folder_size_gb": 55.794}, "FGL_HV025_Valéria Donófrio": {"Audiovisual": {"Acesso": {"FGL_HV025_Valéria Donófrio.mp4": {"size_mb": 16373.0221, "modified": "2022-02-05 21:39:02", "extension": "MP4", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV025_Valéria Donófrio\\Audiovisual\\Acesso\\FGL_HV025_Valéria Donófrio.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 8849707.0, "duration": 8849.71, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 15.989}, "Preservação": {"MDV_6129.avi": {"size_mb": 8837.6832, "modified": "2019-01-14 16:12:24", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV025_Valéria Donófrio\\Audiovisual\\Preservação\\MDV_6129.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2445733.0, "duration": 2445.73, "resolution": "720x480", "fps": 29.97}, "MDV_6130.avi": {"size_mb": 8895.31, "modified": "2019-01-14 16:54:46", "extension": "AVI", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV025_Valéria Donófrio\\Audiovisual\\Preservação\\MDV_6130.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2461681. FGL_HV025_MO001.jpg", "category": "Image", "duration_ms": 0, "dimension": "3072x2048", "height": 2048, "dpi": 180.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3072x2048"}, "folder_size_gb": 0.007}, "folder_size_gb": 0.112}, "folder_size_gb": 0.181}, "Textual": {"FGL_HV025_Valéria-D´Onófrio_REV.docx": {"size_mb": 0.0601, "modified": "2019-03-25 10:23:16", "extension": "DOCX", "full_path": "D:\\Fundação Gol de Letra - 10 Anos (FGL)\\FGL_HV025_Valéria Donófrio\\Textual\\FGL_HV025_Valéria-D´Onófrio_REV.docx", "category": "Textual", "content_preview": "Dez Anos da Fundação Gol de Letra\nDepoimento de Valéria D’Onófrio\nEntrevistada por Nadia Lopes e Claudia Leonor\nSão Paulo, 6/08/2009\nRealização: Museu da Pessoa\nEntrevista nº FGL_HV025\nTranscrito por Cristina Eira Velha\nRevisado por Genivaldo Cavalcanti Filho\nP/1 – Vamos lá, Valéria. Primeiro, obrigada por você ter vindo. Para começar, eu gostaria que você dissesse o seu nome completo, local e data de nascimento.\nR - Valéria D’Onófrio. Nasci em São Paulo, em primeiro de julho de 1981. \nP/1 – O nome dos seus pais?\nR – O meu pai chama Adilson Jorge D’Onófrio e minha mãe, Helenice Aparecida D´Onófrio.\nP/1 – Você conheceu os seus avós?\nR – Sim.\nP/1 – O nome deles?\nR – O meu avô paterno se chama Jesuíno, a minha avó Benedita; a minha avó materna se chama Alcídia, e o meu avô materno se chama Artur. \nP/1 – Qual a atividade profissional dos seus pais?\nR – O meu pai é professor e minha mãe se formou, trabalhou um tempo, mas hoje ela está em casa. Ela é do lar. \nP/1 – Qual a formação deles?\nR – O meu pai se formou em Direito, a minha mãe em Geografia. \nP/1 – E a origem da sua família? É de São Paulo mesmo?\nR – Minha família é de São Paulo. Os meus bisavós são filhos de italianos, que vieram"}, "folder_size_gb": 0.0}, "folder_size_gb": 47.923}, "FGL_HV024_Cezar Augusti Lago Marques": {"Audiovisual": {"Acesso": {"FGL_HV024_Cezar Augusti Lago Marques.mp4": {"size_mb": 13276.1893, "modified": "2022-02-05
