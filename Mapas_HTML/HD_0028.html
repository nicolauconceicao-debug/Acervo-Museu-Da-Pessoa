"MDV_6177.avi": {"size_mb": 7567.2381, "modified": "2024-07-02 15:36:00", "extension": "AVI", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB001_Dayanne Renata Timóteo\\Audiovisual\\Preservação\\MDV_6177.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2094158.0, "duration": 2094.16, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 7.39}, "folder_size_gb": 8.73}, "Textual": {"PCV_CB001_Dayanne Renata Timóteo.DOC": {"size_mb": 0.0352, "modified": "2017-10-15 02:27:10", "extension": "DOC", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB001_Dayanne Renata Timóteo\\Textual\\PCV_CB001_Dayanne Renata Timóteo.DOC", "category": "Textual"}, "PCV_CB001_Dayanne Renata Timóteo.docx": {"size_mb": 0.0096, "modified": "2026-02-20 11:38:24", "extension": "DOCX", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB001_Dayanne Renata Timóteo\\Textual\\PCV_CB001_Dayanne Renata Timóteo.docx", "category": "Textual", "content_preview": "Seminário Programa Cultura Viva\nDepoimento de Dayanne Renata Timóteo\nEntrevistada por Danilo Eiji Lopes\nPirenópolis, 18 de novembro de 2009\nMuseu da Pessoa\nEntrevista nº CB001\nTranscrito por Paula Leal\nP/1 – Dayanne, então primeiramente queria agradecer, por oportunizar esse momento aqui com a gente.\nR – Imagina.\nP/1 – Você podia falar seu nome, local e data do seu nascimento, por favor?\nR – Dayanne Timóteo, 10 de dezembro de 1983, Guanhães, Minas Gerais.\nP/1 – Conta pra gente qual seu envolvimento com o programa Cultura Viva?\nR – Então, na verdade eu comecei a trabalhar com o programa Cultura Viva há dois anos e meio, quando aconteceu a segunda Teia em Belo Horizonte, eu trabalhava, trabalhei na produção da Teia em Belo Horizonte e depois vim trabalhar na Secretaria de Cidadania Cultural com Célio Turino. E aí eu vim coordenar a comunicação do programa e agora eu trabalho com os projetos especiais que são mais de fazer com que o Programa chegue a um maior número de pessoas possíveis. Então são os catálogos, exposições, na verdade são atividades, são projetos, na verdade que divulgam o Cultura Viva para que o programa chegue a mais pessoas possíveis, para que as pessoas a partir do"}, "folder_size_gb": 0.0}, "folder_size_gb": 8.73}, "PCV_CB002_Luiz Antônio de Oliveira": {"Audiovisual": {"Acesso": {"PCV_CB002_Luiz Antônio de Oliveira.mp4": {"size_mb": 2012.0497, "modified": "2024-07-02 11:55:00", "extension": "MP4", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB002_Luiz Antônio de Oliveira\\Audiovisual\\Acesso\\PCV_CB002_Luiz Antônio de Oliveira.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1211210.0, "duration": 1211.21, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.965}, "Preservação": {"Nota.txt": {"size_mb": 0.0001, "modified": "2024-07-02 12:22:24", "extension": "TXT", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB002_Luiz Antônio de Oliveira\\Audiovisual\\Preservação\\Nota.txt", "category": "Textual", "content_preview": "Mídia original: MDV_6177\n\nLocalização: Pasta \"PCV_CB001_Dayanne Renata Timóteo\""}, "folder_size_gb": 0.0}, "folder_size_gb": 1.965}, "Textual": {"PCV_CB002_Luiz Antônio de Oliveira.DOC": {"size_mb": 0.0376, "modified": "2017-10-15 08:57:06", "extension": "DOC", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB002_Luiz Antônio de Oliveira\\Textual\\PCV_CB002_Luiz Antônio de Oliveira.DOC", "category": "Textual"}, "PCV_CB002_Luiz Antônio de Oliveira.docx": {"size_mb": 0.0105, "modified": "2026-02-20 11:38:26", "extension": "DOCX", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB002_Luiz Antônio de Oliveira\\Textual\\PCV_CB002_Luiz Antônio de Oliveira.docx", "category": "Textual", "content_preview": "Projeto Seminário Programa Cultura Viva\nDepoimento de Luiz Antônio de Oliveira\nEntrevistado por Thiago Majolo\nPirenópolis, 18 de novembro de 2009\nEntrevista nº CB 002\nTranscrito por Paula Leal\nP/1 – Então, Luiz a gente vai começar com o básico, nome inteiro, o local e a data de nascimento.\nR – Meu nome é Luiz Antônio de Oliveira, nascido no Rio de Janeiro em 26 de setembro de 1967.\nP/1 – Luiz, conta qual trabalho você desenvolve assim, conta um pouco do local, desde quando você faz isso, o trabalho tem a ver com a Cultura Viva na verdade?\nR – Ah, a gente no âmbito do Cultura Viva, a gente trabalha no Museu da Maré, né, que é um Ponto de Cultura, começou como Ponto de Cultura, no primeiro edital do Ministério da Cultura, no Programa Cultura Viva. E o museu da Maré trabalha com memória, memória, identidade cultural com intervenção junto aos moradores da Maré, que é um bairro com 16 favelas, aproximadamente 140 mil moradores, né, então são 16 favelas com suas particularidades, com a favela que passou por processos históricos muito intensos, e aí percebeu que ela é interessante em função de questões da educação, questão da comunicação, questões sociais, trabalhar com memória, fazer um"}, "folder_size_gb": 0.0}, "folder_size_gb": 1.965}, "PCV_CB003_Antonia Maria do Carmo Rangel": {"Audiovisual": {"Acesso": {"PCV_CB003_Antonia Maria do Carmo Rangel.mp4": {"size_mb": 1274.5968, "modified": "2024-07-03 12:56:02", "extension": "MP4", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB003_Antonia Maria do Carmo Rangel\\Audiovisual\\Acesso\\PCV_CB003_Antonia Maria do Carmo Rangel.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 768234.0, "duration": 768.23, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.245}, "Preservação": {"MDV_6178.avi": {"size_mb": 5816.8783, "modified": "2024-07-02 11:53:44", "extension": "AVI", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB003_Antonia Maria do Carmo Rangel\\Audiovisual\\Preservação\\MDV_6178.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1609741.0, "duration": 1609.74, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 5.681}, "folder_size_gb": 6.925}, "Textual": {"PCV_CB003_Antonia Maria do Carmo Rangel.DOC": {"size_mb": 0.0352, "modified": "2018-12-07 07:49:10", "extension": "DOC", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB003_Antonia Maria do Carmo Rangel\\Textual\\PCV_CB003_Antonia Maria do Carmo Rangel.DOC", "category": "Textual"}, "PCV_CB003_Antonia Maria do Carmo Rangel.docx": {"size_mb": 0.0093, "modified": "2026-02-20 11:38:30", "extension": "DOCX", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB003_Antonia Maria do Carmo Rangel\\Textual\\PCV_CB003_Antonia Maria do Carmo Rangel.docx", "category": "Textual", "content_preview": "Projeto Seminário Programa Cultura Viva.\nDepoimento de Antonia Maria do Carmo Rangel\nEntrevistada por Danilo Eiji Lopes\nPirenópolis, 18 de novembro de 2009\nRealização Museu da Pessoa\nEntrevista nº CB 003\nTranscrito por Paula Leal\nP/1 – Bom, Antonia, inicialmente gostaria de agradecer por você oportunizar esse tempo aqui para contar um pouquinho da sua vida. Muito obrigado. Antonia, antes de mais nada você poderia falar o seu nome completo o local e a data de seu nascimento.\nR – Antonia Maria do Carmo Rangel, 22 de outubro de 1964, Brasília.\nP/1 – Qual é o seu envolvimento com o programa Cultura Viva? Amplo, né? (risos)\nR – É um trabalho, eu estou no Programa Cultura Viva desde 2005. O Programa ele foi criado em 2004, eu entrei no Ministério em 2005 e meio que quase que imediatamente no programa, né, Cultura Viva à partir de dezembro de 2005.\nP/1 – Você podia contar pra gente como foi a sua entrada assim, onde você estava e depois pra onde, como você entrou pro Programa, a participar?\nR – Bom, como entrei no programa ou como entrei no Ministério porque primeiro eu entrei no Ministério.\nP/1 – A participar do programa. \nR – Eu estava trabalhando, eu morava em São Paulo, fui convidada"}, "folder_size_gb": 0.0}, "folder_size_gb": 6.925}, "PCV_CB004_Silvio": {"Audiovisual": {"Acesso": {"PCV_CB004_Silvio.mp4": {"size_mb": 1355.3927, "modified": "2024-07-03 13:11:58", "extension": "MP4", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB004_Silvio\\Audiovisual\\Acesso\\PCV_CB004_Silvio.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 817917.0, "duration": 817.92, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.324}, "Preservação": {"Nota.txt": {"size_mb": 0.0001, "modified": "2024-07-11 09:28:46", "extension": "TXT", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB004_Silvio\\Audiovisual\\Preservação\\Nota.txt", "category": "Textual", "content_preview": "Mídia original: MDV_6178\n\nLocalização: Pasta \"PCV_CB003_Antonia Maria do Carmo Rangel\""}, "folder_size_gb": 0.0}, "folder_size_gb": 1.324}, "Textual": {"PCV_CB004_Silvio.DOC": {"size_mb": 0.0293, "modified": "2017-10-16 09:20:38", "extension": "DOC", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB004_Silvio\\Textual\\PCV_CB004_Silvio.DOC", "category": "Textual"}, "PCV_CB004_Silvio.docx": {"size_mb": 0.0088, "modified": "2026-02-20 11:38:32", "extension": "DOCX", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB004_Silvio\\Textual\\PCV_CB004_Silvio.docx", "category": "Textual", "content_preview": "Projeto Seminário Programa Cultura Viva \nDepoimento de Sílvio Da-Rin \nEntrevistada por Thiago Majolo\nPirenópolis, 18 de novembro de 2009\nRealização Museu da Pessoa\nEntrevista nº CB 004\nTranscrito por Paula Leal\nP/1 – Sílvio, a gente começa com o básico, o nome completo, por favor, o local e a data de nascimento.\nR – Sílvio Da-Rin, eu nasci no Rio de Janeiro, em 17 de setembro de 1949, e logo sou um virginiano.\nP/1 – Eu queria que você contasse o seu envolvimento pessoal com o Programa Cultura Viva?\nR – Em relação à Cultura Viva se dá no sistema MinC, sou secretário do Audiovisual desde novembro de 2007, o que me levou a conhecer mais de perto o Programa, o meu colega, meu homólogo Célio Turino, que eu acho que desenvolve de maneira brilhante esse projeto, reconfigurou o projeto aí, desenvolve de maneira muito inteligente, muito efetivo, de modo que minha relação com o Cultura Viva se dá dentro do Ministério da Cultura. Eu já visitei alguns poucos Pontos de Cultura, conheço o programa nas suas linhas gerais, e agora na qualidade de membro do conselho do Cultura Viva vou poder participar mais diretamente, influir mais de perto nos rumos do programa.\nP/1 – Eu queria que você contasse"}, "folder_size_gb": 0.0}, "folder_size_gb": 1.324}, "PCV_CB005_José Virgílio Leal de Figueiredo": {"Audiovisual": {"Acesso": {"PCV_CB005_José Virgílio Leal de Figueiredo.mp4": {"size_mb": 3468.79, "modified": "2024-07-03 13:56:42", "extension": "MP4", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB005_José Virgílio Leal de Figueiredo\\Audiovisual\\Acesso\\PCV_CB005_José Virgílio Leal de Figueiredo.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 2081413.0, "duration": 2081.41, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 3.387}, "Preservação": {"MDV_6179.avi": {"size_mb": 7494.3009, "modified": "2024-07-02 13:50:06", "extension": "AVI", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB005_José Virgílio Leal de Figueiredo\\Audiovisual\\Preservação\\MDV_6179.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2073972.0, "duration": 2073.97, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 7.319}, "folder_size_gb": 10.706}, "Textual": {"PCV_CB005_José Virgílio Leal de Figueiredo.DOC": {"size_mb": 0.0532, "modified": "2018-12-07 07:49:10", "extension": "DOC", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB005_José Virgílio Leal de Figueiredo\\Textual\\PCV_CB005_José Virgílio Leal de Figueiredo.DOC", "category": "Textual"}, "PCV_CB005_José Virgílio Leal de Figueiredo.docx": {"size_mb": 0.015, "modified": "2026-02-20 11:38:34", "extension": "DOCX", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB005_José Virgílio Leal de Figueiredo\\Textual\\PCV_CB005_José Virgílio Leal de Figueiredo.docx", "category": "Textual", "content_preview": "Projeto Seminário Programa Cultura Viva\nDepoimento de José Virgilio Leal de Figueiredo\nEntrevistado por Danilo Eiji Lopes\nPirenópolis, 19 de novembro de 2009\nRealização Museu da Pessoa\nEntrevista Nº CB 005\nTranscrito por Paula Leal\nP/1 – Bom Zé, primeiramente eu queria agradecer por você oportunizar o seu tempo aqui e contar um pouquinho da sua história pra gente, obrigado.\nR – Agradeço também o convite.\nP/1 – Desculpe. Por questão de identificação você poderia falar o seu nome completo, o local e a data do seu nascimento.\nR – Qual é o nome do programa?\nP/1 – Do Programa Cultura Viva. Do documentário ou do Museu da Pessoa?\nR – Do projeto de vocês?\nP/1 – Então o nome do projeto em si, a gente está junto com o programa Cultura Viva, né, fazendo a cobertura.\nP/1 – Não é para citar o projeto de vocês como Ponto de Cultura?\nP/1 – Do Museu da Pessoa?\nR – Sim.\nP/1 – Nós temos um ponto de cultura.\nR – Eu quero agradecer o projeto Museu da Pessoa.\nP/1 – Acho que enfim, fica à vontade.\nR- Bom, o meu nome é José Virgilio Leal Figueiredo, também gostaria de agradecer ao convite do programa Cultura Viva, o pessoal aí do Museu da Pessoa. Eu sou baiano de Salvador, estou há dez anos no estado de"}, "folder_size_gb": 0.0}, "folder_size_gb": 10.706}, "PCV_CB006_Waltermir Cedro dos Santos": {"Audiovisual": {"Acesso": {"PCV_CB006_Waltermir Cedro dos Santos.mp4": {"size_mb": 1366.7544, "modified": "2024-07-03 14:12:54", "extension": "MP4", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB006_Waltermir Cedro dos Santos\\Audiovisual\\Acesso\\PCV_CB006_Waltermir Cedro dos Santos.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 823089.0, "duration": 823.09, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.335}, "Preservação": {"MDV_6180.avi": {"size_mb": 8536.6196, "modified": "2024-07-02 14:44:08", "extension": "AVI", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB006_Waltermir Cedro dos Santos\\Audiovisual\\Preservação\\MDV_6180.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2362426.0, "duration": 2362.43, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 8.337}, "folder_size_gb": 9.671}, "Textual": {"PCV_CB006_Waltermir Cedro dos Santos.DOC": {"size_mb": 0.0396, "modified": "2017-10-20 07:49:06", "extension": "DOC", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB006_Waltermir Cedro dos Santos\\Textual\\PCV_CB006_Waltermir Cedro dos Santos.DOC", "category": "Textual"}, "PCV_CB006_Waltermir Cedro dos Santos.docx": {"size_mb": 0.0096, "modified": "2026-02-20 11:38:36", "extension": "DOCX", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB006_Waltermir Cedro dos Santos\\Textual\\PCV_CB006_Waltermir Cedro dos Santos.docx", "category": "Textual", "content_preview": "Projeto Seminário Programa Cultura Viva\nDepoimento de Valtemir Cedro dos Santos\nEntrevistado por Thiago Majolo\nPirenópolis, 19 de novembro de 2009\nRealização Museu da Pessoa\nEntrevista nº CB 06\nTranscrito por Paula Leal\nP/1 – Então Walter, a gente vai começar perguntando o nome completo, o local e a data do nascimento.\nR – Eu me chamo Valtemir Cedro dos Santos, nasci na cidade chamada Jacobina, na Bahia, e nasci no dia 19 de novembro de 1978, hoje eu estou fazendo 31 anos, né?\nP/1 – Bacana.  Walter conta para gente um pouco do trabalho que você desenvolve, o que você está fazendo aqui? Conta um pouquinho do processo.\nR – Eu sou do Ponto de Cultura Invenção Brasileira, né, da cidade Taguatinga no Distrito Federal, nosso maior foco lá do nosso Ponto de Cultura é trabalho com mamulengo, teatro de bonecos. Nosso projeto é um dos primeiros projetos da ação do Cultura Viva, foi de 2004 para 2005, a gente desenvolveu dentro da nossa comunidade varias oficinas de teatros de bonecos, e como a gente já tinha um trabalho em trâmite  dentro de software livre, a gente trabalhou um tempão com software livre também, e aqui eu vim participar também para fazer uma parte de articulação entre as pess"}, "folder_size_gb": 0.0}, "folder_size_gb": 9.671}, "PCV_CB007_Paul Heritage": {"Audiovisual": {"Acesso": {"PCV_CB007_Paul Heritage.mp4": {"size_mb": 3050.0604, "modified": "2024-07-03 14:48:42", "extension": "MP4", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB007_Paul Heritage\\Audiovisual\\Acesso\\PCV_CB007_Paul Heritage.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1834933.0, "duration": 1834.93, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 2.979}, "Preservação": {"MDV_6181.avi": {"size_mb": 6851.6939, "modified": "2024-07-03 09:51:14", "extension": "AVI", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB007_Paul Heritage\\Audiovisual\\Preservação\\MDV_6181.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1896127.0, "duration": 1896.13, "resolution": "720x480", "fps": 29.97}, "Nota.txt": {"size_mb": 0.0001, "modified": "2024-07-11 10:23:04", "extension": "TXT", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB007_Paul Heritage\\Audiovisual\\Preservação\\Nota.txt", "category": "Textual", "content_preview": "Mídia original: MDV_6180 e MDV_6181\n\nLocalização: Parte I, Pasta \"PCV_CB010_Bernd Fichtner\""}, "folder_size_gb": 6.691}, "folder_size_gb": 9.67}, "Textual": {"PCV_CB007_Paul Heritage.DOC": {"size_mb": 0.0488, "modified": "2018-12-07 07:49:10", "extension": "DOC", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB007_Paul Heritage\\Textual\\PCV_CB007_Paul Heritage.DOC", "category": "Textual"}, "PCV_CB007_Paul Heritage.docx": {"size_mb": 0.0136, "modified": "2026-02-20 11:38:38", "extension": "DOCX", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB007_Paul Heritage\\Textual\\PCV_CB007_Paul Heritage.docx", "category": "Textual", "content_preview": "Seminário Programa Cultura Viva\nDepoimento de Paul Heritage\nEntrevistado por Danilo Eiji Lopes\nPirenópolis, 19 de novembro de 2009\nRealização Museu da Pessoa\nEntrevista CB007\nTranscrito por Ana Lúcia Queiroz\nP/1 – Paul, iniciamente gostaria de agradecer por você oportunizar este bate papo aqui com a gente. Inicialmente, por favor, fale seu nome completo, o local e a data de seu nascimento.\nR – Meu nome é Paul Heritage, Heritage em inglês significa herança, então tem tudo a ver com o Museu da Pessoa. Eu nasci em Londres, em 9 de dezembro de 1958.\nP/1 – Qual o seu envolvimento com o Programa Cultura Viva?\nR – Olha, o Célio Turino, diretor do programa me convidou para vir para o seminário, porque no ano que vem nós vamos criar um intercâmbio entre o Reino Unido e o Brasil exatamente baseado na experiência do Programa Cultura Viva. Eu lancei um livro sobre o Programa, este ano e o Célio foi pra Londres para o lançamento, para falar sobre os Pontos de Cultura e durante este processo nós fizemos um encontro no Ministério da Cultura lá em Londres. Foi muito interessante para ver a diferença entre os dois países, como a Inglaterra está desenvolvendo projetos de arte social e também como o"}, "folder_size_gb": 0.0}, "folder_size_gb": 9.67}, "PCV_CB008_Elaine da Silva Tozzi": {"Audiovisual": {"Acesso": {"PCV_CB008_Elaine da Silva Tozzi.mp4": {"size_mb": 1322.3281, "modified": "2024-07-03 15:09:20", "extension": "MP4", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB008_Elaine da Silva Tozzi\\Audiovisual\\Acesso\\PCV_CB008_Elaine da Silva Tozzi.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 797930.0, "duration": 797.93, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.291}, "Preservação": {"Nota.txt": {"size_mb": 0.0001, "modified": "2024-07-11 09:52:28", "extension": "TXT", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB008_Elaine da Silva Tozzi\\Audiovisual\\Preservação\\Nota.txt", "category": "Textual", "content_preview": "Mídia original: MDV_6181\n\nLocalização: Pasta \"PCV_CB007_Paul Heritage\""}, "folder_size_gb": 0.0}, "folder_size_gb": 1.291}, "Textual": {"PCV_CB008_Elaine da Silva Tozzi.DOC": {"size_mb": 0.0303, "modified": "2017-10-20 13:21:58", "extension": "DOC", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB008_Elaine da Silva Tozzi\\Textual\\PCV_CB008_Elaine da Silva Tozzi.DOC", "category": "Textual"}, "PCV_CB008_Elaine da Silva Tozzi.docx": {"size_mb": 0.0087, "modified": "2026-02-20 11:38:42", "extension": "DOCX", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB008_Elaine da Silva Tozzi\\Textual\\PCV_CB008_Elaine da Silva Tozzi.docx", "category": "Textual", "content_preview": "Projeto Seminário Programa Cultura Viva\nDepoimento de Elaine da Silva Tozzi\nEntrevistado por Thiago Majolo\nPirenópolis, 19 de novembro de 2009\nRealização Museu da Pessoa\nEntrevista CB008\nTranscrito por Ana Lúcia Queiroz\nP/1 – Elaine, a gente começa sempre perguntando o nome completo, o local e data de nascimento.\nR – Eu sou Elaine da Silva Tozzi, eu nasci em Campinas, no interior de São Paulo, em 12 de agosto de 1969.\nP/1 – Queria que você contasse a sua atividade atual, que faz você estar aqui hoje. Conta um pouco do teu trabalho.\nR – Atualmente eu estou coordenadora de Cultura e Cidadania, na Secretaria de Cidadania Cultural, muito recentemente, faz apenas quatro meses que eu assumi esta coordenação. É uma coordenação que tem várias ações, como por exemplo, a Cultura Digital, a Saúde Cidade, Pontinhos de Cultura, o Programa Cultura Viva, dentro da Escola Viva, Agentes de Cultura. Estou esquecendo de alguma? Cultura e Saúde, Economia da Cultura. Eu diria que é uma das coordenações também centrais, que conversa com toda a rede de Pontos de Cultura.\nP/1 – Se puder contar um pouquinho mais para a gente entender a ação de vocês no dia a dia, como funciona o trabalho de vocês. \nR – O n"}, "folder_size_gb": 0.0}, "folder_size_gb": 1.291}, "PCV_CB009_Geo Britto": {"Audiovisual": {"Acesso": {"PCV_CB009_Geo Britto.mp4": {"size_mb": 1184.3679, "modified": "2024-07-03 15:23:32", "extension": "MP4", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB009_Geo Britto\\Audiovisual\\Acesso\\PCV_CB009_Geo Britto.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 713846.0, "duration": 713.85, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.157}, "Preservação": {"Nota.txt": {"size_mb": 0.0001, "modified": "2024-07-11 09:52:28", "extension": "TXT", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB009_Geo Britto\\Audiovisual\\Preservação\\Nota.txt", "category": "Textual", "content_preview": "Mídia original: MDV_6181\n\nLocalização: Pasta \"PCV_CB007_Paul Heritage\""}, "folder_size_gb": 0.0}, "folder_size_gb": 1.157}, "Textual": {"PCV_CB009_Geo Britto.DOC": {"size_mb": 0.0332, "modified": "2018-12-07 07:49:14", "extension": "DOC", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB009_Geo Britto\\Textual\\PCV_CB009_Geo Britto.DOC", "category": "Textual"}, "PCV_CB009_Geo Britto.docx": {"size_mb": 0.0095, "modified": "2026-02-20 11:38:44", "extension": "DOCX", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB009_Geo Britto\\Textual\\PCV_CB009_Geo Britto.docx", "category": "Textual", "content_preview": "Projeto Seminário Programa Cultura Viva\nDepoimento de Geraldo Britto Lopes\nEntrevistado por Thiago Majolo\nPirenópolis, 19 de novembro de 2009\nRealização Museu da Pessoa\nEntrevista CB009\nTranscrito por Ana Lúcia Queiroz\nP/1 – Geo, a gente começa sempre perguntando seu nome completo, o local e a data de nascimento.\nR – Geo Britto, Rio de Janeiro, 2 de julho de 1969.\nP/1 – Geo, eu queria que você falasse do trabalho que você desenvolve, do trabalho pelo qual você está aqui, desde quando começou, conta um pouco esta história.\nR – Do Ponto de Cultura especificamente ou da instituição de uma maneira em geral?\nP/1 – Ponto de Cultura para começar.\nR – Chamo Geo Britto, sou do Centro de Teatro do Oprimido. É uma entidade que existe há mais de 20 anos no Rio de Janeiro, que foi dirigido pelo Augusto Boal nos últimos 23 anos. Nós consideramos que sempre fomos um Ponto de Cultura já fazendo o que a filosofia dos Pontos de Cultura prega, no sentido de passar os meios de produção teatral para as próprias pessoas. Não só levar o consumo. Este é o trabalho que a gente faz. Nós somos um Ponto de Cultura e somos um Pontão. No nosso Ponto de Cultura, a gente trabalha no Rio de Janeiro com grupos do p"}, "folder_size_gb": 0.0}, "folder_size_gb": 1.157}, "PCV_CB010_Bernd Fichtner": {"Audiovisual": {"Acesso": {"PCV_CB010_Bernd Fichtner.mp4": {"size_mb": 1469.2954, "modified": "2024-07-03 15:43:38", "extension": "MP4", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB010_Bernd Fichtner\\Audiovisual\\Acesso\\PCV_CB010_Bernd Fichtner.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 886252.0, "duration": 886.25, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.435}, "Preservação": {"MDV_6182.avi": {"size_mb": 8615.7059, "modified": "2024-07-03 10:40:26", "extension": "AVI", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB010_Bernd Fichtner\\Audiovisual\\Preservação\\MDV_6182.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2384315.0, "duration": 2384.32, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 8.414}, "folder_size_gb": 9.849}, "Textual": {"PCV_CB010_Bernd Fichtner.DOC": {"size_mb": 0.0347, "modified": "2017-10-20 20:29:42", "extension": "DOC", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB010_Bernd Fichtner\\Textual\\PCV_CB010_Bernd Fichtner.DOC", "category": "Textual"}, "PCV_CB010_Bernd Fichtner.docx": {"size_mb": 0.0092, "modified": "2026-02-20 11:38:46", "extension": "DOCX", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB010_Bernd Fichtner\\Textual\\PCV_CB010_Bernd Fichtner.docx", "category": "Textual", "content_preview": "Seminário Programa Cultura Viva\nDepoimento de Bernd Fichtner \nEntrevistado por Danilo Eiji Lopes\nPirenópolis 19/11/2009\nRealização Museu da Pessoa\nEntrevista CB010\nTranscrito por Keila Barbosa\nP/1 – Bom, professor, inicialmente gostaria de agradecer você oportunizar esse momento aqui com a gente. Por questão de identificação, o senhor poderia falar o seu nome completo, a data e o local do seu nascimento?\nR – Bernd Fichtner, Bottrop, a cidade do meu nascimento, no dia 10 de outubro de 1942.\nP/1 – Ok, e Professor, e qual é o seu trabalho aqui, qual o seu envolvimento com o Programa Cultura Viva.\nR – Para mim foi uma grande surpresa, receber este convite, me sinto muito honrado porque conheço bastante prática dos Pontos de Cultura, estudei, analisei, e depois, acho que isso é um projeto importantíssimo, não somente para o Brasil, sobretudo para a Europa e Alemanha. Isso é um projeto inédito, na Alemanha não se tem algo parecido. Para mim é uma grande surpresa conhecer sobretudo a prática nos diferentes Pontos de Cultura.\nP/1 – Como foi a sua... foi uma tese, o que foi? Você estudou os Pontos de Cultura, o que foi, foi em campo...?\nR – Há dois anos atrás eu fui convidado, em Belo Horiz"}, "folder_size_gb": 0.0}, "folder_size_gb": 9.849}, "PCV_CB011_Frederico Augusto Barbosa da Silva": {"Audiovisual": {"Acesso": {"PCV_CB011_Frederico Augusto Barbosa da Silva.mp4": {"size_mb": 1345.6052, "modified": "2024-07-03 15:59:02", "extension": "MP4", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB011_Frederico Augusto Barbosa da Silva\\Audiovisual\\Acesso\\PCV_CB011_Frederico Augusto Barbosa da Silva.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 811678.0, "duration": 811.68, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.314}, "Preservação": {"Nota.txt": {"size_mb": 0.0001, "modified": "2024-07-11 10:13:02", "extension": "TXT", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB011_Frederico Augusto Barbosa da Silva\\Audiovisual\\Preservação\\Nota.txt", "category": "Textual", "content_preview": "Mídia original: MDV_6182\n\nLocalização: Pasta \"PCV_CB010_Bernd Fichtner\""}, "folder_size_gb": 0.0}, "folder_size_gb": 1.314}, "Textual": {"PCV_CB011_Frederico Augusto Barbosa da Silva.DOC": {"size_mb": 0.0337, "modified": "2018-12-07 07:49:10", "extension": "DOC", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB011_Frederico Augusto Barbosa da Silva\\Textual\\PCV_CB011_Frederico Augusto Barbosa da Silva.DOC", "category": "Textual"}, "PCV_CB011_Frederico Augusto Barbosa da Silva.docx": {"size_mb": 0.0088, "modified": "2026-02-20 11:38:48", "extension": "DOCX", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB011_Frederico Augusto Barbosa da Silva\\Textual\\PCV_CB011_Frederico Augusto Barbosa da Silva.docx", "category": "Textual", "content_preview": "Projeto Seminário Programa Cultura Viva\nDepoimento de Frederico Augusto Barbosa da Silva\nEntrevistado por Thiago Majolo \nPirenópolis, 19 de novembro de 2009 \nRealização Museu da Pessoa \nEntrevista nº CB011\nTranscrito por Rosângela Maria Nunes Henriques\nP/1 - Frederico, a gente sempre começa perguntando o nome completo, o local e a data de nascimento?\nR – Frederico Augusto Barbosa da Silva, eu nasci no Rio de Janeiro em 1966.\nP/1 – Eu queria que você contasse o que você faz hoje, a sua atividade atual que tem a ver com Programa Cultura Viva e desde quando? Conta um pouco essa história pra gente, como você entra nisso.\nR – Ah, eu tenho trabalhado com pesquisa na área de cultura desde... Talvez 1998 e depois a coisa foi se intensificando, né? Mas eu comecei lá desde aquele momento e por função de pesquisador de um órgão público, eu fiquei encarregado de acompanhar alguns programas e políticas do Ministério da Cultura. Nessas transições de idas e vindas do próprio Ministério, eu comecei a tomar contato com políticas do Ministério relacionadas a outro campo de pesquisa que eu atuava que eram pesquisas na área de saúde, né? Então eu tinha trabalhado com pesquisa de agente comunitário, a"}, "folder_size_gb": 0.0}, "folder_size_gb": 1.314}, "PCV_CB012_Candace Slater": {"Audiovisual": {"Acesso": {"PCV_CB012_Candace Slater.mp4": {"size_mb": 3081.4699, "modified": "2024-07-03 16:37:02", "extension": "MP4", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB012_Candace Slater\\Audiovisual\\Acesso\\PCV_CB012_Candace Slater.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1855287.0, "duration": 1855.29, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 3.009}, "Preservação": {"MDV_6183.avi": {"size_mb": 7968.0049, "modified": "2024-07-03 11:30:42", "extension": "AVI", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB012_Candace Slater\\Audiovisual\\Preservação\\MDV_6183.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2205069.0, "duration": 2205.07, "resolution": "720x480", "fps": 29.97}, "Nota.txt": {"size_mb": 0.0001, "modified": "2024-07-11 10:16:14", "extension": "TXT", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB012_Candace Slater\\Audiovisual\\Preservação\\Nota.txt", "category": "Textual", "content_preview": "Mídia original: MDV_6182 e MDV_6183\n\nLocalização: Parte I, Pasta \"PCV_CB010_Bernd Fichtner\""}, "folder_size_gb": 7.781}, "folder_size_gb": 10.791}, "Textual": {"PCV_CB012_Candace Slater.DOC": {"size_mb": 0.0508, "modified": "2017-10-23 10:32:46", "extension": "DOC", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB012_Candace Slater\\Textual\\PCV_CB012_Candace Slater.DOC", "category": "Textual"}, "PCV_CB012_Candace Slater.docx": {"size_mb": 0.013, "modified": "2026-02-20 11:38:50", "extension": "DOCX", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB012_Candace Slater\\Textual\\PCV_CB012_Candace Slater.docx", "category": "Textual", "content_preview": "Seminário Programa Cultura Viva \nDepoimento de Candance Slater \nEntrevistado por Danilo Eiji Lopes \nPirenópolis, 19 de novembro de 2009\nRealização Museu da Pessoa\nEntrevista nº CB012\nTranscrito por Rosângela Maria Nunes Henriques\nP/1 – Bom, professora inicialmente eu gostaria de agradecer por você nos dar essa entrevista, essa palhinha da sua vida pra gente e por uma questão de identificação, por favor, diga seu nome completo, o local e a data de seu nascimento?\nR – Meu nome é Candence Slater e eu nasci em Mineloa de Nova York e foi em 1948, no dia 28 de agosto de 1948.\nP/1 – Conte pra gente assim qual o seu envolvimento aqui com o Programa Cultura Viva? \nR – Foi realmente uma coisa que começou quase por acaso, porque o Célio e Gil estavam visitando a minha universidade, a Universidade Califórnia de Berkeley, temos uma cátedra do Ministério de Cultura e justamente naquela altura, eles estavam começando o Programa Cultura Viva e os Pontos de Cultura. Eu nunca tinha ouvido falar, então eles falaram que iam para são Francisco, eles queria estabelecer um Ponto de Cultura lá em São Francisco e pediram para eu acompanhá-los. Quer dizer então foi realmente uma coisa quase no começo da cas"}, "folder_size_gb": 0.0}, "folder_size_gb": 10.791}, "PCV_CB013_Jasiel Martins dos Santos": {"Audiovisual": {"Acesso": {"PCV_CB013_Jasiel Martins dos Santos.mp4": {"size_mb": 1718.8735, "modified": "2024-07-03 16:55:50", "extension": "MP4", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB013_Jasiel Martins dos Santos\\Audiovisual\\Acesso\\PCV_CB013_Jasiel Martins dos Santos.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1037403.0, "duration": 1037.4, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.679}, "Preservação": {"Nota.txt": {"size_mb": 0.0001, "modified": "2024-07-11 10:23:38", "extension": "TXT", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB013_Jasiel Martins dos Santos\\Audiovisual\\Preservação\\Nota.txt", "category": "Textual", "content_preview": "Mídia original: MDV_6183\n\nLocalização: Pasta \"PCV_CB012_Candace Slater\""}, "folder_size_gb": 0.0}, "folder_size_gb": 1.679}, "Textual": {"PCV_CB013_Jasiel Martins dos Santos.DOC": {"size_mb": 0.041, "modified": "2017-10-24 09:37:08", "extension": "DOC", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB013_Jasiel Martins dos Santos\\Textual\\PCV_CB013_Jasiel Martins dos Santos.DOC", "category": "Textual"}, "PCV_CB013_Jasiel Martins dos Santos.docx": {"size_mb": 0.0106, "modified": "2026-02-20 11:38:52", "extension": "DOCX", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB013_Jasiel Martins dos Santos\\Textual\\PCV_CB013_Jasiel Martins dos Santos.docx", "category": "Textual", "content_preview": "Projeto Seminário programa Cultura Viva\nDepoimento de Jasiel Martins dos Santos \nEntrevistado por Thiago Majolo\nPirenópolis, 19 de novembro de 2009\nRealização Museu da Pessoa\nEntrevista nº CB013\nTranscrito por Rosângela Maria Nunes Henriques\nP/1 – Jasiel, a gente começa perguntando o nome completo, o local e a data de nascimento?\nR – Jasiel Martins dos Santos, Piaçabuçu, Alagoas.\nP/1 – A data de nascimento.\nR – 12 de outubro de 1967.\nP/1 – Você nasceu em Maceió?\nR – Em Maceió.\nP/1 - Eu queria que você falasse um pouco do seu trabalho, o que você faz? Desde quando? Conta um pouco pra gente do Ponto e de você, né?\nR - Certo. Bom, eu sou professor, sou músico, mexo também com algumas coisas com audiovisual, instalações, fotografia e na realidade a história de lidar com a cultura propriamente dita, ela surgiu há uns 16 anos mais ou menos atrás em Piaçabuçu no caso, né? Quando eu fui morar lá... A gente tinha uma necessidade muito grande de ter alguma coisa relacionada com a cultura que fosse uma coisa de fato genuína que tivesse a identidade do povo de Piaçabuçu. E através dessa necessidade foi que a gente começou a construir alguma coisa nesse sentido. Uma delas que eu diria que é nos"}, "folder_size_gb": 0.0}, "folder_size_gb": 1.679}, "PCV_CB014_Josilene Brandão da Costa": {"Audiovisual": {"Acesso": {"PCV_CB014_Josilene Brandão da Costa.mp4": {"size_mb": 1996.7853, "modified": "2024-07-11 15:02:00", "extension": "MP4", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB014_Josilene Brandão da Costa\\Audiovisual\\Acesso\\PCV_CB014_Josilene Brandão da Costa.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1202101.0, "duration": 1202.1, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.95}, "Preservação": {"MDV_6184.avi": {"size_mb": 7499.4795, "modified": "2024-07-03 18:04:44", "extension": "AVI", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB014_Josilene Brandão da Costa\\Audiovisual\\Preservação\\MDV_6184.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2075406.0, "duration": 2075.41, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 7.324}, "folder_size_gb": 9.274}, "Textual": {"PCV_CB014_Josilene Brandão da Costa.DOC": {"size_mb": 0.0439, "modified": "2018-12-07 07:49:10", "extension": "DOC", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB014_Josilene Brandão da Costa\\Textual\\PCV_CB014_Josilene Brandão da Costa.DOC", "category": "Textual"}, "PCV_CB014_Josilene Brandão da Costa.docx": {"size_mb": 0.0112, "modified": "2026-02-20 11:38:56", "extension": "DOCX", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB014_Josilene Brandão da Costa\\Textual\\PCV_CB014_Josilene Brandão da Costa.docx", "category": "Textual", "content_preview": "Projeto Seminário Programa Cultura Viva \nDepoimento de Josilene Brandão da Costa \nEntrevistado por Danilo Eiji Lopes \nPirenópolis, 19 de novembro de 2009\nRealização Museu da Pessoa \nEntrevista nº CB014\nTranscrito por Rosângela Maria Nunes Henriques\nP/1 – Jô, muito obrigado por oportunizar esse momento, eu sei que está uma correria, muito obrigado. Pra começar por uma questão de identificação você poderia falar o seu nome completo, o local e a data do seu nascimento?\nR – Josilene Brandão da Costa, eu nasci na comunidade de Salobo, no município de Bacabal, Maranhão, num quilombo lá em Bacabal, em 1968.\nP/1 – Conta um pouco pra gente qual o seu envolvimento com o Programa? Qual a atividade que você exerce?\nR – Bom, o meu envolvimento com o Programa, ele já é bem recente do ponto de vista de que eu assumi recentemente a coordenação da Ação Griô dentro do MinC, mas eu já venho de uma luta dos movimentos sociais e automaticamente de atividades culturais no Maranhão e a nível nacional através do movimento Quilombola. Mas essa relação com o Programa propriamente dito já é bem recente, agora de forma mais institucional.\nP/1 – De forma institucional você está chamando o quê? Você visita os l"}, "folder_size_gb": 0.0}, "folder_size_gb": 9.274}, "PCV_CB015_Lia Caladre de Azevedo": {"Audiovisual": {"Acesso": {"PCV_CB015_Lia Caladre de Azevedo.mp4": {"size_mb": 1466.6878, "modified": "2024-07-11 15:18:40", "extension": "MP4", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB015_Lia Caladre de Azevedo\\Audiovisual\\Acesso\\PCV_CB015_Lia Caladre de Azevedo.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 883549.0, "duration": 883.55, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.432}, "Preservação": {"Nota.txt": {"size_mb": 0.0001, "modified": "2024-07-12 09:49:54", "extension": "TXT", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB015_Lia Caladre de Azevedo\\Audiovisual\\Preservação\\Nota.txt", "category": "Textual", "content_preview": "Mídia original: MDV_6184\n\nLocalização: Pasta \"PCV_CB014_Josilene Brandão da Costa\""}, "folder_size_gb": 0.0}, "folder_size_gb": 1.432}, "Textual": {"PCV_CB015_Lia Caladre de Azevedo.DOC": {"size_mb": 0.0356, "modified": "2018-12-07 07:49:10", "extension": "DOC", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB015_Lia Caladre de Azevedo\\Textual\\PCV_CB015_Lia Caladre de Azevedo.DOC", "category": "Textual"}, "PCV_CB015_Lia Caladre de Azevedo.docx": {"size_mb": 0.0093, "modified": "2026-02-20 11:38:58", "extension": "DOCX", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB015_Lia Caladre de Azevedo\\Textual\\PCV_CB015_Lia Caladre de Azevedo.docx", "category": "Textual", "content_preview": "Projeto Seminário Programa Cultura Viva \nDepoimento de Lia Calabre de Azevedo \nEntrevistada por Thiago Majolo\nPirenópolis, 19 de novembro de 2009\nRealização Museu da Pessoa\nEntrevista nº CB 015\nTranscrito por Rosângela Maria Nunes Henriques\nP/1 – Lia, a gente vai começar perguntando o nome completo, o local e a data de nascimento?\nR – Bom, eu sou Lia Calabre de Azevedo, eu nasci no Rio de Janeiro em março de 1960.\nP/1 – Eu queria que você contasse o que você faz agora? Quer dizer você está aqui por um motivo, né? Essa atividade você faz agora, quando começou? Como é que foi esse envolvimento pessoal?\nR – Bom, eu sou pesquisadora da Fundação Casa de Rui Barbosa e trabalho no setor de estudo de política cultural, pesquiso especificamente política cultural, na verdade sou historiadora o que não é muito comum historiador trabalhando com o contemporâneo,né? Trabalhando efetivamente com contemporâneo, faz pouco tempo que se faz isso, eu sou na verdade funcionária da fundação, eu sou pesquisadora concursada e isso é uma experiência bastante interessante num país como o nosso que temos poucos pesquisadores e poucos pesquisadores na área pública. Eu estou na Fundação desde 2002, na verdade"}, "folder_size_gb": 0.0}, "folder_size_gb": 1.432}, "PCV_CB016_Antonio Nilton Rodrigues Silva": {"Audiovisual": {"Acesso": {"PCV_CB016_Antonio Nilton Rodrigues Silva.mp4": {"size_mb": 2356.905, "modified": "2024-07-11 14:33:04", "extension": "MP4", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB016_Antonio Nilton Rodrigues Silva\\Audiovisual\\Acesso\\PCV_CB016_Antonio Nilton Rodrigues Silva.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1422488.0, "duration": 1422.49, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 2.302}, "Preservação": {"MDV_6185.avi": {"size_mb": 5177.859, "modified": "2024-07-11 10:08:08", "extension": "AVI", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB016_Antonio Nilton Rodrigues Silva\\Audiovisual\\Preservação\\MDV_6185.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1432898.0, "duration": 1432.9, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 5.057}, "folder_size_gb": 7.358}, "Textual": {"PCV_CB016_Antonio Nilton Rodrigues Silva.DOC": {"size_mb": 0.0503, "modified": "2017-11-08 11:13:58", "extension": "DOC", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB016_Antonio Nilton Rodrigues Silva\\Textual\\PCV_CB016_Antonio Nilton Rodrigues Silva.DOC", "category": "Textual"}, "PCV_CB016_Antonio Nilton Rodrigues Silva.docx": {"size_mb": 0.0135, "modified": "2026-02-20 11:39:00", "extension": "DOCX", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB016_Antonio Nilton Rodrigues Silva\\Textual\\PCV_CB016_Antonio Nilton Rodrigues Silva.docx", "category": "Textual", "content_preview": "Seminário Programa Cultura Viva\nDepoimento de Antônio Nilton Rodrigues Silva\nEntrevistado por Danilo Eiji Lopes\nPirenópolis, 19/11/2009\nRealização Museu da Pessoa\nEntrevista número CB016\nTranscrito por Beatriz Cristina Sowmy Rodrigues\nP/1 – Bom, então inicialmente eu gostaria de agradecer o apoio, Antonio Nilton, por vir aqui dar essa palavrinha pra gente. Por uma questão de identificação, você poderia falar o seu nome completo, o local e a data do seu nascimento?\nR – Antonio Nilton Rodrigues Silva, conhecido como Nilton Silva, nasci em Bom Jardim, Maranhão, no dia 1º de janeiro de 1962, né? Nasci num dia de festa.\nP/1 – Legal! Nilton, quanto tempo? Qual é o seu trabalho? O que é que você faz? Qual o seu desenvolvimento?\nR – Eu sou jornalista, apesar desse momento estar dedicado exclusivamente à gestão dos Argonautas Ambientalistas da Amazônia, mas a minha formação profissional é jornalista, profissão que eu sempre tenho exercido num momento, quando não estou com outra atividade, como é o caso agora, estou dedicado exclusivamente dedicado para a gestão da Ong.\nP/1 – Para uma gestão?\nR – Gestão da Ong, porque eu sou gestor constitucional da Ong, sou coordenador da Ong.\nP/1 – De qual"}, "folder_size_gb": 0.0}, "folder_size_gb": 7.358}, "PCV_CB017_Maria Benites": {"Audiovisual": {"Acesso": {"PCV_CB017_Maria Benites.mp4": {"size_mb": 1829.0172, "modified": "2024-07-11 15:41:00", "extension": "MP4", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB017_Maria Benites\\Audiovisual\\Acesso\\PCV_CB017_Maria Benites.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1100066.0, "duration": 1100.07, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.786}, "Preservação": {"MDV_6186.avi": {"size_mb": 8042.2689, "modified": "2024-07-11 11:22:56", "extension": "AVI", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB017_Maria Benites\\Audiovisual\\Preservação\\MDV_6186.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2225623.0, "duration": 2225.62, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 7.854}, "folder_size_gb": 9.64}, "Textual": {"PCV_CB017_Maria Benites.DOC": {"size_mb": 0.0381, "modified": "2017-11-08 11:14:58", "extension": "DOC", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB017_Maria Benites\\Textual\\PCV_CB017_Maria Benites.DOC", "category": "Textual"}, "PCV_CB017_Maria Benites.docx": {"size_mb": 0.0108, "modified": "2026-02-20 11:39:02", "extension": "DOCX", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB017_Maria Benites\\Textual\\PCV_CB017_Maria Benites.docx", "category": "Textual", "content_preview": "Seminário Programa Cultura Viva\nDepoimento de Maria Benites\nEntrevistado por Danilo Eiji Lopes\nPirenópolis, 20/11/2009\nRealização Museu da Pessoa\nEntrevista número CB017\nTranscrito por Beatriz Cristina Sowmy Rodrigues\nP/1 – Professora Maria Benites, queria agradecer pessoalmente por você dar esse momento, essa palavrinha com a gente, muito obrigado.\nR – Eu agradeço também por terem me convidado.\nP/1 – Professora, primeiro diga o seu nome completo, a data e o local do seu nascimento, por favor.\nR – Meu nome completo é Maria del Socorro Isabel Benites Moreno, nasci no dia 2 de outubro de 1947, na cidade de Buenos Aires.\nP/1 – Pra contar um pouco como qual é o seu envolvimento com o programa Cultura Viva, o que você...\nR – Olha, foi como toda uma vida por um acaso. Um dia nós chegamos, estávamos meu marido e eu, coordenávamos e dirigíamos uma pós-graduação em educação que é um programa de excelência único na área de educação, e nos chega um convite para participar de um simpósio de educação em Belo Horizonte chamado Teia, nada a ver conosco, né? E eu te pergunto, onde tiram o nosso nome? Saiu de uma publicação que nós tínhamos feito, umas coisas que um disse pro outro, o outro disse p"}, "folder_size_gb": 0.0}, "folder_size_gb": 9.64}, "PCV_CB018_Christiane Lafayete dos Santos": {"Audiovisual": {"Acesso": {"PCV_CB018_Christiane Lafayete dos Santos.mp4": {"size_mb": 1860.614, "modified": "2024-07-11 16:01:42", "extension": "MP4", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB018_Christiane Lafayete dos Santos\\Audiovisual\\Acesso\\PCV_CB018_Christiane Lafayete dos Santos.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1124991.0, "duration": 1124.99, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 1.817}, "Preservação": {"Nota.txt": {"size_mb": 0.0001, "modified": "2024-07-12 09:54:20", "extension": "TXT", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB018_Christiane Lafayete dos Santos\\Audiovisual\\Preservação\\Nota.txt", "category": "Textual", "content_preview": "Mídia original: MDV_6186\n\nLocalização: Pasta \"PCV_CB017_Mara Benites\""}, "folder_size_gb": 0.0}, "folder_size_gb": 1.817}, "Textual": {"PCV_CB018_Christiane Lafayete dos Santos.DOC": {"size_mb": 0.0386, "modified": "2017-11-08 11:15:52", "extension": "DOC", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB018_Christiane Lafayete dos Santos\\Textual\\PCV_CB018_Christiane Lafayete dos Santos.DOC", "category": "Textual"}, "PCV_CB018_Christiane Lafayete dos Santos.docx": {"size_mb": 0.0112, "modified": "2026-02-20 11:39:04", "extension": "DOCX", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB018_Christiane Lafayete dos Santos\\Textual\\PCV_CB018_Christiane Lafayete dos Santos.docx", "category": "Textual", "content_preview": "Seminário Programa Cultura Viva\nDepoimento de Christiane Lafayette dos Santos\nEntrevistado por Thiago Majolo\nPirenópolis, 19/11/2009\nRealização Museu da Pessoa\nEntrevista número CB018\nTranscrito por Beatriz Cristina Sowmy Rodrigues\nP/1 – A gente começa perguntando o nome completo, local e data de nascimento.\nR – Local que eu nasci? É Christiane Lafayette dos Santos, eu nasci em Santos, no dia 21 de janeiro de 1970.\nP/1 – Christiane, tente contar do seu trabalho, que você trabalha agora, pelo qual você está aqui hoje, enfim e desde quando você começou ele, conta um pouco da história pra gente.\nR – Então, meu trabalho acho que é fruto da minha ligação com o Programa Cultura Viva e essa história começou lá atrás, em 2005, quando foi aberto o segundo edital e eu era funcionária da Prefeitura de Hortolândia, na Secretaria da Cultura, escrevi o projeto, o projeto foi selecionado e aí eu fazia a supervisão técnica do processo de implantação dos Pontos de Cultura de Hortolândia, era uma rede com três pontos e eu também era coordenadora do Ponto de Cultura “Nós na Pauta”. Em 2009 eu deixei a administração pública, aí eu voltei pro teatro Sia Santa, que era o teatro que eu já havia trabalhad"}, "folder_size_gb": 0.0}, "folder_size_gb": 1.817}, "PCV_CB019_Jacqueline Baumgratz": {"Audiovisual": {"Acesso": {"PCV_CB019_Jacqueline Baumgratz.mp4": {"size_mb": 2494.6467, "modified": "2024-07-12 11:23:22", "extension": "MP4", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB019_Jacqueline Baumgratz\\Audiovisual\\Acesso\\PCV_CB019_Jacqueline Baumgratz.mp4", "category": "Video", "dimension": "1280x720", "height": 720, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 1503936.0, "duration": 1503.94, "resolution": "1280x720", "fps": 29.97}, "folder_size_gb": 2.436}, "Preservação": {"MDV_6187.avi": {"size_mb": 8770.0513, "modified": "2024-07-11 12:14:36", "extension": "AVI", "full_path": "D:\\Programa Cultura Viva (PCV)\\PCV_CB019_Jacqueline Baumgratz\\Audiovisual\\Preservação\\MDV_6187.avi", "category": "Video", "dimension": "720x480", "height": 480, "aspect_ratio": "1.5:1", "frame_rate": "29.970 fps", "codec": "DV", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2427024.0, "duration": 2427.02, "resolution": "720x480", "fps": 29.97}, "folder_size_gb": 8.565}, "folder_size_gb": 11.001}, "Textual": {"PCV_ const EXTENSIONS = {
    "Video": ['mp4', 'mov', 'mkv', 'avi', 'm4v', 'mts', 'm2ts', 'wmv', 'flv', 'webm', 'vob', 'ogv', '3gp', 'mxf'],
    "Audio": ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'aiff', 'pcm', 'aif'],
    "Image": ['jpg', 'jpeg', 'tif', 'tiff', 'png', 'gif', 'bmp', 'webp', 'cr2', 'nef', 'arw', 'dng'],
    "Textual": ['doc', 'docx', 'pdf', 'txt', 'rtf', 'odt', 'xls', 'xlsx', 'ppt', 'pptx']
};

const ICONS = { "Video": "🎞️", "Audio": "🎧", "Image": "🖼️", "Textual": "📝", "Other": "📄" };

function formatSmartSize(mbValue) {
    if (!mbValue || mbValue === 0) return "0 B";
    let bytes = mbValue * 1024 * 1024; 
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(2) + " " + units[i];
}

function getIcon(name, isFolder) {
    if (isFolder) return "📁";
    const ext = name.split('.').pop().toLowerCase();
    for (const [category, list] of Object.entries(EXTENSIONS)) {
        if (list.includes(ext)) return ICONS[category];
    }
    return ICONS["Other"];
}

function formatTime(ms) {
    if (!ms || ms === 0) return "N/A";
    let totalSeconds = Math.floor(ms / 1000);
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;
    return [hours, minutes, seconds].map(v => v < 10 ? "0" + v : v).join(":");
}

function tryLoadImage(imgElement, thumbnailPath, originalName) {
    if (!thumbnailPath && !originalName) return;
    let path = thumbnailPath || `thumbnails/thumb_${originalName.split('.').slice(0, -1).join('.')}.jpg`;
    imgElement.onerror = function() {
        this.onerror = null;
        this.src = 'https://via.placeholder.com/150?text=Sem+Preview';
    };
    imgElement.src = path;
}

function copyPreviewText() {
    const box = document.getElementById('preview-text');
    if (box) {
        navigator.clipboard.writeText(box.textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy Content"; }, 2000);
    }
}

function calculateFolderStats(node) {
    let stats = { Video: { count: 0, size: 0 }, Audio: { count: 0, size: 0 }, Image: { count: 0, size: 0 }, Textual: { count: 0, size: 0 }, Other: { count: 0, size: 0 }, totalSize: 0 };
    function traverse(curr) {
        for (let key in curr) {
            if (key === "folder_size_gb") continue;
            let item = curr[key];
            if (item.folder_size_gb !== undefined) traverse(item);
            else {
                let cat = item.category || "Other";
                if (!stats[cat]) cat = "Other";
                stats[cat].count++;
                stats[cat].size += item.size_mb || 0;
                stats.totalSize += item.size_mb || 0;
            }
        }
    }
    traverse(node);
    return stats;
}

function showMetadata(name, data, path) {
    const panel = document.getElementById("metadata-panel");
    const content = document.getElementById("meta-content");
    panel.style.display = "block";

    const isFolder = data.folder_size_gb !== undefined;
    let html = `
        <span class="meta-label">Nome</span><span class="meta-value">${name}</span>
        <span class="meta-label">Caminho</span><span class="meta-value">${data.full_path || path.join("/")}</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(data.full_path || "").replace(/\\/g, "\\\\")}')">Copy Path</button>
        <span class="meta-label">Tamanho</span><span class="meta-value" style="color:var(--accent); font-weight:bold;">${formatSmartSize(isFolder ? data.folder_size_gb * 1024 : data.size_mb)}</span>
    `;

    if (isFolder) {
        const stats = calculateFolderStats(data);
        const getPct = (size) => stats.totalSize > 0 ? ((size / stats.totalSize) * 100).toFixed(1) : 0;
        html += `
            <div class="stats-container">
                <span class="meta-label">Conteúdo</span>
                <div class="stats-bar">
                    <div class="bar-segment" style="width:${getPct(stats.Video.size)}%; background:var(--video)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Audio.size)}%; background:var(--audio)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Image.size)}%; background:var(--image)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Textual.size + stats.Other.size)}%; background:var(--other)"></div>
                </div>
                <div class="stat-row"><span>🎞️ Video</span><b>${stats.Video.count}</b></div>
                <div class="stat-row"><span>🎧 Audio</span><b>${stats.Audio.count}</b></div>
                <div class="stat-row"><span>🖼️ Images</span><b>${stats.Image.count}</b></div>
                <div class="stat-row"><span>📄 Docs / Other</span><b>${stats.Textual.count + stats.Other.count}</b></div>
            </div>`;
    } else {
        if (data.category === "Image" || data.thumbnail) {
            html += `<h3>Preview</h3>
                     <div class="img-preview-container">
                        <img id="preview-img" src="" alt="Carregando...">
                     </div>`;
            setTimeout(() => {
                const img = document.getElementById('preview-img');
                tryLoadImage(img, data.thumbnail, name);
            }, 50);
        }

        html += `<span class="meta-label">Modificado</span><span class="meta-value">${data.modified || "N/A"}</span>`;
        
        if (data.category === "Video") {
            // Garante que displayRes exista ou usa a dimensão original
            const displayRes = data.dimension || "N/A"; 
            
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Resolução</span><span class="meta-value">${displayRes}</span>
                <span class="meta-label">Duração / Áudio</span><span class="meta-value">${formatTime(data.duration_ms)} / ${data.audio_channels || "N/A"}</span>
                <span class="meta-label">Aspecto / FPS</span><span class="meta-value">${data.aspect_ratio || "N/A"} / ${data.frame_rate || "N/A"}</span>`;
        } else if (data.category === "Audio") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Duração</span><span class="meta-value">${formatTime(data.duration_ms)}</span>
                <span class="meta-label">Canais</span><span class="meta-value">${data.audio_channels || "N/A"}</span>`;
        } else if (data.category === "Image") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Dimensões</span><span class="meta-value">${data.dimension || "N/A"}</span>
                <span class="meta-label">DPI</span><span class="meta-value">${data.dpi || "N/A"}</span>`;
        }

        // NOVIDADE: Verifica explicitamente por content_preview ou categoria textual
        if (data.content_preview) {
            html += `<h3>Conteúdo do Documento</h3>
                     <div class="preview-box" id="preview-text">Loading content...</div>
                     <button class="copy-btn" onclick="copyPreviewText()">Copiar Conteúdo</button>`;
        }
    }
    
    content.innerHTML = html;

    // Sincronização garantida: espera o DOM atualizar para injetar o texto
    if (data.content_preview) {
        setTimeout(() => {
            const box = document.getElementById('preview-text');
            if (box) box.textContent = data.content_preview;
        }, 10);
    }
}

function navigateToPath(path) {
    // Limpa a busca e renderiza a visualização normal
    document.getElementById("search").value = "";
    renderColumn(TREE, 0);

    let currentNode = TREE;
    // O primeiro item do path costuma ser "Root" ou o nome do HD, pulamos ele se necessário
    const pathParts = path.slice(1); 

    pathParts.forEach((part, index) => {
        setTimeout(() => {
            const columns = document.querySelectorAll('.column');
            const currentColumn = columns[index];
            if (!currentColumn) return;

            const items = currentColumn.querySelectorAll('.item');
            for (let item of items) {
                if (item.querySelector('.item-text').textContent === part) {
                    item.click(); // Simula o clique no item para abrir a próxima coluna ou metadados
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

                }
            }

    });
}

function renderColumn(node, level, path = []) {
    const explorer = document.getElementById("explorer");
    while (explorer.children.length > level) explorer.removeChild(explorer.lastChild);
    const col = document.createElement("div"); col.className = "column";
    const keys = Object.keys(node).filter(k => k !== "folder_size_gb").sort((a, b) => {
        const aIsF = node[a].folder_size_gb !== undefined;
        const bIsF = node[b].folder_size_gb !== undefined;
        return (aIsF !== bIsF) ? bIsF - aIsF : a.localeCompare(b);
    });
    keys.forEach(name => {
        const val = node[name];
        const isFolder = val.folder_size_gb !== undefined;
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `<span class="icon">${getIcon(name, isFolder)}</span> <span class="item-text">${name}</span>`;
        item.onclick = () => {
            Array.from(col.children).forEach(c => c.classList.remove('active'));
            item.classList.add('active');
            showMetadata(name, val, path.concat(name));
            if (isFolder) renderColumn(val, level + 1, path.concat(name));
            else while (explorer.children.length > level + 1) explorer.removeChild(explorer.lastChild);
        };
        col.appendChild(item);
    });
    explorer.appendChild(col);
}

function performSearch() {
    const term = document.getElementById("search").value.toLowerCase();
    const explorer = document.getElementById("explorer");
    if (!term) { renderColumn(TREE, 0); return; }
    
    const results = [];
    function searchNode(node, currentPath) {
        for (const key in node) {
            if (key === "folder_size_gb") continue;
            const item = node[key];
            const isFolder = item.folder_size_gb !== undefined;
            const match = key.toLowerCase().includes(term) || (item.content_preview && item.content_preview.toLowerCase().includes(term));
            
            if (match) results.push({ name: key, data: item, path: currentPath.concat(key), isFolder });
            if (isFolder) searchNode(item, currentPath.concat(key));
        }
    }
    
    searchNode(TREE, ["Root"]); // Certifique-se que o nome base aqui condiz com seu JSON
    explorer.innerHTML = "";
    const col = document.createElement("div"); col.className = "column"; col.style.minWidth = "100%";
    
    results.slice(0, 100).forEach(res => {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<span class="icon">${getIcon(res.name, res.isFolder)}</span> 
                         <div><b>${res.name}</b><br><small style="color:#888">${res.path.join(" › ")}</small></div>`;
        
        // AQUI ESTÁ A MUDANÇA: Chama a navegação em vez de apenas mostrar metadados
        div.onclick = () => navigateToPath(res.path);
        
        col.appendChild(div);
    });
    explorer.appendChild(col);
}

document.addEventListener("DOMContentLoaded", () => renderColumn(TREE, 0));
</script>
</body>
