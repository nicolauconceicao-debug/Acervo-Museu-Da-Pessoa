 99010-1193 | mihefahartesanatos@gmail.com | Osasco / SP | [LÉSBICA / SUPERAÇÃO / PERDA DOS MOVIMENTOS]  | Rosana | https://zoom.us/j/98699907558\n2020-09-07 00:00:00 | 10h | Julia Silvério (passageira) | (11) 96399-0444 | São Paulo | Integração Modal / Segurança / Acessibilidade | Marcos | https://zoom.us/j/92934875463\n2020-09-07 00:00:00 | 14h30 | Luiz Mario | (92) 91083142 | luizmario1982@hotmail.com | Manaus | parto de uma passageira dentro do carro | Rosana | https://zoom.us/j/96699398185\n9h | Rosana Lima | (98) 8853-3294 | rosanalymma@gmail.com | Maranhão | Lila | https://zoom.us/j/97838415041\n2020-09-14 00:00:00 | 18h | Wagner (Cebola) | (3"}, "Briefing_Museu da Pessoa.docx": {"size_mb": 0.0243, "modified": "2020-09-10 16:12:51", "extension": "DOCX", "full_path": "D:\\99\\Briefing_Museu da Pessoa.docx", "category": "Textual", "content_preview": "Briefing das entrevistas - Museu da Pessoa\n\nPessoas e Cidades em Reconexão\nObjetivo: Evidenciar as histórias de motoristas e passageiros reconhecendo o papel de cada um como agentes de mobilidade e parte da solução para se reconectar com suas cidades a partir de opções inteligentes, acessíveis e seguras. Além de fazer com que a 99 seja percebida como uma marca que contribui para o debate sobre a democratização do acesso às cidades\nCore Message: A homenagem a esses motoristas e passageiros, expõe o compromisso da 99 com a mobilidade urbana e como suas ações transformam a plataforma em uma oportunidade de geração de renda e uma opção acessível e segura para os usuários.\nConsiderando os impactos da pandemia na mobilidade urbana, é preciso mostrar que os motoristas são protagonistas nesse cenário, seja para garantir o sustento de suas famílias (Renda), seja para o transporte seguro e acessível para quem precisava sair de casa durante o isolamento (opção a limitações do transporte público), seja para apoiar toda a sociedade na retomada das atividades (a partir das ações da 99 ao o que se refere a saúde - COVID, preço e novos produtos).\nSugestão de histórias\nMotoristas\nMárcia de Oliveira"}, "Informações para Cards.xlsx": {"size_mb": 0.0101, "modified": "2020-09-21 12:38:07", "extension": "XLSX", "full_path": "D:\\99\\Informações para Cards.xlsx", "category": "Textual", "content_preview": "NOME | RELAÇÃO C/ 99 | CIDADE | CURIOSIDADE\nMárcia | motorista | Salvador\nMiriam | motorista | Osasco\nAna Júlia | passageira | São Paulo\nLuíz Mario | motorista | Manaus\nLetícia Ribas | passageira | Curitiba\nWagner | motorista | Contagem\nCleidineia | passageira | Goiânia\nSandro | motorista | Florianopolis\nCléia | passageira | São Bernardo do Campo"}, "LICENÇA_99_Luiz Sérgio.pdf": {"size_mb": 0.187, "modified": "2020-10-15 13:50:46", "extension": "PDF", "full_path": "D:\\99\\LICENÇA_99_Luiz Sérgio.pdf", "category": "Textual", "content_preview": "LICENÇA  E CONSENTIMENTO PARA  USO DE IMAGEM E SOM DE VOZ \n(“LICENÇA”) \n\nLICENCIANTE:  \n\nCPF: \n\nIdentidade: \n\nEndereço: \n\nData de Nascimento: \n\nLICENCIADOS: \n\nINSTITUTO  MUSEU  DA  PESSOA.NET,  sociedade  sem  fins  lucrativos  voltada \nà  preservação  da  memória  social,  com  sede  em  São  Paulo,  Estado  de  São \nPaulo,  na  Rua  Natingui,  1100,  CEP  05443020,  inscrita  no  CNPJ/MF  sob  o  nº \n05.210.186/0001-27 (denominado  “Museu”). \n\n99  TECNOLOGIA  LTDA,  pessoa  jurídica  de  direito  privado,  inscrita  no \nCNPJ/MF  sob  o  nº  18.033.552/0001-61,  com  sede  em  São  Paulo,  SP, na Rua \nSansão  Alves  dos  Santos,  400,  7o  andar,  Cidade  Monções,  CEP  04571, \ndoravante denominada  simplesmente  “99”; \n\nConsiderando  que  Museu  e  99  pretendem  produzir  um  material  denominado \n“Histórias  de  Vida”,  incluindo  mas  não  limitado  a  compor  obras,  trabalhos  e \nmateriais  diversos  que  venham  a ser planejados, criados e/ou produzidos pelos \nLICENCIADOS \nfixação, \narmazenamento,  edição  e  utilização  de  imagem,  perfil,  som  da  voz,  nome  e \ndados  e  informações  biográficas  r Roteiro Taxi 99_Museu da Pessoa.pdf": {"size_mb": 0.2788, "modified": "2020-09-10 10:10:27", "extension": "PDF", "full_path": "D:\\99\\Roteiro Taxi 99_Museu da Pessoa.pdf", "category": "Textual", "content_preview": "Roteiro base \n\nIdentificação/Família \n\n●  Qual é seu nome, local e data de nascimento? \n●  Quais os nomes dos pais? \n●  O que os seus pais faziam? \n●  Quais eram os principais costumes da sua família? \n●  Você gostava de ouvir histórias? Quem te contava? \n●  Você sabe a origem da sua da família? \n●  Você tem irmãos? Quantos sãos? \n\nInfância \n\n●  Você lembra da casa onde passou sua infância? Como era? \n●  E o bairro e a cidade? \n●  Quais eram as suas brincadeiras favoritas? Você tinha muitos amigos? \n●  O que você mais gostava de fazer quando era criança? \n●  O que você queria ser quando crescesse? \n\nEducação \n\n●  Qual a primeira lembrança que você tem da escola? \n●  Você teve algum professor que te marcou? \n●  Como você ia para a escola? \n\n Juventude \n\n●  Quando e como você começou a sair sozinho ou com amigos? O que vocês faziam? \n\nTrabalho \n\n●  Quando começou a trabalhar e qual foi seu primeiro trabalho? \n●  O que você fazia com o dinheiro que ganhava? \n●  Que outros trabalhos você fez? \n\nFaculdade/Especialização/Curso Técnico \n\n●  Você fez faculdade? Qual? Por quê? \n●  O que mudou na sua vida nesse momento? \n●  Quais foram os momentos mais marcantes desse período? \n●  Como isso"}, "~$iefing_Museu da Pessoa.docx": {"size_mb": 0.0002, "modified": "2020-09-04 17:09:51", "extension": "DOCX", "full_path": "D:\\99\\~$iefing_Museu da Pessoa.docx", "category": "Textual", "content_preview": "[Error reading content: Package not found at 'D:\\99\\~$iefing_Museu da Pessoa.docx']"}, "~WRL0003.tmp": {"size_mb": 0.0215, "modified": "2020-09-04 15:16:27", "extension": "TMP", "full_path": "D:\\99\\~WRL0003.tmp", "category": "Other"}, "Fotos divulgação": {"Cleidineia": {"WhatsApp Image 2020-09-21 at 10.41.17.jpeg": {"size_mb": 0 de destino, ter que ir pra Belém, nascer na Santa Casa de Misericórdia, no dia 25 de agosto de 1970. Então, toda minha vida começou aqui no interior de Barcarena, um pouco mais distante aqui desse ponto em que nós estamos, do Rio São Francisco. Toda minha família é dessa região, de uma localidade chamada Tracuateua e nós vivemos até os anos 70, quando a sede do município não existia. E meus pais são naturais dessa região e tem uma história bem curiosa, porque a minha família é natural daqui e tem algumas interve"}, "folder_size_gb": 0.001}, "folder_size_gb": 76.6}, "HYD_HV002_Mario Assunção do Espírito Santos": {"Audiovisual": {"Arquivo bruto": {"MVI_1047.MOV": {"size_mb": 1296.9042, "modified": "2021-03-12 09:06:10", "extension": "MOV", "full_path": "D:\\Hydro\\HYD_HV002_Mario Assunção do Espírito Santos\\Audiovisual\\Arquivo bruto\\MVI_1047.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 345779.0, "duration": 345.78}, "MVI_1048.MOV": {"size_mb": 4082.8295, "modified": "2021-03-12 09:15:12", "extension": "MOV", "full_path": "D:\\Hydro\\HYD_HV002_Mario Assunção do Espírito Santos\\Audiovisual\\Arquivo bruto\\MVI_1048.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1088087.0, "duration": 1088.09}, "MVI_1049.MOV": {"size_mb": 1848.5132, "modified": "2021-03-12 09:46:51", "extension": "MOV", "full_path": "D:\\Hydro\\HYD_HV002_Mario Assunção do Espírito Santos\\Audiovisual\\Arquivo bruto\\MVI_1049.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 492993.0, "duration": 492.99}, "MVI_1050.MOV": {"size_mb": 4084.9914, "modified": "2021-03-12 09:53:41", " _Mário Assunção do Espírito Santo_transcrição.doc", "category": "Textual"}, "HYD_HV002_Mário Assunção do Espírito Santo_transcrição.docx": {"size_mb": 0.033, "modified": "2026-03-10 16:08:22", "extension": "DOCX", "full_path": "D:\\Hydro\\HYD_HV002_Mario Assunção do Espírito Santos\\Texto\\HYD_HV002_Mário Assunção do Espírito Santo_transcrição.docx", "category": "Textual", "content_preview": "Entrevista de Mário Assunção do Espírito Santo\nEntrevistado por Lucas Torigoe\nBarcarena, 18 de setembro de 2020\nProjeto Memória de Barcarena\nEntrevista número HYD_HV002\nP1 - Mário, fala pra mim, só pra começar, de uma vez, é o seu nome completo, data de nascimento e onde você nasceu.\nR1: Bom, eu me chamo Mário Assunção do Espírito Santo. Eu nasci em dois de fevereiro de 1975, no Hospital Santa Cecília, em Belém do Pará. Só nasci, né? Nasci, que aqui não tinha maternidade, não tinha médico, na época eram parteiras, né? E tanto a minha vó, que era parteira como a minha... a irmã dela também, estavam doentes, aí mamãe teve que ir pra Belém, pra que eu nascesse, né, lá.\nP1: Ela falou, a tua mãe ou o seu pai, como é que foi o teu parto? Se foi difícil, se foi ok?\nR1: Não. Foi tudo ok, porque a mamãe, eu já sou o quarto. Sou o quarto. Então, mamãe já tinha tido outros filhos, né? E, mesmo nessa questão de... a minha vó e a irmã dela, né, tia da mamãe, ser parteiras, então, eles já tinham todo um cuidado, né? Puxar barriga, ajeitar, né? Se tivesse torta a criança, né? E tinha todo um ritual, né? Aqui nós tínhamos todo um ritual, né, cuidado com a gestação.\nP1: Os seus irmãos nasceram de p"}, "HYD_HV002_Mário Santos_autorização.pdf": {"size_mb": 0.6349, "modified": "2021-05-20 02:47:10", "extension": "PDF", "full_path": "D:\\Hydro\\HYD_HV002_Mario Assunção do Espírito Santos\\Texto\\HYD_HV002_Mário Santos_autorização.pdf", "category": "Textual", "content_preview": ""}, "folder_size_gb": 0.001}, "folder_size_gb": 26.553}, "HYD_HV003_Valter dos Santos Freitas": {"Audiovisual": {  inteiro, a data de nascimento e onde o senhor nasceu?\nR1 – Valter dos Santos Freitas, sessenta e dois anos, nasci em 1958, na localidade conhecida como Laranjal. Naquele tempo nós éramos comunidade tradicional de São Lourenço, hoje nós somos conhecidos como território quilombola ribeirinho de São Lourenço, aí em Barcarena, né? Nasci em Barcarena, desde 1958. \nP1 – E como é a família da sua mãe, qual que é o nome dos seus avós?\nR1 – Meu avô era Fabriciano dos Santos e a minha avó era Joaquina, Maria Joaquina dos Santos. Minha mãe era Maria Joselina dos Santos e meu pai era José Rodrigues de Freitas.\nP1 – A família da tua mãe, o que eles faziam?\nR1 – Olha, nós vivíamos da agricultura naquele tempo, né, de pescarias, né, bem tradicional, caça no mato, né, coleta de frutas, entendeu, extrativismo geral, entendeu? Pescaria já falei, né, roças, plantações né, entendeu, plantações de... a gente"}, "HYD_HV003_Valter Freitas_autorização.pdf": {"size_mb": 0.6347, "modified": "2021-05-20 02:48:00", "extension": "PDF", "full_path": "D:\\Hydro\\HYD_HV003_Valter dos Santos Freitas\\Texto\\HYD_HV003_Valter Freitas_autorização.pdf", "category": "Textual", "content_preview": ""}, "folder_size_gb": 0.001}, "folder_size_gb": 20.547}, "HYD_HV004_Silvio Angelim dos Anjos": {"Audiovisual": {"Arquivo bruto": {"MVI_1066.MOV": {"size_mb": 4083.7644, "modified": "2021-02-16 19:33:04", "extension": "MOV", "full_path": "D:\\Hydro\\HYD_HV004_Silvio Angelim dos Anjos\\Audiovisual\\Arquivo bruto\\MVI_1066.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1088087.0, "duration": 1088.09}, "MVI_1067.MOV": {"size_mb": 2126.9949, "modified": "2021-02-16 19:11:50", "extension": "MOV", "full_path": "D:\\Hydro\\HYD_HV004_Silvio Angelim dos Anjos\\Audiovisual\\Arquivo bruto\\MVI_1067.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD : "Entrevista de Sílvio Angelim dos Anjos \nEntrevistado por Lucas Torigoe \nBarcarena, 19 de setembro de 2020\nProjeto Memórias de Barcarena\nEntrevista HYD_HV 004 \nTranscrito por Selma Paiva\nP/1- Silvio, qual é o seu nome inteiro? Onde você nasceu, em que data que foi?\nR- Meu nome é Silvio Angelim dos Anjos. Tenho trinta e sete anos. Nasci em Vila do Conde. A minha data de nascimento é 23 de novembro de 1982.  \nP/1- E como é a família da sua mãe? Seus avôs. Como é a família deles?\nR- Eu nasci, né, já não conhecendo os meus avós maternos. Eles já tinham falecido. Mas a família da minha mãe, todos são daqui da Vila do Conde também. O meu avô Adalberto. E a minha avó Rosa Angelim, que eu não conheci. Mas são todos daqui da Vila do Conde. São uma família muito unida, a família Angelim. São uma família muito unida, muito festiva. E, através dessa família, eu consegui passar, assim, musicalmente. Porque é uma família que é muito musical, né, muito alegre, muito festiva, assim.\nO que eles fazem? O que os seus avós fazem? A sua mãe faz? Com que trabalha?\nR- A minha mãe é doméstica. Ela é aposentada agora. A minha mãe é aposentada. Nós, na verdade, ela com meu pai trabalharam muito na agricultur"}, "folder_size_gb": 0.001}, "folder_size_gb": 28.38}, "HYD_HV005_Rony Nascimento": {"Audiovisual": {"Arquivo bruto": {"MVI_1078.MOV": {"size_mb": 186.3709, "modified": "2021-02-16 16:17:28", "extension": "MOV", "full_path": "D:\\Hydro\\HYD_HV005_Rony Nascimento\\Audiovisual\\Arquivo bruto\\MVI_1078.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 49583.0, "duration": 49.58}, "MVI_1079.MOV": {"size_mb": 4083.7239, "modified": "2021-02-16 17:31:46", "extension": "MOV", "full_path": "D:\\Hydro\\HYD_HV005_Rony Nascimento\\Audiovisual\\Arquivo bruto\\MVI_1079.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", Entrevistada por Lucas Torigoe\nBarcarena, 21 de setembro de 2020\nProjeto Memórias de Barcarena\nEntrevista número HYD_HV006\nTranscrito por Selma Paiva \nP1: Obrigado. Sandra, qual que é o seu nome inteiro, onde você nasceu, que dia que foi?\nR1: O meu nome é Sandra Georgete dos Santos Amorim, eu nasci no dia 28 de julho de 1969, aqui em Barcarena, onde eu moro hoje. Nós saímos por um período, né, mas retornamos pra... a minha casa é no local onde era a minha casa, do meu pai, onde eu nasci, minha casa hoje em dia. \nP1: Onde que é, daqui de Barcarena?\nR1: É ali no Quilombo Sítio São João, próximo Burajuba, que é um outro quilombo também.\nP1: E qual que é o nome do seu pai?\nR1: José Assunção Amorim.\nP1: José Assunção Amorim?\nR1: Isso.\nP1: E dos seus avós, pais do seu pai?\nR1: É Bertolino Alves Amorim e Argemira Barros. \nP1: Você os conheceu em vida?\nR1: Sim.\nP1: Como que eles eram?\nR1: Meu avô... é assim: a nossa família é misturada, negros com índios, né? A minha... o meu avô era um índio, né e a minha avó, ele roubou, era portuguesa, minha avó. Então o Assunção, né, o Assunção vem da minha avó, que quase nós não temos. Meu pai tinha, né: José Assunção Amori"}, "folder_size_gb": 0.001}, "folder_size_gb": 33.559}, "HYD_HV007_Irene da Silva Gomes": {"Audiovisual": {"Arquivo bruto": {"MVI_1102.MOV": {"size_mb": 99.642, "modified": "2021-02-17 08:18:40", "extension": "MOV", "full_path": "D:\\Hydro\\HYD_HV007_Irene da Silva Gomes\\Audiovisual\\Arquivo bruto\\MVI_1102.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 26493.0, "duration": 26.49}, "MVI_1103.MOV": {"size_mb": 4084.0008, "modified": "2021-02-17 09:27:14", "extension": "MOV", "full_path": "D:\\Hydro\\HYD_HV007_Irene da Silva Gomes\\Audiovisual\\Arquivo bruto\\MVI_1103.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_ra ": "Stereo", "audio_codec": "PCM", "duration_ms": 10861793.0, "duration": 10861.79}, "folder_size_gb": 1.784}, "Export": {"Nazareno Marinho Muniz .mp4": {"size_mb": 176.6479, "modified": "2022-03-04 11:56:18", "extension": "MP4", "full_path": "D:\\Hydro\\HYD_HV008_Nazareno Muniz\\Audiovisual\\Export\\Nazareno Marinho Muniz .mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "30.000 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 240340.0, "duration": 240.34}, "folder_size_gb": 0.173}, "folder_size_gb": 41.65}, "Texto": {"HYD_HV008_Nazareno Muniz.docx": {"size_mb": 0.0544, "modified": "2021-03-11 16:22:13", "extension": "DOCX", "full_path": "D:\\Hydro\\HYD_HV008_Nazareno Muniz\\Texto\\HYD_HV008_Nazareno Muniz.docx", "category": "Textual", "content_preview": ""}, "HYD_HV008_Nazareno Muniz_autorização.pdf": {"size_mb": 0.6536, "modified": "2021-05-20 02:56:38", "extension": "PDF", "full_path": "D:\\Hydro\\HYD_HV008_Nazareno Muniz\\Texto\\HYD_HV008_Nazareno Muniz_autorização.pdf", "category": "Textual", "content_preview": ""}, "HYD_HV008_Nazareno Muniz_transcrição.doc": {"size_mb": 0.2339, "modified": "2020-10-05 09:30:56", "extension": "DOC", "full_path": "D:\\Hydro\\HYD_HV008_Nazareno Muniz\\Texto\\HYD_HV008_Nazareno Muniz_transcrição.doc", "category": "Textual"}, "HYD_HV008_Nazareno Muniz_transcrição.docx": {"size_mb": 0.0575, "modified": "2026-03-10 16:08:27", "extension": "DOCX", "full_path": "D:\\Hydro\\HYD_HV008_Nazareno Muniz\\Texto\\HYD_HV008_Nazareno Muniz_transcrição.docx", "category": "Textual", "content_preview": "Entrevista de Nazareno Muniz\nEntrevistado por Lucas Torigoe\nBarcarena, 22 de setembro de 2020\nProjeto Memória de Barcarena\nEntrevista número HYD_HV008\nTranscrita por Selma Paiva\nP1: Nazareno, você me fala então o seu nome inteiro, local de nascimento e que data foi. \nR1: É... eu sou Nazareno Muniz. Eu nasci em Barcarena, em 1974, na comunidade Arienga Estrada. Lá que eu nasci. \nP1: Que dia que foi? \nR1: 13 de outubro de 1974.\nP1: Qual que é o nome do seu pai e da sua mãe?\nR1: Do meu pai é Marinho Monteiro da Conceição e minha mãe Erundina Marinho Muniz. Agora, da Conceição. Eu sou registrado só no nome de minha mãe.\nP1: Por quê?\nR: É... que naquela época não tinha salário família ((risos)) Aí nascia, principalmente aqui no interior, acho que com muita gente era assim: “Ah, vai lá registrá-lo, eu estou ocupado, eu estou na roça”. Lavrador e tal. Aí mamãe foi. Naquela época também não tinha muita exigência, eu acho, aí registrou eu. Mas eu fui criado por ele até... ele era trinta anos mais velho que a minha mãe, o meu pai. Ele já tinha uma família, onde o meu irmão mais velho, é mais velho que a minha mãe, no caso, né? Eles são naturais de Inhangapi, meu pai e minha mãe, de Castanhal"}, "folder_size_gb": 0.001}, "folder_size_gb": 41.651}, "HYD_HV009_Antônio Palheta dos Santos": {"Audiovisual": {"Arquivo bruto": {"MVI_1131.MOV": {"size_mb": 4083.5645, "modified": "2021-03-18 23:40:06", "extension": "MOV", "full_path": "D:\\Hydro\\HYD_HV009_Antônio Palheta dos Santos\\Audiovisual\\Arquivo bruto\\MVI_1131.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1088087.0, "duration": 1088.09}, "MVI_1132.MOV": {"size_mb": 848.8479, "modified": "2021-03-18 21:18:06", "extension": "MOV", "full_path": "D:\\Hydro\\HYD_HV009_Antônio Palheta dos Santos\\Audiovisual\\Arquivo bruto\\MVI_1132.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 226093.0, "duration": 226.09}, "MVI_1133.MOV": {"size_mb": 4083.6558, "modified": "2021-03-18 23:40:20", "extension": "MOV", "full_path": "D:\\Hydro\\HYD_HV009_Antônio Palheta dos Santos\\Audiovisual\\Arquivo bruto\\MVI_ revista de Antonio Palheta dos Santos\nEntrevistado por Lucas Torigoe\nBarcarena, 23 de setembro de 2020\nProjeto Memória de Barcarena\nEntrevista número HYD_HV009\nTranscrito por Selma Paiva \nP/1- ‘Seu’ Antonio, fala pra mim, então, o nome do senhor, local e data de nascimento, por favor.\nR- Bom, eu me chamo Antonio Palheta dos Santos. Eu tenho sessenta e três anos de idade. Nasci no dia oito de novembro de 1957, na localidade de Vila do Conde, município de Barcarena, aonde até hoje moro. Sou casado. Minha esposa é Maria José Carneiro dos Santos. Sou pai de três filhos, tudo já adultos, o mais velho já me deu três netos, né? E, graças a Deus, todos encaminhados. E o meu trabalho foi sempre dedicado à comunidade, né? Mais de... a metade da minha vida dedicada à comunidade. Por isso eu tenho essa vasta experiência, vamos dizer assim, da história da nossa comunidade, entendeu?\nP/1- Antes de chegar lá, você me fala o nome dos seus avós por parte de pai, por favor?\nR- O meu avô por parte só de mãe, né, porque o da parte de pai eu não conheci. Por parte de pai, a minha avó era Maria Palheta dos Santos, por isso que o meu sobrenome é Palheta. E o meu avô era Anton"}, "HYD_HV009_Antônio Palheta_autorização.pdf": {"size_mb": 0.6446, "modified": "2021-05-20 02:59:54", "extension": "PDF", "full_path": "D:\\Hydro\\HYD_HV009_Antônio Palheta dos Santos\\Texto\\HYD_HV009_Antônio Palheta_autorização.pdf", "category": "Textual", "content_preview": ""}, "folder_size_gb": 0.001}, "folder_size_gb": 25.396}, "HYD_HV010_Maria de Nazaré Menezes da Costa": {"Audiovisual": {"Arquivo bruto": {"MVI_1141.MOV": {"size_mb": 4083.3723, "modified": "2021-05-03 12:18:34", "extension": "MOV", "full_path": "D:\\Hydro\\HYD_HV010_Maria de Nazaré Menezes da Costa\\Audiovisual\\Arquivo bruto\\MVI_1141.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1088087.0, 080", "aspect_ratio": "16:9 (HD)", "frame_rate": "30.000 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 172244.0, "duration": 172.24}, "folder_size_gb": 0.124}, "folder_size_gb": 13.631}, "Texto": {"HYD_HV010_Maria de Nazaré Menezes da Costa.docx": {"size_mb": 0.0494, "modified": "2021-03-11 16:22:42", "extension": "DOCX", "full_path": "D:\\Hydro\\HYD_HV010_Maria de Nazaré Menezes da Costa\\Texto\\HYD_HV010_Maria de Nazaré Menezes da Costa.docx", "category": "Textual", "content_preview": ""}, "HYD_HV010_Maria Menezes_trancrição.docx": {"size_mb": 0.0541, "modified": "2020-10-05 13:27:04", "extension": "DOCX", "full_path": "D:\\Hydro\\HYD_HV010_Maria de Nazaré Menezes da Costa\\Texto\\HYD_HV010_Maria Menezes_trancrição.docx", "category": "Textual", "content_preview": "Entrevista de Maria de Nazaré Menezes da Costa\nEntrevistada por Lucas Torigoe\nBarcarena, 23 de setembro de 2020\nProjeto Memória de Barcarena\nEntrevista número HYD_HV010\nTranscrita por Selma Paiva\nP1 – Dona Maria, obrigado.\nR1 – Por nada.\nP1 – A senhora me fala o nome inteiro da senhora, onde a senhora nasceu, que dia que foi também?\nR1 – Eu não sei a data do meu nascimento, nem o ano que eu nasci, nem o mês. Porque, quando eu me entendi no mundo, meu pai não me mandou educar, não me deu a sabedoria de nada, senão trabalho de roça. \nP1 – Mas o nome inteiro e o local...\nR1 – Lá? Sítio Tapuó.\nP1 – E qual é o nome da senhora?\nR1 – Meu nome é Maria de Nazaré Menezes da Costa.\nP1 – A senhora nasceu aqui em Barcarena?\nR1 – Foi, sim senhor. Lá naquele local lá, Tapuó.\nP1 – Qual que é o nome?\nR1 – Barcarena, Cafezal. Município de Barcarena, Cafezal.\nP1 – E teu pai, quem era teu pai?\nR1 – Antônio Ferreira Tenor.\nP1 – Ele era como, o teu pai?\nR1 – Ele era baixinho assim, tipo assim, meio índio.\nP1 – Ele era meio índio? \nR1 – Ele era.\nP1 – Por que ele era meio índio?\nR1 – Porque ele foi criado lá na natureza, que estavam os índios. Pai dele, mãe dele na”\nEntrevista número HYD_HV011\nTranscrito por Selma Paiva \nP1 – Obrigado pela presença do senhor, pelo tempo. \nR1 – Obrigado a você, pelo convite.\nP1 – Imagina. Você pode... vamos começar assim: você fala o seu nome, o local de nascimento e data, por favor?\nR1 – Eu sou R1 Zacarias, nasci em Abaetetuba, sou originário do Pará e nasci em cinco de novembro de 1960. \nP1 – Legal. E o nome da sua mãe, qual que é?\nR1 – Mamédea Azevedo Silva. \nP1 – Da família da sua mãe, qual que é a avó e o avô?\nR1 – Tudo de Abaetetuba. Nós somos tudo originário de Abaetetuba. É João Roberto e o nome da minha avó (risos) não estou lembrado agora. \nP1 – Não tem problema. Eles, a família da sua mãe, fazia o quê?\nR1 – Eles eram moradores do interior de Abaetetuba, na verdade, né? Meu pai é pescador e eles eram naturais, mesmo, do interior. Vivia aquela vida do interior mesmo: pesca, plantação e tal, esse negócio aqui. Na verdade, eu fui o primeiro da família que vim morar em Abaetetuba.\nP1 – Na cidade?\nR1 – Na cidade de Abaetetuba. Meu pai ficou pra lá. Eu,"}, "folder_size_gb": 0.001}, "folder_size_gb": 19.01}, "HYD_HV012_Raimundo Cordeiro Spindola": {"Audiovisual": {"Arquivo bruto": {"MVI_9692.MOV": {"size_mb": 3.6669, "modified": "2021-05-19 11:10:32", "extension": "MOV", "full_path": "D:\\Hydro\\HYD_HV012_Raimundo Cordeiro Spindola\\Audiovisual\\Arquivo bruto\\MVI_9692.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1468.0, "duration": 1.47}, "MVI_9693.MOV": {"size_mb": 4083.6651, "modified": "2021-05-19 11:47:43", "extension": "MOV", "full_path": "D:\\Hydro\\HYD_HV012_Raimundo Cordeiro Spindola\\Audiovisual\\Arquivo bruto\\MVI_9693.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1088087.0, "du :23:23", "extension": "DOCX", "full_path": "D:\\Hydro\\HYD_HV012_Raimundo Cordeiro Spindola\\Texto\\HYD_HV012_Raimundo Correia Espíndola.docx.docx", "category": "Textual", "content_preview": ""}, "HYD_HV012_Raimundo Correia Espíndola_transcrição.doc": {"size_mb": 0.2036, "modified": "2020-10-06 15:52:53", "extension": "DOC", "full_path": "D:\\Hydro\\HYD_HV012_Raimundo Cordeiro Spindola\\Texto\\HYD_HV012_Raimundo Correia Espíndola_transcrição.doc", "category": "Textual"}, "HYD_HV012_Raimundo Correia Espíndola_transcrição.docx": {"size_mb": 0.0466, "modified": "2026-03-10 16:08:29", "extension": "DOCX", "full_path": "D:\\Hydro\\HYD_HV012_Raimundo Cordeiro Spindola\\Texto\\HYD_HV012_Raimundo Correia Espíndola_transcrição.docx", "category": "Textual", "content_preview": "Entrevista de Raimundo Cordeiro Espíndola \nEntrevistado por Lucas Torigoe\nBarcarena, 25 de setembro de 2020\nProjeto Memória de Barcarena\nEntrevista número HYD_HV012\nTranscrito por Selma Paiva \nP1: Senhor Onofre, obrigado pela presença do senhor, tá? Obrigado pelo tempo.\nR1: Ok.\nP1: E qual que é o nome do senhor, onde o senhor nasceu e que dia que foi?\nR1: Meu nome de batismo, como se diz, porque o apelido de Onofre... é um apelido, né? Que sempre a gente tem esse apelido em casa, como se diz. Raimundo Cordeiro Espíndola. Eu ainda digo assim, quando eu vou assinar... quando alguém vai assinar, eu ainda digo: \"D-O\". Porque senão tem gente se escreve Espíndula, ((riso)) aí não cola. Meu documento está Espíndola. Então é isso. Onde eu nasci? Pois é, nasci na boca de um riozinho por nome Guajará da Serraria no Rio Mucuruçá direto. Que esse que é o Mucuruçá que vai, que o Rio Barcarena que diz era o Rio Mucuruçá. Aquela segunda ponte que passa, quem vai pra Barcarena, é esse riozinho.\nP1: E que dia foi? Que dia que foi?\nR1: Ah, que dia? O dia mais feliz do ano, dia 12 de junho de 1950. (risos) Dia dos Namorados ainda, pra acabar de inteirar.\nP1: O senhor nasceu no Dia dos Namorados?\nR1:"}, "HYD ation": 2485.18}, "folder_size_gb": 2.272}, "Export": {"Roberto Carlos Dias dos Anjos.mp4": {"size_mb": 218.903, "modified": "2022-03-04 11:54:51", "extension": "MP4", "full_path": "D:\\Hydro\\HYD_HV014_Roberto Carlos Dias dos Anjos\\Audiovisual\\Export\\Roberto Carlos Dias dos Anjos.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "30.000 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 299839.0, "duration": 299.84}, "folder_size_gb": 0.214}, "folder_size_gb": 52.699}, "Texto": {"HYD_HV0014_Roberto Carlos Dias dos Anjos_transcrição.docx": {"size_mb": 0.1739, "modified": "2020-10-13 08:45:55", "extension": "DOCX", "full_path": "D:\\Hydro\\HYD_HV014_Roberto Carlos Dias dos Anjos\\Texto\\HYD_HV0014_Roberto Carlos Dias dos Anjos_transcrição.docx", "category": "Textual", "content_preview": "HYD_HV0014_Roberto_Carlos_Dias_dos_Anjos\nEntrevista de Roberto Carlos Dias dos Anjos\nEntrevistado por Lucas Torigoe\nBarcarena, 26 de setembro de 2020\nProjeto Memória de Barcarena\nEntrevista número HYD_HV0014\nTranscrito por Selma Paiva\nP/1- O senhor sempre fala olhando pra mim, não precisa olhar pra câmera.\nR- Certo. Tá.\nP/1- Senhor Roberto, qual é o nome inteiro do senhor? Onde o senhor nasceu? Que dia que foi?\nR- O meu nome é Roberto Carlos Dias dos Anjos. Eu sou natural de Barcarena. Nasci na Vila do Conde, no dia primeiro de dezembro de mil novecentos e sessenta e seis.\nP/1- E qual é o  nome da sua mãe, senhor Roberto?\nR- O nome da minha mãe é Aida Dias Moreira dos Anjos. E do meu pai é Alfredo Miranda dos Anjos.\nP/1- Qual é o nome dos seus avós, parte de mãe?\nR- Parte de mãe... \nP/1- Não tem problema não, se você não lembrar. Você os conheceu?\nR- Conheci só a minha avó. Era Juvência, o nome dela. Juvência Moreira, né e o meu avô eu não conheci, na verdade. Nem lembro o nome dele, no momento.\nP/1- Entendi. Mas a sua avó você se lembra como ela era?\nR- Lembro. Uma pessoa... na ver o\t\nEntrevista de R1 Apolaro do Nascimento\nEntrevistada por P1 Torigoe\nBarcarena, 28 de setembro de 2020\nProjeto “Memória de Barcarena”\nEntrevista número HYD_HV015\nTranscrita por Selma Paiva\nP1 – Obrigado por ter vindo, antes de mais nada. Obrigado por sua presença. Eu queria perguntar, então, o seu nome completo, local e data de nascimento...\nR1 – Meu nome é Lia Apolaro do Nascimento, nasci no ano de 1976, em Barcarena, Pará, no dia dezessete de agosto desse ano e sou barcarenense, moro aqui, sempre morei.\nP1 – E qual é o nome da sua mãe?\nR1 – Minha mãe se chama Atanásia da Costa Apolaro, ela é de São Sebastião de Boa Vista, tem setenta e três anos. Está viva.\nP1 – Está viva ainda? E os seus avós por parte de mãe? Qual que é o nome deles?\nR1 – Antônio... que é da minha mãe, esse aí é o materno, né, que você está perguntando? Meus avós maternos são Alberto Bandeira e Davina Bandeira. São de São Sebastião da Boa Vista também.\nP1 – Do Pará?\nR1 – Pará. Marajó. Ilha do Marajó.\nP1 – E você os conheceu em vida?\nR1 – Não, não conheci meus avós. Tanto é que eu tinha avós que eu considerava avós, mas eram pessoas de Barcarena, né, com quem eu convivi, que eram da... do int"}, "folder_size_gb": 0.001}, "folder_size_gb": 29.129}, "Webdoc": {"Memórias de Barcarena _ Barca da Baleia.mov": {"size_mb": 411.4195, "modified": "2022-04-05 13:53:30", "extension": "MOV", "full_path": "D:\\Hydro\\Webdoc\\Memórias de Barcarena _ Barca da Baleia.mov", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 287204.0, "duration": 287.2}, "Memórias de Barcarena _ Barca da Família.mov": {"size_mb": 1081.2094, "modified": "2022-04-05 11:59:55", "extension": "MOV", "full_path": "D:\\Hydro\\Webdoc\\Memórias de Barcarena _ Barca da Família.mov", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "59.940 fps", "codec const ICONS = { "Video": "🎞️", "Audio": "🎧", "Image": "🖼️", "Textual": "📝", "Other": "📄" };

function formatSmartSize(mbValue) {
    if (!mbValue || mbValue === 0) return "0 B";
    let bytes = mbValue * 1024 * 1024; 
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(2) + " " + units[i];
}

function getIcon(name, isFolder) {
    if (isFolder) return "📁";
    const ext = name.split('.').pop().toLowerCase();
    for (const [category, list] of Object.entries(EXTENSIONS)) {
        if (list.includes(ext)) return ICONS[category];
    }
    return ICONS["Other"];
}

function formatTime(ms) {
    if (!ms || ms === 0) return "N/A";
    let totalSeconds = Math.floor(ms / 1000);
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;
    return [hours, minutes, seconds].map(v => v < 10 ? "0" + v : v).join(":");
}

function tryLoadImage(imgElement, thumbnailPath, originalName) {
    if (!thumbnailPath && !originalName) return;
    let path = thumbnailPath || `thumbnails/thumb_${originalName.split('.').slice(0, -1).join('.')}.jpg`;
    imgElement.onerror = function() {
        this.onerror = null;
        this.src = 'https://via.placeholder.com/150?text=Sem+Preview';
    };
    imgElement.src = path;
}

function copyPreviewText() {
    const box = document.getElementById('preview-text');
    if (box) {
        navigator.clipboard.writeText(box.textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy Content"; }, 2000);
    }
}

function calculateFolderStats(node) {
    let stats = { Video: { count: 0, size: 0 }, Audio: { count: 0, size: 0 }, Image: { count: 0, size: 0 }, Textual: { count: 0, size: 0 }, Other: { count: 0, size: 0 }, totalSize: 0 };
    function traverse(curr) {
        for (let key in curr) {
            if (key === "folder_size_gb") continue;
            let item = curr[key];
            if (item.folder_size_gb !== undefined) traverse(item);
            else {
                let cat = item.category || "Other";
                if (!stats[cat]) cat = "Other";
                stats[cat].count++;
                stats[cat].size += item.size_mb || 0;
                stats.totalSize += item.size_mb || 0;
            }
        }
    }
    traverse(node);
    return stats;
}

function showMetadata(name, data, path) {
    const panel = document.getElementById("metadata-panel");
    const content = document.getElementById("meta-content");
    panel.style.display = "block";

    const isFolder = data.folder_size_gb !== undefined;
    let html = `
        <span class="meta-label">Nome</span><span class="meta-value">${name}</span>
        <span class="meta-label">Caminho</span><span class="meta-value">${data.full_path || path.join("/")}</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(data.full_path || "").replace(/\\/g, "\\\\")}')">Copy Path</button>
        <span class="meta-label">Tamanho</span><span class="meta-value" style="color:var(--accent); font-weight:bold;">${formatSmartSize(isFolder ? data.folder_size_gb * 1024 : data.size_mb)}</span>
    `;

    if (isFolder) {
        const stats = calculateFolderStats(data);
        const getPct = (size) => stats.totalSize > 0 ? ((size / stats.totalSize) * 100).toFixed(1) : 0;
        html += `
            <div class="stats-container">
                <span class="meta-label">Conteúdo</span>
                <div class="stats-bar">
                    <div class="bar-segment" style="width:${getPct(stats.Video.size)}%; background:var(--video)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Audio.size)}%; background:var(--audio)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Image.size)}%; background:var(--image)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Textual.size + stats.Other.size)}%; background:var(--other)"></div>
                </div>
                <div class="stat-row"><span>🎞️ Video</span><b>${stats.Video.count}</b></div>
                <div class="stat-row"><span>🎧 Audio</span><b>${stats.Audio.count}</b></div>
                <div class="stat-row"><span>🖼️ Images</span><b>${stats.Image.count}</b></div>
                <div class="stat-row"><span>📄 Docs / Other</span><b>${stats.Textual.count + stats.Other.count}</b></div>
            </div>`;
    } else {
        if (data.category === "Image" || data.thumbnail) {
            html += `<h3>Preview</h3>
                     <div class="img-preview-container">
                        <img id="preview-img" src="" alt="Carregando...">
                     </div>`;
            setTimeout(() => {
                const img = document.getElementById('preview-img');
                tryLoadImage(img, data.thumbnail, name);
            }, 50);
        }

        html += `<span class="meta-label">Modificado</span><span class="meta-value">${data.modified || "N/A"}</span>`;
        
        if (data.category === "Video") {
            // Garante que displayRes exista ou usa a dimensão original
            const displayRes = data.dimension || "N/A"; 
            
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Resolução</span><span class="meta-value">${displayRes}</span>
                <span class="meta-label">Duração / Áudio</span><span class="meta-value">${formatTime(data.duration_ms)} / ${data.audio_channels || "N/A"}</span>
                <span class="meta-label">Aspecto / FPS</span><span class="meta-value">${data.aspect_ratio || "N/A"} / ${data.frame_rate || "N/A"}</span>`;
        } else if (data.category === "Audio") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Duração</span><span class="meta-value">${formatTime(data.duration_ms)}</span>
                <span class="meta-label">Canais</span><span class="meta-value">${data.audio_channels || "N/A"}</span>`;
        } else if (data.category === "Image") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Dimensões</span><span class="meta-value">${data.dimension || "N/A"}</span>
                <span class="meta-label">DPI</span><span class="meta-value">${data.dpi || "N/A"}</span>`;
        }

        // NOVIDADE: Verifica explicitamente por content_preview ou categoria textual
        if (data.content_preview) {
            html += `<h3>Conteúdo do Documento</h3>
                     <div class="preview-box" id="preview-text">Loading content...</div>
                     <button class="copy-btn" onclick="copyPreviewText()">Copiar Conteúdo</button>`;
        }
    }
    
    content.innerHTML = html;

    // Sincronização garantida: espera o DOM atualizar para injetar o texto
    if (data.content_preview) {
        setTimeout(() => {
            const box = document.getElementById('preview-text');
            if (box) box.textContent = data.content_preview;
        }, 10);
    }
}

function navigateToPath(path) {
    // Limpa a busca e renderiza a visualização normal
    document.getElementById("search").value = "";
    renderColumn(TREE, 0);

    let currentNode = TREE;
    // O primeiro item do path costuma ser "Root" ou o nome do HD, pulamos ele se necessário
    const pathParts = path.slice(1); 

    pathParts.forEach((part, index) => {
        setTimeout(() => {
            const columns = document.querySelectorAll('.column');
            const currentColumn = columns[index];
            if (!currentColumn) return;

            const items = currentColumn.querySelectorAll('.item');
            for (let item of items) {
                if (item.querySelector('.item-text').textContent === part) {
                    item.click(); // Simula o clique no item para abrir a próxima coluna ou metadados
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    break;
                }
            }
        }, (index + 1) * 100); // Pequeno delay para a coluna anterior renderizar
    });
}

function renderColumn(node, level, path = []) {
    const explorer = document.getElementById("explorer");
    while (explorer.children.length > level) explorer.removeChild(explorer.lastChild);
    const col = document.createElement("div"); col.className = "column";
    const keys = Object.keys(node).filter(k => k !== "folder_size_gb").sort((a, b) => {
        const aIsF = node[a].folder_size_gb !== undefined;
        const bIsF = node[b].folder_size_gb !== undefined;
        return (aIsF !== bIsF) ? bIsF - aIsF : a.localeCompare(b);
    });
    keys.forEach(name => {
        const val = node[name];
        const isFolder = val.folder_size_gb !== undefined;
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `<span class="icon">${getIcon(name, isFolder)}</span> <span class="item-text">${name}</span>`;
        item.onclick = () => {
            Array.from(col.children).forEach(c => c.classList.remove('active'));
            item.classList.add('active');
            showMetadata(name, val, path.concat(name));
            if (isFolder) renderColumn(val, level + 1, path.concat(name));
            else while (explorer.children.length > level + 1) explorer.removeChild(explorer.lastChild);
        };
        col.appendChild(item);
    });
    explorer.appendChild(col);
}

function performSearch() {
    const term = document.getElementById("search").value.toLowerCase();
    const explorer = document.getElementById("explorer");
    if (!term) { renderColumn(TREE, 0); return; }
    
    const results = [];
    function searchNode(node, currentPath) {
        for (const key in node) {
            if (key === "folder_size_gb") continue;
            const item = node[key];
            const isFolder = item.folder_size_gb !== undefined;
            const match = key.toLowerCase().includes(term) || (item.content_preview && item.content_preview.toLowerCase().includes(term));
            
            if (match) results.push({ name: key, data: item, path: currentPath.concat(key), isFolder });
            if (isFolder) searchNode(item, currentPath.concat(key));
        }
    }
    
    searchNode(TREE, ["Root"]); // Certifique-se que o nome base aqui condiz com seu JSON
    explorer.innerHTML = "";
    const col = document.createElement("div"); col.className = "column"; col.style.minWidth = "100%";
    
    results.slice(0, 100).forEach(res => {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<span class="icon">${getIcon(res.name, res.isFolder)}</span> 
                         <div><b>${res.name}</b><br><small style="color:#888">${res.path.join(" › ")}</small></div>`;
        
        // AQUI ESTÁ A MUDANÇA: Chama a navegação em vez de apenas mostrar metadados
        div.onclick = () => navigateToPath(res.path);
        
        col.appendChild(div);
    });
    explorer.appendChild(col);
}

document.addEventListener("DOMContentLoaded", () => renderColumn(TREE, 0));
</script>
