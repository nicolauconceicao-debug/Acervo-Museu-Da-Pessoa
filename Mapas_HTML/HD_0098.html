gory": "Textual", "content_preview": "Brisa de La Cordillera- Andarilha do Rap\nUma noite eu tive um sonho que tudo acabava, a cidade entrava em colapso e eu saía de bike com um amigo e um tambor, acho que já sonhei isso mais de uma vez e deve ser uma ideia que eu tenho de que se tudo der errado eu vou pro meio do mato.\nOs militares chegaram até a invadir o apartamento que minha mãe estava morando, então ela que estava preocupada com a situação da ditadura e querendo uma situação melhor topou vir para o Brasil junto com o meu pai que era artesão,eles eram mochileiros chilenos e passaram primeiro pela Argentina, nesse estilo Hippie, meu pai guarda o cabelão até hoje.Na Argentina não deu muito certo, então vieram pro Brasil. Assustou um pouco minha mãe que o Brasil era muito grande, ela se sentiu meio deslocada, mas rolou, eles ficaram em Amarantina próximo a BH que era uma cidade meio rocinha e iam vender os trabalhos nas feirinhas, principalmente na da Praça da Liberdade e assim iam conseguindo  sobreviver .\n    O meu nome é Brisa de La Cordillera que significa um sopro de liberdade que foi que eles sentiam que eu era. Eu cresci ouvindo músicas chilenas, entre as músicas de folclore e as músicas de protesto. Tem o Vi"}, "História-Victor-Rodrigues.docx": {"size_mb": 0.0179, "modified": "2016-12-20 17:24:36", "extension": "DOCX", "full_path": "D:\\Backup Filmagens 2016\\JovenSonhadores\\Minuatagens\\História-Victor-Rodrigues.docx", "category": "Textual", "content_preview": "Victor Rodrigues\nQuanto mais poetas eu ouvir, melhor eu vou escrever!\nO meu nome é Victor Leite Rodrigues, eu nasci em 1991 em São Miguel Paulista ali na Zona Leste. A memória que eu tenho do meu pai é de um ser que sempre fez o que queria, ele saia por que queria , trabalhava com educação física por que queria e falaram para ele parar de jogar futebol, mas ele queria continuar jogando, e um dia ele morreu jogando bola quando eu tinha 5 anos de idade. Alias quando eu era criança eu era uma espécie de Midas ao contrário, tudo que eu tocava morria, hoje até estou escrevendo um livro de poemas sobre a morte \nNossa, mas isso foi super forte, porque eu tenho a lembrança da minha mãe falando \"Victor você agora é o homem da casa, imagina o que eu senti, que com 5 anos de idade eu era responsável pela minha mãe e pela minha irmã, ainda mais com o que eu estava vendo que aconteciam com as pessoas, o mundão atacando todo mundo, e se esse mundão vem e pega todo mundo, o que ele ia fazer comigo? Tínhamos que nos proteger.\n  Minha mãe também era professora e também super protetora. Na rua que eu morava os meninos vinham brincar comigo e minha mãe falava \"Filho eu não quero fulano brincando aqui"}, "Minutagem do Thiago (1).docx": {"size_mb": 0.0203, "modified": "2016-12-26 13:54:44", "extension": "DOCX", "full_path": "D:\\Backup Filmagens 2016\\JovenSonhadores\\Minuatagens\\Minutagem do Thiago (1).docx", "category": "Textual", "content_preview": "Minutagem do Thiago\nMvi 0933\nO meu nome é Thiago, eu nasci em São Paulo no dia 31 de janeiro de 1989.\nO nome da minha mãe é Criolice Maria de Paula. \nMeus pais ambos tiveram uma vida difícil e chegaram em São Paulo na década de 1970. Minha mãe é do Paraná e meu pai do Paraíba, eles chegaram numa São Paulo fervilhando dos bailes Blacks, uma cidade que olhava muito pra sua negritude e cultura.\nMeu pai tem nostalgia de James Brown, Aretha Franklin essas coisas. Já minha mãe curtia algo mais como Ezita Barroso. Eles tem essa referência, porque eu tenho isso, quando eu olho para essas fotos, eu vejo que eles usavam aquelas roupas black. Eu olhando essas fotos vejo aquela coisa da juventude negra estar linda, estar bonita.\nOs dois moravam no Campo Limpo. Minha mãe morava de uma ldo da rua que era o Taboão e meu pai do outro lado da rua que era o Campo Limpo. Até os meus 3 anos os dois estavam juntos, depois meu pai teve outros filhos com outras mulheres e minha mãe outros filhos com outros homens.\nNa minha relação com os outros filhos, eu acabava tendo esse papel de cuidar dos outros filhos que isso ajudava a minha mãe. minha irmã ficou grávida cedo com 18 anos, veio a Vitória e a gente"}, "Minutagem do Thiago.docx": {"size_mb": 0.0116, "modified": "2016-12-21 15:32:14", "extension": "DOCX", "full_path": "D:\\Backup Filmagens 2016\\JovenSonhadores\\Minuatagens\\Minutagem do Thiago.docx", "category": "Textual", "content_preview": "Minutagem do Thiago\nMvi 0933\nO meu nome é Thiago, eu nasci em São Paulo no dia 31 de janeiro de 1989.\nO nome da minha mãe é Criolice Maria de Paula. \nMeus pais ambos tiveram uma vida difícil e chegaram em São Paulo na década de 1970. Minha mãe é do Paraná e meu pai do Paraíba, eles chegaram numa São Paulo fervilhando dos bailes Blacks, uma cidade que olhava muito pra sua negritude e cultura.\nMeu pai tem nostalgia de James Brown, Aretha Franklin essas coisas. Já minha mãe curtia algo mais como Ezita Barroso. Eles tem essa referência, porque eu tenho isso, quando eu olho para essas fotos, eu vejo que eles usavam aquelas roupas black. Eu olhando essas fotos vejo aquela coisa da juventude negra estar linda, estar bonita.\nOs dois moravam no Campo Limpo. Minha mãe morava de uma ldo da rua que era o Taboão e meu pai do outro lado da rua que era o Campo Limpo. Até os meus 3 anos os dois estavam juntos, depois meu pai teve outros filhos com outras mulheres e minha mãe outros filhos com outros homens.\nNa minha relação com os outros filhos, eu acabava tendo esse papel de cuidar dos outros filhos que isso ajudava a minha mãe. minha irmã ficou grávida cedo com 18 anos, veio a Vitória e a gente"}, "minutagem-Victor Rodrigues.docx": {"size_mb": 0.0204, "modified": "2016-12-20 17:39:48", "extension": "DOCX", "full_path": "D:\\Backup Filmagens 2016\\JovenSonhadores\\Minuatagens\\minutagem-Victor Rodrigues.docx", "category": "Textual", "content_preview": "Victor Rodrigues- Minutagem parte 02\nTítulo da história\nQuanto mais poetas eu ouvir, melhor eu vou escrever.\nMvi 000- Victor explora todo o território de mergulho, aprendizado e profissão nos saraus.\nEu digo que o meu processo dos saraus não foi nem um coisa de descoberta  e sim de percepção. A questão foi, eu descobri a arte para não morrer da verdade. To com essa camiseta justamente pela frase, foi a primeira camiseta que eu comprei simbolizando essa nova fase de percepção e procura do que eu queria fazer ou ser.\nEstava saturado do mundo, mercado de trabalho, faculdade, comecei a acompanhar esse cenário político.Na escola nunca comentavam dessa questão, foi encontrando outros jovens que comecei a pensar, a me pensar, que caminho eu queria trilhar e a ver a arte como uma válvula de escape da vida.\nO Tubarão do Lixo, um mano dos saraus, dizia que escrevia para não matar um. Comigo também, eu escrevia pra não sair explodindo e matando as outros, aí fui descobrindo muita coisa, Fernando Pessoa e o Manoel de Barros com essa mania de inventar outros mundos. Então eu comecei a entender como a arte morava em mim. Os jogos que eu jogava, a música, as pessoas que eu andava.\nEu vi assim, no"}, "Trecho do vídeo do Victor Rodrigues.docx": {"size_mb": 0.0114, "modified": "2016-12-20 15:32:28", "extension": "DOCX", "full_path": "D:\\Backup Filmagens 2016\\JovenSonhadores\\Minuatagens\\Trecho do vídeo do Victor Rodrigues.docx", "category": "Textual", "content_preview": "Trecho do vídeo do Victor Rodrigues\nEu digo que o meu processo dos saraus não foi nem um coisa de descoberta  e sim de percepção. A questão foi, eu descobri a arte para não morrer da verdade. To com essa camiseta justamente pela frase, foi a primeira camiseta que eu comprei simbolizando essa nova fase de percepção e procura do que eu queria fazer ou ser.\nEstava saturado do mundo, mercado de trabalho, faculdade, comecei a acompanhar esse cenário político.Na escola nunca comentavam dessa questão, foi encontrando outros jovens que comecei a pensar, a me pensar, que caminho eu queria trilhar e a ver a arte como uma válvula de escape da vida.\nO Tubarão do Lixo, um mano dos saraus, dizia que escrevia para não matar um. Comigo também, eu escrevia pra não sair explodindo e matando as outros, aí fui descobrindo muita coisa, Fernando Pessoa e o Manoel de Barros com essa mania de inventar outros mundos. Então eu comecei a entender como a arte morava em mim. Os jogos que eu jogava, a música, as pessoas que eu andava.\nEu vi assim, nossa, estou com 18 anos anos, daqui a pouco 20, 25 e 30. A vida não é tão longa assim ainda mais com esse problema cardíaco. Está na hora de dizer alguns nãos e esco"}, "~$nutagem do Thiago (1).docx": {"size_mb": 0.0002, "modified": "2016-12-26 13:51:24", "extension": "DOCX", "full_path": "D:\\Backup Filmagens 2016\\JovenSonhadores\\Minuatagens\\~$nutagem do Thiago (1).docx", "category": "Textual", "content_preview": "[Error reading content: Package not found at 'D:\\Backup Filmagens 2016\\JovenSonhadores\\Minuatagens\\~$nutagem do Thiago (1).docx']"}, "~$nutagem-Victor Rodrigues.docx": {"size_mb": 0.0002, "modified": "2016-12-19 16:05:34", "extension": "DOCX", "full_path": "D:\\Backup Filmagens 2016\\JovenSonhadores\\Minuatagens\\~$nutagem-Victor Rodrigues.docx", "category": "Textual", "content_preview": "[Error reading content: Package not found at 'D:\\Backup Filmagens 2016\\JovenSonhadores\\Minuatagens\\~$nutagem-Victor Rodrigues.docx']"}, "~$stória-da.docx": {"size_mb": 0.0002, "modified": "2016-12-27 15:57:06", "extension": "DOCX", "full_path": "D:\\Backup Filmagens 2016\\JovenSonhadores\\Minuatagens\\~$stória-da.docx", "category": "Textual", "content_preview": "[Error reading content: Package not found at 'D:\\Backup Filmagens 2016\\JovenSonhadores\\Minuatagens\\~$stória-da.docx']"}, "~$stória-Victor-Rodrigues.docx": {"size_mb": 0.0002, "modified": "2016-12-27 15:30:06", "extension": "DOCX", "full_path": "D:\\Backup Filmagens 2016\\JovenSonhadores\\Minuatagens\\~$stória-Victor-Rodrigues.docx", "category": "Textual", "content_preview": "[Error reading con .645}, "Museu da Pessoa Semayat": {"EntrevistaSemayat.mp4": {"size_mb": 213.2685, "modified": "2016-03-08 11:26:00", "extension": "MP4", "full_path": "D:\\Backup Filmagens 2016\\JovenSonhadores\\Museu da Pessoa Semayat\\EntrevistaSemayat.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 215148.0, "duration": 215.15}, "PCSH_HV524_Semayat_Ativista_Bruto.mov": {"size_mb": 6983.5298, "modified": "2016-03-08 09:58:58", "extension": "MOV", "full_path": "D:\\Backup Filmagens 2016\\JovenSonhadores\\Museu da Pessoa Semayat\\PCSH_HV524_Semayat_Ativista_Bruto.mov", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5775070.0, "duration": 5775.07}, "folder_size_gb": 7.028}, "Museu da Pessoa Thiago": {"História do Editada.docx": {"size_mb": 0.0128, "modified": "2016-12-26 13:49:44", "extension": "DOCX", "full_path": "D:\\Backup Filmagens 2016\\JovenSonhadores\\Museu da Pessoa Thiago\\História do Editada.docx", "category": "Textual", "content_preview": "O meu nome é Thiago e eu nasci no dia 31 de janeiro de 1989. Os meus pais são os dois imigrantes, minha mãe veio do Paraná e o meu pai da Paraíba. Ambos vieram para o Campo Limpo, depois eu fui no lugar que os dois nasceram e eram paraísos mesmo. E por que isso acontece? As pessoas saem de paraísos para vir morar em frente a córregos que não estão nem limpos. Acredito que tenha sido muito pela especulação imobiliária deles não conseguirem se manter no lugar que eles moravam e também de São Paulo estar fervilhando de oportunidades de trabalho devido a industrialização e essas coisas.\nE eles chegaram numa São Paulo fervilhando de bailes Blacks e de toda uma cultura negra que buscava sua identidade e sua força e buscando  se sentir bonita. Eu fico olhando as fotos e vejo os cabelos Blacks, as roupas da época. E os dois moravam no Campo Limpo e logo que eu tive 3 anos eles se separaram, tanto o meu pai teve filho com outras mulheres como minha mãe filho com outros homens.\nE essa coisa de periferia né? As pessoas se ajudavam. A gente morava debaixo de um linhão, tinha um pessoal que até se desesperava. Essa coisa dos refugiados de hoje era o que parecia na época, teve uma vez que aparec"}, "IMG_0941.CR2": {"size_mb": 27.0437, "modified": "2016-09-02 18:28:46", "extension": "CR2", "full_path": "D:\\Backup Filmagens 2016\\JovenSonhadores\\Museu da Pessoa Thiago\\IMG_0941.CR2", "category": "Image"}, "IMG_0941.JPG": {"size_mb": 7.7589, "modified": "2016-09-02 18:28:46", "extension": "JPG", "full_path": "D:\\Backup Filmagens 2016\\JovenSonhadores\\Museu da Pessoa Thiago\\IMG_0941.JPG", "category": "Image", "dimension": "5472x3648", "resolution": "5472x3648", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0098/thumb_IMG_0941.jpg"}, "IMG_0942.CR2": {"size_mb": 28.8475, "modified": "2016-09-02 18:29:06", "extension": "CR2", "full_path": "D:\\Backup Filmagens 2016\\JovenSonhadores\\Museu da Pessoa Thiago\\IMG_0942.CR2", "category": "Image"}, "IMG_0942.JPG": {"size_mb": 7.8846, "modified": "2016-09-02 18:29:06", "extension": "JPG", "full_path": "D:\\Backup Filmagens 2016\\JovenSonhadores\\Museu da Pessoa Thiago\\IMG_0942.JPG", "category": "Image", "dimension": "5472x3648", "resolution": "5472x3648", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0098/thumb_IMG_0942.jpg"}, "MVI_0933.MOV": {"size_mb": 4084.1257, "modified": "2016-09-02 17:30:22", "extension": "MOV", "full_path": "D:\\Backup Filmagens 2016\\JovenSonhadores\\Museu da Pessoa Thiago\\MVI_0933.MOV", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1094093.0, "duration": 1094.09}, "MVI_0934.MOV": {"size_m const EXTENSIONS = {
    "Video": ['mp4', 'mov', 'mkv', 'avi', 'm4v', 'mts', 'm2ts', 'wmv', 'flv', 'webm', 'vob', 'ogv', '3gp', 'mxf'],
    "Audio": ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'aiff', 'pcm', 'aif'],
    "Image": ['jpg', 'jpeg', 'tif', 'tiff', 'png', 'gif', 'bmp', 'webp', 'cr2', 'nef', 'arw', 'dng'],
    "Textual": ['doc', 'docx', 'pdf', 'txt', 'rtf', 'odt', 'xls', 'xlsx', 'ppt', 'pptx']
};

const ICONS = { "Video": "🎞️", "Audio": "🎧", "Image": "🖼️", "Textual": "📝", "Other": "📄" };

function formatSmartSize(mbValue) {
    if (!mbValue || mbValue === 0) return "0 B";
    let bytes = mbValue * 1024 * 1024; 
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(2) + " " + units[i];
}

function getIcon(name, isFolder) {
    if (isFolder) return "📁";
    const ext = name.split('.').pop().toLowerCase();
    for (const [category, list] of Object.entries(EXTENSIONS)) {
        if (list.includes(ext)) return ICONS[category];
    }
    return ICONS["Other"];
}

function formatTime(ms) {
    if (!ms || ms === 0) return "N/A";
    let totalSeconds = Math.floor(ms / 1000);
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;
    return [hours, minutes, seconds].map(v => v < 10 ? "0" + v : v).join(":");
}

function tryLoadImage(imgElement, thumbnailPath, originalName) {
    if (!thumbnailPath && !originalName) return;
    let path = thumbnailPath || `thumbnails/thumb_${originalName.split('.').slice(0, -1).join('.')}.jpg`;
    imgElement.onerror = function() {
        this.onerror = null;
        this.src = 'https://via.placeholder.com/150?text=Sem+Preview';
    };
    imgElement.src = path;
}

function copyPreviewText() {
    const box = document.getElementById('preview-text');
    if (box) {
        navigator.clipboard.writeText(box.textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy Content"; }, 2000);
    }
}

function calculateFolderStats(node) {
    let stats = { Video: { count: 0, size: 0 }, Audio: { count: 0, size: 0 }, Image: { count: 0, size: 0 }, Textual: { count: 0, size: 0 }, Other: { count: 0, size: 0 }, totalSize: 0 };
    function traverse(curr) {
        for (let key in curr) {
            if (key === "folder_size_gb") continue;
            let item = curr[key];
            if (item.folder_size_gb !== undefined) traverse(item);
            else {
                let cat = item.category || "Other";
                if (!stats[cat]) cat = "Other";
                stats[cat].count++;
                stats[cat].size += item.size_mb || 0;
                stats.totalSize += item.size_mb || 0;
            }
        }
    }
    traverse(node);
    return stats;
}

function showMetadata(name, data, path) {
    const panel = document.getElementById("metadata-panel");
    const content = document.getElementById("meta-content");
    panel.style.display = "block";

    const isFolder = data.folder_size_gb !== undefined;
    let html = `
        <span class="meta-label">Nome</span><span class="meta-value">${name}</span>
        <span class="meta-label">Caminho</span><span class="meta-value">${data.full_path || path.join("/")}</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(data.full_path || "").replace(/\\/g, "\\\\")}')">Copy Path</button>
        <span class="meta-label">Tamanho</span><span class="meta-value" style="color:var(--accent); font-weight:bold;">${formatSmartSize(isFolder ? data.folder_size_gb * 1024 : data.size_mb)}</span>
    `;

    if (isFolder) {
        const stats = calculateFolderStats(data);
        const getPct = (size) => stats.totalSize > 0 ? ((size / stats.totalSize) * 100).toFixed(1) : 0;
        html += `
            <div class="stats-container">
                <span class="meta-label">Conteúdo</span>
                <div class="stats-bar">
                    <div class="bar-segment" style="width:${getPct(stats.Video.size)}%; background:var(--video)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Audio.size)}%; background:var(--audio)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Image.size)}%; background:var(--image)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Textual.size + stats.Other.size)}%; background:var(--other)"></div>
                </div>
                <div class="stat-row"><span>🎞️ Video</span><b>${stats.Video.count}</b></div>
                <div class="stat-row"><span>🎧 Audio</span><b>${stats.Audio.count}</b></div>
                <div class="stat-row"><span>🖼️ Images</span><b>${stats.Image.count}</b></div>
                <div class="stat-row"><span>📄 Docs / Other</span><b>${stats.Textual.count + stats.Other.count}</b></div>
            </div>`;
    } else {
        if (data.category === "Image" || data.thumbnail) {
            html += `<h3>Preview</h3>
                     <div class="img-preview-container">
                        <img id="preview-img" src="" alt="Carregando...">
                     </div>`;
            setTimeout(() => {
                const img = document.getElementById('preview-img');
                tryLoadImage(img, data.thumbnail, name);
            }, 50);
        }

        html += `<span class="meta-label">Modificado</span><span class="meta-value">${data.modified || "N/A"}</span>`;
        
        if (data.category === "Video") {
            // Garante que displayRes exista ou usa a dimensão original
            const displayRes = data.dimension || "N/A"; 
            
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Resolução</span><span class="meta-value">${displayRes}</span>
                <span class="meta-label">Duração / Áudio</span><span class="meta-value">${formatTime(data.duration_ms)} / ${data.audio_channels || "N/A"}</span>
                <span class="meta-label">Aspecto / FPS</span><span class="meta-value">${data.aspect_ratio || "N/A"} / ${data.frame_rate || "N/A"}</span>`;
        } else if (data.category === "Audio") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Duração</span><span class="meta-value">${formatTime(data.duration_ms)}</span>
                <span class="meta-label">Canais</span><span class="meta-value">${data.audio_channels || "N/A"}</span>`;
        } else if (data.category === "Image") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Dimensões</span><span class="meta-value">${data.dimension || "N/A"}</span>
                <span class="meta-label">DPI</span><span class="meta-value">${data.dpi || "N/A"}</span>`;
        }

        // NOVIDADE: Verifica explicitamente por content_preview ou categoria textual
        if (data.content_preview) {
            html += `<h3>Conteúdo do Documento</h3>
                     <div class="preview-box" id="preview-text">Loading content...</div>
                     <button class="copy-btn" onclick="copyPreviewText()">Copiar Conteúdo</button>`;
        }
    }
    
    content.innerHTML = html;

    // Sincronização garantida: espera o DOM atualizar para injetar o texto
    if (data.content_preview) {
        setTimeout(() => {
            const box = document.getElementById('preview-text');
            if (box) box.textContent = data.content_preview;
        }, 10);
    }
}

function navigateToPath(path) {
    // Limpa a busca e renderiza a visualização normal
    document.getElementById("search").value = "";
    renderColumn(TREE, 0);

    let currentNode = TREE;
    // O primeiro item do path costuma ser "Root" ou o nome do HD, pulamos ele se necessário
    const pathParts = path.slice(1); 

    pathParts.forEach((part, index) => {
        setTimeout(() => {
            const columns = document.querySelectorAll('.column');
            const currentColumn = columns[index];
            if (!currentColumn) return;

            const items = currentColumn.querySelectorAll('.item');
            for (let item of items) {
                if (item.querySelector('.item-text').textContent === part) {
                    item.click(); // Simula o clique no item para abrir a próxima coluna ou metadados
                    item.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    break;
                }
            }
        }, (index + 1) * 100); // Pequeno delay para a coluna anterior renderizar
    });
}

function renderColumn(node, level, path = []) {
    const explorer = document.getElementById("explorer");
    while (explorer.children.length > level) explorer.removeChild(explorer.lastChild);
    const col = document.createElement("div"); col.className = "column";
    const keys = Object.keys(node).filter(k => k !== "folder_size_gb").sort((a, b) => {
        const aIsF = node[a].folder_size_gb !== undefined;
        const bIsF = node[b].folder_size_gb !== undefined;
        return (aIsF !== bIsF) ? bIsF - aIsF : a.localeCompare(b);
    });
    keys.forEach(name => {
        const val = node[name];
        const isFolder = val.folder_size_gb !== undefined;
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `<span class="icon">${getIcon(name, isFolder)}</span> <span class="item-text">${name}</span>`;
        item.onclick = () => {
            Array.from(col.children).forEach(c => c.classList.remove('active'));
            item.classList.add('active');
            showMetadata(name, val, path.concat(name));
            if (isFolder) renderColumn(val, level + 1, path.concat(name));
            else while (explorer.children.length > level + 1) explorer.removeChild(explorer.lastChild);
        };
        col.appendChild(item);
    });
    explorer.appendChild(col);
}

function performSearch() {
    const term = document.getElementById("search").value.toLowerCase();
    const explorer = document.getElementById("explorer");
    if (!term) { renderColumn(TREE, 0); return; }
    
    const results = [];
    function searchNode(node, currentPath) {
        for (const key in node) {
            if (key === "folder_size_gb") continue;
            const item = node[key];
            const isFolder = item.folder_size_gb !== undefined;
            const match = key.toLowerCase().includes(term) || (item.content_preview && item.content_preview.toLowerCase().includes(term));
            
            if (match) results.push({ name: key, data: item, path: currentPath.concat(key), isFolder });
            if (isFolder) searchNode(item, currentPath.concat(key));
        }
    }
    
    searchNode(TREE, ["Root"]); // Certifique-se que o nome base aqui condiz com seu JSON
    explorer.innerHTML = "";
    const col = document.createElement("div"); col.className = "column"; col.style.minWidth = "100%";
    
    results.slice(0, 100).forEach(res => {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<span class="icon">${getIcon(res.name, res.isFolder)}</span> 
                         <div><b>${res.name}</b><br><small style="color:#888">${res.path.join(" › ")}</small></div>`;
        
        // AQUI ESTÁ A MUDANÇA: Chama a navegação em vez de apenas mostrar metadados
        div.onclick = () => navigateToPath(res.path);
        
        col.appendChild(div);
    });
    explorer.appendChild(col);
}

document.addEventListener("DOMContentLoaded", () => renderColumn(TREE, 0));
</script>
