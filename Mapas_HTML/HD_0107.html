 nome completo?\nR –  Lealdina Bandeira Neres.\nP/1 – A senhora nasceu onde?\nR – Em município de Imperatriz, foi na fazenda, mas no município de Imperatriz.\nP/1 – No Pará?\nR – Maranhão.\nP/1 – Que data?\nR – No dia 9 de fevereiro, 1938.\nP/1 – Você disse que nasceu na fazenda? Contaram alguma coisa do dia do seu nascimento? Como foi?\nR – Não, meu nascimento, minha mãe sempre conta que foi nada demais, eu só nasci (risos), na mesma hora que ela sentiu a dor, eu nasci.\nP/1 – Nasceu rápido?\nR – Nasci rápido demais. Sempre minha mãe conta que nasci mais rápido do que todos eles que ela teve (risos).\nP/1 – Quantos irmãos você tem?\nR – Treze.\nP/1 – São 14 filhos?\nR – Não, eram 13 comigo.\nP/1 – Quantos homens e quantas mulheres?\nR – As mulheres, seis e sete homens, né? É porque morreu uns pequenos e por causa disso, a gente vai esquecendo dos pequenos, né, mais novos.\nP/1 – Seu pai fazia o"}, "folder_size_gb": 0.0}, "folder_size_gb": 11.416}, "XMB_HV002": {"Audiovisual": {"Audio": {"XMB_HV002.mp3": {"size_mb": 80.6112, "modified": "2016-09-06 18:28:14", "extension": "MP3", "full_path": "D:\\XMB\\XMB_HV002\\Audiovisual\\Audio\\XMB_HV002.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 5282016.0, "duration": 5282.02}, "folder_size_gb": 0.079}, "Editado": {"XMB_HV002.mp4": {"size_mb": 583.9018, "modified": "2016-11-23 12:35:16", "extension": "MP4", "full_path": "D:\\XMB\\XMB_HV002\\Audiovisual\\Editado\\XMB_HV002.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 300100.0, "duration": 300.1}, "folder_size_gb": 0.57}, "Acesso": {"XMB_HV002.mp4": {"size_mb": 2724.5278, "modified": "2017-04-20 16:07:18", "extension": "MP4", "full_path": "D:\\XMB\\XMB_HV002\\Audiovisual\\Acesso\\XMB_HV002.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate udio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 506375.83471, "duration": 506.38}, "folder_size_gb": 13.323}, "folder_size_gb": 16.633}, "Textual": {"XMB_HV002.docx": {"size_mb": 0.0682, "modified": "2019-08-13 11:44:48", "extension": "DOCX", "full_path": "D:\\XMB\\XMB_HV002\\Textual\\XMB_HV002.docx", "category": "Textual", "content_preview": "Todo Lugar tem uma História para Contar – Xambioá\nDepoimento de Ruiderval Miranda Moura\nEntrevistada por João Emanuel de Souza e Marcia Trezza\nXambioá, 31/08/2016 \nRealização Museu da Pessoa \nHV02_Ruiderval Miranda Moura\nTranscrito por Mariana Wolff\nMW Transcrições\nP/1 – Posso te chamar de Rui?\nR – Sim, claro.\nP/1 – Rui, fala o seu nome completo, por favor?\nR – Ruiderval Miranda Moura\nP/1 – Quando que você nasceu?\nR – Dezessete de julho de 1956 em Xambioá, Tocantins, às 16 horas da tarde.\nP/1 – Qual o nome dos seus pais, Rui?\nR – Meu pai, Lourival Moura Paulino e Maria Miranda Feitosa.\nP/1 – Qual a atividade deles, principal? \nR – Meu pai era lavrador e também, trabalhava no ramo de farmacêutico e minha mãe, lavradora junto com o meu pai.\nP/2 – Como você descreveria o seu pai e a sua mãe?\nR – Olha, minha mãe é uma pessoa muito dedicada, trabalhadora, meu pai também. Era meio grosso, meio rude, mas era um cara muito simpático, bom com as pessoas, atendia muito bem as pessoas e era muito humilde, na minha concepção.\nP/1 – E sua mãe?\nR – Minha mãe também, minha mãe é uma pessoa muito dada, a principio, ela era evangélica, desde que eu me conheço por gente, ela era da Igreja Assembleia"}, "folder_size_gb": 0.0}, "Fotos": {"Making Off": {"XMB_HV002_MO01.JPG": {"size_mb": 1.4169, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV002\\Fotos\\Making Off\\XMB_HV002_MO01.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_107/thumb_XMB_HV002_MO01.jpg"}, "XMB_HV002_MO02.JPG": cx", "category": "Textual", "content_preview": "Todo Lugar tem uma História para Contar – Xambioá\nDepoimento de Sebastião Gomes da Silva\nEntrevistada por Santana de Souza Barreto da Silva e Marcia Trezza\nXambioá, 31/08/2016 \nRealização Museu da Pessoa \nHV03_Sebastião Gomes da Silva\nTranscrito por Mariana Wolff\nMW Transcrições\nP/1 – Seu Sebastião, a gente vai começar essa entrevista da história da sua vida, o senhor fala o seu nome completo de novo, por favor?\nR – Sebastião Gomes da Silva.\nP/1 – Quando que o senhor nasceu, Seu Sebastião, que data?\nR – Dia 14 de dezembro de 1923.\nP/1 – Em que lugar?\nR – Lugar denominado Mata do Nascimento, município de Codó, no estado do Maranhão.\nP/1 – Seu Sebastião, o senhor tem lembranças do seu pai, da sua mãe, como eles eram?\nR – Tenho. \nP/1 – Como que eles eram? Assim, o jeito deles.\nR – Eles eram assim, meu pai e minha mãe sempre foram… eles não tiveram a opção de estudar, vou dizer logo, analfabeto, todos os dois, mas trabalhadores na expressão máxima. Eu tinha dois irmãos, a nossa casa era sempre farta, tinha de tudo e foram uns bons pais, meu pai e minha mãe.\nP/1 – Eles trabalhavam com o quê?\nR – Cana, plantio de cana. Meu pai fez plantio de cana, ele produzia cachaça, açúcar moreno e ra"}, "folder_size_gb": 0.0}, "folder_size_gb": 16.606}, "XMB_HV004": {"Fotos": {"Making Off": {"XMB_HV004_MO01.JPG": {"size_mb": 1.6809, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV004\\Fotos\\Making Off\\XMB_HV004_MO01.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_107/thumb_XMB_HV004_MO01.jpg"}, "XMB_HV004_MO02.JPG": {"size_mb": 1.381, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV004\\Fotos\\Making Off\\XMB_HV004_MO02.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": " ui chegando, como havia exploração do cristal de rocha, ele ficou. Aqui, ele conheceu a minha mãe, se casaram, tiveram três filhos e eu sou produto disso.\nP/1 – Os outros dois irmãos são homens, mulheres?\nR – São dois irmãos homens, nós três somos homens, não tivemos irmã mulher, infelizmente.\nP/1 – E o seu pai já trabalhava com garimpo, onde?\nR – Meu pai vinha do sul de Goiás, da região de Balisa,"}, "folder_size_gb": 0.0}, "folder_size_gb": 8.856}, "XMB_HV005": {"Fotos": {"Making Off": {"XMB_HV005_MO01.JPG": {"size_mb": 1.2016, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV005\\Fotos\\Making Off\\XMB_HV005_MO01.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_107/thumb_XMB_HV005_MO01.jpg"}, "XMB_HV005_MO02.JPG": {"size_mb": 1.3267, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV005\\Fotos\\Making Off\\XMB_HV005_MO02.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_107/thumb_XMB_HV005_MO02.jpg"}, "XMB_HV005_MO03.JPG": {"size_mb": 0.8121, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV005\\Fotos\\Making Off\\XMB_HV005_MO03.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_107/thumb_XMB_HV005_MO03.jpg"}, "XMB_HV005_MO04.JPG": {"size_mb": 1.7053, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV005\\Fotos\\Making Off\\XMB_HV005_MO04.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_107/thumb_XMB_HV005_MO04.jpg"}, "XMB_HV005_MO05.JPG": {"size_mb": 1.3104, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV005\ o numa cidade próxima a Vitória. Vitória do Piauí.\nP/1 – A senhora é de Piauí?\nR – Eu nasci lá em Vitória.\nP/1 – No estado do Piauí?\nR – No estado do Piauí.\nP/1 – Que lembrança a senhora tem do seu pai? \nR – Eu não conheci o meu pai. O meu pai faleceu antes de eu nascer. É pra dizer o nome dele?\nP/1 – É.\nR – Plínio Alves Amorim.\nP/1 – E ele fazia o quê, dona Cecília? A senhora sabe o que ele fazia, com o que ele trabalhava?\nR – Ele era agricultor, não tinha fazenda mas trabalhava de, como se diz? Hoje é...\nP/2 – Assentamento.\nR – É, em assentamento.\nP/1 – Ele trabalhava na fazenda de outras pessoas.\nR – De outras pessoa"}, "folder_size_gb": 0.0}, "folder_size_gb": 19.62}, "XMB_HV006": {"Fotos": {"Making Off": {"XMB_HV006_MO01.JPG": {"size_mb": 1.0366, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV006\\Fotos\\Making Off\\XMB_HV006_MO01.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_107/thumb_XMB_HV006_MO01.jpg"}, "XMB_HV006_MO02.JPG": {"size_mb": 1.5551, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV006\\Fotos\\Making Off\\XMB_HV006_MO02.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_107/thumb_XMB_HV006_MO02.jpg"}, "XMB_HV006_MO03.JPG": {"size_mb": 1.4197, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV006\\Fotos\\Making Off\\XMB_HV006_MO03.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_107/thumb_XMB_HV006_MO03.jpg"}, "XMB_HV006_MO04.JPG": {"size_mb": 1.5686, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV006\\Fotos\\Making Off\\XMB_HV006_MO04.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456  o mês de setembro, né?\nP/1 – Nossa! Fevereiro, ele falou…\nR – (risos) Estamos em setembro e eu nasci em fevereiro. Tá longe.\nP/1 – Seu Manuel, vamos começar a entrevista novamente. O senhor fala o seu nome inteiro?\nR – Manuel Gomes de Souza.\nP/1 – Que data o senhor nasceu?\nR – No dia primeiro de fevereiro de 1923.\nP/1 – Em que cidade?\nR – Eu nasci em Pedreira do Maranhão. \nP/1 – O senhor tem que lembranças do seus pais?\nR – O que eu tenho lembrança? Eu não conheci pai, só conheci mãe. Mas eu não fui criado pela minha mãe que eu nasci dela. Eu fui criado por um tio e a minha mãe de criação. Tio, irmão da minha mãe. Chamava-se Emanuel Gouveia e a mãe"}, "folder_size_gb": 0.0}, "folder_size_gb": 18.319}, "XMB_HV007": {"Fotos": {"Making Off": {"XMB_HV007_MO01.JPG": {"size_mb": 1.5608, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV007\\Fotos\\Making Off\\XMB_HV007_MO01.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_107/thumb_XMB_HV007_MO01.jpg"}, "XMB_HV007_MO02.JPG": {"size_mb": 1.6415, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV007\\Fotos\\Making Off\\XMB_HV007_MO02.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_107/thumb_XMB_HV007_MO02.jpg"}, "XMB_HV007_MO03.JPG": {"size_mb": 1.4504, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV007\\Fotos\\Making Off\\XMB_HV007_MO03.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_107/thumb_XMB_HV007_MO03.jpg"}, "XMB_HV007_MO04.JPG": {"size_mb": 1.603, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV007\\Fotos\\Making Off\\XMB_HV007_MO04.JPG", "category": "Image", "dimension": "3456x  "extension": "MTS", "full_path": "D:\\XMB\\XMB_HV007\\Audiovisual\\Preservação\\00005.MTS", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AC-3", "duration_ms": 73519.270441, "duration": 73.52}, "folder_size_gb": 11.842}, "Acesso": {"XMB_HV007.mp4": {"size_mb": 2350.6716, "modified": "2017-04-23 16:51:40", "extension": "MP4", "full_path": "D:\\XMB\\XMB_HV007\\Audiovisual\\Acesso\\XMB_HV007.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4735264.0, "duration": 4735.26}, "folder_size_gb": 2.296}, "Audio": {"XMB_HV007.mp3": {"size_mb": 71.9835, "modified": "2016-09-06 19:35:08", "extension": "MP3", "full_path": "D:\\XMB\\XMB_HV007\\Audiovisual\\Audio\\XMB_HV007.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 4716504.0, "duration": 4716.5}, "folder_size_gb": 0.07}, "folder_size_gb": 14.634}, "Textual": {"XMB_HV007.docx": {"size_mb": 0.0693, "modified": "2019-08-13 11:44:34", "extension": "DOCX", "full_path": "D:\\XMB\\XMB_HV007\\Textual\\XMB_HV007.docx", "category": "Textual", "content_preview": "Programa Todo Lugar Tem Uma História Para Contar Xambioá \nDepoimento de Edson Costa\nEntrevistado por José Albino, Maria Antônia da Luz, Márcia Treza e Antônio dos Reis\nXambioá, 01/09/2016 \nRealização Museu da Pessoa \nHV07_Edson Costa\nTranscrito por Karina Medici Barrella\nMW Transcrições\nP/1 – Eu vou começar a fazer as perguntas, seu Edson, e depois os nossos amigos vão continuar. Fala o seu nome completo, por favor.\nR – Meu nome é Edson Costa. Nascido em Marabá no dia 29 de agosto de 1930. Estado do Pará.\nP/1 – Quando o senhor morava lá, o senhor lembra da época que o senhor era criança? Como o seu pai era, sua mãe?\nR – Meu pai era castanheiro, primeiro produto de Marabá era castanha, o segundo borracha, terceiro foi ouro, diamante e continuou outras coisas que eu não tomei conhecimento.\nP/1 – Mas ele foi fazendo tudo isso?\nR – É, trabalhou na borracha, trabalhou na castanha, trabalhou no garimpo e em todos esses objetos ele trabalhou.\nP/1 – O senhor lembra como ele era com vocês, com os filhos?\nR – Lembro, lembro, lembro. Foi um bom pai, nos tratou bem, com amor, nos zelava bem. Nós trabalhava para o progresso, né? Toda vida, rapazinho garoto eu vendia bolo pelas ruas, fazia tudo,"}, "folder_size_gb": 0.0}, "folder_size_gb": 14.698}, "XMB_HV008": {"Fotos": {"Making Off": {"XMB_HV008_MO01.JPG": {"size_mb": 1.2423, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV008\\Fotos\\Making Off\\XMB_HV008_MO01.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_107/thumb_XMB_HV008_MO01.jpg"}, "XMB_HV008_MO02.JPG": {"size_mb": 1.2309, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV008\\Fotos\\Making Off\\XMB_HV008_MO02.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_107/thumb_XMB_HV008_MO02.jpg"}, "XMB_HV008_MO03.JPG": {"size_mb": 1.4404, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV008\\Fotos\\Making Off\\XMB_HV008_MO03.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_107/thumb_XMB_HV008_MO03.jpg"}, "XMB_HV008_MO04.JPG": {"size_mb": 1.5211, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV008\\Fotos\\Making Off\\XMB_HV008_MO04.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_107/thumb_XMB_HV008_MO04.jpg"}, o", "audio_codec": "MPEG Audio", "duration_ms": 4595640.0, "duration": 4595.64}, "folder_size_gb": 0.068}, "folder_size_gb": 14.92}, "Textual": {"XMB_HV008.docx": {"size_mb": 0.0644, "modified": "2019-08-13 11:44:28", "extension": "DOCX", "full_path": "D:\\XMB\\XMB_HV008\\Textual\\XMB_HV008.docx", "category": "Textual", "content_preview": "Todo Lugar tem uma História para Contar – Xambioá\nDepoimento de Donato Carlos Martins Miranda\nEntrevistado por Ana Lucia Moura, Cleonice Pires Costa e Marcia Trezza\nXambioá, 02/09/2016 \nRealização Museu da Pessoa \nHV08_Donato Carlos Martins Miranda\nTranscrito por Mariana Wolff\nMW Transcrições\nP/1 – Nós vamos começar, o senhor pode falar o nome completo para ficar gravado?\nR – Donato Carlos Martins Miranda.\nP/1 – Que data o senhor nasceu?\nR – Dia 17 de fevereiro de 1948, na cidade de Taguatinga, hoje, Tocantins.\nP/1 – O senhor tem alguma lembrança do seu pai, da sua mãe?\nR – Poucas lembranças do meu pai, da minha mãe, eu tive mais porque convivemos, eu convivi mais com ela, meu pai, aos cinco anos de idade, nos deixou, quando nós chegamos aqui em Xambioá.\nP/1 – Ele veio pra cá com a família?\nR – Veio antes. Meu pai era piloto de barco, viajava no rio e quando nós chegamos aqui, 1953. Viemos de barco, motor grande, motor de 60 toneladas, chegando aqui no dia 22 de fevereiro de 1953, não tinha nada aqui, poucas casas, onde nós fomos morar num barracão de um conhecido nosso lá da nossa cidade, que era barracão de garimpeiro, nós ficamos alojados lá por uns dias. Aí, conseguimos arrumar"}, "folder_size_gb": 0.0}, "folder_size_gb": 14.959}, "XMB_HV009": {"Fotos": {"Making Off": {"XMB_HV009_MO01.JPG": {"size_mb": 0.9233, "modified": "2019-08-13 14:46:56", "extension": "JPG", "full_path": "D:\\XMB\\XMB_HV009\\Fotos\\Making Off\\XMB_HV009_MO01.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_107/thumb_XMB_HV009_MO01.jpg"}, "XMB_H const EXTENSIONS = {
    "Video": ['mp4', 'mov', 'mkv', 'avi', 'm4v', 'mts', 'm2ts', 'wmv', 'flv', 'webm', 'vob', 'ogv', '3gp', 'mxf'],
    "Audio": ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'aiff', 'pcm', 'aif'],
    "Image": ['jpg', 'jpeg', 'tif', 'tiff', 'png', 'gif', 'bmp', 'webp', 'cr2', 'nef', 'arw', 'dng'],
    "Textual": ['doc', 'docx', 'pdf', 'txt', 'rtf', 'odt', 'xls', 'xlsx', 'ppt', 'pptx']
};

const ICONS = { "Video": "🎞️", "Audio": "🎧", "Image": "🖼️", "Textual": "📝", "Other": "📄" };

function formatSmartSize(mbValue) {
    if (!mbValue || mbValue === 0) return "0 B";
    let bytes = mbValue * 1024 * 1024; 
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(2) + " " + units[i];
}

function getIcon(name, isFolder) {
    if (isFolder) return "📁";
    const ext = name.split('.').pop().toLowerCase();
    for (const [category, list] of Object.entries(EXTENSIONS)) {
        if (list.includes(ext)) return ICONS[category];
    }
    return ICONS["Other"];
}

function formatTime(ms) {
    if (!ms || ms === 0) return "N/A";
    let totalSeconds = Math.floor(ms / 1000);
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;
    return [hours, minutes, seconds].map(v => v < 10 ? "0" + v : v).join(":");
}

function tryLoadImage(imgElement, thumbnailPath, originalName) {
    if (!thumbnailPath && !originalName) return;
    let path = thumbnailPath || `thumbnails/thumb_${originalName.split('.').slice(0, -1).join('.')}.jpg`;
    imgElement.onerror = function() {
        this.onerror = null;
        this.src = 'https://via.placeholder.com/150?text=Sem+Preview';
    };
    imgElement.src = path;
}

function copyPreviewText() {
    const box = document.getElementById('preview-text');
    if (box) {
        navigator.clipboard.writeText(box.textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy Content"; }, 2000);
    }
}

function calculateFolderStats(node) {
    let stats = { Video: { count: 0, size: 0 }, Audio: { count: 0, size: 0 }, Image: { count: 0, size: 0 }, Textual: { count: 0, size: 0 }, Other: { count: 0, size: 0 }, totalSize: 0 };
    function traverse(curr) {
        for (let key in curr) {
            if (key === "folder_size_gb") continue;
            let item = curr[key];
            if (item.folder_size_gb !== undefined) traverse(item);
            else {
                let cat = item.category || "Other";
                if (!stats[cat]) cat = "Other";
                stats[cat].count++;
                stats[cat].size += item.size_mb || 0;
                stats.totalSize += item.size_mb || 0;
            }
        }
    }
    traverse(node);
    return stats;
}

function showMetadata(name, data, path) {
    const panel = document.getElementById("metadata-panel");
    const content = document.getElementById("meta-content");
    panel.style.display = "block";

    const isFolder = data.folder_size_gb !== undefined;
    let html = `
        <span class="meta-label">Nome</span><span class="meta-value">${name}</span>
        <span class="meta-label">Caminho</span><span class="meta-value">${data.full_path || path.join("/")}</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(data.full_path || "").replace(/\\/g, "\\\\")}')">Copy Path</button>
        <span class="meta-label">Tamanho</span><span class="meta-value" style="color:var(--accent); font-weight:bold;">${formatSmartSize(isFolder ? data.folder_size_gb * 1024 : data.size_mb)}</span>
    `;

    if (isFolder) {
        const stats = calculateFolderStats(data);
        const getPct = (size) => stats.totalSize > 0 ? ((size / stats.totalSize) * 100).toFixed(1) : 0;
        html += `
            <div class="stats-container">
                <span class="meta-label">Conteúdo</span>
                <div class="stats-bar">
                    <div class="bar-segment" style="width:${getPct(stats.Video.size)}%; background:var(--video)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Audio.size)}%; background:var(--audio)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Image.size)}%; background:var(--image)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Textual.size + stats.Other.size)}%; background:var(--other)"></div>
                </div>
                <div class="stat-row"><span>🎞️ Video</span><b>${stats.Video.count}</b></div>
                <div class="stat-row"><span>🎧 Audio</span><b>${stats.Audio.count}</b></div>
                <div class="stat-row"><span>🖼️ Images</span><b>${stats.Image.count}</b></div>
                <div class="stat-row"><span>📄 Docs / Other</span><b>${stats.Textual.count + stats.Other.count}</b></div>
            </div>`;
    } else {
        if (data.category === "Image" || data.thumbnail) {
            html += `<h3>Preview</h3>
                     <div class="img-preview-container">
                        <img id="preview-img" src="" alt="Carregando...">
                     </div>`;
            setTimeout(() => {
                const img = document.getElementById('preview-img');
                tryLoadImage(img, data.thumbnail, name);
            }, 50);
        }

        html += `<span class="meta-label">Modificado</span><span class="meta-value">${data.modified || "N/A"}</span>`;
        
        if (data.category === "Video") {
            // Garante que displayRes exista ou usa a dimensão original
            const displayRes = data.dimension || "N/A"; 
            
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Resolução</span><span class="meta-value">${displayRes}</span>
                <span class="meta-label">Duração / Áudio</span><span class="meta-value">${formatTime(data.duration_ms)} / ${data.audio_channels || "N/A"}</span>
                <span class="meta-label">Aspecto / FPS</span><span class="meta-value">${data.aspect_ratio || "N/A"} / ${data.frame_rate || "N/A"}</span>`;
        } else if (data.category === "Audio") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Duração</span><span class="meta-value">${formatTime(data.duration_ms)}</span>
                <span class="meta-label">Canais</span><span class="meta-value">${data.audio_channels || "N/A"}</span>`;
        } else if (data.category === "Image") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Dimensões</span><span class="meta-value">${data.dimension || "N/A"}</span>
                <span class="meta-label">DPI</span><span class="meta-value">${data.dpi || "N/A"}</span>`;
        }

        // NOVIDADE: Verifica explicitamente por content_preview ou categoria textual
        if (data.content_preview) {
            html += `<h3>Conteúdo do Documento</h3>
                     <div class="preview-box" id="preview-text">Loading content...</div>
                     <button class="copy-btn" onclick="copyPreviewText()">Copiar Conteúdo</button>`;
        }
    }
    
    content.innerHTML = html;

    // Sincronização garantida: espera o DOM atualizar para injetar o texto
    if (data.content_preview) {
        setTimeout(() => {
            const box = document.getElementById('preview-text');
            if (box) box.textContent = data.content_preview;
        }, 10);
    }
}

function renderColumn(node, level, path = []) {
    const explorer = document.getElementById("explorer");
    while (explorer.children.length > level) explorer.removeChild(explorer.lastChild);
    const col = document.createElement("div"); col.className = "column";
    const keys = Object.keys(node).filter(k => k !== "folder_size_gb").sort((a, b) => {
        const aIsF = node[a].folder_size_gb !== undefined;
        const bIsF = node[b].folder_size_gb !== undefined;
        return (aIsF !== bIsF) ? bIsF - aIsF : a.localeCompare(b);
    });
    keys.forEach(name => {
        const val = node[name];
        const isFolder = val.folder_size_gb !== undefined;
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `<span class="icon">${getIcon(name, isFolder)}</span> <span class="item-text">${name}</span>`;
        item.onclick = () => {
            Array.from(col.children).forEach(c => c.classList.remove('active'));
            item.classList.add('active');
            showMetadata(name, val, path.concat(name));
            if (isFolder) renderColumn(val, level + 1, path.concat(name));
            else while (explorer.children.length > level + 1) explorer.removeChild(explorer.lastChild);
        };
        col.appendChild(item);
    });
    explorer.appendChild(col);
}

function performSearch() {
    const term = document.getElementById("search").value.toLowerCase();
    const explorer = document.getElementById("explorer");
    if (!term) { renderColumn(TREE, 0); return; }
    const results = [];
    function searchNode(node, currentPath) {
        for (const key in node) {
            if (key === "folder_size_gb") continue;
            const item = node[key];
            const isFolder = item.folder_size_gb !== undefined;
            const match = key.toLowerCase().includes(term) || (item.content_preview && item.content_preview.toLowerCase().includes(term));
            if (match) results.push({ name: key, data: item, path: currentPath.concat(key), isFolder });
            if (isFolder) searchNode(item, currentPath.concat(key));
        }
    }
    searchNode(TREE, ["Root"]);
    explorer.innerHTML = "";
    const col = document.createElement("div"); col.className = "column"; col.style.minWidth = "100%";
    results.slice(0, 100).forEach(res => {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<span class="icon">${getIcon(res.name, res.isFolder)}</span> <div><b>${res.name}</b><br><small>${res.path.join("/")}</small></div>`;
        div.onclick = () => showMetadata(res.name, res.data, res.path);
        col.appendChild(div);
    });
    explorer.appendChild(col);
}

document.addEventListener("DOMContentLoaded", () => renderColumn(TREE, 0));
