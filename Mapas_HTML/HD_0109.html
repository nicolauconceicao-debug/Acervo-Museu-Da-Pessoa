mbnail": "thumbnails/HD_0109/thumb_PCSH_HV621_FT08B.jpg"}, "folder_size_gb": 0.07}, "folder_size_gb": 0.079}, "Making Of": {"PCSH_HV621_MO001.JPG": {"size_mb": 2.5474, "modified": "2017-09-20 04:57:10", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV621_Renata Orlandi\\Iconográfico\\Making Of\\PCSH_HV621_MO001.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV621_MO001.jpg"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.082}, "Textual": {"PCSH_HV621_Renata Orlandi_edi.docx": {"size_mb": 0.0082, "modified": "2018-01-18 05:39:20", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV621_Renata Orlandi\\Textual\\PCSH_HV621_Renata Orlandi_edi.docx", "category": "Textual", "content_preview": "Nome da história\nEm constante aprendizagem\nMinibio\nRenata Orlandi nasceu no dia 05 de novembro de 1971 em São Paulo. Em busca da área que mais se encaixasse no seu perfil, encontrou a Comunicação. Formada em Publicidade, tem a experiência de trabalho na área farmacêutica, onde logo de cara se identificou. Hoje, é responsável pela área de eventos da Allergan. É casada e mãe de duas meninas.\nSinopse\nUma profissional da comunicação amante da área farmacêutica: essa é a Renata. Curiosa pelos medicamentos, começa a ler as bulas para entender melhor o produto que vendia. Com uma trajetória que casa também com as descobertas de uso da toxina botulínica do Brasil, Renata tem uma importância fundamental na Allergan, onde trabalha: produzir eventos. Pelo contato com áreas tão diferentes e produtos tão específicos, Renata sabe que sempre haverá um espaço para nova aprendizagem.\nTAGs\neventos\nmaternidade\ncomida\nfamília\nimigração\ncomunicação\nestágio\neditora\ntelemarketing\nfaculdade\nEdição\nEu nunca gostei de exatas, então falei: “Vou pra área de humanas!” Nessa área, comecei a procurar o que me interessava - e encontrei a comunicação: falar com as pessoas, trocar experiências; tudo isso foi desabr"}, "PCSH_HV621_Renata Orlandi_rev.docx": {"size_mb": 0.0288, "modified": "2018-01-18 07:38:30", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV621_Renata Orlandi\\Textual\\PCSH_HV621_Renata Orlandi_rev.docx", "category": "Textual", "content_preview": "Projeto Conte Sua História\nDepoimento de Renata Orlandi\nEntrevistada por Luiz Egypto e Carolina Margiotte\nSão Paulo, 04/09/2017\nRealização: Museu da Pessoa\nPCSH_HV621_Renata Orlandi\nTranscrito por Liliane Custódio\nRevisado e editado por Carolina Margiotte\nP/1 – Bom dia, Renata. Muito obrigado por ter aceitado o nosso convite. Eu gostaria que você começasse dizendo seu nome completo, o local e a data do seu nascimento.\nR – Bom dia. Sou a Renata Pereira Orlandi Jorge dos Santos, nascida em São Paulo, capital, meu aniversário é no dia 05 de novembro de 1971.\nP/1 – Ok. O nome dos seus pais, por favor.\nR – O meu pai é Fauze Orlandi Jorge, minha mãe, Iraci Pereira Orlandi Jorge.\nP/1 – O que faziam os seus pais?\nR – Meu pai tinha uma oficina mecânica, então ele atuava na área automobilística, de consertos de carro, e a minha mãe era dona de casa.\nP/1 – Onde era essa oficina?\nR – Na zona leste, ali na Penha.\nP/1 – Certo. Você conheceu os seus avós?\nR – Conheci.\nP/1 – Os dois? Dos dois lados?\nR – Os dois. Na verdade, o pai da minha mãe não, ele faleceu muito novo, então só a minha avó, Isabel, mãe da minha mãe. Os meus avós por parte do meu pai, eles foram sempre muito presentes na minha vi"}, "folder_size_gb": 0.0}, "folder_size_gb": 4.998}, "folder_size_gb": 277.152}, "HD_Telecurso": {"HTC_HV001_Vilma Guimarães": {"Textual": {"HTC_HV01_Vilma Guimarãe_edi.docx": {"size_mb": 0.0172, "modified": "2019-08-21 13:47:44", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV001_Vilma Guimarães\\Textual\\HTC_HV01_Vilma Guimarãe_edi.docx", "category": "Textual", "content_preview": "Título da história\nTRAJETÓRIA DE MEDIAÇÃO DO CONHECIMENTO NA ESCOLA VIVA\nMinibio\nNatural de Recife, Vilma Maria Pereira Guimarães veio ao mundo na cama de sua mãe, como ela mesma diz, em 15 de setembro de 1948. Veio a trabalho e não a passeio. Veio com uma missão, que descobriu muito cedo, de lutar pela educação, especialmente para aqueles aos quais esta foi negada. Sua grande preocupação sempre residiu no resgate da imensa dívida social que o país registra ao permitir a exclusão de tantos brasileiros aos quais a escola não chega. Acredita que essa vocação tenha origem na formação exemplar que recebeu de seus pais, envolvendo princípios de justiça social, firmeza de caráter e atitudes de cidadania. E foi com esse ideário e um comprometimento absoluto que Vilma Guimarães devotou o seu tempo, a sua vida, a sua capacidade a preparar pessoas para a sublime arte de aprender e, com isso, mudar o próprio destino. \nSinopse - Vilma Guimarães percorreu uma trajetória marcada por trabalho e dedicação à causa da educação e do resgate de uma dívida social que este país ainda conserva neste campo, a despeito de melhorias, no tocante à distribuição do saber, promovida de forma injusta e deficitár"}, "HTC_HV01_Vilma Guimarães_parte03.docx": {"size_mb": 0.0512, "modified": "2019-08-21 13:47:44", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV001_Vilma Guimarães\\Textual\\HTC_HV01_Vilma Guimarães_parte03.docx", "category": "Textual", "content_preview": "Minha História, Sua História, Nossa História\nDepoimento de Vilma Guimarães\nEntrevistada por Rosana Miziara\nRio de Janeiro, 19/09/2018\nRealização Museu da Pessoa\nHTC_HV01_Vilma Guimarães_Parte 3\nTranscrito por Mariana Wolff\nP/1 – Vilma, foi como eu comentei com você, onde a gente parou, na parte que você estava falando que contratou a Fundação, lá em Recife, que você estava fazendo o trabalho já com a Tele Escola e aí, eu não sei, a gente pode retomar um pouco? Esse processo já do Telecurso para a metodologia telessala, se a gente encerra aquele primeiro antes de falar da sua entrada aqui…\nR – Eu acho que é somente… A minha entrada aqui tem a ver com aquele momento, não é?\nP/1 – Então é isso.\nR – Foi onde se deu o conhecimento, onde se deu essa relação de parceria. Então, no meio do processo da parceria, na verdade, para produzir ainda mais três programas, três temáticas, a Fundação me convidou para vir para cá. Isso era junho de 1992 e me convidou para vir para cá com dois desafios: o primeiro era estruturar uma Gerência de Educação, que a Fundação não tinha. Ela produzia os Telecursos ou fazia o Ciranda da Ciência mas, naquela época, a Fundação não tinha uma estrutura de Educação,"}, "HTC_HV01_Vilma Guimarães_parte01.docx": {"size_mb": 0.0621, "modified": "2019-08-21 13:47:48", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV001_Vilma Guimarães\\Textual\\HTC_HV01_Vilma Guimarães_parte01.docx", "category": "Textual", "content_preview": "Programa Telecurso\nDepoimento de Vilma Guimarães\nEntrevistada por Marcia Trezza e Rosana Miziara\nSão Paulo, 16/10/2017 \nRealização Museu da Pessoa \nHTC_HV01_Vilma Guimarães_Parte 1\nTranscrito por Karina Medici Barrella\nRevisado/editado por Paulo Rodrigues Ferreira\nP/1 – Vilma, você pode dizer o seu nome completo, local e data de nascimento?\nR – Vilma Maria Pereira Guimarães. Nasci no dia 15 de setembro de 1948, entre quatro e cinco da manhã, na cama da minha mãe, no Recife.\nP/1 – Como se chamam os seus pais?\nR – Arnaldo Ferreira Guimarães e Maria Benedita Pereira Guimarães.\nP/1 – Eles são de Recife?\nR – Não. Papai nasceu em Bezerros, no interior de Pernambuco, e mamãe nasceu em Goiana, uma na Mata Norte e outro na Mata Sul.\nP/1 – Vamos perguntar um pouquinho dos seus avós paternos, depois falamos dos maternos conforme você for se lembrando.\nR – Eu não conheci nada.\nP/1 – Nem os paternos?\nR – Eu conheci só a mãe do meu pai. A mãe da minha mãe morreu ela era ainda muito jovem, muito jovem mesmo, ela não tinha dezoito anos. E tinha uma irmã com menos dois anos do que ela e ela ficou muito responsável por essa irmã. Eles começaram a trabalhar muito jovens.\nP/1 – Mas ela foi criada pelo"}, "HTC_HV01_Vilma Guimarães_parte02.docx": {"size_mb": 0.0762, "modified": "2019-08-21 13:47:52", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV001_Vilma Guimarães\\Textual\\HTC_HV01_Vilma Guimarães_parte02.docx", "category": "Textual", "content_preview": "Programa Telecurso \nDepoimento de Vilma Guimarães\nEntrevistada por Marcia Trezza e Rosana Miziara\nSão Paulo, 17/10/2017 \nRealização Museu da Pessoa \nHTC_HV01_Vilma Guimarães_Parte 2\nTranscrito por Karina Medici Barrella\nRevisão/ Edição - Paulo Rodrigues Ferreira\nP/1 – Lembrar das festas...\nR – Que festas?\nP/1 – Que a gente passou por cima.\nR – Ah, da família, que a gente passou por cima. Certo. Vamos lá.\nP/1 – Tinha todo um calendário de festas, de roupas que sua mãe fazia, comidas...\nR – Tinha, tinha. De roupas. Agora eu estou me lembrando de um vestido de Natal que mamãe fez. E assim... Eram três meninas, então sempre uma estava de rosa, uma de verdinho e uma de amarelo. E era organza. Mamãe era muito caprichosa, então era uma organza e cheia de babadinho, todo matamezinho. Esse matame era bordadinho por ela, um biquinho de uma rendinha fina, que você pensava que comprou, aquela rendinha fina. Ela fez os três. Então, era o vestido da véspera de Natal. E você tinha o vestido da véspera de Ano-Novo, porque todo mundo... Véspera de Natal e véspera de Ano-Novo. E fazia a camisa dos meninos. E ‘mainha’ fazia as calças, era perfeita nas calças dos meninos. E naquela época que os vestid"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "HTC_HV002_Maria Veranir dos Santos": {"Audiovisual": {"Vídeo": {"Edições": {"HTC_HV02.mp4": {"size_mb": 207.2367, "modified": "2018-10-04 21:29:16", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV002_Maria Veranir dos Santos\\Audiovisual\\Vídeo\\Edições\\HTC_HV02.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", thumb_HTC_HV02_MO002.jpg"}, "folder_size_gb": 0.014}, "folder_size_gb": 0.152}, "Textual": {"HTC_HV02_ Maria Veranir dos Santos Fonseca_edi.docx": {"size_mb": 0.0105, "modified": "2019-08-21 13:47:58", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV002_Maria Veranir dos Santos\\Textual\\HTC_HV02_ Maria Veranir dos Santos Fonseca_edi.docx", "category": "Textual", "content_preview": "Nome da história \nHistória de quem construiu, na educação, a própria história\nMinibio\nMaria Veranir dos Santos Fonseca é potiguar de Carnaubais. Nasceu em 1962, aos 17 de junho. Cresceu num meio em que a educação era prioridade. Com 18 anos, Vera chegou ao seu lugar: à “sua” Serra do Mel - pequenininha, mas com chance de estudo. Ali se formou, construiu sua história pessoal e sua história na educação. Também ali, em determinado momento, encontrou o Telecurso, que, para ela, durante uma década, representou crescer no magistério; juntar saberes, competências e experiências; vislumbrar o futuro no aprendizado. Todos no mesmo barco, num projeto interdisciplinar, que muito acrescentou enquanto durou. Só que um dia aquela luz, que tanto clareara em termos educacionais, se apagou. Mas, a exemplo do pai, ela é guerreira, continua a acreditar na educação.\nSinopse\nA história de Vera - Maria Veranir Fonseca - essa potiguar nascida no que chamava “interiorzinho”, está inteira e salutarmente impregnada pelo saber, pela educação como vocação, compromisso e missão. De interior em interior, chegou ao que considera o seu lugar - a Serra do Mel. De lá, só saiu justamente em busca de mais estudo. E p"}, "HTC_HV02_ Maria Veranir dos Santos Fonseca_rev.docx": {"size_mb": 0.0481, "modified": "2019-08-21 13:48:02", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV002_Maria Veranir dos Santos\\Textual\\HTC_HV02_ Maria Veranir dos Santos Fonseca_rev.docx", "category": "Textual", "content_preview": "Projeto Minha História, Sua História, Nossa História\nDepoimento de Maria Veranir dos Santos Fonseca\nEntrevistada por Marcia Trezza e Ana Zidanis\nRecife, 08/03/2018 \nRealização: Museu da Pessoa \nHTC_HV02_ Maria Veranir dos Santos Fonseca\nTranscrito por Karina Medici Barrella\nRevisado e editado por Paulo Rodrigues Ferreira \nP/1 – Vera, a gente vai começar. Você, por favor, diga o seu nome completo, a cidade onde nasceu e a data.\nR – Data do nascimento?\nP/1 – É.\nR – Meu nome é Maria Veranir dos Santos. Nasci na cidade de Carnaubais, Rio Grande do Norte, no ano de 1962.\nP/1 – Que dia e mês?\nR – No dia 17 de junho de 1962.\nP/1 – Vera, que lembranças você tem, mais antigas, da sua infância? Aquelas primeiras memórias. O que você lembra?\nR – Lembro, quando eu era criança, sempre o meu foco foi a escola, sempre era voltada para esse meio - a escola. E, na região em que nós morávamos, era muito difícil. Meu pai era um guerreiro, ele procurava sempre ir para uma cidade que tivesse escola, não é? E daí ele conseguiu. Morávamos na zona rural, zona de difícil acesso e nós chegamos no interiorzinho maior, e lá já tinha escola - chamava-se Grupo. Nós íamos para o Grupo e lá tinha a professora - e"}, "folder_size_gb": 0.0}, "folder_size_gb": 122.484}, "HTC_HV003_Darlene Alcântara": {"Audiovisual": {"Vídeo": {"Edições": {"HTC_HV003.mp4": {"size_mb": 241.5242, "modified": "2018-10-14 15:37:44", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV003_Darlene Alcântara\\Audiovisual\\Vídeo\\Edições\\HTC_HV003.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 196229.0, "duration": 196.23}, "folder_size_gb": 0.236}, "Íntegra": {"HTC_HV03.wmv": {"size_mb": 6894.299, "modified": "2018-08-28 05:37:46", "extension": "WMV", "full_path": "D:\\HD_Telecurso\\HTC_HV003_Darlene Alcântara\\Audiovisual\\Vídeo\\Íntegra\\HTC_HV03.wmv", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.97 mb": 15.0781, "modified": "2018-03-09 13:06:04", "extension": "TIF", "full_path": "D:\\HD_Telecurso\\HTC_HV003_Darlene Alcântara\\Iconográfico\\Acervo\\Alta\\HTC_HV003_DOC003.tif", "category": "Image", "dimension": "2297x2858", "resolution": "2297x2858", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV003_DOC003.jpg"}, "folder_size_gb": 0.033}, "Baixa": {"HTC_HV003_DOC001.jpg": {"size_mb": 0.6827, "modified": "2018-03-09 13:00:54", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV003_Darlene Alcântara\\Iconográfico\\Acervo\\Baixa\\HTC_HV003_DOC001.jpg", "category": "Image", "dimension": "1287x1763", "resolution": "1287x1763", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV003_DOC001.jpg"}, "HTC_HV003_DOC002.jpg": {"size_mb": 1.2428, "modified": "2018-03-09 13:03:08", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV003_Darlene Alcântara\\Iconográfico\\Acervo\\Baixa\\HTC_HV003_DOC002.jpg", "category": "Image", "dimension": "1742x2506", "resolution": "1742x2506", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV003_DOC002.jpg"}, "HTC_HV003_DOC003.jpg": {"size_mb": 1.3585, "modified": "2018-03-09 13:06:04", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV003_Darlene Alcântara\\Iconográfico\\Acervo\\Baixa\\HTC_HV003_DOC003.jpg", "category": "Image", "dimension": "2297x2858", "resolution": "2297x2858", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV003_DOC003.jpg"}, "folder_size_gb": 0.003}, "folder_size_gb": 0.036}, "Making Of": {"HTC_HV003_MO001.JPG": {"size_mb": 6.8741, "modified": "2018-03-13 02:51:48", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV003_Darlene Alcântara\\Iconográfico\\Making Of\\HTC_HV003_MO001.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV003_MO001.jpg"}, "HTC_HV003_MO002.JPG": {"size_mb": 22.222, "modified": "2018-03-13 02:53:56", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV003_Darlene Alcântara\\Iconográfico\\Making Of\\HTC_HV003_MO002.JPG", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV003_MO002.jpg"}, "folder_size_gb": 0.028}, "folder_size_gb": 0.065}, "Textual": {"HTC_HV003_Darlene Alcântara Barbosa_edi.docx": {"size_mb": 0.0105, "modified": "2019-08-21 13:48:04", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV003_Darlene Alcântara\\Textual\\HTC_HV003_Darlene Alcântara Barbosa_edi.docx", "category": "Textual", "content_preview": "Nome da história\nEnsinar é participar e fazer. E assim ela fez com “os meninos de Darlene”\nMinibio\nDarlene Alcântara Barbosa nasceu em Cajazeiras, sertão da Paraíba, onde se “respirava cultura em todos os cantos”. Do canto mais recôndito da mente vem a imagem do Colégio Diocesano, palco do entusiasmo com o teatro, que floresceu na adolescência.  Perdeu a mãe aos 17 anos. O pai foi a figura presente em todos os momentos, todos os lugares, nos seus sonhos e realizações. Até o final, ele foi estímulo e participação: quanto apoio, quanto lhe ensinou, quanto ajudou. Professora, começou pela Educação de Jovens e Adultos e seguiu por outros níveis. Mas foi no Telecurso, no Alumbrar, onde escreveu uma história de envolvimento, entrega, completa identificação. Carrega hoje a tristeza de ter que abandonar o projeto, mas também a certeza de que construiu um intenso aprendizado com “os meninos da Darlene”.\nSinopse\nNeste depoimento, Darlene Alcântara Barbosa relata sua infância em Cajazeiras, interior da Paraíba, onde nasceu. Fala das coisas marcantes que viveu na infância e na adolescência: das brincadeiras de rua, do seu jeito moleca de ser, do Colégio Diocesano, bonito lá no alto do morro, d"}, "HTC_HV003_Darlene Alcântara Barbosa_rev.docx": {"size_mb": 0.0527, "modified": "2019-08-21 13:48:10", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV003_Darlene Alcântara\\Textual\\HTC_HV003_Darlene Alcântara Barbosa_rev.docx", "category": "Textual", "content_preview": "Projeto Minha História, Sua História, Nossa História\nDepoimento de Darlene Alcântara Barbosa\nEntrevistada por Marcia Trezza e Ana \nRecife, 09/03/2018 \nRealização: Museu da Pessoa\nHTC _ HV03 _ Darlene Alcântara Barbosa\nTranscrito por Karina Medici Barrella\nRevisado e editado por Paulo Rodrigues Ferreira\nR – Podemos começar? (risos).\nP/1 – Darlene, pode começar (risos). Desde quando você era pequena, que lembranças tem da sua infância?\nR – Ah, eu lembro muito da minha infância, de tudo. Eu nasci em Cajazeiras, na Paraíba, no sertão - Alto Sertão da Paraíba. Uma terra muito seca, mas na minha infância não tanto como hoje, porque hoje o tempo mudou muito. Na minha época não tinha muita seca não, muito sofrimento. Era uma cidade boa de se morar, uma cidade que respirava cultura em todos os cantos. Como eu já disse, é conhecida como a cidade que ensinou a Paraíba a ler, por ter tido as primeiras escolas, tanto primárias, como secundárias, como as de ensino médio, que, na época, era outro nome que eu nem me lembro mais. Mas foram as primeiras escolas. O Colégio Diocesano, muito bonito, que fica no monte, no alto, e é muito lindo. É uma imagem muito bonita, que marcou muito a minha infânci"}, "folder_size_gb": 0.0}, "folder_size_gb": 130.784}, "HTC_HV004_Marileusa Silva": {"Audiovisual": {"Vídeo": {"Edições": {"HTC_HV004.mp4": {"size_mb": 213.7179, "modified": "2018-10-14 16:08:18", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV004_Marileusa Silva\\Audiovisual\\Vídeo\\Edições\\HTC_HV004.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 173640.0, "duration": 173.64}, "folder_size_gb": 0.209}, "Ínt l_path": "D:\\HD_Telecurso\\HTC_HV004_Marileusa Silva\\Iconográfico\\Making Of\\HTC_HV004_MO001.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV004_MO001.jpg"}, "HTC_HV004_MO002.JPG": {"size_mb": 6.3207, "modified": "2018-03-13 02:57:54", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV004_Marileusa Silva\\Iconográfico\\Making Of\\HTC_HV004_MO002.JPG", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV004_MO002.jpg"}, "folder_size_gb": 0.011}, "folder_size_gb": 0.072}, "Textual": {"HTC_HV04_Marileusa Raimunda da Silva_edi.docx": {"size_mb": 0.0101, "modified": "2019-08-21 13:48:16", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV004_Marileusa Silva\\Textual\\HTC_HV04_Marileusa Raimunda da Silva_edi.docx", "category": "Textual", "content_preview": "Nome da história\nQuando educar é aprender junto\nMinibio\nMarileusa Raimunda da Silva nasceu no Piauí, município de São Julião, em 25 de abril de 1967. Traz lembranças de uma infância de brincadeiras e ajudando a mãe nas tarefas - eram onze filhos. Era comum as crianças saírem para estudar fora - onde tivesse um nível mais adiantado - e com ela e os irmãos não foi diferente. Principalmente ela que tinha o gosto pelos estudos e o sonho de fazer faculdade: fez duas, aproveitou uma só.\nCumpriu o objetivo de ensinar e acredita que o tenha feito melhor através do Telecurso, apesar de sua vivência no magistério não se limitar a essa modalidade; ao contrário, tem a experiência do ensino regular. O Telecurso, todavia, sempre ao amparo de uma metodologia capaz de direcionar o ensino para o “aprender junto”. Construiu, com projetos e teleaulas, sua mais gratificante história na educação. E são histórias dos últimos dezesseis anos.\nSinopse\nPoder-se-ia dizer que esta é a história de uma menina que adorava aprender e tinha o sonho de ensinar. Que pensava em fazer faculdade, ao invés de se curvar ao padrão de casar e ter filhos. Esta é a história de Marileusa Raimunda, nascida num sítio, numa cida"}, "HTC_HV04_Marileusa Raimunda da Silva_rev.docx": {"size_mb": 0.034, "modified": "2019-08-21 13:48:18", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV004_Marileusa Silva\\Textual\\HTC_HV04_Marileusa Raimunda da Silva_rev.docx", "category": "Textual", "content_preview": "Projeto Minha História, Sua História, Nossa História\nDepoimento de Marileusa Raimunda da Silva\nEntrevistada por Marcia Trezza e Ana\nRecife, 09/03/2018 \nRealização Museu da Pessoa \nHTC_ HV04_ Marileusa Raimunda da Silva\nTranscrito por Karina Medici Barrella\nRevisado e editado por Paulo Rodrigues Ferreira\nP/1 – A gente vai começar. Diga o seu nome completo, a cidade onde você nasceu, o estado e a data.\nR – Ok. Eu sou Marileusa Raimunda da Silva.\nPAUSA\nP/1 – É um bate-papo mesmo. Então, não espere eu perguntar. Eu estou com isso aqui para poder usar: “será que ela já falou?” Mas é um bate-papo mesmo. O que você for lembrando pode ir contando, não precisa esperar eu perguntar.\nR – Certo. Então... Meu nome é Marileusa Raimunda da Silva, nasci em um sítio, foi uma parteira que me trouxe ao mundo. E sou filha de Cirilo Franco de Souza e de Raimunda Almeida da Silva. \nP/1 – Em que cidade você nasceu?\nR – São Julião, Piauí.\nP/1 – Em que data?\nR – 25 de abril de 1967.\nP/1 – E você ia contar como é que foi o seu nascimento.\nR – Sim! (risos).\nP/1 – Então conta!\nR – Então... É num sítio em que meus pais moram até hoje - eles têm oitenta e sete e oitenta e oito anos - e eu vim ao mundo através d"}, "folder_size_gb": 0.0}, "folder_size_gb": 80.456}, "HTC_HV005_Walquíria Barboza Ribeiro": {"Audiovisual": {"Vídeo": {"Edições": {"HTC_HV005.mp4": {"size_mb": 200.6384, "modified": "2018-10-14 23:44:30", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV005_Walquíria Barboz lecurso\\HTC_HV005_Walquíria Barboza Ribeiro\\Textual\\HTC_HV05_Walquiria Barboza Ribeiro (1).docx", "category": "Textual", "content_preview": "Projeto Minha História, Sua História, Nossa História\nDepoimento de Walquiria Barboza Ribeiro\nEntrevistada por Marcia Trezza\nRecife, 09/03/2018 \nRealização Museu da Pessoa \nHTC_HV05_Walquiria Barboza Ribeiro\nParticipação de Teresa Farias\nTranscrito por Karina Medici Barrella\nMW Transcrições\nP/1 – Walquiria, pra gente começar, por favor, fala o seu nome completo, a cidade onde você nasceu, o estado e a data.\nR – Meu nome é Walquiria Barboza Ribeiro. Eu costumo dizer Walquiria com w, Barboza com z (risos), que antes que me perguntem eu já digo: “Walquiria com w, Barboza com z”. Eu nasci no município de Terra Nova, bem próximo de Salvador, uma hora de viagem de Salvador. Filha de Eduardo Barboza do Carmo, falecido, e Marieta Ribeiro do Carmo. Meus queridos (risos).\nP/1 – Ela também é falecida?\nR – Todos os dois.\nP/1 – Que data você nasceu?\nR – Eu nasci dia... eu vou dizer minha data mesmo, viu, do meu aniversário, 13 de setembro de 1941. Agora não me lembro, mainha já me disse, inclusive. Foi um parto relâmpago, diz que eu espirrei. Ela estava na cozinha (risos). Isso foi história, se era verdade ou não, mas foi uma história que ela contou, que deu a vontade de parir e não deu tempo de"}, "HTC_HV05_Walquiria Barboza Ribeiro_rev.docx": {"size_mb": 0.0358, "modified": "2019-08-21 13:48:26", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV005_Walquíria Barboza Ribeiro\\Textual\\HTC_HV05_Walquiria Barboza Ribeiro_rev.docx", "category": "Textual", "content_preview": "Projeto Minha História, Sua História, Nossa História\nDepoimento de Walquiria Barboza Ribeiro\nEntrevistada por Marcia Trezza\nRecife, 09/03/2018 \nRealização Museu da Pessoa \nHTC_HV05_Walquiria Barboza Ribeiro\nParticipação de Teresa Farias\nTranscrito por Karina Medici Barrella\nRevisão/Edição: Paulo Rodrigues Ferreira\nP/1 – Walquiria, para a gente começar, por favor, diga o seu nome completo, a cidade onde nasceu, o estado e a data.\nR – Meu nome é Walquiria Barboza Ribeiro. Eu costumo dizer: Walquiria com W, Barboza com Z (risos). Antes que me perguntem, eu já digo: “Walquiria com W, Barboza com Z”. Eu nasci no município de Terra Nova, bem próximo de Salvador, uma hora de viagem de Salvador. Filha de Eduardo Barboza do Carmo, falecido, e Marieta Ribeiro do Carmo. Meus queridos (risos).\nP/1 – Ela também é falecida?\nR – Todos os dois.\nP/1 – Em que data você nasceu?\nR – Eu nasci dia... Eu vou dizer minha data mesmo, viu? Do meu aniversário. Treze de setembro de 1941. Agora, não me lembro... ‘Mainha’ já me disse, inclusive, foi um parto relâmpago, diz que eu ‘espirrei’. Ela estava na cozinha (risos). Isso foi história. Se era verdade ou não, mas foi uma história que ela contou, que deu a v"}, "HTC_HV05_Walquiria Barboza Ribeiro_edi.docx": {"size_mb": 0.01, "modified": "2019-08-21 13:48:22", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV005_Walquíria Barboza Ribeiro\\Textual\\HTC_HV05_Walquiria Barboza Ribeiro_edi.docx", "category": "Textual", "content_preview": "Nome da história\nA metodologia que encantou: dona Walquiria e o Telecurso\nMinibio\nWalquiria - com W - Barboza - com Z - Ribeiro nasceu bem próximo de Salvador num 13 de setembro de 1941, em Terra Nova, da qual guarda lembrança de uma infância boa, do primário que lá fez e de dona Alice, a rígida primeira professora. De lá saiu para o ginásio - com apenas 10 anos - para o Magistério e para voltar professora primária. Quando se tornou professora do ginásio, brigou com o padre-diretor e até hoje agradece: saiu de lá e conquistou seu mundo - a Universidade, a Secretaria de Educação e o Telecurso, um feliz encontro que durou até a aposentadoria. Encantou-se com a metodologia e construiu sua história sempre em torno do que o Telecurso propicia aos que não cumpriram os seus objetivos de estudo e ali encontram justamente essa oportunidade, ou seja, crescer enquanto pessoa, aprender a aprender e a ouvir, melhorar como profissional.\nSinopse\nWalquiria Barboza Ribeiro - com W e com Z, como costuma anunciar - relata coisas boas da infância, como a família - pais e irmãos - as brincadeiras e a escola. Dona Alice, a primeira professora, ficou como referência pela rigidez e em diversas ocasiões es"}, "folder_size_gb": 0.0}, "folder_size_gb": 90.378}, "HTC_HV006_Edjane Maria dos Santos": {"Audiovisual": {"Vídeo": {"Íntegra": {"HTC_HV06": {"HV06 (1).MP4": {"size_mb": 1195.7326, "modified": "2015-12-16 14:16:28", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV006_Edjane Maria dos Santos\\Audiovisual\\Vídeo\\Íntegra\\HTC_HV06\\HV06 (1).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "59.940 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 66567.0, "duration": 66.57}, "HV06 (2).MP4": {"size_mb": 34234.5651, "modified": "2015-12-16 14:20:54", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV006_Edjane Maria dos Santos\\Audiovisual\\Vídeo\\Íntegra\\HTC_HV06\\HV06 (2).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "59.940 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1905404.0, "duration": 1905.4}, "HV06 (3).MP4": {"size_mb": 2047.6695, "modified": "2015-12-16 14:53:42", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV006_Edjane Maria dos Santos\\Audiovisual\\Vídeo\\Íntegra\\HTC_HV06\\HV06 (3).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "59.940 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 114114.0, "duration": 114.11}, "HV06 (4).MP4": {"size_mb": 22574.1736, "modified": "2015-12-16 15:02:30", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV006_Edjane Maria dos Santos\\Audiovisual\\Vídeo\\Íntegra\\HTC_HV06\ "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV06_MO02.jpg"}, "folder_size_gb": 0.011}, "folder_size_gb": 0.057}, "Textual": {"HTC_HV06_Edjane Maria dos Santos_rev.docx": {"size_mb": 0.052, "modified": "2019-08-21 13:48:36", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV006_Edjane Maria dos Santos\\Textual\\HTC_HV06_Edjane Maria dos Santos_rev.docx", "category": "Textual", "content_preview": "Projeto Minha História, Sua História, Nossa História\nDepoimento de Edjane Maria dos Santos\nEntrevistada por Márcia Trezza e Anna Zidanes\nRecife, 10/03/2018\nRealização Museu da Pessoa\nHTC_HV06_ Edjane Maria dos Santos\nTranscrito por Liliane Custódio\nRevisão/Edição Paulo Rodrigues Ferreira\nP/1 – Edjane, nós vamos começar a entrevista. Por favor, diga o seu nome completo, o lugar em que você nasceu e a data.\nR – Meu nome é Edjane Maria dos Santos, nasci em Vitória do Santo Antão, Pernambuco, em 1962.\nP/1 – Em que dia e mês?\nR – Mês de outubro, mês dez. Agora, o dia...\nP/1 – Em que você nasceu.\nR – Nove de outubro.\nP/2 – Nove de outubro.\nR – Nove de outubro.\nP/1 –  Nove de outubro. Ela falou o dia, mês e ano?\nP/2 – Falou. Ela falou primeiro o ano, depois ela falou o mês...\nR – Nove de outubro de 1962.\nP/1 – Está bom. Obrigada. Edjane, você vai falar sempre olhando para a gente, ok? Assim... que lembranças você tem, as primeiras lembranças da sua infância?\nR – Assim... que eu lembre, minha mãe sempre trabalhou.\nP/1 – Sim.\nR – Minha mãe era formada também professora, mas depois fez outro curso, de enfermagem. E ela se aposentou mesmo na Saúde, certo? Meu pai viajava. Ele era... Além de p"}, "HTC_HV06_Edjane Maria dos Santos_edi.docx": {"size_mb": 0.0102, "modified": "2019-08-21 13:48:40", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV006_Edjane Maria dos Santos\\Textual\\HTC_HV06_Edjane Maria dos Santos_edi.docx", "category": "Textual", "content_preview": "Nome da história\nEdjane, a história inspiradora de quem não ficou no caminho\nMinibio\nEdjane Maria dos Santos é natural de Vitória de Santo Antão, Pernambuco, onde nasceu aos 9 de outubro de 1962. Da infância, ela guarda lembranças do convívio com os irmãos; da escola - grande, parecendo um sítio, e bonita - e de uma tragédia: a perda da irmã mais velha. Foram para Recife, para superar, mas logo retornaram. Aí se perdeu nos estudos: faltava à aula para trabalhar, depois casou, teve filhos, o marido proibiu, enfim… Deixou os estudos de lado. Sem sequer o ensino médio, teve que aceitar serviço pesado. Foi então que conheceu o Travessia - um marco na sua história, na sua vida. Porque, com ele e por causa dele, aprendeu a dar valor ao estudo. Tanto que suas vitórias nunca eram as últimas. Concluiu o Médio, fez o Enem, cursou a faculdade, fez não uma, mas duas pós-graduações.\nProfessora do Travessia, hoje é supervisora. Nele, o primeiro passo foi só o começo.\nSinopse\nO que Edjane Maria dos Santos, essa pernambucana de Vitória de Santo Antão, nascida em 9 de outubro de 1962 apresenta é mais do que um depoimento: é uma história de vida, de lutas, de sacrifício, de determinação e uma trajet"}, "folder_size_gb": 0.0}, "folder_size_gb": 103.255}, "HTC_HV008_Ana Paula Alves Ramos Durões": {"Audiovisual": {"Vídeo": {"Edições": {"HTC_HV008.mp4": {"size_mb": 270.675, "modified": "2018-10-14 23:03:18", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV008_Ana Paula Alves Ramos Durões\\Audiovisual\\Vídeo\\Edições\\HTC_HV008.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 219853.0, "duration": 219.85}, "folder_size_gb": 0.264}, "Íntegra": {"HTC_HV008.wmv": {"size_mb": 6786.3761, "modified": "2018-08-29 08:52:14", "extension": "WMV", "full_path": "D:\\HD_Telecurso\\HTC_HV008_Ana Paula Alves Ramos Durões\\Audiovisual\\Vídeo tegory": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV008_MO002.jpg"}, "folder_size_gb": 0.009}, "folder_size_gb": 0.009}, "Textual": {"HTC_HV08_Ana Paula Alves Ramos Duraes_edi.docx": {"size_mb": 0.0102, "modified": "2019-08-21 13:48:58", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV008_Ana Paula Alves Ramos Durões\\Textual\\HTC_HV08_Ana Paula Alves Ramos Duraes_edi.docx", "category": "Textual", "content_preview": "Nome da história\nQUANDO ENSINAR É IMPULSIONAR; FAZER A DIFERENÇA EM SI E PARA O OUTRO.\nMinibio\nAna Paula Duraes é mineira de Montes Claros. Nasceu em 1984 e gosta de dizer que suas lembranças de infância estão nas árvores em que subia, nos campos em que corria, nos cavalos que montava, nos insetos que pegava, no carinho dos avós, na fazenda que eles tinham. Assumiu cedo suas responsabilidades: mãe aos dezoito, trabalhava e estudava, formou-se pedagoga. Na educação, o primeiro contato com a sala de aula foi com crianças em situação de risco. Depois, lecionou para pessoas à margem da sociedade, presos. Levou até eles a luz do saber e descobriu neles o sorriso que revela o que ainda têm de humanos. A volta ao regular levou-a, na verdade, ao Telecurso. Ali aprendeu muito mais para ensinar melhor. Descobriu e fez descobrir o “quem sou, onde estou, para onde vou”. Ali, sim, fez a diferença resgatando, despertando, impulsionando quem necessitava.\nSinopse\nAna Paula Alves Ramos Duraes se emociona ao falar dos avós, porque eles lhe deram afeto e uma infância pra lá de feliz; dos pais, porque lhe deram carinho e apoio quando mais necessitou. Essa mineira de Montes Claros, nascida em 1984, 17"}, "HTC_HV08_Ana Paula Alves Ramos Duraes_rev.docx": {"size_mb": 0.0435, "modified": "2019-08-21 13:48:54", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV008_Ana Paula Alves Ramos Durões\\Textual\\HTC_HV08_Ana Paula Alves Ramos Duraes_rev.docx", "category": "Textual", "content_preview": "Projeto Minha História, Sua História, Nossa História\nDepoimento de Ana Paula Alves Ramos Duraes\nEntrevistada por Marcia Trezza e Tereza Farias\nRio de Janeiro, 15/03/2018 \nRealização Museu da Pessoa \nHTC _ HV08_ Ana Paula Alves Ramos Duraes\nTranscrito por Karina Medici Barrella\nRevisão / Edição Paulo Rodrigues Ferreira\nMW Transcrições\nP/1 – Ana Paula, a gente vai começar a nossa conversa. Fale o seu nome completo, onde você nasceu, e quando.\nR – Meu nome é Ana Paula Alves Ramos Duraes. Eu nasci em Montes Claros, em 17 de fevereiro de 1984.\nP/1 – Em Minas Gerais.\nR – Minas Gerais.\nP/1 – Ana Paula, a gente vai começar a nossa conversa desde quando você era criança. Quais as primeiras memórias, as lembranças que você tem de criança?\nR – Assim... Eu guardo na minha memória o relacionamento que eu tive com meus avós, porque eu morava numa cidade muito pequena, no interior de Minas Gerais, e o contato que eu tinha com a cidade maior, que no caso era Montes Claros, vinha através deles, não é? Porque eles me buscavam, me levavam para a cidade naquela época. E fizeram parte da minha criação mesmo. Eu amo meus pais, eles fizeram parte da minha criação, mas meus avós também a ligação foi muito"}, "folder_size_gb": 0.0}, "folder_size_gb": 131.303}, "HTC_HV007_Robson Alves dos Santos": {"Audiovisual": {"Vídeo": {"Edições": {"HTC_HV007.mp4": {"size_mb": 272.6233, "modified": "2018-10-14 23:23:32", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV007_Robson Alves dos Santos\\Audiovisual\\Vídeo\\Edições\\HTC_HV007.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 221521.0, "duration": 221.52}, "folder_size_gb": 0.266}, "Íntegra": {"HTC_HV007.wmv": {"size_mb": 3601.541, "modified": "2018-08-29 01:54:30", "extension": "WMV", "full_path": "D:\\HD_Telecurso\\HTC_HV007_Robson Alves dos 456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV007_MO002.jpg"}, "folder_size_gb": 0.027}, "folder_size_gb": 0.029}, "Textual": {"HTC_HV07_Robson Alves dos Santos_rev.docx": {"size_mb": 0.0357, "modified": "2019-08-21 13:48:50", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV007_Robson Alves dos Santos\\Textual\\HTC_HV07_Robson Alves dos Santos_rev.docx", "category": "Textual", "content_preview": "Projeto Minha História, Sua História, Nossa História\nDepoimento de Robson Alves dos Santos\nEntrevistado por Marcia Trezza, Ana Zidanis, Teresa Farias\nRecife, 10/03/2018 \nRealização Museu da Pessoa \nHTC _ HV07 _ Robson Alves dos Santos\nTranscrito por Karina Medici Barrella\nRevisão/Edição - Paulo Rodrigues Ferreira\nMW Transcrições\nP/1 – Robson, na verdade - acho que a Ana já falou com você - é um bate-papo. Então, a gente começa fazendo algumas perguntas, mas depois o que você achar importante, o que você achar que foi marcante para você, você conta. Não precisa esperar eu ficar perguntando.\nR – Tudo bem.\nP/1 – E a gente vai perguntar algumas coisas do Telecurso da época - Travessia - e depois, o que aconteceu até hoje. Mas, também, vai perguntar algumas coisas da sua infância, da sua adolescência, porque faz parte de você, não é? O Museu da Pessoa trabalha desse jeito. Com a história toda, tá?\nP/2 – Só antes de gravar: quando você foi aluno de Antônio Carlos, você já era do Travessia?\nR – Foi depois.\nP/2 – Depois que você entrou no Travessia.\nR – Eu só consegui o contato com ele depois do Travessia. Provavelmente eu vou contar essa história também.\nP/2 – Ah, tá! Ok.\nP/1 – Robson, pa"}, "HTC_HV07_Robson Alves dos Santos_edi.docx": {"size_mb": 0.0105, "modified": "2019-08-21 13:48:42", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV007_Robson Alves dos Santos\\Textual\\HTC_HV07_Robson Alves dos Santos_edi.docx", "category": "Textual", "content_preview": "Nome da história \nTRAVESSIA DO COSMOS, ESPAÇO DA CIÊNCIA, RUMO DA VITÓRIA.\nMinibio\nRobson Alves dos Santos, pernambucano do Recife, nasceu em 01 de maio de 1990. Dos anos de infância guarda a lembrança da casa com escadaria e muita área verde; e das brincadeiras, principalmente a bicicleta e o videogame. Recorda-se, com tristeza, de duas reprovações no Fundamental e admite sua culpa, em termos. Considera que em todos os momentos difíceis, com reflexo na sua vida escolar, sempre encontrou acolhida naquele que foi mestre, orientador, apoiador, sobretudo companheiro e conselheiro, amigo certo das horas incertas: o professor Marcos Pinheiro, de Matemática. Ele teve participação relevante na superação de dificuldades e caminhos tortos. Para compensar as repetências, integrou a primeira turma do Travessia na sua escola. Hoje, professor do mesmo projeto, busca aplicar na sua docência a metodologia, a dinâmica e os princípios que lhe permitiram resgatar a defasagem escolar e sonhar com o infinito, já que sua vocação é a Astronomia.  \nSinopse\nQuando Robson Alves dos Santos, esse recifense nascido no dia primeiro de maio de 1990, assistia na TV ao seu desenho preferido - Cavaleiros do Zodíac"}, "folder_size_gb": 0.0}, "folder_size_gb": 71.249}, "HTC_HV009_Ronaldo Conceição": {"Audiovisual": {"Vídeo": {"Edições": {"HTC_HV009.mp4": {"size_mb": 260.9554, "modified": "2018-10-14 22:49:12", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV009_Ronaldo Conceição\\Audiovisual\\Vídeo\\Edições\\HTC_HV009.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 212079.0, "duration": 212.08}, "folder_size_gb": 0.255}, "Íntegra": {"HTC_HV09.wmv": {"size_mb": 4922.1117, "modified": "2018-08-29 13:51:30", "extension": "WMV", "full_path": "D:\\HD_Telecurso\\HTC_HV009_Ronaldo Conceição\\Audiovisual\\Vídeo\\Íntegra\\HTC_HV09.wmv", "category": "Video", "dimension ze_mb": 4.185, "modified": "2018-03-15 16:07:58", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV009_Ronaldo Conceição\\Iconográfico\\Making Of\\HTC_HV009_MO001.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV009_MO001.jpg"}, "HTC_HV009_MO002.JPG": {"size_mb": 6.2058, "modified": "2018-03-20 01:14:28", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV009_Ronaldo Conceição\\Iconográfico\\Making Of\\HTC_HV009_MO002.JPG", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV009_MO002.jpg"}, "folder_size_gb": 0.01}, "folder_size_gb": 0.01}, "Textual": {"HTC_HV09_Ronaldo da Boa Morte Conceicao_rev.docx": {"size_mb": 0.0384, "modified": "2019-08-21 13:49:08", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV009_Ronaldo Conceição\\Textual\\HTC_HV09_Ronaldo da Boa Morte Conceicao_rev.docx", "category": "Textual", "content_preview": "Projeto Minha História, Sua História, Nossa História\nDepoimento de Ronaldo da Boa Morte Conceição\nEntrevistado por Márcia Trezza e Tereza Farias\nRio de Janeiro, 15/03/2018\nRealização Museu da Pessoa\nHTC _HV09_ Ronaldo da Boa Morte Conceição\nTranscrito por Liliane Custódio\nRevisão / Edição Paulo Rodrigues Ferreira\nMW Transcrições\nP/1 – Então, Ronaldo, como eu te falei, a gente vai conversar. Então nem precisa esperar eu ficar perguntando a toda hora; o que você quiser ir contando, o que você achar importante... Mas eu vou começar pedindo para você falar o seu nome completo, onde você nasceu e quando.\nR – Meu nome completo é Ronaldo da Boa Morte Conceição, nasci na cidade de Salvador, no dia 19 de setembro de 1986.\nP/1 – Ronaldo, quais foram as primeiras... São, na verdade, as primeiras lembranças da sua infância.\nR – As primeiras lembranças da minha infância não são muito agradáveis, porque eu lembro muito a ausência da minha mãe, embora eu tivesse uma avó que me encheu de amor, de carinho. Não sei, foi um espaço que minha avó não quis ocupar, ela não se sentiu no direito de ocupar o espaço de minha mãe e esse espaço ficou vago. Eu tenho muito amor e carinho por minha avó, ela já se"}, "HTC_HV09_Ronaldo da Boa Morte Conceição_edi.docx": {"size_mb": 0.0104, "modified": "2019-08-21 13:49:02", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV009_Ronaldo Conceição\\Textual\\HTC_HV09_Ronaldo da Boa Morte Conceição_edi.docx", "category": "Textual", "content_preview": "Nome da história\nA FORÇA TRANSFORMADORA DO ENSINO: O SER NO LUGAR DO TER.\nMinibio\nRonaldo Boa Morte Conceição nasceu em Salvador, em 1986. Tem da infância recordações de carinho e cuidados por parte da avó e de saudades provocadas pela ausência da mãe. Lembra-se de brincadeiras com as irmãs, e na escola; guarda o fascínio por pipas, com as quais dominava o céu, experimentava uma sensação de liberdade. Frequentou escolas até o segundo ano do ensino médio, quando decidiu parar: queria trabalhar, ganhar dinheiro. Viveu os anos de juventude na Europa, onde trabalhou, ganhou, gastou, mas apenas sobreviveu. Casou e descasou. Aí foi o negócio que desandou: faliu. Perdeu o rumo, até o suicídio tentou. O sentido de vida, todavia, estaria na retomada dos estudos. E no Telecurso. Na telessala. Na chama que reacendeu quando redescobriu o valor do estudo, e quando criou um objetivo: ser professor, transformar vidas como o Telecurso fez com a sua. \nSinopse\nNatural de Salvador, onde nasceu em 19 de setembro de 1986, Ronaldo Boa Morte Conceição queria ganhar dinheiro e para tanto trabalhou muito, sem se dar conta de que essa obsessão não lhe rendia os frutos esperados. Na Europa, gastou proporcion"}, "folder_size_gb": 0.0}, "folder_size_gb": 93.808}, "HTC_HV010_Gal Araujo": {"Audiovisual": {"Vídeo": {"Edições": {"HTC_HV010.mp4": {"size_mb": 115.9257, "modified": "2018-10-15 00:05:48", "extensio M", "duration_ms": 171672.0, "duration": 171.67}, "HV10 (4).MP4": {"size_mb": 14985.1809, "modified": "2015-12-22 14:30:26", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV010_Gal Araujo\\Audiovisual\\Vídeo\\Íntegra\\HTC_HV010\\HV10 (4).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "59.940 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 837337.0, "duration": 837.34}, "folder_size_gb": 107.535}, "folder_size_gb": 113.247}, "folder_size_gb": 113.36}, "Áudio": {"HTC_HV010.mp3": {"size_mb": 93.8282, "modified": "2018-03-20 13:15:40", "extension": "MP3", "full_path": "D:\\HD_Telecurso\\HTC_HV010_Gal Araujo\\Audiovisual\\Áudio\\HTC_HV010.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 6148200.0, "duration": 6148.2}, "folder_size_gb": 0.092}, "folder_size_gb": 113.452}, "Iconográfico": {"Acervo": {"Baixa": {"HTC_HV010_FT001.jpg": {"size_mb": 0.1945, "modified": "2018-05-07 18:55:18", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV010_Gal Araujo\\Iconográfico\\Acervo\\Baixa\\HTC_HV010_FT001.jpg", "category": "Image", "dimension": "1600x1200", "resolution": "1600x1200", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV010_FT001.jpg"}, "HTC_HV010_FT002.jpg": {"size_mb": 0.1659, "modified": "2018-05-07 18:55:24", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV010_Gal Araujo\\Iconográfico\\Acervo\\Baixa\\HTC_HV010_FT002.jpg", "category": "Image", "dimension": "1600x1200", "resolution": "1600x1200", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV010_FT002.jpg"}, "folder_size_gb": 0.0}, "folder_size_gb": 0.0}, "Making Of": {"HTC_HV010_MO001.JPG": {"size_mb": 4.2033, "modified": "2018-03-16 12:58:40", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV010_Gal Araujo\\Iconográfico\\Making Of\\HTC_HV010_MO001.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV010_MO001.jpg"}, "HTC_HV010_MO002.JPG": {"size_mb": 4.1341, "modified": "2018-03-16 12:59:14", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV010_Gal Araujo\\Iconográfico\\Making Of\\HTC_HV010_MO002.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV010_MO002.jpg"}, "folder_size_gb": 0.008}, "folder_size_gb": 0.008}, "Textual": {"HTC_HV10_Glausirée Dettman de Araújo_edi.docx": {"size_mb": 0.0105, "modified": "2019-08-21 13:49:12", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV010_Gal Araujo\\Textual\\HTC_HV10_Glausirée Dettman de Araújo_edi.docx", "category": "Textual", "content_preview": "Nome da história\nGAL: CONSTRUINDO O CONHECIMENTO COM A “AULA PORTA AFORA”.\nMinibio\nGlausirée Dettman de Araújo, a Gal, nasceu em BH, em 21 de dezembro de 1995. Traz da infância a lembrança do convívio com a avó na casa com quintal, horta, galinha e abacateiro, como se do interior fosse. E lembrança da escola. De caminhar a pé, por uma hora, para estudar, achando que aquilo era “uma felicidade”. Foi marcante o seu processo de alfabetização, a descoberta da biblioteca, da leitura e do conhecimento. \nDa Química, no ensino médio, à Pedagogia, no ensino superior, fez a opção por lidar com gente, e não com números. Lançou-se a desafios na área da educação, como o da turma com necessidades especiais lá no início da carreira, culminando com o projeto Floração - leia-se Telecurso - onde aplicou, magistralmente, a metodologia, dinâmica e sistemática de apoio a um público naturalmente excluído por sua condição de aprendizagem tardia.\nSinopse\nPara Glausirée Dettman de Araújo, natural de Belo Horizonte, nascida aos 21 de dezembro de 1995, educação sempre foi “uma felicidade”. Mesmo que tivesse que andar por uma hora, a pé, para obtê-la. Isso faz parte de suas lembranças de infância, ao lado da"}, "HTC_HV10_Glausirée Dettman de Araújo_rev.docx": {"size_mb": 0.0436, "modified": "2019-08-21 13:49:16", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV010_Gal Araujo\\Textual\\HTC_HV10_Glausirée Dettman de Araújo_rev.docx", "category": "Textual", "content_preview": "Projeto Minha História, Sua História, Nossa História\nDepoimento de Glausirée Dettman de Araújo\nEntrevistada por Marcia Trezza e Tereza Farias\nRio de Janeiro, 16/03/2018 \nRealização Museu da Pessoa \nEntrevista HTC_HV10_Glausirée Dettman de Araújo\nTranscrito por Karina Medici Barrella\nRevisão/Edição - Paulo Rodrigues Ferreira\nMW Transcrições\nP/1 – Gal, só para começar, diga o seu nome completo, onde você nasceu, e em que data.\nR – Meu nome é Glausirée Dettman de Araújo. Eu nasci em Belo Horizonte, no dia 21 de dezembro de 1995.\nP/1 – Gal, vou te chamar de Gal, tá? Bom, como é que veio esse Gal? Como começaram a te chamar de Gal?\nR – Gal é apelido de infância porque Glausirée fica complicado, então, na escola, em casa, era sempre Gal. Só quando a mãe xingava, aí era Glausiréeeeee! (risos)\nP/1 – Você sabe por que você tem esse nome, Glausirée?\nR – Porque minha mãe gosta muito de Francês; aí, baseado em Desirée. E eu tenho dois irmãos - são três irmãos lá em casa - e ela colocou todos com G. E aí ficou Glausirée, Gladston e Gleice.\nP/1 – Um rapaz e uma menina você tem de irmãos.\nR – Isso.\nP/1 – Qual o nome dos seus pais?\nR – Meu pai, Milton José de Araújo e minha mãe, Vanda Dettman de A"}, "folder_size_gb": 0.0}, "folder_size_gb": 113.46}, "HTC_HV011_Nandyara Rezende": {"Audiovisual": {"Vídeo": {"Edições": {"HTC_HV011.mp4": {"size_mb": 242.3005, "modified": "2018-10-15 00:21:38", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV011_Nandyara Rezende\\Audiovisual\\Vídeo\\Edições\\HTC_HV011.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", .jpg": {"size_mb": 0.4297, "modified": "2018-05-07 18:43:32", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV011_Nandyara Rezende\\Iconográfico\\Acervo\\Baixa\\HTC_HV011_FT004.jpg", "category": "Image", "dimension": "1786x1197", "resolution": "1786x1197", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV011_FT004.jpg"}, "HTC_HV011_FT003.jpg": {"size_mb": 0.3299, "modified": "2018-05-07 18:40:00", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV011_Nandyara Rezende\\Iconográfico\\Acervo\\Baixa\\HTC_HV011_FT003.jpg", "category": "Image", "dimension": "1793x1197", "resolution": "1793x1197", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV011_FT003.jpg"}, "HTC_HV011_FT010.jpg": {"size_mb": 0.269, "modified": "2018-05-07 18:49:54", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV011_Nandyara Rezende\\Iconográfico\\Acervo\\Baixa\\HTC_HV011_FT010.jpg", "category": "Image", "dimension": "1786x1197", "resolution": "1786x1197", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV011_FT010.jpg"}, "HTC_HV011_DOC001.jpg": {"size_mb": 1.6309, "modified": "2022-07-27 14:23:20", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV011_Nandyara Rezende\\Iconográfico\\Acervo\\Baixa\\HTC_HV011_DOC001.jpg", "category": "Image", "dimension": "3507x2550", "resolution": "3507x2550", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV011_DOC001.jpg"}, "folder_size_gb": 0.005}, "folder_size_gb": 0.063}, "Making Of": {"HTC_HV011_MO001.JPG": {"size_mb": 5.4005, "modified": "2018-03-16 18:22:40", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV011_Nandyara Rezende\\Iconográfico\\Making Of\\HTC_HV011_MO001.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV011_MO001.jpg"}, "HTC_HV011_MO002.JPG": {"size_mb": 6.9094, "modified": "2018-03-20 01:19:28", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV011_Nandyara Rezende\\Iconográfico\\Making Of\\HTC_HV011_MO002.JPG", "category": "Image", "dimension": "3456x5184", "resolution": "3456x5184", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV011_MO002.jpg"}, "folder_size_gb": 0.012}, "folder_size_gb": 0.075}, "Textual": {"HTC_HV11_Nandiara de Almeida Rezende_edi.docx": {"size_mb": 0.0098, "modified": "2019-08-21 13:49:20", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV011_Nandyara Rezende\\Textual\\HTC_HV11_Nandiara de Almeida Rezende_edi.docx", "category": "Textual", "content_preview": "Nome da história -\nNandiara: a arte de deixar na educação a sua essência\nMinibio\nNandiara A. Rezende é do estado do Rio e nasceu em 17.11.1964. Da infância traz recordações do convívio com os pais e os irmãos, das brincadeiras e do mundo da leitura, onde se refugiou desde sempre. O horror a decorar e a dificuldade em Matemática resultaram em querer parar de estudar. Superou, no entanto: graduada em Matemática, professora de Ciências, chegou ao Telecurso. Ali deixou sua essência - o poder ajudar na correção de distorções idade-série. Ali acredita ter cumprido a sua missão no mundo e na Educação, impulsionando pessoas a se descobrirem como seres sociais, dotados de habilidades e competências capazes de garantir a participação no mercado de trabalho e a conquista de uma visão crítica. Considera, portanto, o Telecurso, a experiência da telessala, a vivência mais marcante que teve nos longos anos de prática educacional.\nSinopse\nA sensação que Nandiara Rezende - Bom Jesus de Itabapoana - RJ - 17.11.1964 - tem, resultante do tempo em que lecionou no Telecurso, é a de que saiu dessa experiência mais próxima da missão que teria a cumprir na Educação: ajudar pessoas a assimilar conteúdos que"}, "HTC_HV11_Nandiara de Almeida Rezende_rev.docx": {"size_mb": 0.0324, "modified": "2019-08-21 13:49:26", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV011_Nandyara Rezende\\Textual\\HTC_HV11_Nandiara de Almeida Rezende_rev.docx", "category": "Textual", "content_preview": "Projeto Minha História, Nossa História, Sua História \nDepoimento de Nandiara de Almeida Rezende\nEntrevistada por Marcia Trezza e Tereza Farias\nRio de Janeiro, 16/03/2018 \nRealização Museu da Pessoa \nHTC_HV11_Nandiara de Almeida Rezende\nTranscrito por Karina Medici Barrella\nRevisão/Edição - Paulo Rodrigues Ferreira\nMW Transcrições\nP/1 – Nandiara, a gente vai conversar, como a gente já falou para você. Mas só para começar, fale o seu nome completo, onde você nasceu e quando.\nR – Eu sou Nandiara de Almeida Rezende, nasci em Bom Jesus do Itabapoana, em 17 de novembro de 1964.\nP/1 – Essa cidade fica no Rio de Janeiro?\nR – Fica no Rio de Janeiro, divisa com o Espírito Santo.\nP/1 – Nandiara, quais são suas primeiras lembranças da infância?\nR – Olha, eu sou filha de dois enfermeiros e fiz Ciências. Eu falo que tentei ser médica, mas não deu certo porque eu não tinha dinheiro. Então, o que eu encontrei mais perto foi Ciências. Minha mãe é professora também. Na minha infância, eu tive uma professora que me marcou muito por causa da leitura. Eu tive reprovação na minha infância - uma reprovação - não me encontrava na escola, eu não queria mais, só gostava das aulas de leitura porque ela lia P"}, "folder_size_gb": 0.0}, "folder_size_gb": 116.021}, "HTC_HV012_Luciana Alemão": {"Audiovisual": {"Vídeo": {"Edições": {"HTC_HV012.mp4": {"size_mb": 314.4236, "modified": "2018-10-15 01:13:06", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV012_Luciana Alemão\\Audiovisual\\Vídeo\\Edições\\HTC_HV012.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 255555.0, "duration": 255.56}, "folder_size_gb": 0.307}, "Íntegra": {"HTC_HV012.mpeg": {"size_mb ecurso\\HTC_HV012_Luciana Alemão\\Iconográfico\\Making Of\\HTC_HV012_MO002.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV012_MO002.jpg"}, "folder_size_gb": 0.01}, "folder_size_gb": 0.01}, "Textual": {"HTC_HV12_Luciana Francisca Alemao_edi.docx": {"size_mb": 0.0093, "modified": "2019-08-21 13:49:30", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV012_Luciana Alemão\\Textual\\HTC_HV12_Luciana Francisca Alemao_edi.docx", "category": "Textual", "content_preview": "Nome da história\nA aluna que se fez professora e provou que nada era fogo de facho - histórias do Travessia.\nMinibio\nLuciana Francisca Alemão nasceu em Pernambuco - município de Jaboatão dos Guararapes - em 02.07.1980. Traz lembranças de violência doméstica na infância. E de gostar muito dos estudos, da escola que frequentava e de escrever, a ponto de uma professora sugerir a publicação de seus poemas. Por conta de ter que cuidar dos avós e da casa, interrompeu o ensino médio. Gravidez, casamento e oposição do companheiro prolongaram essa situação e só aos vinte e cinco anos logrou concluir essa etapa da escolaridade, graças ao Travessia, o Telecurso de sua região. A partir daí, e com um histórico de determinação, beirando o heroísmo, venceu desafios e dificuldades e tornou-se professora. De duas redes municipais e do próprio Travessia, onde se esforça para reproduzir vivências de construção, aprendizagem e transformação por meio do saber.\nSinopse\nLuciana Francisca Alemão, pernambucana de Jaboatão dos Guararapes, nascida em 02.07.1980, emociona-se ao se ver hoje professora, e particularmente do Travessia - onde o seu recomeço aconteceu - e ao recordar-se do quanto de descrédito enf"}, "HTC_HV12_Luciana Francisca Alemao_rev.docx": {"size_mb": 0.0361, "modified": "2019-08-21 13:49:36", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV012_Luciana Alemão\\Textual\\HTC_HV12_Luciana Francisca Alemao_rev.docx", "category": "Textual", "content_preview": "Projeto Minha História, Sua História, Nossa História\nDepoimento de Luciana Francisca Alemão\nEntrevistada por Márcia Trezza e Tereza Farias\nRio de Janeiro, 16/03/2018\nHTC_HV12_ Luciana Francisca Alemão\nRealização Museu da Pessoa\nTranscrito por Liliane Custódio\nRevisão/Edição - Paulo Rodrigues Ferreira\nMW Transcrições\nP/1 – Luciana, a gente vai começar esta conversa, mas só para... (interrupção). Luciana, fale para mim, só para a gente começar a conversa, o seu nome completo, onde você nasceu e em que dia, ano, mês, tudo.\nR – Então... Meu nome é Luciana Francisca Alemão, eu nasci no dia dois de julho de 1980, na cidade de Jaboatão dos Guararapes, que é uma cidade que faz parte do estado de Pernambuco. Eu tenho trinta e sete anos, atualmente também resido em Jaboatão e tenho dois filhos, sou casada, e sou professora.\nP/1 – Luciana, conte um pouquinho da sua infância: irmãos, brincadeiras, do que você gostava de brincar, se você tinha amigos, enfim, conte um pouco dessa parte das brincadeiras.\nR – Minha mãe teve três filhas, eu sou a do meio. Da infância, eu lembro que a gente gostava muito de brincar. Mas tem uma parte também da infância, que quando o pai da gente estava chegando, a g"}, "folder_size_gb": 0.0}, "folder_size_gb": 183.584}, "HTC_HV013_Thalia Clay Santos": {"Audiovisual": {"Vídeo": {"Edições": {"HTC_HV013.mp4": {"size_mb": 200.4578, "modified": "2018-10-15 01:57:10", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV013_Thalia Clay Santos\\Audiovisual\\Vídeo\\Edições\\HTC_HV013.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 162763.0, "duration": 162.76}, "folder_size_gb": 0.196}, "Íntegra": {"HTC_HV013.mpeg": {"size_mb": 27457.2935, "modified": "2018-08-30 03:48:50", "extension": "MPEG", "full_path": "D:\\HD_Telecur 9, "modified": "2019-11-04 15:01:16", "extension": "MP3", "full_path": "D:\\HD_Telecurso\\HTC_HV013_Thalia Clay Santos\\Audiovisual\\Áudio\\HTC_HV013.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 3805616.0, "duration": 3805.62}, "folder_size_gb": 0.113}, "folder_size_gb": 94.797}, "Iconográfico": {"Acervo": {"Baixa": {"HTC_HV013_DOC001A.jpeg": {"size_mb": 0.8944, "modified": "2018-05-07 19:00:22", "extension": "JPEG", "full_path": "D:\\HD_Telecurso\\HTC_HV013_Thalia Clay Santos\\Iconográfico\\Acervo\\Baixa\\HTC_HV013_DOC001A.jpeg", "category": "Image", "dimension": "2096x2540", "resolution": "2096x2540", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV013_DOC001A.jpg"}, "HTC_HV013_DOC001B.jpeg": {"size_mb": 0.3527, "modified": "2018-05-07 21:57:48", "extension": "JPEG", "full_path": "D:\\HD_Telecurso\\HTC_HV013_Thalia Clay Santos\\Iconográfico\\Acervo\\Baixa\\HTC_HV013_DOC001B.jpeg", "category": "Image", "dimension": "1822x2511", "resolution": "1822x2511", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV013_DOC001B.jpg"}, "HTC_HV013_DOC001C.jpeg": {"size_mb": 0.5341, "modified": "2018-05-07 21:57:48", "extension": "JPEG", "full_path": "D:\\HD_Telecurso\\HTC_HV013_Thalia Clay Santos\\Iconográfico\\Acervo\\Baixa\\HTC_HV013_DOC001C.jpeg", "category": "Image", "dimension": "1836x2511", "resolution": "1836x2511", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV013_DOC001C.jpg"}, "HTC_HV013_DOC001D.jpeg": {"size_mb": 0.4279, "modified": "2018-05-07 21:57:48", "extension": "JPEG", "full_path": "D:\\HD_Telecurso\\HTC_HV013_Thalia Clay Santos\\Iconográfico\\Acervo\\Baixa\\HTC_HV013_DOC001D.jpeg", "category": "Image", "dimension": "1736x2525", "resolution": "1736x2525", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV013_DOC001D.jpg"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.002}, "Making Of": {"HTC_HV013_MO001.JPG": {"size_mb": 6.0111, "modified": "2018-04-25 11:42:12", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV013_Thalia Clay Santos\\Iconográfico\\Making Of\\HTC_HV013_MO001.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV013_MO001.jpg"}, "HTC_HV013_MO002.JPG": {"size_mb": 5.867, "modified": "2018-04-25 11:42:30", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV013_Thalia Clay Santos\\Iconográfico\\Making Of\\HTC_HV013_MO002.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV013_MO002.jpg"}, "folder_size_gb": 0.012}, "folder_size_gb": 0.014}, "Textual": {"HTC_HV013_Thalia Clay_edi.docx": {"size_mb": 0.0153, "modified": "2020-02-17 11:52:12", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV013_Thalia Clay Santos\\Textual\\HTC_HV013_Thalia Clay_edi.docx", "category": "Textual", "content_preview": "Título: Aprendendo a recomeçar\n\nSinopse: Essa paraense de Belém do Pará - nasceu em 20 de outubro de 1997. Thália Clay Santos de Palheta tem recordações da infância basicamente no campo das brincadeiras. E quanto às escolas que frequentou - foram muitas, até em função da constante troca de endereços - relata um histórico de não adaptação às mesmas e dificuldade de relacionamento com colegas e professores. A proximidade com animais de estimação - teve vários, de gato a macaco - e o gosto por escrever são características que revela em suas memórias. E, no tocante à educação, ocupam contornos de relevância o Mundiar, como o Telecurso é chamado no Pará, e a dedicação da professora Kátia, pelo que representaram na superação de dificuldades. Que vão desde as escolares - tinha vindo de uma reprovação – até as relacionadas a integração, convívio e temperamento. Graças a isso, acredita que possa alcançar mais facilmente o seu objetivo: cursar Arqueologia.\n\nEdição: Meu nome completo é Thália Clay Santos de Palheta. Nasci em Belém do Pará, no dia 20 de outubro de 1997. O que me recordo da infância é, essencialmente, brincar. Brincar na rua, com meu primo, com meu irmão dentro de casa, e brinc"}, "folder_size_gb": 0.0}, "folder_size_gb": 94.811}, "HTC_HV014_Alice Barros da Costa": {"Audiovisual": {"Vídeo": {"Edições": {"HTC_HV014.mp4": {"size_mb": 279.4127, "modified": "2018-10-15 02:16:12", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV014_Alice Barros da Costa\\Audiovisual\\Vídeo\\Edições\\HTC_HV014.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 226893.0, "duration": 226.89}, "folder_size_gb": 0.273}, "Íntegra": {"HTC_HV014.mpeg": {"size_mb": 48902.9836, "modified": "2018-08-30 16:10:10", "extension": "MPEG", "full_path": "D:\\HD_Telecurso\\HTC_HV014_Alice Barros da Costa\\Audiovisual\\Vídeo\\Íntegra\\HTC_HV014.mpeg", "category": "Other"}, "HTC_HV014": {"Tele_HV-14 (1).MP4": {"size_mb": 27693.5045, "modified": "2016-01-31 17:37:24", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV014_Alice Barros da Costa\\Audiovisual\\Vídeo\\Íntegra\\HTC_HV014\\Tele_HV-14 (1).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "59.940 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1552551.0, "duration": 1552.55}, "Tele_HV-14 (2).MP4": {"size_mb": 14014.7728, "modified": "2016-01-31 18:03:28", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV014_Alice Barros da Costa\\Audiovisual\\Vídeo\\Íntegra\\HTC_HV014\\Tele_HV-14 (2).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "59.940 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 784784 FT005.jpeg", "category": "Image", "dimension": "1280x719", "resolution": "1280x719", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV014_FT005.jpg"}, "HTC_HV014_FT006.jpeg": {"size_mb": 0.0936, "modified": "2018-04-25 17:31:14", "extension": "JPEG", "full_path": "D:\\HD_Telecurso\\HTC_HV014_Alice Barros da Costa\\Iconográfico\\Acervo\\Baixa\\HTC_HV014_FT006.jpeg", "category": "Image", "dimension": "1280x719", "resolution": "1280x719", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV014_FT006.jpg"}, "folder_size_gb": 0.005}, "folder_size_gb": 0.005}, "Making Of": {"HTC_HV014_MO001.JPG": {"size_mb": 5.8027, "modified": "2018-04-25 15:28:52", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV014_Alice Barros da Costa\\Iconográfico\\Making Of\\HTC_HV014_MO001.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV014_MO001.jpg"}, "HTC_HV014_MO002.JPG": {"size_mb": 5.318, "modified": "2018-04-25 15:29:00", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV014_Alice Barros da Costa\\Iconográfico\\Making Of\\HTC_HV014_MO002.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV014_MO002.jpg"}, "folder_size_gb": 0.011}, "folder_size_gb": 0.016}, "Textual": {"HTC_HV14_Alice Barros da Costa_edi.docx": {"size_mb": 0.0096, "modified": "2019-08-21 13:49:48", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV014_Alice Barros da Costa\\Textual\\HTC_HV14_Alice Barros da Costa_edi.docx", "category": "Textual", "content_preview": "Nome da história\nDA DISCIPLINA ESCOLHIDA À UNIDOCÊNCIA: OS CAMINHOS DO TELECURSO.\nMinibio\nAlice Barros da Costa nasceu em Belém, mas criou-se no interior do Pará, até que voltou para a Capital para estudar. Traz lembranças da família - os pais e irmãos - das brincadeiras na infância e das escolas que frequentou. Queria ser pediatra, acabou sendo professora de Geografia. Curiosamente, não por influência da mãe, também professora de Geografia, mas de uma professora do cursinho. Começou lecionando no ensino regular, por circunstâncias abandonou e voltou para lecionar no Telecurso, apaixonar-se pela telessala. Sempre foi de dar a volta por cima, de fazer na vida o mais simples, sem ser o mais fácil. Agora, o Telecurso - Mundiar/Projeto Pará para os paraenses - representou, para a sua carreira no magistério, a retomada e o encontro; o crescimento e a recompensa pelos resultados que acompanhou. Acredita que, como professora, ali tenha conhecido o melhor da arte de ensinar: a metodologia, a dinâmica, a programação bem construída, os eixos, as equipes...\nSinopse\nAlice Barros da Costa nasceu em Belém, em 05 de fevereiro de 1974. Na verdade, sua mãe veio para a Capital para ela nascer. Filha"}, "HTC_HV14_Alice Barros da Costa_rev.docx": {"size_mb": 0.0462, "modified": "2019-08-21 13:49:52", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV014_Alice Barros da Costa\\Textual\\HTC_HV14_Alice Barros da Costa_rev.docx", "category": "Textual", "content_preview": "Projeto Minha História, Sua História, Nossa História\nDepoimento de Alice Barros da Costa\nEntrevistada por Marcia Trezza e Ana \nBelém, 25 de abril de 2018 \nRealização Museu da Pessoa \nHTC_HV14_Alice Barros da Costa\nTranscrito por Karina Medici Barrella\nRevisado/Editado por Paulo Rodrigues Ferreira \nP/1 – Para começar, por favor, Alice, fale o seu nome completo, a cidade em que você nasceu e o estado, e a data.\nR – Meu nome completo é Alice Barros da Costa. Eu nasci aqui em Belém, mas me criei em Tomé-Açu, interior do Pará. Vim de lá para estudar o ensino médio, em 1988. Mas a minha infância toda foi lá em Tomé-Açu, a terra dos japoneses, da pimenta do reino, e tal. É uma colônia de japoneses, eles se instalaram lá. E eu vim em 1988 fazer o ensino médio porque lá não tinha, em Tomé-Açú. Aí eu vim e fiz o ensino médio, fiz o cursinho e depois passei no vestibular. E depois, em 2001, eu voltei para lá para trabalhar com o meu pai, numa loja.\nP/1 – Então, nós vamos contar tudo isso agora em detalhes.\n R – Ai, meu Deus! (risos).\nP/1 – Em que data você nasceu?\nR – Eu nasci no dia cinco de fevereiro de 1974. \nP/1 – Alice, você veio nascer em Belém.\nR – Eu vim nascer em Belém.\nP/1 – Os seus"}, "folder_size_gb": 0.0}, "folder_size_gb": 169.41}, "HTC_HV015_Emilly Ganum Areal": {"Audiovisual": {"Vídeo": {"Edições": {"HTC_HV015.mp4": {"size_mb": 219.0189, "modified": "2018-10-15 02:27:44", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV015_Emilly Ganum Areal\\Audiovisual\\Vídeo\\Edições\\HTC_HV015.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 177978.0, "duration": 177.98}, "folder_size_gb": 0.214}, "Íntegra": {"HTC_HV015.mpeg": {"size_mb": 43506.6232, "modified": "2019-10-26 09:24:32", "extension": "MPEG", "full_path": "D:\\HD_Telecurso\\HTC_HV015_Emilly Ganum Areal\\Audiovisual\\Vídeo\\Íntegra\\HTC_HV015.mpeg", "category": "Other"}, "HTC_HV015": {"Tele_HV_15 (1).MP4": {"size_mb": 28259.6994, "modified": "2016-02-01 21:48:10", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV015_Emilly Ganum Areal\\Audiovisual\\Vídeo\\Íntegra\\HTC_HV015\\Tele_HV_15 (1).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "59.940 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 1570569.0, "duration": 1570.57}, "Tele_HV_15 (2).MP4": {"size_mb": 637.7125, "modified": "2016-02-01 22:14:52", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV015_Emilly Ganum Areal\\Audiovisual\\Vídeo\\Íntegra\\HTC_HV015\\Tele_HV_15 (2).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16: ed": "2018-04-26 21:53:30", "extension": "JPG", "full_path": "D:\\HD_Telecurso\\HTC_HV015_Emilly Ganum Areal\\Iconográfico\\Making Of\\HTC_HV15_MO02.JPG", "category": "Image", "dimension": "5184x3456", "resolution": "5184x3456", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_HTC_HV15_MO02.jpg"}, "folder_size_gb": 0.011}, "folder_size_gb": 0.012}, "Textual": {"HTC_HV15_Emily Ganum Areal_rev.docx": {"size_mb": 0.0413, "modified": "2019-08-21 13:50:00", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV015_Emilly Ganum Areal\\Textual\\HTC_HV15_Emily Ganum Areal_rev.docx", "category": "Textual", "content_preview": "Projeto Minha História, Sua História, Nossa História\nDepoimento de Emily Ganum Areal\nEntrevistada por Marcia Trezza e Teresa Farias\nRio Branco, 26/04/2018\nRealização Museu da Pessoa\nHTC_HV15_Emily Ganum Areal\nTranscrito por Mariana Wolff\nRevisado/Editado por Paulo Rodrigues Ferreira\nP/1 –  Emily, a gente vai começar esta conversa. Você pode começar falando o seu nome completo, onde você nasceu e a data.\nR – Eu me chamo Emily Ganum Areal, nasci em Sena Madureira, a 144 quilômetros de Rio Branco, Capital, no dia 12 de novembro de 1976.\nP/1 – Emily, quais as suas primeiras lembranças da infância?\nR – A minha memória afetiva me traz muito a referência dos meus avós. O meu avô era português, então o que mais me chamava a atenção nessa relação era o hábito de tomar café na casa dos meus avós, no final da tarde, e ouvir o meu avô falar muito enrolado, uma língua que eu não dominava muito bem (risos).\nP/1 – Ele era pai da sua mãe ou pai do seu pai?\nR – É pai do meu pai. Aqui, o Acre, ele foi… Existe um processo migratório muito forte de árabes, portugueses e nordestinos. Eu sou descendente... O meu avô paterno é português e o meu avô materno tem descendência de turcos.\nP/1 – O seu avô, com"}, "HTC_HV15_Emily Ganum Areal_edi.docx": {"size_mb": 0.0104, "modified": "2019-08-21 13:49:56", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV015_Emilly Ganum Areal\\Textual\\HTC_HV15_Emily Ganum Areal_edi.docx", "category": "Textual", "content_preview": "Nome da história\nEmily: professora numa perspectiva integral\nMinibio\nEmily Ganum Areal é de Sena Madureira, no Acre. Nasceu em 12 de novembro de 1976 e traz da infância lembranças da família; dos avós; das brincadeiras - particularmente subir no pé de azeitona; do Jardim de Infância. Ainda criança, a proximidade com a igreja - anjinho na procissão, grupo de jovens, catequese. As festas juninas, a cavalhada e os piqueniques em carro de boi. Terminou o ensino médio no município para onde se mudou quando casou, aos quinze anos. Lá foi primeira-dama, professora, estudante universitária. Fez Letras. Sempre foi professora, sempre buscou o novo, o diferente na Educação. Talvez por isso tenha chegado ao Poronga, o Telecurso de lá. Nele compreendeu que a Educação, o que se aprende, tem que fazer sentido com a vida. Hoje não está mais lá, mas guarda a certeza de que foi o momento em que se sentiu professora numa perspectiva integral.\nSinopse\nAcreana de Sena Madureira, 144 quilômetros da Capital, Emily Ganum Areal nasceu em 12.11.1976. Povoam sua memória afetiva os avós - portugueses, os paternos e de origem árabe o avô materno - as brincadeiras de criança; o pé de azeitona, que era como se f"}, "folder_size_gb": 0.0}, "folder_size_gb": 150.704}, "HTC_HV016_Maria Rosalina Oliveira Araújo": {"Audiovisual": {"Vídeo": {"Edições": {"HTC_HV016.mp4": {"size_mb": 261.0313, "modified": "2018-11-11 03:45:48", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV016_Maria Rosalina Oliveira Araújo\\Audiovisual\\Vídeo\\Edições\\HTC_HV016.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 215749.0, "duration": 215.75}, "folder_size_gb": 0.255}, "Íntegra": {"HTC_HV016_002.mpeg": {"size_mb": 19720.7805, como era muito pequeno, daí só dava para passar um por um. Aí eu escorreguei, cai bem na hora de ir para o aeroporto para vir para Rio Branco e a minha mãe ficou muito chateada com isso.\nP/1 – Aí teve que trocar a roupa…\nR – Tive que trocar a roupa às pressas.\nP/1 – Tudo na mala"}, "HTC_HV16_Maria Rosenaide Oliveira Araújo_edi.docx": {"size_mb": 0.0094, "modified": "2019-08-21 13:50:04", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV016_Maria Rosalina Oliveira Araújo\\Textual\\HTC_HV16_Maria Rosenaide Oliveira Araújo_edi.docx", "category": "Textual", "content_preview": "Nome da história\nTELECURSO - A CHAVE DO SABER E DO ENTENDER\nMinibio\nMaria Rosenaide Oliveira Araújo nasceu em Cruzeiro do Sul, Acre, em 13 de junho de 1998, mas saiu de lá para viver na Capital logo aos dois anos. Da infância, tem as recordações b            de praxe - as brincadeiras, o videogame, esconderijo na casa mal assombrada… E as referências escolares começaram para valer no ensino médio. Por quê? Porque foi quando passou a perceber o significado do estudo nas definições de vida, e sobretudo profissionais.\nNo percurso escolar sofreu uma repetência, justamente quando iniciava o ensino médio no regular, o que foi determinante para o ingresso no Telecurso. Deste, por sinal, guarda as mais entusiasmadas lembranças, posto que o considera, tanto no plano escolar como na preparação para o mercado de trabalho, instrumento de construção do conhecimento e de oportunidades.\nSinopse\nNascida em Cruzeiro do Sul, Acre, no dia 13 de junho de 1998, Maria Rosenaide Oliveira Araújo mudou-se com a família para Rio Branco aos dois anos de idade. As brincadeiras de criança - correr, pular, jogar - a acompanharam até o ponto em que enxergou o lado sério da vida. No tocante à escola, poucas refer"}, "folder_size_gb": 0.0}, "folder_size_gb": 32.786}, "HTC_HV017_Wesley Braga Chaves": {"Audiovisual": {"Vídeo": {"Edições": {"HTC_HV017.mp4": {"size_mb": 249.7922, "modified": "2018-11-11 04:07:22",
