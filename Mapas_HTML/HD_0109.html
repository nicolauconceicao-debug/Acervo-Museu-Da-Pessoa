_preview": ""}, "HTC_HV17_Wesley Braga Chaves_edi.docx": {"size_mb": 0.0093, "modified": "2019-08-21 13:50:10", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV017_Wesley Braga Chaves\\Textual\\HTC_HV17_Wesley Braga Chaves_edi.docx", "category": "Textual", "content_preview": "Nome da história\nPORONGA: PROJETO EDUCACIONAL, CAMINHO DE LUZ\nMinibio\nAcreano da Capital, Rio Branco, e nascido em 29.08.1996. Este é Wesley Braga Chaves que, da infância, recorda-se de brincadeiras no quintal e com a irmã, na rede; das pescarias com o pai; da convivência com os avós. Dos anos de escola, as lembranças são de uma certa rebeldia no Fundamental; de pular o muro e sair para jogar videogame; de repetir a sexta e a oitava séries. Face à repetência e ao desinteresse, foi sugerido à sua mãe o Poronga. É o Telecurso do Acre. Deu muito certo. Através da metodologia, da dedicação da docência e do fato de ser uma matéria por dia, com reflexos no aprendizado, viu novamente despertado o interesse pelos estudos e aberta a mente para os aspectos positivos daí decorrentes. Na sua vida escolar e como indivíduo descobriu os benefícios do Telecurso: tem uma profissão, casou-se, é pai e cidadão de bem. O Poronga lhe indicou o caminho correto. Tornou-se referência das transformações obtidas por meio do Telecurso.\nSinopse\nDa rebeldia ao exemplo de como o Telecurso enseja transformações no aluno e no indivíduo, Wesley Braga Chaves, natural de Rio Branco, no Acre, conta uma história de vid"}, "folder_size_gb": 0.0}, "folder_size_gb": 86.871}, "HTC_HV018_Laura Margareth Arrueta Camelo": {"Audiovisual": {"Vídeo": {"Edições": {"HTC_HV018.mp4": {"size_mb": 308.1694, "modified": "2018-11-11 12:45:36", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV018_Laura Margareth Arrueta Camelo\\Audiovisual\\Vídeo\\Edições\\HTC_HV018.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_c infância conserva lembranças da mãe trabalhando e a casa aos cuidados dela e da irmã. Recorda-se da mãe dizendo que só havia uma maneira de driblar as dificuldades: estudando. Hoje é professora, mas sempre quis ser médica. É casada, mas sempre esteve apaixonada por um primo. Sua primeira referência na Educação foi uma professora de terceira série e, no ensino médio, colheu espinhos e flores: em vias de ser expulsa, ouviu de uma professora de História que não teria futuro, exceto a prostituição; mais adiante, outro docente, da mesma disciplina, fez para ela a mesma diferença que hoje busca fazer na vida de seus alunos, como professora justamente de… História! Dos anos de sala de aula, considera que aqueles do Poronga é que a tornaram, verdadeiramente, professora, mediadora e educadora.\nSinopse\nNatural de Rio Branco, Acre, Laura Margarete Arrueta Camelo nasceu no dia 14 de agosto de 1977. Desde pequena, desejou ser médica. E hoje não tem dúvida alguma de que é melhor professora do que a médica que não con"}, "folder_size_gb": 0.0}, "folder_size_gb": 68.637}, "HTC_HV019_Handressa Maia Benedetto": {"Audiovisual": {"Vídeo": {"Edições": {"HV19_A1_Previa.wmv": {"size_mb": 154.1108, "modified": "2018-07-24 03:44:44", "extension": "WMV", "full_path": "D:\\HD_Telecurso\\HTC_HV019_Handressa Maia Benedetto\\Audiovisual\\Vídeo\\Edições\\HV19_A1_Previa.wmv", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "VC-1", "audio_channels": "Stereo", "audio_codec": "WMA", "duration_ms": 162294.0, "duration": 162.29}, "HV19_B1_Previa.wmv": {"size_mb": 98.2276, "modified": "2018-08-10 17:12:30", "extension": "WMV", "full_path": "D:\\HD_Telecurso\\HTC_HV019_Handressa Maia Benedetto\\Audiovisual\\Vídeo\\Edições\\HV19_B1_Previa.wmv", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "VC-1", "audio_channels": "Stereo", "audio_codec": "WMA", "duration_ms": 99799.0, "du  0.18}, "folder_size_gb": 72.469}, "Textual": {"HTC_HV19_Andressa Maia Benedetto_rev.docx": {"size_mb": 0.0354, "modified": "2019-08-21 13:50:36", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV019_Handressa Maia Benedetto\\Textual\\HTC_HV19_Andressa Maia Benedetto_rev.docx", "category": "Textual", "content_preview": "Projeto Minha História, Sua História, Nossa História\nDepoimento de Andressa Maia Benedetto\nEntrevistada por Marcia Trezza e Teresa Farias\nManaus, 29/04/2018\nRealização Museu da Pessoa\nHTC_ HV19_ Andressa Maia Benedetto\nTranscrito por Mariana Wolff\nRevisado e editado por Paulo Rodrigues Ferreira\nP/1 – Andressa, para a gente começar esta conversa, diga o seu nome completo, onde você nasceu e a data.\nR – O meu nome é Andressa Maia Benedetto, eu nasci em Urucurituba, dia quatro de junho de 1999.\nP/1 – Andressa, fale os nomes do seu pai e da sua mãe para a gente.\nR – O meu pai… nome completo?\nP/1 – Se puder…\nR – O meu pai… o nome do meu pai é Rogério da Silva Benedetto e a minha mãe, Geni Maria Serra Maia.\nP/1 – Você viveu sempre"}, "HTC_HV19_Andressa Maia Benedetto_edi.docx": {"size_mb": 0.0102, "modified": "2019-08-21 13:50:30", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV019_Handressa Maia Benedetto\\Textual\\HTC_HV19_Andressa Maia Benedetto_edi.docx", "category": "Textual", "content_preview": "Nome da história\nIGARITÉ - TELECURSO DAS OPORTUNIDADES , DA INSERÇÃO NO MUNDO\nMinibio\nAndressa Maia Benedetto é de 04 de junho de 1999. Nascida em Urucurituba, deslocou-se por regiões próximas, sempre no interior do Amazonas, com idas e vindas frequentes. Tão frequentes que prejudicaram os seus estudos e influíram na sua vontade de estudar. Agora, a infância em si foi bem solta, bem livre, brincando e nadando no rio. No sexto ano do Fundamental, o Igarité - projeto do Telecurso - chegou em sua vida. Fez a diferença. Recuperou o gosto por aprender. Aprender conteúdos com expressão artística, com certo vínculo com a sua realidade. A oportunidade de desenvolver-se. Como estudante, como ser social, como alguém que se envolve, que prova do inusitado, que sente despertada a sua visão crítica, a sua capacidade de trabalhar em equipe. O Igarité ensinou-lhe até a viver sem ele, a voltar ao ensino regular sem desistir de buscar o seu lugar no mundo.\nSinopse\nAndressa Maia Benedetto nasceu no interior do Amazonas, em 04 de junho de 1999. É natural de Urucurituba, mas foi criada, até os sete anos, em Augusto Montenegro. De lá tem a lembrança da infância livre, brincando, correndo, nadando no ri"}, "folder_size_gb": 0.0}, "folder_size_gb": 72.469}, "HTC_HV020_Maria do Carmo Pantoja da Silva": {"Audiovisual": {"Vídeo": {"Edições": {"HTC_HV020.mp4": {"size_mb": 229.9898, "modified": "2018-11-11 13:22:22", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV020_Maria do Carmo Pantoja da Silva\\Audiovisual\\Vídeo\\Edições\\HTC_HV020.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 190357.0, "duration": 190.36}, "folder_size_gb": 0.225}, "Íntegra": {"HTC_HV020.wmv": {"size_mb": 6982.9153, "modified": "2018-09-01 00:15:26", "extension": "WMV", "full_path": "D:\\HD_Telecurso\\HTC_HV020_Maria do Carmo Pantoja da Silva\\Audiovisual\\Vídeo\\Íntegra\\HTC_HV020.wmv", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "VC-1", "audio_channels": "Stereo", "audio_codec": "WMA", "duration_ms": 7067459.0, "duration": 7067.46}, "HTC_HV020": {"Tele_HV20 (1).MP4": {"size_mb": 421.4907, "modified": "2016-02-05 12:41:56", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV020_Maria do Carmo Pantoja da Silva\\Audiovisual\\Vídeo\\Íntegra\\HTC_HV020\\Tele_HV20 (1).MP4", "category": "Video", "dimension": "3840x2160", "aspect_ratio": "16:9 (HD)", "frame_rate": "59.940 fps", "codec": "AVC", "audio_channels": ojeto Minha História, Sua História, Nossa História\nDepoimento de Maria do Carmo Pantoja da Silva\nEntrevistada por Marcia Trezza e Teresa Farias\nManaus, 30/04/2018\nRealização Museu da Pessoa\nHTC _ HV20_ Maria do Carmo Pantoja da Silva\nTranscrito por Mariana Wolff\nRevisado e editado por Paulo Rodrigues Ferreira\nP/1 – Maria, a gente vai começar a conversa. Diga para nós o seu nome completo, a cidade e o estado em que você nasceu, e a data.\nR – O meu nome é Maria do Carmo Pantoja da Silva, nasci na cidade de Parintins, estado do Amazonas.\nP/1 – Em que dia?\nR – Dia 16 de julho de 1989.\nP/1 – Qual o nome dos seus pais?\nR – O nome do meu pai é Paulo Reis de Oliveira e o nome da minha mãe é Maria da Saúde Pantoja da Silva.\nP/1 – Eles também sempre foram de Parintins?\nR – Sim, sempre moraram no estado do Amazonas. \nP/1 – E o seu pai trabalhava com o quê? Ou trabalha com o quê?\nR – O meu pai, ele era pescador… Era não, porque ele ainda está vivo, não é? Ele trabalha com pesca.\nP/1 – Sempre foi pescador?\nR – Sempre foi pescador. \nP/1 – E a sua mãe?\nR – A minha mãe era dona de casa. E é até hoje.\nP/1 – Você, quando era criança, costumava, de vez em quando ou muitas vezes, ir pescar com o seu"}, "HTC_HV20_Maria do Carmo Pantoja da Silva_edi.docx": {"size_mb": 0.0096, "modified": "2019-08-21 13:50:38", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV020_Maria do Carmo Pantoja da Silva\\Textual\\HTC_HV20_Maria do Carmo Pantoja da Silva_edi.docx", "category": "Textual", "content_preview": "Nome da história\nNA ZAGA E NA EDUCAÇÃO, A FORÇA DA TORCIDA, O ORGULHO DA VITÓRIA\nMinibio\nMaria do Carmo Pantoja da Silva nasceu em Parintins, estado do Amazonas, em 16 de julho de 1989. Filha de pescador, uma de suas diversões quando criança era a pesca - tambaqui, pirarucu… Já o futebol a acompanha até hoje, casada e mãe de cinco filhos. Tem até torcida da família. Como teve quando concluiu o ensino médio pelo Projeto Igarité. Agora pensa fazer faculdade, quer se qualificar na área da Educação. Mas suas lembranças mais marcantes são das dificuldades e dos desafios que enfrentou para estudar. Sempre. Desde pequena, quando atravessava o rio a pé, morrendo de medo dos jacarés, para ir para a escola. Até os tempos igualmente difíceis de estudar com o filho nos braços. Mas valeu a pena porque o Projeto lhe trouxe perspectivas e a oportunidade de trabalhar na Educação. Educação infantil. Deseja retribuir tudo o que o saber lhe proporcionou. \nSinopse\nEla nasceu onde corre o rio Epacucu, município de Parintins, estado do Amazonas, no dia 16 de julho de 1989. Lá na comunidade onde morava - Itaboraí do Meio - dava muito peixe e era lá que costumava pescar com os irmãos. Era tambaqui e pirar"}, "folder_size_gb": 0.0}, "folder_size_gb": 133.244}, "HTC_HV021_Euro Alves": {"Audiovisual": {"Vídeo": {"Edições": {"HTC_HV021.mp4": {"size_mb": 314.2838, "modified": "2018-11-11 14:06:34", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV021_Euro Alves\\Audiovisual\\Vídeo\\Edições\\HTC_HV021.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 259092.0, "duration": 259.09}, "folder_size_gb": 0.307}, "Íntegra": {"HTC_HV021.wmv": {"size_mb": 9206.7514, "modified": "2018-09-01 11:11:18", "extension": "WMV", "full_path": "D:\\HD_Telecurso\\HTC_HV021_Euro Alves\\Audiovisual\\Vídeo\\Íntegra\\HTC_HV021.wmv", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "VC-1", "audio_channels": "Stereo", "audio_codec": "WMA", "duration_ms": 9546903.0, "duration": 9546.9}, "HTC_HV021": {"TeleHV21 (1).MP4": {"size_mb": 38706.7217, "modified": "2016-02-05 15:48:50", "extension": "MP4", "full_path": "D:\\HD_Telecurso\\HTC_HV021_Euro Alves\\Audiovisual\\Vídeo\\Íntegra\\HTC_HV021\\TeleHV21 (1).MP4", "category": "Video", "dimension": "3840x2160", "aspect_rati i… A história da minha infância foi uma história muito triste, muito… Entendeu? E até hoje, por coincidência, eu não gosto de comemorar a data do meu aniversário e ninguém lembra, sabe? Ultimamente, nem da minha família lá, as pessoas com quem eu trabalho - porque eu sou gestor da escola agora - nem meus colegas professores, ninguém lembrou. Mas d"}, "HTC_HV21_Euro Alves_edi.docx": {"size_mb": 0.0102, "modified": "2019-08-21 13:50:48", "extension": "DOCX", "full_path": "D:\\HD_Telecurso\\HTC_HV021_Euro Alves\\Textual\\HTC_HV21_Euro Alves_edi.docx", "category": "Textual", "content_preview": "Nome da história\nAS FLECHADAS CERTEIRAS DO CURUMIM SAPECA NO MUNDO DA EDUCAÇÃO\nMinibio\nEuro Alves nasceu no município de Maués, comunidade de São José do Rio Marau, no Amazonas, aos 10 de abril de 1977. É da etnia Sateré-Mawé. As dificuldades por que passou na vida começaram mesmo no seu nascimento, uma história triste, de incompreensão e rejeição por parte de seu avô que, no entanto, acabou por criá-lo, prover, cuidar. Foi a primeira história de abandono. A segunda, aos seis meses, foi quando sua mãe, para exercer o magistério na missão católica, o entregou aos avós. Sempre teve uma outra história, igualmente comovente: a de resistência, perseverança, luta quase sobre- humana para estudar, ser alguém na educação e preservação da cultura de seu povo. Hoje, é gestor de escola, e desde sempre professor. Professor indígena, professor presencial de sala de aula com mediação por tecnologia - Projeto Igarité, do Telecurso. Uma história muito rica, de muitos combates, muitas vitórias, superação e méritos individuais.\nSinopse\nLá pelas bandas de São José do Rio Marau, município de Maués, no interior do Amazonas, nasceu Euro Alves, da etnia Sateré-Mawé, em 10 de abril de 1977. Desde o nascim"}, "folder_size_gb": 0.0}, "folder_size_gb": 179.252}, "folder_size_gb": 2224.967}};

const EXTENSIONS = {
    "Video": ['mp4', 'mov', 'mkv', 'avi', 'm4v', 'mts', 'm2ts', 'wmv', 'flv', 'webm', 'vob', 'ogv', '3gp', 'mxf'],
    "Audio": ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'aiff', 'pcm', 'aif'],
    "Image": ['jpg', 'jpeg', 'tif', 'tiff', 'png', 'gif', 'bmp', 'webp', 'cr2', 'nef', 'arw', 'dng'],
    "Textual": ['doc', 'docx', 'pdf', 'txt', 'rtf', 'odt', 'xls', 'xlsx', 'ppt', 'pptx']
};

const ICONS = { "Video": "🎞️", "Audio": "🎧", "Image": "🖼️", "Textual": "📝", "Other": "📄" };

function formatSmartSize(mbValue) {
    if (!mbValue || mbValue === 0) return "0 B";
    let bytes = mbValue * 1024 * 1024; 
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(2) + " " + units[i];
}

function getIcon(name, isFolder) {
    if (isFolder) return "📁";
    const ext = name.split('.').pop().toLowerCase();
    for (const [category, list] of Object.entries(EXTENSIONS)) {
        if (list.includes(ext)) return ICONS[category];
    }
    return ICONS["Other"];
}

function formatTime(ms) {
    if (!ms || ms === 0) return "N/A";
    let totalSeconds = Math.floor(ms / 1000);
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;
    return [hours, minutes, seconds].map(v => v < 10 ? "0" + v : v).join(":");
}

function tryLoadImage(imgElement, thumbnailPath, originalName) {
    if (!thumbnailPath && !originalName) return;
    let path = thumbnailPath || `thumbnails/thumb_${originalName.split('.').slice(0, -1).join('.')}.jpg`;
    imgElement.onerror = function() {
        this.onerror = null;
        this.src = 'https://via.placeholder.com/150?text=Sem+Preview';
    };
    imgElement.src = path;
}

function copyPreviewText() {
    const box = document.getElementById('preview-text');
    if (box) {
        navigator.clipboard.writeText(box.textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy Content"; }, 2000);
    }
}

function calculateFolderStats(node) {
    let stats = { Video: { count: 0, size: 0 }, Audio: { count: 0, size: 0 }, Image: { count: 0, size: 0 }, Textual: { count: 0, size: 0 }, Other: { count: 0, size: 0 }, totalSize: 0 };
    function traverse(curr) {
        for (let key in curr) {
            if (key === "folder_size_gb") continue;
            let item = curr[key];
            if (item.folder_size_gb !== undefined) traverse(item);
            else {
                let cat = item.category || "Other";
                if (!stats[cat]) cat = "Other";
                stats[cat].count++;
                stats[cat].size += item.size_mb || 0;
                stats.totalSize += item.size_mb || 0;
            }
        }
    }
    traverse(node);
    return stats;
}

function showMetadata(name, data, path) {
    const panel = document.getElementById("metadata-panel");
    const content = document.getElementById("meta-content");
    panel.style.display = "block";

    const isFolder = data.folder_size_gb !== undefined;
    let html = `
        <span class="meta-label">Nome</span><span class="meta-value">${name}</span>
        <span class="meta-label">Caminho</span><span class="meta-value">${data.full_path || path.join("/")}</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(data.full_path || "").replace(/\\/g, "\\\\")}')">Copy Path</button>
        <span class="meta-label">Tamanho</span><span class="meta-value" style="color:var(--accent); font-weight:bold;">${formatSmartSize(isFolder ? data.folder_size_gb * 1024 : data.size_mb)}</span>
    `;

    if (isFolder) {
        const stats = calculateFolderStats(data);
        const getPct = (size) => stats.totalSize > 0 ? ((size / stats.totalSize) * 100).toFixed(1) : 0;
        html += `
            <div class="stats-container">
                <span class="meta-label">Conteúdo</span>
                <div class="stats-bar">
                    <div class="bar-segment" style="width:${getPct(stats.Video.size)}%; background:var(--video)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Audio.size)}%; background:var(--audio)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Image.size)}%; background:var(--image)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Textual.size + stats.Other.size)}%; background:var(--other)"></div>
                </div>
                <div class="stat-row"><span>🎞️ Video</span><b>${stats.Video.count}</b></div>
                <div class="stat-row"><span>🎧 Audio</span><b>${stats.Audio.count}</b></div>
                <div class="stat-row"><span>🖼️ Images</span><b>${stats.Image.count}</b></div>
                <div class="stat-row"><span>📄 Docs / Other</span><b>${stats.Textual.count + stats.Other.count}</b></div>
            </div>`;
    } else {
        if (data.category === "Image" || data.thumbnail) {
            html += `<h3>Preview</h3>
                     <div class="img-preview-container">
                        <img id="preview-img" src="" alt="Carregando...">
                     </div>`;
            setTimeout(() => {
                const img = document.getElementById('preview-img');
                tryLoadImage(img, data.thumbnail, name);
            }, 50);
        }

        html += `<span class="meta-label">Modificado</span><span class="meta-value">${data.modified || "N/A"}</span>`;
        
        if (data.category === "Video") {
            // Garante que displayRes exista ou usa a dimensão original
            const displayRes = data.dimension || "N/A"; 
            
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Resolução</span><span class="meta-value">${displayRes}</span>
                <span class="meta-label">Duração / Áudio</span><span class="meta-value">${formatTime(data.duration_ms)} / ${data.audio_channels || "N/A"}</span>
                <span class="meta-label">Aspecto / FPS</span><span class="meta-value">${data.aspect_ratio || "N/A"} / ${data.frame_rate || "N/A"}</span>`;
        } else if (data.category === "Audio") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Duração</span><span class="meta-value">${formatTime(data.duration_ms)}</span>
                <span class="meta-label">Canais</span><span class="meta-value">${data.audio_channels || "N/A"}</span>`;
        } else if (data.category === "Image") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Dimensões</span><span class="meta-value">${data.dimension || "N/A"}</span>
                <span class="meta-label">DPI</span><span class="meta-value">${data.dpi || "N/A"}</span>`;
        }

        // NOVIDADE: Verifica explicitamente por content_preview ou categoria textual
        if (data.content_preview) {
            html += `<h3>Conteúdo do Documento</h3>
                     <div class="preview-box" id="preview-text">Loading content...</div>
                     <button class="copy-btn" onclick="copyPreviewText()">Copiar Conteúdo</button>`;
        }
    }
    
    content.innerHTML = html;

    // Sincronização garantida: espera o DOM atualizar para injetar o texto
    if (data.content_preview) {
        setTimeout(() => {
            const box = document.getElementById('preview-text');
            if (box) box.textContent = data.content_preview;
        }, 10);
    }
}

function renderColumn(node, level, path = []) {
    const explorer = document.getElementById("explorer");
    while (explorer.children.length > level) explorer.removeChild(explorer.lastChild);
    const col = document.createElement("div"); col.className = "column";
    const keys = Object.keys(node).filter(k => k !== "folder_size_gb").sort((a, b) => {
        const aIsF = node[a].folder_size_gb !== undefined;
        const bIsF = node[b].folder_size_gb !== undefined;
        return (aIsF !== bIsF) ? bIsF - aIsF : a.localeCompare(b);
    });
    keys.forEach(name => {
        const val = node[name];
        const isFolder = val.folder_size_gb !== undefined;
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `<span class="icon">${getIcon(name, isFolder)}</span> <span class="item-text">${name}</span>`;
        item.onclick = () => {
            Array.from(col.children).forEach(c => c.classList.remove('active'));
            item.classList.add('active');
            showMetadata(name, val, path.concat(name));
            if (isFolder) renderColumn(val, level + 1, path.concat(name));
            else while (explorer.children.length > level + 1) explorer.removeChild(explorer.lastChild);
        };
        col.appendChild(item);
    });
    explorer.appendChild(col);
}

function performSearch() {
    const term = document.getElementById("search").value.toLowerCase();
    const explorer = document.getElementById("explorer");
    if (!term) { renderColumn(TREE, 0); return; }
    const results = [];
    function searchNode(node, currentPath) {
        for (const key in node) {
            if (key === "folder_size_gb") continue;
            const item = node[key];
            const isFolder = item.folder_size_gb !== undefined;
            const match = key.toLowerCase().includes(term) || (item.content_preview && item.content_preview.toLowerCase().includes(term));
            if (match) results.push({ name: key, data: item, path: currentPath.concat(key), isFolder });
            if (isFolder) searchNode(item, currentPath.concat(key));
        }
    }
    searchNode(TREE, ["Root"]);
    explorer.innerHTML = "";
    const col = document.createElement("div"); col.className = "column"; col.style.minWidth = "100%";
    results.slice(0, 100).forEach(res => {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<span class="icon">${getIcon(res.name, res.isFolder)}</span> <div><b>${res.name}</b><br><small>${res.path.join("/")}</small></div>`;
        div.onclick = () => showMetadata(res.name, res.data, res.path);
        col.appendChild(div);
    });
    explorer.appendChild(col);
}

document.addEventListener("DOMContentLoaded", () => renderColumn(TREE, 0));
