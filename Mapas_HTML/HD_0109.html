 "Image", "dimension": "2592x1728", "resolution": "2592x1728", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV617_MO002.jpg"}, "folder_size_gb": 0.003}, "folder_size_gb": 0.084}, "Textual": {"PCSH_HV617_Newton Diniz_edi.docx": {"size_mb": 0.0082, "modified": "2018-01-17 16:30:44", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV617_Newton Diniz\\Textual\\PCSH_HV617_Newton Diniz_edi.docx", "category": "Textual", "content_preview": "Nome da história\nExcelência em qualidade\nMinibio\nNewton Macedo Diniz nasceu em São Paulo, no dia 20 de maio de 1956. Filho de pai comerciário e mãe dedicada ao lar, Newton tentou seguir o conselho do pai - construir uma carreira na área bancária -, mas logo viu que deveria seguir suas aptidões: e foi estudar química. O primeiro trabalho na área é definitivo para sua trajetória, pois entrou e permanece na área farmacêutica. Hoje, é gerente geral da fábrica da Allergan, em Guarulhos.\nSinopse\nDe fala mansa e didática, Newton explica o porquê da escolha do seu nome: sem dúvida, pela admiração que o pai sentia pelo físico Isaac. E as andanças ao lado do pai fizeram com que Newton batesse o pé pela grafia correta do seu nome! Nada de Nilton, o correto é com e-w. Neste depoimento, Newton se engrandece conforme os causos, desde a época em que o Rio Tietê servia como lazer, sua primeira vez andando de bicicleta, até a escolha pelo curso na graduação, que definiria sua trajetória profissional.\nTAGs\nfábrica\nbanco\nquímica\nnome\nbicicleta\ncomida\nalmoço\nsalário\ngerência\nGuarulhos\ncasamento\nEdição\nQuando criança, a gente tinha a ideia de querer ser algumas do tipo sapateiro e barbeiro porque eram"}, "PCSH_HV617_Newton Diniz_rev.docx": {"size_mb": 0.0253, "modified": "2018-01-18 15:49:06", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV617_Newton Diniz\\Textual\\PCSH_HV617_Newton Diniz_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História \nDepoimento de Newton Diniz\nEntrevistado por Luiz Egypto e Carolina Margiotte\nSão Paulo, 29 de agosto de 2017\nRealização: Museu da Pessoa \nPCSH_HV617_Newton Diniz\nTranscrito por Karina Medici Barrella\nRevisado e editado por Carolina Margiotte\n________________________________________________________________________\nP/1 – Boa tarde, Newton.\nR – Boa tarde. \nP/1 – É um prazer tê-lo aqui, muito obrigado por ter aceito o nosso convite. Eu gostaria que você começasse dizendo o seu nome completo, o local e a data do seu nascimento.\nR – Newton Macedo Diniz. Local de nascimento, São Paulo, no dia 20 de maio de 1956.\nP/1 – O nome dos seus pais, por favor.\nR – Gerônimo Macedo Diniz e Isa de Andrade Diniz.\nP/1 – O que faziam seus pais?\nR – Meu pai era comerciário e minha mãe era do lar.\nP/1 – Comércio trabalhava onde?\nR – Ele trabalhava numa indústria. Ele era caixa de uma empresa que fazia materiais plásticos para embalagem, então ele trabalhava nessa empresa, trabalhou durante mais de 20 anos, até ele falecer ele trabalhava nessa empresa.\nP/1 – Onde ficava essa empresa?\nR – Essa empresa, primeiramente ficava em São Paulo, no bairro da Ponte Pequena, e posteriorment"}, "folder_size_gb": 0.0}, "folder_size_gb": 4.858}, "AL_TM01": {"Audiovisual": {"Vídeo": {"Edição": {"AL_TM01.mp4": {"size_mb": 342.8879, "modified": "2018-01-22 16:50:30", "extension": "MP4", "full_path": "D:\\HD_Allergan\\AL_TM01\\Audiovisual\\Vídeo\\Edição\\AL_TM01.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 185819.0, "duration": 185.82}, "folder_size_gb": 0.335}, "Íntegra": {"AL_TM01.mp4": {"size_mb": 1483.4467, "modified": "2017-07-11 19:10:46", "extension": "MP4", "full_path": "D:\\HD_Allergan\\AL_TM01\\Audiovisual\\Vídeo\\Íntegra\\AL_TM01.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": category": "Image", "dimension": "2550x2531", "resolution": "2550x2531", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV629_FT16.jpg"}, "folder_size_gb": 0.132}, "folder_size_gb": 0.146}, "Making Of": {"PCSH_HV629_MO001.JPG": {"size_mb": 2.7614, "modified": "2017-11-12 14:47:42", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV629_Denize Ornelas\\Iconográfico\\Making Of\\PCSH_HV629_MO001.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV629_MO001.jpg"}, "PCSH_HV629_M002.JPG": {"size_mb": 2.9451, "modified": "2017-11-12 14:47:56", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV629_Denize Ornelas\\Iconográfico\\Making Of\\PCSH_HV629_M002.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV629_M002.jpg"}, "folder_size_gb": 0.006}, "folder_size_gb": 0.151}, "Textual": {"PCSH_HV629_Denize Ornelas_edi.docx": {"size_mb": 0.0099, "modified": "2017-12-15 06:19:54", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV629_Denize Ornelas\\Textual\\PCSH_HV629_Denize Ornelas_edi.docx", "category": "Textual", "content_preview": "Nome da história\nMédica de gente: entre o cuidado e a ciência\nMinibio\nDenize Ornelas nasceu em 12 de janeiro de 1981, em Duque de Caxias (RJ). Desde criança, adota uma postura de observadora do mundo. Reconhece as diferenças e busca encontrar o seu espaço nelas. Sempre incentivada pelos pais a estudar, o sonho de ser cientista logo se transforma em lembrança: assume que nasceu para ser médica. Hoje, além de formadora, é diretora da Sociedade Brasileira da Medicina de Família. Mulher, negra, médica e mãe, Denize é uma fortaleza.\nSinopse\nO que pode o mundo oferecer a uma jovem mulher, negra, amante da literatura e da ciência? Tudo. Nessa diversidade de opções, coube a Denize escolher aquela mais difícil: o cuidado. Com olhos de carinho e crítica, passa a conhecer o mundo a sua volta. Reconhece muitas diferenças, sim, mas também encontra muita oportunidade. Sempre incentivada pelos pais a estudar, Denize assumiu essa aposta para si. Na faculdade de medicina, logo no primeiro dia, a dúvida imperava. O que estava fazendo ali? Foi salva por uma greve, que deu, além de luta, tempo. Foi quando encontrou um livro (ou ele a encontrou?) e nele descobriu que a medicina também precisava ser rei"}, "PCSH_HV629_Denize Ornelas_rev.docx": {"size_mb": 0.0571, "modified": "2018-05-23 17:56:22", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV629_Denize Ornelas\\Textual\\PCSH_HV629_Denize Ornelas_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História \nDepoimento de Denise Ornelas\nEntrevistada por Carolina Margiotte \nSão Paulo, 06/11/2017\nRealização: Museu da Pessoa\nPCSH_HV629_Denize Ornelas\nTranscrito por Mariana Wolff\nRevisado por Carolina Margiotte\n__________________________________________________________________________\nP/1 – Doutora, boa tarde! Obrigada pela sua participação e pra começar, o seu nome completo.\nR – Eu sou Denize Ornelas Pereira Salvador de Oliveira.\nP/1 – Local e data de nascimento?\nR – Nasci dia 12 de janeiro de 81, na cidade de Duque de Caxias, Rio de Janeiro.\nP/1 – E a senhora sabe por quê que os seus pais escolheram esse nome?\nR – Sim, o nome da minha mãe é Denize, também. Na verdade, quem escolheu o meu nome foi o meu pai. Ele dizia que era porque ele era apaixonado pela minha me, então foi uma homenagem para ela.\nP/1 – E como que a sua mãe recebeu essa proposta? \nR – Parece que desde que eles eram namorados, existia essa… Ele dizia que ele ia botar o nome de Denize, botar o nome do meu irmão, se eu tivesse um irmão, o nome dele também. Eles até (corte no áudio) que eles compraram e tinha o meu nome e o nome da minha irmã, do meu irmão, antes de eu nascer. Mas minha mãe não"}, "folder_size_gb": 0.0}, "folder_size_gb": 9.818}, "PCSH_HV622_Matilde Spósito": {"Audiovisual": {"Áudio": {"PCSH_HV622_Matilde Spósito.mp3": {"size_mb": 196.6824, "modified": "2017-09-26 08:09:10", "extension": "MP3", "full_path": "D:\\HD_Allergan\\PCSH_HV622_Matilde Spósito\\Audiovisual\\Áudio\\PCSH_HV622_Matilde Spósito.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 12888624.0, "duration": 12888.62}, "folder_size_gb": 0.192}, "Vídeo": {"Edição": {"PCSH_HV622.mp4": {"size_mb": 390.7355, "modified": "2017-12-20 16:44:52", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV622_Matilde Spósito\\Audiovisual\\Vídeo\\Edição\\PCSH_HV622.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 210544.0, "duration": 210.54}, "folder_size_gb": 0.382}, "Íntegra": {"PCSH_HV622.mp4": {"size_mb": 12903.963, "modified": "2017-11-17 00:33:16", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV622_Matilde Spósito\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV622.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 12888576.0, "duration": 12888.58}, "folder_size_gb": 12.602}, "folder_size_gb": 12.983}, "folder_size_gb": 13.175}, "Iconográfico": {"Acervo": {"PCSH_HV622_FT01.docx": {"size_mb": 0.0214, "modified": "2017-12-26 16:56:04", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV622_Matilde Spósito\\Iconográfico\\Acervo\\PCSH_HV622_FT01.docx", "category": "Textual", "content_preview": "CADASTRO DE IMAGEM"}, "PCSH_HV622_FT02.docx": {"size_mb": 0.0212, "modified": "2017-12-26 17:05:50", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV622_Matilde Spósito\\Iconográfico\\Acervo\\PCSH_HV622_FT02.docx", "category": "Textual", "con , "folder_size_gb": 0.259}, "Textual": {"PCSH_HV622_Matilde Spósito_edi.docx": {"size_mb": 0.0107, "modified": "2018-02-21 05:30:12", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV622_Matilde Spósito\\Textual\\PCSH_HV622_Matilde Spósito_edi.docx", "category": "Textual", "content_preview": "Nome da história\nPronta para a batalha\nMinibio\nMatilde Sposito nasceu em 1º de fevereiro de 1956, em São Paulo. Logo cedo, aprendeu o peso da responsabilidade: assumiu a casa na ausência dos pais e deixava as brincadeiras no recreio de lado para não perder a chave. Determinada, confiante e muito dedicada, foi a primeira fisiatra no Brasil a fazer tratamentos com a promissora toxina botulínica.\nSinopse\nMaria Matilde herdou mais que os nomes das avós: da Maria, a paixão por gatos, enquanto da Matilde, a personalidade. Mais que uma boa contadora de história, Matilde é uma protagonista e tanto. O reencontro com a paixão, o sensacionalismo de TV que quase custou a sua CRM, seu vanguardismo diante do orgulho masculino na ciência. São muitos os temas que fazem de Matilde uma personagem e tanto. Mas, acima de tudo, estão nas entrelinhas os adjetivos que fazem dela essa personalidade única: talento, determinação, estudo. A história de Matilde é uma aula de vida.\nTAGs\namamentação\nmachismo\nmãe\nmaternidade\npiano\nfilha\nescola\nfreira\ncolégio de freira\ncarta\npensionato\nfeminismo\npaternidade\nfilme\ncinema\nfisiatria\nmédica\nmedicina\namor\nreencontro\npaixão\nvizinho\nEdição\nMe lembro de estar assistindo"}, "PCSH_HV622_Matilde Spósito_rev.docx": {"size_mb": 0.0643, "modified": "2018-02-21 05:02:32", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV622_Matilde Spósito\\Textual\\PCSH_HV622_Matilde Spósito_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História \nDepoimento de Matilde Sposito\nEntrevistado por Carolina Margiotte \nSão Paulo, 22/09/2017\nRealização Museu da Pessoa\nPCSH_HV622_Matilde Sposito\nTranscrito por Mariana Wolff\nRevisado por Carolina Margiotte\n_________________________________________________________________________\nP/1 – Doutora, primeiro, muito obrigada pela senhora ter vindo aqui com a gente, conversar. Pra começar, o nome completo, o local e a data de nascimento da senhora.\nR – Maria Matilde de Melo Sposito, eu nasci no dia primeiro de fevereiro de 1956, aqui em São Paulo.\nP/1 – Qual o nome dos seus pais?\nR – Dulce de Melo Sposito e Teophilo Sposito Sanguineta.\nP/1 –  Conta um pouquinho pra gente sobre eles, como eles são, o que eles fazem.\nR – Meus pais já são falecidos, os dois. A mamãe faleceu primeiro do que o meu pai e o papai faleceu há dois anos atrás. Mamãe faleceu muito precocemente, foi uma tragédia o falecimento dela, porque ela era uma mulher excepcional, uma mulher muito lúcida, ativa, enfim, realmente uma mulher excepcional. O falecimento dela foi precoce, foi um choque pra mim, principalmente, porque eu sou filha única. E é gozado que eu sempre me atritava muito com a minha"}, "folder_size_gb": 0.0}, "folder_size_gb": 13.434}, "PCSH_HV623_Cristiane Rubiniak": {"Audiovisual": {"Áudio": {"PCSH_HV623_Cristiane Rubiniak.mp3": {"size_mb": 65.6984, "modified": "2017-10-02 08:46:08", "extension": "MP3", "full_path": "D:\\HD_Allergan\\PCSH_HV623_Cristiane Rubiniak\\Audiovisual\\Áudio\\PCSH_HV623_Cristiane Rubiniak.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 4304952.0, "duration": 4304.95}, "folder_size_gb": 0.064}, "Vídeo": {"Edição": {"PCSH_HV623.mp4": {"size_mb": 317.6913, "modified": "2018-08-09 19:10:42", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV623_Cristiane Rubiniak\\Audiovisual\\Vídeo\\Edição\\PCSH_HV623.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 173173.0, "duration": 173.17}, "folder_size_gb": 0.31}, "Íntegra": {"PCSH_HV623 ": 26.9002, "modified": "2017-11-01 11:07:20", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV623_Cristiane Rubiniak\\Iconográfico\\Acervo\\Alta\\PCSH_HV623_FT06.tif", "category": "Image", "dimension": "2335x3060", "resolution": "2335x3060", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV623_FT06.jpg"}, "PCSH_HV623_FT07.tif": {"size_mb": 26.36, "modified": "2017-11-01 11:10:38", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV623_Cristiane Rubiniak\\Iconográfico\\Acervo\\Alta\\PCSH_HV623_FT07.tif", "category": "Image", "dimension": "2322x3047", "resolution": "2322x3047", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV623_FT07.jpg"}, "PCSH_HV623_FT08.tif": {"size_mb": 26.6465, "modified": "2017-11-01 11:12:28", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV623_Cristiane Rubiniak\\Iconográfico\\Acervo\\Alta\\PCSH_HV623_FT08.tif", "category": "Image", "dimension": "2348x3072", "resolution": "2348x3072", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV623_FT08.jpg"}, "PCSH_HV623_FT010.tif": {"size_mb": 4.3592, "modified": "2017-11-01 11:15:30", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV623_Cristiane Rubiniak\\Iconográfico\\Acervo\\Alta\\PCSH_HV623_FT010.tif", "category": "Image", "dimension": "1700x1092", "resolution": "1700x1092", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV623_FT010.jpg"}, "folder_size_gb": 0.151}, "folder_size_gb": 0.17}, "folder_size_gb": 0.17}, "Textual": {"PCSH_HV623_Cristiane Regina de Oliveira Rubiniak_edi.docx": {"size_mb": 0.0101, "modified": "2018-01-18 03:54:54", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV623_Cristiane Rubiniak\\Textual\\PCSH_HV623_Cristiane Regina de Oliveira Rubiniak_edi.docx", "category": "Textual", "content_preview": "Nome da história\nO mundo em mim\nMinibio\nCristiane Regina de Oliveira Rubiniak nasceu em São Paulo, capital, em 18 de agosto de 1977. Apesar da infância livre na rua, com amigos do bairro que se entregavam às brincadeiras tradicionais, a menina Cristiane sempre teve o desejo de trabalhar num ambiente corporativo. Seguindo o caminho do pai, estudou Administração e hoje é Diretora de Marketing Regional da América Latina e Canadá da Allergan.\nSinopse\nSinta o enredo: do lado materno, avô paulista e avó pernambucana; do lado paterno, avô polonês e avó boliviana. Enquanto o pai já assume ares paulista, a mãe traz o toque mineiro. É tanta riqueza cultural que nada mais justo que o fruto da terceira geração atue na área internacional. A casa da infância sempre cheia de gente, os amigos da rua, a dedicação dos pais e a espontaneidade ao falar com as pessoas: Cristiane nasceu para estar com gente. Sabida desde sempre do seu perfil para a Administração, ainda na faculdade se entrega à busca de estágios. Um desvio de caminho - um tanto necessário - na área bancária, a faz ter certeza de que não nascera para esse ambiente. Vai Cristiane, mais uma vez, pegar as listas telefônicas e se entregar ao"}, "PCSH_HV623_Cristiane Regina de Oliveira Rubiniak_rev.docx": {"size_mb": 0.034, "modified": "2018-01-18 03:16:28", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV623_Cristiane Rubiniak\\Textual\\PCSH_HV623_Cristiane Regina de Oliveira Rubiniak_rev.docx", "category": "Textual", "content_preview": "Projeto Conte Sua História\nDepoimento de Cristiane Regina de Oliveira Rubiniak\t\nEntrevistada por Luiz Egypto e Márcia Trezza\nSão Paulo, 25/09/2017\nPCSH_HV623_Cristiane Regina de Oliveira Rubiniak\nRealização: Museu da Pessoa\nTranscrito por Liliane Custódio\nRevisado e editado por Carolina Margiotte\n________________________________________________________________________\nP/1 – Boa tarde, Cristiane. Muito obrigado por ter aceitado o nosso convite, seja muito bem-vinda a essa conversa. Eu queria que você começasse dizendo o seu nome completo, o local e a data do seu nascimento.\nR – Cristiane Regina de Oliveira Rubiniak, nasci em São Paulo, no dia 18 de agosto de 1977.\nP/1 – Certo. O nome dos seus pais, por favor.\nR – Meu pai, Mário Alberto Evandro Rubiniak Osuna, minha mãe, Dalila Aurora de Oliveira Rubiniak.\nP/1 – O que faziam os seus pais?\nR – Meu pai é comerciante, ele tem um negócio próprio, autônomo, e ele trabalha com a parte de motores para protéticos.\nP/1 – Protéticos? Interessante.\nR – É. E ourives. Minha mãe sempre trabalhou também como autônoma. Na verdade, minha mãe foi muito mais tempo do lar, cuidando, porque nós somos quatro irmãos, e ajudando o meu pai também e costurand"}, "folder_size_gb": 0.0}, "folder_size_gb": 4.713}, "PCSH_HV624_José Carlos Truzzi": {"Audiovisual": {"Áudio": {"PCSH_HV624_José Carlos Truzzi.mp3": {"size_mb": 131.3939, "modified": "2017-10-18 05:56:32", "extension": "MP3", "full_path": "D:\\HD_Allergan\\PCSH_HV624_José Carlos Truzzi\\Audiovisual\\Áudio\\PCSH_HV624_José Carlos Truzzi.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 8610168.0, "duration": 8610.17}, "folder_size_gb": 0.128}, "Vídeo": {"Edição": {"PCSH_HV624.mp4": {"size_mb": 233.0146, "modified": "2017-12-20 16:49:02", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV624_José Carlos Truzzi\\Audiovisual\\Vídeo\\Edição\\PCSH_HV624.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 129363.0, "duration": 129.36}, "folder_size_gb": 0.228}, "Íntegra": {"PCSH_HV624.mp4": {"size_mb": 9060.3138, "modified": "2017-11-21 20:47:06", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV624_José Carlos Truzzi\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV624.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", _FT12.tif": {"size_mb": 1.2418, "modified": "2017-12-15 15:40:30", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV624_José Carlos Truzzi\\Iconográfico\\Acervo\\Alta\\PCSH_HV624_FT12.tif", "category": "Image", "dimension": "1034x613", "resolution": "1034x613", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV624_FT12.jpg"}, "folder_size_gb": 0.027}, "folder_size_gb": 0.036}, "Making Of": {"PCSH_HV624_MO001.JPG": {"size_mb": 2.9927, "modified": "2017-12-04 03:33:18", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV624_José Carlos Truzzi\\Iconográfico\\Making Of\\PCSH_HV624_MO001.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV624_MO001.jpg"}, "folder_size_gb": 0.003}, "folder_size_gb": 0.039}, "Textual": {"PCSH_HV624_José Carlos Truzzi_edi.docx": {"size_mb": 0.0091, "modified": "2017-11-29 05:55:54", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV624_José Carlos Truzzi\\Textual\\PCSH_HV624_José Carlos Truzzi_edi.docx", "category": "Textual", "content_preview": "Nome da história\nUm médico bom de prosa\nMinibio\nNascido em Garça, interior de São Paulo, reza a lenda uma das primeiras cidades do Estado de São Paulo a receber cinema, José Carlos Truzzi é filho de João e Izabel. Quando jovem, usufruía dos direitos de ser filho do gerente da sala e entrava à vontade sem pagar, driblando, inclusive, a censura para adentrar às sessões impróprias para sua idade. As visitas ao sítio dos avós maternos também eram seu destino, onde ocupava a agenda com os trabalhos que a roça traz, como recolher os ovos das galinhas. Sai de Garça para cursar medicina em São Paulo, na Universidade Federal de São Paulo (Unifesp), onde descobre sua vocação: cirurgia e urologia.\nSinopse\nA atual Garça (SP) continua sendo a da sua infância: uma cidade tranquila, com um grande lago e que traz uma bucólica sensação de vizinhança. Apenas os cem quilômetros para Tupã, a cidade vizinha, diminuiu. Quando criança, a viagem até lá parecia ser mais longa! Os raros passeios a São Paulo, inclusive de passagem a caminho da praia com mais passageiro que um fusca suporta, já era um aviso que a cidade seria sua casa. Medicina sempre foi sua vontade e foi seguindo o conselho de um amigo mais"}, "PCSH_HV624_José Carlos Truzzi_rev.docx": {"size_mb": 0.0489, "modified": "2017-11-27 11:02:54", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV624_José Carlos Truzzi\\Textual\\PCSH_HV624_José Carlos Truzzi_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História \nDepoimento de José Carlos Truzzi\nEntrevistado por Carolina Margiotte e Otávio Nazaré \nSão Paulo, 16/10/2017\nRealização Museu da Pessoa\nPCSH_HV624_José Carlos Truzzi\nTranscrito por Mariana Wolff\n__________________________________________________________________________\nP/1 – Muito bem Doutor, então para continuar a nossa conversa, pode dizer o seu nome completo, o local e a data de nascimento.\nR – José Carlos Cezar Ibanhez Truzzi. Eu nasci em Garça, quatro de julho de 1967. Garça fica no Estado de São Paulo.\nP/1 – E me conta o nome dos seus pais.\nR – Meu pai, João Truzzi, já é falecido e minha chama Isabel Ibanhez Truzzi, mora em Garça, ainda.\nP/1 – Fala um pouco sobre eles.\nR – Meu pais, os dois do interior de São Paul. O meu pai tem ascendência italiana. Meu bisavô veio para o Brasil no final do século 19. Isso o meu bisavô, né? Então o meu avô já nasceu no Brasil, acabaram se instalando no interior de São Paulo. Minha mãe de ascendência espanhola. Meus avós vieram para o Brasil no começo do século 20, 1914, mais ou menos, estava tendo guerras e, na época, os meus bisavós maternos decidiram-se mudar da Europa por causa desses conflitos que tinham lá na"}, "folder_size_gb": 0.0}, "folder_size_gb": 9.243}, "PCSH_HV625_Rosiane Mattar": {"Audiovisual": {"Áudio": {"PCSH_HV625_Rosiane Mattar.mp3": {"si -30 14:00:36", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV625_Rosiane Mattar\\Iconográfico\\Acervo\\Baixa\\PCSH_HV625_FT11.jpg", "category": "Image", "dimension": "456x581", "resolution": "456x581", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV625_FT11.jpg"}, "PCSH_HV625_FT12.jpg": {"size_mb": 0.0556, "modified": "2017-10-30 14:03:40", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV625_Rosiane Mattar\\Iconográfico\\Acervo\\Baixa\\PCSH_HV625_FT12.jpg", "category": "Image", "dimension": "576x292", "resolution": "576x292", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV625_FT12.jpg"}, "folder_size_gb": 0.001}, "folder_size_gb": 0.006}, "Making Of": {"PCSH_HV625_MO002.JPG": {"size_mb": 2.7093, "modified": "2017-10-24 04:56:16", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV625_Rosiane Mattar\\Iconográfico\\Making Of\\PCSH_HV625_MO002.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV625_MO002.jpg"}, "PCSH_HV625_MO001.JPG": {"size_mb": 2.8129, "modified": "2017-10-24 04:56:26", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV625_Rosiane Mattar\\Iconográfico\\Making Of\\PCSH_HV625_MO001.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV625_MO001.jpg"}, "folder_size_gb": 0.005}, "folder_size_gb": 0.011}, "Textual": {"PCSH_HV625_Rosiane Mattar_edi.docx": {"size_mb": 0.0096, "modified": "2017-11-14 09:37:00", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV625_Rosiane Mattar\\Textual\\PCSH_HV625_Rosiane Mattar_edi.docx", "category": "Textual", "content_preview": "Nome da história\nLegado: a médica da família\nMinibio\nRosiane Mattar nasceu em São Paulo (SP) em 01 de maio de 1953. Sob influência das idas e vindas do pai, médico, para atender as famílias na então rural Cambará (PR), onde passou a infância, se forma em medicina. Com passagem na residência em Cirurgia Plástica, trilhou sua carreira em Ginecologia e Obstetrícia. É professora titular do Departamento de Obstetrícia da Unifesp e cumpre o legado do pai: ser a médica da família.\nSinopse\nEmbora a família seja formada por muitos médicos - pai, tio, irmão e primos -, coube a Rosiane cumprir o legado do pai: cuidar da família. Ainda que desestimulada pelos homens (descendentes de libaneses, do lado paterno), a determinada menina Rosiane se formou em medicina. A vontade, logo no início, era ser uma neurocirurgiã, inspirada num personagem literário. Mas, na prática, descobriu que “pouco se consertava” na tal especialidade. Na obstetrícia e ginecologia, encontrou a beleza e incerteza do parto. Numa breve passagem pela cirurgia plástica, passou a compreender a estética e a lidar com as mãos, o que mais tarde passou a influenciar na sua volta à obstetrícia. Apaixonada pelos sobrinhos, a tia Rosi"}, "PCSH_HV625_Rosiane Mattar_rev.docx": {"size_mb": 0.0288, "modified": "2017-11-29 05:05:08", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV625_Rosiane Mattar\\Textual\\PCSH_HV625_Rosiane Mattar_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História \nDepoimento de Rosiane Mattar\nEntrevistada por Carolina Margiotte\nSão Paulo, 17/10/2017 \nRealização: Museu da Pessoa \nPCSH_HV625_Rosiane Mattar\nTranscrito por Karina Medici Barrella\nRevisado por Carolina Margiotte Grohmann\n_________________________________________________________________________\nP/1 – Doutora, bom dia.\nR – Bom dia.\nP/1 – Pra começar, o seu nome completo, local e a data de nascimento.\nR – Rosiane Mattar. São Paulo, 01 de maio de 53 (risos).\nP/1 – Qual o nome dos pais da senhora?\nR – É Rames Mattar e Divanir Cardoso Mattar.\nP/1 – Conta pra gente um pouco sobre eles, como eles são, o que eles fazem.\nR – Meu pai já é falecido e ele era médico. Na época que ele se formou, ele se formou no Rio de Janeiro, e foi logo para o interior, então ele foi um médico de interior. Ele fazia tudo: operava, fazia clínica, fazia pediatria. E nós moramos numa cidadezinha do Paraná que chama Cambará até mais ou menos eu ter sete anos e depois nós viemos, uns dois anos depois ele largou, saiu de Cambará e veio pra São Paulo. E aqui ele continuou sendo médico, mas já trabalhando mais em associações, algo assim. A minha mãe é brasileira, nasceu em Ilhabela, era c"}, "folder_size_gb": 0.0}, "folder_size_gb": 5.114}, "PCSH_HV626_Paulo Matsudo": {"Audiovisual": {"Áudio": {"PCSH_HV626_Paulo Matsudo.mp3": {"size_mb": 71.2428, "modified": "2017-10-27 12:23:20", "extension": "MP3", "full_path": "D:\\HD_Allergan\\PCSH_HV626_Paulo Matsudo\\Audiovisual\\Áudio\\PCSH_HV626_Paulo Matsudo.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 4668360.0, "duration": 4668.36}, "folder_size_gb": 0.07}, "Vídeo": {"Edição": {"PCSH__HV626.mp4": {"size_mb": 279.1364, "modified": "2017-12-20 16:59:30", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV626_Paulo Matsudo\\Audiovisual\\Vídeo\\Edição\\PCSH__HV626.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 153186.0, "duration": 153.19}, "folder_size_gb": 0.273}, "Íntegra": {"PCSH_HV626.mp4": {"size_mb": 5707.1961, "modified": "2017-11-08 20:29:08", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV626_Paulo Matsudo\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV626.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4644206.0, "duration": 4644.21}, "folder_size_gb": 5.573}, "folder_size_gb": 5.846}, "folder_size_gb": 5.916}, "Iconográfico": {"Acervo": PCSH_HV626_FT05 B.jpg"}, "PCSH_HV626_FT05.tif": {"size_mb": 10.6305, "modified": "2017-10-30 14:09:44", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV626_Paulo Matsudo\\Iconográfico\\Acervo\\Alta\\PCSH_HV626_FT05.tif", "category": "Image", "dimension": "2512x1750", "resolution": "2512x1750", "color_mode": "RGBA", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV626_FT05.jpg"}, "folder_size_gb": 0.049}, "folder_size_gb": 0.055}, "Making Of": {"PCSH_HV626_M003.JPG": {"size_mb": 2.2219, "modified": "2017-10-24 04:59:14", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV626_Paulo Matsudo\\Iconográfico\\Making Of\\PCSH_HV626_M003.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV626_M003.jpg"}, "PCSH_HV626_M001.JPG": {"size_mb": 2.2392, "modified": "2017-10-24 04:59:22", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV626_Paulo Matsudo\\Iconográfico\\Making Of\\PCSH_HV626_M001.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV626_M001.jpg"}, "PCSH_HV626_M002.JPG": {"size_mb": 2.2189, "modified": "2017-10-24 04:59:30", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV626_Paulo Matsudo\\Iconográfico\\Making Of\\PCSH_HV626_M002.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV626_M002.jpg"}, "folder_size_gb": 0.007}, "folder_size_gb": 0.061}, "Textual": {"PCSH_HV626_Paulo Keiki Matsudo_edi.docx": {"size_mb": 0.0088, "modified": "2017-11-01 12:33:38", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV626_Paulo Matsudo\\Textual\\PCSH_HV626_Paulo Keiki Matsudo_edi.docx", "category": "Textual", "content_preview": "Nome da história\nAcima de tudo, humilde dentro da grandeza\nMinibio\nPaulo Keiki Rodrigues Matsudo nasceu em São Paulo, em 12 de abril de 1951. Filho de pai japonês imigrante e mãe brasileira, cresceu na mistura das duas culturas: atento a arte ikebana e também da cerâmica. O contato logo cedo com os animais e a natureza no sítio da avó foi a inspiração para seguir carreira médica. Na cirurgia plástica, é pioneiro no Brasil no estudo do uso da toxina botulínica para fins estéticos. Sua atuação é reconhecida pelo Colégio Brasileiro de Cirurgiões com o Prêmio Ivo Pitanguy.\nSinopse\nA chegada da família do pai ao Brasil foi marcada por alívio e tristeza: se em parte deu-se por encerrado o trajeto em alto mar, a terra firme marcaria o começo de uma nova trajetória sem a mãe, que faleceu assim que chegou no país. Pela tradição japonesa, o filho mais velho deveria sustentar a família, cabendo ao primogênito Keisez Matsudo se acostumar ao novo clima e a nova língua para dar um futuro aos irmãos. Missão dada e cumprida. Com garra, não só formou os irmãos como também os sustentou. Mais tarde, o casamento com uma brasileira gerou dois filhos: Vitor e Paulo, que mais tarde seriam médicos. Paulo"}, "PCSH_HV626_Paulo Keiki Matsudo_rev.docx": {"size_mb": 0.0339, "modified": "2017-11-29 04:52:08", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV626_Paulo Matsudo\\Textual\\PCSH_HV626_Paulo Keiki Matsudo_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História\nDepoimento de Paulo Keiki Matsudo\nEntrevistado por Carolina Margiotte \nSão Paulo, 17/10/2017\nRealização: Museu da Pessoa\nPCSH_HV626_Paulo Keiki Matsudo \nTranscrito por Mariana Wolff\nRevisado por Carolina Margiotte\n______________________________________________________________________________________________________\nP/1 – Doutor, boa tarde.\nR – Boa tarde.\nP/1 – Obrigada por estar aqui com a gente. E pra começar, o seu nome completo, local e data de nascimento.\nR – Paulo Keiki Rodrigues Matsudo, São Paulo, 12 de abril de 1951.\nP/1 – Qual o nome dos seus pais?\nR – Keisez Matsudo e Albertina Rodrigues Matsudo.\nP/1 – O Keiki tem algum significado? É Keiki que se pronuncia?\nR – Keiki. Tem um significado. O meu pai chama-se Keizen, era japonês e essa introdução do Kei foi dada à família dele que era uma família respeitada, essa designação foi dada pelo Imperador do Japão e deve ser utilizada em todos os nomes masculinos que nascessem na família. Então, o meu pai é Keizen, eu tenho um tio Keiko, Keiran, e pode também usar nas mulheres. No caso, eu segui uma tradição, eu tenho uma filha que também é a Pâmela Kei Matsudo.\nP/1 – Sim. Então conta um pouco pra gente"}, "folder_size_gb": 0.0}, "folder_size_gb": 5.977}, "PCSH_HV627_Ligia Kogos": {"Audiovisual": {"Áudio": {"PCSH_HV627_Ligia Kogos.mp3": {"size_mb": 103.6503, "modified": "2017-10-27 12:23:12", "extension": "MP3", "full_path": "D:\\HD_Allergan\\PCSH_HV627_Ligia Kogos\\Audiovisual\\Áudio\\PCSH_HV627_Ligia Kogos.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 6791088.0, "duration": 6791.09}, "folder_size_gb": 0.101}, "Vídeo": {"Edição": {"PCSH_HV627.mp4": {"size_mb": 168.5971, "modified": "2017-12-20 17:02:08", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV627_Ligia Kogos\\Audiovisual\\Vídeo\\Edição\\PCSH_HV627.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 96138.0, "duration": 96.14}, "folder_size_gb": 0.165}, "Íntegra": {"PCSH_HV627.mp4": {"size_mb": 7258.3149, "modified": "2017-11-21 23:11:24", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV627_Ligia Kogos\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV627.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6791034.0, "duration": 6791.03}, "folder_size_gb": 7 ", "category": "Image", "dimension": "845x1032", "resolution": "845x1032", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV627_FT009.jpg"}, "PCSH_HV627_FT010.jpeg": {"size_mb": 0.2042, "modified": "2017-12-28 17:40:32", "extension": "JPEG", "full_path": "D:\\HD_Allergan\\PCSH_HV627_Ligia Kogos\\Iconográfico\\Acervo\\Baixa\\PCSH_HV627_FT010.jpeg", "category": "Image", "dimension": "1160x960", "resolution": "1160x960", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV627_FT010.jpg"}, "folder_size_gb": 0.001}, "folder_size_gb": 0.002}, "Making Of": {"PCSH_HV627_M002.JPG": {"size_mb": 2.6784, "modified": "2017-10-24 05:01:24", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV627_Ligia Kogos\\Iconográfico\\Making Of\\PCSH_HV627_M002.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV627_M002.jpg"}, "PCSH_HV627_M001.JPG": {"size_mb": 2.7875, "modified": "2017-10-24 05:01:32", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV627_Ligia Kogos\\Iconográfico\\Making Of\\PCSH_HV627_M001.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV627_M001.jpg"}, "folder_size_gb": 0.005}, "folder_size_gb": 0.007}, "Textual": {"PCSH_HV627_Ligia Kogos_edi.docx": {"size_mb": 0.0105, "modified": "2017-11-14 09:48:44", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV627_Ligia Kogos\\Textual\\PCSH_HV627_Ligia Kogos_edi.docx", "category": "Textual", "content_preview": "Nome da história\nUm tipo inesquecível\nDe rainha do peixe a papisa da dermatologia\nMinibio\nLigia Kogos nasceu em São Paulo e não revela sua data de nascimento: prefere deixar o dia enevoado, se esquivando dos cumprimentos. O mistério transborda também em sua vida pessoal. Afinal, que mulher não deve ter o mistério como seu aliado de beleza? A vontade de ser atriz logo foi vencida pelo determinismo da mãe em formar a filha médica. E assim foi, mais tarde também realizando o sonho projetado pelo esposo em se especializar em dermatologia. De vontades terceirizadas, Ligia Kogos é hoje um nome referência na dermatologia mundial, conhecedora de técnicas e produtos que fazem dela uma artista. Talvez aí mais um mistério de Ligia, mulher capaz de realizar os sonhos dos outros, além dos seus. Ligia é uma verdadeira artista da pele.\nSinopse\nA lista de pacientes de Ligia Kogos é um livro de história: Rainha da Suécia, Carla Sarkozy, Michel Temer, Dória, Mauricio de Souza. São muitos os artistas e políticos que projetam na doutora a realização da beleza exterior. Mal sabem que sua história na dermatologia começou numa revista: admirada pela beleza de uma obstetra segurando um recém-nascido, mome"}, "PCSH_HV627_Ligia Kogos_rev.docx": {"size_mb": 0.0407, "modified": "2017-11-08 10:28:52", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV627_Ligia Kogos\\Textual\\PCSH_HV627_Ligia Kogos_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História \nDepoimento de Ligia Kogos\nEntrevistada por Carolina Margiotte \nSão Paulo, 23/10/2017\nPCSH_HV627_Ligia Kogos\nRealização: Museu da Pessoa\nTranscrito por Mariana Wolff\nRevisada por Carolina Margiotte\n______________________________________________\nP/1 – Doutora, boa tarde. Obrigada pela sua participação e pra começar, o nome completo, o local e a data de nascimento.\nR – Ligia Kogos. Data de nascimento não é importante. Você sabe que data de nascimento é uma coisa que começou a ser comemorada pela burguesia, aristocracia? Na Inglaterra não comemorava (risos).\nP/1 – E por que a senhora não se importa com isso?\nR – Eu não gosto muito de, por exemplo, cumprimentos no dia do aniversario, então eu prefiro deixar tudo enevoado, inclusive dia, mês.\nP/1 – Então tá, doutora. Então, local de nascimento da senhora.\nR – São Paulo.\nP/1 – E qual o nome dos pais da senhora?\nR – Dirce Hugenneyer e Álvaro Hugenneyer.\nP/1 – A senhora sabe por quê que eles deram o nome da senhora de Ligia?\nR – Sei! Por causa do romance Quo Vadis, também filmado em Hollywood com a Deborah Kerr. E era uma história sobre aquela saga em Roma, aquelas super produções, onde os cristãos eram presos e"}, "folder_size_gb": 0.0}, "folder_size_gb": 7.361}, "PCSH_HV628_Maristela Soubihe": {"Audiovisual": {"Áudio": {"PCSH_HV628_Maristela Soubihe.mp3": {"size_mb": 114.0589, "modified": "2017-10-30 05:08:14", "extension": "MP3", "full_path": "D:\\HD_Allergan\\PCSH_HV628_Maristela Soubihe\\Audiovisual\\Áudio\\PCSH_HV628_Maristela Soubihe.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 7474104.0, "duration": 7474.1}, "folder_size_gb": 0.111}, "Vídeo": {"Edição": {"PCSH_HV628.mp4": {"size_mb": 280.8016, "modified": "2018-01-04 12:47:20", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV628_Maristela Soubihe\\Audiovisual\\Vídeo\\Edição\\PCSH_HV628.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 153945.0, "duration": 153.94}, "folder_size_gb": 0.274}, "Íntegra": {"PCSH_HV628.mp4": {"size_mb": 7602.0596, "modified": "2017-11-22 01:45:24", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV628_Maristela Soubihe\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV628.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 7414407.0, "duration": 7414.41}, "folder_size_gb": 7.424}, "folder_size_gb": 7.698}, "folder_size_gb": 7.809}, "Iconográfico": {"Acervo": {"PCSH_HV628_FT01.docx": {"size_mb": 0.0212, "modified": "2017-10-28 13:18:32", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV6 "modified": "2017-12-15 06:00:58", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV628_Maristela Soubihe\\Textual\\PCSH_HV628_Maristela Soubihe_edi.docx", "category": "Textual", "content_preview": "Nome da história\nBaixinha, mas pretensiosa\nVocação: lado humano\nMinibio\nMaristela Soubihe nasceu em 17 de abril de 1971 em Assis, São Paulo. Aprendeu o nome daquilo que seria quando crescesse quando a mãe, assustada, a encontrou, ainda criança, lavando a dentadura do avô. Ali, ela diz, se fez mais do que médica: nascia uma geriatra. Doutora Maristela é uma médica geriatra que, pós-plantão, se dedica a quatro celulares de emergência e também ao seu xodó, o Joaquim.\nSinopse\nA história de Maristela é uma homenagem a vida. Afinal, o que mais se pode esperar de uma criança que por livre e espontânea vontade se dedica ao cuidado intensivo dos avós, um deles acamado? O que explica uma criança limpar a dentadura e ser a última companhia nas noites dos membros mais velhos da família? Hoje, Maristela entende o sentimento que a movia: amor. Mais que inocência e empatia, aquilo era amor. Maristela é uma mulher decidida, feliz e orgulhosa da vida que tem. Uma médica que tem medo de sangue e agulha só com muita força e convicção do seu dom enfrentaria os anos de graduação e residência para alcançar a plenitude de sua carreira: o cuidado ao próximo.\nTAGs\nmedicina\nmédica\nlibanês\nfaculdade\nvestibul"}, "PCSH_HV628_Maristela Soubihe_rev.docx": {"size_mb": 0.0441, "modified": "2017-12-15 06:00:44", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV628_Maristela Soubihe\\Textual\\PCSH_HV628_Maristela Soubihe_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História \nDepoimento de Maristela Soubihe\nEntrevistada por Carolina Margiotte\nSão Paulo, 28/10/2017 \nRealização: Museu da Pessoa \nPCSH_HV628_Maristela Soubihe\nTranscrito por Karina Medici Barrella\nRevisado por Carolina Margiotte\n_________________________________________________________________________\nP/1 – Maristela, bom dia.\nR – Bom dia.\nP/1 – Obrigada pela sua participação. E pra começar o seu nome completo, o local e a data de nascimento.\nR – É Maristela Soubihe. Eu nasci em Assis, São Paulo, em 17 de abril de 71.\nP/1 – E você sabe por que seus pais te batizaram de Maristela?\nR – A minha mãe tinha obrigação de fugir das propostas de nomes do meu pai porque ele queria colocar nomes que ela não gostava. Então se ela fosse ouvir a interferência de todos os avós e o meu pai, ela não ia ser feliz. Na época, se não me engano, Maristela era filha do Juscelino Kubitschek, alguma coisa assim, agora eu preciso até me lembrar, acho que é alguma coisa assim. E foi por aí, ela rapidamente sacou do bolso um nome que não fosse nem árabe (risos) e nem austríaco, como meu avô por parte dela queria também.\nP/1 – Você sabe quais eram as opções?\nR – O meu pai é árabe e ele queri"}, "folder_size_gb": 0.0}, "folder_size_gb": 7.933}, "PCSH_HV632_Luiz Meyer": {"Audiovisual": {"Áudio": {"PCSH_HV632_Luiz Meyer.mp3": {"size_mb": 123.7417, "modified": "2017-11-14 07:45:44", "extension": "MP3", "full_path": "D:\\HD_Allergan\\PCSH_HV632_Luiz Meyer\\Audiovisual\\Áudio\\PCSH_HV632_Luiz Meyer.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 8108760.0, "duration": 8108.76}, "folder_size_gb": 0.121}, "Vídeo": {"Edição": {"PCSH_HV632.mp4": {"size_mb": 304.8503, "modified": "2017-12-20 17:13:38", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV632_Luiz Meyer\\Audiovisual\\Vídeo\\Edição\\PCSH_HV632.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 166233.0, "duration": 166.23}, "folder_size_gb": 0.298}, "Íntegra": {"PCSH_HV632.mp4": {"size_mb": 8031.3006, "modified": "2017-12-06 21:07:22", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV632_Luiz Meyer\\Audi path": "D:\\HD_Allergan\\PCSH_HV632_Luiz Meyer\\Iconográfico\\Acervo\\Alta\\PCSH_HV632_FT12.tif", "category": "Image", "dimension": "1439x1939", "resolution": "1439x1939", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV632_FT12.jpg"}, "PCSH_HV632_FT13.tif": {"size_mb": 1.4283, "modified": "2017-12-01 15:09:04", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV632_Luiz Meyer\\Iconográfico\\Acervo\\Alta\\PCSH_HV632_FT13.tif", "category": "Image", "dimension": "644x894", "resolution": "644x894", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV632_FT13.jpg"}, "PCSH_HV632_FT14.tif": {"size_mb": 4.8776, "modified": "2017-12-01 15:11:42", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV632_Luiz Meyer\\Iconográfico\\Acervo\\Alta\\PCSH_HV632_FT14.tif", "category": "Image", "dimension": "1152x1611", "resolution": "1152x1611", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV632_FT14.jpg"}, "folder_size_gb": 0.105}, "folder_size_gb": 0.117}, "Making Of": {"PCSH_HV632_MO001.JPG": {"size_mb": 3.4263, "modified": "2017-12-04 03:33:50", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV632_Luiz Meyer\\Iconográfico\\Making Of\\PCSH_HV632_MO001.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV632_MO001.jpg"}, "folder_size_gb": 0.003}, "folder_size_gb": 0.12}, "Textual": {"PCSH_HV632_Luiz Meyer_edi.docx": {"size_mb": 0.0088, "modified": "2017-12-04 07:40:56", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV632_Luiz Meyer\\Textual\\PCSH_HV632_Luiz Meyer_edi.docx", "category": "Textual", "content_preview": "Nome da história\nDramas da vida real: um encontro com o doutor Luiz\nMinibio\nLuiz Meyer nasceu em São Paulo, em 10 de junho de 1938. Filho de pais poloneses, tem a imigração deles como o ponto referencial para a formação de sua visão de mundo. Embora indeciso, na adolescência, Luiz já mostrava sua inclinação pela literatura e pelo cinema. Ainda assim, optou pela medicina, onde, mais tarde, encontrou seu lugar ao Sol: a psiquiatria.\nSinopse\nEmbora o Brasil fosse um paraíso àqueles que migravam em busca de uma nova história, não havia lugar onde a cabeça pudesse repousar diante da incerteza dos afetos que deixavam no país de origem. No caso de Luiz, sua mãe se fazia aflita pela família que tinha ficado na Polônia antissemita, vindo ao Brasil por conta do então namorado, que do país tropical já fazia sua morada. Deste enredo, pontua-se o início da história de Luiz, uma criança atenta ao mundo e que mais tarde se tornaria um apaixonado pelo cinema. Mais que um cidadão brasileiro, Luiz é um cidadão do mundo, pois não há um local onde não tenha deixado uma boa história. De Sartre e Simone de Beauvoir a Fernando Henrique Cardoso, neste depoimento, Luiz passa por personalidades que só contr"}, "PCSH_HV632_Luiz Meyer_rev.docx": {"size_mb": 0.0491, "modified": "2018-03-13 08:42:34", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV632_Luiz Meyer\\Textual\\PCSH_HV632_Luiz Meyer_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História \nDepoimento de Luiz Meyer\nEntrevistada por Marcia Trezzi e Otávio Nazareth\nSão Paulo, 10/11/2017\nRealização: Museu da Pessoa\nPCSH_HV632_Luiz Meyer\nTranscrito por Mariana Wolff\n__________________________________________________________________________\nP/1 – Doutor Luiz, nós vamos começar a entrevista, você pode, por favor, falar o seu nome completo, a cidade que você nasceu e a data?\nR – O meu nome completo é Luiz Meyer, eu nasci em São Paulo, em 10 de junho de 38, 1938.\nP/1 – Qual o nome dos seus pais?\nR – É Adela Meyer e Salmen Meyer.\nP/1 – Qual a origem deles, Luiz?\nR – Eles são poloneses. São poloneses que migraram pro Brasil devido a condições muito difíceis lá da Polônia. Essa origem de filho de imigrantes me marcou bastante, foi bastante importante na orientação da minha biografia e no meu modo de ver o mundo também. Eles viviam numa cidade, se dizer que era uma aldeia é um pouco exagerado, mas era uma cidade pequena em que a maioria da população era judaica. Então havia um forte componente judaico. E a Polônia é um país tradicionalmente antissemita, né, com uma perseguição acentuada em vários campos. Então, o meu pai, por exemplo, não conseguia es"}, "folder_size_gb": 0.0}, "folder_size_gb": 8.382}, "PCSH_HV631_Eduardo Grohmann": {"Audiovisual": {"Áudio": {"PCSH_HV631_Eduardo Grohmann.mp3": {"size_mb": 156.8775, "modified": "2017-11-14 07:40:40", "extension": "MP3", "full_path": "D:\\HD_Allergan\\PCSH_HV631_Eduardo Grohmann\\Audiovisual\\Áudio\\PCSH_HV631_Eduardo Grohmann.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 10280472.0, "duration": 10280.47}, "folder_size_gb": 0.153}, "Vídeo": {"Edição": {"PCSH_HV631.mp4": {"size_mb": 371.4204, "modified": "2017-12-21 15:40:14", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV631_Eduardo Grohmann\\Audiovisual\\Vídeo\\Edição\\PCSH_HV631.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 200667.0, "duration": 200.67}, "folder_size_gb": 0.363}, "Íntegra": {"PCSH_HV631.mp4": {"size_mb": 10181.6705, "modified": "2017-12-07 01:16:48", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV631_Eduardo Grohmann\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV631.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 10280403.0, "duration": 10280.4}, "folder_size_gb": 9.943}, "folder_size_gb": 10.306}, "folder_size_gb": 10.459}, "Iconográfico": {"Acervo": {"PCSH_HV631_FT01.docx": {"size_mb": 0.021, "modified V631_FT19.tif", "category": "Image", "dimension": "1754x1146", "resolution": "1754x1146", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV631_FT19.jpg"}, "PCSH_HV631_FT20.tif": {"size_mb": 7.2923, "modified": "2017-12-15 17:59:06", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV631_Eduardo Grohmann\\Iconográfico\\Acervo\\Alta\\PCSH_HV631_FT20.tif", "category": "Image", "dimension": "1981x1460", "resolution": "1981x1460", "color_mode": "RGBA", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV631_FT20.jpg"}, "folder_size_gb": 0.167}, "folder_size_gb": 0.186}, "Making Of": {"PCSH_HV631_MO001.JPG": {"size_mb": 2.1654, "modified": "2017-11-12 14:49:18", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV631_Eduardo Grohmann\\Iconográfico\\Making Of\\PCSH_HV631_MO001.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV631_MO001.jpg"}, "PCSH_HV631_MO002.JPG": {"size_mb": 2.2906, "modified": "2017-11-12 14:48:46", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV631_Eduardo Grohmann\\Iconográfico\\Making Of\\PCSH_HV631_MO002.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV631_MO002.jpg"}, "folder_size_gb": 0.004}, "folder_size_gb": 0.19}, "Textual": {"PCSH_HV631_Eduardo José Percico Grohmann_edi.docx": {"size_mb": 0.0092, "modified": "2017-12-26 10:23:18", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV631_Eduardo Grohmann\\Textual\\PCSH_HV631_Eduardo José Percico Grohmann_edi.docx", "category": "Textual", "content_preview": "Nome da história\nAs peripécias do Doutor Xaxá\nMinibio\nEduardo Grohmann nasceu em 30 de novembro de 1968, em São Paulo, capital. A casa da infância era cheia: é o ponto final de uma série de seis filhos homens de um casal de professores. Foi acompanhando a saída dos irmãos de casa, que iam casando e esvaziando as beliches e dando espaço para o jovem Eduardo ter uma certa exclusividade na companhia do pai. Da mãe, guarda a lembrança das comidas preparadas em um abundante quantidade para dar conta da fome dos filhos e das namoradas que chegavam. Incentivado principalmente pelo pai, trocou a carreira de Processamento de Dados para seguir o seu sonho de ser médico. É pediatra com especialidade em UTI, casado com a Priscilla e pai de dois filhos, o Gustavo e o Murilo.\nSinopse\nApostar no sonho é um caminho arriscado. Imagine você já formado em uma área de exatas com um dilema: aceitar a proposta de um emprego promissor ou começar do zero e fazer a matrícula num curso de biológicas? Aos 20 anos, Eduardo teve que responder essa questão e pensou: “Se vou viver até os 80, mais ou menos, tenho ainda 60 anos de vida ativa. Quero ser feliz ou infeliz?” - e então foi fácil, disse não para a propo"}, "PCSH_HV631_Eduardo José Percico Grohmann_rev.docx": {"size_mb": 0.0584, "modified": "2017-12-26 10:14:04", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV631_Eduardo Grohmann\\Textual\\PCSH_HV631_Eduardo José Percico Grohmann_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História\nDepoimento de Eduardo José Percico Grohmann\nEntrevistada por Carolina Margiotte Grohmann\nSão Paulo, 09/11/2017\nRealização: Museu da Pessoa\nPCSH_HV631_Eduardo José Percico Grohmann\nTranscrito por Mariana Wolff\n______________________________________________________________________\nP/1 – Edu, boa noite.\nR – Boa noite.\nP/1 – Obrigada por estar aqui com a gente.\nR – Obrigado você pelo convite.\nP/1 – E pra começar, o seu nome completo.\nR – Eduardo José Percico Grohmann.\nP/1 – Local e data de nascimento?\nR – Trinta de novembro de 68, São Paulo, capital.\nP/1 – Você é de São Paulo?\nR – Eu nasci em São Paulo. Único dos irmãos.\nP/1 – Eu tô chocada porque eu não sabia disso.\nR – Na Maternidade São Paulo, que já não existe mais.\nP/1 – Nossa! Então, como isso? O quê que aconteceu aí, porque a família não é de São Paulo.\nR – Meu pai é de São Paulo. Minha mãe veio pra cá porque o meu tio era ginecologista e vamos combinar que sexto filho, né, já fez cirurgia para não ter cirurgia, então ele fez (risos). Então, ela veio só para o parto, né, pra cesárea, única cesárea, e aí depois voltamos pra casa.\nP/1 – Foi o diferente da família, né?\nR – Foi o diferente. O restante foi"}, "folder_size_gb": 0.0}, "folder_size_gb": 10.649}, "PCSH_HV634_João Amaury Francês Brito": {"Audiovisual": {"Áudio": {"PCSH_HV634_João Amaury Francês Brito.mp3": {"size_mb": 94.3698, "modified": "2017-11-14 07:50:08", "extension": "MP3", "full_path": "D:\\HD_Allergan\\PCSH_HV634_João Amaury Francês Brito\\Audiovisual\\Áudio\\PCSH_HV634_João Amaury Francês Brito.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 6183840.0, "duration": 6183.84}, "folder_size_gb": 0.092}, "Vídeo": {"Edição": {"PCSH_HV634.mp4": {"size_mb": 398.3365, "modified": "2017-12-20 17:20:12", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV634_João Amaury Francês Brito\\Audiovisual\\Vídeo\\Edição\\PCSH_HV634.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 214214.0, "duration": 214.21}, "folder_size_gb": 0.389}, "Íntegra": {"PCSH_HV634.mp4": {"size_mb": 6124.7534, "modified": "2017-12-01 20:10:42", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV634_João Amaury Francês Brito\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV634.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6183778.0, "duration": 6183.78}, "folder_size_gb": 5.981}, "folder_size_gb": 6.37}, "folder_size_gb": 6.462} l": "thumbnails/HD_0109/thumb_PCSH_HV634_FT03.jpg"}, "PCSH_HV634_FT03b.jpg": {"size_mb": 0.1701, "modified": "2017-12-28 18:07:52", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV634_João Amaury Francês Brito\\Iconográfico\\Acervo\\Baixa\\PCSH_HV634_FT03b.jpg", "category": "Image", "dimension": "1200x1600", "resolution": "1200x1600", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV634_FT03b.jpg"}, "PCSH_HV634_FT04.jpg": {"size_mb": 0.112, "modified": "2017-12-28 18:07:16", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV634_João Amaury Francês Brito\\Iconográfico\\Acervo\\Baixa\\PCSH_HV634_FT04.jpg", "category": "Image", "dimension": "1280x720", "resolution": "1280x720", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV634_FT04.jpg"}, "PCSH_HV634_FT05.jpg": {"size_mb": 1.732, "modified": "2017-12-28 18:06:22", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV634_João Amaury Francês Brito\\Iconográfico\\Acervo\\Baixa\\PCSH_HV634_FT05.jpg", "category": "Image", "dimension": "4032x3024", "resolution": "4032x3024", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV634_FT05.jpg"}, "PCSH_HV634_FT07.jpg": {"size_mb": 0.1627, "modified": "2017-12-28 18:08:10", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV634_João Amaury Francês Brito\\Iconográfico\\Acervo\\Baixa\\PCSH_HV634_FT07.jpg", "category": "Image", "dimension": "747x1328", "resolution": "747x1328", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV634_FT07.jpg"}, "PCSH_HV634_FT09.jpg": {"size_mb": 0.148, "modified": "2017-12-28 18:08:48", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV634_João Amaury Francês Brito\\Iconográfico\\Acervo\\Baixa\\PCSH_HV634_FT09.jpg", "category": "Image", "dimension": "960x1280", "resolution": "960x1280", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV634_FT09.jpg"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.003}, "Making Of": {"PCSH_HV634_MO001.JPG": {"size_mb": 2.535, "modified": "2017-11-12 14:50:06", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV634_João Amaury Francês Brito\\Iconográfico\\Making Of\\PCSH_HV634_MO001.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV634_MO001.jpg"}, "PCSH_HV634_MO002.JPG": {"size_mb": 2.6401, "modified": "2017-11-12 14:49:54", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV634_João Amaury Francês Brito\\Iconográfico\\Making Of\\PCSH_HV634_MO002.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV634_MO002.jpg"}, "folder_size_gb": 0.005}, "folder_size_gb": 0.008}, "Textual": {"PCSH_HV634_ João Amaury Francês Brito_edi.docx": {"size_mb": 0.0089, "modified": "2017-12-08 05:40:04", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV634_João Amaury Francês Brito\\Textual\\PCSH_HV634_ João Amaury Francês Brito_edi.docx", "category": "Textual", "content_preview": "Nome da história\nMédico de osso e alma\nMinibio\nJoão Amaury Francês Brito nasceu numa terça-feira de carnaval, dia 06 de fevereiro de 1972, em Belém do Pará. Sua formação seria completamente diferente se, na infância, não tivesse os avós por perto. Muito carinhoso e com olhar atento, hoje avalia ter tido, em sua formação, forte influência deles. Mas, claro, por trás de todo bom homem, uma mulher maravilha se destaca: e, no caso de João, ela só poderia ser sua mãe. Além de professor da Universidade Federal do Pará, João é mestre em ortopedia e traumatologia, adepto ao jiu-jitsu e pai de duas meninas.\nSinopse\nÉ certo que são muitas as pessoas que participaram do crescimento de João. Até virar doutor, os avós, pais, irmãos e amigos foram seus grandea influenciadores. Mas seria um erro dizer que eles não continuam sendo. Conversar com João é entender o papel de cada um em sua vida. Falar sobre seus influenciadores é uma oração em agradecimento a eles. São muitas as histórias em que João dá um passo para trás e diz que o eu, na verdade, é nós. Essa coletividade só traz ternura para sua história, que se inicia em Belém, vai para São Paulo e faz uma pausa tão importante nos Estados Unidos."}, "PCSH_HV634_ João Amaury Francês Brito_rev.docx": {"size_mb": 0.0372, "modified": "2017-12-08 05:14:54", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV634_João Amaury Francês Brito\\Textual\\PCSH_HV634_ João Amaury Francês Brito_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História \nDepoimento de João Amaury Francês Brito\nEntrevistada por Carolina Margiotte \nSão Paulo, 23/10/2017\nRealização: Museu da Pessoa\nPCSH_HV634_ João Amaury Francês Brito\nTranscrito por Mariana Wolff\nRevisado por Carolina Margiotte\n__________________________________________________________________________\nP/1 – Doutor, boa tarde.\nR – Boa tarde.\nP/1 – Obrigada por estar aqui com a gente hoje.\nR – Eu que agradeço.\nP/1 – Tranquilo? \nR – Tranquilo.\nP/1 – Qualquer momento que o senhor precisar fazer uma pausa, a gente faz a pausa, tá?\nR – Perfeito.\nP/1 – Pra começar, seu nome completo.\nR – Bem, meu nome completo é João Amaury Francês Brito.\nP/1 – Local e data de nascimento?\nR – Eu nasci em Belém do Pará, no dia seis de fevereiro. Foi numa terça-feira de carnaval de 1972.\nP/1 – Exato assim, né? Os seus pais contam esse história de como foi o nascimento?\nR – Sim, sim, com certeza.\nP/1 – Conta pra gente como é que foi.\nR – O nascimento, segundo a minha mãe, foi numa terça-feira à noite, próximo das 11 horas da noite. A minha mãe começou a sentir a dor do parto, não tava previsto para ser dia seis, era para ser uma semana mais ou menos depois, mas eu vim. Então eu nas"}, "folder_size_gb": 0.0}, "folder_size_gb": 6.47}, "PCSH_HV636_Jairo Sobrinho": {"Audiovisual": {"Áudio": {"PCSH_HV636_Jairo Sobrinho.mp3": {"size_mb": 70.9081, "modified": "2017-11-23 04:21:56", "extension": "MP3", "full_path": "D:\\HD_Allergan\\PCSH_HV636_Jairo Sobrinho\\Audiovisual\\Áudio\\PCSH_HV636_Jairo Sobrinho.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 4646376.0, "duration": 4646.38}, "folder_size_gb": 0.069}, "Vídeo": {"Edição": {"PCSH_HV636.mp4": {"size_mb": 372.6827, "modified": "2018-01-03 14:15:24", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV636_Jairo Sobrinho\\Audiovisual\\Vídeo\\Edição\\PCSH_HV636.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 201201.0, "duration": 201.2}, "folder_size_gb": 0.364}, "Íntegra": {"PCSH_HV636.mp4": {"size_mb": 4743.3919, "modified": "2017-12-13 10:19:48", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV636_Jairo Sobrinho\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV636.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4646308.0, "duration": 4646.31}, "folder_size_gb": 4.632}, "folder_size_gb": 4.996}, "folder_size_gb": 5.065}, "Iconográfico": {"Making Of": {"PCSH_HV636_MO001.JPG": {"size_mb": 2.9, "modified": "2017-11-23 04:23:02", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV636_Jairo Sobrinho\\Iconográfico\\Making Of\\PCSH_HV636_MO001.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV636_MO001.jpg"}, "PCSH_HV636_MO002.JPG": {"size_mb": 2.7197, "modified": "2017-11-23 04:28:34", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV636_Jairo Sobrinho\\Iconográfico\\Making Of\\PCSH_HV636_MO002.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV636_MO002.jpg"}, "folder_size_gb": 0.005}, "folder_size_gb": 0.005}, "Textual": {"PCSH_HV636_Jairo Sobrinho_edi.docx": {"size_mb": 0.0088, "modified": "2017-12-15 07:07:46", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV636_Jairo Sobrinho\\Textual\\PCSH_HV636_Jairo Sobrinho_edi.docx", "category": "Textual", "content_preview": "Nome da história\nUm médico e tanto\nMinibio\nJairo José do Nascimento Sobrinho nasceu em 28 de julho de 1970 em São Gonçalo dos Campos (BA). Como visita nas casas das avós, Jairo aprendeu a observar: a vó renomada costureira de vestido de noiva torcendo para que suas netas não casassem; a vó que cozinhava as melhores cocadas e pasteis pra vender pra fora. Uma vida rodeada pelos mais velhos trouxe ao menino Jairo a importância do cuidado. A medicina vem para preencher o sonho de menino e da mãe nordestina - sendo hoje uma luz aos muitos pacientes que o esperam na sala do consultório oncológico.\nSinopse\nO dia do nascimento veio cheio de comemorações: era o aniversário da cidade, era a inauguração do hospital da cidade. Mas nascido de madrugada, o ponteiro já acusava o dia seguinte. Quiseram os oficiais juntar tudo num dia só. Assim, no papel, as comemorações são muitas: a primeira criança nascida no Hospital de São Gonçalo dos Campos, Bahia, no dia da sua inauguração, é Jairo Sobrinho. Seria o destino anunciando sua vida anos mais tarde? Tendo o médico como uma figura importante na famíla - qualquer problema, ia a mãe anunciando: “Chamem o médico!”, lá se foi Jairo, contrariando a vont"}, "PCSH_HV636_Jairo Sobrinho_rev.docx": {"size_mb": 0.0342, "modified": "2018-06-21 05:02:32", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV636_Jairo Sobrinho\\Textual\\PCSH_HV636_Jairo Sobrinho_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História \nDepoimento de Jairo Sobrinho\nEntrevistado por Carolina Margiotte \nSão Paulo, 22/11/2017\nRealização: Museu da Pessoa\nPCSH_HV636_Jairo Sobrinho\nTranscrito por Mariana Wolff\nRevisado por Carolina Margiotte\n__________________________________________________________________________\nP/1 – Doutor, boa tarde.\nR – Boa tarde.\nP/1 – Obrigada por estar aqui com a gente, por receber a gente na sua casa.\nR – De nada.\nP/1 – Pra começar, o seu nome completo.\nR – Jairo José do Nascimento Sobrinho.\nP/1 – Local e data de nascimento?\nR – Vinte e oito de julho de 1970, São Gonçalo dos Campos, Bahia, Recôncavo Baiano.\nP/1 – E o senhor sabe o porquê do seu nome? Por que escolheram te darem o nome de Jairo?\nR – Por conta do meu tio. Acho que a minha família tem mania de Barão, todo mundo bem pobre, mas o nome do meu irmão mais velho é o nome do pai, meu irmão do meio tem o nome dos avós, do avô paterno e materno, e eu tenho o nome do meu tio. E o nome do meu tio foi escolhido por acaso, primeiro filho da minha vó, ela tava grávida e resolveu abrir a Bíblia e escolheu o primeiro nome que lesse, viu Jairo e pôs o nome no meu tio, que é o irmão mais velho do meu pai. E assim, ach"}, "folder_size_gb": 0.0}, "folder_size_gb": 5.071}, "PCSH_HV615_João Gilberto Dereste": {"Audiovisual": {"Vídeo": {"Íntegra": {"PCSH_HV615.mp4": {"size_mb": 4577.5414, "modified": "2017-11-09 20:00:00", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV615_João Gilberto Dereste\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV615.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4621784.0, "duration": 4621.78}, "folder_size_gb": 4.47}, "Edição": {"PCSH_HV615.mp4": {"size_mb": 432.3293, "modified": "2018-08-07 19:40:10", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV615_João Gilberto Dereste\\Audiovisual\\Vídeo\\Edição\\PCSH_HV615.mp4", "category": "Video", "dim aking Of": {"PCSH_HV615_MO001.JPG": {"size_mb": 1.1417, "modified": "2017-09-01 11:12:02", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV615_João Gilberto Dereste\\Iconográfico\\Making Of\\PCSH_HV615_MO001.JPG", "category": "Image", "dimension": "2592x1728", "resolution": "2592x1728", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV615_MO001.jpg"}, "folder_size_gb": 0.001}, "folder_size_gb": 0.043}, "Textual": {"PCSH_HV615_João Gilberto Dereste_edi.docx": {"size_mb": 0.008, "modified": "2018-01-17 04:01:12", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV615_João Gilberto Dereste\\Textual\\PCSH_HV615_João Gilberto Dereste_edi.docx", "category": "Textual", "content_preview": "Nome da história\nUm camarada para todas as horas\nMinibio\nJoão Gilberto Dereste nasceu em 28 de março de 1963, em São Paulo. Filho de pai soldador e mãe costureira, passou a infância numa casa simples, farta de árvore frutífera. A predisposição para a área de ciência o fez trilhar uma carreira na área da indústria farmacêutica, sendo hoje supervisor de produção da Allergan.\nSinopse\nPensa num pai apaixonado pela família. Agora imagina a situação dele, no meio do trabalho, recebendo a ligação desesperada da esposa avisando que a filha estava morta? Não é pra qualquer um, não é pra qualquer coração. João Gilberto tem uma história de luta e superação sem igual. A filha caçula nascida com hemangioma, sofreu a demora do diagnóstico e tratamento. Os pais eram só entrega ao bem estar da filha. Por sorte, a ligação adiantou-se e a filha foi rapidamente atendida, seguindo, aí, um caminho de recuperação e cuidados específicos. João Gilberto narra esse episódio com tanto amor, com tanto orgulho da força da pequena criança, que é impossível não ficar com um nó na garganta. Por fim, descubra a história de um cara sensível, amigo para todas as horas; conheça o João Gilberto criança, se refugiando"}, "PCSH_HV615_João Gilberto Dereste_rev.docx": {"size_mb": 0.03, "modified": "2018-01-18 15:54:34", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV615_João Gilberto Dereste\\Textual\\PCSH_HV615_João Gilberto Dereste_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História \nDepoimento de João Gilberto Dereste\nEntrevistada por Luiz Egypto e Carolina Margiotte\nSão Paulo, 29/08/2017\nRealização: Museu da Pessoa \nPCSH_HV615_João Gilberto Dereste\nTranscrito por Karina Medici Barrella\nRevisado e editado por Carolina Margiotte\n_________________________________________________________________________\nP/1 – Bom dia, Gilberto. Muito obrigado por ter aceito o nosso convite. Eu gostaria que você começasse dizendo o seu nome completo, local e a data do seu nascimento.\nR – Meu nome é João Gilberto Dereste. Nasci no dia 28 de março de 1963.\nP/1 – O nome dos seus pais, por favor.\nR – Meu pai é Gilberto Dereste e minha mãe Maria Aparecida Gonçalves Dereste.\nP/1 – E o que eles faziam?\nR – Meu pai era soldador, ele trabalhava numa empresa que fazia solda em tanques, em equipamentos; a empresa chamava Caribê, era em Santa Isabel.\nP/1 – Sua mãe?\nR – Minha mãe é costureira, até hoje ela costura. Trabalha em casa, mas costura pra fora.\nP/1 – Você conheceu seus avós?\nR – Conheci.\nP/1 – Ambos os lados?\nR – Ambos os lados.\nP/1 – Como é que era o nome deles?\nR – Bom, da parte da minha mãe era Luísa e meu avô João. E da parte do meu pai também era Joã"}, "folder_size_gb": 0.0}, "folder_size_gb": 5.004}, "PCSH_HV621_Renata Orlandi": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV621.mp4": {"size_mb": 278.3554, "modified": "2018-08-08 09:42:50", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV621_Renata Orlandi\\Audiovisual\\Vídeo\\Edição\\PCSH_HV621.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 152552.0, "duration": 152.55}, "folder_siz
