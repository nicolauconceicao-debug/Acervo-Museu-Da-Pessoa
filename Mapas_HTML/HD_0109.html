 "full_path": "D:\\HD_Allergan\\PCSH_HV611_Renato Carvalho\\Iconográfico\\Acervo\\Alta\\PCSH_HV611_FT07.tif", "category": "Image", "dimension": "1780x1182", "resolution": "1780x1182", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV611_FT07.jpg"}, "PCSH_HV611_FT08A.tif": {"size_mb": 4.7884, "modified": "2017-08-23 13:15:02", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV611_Renato Carvalho\\Iconográfico\\Acervo\\Alta\\PCSH_HV611_FT08A.tif", "category": "Image", "dimension": "1764x1178", "resolution": "1764x1178", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV611_FT08A.jpg"}, "PCSH_HV611_FT08B.tif": {"size_mb": 4.7221, "modified": "2017-08-23 13:16:20", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV611_Renato Carvalho\\Iconográfico\\Acervo\\Alta\\PCSH_HV611_FT08B.tif", "category": "Image", "dimension": "1768x1174", "resolution": "1768x1174", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV611_FT08B.jpg"}, "PCSH_HV611_FT08C.tif": {"size_mb": 5.1007, "modified": "2017-08-23 13:28:26", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV611_Renato Carvalho\\Iconográfico\\Acervo\\Alta\\PCSH_HV611_FT08C.tif", "category": "Image", "dimension": "1195x1763", "resolution": "1195x1763", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV611_FT08C.jpg"}, "folder_size_gb": 0.091}, "folder_size_gb": 0.104}, "Making Of": {"PCSH_HV611_MO001.JPG": {"size_mb": 1.7337, "modified": "2017-08-28 06:40:34", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV611_Renato Carvalho\\Iconográfico\\Making Of\\PCSH_HV611_MO001.JPG", "category": "Image", "dimension": "2592x1728", "resolution": "2592x1728", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV611_MO001.jpg"}, "PCSH_HV611_MO002.JPG": {"size_mb": 1.4688, "modified": "2017-08-28 06:40:26", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV611_Renato Carvalho\\Iconográfico\\Making Of\\PCSH_HV611_MO002.JPG", "category": "Image", "dimension": "2592x1728", "resolution": "2592x1728", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV611_MO002.jpg"}, "folder_size_gb": 0.003}, "folder_size_gb": 0.107}, "Textual": {"PCSH_HV611_Renato da Silva Carvalho_edi.doc.docx": {"size_mb": 0.0087, "modified": "2018-01-18 04:37:10", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV611_Renato Carvalho\\Textual\\PCSH_HV611_Renato da Silva Carvalho_edi.doc.docx", "category": "Textual", "content_preview": "Nome da história\nUm cara pra confiar\nMinibio\nRenato da Silva Carvalho nasceu em 09 de julho de 1967 em São Paulo (SP). Filho de baianos migrantes para terra paulistas, é grato aos pais por todos os ensinamentos, sendo o principal o valor da bondade e da verdade. Renato é casado, tem quatro filhos e é apaixonado pela família que cultivou. É um dos funcionários mais antigos da Allergan, sendo reconhecido por todos pelo comprometimento.\nSinopse\nRenato é um cara apaixonado. Pela família, pela arte, pela escrita, pelo trabalho. Pela vida. É um sentimento tão forte que seus olhos são cúmplices e transbordam o amor que não cabe nele: logo se enchem d’água. Também, pudera! Sua história tem início com a ida dos pais da Bahia a São Paulo, em busca de trabalho. Na falta de mistura em casa, aprende a riqueza da presença diária do feijão com arroz. Na adolescência, sem precisar de um empurrão, percebe que já pode contribuir em casa. Sem titubear, pega sua caixa e vai engraxar sapato. Diz não para a faculdade que sonhara cursar e se entrega ao trabalho. Mas a vida há de ser justa e oferece uma oportunidade de emprego na Allergan, indústria farmacêutica. E lá Renato trilha um caminho de muita ver"}, "PCSH_HV611_Renato da Silva Carvalho_rev.doc.docx": {"size_mb": 0.033, "modified": "2018-01-18 16:03:24", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV611_Renato Carvalho\\Textual\\PCSH_HV611_Renato da Silva Carvalho_rev.doc.docx", "category": "Textual", "content_preview": "Projeto Conte Sua História\nDepoimento de Renato da Silva Carvalho\t\nEntrevistado por Carolina Margiotte e Luiz Egypto\nSão Paulo, 23/08/2017\nPCSH_HV611_Renato da Silva Carvalho\nRealização: Museu da Pessoa\nTranscrito por Liliane Custódio\nRevisado e editado por Carolina Margiotte\nP/1 – Renato, muito obrigada por você estar aqui com a gente. Pode ficar à vontade.\nR – Estou à vontade.\nP/1 – Então tá bom. Bom, pra começar, fala pra gente seu nome completo, o local e a data de nascimento.\nR – Renato da Silva Carvalho, data de nascimento, 09 de julho de 1967.\nP/1 – Fala um pouco dos seus pais: o nome deles, o que eles fazem?\nR – Meu pai é do lar também, não trabalha mais, é aposentado. Minha mãe é do lar. Os dois moram em São Bernardo do Campo, vivem juntos há mais de 50 anos. Meu pai tá com 86 anos, minha mãe tá com 81. Meu pai é superativo, anda pra tudo que é lugar, minha mãe sempre dentro de casa. E eles cuidaram dos meus irmãos e da minha família com um propósito assim: o que é o certo e o que é o errado. Falar de pai e mãe é sempre emocionante, porque se hoje eu estou aqui é porque eles me ensinaram. Porque antigamente uma palavra tinha mais valor do que um papel escrito. Então, quer"}, "folder_size_gb": 0.0}, "folder_size_gb": 9.139}, "PCSH_HV612_Antonio Nasser": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV612.mp4": {"size_mb": 226.2242, "modified": "2018-01-19 16:31:20", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV612_Antonio Nasser\\Audiovisual\\Vídeo\\Edição\\PCSH_HV612.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 125926.0, "duration": 125.93}, "folder_size_gb": 0.221}, "Íntegra": {"PCSH_HV612.mp4": {"size_mb": 10179.6754, "modified": "2017-08-29 16:20:08", "extension": "resolution": "2084x1484", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV612_FT04.jpg"}, "PCSH_HV612_FT05.tif": {"size_mb": 4.8317, "modified": "2017-08-23 16:23:28", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV612_Antonio Nasser\\Iconográfico\\Acervo\\Alta\\PCSH_HV612_FT05.tif", "category": "Image", "dimension": "1193x1775", "resolution": "1193x1775", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV612_FT05.jpg"}, "folder_size_gb": 0.021}, "folder_size_gb": 0.024}, "Making Of": {"PCSH_HV612_MO001.JPG": {"size_mb": 1.6768, "modified": "2017-08-28 06:40:40", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV612_Antonio Nasser\\Iconográfico\\Making Of\\PCSH_HV612_MO001.JPG", "category": "Image", "dimension": "2592x1728", "resolution": "2592x1728", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV612_MO001.jpg"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.025}, "Textual": {"PCSH_HV612_Antonio Nasser_edi.docx": {"size_mb": 0.0089, "modified": "2018-01-19 08:58:54", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV612_Antonio Nasser\\Textual\\PCSH_HV612_Antonio Nasser_edi.docx", "category": "Textual", "content_preview": "Nome da história\nCom a cabeça fria e o coração quente\nMinibio\nAntônio Sabre Nasser Filho nasceu em São Paulo, capital, em 07 de dezembro de 1969. A vontade de conhecer o mundo se materializou mais tarde com a compra de uma moto que, embora tenha causado olhares de reprovação dos pais, foi sua companheira em longas caminhadas. Atento às oportunidades da vida, por um destaque no jornal descobre a profissão de propagandista na área farmacêutica. Foi o primeiro passo para uma carreira e tanto. Hoje, é casado com a Noemi e tem dois filhos: o Miguel e a Heloísa; além disso, é gerente geral da Allergan Brasil.\nSinopse\nO cenário familiar era musical: Nasser e a irmã no piano, o pai no violino e a mãe no piano clássico e na harmônica. Benito di Paula é o elo principal para levá-lo de volta a esses encontros musicais da infância. Até os oito anos, o garoto vivia ao lado dos avós paternos, no Ipiranga, em São Paulo, quando a transferência de trabalho do pai obrigou a família a se mudar para Curitiba, onde Nasser viveu até sua pré-adolescência. Na volta a São Paulo, dá início a uma vida de gente grande: dedica-se ao técnico em eletroeletrônica, é convocado para o quartel, questiona-se sobre qu"}, "PCSH_HV612_Antonio Nasser_rev.doc.docx": {"size_mb": 0.0411, "modified": "2018-01-18 16:00:14", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV612_Antonio Nasser\\Textual\\PCSH_HV612_Antonio Nasser_rev.doc.docx", "category": "Textual", "content_preview": "Projeto Conte Sua História\nDepoimento de Antônio Nasser\t\nEntrevistada por Luiz Egypto e Carolina Margiotte\nSão Paulo, 23/08/2017\nRealização: Museu da Pessoa\nPCSH_HV612_ Antônio Nasser\nTranscrito por Liliane Custódio\nRevisado e editado por Carolina Margiotte\n_________________________________________________________________________\nP/1 – Boa tarde, Antônio. Muito obrigado por ter aceitado o nosso convite. Eu queria que por favor você começasse dizendo seu nome completo, o local e a data do seu nascimento.\nR – Perfeito. Antônio Sabre Nasser Filho, eu nasci em São Paulo, na capital de São Paulo, e data de nascimento, 07 de dezembro de 1969.\nP/1 – Certo. O nome dos seus pais, por favor.\nR – Antônio Sabre Nasser, meu pai, e minha mãe Yara Ariza de Lima Nasser.\nP/1 – E o que eles faziam? \nR – Quando eu nasci?\nP/1 – A atividade deles.\nR – O meu pai é formado em Direito, mas ele exerceu a carreira dele na área comercial e marketing. Minha mãe é professora de música, mas após o quarto filho, ela encerrou as suas atividades.\nP/1 – Você conheceu os seus avós?\nR – Conheci os quatro.\nP/1 – O nome deles, por favor.\nR – Miguel Sabre Nasser... Aliás, o nome dele originalmente, ele veio da Síria, Sa"}, "folder_size_gb": 0.0}, "folder_size_gb": 10.266}, "PCSH_HV613_Marcos Tadeu Lia": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV613.mp4": {"size_mb": 391.9776, "modified": "2018-08-07 19:27:02", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV613_Marcos Tadeu Lia\\Audiovisual\\Vídeo\\Edição\\PCSH_HV613.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 211211.0, "duration": 211.21}, "folder_size_gb": 0.383}, "Íntegra": {"PCSH_HV613.mp4": {"size_mb": 9476.563, "modified": "2017-08-30 17:18:22", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV613_Marcos Tadeu Lia\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV613.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4879208.0, "duration": 4879.21}, "folder_size_gb": 9.254}, "folder_size_gb": 9.637}, "Áudio": {"PCSH_HV613_Marcos Tadeu Lia.mp3": {"size_mb": 74.4682, "modified": "2017-08-31 05:33:10", "extension": "MP3", "full_path": "D:\\HD_Allergan\\PCSH_HV613_Marcos Tadeu Lia\\Audiovisual\\Áudio\\PCSH_HV613_Marcos Tadeu Lia.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 4879272.0, "duration": 4879.27}, "folder_size_gb": 0.073}, "folder_size_gb": 9.71}, "Iconográfico": {"Acervo": {"PCSH_HV613_DOC01.docx": {"size_mb": 0.0213, "modified": "2017-10-10 16:42:30", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV613_Marcos Tadeu Lia\\Iconográfico\\Acervo\\PCSH_HV613_DOC01.docx", "category": "Textual", "content_preview": "CADASTRO DE IMAGEM"}, "PCSH_HV613_FT01.docx": {"size_mb": 0.0212, "modified": "2017-08-28 18:08:30", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV613_Marcos Tadeu Lia\\Iconográfico\\Acervo\\PCSH_HV613_FT01.docx", "category": "Textual", "content_preview": "CADASTRO D  Tadeu Lia\\Iconográfico\\Making Of\\PCSH_HV613_MO002.JPG", "category": "Image", "dimension": "2592x1728", "resolution": "2592x1728", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV613_MO002.jpg"}, "folder_size_gb": 0.003}, "folder_size_gb": 0.083}, "Textual": {"PCSH_HV613_Marcos Tadeu Lia_ed.docx": {"size_mb": 0.0094, "modified": "2018-01-17 11:28:04", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV613_Marcos Tadeu Lia\\Textual\\PCSH_HV613_Marcos Tadeu Lia_ed.docx", "category": "Textual", "content_preview": "Nome da história\nUm vendedor bom de causo\nMinibio\nMarcos Tadeu Lia nasceu em 28 de outubro de 1963 no Rio de Janeiro (RJ). Aos oito anos, começa a ajudar o pai na montagem da barraca da feira no fim de semana: o trajeto era feito de ônibus, de madrugada, até o Ceasa, de onde partiam pegando carona com os mantimentos comprados, a caminho do local da feira. A vida era de muito trabalho, mas também de muito estudo: mesmo com a morte precoce do pai, Marcos não deixou de trabalhar para pagar o colégio. De olho nas oportunidades - e muito inteligente -, começa a se identificar com a área de vendas, observando os representantes que chegavam no escritório onde Marcos trabalhava como office-boy. É um dos funcionários mais antigos da Allergan e hoje é Representante Comercial da área de oftalmologia.\nSinopse\nAjudar o pai na feira foi um bom negócio: além de incentivar o tão menino a ser mais extrovertido, o ensinou a ter visão estratégica: por exemplo, o limão deveria ser vendido ao lado da banca de peixes, onde teria mais saída. Nem imagina Marcos Tadeu que seu pai estava ensinando o ofício que seria seu ganha-pão, anos depois: representante comercial. Foram muitos os aprendizados, mas os ma"}, "PCSH_HV613_Marcos Tadeu Lia_rev.doc.docx": {"size_mb": 0.041, "modified": "2018-01-18 15:58:14", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV613_Marcos Tadeu Lia\\Textual\\PCSH_HV613_Marcos Tadeu Lia_rev.doc.docx", "category": "Textual", "content_preview": "Projeto Conte Sua História - Allergan\nDepoimento de Marcos Tadeu Lia \nEntrevistado por Luiz Egypto e Carolina Margiotte\nSão Paulo, 28/08/2017 \nRealização: Museu da Pessoa\nPCSH_HV613_Marcos Tadeu Lia\nTranscrito por Melissa Lourenço Machado\nRevisado e editado por Carolina Margiotte\n_________________________________________________________________________________\nP/1 – Boa noite Marcos, muito obrigado por ter aceito o nosso convite e seja muito bem-vindo. Eu queria começar pedindo para que você dissesse o seu nome completo, o local e a data do seu nascimento.\nR – Boa noite. Meu nome é Marcos Tadeu Neves Lia, eu sou do Rio de Janeiro e nasci no dia 28 de outubro de 1963.\nP/1 – Certo. E o nome dos seus pais por favor…\nR – Meu pai chamava-se Rocco Lia, de origem italiana e minha mãe, Elza Neves Lia.\nP/1 – Qual era a atividade deles?\nR – Meu pai era feirante e minha mãe doméstica.\nP/1 – E seu pai tinha uma barraca da feira onde?\nR – Ele tinha barraca de feira de frutas em vários bairros do Rio de Janeiro entre Jacarepaguá, Meyer, Tijuca, Irajá, parece que Tijuca eram dois pontos…\nP/1 – Sei…\nR – Nesses locais…\nP/1 – Você costumava acompanhá-lo nessas…\nR – Sim. E meu irmão que é mais velho"}, "folder_size_gb": 0.0}, "folder_size_gb": 9.793}, "PCSH_HV614_Vladimir Chiari": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV614.mp4": {"size_mb": 361.643, "modified": "2018-08-07 19:33:32", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV614_Vladimir Chiari\\Audiovisual\\Vídeo\\Edição\\PCSH_HV614.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 195629.0, "duration": 195.63}, "folder_size_gb": 0.353}, "Íntegra": {"PCSH_HV614.mp4": {"size_mb": 4912.8639, "modified": "2017-11-09 18:09:12", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV614_Vladimir Chiari\\Audio 8x2976", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV614_FT01.jpg"}, "PCSH_HV614_FT02.tif": {"size_mb": 4.9254, "modified": "2017-08-29 10:10:32", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV614_Vladimir Chiari\\Iconográfico\\Acervo\\Alta\\PCSH_HV614_FT02.tif", "category": "Image", "dimension": "1183x1763", "resolution": "1183x1763", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV614_FT02.jpg"}, "PCSH_HV614_FT03A.tif": {"size_mb": 13.2177, "modified": "2017-08-29 17:01:26", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV614_Vladimir Chiari\\Iconográfico\\Acervo\\Alta\\PCSH_HV614_FT03A.tif", "category": "Image", "dimension": "2360x2909", "resolution": "2360x2909", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV614_FT03A.jpg"}, "PCSH_HV614_FT03b.tif": {"size_mb": 15.5439, "modified": "2017-08-29 17:03:28", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV614_Vladimir Chiari\\Iconográfico\\Acervo\\Alta\\PCSH_HV614_FT03b.tif", "category": "Image", "dimension": "2380x2892", "resolution": "2380x2892", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV614_FT03b.jpg"}, "folder_size_gb": 0.05}, "folder_size_gb": 0.06}, "Making Of": {"PCSH_HV614_MO001.JPG": {"size_mb": 1.5512, "modified": "2017-09-01 11:11:56", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV614_Vladimir Chiari\\Iconográfico\\Making Of\\PCSH_HV614_MO001.JPG", "category": "Image", "dimension": "2592x1728", "resolution": "2592x1728", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV614_MO001.jpg"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.062}, "Textual": {"PCSH_HV614_Vladimir Chiari_edi.docx": {"size_mb": 0.0086, "modified": "2018-01-18 04:47:28", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV614_Vladimir Chiari\\Textual\\PCSH_HV614_Vladimir Chiari_edi.docx", "category": "Textual", "content_preview": "Nome da história\nO raspo do tacho da cidade\nMinibio\nVladimir Chiari nasceu em 07 de junho de 1961 em Bauru. Aos três anos, acompanha mudança da família para São Paulo, sendo, portanto, a capital sua maior lembrança de infância. A experiência na área de recursos humanos começa aos 14 anos e se estende até hoje, sendo diretor da área na Allergan. Vladimir é casado, tem duas filhas e vive a experiência de ser avô.\nSinopse\nVladimir tem uma trajetória profissional absolutamente diversificada. O início forçado ao trabalho, após um acidente com o pai, o leva a conhecer a área de recursos humanos numa indústria de higiene e limpeza; mais tarde, a experiência na indústria alimentícia faz render boas histórias; por fim, encontra-se na indústria farmacêutica, onde, já com maturidade e espírito de líder, cria uma trajetória de muita sensibilidade. Se a parte profissional já acumula bons causos, imagine a pessoal: a incerteza do porquê da tia gostar do nome Vladimir - se nunca esteve na Rússia - ao agradecimento cristão pelo Aparecido, a enchente que levou a casa e fez com que o menino olhasse de cavalinho, no pescoço do irmão, a lama varrer a vida familiar… São muitos acontecimentos que fazem"}, "PCSH_HV614_Vladimir Chiari_rev.docx": {"size_mb": 0.0344, "modified": "2018-01-18 04:52:34", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV614_Vladimir Chiari\\Textual\\PCSH_HV614_Vladimir Chiari_rev.docx", "category": "Textual", "content_preview": "Projeto Conte Sua História\nDepoimento de Vladimir Chiari\t\nEntrevistado por Carolina Margiotte e Luiz Egypto\nSão Paulo, 29/08/2017\nProjeto PCSH_HV614_Vladimir Chiari\nRealização: Museu da Pessoa\nTranscrito por Liliane Custódio\nRevisado e editado por Carolina Margiotte Grohmann\n_______________________________________________________________________\nP/1 – Vladimir, obrigada pela sua participação, por estar aqui com a gente.\nR – Olá. Que isso.\nP/1 – Pra começar, fala seu nome completo, o local e a data de nascimento.\nR – Meu nome é Vladimir Aparecido Chiari, nasci em Bauru, interior de São Paulo, em junho de 1961.\nP/1 – Você sabe por que da escolha do seu nome, Vladimir?\nR – Olha, o que eu ouvia dos meus pais é que a minha tia, que é minha madrinha também, sugeriu. Porque Vladimir lembrava alguma coisa da Rússia, da União Soviética na época, não sei por que, que ela nunca esteve lá, inclusive. E Aparecido, essa é a história que eles me contavam que era porque como eu sou o filho mais novo, depois de 12 anos eu nasci, somos três irmãos, e minha mãe já era mais de idade, ela já tinha mais de 40 anos, então teve uma gravidez meio complicada e tudo mais, e essa minha tia disse que Aparecido"}, "folder_size_gb": 0.0}, "folder_size_gb": 5.287}, "PCSH_HV616_Marcia Macedo": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV616.mp4": {"size_mb": 226.2475, "modified": "2018-08-08 09:17:22", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV616_Marcia Macedo\\Audiovisual\\Vídeo\\Edição\\PCSH_HV616.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 125959.0, "duration": 125.96}, "folder_size_gb": 0.221}, "Íntegra": {"PCSH_HV616.mp4": {"size_mb": 4697.6349, "modified": "2017-11-09 21:52:50", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV616_Marcia Macedo\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV616.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 4742838.0, "duration": 4742.84}, "folder_size_gb": 4.588}, "folder_size_gb": 4.808}, "Áudio": {"PCSH_HV616_Marcia Macedo.mp3": {"size_mb": 72.3855, "modified": "2017-08-31 05:40:40", "extension": "MP3", "full_path": "D:\\HD_Allergan\\PCSH_HV616_Marcia Macedo\\Audiovisual\\Áudio\\PCSH_HV616_Marcia Macedo.mp3", "categ JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV616_Marcia Macedo\\Iconográfico\\Acervo\\Baixa\\PCSH_HV616_DOC01.jpg", "category": "Image", "dimension": "2818x1408", "resolution": "2818x1408", "color_mode": "RGB", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV616_DOC01.jpg"}, "PCSH_HV616_FT04.jpg": {"size_mb": 0.5332, "modified": "2017-08-29 17:19:42", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV616_Marcia Macedo\\Iconográfico\\Acervo\\Baixa\\PCSH_HV616_FT04.jpg", "category": "Image", "dimension": "1779x1171", "resolution": "1779x1171", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV616_FT04.jpg"}, "folder_size_gb": 0.009}, "Alta": {"PCSH_HV616_DOC01.tif": {"size_mb": 12.2541, "modified": "2017-08-29 17:21:04", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV616_Marcia Macedo\\Iconográfico\\Acervo\\Alta\\PCSH_HV616_DOC01.tif", "category": "Image", "dimension": "1408x2818", "resolution": "1408x2818", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV616_DOC01.jpg"}, "PCSH_HV616_FT04.tif": {"size_mb": 4.9868, "modified": "2017-08-29 17:19:36", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV616_Marcia Macedo\\Iconográfico\\Acervo\\Alta\\PCSH_HV616_FT04.tif", "category": "Image", "dimension": "1779x1171", "resolution": "1779x1171", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV616_FT04.jpg"}, "folder_size_gb": 0.017}, "folder_size_gb": 0.026}, "Making Of": {"PCSH_HV616_MO001.JPG": {"size_mb": 1.275, "modified": "2017-09-01 11:12:14", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV616_Marcia Macedo\\Iconográfico\\Making Of\\PCSH_HV616_MO001.JPG", "category": "Image", "dimension": "2592x1728", "resolution": "2592x1728", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV616_MO001.jpg"}, "PCSH_HV616_MO002.JPG": {"size_mb": 1.2669, "modified": "2017-09-01 11:12:08", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV616_Marcia Macedo\\Iconográfico\\Making Of\\PCSH_HV616_MO002.JPG", "category": "Image", "dimension": "2592x1728", "resolution": "2592x1728", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV616_MO002.jpg"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.029}, "Textual": {"PCSH_HV616_Marcia Macedo_edi.docx": {"size_mb": 0.0096, "modified": "2018-01-17 05:44:18", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV616_Marcia Macedo\\Textual\\PCSH_HV616_Marcia Macedo_edi.docx", "category": "Textual", "content_preview": "Nome da história\nAtenta aos sinais\nMinibio\nMarcia Macedo nasceu em São Paulo, em 1º de março de 1965. Caçula dos quatro filhos, tem diferença de 19 anos do mais velho. As idas com o pai para a pescaria revelam muito de sua personalidade: uma mulher calma, atenta aos sinais. Formada em Comércio Exterior, Marcia é secretária executiva da Allergan.\nSinopse\nMarcia transborda uma calmaria confiante. Parece, com o olhar, responder suas demandas e passar uma confiança de que tudo será resolvido. Prestativa, está sempre em alerta, em busca dos sinais da vida. Não à toa. Por necessidade, se entrega à carreira de secretariado, o que rendeu a oportunidade de aprender inglês, indo inclusive estudar fora. Mais tarde, por uma questão de destino - divisão do andar com outra empresa -, recebe uma nova proposta de emprego, daí para frente, se deslanchando e se encontrando na profissão. O encontro com a Marcia da infância traduz a sua personalidade: nos dias de pescaria com o pai, lá ficava ela, sem se importar com o silêncio, apenas à espera da figada e o primeiro sinal de que ali estava seu objetivo cumprido, à espera do seu puxão. Marcia, sem dúvida, sabe ler a vida.\nTAGs\ninglês\ndestino\nprofissão"}, "PCSH_HV616_Marcia Macedo_rev.docx": {"size_mb": 0.0329, "modified": "2018-01-18 15:51:34", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV616_Marcia Macedo\\Textual\\PCSH_HV616_Marcia Macedo_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História\nDepoimento de Marcia Macedo\nEntrevistada por Carolina Margiotte e Luiz Egypto \nSão Paulo, 21/08/2017 \nRealização: Museu da Pessoa\nPCSH_HV616_Marcia Macedo\nTranscrito por Mariana Wolff\nRevisado e editado por Carolina Margiotte\n_______________________________________________________________________\nP/1 – Marcia, muito obrigada por você estar aqui, contando a sua história pra gente. Para começar, o seu nome completo, o local e a data de nascimento.\nR – Marcia Macedo, São Paulo, primeiro de março, 1965.\nP/1 – E o nome dos seus pais?\nR – Orlando Macedo e Assunta Macedo.\nP/1 – Conta um pouquinho sobre eles, você conhece a história deles? O quê que eles faziam?\nR – Mau pai era torneiro mecânico e minha mãe trabalhou muitos anos em tear de fazer roupas. Só que depois que ela casou-se, ela parou de trabalhar pra cuidar dos filhos e o meu pai trabalhou a vida dele inteira como torneiro mecânico. No Filizola, depois ele se aposentou e foi trabalhar numa empresa menor, mas também como torneiro mecânico. \nP/1 – Onde eles nasceram?\nR – Nasceram minha mãe em Araras e o meu pai em São Paulo, desculpa, São Paulo, não, em Minas.\nP/1 – Seu pai nasceu em Minas?\nR – Nasceu e"}, "folder_size_gb": 0.0}, "folder_size_gb": 4.908}, "PCSH_HV618_Odair Homma": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV618.mp4": {"size_mb": 442.0626, "modified": "2018-08-08 09:29:58", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV618_Odair Homma\\Audiovisual\\Vídeo\\Edição\\PCSH_HV618.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 237037.0, "duration": 237.04}, "folder_size_gb": 0.432}, "Íntegra": {"PCSH_HV618.mp4": {"size_mb": 4864.4076, "modified": "2017-11-10 01:39:42", "extension": "MP4", "full_path": "D:\\HD_Allergan\\  "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV618_FT09.jpg"}, "PCSH_HV618_FT10.tif": {"size_mb": 4.6355, "modified": "2017-08-30 13:13:54", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV618_Odair Homma\\Iconográfico\\Acervo\\Alta\\PCSH_HV618_FT10.tif", "category": "Image", "dimension": "1779x1171", "resolution": "1779x1171", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV618_FT10.jpg"}, "PCSH_HV618_FT11.tif": {"size_mb": 4.2707, "modified": "2017-08-30 13:15:40", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV618_Odair Homma\\Iconográfico\\Acervo\\Alta\\PCSH_HV618_FT11.tif", "category": "Image", "dimension": "1758x1172", "resolution": "1758x1172", "color_mode": "RGBA", "dpi": "299 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV618_FT11.jpg"}, "folder_size_gb": 0.067}, "folder_size_gb": 0.075}, "Making Of": {"PCSH_HV618_MO001.JPG": {"size_mb": 1.1229, "modified": "2017-09-01 11:12:36", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV618_Odair Homma\\Iconográfico\\Making Of\\PCSH_HV618_MO001.JPG", "category": "Image", "dimension": "2592x1728", "resolution": "2592x1728", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV618_MO001.jpg"}, "folder_size_gb": 0.001}, "folder_size_gb": 0.076}, "Textual": {"PCSH_HV618_Odair Homma_edi.docx": {"size_mb": 0.0097, "modified": "2018-01-17 04:42:22", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV618_Odair Homma\\Textual\\PCSH_HV618_Odair Homma_edi.docx", "category": "Textual", "content_preview": "Nome da história\nMeu sonho é o sonho deles\nMissão: cinco filões de pão e três litros de leite\nMinibio\nOdair Kiyoshi Homma nasceu no dia 19 de setembro de 1967, em São Paulo, capital. Criado com mais nove irmãos, a disciplina era uma regra em casa - condição adquirida que facilitou mais tarde a sua estada no quartel. Desde muito jovem na labuta, aprendeu com o sogro a profissão de propagandista. Apesar das primeiras frustrações, logo Odair se encontra na profissão e engata na indústria farmacêutica. Hoje, é Diretor de Marketing e Vendas da área de Medicina Estética da Allergan.\nSinopse\nA partir dos sete anos, Odair era o responsável pela compra do pão e do leite do café da manhã para a família, composta por dez filhos e os pais. Imagine só a criança carregando cinco filões de pão mais três litros de leite! Para esse tanto de gente, Odair resume numa condição: era uma festa! Imagine seis homens, o que poderia sair do quarto com três beliches? Muito navio pirata e cabana, no mínimo. Devia ser, sem dúvida, uma diversão para as crianças e muito trabalho para os pais. Por isso, a regra era sabida: aos 14 anos, a vida real chamava para a labuta. E assim começa a trajetória profissional de"}, "PCSH_HV618_Odair Homma_rev.docx": {"size_mb": 0.0357, "modified": "2018-01-18 15:47:12", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV618_Odair Homma\\Textual\\PCSH_HV618_Odair Homma_rev.docx", "category": "Textual", "content_preview": "Projeto Conte Sua História\nDepoimento de Odair Homma\t\nEntrevistado por Luiz Egypto e Carolina Margiotte\nSão Paulo, 30/08/2017\nRealização Museu da Pessoa\nPCSH_HV618_Odair Homma\nTranscrito por Liliane Custódio\nRevisado e editado por Carolina Margiotte\n__________________________________________________________________________\nP/1 – Bom dia, Odair. Muito obrigado por ter aceitado o nosso convite. Eu queria começar pedindo a você que dissesse o seu nome completo, o local e a data do seu nascimento.\nR – Ok. Bom dia. Meu nome é Odair Kiyoshi Homma, nasci no dia 19 de setembro de 1967, em São Paulo. São Paulo, capital.\nP/1 – O nome dos seus pais, por favor.\nR – Meu pai, Shiro Homma, e minha mãe, Pedrina Homma.\nP/1 – E o que faziam seus pais?\nR – Meu pai fez várias coisas. Quando chegou ao Brasil, criança, tal, quando ele se casou com a minha mãe, ele foi trabalhar de tintureiro, ele trabalhou de serviços gerais, eletricista, encanamento, enfim, ele era um faz tudo. E a minha mãe sempre foi do lar, sempre foi dona de casa,\nP/1 – O seu pai é japonês?\nR – Sim.\nP/1 – Ele veio com a família?\nR – Veio com a família, com os irmãos. Ele tinha cinco anos na época, 1946, 47, e quando ele se casou co"}, "folder_size_gb": 0.0}, "folder_size_gb": 5.331}, "PCSH_HV619_Marcelo Gonçalves": {"Audiovisual": {"Vídeo": {"Íntegra": {"PCSH_HV619.mp4": {"size_mb": 5036.3925, "modified": "2017-11-09 14:05:30", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV619_Marcelo Gonçalves\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV619.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5085280.0, "duration": 5085.28}, "folder_size_gb": 4.918}, "Edição": {"PCSH_HV619.mp4": {"size_mb": 221.2297, "modified": "2018-08-08 09:33:40", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV619_Marcelo Gonçalves\\Audiovisual\\Vídeo\\Edição\\PCSH_HV619.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 119219.0, "duration": 119.22}, "folder_size_gb": 0.216}, "folder_size_gb": 5.134}, "Áudio": {"PCSH_HV619_Marcelo Gonçalves.mp3": {"size_mb": 77.6106, "modified": "2017-09-01 10:53:18", "extension": "MP3", "full_path": "D:\\HD_Allergan\\PCSH_HV619_Marcelo Gonçalves\\Audiovisual\\Áudio\\PCSH_HV619_Marcelo Gonçalves.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 5085336.0, "duration": 5085.34}, "folder_size_gb": 0.076}, "folder_size_gb": 5.21}, "Iconográfico": {"Acervo": {"PCSH_HV619_FT01.docx": {"size_mb": 0.0212, "modified": "2017-08-30 10:49:28", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV619_Marcelo Gonçalves\\Iconográfico\\Acervo\\PCSH_HV619_FT01.docx", "category": "Textual", "content_previe ": 15.5798, "modified": "2017-08-30 13:20:54", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV619_Marcelo Gonçalves\\Iconográfico\\Acervo\\Alta\\PCSH_HV619_FT04E.tif", "category": "Image", "dimension": "4320x3240", "resolution": "4320x3240", "color_mode": "RGBA", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV619_FT04E.jpg"}, "PCSH_HV619_FT05.tif": {"size_mb": 0.515, "modified": "2017-08-30 13:21:34", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV619_Marcelo Gonçalves\\Iconográfico\\Acervo\\Alta\\PCSH_HV619_FT05.tif", "category": "Image", "dimension": "455x599", "resolution": "455x599", "color_mode": "RGBA", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV619_FT05.jpg"}, "PCSH_HV619_FT06.tif": {"size_mb": 3.3083, "modified": "2017-08-30 13:21:18", "extension": "TIF", "full_path": "D:\\HD_Allergan\\PCSH_HV619_Marcelo Gonçalves\\Iconográfico\\Acervo\\Alta\\PCSH_HV619_FT06.tif", "category": "Image", "dimension": "1600x1200", "resolution": "1600x1200", "color_mode": "RGBA", "dpi": "180 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV619_FT06.jpg"}, "folder_size_gb": 0.105}, "folder_size_gb": 0.136}, "Making Of": {"PCSH_HV619_MO001.JPG": {"size_mb": 1.4316, "modified": "2017-09-01 11:12:46", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV619_Marcelo Gonçalves\\Iconográfico\\Making Of\\PCSH_HV619_MO001.JPG", "category": "Image", "dimension": "2592x1728", "resolution": "2592x1728", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV619_MO001.jpg"}, "PCSH_HV619_MO002.JPG": {"size_mb": 1.3146, "modified": "2017-09-01 11:12:40", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV619_Marcelo Gonçalves\\Iconográfico\\Making Of\\PCSH_HV619_MO002.JPG", "category": "Image", "dimension": "2592x1728", "resolution": "2592x1728", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV619_MO002.jpg"}, "folder_size_gb": 0.003}, "folder_size_gb": 0.139}, "Textual": {"PCSH_HV619_Marcelo Gonçalves_edi.docx": {"size_mb": 0.0086, "modified": "2018-01-15 05:17:10", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV619_Marcelo Gonçalves\\Textual\\PCSH_HV619_Marcelo Gonçalves_edi.docx", "category": "Textual", "content_preview": "Nome da história\nNa dualidade, o eterno adolescente\nMinibio\nMarcelo Gonçalves nasceu em 04 de dezembro de 1973 em São Paulo. Cercado de animais - na infância, chegou a dividir tranquilamente o lar com três cachorros e 25 gatos -, aprendeu cedo que para o relacionamento não deve ser criado barreiras. Amante do dicionário, tem facilidade com línguas e sua personalidade tende para a área de TI. É Diretor Associado de Pesquisa de Mercado/ Inteligência e Análise da Allergan.\nSinopse\nPrepare-se: história de vida de um geminiano. Vai ter amor e ódio, grandeza e pequeneza. Vai ter dualidade do início ao fim, mas histórias regadas de muito sorriso e ingenuidade. Marcelo é assim: um cara simpático, talvez um pouco rigoroso demais consigo! Altamente reflexivo. Inteligente. No fundo, um eterno adolescente. Com um coração bondoso, apaixonado pela esposa e pelos sobrinhos. Alguém que sabe olhar a oportunidade, avaliar se cabe sua personalidade nela e abraçar quando a resposta é sim. Marcelo é um cara que procura o equilíbrio e que sabe buscar aquilo que importa: trilhar a sua história se inspirando na do outro. Alguém surpreendente.\nTAGs\ninfância\nanimal\ncasa\ncachorro\ngato\nprofissão\nMooca\ndicioná"}, "PCSH_HV619_Marcelo Gonçalves_rev.docx": {"size_mb": 0.0383, "modified": "2018-05-23 17:45:50", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV619_Marcelo Gonçalves\\Textual\\PCSH_HV619_Marcelo Gonçalves_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História \nDepoimento de Marcelo Gonçalves\nEntrevistado por Carolina Margiotte e Luiz Egypto\nSão Paulo, 30 de agosto de 2017\nRealização: Museu da Pessoa \nPCSH_HV619_Marcelo Gonçalves\nTranscrito por Karina Medici Barrella\nRevisado e editado por Carolina Margiotte\n_______________________________________________________________________\nP/1 – Marcelo, primeiro muito obrigada pela sua participação, por estar aqui com a gente. Pra começar, seu nome completo, local e a data de nascimento.\nR – Marcelo Gonçalves. Local de nascimento?\nP/1 – Isso, cidade, estado, país.\nR – São Paulo. E data de nascimento, 04 de dezembro de 1973 (risos).\nP/1 – Não gosta de falar o ano?\nR – Eu encho o saco, mais uma piadinha feminina, eu não tenho nenhum problema (risos).\nP/1 – E o nome dos seus pais e conta um pouquinho sobre eles, o que eles faziam.\nR – O meu pai chama Zulmiro Gonçalves, a minha mãe chama Elizabeth da Silva Gonçalves. Meu pai trabalhava como montador na Ford, trabalhou muitos anos, uns 20 anos, trabalhou muitos anos na Ford. Ele sempre foi um cara muito, era muito comum naquela época, começava numa empresa e ficava pro resto da vida. A minha mãe teve vários empregos, teve vá"}, "folder_size_gb": 0.0}, "folder_size_gb": 5.349}, "PCSH_HV620_Gabriela Domingues": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV620.mp4": {"size_mb": 272.855, "modified": "2018-08-08 09:37:36", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV620_Gabriela Domingues\\Audiovisual\\Vídeo\\Edição\\PCSH_HV620.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 149916.0, "duration": 149.92}, "folder_size_gb": 0.266}, "Íntegra": {"PCSH_HV620.mp4": {"size_mb": 7103.7959, "modified": "2017-11-16 19:34:20", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV620_Gabriela Domingues\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV620.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6855849.0, "duration": 6855.85}, "folder_s a Domingues\\Iconográfico\\Acervo\\PCSH_HV620_FT06.docx", "category": "Textual", "content_preview": "CADASTRO DE IMAGEM"}, "Baixa": {"PCSH_HV620_FT01.jpg": {"size_mb": 0.1552, "modified": "2017-10-30 14:50:10", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV620_Gabriela Domingues\\Iconográfico\\Acervo\\Baixa\\PCSH_HV620_FT01.jpg", "category": "Image", "dimension": "1594x813", "resolution": "1594x813", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV620_FT01.jpg"}, "PCSH_HV620_FT02.jpg": {"size_mb": 1.2181, "modified": "2017-10-30 14:52:56", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV620_Gabriela Domingues\\Iconográfico\\Acervo\\Baixa\\PCSH_HV620_FT02.jpg", "category": "Image", "dimension": "3264x2448", "resolution": "3264x2448", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV620_FT02.jpg"}, "PCSH_HV620_FT03.jpg": {"size_mb": 0.5176, "modified": "2017-10-30 14:54:40", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV620_Gabriela Domingues\\Iconográfico\\Acervo\\Baixa\\PCSH_HV620_FT03.jpg", "category": "Image", "dimension": "2290x1554", "resolution": "2290x1554", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV620_FT03.jpg"}, "PCSH_HV620_FT04.jpg": {"size_mb": 0.0765, "modified": "2017-10-30 14:55:38", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV620_Gabriela Domingues\\Iconográfico\\Acervo\\Baixa\\PCSH_HV620_FT04.jpg", "category": "Image", "dimension": "800x600", "resolution": "800x600", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV620_FT04.jpg"}, "PCSH_HV620_FT05.jpg": {"size_mb": 0.0953, "modified": "2017-10-30 14:56:56", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV620_Gabriela Domingues\\Iconográfico\\Acervo\\Baixa\\PCSH_HV620_FT05.jpg", "category": "Image", "dimension": "816x522", "resolution": "816x522", "color_mode": "RGB", "dpi": "96 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV620_FT05.jpg"}, "PCSH_HV620_FT06.jpg": {"size_mb": 7.5368, "modified": "2017-10-30 14:59:18", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV620_Gabriela Domingues\\Iconográfico\\Acervo\\Baixa\\PCSH_HV620_FT06.jpg", "category": "Image", "dimension": "4288x2848", "resolution": "4288x2848", "color_mode": "RGB", "dpi": "300 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV620_FT06.jpg"}, "folder_size_gb": 0.009}, "folder_size_gb": 0.009}, "Making Of": {"PCSH_HV620_MO001.JPG": {"size_mb": 1.3681, "modified": "2017-09-01 11:12:58", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV620_Gabriela Domingues\\Iconográfico\\Making Of\\PCSH_HV620_MO001.JPG", "category": "Image", "dimension": "2592x1728", "resolution": "2592x1728", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV620_MO001.jpg"}, "PCSH_HV620_MO002.JPG": {"size_mb": 1.5446, "modified": "2017-09-01 11:12:54", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV620_Gabriela Domingues\\Iconográfico\\Making Of\\PCSH_HV620_MO002.JPG", "category": "Image", "dimension": "2592x1728", "resolution": "2592x1728", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV620_MO002.jpg"}, "folder_size_gb": 0.003}, "folder_size_gb": 0.012}, "Textual": {"PCSH_HV620_Gabriela Domingues_edi.docx": {"size_mb": 0.0096, "modified": "2018-01-18 07:34:38", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV620_Gabriela Domingues\\Textual\\PCSH_HV620_Gabriela Domingues_edi.docx", "category": "Textual", "content_preview": "Nome da história\nDa brasília amarela ao mundo paralelo\nMinibio\nGabriela Domingues nasceu em 24 de fevereiro de 81 em São Paulo (SP). Filha de pai piloto de avião e mãe dedicada aos cuidados do lar, logo na escola começa a explorar seu dom para a escrita. O contato com o avô a faz descobrir uma carreira em ascensão: Relações Públicas, e assim inicia sua trajetória profissional, marcada por encontros que a levaram a unir suas aptidões, a área da saúde e a comunicação. Gabriela é mãe de gêmeos e coordena a área de comunicação da Allergan, indústria farmacêutica.\nSinopse\nO que esperar de alguém que nasceu numa brasília amarela? Quem já chega ao mundo sendo protagonista de uma história e tanto, anuncia a personalidade ímpar que está por vir! Assim se faz Gabriela, uma jovem mulher em eterna formação: isso porque seus olhos brilham para o mundo, expressando sua vontade de aprender e de sabiamente compartilhar aquilo que sabe. A parte da família militar com “veia jornalística” rendeu o contato com o avô faz-tudo, que a aconselhou seguir na área de Relações Públicas. A menina abre os ouvidos ao avô e o que parecia impossível de se realizar, torna-se alcançável: unir a inclinação para a áre"}, "PCSH_HV620_Gabriela Domingues_rev.docx": {"size_mb": 0.0382, "modified": "2018-01-18 07:35:28", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV620_Gabriela Domingues\\Textual\\PCSH_HV620_Gabriela Domingues_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História\nDepoimento de Gabriela Domingues\nEntrevistada por Carolina Margiotte e Luiz Egypto \nSão Paulo, 30/08/2017 \nRealização: Museu da Pessoa\nPCSH_HV620_Gabriela Domingues\nTranscrito por Mariana Wolff\nRevisado e editado por Carolina Margiotte\nP/1 – Gabi, obrigada por estar aqui com a gente! Pra começar, seu nome completo, local e data de nascimento.\nR – Gabriela Domingues, eu nasci dia 24 de fevereiro de 81 em São Paulo, capital.\nP/1 – Pode ser Gabi?\nR –  Pode, pode. Tem uma coisa muito interessante do local de nascimento, eu nasci dentro de um carro (risos). Eu nasci, na verdade, dentro de uma Brasília amarela, não deu tempo da minha mãe chegar na maternidade e aí eu acabei nascendo assim, meio que por sorte. A minha mãe tava junto com a minha vó. A minha vó parteira e foi muita sorte realmente eu ter nascido, porque junto com a minha vó, porque eu poderia ter falecido no nascimento. Mas foi bem interessante, uma passagem bem… E toda família sempre lembra porque o meu pai é piloto, enfim, não tava aqui e a minha mãe entrou em trabalho de parto e não tinha quem levasse ela no hospital, nessa época já tinha um irmão um pouquinho mais velho, Alexandre e aí a minh"}, "folder_size_gb": 0.0}, "folder_size_gb": 7.318}, "PCSH_HV630_Elizabeth Regina Giunco Alexandre": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV630.mp4": {"size_mb": 414.0789, "modified": "2017-12-20 17:07:56", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV630_Elizabeth Regina Giunco Alexandre\\Audiovisual\\Vídeo\\Edição\\PCSH_HV630.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 222139.0, "duration": 222.14}, "folder_size_gb": 0.404}, "Íntegra": {"PCSH_HV630.mp4": {"size_mb": 5846.1274, "modified": "2017-11-24 18:56:14", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV630_Elizabeth Regina Giunco Alexandre\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV630.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "23.976 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 5745531.0, "duration": 5745.53}, "folder_size_gb": 5.709}, "folder_size_gb": 6.113}, "Áudio": {"PCSH_HV630_Elizabeth Regina Giunco Alexandre.mp3": {"size_mb": 87.6809, "modified": "2017-11-14 07:40:28", "extension": "MP3", "full_path": "D:\\HD_Allergan\\PCSH_HV630_Elizabeth Regina Giunco Alexandre\\Audiovisual\\Áudio\\PCSH_HV630_Elizabeth Regina Giunco Alexandre.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 5745600.0, "duration": 5745.6}, "folder_size_gb": 0.086}, "folder_size_gb": 6.199}, "Iconográfico": {"Acervo": {"PCSH_HV630_FT01.docx": {"size_mb": 0.0211, "modified": "2017-11-07 13:42:38", "extension": "DOCX", "full_path" b": 1.7289, "modified": "2015-08-31 21:03:16", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV630_Elizabeth Regina Giunco Alexandre\\Iconográfico\\Acervo\\Baixa\\PCSH_HV630_FT09.JPG", "category": "Image", "dimension": "2592x1936", "resolution": "2592x1936", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV630_FT09.jpg"}, "PCSH_HV630_FT10.png": {"size_mb": 3.9892, "modified": "2017-11-07 13:37:52", "extension": "PNG", "full_path": "D:\\HD_Allergan\\PCSH_HV630_Elizabeth Regina Giunco Alexandre\\Iconográfico\\Acervo\\Baixa\\PCSH_HV630_FT10.png", "category": "Image", "dimension": "1500x1127", "resolution": "1500x1127", "color_mode": "RGBA", "dpi": "150 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV630_FT10.jpg"}, "folder_size_gb": 0.013}, "folder_size_gb": 0.013}, "Making Of": {"PCSH_HV630_MO001.JPG": {"size_mb": 3.0556, "modified": "2017-11-12 14:48:10", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV630_Elizabeth Regina Giunco Alexandre\\Iconográfico\\Making Of\\PCSH_HV630_MO001.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV630_MO001.jpg"}, "PCSH_HV630_MO002.JPG": {"size_mb": 2.6346, "modified": "2017-11-12 14:48:22", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV630_Elizabeth Regina Giunco Alexandre\\Iconográfico\\Making Of\\PCSH_HV630_MO002.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV630_MO002.jpg"}, "PCSH_HV630_MO003.JPG": {"size_mb": 2.518, "modified": "2017-11-12 14:48:34", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV630_Elizabeth Regina Giunco Alexandre\\Iconográfico\\Making Of\\PCSH_HV630_MO003.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV630_MO003.jpg"}, "folder_size_gb": 0.008}, "folder_size_gb": 0.021}, "Textual": {"PCSH_HV630_Elizabeth Regina Giunco Alexandre_edi.docx": {"size_mb": 0.0093, "modified": "2017-12-15 06:29:16", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV630_Elizabeth Regina Giunco Alexandre\\Textual\\PCSH_HV630_Elizabeth Regina Giunco Alexandre_edi.docx", "category": "Textual", "content_preview": "Nome da história\nMédica do coração\nVídeo: A jabuticaba, o diamante negro e a uva\nMinibio\nElizabeth Regina Giunco Alexandre nasceu em São Paulo em 09 de julho de 1953. Passou a infância em Vinhedo, então Rocinha. Lembra-se de brincar nos campos de cultivo de uva e também da época da colheita de jabuticaba em Itatiba, cidade vizinha. Nas voltas do pai para casa, após a temporada de venda no Mercadão de São Paulo, um tablete de Diamante Negro fechava o ciclo gustativo da criança que se formava. Elizabeth é cardiologista associada ao Dante Pazzanese de Cardiologia e já ocupou o cargo de presidente do Departamento de Cardiologia da Mulher da Sociedade Brasileira de Cardiologia.\nSinopse\nNa cabeça da menina Elizabeth, o mundo era em italiano: comia-se massa e a língua era falada mais com as mãos. Foi descobrir que era bem mais que isso quando saiu de Vinhedo e voltou para sua cidade natal, São Paulo, onde fez amizade com uma colega de família espanhola. Apesar da inclinação para a área de ciências biológicas, na escola, a história rendeu bons professores e a geografia te dava a noção do mundo. Mas, como ninguém foge do seu destino, numa carona dada para as amigas, acabou fazendo a inscriç"}, "PCSH_HV630_Elizabeth Regina Giunco Alexandre_rev.docx": {"size_mb": 0.0362, "modified": "2017-12-15 06:21:24", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV630_Elizabeth Regina Giunco Alexandre\\Textual\\PCSH_HV630_Elizabeth Regina Giunco Alexandre_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História \nDepoimento de Elizabeth Regina Giunco Alexandre\nEntrevistada por Carolina Margiotte\nSão Paulo, 07 de novembro de 2017 \nRealização: Museu da Pessoa \nPCSH_HV630_Elizabeth Regina Giunco Alexandre\nTranscrito por Karina Medici Barrella\nRevisado por Carolina Margiotte\n_________________________________________________________________________\nP/1 – Doutora, boa tarde.\nR – Boa tarde.\nP/1 – Obrigada pela sua presença. Pra começar, o seu nome completo, o local e a data de nascimento.\nR – Eu sou Elizabeth Regina Giunco Alexandre. Nasci em São Paulo, em nove de julho de 1953.\nP/1 – E a senhora sabe por que seus pais te deram esse nome?\nR – Ah, claro que eu sei! Elizabeth era uma homenagem à avó do meu pai, uma italiana chamada Elizabeta. E o Regina era uma homenagem à mãe dele. Meu pai ficou órfão muito cedo, ele tinha sete anos quando ele ficou órfão, então, quando eu nasci foi perfeito para homenagear a mãe e a avó dele.\nP/1 – Lindo. O nome dos seus pais, então?\nR – O meu pai é Ferdinando Giunco e minha mãe, Dirce Tasca Giunco. \nP/1 – Então conta pra gente como é que era o seu Ferdinando e a dona Dirce.\nR – Meus pais se conheceram em Vinhedo. Os dois vinham de fam"}, "folder_size_gb": 0.0}, "folder_size_gb": 6.22}, "PCSH_HV633_Maria de Fátima dos Santos": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV633.mp4": {"size_mb": 316.6308, "modified": "2017-12-20 16:37:46", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV633_Maria de Fátima dos Santos\\Audiovisual\\Vídeo\\Edição\\PCSH_HV633.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 172339.0, "duration": 172.34}, "folder_size_gb": 0.309}, "Íntegra": {"PCSH_HV633.mp4": {"size_mb": 5804.7375, "modified": "2017-11-30 21:07:50", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV633_Maria de Fátima dos Santos\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV633.mp4", "category": "Video", "dimension _size_gb": 0.005}, "folder_size_gb": 0.125}, "Textual": {"PCSH_HV633_Maria de Fátima Santos_rev.docx": {"size_mb": 0.0423, "modified": "2017-11-29 10:20:12", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV633_Maria de Fátima dos Santos\\Textual\\PCSH_HV633_Maria de Fátima Santos_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História \nDepoimento de Maria de Fátima dos Santos\nEntrevistada por Carolina Margiotte \nSão Paulo, 11/11/2017\nRealização: Museu da Pessoa\nPCSH_HV633_Maria de Fátima dos Santos\nTranscrito por Mariana Wolff\nRevisado por Carolina Margiotte\n_______________________________________________________________________\nP/1 – Doutora, bom dia!\nR – Bom dia.\nP/1 – Obrigada por estar aqui com a gente. Pra começar, por gentileza, seu nome completo.\nR – Maria de Fátima Santos.\nP/1 – Local e data de nascimento.\nR – São Paulo, 15 de março de 1966.\nP/1 – Nome dos seus pais.\nR – Leonel Joaquim dos Santos e Clementina Capócia dos Santos.\nP/1 – E a senhora sabe por quê que eles te deram o nome de Maria?\nR – Maria de Fátima só podia ser pela origem do meu pai, que é português. Eu tenho a teoria que o meu nome é Maria de Fátima dos Santos para não sair errado, Maria de Fátima, Nossa Senhora de Fatima e de todos os santos (risos).\nP/1 – Muito bom, e dá sorte, doutora?\nR – Dá! Dá sorte. Os pacientes ficam extremamente encantados, alguns falam: “Nossa, não tem como dar errado, doutora! A senhora é Nossa Senhora de Fátima”.\nP/1 – Muito bom, doutora!\nR – É, então. Meu pai lá atrás já pensou o"}, "PCSH_HV633_Maria de Fátima Santos_edi.docx": {"size_mb": 0.0092, "modified": "2017-12-15 12:46:12", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV633_Maria de Fátima dos Santos\\Textual\\PCSH_HV633_Maria de Fátima Santos_edi.docx", "category": "Textual", "content_preview": "Nome da história\nUma médica para chamar de sua\nMinibio\nMaria de Fátima Santos nasceu em São Paulo (SP) em 15 de março de 1966. Filha de pai português com mãe italiana, é dessa mistura que faz de Fátima uma pessoa única. A indecisão adolescente pela escolha profissional a destina à área biológica, onde começa a se aproximar das pessoas e suas histórias. É selecionada na graduação em Medicina na Santa Casa, tendo a certeza pelo curso anos antes, numa formação em instrumentação cirúrgica. Seus pacientes têm grande prazer em ter uma médica batizada com um nome de tanta fé - sem contar a predileção por consultas de longas horas. É uma cirurgiã apaixonada tanto pelo centro cirúrgico quanto pela clínica, onde faz seus pacientes serem tão especiais quanto o nome que leva seu recinto: Jade.\nSinopse\nFátima saiu a a vó Isolina, parteira da aldeia Bolsas, norte de Portugal. Ainda que proibida pelo esposo de sair de casa - “deves cuidar dos seus filhos” - Isolina saltava os muros de casa nos primeiros pedidos de socorro de uma mãe à hora da luz. Assim é Fátima: destemida, avante ao destino que lhe foi dado. Considera como seu primeiro emprego as idas junto aos pais à feira: na presença de qualq"}, "folder_size_gb": 0.0}, "folder_size_gb": 6.19}, "PCSH_HV635_Luiz Augusto Franco de Andrade": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV635.mp4": {"size_mb": 256.8778, "modified": "2017-12-20 17:24:34", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV635_Luiz Augusto Franco de Andrade\\Audiovisual\\Vídeo\\Edição\\PCSH_HV635.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 141475.0, "duration": 141.47}, "folder_size_gb": 0.251}, "Íntegra": {"PCSH_HV635.mp4": {"size_mb": 6525.3916, "modified": "2017-12-01 22:56:20", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV635_Luiz Augusto Franco de Andrade\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV635.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "A CSH_HV635_FT18.jpg", "category": "Image", "dimension": "1024x768", "resolution": "1024x768", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV635_FT18.jpg"}, "PCSH_HV635_FT19.jpg": {"size_mb": 0.0694, "modified": "2017-12-28 15:32:16", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV635_Luiz Augusto Franco de Andrade\\Iconográfico\\Acervo\\Baixa\\PCSH_HV635_FT19.jpg", "category": "Image", "dimension": "853x640", "resolution": "853x640", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV635_FT19.jpg"}, "PCSH_HV635_FT20.jpg": {"size_mb": 0.075, "modified": "2017-12-28 16:36:14", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV635_Luiz Augusto Franco de Andrade\\Iconográfico\\Acervo\\Baixa\\PCSH_HV635_FT20.jpg", "category": "Image", "dimension": "640x480", "resolution": "640x480", "color_mode": "RGB", "dpi": "N/A", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV635_FT20.jpg"}, "folder_size_gb": 0.011}, "folder_size_gb": 0.108}, "Makinf Of": {"PCSH_HV635_LMO001.JPG": {"size_mb": 3.0877, "modified": "2017-11-22 05:30:26", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV635_Luiz Augusto Franco de Andrade\\Iconográfico\\Makinf Of\\PCSH_HV635_LMO001.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV635_LMO001.jpg"}, "PCSH_HV635_LMO002.JPG": {"size_mb": 2.649, "modified": "2017-11-22 05:30:40", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV635_Luiz Augusto Franco de Andrade\\Iconográfico\\Makinf Of\\PCSH_HV635_LMO002.JPG", "category": "Image", "dimension": "3456x2304", "resolution": "3456x2304", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV635_LMO002.jpg"}, "folder_size_gb": 0.006}, "folder_size_gb": 0.114}, "Textual": {"PCSH_HV635_ Luiz Augusto Franco de Andrade_edi.docx": {"size_mb": 0.009, "modified": "2017-12-15 03:22:40", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV635_Luiz Augusto Franco de Andrade\\Textual\\PCSH_HV635_ Luiz Augusto Franco de Andrade_edi.docx", "category": "Textual", "content_preview": "Nome da história\nFérias de branco\nSegunda-feira: um grande dia\nMinibio\nLuiz Augusto Franco de Andrade nasceu em Marília (SP), em 15 de julho de 1944. Durante as férias da graduação, voltava para a casa dos pais em Londrina (PR), mas não pendurava o jaleco: voluntariamente, ajudava no atendimento ao pronto-socorro da cidade, onde teve uma oportunidade de aprendizagem precoce, o que lhe deu uma certa vantagem diante do conhecimento dos demais colegas. Hoje, é médico neurologista referência no tratamento da doença de Parkinson.\nSinopse\nSaber olhar para a vida e abraçar as oportunidades: foi o que Luiz sempre fez. Desde a juventude, com um belo início de uma história de amor junto a esposa - então namorada; a vibração e o desejo de festejar o carnaval que o levou a não responder uma questão no vestibular, mas que mesmo assim o deixou entre os primeiros colocados; a oportunidade de vivenciar a rotina médica ainda na graduação e os encontros com pacientes que o fizeram refletir sobre os mistérios da neurologia - embora fosse uma área que não queria. Mas tudo isso não seria sua sina se Luiz não fosse um cara sensível, com olhar curioso. Nessa bela narrativa, o doutor Luiz se revela um con"}, "PCSH_HV635_ Luiz Augusto Franco de Andrade_rev.docx": {"size_mb": 0.0422, "modified": "2017-12-15 06:45:02", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV635_Luiz Augusto Franco de Andrade\\Textual\\PCSH_HV635_ Luiz Augusto Franco de Andrade_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História \nDepoimento de Luiz Augusto Franco de Andrade\nEntrevistada por Carolina Margiotte \nSão Paulo, 14/11/2017\nRealização: Museu da Pessoa\nPCSH_HV635_ Luiz Augusto Franco de Andrade\nTranscrito por Mariana Wolff\nRevisado por Carolina Margiotte Grohmann\n__________________________________________________________________________\nP/1 – Doutor, bom dia.\nR – Bom dia.\nP/1 – Obrigada por estar aqui com a gente hoje, por receber a gente na sua casa.\nR – Minha honra.\nP/1 – Pra começar, o seu nome completo.\nR – Luiz Augusto Franco de Andrade.\nP/1 – Local e data de nascimento.\nR – Marília, São Paulo, 15 de julho de 1944.\nP/1 – Nome completo dos seus pais?\nR – Francisco de Assis Andrade e Azália franco de Andrade.\nP/1 – E o senhor sabe por que a dona Azália e o seu Francisco te deram esse nome?\nR – Não tenho muita certeza a respeito disso. Minha mãe gostava de Luiz e o meu pai gostava de Augusto, então juntaram as duas coisas e ficou Luiz Augusto, que não é muito comum Luiz Augusto. Luiz Carlos, Luiz Antônio, Luiz Fernando, né? Mas eu conheço três ou quatro Luiz Augusto também, fora eu.\nP/1 – Conta um pouco como é que era o seu Francisco e a dona Azália. Pode descrever eles"}, "folder_size_gb": 0.0}, "folder_size_gb": 6.836}, "PCSH_HV637_Remo Susanna": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV637.mp4": {"size_mb": 312.9004, "modified": "2017-12-20 17:30:02", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV637_Remo Susanna\\Audiovisual\\Vídeo\\Edição\\PCSH_HV637.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 170537.0, "duration": 170.54}, "folder_size_gb": 0.306}, "Íntegra": {"PSCH_HV637.mp4": {"size_mb": 7081.8292, "modified": "2017-12-13 13:37:14", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV637_Remo Susanna\\Audiovisual\\Vídeo\\Íntegra\\PSCH_HV637.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6814808.0, "duration": 6814.81}, "folder_size_gb": 6.916}, "folder_size_gb": 7.221}, "Áudio": {"PSCH CH_HV637_Remo Susanna_edi.docx": {"size_mb": 0.0092, "modified": "2017-12-15 07:09:10", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV637_Remo Susanna\\Textual\\PSCH_HV637_Remo Susanna_edi.docx", "category": "Textual", "content_preview": "Nome da história\nUm médico boa praça\nRemo: o santo da oftalmologia\nMinibio\nRemo Susanna Júnior nasceu em São Paulo, em 09 de abril de 1948. É médico oftalmologista referência mundial em tratamento de glaucoma. São incontáveis os prêmios de reconhecimento pelos serviços prestados à humanidade na área de pesquisa. Conhecimento e humildade se encontram no doutor que, por ser conhecido pelos pacientes como São Remo, deve ser provedor de muitos milagres.\nSinopse\nUm homem que acredita no poder do exemplo não poderia deixar de ser, ele mesmo, um grande. Remo, por saber da influência que as ações podem ter na formação do outro – pois ele mesmo teve boas referências –, é um cara e tanto. Desde a figura do médico da família, o doutor Pomponet, um homem negro e muito sábio, até os grandes cabeças da medicina, com quem mais tarde passou a ter contato, Remo soube sugar o que cada um tem de melhor. Hoje, sabe indicar onde cada um se encaixa em sua formação. Seja a professora Miriam, quem despertou seu interesse pela pesquisa, ainda com experimentos escolares com moscas, seja o Pomponet, com sua graciosidade e talento em casa, seja o doutor Stephen Drance, mentor maior. Em seu depoimento, além de"}, "PSCH_HV637_Remo Susanna_rev.docx": {"size_mb": 0.0453, "modified": "2017-12-15 07:08:58", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV637_Remo Susanna\\Textual\\PSCH_HV637_Remo Susanna_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História \nDepoimento de Remo Susanna\nEntrevistado por Carolina Margiotte\nSão Paulo, 27/11/2017\nRealização: Museu da Pessoa \nPSCH_HV637_Remo Susanna\nTranscrito por Karina Medici Barrella\nRevisado por Carolina Margiotte\n________________________________________________________________________\nP/1 – Doutor, boa tarde.\nR – Boa tarde.\nP/1 – Obrigado por estar aqui com a gente.\nR – O prazer é todo meu, Carol.\nP/1 – Encerrando esse ciclo de médicos com histórias incríveis que a gente tem escutado. E pra começar, o seu nome completo.\nR – É Remo Susanna Júnior.\nP/1 – Local e data de nascimento?\nR – São Paulo, 09 de abril de 1948.\nP/1 – E o senhor conhece a origem do seu nome? Por que seus pais deram?\nR – Vem do meu pai, que era Remo Susanna. Agora, acredito que seja em decorrência da origem italiana, existe o São Remo e existe a Santa Susana. Então acredito que esse nome, pra ele, veio dessas origens, uma vez que meus avós eram italianos, e daí ele passou o nome dele automaticamente pra mim, diretamente pra mim, só que ele colocou o Júnior, né, pra diferenciar.\nP/1 – E o nome dos seus pais?\nR – Meu pai é Remo Susanna e minha mãe Teresa de Jesus Susanna.\nP/1 – Então conta u"}, "folder_size_gb": 0.0}, "folder_size_gb": 7.577}, "PCSH_HV608_Carla Ferrari": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV608.mp4": {"size_mb": 250.1311, "modified": "2018-08-07 19:07:04", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV608_Carla Ferrari\\Audiovisual\\Vídeo\\Edição\\PCSH_HV608.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 138171.0, "duration": 138.17}, "folder_size_gb": 0.244}, "Íntegra": {"PCSH_HV608.mp4": {"size_mb": 13274.3813, "modified": "2017-08-21 21:39:56", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV608_Carla Ferrari\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV608.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 6831558.0, "duration": 6831.56}, "folder_size_gb": 12.963}, "folder_size_gb": 13.208}, "Áudio": {"PCSH_HV6 thumb_PCSH_HV608_MO001.jpg"}, "PCSH_HV608_MO002.JPG": {"size_mb": 1.28, "modified": "2017-08-22 06:13:42", "extension": "JPG", "full_path": "D:\\HD_Allergan\\PCSH_HV608_Carla Ferrari\\Iconográfico\\Making of\\PCSH_HV608_MO002.JPG", "category": "Image", "dimension": "2592x1728", "resolution": "2592x1728", "color_mode": "RGB", "dpi": "72 DPI", "thumbnail": "thumbnails/HD_0109/thumb_PCSH_HV608_MO002.jpg"}, "folder_size_gb": 0.003}, "folder_size_gb": 0.008}, "Textual": {"PCSH_HV608_Carla Ferrari_edi.docx": {"size_mb": 0.0089, "modified": "2018-01-18 03:06:16", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV608_Carla Ferrari\\Textual\\PCSH_HV608_Carla Ferrari_edi.docx", "category": "Textual", "content_preview": "Nome da história\nMãe presidente da Argentina\nMinibio\nCarla Ferrari nasceu em 09 de janeiro de 1975 em São Paulo (SP). É fruto do encontro de uma costureira de mão cheia com um vendedor, frequentador da confecção da jovem espanhola. Mais tarde, a presença e ajuda aos pais na loja foi o pontapé inicial para que a menina Carla se encontrasse na carreira de administração. Hoje, é diretora da área de Marketing e Vendas de Oftalmologia da Allergan.\nSinopse\nA dona Terezinha foi a primeira na escola a enxergar o potencial de Carla. Sempre reforçava sua crença: “Você é muito inteligente!” Mais tarde, foi a vez da professora Gildete, que apoiava a participação da aluna nas olimpíadas de matemática: “Você pode, você ainda vai fazer mais!”; incentivos que na cabeça de criança não fazem tanto sentido, mas que, quando adulto, são avaliados como muito importantes e decisivos. Ainda bem que existiram pois a vida adulta pesou a mão no caminho de Carla, dando a ela o poder de decisão para qual lado das bifurcações seguir. Começando com as aprovações nos estágios (aí, novamente, a maturidade mais tarde avaliando a escolha como certa), seguindo mais tarde para o “sim” na proposta de mudança de país. T"}, "PCSH_HV608_Carla Ferrari_rev.docx": {"size_mb": 0.0454, "modified": "2018-01-18 03:08:14", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV608_Carla Ferrari\\Textual\\PCSH_HV608_Carla Ferrari_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História \nDepoimento de Carla Ferrari\nEntrevistada por Carolina Margiotte e Luiz Egypto\nSão Paulo, 18/08/2017 \nRealização: Museu da Pessoa \nPCSH_HV608_Carla Ferrari\nTranscrito por Karina Medici Barrella\nRevisado e editado por Carolina Margiotte Grohmann\n_________________________________________________________________________\nP/1 – Carla, primeiro a gente quer agradecer a sua presença aqui, sua disponibilidade. E pra começar a gente quer que você fale o seu nome completo, o local e a sua data de nascimento.\nR – Carla do Campo Ferrari. Data de nascimento: 9 de janeiro de 1975, nascida em São Paulo.\nP/1 – Pra começar, os seus pais. A gente queria que você contasse um pouquinho sobre eles, o nome completo deles e o que eles fazem.\nR – A minha mãe chama Preciosa do Campo Ferrari (risos). Ela é espanhola. Ela tem uma história bem interessante, veio pra cá com 26 anos de idade, imigrante mesmo, fugida da guerra. Ela é costureira porque, na verdade, eles tinham essa formação lá, ela trabalhou em fazenda, meus avós têm fazenda ainda na Espanha até hoje e ela veio pra cá e começou a costurar. Ela virou empresária e abriu uma empresa e hoje ainda faz, minha mãe hoje está c"}, "folder_size_gb": 0.0}, "folder_size_gb": 13.318}, "PCSH_HV609_Paula Marques": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV609.mp4": {"size_mb": 232.4861, "modified": "2018-08-07 19:10:42", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV609_Paula Marques\\Audiovisual\\Vídeo\\Edição\\PCSH_HV609.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 129162.0, "duration": 129.16}, "folder_size_gb": 0.227}, "Íntegra": {"PCSH_HV609.mp4": {" il": "thumbnails/HD_0109/thumb_PCSH_HV609_MO002.jpg"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.057}, "Textual": {"PCSH_HV609_Paula Marques_edi.docx": {"size_mb": 0.0096, "modified": "2018-01-15 04:43:04", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV609_Paula Marques\\Textual\\PCSH_HV609_Paula Marques_edi.docx", "category": "Textual", "content_preview": "Nome da história\nOlha a portuguesa aí\nMinibio\nMaria Paula Marques nasceu em São Paulo no dia 31 de janeiro de 1965. A busca pela autonomia a levou para o trabalho ainda jovem, como secretária numa clínica médica. Apesar da facilidade com a escrita, o dom para a área de ciências a levou para Farmácia, trilhando uma carreira em indústrias farmacêuticas. Hoje, é Vice-Presidente de Assuntos Regulatórios da Allergan.\nSinopse\nPaula vive aquilo que acredita; sem medo, se entrega às suas crenças. É uma receita que só dá certo por elas serem, acima de tudo, um ode à bondade: ter esperança e buscar a realização dos sonhos. Não poderia ser diferente da sua vida profissional. Formada em Farmácia, Paula trabalha com produtos que são, por si, muitas vezes, a única esperança de muitos. Muito bem decidida, a história de Paula só reforça a imagem alto astral e determinada que ela sempre demonstra ser.\nTAGs\nfarmácia\nsala de aula\nescola\nmaternidade\nmãe\nremédio\nesperança\nsonho\namor\npaixão\nnamoro\nprofissão\nfamília\nEdição\nMe lembro da primeira aula de Física, quando o professor perguntava para cada um: “Qual a sua descendência?” Na minha vez: “Portuguesa e espanhola!” Ele respondeu: “Ih, essa aí além de"}, "PCSH_HV609_Paula Marques_rev.doc.docx": {"size_mb": 0.0462, "modified": "2018-01-18 15:08:38", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV609_Paula Marques\\Textual\\PCSH_HV609_Paula Marques_rev.doc.docx", "category": "Textual", "content_preview": "Projeto Conte Sua História\nDepoimento de Paula Marques\t\nEntrevistada por Luiz Egypto e Carolina Margiotte\nSão Paulo, 18/08/2017\nRealização: Museu da Pessoa\nPCSH_HV609_Paula Marques\nTranscrito por Liliane Custódio\nRevisado e editado por Carolina Margiotte\n__________________________________________________________________________\nP/1 – Boa tarde, Paula.\nR – Boa tarde.\nP/1 – Muito obrigado por ter aceitado o nosso convite, a gente tá muito feliz com isso.\nR – Obrigada pelo convite.\nP/1 – Pra começar, eu queria que você, por favor, nos dissesse o seu nome completo, o local e a data do seu nascimento.\nR – Bom, meu nome é Maria Paula Marques, eu nasci em São Paulo, capital, no dia 31 de janeiro de 1965.\nP/1 – O nome dos seus pais, por favor.\nR – Meu pai é Manuel Marques, português, e minha mãe é Margarida Alves Marques, nascida no Brasil, filha de espanhóis.\nP/1 – E o que eles faziam?\nR – Bom, meu pai estudou Química, curso técnico, mas toda vida ele trabalhou mais voltado à área de comércio. Grande parte da vida dele, ele trabalhou com fertilizantes, adubo, não na parte técnica, mas mais na parte comercial. E minha mãe trabalhou muito jovem como enfermeira, mas depois de casada nunca ma"}, "folder_size_gb": 0.0}, "folder_size_gb": 13.192}, "PCSH_HV610_Lika Matsumura": {"Audiovisual": {"Vídeo": {"Edição": {"PCSH_HV610.mp4": {"size_mb": 304.8087, "modified": "2018-08-07 19:15:08", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV610_Lika Matsumura\\Audiovisual\\Vídeo\\Edição\\PCSH_HV610.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 166333.0, "duration": 166.33}, "folder_size_gb": 0.298}, "Íntegra": {"PCSH_HV610.mp4": {"size_mb": 8456.6366, "modified": "2017-08-29 11:15:08", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV610_Lika Matsumura\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV610.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": " PCSH_HV610_Lika Matsumura_rev.docx", "category": "Textual", "content_preview": "Programa Conte Sua História \nDepoimento de Lika Matsumura\nEntrevistada por Carolina Margiotte e Luiz Egypto\nSão Paulo, 23/08/2017 \nRealização: Museu da Pessoa \nPCSH_HV610_Lika Matsumura\nTranscrito por Karina Medici Barrella\nRevisado e editado por Carolina Margiotte Grohmann\n_________________________________________________________________________\nP/1 – Lika, muito obrigada por estar aqui com a gente. Pra começar, o seu nome completo, o local e a data de nascimento.\nR – Meu nome completo é Geni Lika Matsumura. Eu nasci na cidade de Bela Vista do Paraíso, no norte do Paraná, em 19 de maio de 1968.\nP/1 – E você sabe por que seu nome, se tem algum significado?\nR – Eu sei (risos), vamos lá. Geni era uma miss muito famosa naquela época, não sei se era uma miss nissei, enfim, e meus pais quiseram adotar esse nome. Lika é um nome japonês, é meu segundo nome, e o candi com que escreve esse nome, é o candi que se escreve a palavra “flor de pêra” em japonês. Matsumura é o meu sobrenome, Matsu quer dizer “pinheiro” e “mura”, “vila”. Então essa é a história do meu nome e do meu sobrenome: Matsumura, Vila dos Pinheiros, Vila dos Pinhais, e Lika quer dizer flor de pêra.\nP/1 – Que bonito!\nR – E Ge"}, "PCSH_HV610_Lika Matsumura_edi.docx": {"size_mb": 0.0086, "modified": "2018-01-18 16:07:32", "extension": "DOCX", "full_path": "D:\\HD_Allergan\\PCSH_HV610_Lika Matsumura\\Textual\\PCSH_HV610_Lika Matsumura_edi.docx", "category": "Textual", "content_preview": "Nome da história\nA flor de pêra da Vila dos Pinheiros\nMinibio\nLika Matsumura nasceu em Bela Vista do Paraíso, norte do Paraná, em 19 de maio de 1968. Os cursos de datilografia e inglês foram o pontapé inicial na carreira de Lika, que ao passar na graduação de Letras, já foi requisitada para dar aulas para adultos. Mais tarde, inicia sua caminhada na indústria farmacêutica, onde atua até hoje. É mãe de dois meninos, o Ian e o Artur.\nSinopse\nLika é uma pessoa doce. Se é influência do nome - em japonês, Lika significa “flor de pera” - ou pela trajetória tão precoce de luta, não importa. Lika é doce e isso basta. Nascida no norte do Paraná, a ida para Lins é motivada principalmente pela descoberta de uma lesão cerebral na então menina. A infância cercada por cuidados é lembrada com carinho até hoje e a motiva a trabalhar com afinco na Allergan, indústria farmacêutica: oferecer qualidade de vida para famílias que precisam, assim como ela já precisou, é de uma importância e responsabilidade enorme.\nTAGs\nmiss\nnome\njaponês\njapones\nlesão cerebral\nmédico\nmedicina\nindústria\ninfância\nEdição\nGeni foi uma miss muito bonita e meus pais quiseram adotar esse nome pra mim. Lika é um nome japonês que"}, "folder_size_gb": 0.0}, "folder_size_gb": 8.677}, "PCSH_HV617_Newton Diniz": {"Audiovisual": {"Áudio": {"PCSH_HV617_Newton Diniz.mp3": {"size_mb": 68.8307, "modified": "2017-08-31 05:45:38", "extension": "MP3", "full_path": "D:\\HD_Allergan\\PCSH_HV617_Newton Diniz\\Audiovisual\\Áudio\\PCSH_HV617_Newton Diniz.mp3", "category": "Audio", "audio_channels": "Stereo", "audio_codec": "MPEG Audio", "duration_ms": 4509936.0, "duration": 4509.94}, "folder_size_gb": 0.067}, "Vídeo": {"Edição": {"PCSH_HV617.mp4": {"size_mb": 352.6857, "modified": "2018-08-08 09:22:48", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV617_Newton Diniz\\Audiovisual\\Vídeo\\Edição\\PCSH_HV617.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "AVC", "audio_channels": "Stereo", "audio_codec": "AAC", "duration_ms": 190991.0, "duration": 190.99}, "folder_size_gb": 0.344}, "Íntegra": {"PCSH_HV617.mp4": {"size_mb": 4466.7057, "modified": "2017-11-09 23:41:38", "extension": "MP4", "full_path": "D:\\HD_Allergan\\PCSH_HV617_Newton Diniz\\Audiovisual\\Vídeo\\Íntegra\\PCSH_HV617.mp4", "category": "Video", "dimension": "1920x1080", "aspect_ratio": "16:9 (HD)", "frame
