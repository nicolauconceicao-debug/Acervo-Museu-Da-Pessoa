ar. Desde que chegou, trabalhou na indústria farmacêutica pois tinha cursado, em Portugal Química Industrial. O primeiro trabalho que prestou para a EMS foi ainda no tempo do Sr. Emiliano, quando o ajudou a montar uma fábrica de hipodermia no Paraná e foi chamado a voltar para a empresa já pela voz do Sr. Carlos quando vendia o maquinário do laboratório onde trabalhava que havia falido. Com a proposta de ajudar a empresa a deslanchar, Augusto aceitou o desafio e está há 23 na EMS cuidando sempre da área de Produção e, agora, compondo o Conselho.\nSINOPSE\nNatural de Portugal, Augusto Viseu Fernandes conta como foi a infância pelos campos de seu país natal, onde o pai era açougueiro. Com a gana de trabalhar e d"}, "folder_size_gb": 0.0}, "folder_size_gb": 23.78}, "EMS_HV002": {"Audiovisual": {"Acesso": {"EMS_HV002.MOV": {"size_mb": 61361.0574, "modified": "2013-11-20 15:26:36", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV002\\Audiovisual\\Acesso\\EMS_HV002.MOV", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3650551.0, "duration": 3650.55, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 59.923}, "Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0625, "modified": "2013-11-19 10:22:24", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV002\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-11-19 10:22:24", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV002\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"INDEX.BDM": {"size_mb": 0.0006, "modified": "2013-11-19 10:22:24", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV002\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\INDEX.BDM", "category": "Other"}, "MOVIEOBJ.BDM ente do, agora, multinacional e maior laboratório brasileiro, EMS.\nSINOPSE\nNatural de Fernando Prestes, no interior de São Paulo, Luiz Carlos Borgonovi conta como foi a infância na cidade, com muitas brincadeiras de rua e os primeiros estudos no grupo escolar onde o pai era o servente. Ainda criança foi com a irmã mais velha continuar as aulas e quando pode, voltou a cidade nat"}, "folder_size_gb": 0.0}, "folder_size_gb": 66.88}, "EMS_HV003": {"Audiovisual": {"Acesso": {"EMS_HV003.MOV": {"size_mb": 54753.1824, "modified": "2013-11-20 16:08:32", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV003\\Audiovisual\\Acesso\\EMS_HV003.MOV", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3349816.0, "duration": 3349.82, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 53.47}, "Preservação": {"private": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0469, "modified": "2013-11-19 13:07:24", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV003\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-11-19 13:07:24", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV003\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"index.bdm": {"size_mb": 0.0006, "modified": "2013-11-19 13:07:24", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV003\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\index.bdm", "category": "Other"}, "MOVIEOBJ.BDM": {"size_mb": 0.0001, "modified": "2013-11-19 12:10:04", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV003\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\MOVIEOBJ.BDM", "category": "Other"}, "CLIPINF": {"00000.CPI": {"size_mb": 0.0007, "modified": "2013-11-19 12:36:26", "extension": "CPI", "full_path": "D:\\EMS\\EMS_HV003\\Audiovi . Foi assim que conseguiu ingressar na EMS, então Nature’s Plus. Começou trabalhando na área de segurança mas dava apoio às atividades do Departamento Pessoal, quando precisavam. Rubens Alves segue na EMS, zelando pela segurança patrimonial e atualmente é o responsável por todos os sites da empresa. Rubens, depois de separado, formou outra família que tem duas enteadas e um casal de filhos com a primeira esposa.\nSINOPSE\nNatural do interior de São Paulo, Rubens narra como foi"}, "folder_size_gb": 0.0}, "folder_size_gb": 52.62}, "EMS_HV005": {"Audiovisual": {"Acesso": {"EMS_HV005.mov": {"size_mb": 60341.1211, "modified": "2013-12-07 13:49:22", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV005\\Audiovisual\\Acesso\\EMS_HV005.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3627194.0, "duration": 3627.19, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 58.927}, "Preservação": {"private": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0469, "modified": "2013-11-22 13:52:54", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV005\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-11-22 13:52:54", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV005\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"index.bdm": {"size_mb": 0.0006, "modified": "2013-11-22 13:58:06", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV005\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\index.bdm", "category": "Other"}, "MOVIEOBJ.BDM": {"size_mb": 0.0001, "modified": "2013-11-22 12:55:42", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV005\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\MOVIEOBJ.BDM", "category": "Other"}, "CLIPINF": {"00000.CPI": {"size_mb": 0.00 laudia Lucena\nRevisado por Fernanda P. Prado\n\tMW Transcrições\nP/1 – Siomara, boa tarde.\nR – Boa tarde.\nP/1 – Primeiro, gostaria de agradecer de você ter aceitado o convite pra essa entrevista e pra começar eu queria que você falasse pra gente o seu nome completo, o lugar onde você nasceu e a data do seu nascimento.\nR – Meu nome é Siomara de Oliveira Capodifóglio, eu nasci em Jundiaí, minha data de nascimento é cinco de julho de 1965.\nP/1 – Fala pra gente o nome dos seus pais.\nR – João Osvaldo Fernandes de Oliveira e Maria Celeste Buzzo Fernandes de Oliveira.\nP/1 – Eles também eram de Jundiaí?\nR – Não, de Rio Claro.\nP/1 – Você sabe um pouquinho da história da sua família, como os seus pais se conheceram?\nR – Meus pais se conheceram numa rua central de Rio Claro, minha mãe morava num curtume em Rio Claro, meu pai morava na roça. O meu avô tinha um sítio, ele morava lá e todo o final de semana eles iam dessa rua central e os homens ficavam na calçada e as mulher"}, "folder_size_gb": 0.0}, "folder_size_gb": 65.867}, "EMS_HV006": {"Audiovisual": {"Acesso": {"EMS_HV006.mov": {"size_mb": 78098.4382, "modified": "2013-12-08 02:05:04", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV006\\Audiovisual\\Acesso\\EMS_HV006.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4412446.0, "duration": 4412.45, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 76.268}, "Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0781, "modified": "2013-11-25 09:46:00", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV006\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-11-25 09:46:00", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV006\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TID", "cat  P. Prado\nHortolândia, 25 de novembro de 2013\nRealização Museu da Pessoa\nEMS_HV006_Silvia Rezende Valin\nTranscrito por Ana Carolina Ruiz\t\nRevisado por Fernanda P. Prado\n\tMW Transcrições\nMINIBIOGRAFIA\nSilvia Rezende Valin nasceu em São Bernardo do Campo (SP), no dia 16 de junho de 1966. Com mais duas irmãs, Silvia cresceu, brincou e estudou com o apoio da família mas a separação dos pais quando ela tinha 13 anos marcou. Foi uma ruptura de uma estrutura de vida e uma fase de amadurecimento. O pai foi morar em Lins (SP) e todas as meninas ficaram com a mãe e tiveram que assumir algumas responsabilidades. Silvia, então, começou a trabalhar, sua primeira atividade foi num escritório de contabilidade. De lá, não parou mais. Fez o curso técnico de secretariado, o superior de administração. Trabalhou por nove anos no Uemura, depois na empresa do tio e em outra empresa por um breve período. 1996 também foi um ano marcante para Silvia, que era casada e tinha uma filha. Um assalto a tornou viúva. Na sequencia conseguiu voltar a trabalhar e ingressou na área administrativa da EMS, onde acompanhou as transformaçõ"}, "folder_size_gb": 0.0}, "folder_size_gb": 84.726}, "EMS_HV007": {"Audiovisual": {"Acesso": {"EMS_HV007.mov": {"size_mb": 68016.3, "modified": "2013-12-07 20:34:24", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV007\\Audiovisual\\Acesso\\EMS_HV007.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4159760.0, "duration": 4159.76, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 66.422}, "Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.1406, "modified": "2013-11-26 15:53:20", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV007\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013- r, Carlos Sanches. Cargo em que é desafiada cotidianamente até hoje.\nSINOPSE\nNatural de"}, "folder_size_gb": 0.0}, "folder_size_gb": 96.836}, "EMS_HV009": {"Audiovisual": {"Acesso": {"EMS_HV009.mov": {"size_mb": 103390.4356, "modified": "2013-12-08 02:59:50", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV009\\Audiovisual\\Acesso\\EMS_HV009.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 6074708.0, "duration": 6074.71, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 100.967}, "Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.1406, "modified": "2013-11-26 15:53:20", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV009\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-11-27 15:23:34", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV009\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"INDEX.BDM": {"size_mb": 0.0006, "modified": "2013-11-27 15:23:36", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV009\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\INDEX.BDM", "category": "Other"}, "MOVIEOBJ.BDM": {"size_mb": 0.0001, "modified": "2013-11-27 15:22:46", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV009\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\MOVIEOBJ.BDM", "category": "Other"}, "CLIPINF": {"00000.CPI": {"size_mb": 0.0007, "modified": "2013-11-26 09:28:22", "extension": "CPI", "full_path": "D:\\EMS\\EMS_HV009\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\CLIPINF\\00000.CPI", "category": "Other"}, "00001.CPI": {"size_mb": 0.0192, "modified": "2013-11-26 09:28:22", "extension": "CPI", "full_path": "D:\\EMS\\EMS_HV009\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\CLIPINF\\00001.CPI", "category": "O é os seis anos um sítio, até que seus pais montaram um empreendimento no centro de sua cidade natal que o deixou um apelido que carrega até hoje, “Zé do Bar”. Ainda pequeno ajudou os pais no bar e estudou até o final do atual Ensino Fundamental na cidade e o Médio, antes conhecido como “Ensino Normal” na cidade vizinha Santa Adélia. Zé do Bar conta como foi sua vinda a São Paulo para morar com o irmão mais velho, sem sucesso, foi para Catanduva, o que também não deu certo até que em Fernando Prestes mesmo foi co"}, "folder_size_gb": 0.0}, "folder_size_gb": 71.09}, "EMS_HV011": {"Audiovisual": {"Acesso": {"EMS_HV011.mov": {"size_mb": 50282.3569, "modified": "2013-12-08 08:38:53", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV011\\Audiovisual\\Acesso\\EMS_HV011.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 2962362.0, "duration": 2962.36, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 49.104}, "Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0312, "modified": "2013-11-28 14:02:46", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV011\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-11-28 14:02:46", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV011\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"INDEX.BDM": {"size_mb": 0.0006, "modified": "2013-11-28 14:14:24", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV011\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\INDEX.BDM", "category": "Other"}, "MOVIEOBJ.BDM": {"size_mb": 0.0001, "modified": "2013-11-28 13:24:28", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV011\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\MOVIEOBJ.BDM", "category": "Other"}, "CLIP SP), no dia 12 de outubro de 1951. Laura passou a infância em diversas cidades do interior de São Paulo por conta do emprego do pai até que a família fixou residência na capital, onde terminou os estudos. Laura trabalhou em diversos empregos e, depois de casada, ainda arrumava tempo para ajudar o marido que tinha uma gráfica que imprimia bulas e rótulos para a EMS. Laura formou-se em Biblioteconomia o que permitiu que ela ingressasse na EMS como funcionária do CEDOC. Laura participou também da implantação do Memorial, onde trabalhou até sua aposentadoria.\nSINOPSE\nNascida em São Paulo, Laura passou a infância em diversas cidades do interior por conta do emprego do pai na rede ferroviária. Por conta de um erro médico, conviveu – e convive – com uma deficiência física que não a impediu de nada. Teve uma infância normal e buscou sua independência financeira e sempre estava disposta, mesmo que com filhos e"}, "folder_size_gb": 0.0}, "folder_size_gb": 92.352}, "EMS_HV014": {"Audiovisual": {"Acesso": {"EMS_HV014.mov": {"size_mb": 53595.7364, "modified": "2013-12-07 22:00:41", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV014\\Audiovisual\\Acesso\\EMS_HV014.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3253453.0, "duration": 3253.45, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 52.34}, "Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0625, "modified": "2013-12-02 13:36:26", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV014\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-12-02 13:36:26", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV014\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"index.bdm": {"size_ 456x5184"}, "EMS_HV016_FT006.jpg": {"size_mb": 0.298, "modified": "2013-12-08 23:46:04", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV016\\Fotos\\Baixa\\EMS_HV016_FT006.jpg", "category": "Image", "duration_ms": 0, "dimension": "3456x5184", "height": 5184, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3456x5184"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.01}, "Textual": {"EMS_HV016.docx": {"size_mb": 0.0255, "modified": "2014-01-20 09:20:35", "extension": "DOCX", "full_path": "D:\\EMS\\EMS_HV016\\Textual\\EMS_HV016.docx", "category": "Textual", "content_preview": "EMS – 50 anos de Memórias\nDepoimento de Vinzenz Plörer\nEntrevistado por Fernanda P. Prado\nHortolândia, 05 de dezembro de 2013. \nRealização Museu da Pessoa \nEMS_HV016_Vinzenz Plörer\nTranscrito por Karina Medici Barrella\nMW Transcrições\nMINIBIOGRAFIA\nVinzenz Plörer nasceu em em Mötz, Tirol (Áustria), no dia três de novembro de 1960. É o segundo de quatro filhos e cresceu num período da reconstrução europeia pós segunda guerra mundial. Estudou economia e logo que terminou a faculdade ingressou na indústria farmacêutica. Trabalhou na Coreia, no Equador, na Alemanha, em Buenos Aires e no Brasil. Atualmente é o diretor-presidente da Brace Pharma, empresa do grupo EMS que está investindo na produção de medicamentos inovadores nos Estados Unidos.\nSINOPSE\nNatural da Áustria, Vinzenz é o segundo de quatro filhos e cresceu num período da reconstrução europeia pós segunda guerra mundial. Quando criança, tinha o sonho de ser aviador e, por isso, fez os cursos de aviação só que não entrou como piloto no exército, então seguiu a carreira de economista. Depois da faculdade, Vinzenz conta como foram os primeiros anos de trabalho e de conhecimento da indústria farmacêutica. Vinzenz conta também os d"}, "folder_size_gb": 0.0}, "folder_size_gb": 91.667}, "EMS_HV017": {"Audiovisual": {"Acesso": {"EMS_HV017.mov": {"size_mb": 114792.1315, "modified": "2013-12-08 05:15:40", "extension": "MO ite e Beatriz Siqueira dos Santos.\nP/1 – Tá. Fala um pouquinho do que você sabe da origem da sua família, se você conheceu seus avôs.\nR – Conheci. Eu fui criado pela minha bisavó Rita, ela que me deu os primeiros dez anos da minha vida, e foram muito importantes pra mim.\nP/1 – E essa bisavó é avó da sua mãe?\nR – É avó da mãe da minha mãe... Minha bisavó é mãe da mãe da minha mãe.\nP/1 – Tá. E ela também é do Rio de Janeiro?\nR – Ela é portuguesa.\nP/1 – Portuguesa?\nR – Isso.\nP/1 – Tá certo. E como era o convívio com ela? Você tinha outros irmãos?\nR – Na realidade, mi"}, "folder_size_gb": 0.0}, "folder_size_gb": 133.006}, "EMS_HV018": {"Audiovisual": {"Acesso": {"EMS_HV018.mov": {"size_mb": 54831.83, "modified": "2013-12-08 04:21:40", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV018\\Audiovisual\\Acesso\\EMS_HV018.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3300667.0, "duration": 3300.67, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 53.547}, "Preservação": {"private": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0312, "modified": "2013-12-05 14:56:48", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV018\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-12-05 14:56:48", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV018\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"index.bdm": {"size_mb": 0.0006, "modified": "2013-12-05 15:16:18", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV018\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\index.bdm", "category": "Other"}, "MOVIEOBJ.BDM": {"size_mb": 0.0001, "modified": "2013-12-05 14:21:12", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV018\\Audiovisual\\Preservação\\p ssa entrevista. Queria que você falasse pra gente o seu nome completo, o local e a data do seu nascimento.\nR – Meu nome é Ana Silvia da Costa, nasci em São Paulo. E a data de nascimento? No dia sete de novembro de 1963.\nP/1 – Tá certo, Ana. E fala pra gente o nome dos seus pais.\nR – Meu pai se chama João José da Costa. Minha mãe Geni Raposo da Costa.\nP/1 – Tá. Fala pra gente um pouquinho o que você sabe da origem da família, da onde que são seus ascendentes.\nR – Os meus pais são descendentes de portugueses, os meus avós nasceram lá. Pro lado da minha mãe eram famílias mais humildes, né? Famílias de comerciantes. O meu pai começou como office boy até prosseguir numa carreira executiva.\nP/1 – E onde que o seu pai trabalhou?\nR – Meu pai trabalhou em empresas multinacionais. Ele foi fundador da HP no Brasil na área de Recursos Humanos, que é a área que eu at"}, "folder_size_gb": 0.0}, "folder_size_gb": 59.817}, "EMS_HV019": {"Audiovisual": {"Acesso": {"EMS_HV019.mov": {"size_mb": 78475.2308, "modified": "2013-12-08 03:59:22", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV019\\Audiovisual\\Acesso\\EMS_HV019.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4689156.0, "duration": 4689.16, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 76.636}, "Preservação": {"private": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0938, "modified": "2013-12-06 08:58:02", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV019\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-12-06 08:58:02", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV019\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"INDEX.BDM": {"size_mb": 0.0006, "modified": "2013-12-06 09:34 atualmente é secretária do Jurídico, um setor de grande visibilidade dentro do grupo.\nSINOPSE\nNascida em Santo André, Salete cresceu, brincou e estudou na cidade. Foi lá também onde começou a trabalhar aos 15 anos. Salete conta em seu depoimento sobre as atividades que exerceu e pelas empresas pelas quais passou. Salete se casou, teve uma filha e parou de trabalhar. Salete conta também"}, "folder_size_gb": 0.0}, "folder_size_gb": 87.888}, "EMS_HV021": {"Audiovisual": {"Acesso": {"EMS_HV021.mov": {"size_mb": 104143.4479, "modified": "2013-12-18 08:57:02", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV021\\Audiovisual\\Acesso\\EMS_HV021.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 5915282.0, "duration": 5915.28, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 101.703}, "Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0469, "modified": "2013-12-09 15:35:52", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV021\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-12-09 15:35:52", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV021\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"INDEX.BDM": {"size_mb": 0.0006, "modified": "2013-12-09 16:02:52", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV021\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\INDEX.BDM", "category": "Other"}, "MOVIEOBJ.BDM": {"size_mb": 0.0001, "modified": "2013-12-09 14:23:28", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV021\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\MOVIEOBJ.BDM", "category": "Other"}, "CLIPINF": {"00000.CPI": {"size_mb": 0.0007, "modified": "2013-12-09 14:57:10", "extension": "CPI", "full_path": "D:\\EMS\\EMS_HV ontent_preview": "EMS – 50 anos de Memória\nDepoimento de Israel Domingos Bacas\nEntrevistado por Fernanda P. Prado\nHortolândia, 09 de dezembro de 2013. \nRealização Museu da Pessoa \nEMS_HV021_Israel Domingos Bacas\nTranscrito por Karina Medici Barrella\nRevisado por Fernanda P. Prado\nMW Transcrições\nMINIBIOGRAFIA\nIsrael Domingos Bacas nasceu em Santo André (SP), no dia quatro de fevereiro de 1963. Filho único de pai espanhol e mãe brasileira, Israel aprendeu desde jovem os valores da família e começou a trabalhar cedo para conseguir fazer sua faculdade. Ingressou numa gráfica, trabalhando no chão de fábrica e o sonho era o trabalho no escritório, sem sujeira e com ar-condicionado. Cursou Administração e Economia e trabalhou de madrugada num Banco e ingressou na indústria farmacêutica na Anakol. Depois de 12 anos, foi convidado a trabalhar na indústria nacional e desde então trabalha na EMS onde atualmente é o Vice Presidente de Controladoria e Finanças.\nSINOPSE\nNascido em Santo André, Israel narra como foi a infância em sua cidade natal, com suas brincadeiras e amigos. Israel conta também como foi seu processo de formação escolar. Além dos esportes, Israel também gostava da área de exatas, fator esse qu"}, "folder_size_gb": 0.0}, "folder_size_gb": 112.291}, "EMS_HV022": {"Audiovisual": {"Acesso": {"EMS_HV022.mov": {"size_mb": 60545.6118, "modified": "2013-12-18 09:24:46", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV022\\Audiovisual\\Acesso\\EMS_HV022.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3539506.0, "duration": 3539.51, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 59.127}, "Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0469, "modified": "2013-12-10 10:02:02", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV022\\Audiovisual\\Preservação\\PRI V022.docx": {"size_mb": 0.0245, "modified": "2014-01-20 09:20:36", "extension": "DOCX", "full_path": "D:\\EMS\\EMS_HV022\\Textual\\EMS_HV022.docx", "category": "Textual", "content_preview": "EMS – 50 anos de memória\t\nDepoimento de José Orlando de Souza\nEntrevistado por Fernanda Prado\nHortolândia 10/12/2013\nRealização Museu da Pessoa\nEMS_HV22_José Orlando de Souza\nTranscrito por Liliane Custódio\t\nMW Transcrições\nMINIBIOGRAFIA\nJosé Orlando de Souza nasceu em Cristais Paulista (SP), no dia seis de maio de 1940. Viveu até os seis anos na fazenda e com sete a família mudou-se para Goiás. Todos voltaram a Franca quando Orlando tinha 14 anos, lá estudou e fez faculdade em Ribeirão Preto. Orlando trabalhou com vendas de eletrodomésticos e fogões a gás. Resolveu tentar a vida em São Paulo quando já era casado e tinha sua filha mais velha. Trabalhou em diversas empresas sempre na área de administração e controladoria e foi chamado para entrar na EMS em 1987 onde está até hoje como conselheiro e Vice Presidente Estatutário da EMS Participações\nSINOPSE\nNascido em Cristais Paulista, passou a infância no sítio, depois com a família mudaram para a cidade e, em seguida, para Goiás, onde o pai trabalhava com criação – compra e venda – de gado. Lá foi onde nasceram seus outros irmãos. Orlando é o terceiro, de nove filhos. De Goiás, a família mudou para Franca visando uma melhor educação"}, "folder_size_gb": 0.0}, "folder_size_gb": 66.005}, "EMS_HV023": {"Audiovisual": {"Acesso": {"EMS_HV023.mov": {"size_mb": 67658.3705, "modified": "2013-12-18 09:58:09", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV023\\Audiovisual\\Acesso\\EMS_HV023.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 4061128.0, "duration": 4061.13, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 66.073}, "Preservação": {"private": { e a passagem da administração do Senhor Emiliano Sanchez ao seu filho Carlos. Aposentou-se como supervisora de embalagem de sólidos.\nSINOPSE\nNatural de Araponga, Tereza conta o quão arteira foi na infância enquanto vivia numa casa humilde, de madeira, de chão de terra batida. Tereza conta como a vinda da família para Santo André, onde, por muitas vezes, foi cuidada pelo Senhor Emiliano na Farmácia"}, "folder_size_gb": 0.0}, "folder_size_gb": 105.829}, "EMS_HV025": {"Audiovisual": {"Acesso": {"EMS_HV025.mov": {"size_mb": 118382.4592, "modified": "2013-12-18 13:59:03", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV025\\Audiovisual\\Acesso\\EMS_HV025.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 7175008.0, "duration": 7175.01, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 115.608}, "Preservação": {"private": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0625, "modified": "2013-12-13 09:23:36", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV025\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2013-12-13 09:23:36", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV025\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"index.bdm": {"size_mb": 0.0006, "modified": "2013-12-13 09:56:52", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV025\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\index.bdm", "category": "Other"}, "MOVIEOBJ.BDM": {"size_mb": 0.0001, "modified": "2013-12-13 09:56:52", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV025\\Audiovisual\\Preservação\\private\\AVCHD\\BDMV\\MOVIEOBJ.BDM", "category": "Other"}, "CLIPINF": {"00000.CPI": {"size_mb": 0.0007, "modified": "2013-12-13 07:59:06", "extension": "CPI", "full_path": "D: , "dimension": "3456x5184", "height": 5184, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3456x5184"}, "folder_size_gb": 0.002}, "folder_size_gb": 0.037}, "Textual": {"EMS_HV025.docx": {"size_mb": 0.0998, "modified": "2014-01-14 09:42:48", "extension": "DOCX", "full_path": "D:\\EMS\\EMS_HV025\\Textual\\EMS_HV025.docx", "category": "Textual", "content_preview": "EMS – 50 anos de Memória\nDepoimento de Kleber Fabiano Ruiz\nEntrevistado por Fernanda P. Prado\nSão Bernardo do Campo, 13/12/2013. \nRealização Museu da Pessoa \nEMS_HV025_Kleber Fabiano Ruiz\nTranscrito por Karina Medici Barrella\nMW Transcrições\nP/1 – Kleber, bom dia.\nR – Bom dia.\nP/1 – Primeiro eu gostaria de agradecer de você ter aceitado o convite para essa entrevista. E pra gente começar eu queria que você falasse o seu nome completo, o lugar onde você nasceu e a data do seu nascimento.\nR – Obrigado pelo convite, pra mim é um privilégio participar desse evento. Meu nome é Kleber Fabiano Ruiz, eu nasci em São Bernardo do Campo em 12 do três de 75.\nP/1 – Fala pra gente o nome dos seus pais.\nR – Meu pai é Valmir Ruiz e minha mãe é Benedita Gonzaga Ruiz.\nP/1 – E o que você sabe da origem da família?\nR – O meu pai é descendente de italiano com espanhol, meu avô era italiano e minha avó era espanhola. Minha mãe é mineira, filha de mineiro. O meu pai veio pra cá bem novinho, meu pai era gêmeos, o irmão dele faleceu e eles são em 14 irmãos, quatro deles morreram. Minha mãe também, ela é a décima segunda, eles são em 13. Naquela época tinha bastante filhos, né? Eles se conheceram em Promiss"}, "folder_size_gb": 0.0}, "folder_size_gb": 129.37}, "EMS_HV026": {"Audiovisual": {"Acesso": {"EMS_HV026.mov": {"size_mb": 76899.2108, "modified": "2013-12-18 13:00:28", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV026\\Audiovisual\\Acesso\\EMS_HV026.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes" : {"EMS_HV026.doc": {"size_mb": 0.1182, "modified": "2014-01-14 09:42:42", "extension": "DOC", "full_path": "D:\\EMS\\EMS_HV026\\Textual\\EMS_HV026.doc", "category": "Textual"}, "EMS_HV026.docx": {"size_mb": 0.0322, "modified": "2026-02-23 16:50:08", "extension": "DOCX", "full_path": "D:\\EMS\\EMS_HV026\\Textual\\EMS_HV026.docx", "category": "Textual", "content_preview": "EMS – 50 anos de memória\t\nDepoimento de Marineide Maria Ferreira\nEntrevistada por Fernanda P. Prado\nSão Bernardo do Campo 13/12/2013\nRealização Museu da Pessoa\nEMS_HV026_Marineide Maria Ferreira\nTranscrito por Ana Carolina Ruiz\t\n\tMW Transcrições\nP/1 – Marineide, boa tarde.\nR – Boa tarde.\nP/1 – Primeiro gostaria de agradecer de você ter aceitado o convite pra essa entrevista. E agora, pra gente começar, eu queria que você repetisse pra gente o seu nome completo, o lugar onde você nasceu e a data do seu nascimento.\nR – Meu nome é Marineide Maria Ferreira, eu nasci em Bonito de Santa Fé, na Paraíba, dia 25 de janeiro de 1969.\nP/1 – Tá certo. Fala o nome dos seus pais, Marineide.\nR – Minha mãe é Amélia Maria Ferreira, meu pai é Eliseu Ferreira Neto.\nP/1 – Conta pra gente da atividade deles. O que seus pais faziam?\nR – Meus pais eram agricultores lá na Paraíba. Eles vieram pra cá, trabalharam de operário. Ele trabalhou na Rhodia, minha mãe trabalhou no Senai, hoje eles são aposentados.\nP/1 – Tá. E a sua família toda é de lá?\nR – Da Paraíba?\nP/1 – Da Paraíba.\nR – Isso. \nP/1 – De Bonito de Santa Fé?\nR – De Bonito de Santa Fé.\nP/1 – E você nasceu lá?\nR – Nasci lá em Bonito de Santa Fé.\nP/1"}, "folder_size_gb": 0.0}, "folder_size_gb": 83.895}, "EMS_HV027": {"Audiovisual": {"Acesso": {"EMS_HV027.mov": {"size_mb": 72546.9451, "modified": "2013-12-18 14:27:32", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV027\\Audiovisual\\Acesso\\EMS_HV027.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRe : {"size_mb": 0.0376, "modified": "2026-02-23 16:50:12", "extension": "DOCX", "full_path": "D:\\EMS\\EMS_HV027\\Textual\\EMS_HV027.docx", "category": "Textual", "content_preview": "EMS 50 Anos de Memória\nDepoimento de Luiz Fernando Dias\nEntrevistado por Fernanda Prado\nHortolândia, 16 de Dezembro de 2013.\nRealização Museu da Pessoa. \nEMS_HV027_Luiz Fernando Dias\nTranscrito por Iara Gobbo.\nMW Transcrições\nP/1 – Bom dia primeiro. \nR – Bom dia Fernanda.\nP/1 – Pra gente começar eu queria que você falasse pra gente o seu nome completo, o local e a data do seu nascimento.\nR – Meu nome é Luiz Fernando Dias, e eu nasci em São Paulo em 19 de Dezembro de 1955. Completo essa semana 58 anos.\nP/1 – E fala pra gente o nome dos seus pais.\nR – Meu pai se chama João Batista Dias e minha mãe Gildaci Noronha Gonçalves Dias. Minha mãe é cearense e meu pai é mineiro.\nP/1 – E conta pra gente então um pouquinho dessa origem então tão brasileira.\nR – São brasileiros e graças a Deus, vivos. O meu pai veio pra São Paulo trabalhar, quando garoto ainda e a família da minha mãe, como a maioria dos nordestinos vieram também pra São Paulo e eles se conheceram. E minha mãe veio, evidentemente criança ainda, muito pequenininha, então ela não tem muito da cultura do nordestino. E se conheceram, se casaram, foram morar em Minas. Eu morei um tempo em Minas também.\nP/1 – Em que lugar em Minas?\nR"}, "folder_size_gb": 0.0}, "folder_size_gb": 79.051}, "EMS_HV028": {"Audiovisual": {"Acesso": {"EMS_HV028.mov": {"size_mb": 53968.489, "modified": "2014-02-13 23:07:30", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV028\\Audiovisual\\Acesso\\EMS_HV028.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3224558.0, "duration": 3224.56, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 52.704}, "Preservação": {"private": {"AVCHD": MS 50 Anos de Memória\nDepoimento de Fernando dos Santos\nEntrevistado por Fernanda Prado\nHortolândia, 27/01/2013\nEMS_HV028_Fernando dos Santos\nRealização Museu da Pessoa\nTranscrito por Mariana Wolff\n\tMW Transcrições\nP/1 –  Fernando, bom dia.\nR – Bom dia.\nP/1 – Primeiro, eu gostaria de agradecer de você ter aceitado o convite e conseguido ter vindo aqui para essa entrevista.\nR – Eu que agradeço, obrigado.\nP/1 – E ai, pra gente começar, eu queria que você falasse pra gente o seu nome completo.\nR –  Meu nome completo é Luiz Fernando Barbosa dos Santos.\nP/1 – Tá certo. E agora, o dia que você nasceu e a data do seu nascimento.\nR – Eu nasci dia 11 de fevereiro de 67.\nP/1 – E onde que você nasceu? Em que lugar?\nR – Em Rio Grande, Rio Grande do Sul.\nP/1 – Fala pra gente o nome dos seus pais também.\nR – Oscar Rodrigues dos Santos e Beatriz Barbosa dos Santos.\nP/1 – Conta pra gente o que você sabe da origem da sua família, né, da onde que vieram os seus avós, né, como é que…\nR – Meus pais são todos do Rio Grande do Sul, do interior do Rio Grande do Sul, fui criado lá até os 18 anos, né, e depois, vim pra Campinas, interior de São Paulo.\nP/1 – E você conheceu os seus avós?\nR – Meus avós eu n"}, "folder_size_gb": 0.0}, "folder_size_gb": 58.944}, "EMS_HV029": {"Audiovisual": {"Acesso": {"EMS_HV029.mov": {"size_mb": 52072.3025, "modified": "2014-02-14 00:00:10", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV029\\Audiovisual\\Acesso\\EMS_HV029.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3142142.0, "duration": 3142.14, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 50.852}, "Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0625, "modified": "2014-01-28 08:13:56", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV029\\Audiovisual\\Preservação\\PRIVATE\\AV ivi toda a minha vida em Santo André, nasci em três de agosto de 1953.\nP/1 – Tá certo. Fala pra gente o nome dos seus pais, Francisco.\nR – Meu pai é José Francisco Ricci, 84 anos, a mamãe já é falecida, chamava-se Irma Ricci.\nP/1 – Tá, fala pra gente o que o senhor sabe da ascendência da família, né, da onde que são…\nR – Sim, são os dois lados vieram da região do Veneto, né, da Itália, né, eles chegaram por volta de 1887, os dois lados da família, né, vieram a parte da mamãe veio de Treviso e os meus avós paternos vieram de Rovigo e Solighetto, Soligo, né, área de Soligo.\nP/1 – E qual que era a atividade dos seus pais aqui em Santo André?\nR –"}, "folder_size_gb": 0.0}, "folder_size_gb": 82.575}, "EMS_HV031": {"Audiovisual": {"Acesso": {"EMS_HV031.MOV": {"size_mb": 51196.5791, "modified": "2014-02-18 20:22:41", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV031\\Audiovisual\\Acesso\\EMS_HV031.MOV", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3099066.0, "duration": 3099.07, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 49.997}, "Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0625, "modified": "2014-01-29 12:58:30", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV031\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2014-01-29 12:58:30", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV031\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"index.bdm": {"size_mb": 0.0006, "modified": "2014-01-29 13:13:26", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV031\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\index.bdm", "category": "Other"}, "MOVIEOBJ.BDM": {"size_mb": 0.0001, "modified": "2014-01-29 12:21:30", "ext nscrito por Iara Gobbo.\n\tMW Transcrições\nP/1 – Senhor João, bom dia. \nR – Bom dia.\nP/1 – Primeiro gostaria de agradecer de o senhor ter aceitado o convite, ter vindo aqui pra cá pra essa entrevista, e pra gente começar eu queria que o senhor falasse pra gente o seu nome completo, o lugar e a data em que o senhor nasceu. \nR – O meu nome é João Tamanaha, eu sou natural de Garça, estado de São Paulo, nasci no dia quatro de Junho de 43.\nP/1 – Fala pra gente, seu João, o nome dos seus pais.\nR – Meu pai chama Josei Tamanaha, a minha mãe Toma Tamanaha.\nP/1 – Fala pra gente então um pouquinho do que o senhor sabe da origem da família, como é que foi o processo de imigração.\nR – Você diz o que? Da minha família ou da família Sanchez?\nP/1 – Da sua família. Como é que o senhor, a sua família chegou em Garça, em São Paulo?\nR – É que na realidade os imigrantes foram o meu avô e o meu pai, que a minha mãe já é nascida no Brasil. Pelo que me consta, não o meu avô, né, mais o meu pai, eles foram trabalhar na agricultura como"}, "folder_size_gb": 0.0}, "folder_size_gb": 61.475}, "EMS_HV032": {"Audiovisual": {"Acesso": {"EMS_HV032.mov": {"size_mb": 59292.243, "modified": "2014-02-14 01:28:13", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV032\\Audiovisual\\Acesso\\EMS_HV032.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3575475.0, "duration": 3575.47, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 57.903}, "Preservação": {"private": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0312, "modified": "2014-01-29 09:37:46", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV032\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2014-01-29 09:37:46", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV032\\Audiovisual\\Prese , "resolution": "3456x5184"}, "folder_size_gb": 0.003}, "folder_size_gb": 0.026}, "Textual": {"EMS_HV032.docx": {"size_mb": 0.0793, "modified": "2014-02-14 08:14:15", "extension": "DOCX", "full_path": "D:\\EMS\\EMS_HV032\\Textual\\EMS_HV032.docx", "category": "Textual", "content_preview": "EMS – 50 anos de Memórias\nDepoimento de Maria Aparecida Figueira\nEntrevistada por Fernanda P. Prado\nHortolândia, 29 de janeiro de 2014 \nRealização Museu da Pessoa \nEMS_HV032_Maria Aparecida Figueira\nTranscrito por Karina Medici Barrella\nMW Transcrições\nP/1 – Dona Maria Aparecida, bom dia.\nR – Bom dia.\nP/1 – Primeiro eu gostaria de agradecer de a senhora ter aceitado o convite pra vir a essa entrevista. E pra gente começar eu gostaria que a senhora falasse pra gente o seu nome completo, a cidade e a data do seu nascimento.\nR – Maria Aparecida Figueira. Eu nasci na cidade de Matão, no dia oito do nove de 48, portanto eu tenho 65 anos.\nP/1 – E conta pra gente o nome dos seus pais.\nR – Manoel Sanchez, Helena Borgonovi Sanchez.\nP/1 – Fala pra gente um pouquinho, dona Maria Aparecida, o que a senhora sabe da origem da família.\nR – Bom, o seu Emiliano Sanchez era meu irmão, então a origem da família vem aí, ele era meu irmão.\nP/1 – Mas dos seus pais. Como é que seus pais foram parar lá em Matão? Da onde que eles eram?\nR – Na realidade meu pai nasceu em Dobrada e a minha mãe, acho que Fernando Prestes, é tudo na região de Matão. Eles se conheceram ali, se casaram e os filhos nasceram ali,"}, "folder_size_gb": 0.0}, "folder_size_gb": 64.818}, "EMS_HV033": {"Audiovisual": {"Acesso": {"EMS_HV033.MOV": {"size_mb": 51058.8425, "modified": "2014-02-18 20:41:09", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV033\\Audiovisual\\Acesso\\EMS_HV033.MOV", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 3098498.0, "duration": 309  gostaria de agradecer de você ter aceitado o convite pra essa entrevista. E pra gente começar, eu queria que você falasse pra gente o seu nome completo, o local e a data do seu nascimento.\nR – Tá. Meu nome é Marta Vieira Paiva, eu moro aqui mesmo em Hortolândia, Rua Presidente Prudente, 139, Parque Odimar.\nP/1 – Tá. Qual foi a cidade que você nasceu?\nR – Tarumã, São Paulo.\nP/1 – E a data do seu nascimento?\nR – Eu nasci dia nove de fevereiro de 1964.\nP/1 – Tá certo. E fala pra gente o nome dos seus pais, Marta.\nR – Já são falecidos, Antônio Vieira Paiva e Gildete Francisca de Jesus.\nP/1 – E você sabe qual é a origem da família? Se seus pais já eram de Tarumã, se eles imigraram?\nR – É, eles imigraram. O meu pai e a minha mãe vieram da Vitória da Conquista... Minha mãe de Ilhéus e minha mãe da Vitória da Conquista. Aí vieram pra São Paulo acho que 60 anos atrás.\nP/1 – E eles já se co"}, "folder_size_gb": 0.0}, "folder_size_gb": 61.331}, "EMS_HV034": {"Audiovisual": {"Acesso": {"EMS_HV034.mov": {"size_mb": 116470.9362, "modified": "2014-02-14 02:25:26", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV034\\Audiovisual\\Acesso\\EMS_HV034.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 6837404.0, "duration": 6837.4, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 113.741}, "Preservação": {"private": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0469, "modified": "2014-01-29 16:29:26", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV034\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2014-01-29 16:29:26", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV034\\Audiovisual\\Preservação\\private\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"index.bdm": {"size_mb": 0.000 ": 0.6814, "modified": "2014-02-18 21:07:44", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV034\\Fotos\\Baixa\\EMS_HV034_FT005.jpg", "category": "Image", "duration_ms": 0, "dimension": "5184x3456", "height": 3456, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "5184x3456"}, "EMS_HV034_FT006.jpg": {"size_mb": 0.5585, "modified": "2014-02-18 20:54:14", "extension": "JPG", "full_path": "D:\\EMS\\EMS_HV034\\Fotos\\Baixa\\EMS_HV034_FT006.jpg", "category": "Image", "duration_ms": 0, "dimension": "3456x5184", "height": 5184, "dpi": 300.0, "color_mode": "RGB", "duration": 0.0, "resolution": "3456x5184"}, "folder_size_gb": 0.003}, "folder_size_gb": 0.01}, "Textual": {"EMS_HV034.docx": {"size_mb": 0.0977, "modified": "2014-02-14 08:14:15", "extension": "DOCX", "full_path": "D:\\EMS\\EMS_HV034\\Textual\\EMS_HV034.docx", "category": "Textual", "content_preview": "EMS – 50 anos de Memória\nDepoimento de Valdir Barbosa\nEntrevistado por Fernanda P. Prado\nHortolândia, 29 de janeiro de 2014 \nRealização Museu da Pessoa \nEMS_HV034_Valdir Barbosa\nTranscrito por Karina Medici Barrella\nMW Transcrições\nP/1 – Valdir, boa tarde.\nR – Olá! Boa tarde.\nP/1 – Primeiro eu gostaria de agradecer de você ter aceitado o convite para essa entrevista. E pra gente começar eu gostaria que você falasse pra gente o seu nome completo, o local e a data do seu nascimento.\nR – O meu nome é Valdir Barbosa, nasci em Cornélio Procópio, no Paraná, no dia 16 de fevereiro de 1964.\nP/1 – Fala pra gente o nome dos seus pais.\nR – Meu pai chama Nelson Barbosa e a minha mãe Jandira Talman Barbosa.\nP/1 – Qual é a atividade deles?\nR – Hoje? Os dois são aposentados.\nP/1 – E antes, qual era? O que eles faziam?\nR – No início era atividade agrícola. Todos nasceram no sítio, inclusive eu, e foram com atividade agrícola até o momento em que mudamos pra cá, eu tinha cinco pra seis anos quando nós viemos pra Campinas. E a partir daí o meu pai entrou na atividade industrial e ficou até a sua aposentadoria, uns oito, dez anos atrás. E a minha mãe não trabalhava, ela cuidava da casa e das crianças"}, "folder_size_gb": 0.0}, "folder_size_gb": 127.04}, "EMS_HV035": {"Audiovisual": {"Acesso": {"EMS_HV035.mov": {"size_mb": 104733.5306, "modified": "2014-02-14 03:32:54", "extension": "MOV", "full_path": "D:\\EMS\\EMS_HV035\\Audiovisual\\Acesso\\EMS_HV035.mov", "category": "Video", "dimension": "1920x1080", "height": 1080, "aspect_ratio": "16:9 (HD)", "frame_rate": "29.970 fps", "codec": "ProRes", "audio_channels": "Stereo", "audio_codec": "PCM", "duration_ms": 6272506.0, "duration": 6272.51, "resolution": "1920x1080", "fps": 29.97}, "folder_size_gb": 102.279}, "Preservação": {"PRIVATE": {"AVCHD": {"AVCHDTN": {"THUMB.TDT": {"size_mb": 0.0469, "modified": "2014-01-30 11:24:54", "extension": "TDT", "full_path": "D:\\EMS\\EMS_HV035\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TDT", "category": "Other"}, "THUMB.TID": {"size_mb": 0.0001, "modified": "2014-01-30 11:24:54", "extension": "TID", "full_path": "D:\\EMS\\EMS_HV035\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\AVCHDTN\\THUMB.TID", "category": "Other"}, "folder_size_gb": 0.0}, "BDMV": {"index.bdm": {"size_mb": 0.0006, "modified": "2014-01-30 11:33:34", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV035\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\index.bdm", "category": "Other"}, "MOVIEOBJ.BDM": {"size_mb": 0.0001, "modified": "2014-01-30 09:47:58", "extension": "BDM", "full_path": "D:\\EMS\\EMS_HV035\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\MOVIEOBJ.BDM", "category": "Other"}, "CLIPINF": {"00000.CPI": {"size_mb": 0.0007, "modified": "2014-01-30 10:26:48", "extension": "CPI", "full_path": "D:\\EMS\\EMS_HV035\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\CLIPINF\\00000.CPI", "category": "Other"}, "00001.CPI": {"size_mb": 0.0208, "modified": "2014-01-30 10:26:48", "extension": "CPI", "full_path": "D:\\EMS\\EMS_HV035\\Audiovisual\\Preservação\\PRIVATE\\AVCHD\\BDMV\\CLIPINF\\00001.CPI", const EXTENSIONS = {
    "Video": ['mp4', 'mov', 'mkv', 'avi', 'm4v', 'mts', 'm2ts', 'wmv', 'flv', 'webm', 'vob', 'ogv', '3gp', 'mxf'],
    "Audio": ['mp3', 'wav', 'flac', 'aac', 'ogg', 'm4a', 'wma', 'aiff', 'pcm', 'aif'],
    "Image": ['jpg', 'jpeg', 'tif', 'tiff', 'png', 'gif', 'bmp', 'webp', 'cr2', 'nef', 'arw', 'dng'],
    "Textual": ['doc', 'docx', 'pdf', 'txt', 'rtf', 'odt', 'xls', 'xlsx', 'ppt', 'pptx']
};

const ICONS = { "Video": "🎞️", "Audio": "🎧", "Image": "🖼️", "Textual": "📝", "Other": "📄" };

function formatSmartSize(mbValue) {
    if (!mbValue || mbValue === 0) return "0 B";
    let bytes = mbValue * 1024 * 1024; 
    const units = ['B', 'KB', 'MB', 'GB', 'TB'];
    let i = 0;
    while (bytes >= 1024 && i < units.length - 1) { bytes /= 1024; i++; }
    return bytes.toFixed(2) + " " + units[i];
}

function getIcon(name, isFolder) {
    if (isFolder) return "📁";
    const ext = name.split('.').pop().toLowerCase();
    for (const [category, list] of Object.entries(EXTENSIONS)) {
        if (list.includes(ext)) return ICONS[category];
    }
    return ICONS["Other"];
}

function formatTime(ms) {
    if (!ms || ms === 0) return "N/A";
    let totalSeconds = Math.floor(ms / 1000);
    let hours = Math.floor(totalSeconds / 3600);
    let minutes = Math.floor((totalSeconds % 3600) / 60);
    let seconds = totalSeconds % 60;
    return [hours, minutes, seconds].map(v => v < 10 ? "0" + v : v).join(":");
}

function tryLoadImage(imgElement, thumbnailPath, originalName) {
    if (!thumbnailPath && !originalName) return;
    let path = thumbnailPath || `thumbnails/thumb_${originalName.split('.').slice(0, -1).join('.')}.jpg`;
    imgElement.onerror = function() {
        this.onerror = null;
        this.src = 'https://via.placeholder.com/150?text=Sem+Preview';
    };
    imgElement.src = path;
}

function copyPreviewText() {
    const box = document.getElementById('preview-text');
    if (box) {
        navigator.clipboard.writeText(box.textContent);
        const btn = document.querySelector('.copy-btn');
        btn.textContent = "Copied!";
        setTimeout(() => { btn.textContent = "Copy Content"; }, 2000);
    }
}

function calculateFolderStats(node) {
    let stats = { Video: { count: 0, size: 0 }, Audio: { count: 0, size: 0 }, Image: { count: 0, size: 0 }, Textual: { count: 0, size: 0 }, Other: { count: 0, size: 0 }, totalSize: 0 };
    function traverse(curr) {
        for (let key in curr) {
            if (key === "folder_size_gb") continue;
            let item = curr[key];
            if (item.folder_size_gb !== undefined) traverse(item);
            else {
                let cat = item.category || "Other";
                if (!stats[cat]) cat = "Other";
                stats[cat].count++;
                stats[cat].size += item.size_mb || 0;
                stats.totalSize += item.size_mb || 0;
            }
        }
    }
    traverse(node);
    return stats;
}

function showMetadata(name, data, path) {
    const panel = document.getElementById("metadata-panel");
    const content = document.getElementById("meta-content");
    panel.style.display = "block";

    const isFolder = data.folder_size_gb !== undefined;
    let html = `
        <span class="meta-label">Nome</span><span class="meta-value">${name}</span>
        <span class="meta-label">Caminho</span><span class="meta-value">${data.full_path || path.join("/")}</span>
        <button class="copy-btn" onclick="navigator.clipboard.writeText('${(data.full_path || "").replace(/\\/g, "\\\\")}')">Copy Path</button>
        <span class="meta-label">Tamanho</span><span class="meta-value" style="color:var(--accent); font-weight:bold;">${formatSmartSize(isFolder ? data.folder_size_gb * 1024 : data.size_mb)}</span>
    `;

    if (isFolder) {
        const stats = calculateFolderStats(data);
        const getPct = (size) => stats.totalSize > 0 ? ((size / stats.totalSize) * 100).toFixed(1) : 0;
        html += `
            <div class="stats-container">
                <span class="meta-label">Conteúdo</span>
                <div class="stats-bar">
                    <div class="bar-segment" style="width:${getPct(stats.Video.size)}%; background:var(--video)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Audio.size)}%; background:var(--audio)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Image.size)}%; background:var(--image)"></div>
                    <div class="bar-segment" style="width:${getPct(stats.Textual.size + stats.Other.size)}%; background:var(--other)"></div>
                </div>
                <div class="stat-row"><span>🎞️ Video</span><b>${stats.Video.count}</b></div>
                <div class="stat-row"><span>🎧 Audio</span><b>${stats.Audio.count}</b></div>
                <div class="stat-row"><span>🖼️ Images</span><b>${stats.Image.count}</b></div>
                <div class="stat-row"><span>📄 Docs / Other</span><b>${stats.Textual.count + stats.Other.count}</b></div>
            </div>`;
    } else {
        if (data.category === "Image" || data.thumbnail) {
            html += `<h3>Preview</h3>
                     <div class="img-preview-container">
                        <img id="preview-img" src="" alt="Carregando...">
                     </div>`;
            setTimeout(() => {
                const img = document.getElementById('preview-img');
                tryLoadImage(img, data.thumbnail, name);
            }, 50);
        }

        html += `<span class="meta-label">Modificado</span><span class="meta-value">${data.modified || "N/A"}</span>`;
        
        if (data.category === "Video") {
            // Garante que displayRes exista ou usa a dimensão original
            const displayRes = data.dimension || "N/A"; 
            
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Resolução</span><span class="meta-value">${displayRes}</span>
                <span class="meta-label">Duração / Áudio</span><span class="meta-value">${formatTime(data.duration_ms)} / ${data.audio_channels || "N/A"}</span>
                <span class="meta-label">Aspecto / FPS</span><span class="meta-value">${data.aspect_ratio || "N/A"} / ${data.frame_rate || "N/A"}</span>`;
        } else if (data.category === "Audio") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Duração</span><span class="meta-value">${formatTime(data.duration_ms)}</span>
                <span class="meta-label">Canais</span><span class="meta-value">${data.audio_channels || "N/A"}</span>`;
        } else if (data.category === "Image") {
            html += `<h3>Especificações Técnicas</h3>
                <span class="meta-label">Dimensões</span><span class="meta-value">${data.dimension || "N/A"}</span>
                <span class="meta-label">DPI</span><span class="meta-value">${data.dpi || "N/A"}</span>`;
        }

        // NOVIDADE: Verifica explicitamente por content_preview ou categoria textual
        if (data.content_preview) {
            html += `<h3>Conteúdo do Documento</h3>
                     <div class="preview-box" id="preview-text">Loading content...</div>
                     <button class="copy-btn" onclick="copyPreviewText()">Copiar Conteúdo</button>`;
        }
    }
    
    content.innerHTML = html;

    // Sincronização garantida: espera o DOM atualizar para injetar o texto
    if (data.content_preview) {
        setTimeout(() => {
            const box = document.getElementById('preview-text');
            if (box) box.textContent = data.content_preview;
        }, 10);
    }
}

function renderColumn(node, level, path = []) {
    const explorer = document.getElementById("explorer");
    while (explorer.children.length > level) explorer.removeChild(explorer.lastChild);
    const col = document.createElement("div"); col.className = "column";
    const keys = Object.keys(node).filter(k => k !== "folder_size_gb").sort((a, b) => {
        const aIsF = node[a].folder_size_gb !== undefined;
        const bIsF = node[b].folder_size_gb !== undefined;
        return (aIsF !== bIsF) ? bIsF - aIsF : a.localeCompare(b);
    });
    keys.forEach(name => {
        const val = node[name];
        const isFolder = val.folder_size_gb !== undefined;
        const item = document.createElement("div");
        item.className = "item";
        item.innerHTML = `<span class="icon">${getIcon(name, isFolder)}</span> <span class="item-text">${name}</span>`;
        item.onclick = () => {
            Array.from(col.children).forEach(c => c.classList.remove('active'));
            item.classList.add('active');
            showMetadata(name, val, path.concat(name));
            if (isFolder) renderColumn(val, level + 1, path.concat(name));
            else while (explorer.children.length > level + 1) explorer.removeChild(explorer.lastChild);
        };
        col.appendChild(item);
    });
    explorer.appendChild(col);
}

function performSearch() {
    const term = document.getElementById("search").value.toLowerCase();
    const explorer = document.getElementById("explorer");
    if (!term) { renderColumn(TREE, 0); return; }
    const results = [];
    function searchNode(node, currentPath) {
        for (const key in node) {
            if (key === "folder_size_gb") continue;
            const item = node[key];
            const isFolder = item.folder_size_gb !== undefined;
            const match = key.toLowerCase().includes(term) || (item.content_preview && item.content_preview.toLowerCase().includes(term));
            if (match) results.push({ name: key, data: item, path: currentPath.concat(key), isFolder });
            if (isFolder) searchNode(item, currentPath.concat(key));
        }
    }
    searchNode(TREE, ["Root"]);
    explorer.innerHTML = "";
    const col = document.createElement("div"); col.className = "column"; col.style.minWidth = "100%";
    results.slice(0, 100).forEach(res => {
        const div = document.createElement("div"); div.className = "item";
        div.innerHTML = `<span class="icon">${getIcon(res.name, res.isFolder)}</span> <div><b>${res.name}</b><br><small>${res.path.join("/")}</small></div>`;
        div.onclick = () => showMetadata(res.name, res.data, res.path);
        col.appendChild(div);
    });
    explorer.appendChild(col);
}

document.addEventListener("DOMContentLoaded", () => renderColumn(TREE, 0));
</script>
</body>
